      order: 10
      title: STS Username
      type: string
      visible_when:
        equals: basic
        field: stsAuthType
    stsEndpointUrl:
      description: HTTPS endpoint that issues temporary AWS credentials.
      example: https://sts.example.com/assume
      format: uri
      optional: true
      order: 6
      pattern: ^https://
      title: STS Endpoint URL
      type: string
      visible_when:
        equals: custom
        field: stsMode
    stsMode:
      default_value: builtin
      description: How temporary AWS credentials are issued.
      enum:
      - builtin
      - custom
      optional: true
      order: 3
