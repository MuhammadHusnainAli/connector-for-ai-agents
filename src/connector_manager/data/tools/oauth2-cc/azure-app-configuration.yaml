# Azure App Configuration tools.
#
# The connection's base url is the store's own endpoint
# (https://<store>.azconfig.io) and authenticates as a service principal
# (client credentials against Microsoft Entra ID, scope
# https://azconfig.io/.default), so paths start at /kv, /keys, /labels,
# /locks, /revisions and /snapshots.
#
# The model is small but has three sharp edges:
#
#   * A setting is identified by key *and* label together. The same key with
#     labels "dev" and "prod" is two independent settings. Omitting label does
#     not mean "any label" -- it means the setting with no label. Pass label
#     "*" on the list tools to see every variant.
#   * Writes want a vendor content type. PUT /kv expects
#     application/vnd.microsoft.appconfig.kv+json, not plain application/json;
#     the tools below set it for you.
#   * A locked setting cannot be written or deleted -- the store answers 409.
#     unlock_key_value first, or the write will simply keep failing.
#
# Feature flags are not a separate resource: a flag is an ordinary key-value
# whose key starts ".appconfig.featureflag/" and whose value is a JSON document
# with the vendor content type. list_feature_flags and set_feature_flag are
# thin conveniences over exactly that, so a flag can also be read and written
# with the plain key-value tools.
#
# Keys may contain slashes ("MyApp/Colours/Primary"). They are percent-encoded
# into the path, which the store decodes, so a hierarchical key works as
# written.
#
# Docs: https://learn.microsoft.com/azure/azure-app-configuration/rest-api

connector_id: azure-app-configuration
display_name: Azure App Configuration
docs_url: https://learn.microsoft.com/azure/azure-app-configuration/rest-api

tools:

  list_key_values:
    title: List configuration settings
    description: >-
      Page through the store's key-values. Filter with key and label, both of
      which accept a trailing wildcard ("MyApp/*") and a comma-separated list;
      pass label "*" for every label and "\0" for settings with no label. Use
      select to fetch only the fields you need, and accept_datetime to read the
      store as it was at a past moment.
    category: settings
    read_only: true
    request:
      method: GET
      path: /kv
      query:
        api-version: "${api_version}"
        key: "${key}"
        label: "${label}"
        $select: "${select}"
        After: "${after}"
        tags: "${tags}"
      headers:
        Accept-Datetime: "${accept_datetime}"
    input:
      key:
        type: string
        description: 'Key filter -- exact, comma-separated, or a trailing wildcard such as "MyApp/*".'
        optional: true
        example: MyApp/*
      label:
        type: string
        description: 'Label filter. "*" matches every label; omit for settings with no label.'
        optional: true
        example: production
      select:
        type: string
        description: 'Comma-separated fields to return, e.g. "key,value,label,last_modified".'
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      tags:
        type: array
        description: 'Tag filters, each "name=value". A setting must match all of them.'
        optional: true
        items: {type: string}
      accept_datetime:
        type: string
        description: RFC 1123 timestamp to read the store as it was at that moment.
        optional: true
        example: Fri, 01 May 2026 12:00:00 GMT
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of key-values, with the link to the next page.
      type: object
      properties:
        items: {type: array, description: "Each with key, label, value, content_type, tags, etag, locked and last_modified."}
        "@nextLink": {type: string, description: "Pass its After token back as after; absent on the last page."}

  get_key_value:
    title: Get one configuration setting
    description: >-
      Read a single setting by key and label. Omitting label reads the variant
      with no label, which is a different setting from the same key under
      "prod". Returns 404 when that key/label pair does not exist.
    category: settings
    read_only: true
    request:
      method: GET
      path: /kv/${key}
      query:
        api-version: "${api_version}"
        label: "${label}"
        $select: "${select}"
      headers:
        Accept-Datetime: "${accept_datetime}"
        If-None-Match: "${if_none_match}"
    input:
      key:
        type: string
        description: The setting's key. Slashes are allowed and are part of the key.
        example: MyApp/Colours/Primary
      label:
        type: string
        description: The setting's label. Omit for the variant with no label.
        optional: true
        example: production
      select:
        type: string
        description: Comma-separated fields to return instead of the whole setting.
        optional: true
      accept_datetime:
        type: string
        description: RFC 1123 timestamp to read the setting as it was at that moment.
        optional: true
      if_none_match:
        type: string
        description: Return 304 when the setting's etag still matches this value.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The setting.
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: string}
        content_type: {type: string}
        tags: {type: object}
        etag: {type: string}
        locked: {type: boolean}
        last_modified: {type: string}

  set_key_value:
    title: Create or update a configuration setting
    description: >-
      Write a setting at a key and label, creating it or replacing it. Pass
      if_match with a known etag for optimistic concurrency (the write fails
      with 412 if someone changed it first), or if_none_match "*" to create
      only when absent. A locked setting rejects the write with 409 -- unlock
      it first. content_type is free text and is how consumers know to parse
      the value as JSON, a Key Vault reference, or a feature flag.
    category: settings
    request:
      method: PUT
      path: /kv/${key}
      query:
        api-version: "${api_version}"
        label: "${label}"
      headers:
        content-type: application/vnd.microsoft.appconfig.kv+json
        If-Match: "${if_match}"
        If-None-Match: "${if_none_match}"
      body:
        value: "${value}"
        content_type: "${content_type}"
        tags: "${tags}"
    input:
      key:
        type: string
        description: The setting's key.
        example: MyApp/Colours/Primary
      value:
        type: string
        description: The setting's value, always a string. Serialise structured data yourself.
        example: "#0f62fe"
      label:
        type: string
        description: Label to write under. Omit to write the variant with no label.
        optional: true
        example: production
      content_type:
        type: string
        description: >-
          Media type describing the value, e.g. application/json or
          application/vnd.microsoft.appconfig.keyvaultref+json for a Key Vault
          reference.
        optional: true
      tags:
        type: object
        description: Tags on the setting, as key/value pairs.
        optional: true
      if_match:
        type: string
        description: Only write when the stored etag matches this, for optimistic concurrency.
        optional: true
      if_none_match:
        type: string
        description: Pass "*" to create only if the setting does not already exist.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The setting as stored, with its new etag.
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: string}
        etag: {type: string}
        last_modified: {type: string}

  delete_key_value:
    title: Delete a configuration setting
    description: >-
      Remove a setting by key and label. The value is gone from the current
      store but remains in its revision history, which list_revisions can read
      for up to the store's retention period. A locked setting rejects the
      delete with 409.
    category: settings
    destructive: true
    request:
      method: DELETE
      path: /kv/${key}
      query:
        api-version: "${api_version}"
        label: "${label}"
      headers:
        If-Match: "${if_match}"
    input:
      key:
        type: string
        description: The setting's key.
        example: MyApp/Colours/Primary
      label:
        type: string
        description: Label of the variant to delete. Omit for the one with no label.
        optional: true
        example: production
      if_match:
        type: string
        description: Only delete when the stored etag matches this value.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The setting as it was deleted, or empty when it did not exist.
      type: object

  list_keys:
    title: List the distinct keys in the store
    description: >-
      List the key names present in the store, without their values or labels.
      Much cheaper than list_key_values for discovering the shape of a
      configuration namespace before fetching anything.
    category: settings
    read_only: true
    request:
      method: GET
      path: /keys
      query:
        api-version: "${api_version}"
        name: "${name}"
        After: "${after}"
      headers:
        Accept-Datetime: "${accept_datetime}"
    input:
      name:
        type: string
        description: 'Key name filter -- exact, comma-separated, or a trailing wildcard such as "MyApp/*".'
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      accept_datetime:
        type: string
        description: RFC 1123 timestamp to list keys as they were at that moment.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of key names.
      type: object
      properties:
        items: {type: array, description: "Each with name."}
        "@nextLink": {type: string}

  list_labels:
    title: List the labels in the store
    description: >-
      List the labels in use in the store. Labels are how one key holds a
      different value per environment, so this is the quickest way to see which
      environments a store actually has.
    category: settings
    read_only: true
    request:
      method: GET
      path: /labels
      query:
        api-version: "${api_version}"
        name: "${name}"
        $select: "${select}"
        After: "${after}"
      headers:
        Accept-Datetime: "${accept_datetime}"
    input:
      name:
        type: string
        description: Label name filter -- exact, comma-separated, or a trailing wildcard.
        optional: true
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      accept_datetime:
        type: string
        description: RFC 1123 timestamp to list labels as they were at that moment.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of labels.
      type: object
      properties:
        items: {type: array, description: "Each with name."}
        "@nextLink": {type: string}

  lock_key_value:
    title: Lock a configuration setting
    description: >-
      Mark a setting read-only, so writes and deletes against it fail with 409.
      Use it to freeze production values against accidental change; the setting
      is still readable and still served to applications.
    category: settings
    request:
      method: PUT
      path: /locks/${key}
      query:
        api-version: "${api_version}"
        label: "${label}"
      headers:
        If-Match: "${if_match}"
    input:
      key:
        type: string
        description: The setting's key.
        example: MyApp/Colours/Primary
      label:
        type: string
        description: Label of the variant to lock. Omit for the one with no label.
        optional: true
        example: production
      if_match:
        type: string
        description: Only lock when the stored etag matches this value.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The setting, now with locked true.
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        locked: {type: boolean}

  unlock_key_value:
    title: Unlock a configuration setting
    description: >-
      Clear a setting's read-only flag so it can be written or deleted again.
      The obvious first call when set_key_value or delete_key_value keeps
      answering 409.
    category: settings
    destructive: true
    request:
      method: DELETE
      path: /locks/${key}
      query:
        api-version: "${api_version}"
        label: "${label}"
      headers:
        If-Match: "${if_match}"
    input:
      key:
        type: string
        description: The setting's key.
        example: MyApp/Colours/Primary
      label:
        type: string
        description: Label of the variant to unlock. Omit for the one with no label.
        optional: true
        example: production
      if_match:
        type: string
        description: Only unlock when the stored etag matches this value.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The setting, now with locked false.
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        locked: {type: boolean}

  list_revisions:
    title: List a setting's revision history
    description: >-
      Page through the change history the store keeps, newest first, filtered
      by key and label the same way as list_key_values. Each revision is a full
      snapshot of the setting at that moment, so this is how a deleted or
      overwritten value is recovered -- read the old value here and write it
      back with set_key_value.
    category: history
    read_only: true
    request:
      method: GET
      path: /revisions
      query:
        api-version: "${api_version}"
        key: "${key}"
        label: "${label}"
        $select: "${select}"
        After: "${after}"
      headers:
        Accept-Datetime: "${accept_datetime}"
    input:
      key:
        type: string
        description: Key filter -- exact, comma-separated, or a trailing wildcard.
        optional: true
        example: MyApp/Colours/Primary
      label:
        type: string
        description: 'Label filter. "*" matches every label.'
        optional: true
      select:
        type: string
        description: Comma-separated fields to return for each revision.
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      accept_datetime:
        type: string
        description: RFC 1123 timestamp to list revisions as at that moment.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of revisions, newest first.
      type: object
      properties:
        items: {type: array, description: "Each a full setting as it was, with last_modified and etag."}
        "@nextLink": {type: string}

  list_snapshots:
    title: List configuration snapshots
    description: >-
      List the snapshots in the store with their status, filters and expiry. A
      snapshot is an immutable, named point-in-time set of settings, which is
      how a known-good configuration is pinned for a release.
    category: snapshots
    read_only: true
    request:
      method: GET
      path: /snapshots
      query:
        api-version: "${api_version}"
        name: "${name}"
        status: "${status}"
        $select: "${select}"
        After: "${after}"
    input:
      name:
        type: string
        description: Snapshot name filter -- exact, comma-separated, or a trailing wildcard.
        optional: true
      status:
        type: string
        description: 'Comma-separated statuses to include: provisioning, ready, archived, failed.'
        optional: true
      select:
        type: string
        description: Comma-separated fields to return for each snapshot.
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of snapshots.
      type: object
      properties:
        items: {type: array, description: "Each with name, status, filters, retention_period, items_count and created."}
        "@nextLink": {type: string}

  get_snapshot:
    title: Get a configuration snapshot
    description: >-
      Read one snapshot's metadata -- its filters, status, item count, size and
      expiry. To read the settings it captured, call list_key_values with the
      snapshot name.
    category: snapshots
    read_only: true
    request:
      method: GET
      path: /snapshots/${snapshot_name}
      query:
        api-version: "${api_version}"
        $select: "${select}"
    input:
      snapshot_name:
        type: string
        description: Name of the snapshot.
        example: release-2026-06
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The snapshot's metadata.
      type: object
      properties:
        name: {type: string}
        status: {type: string}
        filters: {type: array}
        items_count: {type: integer}
        expires: {type: string}
        etag: {type: string}

  create_snapshot:
    title: Create a configuration snapshot
    description: >-
      Freeze the settings matching a set of key/label filters into an immutable
      named snapshot. Snapshots cannot be edited afterwards -- only archived --
      so this is the reliable way to pin exactly what a release was configured
      with. Asynchronous: status starts at provisioning and reaches ready.
    category: snapshots
    request:
      method: PUT
      path: /snapshots/${snapshot_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/vnd.microsoft.appconfig.snapshot+json
      body:
        filters: "${filters}"
        composition_type: "${composition_type}"
        retention_period: "${retention_period}"
        tags: "${tags}"
    input:
      snapshot_name:
        type: string
        description: Name for the snapshot. Immutable once created.
        example: release-2026-06
      filters:
        type: array
        description: >-
          Which settings to capture -- up to three objects, each with key and an
          optional label, both accepting a trailing wildcard.
        items: {type: object}
        example: [{key: MyApp/*, label: production}]
      composition_type:
        type: string
        description: >-
          key groups settings by key alone (one per key); key_label keeps each
          key/label pair as its own entry.
        optional: true
        enum: [key, key_label]
      retention_period:
        type: integer
        description: How long, in seconds, an archived snapshot is kept before deletion.
        optional: true
        minimum: 3600
      tags:
        type: object
        description: Tags on the snapshot, as key/value pairs.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The snapshot as created, initially with status provisioning.
      type: object
      properties:
        name: {type: string}
        status: {type: string}
        filters: {type: array}
        etag: {type: string}

  update_snapshot_status:
    title: Archive or recover a snapshot
    description: >-
      Move a snapshot between ready and archived. Archiving starts its
      retention clock, after which it is deleted for good; recovering it back
      to ready stops that clock. This is the only mutable thing about a
      snapshot.
    category: snapshots
    request:
      method: PATCH
      path: /snapshots/${snapshot_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/merge-patch+json
        If-Match: "${if_match}"
      body:
        status: "${status}"
    input:
      snapshot_name:
        type: string
        description: Name of the snapshot.
        example: release-2026-06
      status:
        type: string
        description: archived starts the retention clock; ready stops it.
        enum: [ready, archived]
        example: archived
      if_match:
        type: string
        description: Only change status when the stored etag matches this value.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The snapshot after the status change.
      type: object
      properties:
        name: {type: string}
        status: {type: string}
        expires: {type: string}

  list_feature_flags:
    title: List feature flags
    description: >-
      List the store's feature flags. Flags are key-values under the
      ".appconfig.featureflag/" prefix, so this is list_key_values with that
      prefix applied -- each item's value is a JSON document with the flag's id,
      enabled state and any conditional filters.
    category: feature-flags
    read_only: true
    request:
      method: GET
      path: /kv
      query:
        api-version: "${api_version}"
        key: .appconfig.featureflag/${name}
        label: "${label}"
        After: "${after}"
    input:
      name:
        type: string
        description: 'Flag name filter. Use "*" for every flag, or "Beta*" for a prefix.'
        optional: true
        default: "*"
      label:
        type: string
        description: 'Label filter. "*" matches every label; omit for flags with no label.'
        optional: true
      after:
        type: string
        description: Continuation token from a previous page's @nextLink.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: A page of feature flags, each value a JSON flag document.
      type: object
      properties:
        items: {type: array, description: "Each with key, label, value (the JSON flag), content_type and etag."}
        "@nextLink": {type: string}

  set_feature_flag:
    title: Create or update a feature flag
    description: >-
      Write a feature flag. value is the flag document as a JSON *string* --
      {"id":"Beta","description":"","enabled":true,"conditions":{"client_filters":[]}}
      -- because App Configuration stores every value as text. The
      ".appconfig.featureflag/" prefix and the feature flag content type are
      applied for you.
    category: feature-flags
    request:
      method: PUT
      path: /kv/.appconfig.featureflag%2F${name}
      query:
        api-version: "${api_version}"
        label: "${label}"
      headers:
        content-type: application/vnd.microsoft.appconfig.kv+json
        If-Match: "${if_match}"
      body:
        value: "${value}"
        content_type: application/vnd.microsoft.appconfig.ff+json;charset=utf-8
        tags: "${tags}"
    input:
      name:
        type: string
        description: The flag's name, which is also the id inside the value document.
        example: BetaCheckout
      value:
        type: string
        description: >-
          The flag document, as a JSON string with id, description, enabled and
          conditions.
        example: '{"id":"BetaCheckout","description":"","enabled":true,"conditions":{"client_filters":[]}}'
      label:
        type: string
        description: Label to write the flag under, so one flag can differ per environment.
        optional: true
        example: production
      tags:
        type: object
        description: Tags on the flag, as key/value pairs.
        optional: true
      if_match:
        type: string
        description: Only write when the stored etag matches this, for optimistic concurrency.
        optional: true
      api_version:
        type: string
        description: App Configuration API version to call.
        optional: true
        default: "2026-04-01"
    output:
      description: The flag as stored, with its new etag.
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        value: {type: string}
        etag: {type: string}
