  get_rank_tracker_overview:
    title: Get tracked keyword rankings
    description: >-
      List a Rank Tracker project's tracked keywords with their positions, volume, traffic
      and ranking URL on desktop or mobile, optionally compared with an earlier date. Free:
      consumes no API units.
    category: rank_tracker
    read_only: true
    request:
      method: GET
      path: /v3/rank-tracker/overview
      query:
        limit: ${limit}
        order_by: ${order_by}
        where: ${where}
        select: ${select}
        date_compared: ${date_compared}
        date: ${date}
        device: ${device}
        project_id: ${project_id}
        volume_mode: ${volume_mode}
    input:
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      order_by:
        type: string
        description: Comma-separated columns to sort by, each with optional :asc or :desc,
          e.g. best_position_has_thumbnail:desc. Any selectable column works.
        optional: true
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: best_position_has_thumbnail, best_position_has_thumbnail_previous,
          best_position_has_video_preview, best_position_has_video_preview_previous, best_position_kind,
          best_position_kind_previous, clicks, clicks_per_search, cost_per_click, country,
          country_prev, created_at, is_branded, is_commercial, is_informational, is_local,
          is_main_position, is_main_position_prev, is_navigational, is_transactional, keyword,
          keyword_difficulty, keyword_has_data, keyword_is_frozen, keyword_prev, keyword_words,
          keyword_words_prev, language, language_prev, location, location_prev, parent_topic,
          position, position_diff, position_prev, search_type_image, search_type_news, search_type_video,
          search_type_web, serp_features, serp_features_prev, serp_updated, serp_updated_prev,
          tags, tags_prev, target_positions_count, traffic, traffic_diff, traffic_prev, url,
          url_prev, volume, volume_desktop_pct, volume_mobile_pct.'
        optional: true
      select:
        type: string
        description: 'Comma-separated columns to return; request only what you need, since
          columns set the unit cost. Valid: best_position_has_thumbnail, best_position_has_thumbnail_previous,
          best_position_has_video_preview, best_position_has_video_preview_previous, best_position_kind,
          best_position_kind_previous, clicks, clicks_per_search, cost_per_click, country,
          country_prev, created_at, is_branded, is_commercial, is_informational, is_local,
          is_navigational, is_transactional, keyword, keyword_difficulty, keyword_has_data,
          keyword_is_frozen, keyword_prev, language, language_prev, location, location_prev,
          parent_topic, position, position_diff, position_prev, search_type_image, search_type_news,
          search_type_video, search_type_web, serp_features, serp_features_prev, serp_updated,
          serp_updated_prev, tags, tags_prev, target_positions_count, traffic, traffic_diff,
          traffic_prev, url, url_prev, volume, volume_desktop_pct, volume_mobile_pct.'
      date_compared:
        type: string
        description: A date to compare metrics with in YYYY-MM-DD format.
        optional: true
      date:
        type: string
        description: A date to report metrics on in YYYY-MM-DD format.
      device:
        type: string
        description: Choose between mobile and desktop rankings.
        enum:
        - desktop
        - mobile
      project_id:
        type: integer
        description: 'The unique identifier of the project. You can find it in the URL of
          your Rank Tracker project in Ahrefs: https://app.ahrefs.com/rank-tracker/overview/#project_id#'
      volume_mode:
        type: string
        description: 'The search volume calculation mode: monthly or average. It affects volume,
          traffic, and traffic value.'
        optional: true
        enum:
        - monthly
        - average
    output:
      description: Tracked keywords with positions.
      type: array
      items:
        type: object
      response_path: overviews

