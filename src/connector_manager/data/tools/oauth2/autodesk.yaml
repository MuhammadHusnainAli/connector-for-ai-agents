      headers:
        Region: "${region}"
      body:
        business_units: "${business_units}"
    input:
      account_id:
        type: string
        description: Account id.
      business_units:
        type: array
        description: The complete business unit list, each with id, name and parent.
        items: {type: object}
      region:
        type: string
        description: Data centre holding the account.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The stored business unit structure.
      type: object

  get_issues_permissions:
    title: Get your issue permissions
    description: >-
      Read what the signed-in user may do with issues on a project -- which
      actions are permitted and which issues they can see.
    category: acc-issues
    read_only: true
    request:
      method: GET
      path: /construction/issues/v1/projects/${project_id}/users/me
      headers:
        x-ads-region: "${region}"
    input:
      project_id:
        type: string
        description: ACC project id.
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The user's issue permissions on the project.
      type: object

  list_issues:
    title: List issues
    description: >-
      Page through a project's issues, filtered by status, type, assignee,
      location, root cause, dates or a free-text search. Issue status values
      depend on the project's workflow -- read them from list_issue_types.
    category: acc-issues
    read_only: true
    request:
      method: GET
      path: /construction/issues/v1/projects/${project_id}/issues
      headers:
        x-ads-region: "${region}"
      query:
        filter[id]: "${filter_id}"
        filter[issueTypeId]: "${issue_type_id}"
        filter[issueSubtypeId]: "${issue_subtype_id}"
        filter[status]: "${status}"
        filter[assignedTo]: "${assigned_to}"
        filter[assignedToType]: "${assigned_to_type}"
        filter[createdBy]: "${created_by}"
        filter[createdAt]: "${created_at}"
        filter[updatedBy]: "${updated_by}"
        filter[updatedAt]: "${updated_at}"
        filter[closedBy]: "${closed_by}"
        filter[closedAt]: "${closed_at}"
        filter[dueDate]: "${due_date}"
        filter[startDate]: "${start_date}"
        filter[locationId]: "${location_id}"
        filter[rootCauseId]: "${root_cause_id}"
        filter[linkedDocumentUrn]: "${linked_document_urn}"
        filter[search]: "${search}"
        filter[displayId]: "${display_id}"
        filter[deleted]: "${deleted}"
        filter[valid]: "${valid}"
        fields: "${fields}"
        sortBy: "${sort_by}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      project_id:
        type: string
        description: ACC project id whose issues to list.
      filter_id:
        type: array
        description: Issue ids to restrict the response to.
        optional: true
        items: {type: string}
      issue_type_id:
        type: array
        description: Issue category ids to restrict the response to.
        optional: true
        items: {type: string}
      issue_subtype_id:
        type: array
        description: Issue type (subtype) ids to restrict the response to.
        optional: true
        items: {type: string}
      status:
        type: string
        description: Comma-separated statuses to include, e.g. open,answered.
        optional: true
      assigned_to:
        type: array
        description: Autodesk ids of assignees to filter by.
        optional: true
        items: {type: string}
      assigned_to_type:
        type: string
        description: Whether the assignee is a user, company or role.
        optional: true
      created_by:
        type: array
        description: Autodesk ids of the issue creators to filter by.
        optional: true
        items: {type: string}
      created_at:
        type: string
        description: Creation date or ISO 8601 range to filter by.
        optional: true
      updated_by:
        type: array
        description: Autodesk ids of the last updaters to filter by.
        optional: true
        items: {type: string}
      updated_at:
        type: string
        description: Update date or ISO 8601 range to filter by.
        optional: true
      closed_by:
        type: array
        description: Autodesk ids of the users who closed the issues.
        optional: true
        items: {type: string}
      closed_at:
        type: string
        description: Closure date or ISO 8601 range to filter by.
        optional: true
      due_date:
        type: string
        description: Due date or ISO 8601 range to filter by.
        optional: true
      start_date:
        type: string
        description: Start date or ISO 8601 range to filter by.
        optional: true
      location_id:
        type: array
        description: Location breakdown structure ids to filter by.
        optional: true
        items: {type: string}
      root_cause_id:
        type: array
        description: Root cause ids to filter by.
        optional: true
        items: {type: string}
      linked_document_urn:
        type: array
        description: Document URNs whose pushpin issues to return.
        optional: true
        items: {type: string}
      search:
        type: string
        description: Free-text search across issue title and description.
        optional: true
      display_id:
        type: integer
        description: The user-facing sequential issue number.
        optional: true
      deleted:
        type: boolean
        description: True to return deleted issues.
        optional: true
      valid:
        type: boolean
        description: False to include issues with no type or subtype.
        optional: true
      fields:
        type: array
        description: Issue fields to return.
        optional: true
        items: {type: string}
      sort_by:
        type: array
        description: Fields to sort by; prefix with - for descending.
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Issues per page, 1 to 100.
        optional: true
        maximum: 100
      offset:
        type: integer
        description: Offset into the result set.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: A page of issues with their status, assignee and dates.
      type: object

  get_issue:
    title: Get an issue
    description: >-
      Read one issue by id, with its status, assignee, dates, location, custom
      attributes and permitted actions.
    category: acc-issues
    read_only: true
    request:
      method: GET
      path: /construction/issues/v1/projects/${project_id}/issues/${issue_id}
      headers:
        x-ads-region: "${region}"
    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id.
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The issue record.
      type: object

  create_issue:
    title: Create an issue
    description: >-
      Raise an issue on a project. title, issueSubtypeId and status are
      required -- get valid subtype ids from list_issue_types and the statuses
      its workflow allows.
    category: acc-issues
    request:
      method: POST
      path: /construction/issues/v1/projects/${project_id}/issues
      headers:
        x-ads-region: "${region}"
      body:
        title: "${title}"
        description: "${description}"
        issueSubtypeId: "${issue_subtype_id}"
        status: "${status}"
        assignedTo: "${assigned_to}"
        assignedToType: "${assigned_to_type}"
        dueDate: "${due_date}"
        startDate: "${start_date}"
        locationId: "${location_id}"
        locationDetails: "${location_details}"
        rootCauseId: "${root_cause_id}"
        issueTemplateId: "${issue_template_id}"
        published: "${published}"
        watchers: "${watchers}"
        customAttributes: "${custom_attributes}"
        gpsCoordinates: "${gps_coordinates}"
        snapshotUrn: "${snapshot_urn}"
    input:
      project_id:
        type: string
        description: ACC project id to raise the issue on.
      title:
        type: string
        description: Short statement of the issue.
      description:
        type: string
        description: Full description of the issue.
        optional: true
      issue_subtype_id:
        type: string
        description: Issue type (subtype) id the issue belongs to.
      status:
        type: string
        description: Status to open the issue in, e.g. open or draft.
      assigned_to:
        type: string
        description: Autodesk id of the user, role or company to assign it to.
        optional: true
      assigned_to_type:
        type: string
        description: What kind of assignee assignedTo names.
        optional: true
        enum: [user, company, role]
      due_date:
        type: string
        description: Due date, as an ISO 8601 date.
        optional: true
      start_date:
        type: string
        description: Start date, as an ISO 8601 date.
        optional: true
      location_id:
        type: string
        description: Location breakdown structure id the issue sits at.
        optional: true
      location_details:
        type: string
        description: Free-text description of where the issue is.
        optional: true
      root_cause_id:
        type: string
        description: Root cause id for the issue.
        optional: true
      issue_template_id:
        type: string
        description: Template to create the issue from.
        optional: true
      published:
        type: boolean
        description: False to create the issue as a draft.
        optional: true
      watchers:
        type: array
        description: Autodesk ids of people to add as watchers.
        optional: true
        items: {type: string}
      custom_attributes:
        type: array
        description: Custom attribute values, each with its attributeDefinitionId and value.
        optional: true
        items: {type: object}
      gps_coordinates:
        type: object
        description: Latitude and longitude of the issue.
        optional: true
      snapshot_urn:
        type: string
        description: URN of a snapshot image attached to the issue.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The created issue, with its id and display id.
      type: object

  update_issue:
    title: Update an issue
    description: >-
      Change an issue -- reassign it, move its status, set a due date or fill
      in custom attributes. title, issueSubtypeId and status must be present
      even when unchanged.
    category: acc-issues
    request:
      method: PATCH
      path: /construction/issues/v1/projects/${project_id}/issues/${issue_id}
      headers:
        x-ads-region: "${region}"
      body:
        title: "${title}"
        description: "${description}"
        issueSubtypeId: "${issue_subtype_id}"
        status: "${status}"
        assignedTo: "${assigned_to}"
        assignedToType: "${assigned_to_type}"
        dueDate: "${due_date}"
        startDate: "${start_date}"
        locationId: "${location_id}"
        locationDetails: "${location_details}"
        rootCauseId: "${root_cause_id}"
        published: "${published}"
        watchers: "${watchers}"
        customAttributes: "${custom_attributes}"
        gpsCoordinates: "${gps_coordinates}"
    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id to update.
      title:
        type: string
        description: Short statement of the issue.
      issue_subtype_id:
        type: string
        description: Issue type (subtype) id the issue belongs to.
      status:
        type: string
        description: Status the issue should be in.
      description:
        type: string
        description: New description of the issue.
        optional: true
      assigned_to:
        type: string
        description: Autodesk id of the new assignee.
        optional: true
      assigned_to_type:
        type: string
        description: What kind of assignee assignedTo names.
        optional: true
        enum: [user, company, role]
      due_date:
        type: string
        description: New due date, as an ISO 8601 date.
        optional: true
      start_date:
        type: string
        description: New start date, as an ISO 8601 date.
        optional: true
      location_id:
        type: string
        description: New location breakdown structure id.
        optional: true
      location_details:
        type: string
        description: New free-text location description.
        optional: true
      root_cause_id:
        type: string
        description: New root cause id.
        optional: true
      published:
        type: boolean
        description: True to publish a draft issue.
        optional: true
      watchers:
        type: array
        description: Replacement list of watcher Autodesk ids.
        optional: true
        items: {type: string}
      custom_attributes:
        type: array
        description: Custom attribute values to set.
        optional: true
        items: {type: object}
      gps_coordinates:
        type: object
        description: New latitude and longitude for the issue.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The updated issue record.
      type: object

  list_issue_comments:
