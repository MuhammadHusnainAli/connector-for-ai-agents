  finalize_invoice:
    title: Finalize an invoice
    description: >-
      Finalize a draft invoice: it gets its legal number and can no longer be edited or deleted.
    category: invoices
    destructive: true
    request:
      method: POST
      path: /SaleInvoices/Finalize/${id}
      query:
        finalizationDate: ${finalization_date}
        dateAdjustment: ${date_adjustment}
    input:
      id:
        type: integer
        description: Draft invoice id.
      finalization_date:
        type: string
        description: Date to finalize on, YYYY-MM-DD. Defaults to the document's own date.
        optional: true
      date_adjustment:
        type: string
        description: 'What to do when the date is earlier than the last finalized document:
          None (fail), MinimumDate (move to the earliest allowed date) or Today.'
        optional: true
        enum:
        - None
        - MinimumDate
        - Today
    output:
      description: The finalized invoice.
      type: object

  check_invoice_e_invoicing:
    title: Check invoice e-invoicing
    description: >-
      Run a draft invoice's Factur-X e-invoice through the e-invoicing validator and return
      what it finds. Nothing is finalized or sent.
    category: invoices
    read_only: true
    request:
      method: POST
      path: /SaleInvoices/CheckEInvoicing/${id}
    input:
      id:
        type: integer
        description: Draft invoice id.
    output:
      description: The validation findings.
      type: object

  mark_invoice_paid:
    title: Mark an invoice paid
    description: >-
      Record a payment against an invoice, finalizing it first if asked.
    category: invoices
    destructive: true
    request:
      method: POST
      path: /SaleInvoices/MarkAsPaid
      body:
        allowUpdate: ${allow_update}
        amount: ${amount}
        date: ${date}
        dateAdjustment: ${date_adjustment}
        finalizationDate: ${finalization_date}
        finalizeInvoice: ${finalize_invoice}
        invoiceId: ${invoice_id}
        metadata: ${metadata}
        paymentMethod: ${payment_method}
        paymentReference: ${payment_reference}
        status: ${status}
    input:
      allow_update:
        type: boolean
        description: True to update the payment's metadata, status or reference if the invoice
          is already paid.
        optional: true
      amount:
        type: number
        description: Amount paid. Defaults to the balance still owed.
        optional: true
      date:
        type: string
        description: Date, YYYY-MM-DD.
        optional: true
      date_adjustment:
        type: string
        description: 'What to do when the date is earlier than the last finalized document:
          None (fail), MinimumDate (move to the earliest allowed date) or Today.'
        optional: true
        enum:
        - None
        - MinimumDate
        - Today
      finalization_date:
        type: string
        description: Date to finalize on, YYYY-MM-DD. Defaults to the document's own date.
        optional: true
      finalize_invoice:
        type: boolean
        description: True to finalize the invoice first if it is still a draft.
        optional: true
      invoice_id:
        type: integer
        description: Invoice id.
      metadata:
        type: object
        description: Free-form key-value data kept with the record.
        optional: true
      payment_method:
        type: string
        description: Payment method.
        optional: true
        enum:
        - Transfer
        - Order
        - Check
        - Cash
        - Card
        - Bill
        - Usec
        - Other
      payment_reference:
        type: string
        description: Payment reference.
        optional: true
      status:
        type: string
        description: 'Payment status: Success, Pending or Failed.'
        optional: true
        enum:
        - Success
        - Pending
        - Failed
    output:
      description: The receipt that was recorded.
      type: object

