netsuite-client-credentials:
  alias: netsuite
  assertion:
    header:
      alg: RS256
      kid: ${credentials.certificateId}
    key: ${assertionOption.privateKey}
    lifetimeInSeconds: 3600
    payload:
      aud: https://${connectionConfig.accountId}.suitetalk.api.netsuite.com/services/rest/auth/oauth2/v1/token
      iss: ${credentials.clientId}
      jti: ${random}
    type: jwt
  assertion_option:
    privateKey:
      description: The RSA private key (PEM format) used to sign the JWT assertion.
      example: '-----BEGIN RSA PRIVATE KEY-----

        MIIEow...

        -----END RSA PRIVATE KEY-----'
      title: Private Key
      type: string
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - accounting
  - erp
  connection_config:
    accountId:
      description: Your NetSuite Account ID (e.g. 1234567 or 1234567_SB1 for sandbox).
      example: '1234567'
      title: Account ID
      type: string
  credentials:
    assertion:
      automated: true
      description: ''
      title: ''
      type: string
    certificateId:
      description: The ID of the certificate registered in your NetSuite integration.
      example: HRril7Vwkk********************eWT2Fgks
      title: Certificate ID
      type: string
    clientId:
      description: The Client ID from your NetSuite integration record.
      example: 1c343a716c1d****************************976dde7d8e3e2
      title: Client ID
      type: string
  display_name: NetSuite (Client Credentials)
  token_headers:
    content-type: application/x-www-form-urlencoded
  token_params:
    client_assertion: ${credentials.assertion}
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    grant_type: client_credentials
  token_response:
    token: access_token
    token_expiration: expires_in
    token_expiration_strategy: expireIn
  token_url: https://${connectionConfig.accountId}.suitetalk.api.netsuite.com/services/rest/auth/oauth2/v1/token
