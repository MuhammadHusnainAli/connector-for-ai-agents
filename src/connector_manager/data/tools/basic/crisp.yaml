# Crisp tools -- conversations, contacts, campaigns and helpdesk.
#
# This connector authenticates with a Crisp **token keypair** -- the identifier
# as the basic-auth username and the key as the password -- and the connection
# sends `X-Crisp-Tier: plugin`, so it acts as a plugin rather than as a user.
#
# The API is large, uniform and well documented, so the tools below are named
# for Crisp's own operations one-to-one. Five things are worth knowing before
# driving it:
#
#   * **everything hangs off a website id.** A Crisp workspace is a "website",
#     and it is the first path segment of almost every call. A plugin token
#     only reaches the websites that have subscribed to it -- that list is what
#     `list_all_connect_websites` returns, and it is the real scope of the
#     credential;
#   * **a conversation is addressed by `session_id`, a message by
#     `fingerprint`.** Neither is guessable: the session id comes from
#     `list_conversations` or an inbound webhook, and the fingerprint from
#     `get_messages`;
#   * **`send_message_in_conversation` reaches a real person.** It appears in
#     the visitor's chat window or inbox the moment it succeeds. So does
#     editing or deleting a message -- the visitor sees that too;
#   * **PUT replaces and PATCH merges**, consistently, across campaigns,
#     templates, people data and plugin settings. Where both exist, the PATCH
#     is the safe partial write and the PUT will clear anything you omit;
#   * **campaigns are the sharp edge.** Creating one sends nothing;
#     `dispatch_campaign` sends to everyone the segment matches and cannot be
#     recalled. `test_campaign` is the rehearsal, and
#     `list_campaign_recipients` is the last look at the real audience.
#
# File attachments do not go on the message endpoint: `generate_bucket_url`
# returns a signed upload url, and the message then references the uploaded
# file.
#
# The HEAD-only existence checks Crisp offers are omitted -- this proxy speaks
# the five standard verbs, and each of those checks has a GET that answers the
# same question with a body.
#
# Docs: https://docs.crisp.chat/references/rest-api/v1/

connector_id: crisp
display_name: Crisp
docs_url: https://docs.crisp.chat/references/rest-api/v1/

tools:

  generate_bucket_url:
    title: Generate bucket URL
    description: >-
      Get a signed upload url for a file, so it can be attached to a message.
      Crisp does not accept file bytes on the message endpoint; the file goes
      to the bucket first and the message references it.
    category: uploads
    request:
      method: POST
      path: /v1/bucket/url/generate
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_connect_account:
    title: Get connect account
    description: >-
      The plugin account behind this token. The cheapest call that proves the
      credential works and says which plugin it is.
    category: plugin
    read_only: true
    request:
      method: GET
      path: /v1/plugin/connect/account
    output:
      description: The requested record.
      type: object

  list_all_connect_websites:
    title: List all connect websites
    description: >-
      The websites this plugin token has been granted access to. A plugin only
      reaches websites that have subscribed to it, so this is the real scope
      of the credential.
    category: plugin
    read_only: true
    request:
      method: GET
      path: /v1/plugin/connect/websites/all/${page_number}
      query:
        page_size: "${page_size}"
    input:
      page_number:
        type: integer
        description: Which page of results to return, starting at 1.
      page_size:
        type: integer
        description: How many records per page, where the endpoint supports it.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_connect_websites_since:
    title: List connect websites since
    description: >-
      Websites whose plugin subscription changed since a given time -- the
      incremental version of the full listing, for keeping a mirror current.
    category: plugin
    read_only: true
    request:
      method: GET
      path: /v1/plugin/connect/websites/since
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_plugin_connect_endpoints:
    title: Get connect endpoints
    description: >-
      Get connect endpoints on the plugin token itself -- which account it
      belongs to and which websites it can reach. Crisp's reference documents
      the exact payload and query parameters for this call.
    category: plugin
    read_only: true
    request:
      method: GET
      path: /v1/plugin/connect/endpoints
    output:
      description: The requested record.
      type: object

