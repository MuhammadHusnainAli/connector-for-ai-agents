  get_slo_history:
    title: Get an SLO's history
    description: >-
      An SLO's status over a window -- the achieved percentage and the error
      budget remaining. The number a reliability review is built on.
    category: slos
    read_only: true
    request:
      method: GET
      path: /v1/slo/${slo_id}/history
      query:
        from_ts: "${from_ts}"
