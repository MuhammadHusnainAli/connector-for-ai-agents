    output:
      description: The provider's response to the call.
      type: object

  search_spans:
    title: Search spans
    description: >-
      Search APM spans with a POST body. The trace-level view: what a request
      actually did, and where the time went. Cheaper to aggregate than to page
      when you only need counts.
    category: apm
    request:
      method: POST
      path: /v2/spans/events/search
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  list_spans:
    title: Get a list of spans
    description: >-
      List endpoint returns spans that match a span search query. [Results are
      paginated][1]. Use this endpoint to see your latest spans. This endpoint
      is rate limited to `300` requests per hour. [1]:
      /logs/guide/collect-multiple-logs-with-pagination?tab=v2api.
    category: apm
    read_only: true
    request:
      method: GET
      path: /v2/spans/events
      query:
        filter[query]: "${filter_query_}"
        filter[from]: "${filter_from_}"
        filter[to]: "${filter_to_}"
        sort: "${sort}"
        page[cursor]: "${page_cursor_}"
        page[limit]: "${page_limit_}"
    input:
      filter_query_:
        type: string
        description: Search query following spans syntax.
        optional: true
      filter_from_:
        type: string
        description: Minimum timestamp for requested spans. Supports date-time ISO8601, date math, and regular timestamps (milliseconds).
        optional: true
      filter_to_:
        type: string
        description: Maximum timestamp for requested spans. Supports date-time ISO8601, date math, and regular timestamps (milliseconds).
        optional: true
      sort:
        type: string
        description: Order of spans in results.
        optional: true
      page_cursor_:
        type: string
        description: List following results with a cursor provided in the previous query.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of spans in the response.
        optional: true
        default: '10'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  aggregate_spans:
    title: Aggregate spans
    description: >-
      Aggregate APM spans into counts, buckets and percentiles rather than
      returning individual spans. What a latency-by-endpoint widget is built
      from.
    category: apm
    request:
      method: POST
      path: /v2/spans/analytics/aggregate
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  list_dashboards:
    title: Get all dashboards
    description: >-
      Get all dashboards. This query will not return preset dashboards.
    category: dashboards
    read_only: true
    request:
      method: GET
      path: /v1/dashboard
      query:
        filter[shared]: "${filter_shared_}"
        filter[deleted]: "${filter_deleted_}"
        count: "${count}"
        start: "${start}"
    input:
      filter_shared_:
        type: boolean
        description: When `true`, this query only returns shared custom created or cloned dashboards.
        optional: true
      filter_deleted_:
        type: boolean
        description: When `true`, this query returns only deleted custom-created or cloned dashboards. This parameter is incompatible with `filter[shared]`.
        optional: true
      count:
        type: integer
        description: The maximum number of dashboards returned in the list.
        optional: true
        default: '100'
      start:
        type: integer
        description: The specific offset to use as the beginning of the returned response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_dashboard:
