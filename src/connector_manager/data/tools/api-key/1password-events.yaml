# 1Password Events API tools.
#
# This is the complete surface of the Events API: three event feeds plus token
# introspection. Taken from 1Password's own OpenAPI specification at
# https://i.1password.com/media/1password-events-reporting/1password-events-api.yaml
#
# Each feed is polled in two steps, which is why it gets two tools. The first
# call posts a *reset cursor* (limit, and optionally a time range) and comes
# back with a cursor; every call after that posts only that cursor. Mixing the
# two shapes in one request is invalid, so they are kept apart deliberately.
#
# The connection's `domain` picks the region (com, ca, eu), so paths start at
# /api.
#
# Docs: https://developer.1password.com/docs/events-api/reference/

connector_id: 1password-events
display_name: 1Password (Events API)
docs_url: https://developer.1password.com/docs/events-api/reference/

tools:

  introspect_token:
    title: Introspect the bearer token
    description: >-
      Report what the Events API token is allowed to read — which feeds its
      scopes cover, the account it belongs to, and when it expires. The cheapest
      health check for the connection, and the way to find out which of the
      event feeds will actually answer.
    category: auth
    read_only: true
    request:
      method: GET
      path: /api/v2/auth/introspect
    input: {}
    output:
      description: The token's features, issuing UUID and expiry.
      type: object
      properties:
        uuid: {type: string}
        features: {type: array, description: "Which feeds the token may read, e.g. signinattempts, itemusages."}
        issuedAt: {type: string}
        expiresAt: {type: string}

  get_sign_in_attempts:
    title: Start reading sign-in attempts
    description: >-
      Begin a sign-in attempt feed, successful and failed alike. Posts a reset
      cursor, so pass a limit and optionally a time window; the response carries
      a cursor to hand to continue_sign_in_attempts for everything after it.
      Use this for the first call only.
    category: events
    request:
      method: POST
      path: /api/v1/signinattempts
      body:
        limit: "${limit}"
        start_time: "${start_time}"
        end_time: "${end_time}"
    input:
      limit:
        type: integer
        description: How many events to return in this batch (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      start_time:
        type: string
        description: Only attempts at or after this RFC 3339 instant, e.g. 2026-08-01T00:00:00Z.
        optional: true
        example: "2026-08-01T00:00:00Z"
      end_time:
        type: string
        description: Only attempts at or before this RFC 3339 instant.
        optional: true
    output:
      description: A batch of sign-in attempts, with the cursor for the next batch.
      type: object
      properties:
        items: {type: array, description: "Each with uuid, timestamp, category, type, country, client and target_user."}
        cursor: {type: string, description: "Pass to continue_sign_in_attempts."}
        has_more: {type: boolean}

  continue_sign_in_attempts:
    title: Read more sign-in attempts
    description: >-
      Fetch the next batch of sign-in attempts using the cursor from a previous
      call. Keep calling with the cursor each response returns; when has_more is
      false the cursor is still valid for polling new events later.
    category: events
    request:
      method: POST
      path: /api/v1/signinattempts
      body:
        cursor: "${cursor}"
    input:
      cursor:
        type: string
        description: Cursor from the previous sign-in attempts response.
    output:
      description: The next batch of sign-in attempts.
      type: object
      properties:
        items: {type: array}
        cursor: {type: string}
        has_more: {type: boolean}

  get_item_usages:
    title: Start reading item usages
    description: >-
      Begin an item usage feed — every time an item in a shared vault was used.
      Posts a reset cursor, so pass a limit and optionally a time window; the
      response carries a cursor for continue_item_usages. Use this for the first
      call only.
    category: events
    request:
      method: POST
      path: /api/v1/itemusages
      body:
        limit: "${limit}"
        start_time: "${start_time}"
        end_time: "${end_time}"
    input:
      limit:
        type: integer
        description: How many events to return in this batch (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      start_time:
        type: string
        description: Only usages at or after this RFC 3339 instant.
        optional: true
      end_time:
        type: string
        description: Only usages at or before this RFC 3339 instant.
        optional: true
    output:
      description: A batch of item usages, with the cursor for the next batch.
      type: object
      properties:
        items: {type: array, description: "Each with uuid, timestamp, used_version, vault_uuid, item_uuid, user and client."}
        cursor: {type: string}
        has_more: {type: boolean}

  continue_item_usages:
    title: Read more item usages
    description: >-
      Fetch the next batch of item usages using the cursor from a previous call.
      Keep calling with the cursor each response returns to walk the feed and
      then poll it.
    category: events
    request:
      method: POST
      path: /api/v1/itemusages
      body:
        cursor: "${cursor}"
    input:
      cursor:
        type: string
        description: Cursor from the previous item usages response.
    output:
      description: The next batch of item usages.
      type: object
      properties:
        items: {type: array}
        cursor: {type: string}
        has_more: {type: boolean}

  get_audit_events:
    title: Start reading audit events
    description: >-
      Begin an audit event feed — actions team members took in the account, such
      as changing a vault's permissions or inviting a user. Posts a reset
      cursor, so pass a limit and optionally a time window. Use this for the
      first call only.
    category: events
    request:
      method: POST
      path: /api/v1/auditevents
      body:
        limit: "${limit}"
        start_time: "${start_time}"
        end_time: "${end_time}"
    input:
      limit:
        type: integer
        description: How many events to return in this batch (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      start_time:
        type: string
        description: Only events at or after this RFC 3339 instant.
        optional: true
      end_time:
        type: string
        description: Only events at or before this RFC 3339 instant.
        optional: true
    output:
      description: A batch of audit events, with the cursor for the next batch.
      type: object
      properties:
        items: {type: array, description: "Each with uuid, timestamp, actor_uuid, action, object_type, object_uuid and aux_id."}
        cursor: {type: string}
        has_more: {type: boolean}

  continue_audit_events:
    title: Read more audit events
    description: >-
      Fetch the next batch of audit events using the cursor from a previous
      call. Keep calling with the cursor each response returns to walk the feed
      and then poll it.
    category: events
    request:
      method: POST
      path: /api/v1/auditevents
      body:
        cursor: "${cursor}"
    input:
      cursor:
        type: string
        description: Cursor from the previous audit events response.
    output:
      description: The next batch of audit events.
      type: object
      properties:
        items: {type: array}
        cursor: {type: string}
        has_more: {type: boolean}
