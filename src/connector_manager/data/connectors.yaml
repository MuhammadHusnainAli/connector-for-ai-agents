    base_url: https://${connectionConfig.subdomain}.veevavault.com/api/${connectionConfig.version}
    headers:
      accept: application/json
      authorization: ${accessToken}
  token_headers:
    accept: application/json
    content-type: application/x-www-form-urlencoded
  token_params:
    password: ${credentials.password}
    username: ${credentials.username}
  token_response:
    token: sessionId
  token_url: https://${connectionConfig.subdomain}.veevavault.com/api/${connectionConfig.version}/auth
veeva-vault-oauth:
  additional_steps:
  - body_format: form
    token_headers:
      accept: application/json
      authorization: Bearer ${step1.access_token}
      content-type: application/x-www-form-urlencoded
    token_params:
      client_id: ${credentials.clientId}
      vaultDNS: ${connectionConfig.subdomain}
    token_url: https://login.veevavault.com/auth/oauth/session/${connectionConfig.oauthProfileId}
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - crm
  connection_config:
    oauthProfileId:
      description: The ID of the OAuth 2.0 / OpenID Connect profile configured in Veeva Vault.
      order: 2
      title: OAuth 2.0 / OpenID Connect Profile ID
      type: string
    scope:
      description: The OAuth scope requested from your identity provider, if required.
      optional: true
      order: 4
      title: OAuth Scope
      type: string
    subdomain:
      description: The Vault DNS subdomain of the Veeva Vault you want to connect to
      example: myvault
      order: 3
      prefix: https://
      suffix: veevavault.com
      title: Vault DNS (subdomain)
      type: string
    tokenUrl:
      description: The OAuth 2.0 token endpoint URL of your identity provider.
      example: '{your-okta-domain}/oauth2/default/v1/token'
      order: 1
      prefix: https://
      title: Identity Provider Token Endpoint
      type: string
  credentials:
    clientId:
      description: The client ID of the client credentials application configured in your identity provider.
      title: Client ID
      type: string
    clientSecret:
      description: The client secret of the client credentials application configured in your identity provider.
      secret: true
      title: Client Secret
      type: string
  display_name: Veeva Vault (OAuth 2.0 / OIDC)
  proxy:
    base_url: https://${connectionConfig.subdomain}.veevavault.com/api
    headers:
      accept: application/json
      authorization: ${accessToken}
  token_headers:
    accept: application/json
    authorization: Basic ${base64(${credentials.clientId}:${credentials.clientSecret})}
    content-type: application/x-www-form-urlencoded
  token_params:
    grant_type: client_credentials
    scope: ${connectionConfig.scope}
  token_response:
    token: sessionId
  token_url: https://${connectionConfig.tokenUrl}
