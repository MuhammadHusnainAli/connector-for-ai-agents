# beehiiv tools -- newsletter posts, subscribers, segments and paid tiers.
#
# The connection pins one publication: its base url is
# `https://api.beehiiv.com/v2/publications/<publicationId>`, so every path
# here starts at `/posts`, `/subscriptions` and so on. The two
# workspace-level calls (`list_publications`, `get_workspace_permissions`)
# reach above that with an explicit base url, and are the way to find another
# publication's id.
#
# What decides whether a call does what you meant:
#
#   * **`create_post` with `status: confirmed` sends email.** Draft is the
#     default and stays private; "confirmed" publishes and, for an email or
#     both-platform post, sends it to the audience `recipients` names. There is
#     no recall. `send_test_email` is the rehearsal;
#   * **post content is either `blocks` or `body_content`.** `blocks` is
#     beehiiv's structured editor format (paragraph, heading, image, button,
#     rss, advertisement...); `body_content` is a single raw HTML string
#     beehiiv wraps in one block. Use one or the other, not both;
#   * **a subscription is keyed by email but addressed by id.** `create_subscription`
#     is an upsert on email, `get_subscription_by_email` resolves the id, and
#     `reactivate_existing` decides whether someone who unsubscribed comes back;
#   * **`expand` is how you get the interesting parts.** Stats, custom fields,
#     referrals and newsletter-list membership are not in the default
#     response -- ask for them;
#   * **paging comes in two forms.** New endpoints take an opaque `cursor`
#     (preferred); older ones take a `page` number. Both are exposed where the
#     endpoint supports them.
#
# `delete_subscription` and the data-deletion request are irreversible, and the
# deletion request is a GDPR erasure, not an unsubscribe.
#
# Docs: https://developers.beehiiv.com/api-reference

connector_id: beehiiv
display_name: Beehiiv
docs_url: https://developers.beehiiv.com/api-reference

tools:

  # -- publication and workspace -------------------------------------------

  get_publication:
    title: Get the connected publication
    description: >-
      Read the publication this connection is pinned to -- its name, id,
      organization and referral program settings. The connection's own
      publication id is filled in for you. The cheapest call that proves the
      API key works.
    category: publication
    read_only: true
    request:
      method: GET
      path: /publications/${publicationId}
      base_url_override: https://api.beehiiv.com/v2
      query:
        expand[]: "${expand}"
    input:
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"] for subscriber and open-rate counts.
        optional: true
        items: {type: string}
    output:
      description: The publication, under `data`.
      type: object
      properties:
        data: {type: object}

  list_publications:
    title: List the workspace's publications
    description: >-
      Read every publication the API key can reach, not just the one this
      connection is pinned to. Use it to find another publication's prefixed id
      (`pub_...`) before pointing a connection at it.
    category: publication
    read_only: true
    request:
      method: GET
      path: /publications
      base_url_override: https://api.beehiiv.com/v2
      query:
        limit: "${limit}"
        page: "${page}"
        expand[]: "${expand}"
    input:
      limit:
        type: integer
        description: Publications per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"].
        optional: true
        items: {type: string}
    output:
      description: A page of publications, under `data`.
      type: object
      properties:
        data: {type: array}

  get_workspace_permissions:
    title: Get the API key's permissions
    description: >-
      Read what this API key is allowed to do, and which publications it
      covers. The honest answer to "why did that call 403" before you go
      guessing.
    category: publication
    read_only: true
    request:
      method: GET
      path: /workspaces/permissions
      base_url_override: https://api.beehiiv.com/v2
    input: {}
    output:
      description: The key's permissions and publication scope.
      type: object

  get_engagements:
    title: Get publication engagement metrics
    description: >-
      Read open and click metrics for the publication over a window, bucketed
      by day, week or month. The chart behind "how is engagement trending".
    category: publication
    read_only: true
    request:
      method: GET
      path: /engagements
      query:
        start_date: "${start_date}"
        number_of_days: "${number_of_days}"
        granularity: "${granularity}"
        email_type: "${email_type}"
        direction: "${direction}"
    input:
      start_date:
        type: string
        description: First day to report on, YYYY-MM-DD.
        optional: true
        example: "2026-01-01"
      number_of_days:
        type: integer
        description: How many days from `start_date` to cover.
        optional: true
        minimum: 1
      granularity:
        type: string
        description: Bucket size for the series.
        optional: true
        enum: [day, week, month]
      email_type:
        type: string
        description: Restrict to one kind of email.
        optional: true
        enum: [all, post, message]
      direction:
        type: string
        description: Sort direction of the buckets.
        optional: true
        enum: [asc, desc]
    output:
      description: The engagement series.
      type: object

  # -- posts ---------------------------------------------------------------

  list_posts:
    title: List posts
    description: >-
      Read the publication's posts. `status` of "draft" gets what is unsent and
      "confirmed" what has gone out; `expand` with ["stats"] adds opens, clicks
      and delivery counts, and with ["free_web_content"] the rendered body.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts
      query:
        status: "${status}"
        platform: "${platform}"
        expand: "${expand}"
        content_tags[]: "${content_tags}"
        slugs[]: "${slugs}"
        authors[]: "${authors}"
        hidden_from_feed: "${hidden_from_feed}"
        order_by: "${order_by}"
        direction: "${direction}"
        limit: "${limit}"
        page: "${page}"
    input:
      status:
        type: string
        description: Only posts in this state. Defaults to all.
        optional: true
        enum: [draft, confirmed, archived, all]
      platform:
        type: string
        description: Only posts published to this platform.
        optional: true
        enum: [web, email, both, all]
      expand:
        type: array
        description: >-
          Extra data to include -- "stats" for engagement counts,
          "free_web_content" or "premium_web_content" for the rendered body.
        optional: true
        items: {type: string}
      content_tags:
        type: array
        description: Only posts carrying these content tags.
        optional: true
        items: {type: string}
      slugs:
        type: array
        description: Only posts with these slugs.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Only posts by these author names.
        optional: true
        items: {type: string}
      hidden_from_feed:
        type: string
        description: Filter on whether the post is hidden from the web feed.
        optional: true
        enum: ["all", "true", "false"]
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum: [created, publish_date, displayed_date]
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      limit:
        type: integer
        description: Posts per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
    output:
      description: A page of posts, under `data`.
      type: object
      properties:
        data: {type: array}

  get_post:
    title: Get a post
    description: >-
      Read one post by its prefixed id (`post_...`). `expand` with ["stats"]
      adds its engagement numbers, and with the content options the rendered
      HTML.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts/${post_id}
      query:
        expand: "${expand}"
        premium_tiers: "${premium_tiers}"
    input:
      post_id:
        type: string
        description: The post's prefixed id, e.g. "post_...".
      expand:
        type: array
        description: Extra data to include, e.g. ["stats", "free_web_content"].
        optional: true
        items: {type: string}
      premium_tiers:
        type: array
        description: Scope expanded premium content to these tier ids.
        optional: true
        items: {type: string}
    output:
      description: The post, under `data`.
      type: object
      properties:
        data: {type: object}

  create_post:
    title: Create a post
    description: >-
      Write a post. `status` defaults to "draft", which is private; setting it
      to "confirmed" publishes and -- for an email or both-platform post --
      sends to the audience, with no recall. Supply the content either as
      `body_content` (a single raw HTML string) or as `blocks` (beehiiv's
      structured editor format), not both. `scheduled_at` publishes later.
    category: posts
    request:
      method: POST
      path: /posts
      body:
        title: "${title}"
        subtitle: "${subtitle}"
        body_content: "${body_content}"
        blocks: "${blocks}"
        status: "${status}"
        scheduled_at: "${scheduled_at}"
        post_template_id: "${post_template_id}"
        thumbnail_image_url: "${thumbnail_image_url}"
        content_tags: "${content_tags}"
        recipients: "${recipients}"
        newsletter_list_id: "${newsletter_list_id}"
        email_settings:
          $when: "${email_subject_line} || ${email_preview_text}"
          email_subject_line: "${email_subject_line}"
          email_preview_text: "${email_preview_text}"
        custom_link_tracking_enabled: "${custom_link_tracking_enabled}"
        utm_source: "${utm_source}"
        utm_medium: "${utm_medium}"
        utm_campaign: "${utm_campaign}"
    input:
      title:
        type: string
        description: The post's title.
      subtitle:
        type: string
        description: The post's subtitle.
        optional: true
      body_content:
        type: string
        description: >-
          The whole post body as raw HTML. beehiiv wraps it in one HTML block.
          Use this or `blocks`, not both.
        optional: true
      blocks:
        type: array
        description: >-
          Structured content blocks, each with a `type` -- "paragraph",
          "heading", "image", "button", "rss", "advertisement" -- and that
          type's own fields.
        optional: true
        items: {type: object}
      status:
        type: string
        description: >-
          "draft" keeps it private; "confirmed" publishes it and sends the
          email. Defaults to draft.
        optional: true
        enum: [draft, confirmed]
      scheduled_at:
        type: string
        description: ISO 8601 time to publish at. Omit to publish immediately when confirmed.
        optional: true
      post_template_id:
        type: string
        description: Prefixed id of a post template to build from, from list_post_templates.
        optional: true
      thumbnail_image_url:
        type: string
        description: Url of the post's thumbnail image.
        optional: true
      content_tags:
        type: array
        description: Content tags for the post; replaces any existing tags.
        optional: true
        items: {type: string}
      recipients:
        type: object
        description: >-
          Who receives the post, e.g. {"email": {"tiers": ["free"]}, "web":
          {"tiers": ["free"]}}. Defaults to the free tier on both platforms.
        optional: true
      newsletter_list_id:
        type: string
        description: Prefixed id of the newsletter list to send to, from list_newsletter_lists.
        optional: true
      email_subject_line:
        type: string
        description: Subject line for the email, when it should differ from the title.
        optional: true
      email_preview_text:
        type: string
        description: Preview text shown after the subject line in the inbox.
        optional: true
      custom_link_tracking_enabled:
        type: boolean
        description: Rewrite links for click tracking.
        optional: true
      utm_source:
        type: string
        description: utm_source appended to links in the post.
        optional: true
      utm_medium:
        type: string
        description: utm_medium appended to links in the post.
        optional: true
      utm_campaign:
        type: string
        description: utm_campaign appended to links in the post.
        optional: true
    output:
      description: The created post, under `data`.
      type: object
      properties:
        data: {type: object}

  update_post:
    title: Update a post
    description: >-
      Change a post. `content_merge_strategy` decides how `blocks` interacts
      with what is already there -- "replace", "append", "prepend" or
      "append_to_template". Setting `status` to "confirmed" publishes and sends
      a draft; `scheduled_at` cannot be changed once the post has gone out.
    category: posts
    request:
      method: PATCH
      path: /posts/${post_id}
      body:
        title: "${title}"
        subtitle: "${subtitle}"
        body_content: "${body_content}"
        blocks: "${blocks}"
        content_merge_strategy: "${content_merge_strategy}"
        status: "${status}"
        scheduled_at: "${scheduled_at}"
        content_tags: "${content_tags}"
        recipients: "${recipients}"
        newsletter_list_id: "${newsletter_list_id}"
    input:
      post_id:
        type: string
        description: The post's prefixed id.
      title:
        type: string
        description: New title.
        optional: true
      subtitle:
        type: string
        description: New subtitle.
        optional: true
      body_content:
        type: string
        description: Raw HTML to replace the post's content with.
        optional: true
      blocks:
        type: array
        description: Structured content blocks, combined per `content_merge_strategy`.
        optional: true
        items: {type: object}
      content_merge_strategy:
        type: string
        description: How `blocks` combines with the post's existing content.
        optional: true
        enum: [replace, append_to_template, append, prepend]
      status:
        type: string
        description: Set to "confirmed" to publish and send a draft.
        optional: true
        enum: [draft, confirmed]
      scheduled_at:
        type: string
        description: New publish time, ISO 8601. Only before the post has been sent.
        optional: true
      content_tags:
        type: array
        description: Replacement content tags for the post.
        optional: true
        items: {type: string}
      recipients:
        type: object
        description: Who receives the post, in the same shape as create_post.
        optional: true
      newsletter_list_id:
        type: string
        description: Newsletter list to associate the post with.
        optional: true
    output:
      description: The updated post, under `data`.
      type: object

  delete_post:
    title: Delete a post
    description: >-
      Delete a post. A sent post's emails cannot be recalled, but the web
      version and its stats go -- there is no undo.
    category: posts
    destructive: true
    request:
      method: DELETE
      path: /posts/${post_id}
    input:
      post_id:
        type: string
        description: The post's prefixed id.
    output:
      description: Confirmation that the post was deleted.
      type: object

  send_test_email:
    title: Send a test email of a post
    description: >-
      Send one or more addresses a test copy of a post, without touching the
      audience. The rehearsal before publishing; beehiiv caps how many test
      sends a day, answering 422 when the limit is hit.
    category: posts
    request:
      method: POST
      path: /posts/${post_id}/test_sends
      body:
        recipient_emails: "${recipient_emails}"
    input:
      post_id:
        type: string
        description: The post's prefixed id.
      recipient_emails:
        type: array
        description: Addresses to send the test to.
        items: {type: string}
    output:
      description: Confirmation that the test was sent.
      type: object

  get_post_preview_url:
    title: Get a post's preview URL
    description: >-
      Generate a shareable preview link for a post, so a draft can be reviewed
      by someone without a beehiiv login.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts/${post_id}/preview
    input:
      post_id:
        type: string
        description: The post's prefixed id.
    output:
      description: The preview url.
      type: object

  get_post_aggregate_stats:
    title: Get aggregate post stats
    description: >-
      Read engagement totals and averages across posts -- opens, clicks,
      unsubscribes -- filtered by platform, audience, tag or author. The
      publication-level view rather than one post's numbers.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts/aggregate_stats
      query:
        audience: "${audience}"
        platform: "${platform}"
        status: "${status}"
        content_tags[]: "${content_tags}"
        authors[]: "${authors}"
        hidden_from_feed: "${hidden_from_feed}"
    input:
      audience:
        type: string
        description: Restrict to free or premium recipients.
        optional: true
        enum: [free, premium, all]
      platform:
        type: string
        description: Restrict to posts on this platform.
        optional: true
        enum: [web, email, both, all]
      status:
        type: string
        description: Restrict to posts in this state.
        optional: true
        enum: [draft, confirmed, archived, all]
      content_tags:
        type: array
        description: Only posts with these content tags.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Only posts by these authors.
        optional: true
        items: {type: string}
      hidden_from_feed:
        type: string
        description: Filter on the hidden-from-feed flag.
        optional: true
        enum: ["all", "true", "false"]
    output:
      description: The aggregate stats.
      type: object

  list_post_templates:
    title: List post templates
    description: >-
      Read the publication's post templates, whose prefixed ids create_post's
      `post_template_id` takes.
    category: posts
    read_only: true
    request:
      method: GET
      path: /post_templates
      query:
        limit: "${limit}"
        page: "${page}"
        order_by: "${order_by}"
        order: "${order}"
    input:
      limit:
        type: integer
        description: Templates per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      order_by:
        type: string
        description: Field to sort by. Defaults to created.
        optional: true
      order:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of post templates.
      type: object

  list_authors:
    title: List authors
    description: >-
      Read the publication's authors -- team members and guest authors -- with
      the prefixed ids a post's author fields take.
    category: posts
    read_only: true
    request:
      method: GET
      path: /authors
      query:
        limit: "${limit}"
        page: "${page}"
    input:
      limit:
        type: integer
        description: Authors per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of authors.
      type: object

  # -- subscriptions -------------------------------------------------------

  list_subscriptions:
    title: List subscriptions
    description: >-
      Read the publication's subscribers. `status` narrows to active, pending
      or inactive; `tier` separates free from paid; `expand` with
      ["stats","custom_fields","referrals","newsletter_lists"] adds the parts
      the default response leaves out.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions
      query:
        status: "${status}"
        tier: "${tier}"
        email: "${email}"
        premium_tier_ids[]: "${premium_tier_ids}"
        expand[]: "${expand}"
        creation_date: "${creation_date}"
        order_by: "${order_by}"
        direction: "${direction}"
        limit: "${limit}"
        cursor: "${cursor}"
        page: "${page}"
    input:
      status:
        type: string
        description: Only subscriptions in this state.
        optional: true
        enum: [validating, invalid, pending, active, inactive, all]
      tier:
        type: string
        description: Only free or only paid subscriptions.
        optional: true
        enum: [free, premium, all]
      email:
        type: string
        description: Exact email address to look up.
        optional: true
      premium_tier_ids:
        type: array
        description: Only subscriptions on these premium tier ids.
        optional: true
        items: {type: string}
      expand:
        type: array
        description: Extra data -- "stats", "custom_fields", "referrals", "newsletter_lists".
        optional: true
        items: {type: string}
      creation_date:
        type: string
        description: Only subscriptions created on this date, as YYYY/MM/DD.
        optional: true
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum: [created]
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      limit:
        type: integer
        description: Subscriptions per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: Opaque cursor from a previous response. The preferred way to page.
        optional: true
      page:
        type: integer
        description: Page number, for the older offset paging.
        optional: true
        minimum: 1
    output:
      description: A page of subscriptions, under `data`.
      type: object
      properties:
        data: {type: array}

  get_subscription_by_email:
    title: Get a subscription by email
    description: >-
      Look one subscriber up by email address -- the usual way to turn an
      address into the prefixed subscription id every other call wants.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions/by_email/${email}
      query:
        expand[]: "${expand}"
    input:
      email:
        type: string
        description: The subscriber's email address.
        format: email
      expand:
        type: array
        description: Extra data -- "stats", "custom_fields", "referrals", "tags", "newsletter_lists".
        optional: true
        items: {type: string}
    output:
      description: The subscription, under `data`.
      type: object

  get_subscription:
    title: Get a subscription by id
    description: Read one subscription by its prefixed id (`sub_...`), with optional expansions.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions/${subscription_id}
      query:
        expand[]: "${expand}"
    input:
      subscription_id:
        type: string
        description: The subscription's prefixed id, e.g. "sub_...".
      expand:
        type: array
        description: Extra data -- "stats", "custom_fields", "referrals", "tags", "newsletter_lists".
        optional: true
        items: {type: string}
    output:
      description: The subscription, under `data`.
      type: object

  create_subscription:
    title: Create a subscription
    description: >-
      Subscribe an email address. This is an upsert on email:
      `reactivate_existing` decides whether someone who previously
      unsubscribed is brought back, and `send_welcome_email` whether they get
      the welcome mail. Custom fields must already exist -- see
      list_custom_fields.
    category: subscriptions
    request:
      method: POST
      path: /subscriptions
      body:
        email: "${email}"
        reactivate_existing: "${reactivate_existing}"
        send_welcome_email: "${send_welcome_email}"
        utm_source: "${utm_source}"
        utm_medium: "${utm_medium}"
        utm_campaign: "${utm_campaign}"
        referring_site: "${referring_site}"
        referral_code: "${referral_code}"
        custom_fields: "${custom_fields}"
        tier: "${tier}"
        premium_tier_ids: "${premium_tier_ids}"
        stripe_customer_id: "${stripe_customer_id}"
        automation_ids: "${automation_ids}"
        newsletter_list_ids: "${newsletter_list_ids}"
        double_opt_override: "${double_opt_override}"
    input:
      email:
        type: string
        description: The subscriber's email address.
        format: email
      reactivate_existing:
        type: boolean
        description: Bring the address back if it had unsubscribed. Defaults to false.
        optional: true
      send_welcome_email:
        type: boolean
        description: Send the publication's welcome email. Defaults to false.
        optional: true
      utm_source:
        type: string
        description: Acquisition source recorded on the subscription.
        optional: true
      utm_medium:
        type: string
        description: Acquisition medium.
        optional: true
      utm_campaign:
        type: string
        description: Acquisition campaign.
        optional: true
      referring_site:
        type: string
        description: Site the subscriber came from.
        optional: true
      referral_code:
        type: string
        description: An existing subscriber's referral code, to credit them with this signup.
        optional: true
      custom_fields:
        type: array
        description: >-
          Values for fields that already exist, each
          {"name": <field name>, "value": <value>}.
        optional: true
        items: {type: object}
      tier:
        type: string
        description: Whether the subscription starts free or premium.
        optional: true
        enum: [free, premium]
      premium_tier_ids:
        type: array
        description: Premium tier ids to grant, from list_tiers.
        optional: true
        items: {type: string}
      stripe_customer_id:
        type: string
        description: Stripe customer id to link the paid subscription to.
        optional: true
      automation_ids:
        type: array
        description: Automations to enrol the new subscriber into, from list_automations.
        optional: true
        items: {type: string}
      newsletter_list_ids:
        type: array
        description: Newsletter lists to subscribe them to, from list_newsletter_lists.
        optional: true
        items: {type: string}
      double_opt_override:
        type: string
        description: Override the publication's double opt-in setting for this subscription.
        optional: true
    output:
      description: The created or reactivated subscription, under `data`.
      type: object

  create_subscriptions_bulk:
    title: Create many subscriptions at once
    description: >-
      Import a batch of subscribers in one call. Each entry takes the same
      fields as create_subscription. beehiiv processes the batch
      asynchronously, so check back with list_subscription_updates.
    category: subscriptions
    request:
      method: POST
      path: /bulk_subscriptions
      body:
        subscriptions: "${subscriptions}"
    input:
      subscriptions:
        type: array
        description: >-
          The subscribers to create, each an object with at least `email` and
          optionally the same fields create_subscription takes.
        items: {type: object}
    output:
      description: The queued bulk subscription job.
      type: object

  update_subscription:
    title: Update a subscription
    description: >-
      Change a subscriber's email, tier or custom fields, or unsubscribe them
      by setting `unsubscribe` to true. Only the fields you send are touched.
    category: subscriptions
    request:
      method: PATCH
      path: /subscriptions/${subscription_id}
      body:
        email: "${email}"
        tier: "${tier}"
        premium_tier_ids: "${premium_tier_ids}"
        stripe_customer_id: "${stripe_customer_id}"
        unsubscribe: "${unsubscribe}"
        custom_fields: "${custom_fields}"
    input:
      subscription_id:
        type: string
        description: The subscription's prefixed id.
      email:
        type: string
        description: New email address for the subscription.
        optional: true
        format: email
      tier:
        type: string
        description: Move the subscription between free and premium.
        optional: true
        enum: [free, premium]
      premium_tier_ids:
        type: array
        description: The complete set of premium tier ids after the update.
        optional: true
        items: {type: string}
      stripe_customer_id:
        type: string
        description: Stripe customer id to link.
        optional: true
      unsubscribe:
        type: boolean
        description: Set true to unsubscribe them from the publication.
        optional: true
      custom_fields:
        type: array
        description: 'Custom field values to set, each {"name": ..., "value": ...}.'
        optional: true
        items: {type: object}
    output:
      description: The updated subscription, under `data`.
      type: object

  update_subscriptions_status:
    title: Change many subscriptions' status
    description: >-
      Set the status of a batch of subscriptions at once -- the bulk way to
      unsubscribe or reactivate a list of ids without a call each.
    category: subscriptions
    request:
      method: PATCH
      path: /subscriptions
      body:
        subscription_ids: "${subscription_ids}"
        new_status: "${new_status}"
    input:
      subscription_ids:
        type: array
        description: Prefixed ids of the subscriptions to change.
        items: {type: string}
      new_status:
        type: string
        description: The status to set on all of them, e.g. "active" or "inactive".
    output:
      description: The result of the bulk status change.
      type: object

  delete_subscription:
    title: Delete a subscription
    description: >-
      Delete a subscriber outright, losing their history and stats. To stop
      sending to someone while keeping the record, set `unsubscribe` with
      update_subscription instead.
    category: subscriptions
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${subscription_id}
    input:
      subscription_id:
        type: string
        description: The subscription's prefixed id.
    output:
      description: Confirmation that the subscription was deleted.
      type: object

  add_subscription_tags:
    title: Tag a subscriber
    description: >-
      Add tags to one subscription. Tags are how subscribers are grouped for
      segments and automations without a custom field per attribute.
    category: subscriptions
    request:
      method: POST
      path: /subscriptions/${subscription_id}/tags
      body:
        tags: "${tags}"
    input:
      subscription_id:
        type: string
        description: The subscription's prefixed id.
      tags:
        type: array
        description: Tags to add to the subscriber.
        items: {type: string}
    output:
      description: The subscription's tags after the change.
      type: object

  list_subscription_updates:
    title: List bulk subscription updates
    description: >-
      Read the bulk subscription jobs and their progress -- the way to check
      whether an import from create_subscriptions_bulk finished and what it
      rejected.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /bulk_subscription_updates
      query:
        limit: "${limit}"
        page: "${page}"
    input:
      limit:
        type: integer
        description: Jobs per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of bulk update jobs.
      type: object

  create_subscription_export:
    title: Export subscriptions to a file
    description: >-
      Start an export of the subscriber list, optionally limited to one
      segment. beehiiv builds the file in the background; poll
      list_subscription_exports for the download url.
    category: subscriptions
    request:
      method: POST
      path: /exports/subscriptions
      body:
        variant: "${variant}"
        segment_id: "${segment_id}"
    input:
      variant:
        type: string
        description: '"full" for every column, "basic" for the short set.'
        enum: [full, basic]
      segment_id:
        type: string
        description: Only export the members of this segment, from list_segments.
        optional: true
    output:
      description: The queued export job.
      type: object

  list_subscription_exports:
    title: List subscription exports
    description: >-
      Read the subscriber exports and their status, including the download url
      once an export has finished building.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /exports/subscriptions
      query:
        limit: "${limit}"
        cursor: "${cursor}"
        page: "${page}"
    input:
      limit:
        type: integer
        description: Exports per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: Opaque cursor from a previous response.
        optional: true
      page:
        type: integer
        description: Page number, for the older offset paging.
        optional: true
        minimum: 1
    output:
      description: A page of export jobs.
      type: object

  create_data_deletion_request:
    title: Request erasure of a subscriber's data
    description: >-
      File a GDPR-style deletion request for an email address. This is an
      erasure, not an unsubscribe: beehiiv removes the person's data and it
      cannot be recovered.
    category: subscriptions
    destructive: true
    request:
      method: POST
      path: /data_privacy/deletion_requests
      body:
        email: "${email}"
    input:
      email:
        type: string
        description: Email address whose data should be erased.
        format: email
    output:
      description: The created deletion request.
      type: object

  # -- custom fields, segments, lists --------------------------------------

  list_custom_fields:
    title: List custom fields
    description: >-
      Read the publication's custom subscriber fields, with their ids and
      types. A custom field must exist here before create_subscription can set
      it.
    category: custom_fields
    read_only: true
    request:
      method: GET
      path: /custom_fields
    input: {}
    output:
      description: The publication's custom fields.
      type: object

  create_custom_field:
    title: Create a custom field
    description: >-
      Add a custom subscriber field. `kind` fixes the value type -- string,
      integer, boolean, date, datetime, list or double -- and cannot be changed
      afterwards.
    category: custom_fields
    request:
      method: POST
      path: /custom_fields
      body:
        kind: "${kind}"
        display: "${display}"
    input:
      kind:
        type: string
        description: The type of value the field stores.
        enum: [string, integer, boolean, date, datetime, list, double]
      display:
        type: string
        description: The field's display name, which is also how it is referenced when setting values.
    output:
      description: The created custom field.
      type: object

  update_custom_field:
    title: Rename a custom field
    description: >-
      Change a custom field's display name. Its `kind` is fixed at creation and
      cannot be edited.
    category: custom_fields
    request:
      method: PATCH
      path: /custom_fields/${custom_field_id}
      body:
        display: "${display}"
    input:
      custom_field_id:
        type: string
        description: The custom field's id, from list_custom_fields.
      display:
        type: string
        description: The field's new display name.
    output:
      description: The updated custom field.
      type: object

  delete_custom_field:
    title: Delete a custom field
    description: >-
      Delete a custom field and the values stored against every subscriber for
      it. Segments filtering on it stop working; there is no undo.
    category: custom_fields
    destructive: true
    request:
      method: DELETE
      path: /custom_fields/${custom_field_id}
    input:
      custom_field_id:
        type: string
        description: The custom field's id.
    output:
      description: Confirmation that the field was deleted.
      type: object

  list_segments:
    title: List segments
    description: >-
      Read the publication's segments with their type and last calculation
      status. Dynamic segments recalculate on their own; manual ones hold a
      fixed set.
    category: segments
    read_only: true
    request:
      method: GET
      path: /segments
      query:
        type: "${type}"
        status: "${status}"
        expand[]: "${expand}"
        order_by: "${order_by}"
        direction: "${direction}"
        limit: "${limit}"
        page: "${page}"
    input:
      type:
        type: string
        description: Only segments of this kind.
        optional: true
        enum: [dynamic, static, manual, all]
      status:
        type: string
        description: Only segments whose last calculation is in this state.
        optional: true
        enum: [pending, processing, completed, failed, all]
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"].
        optional: true
        items: {type: string}
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum: [created, last_calculated]
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      limit:
        type: integer
        description: Segments per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of segments.
      type: object

  get_segment:
    title: Get a segment
    description: Read one segment by its prefixed id, with its definition and last calculation.
    category: segments
    read_only: true
    request:
      method: GET
      path: /segments/${segment_id}
    input:
      segment_id:
        type: string
        description: The segment's prefixed id.
    output:
      description: The segment.
      type: object

  create_segment:
    title: Create a segment
    description: >-
      Create a segment from a list of subscriptions or email addresses.
      `input` is the segment definition -- e.g. {"subscriptions": [ids]} or
      {"emails": [addresses]} for a manual segment.
    category: segments
    request:
      method: POST
      path: /segments
      body:
        name: "${name}"
        input: "${input}"
    input:
      name:
        type: string
        description: A name unique within the publication.
      input:
        type: object
        description: >-
          The segment definition -- {"subscriptions": [...]} or {"emails":
          [...]} for a manual segment.
    output:
      description: The created segment.
      type: object

  recalculate_segment:
    title: Recalculate a segment
    description: >-
      Force a segment to recompute its membership now rather than waiting for
      beehiiv's own schedule. Worth doing before sending to it.
    category: segments
    request:
      method: PUT
      path: /segments/${segment_id}/recalculate
    input:
      segment_id:
        type: string
        description: The segment's prefixed id.
    output:
      description: The segment with its recalculation queued.
      type: object

  list_segment_members:
    title: List a segment's subscribers
    description: Read the subscribers currently in a segment, paginated.
    category: segments
    read_only: true
    request:
      method: GET
      path: /segments/${segment_id}/members
      query:
        expand[]: "${expand}"
        limit: "${limit}"
        page: "${page}"
    input:
      segment_id:
        type: string
        description: The segment's prefixed id.
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"].
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Subscribers per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of the segment's subscribers.
      type: object

  delete_segment:
    title: Delete a segment
    description: >-
      Delete a segment. The subscribers in it are untouched, but anything
      sending to the segment stops resolving.
    category: segments
    destructive: true
    request:
      method: DELETE
      path: /segments/${segment_id}
    input:
      segment_id:
        type: string
        description: The segment's prefixed id.
    output:
      description: Confirmation that the segment was deleted.
      type: object

  list_newsletter_lists:
    title: List newsletter lists
    description: >-
      Read the publication's newsletter lists -- the separate audiences a post
      can be sent to, each with its own sending identity and UTM defaults.
    category: newsletter_lists
    read_only: true
    request:
      method: GET
      path: /newsletter_lists
      query:
        limit: "${limit}"
        page: "${page}"
        direction: "${direction}"
    input:
      limit:
        type: integer
        description: Lists per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of newsletter lists.
      type: object

  create_newsletter_list:
    title: Create a newsletter list
    description: >-
      Create a newsletter list -- a separate audience within the publication.
      `auto_subscribe` decides whether new subscribers join it automatically.
    category: newsletter_lists
    request:
      method: POST
      path: /newsletter_lists
      body:
        name: "${name}"
        description: "${description}"
        slug: "${slug}"
        auto_subscribe: "${auto_subscribe}"
        utm_source: "${utm_source}"
        utm_medium: "${utm_medium}"
        utm_campaign: "${utm_campaign}"
    input:
      name:
        type: string
        description: The list's name.
      description:
        type: string
        description: What the list is for.
        optional: true
      slug:
        type: string
        description: Url slug for the list. Generated from the name when omitted.
        optional: true
      auto_subscribe:
        type: boolean
        description: Subscribe new signups to this list automatically.
        optional: true
      utm_source:
        type: string
        description: Default utm_source for links in posts sent to this list.
        optional: true
      utm_medium:
        type: string
        description: Default utm_medium for links in posts sent to this list.
        optional: true
      utm_campaign:
        type: string
        description: Default utm_campaign for links in posts sent to this list.
        optional: true
    output:
      description: The created newsletter list.
      type: object

  update_newsletter_list:
    title: Update a newsletter list
    description: >-
      Change a newsletter list's name, slug, auto-subscribe behaviour or
      status. Setting `status` to "archived" retires it without deleting.
    category: newsletter_lists
    request:
      method: PATCH
      path: /newsletter_lists/${newsletter_list_id}
      body:
        name: "${name}"
        description: "${description}"
        slug: "${slug}"
        auto_subscribe: "${auto_subscribe}"
        status: "${status}"
    input:
      newsletter_list_id:
        type: string
        description: The list's prefixed id.
      name:
        type: string
        description: New name.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      slug:
        type: string
        description: New url slug.
        optional: true
      auto_subscribe:
        type: boolean
        description: Whether new signups join automatically.
        optional: true
      status:
        type: string
        description: Set to "archived" to retire the list.
        optional: true
        enum: [active, archived]
    output:
      description: The updated newsletter list.
      type: object

  delete_newsletter_list:
    title: Delete a newsletter list
    description: >-
      Delete a newsletter list. Its members stay subscribed to the publication,
      but posts targeting the list lose their audience.
    category: newsletter_lists
    destructive: true
    request:
      method: DELETE
      path: /newsletter_lists/${newsletter_list_id}
    input:
      newsletter_list_id:
        type: string
        description: The list's prefixed id.
    output:
      description: Confirmation that the list was deleted.
      type: object

  subscribe_to_newsletter_list:
    title: Add a subscriber to a newsletter list
    description: >-
      Put an existing subscriber on a newsletter list, by subscription id or by
      email address -- one or the other is required.
    category: newsletter_lists
    request:
      method: POST
      path: /newsletter_lists/${newsletter_list_id}/subscriptions
      body:
        subscription_id: "${subscription_id}"
        email: "${email}"
    input:
      newsletter_list_id:
        type: string
        description: The list's prefixed id.
      subscription_id:
        type: string
        description: The subscription's prefixed id. Use this or `email`.
        optional: true
      email:
        type: string
        description: The subscriber's email address. Use this or `subscription_id`.
        optional: true
        format: email
    output:
      description: The created newsletter list subscription.
      type: object

  list_newsletter_list_subscriptions:
    title: List a newsletter list's subscribers
    description: Read who is subscribed to one newsletter list, cursor-paginated.
    category: newsletter_lists
    read_only: true
    request:
      method: GET
      path: /newsletter_lists/${newsletter_list_id}/subscriptions
      query:
        limit: "${limit}"
        cursor: "${cursor}"
        page: "${page}"
        direction: "${direction}"
    input:
      newsletter_list_id:
        type: string
        description: The list's prefixed id.
      limit:
        type: integer
        description: Subscribers per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: Opaque cursor from a previous response.
        optional: true
      page:
        type: integer
        description: Page number, for the older offset paging.
        optional: true
        minimum: 1
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of the list's subscribers.
      type: object

  unsubscribe_from_newsletter_list:
    title: Remove a subscriber from a newsletter list
    description: >-
      Unsubscribe one subscription from a newsletter list, leaving their
      publication subscription intact.
    category: newsletter_lists
    request:
      method: PATCH
      path: /newsletter_lists/${newsletter_list_id}/subscriptions/by_subscription_id/${subscription_id}
      body:
        unsubscribe: "${unsubscribe}"
    input:
      newsletter_list_id:
        type: string
        description: The list's prefixed id.
      subscription_id:
        type: string
        description: The subscription's prefixed id.
      unsubscribe:
        type: boolean
        description: True to take them off the list; false to put them back on it.
    output:
      description: The newsletter list subscription after the change.
      type: object

  # -- automations, tiers, polls, webhooks ---------------------------------

  list_automations:
    title: List automations
    description: >-
      Read the publication's automations, with the prefixed ids
      enrol_in_automation takes.
    category: automations
    read_only: true
    request:
      method: GET
      path: /automations
      query:
        limit: "${limit}"
        page: "${page}"
    input:
      limit:
        type: integer
        description: Automations per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of automations.
      type: object

  enrol_in_automation:
    title: Add a subscriber to an automation
    description: >-
      Start a subscriber on an automation journey, by subscription id or email.
      The automation's emails begin sending on its own schedule, so this
      reaches a real inbox.
    category: automations
    request:
      method: POST
      path: /automations/${automation_id}/journeys
      body:
        subscription_id: "${subscription_id}"
        email: "${email}"
        double_opt_override: "${double_opt_override}"
    input:
      automation_id:
        type: string
        description: The automation's prefixed id, from list_automations.
      subscription_id:
        type: string
        description: The subscription's prefixed id. Use this or `email`.
        optional: true
      email:
        type: string
        description: The subscriber's email address. Use this or `subscription_id`.
        optional: true
        format: email
      double_opt_override:
        type: string
        description: Override the publication's double opt-in setting for this enrolment.
        optional: true
    output:
      description: The created automation journey.
      type: object

  list_automation_journeys:
    title: List an automation's journeys
    description: >-
      Read who is on an automation and how far through they are. `status` of
      "in_progress" is the live cohort.
    category: automations
    read_only: true
    request:
      method: GET
      path: /automations/${automation_id}/journeys
      query:
        status: "${status}"
        limit: "${limit}"
        page: "${page}"
    input:
      automation_id:
        type: string
        description: The automation's prefixed id.
      status:
        type: string
        description: Only journeys in this state.
        optional: true
        enum: [in_progress, completed, exited_early, all]
      limit:
        type: integer
        description: Journeys per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of automation journeys.
      type: object

  list_tiers:
    title: List paid tiers
    description: >-
      Read the publication's premium tiers and their prices, with the ids a
      subscription's `premium_tier_ids` takes.
    category: tiers
    read_only: true
    request:
      method: GET
      path: /tiers
      query:
        expand[]: "${expand}"
        limit: "${limit}"
        page: "${page}"
        direction: "${direction}"
    input:
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"].
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Tiers per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of tiers.
      type: object

  create_tier:
    title: Create a paid tier
    description: >-
      Create a premium tier. `prices` sets what it costs -- each entry needs a
      currency, an `amount_cents` and an interval ("month", "quarter", "year",
      "one_time" or "donation").
    category: tiers
    request:
      method: POST
      path: /tiers
      body:
        name: "${name}"
        description: "${description}"
        prices_attributes: "${prices}"
    input:
      name:
        type: string
        description: The tier's name, as subscribers see it.
      description:
        type: string
        description: What the tier includes.
        optional: true
      prices:
        type: array
        description: >-
          Prices for the tier, each {"currency": "usd", "amount_cents": 500,
          "interval": "month"}.
        optional: true
        items: {type: object}
    output:
      description: The created tier.
      type: object

  update_tier:
    title: Update a paid tier
    description: >-
      Change a tier's name, description or prices. A price entry needs its `id`
      to be edited, and carries `"delete": true` to be removed -- so read the
      tier first.
    category: tiers
    request:
      method: PATCH
      path: /tiers/${tier_id}
      body:
        name: "${name}"
        description: "${description}"
        prices_attributes: "${prices}"
    input:
      tier_id:
        type: string
        description: The tier's prefixed id.
      name:
        type: string
        description: New name.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      prices:
        type: array
        description: >-
          Price changes, each with the price's `id` plus the fields to change,
          or {"id": ..., "delete": true} to remove one.
        optional: true
        items: {type: object}
    output:
      description: The updated tier.
      type: object

  list_polls:
    title: List polls
    description: >-
      Read the polls embedded in the publication's posts, optionally with their
      result stats.
    category: polls
    read_only: true
    request:
      method: GET
      path: /polls
      query:
        post_id: "${post_id}"
        expand[]: "${expand}"
        order_by: "${order_by}"
        direction: "${direction}"
        limit: "${limit}"
        cursor: "${cursor}"
        page: "${page}"
    input:
      post_id:
        type: string
        description: Only polls embedded in this post.
        optional: true
      expand:
        type: array
        description: Extra data to include, e.g. ["stats"].
        optional: true
        items: {type: string}
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum: [created, name]
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      limit:
        type: integer
        description: Polls per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: Opaque cursor from a previous response.
        optional: true
      page:
        type: integer
        description: Page number, for the older offset paging.
        optional: true
        minimum: 1
    output:
      description: A page of polls.
      type: object

  list_poll_responses:
    title: List a poll's responses
    description: >-
      Read the individual answers to one poll, including which post each came
      through. The raw data behind a poll's percentages.
    category: polls
    read_only: true
    request:
      method: GET
      path: /polls/${poll_id}/responses
      query:
        post_id: "${post_id}"
        expand[]: "${expand}"
        direction: "${direction}"
        limit: "${limit}"
        cursor: "${cursor}"
        page: "${page}"
    input:
      poll_id:
        type: string
        description: The poll's prefixed id.
      post_id:
        type: string
        description: Only responses collected through this post.
        optional: true
      expand:
        type: array
        description: Extra data to include, e.g. ["post"].
        optional: true
        items: {type: string}
      direction:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      limit:
        type: integer
        description: Responses per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: Opaque cursor from a previous response.
        optional: true
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: A page of poll responses.
      type: object

  get_referral_program:
    title: Get the referral program
    description: >-
      Read the publication's referral program -- its milestones and rewards --
      which is what a subscriber's referral count is measured against.
    category: publication
    read_only: true
    request:
      method: GET
      path: /referral_program
      query:
        limit: "${limit}"
        page: "${page}"
    input:
      limit:
        type: integer
        description: Milestones per page.
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
    output:
      description: The referral program and its milestones.
      type: object

  list_webhooks:
    title: List webhooks
    description: >-
      Read the publication's webhook endpoints with the event types each
      listens for.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /webhooks
      query:
        limit: "${limit}"
    input:
      limit:
        type: integer
        description: Webhooks per page (1-100).
        optional: true
        minimum: 1
        maximum: 100
    output:
      description: A page of webhook endpoints.
      type: object

  create_webhook:
    title: Create a webhook
    description: >-
      Register an endpoint for beehiiv events. `event_types` names what to
      deliver, e.g. ["subscription.created", "post.sent"].
    category: webhooks
    request:
      method: POST
      path: /webhooks
      body:
        url: "${url}"
        event_types: "${event_types}"
        description: "${description}"
    input:
      url:
        type: string
        description: HTTPS endpoint beehiiv should POST events to.
      event_types:
        type: array
        description: Event types to receive, e.g. ["subscription.created", "post.sent"].
        items: {type: string}
      description:
        type: string
        description: A label for the endpoint.
        optional: true
    output:
      description: The created webhook endpoint.
      type: object

  update_webhook:
    title: Update a webhook
    description: Change a webhook endpoint's url, description or subscribed event types.
    category: webhooks
    request:
      method: PATCH
      path: /webhooks/${endpoint_id}
      body:
        url: "${url}"
        event_types: "${event_types}"
        description: "${description}"
    input:
      endpoint_id:
        type: string
        description: The webhook endpoint's id, from list_webhooks.
      url:
        type: string
        description: New endpoint url.
        optional: true
      event_types:
        type: array
        description: The complete list of event types after the update.
        optional: true
        items: {type: string}
      description:
        type: string
        description: New label.
        optional: true
    output:
      description: The updated webhook endpoint.
      type: object

  delete_webhook:
    title: Delete a webhook
    description: >-
      Remove a webhook endpoint. Deliveries stop immediately and missed events
      are not replayed.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /webhooks/${endpoint_id}
    input:
      endpoint_id:
        type: string
        description: The webhook endpoint's id.
    output:
      description: Confirmation that the webhook was deleted.
      type: object
