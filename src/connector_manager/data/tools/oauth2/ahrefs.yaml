  list_gsc_anonymous_queries:
    title: List anonymous queries
    description: >-
      Estimate the queries Google Search Console hides as anonymous for a project, from Ahrefs'
      own keyword data. Metered: API units per row and per column selected, 50 minimum.
    category: search_console
    read_only: true
    request:
      method: GET
      path: /v3/gsc/anonymous-queries
      query:
        limit: ${limit}
        order_by: ${order_by}
        where: ${where}
        select: ${select}
        project_id: ${project_id}
        date_from: ${date_from}
        country: ${country}
    input:
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      order_by:
        type: string
        description: Comma-separated columns to sort by, each with optional :asc or :desc,
          e.g. cpc:desc. Any selectable column works.
        optional: true
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: keyword, url.'
        optional: true
      select:
        type: string
        description: 'Comma-separated columns to return; request only what you need, since
          columns set the unit cost. Valid: cpc, keyword, keyword_country, keyword_difficulty
          (10 units), position, position_kind, traffic (10 units), url, volume (10 units).'
      project_id:
        type: integer
        description: Ahrefs project id with Google Search Console connected.
      date_from:
        type: string
        description: The start date of the historical period in YYYY-MM-DD format.
      country:
        type: string
        description: Two-letter ISO 3166-1 alpha-2 country code, lowercase, e.g. us.
    output:
      description: Estimated anonymous queries.
      type: array
      items:
        type: object
      response_path: keywords

