# Azure Monitor Logs tools -- KQL against a Log Analytics workspace.
#
# One endpoint carries almost the whole surface:
# `POST /v1/workspaces/{workspaceId}/query` takes a KQL query and returns
# tables. The workspace id comes from the connection, so no tool takes it as an
# argument -- this connector is pinned to one workspace, and cross-workspace
# queries reach others by naming them in `additional_workspaces`.
#
# This is the same query language as Azure Data Explorer, over a different
# store. What differs is the data: Log Analytics holds `AzureActivity`,
# `AppTraces`, `ContainerLogV2`, `SigninLogs`, `Heartbeat` and whatever the
# workspace's data sources send it. get_metadata is how you find out which of
# those exist here rather than guessing.
#
# ## timespan is not optional in practice
#
# `timespan` is an ISO 8601 duration (`PT1H`, `P7D`) or a start/end pair
# separated by a slash. Omitting it queries ALL retained data -- which on a
# busy workspace means scanning months of telemetry, taking a long time and
# then failing on the service's own limits.
#
# When the query itself also filters on time, Azure applies the intersection of
# the two, so a `timespan` narrower than the query's own filter wins.
#
# ## The result shape
#
# A response has `tables`, each with `name`, `columns` (name and type) and
# `rows` (positional lists). `tables[0]` is normally what you want. Errors
# come back as a 200 with an `error` object in some cases, so check for one
# rather than trusting the status alone.
#
# ## Limits worth knowing before hitting them
#
# The query API caps results at 500,000 rows and about 100 MB, and a query at
# 10 minutes by default -- raise the latter with `server_timeout`, up to 10
# minutes. `| summarize` in the query is almost always cheaper than pulling
# rows out and aggregating them locally.
#
# ## Read-only by construction
#
# Nothing here writes. The query API cannot ingest, delete or modify log data;
# ingestion goes through data collection rules and a different endpoint
# entirely. Every tool in this pack is therefore marked read_only.
#
# The credential is a service principal with `https://api.loganalytics.io/.default`
# and needs a Log Analytics Reader role on the workspace -- Azure RBAC, not
# token scopes -- so no tool declares scopes.
#
# Docs: https://learn.microsoft.com/azure/azure-monitor/logs/api/overview

connector_id: azure-monitor-logs
display_name: Azure Monitor Logs
docs_url: https://learn.microsoft.com/azure/azure-monitor/logs/api/overview

tools:

  query_logs:
    title: Run a KQL query against the workspace
    description: >-
      Execute a Kusto query against the connected Log Analytics workspace and
      return its tables. This is the tool this connector exists for.

      Always pass `timespan`. Without it the query runs against every day of
      retained data, which on a real workspace is slow, expensive and usually
      hits a limit rather than returning. `PT1H` is the last hour, `P7D` the
      last week, and `2026-01-01T00:00:00Z/2026-01-02T00:00:00Z` an explicit
      window.

      Use `| summarize` and `| take` in the query rather than pulling raw rows
      out: the service caps a response at roughly 500,000 rows and 100 MB, and
      aggregating in KQL is far cheaper than aggregating afterwards.

      `additional_workspaces` runs the same query across other workspaces as
      well, addressed by workspace id, resource id or name.

      The result is in `tables[0]`, as `columns` and positional `rows`.
    category: query
    read_only: true
    notes: Omitting timespan scans all retained data. Results are capped at about 500,000 rows and 100 MB.
    request:
      method: POST
      path: /v1/workspaces/${connectionConfig.workspaceId}/query
      headers:
        Prefer: "${prefer}"
      body:
        query: "${query}"
        timespan: "${timespan}"
        workspaces: "${additional_workspaces}"
    input:
      query:
        type: string
        description: >-
          The KQL query. Table names are case-sensitive; get_metadata lists the
          tables this workspace actually has.
        example: AzureActivity | summarize count() by Category
      timespan:
        type: string
        description: >-
          The window to query, as an ISO 8601 duration (PT1H, P7D) or a
          start/end pair separated by a slash. Omitting it scans everything
          retained.
        optional: true
        example: PT12H
      additional_workspaces:
        type: array
        description: >-
          Other workspaces to include in the query, by workspace id, ARM
          resource id or name. The connected workspace is always included.
        optional: true
        items: {type: string}
      prefer:
        type: string
        description: >-
          Server hints, most usefully a longer timeout:
          "wait=600" raises the query timeout to 600 seconds, and
          "include-statistics=true" adds execution statistics to the response.
        optional: true
        example: wait=600
    output:
      description: The query result as tables of columns and positional rows.
      type: object
      properties:
        tables: {type: array, description: "Each with name, columns (name and type) and rows (positional lists). tables[0] is the query's own result."}
        error: {type: object, description: "Present when the query failed; carries code, message and details."}
        statistics: {type: object, description: "Execution statistics, when include-statistics was requested via Prefer."}

  query_logs_get:
    title: Run a short KQL query via the query string
    description: >-
      The same query, sent as URL parameters instead of a JSON body. Equivalent
      to query_logs and subject to the same limits, but bounded by URL length,
      so it only suits short queries.

      Worth having because it is the form most Azure CLI and PowerShell examples
      use, which makes a query copied from documentation easier to reproduce
      exactly. Prefer query_logs for anything longer than a line.
    category: query
    read_only: true
    notes: Bounded by URL length. Use query_logs for anything but a short query.
    request:
      method: GET
      path: /v1/workspaces/${connectionConfig.workspaceId}/query
      query:
        query: "${query}"
        timespan: "${timespan}"
    input:
      query:
        type: string
        description: The KQL query. Keep it short -- it goes in the URL.
        example: Heartbeat | summarize count() by Computer
      timespan:
        type: string
        description: The window to query, as an ISO 8601 duration or a start/end pair.
        optional: true
        example: PT1H
    output:
      description: The query result as tables of columns and positional rows.
      type: object
      properties:
        tables: {type: array, description: "Each with name, columns and rows."}
        error: {type: object, description: "Present when the query failed."}

  get_metadata:
    title: List the tables, functions and solutions in the workspace
    description: >-
      Everything the workspace knows about itself: the tables it holds with
      their columns and types, the saved functions available to queries, the
      solutions installed, the resources sending data, and the categories those
      tables fall into.

      This is the tool to call before writing a query against an unfamiliar
      workspace. Log Analytics table names are case-sensitive and vary by which
      data sources are configured -- `ContainerLogV2` exists only where
      Container Insights is on, `SigninLogs` only where Entra ID diagnostics
      are exported -- so guessing a table name is how most queries fail.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/workspaces/${connectionConfig.workspaceId}/metadata
    input: {}
    output:
      description: The workspace's schema and everything queryable in it.
      type: object
      properties:
        tables: {type: array, description: "Each table with its name, columns (name and type), description and the solutions it belongs to."}
        functions: {type: array, description: "Saved functions, each with its name, body and parameters."}
        solutions: {type: array, description: "Installed monitoring solutions and the tables each contributes."}
        resources: {type: array, description: "Azure resources sending data to this workspace."}
        categories: {type: array, description: "The categories the tables are grouped under in the portal."}

  query_logs_batch:
    title: Run several KQL queries in one request
    description: >-
      Submit up to 100 queries in a single call and get all their results back
      together, each identified by the `id` you gave it. Much faster than
      issuing them one at a time when building a dashboard or a report, because
      it costs one round trip instead of one per query.

      Each entry in `requests` is
      `{"id": "1", "workspace": "<workspace-id>", "body": {"query": "...",
      "timespan": "PT1H"}}`. The `workspace` field is required on every entry
      even when it is the connected workspace.

      Responses come back in `responses`, in no guaranteed order, each with its
      `id` and either a `body` holding tables or an error. One query failing
      does not fail the batch, so check each response.
    category: query
    read_only: true
    notes: Up to 100 queries per batch. A failure in one query does not fail the others -- check each response.
    request:
      method: POST
      path: /v1/$batch
      body:
        requests: "${requests}"
    input:
      requests:
        type: array
        description: >-
          The queries, each
          {"id": "1", "workspace": "<workspace-id>", "body": {"query": "...",
          "timespan": "PT1H"}}. Up to 100 entries.
        items: {type: object}
    output:
      description: One response per query, keyed by the id you supplied.
      type: object
      properties:
        responses: {type: array, description: "Each with id, status and either body.tables or an error object."}
