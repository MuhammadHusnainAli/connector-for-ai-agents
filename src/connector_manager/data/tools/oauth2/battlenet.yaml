# Battle.net tools -- World of Warcraft profile and game data.
#
# The connection carries the API host (`us.api.blizzard.com`,
# `eu.api.blizzard.com`, and so on) in its base url, so paths here start at
# `/profile` or `/data`. Three things decide whether a call works, and none of
# them are optional knowledge:
#
#   * **every endpoint needs a `namespace`, and it is region-suffixed.** The
#     prefix is fixed by the endpoint -- `profile` for character and account
#     data, `dynamic` for realms, auctions and leaderboards, `static` for the
#     game's reference data -- and the region comes from *your* connection's
#     host. The tools below take a `region` argument and build the namespace
#     for you, so pass the region matching the api domain the connection uses;
#   * **the account tools need a *user* token.** `/profile/user/wow` and its
#     collections read the signed-in player's own account, so they require the
#     `wow.profile` scope from the authorization-code flow. Character, realm
#     and reference data work with any valid token;
#   * **realm and character names are slugs.** `realm_slug` is the
#     lower-cased, hyphenated realm ("tarren-mill", not "Tarren Mill"), and
#     character names must be lower case. Blizzard 404s on anything else.
#
# `locale` is optional everywhere and decides the language of names in the
# response; leave it out and you get every localisation.
#
# Docs: https://develop.battle.net/documentation/world-of-warcraft

connector_id: battlenet
display_name: Battle.net
docs_url: https://develop.battle.net/documentation/world-of-warcraft

tools:

  # -- the signed-in player's account --------------------------------------

  get_wow_account_profile:
    title: Get my WoW account profile
    description: >-
      Read the signed-in player's World of Warcraft account -- every character
      on it, with realm, level and class. The starting point for anything
      about "my characters", and the only way to enumerate them. Needs a user
      token with the wow.profile scope.
    category: account
    scopes: [wow.profile]
    read_only: true
    request:
      method: GET
      path: /profile/user/wow
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: >-
          Region of the connection's api domain -- "us" for us.api.blizzard.com,
          "eu" for eu.api.blizzard.com, and so on. It suffixes the namespace.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names, e.g. "en_US". Omit for all localisations.
        optional: true
    output:
      description: The account's WoW characters, grouped by account.
      type: object
      properties:
        wow_accounts: {type: array, description: "Each with a `characters` array."}

  get_wow_account_collections:
    title: Get my collections index
    description: >-
      Read which collection types the signed-in player's account has -- mounts,
      pets, toys, heirlooms, transmogs -- with the link to each. Needs the
      wow.profile scope.
    category: account
    scopes: [wow.profile]
    read_only: true
