  list_webhooks:
    title: List webhooks
    description: >-
      List the webhooks registered for the company.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /Webhooks
    input: {}
    output:
      description: The webhooks.
      type: array
      items:
        type: object

  register_webhook:
    title: Register a webhook
    description: >-
      Register a URL to be called when customers, contacts, products, quotes or invoices are
      created, updated or deleted.
    category: webhooks
    request:
      method: POST
      path: /Webhooks
      body:
        name: ${name}
        secretKey: ${secret_key}
        types: ${types}
        url: ${url}
    input:
      name:
        type: string
        description: Name for the webhook.
      secret_key:
        type: string
        description: Secret used to sign the calls.
        optional: true
      types:
        type: array
        description: Events to receive, e.g. InvoiceCreated, CustomerUpdated, QuoteDeleted.
        items:
          type: string
          enum:
          - CustomerCreated
          - CustomerUpdated
          - CustomerDeleted
          - ContactCreated
          - ContactUpdated
          - ContactDeleted
          - ProductCreated
          - ProductUpdated
          - ProductDeleted
          - QuoteCreated
          - QuoteUpdated
          - QuoteDeleted
          - InvoiceCreated
          - InvoiceUpdated
          - InvoiceDeleted
      url:
        type: string
        description: URL Altoviz calls.
    output:
      description: The webhook.
      type: object

  unregister_webhook:
    title: Unregister a webhook
    description: >-
      Remove a webhook, identified by its id or its URL.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /Webhooks
      query:
        id: ${id}
        url: ${url}
    input:
      id:
        type: integer
        description: Webhook id.
        optional: true
      url:
        type: string
        description: Webhook URL.
        optional: true
    output:
      description: Empty on success.
      type: object
