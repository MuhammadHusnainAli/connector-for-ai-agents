# Connector definitions: OAUTH1 auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
garmin:
  auth_mode: OAUTH1
  authorization_url: https://connect.garmin.com/oauthConfirm
  categories:
  - sports
  display_name: Garmin
  proxy:
    base_url: https://apis.garmin.com
  request_url: https://connectapi.garmin.com/oauth-service/oauth/request_token
  signature_method: HMAC-SHA1
  token_url: https://connectapi.garmin.com/oauth-service/oauth/access_token
smugmug:
  auth_mode: OAUTH1
  authorization_url: https://api.smugmug.com/services/oauth/1.0a/authorize
  categories:
  - storage
  display_name: Smugmug
  proxy:
    base_url: https://www.smugmug.com
  request_url: https://api.smugmug.com/services/oauth/1.0a/getRequestToken
  scope_separator: ','
  signature_method: PLAINTEXT
  token_url: https://api.smugmug.com/services/oauth/1.0a/getAccessToken
trello:
  auth_mode: OAUTH1
  authorization_params:
    expiration: never
  authorization_url: https://trello.com/1/OAuthAuthorizeToken
  categories:
  - productivity
  - ticketing
  display_name: Trello
  proxy:
    base_url: https://api.trello.com
  request_url: https://trello.com/1/OAuthGetRequestToken
  scope_separator: ','
  signature_method: HMAC-SHA1
  token_url: https://trello.com/1/OAuthGetAccessToken
twitter:
  auth_mode: OAUTH1
  authorization_url: https://api.twitter.com/oauth/authorize
  categories:
  - marketing
  - social
  display_name: Twitter (v1)
  proxy:
    base_url: https://api.twitter.com
  request_params:
    x_auth_access_type: write
  request_url: https://api.twitter.com/oauth/request_token
  signature_method: HMAC-SHA1
  token_url: https://api.twitter.com/oauth/access_token
