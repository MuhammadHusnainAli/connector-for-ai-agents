# Anthropic tools -- the Claude API's data plane.
#
# This connector holds a regular API key (`sk-ant-api...`) and drives the
# surface that *does the work*: messages, batches, models, files, skills and
# Managed Agents. Organization administration -- members, workspaces, API keys,
# usage and cost -- is a different credential entirely and lives on the
# `anthropic-admin` connector. An admin key is rejected here and a regular key
# is rejected there; that is deliberate on Anthropic's side, not a
# misconfiguration.
#
# The connection already sends `x-api-key`, `content-type: application/json`
# and the `anthropic-version` header from the connection's own config, so no
# tool below sets them. Beta features that need `anthropic-beta` set it
# per-tool; that is why the Managed Agents tools carry a header block and the
# rest do not.
#
# Three things worth knowing before driving this:
#
#   * **`create_message` is the whole API.** Tool use, structured outputs,
#     extended thinking, citations, documents and server-side tools are all
#     parameters of that one endpoint, not separate endpoints. If you are
#     looking for a `/v1/tools` or `/v1/thinking`, it does not exist;
#   * **batches are cheaper and asynchronous.** `create_message_batch` takes
#     up to 100,000 requests at half price and can take up to 24 hours;
#     results come back in *any* order, so match them by the `custom_id` you
#     set, never by position;
#   * **file upload is multipart**, which this JSON proxy cannot construct, so
#     there is no upload tool below. Files uploaded elsewhere are fully
#     readable and deletable here by id.
#
# Model ids are plain strings with no date suffix (`claude-opus-5`, not
# `claude-opus-5-20260401`); `list_models` is the authoritative list, along with
# each model's context window and output cap.
#
# Docs: https://platform.claude.com/docs/en/api

connector_id: anthropic
display_name: Anthropic
docs_url: https://platform.claude.com/docs/en/api

tools:

  # -- messages -------------------------------------------------------------

  create_message:
    title: Send a message to Claude
    description: >-
      Call the Messages API -- the endpoint behind essentially everything
      Claude does. `messages` is the conversation so far and `max_tokens` caps
      the reply. Everything else is a parameter of this same call: `tools` for
      tool use and server-side tools, `output_config` for structured outputs
      and effort, `thinking` for extended thinking, `system` for the system
      prompt. Set `stream` false unless the caller can consume SSE, since this
      proxy returns one response.
    category: messages
    request:
      method: POST
      path: /v1/messages
      body:
        model: "${model}"
        max_tokens: "${max_tokens}"
        messages: "${messages}"
        system: "${system}"
        tools: "${tools}"
        tool_choice: "${tool_choice}"
        thinking: "${thinking}"
        output_config: "${output_config}"
        stop_sequences: "${stop_sequences}"
        metadata: "${metadata}"
        service_tier: "${service_tier}"
        container: "${container}"
        inference_geo: "${inference_geo}"
        stream: "${stream}"
    input:
      model:
        type: string
        description: The model id, e.g. "claude-opus-5". No date suffix -- see list_models for what is available.
        example: claude-opus-5
      max_tokens:
        type: integer
        description: Maximum tokens to generate. Hitting this truncates the reply mid-thought, so do not lowball it.
        minimum: 1
      messages:
        type: array
        description: 'The conversation, each entry {"role": "user"|"assistant", "content": ...}. Content may be a string or an array of blocks.'
        items: {type: object}
      system:
        type: string
        description: The system prompt. May also be sent as an array of text blocks for per-block cache control.
        optional: true
      tools:
        type: array
        description: Tool definitions Claude may call, including Anthropic's server-side tools such as web search and code execution.
        optional: true
        items: {type: object}
      tool_choice:
        type: string
        description: 'How Claude should pick a tool, e.g. {"type": "auto"}. Note that forced tool choice is rejected on some models.'
        optional: true
      thinking:
        type: object
        description: 'Extended thinking config. On current models this is {"type": "adaptive"}; budget_tokens is rejected.'
        optional: true
      output_config:
        type: object
        description: 'Output shaping -- {"effort": "low".."max"} and {"format": {...}} for structured outputs.'
        optional: true
      stop_sequences:
        type: array
        description: Strings that stop generation when produced.
        optional: true
        items: {type: string}
      metadata:
        type: object
        description: 'Request metadata, notably {"user_id": "..."} for abuse tracking.'
        optional: true
      service_tier:
        type: string
        description: Which capacity tier to use.
        optional: true
        enum: [auto, standard_only]
      container:
        type: object
        description: Container config for code execution and Agent Skills.
        optional: true
      inference_geo:
        type: string
        description: Where inference should run, for data residency, e.g. "us".
        optional: true
      stream:
        type: boolean
        description: Stream the response as SSE. Leave false when the caller wants one JSON body.
        optional: true
    output:
      description: The assistant's reply -- content blocks, stop reason and token usage.
      type: object
      properties:
        id: {type: string}
        model: {type: string}
        content: {type: array, description: "text, thinking, tool_use and server-tool result blocks."}
        stop_reason: {type: string, description: "end_turn, max_tokens, tool_use, pause_turn or refusal."}
        stop_details: {type: object, description: "Populated only when stop_reason is refusal."}
        usage: {type: object, description: "input, output and cache token counts."}

  count_message_tokens:
    title: Count the tokens a request would use
    description: >-
      Count how many input tokens a Messages request would consume, without
      running it or being billed for generation. The right way to size a prompt
      or a document against a model's context window -- never estimate with a
      third-party tokenizer, since Claude's differs by model generation.
    category: messages
    read_only: true
    request:
      method: POST
      path: /v1/messages/count_tokens
      body:
        model: "${model}"
        messages: "${messages}"
        system: "${system}"
        tools: "${tools}"
        thinking: "${thinking}"
    input:
      model:
        type: string
        description: The model to count for. Counts differ between model generations.
        example: claude-opus-5
      messages:
        type: array
        description: The conversation to count.
        items: {type: object}
      system:
        type: string
        description: The system prompt, which counts toward the input.
        optional: true
      tools:
        type: array
        description: Tool definitions, which also count toward the input.
        optional: true
        items: {type: object}
      thinking:
        type: object
        description: Thinking config, since it can affect the counted input.
        optional: true
    output:
      description: The input token count for that request.
      type: object
      properties:
        input_tokens: {type: integer}

  # -- message batches ------------------------------------------------------

  create_message_batch:
    title: Create a message batch
    description: >-
      Submit up to 100,000 Messages requests to run asynchronously at half
      price. Each entry pairs a `custom_id` you choose with the same params
      `create_message` takes. Processing starts immediately and can take up to
      24 hours; poll get_message_batch until processing_status is "ended".
    category: batches
    request:
      method: POST
      path: /v1/messages/batches
      body:
        requests: "${requests}"
    input:
      requests:
        type: array
        description: 'The batch entries, each {"custom_id": "...", "params": {<Messages API params>}}. custom_id must be unique within the batch.'
        items:
          type: object
          properties:
            custom_id: {type: string}
            params: {type: object}
    output:
      description: The created batch and its processing status.
      type: object
      properties:
        id: {type: string}
        processing_status: {type: string}
        request_counts: {type: object}

  list_message_batches:
    title: List message batches
    description: >-
      Page through the message batches in the workspace, newest first, with
      each one's processing status and request counts. Use it to find a batch
      id you did not keep, or to see what is still in flight.
    category: batches
    read_only: true
    request:
      method: GET
      path: /v1/messages/batches
      query:
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
    input:
      limit:
        type: integer
        description: How many batches per page (1-1000).
        optional: true
        default: 20
        minimum: 1
        maximum: 1000
      before_id:
        type: string
        description: Return the page immediately before this batch id.
        optional: true
      after_id:
        type: string
        description: Return the page immediately after this batch id.
        optional: true
    output:
      description: A page of message batches.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}
        last_id: {type: string}

  get_message_batch:
    title: Get a message batch
    description: >-
      Fetch one batch's status and counts. Poll this until
      `processing_status` is "ended", then read the outputs with
      get_message_batch_results -- the results url is not populated before
      then.
    category: batches
    read_only: true
    request:
      method: GET
      path: /v1/messages/batches/${message_batch_id}
    input:
      message_batch_id:
        type: string
        description: The batch id returned when it was created.
    output:
      description: The batch's status, counts and results url.
      type: object
      properties:
        id: {type: string}
        processing_status: {type: string}
        request_counts: {type: object}
        results_url: {type: string}
        ended_at: {type: string}

  get_message_batch_results:
    title: Get a message batch's results
    description: >-
      Stream back a finished batch's results as JSONL, one line per request.
      Results arrive in arbitrary order, so key them by `custom_id` rather than
      position, and check each line's `result.type` -- succeeded, errored,
      canceled or expired -- before reading its message.
    category: batches
    read_only: true
    request:
      method: GET
      path: /v1/messages/batches/${message_batch_id}/results
    input:
      message_batch_id:
        type: string
        description: The batch id. The batch must have ended.
    output:
      description: JSONL results, one per request, keyed by custom_id.
      type: object

  cancel_message_batch:
    title: Cancel a message batch
    description: >-
      Ask Anthropic to stop processing a batch. Cancellation is not instant --
      requests already in flight may still complete and be billed, so the final
      result set can contain a mix of succeeded and canceled entries.
    category: batches
    destructive: true
    request:
      method: POST
      path: /v1/messages/batches/${message_batch_id}/cancel
    input:
      message_batch_id:
        type: string
        description: The batch id to cancel.
    output:
      description: The batch with its cancellation initiated.
      type: object
      properties:
        id: {type: string}
        processing_status: {type: string}
        cancel_initiated_at: {type: string}

  delete_message_batch:
    title: Delete a message batch
    description: >-
      Permanently delete a batch and its results. Only a batch that has already
      ended can be deleted, and the results are unrecoverable afterwards --
      download them first if they matter.
    category: batches
    destructive: true
    request:
      method: DELETE
      path: /v1/messages/batches/${message_batch_id}
    input:
      message_batch_id:
        type: string
        description: The batch id to delete. It must have ended.
    output:
      description: Confirmation that the batch was deleted.
      type: object
      properties:
        id: {type: string}
        type: {type: string}

  # -- models ---------------------------------------------------------------

  list_models:
    title: List available models
    description: >-
      The models this API key can call, newest first, each with its display
      name, context window (`max_input_tokens`), output cap (`max_tokens`) and
      capabilities. This is the live answer to "which model should I use" --
      prefer it over any hard-coded list, which goes stale.
    category: models
    read_only: true
    request:
      method: GET
      path: /v1/models
      query:
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
    input:
      limit:
        type: integer
        description: How many models per page (1-1000).
        optional: true
        default: 20
        minimum: 1
        maximum: 1000
      before_id:
        type: string
        description: Return the page immediately before this model id.
        optional: true
      after_id:
        type: string
        description: Return the page immediately after this model id.
        optional: true
    output:
      description: A page of available models.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}

  get_model:
    title: Get a model
    description: >-
      One model's details -- display name, creation date, context window,
      output cap and capabilities. Use it to check whether a specific model
      supports a feature before sending a request that would 400.
    category: models
    read_only: true
    request:
      method: GET
      path: /v1/models/${model_id}
    input:
      model_id:
        type: string
        description: The model id, e.g. "claude-opus-5".
        example: claude-opus-5
    output:
      description: The model's metadata and capabilities.
      type: object
      properties:
        id: {type: string}
        display_name: {type: string}
        max_input_tokens: {type: integer}
        max_tokens: {type: integer}
        capabilities: {type: object}

  # -- files ----------------------------------------------------------------

  list_files:
    title: List uploaded files
    description: >-
      Page through the files in the workspace, with each one's filename, mime
      type and size. File ids from here are what a Messages request references
      as {"type": "document", "source": {"type": "file", "file_id": "..."}}.
      Uploading is multipart and is not available through this connector.
    category: files
    read_only: true
    request:
      method: GET
      path: /v1/files
      query:
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
    input:
      limit:
        type: integer
        description: How many files per page (1-1000).
        optional: true
        default: 20
        minimum: 1
        maximum: 1000
      before_id:
        type: string
        description: Return the page immediately before this file id.
        optional: true
      after_id:
        type: string
        description: Return the page immediately after this file id.
        optional: true
    output:
      description: A page of uploaded files.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}

  get_file_metadata:
    title: Get a file's metadata
    description: >-
      One file's filename, mime type, size and creation time -- without
      downloading its contents. The mime type matters: a document block and an
      image block are not interchangeable, and the content block type must
      match the file's type.
    category: files
    read_only: true
    request:
      method: GET
      path: /v1/files/${file_id}
    input:
      file_id:
        type: string
        description: The file id.
    output:
      description: The file's metadata.
      type: object
      properties:
        id: {type: string}
        filename: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}

  get_file_content:
    title: Download a file's contents
    description: >-
      Fetch the raw bytes of an uploaded file. Returns the file itself rather
      than JSON, so expect binary content for PDFs and images.
    category: files
    read_only: true
    request:
      method: GET
      path: /v1/files/${file_id}/content
    input:
      file_id:
        type: string
        description: The file id to download.
    output:
      description: The file's raw contents.
      type: object

  delete_file:
    title: Delete a file
    description: >-
      Permanently remove an uploaded file. Any stored conversation that
      referenced it by file_id will fail on replay, so check nothing depends on
      it first.
    category: files
    destructive: true
    request:
      method: DELETE
      path: /v1/files/${file_id}
    input:
      file_id:
        type: string
        description: The file id to delete.
    output:
      description: Confirmation that the file was deleted.
      type: object
      properties:
        id: {type: string}
        type: {type: string}

  # -- skills ---------------------------------------------------------------

  list_skills:
    title: List Agent Skills
    description: >-
      The Agent Skills available to this workspace. A skill is referenced from
      a Messages request through `container.skills` alongside the code
      execution tool -- this is how Claude produces .pptx, .xlsx and similar
      artefacts.
    category: skills
    read_only: true
    request:
      method: GET
      path: /v1/skills
      query:
        limit: "${limit}"
        after_id: "${after_id}"
    input:
      limit:
        type: integer
        description: How many skills per page.
        optional: true
        minimum: 1
      after_id:
        type: string
        description: Return the page immediately after this skill id.
        optional: true
    output:
      description: A page of Agent Skills.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}

  get_skill:
    title: Get an Agent Skill
    description: >-
      One skill's details, including its versions. Skills are versioned, and a
      Messages request pins a specific version, so read this before wiring a
      skill into a production call.
    category: skills
    read_only: true
    request:
      method: GET
      path: /v1/skills/${skill_id}
    input:
      skill_id:
        type: string
        description: The skill id.
    output:
      description: The skill and its versions.
      type: object
      properties:
        id: {type: string}
        display_title: {type: string}

  # -- managed agents (beta) ------------------------------------------------

  create_agent:
    title: Create a managed agent
    description: >-
      Create a persisted, versioned agent configuration -- model, system prompt
      and tools live here, never on a session. Create the agent once, store the
      id, and reference it from every session; calling this in a request path
      creates a new agent each time. Beta.
    category: agents
    request:
      method: POST
      path: /v1/agents
      headers:
        anthropic-beta: managed-agents-2026-04-01
      body:
        name: "${name}"
        model: "${model}"
        system: "${system}"
        tools: "${tools}"
        description: "${description}"
    input:
      name:
        type: string
        description: A name for the agent.
      model:
        type: string
        description: 'The model the agent runs on, e.g. {"model": "claude-opus-5"} or the id as a string.'
      system:
        type: string
        description: The agent's system prompt.
        optional: true
      tools:
        type: array
        description: The toolsets the agent may use, including Anthropic-hosted sandbox tools, Skills and MCP.
        optional: true
        items: {type: object}
      description:
        type: string
        description: A description of what the agent is for.
        optional: true
    output:
      description: The created agent, with the id sessions reference.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  list_agents:
    title: List managed agents
    description: >-
      The agent configurations stored in this workspace. Use it to recover an
      agent id rather than creating a duplicate agent -- agents are persistent
      objects, not per-run ones. Beta.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents
      headers:
        anthropic-beta: managed-agents-2026-04-01
      query:
        limit: "${limit}"
        after_id: "${after_id}"
    input:
      limit:
        type: integer
        description: How many agents per page.
        optional: true
        minimum: 1
      after_id:
        type: string
        description: Return the page immediately after this agent id.
        optional: true
    output:
      description: A page of stored agents.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}

  get_agent:
    title: Get a managed agent
    description: >-
      One agent configuration by id, including its version. Sessions pin to a
      version, so this is what says which model and tools a running session
      actually got. Beta.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${agent_id}
      headers:
        anthropic-beta: managed-agents-2026-04-01
    input:
      agent_id:
        type: string
        description: The agent id.
    output:
      description: The agent configuration and its version.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        model: {type: object}

  create_environment:
    title: Create a managed agent environment
    description: >-
      Create the environment an agent's sessions run in -- the container image,
      networking policy and file mounts. Referenced by id from a session, the
      same way an agent is. Beta.
    category: agents
    request:
      method: POST
      path: /v1/environments
      headers:
        anthropic-beta: managed-agents-2026-04-01
      body:
        name: "${name}"
        type: "${type}"
        networking: "${networking}"
        mounts: "${mounts}"
    input:
      name:
        type: string
        description: A name for the environment.
      type:
        type: string
        description: The environment type, e.g. "cloud".
        optional: true
      networking:
        type: object
        description: Network egress policy for the sandbox. Note that server-side web search and fetch ignore this.
        optional: true
      mounts:
        type: array
        description: Files or volumes to mount into the session's workspace.
        optional: true
        items: {type: object}
    output:
      description: The created environment.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  create_session:
    title: Start a managed agent session
    description: >-
      Start a run of a stored agent. `model`, `system` and `tools` belong to
      the agent, not here -- a session only names the agent, its environment
      and the first message. Anthropic runs the loop and hosts the container.
      Beta.
    category: agents
    request:
      method: POST
      path: /v1/sessions
      headers:
        anthropic-beta: managed-agents-2026-04-01
      body:
        agent_id: "${agent_id}"
        environment_id: "${environment_id}"
        messages: "${messages}"
        budget: "${budget}"
    input:
      agent_id:
        type: string
        description: The stored agent to run.
      environment_id:
        type: string
        description: The environment the session's container comes from.
        optional: true
      messages:
        type: array
        description: The opening messages for the session.
        optional: true
        items: {type: object}
      budget:
        type: object
        description: A hard dollar cap on this session's spend.
        optional: true
    output:
      description: The created session, with the id its events stream from.
      type: object
      properties:
        id: {type: string}
        status: {type: string}

  get_session:
    title: Get a managed agent session
    description: >-
      One session's current state -- status, the agent version it pinned and
      its outcome if it has finished. Poll this alongside the event stream
      rather than instead of it; the stream carries the detail.
      Beta.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/sessions/${session_id}
      headers:
        anthropic-beta: managed-agents-2026-04-01
    input:
      session_id:
        type: string
        description: The session id.
    output:
      description: The session's status and outcome.
      type: object
      properties:
        id: {type: string}
        status: {type: string}

  list_session_events:
    title: List a session's events
    description: >-
      Page through everything that happened in a session -- messages, tool
      calls, sandbox output. Cursor-paginated, which makes it the lossless way
      to catch up after a dropped stream rather than re-running the session.
      Beta.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/sessions/${session_id}/events
      headers:
        anthropic-beta: managed-agents-2026-04-01
      query:
        page: "${page}"
        limit: "${limit}"
    input:
      session_id:
        type: string
        description: The session id.
      page:
        type: string
        description: Page cursor from the previous response.
        optional: true
      limit:
        type: integer
        description: How many events per page.
        optional: true
        minimum: 1
    output:
      description: A page of session events.
      type: object
      properties:
        data: {type: array}
        has_more: {type: boolean}
