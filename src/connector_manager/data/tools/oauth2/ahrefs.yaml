    category: management
    destructive: true
    request:
      method: DELETE
      path: /v3/management/projects
      query:
        project_ids: ${project_ids}
    input:
      project_ids:
        type: string
        description: A comma-separated list of the IDs of the projects you want to delete.
    output:
      description: The deleted projects.
      type: array
      items:
        type: object
      response_path: projects

  update_project:
    title: Update a project
    description: >-
      Move a project to another folder or change whether it is private or shared. Free: consumes
      no API units.
    category: management
    request:
      method: PATCH
      path: /v3/management/update-project
      body:
        project_id: ${project_id}
        folder: ${folder}
        access: ${access}
    input:
      project_id:
        type: integer
        description: 'The ID of the project whose access setting you want to update. You can
          find it in the URL of your Rank Tracker project in Ahrefs: https://app.ahrefs.com/rank-tracker/overview/#project_id#'
      folder:
        type: object
        description: A folder operation, applied before the access change. Keep in mind that
          moving a project to another folder may make it visible to members of the destination
          folder.
        optional: true
      access:
        type: string
        description: The new access setting for the project.
        optional: true
        enum:
        - private
        - shared
    output:
      description: The updated project.
      type: object
      response_path: project

