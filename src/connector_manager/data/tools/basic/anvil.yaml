# Anvil tools -- PDF filling, PDF generation, and the Etch/Workflows GraphQL API.
#
# Anvil is two APIs behind one host, and which one a job needs is the first
# decision:
#
#   * **two REST endpoints** under /api/v1 do the PDF work and answer with raw
#     PDF bytes, not JSON. `fill_pdf` stamps data onto a template you uploaded
#     in the Anvil UI; `generate_pdf` builds a document from HTML/CSS or
#     structured Markdown with no template at all;
#   * **one GraphQL endpoint** at /graphql does everything else -- e-signature
#     packets (Etch), PDF templates (casts), workflows (welds) and webforms
#     (forges). Every GraphQL tool below posts a fixed query with the caller's
#     arguments as variables, so the shape of `data` in the response follows
#     the query, not the tool name.
#
# Anvil's own vocabulary is worth knowing, because the API uses it and the UI
# mostly does not: a **cast** is a PDF template, a **weld** is a workflow, a
# **forge** is a webform, and a **weldData** is one submission through a
# workflow. Everything is addressed by `eid`, a short string id -- never by a
# numeric id.
#
# Authentication is HTTP basic with the API key as the username and an empty
# password, which is what this connector's credentials mean: put the API key in
# the username field and leave the password blank.
#
# Two things that reliably surprise people:
#
#   * **`createEtchPacket` with `isDraft: true` does not send anything.** The
#     packet sits unsent until `send_etch_packet`. With `isDraft: false` it
#     emails the first signer immediately -- so the flag is the difference
#     between staging a document and putting it in front of a customer;
#   * **test packets are watermarked, not free-standing.** `isTest: true`
#     produces a real packet with a test watermark; it is the safe way to
#     exercise a signing flow without burning a billable envelope.
#
# Docs: https://www.useanvil.com/docs/api/

connector_id: anvil
display_name: Anvil
docs_url: https://www.useanvil.com/docs/api/

tools:

  # -- PDF REST endpoints ---------------------------------------------------

  fill_pdf:
    title: Fill a PDF template
    description: >-
      Fill a PDF template with data and get the finished PDF back as binary
      bytes. The template must already exist in Anvil (uploaded through the UI,
      which is where its field names are detected) and is addressed by its
      template eid. Keys in `data` are those field names -- an unknown key is
      ignored rather than erroring, so check the output if a field comes back
      blank.
    category: pdf
    request:
      method: POST
      path: /api/v1/fill/${pdf_template_eid}.pdf
      query:
        versionNumber: "${version_number}"
      body:
        data: "${data}"
        title: "${title}"
        fontFamily: "${font_family}"
        fontSize: "${font_size}"
        textColor: "${text_color}"
        alignment: "${alignment}"
        fontWeight: "${font_weight}"
        useInteractiveFields: "${use_interactive_fields}"
        defaultReadOnly: "${default_read_only}"
    input:
      pdf_template_eid:
        type: string
        description: The PDF template's eid, from its URL in the Anvil UI.
      data:
        type: object
        description: Field values keyed by the template's field names.
      version_number:
        type: integer
        description: Which published version to fill. Pass -1 to fill the unpublished draft, which is how to test template changes before publishing.
        optional: true
      title:
        type: string
        description: Title encoded into the PDF document metadata.
        optional: true
      font_family:
        type: string
        description: Default font for filled text.
        optional: true
        default: Noto Sans
      font_size:
        type: number
        description: Default font size in points.
        optional: true
        default: 10
      text_color:
        type: string
        description: Default text colour as a hex code.
        optional: true
        default: "#3E3E57"
      alignment:
        type: string
        description: Default horizontal alignment for filled text.
        optional: true
        enum: [left, center, right]
      font_weight:
        type: string
        description: Default font weight for filled text.
        optional: true
        enum: [normal, bold, italic, boldItalic]
      use_interactive_fields:
        type: boolean
        description: Keep the filled fields editable in the output PDF instead of flattening them.
        optional: true
        default: false
      default_read_only:
        type: boolean
        description: When interactive fields are on, mark them read-only by default.
        optional: true
        default: false
    output:
      description: The filled PDF as binary bytes, not JSON.
      type: object

  generate_pdf:
    title: Generate a PDF from HTML or Markdown
    description: >-
      Build a new PDF from your own content -- no template needed. With
      `type: "html"`, `data` is {"html": "...", "css": "..."}; with the default
      `type: "markdown"`, `data` is an array of blocks each carrying a heading,
      a label and content, or a table. Returns raw PDF bytes. The styling
      arguments below apply to markdown only and are ignored for HTML, where
      your CSS governs.
    category: pdf
    request:
      method: POST
      path: /api/v1/generate-pdf
      body:
        type: "${type}"
        data: "${data}"
        title: "${title}"
        page: "${page}"
        fontSize: "${font_size}"
        textColor: "${text_color}"
        fontFamily: "${font_family}"
        includeTimestamp: "${include_timestamp}"
        logo: "${logo}"
    input:
      data:
        type: object
        description: 'For HTML, {"html": "...", "css": "..."}. For markdown, the array of content blocks.'
      type:
        type: string
        description: Which content format `data` is in.
        optional: true
        default: markdown
        enum: [markdown, html]
      title:
        type: string
        description: Title encoded into the PDF document metadata.
        optional: true
      page:
        type: object
        description: Page setup -- width, height, margins and pageCount.
        optional: true
      font_size:
        type: number
        description: Font size in points. Markdown only.
        optional: true
      text_color:
        type: string
        description: Text colour as a hex code. Markdown only.
        optional: true
      font_family:
        type: string
        description: Font family name. Markdown only.
        optional: true
      include_timestamp:
        type: boolean
        description: Show the generated-at timestamp in the footer. Markdown only; on by default.
        optional: true
      logo:
        type: object
        description: 'Logo for the document header -- {"src", "maxWidth", "maxHeight"}. Markdown only.'
        optional: true
    output:
      description: The generated PDF as binary bytes, not JSON.
      type: object

  # -- GraphQL: account -----------------------------------------------------

  get_current_user:
    title: Get the API user and their objects
    description: >-
      The account behind the API key, with the organizations it can reach and
      each organization's Etch packets, PDF templates (casts), workflows
      (welds) and webforms (forges). The cheapest way to confirm the credential
      works and to discover the eids every other tool takes.
    category: account
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query CurrentUser {
            currentUser {
              eid name email
              organizations {
                eid slug name
                casts { eid eidStatic name }
                welds { eid slug name }
                forges { eid slug name }
              }
            }
          }
    output:
      description: The API user and the organizations, templates, workflows and webforms it can see.
      type: object
      response_path: data.currentUser
      properties:
        eid: {type: string}
        organizations: {type: array}

  get_organization:
    title: Get an organization
    description: >-
      One organization by slug or eid, with its templates, workflows and
      webforms. Use it when an account spans several organizations and you need
      the eids for a specific one rather than all of them.
    category: account
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query Organization($organizationSlug: String, $organizationEid: String) {
            organization(slug: $organizationSlug, eid: $organizationEid) {
              eid slug name
              casts { eid eidStatic name }
              welds { eid slug name }
              forges { eid slug name }
            }
          }
        variables:
          organizationSlug: "${organization_slug}"
          organizationEid: "${organization_eid}"
    input:
      organization_slug:
        type: string
        description: The organization's slug. Pass this or organization_eid.
        optional: true
      organization_eid:
        type: string
        description: The organization's eid. Pass this or organization_slug.
        optional: true
    output:
      description: The organization and its objects.
      type: object
      response_path: data.organization
      properties:
        eid: {type: string}
        name: {type: string}

  # -- GraphQL: Etch e-signatures ------------------------------------------

  create_etch_packet:
    title: Create an e-signature packet
    description: >-
      Create an Etch packet -- one or more documents plus the signers who must
      sign them, in order. `files` references PDF templates by castEid or
      supplies files inline; `signers` lists each signer with the fields they
      sign. With `is_draft` true nothing is sent and the packet waits for
      send_etch_packet; with it false the first signer is emailed immediately.
      Use `is_test` to exercise the flow with a watermarked packet.
    category: e-signatures
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation CreateEtchPacket(
            $name: String, $files: [JSON!], $signers: [JSON!], $data: JSON,
            $isDraft: Boolean, $isTest: Boolean, $signatureEmailSubject: String,
            $signatureEmailBody: String, $signaturePageOptions: JSON,
            $webhookURL: String, $replyToName: String, $replyToEmail: String,
            $mergePDFs: Boolean, $allowUpdates: Boolean
          ) {
            createEtchPacket(
              name: $name, files: $files, signers: $signers, data: $data,
              isDraft: $isDraft, isTest: $isTest,
              signatureEmailSubject: $signatureEmailSubject,
              signatureEmailBody: $signatureEmailBody,
              signaturePageOptions: $signaturePageOptions,
              webhookURL: $webhookURL, replyToName: $replyToName,
              replyToEmail: $replyToEmail, mergePDFs: $mergePDFs,
              allowUpdates: $allowUpdates
            ) {
              eid name status detailsURL
              documentGroup { eid status files }
              signers { eid aliasId name email status signActionType }
            }
          }
        variables:
          name: "${name}"
          files: "${files}"
          signers: "${signers}"
          data: "${data}"
          isDraft: "${is_draft}"
          isTest: "${is_test}"
          signatureEmailSubject: "${signature_email_subject}"
          signatureEmailBody: "${signature_email_body}"
          signaturePageOptions: "${signature_page_options}"
          webhookURL: "${webhook_url}"
          replyToName: "${reply_to_name}"
          replyToEmail: "${reply_to_email}"
          mergePDFs: "${merge_pdfs}"
          allowUpdates: "${allow_updates}"
    input:
      name:
        type: string
        description: A name for the packet, shown in the Anvil UI and in signer emails.
      files:
        type: array
        description: The documents in the packet -- each references a PDF template by castEid, or supplies a file inline with its fields.
        items: {type: object}
      signers:
        type: array
        description: The signers in signing order, each with id, name, email, signerType and the fields they sign.
        items: {type: object}
      data:
        type: object
        description: Fill data for the packet's templates, keyed by payload id.
        optional: true
      is_draft:
        type: boolean
        description: Create the packet without sending it. False emails the first signer straight away.
        optional: true
      is_test:
        type: boolean
        description: Create a watermarked test packet instead of a billable one.
        optional: true
      signature_email_subject:
        type: string
        description: Subject line for the signature request email.
        optional: true
      signature_email_body:
        type: string
        description: Body text for the signature request email.
        optional: true
      signature_page_options:
        type: object
        description: Customises the signing page's text and colours.
        optional: true
      webhook_url:
        type: string
        description: A webhook url for this packet's events specifically, overriding the organization's.
        optional: true
      reply_to_name:
        type: string
        description: Reply-to name on the signature emails.
        optional: true
      reply_to_email:
        type: string
        description: Reply-to address on the signature emails.
        optional: true
      merge_pdfs:
        type: boolean
        description: Merge all the packet's files into one PDF before signing.
        optional: true
      allow_updates:
        type: boolean
        description: Allow the packet's data and signers to be updated after creation, which is what progressive signing needs.
        optional: true
    output:
      description: The created packet with its eid, status and signers.
      type: object
      response_path: data.createEtchPacket
      properties:
        eid: {type: string}
        status: {type: string}
        signers: {type: array}

  get_etch_packet:
    title: Get an e-signature packet
    description: >-
      Fetch one Etch packet by eid, with its status, its document group and
      every signer's current signing status. This is how to poll whether a
      packet has been completed rather than waiting on webhooks.
    category: e-signatures
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query EtchPacket($eid: String!) {
            etchPacket(eid: $eid) {
              eid name status detailsURL isTest completedAt
              documentGroup { eid status files downloadZipURL }
              signers { eid aliasId name email status signActionType routingOrder }
            }
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The Etch packet's eid.
    output:
      description: The packet, its documents and its signers.
      type: object
      response_path: data.etchPacket
      properties:
        eid: {type: string}
        status: {type: string}
        documentGroup: {type: object}
        signers: {type: array}

  send_etch_packet:
    title: Send an e-signature packet
    description: >-
      Send a draft packet to its first signer, or resend the request to
      whichever signer it is currently waiting on. This is the call that
      actually puts a document in front of a person, so it is not reversible
      by another API call -- the signer receives the email.
    category: e-signatures
    destructive: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation SendEtchPacket($eid: String!) {
            sendEtchPacket(eid: $eid) {
              eid status detailsURL
              signers { eid name email status }
            }
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The Etch packet's eid.
    output:
      description: The packet as it stands after sending.
      type: object
      response_path: data.sendEtchPacket
      properties:
        eid: {type: string}
        status: {type: string}

  update_etch_packet:
    title: Update a packet's data between signers
    description: >-
      Change the fill data on an in-flight packet -- what progressive signing
      needs when a later signer's document depends on an earlier one's answers.
      By default `payload` replaces the stored data; `merge_payloads` merges it
      instead. The packet must have been created with allowUpdates.
    category: e-signatures
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation UpdateEtchPacket($eid: String!, $payload: JSON, $mergePayloads: Boolean) {
            updateEtchPacket(eid: $eid, payload: $payload, mergePayloads: $mergePayloads) {
              eid status
            }
          }
        variables:
          eid: "${eid}"
          payload: "${payload}"
          mergePayloads: "${merge_payloads}"
    input:
      eid:
        type: string
        description: The Etch packet's eid.
      payload:
        type: object
        description: The updated fill data for the packet's documents.
        optional: true
      merge_payloads:
        type: boolean
        description: Merge into the existing data instead of replacing it.
        optional: true
    output:
      description: The packet after the update.
      type: object
      response_path: data.updateEtchPacket
      properties:
        eid: {type: string}
        status: {type: string}

  generate_etch_sign_url:
    title: Get an embedded signing URL for a signer
    description: >-
      Mint a signing url for one signer so they can sign inside your own app
      instead of following an email link. The url carries an embedded token and
      expires in about two hours, so generate it at the moment the person is
      ready to sign rather than storing it. `client_user_id` is your own id for
      that person, recorded for traceability.
    category: e-signatures
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation GenerateEtchSignURL($signerEid: String!, $clientUserId: String!) {
            generateEtchSignURL(signerEid: $signerEid, clientUserId: $clientUserId)
          }
        variables:
          signerEid: "${signer_eid}"
          clientUserId: "${client_user_id}"
    input:
      signer_eid:
        type: string
        description: The signer's eid, from the packet's signers list.
      client_user_id:
        type: string
        description: Your own identifier for the person signing, recorded on the signature.
    output:
      description: The short-lived embedded signing url.
      type: object
      response_path: data.generateEtchSignURL

  get_signer:
    title: Get a signer
    description: >-
      One signer by eid, with their name, email, routing order and current
      status. Narrower than fetching the whole packet when you only need to
      know whether one person has signed.
    category: e-signatures
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query Signer($eid: String!) {
            signer(eid: $eid) {
              eid aliasId name email status signActionType routingOrder
            }
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The signer's eid.
    output:
      description: The signer's details and status.
      type: object
      response_path: data.signer
      properties:
        eid: {type: string}
        status: {type: string}

  update_signer:
    title: Update a signer
    description: >-
      Correct a signer's name or email on an in-flight packet -- the usual fix
      for a typo'd address that bounced -- or activate a pending signer so the
      packet moves on to them. Changing the email re-sends the request to the
      new address.
    category: e-signatures
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation UpdateSigner($eid: String!, $name: String, $email: String, $activateIfPending: Boolean) {
            updateSigner(eid: $eid, name: $name, email: $email, activateIfPending: $activateIfPending) {
              eid name email status
            }
          }
        variables:
          eid: "${eid}"
          name: "${name}"
          email: "${email}"
          activateIfPending: "${activate_if_pending}"
    input:
      eid:
        type: string
        description: The signer's eid.
      name:
        type: string
        description: The signer's corrected name.
        optional: true
      email:
        type: string
        description: The signer's corrected email address. Changing it re-sends the request there.
        optional: true
        format: email
      activate_if_pending:
        type: boolean
        description: Activate the signer if they are still pending, moving the packet on to them.
        optional: true
    output:
      description: The signer after the update.
      type: object
      response_path: data.updateSigner
      properties:
        eid: {type: string}
        email: {type: string}

  expire_signer_tokens:
    title: Expire a signer's access tokens
    description: >-
      Invalidate every signing link and embedded token issued to one signer.
      Use it when a signing url may have gone to the wrong person -- it does not
      cancel the packet, only the access, so a fresh url can be minted
      afterwards.
    category: e-signatures
    destructive: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation ExpireSignerTokens($signerEid: String!) {
            expireSignerTokens(signerEid: $signerEid) { eid status }
          }
        variables:
          signerEid: "${signer_eid}"
    input:
      signer_eid:
        type: string
        description: The signer whose tokens should be invalidated.
    output:
      description: The signer after their tokens were expired.
      type: object
      response_path: data.expireSignerTokens

  remove_etch_packet:
    title: Delete an e-signature packet
    description: >-
      Delete an Etch packet outright. Irreversible, and it takes the packet's
      documents and signature records with it -- for an in-flight packet that
      simply should not proceed, expiring the signer's tokens is usually the
      safer move.
    category: e-signatures
    destructive: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation RemoveEtchPacket($eid: String!) {
            removeEtchPacket(eid: $eid)
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The Etch packet's eid.
    output:
      description: Confirmation that the packet was removed.
      type: object
      response_path: data.removeEtchPacket

  # -- GraphQL: templates, workflows and webforms ---------------------------

  get_cast:
    title: Get a PDF template
    description: >-
      One PDF template (a "cast" in Anvil's vocabulary) by eid, with its field
      definitions. Those field names are exactly the keys `fill_pdf` expects,
      so this is the way to discover them rather than guessing from the
      document.
    category: templates
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query Cast($eid: String!, $versionNumber: Int) {
            cast(eid: $eid, versionNumber: $versionNumber) {
              eid eidStatic name title config isTemplate versionNumber
            }
          }
        variables:
          eid: "${eid}"
          versionNumber: "${version_number}"
    input:
      eid:
        type: string
        description: The template's eid.
      version_number:
        type: integer
        description: Which version to read. Pass -1 for the unpublished draft.
        optional: true
    output:
      description: The template and its field configuration.
      type: object
      response_path: data.cast
      properties:
        eid: {type: string}
        name: {type: string}
        config: {type: object}

  get_weld:
    title: Get a workflow
    description: >-
      One workflow (a "weld") by eid or slug, with the webforms and documents
      it strings together. Read this to learn a workflow's structure before
      starting or inspecting submissions against it.
    category: workflows
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query Weld($eid: String, $slug: String, $organizationSlug: String, $versionNumber: Int) {
            weld(eid: $eid, slug: $slug, organizationSlug: $organizationSlug, versionNumber: $versionNumber) {
              eid slug name
              forges { eid slug name }
            }
          }
        variables:
          eid: "${eid}"
          slug: "${slug}"
          organizationSlug: "${organization_slug}"
          versionNumber: "${version_number}"
    input:
      eid:
        type: string
        description: The workflow's eid. Pass this or slug.
        optional: true
      slug:
        type: string
        description: The workflow's slug, which needs organization_slug alongside it.
        optional: true
      organization_slug:
        type: string
        description: The organization the slug belongs to.
        optional: true
      version_number:
        type: integer
        description: Which version to read. Pass -1 for the unpublished draft.
        optional: true
    output:
      description: The workflow and its webforms.
      type: object
      response_path: data.weld
      properties:
        eid: {type: string}
        name: {type: string}
        forges: {type: array}

  get_weld_data:
    title: Get a workflow submission
    description: >-
      One submission through a workflow, with the data captured at each step
      and the documents it produced. This is the record to read when asking
      "what did this applicant actually submit, and where did it get to".
    category: workflows
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query WeldData($eid: String!) {
            weldData(eid: $eid) {
              eid isTest isComplete createdAt
              submissions { eid completedAt payload forge { eid slug name } }
              documentGroup { eid status files }
            }
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The workflow submission's eid.
    output:
      description: The submission, its per-step payloads and its documents.
      type: object
      response_path: data.weldData
      properties:
        eid: {type: string}
        isComplete: {type: boolean}
        submissions: {type: array}

  get_forge:
    title: Get a webform
    description: >-
      One webform (a "forge") by eid or slug, with its field configuration.
      Those field names are what a submission's payload is keyed on, so read
      this before writing to or interpreting a submission.
    category: workflows
    read_only: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          query Forge($eid: String, $eidOrSlug: String, $organizationSlug: String, $versionNumber: Int) {
            forge(eid: $eid, eidOrSlug: $eidOrSlug, organizationSlug: $organizationSlug, versionNumber: $versionNumber) {
              eid slug name config versionNumber
            }
          }
        variables:
          eid: "${eid}"
          eidOrSlug: "${eid_or_slug}"
          organizationSlug: "${organization_slug}"
          versionNumber: "${version_number}"
    input:
      eid:
        type: string
        description: The webform's eid. Pass this or eid_or_slug.
        optional: true
      eid_or_slug:
        type: string
        description: The webform's eid or slug, with organization_slug alongside for a slug.
        optional: true
      organization_slug:
        type: string
        description: The organization the slug belongs to.
        optional: true
      version_number:
        type: integer
        description: Which version to read. Pass -1 for the unpublished draft.
        optional: true
    output:
      description: The webform and its field configuration.
      type: object
      response_path: data.forge
      properties:
        eid: {type: string}
        name: {type: string}
        config: {type: object}

  # -- GraphQL: webhooks ----------------------------------------------------

  create_webhook:
    title: Create a webhook
    description: >-
      Register a url to receive Anvil's event callbacks for an organization.
      Which events actually fire is controlled by webhook actions configured
      separately, so a freshly created webhook may be silent until those are
      added in the UI.
    category: webhooks
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation CreateWebhook($url: String!, $organizationEid: String, $enabled: Boolean) {
            createWebhook(url: $url, organizationEid: $organizationEid, enabled: $enabled) {
              eid url enabled
            }
          }
        variables:
          url: "${url}"
          organizationEid: "${organization_eid}"
          enabled: "${enabled}"
    input:
      url:
        type: string
        description: The https endpoint Anvil should POST events to.
      organization_eid:
        type: string
        description: The organization the webhook belongs to.
        optional: true
      enabled:
        type: boolean
        description: Whether the webhook starts enabled.
        optional: true
    output:
      description: The created webhook.
      type: object
      response_path: data.createWebhook
      properties:
        eid: {type: string}
        url: {type: string}

  remove_webhook:
    title: Delete a webhook
    description: >-
      Remove a webhook endpoint. Events that would have gone to it are not
      queued or replayed afterwards, so anything that happens while it is gone
      is simply not delivered.
    category: webhooks
    destructive: true
    request:
      method: POST
      path: /graphql
      body:
        query: >-
          mutation RemoveWebhook($eid: String!) {
            removeWebhook(eid: $eid)
          }
        variables:
          eid: "${eid}"
    input:
      eid:
        type: string
        description: The webhook's eid.
    output:
      description: Confirmation that the webhook was removed.
      type: object
      response_path: data.removeWebhook

  # -- GraphQL escape hatch -------------------------------------------------

  run_graphql_query:
    title: Run any Anvil GraphQL query or mutation
    description: >-
      Send an arbitrary query or mutation to Anvil's GraphQL endpoint, for the
      parts of the schema no named tool above covers -- duplicating casts,
      publishing welds, submitting forges, managing organization users and so
      on. You must know the schema; nothing here validates the document. Prefer
      a named tool wherever one exists, and remember a mutation sent this way
      can create or destroy real documents.
    category: graphql
    destructive: true
    request:
      method: POST
      path: /graphql
      body:
        query: "${query}"
        variables: "${variables}"
        operationName: "${operation_name}"
    input:
      query:
        type: string
        description: The GraphQL document to execute.
      variables:
        type: object
        description: Variables for the document.
        optional: true
      operation_name:
        type: string
        description: Which operation to run, when the document defines several.
        optional: true
    output:
      description: Anvil's GraphQL response -- `data` for the result, `errors` when the document failed.
      type: object
      properties:
        data: {type: object}
        errors: {type: array}
