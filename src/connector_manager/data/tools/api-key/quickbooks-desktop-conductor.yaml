          and can be arbitrarily changed by the QuickBooks user. When left blank in this create request,
          this field will be left blank in QuickBooks (i.e., it does not auto-increment). IMPORTANT: For
          checks, this field is the check'
        optional: true
      memo:
        type: string
        description: A memo or note for this bill check payment.
        optional: true
      exchange_rate:
        type: number
        description: The market exchange rate between this bill check payment's currency and the home
          currency in QuickBooks at the time of this transaction. Represented as a decimal value (e.g.,
          1.2345 for 1 EUR = 1.2345 USD if USD is the home currency).
        optional: true
      external_id:
        type: string
        description: 'A globally unique identifier (GUID) you, the developer, can provide for tracking
          this object in your external system. This field is immutable and can only be set during object
          creation. IMPORTANT: This field must be formatted as a valid GUID; otherwise, QuickBooks will
          return an error.'
        optional: true
      apply_to_transactions:
        type: array
        description: 'The bills to be paid by this bill check payment. This will create a link between
          this bill check payment and the specified bills. IMPORTANT: In each applyToTransactions object,
          you must specify either paymentAmount, applyCredits, discountAmount, or any combination of these;
          if none of these are specified, you will receive an error for an empty transaction. IMPORTANT:
          The target bill must have isPa'
        items:
          type: object
    output:
      description: Returns the newly created bill check payment.
      type: object
