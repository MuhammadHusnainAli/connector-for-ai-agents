  list_notebooks:
    title: Get all notebooks
    description: >-
      Get all notebooks. This can also be used to search for notebooks with a
      particular `query` in the notebook `name` or author `handle`.
    category: notebooks
    read_only: true
    request:
      method: GET
      path: /v1/notebooks
      query:
        author_handle: "${author_handle}"
        exclude_author_handle: "${exclude_author_handle}"
        start: "${start}"
        count: "${count}"
        sort_field: "${sort_field}"
        sort_dir: "${sort_dir}"
        query: "${query}"
        include_cells: "${include_cells}"
        is_template: "${is_template}"
        type: "${type}"
    input:
      author_handle:
        type: string
        description: Return notebooks created by the given `author_handle`.
        optional: true
      exclude_author_handle:
        type: string
        description: Return notebooks not created by the given `author_handle`.
        optional: true
      start:
        type: integer
        description: The index of the first notebook you want returned.
        optional: true
      count:
        type: integer
        description: The number of notebooks to be returned.
        optional: true
        default: '100'
      sort_field:
        type: string
        description: Sort by field `modified`, `name`, or `created`.
        optional: true
        default: modified
      sort_dir:
        type: string
        description: Sort by direction `asc` or `desc`.
        optional: true
        default: desc
      query:
        type: string
        description: Return only notebooks with `query` string in notebook name or author handle.
        optional: true
      include_cells:
        type: boolean
        description: Value of `false` excludes the `cells` and global `time` for each notebook.
        optional: true
        default: 'True'
      is_template:
        type: boolean
        description: True value returns only template notebooks. Default is false (returns only non-template notebooks).
        optional: true
        default: 'False'
      type:
        type: string
        description: If type is provided, returns only notebooks with that metadata type. Default does not have type filtering.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

