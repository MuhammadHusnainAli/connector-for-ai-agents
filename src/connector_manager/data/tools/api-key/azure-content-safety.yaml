# Azure AI Content Safety tools -- classify text and images for harm.
#
# The connection's base url already carries `/contentsafety` on the resource's
# cognitiveservices.azure.com host, and the API key goes in the
# `Ocp-Apim-Subscription-Key` header, so paths here start at `/text:analyze`.
# Every call needs `api-version`; 2024-09-01 is the GA version and the one
# these tools default to.
#
# ## What the severity numbers mean
#
# analyze_text and analyze_image return a `categoriesAnalysis` array -- one
# entry per category (Hate, SelfHarm, Sexual, Violence) with a `severity`.
#
# The scale depends on `output_type`:
#
#   * `FourSeverityLevels` (the default) returns 0, 2, 4 or 6 -- safe, low,
#     medium, high;
#   * `EightSeverityLevels` returns 0 to 7 and is only supported for text.
#
# The service does not decide what to block. It grades, and the caller picks a
# threshold. A single threshold across all four categories is usually wrong:
# the tolerance for Violence in a games forum is not the tolerance for Sexual
# content in a children's app.
#
# ## Blocklists are exact-match, and they are separate from the classifier
#
# A blocklist is a list of terms or regular expressions that are matched
# literally, independently of the AI categories. They are for the words a model
# cannot know about -- a competitor's name, an internal codename, a slur
# specific to one community.
#
# Two things catch people out:
#
#   * blocklists are only applied when `blocklist_names` is passed to
#     analyze_text. Creating one changes nothing on its own;
#   * `halt_on_blocklist_hit` decides whether a blocklist match SKIPS the AI
#     analysis. With it on, a hit returns immediately and
#     `categoriesAnalysis` comes back empty, which looks like the categories
#     found nothing.
#
# Blocklist changes take a few minutes to propagate to the analysis endpoint --
# a term added and immediately tested will usually not match yet.
#
# ## Images
#
# analyze_image takes either base64 content or a blob URL, and only supports
# four-level severity. Blocklists do not apply to images.
#
# The key authorises the whole resource; Content Safety has no per-call scopes,
# so no tool here declares any.
#
# Docs: https://learn.microsoft.com/rest/api/contentsafety/

connector_id: azure-content-safety
display_name: Azure AI Content Safety
docs_url: https://learn.microsoft.com/rest/api/contentsafety/

tools:

  analyze_text:
    title: Classify text for harmful content
    description: >-
      Grade a piece of text for Hate, SelfHarm, Sexual and Violence, and
      optionally match it against blocklists.

      The response's `categoriesAnalysis` gives a severity per category -- 0,
      2, 4 or 6 by default, or 0 to 7 with EightSeverityLevels. The service
      never says "blocked": choosing the threshold is the caller's job, and it
      is normally different per category.

      Pass `blocklist_names` to also check the text against exact-match term
      lists; without it, blocklists are not consulted at all. Matches come back
      in `blocklistsMatch`. With `halt_on_blocklist_hit` set, a blocklist match
      short-circuits the AI analysis, so `categoriesAnalysis` comes back empty
      -- check `blocklistsMatch` before concluding the text was clean.

      Text is limited to 10,000 characters per call; longer input has to be
      chunked.
    category: analysis
    read_only: true
    notes: Maximum 10,000 characters. Blocklists are only applied when blocklist_names is passed.
    request:
      method: POST
      path: /text:analyze
      query:
        api-version: "${api_version}"
      body:
        text: "${text}"
        categories: "${categories}"
        blocklistNames: "${blocklist_names}"
        haltOnBlocklistHit: "${halt_on_blocklist_hit}"
        outputType: "${output_type}"
    input:
      text:
        type: string
        description: The text to classify. Up to 10,000 characters.
        max_length: 10000
      categories:
        type: array
        description: >-
          Which harm categories to analyse. Omit for all four, which costs the
          same.
        optional: true
        items: {type: string, enum: [Hate, SelfHarm, Sexual, Violence]}
      blocklist_names:
        type: array
        description: >-
          Blocklists to match the text against, from list_blocklists. Without
          this, no blocklist is consulted.
        optional: true
        items: {type: string}
      halt_on_blocklist_hit:
        type: boolean
        description: >-
          Skip the AI analysis when a blocklist term matches. Faster, but
          categoriesAnalysis then comes back empty.
        optional: true
      output_type:
        type: string
        description: >-
          FourSeverityLevels returns 0, 2, 4 or 6. EightSeverityLevels returns 0
          to 7 and is text-only.
        optional: true
        enum: [FourSeverityLevels, EightSeverityLevels]
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: A severity per category, plus any blocklist matches.
      type: object
      properties:
        categoriesAnalysis: {type: array, description: "One entry per category, each with category and severity."}
        blocklistsMatch: {type: array, description: "Each match, with blocklistName, blocklistItemId and blocklistItemText."}

  analyze_image:
    title: Classify an image for harmful content
    description: >-
      Grade an image for Hate, SelfHarm, Sexual and Violence. Pass either
      `image_content` as base64 or `blob_url` pointing at a publicly reachable
      image -- one or the other, not both.

      Only four-level severity is supported for images, and blocklists do not
      apply. As with text, the service grades rather than blocks; the threshold
      is yours to choose.

      Images must be at least 50x50 pixels and under 4 MB; JPEG, PNG, GIF, BMP,
      TIFF and WEBP are accepted.
    category: analysis
    read_only: true
    notes: Images must be 50x50 pixels or larger and under 4 MB. Blocklists do not apply to images.
    request:
      method: POST
      path: /image:analyze
      query:
        api-version: "${api_version}"
      body:
        image:
          content: "${image_content}"
          blobUrl: "${blob_url}"
        categories: "${categories}"
        outputType: "${output_type}"
    input:
      image_content:
        type: string
        description: The image as a base64 string. Use this or blob_url, not both.
        optional: true
      blob_url:
        type: string
        description: A publicly reachable URL to the image. Use this or image_content.
        optional: true
      categories:
        type: array
        description: Which harm categories to analyse. Omit for all four.
        optional: true
        items: {type: string, enum: [Hate, SelfHarm, Sexual, Violence]}
      output_type:
        type: string
        description: Only FourSeverityLevels is supported for images.
        optional: true
        enum: [FourSeverityLevels]
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: A severity per category.
      type: object
      properties:
        categoriesAnalysis: {type: array, description: "One entry per category, each with category and severity 0, 2, 4 or 6."}

  # -- blocklists ------------------------------------------------------------

  list_blocklists:
    title: List the resource's text blocklists
    description: >-
      Every blocklist configured on this Content Safety resource, with its name
      and description. The names here are what analyze_text's `blocklist_names`
      takes -- a blocklist that is never named in an analyse call has no effect
      on anything.
    category: blocklists
    read_only: true
    request:
      method: GET
      path: /text/blocklists
      query:
        api-version: "${api_version}"
    input:
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The resource's blocklists.
      type: array
      response_path: value
      items: {type: object, description: "blocklistName and description."}

  get_blocklist:
    title: Get a blocklist
    description: >-
      One blocklist's name and description. It does not include the terms --
      list_blocklist_items does that.
    category: blocklists
    read_only: true
    request:
      method: GET
      path: /text/blocklists/${blocklist_name}
      query:
        api-version: "${api_version}"
    input:
      blocklist_name:
        type: string
        description: The blocklist's name.
        example: competitor-names
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The blocklist.
      type: object
      properties:
        blocklistName: {type: string, description: "The blocklist name."}
        description: "{type: string, description: \"What it is for.\"}"

  create_or_update_blocklist:
    title: Create a blocklist or change its description
    description: >-
      Create a blocklist, or update the description of one that exists. Creating
      it does not populate it -- add terms with add_blocklist_items -- and does
      not apply it to anything, since analyze_text has to name it explicitly.

      Sent as a JSON merge patch, which is what this endpoint expects.
    category: blocklists
    notes: An empty blocklist matches nothing, and a blocklist not named in analyze_text is never consulted.
    request:
      method: PATCH
      path: /text/blocklists/${blocklist_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/merge-patch+json
      body:
        description: "${description}"
    input:
      blocklist_name:
        type: string
        description: The blocklist's name. Creating one that exists updates it.
        example: competitor-names
      description:
        type: string
        description: What the blocklist is for.
        example: Terms we never want echoed back to customers
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The blocklist as created or updated.
      type: object
      properties:
        blocklistName: {type: string, description: "The blocklist name."}
        description: "{type: string, description: \"Its description.\"}"

  delete_blocklist:
    title: Delete a blocklist
    description: >-
      Remove a blocklist and every term in it. Irreversible. Any analyze_text
      call still naming it will start failing rather than silently ignoring it,
      so check what references the list before deleting.
    category: blocklists
    destructive: true
    request:
      method: DELETE
      path: /text/blocklists/${blocklist_name}
      query:
        api-version: "${api_version}"
    input:
      blocklist_name:
        type: string
        description: The blocklist to delete, with all its terms.
        example: competitor-names
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: Empty on success.
      type: object

  list_blocklist_items:
    title: List the terms in a blocklist
    description: >-
      Every term in a blocklist, each with its id, text, description and whether
      it is a regular expression. The ids are what remove_blocklist_items takes.
    category: blocklists
    read_only: true
    request:
      method: GET
      path: /text/blocklists/${blocklist_name}/blocklistItems
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
    input:
      blocklist_name:
        type: string
        description: The blocklist.
        example: competitor-names
      top:
        type: integer
        description: How many terms to return.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many terms to skip, for paging.
        optional: true
        minimum: 0
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The blocklist's terms.
      type: array
      response_path: value
      items: {type: object, description: "blocklistItemId, text, description and isRegex."}

  get_blocklist_item:
    title: Get one blocklist term
    description: >-
      A single term by its id -- its text, description and whether it is treated
      as a regular expression. Useful for resolving a `blocklistItemId` that
      analyze_text reported in `blocklistsMatch` back to the term that caused
      the match.
    category: blocklists
    read_only: true
    request:
      method: GET
      path: /text/blocklists/${blocklist_name}/blocklistItems/${blocklist_item_id}
      query:
        api-version: "${api_version}"
    input:
      blocklist_name:
        type: string
        description: The blocklist.
        example: competitor-names
      blocklist_item_id:
        type: string
        description: The term's id, from list_blocklist_items or an analyze_text match.
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The blocklist term.
      type: object
      properties:
        blocklistItemId: {type: string, description: "The term's id."}
        text: {type: string, description: "The term itself, or the regular expression."}
        description: "{type: string, description: \"Why it is on the list.\"}"
        isRegex: {type: boolean, description: "Whether text is a regular expression rather than a literal."}

  add_blocklist_items:
    title: Add terms to a blocklist
    description: >-
      Add or update terms in a blocklist. Each entry is
      `{"text": "...", "description": "...", "isRegex": false}`; a term with an
      `isRegex` of true is matched as a regular expression, which is how you
      catch spelling variants without listing them all.

      Up to 100 terms per call, each up to 128 characters. Changes take a few
      minutes to reach the analysis endpoint, so a term added and immediately
      tested will usually not match yet.
    category: blocklists
    notes: Up to 100 terms per call. Changes take a few minutes to take effect on analyze_text.
    request:
      method: POST
      path: /text/blocklists/${blocklist_name}:addOrUpdateBlocklistItems
      query:
        api-version: "${api_version}"
      body:
        blocklistItems: "${blocklist_items}"
    input:
      blocklist_name:
        type: string
        description: The blocklist to add to.
        example: competitor-names
      blocklist_items:
        type: array
        description: >-
          The terms, each {"text": "...", "description": "...", "isRegex":
          false}. Up to 100 per call.
        items: {type: object}
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: The terms as stored, with their assigned ids.
      type: object
      properties:
        blocklistItems: {type: array, description: "Each with blocklistItemId, text, description and isRegex."}

  remove_blocklist_items:
    title: Remove terms from a blocklist
    description: >-
      Delete terms from a blocklist by id. Irreversible, and the terms stop
      being matched a few minutes later once the change propagates -- so a term
      removed and immediately tested may still match.

      The ids come from list_blocklist_items.
    category: blocklists
    destructive: true
    notes: Takes a few minutes to take effect on analyze_text.
    request:
      method: POST
      path: /text/blocklists/${blocklist_name}:removeBlocklistItems
      query:
        api-version: "${api_version}"
      body:
        blocklistItemIds: "${blocklist_item_ids}"
    input:
      blocklist_name:
        type: string
        description: The blocklist to remove from.
        example: competitor-names
      blocklist_item_ids:
        type: array
        description: The term ids to delete, from list_blocklist_items.
        items: {type: string}
      api_version:
        type: string
        description: Content Safety API version.
        optional: true
        default: "2024-09-01"
    output:
      description: Empty on success.
      type: object
