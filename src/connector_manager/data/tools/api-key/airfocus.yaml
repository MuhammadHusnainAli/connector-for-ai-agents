      description: An empty result on success.
      type: object

  bulk_items:
    title: Bulk-change items
    description: >-
      Create, update, patch and delete many items in one request. Each operation is {type:
      create|update|patch|delete, ...} and may target one or several items; results come back
      one per operation, in order, errors inline.
    category: items
    scopes:
    - workspace
    destructive: true
    request:
      method: POST
      path: /${workspace_id}/items/bulk
      query:
        actAsAdmin: ${act_as_admin}
      headers:
        content-type: application/vnd.airfocus.markdown+json
      body: ${operations}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      operations:
        type: array
        items:
          type: object
        min_length: 1
        description: 'Operations: {type: create, resource: {name, description, ...}}, {type:
          update, id, resource}, {type: patch, id, patch: [...]} or {type: delete, id}.'
    output:
      description: One result per operation.
      type: object

  copy_items:
    title: Copy items
    description: >-
      Copy items from one workspace into another. Returns the new item ids in the order of
