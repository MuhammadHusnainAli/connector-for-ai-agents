  list_security_findings:
    title: List security findings
    description: >-
      Get a list of security findings that match a search query. [See the
      schema for security
      findings](https://docs.datadoghq.com/security/guide/findings-schema/).
      ### Query Syntax This endpoint uses the logs query syntax. Findings
      attributes (living in the attributes.attributes. namespace) are prefixed
      by @ when queried. Tags are queried without a prefix. Example:
      `@severity:(critical OR high) @status:open team:platform`.
    category: security
    read_only: true
    request:
      method: GET
      path: /v2/security/findings
      query:
        filter[query]: "${filter_query_}"
        page[cursor]: "${page_cursor_}"
        page[limit]: "${page_limit_}"
        sort: "${sort}"
    input:
      filter_query_:
        type: string
        description: The search query following log search syntax.
        optional: true
        default: '*'
      page_cursor_:
        type: string
        description: Get the next page of results with a cursor provided in the previous query.
        optional: true
      page_limit_:
        type: integer
        description: The maximum number of findings in the response.
        optional: true
        default: '10'
      sort:
        type: string
        description: Sorts by @detection_changed_at.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_security_findings:
    title: Search security findings
    description: >-
      Get a list of security findings that match a search query. [See the
      schema for security
      findings](https://docs.datadoghq.com/security/guide/findings-schema/).
      ### Query Syntax The API uses the logs query syntax. Findings attributes
      (living in the attributes.attributes. namespace) are prefixed by @ when
      queried. Tags are queried without a prefix. Example:
      `@severity:(critical OR high) @status:open team:platform`.
    category: security
    request:
      method: POST
      path: /v2/security/findings/search
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  mute_security_findings:
    title: Mute or unmute security findings
    description: >-
      Mute security findings so they stop appearing in the working queue. The
      finding does not go away -- muting is a decision to accept a risk, and
      it should carry a reason and an expiry.
