# Azure Container Registry tools -- Microsoft.ContainerRegistry in Azure
# Resource Manager.
#
# This is the control plane: it creates registries, mints credentials, wires up
# geo-replication, webhooks, scoped access tokens, cache rules and ACR Tasks.
# It is not the Docker Registry HTTP API -- listing repositories and tags,
# pulling manifests and deleting images all happen against
# <registry>.azurecr.io with a registry-scoped token, which is a different
# endpoint and a different credential from the one this connection holds. What
# this connector gives you instead is list_registry_credentials (the admin
# user) and generate_credentials (a scoped token), which are what you
# authenticate to that endpoint with.
#
# The connection authenticates as a service principal (client credentials
# against Microsoft Entra ID, scope https://management.azure.com/.default) and
# carries the tenant and subscription, so the subscription is filled in from
# the connection rather than passed per call.
#
# Two version notes, because this provider is not uniform:
#
#   * Registries, replications, webhooks, scope maps, tokens and cache rules
#     all take the registry api-version, which each tool defaults to.
#   * ACR Tasks and their runs version separately and lag well behind, so the
#     task and run tools default to their own api-version. Override it per call
#     if your registry is pinned elsewhere.
#
# PUT is a full replace and PATCH is a merge, as everywhere in ARM:
# update_registry is the safe way to change a live registry, while
# create_or_update_registry replaces the whole resource.
#
# Docs: https://learn.microsoft.com/rest/api/containerregistry/

connector_id: azure-container-registry
display_name: Azure Container Registry
docs_url: https://learn.microsoft.com/rest/api/containerregistry/

tools:

  list_registries:
    title: List container registries in the subscription
    description: >-
      List every container registry in the subscription with its SKU, login
      server, admin-user state and provisioning status. The place to start when
      the registry's resource group is not already known.
    category: registries
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/Microsoft.ContainerRegistry/registries
      query:
        api-version: "${api_version}"
    input:
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Every container registry in the subscription.
      type: array
      items: {type: object, description: "id, name, location, sku and properties (loginServer, adminUserEnabled, provisioningState, publicNetworkAccess)."}
      response_path: value

  list_registries_by_resource_group:
    title: List container registries in a resource group
    description: >-
      List the container registries in one resource group with their SKUs and
      login servers. Narrower and cheaper than scanning the whole subscription
      when the group is known.
    category: registries
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Name of the resource group.
        example: acr-rg
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registries in the resource group.
      type: array
      items: {type: object, description: "id, name, location, sku and properties."}
      response_path: value

  get_registry:
    title: Get a container registry
    description: >-
      Read one registry's ARM resource -- SKU, login server hostname, whether
      the admin user is enabled, network rules, public network access, zone
      redundancy, encryption and provisioning state. loginServer here is the
      hostname you docker login against.
    category: registries
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry resource.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        location: {type: string}
        sku: {type: object}
        identity: {type: object}
        properties: {type: object, description: "loginServer, creationDate, provisioningState, adminUserEnabled, networkRuleSet, policies, publicNetworkAccess, zoneRedundancy."}

  create_or_update_registry:
    title: Create or replace a container registry
    description: >-
      Create a registry, or replace an existing one's definition. A full PUT --
      read the registry with get_registry, amend it, and send it back, or
      properties you omit are reset. Registry names are globally unique because
      they become the <name>.azurecr.io login server. Only Premium supports
      geo-replication, private endpoints and content trust.
    category: registries
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}
      query:
        api-version: "${api_version}"
      body:
        location: "${location}"
        tags: "${tags}"
        identity: "${identity}"
        sku:
          name: "${sku}"
        properties:
          adminUserEnabled: "${admin_user_enabled}"
          publicNetworkAccess: "${public_network_access}"
          networkRuleSet: "${network_rule_set}"
          networkRuleBypassOptions: "${network_rule_bypass_options}"
          policies: "${policies}"
          zoneRedundancy: "${zone_redundancy}"
          anonymousPullEnabled: "${anonymous_pull_enabled}"
          dataEndpointEnabled: "${data_endpoint_enabled}"
    input:
      resource_group:
        type: string
        description: Resource group to create the registry in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry -- alphanumeric only, and globally unique.
        example: contosoacr
        pattern: ^[a-zA-Z0-9]{5,50}$
      location:
        type: string
        description: Azure region for the registry, e.g. westeurope.
        example: westeurope
      sku:
        type: string
        description: Pricing tier. Premium is required for geo-replication and private endpoints.
        enum: [Basic, Standard, Premium]
        example: Premium
      admin_user_enabled:
        type: boolean
        description: >-
          Enable the built-in admin user, a single shared username and password.
          Convenient for a quick start, but it is a shared credential -- prefer
          tokens from generate_credentials for anything long-lived.
        optional: true
      public_network_access:
        type: string
        description: Whether the registry answers on its public login server at all.
        optional: true
        enum: [Enabled, Disabled]
      network_rule_set:
        type: object
        description: 'IP firewall rules, e.g. {"defaultAction": "Deny", "ipRules": [{"value": "203.0.113.0/24"}]}. Premium only.'
        optional: true
      network_rule_bypass_options:
        type: string
        description: Whether trusted Azure services may bypass the network rules.
        optional: true
        enum: [AzureServices, None]
      policies:
        type: object
        description: >-
          Registry policies -- quarantinePolicy, trustPolicy for content trust,
          retentionPolicy for untagged manifests, exportPolicy.
        optional: true
      zone_redundancy:
        type: string
        description: Spread the registry across availability zones. Premium only, and immutable.
        optional: true
        enum: [Enabled, Disabled]
      anonymous_pull_enabled:
        type: boolean
        description: >-
          Allow unauthenticated pulls from the registry. This makes every image
          in it world-readable, so set it deliberately.
        optional: true
      data_endpoint_enabled:
        type: boolean
        description: Use dedicated per-region data endpoints for layer downloads. Premium only.
        optional: true
      identity:
        type: object
        description: 'Managed identity for the registry, e.g. {"type": "SystemAssigned"}.'
        optional: true
      tags:
        type: object
        description: Resource tags as key/value pairs.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry resource as accepted, with provisioning in progress.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  update_registry:
    title: Update a container registry
    description: >-
      Merge changes into an existing registry -- change the SKU, toggle the
      admin user or anonymous pull, tighten network rules, retag. Unlike the PUT
      form this leaves untouched properties alone, which makes it the right
      tool for a live registry.
    category: registries
    request:
      method: PATCH
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}
      query:
        api-version: "${api_version}"
      body:
        tags: "${tags}"
        identity: "${identity}"
        sku:
          $when: "${sku}"
          name: "${sku}"
        properties:
          adminUserEnabled: "${admin_user_enabled}"
          publicNetworkAccess: "${public_network_access}"
          networkRuleSet: "${network_rule_set}"
          networkRuleBypassOptions: "${network_rule_bypass_options}"
          policies: "${policies}"
          anonymousPullEnabled: "${anonymous_pull_enabled}"
          dataEndpointEnabled: "${data_endpoint_enabled}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry to update.
        example: contosoacr
      sku:
        type: string
        description: New pricing tier. Upgrading is immediate; downgrading may be refused.
        optional: true
        enum: [Basic, Standard, Premium]
      admin_user_enabled:
        type: boolean
        description: Enable or disable the built-in shared admin user.
        optional: true
      public_network_access:
        type: string
        description: Whether the registry answers on its public login server.
        optional: true
        enum: [Enabled, Disabled]
      network_rule_set:
        type: object
        description: Replacement IP firewall rules for the registry. Premium only.
        optional: true
      network_rule_bypass_options:
        type: string
        description: Whether trusted Azure services may bypass the network rules.
        optional: true
        enum: [AzureServices, None]
      policies:
        type: object
        description: Registry policies to merge in -- quarantine, trust, retention, export.
        optional: true
      anonymous_pull_enabled:
        type: boolean
        description: Allow unauthenticated pulls. Makes every image in the registry public.
        optional: true
      data_endpoint_enabled:
        type: boolean
        description: Use dedicated per-region data endpoints for layer downloads.
        optional: true
      identity:
        type: object
        description: Managed identity settings for the registry.
        optional: true
      tags:
        type: object
        description: Replacement resource tags as key/value pairs.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry resource after the merge.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  delete_registry:
    title: Delete a container registry
    description: >-
      Delete a registry and every image, tag and manifest in it. There is no
      soft delete and no restore, and anything pulling from the login server
      starts failing at once. Confirm the name with get_registry first.
    category: registries
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry to delete.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_registry_credentials:
    title: Get a registry's admin credentials
    description: >-
      Return the registry's admin username and its two passwords -- the
      credentials for "docker login <registry>.azurecr.io". This only works
      when the admin user is enabled. It is a single shared credential for the
      whole registry, so prefer generate_credentials for anything that should
      be scoped or revocable per consumer.
    category: credentials
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/listCredentials
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The admin username and both passwords.
      type: object
      properties:
        username: {type: string}
        passwords: {type: array, description: "Each with name (password or password2) and value."}

  regenerate_credential:
    title: Regenerate a registry admin password
    description: >-
      Roll one of the registry's two admin passwords. Anything still using the
      old value stops authenticating immediately, which is why there are two:
      move consumers to the second, roll the first, move them back, roll the
      second.
    category: credentials
    destructive: true
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/regenerateCredential
      query:
        api-version: "${api_version}"
      body:
        name: "${name}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      name:
        type: string
        description: Which of the two admin passwords to roll.
        enum: [password, password2]
        example: password2
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The admin username and both passwords, with the rolled one holding its new value.
      type: object
      properties:
        username: {type: string}
        passwords: {type: array}

  list_registry_usages:
    title: Get a registry's storage and quota usage
    description: >-
      Report how much storage the registry uses against its tier's limit, plus
      webhook and geo-replication counts. Check this before a push run fails,
      since Basic and Standard tiers have hard storage ceilings.
    category: registries
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/listUsages
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Current usage and limit for each quota the registry has.
      type: array
      items: {type: object, description: "name, limit, currentValue and unit."}
      response_path: value

  check_name_availability:
    title: Check whether a registry name is free
    description: >-
      Ask whether a proposed registry name can be used. Names are globally
      unique because they become the <name>.azurecr.io login server, so check
      before create_or_update_registry rather than after it fails.
    category: registries
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/Microsoft.ContainerRegistry/checkNameAvailability
      query:
        api-version: "${api_version}"
      body:
        name: "${name}"
        type: Microsoft.ContainerRegistry/registries
    input:
      name:
        type: string
        description: The registry name to test -- alphanumeric, 5 to 50 characters.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Whether the name is free, and why not when it is taken.
      type: object
      properties:
        nameAvailable: {type: boolean}
        reason: {type: string}
        message: {type: string}

  import_image:
    title: Copy an image into the registry
    description: >-
      Copy an image straight into this registry from another registry -- another
      ACR, Docker Hub, or any public registry -- without pulling and pushing it
      through a client. source names the registry and the source image;
      target_tags gives the repository and tags to land it under. This is the
      supported way to promote an image between registries, and it preserves
      the digest.
    category: images
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/importImage
      query:
        api-version: "${api_version}"
      body:
        source: "${source}"
        targetTags: "${target_tags}"
        untaggedTargetRepositories: "${untagged_target_repositories}"
        mode: "${mode}"
    input:
      resource_group:
        type: string
        description: Resource group the destination registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the destination registry.
        example: contosoacr
      source:
        type: object
        description: >-
          Where to copy from -- sourceImage plus either registryUri for an
          external registry (with credentials) or resourceId for another ACR.
        example: {resourceId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/dev-rg/providers/Microsoft.ContainerRegistry/registries/devacr, sourceImage: "web:1.4.2"}
      target_tags:
        type: array
        description: 'Repository and tag to write in this registry, e.g. ["web:1.4.2"].'
        optional: true
        items: {type: string}
      untagged_target_repositories:
        type: array
        description: Repositories to import the manifest into without giving it a tag.
        optional: true
        items: {type: string}
      mode:
        type: string
        description: NoForce fails if the target tag exists; Force overwrites it.
        optional: true
        enum: [NoForce, Force]
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; the import runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_replications:
    title: List a registry's geo-replications
    description: >-
      List the regions a Premium registry is replicated to, with each
      replica's provisioning and health status. Replicas serve pulls locally,
      so a failing replica shows up as slow pulls in that region rather than as
      an outage.
    category: replication
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/replications
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's replicas.
      type: array
      items: {type: object, description: "id, name, location and properties (provisioningState, status, regionEndpointEnabled, zoneRedundancy)."}
      response_path: value

  get_replication:
    title: Get a geo-replication
    description: >-
      Read one replica's region, provisioning state and health status,
      including whether its regional endpoint is serving pulls.
    category: replication
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/replications/${replication_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      replication_name:
        type: string
        description: Name of the replica, usually the region name.
        example: eastus
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The replica resource.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        location: {type: string}
        properties: {type: object}

  create_replication:
    title: Replicate a registry to another region
    description: >-
      Add a geo-replica so pulls in that region are served locally. Premium
      tier only. The initial sync copies every image, so a large registry takes
      time and adds storage cost in the new region.
    category: replication
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/replications/${replication_name}
      query:
        api-version: "${api_version}"
      body:
        location: "${location}"
        tags: "${tags}"
        properties:
          regionEndpointEnabled: "${region_endpoint_enabled}"
          zoneRedundancy: "${zone_redundancy}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      replication_name:
        type: string
        description: Name for the replica, conventionally the region name.
        example: eastus
      location:
        type: string
        description: Azure region to replicate into, e.g. eastus.
        example: eastus
      region_endpoint_enabled:
        type: boolean
        description: Whether this replica serves pulls on its own regional endpoint.
        optional: true
      zone_redundancy:
        type: string
        description: Spread this replica across availability zones. Immutable once set.
        optional: true
        enum: [Enabled, Disabled]
      tags:
        type: object
        description: Resource tags as key/value pairs.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The replica as accepted, with provisioning in progress.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_replication:
    title: Delete a geo-replication
    description: >-
      Remove a replica. Pulls from that region fall back to the home region,
      which works but is slower; the images themselves are not lost. The home
      region's replica cannot be deleted.
    category: replication
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/replications/${replication_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      replication_name:
        type: string
        description: Name of the replica to delete.
        example: eastus
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_webhooks:
    title: List a registry's webhooks
    description: >-
      List the webhooks defined on a registry, with the actions each fires on
      (push, delete, quarantine, chart_push, chart_delete), its scope and
      whether it is enabled. Webhooks are how a push triggers a deployment.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's webhooks.
      type: array
      items: {type: object, description: "id, name, location and properties (status, scope, actions, provisioningState)."}
      response_path: value

  get_webhook:
    title: Get a webhook
    description: >-
      Read one webhook's actions, scope and status. The service URI and custom
      headers are withheld here because they may contain secrets -- use
      get_webhook_callback_config to see those.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name of the webhook.
        example: deployhook
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The webhook resource, without its service URI or headers.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  create_or_update_webhook:
    title: Create or replace a webhook
    description: >-
      Define a webhook that posts to service_uri when the chosen actions happen
      in the registry. scope narrows it to a repository or tag ("web:*"); leave
      it out to fire on everything. A full PUT, so send every field you want
      kept -- including service_uri, which cannot be read back.
    category: webhooks
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}
      query:
        api-version: "${api_version}"
      body:
        location: "${location}"
        tags: "${tags}"
        properties:
          serviceUri: "${service_uri}"
          actions: "${actions}"
          scope: "${scope}"
          status: "${status}"
          customHeaders: "${custom_headers}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name for the webhook.
        example: deployhook
      location:
        type: string
        description: Azure region for the webhook. Usually the registry's own region.
        example: westeurope
      service_uri:
        type: string
        description: URL the registry POSTs the event payload to.
        format: uri
        example: https://example.com/hooks/acr
      actions:
        type: array
        description: 'Events to fire on: push, delete, quarantine, chart_push, chart_delete.'
        items: {type: string, enum: [push, delete, quarantine, chart_push, chart_delete]}
        example: [push]
      scope:
        type: string
        description: 'Repository or tag the webhook is limited to, e.g. "web:*". Omit for the whole registry.'
        optional: true
      status:
        type: string
        description: Whether the webhook fires at all.
        optional: true
        enum: [enabled, disabled]
      custom_headers:
        type: object
        description: Headers sent with each callback, e.g. an authorization header for the receiver.
        optional: true
      tags:
        type: object
        description: Resource tags as key/value pairs.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The webhook as stored, without its service URI or headers.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_webhook:
    title: Delete a webhook
    description: >-
      Remove a webhook. Whatever it triggered -- a deployment, a scan -- stops
      being triggered immediately, silently, so check what consumes it first.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name of the webhook to delete.
        example: deployhook
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty -- 200 when deleted, 204 when it was already gone.
      type: object

  ping_webhook:
    title: Send a test event to a webhook
    description: >-
      Fire a ping event at the webhook so you can confirm the receiver is
      reachable and authenticating. Returns an event id; pair it with
      list_webhook_events to see the response the receiver gave.
    category: webhooks
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}/ping
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name of the webhook to test.
        example: deployhook
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The id of the ping event that was sent.
      type: object
      properties:
        id: {type: string}

  list_webhook_events:
    title: List a webhook's recent deliveries
    description: >-
      List the events the webhook recently fired, each with the request that
      was sent and the response the receiver gave, including its status code.
      This is where to look when a push did not trigger what it should have.
    category: webhooks
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}/listEvents
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name of the webhook.
        example: deployhook
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Recent deliveries, each with the request sent and the response received.
      type: array
      items: {type: object, description: "id, eventRequestMessage and eventResponseMessage (statusCode, reasonPhrase, content)."}
      response_path: value

  get_webhook_callback_config:
    title: Get a webhook's callback configuration
    description: >-
      Return the webhook's service URI and custom headers -- the fields
      get_webhook withholds because they can carry credentials. A POST for that
      reason.
    category: webhooks
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/webhooks/${webhook_name}/getCallbackConfig
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      webhook_name:
        type: string
        description: Name of the webhook.
        example: deployhook
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The webhook's callback URL and headers.
      type: object
      properties:
        serviceUri: {type: string}
        customHeaders: {type: object}

  list_scope_maps:
    title: List a registry's scope maps
    description: >-
      List the scope maps on a registry. A scope map is a named set of
      repository permissions -- content/read, content/write, content/delete,
      metadata/read, metadata/write -- that a token is then bound to. Registries
      ship with built-in _repositories_pull and _repositories_push maps.
    category: access
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/scopeMaps
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's scope maps.
      type: array
      items: {type: object, description: "id, name and properties (description, actions, type, creationDate)."}
      response_path: value

  get_scope_map:
    title: Get a scope map
    description: >-
      Read one scope map's actions -- the exact repository/permission pairs it
      grants. Read this before binding a token to it, since the map is what
      decides what the token can do.
    category: access
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/scopeMaps/${scope_map_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      scope_map_name:
        type: string
        description: Name of the scope map.
        example: ci-push
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The scope map and the actions it grants.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object, description: "description, type, actions, creationDate."}

  create_or_update_scope_map:
    title: Create or replace a scope map
    description: >-
      Define a named set of repository permissions. Each action is
      "repositories/<repo>/<permission>" where permission is content/read,
      content/write, content/delete, metadata/read or metadata/write. A full
      PUT: the actions list you send replaces the previous one entirely, which
      means it can silently widen or narrow what every bound token can do.
    category: access
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/scopeMaps/${scope_map_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          description: "${description}"
          actions: "${actions}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      scope_map_name:
        type: string
        description: Name for the scope map.
        example: ci-push
      actions:
        type: array
        description: >-
          The permissions granted, each "repositories/<repo>/<permission>".
          Replaces the map's previous actions entirely.
        items: {type: string}
        example: [repositories/web/content/read, repositories/web/content/write]
      description:
        type: string
        description: Free-text note describing what the map is for.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The scope map as stored.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_scope_map:
    title: Delete a scope map
    description: >-
      Remove a scope map. Tokens bound to it lose their permissions, so any
      pipeline authenticating with one starts failing. Built-in maps cannot be
      deleted.
    category: access
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/scopeMaps/${scope_map_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      scope_map_name:
        type: string
        description: Name of the scope map to delete.
        example: ci-push
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_tokens:
    title: List a registry's tokens
    description: >-
      List the repository-scoped access tokens on a registry, each with the
      scope map it is bound to and its status. A token is an identity a
      pipeline authenticates as, scoped to specific repositories rather than to
      the whole registry.
    category: access
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tokens
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's tokens.
      type: array
      items: {type: object, description: "id, name and properties (scopeMapId, status, credentials, creationDate)."}
      response_path: value

  get_token:
    title: Get a token
    description: >-
      Read one token's scope map, status and the metadata of its two password
      slots -- when each was created and when it expires. The password values
      themselves are never returned; only generate_credentials produces those.
    category: access
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tokens/${token_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      token_name:
        type: string
        description: Name of the token.
        example: ci-token
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The token resource, without any password values.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  create_or_update_token:
    title: Create or replace a token
    description: >-
      Create a repository-scoped token bound to a scope map, or change an
      existing one. Creating the token does not produce a password -- call
      generate_credentials afterwards for that. Set status disabled to revoke a
      token's access without deleting it.
    category: access
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tokens/${token_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          scopeMapId: "${scope_map_id}"
          status: "${status}"
          credentials: "${credentials}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      token_name:
        type: string
        description: Name for the token. This is also the username it authenticates with.
        example: ci-token
      scope_map_id:
        type: string
        description: Full ARM id of the scope map that decides what this token may do.
        example: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/acr-rg/providers/Microsoft.ContainerRegistry/registries/contosoacr/scopeMaps/ci-push
      status:
        type: string
        description: disabled revokes the token's access without deleting it.
        optional: true
        enum: [enabled, disabled]
      credentials:
        type: object
        description: Certificate-based credentials for the token, when not using passwords.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The token as stored, without any password values.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_token:
    title: Delete a token
    description: >-
      Remove a token. Anything authenticating as it stops working immediately.
      To pause access instead, set its status to disabled with
      create_or_update_token.
    category: access
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tokens/${token_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      token_name:
        type: string
        description: Name of the token to delete.
        example: ci-token
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  generate_credentials:
    title: Generate a password for a token
    description: >-
      Mint a password for a repository-scoped token. The value is returned once
      and cannot be read back, so capture it. Give an expiry -- a token password
      with no expiry is a permanent credential. Each token holds two password
      slots so they can be rotated without downtime.
    category: access
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/generateCredentials
      query:
        api-version: "${api_version}"
      body:
        tokenId: "${token_id}"
        name: "${name}"
        expiry: "${expiry}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      token_id:
        type: string
        description: Full ARM id of the token to mint a password for.
        example: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/acr-rg/providers/Microsoft.ContainerRegistry/registries/contosoacr/tokens/ci-token
      name:
        type: string
        description: Which of the token's two password slots to fill.
        optional: true
        enum: [password1, password2]
      expiry:
        type: string
        description: ISO 8601 timestamp the password stops working at. Omitting it creates a permanent credential.
        optional: true
        example: "2027-01-01T00:00:00Z"
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The token's username and the generated password, returned only this once.
      type: object
      properties:
        username: {type: string}
        passwords: {type: array, description: "Each with name, value and expiry."}

  list_cache_rules:
    title: List a registry's cache rules
    description: >-
      List the artifact cache rules on a registry. A cache rule mirrors an
      upstream repository -- Docker Hub, MCR -- into this registry on first
      pull, so builds stop depending on the upstream being reachable or on rate
      limits.
    category: cache
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/cacheRules
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's cache rules.
      type: array
      items: {type: object, description: "id, name and properties (sourceRepository, targetRepository, credentialSetResourceId)."}
      response_path: value

  get_cache_rule:
    title: Get a cache rule
    description: >-
      Read one cache rule -- which upstream repository it mirrors, which local
      repository it lands in, and which credential set it authenticates
      upstream with.
    category: cache
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/cacheRules/${cache_rule_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      cache_rule_name:
        type: string
        description: Name of the cache rule.
        example: dockerhub-nginx
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The cache rule.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  create_or_update_cache_rule:
    title: Create or replace a cache rule
    description: >-
      Mirror an upstream repository into this registry. source_repository is
      the upstream path ("docker.io/library/nginx") and target_repository the
      local one it appears under; images are cached on first pull. Anonymous
      upstreams need no credential set, but Docker Hub rate limits make one
      worth having.
    category: cache
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/cacheRules/${cache_rule_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          sourceRepository: "${source_repository}"
          targetRepository: "${target_repository}"
          credentialSetResourceId: "${credential_set_resource_id}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      cache_rule_name:
        type: string
        description: Name for the cache rule.
        example: dockerhub-nginx
      source_repository:
        type: string
        description: Upstream repository to mirror, e.g. docker.io/library/nginx.
        example: docker.io/library/nginx
      target_repository:
        type: string
        description: Local repository the cached images appear under.
        example: cached/nginx
      credential_set_resource_id:
        type: string
        description: ARM id of a credential set holding the upstream registry's credentials.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The cache rule as stored.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_cache_rule:
    title: Delete a cache rule
    description: >-
      Remove a cache rule. Images already cached stay in the target repository
      and keep serving; new upstream tags simply stop being mirrored.
    category: cache
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/cacheRules/${cache_rule_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      cache_rule_name:
        type: string
        description: Name of the cache rule to delete.
        example: dockerhub-nginx
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_tasks:
    title: List a registry's build tasks
    description: >-
      List the ACR Tasks on a registry -- the build and patch pipelines that
      run inside ACR, on a schedule, on a source commit, or when a base image
      updates. Note the Tasks family versions separately from the registry
      resource, so this tool has its own api-version default.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tasks
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: The registry's tasks.
      type: array
      items: {type: object, description: "id, name, location and properties (status, platform, agentConfiguration, step, trigger, creationDate)."}
      response_path: value

  get_task:
    title: Get a build task
    description: >-
      Read one task's definition -- its build step (Docker, file-based or
      encoded), platform, timeout, agent size and triggers. Credentials and the
      source token are withheld from this response.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tasks/${task_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      task_name:
        type: string
        description: Name of the task.
        example: build-web
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: The task definition.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  create_or_update_task:
    title: Create or replace a build task
    description: >-
      Define an ACR Task -- a build that runs inside the registry rather than
      on your own agents. step describes what to build (a Dockerfile, a
      multi-step YAML file or an encoded task), platform its OS and
      architecture, and trigger when it runs: on a source commit, on a
      schedule, or when a base image is updated. A full PUT.
    category: tasks
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tasks/${task_name}
      query:
        api-version: "${api_version}"
      body:
        location: "${location}"
        tags: "${tags}"
        identity: "${identity}"
        properties:
          status: "${status}"
          platform: "${platform}"
          step: "${step}"
          trigger: "${trigger}"
          agentConfiguration: "${agent_configuration}"
          timeout: "${timeout}"
          credentials: "${credentials}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      task_name:
        type: string
        description: Name for the task.
        example: build-web
      location:
        type: string
        description: Azure region for the task. Usually the registry's own region.
        example: westeurope
      platform:
        type: object
        description: 'Build platform, e.g. {"os": "Linux", "architecture": "amd64"}.'
        example: {os: Linux, architecture: amd64}
      step:
        type: object
        description: >-
          What to build -- an object with type (Docker, FileTask or
          EncodedTask), contextPath, dockerFilePath or taskFilePath, and
          imageNames.
        example: {type: Docker, contextPath: "https://github.com/contoso/web.git", dockerFilePath: Dockerfile, imageNames: ["web:{{.Run.ID}}"], isPushEnabled: true}
      trigger:
        type: object
        description: >-
          When the task runs -- sourceTriggers for commits, timerTriggers for a
          schedule, baseImageTrigger to rebuild when the base image changes.
        optional: true
      status:
        type: string
        description: Whether the task's triggers fire at all.
        optional: true
        enum: [Enabled, Disabled]
      agent_configuration:
        type: object
        description: 'Build agent size, e.g. {"cpu": 2}.'
        optional: true
      timeout:
        type: integer
        description: Seconds a run may take before it is cancelled.
        optional: true
        minimum: 300
        maximum: 28800
      credentials:
        type: object
        description: Registry credentials the build uses to pull base images from private registries.
        optional: true
      identity:
        type: object
        description: 'Managed identity for the task, e.g. {"type": "SystemAssigned"}.'
        optional: true
      tags:
        type: object
        description: Resource tags as key/value pairs.
        optional: true
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: The task as stored.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  delete_task:
    title: Delete a build task
    description: >-
      Remove an ACR Task and its triggers. Runs already completed keep their
      logs; nothing new is scheduled or triggered afterwards.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/tasks/${task_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      task_name:
        type: string
        description: Name of the task to delete.
        example: build-web
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: Empty -- 200 when deleted, 204 when it was already gone.
      type: object

  schedule_run:
    title: Start a build run
    description: >-
      Queue a run on the registry. run_request is the request object, whose
      type decides what runs: TaskRunRequest to run an existing task now,
      DockerBuildRequest or FileTaskRunRequest to run an ad-hoc build. Returns
      the run with its runId; poll get_run for status and
      get_run_log_sas_url for output. This builds and can push images.
    category: runs
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/scheduleRun
      query:
        api-version: "${api_version}"
      body: "${run_request}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      run_request:
        type: object
        description: >-
          The run request. type is TaskRunRequest (with taskId) to run an
          existing task, or DockerBuildRequest / FileTaskRunRequest for an
          ad-hoc build with its own platform and source.
        example: {type: TaskRunRequest, taskId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/acr-rg/providers/Microsoft.ContainerRegistry/registries/contosoacr/tasks/build-web}
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: The queued run, with its runId and initial status.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object, description: "runId, status, createTime, runType, task, outputImages."}

  list_runs:
    title: List build runs
    description: >-
      List the registry's build runs, newest first, each with its status, which
      task produced it and the images it output. Narrow with an OData filter
      such as "TaskName eq 'build-web'".
    category: runs
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/runs
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
        $top: "${top}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      filter:
        type: string
        description: 'OData filter over the runs, e.g. "TaskName eq ''build-web''".'
        optional: true
      top:
        type: integer
        description: How many runs to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: A page of build runs, newest first.
      type: object
      properties:
        value: {type: array, description: "Each with name, properties.runId, status, runType, task, startTime, finishTime, outputImages."}
        nextLink: {type: string}

  get_run:
    title: Get a build run
    description: >-
      Read one run's status, timings, the task and source that produced it and
      the images it pushed. status moves through Queued, Running and then
      Succeeded, Failed, Canceled or Timeout.
    category: runs
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/runs/${run_id}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      run_id:
        type: string
        description: The run id, from schedule_run or list_runs.
        example: ca1
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: The run and its current status.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        properties: {type: object}

  cancel_run:
    title: Cancel a build run
    description: >-
      Stop a queued or running build. Whatever it had already pushed stays
      pushed, so a cancelled run can leave a partially updated repository.
    category: runs
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/runs/${run_id}/cancel
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      run_id:
        type: string
        description: The run id to cancel.
        example: ca1
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: Empty; cancellation is asynchronous and reports through the azure-asyncoperation header.
      type: object

  get_run_log_sas_url:
    title: Get a build run's log link
    description: >-
      Return a short-lived SAS URL for the run's build log. This is how to see
      why a build failed -- the log itself lives in blob storage, not in the
      ARM response.
    category: runs
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/runs/${run_id}/listLogSasUrl
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      run_id:
        type: string
        description: The run id whose log to fetch.
        example: ca1
      api_version:
        type: string
        description: ACR Tasks API version, which differs from the registry's.
        optional: true
        default: "2019-06-01-preview"
    output:
      description: A temporary download link for the run's build log.
      type: object
      properties:
        logLink: {type: string, description: "SAS URL of the log blob."}

  list_private_link_resources:
    title: List private link resource types
    description: >-
      List the group ids a private endpoint may target on a registry -- needed
      when creating the private endpoint itself, which asks for the group id
      rather than inferring it. Premium tier only.
    category: networking
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/privateLinkResources
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The private link group ids the registry supports.
      type: array
      items: {type: object, description: "id, name and properties (groupId, requiredMembers, requiredZoneNames)."}
      response_path: value

  list_private_endpoint_connections:
    title: List private endpoint connections
    description: >-
      List the private endpoint connections to a registry, each with its
      approval state. This is how a registry is reached from a virtual network
      without a public login server. Premium tier only.
    category: networking
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/privateEndpointConnections
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The registry's private endpoint connections.
      type: array
      items: {type: object, description: "id, name and properties (privateEndpoint, privateLinkServiceConnectionState, provisioningState)."}
      response_path: value

  update_private_endpoint_connection:
    title: Approve or reject a private endpoint connection
    description: >-
      Set the approval state of a private endpoint connection -- Approved lets
      the private endpoint reach the registry, Rejected refuses it. This is the
      call that completes a cross-subscription private link request.
    category: networking
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/privateEndpointConnections/${connection_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          privateLinkServiceConnectionState:
            status: "${status}"
            description: "${description}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      connection_name:
        type: string
        description: Name of the private endpoint connection.
        example: contosoacr-pe-connection
      status:
        type: string
        description: New approval state for the connection.
        enum: [Pending, Approved, Rejected, Disconnected]
        example: Approved
      description:
        type: string
        description: Note recorded with the decision, shown to the requester.
        optional: true
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The connection after the state change.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  delete_private_endpoint_connection:
    title: Delete a private endpoint connection
    description: >-
      Remove a private endpoint connection. Pulls from that private endpoint
      stop reaching the registry at once; if public access is also disabled the
      registry may become unreachable entirely.
    category: networking
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.ContainerRegistry/registries/${registry_name}/privateEndpointConnections/${connection_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: Resource group the registry is in.
        example: acr-rg
      registry_name:
        type: string
        description: Name of the registry.
        example: contosoacr
      connection_name:
        type: string
        description: Name of the private endpoint connection to remove.
        example: contosoacr-pe-connection
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: Empty; deletion runs asynchronously and reports through the azure-asyncoperation header.
      type: object

  list_operations:
    title: List Microsoft.ContainerRegistry operations
    description: >-
      List every ARM operation the container registry provider exposes, with
      the display name of each. Useful for identifying which role action a 403
      is actually complaining about.
    category: service
    read_only: true
    request:
      method: GET
      path: /providers/Microsoft.ContainerRegistry/operations
      query:
        api-version: "${api_version}"
    input:
      api_version:
        type: string
        description: Microsoft.ContainerRegistry ARM API version to call.
        optional: true
        default: "2025-11-01"
    output:
      description: The provider's available operations.
      type: array
      items: {type: object, description: "name and display (provider, resource, operation, description)."}
      response_path: value
