        type: string
        description: ACC project id to import members into.
      users:
        type: array
        description: One entry per member, each with email, products and optional roles.
        items: {type: object}
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: Per-user import results, with successes and failures.
