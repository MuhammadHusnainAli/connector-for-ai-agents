# Alai tools -- AI presentation generation: decks from text, single slides,
# exports to PDF and PowerPoint, speaker transcripts, themes and vibes, and the
# Modern Slides API for presentations, infographics, carousels and posters.
#
# Every path, parameter and body field below comes from the OpenAPI description
# Alai publishes at https://docs.getalai.com/openapi.json (25 operations). The
# connection's base url is https://slides-api.getalai.com with the key as a
# bearer token, so paths start at /api.
#
# Two APIs live side by side:
#
#   * **Classic and Creative** (/api/v1): generate_presentation turns text into
#     a deck; add_slide, export_presentation and generate_transcripts work on an
#     existing one. All of them are asynchronous -- they return a
#     generation_id, and get_generation reports pending, in_progress, completed
#     (with links and download URLs) or failed. Poll every few seconds; most
#     finish within two minutes;
#   * **Modern** (/api/modern/v1): create_modern_presentation makes an empty
#     artifact in a chosen format and canvas, then generate_modern_presentation
#     fills it, edit_modern_presentation revises it by instruction, and
#     export_modern_presentation renders it. Those return an operation to poll
#     with get_modern_operation, which cancel_modern_operation can stop.
#
# Generation spends Alai credits; AI images and creative variants cost more.
#
# Not covered: the two image upload routes (POST /api/v1/upload-images and
# POST /api/modern/v1/presentations/{id}/assets), which take multipart files
# these JSON tools cannot send. Images already uploaded in Alai can still be
# used by id.
#
# Docs: https://docs.getalai.com

connector_id: alai
display_name: Alai
docs_url: https://docs.getalai.com
tools:

  ping:
    title: Verify the API key
    description: >-
      Check that the API key works; returns the user id it belongs to.
    category: account
    read_only: true
    request:
      method: GET
      path: /api/v1/ping
    input: {}
    output:
      description: The user id.
      type: object

  list_presentations:
    title: List presentations
    description: >-
      List the Classic and Creative presentations the user owns, with their ids and titles.
    category: presentations
    read_only: true
    request:
      method: GET
      path: /api/v1/presentations
    input: {}
    output:
      description: The presentations.
      type: array
      items:
        type: object

  list_themes:
    title: List themes
    description: >-
      List the system and user themes -- colours, fonts and styling -- with the ids generate_presentation
      takes.
    category: presentations
    read_only: true
    request:
      method: GET
      path: /api/v1/themes
    input: {}
    output:
      description: Themes with ids and names.
      type: array
      items:
        type: object

  list_vibes:
    title: List vibes
    description: >-
      List the system and custom vibes, the visual aesthetics for creative image slides, with
      their ids.
    category: presentations
    read_only: true
    request:
      method: GET
      path: /api/v1/vibes
    input: {}
    output:
      description: Vibes with ids and names.
      type: array
      items:
        type: object

  generate_presentation:
    title: Generate a presentation
    description: >-
      Turn text, markdown or notes into a designed deck: set the title, theme, slide count,
      language, AI or web images and export formats, or append to an existing presentation.
      Asynchronous and credit-consuming; poll get_generation with the returned generation_id.
    category: presentations
    request:
      method: POST
      path: /api/v1/generations
      body:
        input_text: ${input_text}
        additional_instructions: ${additional_instructions}
        image_ids: ${image_ids}
        export_formats: ${export_formats}
        presentation_options:
          title: ${title}
          theme_id: ${theme_id}
          slide_range: ${slide_range}
          existing_presentation_id: ${existing_presentation_id}
          total_variants_per_slide: ${total_variants_per_slide}
          vibe_id: ${vibe_id}
        text_options:
          language: ${language}
        image_options:
          include_ai_images: ${include_ai_images}
          include_web_images: ${include_web_images}
          style: ${image_style}
          style_instructions: ${image_style_instructions}
          num_image_variants: ${num_image_variants}
    input:
      input_text:
        type: string
        description: 'Content to turn into slides: plain text, markdown or structured notes.
          More input usually means more slides.'
      additional_instructions:
        type: string
        optional: true
        description: Guidance on style, focus or requirements not covered by the other options.
      title:
        type: string
        optional: true
        description: Presentation title for the title slide and exports.
      theme_id:
        type: string
        optional: true
        description: Theme id from list_themes.
      slide_range:
        type: string
        optional: true
        enum:
        - auto
        - '1'
        - 2-5
        - 6-10
        - 11-15
        - 16-20
        - 21-25
        - 26-50
        description: Target slide count; auto sizes to the input.
      existing_presentation_id:
        type: string
        optional: true
        description: Append the slides to this presentation instead of creating a new one.
      total_variants_per_slide:
        type: integer
        optional: true
        minimum: 1
        maximum: 4
        description: Distinct design options to generate for each slide.
      vibe_id:
        type: string
        optional: true
        description: Vibe id from list_vibes for creative variants; needs num_image_variants
          of at least 1.
      language:
        type: string
        optional: true
        description: Output language, e.g. English (US), Spanish (Spain), German, Japanese;
          defaults to the input's language.
      include_ai_images:
        type: boolean
        optional: true
        description: Generate AI images for slides (default true).
      include_web_images:
        type: boolean
        optional: true
        description: Search the web for images (default true).
      image_style:
        type: string
        optional: true
        enum:
        - auto
        - realistic
        - artistic
        - cartoon
        - three_d
        - custom
        description: AI image style.
      image_style_instructions:
        type: string
        optional: true
        description: Describe the image aesthetic; required when image_style is custom.
      num_image_variants:
        type: integer
        optional: true
        minimum: 0
        maximum: 2
        description: Creative image-led slide variants per slide; costs extra.
      image_ids:
        type: array
        items:
          type: string
        optional: true
        description: Ids of images already uploaded to Alai to place on relevant slides.
      export_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
          - link
          - pdf
          - ppt
        description: 'Exports to produce when done: link (shareable URL), pdf, ppt. Defaults
          to link.'
    output:
      description: The generation_id.
      type: object

  get_generation:
    title: Get a generation
    description: >-
      Poll any Classic asynchronous job -- a deck, slide, export or transcript -- for pending,
      in_progress, completed with its results and links, or failed with an error.
    category: presentations
    read_only: true
    request:
      method: GET
      path: /api/v1/generations/${generation_id}
    input:
      generation_id:
        type: string
        description: Generation id returned by an asynchronous call.
    output:
      description: The generation's status and results.
      type: object

  add_slide:
    title: Add a slide
    description: >-
      Add one AI-designed slide to an existing presentation from its content, as a classic
      text slide or a creative image-led one, at a position or at the end. Asynchronous; poll
      get_generation.
    category: presentations
    request:
      method: POST
      path: /api/v1/presentations/${presentation_id}/slides
      body:
        slide_context: ${slide_context}
        export_formats: ${export_formats}
        options:
          additional_instructions: ${additional_instructions}
          slide_type: ${slide_type}
          slide_order: ${slide_order}
          total_variants_per_slide: ${total_variants_per_slide}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      slide_context:
        type: string
        description: Content for the slide.
      additional_instructions:
        type: string
        optional: true
        description: Guidance on this slide's style or focus.
      slide_type:
        type: string
        optional: true
        enum:
        - classic
        - creative
        description: classic for editable text-led slides, creative for image-led ones.
      slide_order:
        type: integer
        optional: true
        minimum: 0
        description: 0-based position; appends when omitted.
      total_variants_per_slide:
        type: integer
        optional: true
        minimum: 1
        maximum: 4
        description: Distinct design options to generate.
      export_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
          - link
          - pdf
          - ppt
        description: Exports to produce when done.
    output:
      description: The generation_id.
      type: object

  delete_slide:
    title: Delete a slide
    description: >-
      Remove one slide from a presentation permanently.
    category: presentations
    destructive: true
    request:
      method: DELETE
      path: /api/v1/presentations/${presentation_id}/slides/${slide_id}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      slide_id:
        type: string
        description: Slide id.
    output:
      description: Confirmation.
      type: object

  export_presentation:
    title: Export a presentation
    description: >-
      Export a presentation as a shareable link, PDF or PowerPoint. Asynchronous; the download
      URLs appear in get_generation once completed.
    category: presentations
    request:
      method: POST
      path: /api/v1/presentations/${presentation_id}/exports
      body:
        formats: ${formats}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      formats:
        type: array
        description: 'Formats to export: link, pdf, ppt.'
        optional: true
        items:
          type: string
          enum:
          - link
          - pdf
          - ppt
    output:
      description: The generation_id.
      type: object

  generate_transcripts:
    title: Generate slide transcripts
    description: >-
      Extract each slide's text and layout as a structured description, for all slides or
      chosen ones. Asynchronous; poll get_generation.
    category: presentations
    request:
      method: POST
      path: /api/v1/presentations/${presentation_id}/transcripts
      body:
        slide_ids: ${slide_ids}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      slide_ids:
        type: array
        description: Slides to transcribe; all when omitted.
        optional: true
        items:
          type: string
    output:
      description: The generation_id.
      type: object

  delete_presentation:
    title: Delete a presentation
    description: >-
      Delete a Classic or Creative presentation and its slides permanently.
    category: presentations
    destructive: true
    request:
      method: DELETE
      path: /api/v1/presentations/${presentation_id}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
    output:
      description: Confirmation.
      type: object

  modern_ping:
    title: Check the Modern API
    description: >-
      Check that the key can reach Alai's Modern Slides API.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/ping
    input: {}
    output:
      description: Confirmation.
      type: object

  list_modern_models:
    title: List Modern models
    description: >-
      List the models the Modern agents can use, for the model argument of the generate and
      edit tools.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/models
    input: {}
    output:
      description: The models.
      type: object

  list_design_systems:
    title: List design systems
    description: >-
      List the design systems -- brand styling -- a Modern presentation can be created with.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/design-systems
    input: {}
    output:
      description: The design systems.
      type: object

  list_modern_presentations:
    title: List Modern presentations
    description: >-
      List the Modern API artifacts -- presentations, infographics, carousels, posters and
      social posts.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/presentations
    input: {}
    output:
      description: The artifacts.
      type: object

  create_modern_presentation:
    title: Create a Modern presentation
    description: >-
      Create an empty Modern artifact in a format and canvas, optionally with a design system.
      Fill it with generate_modern_presentation.
    category: modern
    request:
      method: POST
      path: /api/modern/v1/presentations
      body:
        title: ${title}
        artifact_format: ${artifact_format}
        design_system_id: ${design_system_id}
        canvas:
          preset: ${canvas_preset}
          width: ${canvas_width}
          height: ${canvas_height}
    input:
      title:
        type: string
        optional: true
        description: Title (default Untitled Presentation).
      artifact_format:
        type: string
        optional: true
        enum:
        - presentation
        - infographic
        - carousel
        - poster
        - social_post
        description: What to make.
      design_system_id:
        type: string
        optional: true
        description: Design system id from list_design_systems.
      canvas_preset:
        type: string
        optional: true
        enum:
        - '16:9'
        - '4:3'
        - '1:1'
        - custom
        description: Canvas shape (default 16:9).
      canvas_width:
        type: integer
        optional: true
        minimum: 100
        maximum: 2400
        description: Width in pixels, for a custom canvas.
      canvas_height:
        type: integer
        optional: true
        minimum: 100
        maximum: 3240
        description: Height in pixels, for a custom canvas.
    output:
      description: The created artifact.
      type: object

  get_modern_presentation:
    title: Get a Modern presentation
    description: >-
      Read a Modern artifact with its slides and current commit.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/presentations/${presentation_id}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
    output:
      description: The artifact.
      type: object

  delete_modern_presentation:
    title: Delete a Modern presentation
    description: >-
      Delete a Modern artifact and its slides permanently.
    category: modern
    destructive: true
    request:
      method: DELETE
      path: /api/modern/v1/presentations/${presentation_id}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
    output:
      description: Confirmation.
      type: object

  generate_modern_presentation:
    title: Generate a Modern presentation
    description: >-
      Have the Modern agent build a Modern artifact's slides from content, instructions, a
      slide count and uploaded assets. Asynchronous and credit-consuming; poll get_modern_operation.
    category: modern
    request:
      method: POST
      path: /api/modern/v1/presentations/${presentation_id}/generate
      body:
        content: ${content}
        instructions: ${instructions}
        slide_count: ${slide_count}
        asset_ids: ${asset_ids}
        model:
          id: ${model}
        idempotency_key: ${idempotency_key}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      content:
        type: string
        description: Source content for the slides.
      instructions:
        type: string
        optional: true
        max_length: 10000
        description: How to build it.
      slide_count:
        type: integer
        optional: true
        minimum: 1
        maximum: 50
        description: Number of slides.
      asset_ids:
        type: array
        items:
          type: string
        optional: true
        description: Ids of assets already uploaded to this presentation.
      model:
        type: string
        optional: true
        enum:
        - openai/gpt-5.6-sol
        - openai/gpt-5.6-terra
        - anthropic/claude-opus-4.8
        - anthropic/claude-sonnet-5
        - anthropic/claude-sonnet-4-6
        - anthropic/claude-haiku-4-5
        - google/gemini-3.1-pro-preview
        - google/gemini-3.8-flash
        - moonshotai/kimi-k2.6
        - z-ai/glm-5.3-flash
        - anthropic/claude-opus-4.8-fast
        - anthropic/claude-fable-5
        description: Model the Modern agent uses; omit for Alai's default.
      idempotency_key:
        type: string
        optional: true
        min_length: 1
        max_length: 128
        description: 'Key making retries of this request safe: the same key never starts a
          second run.'
    output:
      description: The operation.
      type: object

  edit_modern_presentation:
    title: Edit a Modern presentation
    description: >-
      Revise a Modern artifact by instruction, across all slides or chosen ones, optionally
      pinned to a commit so a stale edit fails. Asynchronous; poll get_modern_operation.
    category: modern
    request:
      method: POST
      path: /api/modern/v1/presentations/${presentation_id}/edits
      body:
        instruction: ${instruction}
        slide_ids: ${slide_ids}
        asset_ids: ${asset_ids}
        model:
          id: ${model}
        base_commit_sha: ${base_commit_sha}
        idempotency_key: ${idempotency_key}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      instruction:
        type: string
        description: What to change, e.g. make the title slide bolder.
      slide_ids:
        type: array
        items:
          type: string
        optional: true
        description: Slides to edit; all when omitted.
      asset_ids:
        type: array
        items:
          type: string
        optional: true
        description: Uploaded assets the edit may use.
      model:
        type: string
        optional: true
        enum:
        - openai/gpt-5.6-sol
        - openai/gpt-5.6-terra
        - anthropic/claude-opus-4.8
        - anthropic/claude-sonnet-5
        - anthropic/claude-sonnet-4-6
        - anthropic/claude-haiku-4-5
        - google/gemini-3.1-pro-preview
        - google/gemini-3.8-flash
        - moonshotai/kimi-k2.6
        - z-ai/glm-5.3-flash
        - anthropic/claude-opus-4.8-fast
        - anthropic/claude-fable-5
        description: Model the Modern agent uses; omit for Alai's default.
      base_commit_sha:
        type: string
        optional: true
        min_length: 7
        max_length: 64
        description: Commit sha the change must apply to, so a stale edit fails instead of
          overwriting newer work.
      idempotency_key:
        type: string
        optional: true
        min_length: 1
        max_length: 128
        description: 'Key making retries of this request safe: the same key never starts a
          second run.'
    output:
      description: The operation.
      type: object

  export_modern_presentation:
    title: Export a Modern presentation
    description: >-
      Render a Modern artifact to PDF, PowerPoint or PNG, with file name, scale, shadow and
      compression options. Asynchronous; poll get_modern_operation for the files.
    category: modern
    request:
      method: POST
      path: /api/modern/v1/presentations/${presentation_id}/exports
      body:
        formats: ${formats}
        filename: ${filename}
        scale: ${scale}
        disable_shadows: ${disable_shadows}
        compress_pdf: ${compress_pdf}
        base_commit_sha: ${base_commit_sha}
        idempotency_key: ${idempotency_key}
    input:
      presentation_id:
        type: string
        description: Presentation id, from list_presentations or a completed generation.
      formats:
        type: array
        min_length: 1
        items:
          type: string
          enum:
          - pdf
          - pptx
          - png
        description: 'Formats: pdf, pptx, png.'
      filename:
        type: string
        optional: true
        min_length: 1
        max_length: 160
        description: Base file name for the exports.
      scale:
        type: number
        optional: true
        description: Render scale (default 1.0).
      disable_shadows:
        type: boolean
        optional: true
        description: True to render without shadows.
      compress_pdf:
        type: boolean
        optional: true
        description: True to compress the PDF.
      base_commit_sha:
        type: string
        optional: true
        min_length: 7
        max_length: 64
        description: Commit sha the change must apply to, so a stale edit fails instead of
          overwriting newer work.
      idempotency_key:
        type: string
        optional: true
        min_length: 1
        max_length: 128
        description: 'Key making retries of this request safe: the same key never starts a
          second run.'
    output:
      description: The operation.
      type: object

  get_modern_operation:
    title: Get a Modern operation
    description: >-
      Poll a Modern generate, edit or export operation for its status and, once done, its
      results or files.
    category: modern
    read_only: true
    request:
      method: GET
      path: /api/modern/v1/operations/${operation_id}
    input:
      operation_id:
        type: string
        description: Operation id returned by a Modern API call.
    output:
      description: The operation.
      type: object

  cancel_modern_operation:
    title: Cancel a Modern operation
    description: >-
      Stop a Modern operation that is still running.
    category: modern
    destructive: true
    request:
      method: POST
      path: /api/modern/v1/operations/${operation_id}/cancel
    input:
      operation_id:
        type: string
        description: Operation id returned by a Modern API call.
    output:
      description: The cancelled operation.
      type: object
