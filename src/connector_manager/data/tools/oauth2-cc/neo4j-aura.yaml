# Neo4j Aura API tools -- the control plane, not the graph.
#
# Two different things are called "Neo4j" in this catalogue and they are not
# interchangeable:
#
#   * `neo4j-aura` (this pack) drives https://api.neo4j.io, the *management*
#     API. It creates, resizes, pauses, snapshots and deletes instances. It
#     cannot read or write a single node;
#   * `neo4j` drives the Query API on an instance's own host and is where
#     Cypher runs. Its pack is data/tools/basic/neo4j.yaml.
#
# The API is versioned in the path, and the connector's base url stops at the
# host, so every path here starts with its version:
#
#   * **/v1** is the stable surface, and everything an Aura instance needs is
#     in it -- instances, snapshots, projects, customer managed keys and GDS
#     sessions. Aura calls a project a "tenant" in v1 paths and `tenant_id`
#     fields; the Console calls the same thing a project, so the tools are
#     named for the project and the argument keeps the wire name;
#   * **/v2beta1** is Aura's newer, organization-scoped surface, published live
#     at https://api.neo4j.io/v2beta1/spec.json. It adds what v1 has no
#     endpoint for at all: organizations, users and roles, invites, IP filters,
#     billing, activity feeds, and -- for the instances that support multiple
#     databases -- per-database backups. Every tool that uses it says so in its
#     notes, because a beta surface can change under you.
#
# Three things worth knowing before driving this:
#
#   * **almost every write is asynchronous.** Create, delete, pause, resume,
#     resize, overwrite, snapshot and restore all return 202 with the record as
#     it stands *now*. Poll `get_instance` until `status` settles on `running`
#     or `paused` rather than assuming the call finished the job;
#   * **`create_instance` returns the only copy of the password.** The 202 body
#     carries `username` and `password` for the new instance and nothing will
#     ever show them again. Store them on the way past or the instance is
#     unreachable;
#   * **an operation in flight blocks the next one.** A second write while an
#     instance is `updating` comes back 409, not queued.
#
# `overwrite_instance` and `restore_snapshot` are flagged destructive because
# they replace the target instance's data wholesale -- the target is the one
# that loses its contents, not the source.
#
# The token is a plain client-credentials grant against
# https://api.neo4j.io/oauth/token with the client id and secret sent as HTTP
# Basic, which the connector already does; it carries no scopes, so no tool
# here declares any. Aura authorises on the credential's own organization and
# project roles instead, and the endpoints that need an admin say so.
#
# Not covered: the v1beta5 data-science surface, and v2beta1's agents, fleet
# manager, virtual graphs and import jobs -- those are moving fast enough that
# a pack written against them would be wrong before it shipped. Creating and
# updating IP filters is also left out: the spec documents the endpoints but
# publishes no request body for them, and inventing one is worse than omitting
# the tool. `get_from_api` and friends reach all of them.
#
# Docs: https://neo4j.com/docs/aura/api/overview/
# Spec: https://neo4j.com/docs/aura/platform/api/specification/

connector_id: neo4j-aura
display_name: Neo4j Aura (management API)
docs_url: https://neo4j.com/docs/aura/platform/api/specification/

tools:

  # -- instances -------------------------------------------------------------

  list_instances:
    title: List Aura instances
    description: >-
      Every Aura instance the credential can see, as a summary: id, name,
      project (`tenant_id`), cloud provider and creation time. Pass project_id
      to narrow it to one project; omit it for every project the credential
      reaches. Status, size, region and connection url are not in the summary --
      call get_instance for those.
    category: instances
    read_only: true
    request:
      method: GET
      path: /v1/instances
      query:
        tenantId: "${project_id}"
    input:
      project_id:
        type: string
        description: Only list instances in this project (Aura's `tenantId`), from list_projects.
        optional: true
    output:
      description: A summary of each visible instance.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, name, tenant_id, cloud_provider and created_at."}

  get_instance:
    title: Get an Aura instance
    description: >-
      Everything about one instance -- `status`, `connection_url`, memory,
      storage, region, type, project and whether vector optimization or the
      graph analytics plugin is on. This is the poll target for every
      asynchronous operation in this pack: create, resize, pause, resume,
      overwrite and restore all finish when `status` reaches `running` (or
      `paused`).
    category: instances
    read_only: true
    request:
      method: GET
      path: /v1/instances/${instance_id}
    input:
      instance_id:
        type: string
        description: The instance id, from list_instances.
        example: db1d1234
    output:
      description: The instance, including its current status and connection url.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        name: {type: string, description: "The instance name in the Console."}
        status: {type: string, description: "creating, running, pausing, paused, resuming, updating, restoring, overwriting, destroying, suspended or loading failed."}
        connection_url: {type: string, description: "The neo4j+s:// url to connect a driver with."}
        memory: {type: string, description: "Memory in GB, e.g. 8GB."}
        storage: {type: string, description: "Storage in GB. Absent on AuraDB Free."}
        region: {type: string, description: "The cloud region hosting the instance."}
        type: {type: string, description: "free-db, professional-db, professional-ds, business-critical, enterprise-db or enterprise-ds."}
        cloud_provider: {type: string, description: "gcp, aws or azure."}
        tenant_id: {type: string, description: "The project the instance belongs to."}
        metrics_integration_url: {type: string, description: "Prometheus scrape endpoint, where the plan includes metrics integration."}
        created_at: {type: string, description: "When the instance was created."}

  create_instance:
    title: Create an Aura instance
    description: >-
      Start creating an instance. Every one of version, region, memory, type and
      cloud_provider has to be a combination the project actually allows -- read
      get_project first and pick from its `instance_configurations`, because a
      value that is valid for one project is rejected for another.

      The 202 response is the ONLY place the new instance's `username` and
      `password` appear; nothing can retrieve them later. Creation is
      asynchronous and usually takes a few minutes: poll get_instance until
      `status` is `running` before connecting.

      Setting source_instance_id clones an existing instance into the new one,
      and source_snapshot_id picks which of that instance's snapshots to clone
      from (the snapshot must be exportable).
    category: instances
    request:
      method: POST
      path: /v1/instances
      headers:
        content-type: application/json
      body:
        name: "${name}"
        version: "${version}"
        region: "${region}"
        memory: "${memory}"
        type: "${type}"
        tenant_id: "${project_id}"
        cloud_provider: "${cloud_provider}"
        source_instance_id: "${source_instance_id}"
        source_snapshot_id: "${source_snapshot_id}"
        customer_managed_key_id: "${customer_managed_key_id}"
        vector_optimized: "${vector_optimized}"
        graph_analytics_plugin: "${graph_analytics_plugin}"
    input:
      name:
        type: string
        description: The instance name shown in the Console. Any UTF-8, no leading or trailing whitespace.
        example: Instance01
        min_length: 1
        max_length: 30
      version:
        type: string
        description: Neo4j version, from the project's instance_configurations.
        example: "5"
      region:
        type: string
        description: Cloud region, from the project's instance_configurations.
        example: europe-west1
      memory:
        type: string
        description: Instance memory in GB, from the project's instance_configurations.
        example: 8GB
      type:
        type: string
        description: >-
          Instance type. `enterprise-db` is what the API calls Virtual Dedicated
          Cloud. Must be one the project allows.
        enum: [free-db, professional-db, professional-ds, business-critical, enterprise-db, enterprise-ds]
      project_id:
        type: string
        description: The project (Aura's `tenant_id`) to create the instance in, from list_projects.
      cloud_provider:
        type: string
        description: Cloud provider hosting the instance, from the project's instance_configurations.
        enum: [gcp, aws, azure]
      source_instance_id:
        type: string
        description: Clone this existing instance into the new one.
        optional: true
        example: db1d1234
      source_snapshot_id:
        type: string
        description: >-
          Clone from this specific snapshot of source_instance_id, which must
          also be given. The snapshot has to be exportable.
        optional: true
      customer_managed_key_id:
        type: string
        description: Encrypt the instance with this customer managed key, from list_customer_managed_keys.
        optional: true
      vector_optimized:
        type: boolean
        description: Create the instance optimized for vector workloads.
        optional: true
      graph_analytics_plugin:
        type: boolean
        description: Enable the graph analytics (GDS) plugin on the instance.
        optional: true
    output:
      description: The instance as created, with the one and only copy of its password.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The new instance id."}
        connection_url: {type: string, description: "The neo4j+s:// url to connect with."}
        username: {type: string, description: "Initial username, normally neo4j. Store it now."}
        password: {type: string, description: "Initial password. This is the only time it is ever returned."}
        tenant_id: {type: string, description: "The project the instance was created in."}
        type: {type: string, description: "The instance type."}
        region: {type: string, description: "The region it was created in."}
        created_at: {type: string, description: "When creation started."}

  update_instance:
    title: Rename or resize an instance
    description: >-
      Change an instance's name, memory, storage, vector optimization or graph
      analytics plugin. Send only the fields you want changed; anything omitted
      is left alone. The instance stays available throughout, but the change is
      asynchronous -- poll get_instance until `status` leaves `updating`.
      Valid memory and storage values come from get_project's
      `instance_configurations`.
    category: instances
    notes: Resizing is billed at the new size from the moment it takes effect.
    request:
      method: PATCH
      path: /v1/instances/${instance_id}
      headers:
        content-type: application/json
      body:
        name: "${name}"
        memory: "${memory}"
        storage: "${storage}"
        vector_optimized: "${vector_optimized}"
        graph_analytics_plugin: "${graph_analytics_plugin}"
    input:
      instance_id:
        type: string
        description: The instance to edit.
        example: db1d1234
      name:
        type: string
        description: New name for the instance in the Console.
        optional: true
        example: Instance01
        min_length: 1
        max_length: 30
      memory:
        type: string
        description: New memory size in GB, from the project's instance_configurations.
        optional: true
        example: 16GB
      storage:
        type: string
        description: New storage size in GB. Not applicable to AuraDB Free.
        optional: true
        example: 32GB
      vector_optimized:
        type: boolean
        description: Turn vector optimization on or off.
        optional: true
      graph_analytics_plugin:
        type: boolean
        description: Turn the graph analytics plugin on or off.
        optional: true
    output:
      description: The instance with the change applied or in progress.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        status: {type: string, description: "updating while the change is in flight."}
        memory: {type: string, description: "Memory after the change."}
        storage: {type: string, description: "Storage after the change."}

  delete_instance:
    title: Delete an instance
    description: >-
      Start destroying an instance and everything in it. Deletion is
      asynchronous and irreversible -- the data is gone and the snapshots go
      with it. Returns 202 and the instance in `destroying`; a 409 means another
      operation is still running on it. DELETE is idempotent here, so repeating
      the call on an already-deleted instance is safe.
    category: instances
    destructive: true
    request:
      method: DELETE
      path: /v1/instances/${instance_id}
    input:
      instance_id:
        type: string
        description: The instance to destroy.
        example: db1d1234
    output:
      description: The instance, now in the destroying state.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        status: {type: string, description: "destroying."}

  pause_instance:
    title: Pause an instance
    description: >-
      Suspend an instance so it stops serving queries and stops accruing compute
      charges; storage is still billed. Pausing is asynchronous and takes longer
      the more data the instance holds -- poll get_instance until `status` is
      `paused`. A 409 means another operation is already running on it. Reverse
      with resume_instance.
    category: instances
    request:
      method: POST
      path: /v1/instances/${instance_id}/pause
      headers:
        content-type: application/json
      body: {}
    input:
      instance_id:
        type: string
        description: The instance to pause.
        example: db1d1234
    output:
      description: The instance, now pausing.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        status: {type: string, description: "pausing, then paused."}

  resume_instance:
    title: Resume a paused instance
    description: >-
      Bring a paused instance back online. Asynchronous: poll get_instance until
      `status` is `running` before connecting. A 409 means another operation is
      already in flight on the instance.
    category: instances
    request:
      method: POST
      path: /v1/instances/${instance_id}/resume
      headers:
        content-type: application/json
      body: {}
    input:
      instance_id:
        type: string
        description: The instance to resume.
        example: db1d1234
    output:
      description: The instance, now resuming.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        status: {type: string, description: "resuming, then running."}

  overwrite_instance:
    title: Overwrite an instance with another instance's data
    description: >-
      Replace everything in the target instance with the contents of a source
      instance -- the Console's "Clone to existing". Giving only
      source_instance_id snapshots that instance first and overwrites from the
      new snapshot; giving source_snapshot_id as well overwrites from that exact
      snapshot instead.

      The target's current data is discarded. Asynchronous: poll get_instance
      until `status` leaves `overwriting`.
    category: instances
    destructive: true
    request:
      method: POST
      path: /v1/instances/${instance_id}/overwrite
      headers:
        content-type: application/json
      body:
        source_instance_id: "${source_instance_id}"
        source_snapshot_id: "${source_snapshot_id}"
    input:
      instance_id:
        type: string
        description: The instance whose data will be replaced.
        example: db1d1234
      source_instance_id:
        type: string
        description: The instance to copy data from.
        example: db1d5678
      source_snapshot_id:
        type: string
        description: >-
          A specific snapshot of source_instance_id to overwrite from. Omit to
          take a fresh snapshot of the source first.
        optional: true
    output:
      description: The target instance, now overwriting.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The target instance id."}
        status: {type: string, description: "overwriting."}

  upgrade_instance:
    title: Upgrade a Professional instance to Business Critical
    description: >-
      Move an AuraDB Professional instance onto the Business Critical plan.
      Optionally resize it in the same operation by giving both memory and
      storage -- one without the other is rejected, and omitting both keeps the
      current configuration. Not available on Marketplace projects or trial
      instances.
    category: instances
    notes: Business Critical is billed at a higher rate than Professional.
    request:
      method: POST
      path: /v1/instances/${instance_id}/upgrade
      headers:
        content-type: application/json
      body:
        memory: "${memory}"
        storage: "${storage}"
    input:
      instance_id:
        type: string
        description: The Professional instance to upgrade.
        example: db1d1234
      memory:
        type: string
        description: Resize memory as part of the upgrade. Requires storage too.
        optional: true
        example: 16GB
      storage:
        type: string
        description: Resize storage as part of the upgrade. Requires memory too.
        optional: true
        example: 32GB
    output:
      description: The instance on its new plan.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        type: {type: string, description: "business-critical once the upgrade lands."}
        status: {type: string, description: "The instance status."}

  estimate_instance_size:
    title: Estimate the size an instance needs
    description: >-
      Ask Aura what size an instance should be for a graph of a given shape,
      before creating it. Returns the recommended memory, the minimum memory
      that would work, and whether the answer exceeds what the project is
      allowed to create. Supported for the data science types
      (`professional-ds`, `enterprise-ds`) depending on the project's
      configuration. Feed `recommended_size` straight into create_instance's
      memory.
    category: instances
    read_only: true
    request:
      method: POST
      path: /v1/instances/sizing
      headers:
        content-type: application/json
      body:
        node_count: "${node_count}"
        relationship_count: "${relationship_count}"
        instance_type: "${instance_type}"
        algorithm_categories: "${algorithm_categories}"
    input:
      node_count:
        type: integer
        description: How many nodes the instance will hold.
        minimum: 0
        example: "1000000"
      relationship_count:
        type: integer
        description: How many relationships the instance will hold.
        minimum: 0
        example: "5000000"
      instance_type:
        type: string
        description: The instance type to size for.
        optional: true
        enum: [professional-ds, enterprise-ds, professional-db, business-critical, enterprise-db, free-db]
      algorithm_categories:
        type: array
        description: GDS algorithm categories the workload will run, which affects the estimate.
        optional: true
        items: {type: string}
    output:
      description: The recommended size and the floor below which it will not fit.
      type: object
      response_path: data
      properties:
        recommended_size: {type: string, description: "Memory to ask create_instance for."}
        min_required_memory: {type: string, description: "The smallest memory that would hold the graph."}
        did_exceed_maximum: {type: boolean, description: "True when the estimate is larger than the project may create."}

  # -- snapshots -------------------------------------------------------------

  list_snapshots:
    title: List an instance's snapshots
    description: >-
      Snapshots of one instance for a single day -- today unless `date` says
      otherwise, so this is a per-day listing, not the whole history. Each entry
      carries its `snapshot_id`, `status` (Completed, InProgress, Pending,
      Failed) and whether it was Scheduled or AdHoc. The ids feed
      restore_snapshot and create_instance's source_snapshot_id.
    category: snapshots
    read_only: true
    request:
      method: GET
      path: /v1/instances/${instance_id}/snapshots
      query:
        date: "${date}"
    input:
      instance_id:
        type: string
        description: The instance whose snapshots to list.
        example: db1d1234
      date:
        type: string
        description: The day to list snapshots for, as YYYY-MM-DD. Defaults to today.
        optional: true
        format: date
        example: "2026-01-15"
    output:
      description: That day's snapshots for the instance.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with snapshot_id, instance_id, profile, status and timestamp."}

  get_snapshot:
    title: Get a snapshot
    description: >-
      One snapshot's status and timestamp. Poll this after create_snapshot until
      `status` is `Completed` -- a snapshot that is still `InProgress` or
      `Pending` cannot be restored from.
    category: snapshots
    read_only: true
    request:
      method: GET
      path: /v1/instances/${instance_id}/snapshots/${snapshot_id}
    input:
      instance_id:
        type: string
        description: The instance the snapshot belongs to.
        example: db1d1234
      snapshot_id:
        type: string
        description: The snapshot id, from list_snapshots or create_snapshot.
    output:
      description: The snapshot and its status.
      type: object
      response_path: data
      properties:
        snapshot_id: {type: string, description: "The snapshot id."}
        instance_id: {type: string, description: "The instance it was taken from."}
        profile: {type: string, description: "AdHoc for an on-demand snapshot, Scheduled for an automatic one."}
        status: {type: string, description: "Pending, InProgress, Completed, Failed or Cancelled."}
        timestamp: {type: string, description: "When the snapshot was taken."}

  create_snapshot:
    title: Take an on-demand snapshot
    description: >-
      Start an ad-hoc snapshot of an instance. Returns the `snapshot_id`
      immediately; the snapshot itself takes longer the more data the instance
      holds. Poll get_snapshot until `status` is `Completed` before restoring or
      cloning from it. This is the call to make before any destructive change --
      an overwrite, a large delete, a schema migration.
    category: snapshots
    request:
      method: POST
      path: /v1/instances/${instance_id}/snapshots
      headers:
        content-type: application/json
      body: {}
    input:
      instance_id:
        type: string
        description: The instance to snapshot.
        example: db1d1234
    output:
      description: The id of the snapshot now being taken.
      type: object
      response_path: data
      properties:
        snapshot_id: {type: string, description: "Poll get_snapshot with this until it is Completed."}

  restore_snapshot:
    title: Restore an instance from a snapshot
    description: >-
      Roll an instance back to a snapshot, replacing everything currently in it.
      Asynchronous: poll get_instance until `status` leaves `restoring`. A 409
      means another operation is already running on the instance. Take a
      create_snapshot first if the current contents might still be wanted --
      restoring does not keep them.
    category: snapshots
    destructive: true
    request:
      method: POST
      path: /v1/instances/${instance_id}/snapshots/${snapshot_id}/restore
      headers:
        content-type: application/json
      body: {}
    input:
      instance_id:
        type: string
        description: The instance to restore into.
        example: db1d1234
      snapshot_id:
        type: string
        description: The snapshot to restore from. Must be Completed.
    output:
      description: The instance, now restoring.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        status: {type: string, description: "restoring."}

  # -- projects (tenants) ----------------------------------------------------

  list_projects:
    title: List Aura projects
    description: >-
      Every project (what the API calls a tenant) the credential can reach, as
      id and name. A project is the unit instances, keys and GDS sessions belong
      to, so almost everything else in this pack needs an id from here. Takes no
      arguments.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/tenants
    input: {}
    output:
      description: Every visible project.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id and name."}

  get_project:
    title: Get a project and what it may create
    description: >-
      One project, with the `instance_configurations` list that decides what
      create_instance will accept: every valid combination of cloud_provider,
      region, type, version, memory and storage for this project. Read it before
      creating or resizing anything -- a size that works in one project is
      rejected in another.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/tenants/${project_id}
    input:
      project_id:
        type: string
        description: The project id (Aura's `tenantId`), from list_projects.
    output:
      description: The project and every instance configuration it allows.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The project id."}
        name: {type: string, description: "The project name."}
        instance_configurations: {type: array, description: "Each a valid {cloud_provider, region, region_name, type, version, memory, storage} combination."}

  get_project_metrics_integration:
    title: Get a project's metrics integration endpoint
    description: >-
      The Prometheus-compatible scrape url for a project's Customer Metrics
      Integration, for pointing an observability stack at Aura. Available on the
      plans that include CMI; projects without it have no endpoint to return.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/tenants/${project_id}/metrics-integration
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
    output:
      description: The project's metrics scrape endpoint.
      type: object
      response_path: data
      properties:
        endpoint: {type: string, description: "The metrics integration endpoint url."}

  # -- customer managed keys -------------------------------------------------

  list_customer_managed_keys:
    title: List customer managed encryption keys
    description: >-
      Every customer managed key the credential can see, as id, name and the
      project it belongs to. Pass project_id to narrow it. A key here is the
      handle create_instance takes as customer_managed_key_id; the key material
      itself lives in your own cloud provider's KMS.
    category: encryption
    read_only: true
    request:
      method: GET
      path: /v1/customer-managed-keys
      query:
        tenantId: "${project_id}"
    input:
      project_id:
        type: string
        description: Only list keys in this project, from list_projects.
        optional: true
    output:
      description: A summary of each visible key.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, name and tenant_id."}

  get_customer_managed_key:
    title: Get a customer managed key
    description: >-
      One key's full record -- its `status`, the region and instance type it was
      configured for, and the `key_id` it points at in your cloud provider (the
      Key ARN on AWS). A key is only usable for instances in that same region
      and of that same type. Poll `status` after create_customer_managed_key.
    category: encryption
    read_only: true
    request:
      method: GET
      path: /v1/customer-managed-keys/${key_id}
    input:
      key_id:
        type: string
        description: The Aura key id (a UUID), from list_customer_managed_keys.
    output:
      description: The key, its status and what it may encrypt.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The Aura key id."}
        name: {type: string, description: "The key name."}
        status: {type: string, description: "Whether the key is ready to encrypt instances with."}
        cloud_provider: {type: string, description: "gcp, aws or azure."}
        region: {type: string, description: "The only region this key can encrypt instances in."}
        instance_type: {type: string, description: "enterprise-db or enterprise-ds."}
        key_id: {type: string, description: "The key's id in your own cloud provider; the Key ARN on AWS."}
        tenant_id: {type: string, description: "The project the key belongs to."}
        created: {type: string, description: "When the key was registered."}

  create_customer_managed_key:
    title: Register a customer managed encryption key
    description: >-
      Register a key from your own cloud KMS with Aura so instances can be
      created encrypted with it. Creation is asynchronous, and the key is not
      usable straight away: after this call you have to grant Aura permission on
      the key in your cloud provider, following the instructions the Console
      shows under Customer Managed Keys. Poll get_customer_managed_key until its
      `status` says it is ready.
    category: encryption
    notes: Region and instance_type are fixed at creation -- a key only encrypts instances matching both.
    request:
      method: POST
      path: /v1/customer-managed-keys
      headers:
        content-type: application/json
      body:
        name: "${name}"
        key_id: "${key_id}"
        region: "${region}"
        instance_type: "${instance_type}"
        tenant_id: "${project_id}"
        cloud_provider: "${cloud_provider}"
    input:
      name:
        type: string
        description: A name for the key in Aura.
        example: Production Key
        min_length: 1
        max_length: 30
      key_id:
        type: string
        description: The key's identifier in your own cloud provider. On AWS this is the Key ARN.
      region:
        type: string
        description: The region whose instances this key will encrypt, from the project's instance_configurations.
        example: europe-west1
      instance_type:
        type: string
        description: The instance type this key will encrypt.
        enum: [enterprise-db, enterprise-ds, business-critical, professional-db, professional-ds, free-db]
      project_id:
        type: string
        description: The project (Aura's `tenant_id`) the key belongs to.
      cloud_provider:
        type: string
        description: The cloud provider holding the key.
        enum: [gcp, aws, azure]
    output:
      description: The registered key, pending the permissions grant in your cloud provider.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The Aura key id; pass to create_instance as customer_managed_key_id."}
        status: {type: string, description: "Not usable until this reports the key as ready."}
        region: {type: string, description: "The region the key is bound to."}
        instance_type: {type: string, description: "The instance type the key is bound to."}

  delete_customer_managed_key:
    title: Delete a customer managed key
    description: >-
      Remove a key from Aura. Only works while no instance is using it -- an
      active key comes back 400 with `reason` set to
      `encryption-key-is-active`. This deletes Aura's registration, not the key
      in your own KMS.
    category: encryption
    destructive: true
    request:
      method: DELETE
      path: /v1/customer-managed-keys/${key_id}
    input:
      key_id:
        type: string
        description: The Aura key id to remove.
    output:
      description: Empty on success; 400 with encryption-key-is-active when instances still use the key.
      type: object

  # -- graph data science sessions -------------------------------------------

  list_gds_sessions:
    title: List GDS sessions
    description: >-
      Every Graph Data Science session the credential can see. Narrow by
      instance, project or organization. A session is separate compute for graph
      algorithms: attached to an instance it can project data from it and write
      results back; standalone it holds a graph of its own. Sessions expire on
      their `ttl` of inactivity, so a `status` of `Expired` here explains a
      session that stopped answering.
    category: graph-analytics
    read_only: true
    request:
      method: GET
      path: /v1/graph-analytics/sessions
      query:
        instanceId: "${instance_id}"
        tenantId: "${project_id}"
        organizationId: "${organization_id}"
    input:
      instance_id:
        type: string
        description: Only sessions attached to this instance.
        optional: true
        example: db1d1234
      project_id:
        type: string
        description: Only sessions in this project (Aura's `tenantId`).
        optional: true
      organization_id:
        type: string
        description: Only sessions in this organization.
        optional: true
    output:
      description: The matching GDS sessions.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, name, memory, status, host, ttl, instance_id and tenant_id."}

  get_gds_session:
    title: Get a GDS session
    description: >-
      One session by id -- its `status` (Creating, Ready, Expired, Failed), the
      `host` to point the GDS client at, its memory, ttl and expiry, and the
      instance it is attached to if any. Poll after create_gds_session until
      `status` is `Ready`.
    category: graph-analytics
    read_only: true
    request:
      method: GET
      path: /v1/graph-analytics/sessions/${session_id}
    input:
      session_id:
        type: string
        description: The session id, from list_gds_sessions or create_gds_session.
    output:
      description: The session and its current state.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The session id."}
        name: {type: string, description: "The session name."}
        status: {type: string, description: "Creating, Ready, Expired or Failed."}
        host: {type: string, description: "Where the session is reachable."}
        memory: {type: string, description: "Session memory in GB."}
        ttl: {type: integer, description: "Seconds of inactivity before it expires."}
        expiry_date: {type: string, description: "When the session expires."}
        instance_id: {type: string, description: "The attached instance, empty when standalone."}

  create_gds_session:
    title: Get or create a GDS session
    description: >-
      Idempotent by (name, project): if a session with this name already exists
      in the project it is returned, otherwise a new one is created. Give
      instance_id to attach the session to an instance -- that is what lets it
      project data out of the graph and write results back; leave it off for a
      standalone session. Creation is asynchronous, so poll get_gds_session
      until `status` is `Ready`. Size it with estimate_gds_session_size rather
      than guessing.
    category: graph-analytics
    notes: A session bills for its compute until it expires on ttl or delete_gds_session removes it.
    request:
      method: POST
      path: /v1/graph-analytics/sessions
      headers:
        content-type: application/json
      body:
        name: "${name}"
        tenant_id: "${project_id}"
        memory: "${memory}"
        ttl: "${ttl}"
        instance_id: "${instance_id}"
        database_uuid: "${database_uuid}"
        cloud_provider: "${cloud_provider}"
        region: "${region}"
    input:
      name:
        type: string
        description: The session name. Reusing a name in the same project returns that session instead of creating another.
        example: people-and-fruit
        min_length: 1
      project_id:
        type: string
        description: The project (Aura's `tenant_id`) the session belongs to.
      memory:
        type: string
        description: Session memory, e.g. "8GB". Take it from estimate_gds_session_size.
        optional: true
        example: 8GB
      ttl:
        type: string
        description: How long the session may sit idle before expiring, e.g. "30m" or "2h". Defaults to 1 hour.
        optional: true
        example: 30m
      instance_id:
        type: string
        description: Attach the session to this instance, enabling projection and write-back.
        optional: true
        example: db1d1234
      database_uuid:
        type: string
        description: The UUID of the database on that instance the session is created from.
        optional: true
      cloud_provider:
        type: string
        description: Cloud provider to host a standalone session on, from the project's configurations.
        optional: true
        enum: [gcp, aws, azure]
      region:
        type: string
        description: Region to host a standalone session in, from the project's configurations.
        optional: true
        example: europe-west1
    output:
      description: The session, existing or newly created.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The session id."}
        status: {type: string, description: "Creating on a new session, Ready when it can be used."}
        host: {type: string, description: "Where to point the GDS client."}
        expiry_date: {type: string, description: "When it expires if left idle."}

  estimate_gds_session_size:
    title: Estimate the size a GDS session needs
    description: >-
      Ask Aura how much memory a session needs for a graph of a given shape,
      counting properties and labels as well as nodes and relationships. Feed
      `recommended_size` into create_gds_session's memory. Costs nothing and
      changes nothing.
    category: graph-analytics
    read_only: true
    request:
      method: POST
      path: /v1/graph-analytics/sessions/sizing
      headers:
        content-type: application/json
      body:
        node_count: "${node_count}"
        relationship_count: "${relationship_count}"
        node_property_count: "${node_property_count}"
        node_label_count: "${node_label_count}"
        relationship_property_count: "${relationship_property_count}"
        algorithm_categories: "${algorithm_categories}"
    input:
      node_count:
        type: integer
        description: How many nodes the session will hold.
        minimum: 0
        example: "1000000"
      relationship_count:
        type: integer
        description: How many relationships the session will hold.
        minimum: 0
        example: "5000000"
      node_property_count:
        type: integer
        description: Properties per node.
        optional: true
        minimum: 0
      node_label_count:
        type: integer
        description: Labels per node.
        optional: true
        minimum: 0
      relationship_property_count:
        type: integer
        description: Properties per relationship.
        optional: true
        minimum: 0
      algorithm_categories:
        type: array
        description: GDS algorithm categories the session will run, which changes the estimate.
        optional: true
        items: {type: string}
    output:
      description: The recommended session size and the memory behind the estimate.
      type: object
      response_path: data
      properties:
        recommended_size: {type: string, description: "Memory to ask create_gds_session for."}
        estimated_memory: {type: string, description: "The estimated memory the graph itself needs."}

  delete_gds_session:
    title: Delete a GDS session
    description: >-
      Tear a session down and stop it billing. Any in-memory graph the session
      holds goes with it; results already written back to an attached instance
      stay. Sessions also expire on their own after `ttl` of inactivity.
    category: graph-analytics
    destructive: true
    request:
      method: DELETE
      path: /v1/graph-analytics/sessions/${session_id}
    input:
      session_id:
        type: string
        description: The session to delete.
    output:
      description: The id of the deleted session.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The session that was deleted."}

  # -- organizations (v2beta1) -----------------------------------------------

  list_organizations:
    title: List Aura organizations
    description: >-
      Every Aura organization the credential belongs to, as id and name. An
      organization sits above projects: users, invites, IP filters and billing
      are organization-level, and every other v2beta1 tool in this pack needs an
      `org_id` from here. Takes no arguments.
    category: organizations
    notes: v2beta1 endpoint -- Aura's organization API is in beta and its shape can change.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations
    input: {}
    output:
      description: Every organization the credential can see.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id (a UUID) and name."}

  get_organization:
    title: Get an organization
    description: >-
      One organization by id. Thin on its own -- the useful detail lives in
      list_organization_projects, list_organization_users and the billing tools,
      all of which take this id.
    category: organizations
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
    output:
      description: The organization.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The organization UUID."}
        name: {type: string, description: "The organization name."}

  list_organization_projects:
    title: List an organization's projects
    description: >-
      The projects inside one organization, filtered to active ones by default.
      Pass status to see projects pending deletion or already deleted. The ids
      here are the same project ids the v1 tools call `tenantId`.
    category: organizations
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects
      query:
        status: "${status}"
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      status:
        type: string
        description: Only projects in this state. Defaults to active.
        optional: true
        enum: [active, deletion_request, deleted]
    output:
      description: The organization's projects.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id and name."}

  get_organization_activity_feed:
    title: Get an organization's activity feed
    description: >-
      The audit log for an organization over a time window: who did what, from
      which IP, when, and whether it succeeded. `start` and `end` are required
      and must be RFC3339 timestamps. Page with the `page_token` a previous
      response returned. This is where to look when an instance changed and
      nobody admits to it.
    category: organizations
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/activity-feed
      query:
        start: "${start}"
        end: "${end}"
        page_limit: "${page_limit}"
        page_token: "${page_token}"
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      start:
        type: string
        description: Start of the window, RFC3339.
        example: "2026-01-01T00:00:00Z"
      end:
        type: string
        description: End of the window, RFC3339.
        example: "2026-02-01T00:00:00Z"
      page_limit:
        type: string
        description: How many entries per page.
        optional: true
        example: "100"
      page_token:
        type: string
        description: Continue from a previous response's page token.
        optional: true
    output:
      description: A page of activity entries.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with action_name, description, email, ip_address, logged_at, project_name and status."}

  get_project_activity_feed:
    title: Get a project's activity feed
    description: >-
      The same audit log as get_organization_activity_feed, narrowed to one
      project. `start` and `end` are required RFC3339 timestamps; page with
      `page_token`.
    category: organizations
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/activity-feed
      query:
        start: "${start}"
        end: "${end}"
        page_limit: "${page_limit}"
        page_token: "${page_token}"
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      project_id:
        type: string
        description: The project id, from list_organization_projects or list_projects.
      start:
        type: string
        description: Start of the window, RFC3339.
        example: "2026-01-01T00:00:00Z"
      end:
        type: string
        description: End of the window, RFC3339.
        example: "2026-02-01T00:00:00Z"
      page_limit:
        type: string
        description: How many entries per page.
        optional: true
        example: "100"
      page_token:
        type: string
        description: Continue from a previous response's page token.
        optional: true
    output:
      description: A page of activity entries for the project.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with action_name, description, email, ip_address, logged_at and status."}

  # -- billing (v2beta1) -----------------------------------------------------

  get_billing_usage:
    title: Get billed usage for an organization
    description: >-
      Usage rows for an organization over a time window -- SKU, consumed
      quantity and unit, billable size, charge period and billing account for
      each. `start` and `end` are required RFC3339 timestamps. Narrow to one
      project with project_id, page with `page_token`.

      Two limits matter: this endpoint allows only 10 requests per organization
      per 24 hours, and the data refreshes once a day, so recent usage lags.
      Fetch a wide window once rather than polling.
    category: billing
    notes: v2beta1 endpoint -- in beta. Rate limited to 10 calls per organization per day.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/billing/usage
      query:
        start: "${start}"
        end: "${end}"
        project_id: "${project_id}"
        page_limit: "${page_limit}"
        page_token: "${page_token}"
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      start:
        type: string
        description: Start of the billing window, RFC3339.
        example: "2026-01-01T00:00:00Z"
      end:
        type: string
        description: End of the billing window, RFC3339.
        example: "2026-02-01T00:00:00Z"
      project_id:
        type: string
        description: Only usage for this project.
        optional: true
      page_limit:
        type: string
        description: How many rows per page.
        optional: true
        example: "100"
      page_token:
        type: string
        description: Continue from a previous response's page token.
        optional: true
    output:
      description: A page of usage rows, with links.next when there are more.
      type: object
      properties:
        data: {type: array, description: "Each with base_sku, consumed_quantity, consumed_unit, billable_size, charge_period_start/end and billing_account_id."}
        links: {type: object, description: "self, first and next page urls; next is null on the last page."}

  get_billing_ledger:
    title: Get an organization's credit ledger
    description: >-
      Credit balance rows for an organization over a time window: initial and
      remaining credit quantity per balance date, by billing account. `start`
      and `end` are required RFC3339 timestamps. Same limits as
      get_billing_usage -- 10 calls per organization per 24 hours, refreshed
      daily.
    category: billing
    notes: v2beta1 endpoint -- in beta. Rate limited to 10 calls per organization per day.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/billing/ledger
      query:
        start: "${start}"
        end: "${end}"
        page_limit: "${page_limit}"
        page_token: "${page_token}"
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      start:
        type: string
        description: Start of the window, RFC3339.
        example: "2026-01-01T00:00:00Z"
      end:
        type: string
        description: End of the window, RFC3339.
        example: "2026-02-01T00:00:00Z"
      page_limit:
        type: string
        description: How many rows per page.
        optional: true
        example: "100"
      page_token:
        type: string
        description: Continue from a previous response's page token.
        optional: true
    output:
      description: A page of credit ledger rows.
      type: object
      properties:
        data: {type: array, description: "Each with balance_date, initial_credit_quantity, remaining_credit_quantity and billing_account_id."}
        links: {type: object, description: "self, first and next page urls."}

  # -- users and invites (v2beta1) -------------------------------------------

  list_organization_users:
    title: List an organization's users
    description: >-
      Everyone in the organization, with their organization roles, MFA
      enrollment status and last activity timestamp. Requires the caller to be
      an organization admin. `last_activity_at` and
      `exempt_from_automatic_removal` are what an inactivity audit runs on.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/users
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
    output:
      description: Every user in the organization.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with user_id, email, organization_roles, mfa_enrollment_status and last_activity_at."}

  get_organization_user:
    title: Get an organization user
    description: >-
      One user in detail -- their organization roles, the projects they belong
      to and with what role there, and their MFA enrollment. Requires the caller
      to be an organization admin. This is the call that answers "what can this
      person actually reach".
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/users/${user_id}
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
      user_id:
        type: string
        description: The user's UUID, from list_organization_users.
    output:
      description: The user, their roles and their project memberships.
      type: object
      response_path: data
      properties:
        user_id: {type: string, description: "The user UUID."}
        email: {type: string, description: "The user's email address."}
        organization_roles: {type: array, description: "organization-owner, organization-admin or organization-member."}
        projects: {type: array, description: "The projects the user belongs to and their role in each."}
        mfa_enrollment_status: {type: string, description: "enrolled, not_enrolled, external_auth_provider or non_applicable."}
        last_activity_at: {type: string, description: "When they were last active; null if never."}

  update_organization_user_role:
    title: Change a user's organization role
    description: >-
      Set a user's role in the organization. Exactly one role may be given --
      the field is a list because that is the wire format, not because a user
      can hold two. Promoting to `organization-owner` or `organization-admin`
      grants control over every project, user and instance in the organization.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    request:
      method: PATCH
      path: /v2beta1/organizations/${org_id}/users/${user_id}
      headers:
        content-type: application/json
      body:
        organization_roles:
          - "${role}"
    input:
      org_id:
        type: string
        description: The organization id.
      user_id:
        type: string
        description: The user to change, from list_organization_users.
      role:
        type: string
        description: The single organization role to assign.
        enum: [organization-member, organization-admin, organization-owner]
    output:
      description: The user with their new role.
      type: object
      response_path: data
      properties:
        user_id: {type: string, description: "The user UUID."}
        organization_roles: {type: array, description: "The role now held."}

  remove_organization_user:
    title: Remove a user from an organization
    description: >-
      Revoke a user's access to the organization and every project in it. Their
      instances and data are untouched; only the person's access goes. Requires
      the caller to be an organization admin, and there is no undo -- getting
      them back means a fresh create_organization_invite.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    destructive: true
    request:
      method: DELETE
      path: /v2beta1/organizations/${org_id}/users/${user_id}
    input:
      org_id:
        type: string
        description: The organization id.
      user_id:
        type: string
        description: The user to remove.
    output:
      description: Empty on success.
      type: object

  list_organization_invites:
    title: List organization invites
    description: >-
      Pending and historical invites for an organization -- who was invited, by
      whom, with what organization and project roles, when the invite expires
      and its current status. Requires the caller to be an organization admin.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/invites
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
    output:
      description: Every invite on the organization.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, email, invited_by, organization_roles, project_invites, expires_at and status."}

  create_organization_invite:
    title: Invite someone to an organization
    description: >-
      Send an invite to an email address, granting the organization roles in
      `roles` when accepted. project_invites additionally puts them in specific
      projects with specific project roles -- each entry is
      `{"project_id": "<uuid>", "project_roles": ["project-member"]}`. Requires
      the caller to be an organization admin. Invites expire; check
      list_organization_invites for `expires_at`.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin. This sends mail to the invitee.
    request:
      method: POST
      path: /v2beta1/organizations/${org_id}/invites
      headers:
        content-type: application/json
      body:
        email: "${email}"
        roles: "${roles}"
        project_invites: "${project_invites}"
    input:
      org_id:
        type: string
        description: The organization to invite into.
      email:
        type: string
        description: The address to send the invite to.
        format: email
      roles:
        type: array
        description: Organization roles the invitee gets on accepting.
        items: {type: string, enum: [organization-member, organization-admin, organization-owner]}
      project_invites:
        type: array
        description: >-
          Project memberships to grant as well. Each entry is
          {"project_id": "<uuid>", "project_roles": ["namespace-member"]}.
        optional: true
        items: {type: object}
    output:
      description: The invite as created.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The invite UUID; pass to delete_organization_invite to revoke it."}
        email: {type: string, description: "Who it was sent to."}
        expires_at: {type: string, description: "After this the invite can no longer be accepted."}
        status: {type: string, description: "The invite's state."}

  delete_organization_invite:
    title: Revoke an organization invite
    description: >-
      Cancel an invite that has not been accepted yet, so the link stops
      working. Requires the caller to be an organization admin. Removing someone
      who already accepted is remove_organization_user instead.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be an organization admin.
    destructive: true
    request:
      method: DELETE
      path: /v2beta1/organizations/${org_id}/invites/${invite_id}
    input:
      org_id:
        type: string
        description: The organization the invite belongs to.
      invite_id:
        type: string
        description: The invite UUID, from list_organization_invites.
    output:
      description: Empty on success.
      type: object

  list_project_users:
    title: List a project's users
    description: >-
      Everyone with access to one project and the project role each holds.
      Requires the caller to be a project admin. Membership here is what governs
      access to the project's instances.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be a project admin.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/users
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project id, from list_organization_projects.
    output:
      description: Every user in the project.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with user_id, email and project_roles."}

  add_project_user:
    title: Add a user to a project
    description: >-
      Give an existing organization user access to one project with a single
      role. The user must already be in the organization -- invite them with
      create_organization_invite first if they are not. Requires the caller to
      be a project admin.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be a project admin.
    request:
      method: POST
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/users
      headers:
        content-type: application/json
      body:
        user_id: "${user_id}"
        project_roles:
          - "${role}"
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project to add them to.
      user_id:
        type: string
        description: The user's UUID, from list_organization_users.
      role:
        type: string
        description: The single project role to grant.
        enum: [project-viewer, project-member, project-admin, project-metrics-integration-reader]
    output:
      description: Empty or the created membership.
      type: object

  update_project_user_role:
    title: Change a user's project role
    description: >-
      Replace a user's role in one project. A user holds exactly one project
      role at a time, so this overwrites rather than adds. Requires the caller
      to be a project admin.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be a project admin.
    request:
      method: PATCH
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/users/${user_id}
      headers:
        content-type: application/json
      body:
        project_roles:
          - "${role}"
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the membership is in.
      user_id:
        type: string
        description: The user to change.
      role:
        type: string
        description: The single project role to assign.
        enum: [project-viewer, project-member, project-admin, project-metrics-integration-reader]
    output:
      description: The user with their new project role.
      type: object
      response_path: data
      properties:
        user_id: {type: string, description: "The user UUID."}
        email: {type: string, description: "The user's email."}
        project_roles: {type: array, description: "The role now held in this project."}

  remove_project_user:
    title: Remove a user from a project
    description: >-
      Take a user's access to one project away, leaving their organization
      membership intact. Requires the caller to be a project admin. Use
      remove_organization_user to cut them off everywhere instead.
    category: users
    notes: v2beta1 endpoint -- in beta. Caller must be a project admin.
    destructive: true
    request:
      method: DELETE
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/users/${user_id}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project to remove them from.
      user_id:
        type: string
        description: The user to remove.
    output:
      description: Empty on success.
      type: object

  # -- IP filters (v2beta1) --------------------------------------------------

  list_organization_ip_filters:
    title: List an organization's IP filters
    description: >-
      Every IP allow-list rule defined on the organization, each with its CIDR
      entries and the organizations, projects and instances it currently
      applies to. An instance covered by a filter refuses connections from
      outside the listed ranges, so this is the first place to look when a
      driver cannot reach an instance that is `running`.
    category: security
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/ip-filters
    input:
      org_id:
        type: string
        description: The organization id, from list_organizations.
    output:
      description: The organization's IP filters.
      type: array
      items: {type: object}

  get_organization_ip_filter:
    title: Get an IP filter
    description: >-
      One IP filter rule by id -- its description, its `allow_list` of CIDRs
      with a prefix length and description each, and the entities it is applied
      to. For how the rule lands on one particular instance, call
      get_instance_ip_filter instead.
    category: security
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/ip-filters/${ip_filter_id}
    input:
      org_id:
        type: string
        description: The organization id.
      ip_filter_id:
        type: string
        description: The filter id, from list_organization_ip_filters.
    output:
      description: The IP filter and what it covers.
      type: object
      properties:
        description: {type: string, description: "The rule's name."}
        allow_list: {type: array, description: "Each with address, prefix_len and an optional description."}
        filtered_entities: {type: object, description: "The organizations, projects and instances the rule applies to."}

  get_instance_ip_filter:
    title: Get the IP filter applied to an instance
    description: >-
      The IP filter covering one instance, with the status of its application to
      that instance. Answers "is this instance firewalled, and has the rule
      finished rolling out" -- which the organization-level listing cannot tell
      you.
    category: security
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/ip-filters
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance to check.
        example: db1d1234
    output:
      description: The filter applied to the instance, with its rollout status.
      type: object
      properties:
        allow_list: {type: array, description: "The CIDRs allowed to reach the instance."}
        description: {type: string, description: "The rule's name."}

  delete_organization_ip_filter:
    title: Delete an IP filter
    description: >-
      Remove an IP filter rule from the organization. Every instance the rule
      covered stops being restricted to those CIDRs, which widens network
      access -- confirm nothing depends on it before calling.
    category: security
    notes: v2beta1 endpoint -- in beta.
    destructive: true
    request:
      method: DELETE
      path: /v2beta1/organizations/${org_id}/ip-filters/${ip_filter_id}
    input:
      org_id:
        type: string
        description: The organization id.
      ip_filter_id:
        type: string
        description: The filter to delete.
    output:
      description: Empty on success.
      type: object

  # -- instances and databases (v2beta1) -------------------------------------

  list_project_instances:
    title: List a project's instances (v2)
    description: >-
      The instances in one project, through the organization-scoped API. The v1
      list_instances covers the same ground and is the stable one; reach for
      this when you are already working from an `org_id` or need the v2 instance
      record, which adds `multi_database` and `default_database_id` -- the two
      fields the database tools below depend on.
    category: instances
    notes: v2beta1 endpoint -- in beta. Prefer list_instances unless you need the v2 fields.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project id.
    output:
      description: The project's instances.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, name, cloud_provider and created_at."}

  get_project_instance:
    title: Get an instance (v2)
    description: >-
      One instance through the organization-scoped API. Adds `multi_database`
      and `default_database_id` to what get_instance returns, which is what
      tells you whether list_instance_databases will find more than one
      database on it.
    category: instances
    notes: v2beta1 endpoint -- in beta. Prefer get_instance unless you need the v2 fields.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance id.
        example: db1d1234
    output:
      description: The instance in the v2 shape.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The instance id."}
        name: {type: string, description: "The instance name."}
        legacy_status: {type: string, description: "The status, in the v1 vocabulary."}
        multi_database: {type: boolean, description: "Whether the instance can hold more than one database."}
        memory: {type: string, description: "Instance memory."}
        region: {type: string, description: "The region hosting it."}
        graph_analytics: {type: string, description: "unavailable, serverless or plugin."}

  list_instance_databases:
    title: List the databases on an instance
    description: >-
      The databases inside one instance, as id and name. Most Aura instances
      hold a single database called `neo4j`; instances with `multi_database`
      true can hold several, and each is backed up and restored independently.
      The ids here address the backup tools below.
    category: databases
    notes: v2beta1 endpoint -- in beta. Multiple databases require an instance with multi_database enabled.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance to list databases on.
        example: db1d1234
    output:
      description: The instance's databases.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id and name."}

  get_instance_database:
    title: Get a database on an instance
    description: >-
      One database by id, with its name. Pair it with list_database_backups to
      see what can be restored, and with the `neo4j` connector's Cypher tools to
      actually query it.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database id, from list_instance_databases.
    output:
      description: The database.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The database id."}
        name: {type: string, description: "The database name, as Cypher addresses it."}

  create_instance_database:
    title: Create a database on an instance
    description: >-
      Add a named database to an instance that supports more than one -- check
      `multi_database` with get_project_instance first, since single-database
      instances reject this. The name is what the Query API addresses in
      `/db/<name>/query/v2`, so pick something a connection can be configured
      with.
    category: databases
    notes: v2beta1 endpoint -- in beta. Requires an instance with multi_database enabled.
    request:
      method: POST
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases
      headers:
        content-type: application/json
      body:
        name: "${name}"
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance to create the database on.
        example: db1d1234
      name:
        type: string
        description: The database name.
        example: my-database
        min_length: 1
    output:
      description: The database as created.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The new database id."}
        name: {type: string, description: "The database name."}

  delete_instance_database:
    title: Delete a database from an instance
    description: >-
      Destroy one database on an instance and everything in it. Asynchronous and
      irreversible -- take a create_database_backup first if the contents might
      still be wanted. The instance itself and its other databases are
      unaffected.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    destructive: true
    request:
      method: DELETE
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database to destroy.
    output:
      description: The database, now being deleted.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The database id."}
        name: {type: string, description: "The database name."}

  list_database_backups:
    title: List a database's backups
    description: >-
      Every backup of one database, with its status and whether it is
      exportable. Unlike list_snapshots this is not scoped to a single day. A
      backup has to be `Completed` before restore_database_from_backup will take
      it.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}/backups
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database whose backups to list.
    output:
      description: The database's backups.
      type: object
      response_path: data
      properties:
        data: {type: array, description: "Each with id, timestamp, status (Pending, InProgress, Completed, Failed) and exportable."}

  get_database_backup:
    title: Get a database backup
    description: >-
      One backup's status, timestamp and exportability. Poll this after
      create_database_backup until `status` is `Completed`; only then is it safe
      to restore from or to proceed with whatever the backup was protecting
      against.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    read_only: true
    request:
      method: GET
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}/backups/${backup_id}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database the backup belongs to.
      backup_id:
        type: string
        description: The backup id, from list_database_backups or create_database_backup.
    output:
      description: The backup and its status.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "The backup id."}
        status: {type: string, description: "Pending, InProgress, Completed or Failed."}
        timestamp: {type: string, description: "When the backup was taken."}
        exportable: {type: boolean, description: "Whether it can be exported and downloaded."}

  create_database_backup:
    title: Take a backup of a database
    description: >-
      Request an on-demand backup of one database. Returns the backup id
      immediately; the backup runs asynchronously, so poll get_database_backup
      until `status` is `Completed`. This is the per-database equivalent of
      create_snapshot, for instances that hold more than one.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    request:
      method: POST
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}/backups
      headers:
        content-type: application/json
      body: {}
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database to back up.
    output:
      description: The id of the backup now running.
      type: object
      response_path: data
      properties:
        id: {type: string, description: "Poll get_database_backup with this until it is Completed."}

  restore_database_from_backup:
    title: Restore a database from a backup
    description: >-
      Replace a database's contents with a backup. Everything currently in the
      database is discarded. Asynchronous -- poll get_instance_database or the
      instance's status to follow it. Take a create_database_backup of the
      current state first if it might still be wanted.
    category: databases
    notes: v2beta1 endpoint -- in beta.
    destructive: true
    request:
      method: POST
      path: /v2beta1/organizations/${org_id}/projects/${project_id}/instances/${instance_id}/databases/${database_id}/restore
      headers:
        content-type: application/json
      body:
        backup_id: "${backup_id}"
    input:
      org_id:
        type: string
        description: The organization id.
      project_id:
        type: string
        description: The project the instance is in.
      instance_id:
        type: string
        description: The instance holding the database.
        example: db1d1234
      database_id:
        type: string
        description: The database to restore into.
      backup_id:
        type: string
        description: The backup to restore from. Must be Completed.
        example: backup-5678
    output:
      description: Empty on acceptance; the restore continues asynchronously.
      type: object
