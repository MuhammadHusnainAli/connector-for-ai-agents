    output:
      description: The requested record.
      type: object

  update_restriction_policy:
    title: Update a restriction policy
    description: >-
      Updates the restriction policy associated with a resource. ####
      Supported resources Restriction policies can be applied to the following
      resources: - Dashboards: `dashboard` - Integration Services:
      `integration-service` - Integration Webhooks: `integration-webhook` -
      Notebooks: `notebook` - Powerpacks: `powerpack` - Reference Tables:
      `reference-table` - Security Rules: `security-rule` - Service Level
      Objectives:....
    category: roles
    request:
      method: POST
      path: /v2/restriction_policy/${resource_id}
      query:
        allow_self_lockout: "${allow_self_lockout}"
      body: "${attributes}"
    input:
      resource_id:
        type: string
        description: The resource the restriction policy applies to, e.g. "dashboard:abc-def-ghi".
      allow_self_lockout:
        type: boolean
        description: Allows admins (users with the `user_access_manage` permission) to remove their own access from the resource if set to `true`. By default, this is set to `false`, preventing admins from locking themselves out.
        optional: true
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

