      example: 78c3430e-21f5-483b-8e26-84cd6dabf7a6
      format: uuid
      title: Account ID
      type: string
  display_name: YouCanBookMe
  proxy:
    base_url: https://api.youcanbook.me
    connection_config:
      subdomain: ${connectionConfig.subdomain}
    verification:
      endpoints:
      - /v1/profiles
      method: GET
zendesk-api-key:
  auth_mode: BASIC
  categories:
  - support
  - ticketing
  connection_config:
    subdomain:
      description: The subdomain of your Zendesk account.
      example: acme
      order: 1
      pattern: ^[a-z0-9_-]+$
      prefix: https://
      suffix: .zendesk.com
      title: Zendesk Domain
      type: string
  credentials:
    password:
      description: Your Zendesk API token.
      example: SDMWuOoZ******************************9CMz
      pattern: ^[A-Za-z0-9]+$
      title: API Token
      type: string
    username:
      description: Your Zendesk account email address.
      format: email
      title: Email Address
      type: string
  display_name: Zendesk (API Token)
  proxy:
    base_url: https://${connectionConfig.subdomain}.zendesk.com
    headers:
      authorization: Basic ${base64(${credentials.username}/token:${credentials.password})}
    retry:
      after:
      - retry-after
    verification:
      endpoints:
      - /api/v2/users.json?per_page=1&page=1
      method: GET
