        project_id: ${project_id}
        has_keywords: ${has_keywords}
    input:
      access:
        type: string
        description: The access type of the project.
        optional: true
        enum:
        - private
        - shared
      owned_by:
        type: string
        description: The email of the project owner
        optional: true
      project_id:
        type: integer
        description: 'The unique identifier of the project. You can find it in the URL of
          your Rank Tracker project in Ahrefs: https://app.ahrefs.com/rank-tracker/overview/#project_id#'
        optional: true
      has_keywords:
        type: boolean
        description: Has Rank Tracker keywords.
        optional: true
    output:
      description: Projects.
      type: array
      items:
        type: object
      response_path: projects

  create_project:
    title: Create a project
    description: >-
      Create a project for a target URL with its scope and protocol, owned by a workspace
      member and optionally in a folder. Free: consumes no API units.
    category: management
    request:
      method: POST
      path: /v3/management/projects
      body:
        access: ${access}
        owned_by: ${owned_by}
        project_name: ${project_name}
        mode: ${mode}
        url: ${url}
        protocol: ${protocol}
        folder_id: ${folder_id}
    input:
      access:
        type: string
        description: The access type of the project.
        optional: true
        enum:
        - private
        - shared
      owned_by:
        type: string
        description: The email of the project owner. If not provided, the project is assigned
          to the Workspace owner.
        optional: true
      project_name:
        type: string
        description: The name of the project.
      mode:
        type: string
        description: 'Scope of target: exact (that URL), prefix (URLs under that path), domain
          (the domain without subdomains) or subdomains (the whole site).'
        enum:
        - exact
        - prefix
        - domain
        - subdomains
      url:
        type: string
        description: The URL of your target.
      protocol:
        type: string
        description: 'Which protocol of the target to count: both, http or https.'
        enum:
        - both
        - http
        - https
      folder_id:
        type: integer
        description: The folder id to assign to the project. You can find the id of a folder
          in https://app.ahrefs.com/dashboard/folders/#folder_id#.
        optional: true
    output:
      description: The created project.
      type: array
      items:
        type: object
      response_path: projects

  delete_projects:
    title: Delete projects
    description: >-
      Delete one or more projects with their tracked keywords and history. Free: consumes
