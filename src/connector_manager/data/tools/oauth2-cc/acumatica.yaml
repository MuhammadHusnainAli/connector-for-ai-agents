# Acumatica ERP contract-based REST API tools.
#
# Acumatica's API is not a fixed list of endpoints: an *endpoint* (a contract)
# named `Default` and versioned by release exposes a set of *entities*, and
# every entity answers the same handful of operations. Which entities exist,
# and which fields and actions each one has, depends on the endpoint version
# and on what the instance is licensed for -- so the tools below are the
# operations themselves, parameterised by entity, rather than 300 invented
# per-entity endpoints that a given instance may not have.
#
#   GET    /entity/{endpoint}/{version}/{Entity}                 list
#   GET    /entity/{endpoint}/{version}/{Entity}/{id}            read by GUID id
#   GET    /entity/{endpoint}/{version}/{Entity}/{key}/{key}     read by keys
#   GET    /entity/{endpoint}/{version}/{Entity}/$adHocSchema    that entity's fields
#   PUT    /entity/{endpoint}/{version}/{Entity}                 create or update
#   DELETE /entity/{endpoint}/{version}/{Entity}/{id|keys}       delete
#   POST   /entity/{endpoint}/{version}/{Entity}/{Action}        invoke an action
#
# Start with `get_openapi_definition` or `get_entity_schema`: they are how you
# learn what this particular instance actually offers, including custom
# entities added by a customisation. The convenience list/upsert tools further
# down cover the entities the stock Default endpoint ships, and every one of
# them is the same two calls with the entity name filled in.
#
# Three things to know about the values:
#
#   * a record's `id` is a GUID Acumatica assigns; its *keys* are the business
#     identifiers (CustomerID, or OrderType plus OrderNbr) and are what appear
#     in the UI;
#   * fields are wrapped: `{"CustomerID": {"value": "ABCCORP"}}`, not
#     `{"CustomerID": "ABCCORP"}`, which is the shape `record` expects;
#   * PUT is an upsert -- it creates when the keys match nothing and updates
#     when they do, so there is no separate create call.
#
# This connector authenticates with OAuth 2.0 client credentials, so no
# /entity/auth/login call is needed; `logout` is still here for releasing the
# server-side session a burst of calls opened.
#
# Docs: https://help.acumatica.com/Help?ScreenId=ShowWiki&pageid=e6f4b0e6-8e4b-4f4c-a1d3-e0b9c00b0a4d

connector_id: acumatica
display_name: Acumatica
docs_url: https://help.acumatica.com/

tools:

  # -- discovery -------------------------------------------------------------

  get_openapi_definition:
    title: Get the endpoint's OpenAPI definition
    description: >-
      The OpenAPI (swagger) document for one endpoint version: every entity it
      exposes, every field on each, and every action that can be invoked. This
      is the authoritative answer to "what can I call on this instance", since
      entities vary by version, licence and customisation.
    category: discovery
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/swagger.json
      query:
        company: "${company}"
    input:
      endpoint_name:
        type: string
        description: Which endpoint (contract) to describe. The stock one is "Default".
        default: Default
        optional: true
      version:
        type: string
        description: >-
          Endpoint version, as shown on the Web Service Endpoints screen
          (SM207060), e.g. 24.200.001.
        default: 24.200.001
        optional: true
        example: 24.200.001
      company:
        type: string
        description: Tenant to read the definition for, when the instance hosts several.
        optional: true
    output:
      description: The endpoint's OpenAPI definition.
      type: object
      properties:
        openapi: {type: string}
        info: {type: object}
        paths: {type: object, description: "One entry per entity and action the endpoint exposes."}
        definitions: {type: object}

  get_odata_metadata:
    title: Get the endpoint's OData metadata
    description: >-
      The OData $metadata document for one endpoint version -- every entity
      type, field and relationship, as XML. The same ground truth as the
      OpenAPI definition, in the form Excel, Power Query and OData clients
      consume.
    category: discovery
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/$metadata
      query:
        company: "${company}"
    input:
      endpoint_name:
        type: string
        description: Which endpoint (contract) to describe.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      company:
        type: string
        description: Tenant to read the metadata for, when the instance hosts several.
        optional: true
    output:
      description: The OData metadata document, as XML.
      type: string

  get_entity_schema:
    title: Get an entity's fields
    description: >-
      The ad-hoc schema for one entity: the fields it accepts and returns,
      including the custom fields a customisation added. Read this before
      building a `record` for `create_or_update_record`, so field names and
      nesting match what this instance actually has.
    category: discovery
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/${entity_name}/$adHocSchema
    input:
      entity_name:
        type: string
        description: Entity to describe, e.g. Customer, SalesOrder, StockItem.
        example: Customer
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
    output:
      description: The entity's fields, each with its type.
      type: object
      properties:
        custom: {type: object, description: "Custom fields, grouped by the screen view they come from."}

  # -- generic record operations --------------------------------------------

  list_records:
    title: List records of an entity
    description: >-
      Records of any entity, with OData-style filtering, projection and paging.
      Two Acumatica specifics are worth knowing: nested detail lines (a sales
      order's lines, an invoice's) are omitted unless `expand` names them, and
      `select` cuts the response down sharply, which matters because these
      documents are large. `custom` pulls in fields that are not part of the
      contract.
    category: records
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/${entity_name}
      query:
        $filter: "${filter}"
        $select: "${select}"
        $expand: "${expand}"
        $top: "${top}"
        $skip: "${skip}"
        $custom: "${custom}"
      headers:
        Accept: application/json
    input:
      entity_name:
        type: string
        description: Entity to list, e.g. Customer, SalesOrder, StockItem.
        example: SalesOrder
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      filter:
        type: string
        description: >-
          OData filter over the entity's fields, e.g.
          Status eq 'Open' and OrderTotal gt 1000M.
        optional: true
        example: Status eq 'Open'
      select:
        type: string
        description: Comma-separated fields to return, e.g. OrderNbr,Status,OrderTotal.
        optional: true
      expand:
        type: string
        description: >-
          Comma-separated detail collections to include, e.g. Details,Shipments.
          Nested lines are absent without this.
        optional: true
      top:
        type: integer
        description: Return at most this many records.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: Skip this many records before returning any, for paging.
        optional: true
        minimum: 0
      custom:
        type: string
        description: >-
          Custom fields to include, as View.Field pairs, e.g.
          Document.AttributeCUSTOMER.
        optional: true
    output:
      description: The matching records.
      type: array
      items:
        type: object
        description: 'A record, whose fields are {"value": ...} wrappers, plus id, rowNumber and custom.'

  get_record_by_id:
    title: Get a record by its id
    description: >-
      One record by the GUID Acumatica assigned it -- the `id` that comes back
      from `list_records`. Stable across renames of the business keys, which is
      why it is the id to store on your side.
    category: records
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/${entity_name}/${id}
      query:
        $select: "${select}"
        $expand: "${expand}"
        $custom: "${custom}"
      headers:
        Accept: application/json
    input:
      entity_name:
        type: string
        description: Entity the record belongs to, e.g. SalesOrder.
      id:
        type: string
        description: The record's GUID id.
        example: a6295b33-c7f6-e811-b817-00155d408001
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      expand:
        type: string
        description: Comma-separated detail collections to include, e.g. Details.
        optional: true
      custom:
        type: string
        description: Custom fields to include, as View.Field pairs.
        optional: true
    output:
      description: The record.
      type: object
      properties:
        id: {type: string}
        rowNumber: {type: integer}
        custom: {type: object}

  get_record_by_keys:
    title: Get a record by its business keys
    description: >-
      One record addressed by the identifiers a user would recognise, in the
      order the entity declares them -- ["ABCCORP"] for a customer,
      ["SO","000123"] for a sales order. Pass them as a list and they become
      the path segments.
    category: records
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/${entity_name}/${keys}
      query:
        $select: "${select}"
        $expand: "${expand}"
        $custom: "${custom}"
      headers:
        Accept: application/json
    input:
      entity_name:
        type: string
        description: Entity the record belongs to, e.g. Customer.
      keys:
        type: array
        description: >-
          The record's key values in the entity's own key order, e.g.
          ["SO","000123"] for a sales order. Joined with slashes.
        items: {type: string}
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      expand:
        type: string
        description: Comma-separated detail collections to include.
        optional: true
      custom:
        type: string
        description: Custom fields to include, as View.Field pairs.
        optional: true
    output:
      description: The record.
      type: object
      properties:
        id: {type: string}
        rowNumber: {type: integer}
        custom: {type: object}

  create_or_update_record:
    title: Create or update a record
    description: >-
      Upsert one record of any entity. Acumatica matches on the key fields in
      `record`: no match creates, a match updates, and fields you leave out
      keep their current values. Every field is wrapped --
      {"CustomerID": {"value": "ABCCORP"}} -- and a detail line list goes in
      the entity's own collection field. Use `get_entity_schema` first if you
      are unsure of a field's name or nesting.
    category: records
    request:
      method: PUT
      path: /entity/${endpoint_name}/${version}/${entity_name}
      query:
        $select: "${select}"
        $expand: "${expand}"
        $custom: "${custom}"
        $filter: "${filter}"
      body: "${record}"
    input:
      entity_name:
        type: string
        description: Entity to write, e.g. Customer, SalesOrder, StockItem.
      record:
        type: object
        description: >-
          The record, with each field as a {"value": ...} wrapper. Include the
          key fields so Acumatica knows whether this is a create or an update.
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      select:
        type: string
        description: Comma-separated fields to return in the saved record.
        optional: true
      expand:
        type: string
        description: Comma-separated detail collections to return in the saved record.
        optional: true
      custom:
        type: string
        description: Custom fields to return, as View.Field pairs.
        optional: true
      filter:
        type: string
        description: >-
          Restrict which existing record may be updated, for entities where the
          keys alone are ambiguous.
        optional: true
    output:
      description: The saved record, as stored.
      type: object
      properties:
        id: {type: string}
        rowNumber: {type: integer}
        custom: {type: object}

  delete_record_by_id:
    title: Delete a record by its id
    description: >-
      Delete one record by its GUID id. Only entities Acumatica allows deleting
      accept this -- posted documents generally do not, and answer 405 or a
      business-logic error rather than deleting.
    category: records
    destructive: true
    request:
      method: DELETE
      path: /entity/${endpoint_name}/${version}/${entity_name}/${id}
    input:
      entity_name:
        type: string
        description: Entity the record belongs to.
      id:
        type: string
        description: The record's GUID id.
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
    output:
      description: Empty on success; Acumatica answers 204 with no body.
      type: object

  delete_record_by_keys:
    title: Delete a record by its business keys
    description: >-
      Delete one record addressed by its business keys, in the entity's key
      order. As with deleting by id, entities that forbid deletion refuse the
      call rather than silently ignoring it.
    category: records
    destructive: true
    request:
      method: DELETE
      path: /entity/${endpoint_name}/${version}/${entity_name}/${keys}
    input:
      entity_name:
        type: string
        description: Entity the record belongs to.
      keys:
        type: array
        description: The record's key values in the entity's key order, joined with slashes.
        items: {type: string}
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
    output:
      description: Empty on success; Acumatica answers 204 with no body.
      type: object

  invoke_action:
    title: Invoke an entity action
    description: >-
      Run one of the actions an entity exposes -- the API equivalent of the
      buttons on the screen, such as ReleaseInvoice or CreateShipment. The
      action names an entity to act on (usually just its keys) plus any
      parameters the action itself takes. Acumatica may answer 202 and finish
      asynchronously: poll the Location header it returns until it reports
      completion. `get_openapi_definition` lists the actions each entity has.
    category: actions
    request:
      method: POST
      path: /entity/${endpoint_name}/${version}/${entity_name}/${action_name}
      body:
        entity: "${entity_record}"
        parameters: "${parameters}"
    input:
      entity_name:
        type: string
        description: Entity the action belongs to, e.g. Invoice.
      action_name:
        type: string
        description: The action to run, e.g. ReleaseInvoice.
        example: ReleaseInvoice
      entity_record:
        type: object
        description: >-
          The record to act on, usually just its key fields as {"value": ...}
          wrappers, e.g. {"Type": {"value": "Invoice"}, "ReferenceNbr": {"value": "000123"}}.
      parameters:
        type: object
        description: 'The action''s own parameters, as {"value": ...} wrappers. Omit when it takes none.'
        optional: true
      endpoint_name:
        type: string
        description: Which endpoint (contract) the entity belongs to.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
    output:
      description: Empty on completion, or 202 with a Location header to poll while it runs.
      type: object

  release_invoice:
    title: Release an invoice
    description: >-
      Release an AR invoice, the documented example of an entity action:
      Acumatica posts the document and makes it ready for payment. Takes the
      invoice's type and reference number. Often answers 202 and completes
      asynchronously.
    category: actions
    request:
      method: POST
      path: /entity/${endpoint_name}/${version}/Invoice/ReleaseInvoice
      body:
        entity:
          Type: {value: "${type}"}
          ReferenceNbr: {value: "${reference_nbr}"}
    input:
      reference_nbr:
        type: string
        description: The invoice's reference number, e.g. 000123.
        example: "000123"
      type:
        type: string
        description: The invoice's document type, e.g. Invoice, Credit Note or Debit Note.
        default: Invoice
        optional: true
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
    output:
      description: Empty on completion, or 202 with a Location header to poll while it runs.
      type: object

  logout:
    title: End the API session
    description: >-
      Release the server-side session a run of calls opened. Acumatica counts
      concurrent sessions against the licence, so a batch job that makes many
      calls should end with this rather than leaving sessions to time out.
      Sign-in is not needed with these credentials -- the OAuth token is the
      authentication.
    category: session
    request:
      method: POST
      path: /entity/auth/logout
      headers:
        Content-Type: application/json
    input: {}
    output:
      description: Empty on success.
      type: object

  # -- entities of the stock Default endpoint --------------------------------
  #
  # Each pair below is `list_records` and `create_or_update_record` with the
  # entity name already filled in. They exist for discoverability; anything not
  # listed here is still reachable through the generic tools by name.

  list_customers:
    title: List customers
    description: >-
      Customers from the Customer entity, with OData filtering and projection.
      Filter on fields such as CustomerID, CustomerName, Status or CustomerClass.
    category: customers
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/Customer
      query:
        $filter: "${filter}"
        $select: "${select}"
        $expand: "${expand}"
        $top: "${top}"
        $skip: "${skip}"
    input:
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      filter:
        type: string
        description: OData filter, e.g. Status eq 'Active'.
        optional: true
      select:
        type: string
        description: Comma-separated fields to return, e.g. CustomerID,CustomerName.
        optional: true
      expand:
        type: string
        description: Detail collections to include, e.g. Contacts,MainContact.
        optional: true
      top:
        type: integer
        description: Return at most this many customers.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: Skip this many customers before returning any.
        optional: true
        minimum: 0
    output:
      description: The matching customers.
      type: array
      items: {type: object, description: "A customer, with fields as {\"value\": ...} wrappers."}

  create_or_update_customer:
    title: Create or update a customer
    description: >-
      Upsert a customer. A CustomerID that matches nothing creates the
      customer, one that matches updates it, and omitted fields are left alone.
      Fields go in wrapped: {"CustomerName": {"value": "ACME"}}.
    category: customers
    request:
      method: PUT
      path: /entity/${endpoint_name}/${version}/Customer
      query:
        $expand: "${expand}"
      body: "${record}"
    input:
      record:
        type: object
        description: >-
          The customer, with each field as a {"value": ...} wrapper. Include
          CustomerID to target an existing record.
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      expand:
        type: string
        description: Detail collections to return in the saved record.
        optional: true
    output:
      description: The saved customer.
      type: object
      properties:
        id: {type: string}

  list_vendors:
    title: List vendors
    description: >-
      Vendors from the Vendor entity, with OData filtering and projection.
      Filter on VendorID, VendorName, Status or VendorClass.
    category: vendors
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/Vendor
      query:
        $filter: "${filter}"
        $select: "${select}"
        $expand: "${expand}"
        $top: "${top}"
        $skip: "${skip}"
    input:
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      filter:
        type: string
        description: OData filter, e.g. Status eq 'Active'.
        optional: true
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      expand:
        type: string
        description: Detail collections to include.
        optional: true
      top:
        type: integer
        description: Return at most this many vendors.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: Skip this many vendors before returning any.
        optional: true
        minimum: 0
    output:
      description: The matching vendors.
      type: array
      items: {type: object, description: "A vendor, with fields as value wrappers."}

  create_or_update_vendor:
    title: Create or update a vendor
    description: >-
      Upsert a vendor. A VendorID that matches nothing creates it, one that
      matches updates it. Fields go in as {"value": ...} wrappers.
    category: vendors
    request:
      method: PUT
      path: /entity/${endpoint_name}/${version}/Vendor
      query:
        $expand: "${expand}"
      body: "${record}"
    input:
      record:
        type: object
        description: 'The vendor, with each field as a {"value": ...} wrapper.'
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      expand:
        type: string
        description: Detail collections to return in the saved record.
        optional: true
    output:
      description: The saved vendor.
      type: object
      properties:
        id: {type: string}

  list_contacts:
    title: List contacts
    description: >-
      Contacts from the Contact entity -- people, whether attached to a
      business account or standing alone. Filter on Email, LastName, Status or
      ContactClass.
    category: crm
    read_only: true
    request:
      method: GET
      path: /entity/${endpoint_name}/${version}/Contact
      query:
        $filter: "${filter}"
        $select: "${select}"
        $expand: "${expand}"
        $top: "${top}"
        $skip: "${skip}"
    input:
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      filter:
        type: string
        description: OData filter, e.g. Email eq 'ada@example.com'.
        optional: true
      select:
        type: string
        description: Comma-separated fields to return.
        optional: true
      expand:
        type: string
        description: Detail collections to include, e.g. Attributes.
        optional: true
      top:
        type: integer
        description: Return at most this many contacts.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: Skip this many contacts before returning any.
        optional: true
        minimum: 0
    output:
      description: The matching contacts.
      type: array
      items: {type: object, description: "A contact, with fields as value wrappers."}

  create_or_update_contact:
    title: Create or update a contact
    description: >-
      Upsert a contact. Include ContactID to update an existing one; omit it and
      Acumatica creates a contact and assigns the id.
    category: crm
    request:
      method: PUT
      path: /entity/${endpoint_name}/${version}/Contact
      query:
        $expand: "${expand}"
      body: "${record}"
    input:
      record:
        type: object
        description: 'The contact, with each field as a {"value": ...} wrapper.'
      endpoint_name:
        type: string
        description: Which endpoint (contract) to use.
        default: Default
        optional: true
      version:
        type: string
        description: Endpoint version, e.g. 24.200.001.
        default: 24.200.001
        optional: true
      expand:
        type: string
