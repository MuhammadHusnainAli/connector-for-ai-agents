        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.metadata
    - gmail.modify
    - gmail.readonly
  delete_thread:
    title: Delete thread
    description: Immediately and permanently deletes the specified thread. Any messages that belong to
      the thread are also deleted. This operation cannot be undone. Prefer threads.trash instead. For
      more information, see Manage threads.
    category: users
    request:
      method: DELETE
      path: /gmail/v1/users/${user_id}/threads/${id}
    input:
      id:
        type: string
        description: ID of the Thread to delete.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
    output:
      description: What the API returned.
      type: object
    scopes:
    - https://mail.google.com/
    destructive: true
  list_threads:
    title: List threads
    description: Lists the threads in the user's mailbox. For more information, see Manage threads.
    category: users
    request:
      method: GET
      path: /gmail/v1/users/${user_id}/threads
      query:
        includeSpamTrash: ${include_spam_trash}
        labelIds: ${label_ids}
        maxResults: ${max_results}
        pageToken: ${page_token}
        q: ${q}
    input:
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      include_spam_trash:
        type: boolean
        description: Include threads from SPAM and TRASH in the results.
        optional: true
        default: false
      label_ids:
        type: string
        description: Only return threads with labels that match all of the specified label IDs.
        optional: true
      max_results:
        type: integer
        description: Maximum number of threads to return. This field defaults to 100. The maximum allowed
          value for this field is 500.
        optional: true
        default: 100
      page_token:
        type: string
        description: Page token to retrieve a specific page of results in the list.
        optional: true
      q:
        type: string
        description: 'Only return threads matching the specified query. Supports the same query format
          as the Gmail search box. For example, "from:someuser@example.com rfc822msgid: is:unread". Parameter
          cannot be used when accessing the api using the gmail.metadata scope.'
        optional: true
    output:
      description: The ListThreadsResponse resource.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.metadata
    - gmail.modify
    - gmail.readonly
    read_only: true
  modify_thread:
    title: Modify thread
