  list_site_audit_projects:
    title: List Site Audit projects
    description: >-
      List Site Audit projects with their health scores and issue counts, optionally one project
      or those matching a name or URL. Free: consumes no API units.
    category: site_audit
    read_only: true
    request:
      method: GET
      path: /v3/site-audit/projects
      query:
        project_id: ${project_id}
        date: ${date}
        project_name: ${project_name}
        project_url: ${project_url}
    input:
      project_id:
        type: integer
        description: 'The unique identifier of the project. You can find it in the URL of
          your Site Audit project in Ahrefs: https://app.ahrefs.com/site-audit/#project_id#'
        optional: true
      date:
        type: string
        description: A timestamp in YYYY-MM-DDThh:mm:ss format specifying the crawl date to
          retrieve metrics from. Defaults to the most recent available crawl if omitted. For
          scheduled crawls, we return data from the latest crawl finished before the specified
          timestamp. For Always-on audit crawls, we return data as of the provided date and
          time. If the time component is omitted, it defaults to 00:00:00. The timestamp is
          interpreted in UTC.
        optional: true
      project_name:
        type: string
        description: Filters projects by name.
        optional: true
      project_url:
        type: string
        description: Filters projects by target URL (ignores protocol and trailing slash).
        optional: true
    output:
      description: Projects with health scores.
      type: array
      items:
        type: object
      response_path: healthscores

