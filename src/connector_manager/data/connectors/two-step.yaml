  token_url: https://${connectionConfig.platform}-api.centrastage.net/auth/oauth/token
dayforce:
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - hr
  connection_config:
    clientHostname:
      description: Hostname for the Dayforce API, leave empty for production.
      example: test.dayforcehcm.com
      format: hostname
      optional: true
      prefix: https://
      suffix: /api
      title: API hostname
      type: string
    companyId:
      description: The company ID for your Dayforce account.
      title: Company ID
      type: string
    identityHostname:
      description: Hostname for the Dayforce Identity token endpoint, leave empty for production.
      example: dfid.dayforcehcm.com
      format: hostname
      optional: true
      prefix: https://
      suffix: /connect/token
      title: Identity hostname
      type: string
  credentials:
    password:
      description: Your Dayforce account password.
      title: Password
      type: string
    username:
      description: Your Dayforce account username.
      title: Username
      type: string
  display_name: Dayforce
  proxy:
    base_url: https://${connectionConfig.clientHostname}/api || https://www.dayforcehcm.com/api
    forward_headers_on_redirect: true
  token_headers:
    content-type: application/x-www-form-urlencoded
  token_params:
    client_id: Dayforce.HCMAnywhere.Client
    companyId: ${connectionConfig.companyId}
    grant_type: password
    password: ${credentials.password}
    username: ${credentials.username}
  token_response:
    token: access_token
    token_expiration: expires_in
    token_expiration_strategy: expireIn
  token_url: https://${connectionConfig.identityHostname}/connect/token || https://dfid.dayforcehcm.com/connect/token
