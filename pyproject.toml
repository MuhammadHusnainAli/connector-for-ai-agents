[project]
name = "connector-for-ai-agents"
version = "0.1.1"
description = "950+ API connectors for AI agents: catalogue, auth requirements and connection management, sync and async"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Husnain Ali", email = "husnain.ali@digifloat.com" }]
keywords = ["connectors", "integrations", "api", "oauth", "ai-agents", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# anyio ships the pytest plugin that runs the async tests.
dev = ["pytest>=8.0", "respx>=0.21", "anyio>=4.0", "build>=1.2"]

[project.scripts]
connectors = "connector_manager.__main__:main"

[project.urls]
Homepage = "https://github.com/MuhammadHusnainAli/connector-for-ai-agents"
Issues = "https://github.com/MuhammadHusnainAli/connector-for-ai-agents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ships the package plus its data payload: connectors.yaml and 962 connector logos.
packages = ["src/connector_manager"]

[tool.hatch.build.targets.sdist]
include = ["src/connector_manager", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
