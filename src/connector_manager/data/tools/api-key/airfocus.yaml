        optional: true
      source_workspace_id:
        type: string
        description: Workspace the items are in.
      target_workspace_id:
        type: string
        description: Workspace to copy them to.
      item_ids:
        type: array
        items:
          type: string
        min_length: 1
        description: Ids of the items to copy.
    output:
      description: The new item ids.
      type: object

  move_items:
