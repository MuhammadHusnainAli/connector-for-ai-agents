  query_brand_radar_citations_overview:
    title: Query Brand Radar citations overview
    description: >-
      Count how often AI assistants cite each brand's own website when answering prompts.
      Every brand and competitor must include at least one website. Free when only custom
      prompts are returned; Ahrefs prompt data costs API units.
    category: brand_radar
    read_only: true
    request:
      method: POST
      path: /v3/brand-radar/citations-overview
      body:
        where: ${where}
        select: ${select}
        tags_filter: ${tags_filter}
        search_volume_type: ${search_volume_type}
        country: ${country}
        report_id: ${report_id}
        prompts: ${prompts}
        data_source: ${data_source}
        market: ${market}
        competitors: ${competitors}
        brands: ${brands}
    input:
      where:
        type: object
        description: 'Filter as an Ahrefs boolean expression object, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}. Filterable columns: cited_domain, cited_domain_subdomains,
          cited_url_exact, cited_url_prefix, question, response, search_queries, topic.'
        optional: true
      select:
        type: array
        description: 'Columns to return; request only what you need, since columns set the
          unit cost. Valid: brand, no_tracked_brands, only_competitors_brands, only_target_brand,
          target_and_competitors_brands, total.'
        items:
          type: string
      tags_filter:
        type: object
        description: 'A filter expression for prompt tags. Requires report_id. Uses filter
          syntax with the following restrictions: the only valid field name is "tag"; the
          only valid operator are: "eq", "neq", "substring", "isubstring", "phrase_match",
          "iphrase_match", "prefix", "suffix", "empty"; maximum nesting depth of and, or is
          2.'
        optional: true
      search_volume_type:
        type: string
        description: AI visibility reports are switching to AI adjusted volume. It better
          estimates demand for AI responses across chatbots and AI search surfaces. It is
          calculated by adjusting Google search volume for each AI platform’s estimated usage
          compared with Google. This param will be deprecated on September 30, 2026; all requests
          will use new AI adjusted volume. ask_volume - New calculation (default). Estimates
          demand for AI responses by adjusting Google search volume for each AI platform.
        optional: true
        enum:
        - ask_volume
        - keyword_volume
      country:
        type: array
        description: A list of two-letter country codes (ISO 3166-1 alpha-2).
        optional: true
        items:
          type: string
      report_id:
        type: string
        description: 'The ID of the report to use. If one is given, other parameters are taken
          from the report (brand, competitors, market, country, filters). If country or filters
          are provided, they override the ones in the report. You can find it in the URL of
          your Brand Radar report in Ahrefs: https://app.ahrefs.com/brand-radar/reports/#report_id#/...'
        optional: true
      prompts:
        type: string
        description: The type of prompts to use. If not specified, both will be used. Custom
          prompts require a report_id to be provided.
        optional: true
        enum:
        - ahrefs
        - custom
      data_source:
        type: array
        description: A list of chatbot models. All models can be combined with each other.
          claude module supports only custom prompts. The google_ai_overviews_keywords and
          google_ai_mode_keywords models report AI Overviews / AI Mode visibility derived
          from Google search queries (keywords) rather than prompts.
        items:
          type: string
      market:
        type: array
        description: A list of the niche markets of your brands. Deprecated on 2026-05-18,
          this parameter will have no effect shortly after this date.
        optional: true
        items:
          type: string
      competitors:
        type: array
        description: A list of competitor names and websites to search for.
        optional: true
        items:
          type: object
      brands:
        type: array
        description: A list of brand names and websites to search for.
        optional: true
        items:
          type: object
    output:
      description: Citations per brand.
      type: array
      items:
        type: object
      response_path: metrics

