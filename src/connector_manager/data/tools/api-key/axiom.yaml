# Axiom tools -- datasets, APL queries, ingest, monitors and notifiers.
#
# Axiom is an event-data platform: you ingest JSON events into a **dataset**
# and query them with **APL** (the Axiom Processing Language, a pipe-shaped
# query language). Almost everything an agent wants is one of three calls --
# `query` to ask a question, `ingest_events` to write, `list_datasets` to find
# out what exists.
#
# Two things decide whether a call reaches the right place:
#
#   * **the connection's subdomain matters.** `api.axiom.co` is the control
#     plane -- datasets, monitors, tokens, users, dashboards -- and the
#     `*.aws.edge` subdomains are edge deployments, where the data itself
#     lives. The `/v2/...` management tools want the `api` subdomain; the
#     `query_edge`, `query_batch`, `query_metrics` and `ingest_to_edge` tools
#     want the edge subdomain matching where your dataset was created. Point
#     the connection at the one you need;
#   * **`query` results route through US East 1** even for data stored
#     elsewhere. If results must not leave your edge deployment, use
#     `query_edge` instead -- same APL, no round trip through another region.
#
# The token's capabilities decide what works: an API token is minted with a
# per-dataset and per-org capability set (see `create_token`), so a token that
# can ingest may be refused a `delete_dataset` rather than merely returning
# nothing.
#
# Destructive edges worth naming: `trim_dataset` and `vacuum_dataset` delete
# event data outright, `delete_dataset` takes the events with it, and
# `regenerate_token` invalidates the old token immediately.
#
# Docs: https://axiom.co/docs/restapi/introduction

connector_id: axiom
display_name: Axiom
docs_url: https://axiom.co/docs/restapi/introduction

tools:

  # -- querying ------------------------------------------------------------

  query:
    title: Run an APL query
    description: >-
      Query event data with APL -- the pipe-shaped Axiom Processing Language --
      e.g. `['my-dataset'] | where status == 500 | summarize count() by bin_auto(_time)`.
      The dataset is named inside the query, not as a parameter. `format` of
      "tabular" returns columns and rows; "legacy" returns matches with their
      full event objects. Results route through US East 1 regardless of where
      the data lives -- use query_edge when that matters.
    category: query
    read_only: true
    request:
      method: POST
      path: /v1/datasets/_apl
      query:
        format: "${format}"
        nocache: "${nocache}"
        saveAsKind: "${save_as_kind}"
      body:
        apl: "${apl}"
        startTime: "${start_time}"
        endTime: "${end_time}"
        cursor: "${cursor}"
        includeCursor: "${include_cursor}"
    input:
      apl:
        type: string
        description: >-
          The APL query. The dataset goes inside it, in square brackets and
          quotes -- e.g. "['logs'] | where level == 'error' | limit 100".
        example: "['logs'] | where level == 'error' | limit 100"
      start_time:
        type: string
        description: >-
          Start of the time window, as an ISO 8601 timestamp or a relative
          string such as "now-1h". Overrides any range in the query.
        optional: true
      end_time:
        type: string
        description: End of the time window, ISO 8601 or relative.
        optional: true
      format:
        type: string
        description: >-
          Response shape -- "tabular" for columns and rows, "legacy" for
          matched events.
        optional: true
        enum: [tabular, legacy]
        default: tabular
      nocache:
        type: boolean
        description: Skip Axiom's query cache and recompute from the raw events.
        optional: true
      save_as_kind:
        type: string
        description: Save the query to the account's history under this kind.
        optional: true
      cursor:
        type: string
        description: Cursor from a previous response, to page through a large result.
        optional: true
      include_cursor:
        type: boolean
        description: Include the row the cursor points at, rather than starting after it.
        optional: true
    output:
      description: The query result -- tables with their columns and rows, plus timing and status.
      type: object
      properties:
        tables: {type: array, description: "One entry per result table, with columns and rows."}
        status: {type: object, description: "Rows examined, bytes scanned and elapsed time."}

  query_edge:
    title: Run an APL query inside one edge deployment
    description: >-
      Run the same APL as `query`, but against the edge deployment the
      connection points at -- results never leave that region. Requires the
      connection's subdomain to be the edge host holding the dataset, not
      `api`.
    category: query
    read_only: true
    request:
      method: POST
      path: /v1/query/_apl
      query:
        format: "${format}"
        nocache: "${nocache}"
      body:
        apl: "${apl}"
        startTime: "${start_time}"
        endTime: "${end_time}"
        cursor: "${cursor}"
    input:
      apl:
        type: string
        description: The APL query, naming its dataset in square brackets.
      start_time:
        type: string
        description: Start of the time window, ISO 8601 or relative such as "now-24h".
        optional: true
      end_time:
        type: string
        description: End of the time window.
        optional: true
      format:
        type: string
        description: Response shape.
        optional: true
        enum: [tabular, legacy]
        default: tabular
      nocache:
        type: boolean
        description: Skip the query cache.
        optional: true
      cursor:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The query result, computed inside the edge deployment.
      type: object

  query_batch:
    title: Run several APL queries at once
    description: >-
      Send a batch of APL queries to an edge deployment in one request, which
      is how a dashboard fills several panels without a round trip each.
    category: query
    read_only: true
    request:
      method: POST
      path: /v1/query/batch
      body:
        queries: "${queries}"
    input:
      queries:
        type: array
        description: >-
          The queries to run, each an object with `apl` and optionally
          `startTime` and `endTime`.
        items: {type: object}
    output:
      description: One result per submitted query, in order.
      type: object

  query_metrics:
    title: Run an MPL metrics query
    description: >-
      Query metric data with MPL, Axiom's metrics query language, against an
      edge deployment. Use `query` for event data -- this is the numeric,
      time-series surface.
    category: query
    read_only: true
    request:
      method: POST
      path: /v1/query/_mpl
      body:
        mpl: "${mpl}"
        startTime: "${start_time}"
        endTime: "${end_time}"
    input:
      mpl:
        type: string
        description: The MPL query to run.
      start_time:
        type: string
        description: Start of the time window, ISO 8601 or relative.
        optional: true
      end_time:
        type: string
        description: End of the time window.
        optional: true
    output:
      description: The metrics query result.
      type: object

  query_dataset_legacy:
    title: Run a structured (non-APL) query
    description: >-
      Query one dataset with Axiom's older structured query format -- explicit
      aggregations, filters and group-bys as JSON rather than APL. Prefer
      `query` unless you already have a structured query to send.
    category: query
    read_only: true
    request:
      method: POST
      path: /v1/datasets/${dataset}/query
      body: "${query}"
    input:
      dataset:
        type: string
        description: The dataset's name.
      query:
        type: object
        description: >-
          The structured query -- `startTime`, `endTime`, `resolution`,
          `aggregations`, `filter`, `groupBy`, `order`, `limit`.
    output:
      description: The query result -- matches, buckets and status.
      type: object

  # -- ingest --------------------------------------------------------------

  ingest_events:
    title: Ingest events into a dataset
    description: >-
      Write events into a dataset. `events` is a list of JSON objects; a `_time`
      field on each sets its timestamp, and without one Axiom stamps arrival
      time. Fields are created on first sight, so ingest is schemaless -- but a
      field's type is fixed by its first value.
    category: ingest
    request:
      method: POST
      path: /v1/datasets/${dataset}/ingest
      body: "${events}"
    input:
      dataset:
        type: string
        description: The dataset's name. Axiom creates nothing implicitly -- it must exist.
      events:
        type: array
        description: >-
          The events to ingest, each a JSON object. Include `_time` (ISO 8601)
          to set the event's timestamp.
        items: {type: object}
    output:
      description: What was ingested -- counts of ingested and failed events, with per-event failures.
      type: object
      properties:
        ingested: {type: integer}
        failed: {type: integer}
        failures: {type: array}
        processedBytes: {type: integer}

  ingest_to_edge:
    title: Ingest events into an edge deployment
    description: >-
      Write events straight into the edge deployment the connection points at,
      so the data never transits another region. Same event shape as
      ingest_events.
    category: ingest
    request:
      method: POST
      path: /v1/ingest/${dataset}
      body: "${events}"
    input:
      dataset:
        type: string
        description: The dataset's id or name in that edge deployment.
      events:
        type: array
        description: The events to ingest, each a JSON object.
        items: {type: object}
    output:
      description: Ingest counts and any per-event failures.
      type: object

  # -- datasets ------------------------------------------------------------

  list_datasets:
    title: List datasets
    description: >-
      Read every dataset the token can see, with its name, description,
      retention and edge deployment. The first call in almost any Axiom
      session, since a query names its dataset.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /v2/datasets
    input: {}
    output:
      description: The datasets available to this token.
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          retentionDays: {type: integer}

  get_dataset:
    title: Get a dataset
    description: Read one dataset -- its retention, edge deployment, creator and write access.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /v2/datasets/${dataset_id}
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
    output:
      description: The dataset.
      type: object

  create_dataset:
    title: Create a dataset
    description: >-
      Create a dataset to ingest into. `retention_days` fixes how long events
      are kept -- unset it and the dataset follows the organisation's plan
      default. `edge_deployment` decides which region the data lives in and
      cannot be changed afterwards.
    category: datasets
    request:
      method: POST
      path: /v2/datasets
      body:
        name: "${name}"
        description: "${description}"
        retentionDays: "${retention_days}"
        useRetentionPeriod: "${use_retention_period}"
        edgeDeployment: "${edge_deployment}"
    input:
      name:
        type: string
        description: The dataset's name, which is what APL queries reference.
      description:
        type: string
        description: What the dataset holds.
        optional: true
      retention_days:
        type: integer
        description: How many days of events to keep.
        optional: true
        minimum: 1
      use_retention_period:
        type: boolean
        description: Apply `retention_days` rather than the plan's default retention.
        optional: true
      edge_deployment:
        type: string
        description: >-
          Which edge deployment stores the data, e.g. "us-east-1.aws". Fixed at
          creation.
        optional: true
    output:
      description: The created dataset.
      type: object

  update_dataset:
    title: Update a dataset
    description: >-
      Change a dataset's description or retention. Lowering retention deletes
      events older than the new window, which is not reversible.
    category: datasets
    request:
      method: PUT
      path: /v2/datasets/${dataset_id}
      body:
        description: "${description}"
        retentionDays: "${retention_days}"
        useRetentionPeriod: "${use_retention_period}"
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
      description:
        type: string
        description: New description.
        optional: true
      retention_days:
        type: integer
        description: New retention in days. Reducing it drops older events.
        optional: true
        minimum: 1
      use_retention_period:
        type: boolean
        description: Whether to apply `retention_days` rather than the plan default.
        optional: true
    output:
      description: The updated dataset.
      type: object

  delete_dataset:
    title: Delete a dataset
    description: >-
      Delete a dataset and every event in it. Irreversible, and anything
      querying or ingesting into it starts failing immediately.
    category: datasets
    destructive: true
    request:
      method: DELETE
      path: /v2/datasets/${dataset_id}
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
    output:
      description: Confirmation that the dataset was deleted.
      type: object

  trim_dataset:
    title: Trim a dataset to a shorter window
    description: >-
      Delete every event in a dataset older than `max_duration` -- a one-off
      prune rather than a retention change. The events are gone; only the
      dataset survives.
    category: datasets
    destructive: true
    request:
      method: POST
      path: /v1/datasets/${dataset}/trim
      body:
        maxDuration: "${max_duration}"
    input:
      dataset:
        type: string
        description: The dataset's name.
      max_duration:
        type: string
        description: >-
          How much history to keep, as a Go-style duration such as "168h" for
          a week. Everything older is deleted.
        example: 168h
    output:
      description: How many blocks of events were deleted.
      type: object

  vacuum_dataset:
    title: Vacuum a dataset's fields
    description: >-
      Drop fields from a dataset's schema that no longer appear in any retained
      event. Tidies a schema polluted by a bad ingest; it rewrites the
      dataset's field list rather than its events.
    category: datasets
    destructive: true
    request:
      method: POST
      path: /v2/datasets/${dataset_id}/vacuum
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
    output:
      description: Confirmation that the vacuum ran.
      type: object

  list_dataset_fields:
    title: List a dataset's fields
    description: >-
      Read a dataset's schema -- every field with its type and description.
      Read this before writing APL against an unfamiliar dataset; it is the
      only way to know what to filter on.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /v2/datasets/${dataset_id}/fields
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
    output:
      description: The dataset's fields.
      type: array
      items:
        type: object
        properties:
          name: {type: string}
          type: {type: string}

  get_dataset_field:
    title: Get one field of a dataset
    description: Read a single field's type, description and unit.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /v2/datasets/${dataset_id}/fields/${field_id}
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
      field_id:
        type: string
        description: The field's name.
    output:
      description: The field.
      type: object

  update_dataset_field:
    title: Annotate a dataset field
    description: >-
      Set a field's description, unit or hidden flag -- metadata that makes a
      dataset legible to whoever queries it next. The field's data type comes
      from the events and cannot be changed here.
    category: datasets
    request:
      method: PUT
      path: /v2/datasets/${dataset_id}/fields/${field_id}
      body:
        description: "${description}"
        unit: "${unit}"
        hidden: "${hidden}"
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
      field_id:
        type: string
        description: The field's name.
      description:
        type: string
        description: What the field means.
        optional: true
      unit:
        type: string
        description: The field's unit, e.g. "ms" or "bytes".
        optional: true
      hidden:
        type: boolean
        description: Hide the field from the dataset's default views.
        optional: true
    output:
      description: The updated field.
      type: object

  list_map_fields:
    title: List a dataset's map fields
    description: >-
      Read which fields a dataset treats as maps -- dynamic objects whose keys
      are not fixed, so Axiom stores them without exploding the schema.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /v2/datasets/${dataset_id}/mapfields
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
    output:
      description: The dataset's map fields.
      type: array
      items: {type: object}

  create_map_field:
    title: Add a map field to a dataset
    description: >-
      Declare a field as a map, so its arbitrary keys do not each become a
      column. The fix for a dataset whose schema is being polluted by
      high-cardinality object keys.
    category: datasets
    request:
      method: POST
      path: /v2/datasets/${dataset_id}/mapfields
      body:
        name: "${name}"
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
      name:
        type: string
        description: The field to treat as a map.
    output:
      description: The created map field.
      type: object

  delete_map_field:
    title: Remove a map field declaration
    description: >-
      Stop treating a field as a map. Its keys resume being indexed
      individually for newly ingested events.
    category: datasets
    destructive: true
    request:
      method: DELETE
      path: /v2/datasets/${dataset_id}/mapfields/${map_field_name}
    input:
      dataset_id:
        type: string
        description: The dataset's id or name.
      map_field_name:
        type: string
        description: The map field's name.
    output:
      description: Confirmation that the declaration was removed.
      type: object

  # -- monitors and notifiers ----------------------------------------------

  list_monitors:
    title: List monitors
    description: >-
      Read the monitors on the account -- the saved APL queries Axiom runs on a
      schedule and alerts on. Each carries its threshold, interval and the
      notifiers it fires.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v2/monitors
    input: {}
    output:
      description: The account's monitors.
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          disabled: {type: boolean}

  get_monitor:
    title: Get a monitor
    description: Read one monitor -- its query, threshold, schedule and notifiers.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v2/monitors/${monitor_id}
    input:
      monitor_id:
        type: string
        description: The monitor's id.
    output:
      description: The monitor.
      type: object

  get_monitor_history:
    title: Get a monitor's history
    description: >-
      Read a monitor's past runs -- when it fired, when it resolved, and the
      value each check saw. The audit trail behind a noisy alert.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v2/monitors/${monitor_id}/history
    input:
      monitor_id:
        type: string
        description: The monitor's id.
    output:
      description: The monitor's run history.
      type: object

  create_monitor:
    title: Create a monitor
    description: >-
      Create an alerting monitor. `apl_query` is the query it runs,
      `interval_minutes` how often, `range_minutes` the window each run looks
      at, and `operator` plus `threshold` decide when it fires. Attach
      `notifier_ids` or the monitor alerts nobody. This creates something that
      will page real people.
    category: monitors
    request:
      method: POST
      path: /v2/monitors
      body:
        name: "${name}"
        description: "${description}"
        aplQuery: "${apl_query}"
        intervalMinutes: "${interval_minutes}"
        rangeMinutes: "${range_minutes}"
        operator: "${operator}"
        threshold: "${threshold}"
        notifierIds: "${notifier_ids}"
        alertOnNoData: "${alert_on_no_data}"
        notifyByGroup: "${notify_by_group}"
        resolvable: "${resolvable}"
        disabled: "${disabled}"
        triggerFromNRuns: "${trigger_from_n_runs}"
        triggerAfterNPositiveResults: "${trigger_after_n_positive_results}"
    input:
      name:
        type: string
        description: The monitor's name, which appears in the alert.
      apl_query:
        type: string
        description: >-
          The APL query the monitor runs. It must produce a single aggregated
          value to compare against `threshold`.
      interval_minutes:
        type: integer
        description: How often the monitor runs, in minutes.
        minimum: 1
      range_minutes:
        type: integer
        description: How far back each run looks, in minutes.
        minimum: 1
      operator:
        type: string
        description: How the query result is compared with `threshold`.
        enum: [Above, AboveOrEqual, Below, BelowOrEqual, AboveOrBelow]
      threshold:
        type: number
        description: The value the result is compared against.
      description:
        type: string
        description: What the monitor watches, shown with the alert.
        optional: true
      notifier_ids:
        type: array
        description: Notifiers to fire when it triggers, from list_notifiers.
        optional: true
        items: {type: string}
      alert_on_no_data:
        type: boolean
        description: Also alert when the query returns nothing at all.
        optional: true
      notify_by_group:
        type: boolean
        description: Alert per group in a grouped query rather than once overall.
        optional: true
      resolvable:
        type: boolean
        description: Send a resolution notification when the condition clears.
        optional: true
      disabled:
        type: boolean
        description: Create the monitor without arming it.
        optional: true
      trigger_from_n_runs:
        type: integer
        description: Only alert when this many recent runs are considered.
        optional: true
        minimum: 1
      trigger_after_n_positive_results:
        type: integer
        description: Require this many breaching runs before alerting -- flap protection.
        optional: true
        minimum: 1
    output:
      description: The created monitor.
      type: object

  update_monitor:
    title: Update a monitor
    description: >-
      Replace a monitor's configuration. This is a full update -- send the
      fields you want kept, since omitted ones revert to defaults. Setting
      `disabled` is how an alert is silenced without deleting it.
    category: monitors
    request:
      method: PUT
      path: /v2/monitors/${monitor_id}
      body:
        name: "${name}"
        description: "${description}"
        aplQuery: "${apl_query}"
        intervalMinutes: "${interval_minutes}"
        rangeMinutes: "${range_minutes}"
        operator: "${operator}"
        threshold: "${threshold}"
        notifierIds: "${notifier_ids}"
        alertOnNoData: "${alert_on_no_data}"
        disabled: "${disabled}"
        disabledUntil: "${disabled_until}"
        resolvable: "${resolvable}"
    input:
      monitor_id:
        type: string
        description: The monitor's id.
      name:
        type: string
        description: The monitor's name.
      apl_query:
        type: string
        description: The APL query the monitor runs.
      interval_minutes:
        type: integer
        description: How often it runs, in minutes.
        minimum: 1
      range_minutes:
        type: integer
        description: How far back each run looks, in minutes.
        minimum: 1
      operator:
        type: string
        description: Comparison against the threshold.
        enum: [Above, AboveOrEqual, Below, BelowOrEqual, AboveOrBelow]
      threshold:
        type: number
        description: The value compared against.
      description:
        type: string
        description: What the monitor watches.
        optional: true
      notifier_ids:
        type: array
        description: The complete notifier list after the update.
        optional: true
        items: {type: string}
      alert_on_no_data:
        type: boolean
        description: Alert when the query returns nothing.
        optional: true
      disabled:
        type: boolean
        description: Silence the monitor without deleting it.
        optional: true
      disabled_until:
        type: string
        description: Silence it until this ISO 8601 time -- a scheduled maintenance window.
        optional: true
      resolvable:
        type: boolean
        description: Send a resolution notification when the condition clears.
        optional: true
    output:
      description: The updated monitor.
      type: object

  delete_monitor:
    title: Delete a monitor
    description: >-
      Delete a monitor and its history. Alerting stops immediately -- disable
      it instead if you may want it back.
    category: monitors
    destructive: true
    request:
      method: DELETE
      path: /v2/monitors/${monitor_id}
    input:
      monitor_id:
        type: string
        description: The monitor's id.
    output:
      description: Confirmation that the monitor was deleted.
      type: object

  list_notifiers:
    title: List notifiers
    description: >-
      Read the notifiers on the account -- where monitor alerts go: email,
      Slack, PagerDuty, Opsgenie, Discord, Microsoft Teams or a custom webhook.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v2/notifiers
    input: {}
    output:
      description: The account's notifiers.
      type: array
      items: {type: object}

  get_notifier:
    title: Get a notifier
    description: Read one notifier -- its type and destination configuration.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v2/notifiers/${notifier_id}
    input:
      notifier_id:
        type: string
        description: The notifier's id.
    output:
      description: The notifier.
      type: object

  create_notifier:
    title: Create a notifier
    description: >-
      Create an alert destination. `properties` holds exactly one channel
      object -- {"email": {"emails": [...]}}, {"slack": {"slackUrl": ...}},
      {"pagerduty": {"routingKey": ..., "token": ...}}, {"opsgenie": ...},
      {"discord": ...}, {"microsoftTeams": ...} or {"customWebhook":
      {"url": ..., "headers": {...}}}. Monitors reference it by id.
    category: monitors
    request:
      method: POST
      path: /v2/notifiers
      body:
        name: "${name}"
        properties: "${properties}"
    input:
      name:
        type: string
        description: The notifier's name.
      properties:
        type: object
        description: >-
          The destination, as a single-key object naming the channel -- see the
          description for the accepted shapes.
    output:
      description: The created notifier.
      type: object

  update_notifier:
    title: Update a notifier
    description: >-
      Change a notifier's name or destination. Monitors pointing at it start
      using the new destination on their next run.
    category: monitors
    request:
      method: PUT
      path: /v2/notifiers/${notifier_id}
      body:
        name: "${name}"
        properties: "${properties}"
        disabledUntil: "${disabled_until}"
    input:
      notifier_id:
        type: string
        description: The notifier's id.
      name:
        type: string
        description: The notifier's name.
      properties:
        type: object
        description: The destination configuration, in the same shape create_notifier takes.
        optional: true
      disabled_until:
        type: string
        description: Mute this notifier until the given ISO 8601 time.
        optional: true
    output:
      description: The updated notifier.
      type: object

  delete_notifier:
    title: Delete a notifier
    description: >-
      Delete a notifier. Monitors that referenced it lose that destination and
      may end up alerting nobody -- check them first.
    category: monitors
    destructive: true
    request:
      method: DELETE
      path: /v2/notifiers/${notifier_id}
    input:
      notifier_id:
        type: string
        description: The notifier's id.
    output:
      description: Confirmation that the notifier was deleted.
      type: object

  # -- annotations ---------------------------------------------------------

  list_annotations:
    title: List annotations
    description: >-
      Read the annotations on the account -- deploy markers and incident notes
      that appear as vertical lines on charts, which is how a spike gets its
      explanation.
    category: annotations
    read_only: true
    request:
      method: GET
      path: /v2/annotations
      query:
        datasets: "${datasets}"
        start: "${start}"
        end: "${end}"
    input:
      datasets:
        type: string
        description: Comma-separated dataset names to filter by.
        optional: true
      start:
        type: string
        description: Only annotations at or after this ISO 8601 time.
        optional: true
      end:
        type: string
        description: Only annotations at or before this ISO 8601 time.
        optional: true
    output:
      description: The matching annotations.
      type: array
      items: {type: object}

  get_annotation:
    title: Get an annotation
    description: Read one annotation -- its title, time range, datasets and link.
    category: annotations
    read_only: true
    request:
      method: GET
      path: /v2/annotations/${annotation_id}
    input:
      annotation_id:
        type: string
        description: The annotation's id.
    output:
      description: The annotation.
      type: object

  create_annotation:
    title: Create an annotation
    description: >-
      Mark a moment on the charts of one or more datasets -- "deployed v2.3",
      "incident start". `type` groups annotations by kind, and `url` links out
      to the deploy or incident.
    category: annotations
    request:
      method: POST
      path: /v2/annotations
      body:
        type: "${type}"
        datasets: "${datasets}"
        title: "${title}"
        description: "${description}"
        time: "${time}"
        endTime: "${end_time}"
        url: "${url}"
    input:
      type:
        type: string
        description: A kind for the annotation, e.g. "deploy" or "incident".
      datasets:
        type: array
        description: Dataset names whose charts should show it.
        items: {type: string}
      title:
        type: string
        description: Short label shown on the chart.
        optional: true
      description:
        type: string
        description: Longer detail.
        optional: true
      time:
        type: string
        description: When it happened, ISO 8601. Defaults to now.
        optional: true
      end_time:
        type: string
        description: End of the period, ISO 8601, for an annotation that spans time.
        optional: true
      url:
        type: string
        description: Link to the deploy, incident or pull request.
        optional: true
    output:
      description: The created annotation.
      type: object

  update_annotation:
    title: Update an annotation
    description: Change an annotation's title, description, time range or link.
    category: annotations
    request:
      method: PUT
      path: /v2/annotations/${annotation_id}
      body:
        title: "${title}"
        description: "${description}"
        time: "${time}"
        endTime: "${end_time}"
        url: "${url}"
        datasets: "${datasets}"
    input:
      annotation_id:
        type: string
        description: The annotation's id.
      title:
        type: string
        description: New label.
        optional: true
      description:
        type: string
        description: New detail.
        optional: true
      time:
        type: string
        description: New timestamp, ISO 8601.
        optional: true
      end_time:
        type: string
        description: New end time, ISO 8601.
        optional: true
      url:
        type: string
        description: New link.
        optional: true
      datasets:
        type: array
        description: The complete dataset list after the update.
        optional: true
        items: {type: string}
    output:
      description: The updated annotation.
      type: object

  delete_annotation:
    title: Delete an annotation
    description: Remove an annotation from the charts. No event data is affected.
    category: annotations
    destructive: true
    request:
      method: DELETE
      path: /v2/annotations/${annotation_id}
    input:
      annotation_id:
        type: string
        description: The annotation's id.
    output:
      description: Confirmation that the annotation was deleted.
      type: object

  # -- saved queries, views, virtual fields --------------------------------

  list_saved_queries:
    title: List saved APL queries
    description: >-
      Read the starred APL queries on the account -- the team's saved
      questions, which are the best starting point for writing a new one.
    category: saved
    read_only: true
    request:
      method: GET
      path: /v2/apl-starred-queries
    input: {}
    output:
      description: The saved queries.
      type: array
      items: {type: object}

  get_saved_query:
    title: Get a saved query
    description: Read one saved APL query, with its APL text and time range.
    category: saved
    read_only: true
    request:
      method: GET
      path: /v2/apl-starred-queries/${query_id}
    input:
      query_id:
        type: string
        description: The saved query's id.
    output:
      description: The saved query.
      type: object

  create_saved_query:
    title: Save an APL query
    description: >-
      Star an APL query so the team can reuse it. Saving does not run it --
      `query` does that.
    category: saved
    request:
      method: POST
      path: /v2/apl-starred-queries
      body:
        name: "${name}"
        dataset: "${dataset}"
        kind: "${kind}"
        query: "${query}"
    input:
      name:
        type: string
        description: Name for the saved query.
      query:
        type: object
        description: >-
          The query to save, as Axiom's query object -- typically
          {"apl": "...", "startTime": ..., "endTime": ...}.
      dataset:
        type: string
        description: The dataset the query belongs to.
        optional: true
      kind:
        type: string
        description: The query kind, e.g. "apl" or "analytics".
        optional: true
    output:
      description: The saved query.
      type: object

  delete_saved_query:
    title: Delete a saved query
    description: Remove a saved APL query. No data or dataset is affected.
    category: saved
    destructive: true
    request:
      method: DELETE
      path: /v2/apl-starred-queries/${query_id}
    input:
      query_id:
        type: string
        description: The saved query's id.
    output:
      description: Confirmation that the saved query was deleted.
      type: object

  list_virtual_fields:
    title: List virtual fields
    description: >-
      Read the virtual fields on the account -- computed columns defined by an
      APL expression, so a derived value can be queried as if it were ingested.
    category: saved
    read_only: true
    request:
      method: GET
      path: /v2/vfields
    input: {}
    output:
      description: The virtual fields.
      type: array
      items: {type: object}

  create_virtual_field:
    title: Create a virtual field
    description: >-
      Define a computed column on a dataset from an APL expression -- a parsed
      duration, a derived status class. It costs nothing at ingest and is
      evaluated at query time.
    category: saved
    request:
      method: POST
      path: /v2/vfields
      body:
        dataset: "${dataset}"
        name: "${name}"
        expression: "${expression}"
        description: "${description}"
        type: "${type}"
        unit: "${unit}"
    input:
      dataset:
        type: string
        description: The dataset the field belongs to.
      name:
        type: string
        description: The virtual field's name, as queries will reference it.
      expression:
        type: string
        description: The APL expression computing the value.
      description:
        type: string
        description: What the field means.
        optional: true
      type:
        type: string
        description: The value's type.
        optional: true
      unit:
        type: string
        description: The value's unit, e.g. "ms".
        optional: true
    output:
      description: The created virtual field.
      type: object

  update_virtual_field:
    title: Update a virtual field
    description: Change a virtual field's expression, name or metadata.
    category: saved
    request:
      method: PUT
      path: /v2/vfields/${virtual_field_id}
      body:
        dataset: "${dataset}"
        name: "${name}"
        expression: "${expression}"
        description: "${description}"
        type: "${type}"
        unit: "${unit}"
    input:
      virtual_field_id:
        type: string
        description: The virtual field's id.
      dataset:
        type: string
        description: The dataset the field belongs to.
      name:
        type: string
        description: The field's name.
      expression:
        type: string
        description: The APL expression computing the value.
      description:
        type: string
        description: What the field means.
        optional: true
      type:
        type: string
        description: The value's type.
        optional: true
      unit:
        type: string
        description: The value's unit.
        optional: true
    output:
      description: The updated virtual field.
      type: object

  delete_virtual_field:
    title: Delete a virtual field
    description: >-
      Delete a virtual field. Queries and monitors referencing it start
      failing, so grep for its name first.
    category: saved
    destructive: true
    request:
      method: DELETE
      path: /v2/vfields/${virtual_field_id}
    input:
      virtual_field_id:
        type: string
        description: The virtual field's id.
    output:
      description: Confirmation that the virtual field was deleted.
      type: object

  list_views:
    title: List views
    description: >-
      Read the views on the account -- saved dataset filters that scope what a
      restricted token or user may query.
    category: saved
    read_only: true
    request:
      method: GET
      path: /v2/views
    input: {}
    output:
      description: The views.
      type: array
      items: {type: object}

  create_view:
    title: Create a view
    description: >-
      Create a view: a named, filtered slice of a dataset. Tokens granted only
      view capabilities see the filtered data and nothing else, which is how
      access is narrowed without copying data.
    category: saved
    request:
      method: POST
      path: /v2/views
      body:
        name: "${name}"
        description: "${description}"
        dataset: "${dataset}"
        filter: "${filter}"
        fields: "${fields}"
    input:
      name:
        type: string
        description: The view's name.
      dataset:
        type: string
        description: The dataset the view is over.
      filter:
        type: string
        description: The APL filter defining what the view exposes.
        optional: true
      description:
        type: string
        description: What the view is for.
        optional: true
      fields:
        type: array
        description: Restrict the view to these fields.
        optional: true
        items: {type: string}
    output:
      description: The created view.
      type: object

  delete_view:
    title: Delete a view
    description: >-
      Delete a view. Tokens scoped to it lose their access entirely, so check
      what depends on it first.
    category: saved
    destructive: true
    request:
      method: DELETE
      path: /v2/views/${view_id}
    input:
      view_id:
        type: string
        description: The view's id.
    output:
      description: Confirmation that the view was deleted.
      type: object

  # -- dashboards ----------------------------------------------------------

  list_dashboards:
    title: List dashboards
    description: Read the dashboards on the account, with their uid, title and owner.
    category: dashboards
    read_only: true
    request:
      method: GET
      path: /v2/dashboards
    input: {}
    output:
      description: The dashboards.
      type: array
      items: {type: object}

  get_dashboard:
    title: Get a dashboard
    description: >-
      Read one dashboard in full -- its charts and their APL queries, which is
      the fastest way to learn how a team actually queries a dataset.
    category: dashboards
    read_only: true
    request:
      method: GET
      path: /v2/dashboards/uid/${dashboard_uid}
    input:
      dashboard_uid:
        type: string
        description: The dashboard's uid.
    output:
      description: The dashboard and its charts.
      type: object

  create_dashboard:
    title: Create a dashboard
    description: >-
      Create a dashboard. `charts` holds the panels, each with its own APL
      query and visualisation, in the shape get_dashboard returns.
    category: dashboards
    request:
      method: POST
      path: /v2/dashboards
      body:
        name: "${name}"
        description: "${description}"
        charts: "${charts}"
        timeWindowStart: "${time_window_start}"
        timeWindowEnd: "${time_window_end}"
    input:
      name:
        type: string
        description: The dashboard's title.
      description:
        type: string
        description: What the dashboard shows.
        optional: true
      charts:
        type: array
        description: The panels, each with its APL query and chart options.
        optional: true
        items: {type: object}
      time_window_start:
        type: string
        description: Default start of the dashboard's time window, e.g. "now-24h".
        optional: true
      time_window_end:
        type: string
        description: Default end of the time window, e.g. "now".
        optional: true
    output:
      description: The created dashboard.
      type: object

  update_dashboard:
    title: Update a dashboard
    description: >-
      Replace a dashboard's definition. Everything not sent is dropped, so read
      it with get_dashboard first and send the whole thing back.
    category: dashboards
    request:
      method: PUT
      path: /v2/dashboards/uid/${dashboard_uid}
      body:
        name: "${name}"
        description: "${description}"
        charts: "${charts}"
        timeWindowStart: "${time_window_start}"
        timeWindowEnd: "${time_window_end}"
    input:
      dashboard_uid:
        type: string
        description: The dashboard's uid.
      name:
        type: string
        description: The dashboard's title.
      description:
        type: string
        description: What the dashboard shows.
        optional: true
      charts:
        type: array
        description: The complete panel list after the update.
        optional: true
        items: {type: object}
      time_window_start:
        type: string
        description: Default start of the time window.
        optional: true
      time_window_end:
        type: string
        description: Default end of the time window.
        optional: true
    output:
      description: The updated dashboard.
      type: object

  delete_dashboard:
    title: Delete a dashboard
    description: Delete a dashboard and its panels. The underlying datasets are untouched.
    category: dashboards
    destructive: true
    request:
      method: DELETE
      path: /v2/dashboards/uid/${dashboard_uid}
    input:
      dashboard_uid:
        type: string
        description: The dashboard's uid.
    output:
      description: Confirmation that the dashboard was deleted.
      type: object

  # -- tokens, users, orgs, RBAC -------------------------------------------

  list_tokens:
    title: List API tokens
    description: >-
      Read the account's API tokens with their names, capabilities and expiry.
      The token values themselves are not returned -- only their metadata.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/tokens
    input: {}
    output:
      description: The account's API tokens.
      type: array
      items: {type: object}

  get_token:
    title: Get an API token
    description: Read one token's metadata -- name, expiry and the capabilities it grants.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/tokens/${token_id}
    input:
      token_id:
        type: string
        description: The token's id.
    output:
      description: The token's metadata.
      type: object

  create_token:
    title: Create an API token
    description: >-
      Mint an API token. `dataset_capabilities` and `org_capabilities` are the
      whole security model -- e.g. {"logs": {"ingest": ["create"], "query":
      ["read"]}} and {"monitors": ["read"]}. The token value comes back **once**
      and cannot be retrieved again. Grant the narrowest set that works.
    category: admin
    request:
      method: POST
      path: /v2/tokens
      body:
        name: "${name}"
        description: "${description}"
        expiresAt: "${expires_at}"
        datasetCapabilities: "${dataset_capabilities}"
        orgCapabilities: "${org_capabilities}"
        viewCapabilities: "${view_capabilities}"
    input:
      name:
        type: string
        description: A name for the token, so it can be recognised later.
      description:
        type: string
        description: What the token is for.
        optional: true
      expires_at:
        type: string
        description: When the token should stop working, ISO 8601. Omit for no expiry.
        optional: true
      dataset_capabilities:
        type: object
        description: >-
          Per-dataset grants, keyed by dataset name -- e.g.
          {"logs": {"ingest": ["create"], "query": ["read"]}}.
        optional: true
      org_capabilities:
        type: object
        description: >-
          Organisation-level grants, e.g. {"monitors": ["read"], "datasets":
          ["create", "read"]}.
        optional: true
      view_capabilities:
        type: object
        description: Per-view grants, keyed by view name.
        optional: true
    output:
      description: The created token, including the secret value -- shown only this once.
      type: object

  regenerate_token:
    title: Regenerate an API token
    description: >-
      Issue a new secret for a token and invalidate the old one immediately.
      Anything still using the previous value starts failing at once.
    category: admin
    destructive: true
    request:
      method: POST
      path: /v2/tokens/${token_id}/regenerate
    input:
      token_id:
        type: string
        description: The token's id.
    output:
      description: The token with its new secret value.
      type: object

  delete_token:
    title: Delete an API token
    description: >-
      Revoke a token. Every integration using it stops working immediately and
      there is no undo.
    category: admin
    destructive: true
    request:
      method: DELETE
      path: /v2/tokens/${token_id}
    input:
      token_id:
        type: string
        description: The token's id.
    output:
      description: Confirmation that the token was revoked.
      type: object

  get_current_user:
    title: Get the current user
    description: >-
      Read the identity the token acts as -- name, email and role. The cheapest
      call that proves the token works.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/user
    input: {}
    output:
      description: The current user.
      type: object

  list_users:
    title: List users
    description: Read the organisation's users with their roles and status.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/users
    input: {}
    output:
      description: The organisation's users.
      type: array
      items: {type: object}

  get_user:
    title: Get a user
    description: Read one user -- their name, email and role in the organisation.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/users/${user_id}
    input:
      user_id:
        type: string
        description: The user's id.
    output:
      description: The user.
      type: object

  create_user:
    title: Invite a user
    description: >-
      Add a user to the organisation with a role. Axiom emails them an
      invitation, so this reaches a real person.
    category: admin
    request:
      method: POST
      path: /v2/users
      body:
        name: "${name}"
        email: "${email}"
        role: "${role}"
    input:
      email:
        type: string
        description: The person's email address; the invitation goes here.
        format: email
      role:
        type: string
        description: The role to grant, e.g. "user", "admin" or a custom role id.
      name:
        type: string
        description: The person's name.
        optional: true
    output:
      description: The created user.
      type: object

  update_user_role:
    title: Change a user's role
    description: >-
      Set a user's role in the organisation, which is what decides everything
      they can see and do.
    category: admin
    request:
      method: PUT
      path: /v2/users/${user_id}/role
      body:
        role: "${role}"
    input:
      user_id:
        type: string
        description: The user's id.
      role:
        type: string
        description: The new role id.
    output:
      description: The user after the change.
      type: object

  remove_user:
    title: Remove a user from the organisation
    description: >-
      Take a user out of the organisation. Their queries and dashboards remain,
      but their access ends immediately.
    category: admin
    destructive: true
    request:
      method: DELETE
      path: /v2/users/${user_id}
    input:
      user_id:
        type: string
        description: The user's id.
    output:
      description: Confirmation that the user was removed.
      type: object

  list_orgs:
    title: List organisations
    description: Read the organisations the token can see, with their plan and id.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/orgs
    input: {}
    output:
      description: The organisations.
      type: array
      items: {type: object}

  get_org:
    title: Get an organisation
    description: Read one organisation -- its name, plan and limits.
    category: admin
    read_only: true
    request:
      method: GET
      path: /v2/orgs/${org_id}
    input:
      org_id:
        type: string
        description: The organisation's id.
    output:
      description: The organisation.
      type: object

  list_roles:
    title: List roles
    description: >-
      Read the RBAC roles defined on the account, with the capabilities each
      grants. Role ids are what a user's role field takes.
    category: rbac
    read_only: true
    request:
      method: GET
      path: /v2/rbac/roles
    input: {}
    output:
      description: The account's roles.
      type: array
      items: {type: object}

  get_role:
    title: Get a role
    description: Read one role and the capabilities it grants.
    category: rbac
    read_only: true
    request:
      method: GET
      path: /v2/rbac/roles/${role_id}
    input:
      role_id:
        type: string
        description: The role's id.
    output:
      description: The role.
      type: object

  create_role:
    title: Create a role
    description: >-
      Define an RBAC role. `capabilities` uses the same grant shape as a
      token's -- per-dataset and organisation-level -- and applies to every
      user given the role.
    category: rbac
    request:
      method: POST
      path: /v2/rbac/roles
      body:
        name: "${name}"
        description: "${description}"
        capabilities: "${capabilities}"
    input:
      name:
        type: string
        description: The role's name.
      capabilities:
        type: object
        description: The capabilities the role grants, in the same shape as a token's.
      description:
        type: string
        description: What the role is for.
        optional: true
    output:
      description: The created role.
      type: object

  update_role:
    title: Update a role
    description: >-
      Change a role's capabilities. Every user holding it is affected at once,
      so widening a role is a real privilege change.
    category: rbac
    request:
      method: PUT
      path: /v2/rbac/roles/${role_id}
      body:
        name: "${name}"
        description: "${description}"
        capabilities: "${capabilities}"
    input:
      role_id:
        type: string
        description: The role's id.
      name:
        type: string
        description: The role's name.
      capabilities:
        type: object
        description: The complete capability set after the update.
      description:
        type: string
        description: What the role is for.
        optional: true
    output:
      description: The updated role.
      type: object

  delete_role:
    title: Delete a role
    description: >-
      Delete a role. Users holding it lose those capabilities, so move them to
      another role first.
    category: rbac
    destructive: true
    request:
      method: DELETE
      path: /v2/rbac/roles/${role_id}
    input:
      role_id:
        type: string
        description: The role's id.
    output:
      description: Confirmation that the role was deleted.
      type: object

  list_groups:
    title: List groups
    description: >-
      Read the RBAC groups on the account -- sets of users that roles are
      attached to, so permissions are managed by team rather than per person.
    category: rbac
    read_only: true
    request:
      method: GET
      path: /v2/rbac/groups
    input: {}
    output:
      description: The account's groups.
      type: array
      items: {type: object}

  get_group:
    title: Get a group
    description: Read one group -- its members and the roles it carries.
    category: rbac
    read_only: true
    request:
      method: GET
      path: /v2/rbac/groups/${group_id}
    input:
      group_id:
        type: string
        description: The group's id.
    output:
      description: The group.
      type: object

  create_group:
    title: Create a group
    description: >-
      Create a group of users and attach roles to it -- the maintainable way to
      grant a team access.
    category: rbac
    request:
      method: POST
      path: /v2/rbac/groups
      body:
        name: "${name}"
        description: "${description}"
        members: "${members}"
        roles: "${roles}"
    input:
      name:
        type: string
        description: The group's name.
      description:
        type: string
        description: What the group is for.
        optional: true
      members:
        type: array
        description: User ids in the group.
        optional: true
        items: {type: string}
      roles:
        type: array
        description: Role ids the group carries.
        optional: true
        items: {type: string}
    output:
      description: The created group.
      type: object

  update_group:
    title: Update a group
    description: >-
      Change a group's members or roles. Both lists replace what was there, so
      send them complete.
    category: rbac
    request:
      method: PUT
      path: /v2/rbac/groups/${group_id}
      body:
        name: "${name}"
        description: "${description}"
        members: "${members}"
        roles: "${roles}"
    input:
      group_id:
        type: string
        description: The group's id.
      name:
        type: string
        description: The group's name.
      description:
        type: string
        description: What the group is for.
        optional: true
      members:
        type: array
        description: The complete member list after the update.
        optional: true
        items: {type: string}
      roles:
        type: array
        description: The complete role list after the update.
        optional: true
        items: {type: string}
    output:
      description: The updated group.
      type: object

  delete_group:
    title: Delete a group
    description: >-
      Delete a group. Its members lose whatever the group's roles granted them.
    category: rbac
    destructive: true
    request:
      method: DELETE
      path: /v2/rbac/groups/${group_id}
    input:
      group_id:
        type: string
        description: The group's id.
    output:
      description: Confirmation that the group was deleted.
      type: object

  # -- metrics metadata ----------------------------------------------------

  list_dataset_metrics:
    title: List a dataset's metrics
    description: >-
      Read the metric names available in a dataset on an edge deployment -- the
      vocabulary for an MPL query.
    category: query
    read_only: true
    request:
      method: GET
      path: /v1/query/metrics/info/datasets/${dataset}/metrics
    input:
      dataset:
        type: string
        description: The dataset's name.
    output:
      description: The dataset's metric names.
      type: object

  list_dataset_metric_tags:
    title: List a metric's tags
    description: >-
      Read the tag keys attached to one metric, which are the dimensions an MPL
      query can group or filter by.
    category: query
    read_only: true
    request:
      method: GET
      path: /v1/query/metrics/info/datasets/${dataset}/metrics/${metric}/tags
    input:
      dataset:
        type: string
        description: The dataset's name.
      metric:
        type: string
        description: The metric's name.
    output:
      description: The metric's tag keys.
      type: object

  list_dataset_tags:
    title: List a dataset's tags
    description: Read every tag key present in a dataset's metric data.
    category: query
    read_only: true
    request:
      method: GET
      path: /v1/query/metrics/info/datasets/${dataset}/tags
    input:
      dataset:
        type: string
        description: The dataset's name.
    output:
      description: The dataset's tag keys.
      type: object

  list_dataset_tag_values:
    title: List a tag's values
    description: >-
      Read the values one tag key takes in a dataset -- what you need before
      filtering an MPL query on it.
    category: query
    read_only: true
    request:
      method: GET
      path: /v1/query/metrics/info/datasets/${dataset}/tags/${tag}/values
    input:
      dataset:
        type: string
        description: The dataset's name.
      tag:
        type: string
        description: The tag key.
    output:
      description: The tag's values.
      type: object
