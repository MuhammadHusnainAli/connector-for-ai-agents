          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      replacements:
        type: object
        description: Map of old status id to new status id for every status with items.
      status_preset_id:
        type: string
        description: Preset to assign; null to unassign.
        optional: true
    output:
      description: The workspace's new statuses.
      type: object

  update_status_preset_statuses:
    title: Update a status preset's statuses
    description: >-
      Change the statuses in a preset, migrating items in every workspace that uses it; each
      removed status needs a replacement.
    category: statuses
    scopes:
    - team
    destructive: true
    request:
      method: PUT
      path: /api/status-presets/${status_preset_id}/statuses
      query:
        actAsAdmin: ${act_as_admin}
      body:
        replacements: ${replacements}
        statuses: ${statuses}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      status_preset_id:
        type: string
        description: Status preset id (UUID).
      replacements:
        type: object
        description: Map of removed status id to the status id its items move to.
      statuses:
        type: array
        description: The complete updated status list.
        items:
          type: object
    output:
      description: The preset's statuses.
      type: object

  list_field_types:
    title: List field types
    description: >-
      List the custom field types available: boolean, date, date-range, milestone, number,
      people, rich-text, select, text and time-period, with the settings each takes.
    category: fields
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /api/fields/types
      query:
        actAsAdmin: ${act_as_admin}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
    output:
      description: The field types.
      type: object

  search_fields:
    title: Search fields
    description: >-
      List custom fields, optionally only those installed in given workspaces, only team fields,
      or only required ones. Field ids key an item's fields object.
    category: fields
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /api/fields/search
      query:
        actAsAdmin: ${act_as_admin}
      body:
        isTeamField: ${is_team_field}
        required: ${required}
        workspaceIds: ${workspace_ids}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      is_team_field:
        type: boolean
        description: Return only fields with the specified isTeamField value.
        optional: true
      required:
        type: boolean
        description: Return only fields with the specified required value.
        optional: true
      workspace_ids:
        type: array
        description: Return only fields which are installed in the specified workspaces.
        optional: true
        items:
          type: string
    output:
      description: The matching fields.
      type: object

  get_field:
    title: Get a field
    description: >-
      Read one custom field's type, settings and the workspaces it is installed in.
    category: fields
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /api/fields/${field_id}
      query:
        actAsAdmin: ${act_as_admin}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field_id:
        type: string
        description: Field id (UUID).
    output:
      description: The field.
      type: object

  install_field:
    title: Install a field
    description: >-
      Create a custom field. typeId is boolean, date, date-range, milestone, number, people,
      rich-text, select, text or time-period; select, number, people, text, milestone and
      time-period take settings (e.g. select options). A workspace field names exactly one
      workspace; a team field (admin, team-fields feature) any number.
    category: fields
    scopes:
    - workspace
    request:
      method: POST
      path: /api/fields
      query:
        actAsAdmin: ${act_as_admin}
      body: ${field}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field:
        type: object
        properties:
          typeId:
            type: string
          name:
            type: string
          description:
            type: string
          required:
            type: boolean
          isTeamField:
            type: boolean
          workspaceIds:
            type: array
          settings:
            type: object
        description: 'The field: {typeId, name, description, required, isTeamField, workspaceIds,
          settings}.'
    output:
      description: The installed field.
      type: object

  reconfigure_field:
    title: Reconfigure a field
    description: >-
      Change a custom field's name, description, required flag, team-field status or type
      settings.
    category: fields
    scopes:
    - workspace
    request:
      method: PUT
      path: /api/fields/${field_id}
      query:
        actAsAdmin: ${act_as_admin}
      body:
        description: ${description}
        isTeamField: ${is_team_field}
        name: ${name}
        required: ${required}
        settings: ${settings}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field_id:
        type: string
        description: Field id (UUID).
      description:
        type: string
        description: Field description.
      is_team_field:
        type: boolean
        description: True for a team field.
      name:
        type: string
        description: Field name.
      required:
        type: boolean
        description: True if every item must have a value.
        optional: true
      settings:
        type: string
        description: Settings for the field's type; omit for types without settings.
        optional: true
    output:
      description: The updated field.
      type: object

  delete_field:
    title: Delete a field
    description: >-
      Delete a custom field and every item's value for it.
    category: fields
    scopes:
    - workspace
    destructive: true
    request:
      method: DELETE
      path: /api/fields/${field_id}
      query:
        actAsAdmin: ${act_as_admin}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field_id:
        type: string
        description: Field id (UUID).
    output:
      description: An empty result on success.
      type: object

  delete_fields:
    title: Delete several fields
    description: >-
      Delete several custom fields and all their values at once.
    category: fields
    scopes:
    - workspace
    destructive: true
    request:
      method: POST
      path: /api/fields/delete
      query:
        actAsAdmin: ${act_as_admin}
      body: ${field_ids}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field_ids:
        type: array
        items:
          type: string
        min_length: 1
        description: Ids of the fields to delete.
    output:
      description: Confirmation.
      type: object

  reorder_fields:
    title: Reorder fields
    description: >-
      Set the order a workspace shows its fields in.
    category: fields
    scopes:
    - workspace
    request:
      method: POST
      path: /api/fields/reorder
      query:
        actAsAdmin: ${act_as_admin}
      body:
        fieldIds: ${field_ids}
        workspaceId: ${workspace_id}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      field_ids:
        type: array
        description: Every field id in the new order.
        items:
          type: string
      workspace_id:
        type: string
        description: Workspace id (UUID).
    output:
      description: Confirmation.
      type: object

  link_team_fields_to_workspaces:
    title: Link team fields to workspaces
    description: >-
      Install existing team fields in more workspaces.
    category: fields
    scopes:
    - workspace
    request:
      method: POST
      path: /api/fields/workspaces
      query:
        actAsAdmin: ${act_as_admin}
      body: ${links}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      links:
        type: array
        items:
          type: object
          properties:
            fieldId:
              type: string
            workspaceId:
              type: string
        min_length: 1
        description: Pairs of {fieldId, workspaceId} to link.
    output:
      description: Confirmation.
      type: object

  unlink_team_fields_from_workspaces:
    title: Unlink team fields from workspaces
    description: >-
      Remove team fields from workspaces, dropping those workspaces' values for them.
    category: fields
    scopes:
    - workspace
    destructive: true
    request:
      method: POST
      path: /api/fields/workspaces/unlink
      query:
        actAsAdmin: ${act_as_admin}
      body: ${links}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      links:
        type: array
        items:
          type: object
          properties:
            fieldId:
              type: string
            workspaceId:
              type: string
        min_length: 1
        description: Pairs of {fieldId, workspaceId} to unlink.
    output:
      description: Confirmation.
      type: object

  list_templates:
    title: List templates
    description: >-
      List the workspace templates available to the team.
    category: templates
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /api/templates
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
    output:
      description: A page of templates.
      type: object

  apply_template:
    title: Install a template
    description: >-
      Create workspaces from a template with its parameters and permissions. When a template
      creates several workspaces the main one is returned.
    category: templates
    scopes:
    - workspace
    request:
      method: POST
      path: /api/templates/apply/${template_id}
      query:
        actAsAdmin: ${act_as_admin}
      body:
        defaultPermission: ${default_permission}
        groupId: ${group_id}
        name: ${name}
        parameters: ${parameters}
        permissions: ${permissions}
        userGroupPermissions: ${user_group_permissions}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      template_id:
        type: string
        description: Template id.
      default_permission:
        type: string
        description: Default permission for the team.
        optional: true
        enum:
        - comment
        - full
        - read
        - write
      group_id:
        type: string
        description: Workspace group to create the workspaces in.
        optional: true
      name:
        type: string
        description: Name for the main workspace.
        optional: true
      parameters:
        type: object
        description: Template parameters, as the template defines them.
      permissions:
        type: object
        description: Map of user id to permission.
      user_group_permissions:
        type: object
        description: Map of user group id to permission.
    output:
      description: The main created workspace.
      type: object

  export_template:
    title: Export a template
    description: >-
      Export workspaces as template instructions that apply_template can install elsewhere,
      optionally with user data and their parent group.
    category: templates
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /api/templates/export
      query:
        actAsAdmin: ${act_as_admin}
      body:
        exportUsers: ${export_users}
        exportWorkspaceGroups: ${export_workspace_groups}
        workspaceIds: ${workspace_ids}
      base_url_override: https://api.airfocus.com
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      export_users:
        type: boolean
        description: Whether to export user-related data (assignees, people-fields, etc).
        optional: true
      export_workspace_groups:
        type: boolean
        description: Whether to also export a parent group of the exported workspaces.
        optional: true
      workspace_ids:
        type: array
        description: A set of workspaces which need to be exported into a template.
        items:
          type: string
    output:
      description: The template instructions.
      type: object

  get_profile:
    title: Get the profile
    description: >-
      Read the authenticated user's profile -- id, name, email and avatar. A good connection
      check.
    category: profile
    scopes:
    - profile:read
    read_only: true
    request:
      method: GET
      path: /api/profile
      base_url_override: https://api.airfocus.com
    input: {}
    output:
      description: The profile.
      type: object

  update_profile:
    title: Update the profile
    description: >-
      Change the authenticated user's full name, email or avatar.
    category: profile
    scopes:
    - profile
    request:
      method: PUT
      path: /api/profile
      body:
        avatarAttachmentId: ${avatar_attachment_id}
        email: ${email}
        fullName: ${full_name}
      base_url_override: https://api.airfocus.com
    input:
      avatar_attachment_id:
        type: string
        description: Attachment id of the avatar image.
        optional: true
      email:
        type: string
        description: Email address.
      full_name:
        type: string
        description: Full name.
    output:
      description: The updated profile.
      type: object

  list_api_keys:
    title: List API keys
    description: >-
      List the user's API keys with their names and scopes.
    category: profile
    scopes:
    - profile
    read_only: true
    request:
      method: GET
      path: /api/profile/api-keys
      base_url_override: https://api.airfocus.com
    input: {}
    output:
      description: The API keys.
      type: object

  create_api_key:
    title: Create an API key
    description: >-
      Create an API key with a name and scopes (workspace, workspace:read, workspace:comment,
      team, team:read, profile, profile:read). The secret appears only in this response.
    category: profile
    scopes:
    - profile
    request:
      method: POST
      path: /api/profile/api-keys
      body:
        name: ${name}
        scopes: ${scopes}
      base_url_override: https://api.airfocus.com
    input:
      name:
        type: string
        description: Key name.
      scopes:
        type: array
        description: Scopes to grant.
        items:
          type: string
    output:
      description: The key, with its secret this one time.
      type: object

  delete_api_key:
    title: Delete an API key
    description: >-
      Revoke one of the user's API keys; anything using it stops working.
    category: profile
    scopes:
    - profile
    destructive: true
    request:
      method: DELETE
      path: /api/profile/api-keys/${api_key_id}
      base_url_override: https://api.airfocus.com
    input:
      api_key_id:
        type: string
        description: API key id.
    output:
      description: An empty result on success.
      type: object

  get_client_settings:
    title: Get client settings
    description: >-
      Read the user's stored client-side settings, or one value by path.
    category: profile
    scopes:
    - profile:read
    read_only: true
    request:
      method: GET
      path: /api/profile/client-settings
      query:
        path: ${path}
      base_url_override: https://api.airfocus.com
    input:
      path:
        type: string
        description: Settings path to read; omit for all.
        optional: true
    output:
      description: The settings.
      type: object

  set_client_settings:
    title: Set client settings
    description: >-
      Store a client-side settings value for the user at a path.
    category: profile
    scopes:
    - profile
    request:
      method: PUT
      path: /api/profile/client-settings
      body:
        path: ${path}
        value: ${value}
      base_url_override: https://api.airfocus.com
    input:
      path:
        type: string
        description: Settings path to write.
        optional: true
      value:
        type: string
        description: Value to store.
    output:
      description: The stored settings.
      type: object

  get_team:
    title: Get the team
    description: >-
      Read the team: name, plan, features, flags and user groups.
    category: team
    scopes:
    - team:read
    read_only: true
    request:
      method: GET
      path: /api/team
      base_url_override: https://api.airfocus.com
    input: {}
    output:
      description: The team.
      type: object

  update_team_flags:
    title: Update team flags
    description: >-
      Toggle team-wide switches: AI features, the MCP server, the OKR app, the Slack AI assistant,
      branding removal, portal login and password requirements, and share-link and integration
      restrictions. Admin only.
    category: team
    scopes:
    - team
    request:
      method: PATCH
      path: /api/team/flags
      body:
        enableAi: ${enable_ai}
        enableMcpServer: ${enable_mcp_server}
        enableOkrApp: ${enable_okr_app}
        enableSlackAiAssistant: ${enable_slack_ai_assistant}
        forbidShareLinkCreation: ${forbid_share_link_creation}
        removeBranding: ${remove_branding}
        requirePortalLogin: ${require_portal_login}
        requirePortalPassword: ${require_portal_password}
        requireShareLinkPassword: ${require_share_link_password}
        restrictIntegrationManagement: ${restrict_integration_management}
        restrictShareLinkCreation: ${restrict_share_link_creation}
      base_url_override: https://api.airfocus.com
    input:
      enable_ai:
        type: boolean
        description: Enable AI features.
        optional: true
      enable_mcp_server:
        type: boolean
        description: Enable the Airfocus MCP server.
        optional: true
      enable_okr_app:
        type: boolean
        description: Enable the OKR app.
        optional: true
      enable_slack_ai_assistant:
        type: boolean
        description: Enable the Slack AI assistant.
        optional: true
      forbid_share_link_creation:
        type: boolean
        description: Forbid creating share links.
        optional: true
      remove_branding:
        type: boolean
        description: Remove Airfocus branding from portals.
        optional: true
      require_portal_login:
        type: boolean
        description: Require login for portals.
        optional: true
      require_portal_password:
        type: boolean
        description: Require a password for portals.
        optional: true
      require_share_link_password:
        type: boolean
        description: Require passwords on share links.
        optional: true
      restrict_integration_management:
        type: boolean
        description: Only admins manage integrations.
        optional: true
      restrict_share_link_creation:
        type: boolean
        description: Only admins create share links.
        optional: true
    output:
      description: The team's flags.
      type: object

  get_maintenance_window:
    title: Get the maintenance window
    description: >-
      Read scheduled Airfocus maintenance in the coming days.
    category: team
    scopes:
    - team:read
    read_only: true
    request:
      method: GET
      path: /api/team/maintenance-window
      query:
        upcomingDays: ${upcoming_days}
      base_url_override: https://api.airfocus.com
    input:
      upcoming_days:
        type: integer
        description: How many days ahead to look.
        optional: true
    output:
      description: The maintenance windows.
      type: object

  list_users:
    title: List team users
    description: >-
      List the team's users with their roles and states, optionally matching a name or email.
    category: team
    scopes:
    - team:read
    read_only: true
    request:
      method: GET
      path: /api/team/users
      query:
        query: ${query}
      base_url_override: https://api.airfocus.com
    input:
      query:
        type: string
        description: Text to match against name or email.
        optional: true
    output:
      description: The users.
      type: object

  invite_user:
    title: Invite a user
    description: >-
      Invite someone to the team by email with a role -- admin, editor or contributor. An
      invitation email is sent.
    category: team
    scopes:
    - team
    destructive: true
    request:
      method: POST
      path: /api/team/users/invite
      body:
        email: ${email}
        fullName: ${full_name}
        role: ${role}
      base_url_override: https://api.airfocus.com
    input:
      email:
        type: string
        description: Invitee email.
      full_name:
        type: string
        description: Invitee full name.
      role:
        type: string
        description: admin, editor or contributor.
        enum:
        - admin
        - contributor
        - editor
    output:
      description: The invited user.
      type: object

  invite_users:
    title: Invite several users
    description: >-
      Invite several people at once, each {email, fullName, role}. Invitation emails are sent.
    category: team
    scopes:
    - team
    destructive: true
    request:
      method: POST
      path: /api/team/users/invite/bulk
      body:
        users: ${users}
      base_url_override: https://api.airfocus.com
    input:
      users:
        type: array
        description: Invitees, each {email, fullName, role}.
        items:
          type: object
    output:
      description: The invited users.
      type: object

  create_user_invite:
    title: Create an invite link
    description: >-
      Create an invitation for an existing pending user without sending an email, returning
      the invite so you can deliver it yourself.
    category: team
    scopes:
    - team
    request:
      method: POST
      path: /api/team/users/invite/create
      body:
        userId: ${user_id}
      base_url_override: https://api.airfocus.com
    input:
      user_id:
        type: string
        description: Pending user's id.
    output:
      description: The invitation.
      type: object

  resend_user_invite:
    title: Resend an invitation
    description: >-
      Send a pending team invitation email again to someone who has not joined.
    category: team
    scopes:
    - team
    destructive: true
    request:
      method: POST
      path: /api/team/users/invite/resend
      body:
        email: ${email}
      base_url_override: https://api.airfocus.com
    input:
      email:
        type: string
        description: Invitee email.
    output:
      description: Confirmation.
      type: object

  change_user_role:
    title: Change a user's role
    description: >-
      Change a team user's role to admin, editor or contributor.
    category: team
    scopes:
    - team
    request:
      method: POST
      path: /api/team/users/role
      body:
        role: ${role}
        userId: ${user_id}
      base_url_override: https://api.airfocus.com
    input:
      role:
        type: string
        description: admin, editor or contributor.
        enum:
        - admin
        - contributor
        - editor
      user_id:
        type: string
        description: User id.
    output:
      description: Confirmation.
      type: object

  set_user_disabled:
    title: Disable or enable a user
    description: >-
      Disable a team user so they can no longer sign in, or re-enable them.
    category: team
    scopes:
    - team
    destructive: true
    request:
      method: POST
      path: /api/team/users/disabled
      body:
        disabled: ${disabled}
        userId: ${user_id}
      base_url_override: https://api.airfocus.com
    input:
      disabled:
        type: boolean
        description: True to disable, false to re-enable.
      user_id:
        type: string
        description: User id.
    output:
      description: Confirmation.
      type: object

  remove_user:
    title: Remove a user from the team
    description: >-
      Remove a user from the team entirely, revoking all of their access.
    category: team
    scopes:
    - team
    destructive: true
    request:
      method: POST
      path: /api/team/users/kick
      body:
        userId: ${user_id}
      base_url_override: https://api.airfocus.com
    input:
      user_id:
        type: string
        description: User id.
    output:
      description: Confirmation.
      type: object

  list_ai_actors:
    title: List AI actors
    description: >-
      List the team's AI actors -- the AI agents that can act in workspaces.
    category: team
    scopes:
    - team:read
    read_only: true
    request:
      method: GET
      path: /api/ai-actors
      base_url_override: https://api.airfocus.com
    input: {}
    output:
      description: The AI actors.
      type: object
