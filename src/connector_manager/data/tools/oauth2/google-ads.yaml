  list_insights_eligible_dates:
    title: List insights eligible dates
    description: Call the Google Ads API's ListInsightsEligibleDates method for insights eligible dates.
    category: planning
    request:
      method: POST
      path: /v25/audienceInsights:listInsightsEligibleDates
      body: ${body}
    input:
      body:
        type: object
        description: The ListInsightsEligibleDatesRequest body, as the Google Ads API reference defines
          it.
    output:
      description: The ListInsightsEligibleDatesResponse, as the Google Ads API defines it.
      type: object
    scopes:
    - adwords
