# Google (service account) tools.
#
# The same www.googleapis.com host as the `google` connector, reached with a
# service account's own credentials rather than a signed-in user's. That
# difference is the whole story for this pack:
#
#   * a service account has no user profile, so the userinfo tools are absent;
#     `check_token` is how you confirm what the credentials actually carry;
#   * what it may reach is decided by the IAM roles granted to the account, and
#     -- for Workspace data -- by domain-wide delegation, which an administrator
#     configures per scope. A 403 here usually means delegation was never set
#     up for that scope rather than that the code is wrong;
#   * for a product API, use its own connector. The Google connectors accept a
#     service-account grant wherever the API itself does.
#
# Docs: https://developers.google.com/identity/protocols/oauth2/service-account

connector_id: google-service-account
display_name: Google Service Account
docs_url: https://developers.google.com/identity/protocols/oauth2/service-account

tools:
  check_token:
    title: Check an access token
    description: >-
      What a token actually grants: the scopes on it, the client id it was
      issued to, the user it belongs to and how many seconds it has left.
      The way to tell an expired token from a missing role or an
      un-delegated scope before blaming a 403 on the code. Google answers 400 for a token it cannot read, so the
      body matters more than the status.
    category: tokens
    read_only: true
    request:
      method: GET
      path: /oauth2/v3/tokeninfo
      query:
        access_token: "${access_token}"
        id_token: "${id_token}"
    input:
      access_token:
        type: string
        description: The access token to inspect. Give this or `id_token`.
        optional: true
        secret: true
      id_token:
        type: string
        description: An ID token to inspect instead of an access token.
        optional: true
        secret: true
    output:
      description: What the token carries.
      type: object
      properties:
        scope: {type: string, description: "Space-separated granted scopes."}
        aud: {type: string, description: "The client id the token was issued to."}
        sub: {type: string}
        email: {type: string}
        expires_in: {type: integer}
  get_signing_certificates:
    title: Get Google's ID token signing keys
    description: >-
      The public keys Google signs ID tokens with, so a token can be verified
      locally rather than by calling the service for every request.
      Unauthenticated and cacheable -- refetch when a token's `kid` is not among
      them, which is how key rotation is handled.
    category: tokens
    read_only: true
    request:
      method: GET
      path: /oauth2/v3/certs
    input: {}
    output:
      description: The JSON Web Key Set.
      type: object
      properties:
        keys: {type: array, description: "Each a JWK with kid, kty, n and e."}
  list_apis:
    title: List Google's APIs
    description: >-
      Every API Google publishes a discovery document for, with its name,
      version and the URL of that document. Useful for finding the exact
      endpoint shape of an API this catalogue has no dedicated connector for.
    category: discovery
    read_only: true
    request:
      method: GET
      path: /discovery/v1/apis
      query:
        name: "${name}"
        preferred: "${preferred}"
    input:
      name:
        type: string
        description: Only APIs with this name, e.g. "drive".
        optional: true
      preferred:
        type: boolean
        description: Only the preferred version of each API, rather than every version.
        optional: true
    output:
      description: The available APIs.
      type: object
      properties:
        items: {type: array, description: "Each with id, name, version, title and discoveryRestUrl."}
