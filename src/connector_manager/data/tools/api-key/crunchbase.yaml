# Crunchbase tools -- the v4 private-market data API.
#
# The connection's base url stops at the host, so every path here starts with
# /v4. Four things shape how this API is driven, and each one is a common
# stumbling block:
#
#   * **entities are addressed by permalink, not by UUID.** Stripe is
#     `stripe`, not a hex id. `autocomplete_entities` is the intended first
#     call in almost every workflow -- it turns the name a human typed into the
#     identifier every lookup tool takes;
#   * **you choose the fields.** A lookup returns a small default set unless
#     `field_ids` asks for more, and a search returns nothing useful without
#     them. `get_field_metadata` is the authoritative list of what a collection
#     has; a misspelt field id is a 400, not an empty column;
#   * **searches are POSTs with a predicate language.** `query` is an array of
#     `{type: predicate, field_id, operator_id, values}` objects, ANDed
#     together. Paging is by `after_id` over a stable `order` -- there is no
#     offset, and paging without an explicit order is not reproducible;
#   * **cards are how relationships are read.** A funding round's investors, an
#     organization's founders, a person's jobs are all *cards*. Ask for them
#     inline with `card_ids` on a lookup when you want a handful, and use the
#     single-card tool when a card has more rows than the lookup will return --
#     only the single-card endpoint pages within a card.
#
# **Packages gate what a key can reach.** Crunchbase sells Firmographic, Core
# and Advanced Financials, Insights and Predictions separately, and every
# collection here belongs to one of them. A key without the package gets a 403,
# not an empty result, so the prediction and insight tools below say which
# package they need. `get_openapi_spec` returns the surface *this* key is
# actually entitled to.
#
# A mirror also has to poll `list_deleted_entities`: deletions never appear in
# search results, so an index built only from searches silently keeps records
# Crunchbase has removed.
#
# Docs: https://data.crunchbase.com/docs/using-the-api

connector_id: crunchbase
display_name: Crunchbase
docs_url: https://data.crunchbase.com/docs/using-the-api

tools:

  autocomplete_entities:
    title: Autocomplete entity identifiers
    description: >-
      Resolve a name fragment to Crunchbase entity identifiers. This is the
      intended first step for almost every workflow: the lookup and card tools
      take a `entity_id` (the permalink, e.g. "stripe"), and this is how you
      get one from a name a human typed.
    category: search
    read_only: true
    request:
      method: GET
      path: /v4/data/autocompletes
      query:
        query: "${query}"
        collection_ids: "${collection_ids}"
        limit: "${limit}"
    input:
      query:
        type: string
        description: The text to match, e.g. a company or person name.
      collection_ids:
        type: string
        description: Restrict to these collections, comma-separated, e.g. "organizations,people".
        optional: true
      limit:
        type: integer
        description: How many suggestions to return.
        optional: true
        default: '10'
    output:
      description: The requested record.
      type: object

  list_deleted_entities:
    title: List deleted entities
    description: >-
      Entities Crunchbase has deleted, newest first. A mirror that only ever
      adds records drifts out of date silently, so an incremental sync needs
      to poll this as well as the search endpoints -- this is the only place a
      deletion shows up.
    category: sync
    read_only: true
    request:
      method: GET
      path: /v4/data/deleted_entities
      query:
        collection_ids: "${collection_ids}"
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
        deleted_at_order: "${deleted_at_order}"
    input:
      collection_ids:
        type: string
        description: Restrict to these collections, comma-separated.
        optional: true
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '100'
      before_id:
        type: string
        description: Page backwards from this entity id.
        optional: true
      after_id:
        type: string
        description: Page forwards from this entity id.
        optional: true
      deleted_at_order:
        type: string
        description: Sort direction on the deletion timestamp.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_deleted_entities_for_collection:
    title: List one collection's deleted entities
    description: >-
      Deletions within a single collection, newest first. Cheaper than the
      org-wide feed when a mirror only tracks, say, organizations, and paged
      the same way.
    category: sync
    read_only: true
    request:
      method: GET
      path: /v4/data/deleted_entities/${collection_id}
      query:
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
        deleted_at_order: "${deleted_at_order}"
    input:
      collection_id:
        type: string
        description: The collection to read deletions for, e.g. "organizations".
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '100'
      before_id:
        type: string
        description: Page backwards from this entity id.
        optional: true
      after_id:
        type: string
        description: Page forwards from this entity id.
        optional: true
      deleted_at_order:
        type: string
        description: Sort direction on the deletion timestamp.
        optional: true
        enum: [asc, desc]
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_field_metadata:
    title: List the fields a collection has
    description: >-
      Every field Crunchbase publishes for the given collections, with its
      type and description. This is what `field_ids` and a search's predicates
      must be built from -- guessing a field name is the most common cause of
      a 400 from this API.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v4/md/applications/crunchbase/fields
      query:
        collection_ids: "${collection_ids}"
    input:
      collection_ids:
        type: string
        description: Restrict to these collections, comma-separated. Omit for all of them.
        optional: true
    output:
      description: The requested record.
      type: object

  get_openapi_spec:
    title: Get the OpenAPI specification
    description: >-
      Crunchbase's own OpenAPI document for the packages this API key is
      entitled to. The authoritative answer to which collections and fields
      the key can actually reach, which differs by package.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v4/md/applications/crunchbase/openapi.json
    output:
      description: The OpenAPI 3 document describing the entitled surface.
      type: object

  get_acquisition_prediction:
    title: Look up a acquisition prediction
    description: >-
      Fetch one acquisition prediction by its Crunchbase identifier --
      Crunchbase's modelled likelihood that a company is acquired. The
      identifier is the permalink, not a UUID; autocomplete_entities is how to
      turn a name into one. Part of Crunchbase's Predictions package -- an
      account without it gets a 403 rather than an empty result.
    category: acquisition_predictions
    read_only: true
    request:
      method: GET
      path: /v4/data/entities/acquisition_predictions/${entity_id}
      query:
        field_ids: "${field_ids}"
        card_ids: "${card_ids}"
    input:
      entity_id:
        type: string
        description: The acquisition prediction's Crunchbase permalink or UUID.
      field_ids:
        type: array
        description: Which fields to return, comma-separated. Omit for the collection's default field set; get_field_metadata lists every field a collection has.
        optional: true
        items: {type: string}
      card_ids:
        type: array
        description: Related-entity cards to embed in the same response, saving a second call. Each collection publishes its own card names.
        optional: true
        items: {type: string}
    output:
      description: The acquisition prediction record, with the fields and cards requested.
      type: object

