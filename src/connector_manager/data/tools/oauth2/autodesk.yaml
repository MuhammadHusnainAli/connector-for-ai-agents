        items: {type: string}
      filter_status:
        type: array
        description: Role statuses to include.
        optional: true
        items: {type: string}
      filter_name:
        type: string
        description: Role name to match.
        optional: true
      filter_text_match:
        type: string
        description: How text filters match.
        optional: true
        enum: [contains, startsWith, endsWith, equals]
      fields:
        type: array
        description: Fields to include in the response.
        optional: true
        items: {type: string}
      sort:
        type: array
        description: Fields to sort by.
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Records per page.
        optional: true
      offset:
        type: integer
        description: Record number to start the page at.
        optional: true
      region:
        type: string
        description: Data centre holding the account.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: A page of the user's roles.
      type: object

  get_business_units:
    title: Get the account's business units
    description: >-
      Read the business unit hierarchy of an account, which projects are
      assigned to for reporting.
    category: acc-admin
    scopes: [account:read]
    read_only: true
    request:
      method: GET
      path: /hq/v1/accounts/${account_id}/business_units_structure
      headers:
        Region: "${region}"
    input:
      account_id:
        type: string
        description: Account id.
      region:
        type: string
        description: Data centre holding the account.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The business unit structure.
      type: object

  set_business_units:
    title: Replace the account's business units
    description: >-
      Replace the whole business unit structure. Every unit you want to keep
      must be in the array, since this overwrites what is stored.
    category: acc-admin
    scopes: [account:write]
    request:
      method: PUT
