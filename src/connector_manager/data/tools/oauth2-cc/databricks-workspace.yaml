    title: Send data to the API (POST)
    description: >-
      POST to any path on Databricks (workspace level)'s API with this connection's credentials
      applied. A general-purpose escape hatch for the parts of the surface the
      named tools above do not cover; it makes no claim about which endpoints
      exist, and a POST can create real records.
    category: raw
    destructive: true
    request:
      method: POST
      base_url_override: https://${connectionConfig.databricksInstance}
      path: ${path}
      query: ${query}
      body: ${body}
    input:
      path:
        type: string
        description: Path to call, relative to the connection's base url.
        example: /api/2.0/clusters/list
      query:
        type: object
        description: Query-string parameters as a flat object.
        optional: true
      body:
        type: object
        description: JSON request body to send.
        optional: true
    output:
      description: Whatever Databricks (workspace level)'s API returns for that request, parsed as JSON where possible.
      type: object

