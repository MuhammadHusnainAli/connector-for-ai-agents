# Akkio tools -- datasets, predictive models, model training, Chat Explore (chat
# with your data) and projects.
#
# Akkio's public API comes in two generations, and both are here -- 18 tools in
# all, the whole documented surface:
#
#   * **the legacy routes** /v1/datasets and /v1/models, documented in Akkio's
#     Datasets and Models endpoint pages, take the key as an api_key parameter;
#   * **the current routes** under /api/v1 (training, Chat Explore, projects)
#     come from Akkio's own OpenAPI description at
#     https://api.akkio.com/api/v1/api.yaml and take the key in an X-API-Key
#     header. These tools set base_url_override to https://api.akkio.com.
#
# The connection sends the key both ways (X-API-Key header and api_key query
# parameter), so every tool authenticates without taking the key as an
# argument. The API is in beta.
#
# Training and Chat Explore are asynchronous: submit, poll the status tool
# until status is SUCCEEDED (or FAILED), then read the result. Adding rows to
# a new dataset for the first time fixes that dataset's schema.
#
# Not covered: /api/v1/api.yaml and /api/v1/docs, which serve the specification
# itself.
#
# Docs: https://docs.akkio.com/akkio-docs/rest-api/api-introduction

connector_id: akkio
display_name: Akkio
docs_url: https://docs.akkio.com/akkio-docs/rest-api/api-introduction
tools:

  list_models:
    title: List models
    description: >-
      List every trained model in the organization with its id and name.
    category: models
    read_only: true
    request:
      method: GET
      path: /models
    input: {}
    output:
      description: status and models [{id, name}].
      type: object

  make_prediction:
    title: Make predictions
    description: >-
      Run rows through a trained model and get a prediction for each, with class probabilities
      for classification models.
    category: models
    read_only: true
    request:
      method: POST
      path: /models
      body:
        id: ${id}
        data: ${data}
    input:
      id:
        type: string
        description: Id of the trained model to predict with.
      data:
        type: array
        description: 'Rows to predict, each an object of field name to value, e.g. [{"Age":
          58}].'
        items:
          type: object
    output:
      description: status and predictions, one per row.
      type: object

  delete_model:
    title: Delete a model
    description: >-
      Delete a trained model permanently; anything calling it stops working.
    category: models
    destructive: true
    request:
      method: DELETE
      path: /models
      query:
        id: ${id}
    input:
      id:
        type: string
        description: Id of the model to delete.
    output:
      description: status.
      type: object

  list_datasets:
    title: List datasets
    description: >-
      List every dataset in the organization with its id and name.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /datasets
    input: {}
    output:
      description: status and datasets [{id, name}].
      type: object

  get_dataset:
    title: Get a dataset
    description: >-
      Read one dataset's name, row count and fields with their types.
    category: datasets
    read_only: true
    request:
      method: GET
      path: /datasets
      query:
        id: ${id}
    input:
      id:
        type: string
        description: Dataset id.
    output:
      description: status, name, rows and fields.
      type: object

  create_dataset:
    title: Create a dataset
    description: >-
      Create an empty dataset; fill it with add_rows_to_dataset.
    category: datasets
    request:
      method: POST
      path: /datasets
      body:
        name: ${name}
    input:
      name:
        type: string
        description: Name for the new, empty dataset.
    output:
      description: status, dataset_id and dataset_name.
      type: object

  add_rows_to_dataset:
    title: Add rows to a dataset
    description: >-
      Append rows to a dataset. The first rows ever added define its schema, so send consistent
      field names and types.
    category: datasets
    request:
      method: POST
      path: /datasets
      body:
        id: ${id}
        rows: ${rows}
    input:
      id:
        type: string
        description: Id of the dataset to append to.
      rows:
        type: array
        description: Rows to add, each an object of field name to value. The first rows ever
          added define the dataset's schema.
        items:
          type: object
    output:
      description: status.
      type: object

  delete_dataset:
    title: Delete a dataset
    description: >-
      Delete a dataset permanently, along with its rows.
    category: datasets
    destructive: true
    request:
      method: DELETE
      path: /datasets
      query:
        id: ${id}
    input:
      id:
        type: string
        description: Id of the dataset to delete.
    output:
      description: status.
      type: object

  train_model:
    title: Train a model
    description: >-
      Start training a model on a dataset to predict one or more fields. Returns a task id;
      poll get_training_status, then read get_training_result.
    category: training
    request:
      method: POST
      path: /api/v1/models/train/new
      body:
        dataset_id: ${dataset_id}
        predict_fields: ${predict_fields}
        duration: ${duration}
        ignore_fields: ${ignore_fields}
        extra_attention: ${extra_attention}
        force: ${force}
      base_url_override: https://api.akkio.com
    input:
      dataset_id:
        type: string
        description: Dataset to train on.
      predict_fields:
        type: array
        description: Field names to predict, case sensitive.
        items:
          type: string
      duration:
        type: integer
        description: 'Training effort: 10 (fastest), 60 (high quality), 300 (higher quality)
          or 1800 (production).'
      ignore_fields:
        type: array
        description: Field names to leave out of training, case sensitive.
        optional: true
        items:
          type: string
      extra_attention:
        type: boolean
        description: True to help the model predict rare cases.
        optional: true
      force:
        type: boolean
        description: True to train a new model even if one already exists for this dataset.
        optional: true
    output:
      description: task_id.
      type: object

  get_training_status:
    title: Get training status
    description: >-
      Check a training task: PENDING, IN_PROGRESS (with an estimate), SUCCEEDED or FAILED.
    category: training
    read_only: true
    request:
      method: GET
      path: /api/v1/models/train/${task_id}/status
      base_url_override: https://api.akkio.com
    input:
      task_id:
        type: string
        description: Task id returned when the task was submitted.
    output:
      description: status and metadata.
      type: object

  get_training_result:
    title: Get training result
    description: >-
      Read a finished training task's result: the model id, field importance and accuracy
      statistics.
    category: training
    read_only: true
    request:
      method: GET
      path: /api/v1/models/train/${task_id}/result
      base_url_override: https://api.akkio.com
    input:
      task_id:
        type: string
        description: Task id returned when the task was submitted.
    output:
      description: The trained model's details.
      type: object

  ask_chat_explore:
    title: Ask Chat Explore
    description: >-
      Ask a natural-language question about a project's or dataset's data. Returns a task
      id; poll get_chat_explore_status, then read the answer with get_chat. Use project_id
      to apply the project's custom instructions.
    category: chat_explore
    read_only: true
    request:
      method: POST
      path: /api/v1/chat-explore/new
      body:
        messages: ${messages}
        project_id: ${project_id}
        dataset_id: ${dataset_id}
        chatContext: ${chat_context}
        chatInstructions: ${chat_instructions}
      base_url_override: https://api.akkio.com
    input:
      messages:
        type: array
        description: 'The conversation so far, each {role: user or assistant, content}; the
          last message is the question.'
        items:
          type: object
      project_id:
        type: string
        description: Project to ask about; its custom instructions apply. Give this or dataset_id.
        optional: true
      dataset_id:
        type: string
        description: Dataset to ask about, when not using a project.
        optional: true
      chat_context:
        type: string
        description: What Chat Explore should know about the data for this call, e.g. units
          of a column.
        optional: true
      chat_instructions:
        type: string
        description: How Chat Explore should answer for this call, e.g. respond in Spanish.
        optional: true
    output:
      description: task_id.
      type: object

  get_chat_explore_status:
    title: Get Chat Explore status
    description: >-
      Check a Chat Explore task: PENDING, IN_PROGRESS, SUCCEEDED (with the location of the
      chat) or FAILED.
    category: chat_explore
    read_only: true
    request:
      method: GET
      path: /api/v1/chat-explore/status/${task_id}
      base_url_override: https://api.akkio.com
    input:
      task_id:
        type: string
        description: Task id returned when the task was submitted.
    output:
      description: status and metadata.
      type: object

  get_chat:
    title: Get a chat
    description: >-
      Read a Chat Explore conversation: each message's text, any charts (base64 PNG or Plotly
      JSON) and tables as lists of rows.
    category: chat_explore
    read_only: true
    request:
      method: GET
      path: /api/v1/chat-explore/chats/${id}
      query:
        image_format: ${image_format}
      base_url_override: https://api.akkio.com
    input:
      image_format:
        type: string
        description: 'How charts come back: base64_png or plotly_json.'
        optional: true
        enum:
        - base64_png
        - plotly_json
      id:
        type: string
        description: Chat id, from the Chat Explore task's result location.
    output:
      description: The chat with its messages.
      type: object

  create_project:
    title: Create a project
    description: >-
      Create a project with Chat Explore custom instructions: context about the data, how
      to answer, and suggested questions.
    category: projects
    request:
      method: POST
      path: /api/v1/projects
      body:
        name: ${name}
        _org: ${org}
        _owner: ${owner}
        chatContext: ${chat_context}
        chatInstructions: ${chat_instructions}
        chatSuggestions: ${chat_suggestions}
      base_url_override: https://api.akkio.com
    input:
      name:
        type: string
        description: Project name.
      org:
        type: string
        description: Id of the organization that owns the project.
      owner:
        type: string
        description: Id of the user who owns the project.
      chat_context:
        type: string
        description: What Chat Explore should know about this project's data.
        optional: true
      chat_instructions:
        type: string
        description: How Chat Explore should respond in this project.
        optional: true
      chat_suggestions:
        type: string
        description: Suggested questions, one per line.
        optional: true
    output:
      description: The created project.
      type: object

  get_project:
    title: Get a project
    description: >-
      Read a project's name and Chat Explore custom instructions.
    category: projects
    read_only: true
    request:
      method: GET
      path: /api/v1/projects/${project_id}
      base_url_override: https://api.akkio.com
    input:
      project_id:
        type: string
        description: Project id.
    output:
      description: The project.
      type: object

  update_project:
    title: Update a project
    description: >-
      Change a project's name or Chat Explore custom instructions; only the fields sent change.
    category: projects
    request:
      method: PUT
      path: /api/v1/projects/${project_id}
      body:
        name: ${name}
        chatContext: ${chat_context}
        chatInstructions: ${chat_instructions}
        chatSuggestions: ${chat_suggestions}
      base_url_override: https://api.akkio.com
    input:
      project_id:
        type: string
        description: Project id.
      name:
        type: string
        description: New project name.
        optional: true
      chat_context:
        type: string
        description: What Chat Explore should know about this project's data.
        optional: true
      chat_instructions:
        type: string
        description: How Chat Explore should respond in this project.
        optional: true
      chat_suggestions:
        type: string
        description: Suggested questions, one per line.
        optional: true
    output:
      description: The updated project.
      type: object

  delete_project:
    title: Delete a project
    description: >-
      Delete a project and its chat settings permanently.
    category: projects
    destructive: true
    request:
      method: DELETE
      path: /api/v1/projects/${project_id}
      base_url_override: https://api.akkio.com
    input:
      project_id:
        type: string
        description: Project id.
    output:
      description: Confirmation.
      type: object
