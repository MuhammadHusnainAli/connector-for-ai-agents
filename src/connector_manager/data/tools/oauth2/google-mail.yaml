  create_smime_info:
    title: Create smime info
    description: Insert (upload) the given S/MIME config for the specified send-as alias. Note that pkcs12
      format is required for the key. For more information, see Manage S/MIME certificates with the Gmail
      API.
    category: users
    request:
      method: POST
      path: /gmail/v1/users/${user_id}/settings/sendAs/${send_as_email}/smimeInfo
      body:
        isDefault: ${is_default}
        pem: ${pem}
        issuerCn: ${issuer_cn}
        encryptedKeyPassword: ${encrypted_key_password}
        expiration: ${expiration}
        pkcs12: ${pkcs12}
    input:
      send_as_email:
        type: string
        description: The email address that appears in the "From:" header for mail sent using this alias.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      is_default:
        type: boolean
        description: Whether this SmimeInfo is the default one for this user's send-as address.
        optional: true
      pem:
        type: string
        description: PEM formatted X509 concatenated certificate string (standard base64 encoding). Format
          used for returning key, which includes public key as well as certificate chain (not private
          key).
        optional: true
      issuer_cn:
        type: string
        description: The S/MIME certificate issuer's common name.
        optional: true
      encrypted_key_password:
        type: string
        description: Encrypted key password, when key is encrypted.
        optional: true
      expiration:
        type: string
        description: When the certificate expires (in milliseconds since epoch).
        optional: true
      pkcs12:
        type: string
        description: PKCS#12 format containing a single private/public key pair and certificate chain.
          This format is only accepted from client for creating a new SmimeInfo and is never returned,
          because the private key is not intended to be exported. PKCS#12 may be encrypted, in which case
          encryptedKeyPassword should b
        optional: true
    output:
      description: The SmimeInfo resource.
      type: object
    scopes_any:
    - gmail.settings.basic
    - gmail.settings.sharing
  list_smime_info:
    title: List smime info
