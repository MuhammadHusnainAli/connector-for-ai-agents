  list_paired_devices:
    title: List paired devices
    description: Returns the user's list of paired 1P trackers and smartwatches.
    category: users
    request:
      method: GET
      path: /v4/${parent}/pairedDevices
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. The parent, which owns this collection of devices. Format: users/{user}'
      page_size:
        type: integer
        description: Optional. The maximum number of devices to return. The service may return fewer than
          this value. If unspecified, at most 5 devices will be returned. The maximum value is 100. values
          above 100 will be coerced to 100.
        optional: true
      page_token:
        type: string
        description: Optional. A page token, received from a previous ListPairedDevices call. Provide
          this to retrieve the subsequent page. When paginating, all other parameters provided to ListPairedDevices
          must match the call that provided the page token.
        optional: true
    output:
      description: The ListPairedDevicesResponse resource.
      type: object
