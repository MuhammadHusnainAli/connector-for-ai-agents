  list_downtimes:
    title: Get all downtimes
    description: >-
      Get all downtimes. Datadog's reference documents the exact parameters
      and payload this call takes.
    category: downtimes
    read_only: true
    request:
      method: GET
      path: /v2/downtime
      query:
        current_only: "${current_only}"
        include: "${include}"
        page[limit]: "${page_limit_}"
    input:
      current_only:
        type: boolean
        description: Only return downtimes that are active when the request is made.
        optional: true
      include:
        type: string
        description: Comma-separated list of resource paths for related resources to include in the response. Supported resource paths are `created_by` and `monitor`.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of downtimes in the response.
        optional: true
        default: '30'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_downtime:
    title: Get a downtime
    description: >-
      Get a downtime. Datadog's reference documents the exact parameters and
      payload this call takes.
    category: downtimes
    read_only: true
    request:
      method: GET
      path: /v2/downtime/${downtime_id}
      query:
        include: "${include}"
    input:
      downtime_id:
        type: string
        description: The downtime id, from list_downtimes.
      include:
        type: string
        description: Comma-separated list of resource paths for related resources to include in the response. Supported resource paths are `created_by` and `monitor`.
        optional: true
    output:
      description: The requested record.
      type: object

  create_downtime:
    title: Schedule a downtime
    description: >-
      Schedule a downtime, muting matching monitors for a window. This is how
      a deploy or a maintenance window avoids paging on-call -- and how alerts
      get missed if the scope is wider than intended.
    category: downtimes
    request:
      method: POST
      path: /v2/downtime
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  update_downtime:
    title: Update a downtime
    description: >-
      Update a downtime. Datadog's reference documents the exact parameters
      and payload this call takes.
    category: downtimes
    request:
      method: PATCH
      path: /v2/downtime/${downtime_id}
      body: "${attributes}"
    input:
      downtime_id:
        type: string
        description: The downtime id, from list_downtimes.
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  cancel_downtime:
    title: Cancel a downtime
    description: >-
      Cancel a downtime, so the monitors it was muting can alert again
      immediately. Worth doing as soon as maintenance ends rather than waiting
      for the window to expire.
    category: downtimes
    destructive: true
    request:
      method: DELETE
      path: /v2/downtime/${downtime_id}
    input:
      downtime_id:
        type: string
        description: The downtime id, from list_downtimes.
    output:
      description: Confirmation that the record was deleted.
      type: object

  cancel_downtimes_by_scope:
    title: Cancel downtimes by scope
    description: >-
      Cancel every downtime matching a scope in one call. A bulk unmute -- it
      can re-arm far more monitors than intended if the scope is broad.
    category: downtimes
    request:
      method: POST
      path: /v1/downtime/cancel/by_scope
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  list_monitor_downtimes:
    title: Get active downtimes for a monitor
    description: >-
      Get all active downtimes for the specified monitor. Datadog's reference
      documents the exact parameters and payload this call takes.
    category: downtimes
    read_only: true
    request:
      method: GET
      path: /v2/monitor/${monitor_id}/downtime_matches
      query:
        page[limit]: "${page_limit_}"
    input:
      monitor_id:
        type: integer
        description: The monitor id, from list_monitors.
      page_limit_:
        type: integer
        description: Maximum number of downtimes in the response.
        optional: true
        default: '30'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_logs:
    title: Search logs (POST)
    description: >-
      Search logs with a POST body, which is the form that supports the full
      filter, sort and paging options. Use this rather than the GET variant
      for anything beyond a simple query; page with the `cursor` from
      `meta.page.after`.
    category: logs
    request:
      method: POST
      path: /v2/logs/events/search
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  list_logs:
    title: Search logs (GET)
    description: >-
      Search logs with query parameters rather than a body. Convenient for a
      simple filter; the POST variant handles complex queries and pages more
      reliably.
    category: logs
    read_only: true
    request:
      method: GET
      path: /v2/logs/events
      query:
        filter[query]: "${filter_query_}"
        filter[indexes]: "${filter_indexes_}"
        filter[from]: "${filter_from_}"
        filter[to]: "${filter_to_}"
        filter[storage_tier]: "${filter_storage_tier_}"
        sort: "${sort}"
        page[cursor]: "${page_cursor_}"
        page[limit]: "${page_limit_}"
    input:
      filter_query_:
        type: string
        description: Search query following logs syntax.
        optional: true
      filter_indexes_:
        type: array
        description: For customers with multiple indexes, the indexes to search. Defaults to '*' which means all indexes
        optional: true
        items: {type: string}
      filter_from_:
        type: string
        description: Minimum timestamp for requested logs.
        optional: true
      filter_to_:
        type: string
        description: Maximum timestamp for requested logs.
        optional: true
      filter_storage_tier_:
        type: string
        description: Specifies the storage type to be used
        optional: true
      sort:
        type: string
        description: Order of logs in results.
        optional: true
      page_cursor_:
        type: string
        description: List following results with a cursor provided in the previous query.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of logs in the response.
        optional: true
        default: '10'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  aggregate_logs:
    title: Aggregate events
    description: >-
      Aggregate logs into counts, buckets and computed values instead of
      returning individual events. What a log-based dashboard widget is built
      from, and far cheaper than paging every matching log to count them.
    category: logs
    request:
      method: POST
      path: /v2/logs/analytics/aggregate
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  submit_logs:
    title: Send logs
    description: >-
      Send logs to Datadog. Note this is the intake API rather than a query --
      and it accepts only the API key, so it works even where the application
      key is missing.
    category: logs
    request:
      method: POST
      path: /v2/logs
      query:
        ddtags: "${ddtags}"
      body: "${attributes}"
    input:
      ddtags:
        type: string
        description: Log tags can be passed as query parameters with `text/plain` content type.
        optional: true
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  list_log_indexes:
    title: Get all indexes
    description: >-
      The Index object describes the configuration of a log index. This
      endpoint returns an array of the `LogIndex` objects of your
      organization.
    category: logs-config
    read_only: true
    request:
      method: GET
      path: /v1/logs/config/indexes
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_log_index:
    title: Get an index
    description: >-
      Get one log index from your organization. This endpoint takes no JSON
      arguments.
    category: logs-config
    read_only: true
    request:
      method: GET
      path: /v1/logs/config/indexes/${name}
    input:
      name:
        type: string
        description: The log index name, from list_log_indexes.
    output:
      description: The requested record.
      type: object

  create_log_index:
    title: Create an index
    description: >-
      Create a log index with its retention and daily quota. Indexes are what
      logs are billed on: a filter that matches more than intended raises the
      bill, and a daily quota that is too low silently drops logs once it is
      hit.
    category: logs-config
    request:
      method: POST
      path: /v1/logs/config/indexes
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  update_log_index:
    title: Update an index
    description: >-
      Update an index as identified by its name. Returns the Index object
      passed in the request body when the request is successful. Using the
      `PUT` method updates your index's configuration by **replacing** your
      current configuration with the new one sent to your Datadog
      organization.
    category: logs-config
    request:
      method: PUT
      path: /v1/logs/config/indexes/${name}
      body: "${attributes}"
    input:
      name:
        type: string
        description: The log index name, from list_log_indexes.
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  delete_log_index:
    title: Delete an index
    description: >-
      Delete an existing index from your organization. Index deletions are
      permanent and cannot be reverted. You cannot recreate an index with the
      same name as deleted ones.
    category: logs-config
    destructive: true
    request:
      method: DELETE
      path: /v1/logs/config/indexes/${name}
    input:
      name:
        type: string
        description: The log index name, from list_log_indexes.
    output:
      description: Confirmation that the record was deleted.
      type: object

  get_log_index_order:
    title: Get indexes order
    description: >-
      Get the current order of your log indexes. This endpoint takes no JSON
      arguments.
    category: logs-config
    read_only: true
    request:
      method: GET
      path: /v1/logs/config/index-order
    output:
      description: The requested record.
      type: object

  update_log_index_order:
    title: Update indexes order
    description: >-
      Reorder the log indexes. Order matters: a log goes into the first index
      whose filter it matches, so reordering silently changes which index --
      and which retention and quota -- a log lands in.
    category: logs-config
    request:
      method: PUT
      path: /v1/logs/config/index-order
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  list_log_pipelines:
    title: Get all pipelines
    description: >-
      Get all pipelines from your organization. This endpoint takes no JSON
      arguments.
    category: logs-config
    read_only: true
    request:
      method: GET
      path: /v1/logs/config/pipelines
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_log_pipeline:
    title: Get a pipeline
    description: >-
      Get a specific pipeline from your organization. This endpoint takes no
      JSON arguments.
    category: logs-config
    read_only: true
    request:
      method: GET
      path: /v1/logs/config/pipelines/${pipeline_id}
    input:
      pipeline_id:
        type: string
        description: The log pipeline id, from list_log_pipelines.
    output:
