# Anrok tools -- sales tax and VAT for software sellers.
#
# Anrok's API is unusual in three ways that shape every tool below, and getting
# them wrong is the difference between a filed return and a silent no-op:
#
#   * **everything is a POST.** There are no GETs. `transactionsGet` and every
#     `list` are POSTs with a JSON body, so the read-only tools here are POSTs
#     that happen not to change anything -- that is the provider's design, not
#     a mistake in this pack;
#   * **ids live in the path with a type prefix.** A transaction is addressed
#     as `/transactions/id:{transactionId}/get`, a product as
#     `/products/externalId:{externalId}/get`. The `id:` and `externalId:`
#     literals are part of the URL;
#   * **amounts are integers in the currency's smallest unit.** $10.00 is
#     `1000`. Quantities, by contrast, are decimal *strings* ("0.5"), and so
#     are the tax amounts Anrok returns.
#
# The other thing to know is the split between saved and ephemeral tax
# calculation:
#
#   * `create_or_update_transaction` calculates tax **and records the sale**.
#     Recorded transactions are what Anrok files returns from and what it
#     watches for economic-nexus thresholds. Use it for real invoices;
#   * `calculate_ephemeral_transaction` calculates the same tax and records
#     nothing -- for quotes, carts and previews. Never use it for a sale that
#     actually happened, or the tax will go unfiled.
#
# Corrections are append-only: `void_transaction` and `create_negation` both
# take the transaction's expected `version` and fail if it has moved, which is
# Anrok's optimistic-concurrency guard against two systems correcting the same
# invoice at once.
#
# Filings and transaction listing are premium features on the Anrok side --
# they answer 4xx on accounts that have not enabled them.
#
# Docs: https://apidocs.anrok.com/

connector_id: anrok
display_name: Anrok
docs_url: https://apidocs.anrok.com/

tools:

  # -- transactions ---------------------------------------------------------

  create_or_update_transaction:
    title: Calculate tax and record a transaction
    description: >-
      Calculate sales tax for an invoice and save it in Anrok under an id you
      choose. Saved transactions are what Anrok files returns from and what it
      counts toward economic-nexus thresholds, so this -- not the ephemeral
      call -- is what a real sale needs. Re-posting the same `id` updates that
      transaction rather than creating a second one. Amounts are integers in
      the currency's smallest unit.
    category: transactions
    request:
      method: POST
      path: /v1/seller/transactions/createOrUpdate
      body:
        id: "${id}"
        lineItems: "${line_items}"
        currencyCode: "${currency_code}"
        customerAddress: "${customer_address}"
        customerId: "${customer_id}"
        customerName: "${customer_name}"
        customerEmailAddress: "${customer_email_address}"
        customerTaxIds: "${customer_tax_ids}"
        shipFromAddress: "${ship_from_address}"
        accountingDate: "${accounting_date}"
        accountingTime: "${accounting_time}"
        accountingTimeZone: "${accounting_time_zone}"
        taxDate: "${tax_date}"
        userFriendlyId: "${user_friendly_id}"
        taxAmountAdded: "${tax_amount_added}"
    input:
      id:
        type: string
        description: Your id for the transaction, unique across the whole seller account -- typically the billing system's invoice id.
        example: "invoice_1234"
      line_items:
        type: array
        description: The invoice's line items. Each needs `productExternalId` and `amount`; `quantity` is a decimal string and `isTaxIncludedInAmount` says whether the amount is tax-inclusive.
        items:
          type: object
          properties:
            id: {type: string}
            productExternalId: {type: string}
            amount: {type: integer, description: "Sale price in the smallest unit of the currency."}
            isTaxIncludedInAmount: {type: boolean}
            quantity: {type: string}
      currency_code:
        type: string
        description: Three-letter ISO currency code, case insensitive.
        example: USD
      customer_address:
        type: object
        description: 'Where the product is delivered or used -- this determines the taxing jurisdictions. Fields: country, line1, city, region, postalCode.'
        properties:
          country: {type: string}
          line1: {type: string}
          city: {type: string}
          region: {type: string}
          postalCode: {type: string}
      customer_id:
        type: string
        description: The Anrok customer id, used to link a customer's transactions and to find their exemption certificates.
        optional: true
        example: "stripe:cus_K39sWBu92Lo"
      customer_name:
        type: string
        description: The customer's name, for display only.
        optional: true
      customer_email_address:
        type: string
        description: The customer's email address, for display only.
        optional: true
      customer_tax_ids:
        type: array
        description: VAT or other tax registration numbers for the customer, each {type, value}.
        optional: true
        items:
          type: object
          properties:
            type: {type: string, description: "genericVatNumber or euVrn."}
            value: {type: string}
      ship_from_address:
        type: object
        description: Where the product ships from, for the jurisdictions that source tax to the origin.
        optional: true
      accounting_date:
        type: string
        description: The date the sale occurred for accounting purposes, YYYY-MM-DD. Determines which filing period the transaction lands in.
        optional: true
        format: date
      accounting_time:
        type: string
        description: The instant the sale occurred, ISO 8601. Used with accountingTimeZone when accountingDate is omitted.
        optional: true
        format: date-time
      accounting_time_zone:
        type: string
        description: A tz database name used to derive the accounting date from accountingTime, e.g. "America/New_York".
        optional: true
      tax_date:
        type: string
        description: The date to compute rates as of. Defaults to the accounting date.
        optional: true
        format: date
      user_friendly_id:
        type: string
        description: A human-readable id, typically the invoice number shown to the customer.
        optional: true
      tax_amount_added:
        type: integer
        description: Tax already present on the invoice, in the smallest unit of the currency.
        optional: true
    output:
      description: The saved transaction with per-line and per-jurisdiction tax.
      type: object
      properties:
        version: {type: integer, description: "Pass this back as the expected version when voiding or negating."}
        lineItems: {type: array}
        taxAmountToCollect: {type: string}

  calculate_ephemeral_transaction:
    title: Calculate tax without recording it
    description: >-
      Calculate sales tax for a would-be invoice without saving anything. For
      quotes, carts, checkout previews and what-if pricing. Because nothing is
      recorded, the result is not filed and does not count toward nexus
      thresholds -- use create_or_update_transaction for a sale that actually
      happened.
    category: transactions
    read_only: true
    request:
      method: POST
      path: /v1/seller/transactions/createEphemeral
      body:
        lineItems: "${line_items}"
        currencyCode: "${currency_code}"
        customerAddress: "${customer_address}"
        customerId: "${customer_id}"
        customerName: "${customer_name}"
        customerEmailAddress: "${customer_email_address}"
        customerTaxIds: "${customer_tax_ids}"
        shipFromAddress: "${ship_from_address}"
        accountingDate: "${accounting_date}"
        taxDate: "${tax_date}"
        taxAmountAdded: "${tax_amount_added}"
    input:
      line_items:
        type: array
        description: The line items to price. Each needs `productExternalId` and `amount` in the currency's smallest unit.
        items:
          type: object
          properties:
            id: {type: string}
            productExternalId: {type: string}
            amount: {type: integer}
            isTaxIncludedInAmount: {type: boolean}
            quantity: {type: string}
      currency_code:
        type: string
        description: Three-letter ISO currency code, case insensitive.
        example: USD
      customer_address:
        type: object
        description: Where the product would be delivered or used -- this determines the taxing jurisdictions.
        properties:
          country: {type: string}
          line1: {type: string}
          city: {type: string}
          region: {type: string}
          postalCode: {type: string}
      customer_id:
        type: string
        description: The Anrok customer id, so any exemption certificate on file is applied to the quote.
        optional: true
      customer_name:
        type: string
        description: The customer's name, for display only.
        optional: true
      customer_email_address:
        type: string
        description: The customer's email address, for display only.
        optional: true
      customer_tax_ids:
        type: array
        description: VAT or other tax registration numbers for the customer, each {type, value}.
        optional: true
        items:
          type: object
          properties:
            type: {type: string}
            value: {type: string}
      ship_from_address:
        type: object
        description: Where the product would ship from, for origin-sourced jurisdictions.
        optional: true
      accounting_date:
        type: string
        description: The date to treat the sale as occurring on, YYYY-MM-DD.
        optional: true
        format: date
      tax_date:
        type: string
        description: The date to compute rates as of. Defaults to the accounting date.
        optional: true
        format: date
      tax_amount_added:
        type: integer
        description: Tax already present on the invoice, in the smallest unit of the currency.
        optional: true
    output:
      description: The computed tax for the hypothetical invoice. Nothing is stored.
      type: object
      properties:
        lineItems: {type: array}
        taxAmountToCollect: {type: string}

  get_transaction:
    title: Get a transaction
    description: >-
      Fetch the latest version of one saved transaction by its id. The response
      carries a `version` field -- pass it as the expected version when voiding
      or negating so a concurrent edit cannot be clobbered. A voided
      transaction comes back without its body.
    category: transactions
    read_only: true
    request:
      method: POST
      path: /v1/seller/transactions/id:${transaction_id}/get
    input:
      transaction_id:
        type: string
        description: The transaction id you assigned when creating it.
    output:
      description: The transaction and its current version.
      type: object
      properties:
        version: {type: integer}
        body: {type: object}

  list_transactions:
    title: List transactions
    description: >-
      Page through saved transactions, filtered either by when Anrok last
      modified them (for incremental sync) or by the filing they belong to.
      Cursor-paginated. This endpoint is a premium Anrok feature and answers an
      error on accounts that do not have it enabled.
    category: transactions
    read_only: true
    request:
      method: POST
      path: /v1/seller/transactions/list
      body:
        filter: "${filter}"
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      filter:
        type: object
        description: '{"type": "lastModifiedAfter", "value": "<ISO 8601 UTC>"} for incremental sync, or {"type": "filingInfo", "value": {...}} to list a filing''s transactions.'
        optional: true
      limit:
        type: integer
        description: How many transactions to return (1-20).
        optional: true
        default: 10
        minimum: 1
        maximum: 20
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
    output:
      description: A page of transactions.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  void_transaction:
    title: Void a transaction
    description: >-
      Mark a saved transaction void so it drops out of returns and sales
      totals. Pass the version you last read: the void fails if the
      transaction has changed since, which is what stops two systems from
      correcting the same invoice at once. This does not delete the record.
    category: transactions
    destructive: true
    request:
      method: POST
      path: /v1/seller/transactions/id:${transaction_id}/void
      body:
        transactionExpectedVersion: "${transaction_expected_version}"
    input:
      transaction_id:
        type: string
        description: The id of the transaction to void.
      transaction_expected_version:
        type: integer
        description: The version you last read from get_transaction. The void fails if this is not the latest.
        optional: true
    output:
      description: Confirmation that the transaction is now void.
      type: object

  create_negation:
    title: Negate a transaction
    description: >-
      Create a new transaction that is the exact inverse of an existing one --
      sale prices and tax amounts sum to zero. This is the audit-friendly way
      to reverse a filed sale, since both records survive, as opposed to
      voiding, which removes the original from returns.
    category: transactions
    request:
      method: POST
      path: /v1/seller/transactions/createNegation
      body:
        originalTransactionId: "${original_transaction_id}"
        newTransactionId: "${new_transaction_id}"
        originalTransactionExpectedVersion: "${original_transaction_expected_version}"
    input:
      original_transaction_id:
        type: string
        description: The id of the transaction being negated.
      new_transaction_id:
        type: string
        description: The id to give the new negating transaction. Must be unused.
      original_transaction_expected_version:
        type: integer
        description: The original's version as you last read it. The negation fails if it is not the latest.
        optional: true
    output:
      description: The new negating transaction.
      type: object

  # -- customers ------------------------------------------------------------

  create_customer:
    title: Create a customer
    description: >-
      Create a customer under an id you choose. That id is what links a
      customer's transactions together and what exemption certificates hang
      off, so it should match the customer id your billing system already uses
      -- typically with a prefix to keep sources apart, e.g. "stripe:cus_...".
    category: customers
    request:
      method: POST
      path: /v1/seller/customers/create
      body:
        id: "${id}"
        name: "${name}"
        emailAddress: "${email_address}"
    input:
      id:
        type: string
        description: Your unique id for this customer, matching what your billing system sends on transactions.
        example: "stripe:cus_K39sWBu92Lo"
      name:
        type: string
        description: The customer's name, for display only.
      email_address:
        type: string
        description: The customer's email address.
        optional: true
        format: email
    output:
      description: The created customer.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  get_customer:
    title: Get a customer
    description: >-
      Fetch one customer by the id you assigned. Useful for checking a customer
      exists before referencing them on a transaction or certificate.
    category: customers
    read_only: true
    request:
      method: POST
      path: /v1/seller/customers/id:${customer_id}/get
    input:
      customer_id:
        type: string
        description: The customer id you assigned.
    output:
      description: The customer record.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        emailAddress: {type: string}

  list_customers:
    title: List customers
    description: >-
      Page through the customers on the seller account in ascending id order.
      Cursor-paginated -- pass the previous page's `nextCursor` to continue.
    category: customers
    read_only: true
    request:
      method: POST
      path: /v1/seller/customers/list
      body:
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      limit:
        type: integer
        description: How many customers to return (1-100).
        optional: true
        default: 25
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
    output:
      description: A page of customers.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  # -- exemption certificates ----------------------------------------------

  create_certificate:
    title: Upload an exemption certificate
    description: >-
      Record a customer's tax exemption certificate, with the scanned file
      inline as base64 and the US jurisdictions it covers. Once active, Anrok
      applies the exemption automatically to that customer's transactions in
      those jurisdictions -- there is no per-transaction flag to set.
    category: certificates
    request:
      method: POST
      path: /v1/seller/certificates/create
      body:
        customerId: "${customer_id}"
        customerName: "${customer_name}"
        effectiveDateBegin: "${effective_date_begin}"
        exemptionNumber: "${exemption_number}"
        notes: "${notes}"
        type: "${type}"
        certificateFile: "${certificate_file}"
        jurises: "${jurises}"
    input:
      customer_id:
        type: string
        description: The Anrok customer id the certificate belongs to.
      effective_date_begin:
        type: string
        description: The date the certificate takes effect, YYYY-MM-DD.
        format: date
      certificate_file:
        type: object
        description: 'The certificate image as {"name": "cert.pdf", "contentsBase64": "<base64>"}.'
        properties:
          name: {type: string}
          contentsBase64: {type: string}
      jurises:
        type: array
        description: The US jurisdictions the exemption applies in, each {jurisId, registrationId?, effectiveDateEndi?, notes?}. jurisId looks like "us-MA".
        items:
          type: object
          properties:
            jurisId: {type: string}
            registrationId: {type: string}
            effectiveDateEndi: {type: string}
            notes: {type: string}
      customer_name:
        type: string
        description: The customer's name, for display only. Creates the customer if the id is new.
        optional: true
      exemption_number:
        type: string
        description: The certificate's exemption number, for display only.
        optional: true
      notes:
        type: string
        description: Internal notes on the certificate.
        optional: true
      type:
        type: string
        description: The kind of exemption the certificate represents, e.g. agricultural or resale. Omit to record none.
        optional: true
    output:
      description: The created certificate.
      type: object
      properties:
        id: {type: string}

  get_certificate:
    title: Get an exemption certificate
    description: >-
      Fetch one exemption certificate by the id Anrok assigned it, including
      its status, covered jurisdictions and effective dates.
    category: certificates
    read_only: true
    request:
      method: POST
      path: /v1/seller/certificates/id:${certificate_id}/get
    input:
      certificate_id:
        type: string
        description: The Anrok-assigned certificate id.
    output:
      description: The certificate record.
      type: object

  list_certificates:
    title: List exemption certificates
    description: >-
      Page through exemption certificates, optionally narrowed to one customer
      or one status (active, expiringSoon, expired, archived). `filter` and
      `cursor` are mutually exclusive -- filter the first page, then page with
      the cursor alone.
    category: certificates
    read_only: true
    request:
      method: POST
      path: /v1/seller/certificates/list
      body:
        filter: "${filter}"
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      filter:
        type: object
        description: '{"customerId": "...", "status": "active"} -- cannot be sent together with cursor.'
        optional: true
        properties:
          customerId: {type: string}
          status: {type: string}
      limit:
        type: integer
        description: How many certificates to return (1-100).
        optional: true
        default: 25
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: The `nextCursor` from the previous page. Cannot be sent together with filter.
        optional: true
    output:
      description: A page of certificates.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  archive_certificate:
    title: Archive an exemption certificate
    description: >-
      Invalidate a certificate so Anrok stops applying its exemption to the
      customer's future transactions. Already-filed transactions are unaffected;
      this is not a way to correct past returns.
    category: certificates
    destructive: true
    request:
      method: POST
      path: /v1/seller/certificates/id:${certificate_id}/archive
    input:
      certificate_id:
        type: string
        description: The Anrok-assigned certificate id to archive.
    output:
      description: Confirmation that the certificate is archived.
      type: object

  create_certificate_request:
    title: Ask a customer for a certificate
    description: >-
      Create a certificate request and, by default, email it to the customer
      contact so they can upload their own certificate through the returned
      `requestLink`. Set `send_email` false to create the link without mailing
      it. A premium Anrok feature.
    category: certificates
    request:
      method: POST
      path: /v1/seller/certificateRequests/create
      body:
        customerId: "${customer_id}"
        customerName: "${customer_name}"
        emailAddress: "${email_address}"
        sendEmail: "${send_email}"
        autoApprove: "${auto_approve}"
    input:
      customer_id:
        type: string
        description: The Anrok customer id to request a certificate from.
      email_address:
        type: string
        description: The customer contact to send the request to.
        format: email
      customer_name:
        type: string
        description: The customer's name. Creates the customer if the id is new.
        optional: true
      send_email:
        type: boolean
        description: Whether to email the request. False creates it silently and returns the link for you to share.
        optional: true
        default: true
      auto_approve:
        type: boolean
        description: Approve the certificate automatically on submission instead of leaving it for review.
        optional: true
        default: false
    output:
      description: The created request, including the link the customer uploads through.
      type: object
      properties:
        requestLink: {type: string}

  # -- products and tax categories -----------------------------------------

  create_product:
    title: Create a product
    description: >-
      Register a product under your own external id and assign it a product tax
      category, which is what decides how the product is taxed in each
      jurisdiction. Transactions reference products by this external id, so a
      line item for an unregistered product cannot be priced correctly.
    category: products
    request:
      method: POST
      path: /v1/seller/products/create
      body:
        externalId: "${external_id}"
        taxCategoryId: "${tax_category_id}"
        name: "${name}"
        description: "${description}"
    input:
      external_id:
        type: string
        description: Your unique id for the product -- alphanumerics and spaces. This is what line items reference.
      tax_category_id:
        type: object
        description: 'The product tax category as {"type": "standard"|"custom", "id": "saasBusiness"}. list_product_tax_categories has the valid ids.'
        properties:
          type: {type: string}
          id: {type: string}
      name:
        type: string
        description: The product's display name.
      description:
        type: string
        description: An optional description of the product.
        optional: true
    output:
      description: The created product.
      type: object

  get_product:
    title: Get a product
    description: >-
      Look up a product by its external id and return its tax category, name
      and description -- the fastest way to check how a given SKU will be taxed
      before invoicing it.
    category: products
    read_only: true
    request:
      method: POST
      path: /v1/seller/products/externalId:${external_id}/get
    input:
      external_id:
        type: string
        description: Your external id for the product.
    output:
      description: The product record.
      type: object

  list_products:
    title: List products
    description: >-
      Page through the products on the seller account, newest first. Set
      `include_default_products` to also return the default and default
      shipping products integrations create automatically.
    category: products
    read_only: true
    request:
      method: POST
      path: /v1/seller/products/list
      body:
        limit: "${limit}"
        cursor: "${cursor}"
        includeDefaultProducts: "${include_default_products}"
    input:
      limit:
        type: integer
        description: How many products to return (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
      include_default_products:
        type: boolean
        description: Include integrations' default and default shipping products.
        optional: true
        default: false
    output:
      description: A page of products.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  list_product_tax_categories:
    title: List product tax categories
    description: >-
      Every product tax category available on the account -- the standard ones
      Anrok has enabled plus any custom ones defined on the seller account.
      Call this to find the right `taxCategoryId` before creating a product.
    category: products
    read_only: true
    request:
      method: POST
      path: /v1/seller/productTaxCategories/list
    output:
      description: The available product tax categories, each with its type and id.
      type: object
      properties:
        items: {type: array}

  # -- product id mappings --------------------------------------------------

  list_product_mappings:
    title: List an integration's product mappings
    description: >-
      The product id mappings for one billing integration -- how each product
      id in the source system maps to an Anrok product. Useful for auditing
      which SKUs will and will not price correctly.
    category: integrations
    read_only: true
    request:
      method: POST
      path: /v1/seller/integrations/id:${integration_id}/productIdMapping/list
    input:
      integration_id:
        type: string
        description: The Anrok integration id.
    output:
      description: The mappings, as source id to Anrok product id.
      type: array
      items: {type: object}

  add_product_mapping:
    title: Map a billing product to an Anrok product
    description: >-
      Point one product id from your billing system at an Anrok product that
      already exists. Without `should_overwrite`, remapping a source id that is
      already mapped is rejected rather than silently repointed.
    category: integrations
    request:
      method: POST
      path: /v1/seller/integrations/id:${integration_id}/productIdMapping/add
      body:
        sourceId: "${source_id}"
        targetId: "${target_id}"
        shouldOverwrite: "${should_overwrite}"
    input:
      integration_id:
        type: string
        description: The Anrok integration id.
      source_id:
        type: string
        description: The product id in the billing system.
      target_id:
        type: string
        description: The Anrok product this maps to. It must already exist.
      should_overwrite:
        type: boolean
        description: Replace an existing mapping for this source id instead of failing.
        optional: true
    output:
      description: Confirmation of the mapping.
      type: object

  # -- addresses and tax ids ------------------------------------------------

  resolve_address:
    title: Resolve an address to its taxing jurisdictions
    description: >-
      Normalise a customer address and return the jurisdictions that would tax
      a sale delivered there. This is the same address engine transactions use,
      so it is the way to validate an address at collection time rather than
      discovering the problem on an invoice.
    category: addresses
    read_only: true
    request:
      method: POST
      path: /v1/seller/address/resolve
      body:
        country: "${country}"
        line1: "${line1}"
        city: "${city}"
        region: "${region}"
        postalCode: "${postal_code}"
    input:
      country:
        type: string
        description: The country's full name or 2-letter ISO code.
        optional: true
        example: US
      line1:
        type: string
        description: The delivery line of the address.
        optional: true
      city:
        type: string
        description: City or town name.
        optional: true
      region:
        type: string
        description: State, province or county.
        optional: true
      postal_code:
        type: string
        description: Postal or ZIP code.
        optional: true
    output:
      description: The normalised address and the jurisdictions that tax it.
      type: object

  validate_tax_ids:
    title: Validate customer tax IDs
    description: >-
      Check one or more customer VAT/tax registration numbers against the
      customer's address. Use it when collecting a tax id from a customer, so an
      invalid number is caught at entry rather than reversing a B2B reverse-charge
      decision after the invoice has gone out.
    category: addresses
    read_only: true
    request:
      method: POST
      path: /v1/seller/taxId/validate
      body:
        customerAddress: "${customer_address}"
        customerTaxIds: "${customer_tax_ids}"
    input:
      customer_address:
        type: object
        description: The customer's address -- country, line1, city, region, postalCode.
        properties:
          country: {type: string}
          line1: {type: string}
          city: {type: string}
          region: {type: string}
          postalCode: {type: string}
      customer_tax_ids:
        type: array
        description: 'The tax ids to validate, each {"value": "<number>"}.'
        items:
          type: object
          properties:
            value: {type: string}
    output:
      description: Per-id validation results.
      type: object

  # -- filings --------------------------------------------------------------

  list_filings:
    title: List filings
    description: >-
      Page through Anrok's filings, optionally narrowed to one jurisdiction or
      a period-end date range like "2025-01..2025-03". A premium Anrok feature.
    category: filings
    read_only: true
    request:
      method: POST
      path: /v1/seller/filings/list
      body:
        filter: "${filter}"
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      filter:
        type: object
        description: '{"jurisId": "us-MA", "periodEndDateRangeInclusive": "2025-01..2025-03"}.'
        optional: true
        properties:
          jurisId: {type: string}
          periodEndDateRangeInclusive: {type: string}
      limit:
        type: integer
        description: How many filings to return (1-100).
        optional: true
        default: 10
        minimum: 1
        maximum: 100
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
    output:
      description: A page of filings.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  list_filing_transaction_ids:
    title: List a filing's transaction IDs
    description: >-
      The ids of the transactions included in one filing, ordered by accounting
      date. Cheaper than pulling the transactions themselves when you only need
      to reconcile which sales a return covers. A premium Anrok feature.
    category: filings
    read_only: true
    request:
      method: POST
      path: /v1/seller/filings/id:${juris_id}/id:${juris_filing_id}/listTransactionIds
      body:
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      juris_id:
        type: string
        description: The jurisdiction id, e.g. "us-MA" or "eu-oss".
      juris_filing_id:
        type: string
        description: The filing id within that jurisdiction, e.g. "2025-01".
      limit:
        type: integer
        description: How many ids to return (1-2500).
        optional: true
        default: 100
        minimum: 1
        maximum: 2500
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
    output:
      description: A page of transaction ids in the filing.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  list_filing_transactions_with_rates:
    title: List a filing's transactions with conversion rates
    description: >-
      The transactions in one filing, each with the rate used to convert from
      the transaction's currency to the filing's. Rates can move until the
      filing is finalised, so treat the numbers as provisional on an open
      filing. A premium Anrok feature.
    category: filings
    read_only: true
    request:
      method: POST
      path: /v1/seller/filings/id:${juris_id}/id:${juris_filing_id}/listTransactionsWithConversionRates
      body:
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      juris_id:
        type: string
        description: The jurisdiction id, e.g. "us-MA" or "eu-oss".
      juris_filing_id:
        type: string
        description: The filing id within that jurisdiction, e.g. "2025-01".
      limit:
        type: integer
        description: How many transactions to return.
        optional: true
        minimum: 1
      cursor:
        type: string
        description: The `nextCursor` from the previous page.
        optional: true
    output:
      description: A page of the filing's transactions with their conversion rates.
      type: object
      properties:
        items: {type: array}
        nextCursor: {type: string}

  remove_transactions_from_filing:
    title: Remove transactions from a filing
    description: >-
      Detach up to 100 transactions from a filing so they are excluded from
      that return. Idempotent -- ids that are not on the filing are ignored
      rather than erroring. A premium Anrok feature, and one that changes what
      gets filed, so check the filing is still open first.
    category: filings
    destructive: true
    request:
      method: POST
      path: /v1/seller/filings/id:${juris_id}/id:${juris_filing_id}/removeTransactions
      body:
        transactionIds: "${transaction_ids}"
    input:
      juris_id:
        type: string
        description: The jurisdiction id, e.g. "us-MA".
      juris_filing_id:
        type: string
        description: The filing id within that jurisdiction, e.g. "2025-01".
      transaction_ids:
        type: array
        description: The ids to remove, between 1 and 100 of them.
        items: {type: string}
    output:
      description: Confirmation of which transactions were removed.
      type: object
