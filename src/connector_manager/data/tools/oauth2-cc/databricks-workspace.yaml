      method: GET
      path: /api/2.1/unity-catalog/models/${full_name}/versions/${version}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      version:
        type: integer
        description: The model version number.
    output:
      description: The requested record.
      type: object

  get_model_version_by_alias:
    title: Get a model version by alias
    description: >-
      The version an alias currently points at -- how a deployment refers to
      "the production model" without pinning a number.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/models/${full_name}/aliases/${alias}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      alias:
        type: string
        description: The model version alias.
    output:
      description: The requested record.
      type: object

  set_model_alias:
    title: Set a model alias
    description: >-
      Point an alias at a model version. Moving an alias like `champion` is
      what promotes a model to production, and anything resolving that alias
      picks up the new version immediately.
    category: unity-catalog
    destructive: true
    request:
      method: PUT
      path: /api/2.1/unity-catalog/models/${full_name}/aliases/${alias}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      alias:
        type: string
        description: The model version alias.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_model_alias:
    title: Delete a model alias
    description: >-
      Remove an alias. Anything resolving it starts failing rather than
      falling back to a version.
    category: unity-catalog
    destructive: true
    request:
      method: DELETE
      path: /api/2.1/unity-catalog/models/${full_name}/aliases/${alias}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      alias:
        type: string
        description: The model version alias.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_shares:
    title: List shares
    description: >-
      The Delta Sharing shares defined in the metastore -- the bundles of data
      offered to external recipients.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/shares
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      max_results:
        type: integer
        description: How many shares per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_share:
    title: Get a share
    description: >-
      One Delta Sharing share and the objects it exposes to recipients.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/shares/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        include_shared_data: "${include_shared_data}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      include_shared_data:
        type: boolean
        description: Include the shared objects themselves.
        optional: true
    output:
      description: The requested record.
      type: object

  create_share:
    title: Create a share
    description: >-
      Create a Delta Sharing share. Empty on creation -- adding objects to it
      is what actually exposes data outside the organisation.
    category: sharing
    request:
      method: POST
      path: /api/2.1/unity-catalog/shares
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_share:
    title: Update a share
    description: >-
      Add or remove objects in a share. Adding a table here makes it readable
      by every recipient the share is granted to, which is data leaving your
      control.
    category: sharing
    destructive: true
    request:
      method: PATCH
      path: /api/2.1/unity-catalog/shares/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_share:
    title: Delete a share
    description: >-
      Delete a share. Recipients lose access to everything it contained.
    category: sharing
    destructive: true
    request:
      method: DELETE
      path: /api/2.1/unity-catalog/shares/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: Confirmation that the record was deleted.
      type: object

  get_share_permissions:
    title: Get a share's permissions
    description: >-
      Which recipients a share is granted to -- the list of who can read the
      data in it.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/shares/${name}/permissions
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: The requested record.
      type: object

  update_share_permissions:
    title: Change a share's permissions
    description: >-
      Grant or revoke a recipient's access to a share. Granting hands an
      external party live access to the data in it.
    category: sharing
    destructive: true
    request:
      method: PATCH
      path: /api/2.1/unity-catalog/shares/${name}/permissions
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  list_recipients:
    title: List recipients
    description: >-
      The Delta Sharing recipients defined in the metastore -- the external
      parties data can be shared with.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/recipients
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        data_recipient_global_metastore_id: "${data_recipient_global_metastore_id}"
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      data_recipient_global_metastore_id:
        type: string
        description: Restrict to a Databricks-to-Databricks recipient.
        optional: true
      max_results:
        type: integer
        description: How many recipients per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_recipient:
    title: Get a recipient
    description: >-
      One recipient's details, including its authentication type and token
      state.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/recipients/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: The requested record.
      type: object

  create_recipient:
    title: Create a recipient
    description: >-
      Create a Delta Sharing recipient. For open sharing this mints an
      activation link -- treat it as a credential, since whoever opens it gets
      the recipient's access.
    category: sharing
    request:
      method: POST
      path: /api/2.1/unity-catalog/recipients
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  rotate_recipient_token:
    title: Rotate a recipient's token
    description: >-
      Rotate a recipient's sharing token. The old token stops working after
      the grace period given here, so a recipient who has not updated loses
      access.
    category: sharing
    destructive: true
    request:
      method: POST
      path: /api/2.1/unity-catalog/recipients/${name}/rotate-token
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_recipient:
    title: Delete a recipient
    description: >-
      Delete a recipient. Their access to every share ends immediately.
    category: sharing
    destructive: true
    request:
      method: DELETE
      path: /api/2.1/unity-catalog/recipients/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_providers:
    title: List providers
    description: >-
      The Delta Sharing providers this metastore consumes data from -- the
      other side of sharing.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/providers
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        data_provider_global_metastore_id: "${data_provider_global_metastore_id}"
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      data_provider_global_metastore_id:
        type: string
        description: Restrict to one provider metastore.
        optional: true
      max_results:
        type: integer
        description: How many providers per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_provider:
    title: Get a provider
    description: >-
      One Delta Sharing provider's details and authentication type, as this
      metastore sees it.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/providers/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: The requested record.
      type: object

  list_provider_shares:
    title: List a provider's shares
    description: >-
      The shares a provider has made available to this metastore -- what can
      be mounted as a foreign catalog.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/providers/${name}/shares
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      max_results:
        type: integer
        description: How many shares per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_workspace_objects:
    title: List workspace objects
    description: >-
      The notebooks, folders, files and repos at a workspace path. The file
      browser, over the API.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/workspace/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        path: "${path}"
        notebooks_modified_after: "${notebooks_modified_after}"
    input:
      path:
        type: string
        description: The workspace path to list, e.g. "/Users/me".
      notebooks_modified_after:
        type: integer
        description: Only notebooks modified after this epoch millisecond.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_workspace_object_status:
    title: Get a workspace object's status
    description: >-
      The type, language and object id of one workspace path -- and the
      cheapest way to check whether a path exists.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/workspace/get-status
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        path: "${path}"
        return_export_info: "${return_export_info}"
    input:
      path:
        type: string
        description: The workspace path.
      return_export_info:
        type: boolean
        description: Include export format information.
        optional: true
    output:
      description: The requested record.
      type: object

  export_workspace_object:
    title: Export a notebook or file
    description: >-
      Export a notebook or file from the workspace in the requested format.
      `SOURCE` gives the plain code, which is usually what an agent wants to
      read.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/workspace/export
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        path: "${path}"
        format: "${format}"
    input:
      path:
        type: string
        description: The workspace path to export.
      format:
        type: string
        description: Export format.
        optional: true
        enum: [SOURCE, HTML, JUPYTER, DBC, R_MARKDOWN, AUTO]
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  import_workspace_object:
    title: Import a notebook or file
    description: >-
      Write a notebook or file into the workspace. Without `overwrite` an
      existing path is an error; with it, the previous content is replaced and
      not recoverable through this API.
    category: workspace
    request:
      method: POST
      path: /api/2.0/workspace/import
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_workspace_object:
    title: Delete a workspace object
    description: >-
      Delete a notebook, file or directory. `recursive` takes everything
      beneath a folder, which is easy to point at more than intended.
    category: workspace
    destructive: true
    request:
      method: POST
      path: /api/2.0/workspace/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  create_workspace_directory:
    title: Create a workspace directory
    description: >-
      Create a directory in the workspace, including any missing parents.
    category: workspace
    request:
      method: POST
      path: /api/2.0/workspace/mkdirs
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_repos:
    title: List repos
    description: >-
      The Git repos checked out in the workspace, with their provider, url and
      current branch.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/repos
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        path_prefix: "${path_prefix}"
        next_page_token: "${next_page_token}"
    input:
      path_prefix:
        type: string
        description: Only repos beneath this workspace path.
        optional: true
      next_page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_repo:
    title: Get a repo
    description: >-
      One repo's url, provider, branch and head commit.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/repos/${repo_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      repo_id:
        type: string
        description: The repo id, from list_repos.
    output:
      description: The requested record.
      type: object

  create_repo:
    title: Create a repo
    description: >-
      Clone a Git repository into the workspace. Needs a Git credential to
      already exist for private repositories.
    category: workspace
    request:
      method: POST
      path: /api/2.0/repos
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_repo:
    title: Update a repo
    description: >-
      Check out a different branch or tag in a repo. This changes the code
      that scheduled jobs running from that path will execute on their next
      run.
    category: workspace
    destructive: true
    request:
      method: PATCH
      path: /api/2.0/repos/${repo_id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      repo_id:
        type: string
        description: The repo id, from list_repos.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_repo:
    title: Delete a repo
    description: >-
      Remove a repo from the workspace. Uncommitted changes in it are lost,
      and jobs pointing at its path start failing.
    category: workspace
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/repos/${repo_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      repo_id:
        type: string
        description: The repo id, from list_repos.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_git_credentials:
    title: List Git credentials
    description: >-
      The Git provider credentials registered for this user. Token values are
      never returned.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /api/2.0/git-credentials
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_git_credential:
    title: Create a Git credential
    description: >-
      Register a Git provider personal access token so private repositories
      can be cloned. The token is stored by Databricks.
    category: workspace
    request:
      method: POST
      path: /api/2.0/git-credentials
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_git_credential:
    title: Update a Git credential
    description: >-
      Replace a stored Git credential, typically to rotate the token.
    category: workspace
    request:
      method: PATCH
      path: /api/2.0/git-credentials/${credential_id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      credential_id:
        type: string
        description: The Git credential id, from list_git_credentials.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_git_credential:
    title: Delete a Git credential
    description: >-
      Delete a Git credential. Repo operations against private repositories
      start failing.
    category: workspace
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/git-credentials/${credential_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      credential_id:
        type: string
        description: The Git credential id, from list_git_credentials.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_secret_scopes:
    title: List secret scopes
    description: >-
      The secret scopes in the workspace. A scope is a namespace of secrets
      with its own access control list.
    category: secrets
    read_only: true
    request:
      method: GET
      path: /api/2.0/secrets/scopes/list
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_secret_scope:
    title: Create a secret scope
    description: >-
      Create a secret scope, backed by Databricks or by a cloud key vault.
    category: secrets
    request:
      method: POST
      path: /api/2.0/secrets/scopes/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_secret_scope:
    title: Delete a secret scope
    description: >-
      Delete a secret scope and every secret in it. Jobs and clusters reading
      those secrets start failing, and the values cannot be recovered.
    category: secrets
    destructive: true
    request:
      method: POST
      path: /api/2.0/secrets/scopes/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_secrets:
    title: List secrets in a scope
    description: >-
      The secret keys in a scope, with their last-updated timestamps. Values
      are never returned by this endpoint.
    category: secrets
    read_only: true
    request:
      method: GET
      path: /api/2.0/secrets/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        scope: "${scope}"
    input:
      scope:
        type: string
        description: The scope to list.
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  put_secret:
    title: Set a secret
    description: >-
      Write a secret into a scope. Overwrites any existing value for the key,
      and the previous value is not recoverable.
    category: secrets
    destructive: true
    request:
      method: POST
      path: /api/2.0/secrets/put
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_secret:
    title: Delete a secret
    description: >-
      Delete a secret from a scope. Anything reading it -- a job, a cluster's
      init script -- fails on its next run.
    category: secrets
    destructive: true
    request:
      method: POST
      path: /api/2.0/secrets/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
