        type: string
        description: Path to call, relative to the connection's base url.
        example: /api/2.0/clusters/list
      query:
        type: object
        description: 'Query-string parameters as a flat object, e.g. {"limit": 50}.'
        optional: true
    output:
      description: Whatever Databricks (workspace level)'s API returns for that request, parsed as JSON where possible.
      type: object

