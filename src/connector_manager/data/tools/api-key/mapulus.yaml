  incidents_list_endpoint_v1_data_incidents_get:
    title: List incidents
    description: 'List incidents List and filter real-time incidents. Supports hierarchical filtering:
      type (incident category), eventtype (specific event category), eventsubtype (granular subtype),
      plus status, state, severity, source, boundary intersection, radius search, and time range. Both
      type and status accept comma-separate Calls GET /v1/data/incidents on the provider''s API.'
    category: data
    request:
      method: GET
      path: /v1/data/incidents
      query:
        type: ${type}
        event_type: ${event_type}
        event_subtype: ${event_subtype}
        status: ${status}
        state: ${state}
        severity: ${severity}
        source: ${source}
        boundary_id: ${boundary_id}
        lat: ${lat}
        lng: ${lng}
        radius_km: ${radius_km}
        since: ${since}
        until: ${until}
        ends_after: ${ends_after}
        ends_before: ${ends_before}
        detail: ${detail}
        sort: ${sort}
        limit: ${limit}
        offset: ${offset}
    input:
      type:
        type: string
        description: Filter by incident type (traffic, fire, power, weather). Comma-separated for multiple.
        optional: true
      event_type:
        type: string
        description: Filter by event type (e.g. roadworks, crash, flood, firevegetation).
        optional: true
      event_subtype:
        type: string
        description: Filter by event subtype (e.g. flashflood, plannedroadworks, multivehicle).
        optional: true
      status:
        type: string
        description: Filter by status (active, upcoming, resolved, expired). Comma-separated for multiple.
        optional: true
        default: active
      state:
        type: string
        description: Filter by state (QLD, NSW, etc.).
        optional: true
      severity:
        type: string
        description: Filter by severity (minor, moderate, major, extreme).
        optional: true
      source:
        type: string
        description: Filter by sourceid.
        optional: true
      boundary_id:
        type: string
        description: Incidents intersecting this boundary (e.g. lga:17200).
        optional: true
      lat:
        type: string
        description: Latitude for radius search.
        optional: true
      lng:
        type: string
        description: Longitude for radius search.
        optional: true
      radius_km:
        type: string
        description: Search radius in km (requires lat, lng).
        optional: true
      since:
        type: string
        description: Incidents started after this ISO datetime.
        optional: true
      until:
        type: string
        description: Incidents started before this ISO datetime.
        optional: true
      ends_after:
        type: string
        description: Incidents with expectedendat after this ISO datetime.
        optional: true
      ends_before:
        type: string
        description: Incidents with expectedendat before this ISO datetime.
        optional: true
      detail:
        type: boolean
        description: Include full detail per incident (geometry, description, source data).
        optional: true
        default: false
      sort:
        type: string
        description: 'Sort order: ''distance'' (closest first) or ''newest'' (most recent first). Default:
          ''distance'' for radius queries, ''newest'' otherwise.'
        optional: true
      limit:
        type: integer
        description: Page size.
        optional: true
        default: 50
      offset:
        type: integer
        description: Pagination offset.
        optional: true
        default: 0
    output:
      description: Paginated list of incidents. Use detail=true for full geometry and source data.
      type: object
    read_only: true
