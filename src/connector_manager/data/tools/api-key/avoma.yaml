      is_impromptu:
        type: boolean
        description: True for unscheduled, ad-hoc meetings only.
        optional: true
      order:
        type: string
        description: Field to sort by; prefix with - for descending.
        optional: true
      page:
        type: integer
        description: Page number.
        optional: true
      page_size:
        type: integer
        description: Participants per page, up to 100.
