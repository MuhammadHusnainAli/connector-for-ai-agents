      and it can be used by migrating clients to map identifiers between the two systems.
    category: users
    request:
      method: GET
      path: /v4/${name}
    input:
      name:
        type: string
        description: 'Required. The resource name of the Identity. Format: users/me/identity'
    output:
      description: The Identity resource.
      type: object
    scopes_any:
    - googlehealth.activity_and_fitness.readonly
    - googlehealth.ecg.readonly
    - googlehealth.health_metrics_and_measurements.readonly
    - googlehealth.irn.readonly
    - googlehealth.profile.readonly
    - googlehealth.settings.readonly
