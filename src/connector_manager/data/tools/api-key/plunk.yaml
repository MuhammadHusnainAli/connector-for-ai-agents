      body:
        email: ${email}
        event: ${event}
        subscribed: ${subscribed}
        data: ${data}
    input:
      email:
        type: string
        description: Contact email. The contact is auto-created if it doesn't exist.
      event:
        type: string
        description: Event name. Cannot match the reserved patterns above.
      subscribed:
        type: boolean
        description: Subscription state to apply to the contact. New contacts default to subscribed (true).
          Existing contacts keep their current state unless you pass an explicit value here. Pass false
          to track an event without resubscribing an unsubscribed contact.
        optional: true
      data:
        type: object
        description: 'Contact data and one-off event variables. Persistent values (primitives, plain objects)
          are saved on the contact and become available as template variables. Pass { value, persistent:
          false } for one-shot variables that should not be stored on the contact (e.g. order IDs, transaction
          details). null deletes a field. Empty strings are ignored. Reserved keys are filtered out —
          see the contacts concept'
        optional: true
    output:
      description: Event tracked successfully
      type: object
