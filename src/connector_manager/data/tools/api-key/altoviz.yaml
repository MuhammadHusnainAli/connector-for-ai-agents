  get_cash_flow:
    title: Get cash flow
    description: >-
      Settled, outstanding and projected cash flow for a period, in daily to annual buckets.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /Statistics/CashFlowByPeriodicity
      query:
        from: ${from}
        to: ${to}
        year: ${year}
        periodicity: ${periodicity}
        cumulative: ${cumulative}
    input:
      from:
        type: string
        description: Start date (inclusive), YYYY-MM-DD.
        optional: true
      to:
        type: string
        description: End date (inclusive), YYYY-MM-DD.
        optional: true
      year:
        type: integer
        description: Calendar year, e.g. 2026. Ignored when from and to are given; defaults
          to the current year.
        optional: true
      periodicity:
        type: string
        description: 'Bucket size: Daily, Weekly, Monthly (default), Quarterly or Annually.'
        optional: true
        enum:
        - Daily
        - Weekly
        - Monthly
        - Quarterly
        - Annually
      cumulative:
        type: boolean
        description: True for running totals instead of per-bucket values.
        optional: true
    output:
      description: The cash flow buckets.
      type: object

  compare_turnover:
    title: Compare turnover
    description: >-
      Turnover for a period next to the same period a year earlier and the period of equal
      length just before.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /Statistics/TurnoverComparison
      query:
        from: ${from}
        to: ${to}
        year: ${year}
        expenses: ${expenses}
        paid: ${paid}
    input:
      from:
        type: string
        description: Start date (inclusive), YYYY-MM-DD.
        optional: true
      to:
        type: string
        description: End date (inclusive), YYYY-MM-DD.
        optional: true
      year:
        type: integer
        description: Calendar year, e.g. 2026. Ignored when from and to are given; defaults
          to the current year.
        optional: true
      expenses:
        type: boolean
        description: True for purchases instead of sales.
        optional: true
      paid:
        type: boolean
        description: True to count money actually settled instead of amounts invoiced. Micro-businesses
          always count it this way.
        optional: true
    output:
      description: The comparison.
      type: object

  get_global_turnover:
    title: Get all-time turnover
    description: >-
      Read the company's total turnover since it started using Altoviz.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /Statistics/GlobalTurnover
    input: {}
    output:
      description: The total turnover.
      type: object

  get_turnover_evolution:
    title: Get turnover evolution
    description: >-
      Turnover over a period in buckets, broken down by sales, expenses, customer, supplier,
      product, colleague, margin or discount, and optionally compared with previous years.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /Statistics/TurnoverEvolution
      query:
        from: ${from}
        to: ${to}
        year: ${year}
        periodicity: ${periodicity}
        compare: ${compare}
        type: ${type}
        cumulative: ${cumulative}
        customerId: ${customer_id}
        supplierId: ${supplier_id}
        colleagueId: ${colleague_id}
        productId: ${product_id}
    input:
      from:
        type: string
        description: Start date (inclusive), YYYY-MM-DD.
        optional: true
      to:
        type: string
        description: End date (inclusive), YYYY-MM-DD.
        optional: true
      year:
        type: integer
        description: Calendar year, e.g. 2026. Ignored when from and to are given; defaults
          to the current year.
        optional: true
      periodicity:
        type: string
        description: 'Bucket size: Daily, Weekly, Monthly (default), Quarterly or Annually.'
        optional: true
        enum:
        - Daily
        - Weekly
        - Monthly
        - Quarterly
        - Annually
      compare:
        type: integer
        description: How many earlier years to return alongside (0-2).
        optional: true
      type:
        type: string
        description: 'Breakdown: Sales, Expenses, Customer, Supplier, Product, Colleague,
          Margin or Discount.'
        optional: true
        enum:
        - Sales
        - Expenses
        - Customer
        - Supplier
        - Product
        - Colleague
        - Margin
        - Discount
      cumulative:
        type: boolean
        description: True for running totals instead of per-bucket values.
        optional: true
      customer_id:
        type: integer
        description: Only this customer.
        optional: true
      supplier_id:
        type: integer
        description: Only this supplier.
        optional: true
      colleague_id:
        type: integer
        description: Only this colleague.
        optional: true
      product_id:
        type: integer
        description: Only this product.
        optional: true
    output:
      description: The buckets.
      type: object

  get_payment_delay:
    title: Get payment delay
    description: >-
      How long payments take: average and median days from the document date and from the
      due date, and the share paid late. Medians are more reliable than averages.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /Statistics/PaymentDelay
      query:
        from: ${from}
        to: ${to}
        year: ${year}
        periodicity: ${periodicity}
        side: ${side}
    input:
      from:
        type: string
        description: Start date (inclusive), YYYY-MM-DD.
        optional: true
      to:
        type: string
        description: End date (inclusive), YYYY-MM-DD.
        optional: true
      year:
        type: integer
        description: Calendar year, e.g. 2026. Ignored when from and to are given; defaults
          to the current year.
        optional: true
      periodicity:
        type: string
        description: 'Bucket size: Daily, Weekly, Monthly (default), Quarterly or Annually.'
        optional: true
        enum:
        - Daily
        - Weekly
        - Monthly
        - Quarterly
        - Annually
      side:
        type: string
        description: Customers (default) or Suppliers.
        optional: true
        enum:
        - Customers
        - Suppliers
    output:
      description: The payment delay figures.
      type: object

