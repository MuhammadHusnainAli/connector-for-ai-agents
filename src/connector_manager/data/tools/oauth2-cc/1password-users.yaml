# 1Password Users API for Partners tools.
#
# This is the complete surface of the API as published: four operations. Taken
# from 1Password's own OpenAPI specification at
# https://i.1password.com/media/1password-users-api/1password-users-api_v1beta1.yaml
#
# The connection's base url already carries /v1beta1/accounts/{accountId}, so
# paths start at /users. Custom actions use a colon suffix — ":suspend",
# ":reactivate" — which is the API's own convention, not a path segment.
#
# The API is in public preview, and 1Password does not support it on accounts
# using automated provisioning; suspend and reactivate go through the identity
# provider there instead.
#
# Docs: https://developer.1password.com/docs/users-api/

connector_id: 1password-users
display_name: 1Password (Users API)
docs_url: https://developer.1password.com/docs/users-api/

tools:

  list_users:
    title: List users in the account
    description: >-
      Page through the 1Password account's users. Narrow to a state with a
      filter of "user.isActive()" or "user.isSuspended()"; omit it for both.
      Page with the token the previous response returned.
    category: users
    read_only: true
    request:
      method: GET
      path: /users
      query:
        filter: "${filter}"
        max_page_size: "${max_page_size}"
        page_token: "${page_token}"
    input:
      filter:
        type: string
        description: Restrict to active or suspended users. Omit for both.
        optional: true
        enum: ["user.isActive()", "user.isSuspended()"]
      max_page_size:
        type: integer
        description: How many users to return per page.
        optional: true
        default: 100
        minimum: 1
      page_token:
        type: string
        description: Page token from a previous list_users response.
        optional: true
    output:
      description: A page of users, with the token for the next page.
      type: object
      properties:
        users: {type: array, description: "Each with id, name, email and state."}
        nextPageToken: {type: string, description: "Pass back as page_token; absent on the last page."}

  get_user:
    title: Get a user
    description: >-
      Read one user in the account by their id — their name, email address and
      whether they are active or suspended.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/${user_id}
    input:
      user_id:
        type: string
        description: The user's id, from list_users.
    output:
      description: The user.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        state: {type: string}

  suspend_user:
    title: Suspend a user
    description: >-
      Suspend a user, cutting off their access to the 1Password account
      immediately while keeping their data. This is the incident-response
      action the API exists for; reactivate_user reverses it.
    category: users
    destructive: true
    request:
      method: POST
      path: /users/${user_id}:suspend
      body: {}
    input:
      user_id:
        type: string
        description: The user to suspend.
    output:
      description: The user in its suspended state.
      type: object
      properties:
        id: {type: string}
        state: {type: string}

  reactivate_user:
    title: Reactivate a suspended user
    description: >-
      Restore a suspended user's access to the 1Password account. Only
      meaningful for a user who is currently suspended.
    category: users
    request:
      method: POST
      path: /users/${user_id}:reactivate
      body: {}
    input:
      user_id:
        type: string
        description: The user to reactivate.
    output:
      description: The user in its reactivated state.
      type: object
      properties:
        id: {type: string}
        state: {type: string}
