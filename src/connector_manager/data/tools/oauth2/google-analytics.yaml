  # -- the rest of the API, from Google's own discovery document ------------

  list_account_summaries:
    title: List account summaries
    description: Returns summaries of all accounts accessible by the caller.
    category: account_summaries
    request:
      method: GET
      path: /v1beta/accountSummaries
      base_url_override: https://analyticsadmin.googleapis.com
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      page_size:
        type: integer
        description: Optional. The maximum number of AccountSummary resources to return. The service may
          return fewer than this value, even if there are additional pages. If unspecified, at most 50
          resources will be returned. The maximum value is 200; (higher values will be coerced to the
          maximum)
        optional: true
      page_token:
        type: string
        description: Optional. A page token, received from a previous ListAccountSummaries call. Provide
          this to retrieve the subsequent page. When paginating, all other parameters provided to ListAccountSummaries
          must match the call that provided the page token.
        optional: true
    output:
      description: The GoogleAnalyticsAdminV1betaListAccountSummariesResponse resource.
      type: object
    scopes_any:
    - analytics.edit
    - analytics.readonly
    read_only: true
  delete_account:
    title: Delete account
    description: 'Marks target Account as soft-deleted (ie: "trashed") and returns it. This API does not
      have a method to restore soft-deleted accounts. However, they can be restored using the Trash Can
      UI. If the accounts are not restored before the expiration time, the account and all child resources
      (eg: Properties, GoogleAdsLinks, Streams, AccessBindings) will be permanently purged. https://support.google.com/analytics/answer/6154'
    category: accounts
    request:
      method: DELETE
      path: /v1beta/${name}
      base_url_override: https://analyticsadmin.googleapis.com
    input:
      name:
        type: string
        description: 'Required. The name of the Account to soft-delete. Format: accounts/{account} Example:
          "accounts/100"'
    output:
      description: The GoogleProtobufEmpty resource.
      type: object
    scopes:
    - analytics.edit
    destructive: true
  list_accounts:
    title: List accounts
