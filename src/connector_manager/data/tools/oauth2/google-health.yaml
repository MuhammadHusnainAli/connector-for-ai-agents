    - googlehealth.settings.readonly
    read_only: true
  update_profile_user:
    title: Update profile user
    description: Updates the user's profile details. Calls users.updateProfile on the Google Health API.
    category: users
    request:
      method: PATCH
      path: /v4/${name}
      query:
        updateMask: ${update_mask}
      body:
        userConfiguredWalkingStrideLengthMm: ${user_configured_walking_stride_length_mm}
        age: ${age}
        userConfiguredRunningStrideLengthMm: ${user_configured_running_stride_length_mm}
        name: ${body_name}
    input:
      name:
        type: string
        description: 'Identifier. The resource name of this Profile resource. Format: users/{user}/profile
          Example: users/1234567890/profile or users/me/profile The {user} ID is a system-generated Google
          Health API user ID, a string of 1-63 characters consisting of lowercase and uppercase letters,
          numbers, and hyphens. T'
      update_mask:
        type: string
        description: Optional. The list of fields to be updated.
        optional: true
      user_configured_walking_stride_length_mm:
        type: integer
        description: 'Optional. The user''s user configured walking stride length, in millimeters. The
          user must consent to one of the following access scopes to access this field: - https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly
          - https://www.googleapis.com/auth/googlehealth.activity_and_fitne'
        optional: true
      age:
        type: integer
        description: Optional. The age in years based on the user's birth date. Updates to this field
          are currently not supported.
        optional: true
      user_configured_running_stride_length_mm:
        type: integer
        description: 'Optional. The user''s user configured running stride length, in millimeters. The
          user must consent to one of the following access scopes to access this field: - https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly
          - https://www.googleapis.com/auth/googlehealth.activity_and_fitne'
        optional: true
      body_name:
        type: string
        description: 'Identifier. The resource name of this Profile resource. Format: users/{user}/profile
          Example: users/1234567890/profile or users/me/profile The {user} ID is a system-generated Google
          Health API user ID, a string of 1-63 characters consisting of lowercase and uppercase letters,
          numbers, and hyphens. T'
        optional: true
    output:
      description: The Profile resource.
      type: object
    scopes:
