      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      item_id:
        type: string
        description: Item id (UUID).
      operations:
        type: array
        items:
          type: object
        min_length: 1
        description: 'JSON Patch operations, e.g. [{"op": "replace", "path": "/name", "value":
          "New name"}]. op is add, remove, replace, move, copy or test.'
    output:
      description: The whole updated item.
      type: object

  update_item:
