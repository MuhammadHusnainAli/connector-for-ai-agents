# Cursor tools -- cloud agents and private workers.
#
# This connector holds a personal or service-account API key and drives the
# Cloud Agents API: launching agents against a repository, following their runs
# and collecting what they produced. Team administration -- members, spend,
# audit logs, model access -- is a different credential and lives on the
# `cursor-admin` connector.
#
# Three things worth knowing before driving this:
#
#   * **launching an agent changes a repository.** `launch_agent` and
#     `create_agent_run` spend real compute, and with `autoCreatePR` the agent
#     opens a pull request on its own. They are writes to your codebase, not
#     just to Cursor, which is why both are marked destructive here;
#   * **an agent is not a run.** The agent is the long-lived object; each launch
#     and each follow-up is a run with its own status and result. Poll
#     `get_agent_run`, not `get_agent`, to follow a specific instruction;
#   * **two path versions coexist.** The agents surface is `/v1`; private
#     workers and the legacy identity check are still `/v0`. Both are current --
#     `check_connection` uses the `/v0/me` endpoint the connector itself
#     declares, and `get_api_key_info` is its `/v1` counterpart.
#
# Streaming endpoints (a run's SSE stream, the pending-request watch) are not
# included: this proxy returns one response rather than a live stream.
#
# Docs: https://cursor.com/docs/background-agent/api/overview

connector_id: cursor
display_name: Cursor
docs_url: https://cursor.com/docs/background-agent/api/overview

tools:

  check_connection:
    title: Check the connection
    description: >-
      Read the identity behind this API key. The connector's own verification
      endpoint, and the cheapest call that proves the key still works.
    category: account
    read_only: true
    request:
      method: GET
      path: /v0/me
    output:
      description: The requested record.
      type: object

  get_api_key_info:
    title: Get API key information
    description: >-
      What this key is and what it can reach -- the user or service account
      behind it, and its scope. The v1 counterpart of the legacy /v0/me check.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/me
    output:
      description: The requested record.
      type: object

  list_models:
    title: List available models
    description: >-
      The models this key may run a cloud agent on. Pass one of these ids as
      `model` when launching an agent; an unavailable model is rejected rather
      than substituted.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/models
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_repositories:
    title: List available repositories
    description: >-
      The repositories Cursor can start an agent against, from the git
      integrations connected to the account. An agent cannot be launched
      against a repository that is not listed here.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/repositories
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_agents:
    title: List cloud agents
    description: >-
      The cloud agents on the account, newest first. Archived agents are
      excluded unless `includeArchived` asks for them, and `prUrl` narrows to
      the agent that produced a specific pull request.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents
      query:
        limit: "${limit}"
        cursor: "${cursor}"
        prUrl: "${pr_url}"
        includeArchived: "${include_archived}"
    input:
      limit:
        type: integer
        description: How many agents to return.
        optional: true
        default: '20'
      cursor:
        type: string
        description: Paging cursor from a previous response.
        optional: true
      pr_url:
        type: string
        description: Return the agent that produced this pull request url.
        optional: true
      include_archived:
        type: boolean
        description: Include archived agents, which are otherwise omitted.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  launch_agent:
    title: Launch a cloud agent
    description: >-
      Start a cloud agent on a repository with a prompt. This spends real
      compute and, with `autoCreatePR`, can open a pull request against the
      repository on its own -- so it is a write to the codebase, not just to
      Cursor.
    category: agents
    destructive: true
    request:
      method: POST
      path: /v1/agents
      body:
        prompt: "${prompt}"
        model: "${model}"
        name: "${name}"
        repos: "${repos}"
        workOnCurrentBranch: "${work_on_current_branch}"
        autoCreatePR: "${auto_create_pr}"
        skipReviewerRequest: "${skip_reviewer_request}"
        envVars: "${env_vars}"
        mcpServers: "${mcp_servers}"
        customSubagents: "${custom_subagents}"
        mode: "${mode}"
        agentId: "${agent_id}"
    input:
      prompt:
        type: object
        description: 'The instruction for the agent, as {"text": "..."} plus optional images.'
      model:
        type: string
        description: Which model to run on, from list_models.
        optional: true
      name:
        type: string
        description: A name for the agent, shown in the Cursor dashboard.
        optional: true
      repos:
        type: array
        description: The repositories the agent may work in, from list_repositories.
        optional: true
        items: {type: object}
      work_on_current_branch:
        type: boolean
        description: Work on the branch as it stands rather than cutting a new one.
        optional: true
      auto_create_pr:
        type: boolean
        description: Open a pull request automatically when the agent finishes.
        optional: true
      skip_reviewer_request:
        type: boolean
        description: Do not request a reviewer on the pull request it opens.
        optional: true
      env_vars:
        type: object
        description: Environment variables to expose to the agent's sandbox.
        optional: true
      mcp_servers:
        type: array
        description: MCP servers the agent may call while it works.
        optional: true
        items: {type: object}
      custom_subagents:
        type: array
        description: Custom subagents the agent may delegate to.
        optional: true
        items: {type: object}
      mode:
        type: string
        description: Which agent mode to run in.
        optional: true
      agent_id:
        type: string
        description: Reuse an existing agent configuration rather than defining one inline.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_agent:
    title: Get a cloud agent
    description: >-
      One agent's status, the repository it is working in and the pull request
      it has opened, if any. Poll this to follow an agent launched earlier.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
    output:
      description: The requested record.
      type: object

  archive_agent:
    title: Archive a cloud agent
    description: >-
      Archive an agent so it drops out of the default listing. Reversible with
      unarchive_agent, and it does not delete the agent's history.
    category: agents
    request:
      method: POST
      path: /v1/agents/${id}/archive
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
    output:
      description: The provider's response to the call.
      type: object

  unarchive_agent:
    title: Unarchive a cloud agent
    description: >-
      Bring an archived agent back into the default listing, undoing an
      archive.
    category: agents
    request:
      method: POST
      path: /v1/agents/${id}/unarchive
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
    output:
      description: The provider's response to the call.
      type: object

  delete_agent:
    title: Delete a cloud agent
    description: >-
      Delete an agent and its run history permanently. Any pull request it
      already opened survives in the repository -- this removes the
      Cursor-side record, not the code.
    category: agents
    destructive: true
    request:
      method: DELETE
      path: /v1/agents/${id}
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_agent_runs:
    title: List an agent's runs
    description: >-
      The runs an agent has performed -- its original launch plus every
      follow-up. Each run has its own status and result.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}/runs
      query:
        limit: "${limit}"
        cursor: "${cursor}"
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      limit:
        type: integer
        description: How many runs to return.
        optional: true
        default: '20'
      cursor:
        type: string
        description: Paging cursor from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_agent_run:
    title: Send a follow-up to an agent
    description: >-
      Give a running or finished agent a new instruction, continuing its work
      rather than starting fresh. Like the launch, this spends compute and can
      change the repository.
    category: agents
    destructive: true
    request:
      method: POST
      path: /v1/agents/${id}/runs
      body:
        prompt: "${prompt}"
        mcpServers: "${mcp_servers}"
        mode: "${mode}"
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      prompt:
        type: object
        description: 'The follow-up instruction, as {"text": "..."}.'
      mcp_servers:
        type: array
        description: MCP servers the agent may call for this run.
        optional: true
        items: {type: object}
      mode:
        type: string
        description: Which agent mode to run in.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_agent_run:
    title: Get an agent run
    description: >-
      One run's status and result, including what the agent changed. This is
      what to poll after launching or following up.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}/runs/${run_id}
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      run_id:
        type: string
        description: The run id, from list_agent_runs.
    output:
      description: The requested record.
      type: object

  cancel_agent_run:
    title: Cancel an agent run
    description: >-
      Stop a run that is still in progress. Work the agent has already
      committed stays; it simply does no more.
    category: agents
    request:
      method: POST
      path: /v1/agents/${id}/runs/${run_id}/cancel
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      run_id:
        type: string
        description: The run id, from list_agent_runs.
    output:
      description: The provider's response to the call.
      type: object

  get_agent_usage:
    title: Get an agent's usage
    description: >-
      What one agent has cost -- tokens and spend, optionally for a single
      run. The per-agent view, as opposed to the team-wide reports on the
      Cursor Admin connector.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}/usage
      query:
        runId: "${run_id}"
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      run_id:
        type: string
        description: Restrict the figures to one run.
        optional: true
    output:
      description: The requested record.
      type: object

  list_agent_artifacts:
    title: List an agent's artifacts
    description: >-
      The files an agent produced during its runs, with the paths
      download_agent_artifact takes.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}/artifacts
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  download_agent_artifact:
    title: Download an agent's artifact
    description: >-
      Fetch one artifact an agent produced. Returns the file itself rather
      than JSON.
    category: agents
    read_only: true
    request:
      method: GET
      path: /v1/agents/${id}/artifacts/download
      query:
        path: "${path}"
    input:
      id:
        type: string
        description: The agent id, from list_agents or launch_agent.
      path:
        type: string
        description: The artifact path, from list_agent_artifacts.
    output:
      description: The requested record.
      type: object

  list_private_workers:
    title: List private workers
    description: >-
      The self-hosted workers registered to run agents on your own
      infrastructure, with each one's status and pool.
    category: workers
    read_only: true
    request:
      method: GET
      path: /v0/private-workers
      query:
        status: "${status}"
        scope: "${scope}"
        limit: "${limit}"
        pageToken: "${page_token}"
    input:
      status:
        type: string
        description: Filter by worker status.
        optional: true
      scope:
        type: string
        description: Which scope to list workers for.
        optional: true
      limit:
        type: integer
        description: How many workers to return.
        optional: true
        default: '50'
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_private_workers_summary:
    title: Get a private worker summary
    description: >-
      Counts of registered workers by state -- the quickest check that a
      self-hosted fleet is actually connected.
    category: workers
    read_only: true
    request:
      method: GET
      path: /v0/private-workers/summary
    output:
      description: The requested record.
      type: object

  get_private_worker:
    title: Get a private worker
    description: >-
      One private worker's status, pool membership and last heartbeat.
    category: workers
    read_only: true
    request:
      method: GET
      path: /v0/private-workers/${id}
    input:
      id:
        type: string
        description: The private worker's id, from list_private_workers.
    output:
      description: The requested record.
      type: object

  list_worker_pools:
    title: List worker pools
    description: >-
      The pools private workers are grouped into, each bound to a repository.
      Agents are dispatched to a pool, not to an individual worker.
    category: workers
    read_only: true
    request:
      method: GET
      path: /v0/private-workers/pools
      query:
        scope: "${scope}"
        includeStale: "${include_stale}"
    input:
      scope:
        type: string
        description: Which scope to list pools for.
        optional: true
      include_stale:
        type: boolean
        description: Include pools with no live workers.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  register_worker_pool:
    title: Register a worker pool
    description: >-
      Create a pool that private workers can join for a given repository, so
      agents for that repository run on your own infrastructure.
    category: workers
    request:
      method: POST
      path: /v0/private-workers/pools
      body:
        scope: "${scope}"
        poolName: "${pool_name}"
        repoOwner: "${repo_owner}"
        repoName: "${repo_name}"
        repoUrl: "${repo_url}"
        workerReadyTimeoutSeconds: "${worker_ready_timeout_seconds}"
    input:
      scope:
        type: string
        description: The scope the pool belongs to.
        optional: true
      pool_name:
        type: string
        description: A name for the pool.
        optional: true
      repo_owner:
        type: string
        description: The repository owner the pool serves.
        optional: true
      repo_name:
        type: string
        description: The repository name the pool serves.
        optional: true
      repo_url:
        type: string
        description: The repository url the pool serves.
        optional: true
      worker_ready_timeout_seconds:
        type: integer
        description: How long to wait for a worker to become ready before giving up.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  deregister_worker_pool:
    title: Deregister a worker pool
    description: >-
      Remove a worker pool. Agents for that repository fall back to
      Cursor-hosted compute, or fail if none is available.
    category: workers
    destructive: true
    request:
      method: DELETE
      path: /v0/private-workers/pools
      query:
        scope: "${scope}"
        pool_name: "${pool_name}"
        repo_owner: "${repo_owner}"
        repo_name: "${repo_name}"
    input:
      scope:
        type: string
        description: The scope the pool belongs to.
        optional: true
      pool_name:
        type: string
        description: The pool's name.
        optional: true
      repo_owner:
        type: string
        description: The repository owner the pool serves.
        optional: true
      repo_name:
        type: string
        description: The repository name the pool serves.
        optional: true
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_pending_worker_requests:
    title: List pending worker requests
    description: >-
      Agent runs waiting for a private worker to pick them up. What a
      self-hosted worker polls to find work.
    category: workers
    read_only: true
    request:
      method: GET
      path: /v0/private-workers/pending-requests
      query:
        limit: "${limit}"
        pageToken: "${page_token}"
        repository: "${repository}"
        pool: "${pool}"
    input:
      limit:
        type: integer
        description: How many requests to return.
        optional: true
        default: '50'
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      repository:
        type: string
        description: Only requests for this repository.
        optional: true
      pool:
        type: string
        description: Only requests for this pool.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  claim_worker_request:
    title: Claim a pending worker request
    description: >-
      Claim a pending request for a specific worker, so no other worker picks
      up the same run. The claim is exclusive until released or it expires.
    category: workers
    request:
      method: POST
      path: /v0/private-workers/claim
      body:
        id: "${id}"
        workerId: "${worker_id}"
    input:
      id:
        type: string
        description: The pending request's id, from list_pending_worker_requests.
      worker_id:
        type: string
        description: The worker claiming the request.
    output:
      description: The provider's response to the call.
      type: object

  release_worker_claim:
    title: Release a worker claim
    description: >-
      Give a claimed request back to the queue, so another worker can take it.
      The right response to a worker that cannot actually run the job.
    category: workers
    request:
      method: POST
      path: /v0/private-workers/claims/${id}/release
    input:
      id:
        type: string
        description: The claim id, from the claim response.
    output:
      description: The provider's response to the call.
      type: object
