# Altoviz tools -- invoicing and accounting for French small businesses: customers,
# suppliers, contacts, colleagues, products, quotes, invoices, credit notes,
# receipts, exports, statistics and webhooks.
#
# Built from Altoviz's OpenAPI description at https://api.altoviz.com/openapi.yaml.
# It covers 116 of the 119 operations. The key goes in the X-API-KEY header,
# which the connection sets.
#
# Invoices and credit notes start as drafts. Drafts can be edited and deleted.
# Finalizing gives the document a legal number and locks it, so
# finalize_invoice, finalize_credit, send_* and mark_* are flagged destructive.
# check_invoice_e_invoicing and check_credit_e_invoicing run the e-invoicing
# validator without finalizing anything.
#
# List tools page with page_index and page_size. The page count and record
# count come back in the x-page-count and x-record-count response headers.
#
# Prices: send taxExcludedPrice or taxIncludedPrice. unitPrice is deprecated,
# and margin fields are worked out by the server, so neither is taken as input.
#
# Download and export tools return file content (PDF, Excel or CSV) unless an
# export is asked for as Json or Markdown.
#
# Not covered: POST /v1/ProductImages/{productId} and POST
# /v1/PurchaseInvoices/file (multipart file uploads), and GET /v1/Users/whoami
# (same as get_current_user).
#
# Docs: https://developer.altoviz.com/

connector_id: altoviz
display_name: Altoviz
docs_url: https://developer.altoviz.com/
tools:

  test_api_key:
    title: Test the API key
    description: >-
      Check that the API key works. Altoviz answers with a greeting.
    category: account
    read_only: true
    request:
      method: GET
      path: /Hello
      base_url_override: https://api.altoviz.com
    input: {}
    output:
      description: The greeting.
      type: string

  get_current_user:
    title: Get the current user
    description: >-
      Read the Altoviz user who owns the API key being used.
    category: account
    read_only: true
    request:
      method: GET
      path: /Users/me
    input: {}
    output:
      description: The user.
      type: object

  get_settings:
    title: Get settings
    description: >-
      Read the company settings: legal details, VAT settings and invoicing preferences.
    category: account
    read_only: true
    request:
      method: GET
      path: /Settings
    input: {}
    output:
      description: The settings.
      type: object

  list_units:
    title: List units
    description: >-
      List the units (hour, day, kg...) available for product and line quantities.
    category: reference
    read_only: true
    request:
      method: GET
      path: /Units
    input: {}
    output:
      description: The units.
      type: array
      items:
        type: object

  list_vat_rates:
