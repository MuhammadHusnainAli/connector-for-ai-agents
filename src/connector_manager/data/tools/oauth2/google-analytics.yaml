# Google Analytics 4 tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# Two APIs, because GA4 splits them: the **Data API** runs reports over a
# property's own data, and the **Admin API** manages the property itself.
#
#   * `run_report` is the workhorse -- dimensions, metrics, date ranges and
#     filters, returning rows. `run_realtime_report` covers the last 30 minutes,
#     `run_pivot_report` cross-tabulates, and `batch_run_reports` sends several
#     at once. `check_compatibility` says whether a dimension and metric can be
#     combined before a report fails on it;
#   * the Admin tools cover accounts, properties, data streams, custom
#     dimensions and metrics, conversion events, audiences, Google Ads links and
#     access bindings.
#
# A property is addressed as `properties/{propertyId}` throughout, not by a
# bare id, and the two APIs live on different hosts -- which is why each tool
# names the one it belongs to.
#
# Docs: https://developers.google.com/analytics/devguides/reporting/data/v1

connector_id: google-analytics
display_name: Google Analytics
docs_url: https://developers.google.com/analytics/devguides/reporting/data/v1/
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
  implies:
    analytics:
    - analytics.readonly
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  create_audience_export:
    title: Create audience export
    description: Creates an audience export for later retrieval. This method quickly returns the audience
      export's resource name and initiates a long running asynchronous request to form an audience export.
      To export the users in an audience export, first create the audience export through this method
      and then send the audience resource name to the QueryAudienceExport method. See Creating an Audience
      Export for an introduction to Aud
    category: properties
    request:
      method: POST
      path: /v1beta/${parent}/audienceExports
      base_url_override: https://analyticsdata.googleapis.com
      body:
        audience: ${audience}
        dimensions: ${dimensions}
    input:
      parent:
        type: string
        description: 'Required. The parent resource where this audience export will be created. Format:
          properties/{property}'
      audience:
        type: string
        description: 'Required. The audience resource name. This resource name identifies the audience
          being listed and is shared between the Analytics Data & Admin APIs. Format: properties/{property}/audiences/{audience}'
        optional: true
      dimensions:
        type: array
        items:
          type: string
        description: Required. The dimensions requested and displayed in the query response.
        optional: true
    output:
      description: The Operation resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
  get_audience_export:
    title: Get audience export
    description: Gets configuration metadata about a specific audience export. This method can be used
      to understand an audience export after it has been created. See Creating an Audience Export for
      an introduction to Audience Exports with examples. Audience Export APIs have some methods at alpha
      and other methods at beta stability. The intention is to advance methods to beta stability after
      some feedback and adoption. To give your f
    category: properties
    request:
      method: GET
      path: /v1beta/${name}
      base_url_override: https://analyticsdata.googleapis.com
    input:
      name:
        type: string
        description: 'Required. The audience export resource name. Format: properties/{property}/audienceExports/{audience_export}'
    output:
      description: The AudienceExport resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
    read_only: true
  list_audience_exports:
    title: List audience exports
    description: Lists all audience exports for a property. This method can be used for you to find and
      reuse existing audience exports rather than creating unnecessary new audience exports. The same
      audience can have multiple audience exports that represent the export of users that were in an audience
      on different days. See Creating an Audience Export for an introduction to Audience Exports with
      examples. Audience Export APIs have s
    category: properties
    request:
      method: GET
      path: /v1beta/${parent}/audienceExports
      base_url_override: https://analyticsdata.googleapis.com
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. All audience exports for this property will be listed in the response.
          Format: properties/{property}'
      page_size:
        type: integer
        description: Optional. The maximum number of audience exports to return. The service may return
          fewer than this value. If unspecified, at most 200 audience exports will be returned. The maximum
          value is 1000 (higher values will be coerced to the maximum).
        optional: true
      page_token:
        type: string
        description: Optional. A page token, received from a previous ListAudienceExports call. Provide
          this to retrieve the subsequent page. When paginating, all other parameters provided to ListAudienceExports
          must match the call that provided the page token.
        optional: true
    output:
      description: The ListAudienceExportsResponse resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
    read_only: true
  query_audience_export:
    title: Query audience export
    description: Retrieves an audience export of users. After creating an audience, the users are not
      immediately available for exporting. First, a request to CreateAudienceExport is necessary to create
      an audience export of users, and then second, this method is used to retrieve the users in the audience
      export. See Creating an Audience Export for an introduction to Audience Exports with examples. Audiences
      in Google Analytics 4 all
    category: properties
    request:
      method: POST
      path: /v1beta/${name}:query
      base_url_override: https://analyticsdata.googleapis.com
      body:
