# Azure Service Bus tools -- the namespace's own endpoint.
#
# Two very different APIs share the host `<namespace>.servicebus.windows.net`,
# and this pack covers both:
#
#   * the **runtime** API sends and receives messages. Paths are
#     `/{queue}/messages` and `/{topic}/subscriptions/{sub}/messages`, bodies
#     are the message content itself, and metadata travels in a
#     `BrokerProperties` header;
#   * the **management** API defines the entities. It speaks Atom XML over
#     `?api-version=2017-05`, so create_queue and friends send an XML document
#     and get one back. Parse the XML rather than expecting JSON.
#
# ## Receiving: two modes, and only one of them works well here
#
# Service Bus offers receive-and-delete (destructive: the message is gone the
# moment it is handed over) and peek-lock (the message is locked, and the
# receiver must later complete or abandon it using a lock token).
#
# The lock token arrives in the `BrokerProperties` RESPONSE HEADER, and this
# package surfaces response bodies rather than headers. So peek_lock_message
# will hand you the message content but not the token you need to complete it,
# and complete_message therefore only works when the token came from somewhere
# else -- another client, or a `Location` header captured outside this package.
#
# For an agent, **receive_and_delete_message is the tool that actually works
# end to end**. It is destructive by nature: if the caller crashes after
# receiving, the message is lost, because Service Bus has already dropped it.
# That trade-off is the price of not being able to read the lock token.
#
# ## Message properties
#
# `BrokerProperties` on a send is a JSON string in a header, not part of the
# body: message id, correlation id, label, session id, time to live, scheduled
# enqueue time. The body is whatever you put in it.
#
# ## Dead-letter queues
#
# Messages that exceed their delivery count or expire land in a queue's
# dead-letter sub-queue, addressed as `{queue}/$deadletterqueue` or
# `{topic}/subscriptions/{sub}/$deadletterqueue`. receive_and_delete_message
# reaches them by passing that path as the entity, which is how you inspect
# what a consumer has been failing on.
#
# The credential is a service principal with `https://servicebus.azure.net/.default`
# and needs an Azure RBAC data role -- Azure Service Bus Data Sender, Data
# Receiver or Data Owner -- so no tool declares scopes. Contributor on the
# namespace grants management access and no message access.
#
# Docs: https://learn.microsoft.com/rest/api/servicebus/

connector_id: azure-service-bus
display_name: Azure Service Bus
docs_url: https://learn.microsoft.com/rest/api/servicebus/

tools:

  # -- sending ---------------------------------------------------------------

  send_queue_message:
    title: Send a message to a queue
    description: >-
      Enqueue a message on a queue. The `body` goes on the wire as the message
      content -- JSON, text, whatever the consumer expects.

      `broker_properties` is a JSON STRING carrying the message's metadata, not
      an object: `{"MessageId":"abc","Label":"order.created","TimeToLive":3600}`.
      The fields worth knowing are `MessageId` (Service Bus deduplicates on it
      when the queue has duplicate detection on), `SessionId` (required on a
      session-enabled queue, and the message is rejected without it),
      `CorrelationId`, `Label` and `ScheduledEnqueueTimeUtc` for a delayed
      message.

      Custom application properties can be sent as additional headers, which
      this tool does not expose -- put them in the body instead.
    category: messaging
    notes: broker_properties is a JSON-encoded string in a header, not a JSON object in the body.
    request:
      method: POST
      path: /${queue_name}/messages
      headers:
        BrokerProperties: "${broker_properties}"
        content-type: "${content_type}"
      content: "${body}"
    input:
      queue_name:
        type: string
        description: The queue to send to.
        example: orders
      body:
        type: string
        description: The message content, as text.
        example: '{"orderId": 1001, "total": 42}'
      broker_properties:
        type: string
        description: >-
          Message metadata as a JSON-encoded string, e.g.
          {"MessageId":"abc","Label":"order.created","TimeToLive":3600}.
          SessionId is required on a session-enabled queue.
        optional: true
      content_type:
        type: string
        description: Content type of the body, recorded on the message.
        optional: true
        default: application/json
    output:
      description: Empty on success -- a 201 means the broker accepted the message.
      type: object

  send_topic_message:
    title: Publish a message to a topic
    description: >-
      Publish a message to a topic, from which Service Bus copies it to every
      subscription whose filter matches. Identical on the wire to
      send_queue_message; the difference is fan-out.

      A message published to a topic with no matching subscription is silently
      discarded -- there is no error and no dead letter. If a published message
      seems to vanish, list_subscriptions and the subscriptions' rules are where
      to look.
    category: messaging
    notes: A message matching no subscription filter is discarded silently.
    request:
      method: POST
      path: /${topic_name}/messages
      headers:
        BrokerProperties: "${broker_properties}"
        content-type: "${content_type}"
      content: "${body}"
    input:
      topic_name:
        type: string
        description: The topic to publish to.
        example: order-events
      body:
        type: string
        description: The message content, as text.
        example: '{"orderId": 1001, "event": "created"}'
      broker_properties:
        type: string
        description: >-
          Message metadata as a JSON-encoded string. Subscription filters can
          match on Label, CorrelationId and the rest of these.
        optional: true
      content_type:
        type: string
        description: Content type of the body, recorded on the message.
        optional: true
        default: application/json
    output:
      description: Empty on success -- a 201 means the broker accepted the message.
      type: object

  # -- receiving -------------------------------------------------------------

  receive_and_delete_queue_message:
    title: Receive and remove the next message from a queue
    description: >-
      Take the next message off a queue and delete it in the same operation. The
      response body is the message content.

      DESTRUCTIVE by design: the message is gone from Service Bus before you
      have processed it, so a failure afterwards loses it. That is the trade-off
      for a mode that works without a lock token -- see the pack notes on why
      peek-lock is awkward here.

      `timeout` is how many seconds to wait for a message before giving up; the
      call returns 204 with no body when the queue is empty. Reach the queue's
      failed messages by passing `orders/$deadletterqueue` as the queue name.
    category: messaging
    destructive: true
    notes: The message is deleted before the caller can process it. A crash afterwards loses it.
    request:
      method: DELETE
      path: /${queue_name}/messages/head
      query:
        timeout: "${timeout}"
    input:
      queue_name:
        type: string
        description: >-
          The queue to receive from. Append /$deadletterqueue to read the
          queue's dead-lettered messages instead.
        example: orders
      timeout:
        type: integer
        description: Seconds to wait for a message before returning 204.
        optional: true
        default: 60
        minimum: 1
        maximum: 300
    output:
      description: The message content, or nothing when the queue is empty.
      type: string

  receive_and_delete_subscription_message:
    title: Receive and remove the next message from a subscription
    description: >-
      Take the next message off a topic subscription and delete it. Same
      destructive semantics as receive_and_delete_queue_message: the message is
      gone whether or not the caller succeeds in handling it.

      Returns 204 with no body when the subscription has nothing waiting. Read
      the subscription's failures by passing `$deadletterqueue` as the
      subscription name suffix.
    category: messaging
    destructive: true
    notes: The message is deleted before the caller can process it.
    request:
      method: DELETE
      path: /${topic_name}/subscriptions/${subscription_name}/messages/head
      query:
        timeout: "${timeout}"
    input:
      topic_name:
        type: string
        description: The topic.
        example: order-events
      subscription_name:
        type: string
        description: >-
          The subscription to receive from. Append /$deadletterqueue to read its
          dead-lettered messages.
        example: billing
      timeout:
        type: integer
        description: Seconds to wait for a message before returning 204.
        optional: true
        default: 60
        minimum: 1
        maximum: 300
    output:
      description: The message content, or nothing when the subscription is empty.
      type: string

  peek_lock_queue_message:
    title: Lock the next message on a queue without deleting it
    description: >-
      Retrieve the next message and lock it for the queue's lock duration, so
      no other receiver gets it. The message stays on the queue until it is
      completed, abandoned, or its lock expires and it becomes available again
      -- which is the at-least-once delivery model.

      The catch on this connector: the lock token comes back in the
      `BrokerProperties` RESPONSE HEADER, and this package surfaces bodies
      rather than headers, so you get the message content but not the token
      complete_message needs. Unless the token is available from elsewhere,
      the practical effect is that the message is redelivered after the lock
      expires. Use receive_and_delete_queue_message for a workflow that has to
      complete end to end here.
    category: messaging
    notes: The lock token arrives in a response header this package does not surface. The message will be redelivered when the lock expires.
    request:
      method: POST
      path: /${queue_name}/messages/head
      query:
        timeout: "${timeout}"
      body: {}
    input:
      queue_name:
        type: string
        description: The queue to peek-lock from.
        example: orders
      timeout:
        type: integer
        description: Seconds to wait for a message before returning 204.
        optional: true
        default: 60
        minimum: 1
        maximum: 300
    output:
      description: The locked message's content. The lock token is in a response header, not here.
      type: string

  complete_message:
    title: Complete a locked message
    description: >-
      Finish processing a peek-locked message and remove it from the queue for
      good. Needs both the message's sequence number and its lock token, which
      Service Bus returned in the `BrokerProperties` header of the peek-lock
      response -- so this only works when that token reached you some other way,
      as the pack notes explain.

      Once completed, the message is gone.
    category: messaging
    destructive: true
    notes: Needs the lock token from a peek-lock response header, which this package does not surface.
    request:
      method: DELETE
      path: /${queue_name}/messages/${sequence_number}/${lock_token}
    input:
      queue_name:
        type: string
        description: >-
          The queue the message was locked on, or
          topic/subscriptions/name for a subscription.
        example: orders
      sequence_number:
        type: string
        description: The message's SequenceNumber from the peek-lock BrokerProperties.
      lock_token:
        type: string
        description: The message's LockToken from the peek-lock BrokerProperties.
    output:
      description: Empty on success.
      type: object

  unlock_message:
    title: Abandon a locked message
    description: >-
      Release the lock on a peek-locked message so it becomes available to other
      receivers immediately, instead of waiting for the lock to expire. The
      right move when processing failed and another consumer -- or the same one
      later -- should try again.

      Each abandon increments the message's delivery count, and once that passes
      the queue's `MaxDeliveryCount` the message is dead-lettered rather than
      redelivered.
    category: messaging
    notes: Increments the delivery count. Enough abandons and the message is dead-lettered.
    request:
      method: PUT
      path: /${queue_name}/messages/${sequence_number}/${lock_token}
      body: {}
    input:
      queue_name:
        type: string
        description: The queue the message was locked on.
        example: orders
      sequence_number:
        type: string
        description: The message's SequenceNumber from the peek-lock response.
      lock_token:
        type: string
        description: The message's LockToken from the peek-lock response.
    output:
      description: Empty on success.
      type: object

  renew_message_lock:
    title: Renew the lock on a message
    description: >-
      Extend a peek-locked message's lock by the queue's lock duration, for a
      consumer that needs longer to process it than the default 30 seconds.
      Without a renewal the lock expires and the message is handed to someone
      else, which is how the same work ends up being done twice.
    category: messaging
    request:
      method: POST
      path: /${queue_name}/messages/${sequence_number}/${lock_token}
      body: {}
    input:
      queue_name:
        type: string
        description: The queue the message was locked on.
        example: orders
      sequence_number:
        type: string
        description: The message's SequenceNumber from the peek-lock response.
      lock_token:
        type: string
        description: The message's LockToken from the peek-lock response.
    output:
      description: Empty on success; the lock's expiry moves out by the queue's lock duration.
      type: object

  # -- entity management (Atom XML) ------------------------------------------

  list_queues:
    title: List the namespace's queues
    description: >-
      Every queue in the namespace, as an Atom XML feed. Each entry carries the
      queue's `QueueDescription` -- lock duration, max size, duplicate detection,
      max delivery count, dead-lettering settings -- and its runtime counts,
      including `activeMessageCount` and `deadLetterMessageCount`.

      Those two counts are the whole reason to call this: a growing dead-letter
      count is the clearest signal that a consumer is failing.

      The response is XML, not JSON. Parse it rather than expecting an object.
    category: management
    read_only: true
    notes: Returns Atom XML, not JSON.
    request:
      method: GET
      path: /$Resources/Queues
      query:
        api-version: "${api_version}"
        $skip: "${skip}"
        $top: "${top}"
    input:
      skip:
        type: integer
        description: How many entries to skip, for paging.
        optional: true
        minimum: 0
      top:
        type: integer
        description: How many entries to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML feed of queues, with their configuration and message counts.
      type: string

  get_queue:
    title: Get a queue's configuration and message counts
    description: >-
      One queue as an Atom XML entry: its lock duration, maximum size, duplicate
      detection window, `MaxDeliveryCount`, whether dead-lettering on expiry is
      on, and the runtime `CountDetails` -- active, scheduled, dead-lettered and
      transferred message counts.

      `activeMessageCount` climbing with no consumer keeping up, or
      `deadLetterMessageCount` above zero, are the two numbers worth alerting
      on. Returns XML.
    category: management
    read_only: true
    notes: Returns Atom XML, not JSON.
    request:
      method: GET
      path: /${queue_name}
      query:
        api-version: "${api_version}"
    input:
      queue_name:
        type: string
        description: The queue name.
        example: orders
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML entry describing the queue and its message counts.
      type: string

  create_queue:
    title: Create or update a queue
    description: >-
      Create a queue from an Atom XML `QueueDescription`, or replace an existing
      one's configuration. The body is XML because that is what this API takes:

      `<entry xmlns="http://www.w3.org/2005/Atom"><content
      type="application/xml"><QueueDescription
      xmlns="http://schemas.microsoft.com/netservices/2010/10/servicebus/connect">
      <MaxDeliveryCount>10</MaxDeliveryCount></QueueDescription></content></entry>`

      Several properties cannot be changed after creation --
      `RequiresSession`, `RequiresDuplicateDetection` and
      `EnablePartitioning` among them -- so a PUT that tries to change one
      fails rather than recreating the queue.
    category: management
    notes: Takes an Atom XML body. Session and partitioning settings cannot be changed after creation.
    request:
      method: PUT
      path: /${queue_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/atom+xml;type=entry;charset=utf-8
      content: "${queue_description_xml}"
    input:
      queue_name:
        type: string
        description: The queue name.
        example: orders
      queue_description_xml:
        type: string
        description: >-
          The Atom XML entry wrapping a QueueDescription. An empty
          QueueDescription creates a queue with every default.
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML entry describing the queue as created.
      type: string

  delete_queue:
    title: Delete a queue
    description: >-
      Destroy a queue along with every message still in it, active and
      dead-lettered alike. Irreversible -- Service Bus has no recycle bin, and
      messages are not recoverable.

      Call get_queue first: a non-zero `activeMessageCount` means work is about
      to be thrown away.
    category: management
    destructive: true
    notes: Discards every message in the queue, including dead-lettered ones.
    request:
      method: DELETE
      path: /${queue_name}
      query:
        api-version: "${api_version}"
    input:
      queue_name:
        type: string
        description: The queue to destroy, with everything in it.
        example: scratch-queue
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: Empty on success.
      type: object

  list_topics:
    title: List the namespace's topics
    description: >-
      Every topic in the namespace as an Atom XML feed, each with its
      configuration and its subscription count. Topics fan messages out to
      subscriptions, so a topic on its own says little -- pair this with
      list_subscriptions.
    category: management
    read_only: true
    notes: Returns Atom XML, not JSON.
    request:
      method: GET
      path: /$Resources/Topics
      query:
        api-version: "${api_version}"
        $skip: "${skip}"
        $top: "${top}"
    input:
      skip:
        type: integer
        description: How many entries to skip, for paging.
        optional: true
        minimum: 0
      top:
        type: integer
        description: How many entries to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML feed of topics.
      type: string

  create_topic:
    title: Create or update a topic
    description: >-
      Create a topic from an Atom XML `TopicDescription`, or replace an existing
      one's configuration. Same XML shape as create_queue, with
      `TopicDescription` in place of `QueueDescription`.

      A topic with no subscriptions accepts messages and discards them, so
      create the subscriptions before publishing.
    category: management
    notes: Takes an Atom XML body. A topic with no subscriptions silently discards what is published to it.
    request:
      method: PUT
      path: /${topic_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/atom+xml;type=entry;charset=utf-8
      content: "${topic_description_xml}"
    input:
      topic_name:
        type: string
        description: The topic name.
        example: order-events
      topic_description_xml:
        type: string
        description: The Atom XML entry wrapping a TopicDescription.
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML entry describing the topic as created.
      type: string

  delete_topic:
    title: Delete a topic
    description: >-
      Destroy a topic, every subscription under it and every message waiting in
      those subscriptions. Irreversible, and wider than it looks -- each
      subscription is a separate consumer that stops receiving.
    category: management
    destructive: true
    notes: Deletes every subscription under the topic and the messages waiting in them.
    request:
      method: DELETE
      path: /${topic_name}
      query:
        api-version: "${api_version}"
    input:
      topic_name:
        type: string
        description: The topic to destroy, with all its subscriptions.
        example: scratch-topic
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: Empty on success.
      type: object

  list_subscriptions:
    title: List a topic's subscriptions
    description: >-
      Every subscription on a topic, as Atom XML, each with its message counts,
      max delivery count and dead-lettering settings. This is where to look when
      a published message did not reach a consumer: either the subscription does
      not exist, or its rules did not match.
    category: management
    read_only: true
    notes: Returns Atom XML, not JSON.
    request:
      method: GET
      path: /${topic_name}/Subscriptions
      query:
        api-version: "${api_version}"
        $skip: "${skip}"
        $top: "${top}"
    input:
      topic_name:
        type: string
        description: The topic.
        example: order-events
      skip:
        type: integer
        description: How many entries to skip.
        optional: true
        minimum: 0
      top:
        type: integer
        description: How many entries to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML feed of the topic's subscriptions.
      type: string

  create_subscription:
    title: Create or update a subscription
    description: >-
      Create a subscription on a topic from an Atom XML
      `SubscriptionDescription`. A new subscription starts with a default rule
      that matches everything, so it receives every message published to the
      topic until a narrower rule replaces it -- list_subscription_rules shows
      what is actually in place.

      Only messages published AFTER the subscription exists reach it; creating
      one does not backfill.
    category: management
    notes: Takes an Atom XML body. New subscriptions match everything until a filter rule is added.
    request:
      method: PUT
      path: /${topic_name}/Subscriptions/${subscription_name}
      query:
        api-version: "${api_version}"
      headers:
        content-type: application/atom+xml;type=entry;charset=utf-8
      content: "${subscription_description_xml}"
    input:
      topic_name:
        type: string
        description: The topic to subscribe to.
        example: order-events
      subscription_name:
        type: string
        description: The subscription name.
        example: billing
      subscription_description_xml:
        type: string
        description: The Atom XML entry wrapping a SubscriptionDescription.
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML entry describing the subscription as created.
      type: string

  delete_subscription:
    title: Delete a subscription
    description: >-
      Remove a subscription and every message waiting in it. The topic and its
      other subscriptions are unaffected. Irreversible -- the messages are not
      recoverable, and the consumer behind the subscription stops receiving
      immediately.
    category: management
    destructive: true
    request:
      method: DELETE
      path: /${topic_name}/Subscriptions/${subscription_name}
      query:
        api-version: "${api_version}"
    input:
      topic_name:
        type: string
        description: The topic.
        example: order-events
      subscription_name:
        type: string
        description: The subscription to delete, with everything waiting in it.
        example: billing
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: Empty on success.
      type: object

  list_subscription_rules:
    title: List a subscription's filter rules
    description: >-
      The rules deciding which of a topic's messages reach a subscription, as
      Atom XML. Each rule has a filter -- a SQL expression over the message's
      system and application properties, or a correlation filter -- and
      optionally an action that rewrites properties.

      This is the answer to "the message was published but the subscriber never
      saw it": either no rule matched, or the default match-everything rule was
      replaced by something narrower than intended.
    category: management
    read_only: true
    notes: Returns Atom XML, not JSON.
    request:
      method: GET
      path: /${topic_name}/Subscriptions/${subscription_name}/Rules
      query:
        api-version: "${api_version}"
    input:
      topic_name:
        type: string
        description: The topic.
        example: order-events
      subscription_name:
        type: string
        description: The subscription.
        example: billing
      api_version:
        type: string
        description: Service Bus management API version.
        optional: true
        default: "2017-05"
    output:
      description: An Atom XML feed of the subscription's rules and their filters.
      type: string
