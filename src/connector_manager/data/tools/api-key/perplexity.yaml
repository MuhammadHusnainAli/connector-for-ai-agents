  get_computer_usage_analytics:
    title: Usage Analytics
    description: 'Usage Analytics Returns your organization''s Perplexity usage analytics as a bucketed
      time series for a single dataset. Requires an organization analytics API key, generated by an org
      admin from Settings → Organization → Computer in the Perplexity web app. Only complete UTC grid
      buckets are returned: starttime snaps Calls GET /v1/analytics/computer/usage on the provider''s
      API.'
    category: analytics
    request:
      method: GET
      path: /v1/analytics/computer/usage
      query:
        dataset: ${dataset}
        start_time: ${start_time}
        end_time: ${end_time}
        bucket_width: ${bucket_width}
        limit: ${limit}
        page: ${page}
        user_email: ${user_email}
    input:
      dataset:
        type: string
        description: 'The dataset to query. queryvolume and dailyactiveusers are daily organization-level
          datasets: they reject bucketwidth=1h and useremail.'
        enum:
        - credit_usage
        - connectors
        - artifacts
        - skills
        - spaces
        - workflows
        - task_durations
        - query_volume
        - daily_active_users
      start_time:
        type: integer
        description: Window start in unix seconds (UTC), inclusive. Snapped down to the bucket grid, so
          the first bucket can include usage from before this time.
      end_time:
        type: integer
        description: Window end in unix seconds (UTC), exclusive. Defaults to now; future values are capped
          at now. The window may span at most 90 days.
        optional: true
      bucket_width:
        type: string
        description: Bucket size. Buckets align to the UTC grid. Not accepted as 1h for queryvolume or
          dailyactiveusers, which are stored at day grain.
        optional: true
        enum:
        - 1d
        - 1h
        default: 1d
      limit:
        type: integer
        description: 'Buckets per page. 1d: default 7, max 31. 1h: default 24, max 168.'
        optional: true
      page:
        type: string
        description: Opaque pagination cursor from a previous response's nextpage. Valid only with the
          same query parameters it was issued for.
        optional: true
      user_email:
        type: string
        description: Restrict results to a single member of your organization. Emails that don't match
          a current member return a generic 400. Not available for queryvolume or dailyactiveusers, which
          are aggregated per organization; use the v2 endpoint for per-member query volume.
        optional: true
    output:
      description: Bucketed usage for the requested window. Buckets without data carry count 0; the analytics
        store syncs periodically, so a zero in a recent bucket can mean the data hasn't synced yet.
      type: object
    read_only: true
  get_computer_usage_analytics_v2:
    title: Usage Analytics per Member
    description: Usage Analytics per Member Returns your organization's Perplexity usage broken down per
      member, as daily buckets. Each day lists one row per member with usage that day, keyed by email.
      creditusage carries the same Model and Credit Source breakdown as v1; queryvolume carries Feature,
      Project and Comet. Uses the same organizati Calls GET /v2/analytics/computer/usage on the provider's
      API.
    category: analytics
    request:
      method: GET
      path: /v2/analytics/computer/usage
      query:
        dataset: ${dataset}
        group_by: ${group_by}
        start_time: ${start_time}
        end_time: ${end_time}
        limit: ${limit}
        page: ${page}
    input:
      dataset:
        type: string
        description: The dataset to query. queryvolume at this grain carries Feature, Project and Comet
          breakdowns, but not Model or Model Family.
        enum:
        - credit_usage
        - query_volume
      group_by:
        type: string
        description: The dimension to group each day's usage by. useremail is currently the only supported
          value.
        enum:
        - user_email
      start_time:
        type: integer
        description: Window start in unix seconds (UTC), inclusive. Snapped down to the day grid, so the
          first day can include usage from before this time.
      end_time:
        type: integer
        description: Window end in unix seconds (UTC), exclusive. Defaults to now; future values are capped
          at now. The window may span at most 90 days.
        optional: true
      limit:
        type: integer
        description: Member rows per page. Default 50, max 100. A page can span multiple days.
        optional: true
      page:
        type: string
        description: Opaque pagination cursor from a previous response's nextpage. Valid only with the
          same query parameters it was issued for.
        optional: true
    output:
      description: Per-member daily usage for the requested window. Days with no attributable usage are
        omitted; the analytics store syncs periodically, so recent days may not yet be present.
      type: object
    read_only: true
