# Google Cloud Storage tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# The complete JSON API: buckets, objects, their access control lists, HMAC
# keys, notifications, anywhere caches, folders, managed folders, operations
# and the project service account.
#
# Worth knowing:
#
#   * this is the JSON metadata API. Reading or writing an object's *bytes*
#     goes through the media endpoints (`alt=media` on a get, the upload host
#     on a write), which is a different shape from the metadata calls here;
#   * deleting a bucket requires it to be empty first, and object deletes are
#     permanent unless the bucket has versioning or a retention policy;
#   * `list_object` takes `prefix` and `delimiter`, which is how the flat
#     object namespace is browsed as though it had folders.
#
# Docs: https://cloud.google.com/storage/docs/json_api/v1

connector_id: google-cloud-storage
display_name: Google Cloud Storage
docs_url: https://developers.google.com/storage/docs/json_api/
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  disable_anywhere_cach:
    title: Disable anywhere cach
    description: Disables an Anywhere Cache instance. Calls anywhereCaches.disable on the Cloud Storage
      JSON API.
    category: anywhere_caches
    request:
      method: POST
      path: /storage/v1/b/${bucket}/anywhereCaches/${anywhere_cache_id}/disable
    input:
      anywhere_cache_id:
        type: string
        description: The ID of requested Anywhere Cache instance.
      bucket:
        type: string
        description: Name of the parent bucket.
    output:
      description: The AnywhereCache resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  get_anywhere_cach:
    title: Get anywhere cach
    description: Returns the metadata of an Anywhere Cache instance.
    category: anywhere_caches
    request:
      method: GET
      path: /storage/v1/b/${bucket}/anywhereCaches/${anywhere_cache_id}
    input:
      anywhere_cache_id:
        type: string
        description: The ID of requested Anywhere Cache instance.
      bucket:
        type: string
        description: Name of the parent bucket.
    output:
      description: The AnywhereCache resource.
      type: object
    scopes_any:
    - cloud-platform
    - cloud-platform.read-only
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
    read_only: true
  create_anywhere_cach:
    title: Create anywhere cach
    description: Creates an Anywhere Cache instance. Calls anywhereCaches.insert on the Cloud Storage
      JSON API.
    category: anywhere_caches
    request:
      method: POST
      path: /storage/v1/b/${bucket}/anywhereCaches
      body:
        selfLink: ${self_link}
        bucket: ${body_bucket}
        anywhereCacheId: ${anywhere_cache_id}
        zone: ${zone}
        state: ${state}
        createTime: ${create_time}
        updateTime: ${update_time}
        ttl: ${ttl}
        admissionPolicy: ${admission_policy}
        pendingUpdate: ${pending_update}
        ingestOnWrite: ${ingest_on_write}
    input:
      bucket:
        type: string
        description: Name of the parent bucket.
      self_link:
        type: string
        description: The link to this cache instance.
        optional: true
      body_bucket:
        type: string
        description: The name of the bucket containing this cache instance.
        optional: true
      anywhere_cache_id:
        type: string
        description: The ID of the Anywhere cache instance.
        optional: true
      zone:
        type: string
        description: The zone in which the cache instance is running. For example, us-central1-a.
        optional: true
      state:
        type: string
        description: The current state of the cache instance.
        optional: true
      create_time:
        type: string
        description: The creation time of the cache instance in RFC 3339 format.
        optional: true
      update_time:
        type: string
        description: The modification time of the cache instance metadata in RFC 3339 format.
        optional: true
      ttl:
        type: string
        description: The TTL of all cache entries in whole seconds. e.g., "7200s".
        optional: true
      admission_policy:
        type: string
        description: The cache-level entry admission policy.
        optional: true
      pending_update:
        type: boolean
        description: True if the cache instance has an active Update long-running operation.
        optional: true
      ingest_on_write:
        type: boolean
        description: Specifies whether objects are ingested into the cache upon write.
        optional: true
    output:
      description: The GoogleLongrunningOperation resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  list_anywhere_caches:
    title: List anywhere caches
    description: Returns a list of Anywhere Cache instances of the bucket matching the criteria.
    category: anywhere_caches
    request:
      method: GET
      path: /storage/v1/b/${bucket}/anywhereCaches
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      bucket:
        type: string
        description: Name of the parent bucket.
      page_size:
        type: integer
        description: Maximum number of items to return in a single page of responses. Maximum 1000.
        optional: true
      page_token:
        type: string
        description: A previously-returned page token representing part of the larger set of results to
          view.
        optional: true
    output:
      description: The AnywhereCaches resource.
      type: object
    scopes_any:
    - cloud-platform
    - cloud-platform.read-only
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
    read_only: true
  pause_anywhere_cach:
    title: Pause anywhere cach
    description: Pauses an Anywhere Cache instance. Calls anywhereCaches.pause on the Cloud Storage JSON
      API.
    category: anywhere_caches
    request:
      method: POST
      path: /storage/v1/b/${bucket}/anywhereCaches/${anywhere_cache_id}/pause
    input:
      anywhere_cache_id:
        type: string
        description: The ID of requested Anywhere Cache instance.
      bucket:
        type: string
        description: Name of the parent bucket.
    output:
      description: The AnywhereCache resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  resume_anywhere_cach:
    title: Resume anywhere cach
    description: Resumes a paused or disabled Anywhere Cache instance.
    category: anywhere_caches
    request:
      method: POST
      path: /storage/v1/b/${bucket}/anywhereCaches/${anywhere_cache_id}/resume
    input:
      anywhere_cache_id:
        type: string
        description: The ID of requested Anywhere Cache instance.
      bucket:
        type: string
        description: Name of the parent bucket.
    output:
      description: The AnywhereCache resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  replace_anywhere_cach:
    title: Replace anywhere cach
    description: Updates the config of an Anywhere Cache instance.
    category: anywhere_caches
    request:
      method: PATCH
      path: /storage/v1/b/${bucket}/anywhereCaches/${anywhere_cache_id}
      body:
        selfLink: ${self_link}
        bucket: ${body_bucket}
        anywhereCacheId: ${body_anywhere_cache_id}
        zone: ${zone}
        state: ${state}
        createTime: ${create_time}
        updateTime: ${update_time}
        ttl: ${ttl}
        admissionPolicy: ${admission_policy}
        pendingUpdate: ${pending_update}
        ingestOnWrite: ${ingest_on_write}
    input:
      anywhere_cache_id:
        type: string
        description: The ID of requested Anywhere Cache instance.
      bucket:
        type: string
        description: Name of the parent bucket.
      self_link:
        type: string
        description: The link to this cache instance.
        optional: true
      body_bucket:
        type: string
        description: The name of the bucket containing this cache instance.
        optional: true
      body_anywhere_cache_id:
        type: string
        description: The ID of the Anywhere cache instance.
        optional: true
      zone:
        type: string
        description: The zone in which the cache instance is running. For example, us-central1-a.
        optional: true
      state:
        type: string
        description: The current state of the cache instance.
        optional: true
      create_time:
        type: string
        description: The creation time of the cache instance in RFC 3339 format.
        optional: true
      update_time:
        type: string
        description: The modification time of the cache instance metadata in RFC 3339 format.
        optional: true
      ttl:
        type: string
        description: The TTL of all cache entries in whole seconds. e.g., "7200s".
        optional: true
      admission_policy:
        type: string
        description: The cache-level entry admission policy.
        optional: true
      pending_update:
        type: boolean
        description: True if the cache instance has an active Update long-running operation.
        optional: true
      ingest_on_write:
        type: boolean
        description: Specifies whether objects are ingested into the cache upon write.
        optional: true
    output:
      description: The GoogleLongrunningOperation resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  delete_bucket_access_control:
    title: Delete bucket access control
    description: Permanently deletes the ACL entry for the specified entity on the specified bucket.
    category: bucket_access_controls
    request:
      method: DELETE
      path: /storage/v1/b/${bucket}/acl/${entity}
      query:
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      entity:
        type: string
        description: The entity holding the permission. Can be user-userId, user-emailAddress, group-groupId,
          group-emailAddress, allUsers, or allAuthenticatedUsers.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    destructive: true
  get_bucket_access_control:
    title: Get bucket access control
    description: Returns the ACL entry for the specified entity on the specified bucket.
    category: bucket_access_controls
    request:
      method: GET
      path: /storage/v1/b/${bucket}/acl/${entity}
      query:
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      entity:
        type: string
        description: The entity holding the permission. Can be user-userId, user-emailAddress, group-groupId,
          group-emailAddress, allUsers, or allAuthenticatedUsers.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: The BucketAccessControl resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    read_only: true
  create_bucket_access_control:
    title: Create bucket access control
    description: Creates a new ACL entry on the specified bucket.
    category: bucket_access_controls
    request:
      method: POST
      path: /storage/v1/b/${bucket}/acl
      query:
        userProject: ${user_project}
      body:
        bucket: ${body_bucket}
        domain: ${domain}
        email: ${email}
        entity: ${entity}
        entityId: ${entity_id}
        projectTeam: ${project_team}
        role: ${role}
        selfLink: ${self_link}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
      body_bucket:
        type: string
        description: The name of the bucket.
        optional: true
      domain:
        type: string
        description: The domain associated with the entity, if any.
        optional: true
      email:
        type: string
        description: The email address associated with the entity, if any.
        optional: true
      entity:
        type: string
        description: 'The entity holding the permission, in one of the following forms: - user-userId
          - user-email - group-groupId - group-email - domain-domain - project-team-projectId - allUsers
          - allAuthenticatedUsers Examples: - The user liz@example.com would be user-liz@example.com.
          - The group example@googlegroups.'
        optional: true
      entity_id:
        type: string
        description: The ID for the entity, if any.
        optional: true
      project_team:
        type: object
        description: The project team associated with the entity, if any.
        optional: true
      role:
        type: string
        description: The access permission for the entity.
        optional: true
      self_link:
        type: string
        description: The link to this access-control entry.
        optional: true
    output:
      description: The BucketAccessControl resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
  list_bucket_access_controls:
    title: List bucket access controls
    description: Retrieves ACL entries on the specified bucket.
    category: bucket_access_controls
    request:
      method: GET
      path: /storage/v1/b/${bucket}/acl
      query:
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: The BucketAccessControls resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    read_only: true
  update_bucket_access_control:
    title: Update bucket access control
    description: Patches an ACL entry on the specified bucket.
    category: bucket_access_controls
    request:
      method: PATCH
      path: /storage/v1/b/${bucket}/acl/${entity}
      query:
        userProject: ${user_project}
      body:
        bucket: ${body_bucket}
        domain: ${domain}
        email: ${email}
        entity: ${body_entity}
        entityId: ${entity_id}
        projectTeam: ${project_team}
        role: ${role}
        selfLink: ${self_link}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      entity:
        type: string
        description: The entity holding the permission. Can be user-userId, user-emailAddress, group-groupId,
          group-emailAddress, allUsers, or allAuthenticatedUsers.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
      body_bucket:
        type: string
        description: The name of the bucket.
        optional: true
      domain:
        type: string
        description: The domain associated with the entity, if any.
        optional: true
      email:
        type: string
        description: The email address associated with the entity, if any.
        optional: true
      body_entity:
        type: string
        description: 'The entity holding the permission, in one of the following forms: - user-userId
          - user-email - group-groupId - group-email - domain-domain - project-team-projectId - allUsers
          - allAuthenticatedUsers Examples: - The user liz@example.com would be user-liz@example.com.
          - The group example@googlegroups.'
        optional: true
      entity_id:
        type: string
        description: The ID for the entity, if any.
        optional: true
      project_team:
        type: object
        description: The project team associated with the entity, if any.
        optional: true
      role:
        type: string
        description: The access permission for the entity.
        optional: true
      self_link:
        type: string
        description: The link to this access-control entry.
        optional: true
    output:
      description: The BucketAccessControl resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
  replace_bucket_access_control:
    title: Replace bucket access control
    description: Updates an ACL entry on the specified bucket.
    category: bucket_access_controls
    request:
      method: PUT
      path: /storage/v1/b/${bucket}/acl/${entity}
      query:
        userProject: ${user_project}
      body:
        bucket: ${body_bucket}
        domain: ${domain}
        email: ${email}
        entity: ${body_entity}
        entityId: ${entity_id}
        projectTeam: ${project_team}
        role: ${role}
        selfLink: ${self_link}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      entity:
        type: string
        description: The entity holding the permission. Can be user-userId, user-emailAddress, group-groupId,
          group-emailAddress, allUsers, or allAuthenticatedUsers.
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
      body_bucket:
        type: string
        description: The name of the bucket.
        optional: true
      domain:
        type: string
        description: The domain associated with the entity, if any.
        optional: true
      email:
        type: string
        description: The email address associated with the entity, if any.
        optional: true
      body_entity:
        type: string
        description: 'The entity holding the permission, in one of the following forms: - user-userId
          - user-email - group-groupId - group-email - domain-domain - project-team-projectId - allUsers
          - allAuthenticatedUsers Examples: - The user liz@example.com would be user-liz@example.com.
          - The group example@googlegroups.'
        optional: true
      entity_id:
        type: string
        description: The ID for the entity, if any.
        optional: true
      project_team:
        type: object
        description: The project team associated with the entity, if any.
        optional: true
      role:
        type: string
        description: The access permission for the entity.
        optional: true
      self_link:
        type: string
        description: The link to this access-control entry.
        optional: true
    output:
      description: The BucketAccessControl resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
  delete_bucket:
    title: Delete bucket
    description: Deletes an empty bucket. Deletions are permanent unless soft delete is enabled on the
      bucket.
    category: buckets
    request:
      method: DELETE
      path: /storage/v1/b/${bucket}
      query:
        ifMetagenerationMatch: ${if_metageneration_match}
        ifMetagenerationNotMatch: ${if_metageneration_not_match}
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      if_metageneration_match:
        type: string
        description: If set, only deletes the bucket if its metageneration matches this value.
        optional: true
      if_metageneration_not_match:
        type: string
        description: If set, only deletes the bucket if its metageneration does not match this value.
        optional: true
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
    destructive: true
  get_bucket:
    title: Get bucket
    description: Returns metadata for the specified bucket.
    category: buckets
    request:
      method: GET
      path: /storage/v1/b/${bucket}
      query:
        generation: ${generation}
        ifMetagenerationMatch: ${if_metageneration_match}
        ifMetagenerationNotMatch: ${if_metageneration_not_match}
        projection: ${projection}
        softDeleted: ${soft_deleted}
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      generation:
        type: string
        description: If present, specifies the generation of the bucket. This is required if softDeleted
          is true.
        optional: true
      if_metageneration_match:
        type: string
        description: Makes the return of the bucket metadata conditional on whether the bucket's current
          metageneration matches the given value.
        optional: true
      if_metageneration_not_match:
        type: string
        description: Makes the return of the bucket metadata conditional on whether the bucket's current
          metageneration does not match the given value.
        optional: true
      projection:
        type: string
        description: Set of properties to return. Defaults to noAcl.
        optional: true
        enum:
        - full
        - noAcl
      soft_deleted:
        type: boolean
        description: If true, return the soft-deleted version of this bucket. The default is false. For
          more information, see Soft Delete.
        optional: true
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: The Bucket resource.
      type: object
    scopes_any:
    - cloud-platform
    - cloud-platform.read-only
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
    read_only: true
  get_iam_policy_bucket:
    title: Get iam policy bucket
    description: Returns an IAM policy for the specified bucket.
    category: buckets
    request:
      method: GET
      path: /storage/v1/b/${bucket}/iam
      query:
        optionsRequestedPolicyVersion: ${options_requested_policy_version}
        userProject: ${user_project}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      options_requested_policy_version:
        type: integer
        description: The IAM policy format version to be returned. If the optionsRequestedPolicyVersion
          is for an older version that doesn't support part of the requested IAM policy, the request fails.
        optional: true
      user_project:
        type: string
        description: The project to be billed for this request. Required for Requester Pays buckets.
        optional: true
    output:
      description: The Policy resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    read_only: true
  get_storage_layout_bucket:
    title: Get storage layout bucket
    description: Returns the storage layout configuration for the specified bucket. Note that this operation
      requires storage.objects.list permission.
    category: buckets
    request:
      method: GET
      path: /storage/v1/b/${bucket}/storageLayout
      query:
        prefix: ${prefix}
    input:
      bucket:
        type: string
        description: Name of a bucket.
      prefix:
        type: string
        description: An optional prefix used for permission check. It is useful when the caller only has
          storage.objects.list permission under a specific prefix.
        optional: true
    output:
      description: The BucketStorageLayout resource.
      type: object
    scopes_any:
    - cloud-platform
    - cloud-platform.read-only
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
    read_only: true
  create_bucket:
    title: Create bucket
    description: Creates a new bucket. Calls buckets.insert on the Cloud Storage JSON API.
    category: buckets
    request:
      method: POST
      path: /storage/v1/b
      query:
        enableObjectRetention: ${enable_object_retention}
        predefinedAcl: ${predefined_acl}
        predefinedDefaultObjectAcl: ${predefined_default_object_acl}
        project: ${project}
        projection: ${projection}
        userProject: ${user_project}
      body: ${body}
    input:
      enable_object_retention:
        type: boolean
        description: When set to true, object retention is enabled for this bucket.
        optional: true
        default: false
      predefined_acl:
        type: string
        description: Apply a predefined set of access controls to this bucket.
        optional: true
        enum:
        - authenticatedRead
        - private
        - projectPrivate
        - publicRead
        - publicReadWrite
      predefined_default_object_acl:
        type: string
        description: Apply a predefined set of default object access controls to this bucket.
        optional: true
        enum:
        - authenticatedRead
        - bucketOwnerFullControl
        - bucketOwnerRead
        - private
        - projectPrivate
        - publicRead
      project:
        type: string
        description: A valid API project identifier.
      projection:
        type: string
        description: Set of properties to return. Defaults to noAcl, unless the bucket resource specifies
          acl or defaultObjectAcl properties, when it defaults to full.
        optional: true
        enum:
        - full
        - noAcl
      user_project:
        type: string
        description: The project to be billed for this request.
        optional: true
      body:
        type: object
        description: The Bucket resource, as the API's own reference defines it.
    output:
      description: The Bucket resource.
      type: object
    scopes_any:
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_write
  list_buckets:
    title: List buckets
    description: Retrieves a list of buckets for a given project.
    category: buckets
    request:
      method: GET
      path: /storage/v1/b
      query:
        maxResults: ${max_results}
        pageToken: ${page_token}
        prefix: ${prefix}
        project: ${project}
        projection: ${projection}
        returnPartialSuccess: ${return_partial_success}
        softDeleted: ${soft_deleted}
        userProject: ${user_project}
    input:
      max_results:
        type: integer
        description: Maximum number of buckets to return in a single response. The service will use this
          parameter or 1,000 items, whichever is smaller.
        optional: true
        default: 1000
      page_token:
        type: string
        description: A previously-returned page token representing part of the larger set of results to
          view.
        optional: true
      prefix:
        type: string
