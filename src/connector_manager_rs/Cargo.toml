[package]
name = "connector-for-ai-agents"
version = "0.2.6"
edition = "2024"
rust-version = "1.85"
description = "2,000+ API connectors for Rust and AI agents: catalogue, auth field schemas, connection management with token exchange and request signing, plus scope-aware tools per connector. Sync and async."
license-file = "../../LICENSE"
repository = "https://github.com/MuhammadHusnainAli/connector-for-ai-agents"
readme = "../../RUST.md"
keywords = ["connectors", "oauth2", "api", "ai-agents", "tools"]
categories = ["api-bindings", "authentication", "web-programming::http-client"]

[lib]
# Imported as `connector_manager`, the same name as the Python package.
name = "connector_manager"
path = "src/lib.rs"

[[bin]]
name = "connectors"
path = "src/bin/connectors.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.1"
hex = "0.4.3"
hmac = "0.13.0"
include_dir = "0.7.4"
jsonwebtoken = "9"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["bundled"]
# Compile the shared data directory (catalogue, tool packs, icons) into the binary.
bundled = []
