# Datadog (OAuth) tools -- metrics, monitors, logs, APM, incidents and cost.
#
# This is the OAuth2 form of the Datadog connector: same host, same paths and
# the same surface as the `datadog` connector, differing only in how the
# request is authorised.
#
# The connection's base url already ends in `/api`, so every path here starts
# with its version: `/v1/monitor`, `/v2/logs/events/search`. Both versions are
# current and neither supersedes the other -- Datadog adds new surfaces under
# v2 while monitors, dashboards, SLOs and the hosts API stay on v1 -- so the
# mix below is the API's own, not an accident.
#
# Five things shape almost every call:
#
#   * **the OAuth scopes decide what works.** This connector authorises with
#     an OAuth2 token rather than an API/application key pair, and Datadog
#     scopes each product separately -- `monitors_read`, `dashboards_write`,
#     `logs_read_data` and so on. A 403 from one tool means that scope was not
#     granted at authorisation time, not that the connection is broken, and
#     fixing it means re-authorising rather than retrying. Note also that the
#     intake endpoints (`submit_metrics`, `submit_logs`, `submit_service_check`)
#     expect an API key on Datadog's side and may not accept an OAuth token at
#     all;
#   * **the site matters.** `datadoghq.com`, `datadoghq.eu`, `us3`, `us5`,
#     `ap1` and `ddog-gov.com` are separate deployments with separate data. The
#     connection's site parameter picks one, and an id from another site simply
#     does not exist here;
#   * **v1 times are Unix seconds, v2 times are ISO 8601.** `query_metrics`
#     takes `from`/`to` as epoch seconds; the v2 search endpoints take
#     timestamps or relative strings like `now-15m`. Mixing them up is the most
#     common reason a query returns nothing;
#   * **search endpoints have a GET and a POST form.** The POST takes the full
#     filter, sort and paging options and is what anything non-trivial should
#     use; the GET is for a quick one-off. Page with the cursor the response
#     returns, not with an offset;
#   * **aggregate rather than page.** `aggregate_logs`, `aggregate_spans` and
#     `query_scalar` compute counts and percentiles server-side. Paging every
#     matching event to count it is slower, costlier and often hits a limit
#     first.
#
# Several tools here reach real people or real money and are marked destructive
# for that reason: `create_incident` declares an org-visible incident and pages
# whoever the rules say; `create_pagerduty_service` and
# `create_slack_channel` wire alerts to a phone and a channel;
# `create_downtime` and `mute_host` stop alerts being delivered at all, which
# is how an outage goes unnoticed; and `create_metric_tag_configuration`
# multiplies custom-metric cardinality, which is billed.
#
# The five raw request tools at the end cover the rest of the API -- roughly
# 1,700 operations across 160 products, of which this pack names the
# operations an agent actually drives.
#
# Docs: https://docs.datadoghq.com/api/latest/

connector_id: datadog-oauth
display_name: Datadog (OAuth)
docs_url: https://docs.datadoghq.com/api/latest/

tools:

  check_connection:
    title: Validate API and application keys
    description: >-
      Validate the API key this connection holds. The connector's own
      verification endpoint and the cheapest call that proves the credential
      works -- note it checks only the API key, so a request that then fails
      on a read is usually a missing or wrong *application* key.
    category: connection
    read_only: true
    request:
      method: GET
      path: /v2/validate_keys
    output:
      description: The requested record.
      type: object

  get_current_user:
    title: Get current user
    description: >-
      The user the application key belongs to, with their roles. Says whose
      permissions every read on this connection is actually running under.
    category: users
    read_only: true
    request:
      method: GET
      path: /v2/current_user
    output:
      description: The requested record.
      type: object

  list_active_metrics:
    title: Get active metrics list
    description: >-
      Get the list of actively reporting metrics from a given time until now.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v1/metrics
      query:
        from: "${from}"
        host: "${host}"
        tag_filter: "${tag_filter}"
    input:
      from:
        type: integer
        description: Seconds since the Unix epoch.
      host:
        type: string
        description: Hostname for filtering the list of metrics returned. If set, metrics retrieved are those with the corresponding hostname tag.
        optional: true
      tag_filter:
        type: string
        description: Filter metrics that have been submitted with the given tags. Supports boolean and wildcard expressions. Cannot be combined with other filters.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_metrics:
    title: Search metrics
    description: >-
      Use `/api/v2/metrics` instead. Search for metrics from the last 24 hours
      in Datadog.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v1/search
      query:
        q: "${q}"
    input:
      q:
        type: string
        description: Query string to search metrics upon. Can optionally be prefixed with `metrics:`.
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  query_metrics:
    title: Query timeseries points
    description: >-
      Run a metrics query over a time range and get the timeseries back.
      `query` is Datadog's own query syntax --
      `avg:system.cpu.user{host:web-01}` -- and `from`/`to` are Unix seconds,
      not ISO timestamps. The classic "what did this metric do" call.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v1/query
      query:
        from: "${from}"
        to: "${to}"
        query: "${query}"
    input:
      from:
        type: integer
        description: Start of the queried time period, seconds since the Unix epoch.
      to:
        type: integer
        description: End of the queried time period, seconds since the Unix epoch.
      query:
        type: string
        description: Query string.
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  query_timeseries:
    title: Query timeseries data across multiple products
    description: >-
      Run one or more timeseries queries over a window using the v2 query
      language, which can span metrics, logs, spans and RUM in a single
      request and combine them with a formula. More capable than the v1 query,
      and the one to reach for when a question crosses data types.
    category: metrics
    request:
      method: POST
      path: /v2/query/timeseries
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  query_scalar:
    title: Query scalar data across multiple products
    description: >-
      Reduce one or more queries to a single number per group over a window --
      an average, a max, a count. What a stat tile or an alerting threshold
      check is built from, rather than a whole timeseries.
    category: metrics
    request:
      method: POST
      path: /v2/query/scalar
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  submit_metrics:
    title: Submit metrics
    description: >-
      Submit metric points to Datadog. Points older than roughly an hour, or
      dated in the future, are rejected rather than backfilled, so this is for
      live emission -- not for importing history.
    category: metrics
    request:
      method: POST
      path: /v2/series
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  submit_distribution_points:
    title: Submit distribution points
    description: >-
      Submit distribution points, which are aggregated server-side into
      percentiles. Use this rather than plain metrics when p95 and p99 matter,
      since percentiles of pre-aggregated metrics are not meaningful.
    category: metrics
    request:
      method: POST
      path: /v1/distribution_points
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  get_metric_metadata:
    title: Get metric metadata
    description: >-
      Get metric metadata. Datadog's reference documents the exact parameters
      and payload this call takes.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v1/metrics/${metric_name}
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
    output:
      description: The requested record.
      type: object

  update_metric_metadata:
    title: Edit metric metadata
    description: >-
      Edit metadata of a specific metric. Find out more about [supported
      types](https://docs.datadoghq.com/developers/metrics).
    category: metrics
    request:
      method: PUT
      path: /v1/metrics/${metric_name}
      body: "${attributes}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  list_metric_tag_configurations:
    title: Get a list of metrics
    description: >-
      Get a list of actively reporting metrics for your organization.
      Pagination is optional using the `page[cursor]` and `page[size]` query
      parameters. Query parameters use bracket notation (for example,
      `filter[tags]`, `filter[queried][window][seconds]`). Pass them as
      standard URL query strings, URL-encoding the brackets if your client
      does not handle them. For example: `GET....
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics
      query:
        filter[configured]: "${filter_configured_}"
        filter[is_configurable]: "${filter_is_configurable_}"
        filter[tags_configured]: "${filter_tags_configured_}"
        filter[metric_type]: "${filter_metric_type_}"
        filter[include_percentiles]: "${filter_include_percentiles_}"
        filter[queried]: "${filter_queried_}"
        filter[queried][window][seconds]: "${filter_queried__window__seconds_}"
        filter[tags]: "${filter_tags_}"
        filter[related_assets]: "${filter_related_assets_}"
        include: "${include}"
        sort: "${sort}"
        window[seconds]: "${window_seconds_}"
        page[size]: "${page_size_}"
        page[cursor]: "${page_cursor_}"
    input:
      filter_configured_:
        type: boolean
        description: Only return custom metrics that have been configured (`true`) or not configured (`false`) with Metrics Without Limits.
        optional: true
      filter_is_configurable_:
        type: boolean
        description: Only return metrics that are eligible (`true`) or ineligible (`false`) for configuration with Metrics Without Limits.
        optional: true
      filter_tags_configured_:
        type: string
        description: Only return metrics that have the given tag key(s) in their Metrics Without Limits configuration (included or excluded).
        optional: true
      filter_metric_type_:
        type: string
        description: Only return metrics of the given metric type.
        optional: true
      filter_include_percentiles_:
        type: boolean
        description: Only return distribution metrics that have percentile aggregations enabled (true) or disabled (false).
        optional: true
      filter_queried_:
        type: boolean
        description: Only return metrics that have been queried (true) or not queried (false) in the look back window. Set the window with `filter[queried][window][seconds]`; if omitted, a default window is used.
        optional: true
      filter_queried__window__seconds_:
        type: integer
        description: This parameter has no effect unless `filter[queried]` is also set. Only return metrics that have been queried or not queried in the specified window. The default value is 2,592,000 seconds (30 days), the maximum value is 15,552,000 seconds (180 days), and...
        optional: true
        default: '2592000'
      filter_tags_:
        type: string
        description: 'Only return metrics that were submitted with tags matching this expression. You can use AND, OR, IN, and wildcards. For example: `filter[tags]=env IN (staging,test) AND service:web*`.'
        optional: true
      filter_related_assets_:
        type: boolean
        description: Only return metrics that are used in at least one dashboard, monitor, notebook, or SLO.
        optional: true
      include:
        type: string
        description: Include related resources in the response. Set to `metric_volumes` to include indexed and ingested volume counts for each metric.
        optional: true
      sort:
        type: string
        description: 'Sort results by metric volume. Prefix a key with `-` for descending order. Supported keys: `metric_volumes.indexed_volume`, `metric_volumes.ingested_volume`, `metric_volumes.indexed_volume_delta`, `metric_volumes.ingested_volume_delta`. Requires a...'
        optional: true
      window_seconds_:
        type: integer
        description: Only return metrics that have been actively reporting in the specified window. The default value is 3600 seconds (1 hour), the maximum value is 2,592,000 seconds (30 days), and the minimum value is 1 second.
        optional: true
        default: '3600'
      page_size_:
        type: integer
        description: Maximum number of results per page. Send `page[size]` on the first request to opt in to pagination. On each subsequent request, send `page[cursor]` set to the value of `meta.pagination.next_cursor` from the previous response. The default value is 10000,...
        optional: true
        default: '10000'
      page_cursor_:
        type: string
        description: Cursor for pagination. Use `page[size]` to opt-in to pagination and get the first page; for subsequent pages, use the value from `meta.pagination.next_cursor` in the response. Pagination is complete when `next_cursor` is null.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_metric_tag_configuration:
    title: List tag configuration by name
    description: >-
      Returns the tag configuration for the given metric name. A metric may
      exist and submit data without having a tag configuration. If no tag
      configuration exists for the metric, this endpoint returns `404 Not
      Found`. This response does not indicate that the metric itself is
      missing.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics/${metric_name}/tags
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
    output:
      description: The requested record.
      type: object

  create_metric_tag_configuration:
    title: Create a tag configuration
    description: >-
      Configure which tags are queryable on a custom metric and which
      aggregations are available. This directly drives the custom-metrics
      bill: every extra tag multiplies the number of distinct timeseries
      Datadog stores.
    category: metrics
    request:
      method: POST
      path: /v2/metrics/${metric_name}/tags
      body: "${attributes}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  update_metric_tag_configuration:
    title: Update a tag configuration
    description: >-
      Update the tag configuration of a metric or percentile aggregations of a
      distribution metric or custom aggregations of a count, rate, or gauge
      metric. By setting `exclude_tags_mode` to true the behavior is changed
      from an allow-list to a deny-list, and tags in the defined list will not
      be queryable. Can only be used with application keys from users with the
      `Manage Tags for Metrics` permission. This endpoint....
    category: metrics
    request:
      method: PATCH
      path: /v2/metrics/${metric_name}/tags
      body: "${attributes}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  delete_metric_tag_configuration:
    title: Delete a tag configuration
    description: >-
      Remove a metric's tag configuration. Dashboards and monitors that
      grouped by those tags stop returning data, so check the metric's assets
      first.
    category: metrics
    destructive: true
    request:
      method: DELETE
      path: /v2/metrics/${metric_name}/tags
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_metric_tags:
    title: List tags by metric name
    description: >-
      View indexed and ingested tags for a given metric name. Results are
      filtered by the `window[seconds]` parameter, which defaults to 14400 (4
      hours).
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics/${metric_name}/all-tags
      query:
        window[seconds]: "${window_seconds_}"
        filter[tags]: "${filter_tags_}"
        filter[match]: "${filter_match_}"
        filter[include_tag_values]: "${filter_include_tag_values_}"
        filter[allow_partial]: "${filter_allow_partial_}"
        page[limit]: "${page_limit_}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      window_seconds_:
        type: integer
        description: The number of seconds of look back (from now) to query for tag data. Default value is 14400 (4 hours), minimum value is 14400 (4 hours).
        optional: true
      filter_tags_:
        type: string
        description: Filter results to tags from data points that have the specified tags. For example, `filter[tags]=env:staging,host:123` returns tags only from data points with both `env:staging` and `host:123`.
        optional: true
      filter_match_:
        type: string
        description: Filter returned tags to those matching a substring. For example, `filter[match]=env` returns tags like `env:prod`, `environment:staging`, etc.
        optional: true
      filter_include_tag_values_:
        type: boolean
        description: Whether to include tag values in the response. Defaults to true.
        optional: true
      filter_allow_partial_:
        type: boolean
        description: Whether to allow partial results. Defaults to false.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of results to return.
        optional: true
        default: '1000000'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_metric_assets:
    title: Related Assets to a Metric
    description: >-
      Which dashboards, monitors, notebooks and SLOs use a given metric. Read
      this before changing or deleting a metric's configuration -- it is the
      blast radius.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics/${metric_name}/assets
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  estimate_metric_cardinality:
    title: Tag Configuration Cardinality Estimator
    description: >-
      Estimate how many timeseries a proposed tag configuration would produce,
      before applying it. The check that stops a tag addition quietly
      multiplying the custom-metrics bill.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics/${metric_name}/estimate
      query:
        filter[groups]: "${filter_groups_}"
        filter[exclude_tags_mode]: "${filter_exclude_tags_mode_}"
        filter[hours_ago]: "${filter_hours_ago_}"
        filter[num_aggregations]: "${filter_num_aggregations_}"
        filter[pct]: "${filter_pct_}"
        filter[timespan_h]: "${filter_timespan_h_}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      filter_groups_:
        type: string
        description: 'Comma-separated list of tag keys that the metric is configured to query with. For example: `filter[groups]=app,host`.'
        optional: true
      filter_exclude_tags_mode_:
        type: boolean
        description: When `true`, `filter[groups]` is treated as an exclude list instead of an include list. Defaults to `false`.
        optional: true
      filter_hours_ago_:
        type: integer
        description: The number of hours of look back (from now) to estimate cardinality with. If unspecified, it defaults to 0 hours.
        optional: true
      filter_num_aggregations_:
        type: integer
        description: Deprecated. Number of aggregations has no impact on volume.
        optional: true
      filter_pct_:
        type: boolean
        description: Deprecated. This query parameter has no effect on the estimate.
        optional: true
      filter_timespan_h_:
        type: integer
        description: A window, in hours, from the look back to estimate cardinality with. The minimum and default is 1 hour.
        optional: true
    output:
      description: The requested record.
      type: object

  list_metric_volumes:
    title: List distinct metric volumes by metric name
    description: >-
      View hourly average cardinality for the given metric name over the look
      back period. For Metric Name Pricing customers, view total point volume
      for the given metric name over the look back period.
    category: metrics
    read_only: true
    request:
      method: GET
      path: /v2/metrics/${metric_name}/volumes
      query:
        window[seconds]: "${window_seconds_}"
    input:
      metric_name:
        type: string
        description: The metric name, e.g. "system.cpu.user".
      window_seconds_:
        type: integer
        description: The number of seconds of look back (from now). Default value is 3,600 (1 hour), maximum value is 2,592,000 (1 month).
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_monitors:
    title: Get all monitors
    description: >-
      List monitors, filtered by name, tags or monitor tags. Returns the full
      definition of each, so a large organisation should page with `page` and
      `page_size` rather than pulling everything.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v1/monitor
      query:
        group_states: "${group_states}"
        name: "${name}"
        tags: "${tags}"
        monitor_tags: "${monitor_tags}"
        with_downtimes: "${with_downtimes}"
        id_offset: "${id_offset}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      group_states:
        type: string
        description: When specified, shows additional information about the group states. Choose one or more from `all`, `alert`, `warn`, and `no data`.
        optional: true
      name:
        type: string
        description: A string to filter monitors by name.
        optional: true
      tags:
        type: string
        description: A comma separated list indicating what tags, if any, should be used to filter the list of monitors by scope. For example, `host:host0`.
        optional: true
      monitor_tags:
        type: string
        description: A comma separated list indicating what service and/or custom tags, if any, should be used to filter the list of monitors. Tags created in the Datadog UI automatically have the service key prepended. For example, `service:my-app`.
        optional: true
      with_downtimes:
        type: boolean
        description: If this argument is set to true, then the returned data includes all current active downtimes for each monitor.
        optional: true
      id_offset:
        type: integer
        description: Use this parameter for paginating through large sets of monitors. Start with a value of zero, make a request, set the value to the last ID of result set, and then repeat until the response is empty.
        optional: true
      page:
        type: integer
        description: The page to start paginating from. If this argument is not specified, the request returns all monitors without pagination.
        optional: true
      page_size:
        type: integer
        description: The number of monitors to return per page. If the page argument is not specified, the default behavior returns all monitors without a `page_size` limit. However, if page is specified and `page_size` is not, the argument defaults to 100.
        optional: true
        default: '100'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_monitors:
    title: Monitors search
    description: >-
      Monitors search. Datadog's reference documents the exact parameters and
      payload this call takes.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v1/monitor/search
      query:
        query: "${query}"
        page: "${page}"
        per_page: "${per_page}"
        sort: "${sort}"
    input:
      query:
        type: string
        description: After entering a search query in your [Manage Monitor page][1] use the query parameter value in the URL of the page as value for this parameter. Consult the dedicated [manage monitor documentation][2] page to learn more. The query can contain any number of...
        optional: true
      page:
        type: integer
        description: Page to start paginating from.
        optional: true
        default: '0'
      per_page:
        type: integer
        description: Number of monitors to return per page.
        optional: true
        default: '30'
      sort:
        type: string
        description: 'String for sort order, composed of field and sort order separate by a comma, for example `name,asc`. Supported sort directions: `asc`, `desc`. Supported fields: * `name` * `status` * `tags`'
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_monitor:
    title: Get a monitor's details
    description: >-
      Get details about the specified monitor from your organization.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v1/monitor/${monitor_id}
      query:
        group_states: "${group_states}"
        with_downtimes: "${with_downtimes}"
        with_assets: "${with_assets}"
    input:
      monitor_id:
        type: integer
        description: The monitor id, from list_monitors.
      group_states:
        type: string
        description: When specified, shows additional information about the group states. Choose one or more from `all`, `alert`, `warn`, and `no data`.
        optional: true
      with_downtimes:
        type: boolean
        description: If this argument is set to true, then the returned data includes all current active downtimes for the monitor.
        optional: true
      with_assets:
        type: boolean
        description: If this argument is set to `true`, the returned data includes all assets tied to this monitor.
        optional: true
    output:
      description: The requested record.
      type: object

  create_monitor:
    title: Create a monitor
    description: >-
      Create a monitor. The `query` decides what is watched and the `options`
      decide when it alerts and who it notifies -- an `@` handle in the
      message sends a real page. Validate first if the query is not already
      known-good.
    category: monitors
    request:
      method: POST
      path: /v1/monitor
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  update_monitor:
    title: Edit a monitor
    description: >-
      Update a monitor. Changing the query or the thresholds changes what
      pages on-call, and a monitor in alert can resolve or re-trigger as a
      result of the edit.
    category: monitors
    request:
      method: PUT
      path: /v1/monitor/${monitor_id}
      body: "${attributes}"
    input:
      monitor_id:
        type: integer
        description: The monitor id, from list_monitors.
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The record after the update.
      type: object

  delete_monitor:
    title: Delete a monitor
    description: >-
      Delete a monitor. Whatever it was watching stops being watched --
      silently, since nothing alerts on the absence of a monitor. Check
      `check_can_delete_monitor` first when SLOs may depend on it.
    category: monitors
    destructive: true
    request:
      method: DELETE
      path: /v1/monitor/${monitor_id}
      query:
        force: "${force}"
    input:
      monitor_id:
        type: integer
        description: The monitor id, from list_monitors.
      force:
        type: string
        description: Delete the monitor even if it's referenced by other resources (for example SLO, composite monitor).
        optional: true
    output:
      description: Confirmation that the record was deleted.
      type: object

  validate_monitor:
    title: Validate a monitor
    description: >-
      Check that a monitor definition is valid without creating it. Cheap, and
      worth doing before create_monitor whenever the query is being generated
      rather than copied.
    category: monitors
    request:
      method: POST
      path: /v1/monitor/validate
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  validate_existing_monitor:
    title: Validate an existing monitor
    description: >-
      Validate the monitor provided in the request. Datadog's reference
      documents the exact parameters and payload this call takes.
    category: monitors
    request:
      method: POST
      path: /v1/monitor/${monitor_id}/validate
      body: "${attributes}"
    input:
      monitor_id:
        type: integer
        description: The monitor id, from list_monitors.
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  check_can_delete_monitor:
    title: Check if a monitor can be deleted
    description: >-
      Check whether monitors can be deleted, or whether SLOs depend on them.
      Deleting a monitor an SLO references breaks that SLO, so this is the
      pre-flight.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v1/monitor/can_delete
      query:
        monitor_ids: "${monitor_ids}"
    input:
      monitor_ids:
        type: array
        description: The IDs of the monitor to check.
        items: {type: integer}
    output:
      description: The requested record.
      type: object

  search_monitor_groups:
    title: Monitors group search
    description: >-
      Search and filter your monitor groups details. Datadog's reference
      documents the exact parameters and payload this call takes.
    category: monitors
    read_only: true
    request:
      method: GET
      path: /v1/monitor/groups/search
      query:
        query: "${query}"
        page: "${page}"
        per_page: "${per_page}"
        sort: "${sort}"
    input:
      query:
        type: string
        description: After entering a search query on the [Triggered Monitors page][1], use the query parameter value in the URL of the page as a value for this parameter. For more information, see the [Manage Monitors documentation][2]. The query can contain any number of...
        optional: true
      page:
        type: integer
        description: Page to start paginating from.
        optional: true
        default: '0'
      per_page:
        type: integer
        description: Number of monitors to return per page.
        optional: true
        default: '30'
      sort:
        type: string
        description: 'String for sort order, composed of field and sort order separate by a comma, for example `name,asc`. Supported sort directions: `asc`, `desc`. Supported fields: * `name` * `status` * `tags`'
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_monitor_notification_rules:
    title: Get all monitor notification rules
    description: >-
      Returns a list of all monitor notification rules. Datadog's reference
      documents the exact parameters and payload this call takes.
    category: monitors
    read_only: true
    request:
      method: GET
