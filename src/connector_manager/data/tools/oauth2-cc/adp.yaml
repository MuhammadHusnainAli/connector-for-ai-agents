  # -- events: pay and tax ---------------------------------------------------

  start_worker_deduction:
    title: Start a worker deduction
    description: >-
      Begin a general deduction for a worker -- a benefit contribution, a
      repayment, a charitable gift. It takes money off real pay from its
      effective date, so the amount and the deduction code both need to be
      right; the codes are per-client.
    category: events
    request:
      method: POST
      path: /events/payroll/v2/worker-general-deduction-instruction.start
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The event payload -- the worker's associateOID, the deduction code,
          the amount or rate and the effective date.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  change_worker_deduction:
    title: Change a worker deduction
    description: >-
      Change an existing deduction's amount, rate or goal. Takes effect from the
      date in the payload, which decides which payroll run first reflects it.
    category: events
    request:
      method: POST
      path: /events/payroll/v2/worker-general-deduction-instruction.change
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The event payload -- the worker's associateOID, the deduction being
          changed and its new terms.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  stop_worker_deduction:
    title: Stop a worker deduction
    description: >-
      End a deduction from a given date. Stopping late means money already came
      off a payslip, so the effective date matters as much as the call.
    category: events
    destructive: true
    request:
      method: POST
      path: /events/payroll/v2/worker-general-deduction-instruction.stop
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The event payload -- the worker's associateOID, the deduction and the
          date it stops.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  change_federal_income_tax_instruction:
    title: Change a worker's federal income tax instruction
    description: >-
      Update United States federal withholding for a worker -- the W-4 data.
      This changes take-home pay directly, and ADP validates it against the
      current form year.
    category: events
    request:
      method: POST
      path: /events/payroll/v1/us-tax-profile.federal-income-tax-instruction.change
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The event payload -- the worker's associateOID and the federal
          withholding settings.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  add_local_income_tax_instruction:
    title: Add a worker's local income tax instruction
    description: >-
      Add a local (city or county) withholding instruction, which United States
      payroll needs when a worker lives or works in a taxing locality.
    category: events
    request:
      method: POST
      path: /events/payroll/v1/us-tax-profile.local-income-tax-instruction.add
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The event payload -- the worker's associateOID, the locality and the
          withholding settings.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  change_local_income_tax_instruction:
    title: Change a worker's local income tax instruction
    description: Update an existing local withholding instruction for a worker.
    category: events
    request:
      method: POST
      path: /events/payroll/v1/us-tax-profile.local-income-tax-instruction.change
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: The event payload -- the worker's associateOID and the new settings.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  remove_local_income_tax_instruction:
    title: Remove a worker's local income tax instruction
    description: >-
      Remove a local withholding instruction -- typically after a move out of
      the locality. Removing one that still applies under-withholds tax.
    category: events
    destructive: true
    request:
      method: POST
      path: /events/payroll/v1/us-tax-profile.local-income-tax-instruction.remove
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: The event payload -- the worker's associateOID and the locality to remove.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  # -- events: onboarding ----------------------------------------------------

  onboard_applicant:
    title: Onboard an applicant
    description: >-
      Hand a hired applicant over to ADP onboarding, which starts the new-hire
      paperwork and creates the worker on completion. The alternative to
      `hire_worker` when the person came through a recruiting system.
    category: events
    request:
      method: POST
      path: /hcm/v2/applicant.onboard
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      event:
        type: object
        description: >-
          The onboarding payload -- the applicant's details and the position
          they are being onboarded into, as this endpoint's metadata declares.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
        events: {type: array}

  get_applicant_onboard_metadata:
    title: Get the applicant onboarding schema
    description: >-
      What the onboarding call accepts on this client's configuration --
      required fields and permitted code values.
    category: events
    read_only: true
    request:
      method: GET
      path: /hcm/v2/applicant.onboard/meta
    input: {}
    output:
      description: The onboarding payload's metadata.
      type: object
      properties:
        meta: {type: object}

  # -- worker profile writes -------------------------------------------------

  set_work_assignment_base_remuneration:
    title: Set a work assignment's base pay
    description: >-
      Set the base remuneration on one work assignment -- a pay rise, a
      re-band, a correction. It is a PUT rather than an event, and it changes
      what the worker is paid from the effective date in the payload.
    category: workers
    request:
      method: PUT
      path: /hr/worker-profile/v1/workers/${aoid}/work-assignments/${assignment_id}/base-remuneration
      headers:
        Content-Type: application/json
      body: "${remuneration}"
    input:
      aoid:
        type: string
        description: The worker's Associate OID.
      assignment_id:
        type: string
        description: Id of the work assignment, from `list_worker_work_assignments`.
      remuneration:
        type: object
        description: >-
          The base pay to set -- amount, currency, rate basis and effective
          date, as this endpoint's metadata declares.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}

  get_base_remuneration_metadata:
    title: Get the base pay schema
    description: >-
      What the base remuneration call accepts for this worker and assignment,
      including the rate bases and currencies configured for the client.
    category: workers
    read_only: true
    request:
      method: GET
      path: /hr/worker-profile/v1/workers/${aoid}/work-assignments/${assignment_id}/base-remuneration/meta
    input:
      aoid:
        type: string
        description: The worker's Associate OID.
      assignment_id:
        type: string
        description: Id of the work assignment.
    output:
      description: The base pay payload's metadata.
      type: object
      properties:
        meta: {type: object}

  add_work_assignment_additional_remuneration:
    title: Add additional pay to a work assignment
    description: >-
      Add a recurring additional remuneration -- a shift allowance, a car
      allowance, a stipend -- to one assignment. Recurring by nature, so it
      keeps paying until stopped.
    category: workers
    request:
      method: POST
      path: /hr/worker-profile/v1/workers/${aoid}/work-assignments/${assignment_id}/additional-remunerations
      headers:
        Content-Type: application/json
      body: "${remuneration}"
    input:
      aoid:
        type: string
        description: The worker's Associate OID.
      assignment_id:
        type: string
        description: Id of the work assignment.
      remuneration:
        type: object
        description: >-
          The additional pay to add -- its type code, amount, currency and
          effective date.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}

  get_additional_remunerations_metadata:
    title: Get the additional pay schema
    description: >-
      Which additional remuneration types this client defines and what each
      requires -- the check before adding one.
    category: workers
    read_only: true
    request:
      method: GET
      path: /hr/worker-profile/v1/workers/${aoid}/work-assignments/${assignment_id}/additional-remunerations/meta
    input:
      aoid:
        type: string
        description: The worker's Associate OID.
      assignment_id:
        type: string
        description: Id of the work assignment.
    output:
      description: The additional pay payload's metadata.
      type: object
      properties:
        meta: {type: object}

  add_work_assignment_corporate_group:
    title: Add a corporate grouping to a work assignment
    description: >-
      Attach a corporate grouping -- ADP's flexible organisational dimension,
      used for reporting lines, divisions or cost structures the standard fields
      do not cover.
    category: workers
    request:
      method: POST
      path: /hr/worker-profile/v1/workers/${aoid}/work-assignments/${assignment_id}/corporate-groups
      headers:
        Content-Type: application/json
      body: "${corporate_group}"
    input:
      aoid:
        type: string
        description: The worker's Associate OID.
      assignment_id:
        type: string
        description: Id of the work assignment.
      corporate_group:
        type: object
        description: The grouping to attach, with its code and effective date.
    output:
      description: ADP's confirmation.
      type: object
      properties:
        confirmMessage: {type: object}
