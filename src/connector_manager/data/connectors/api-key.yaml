# Connector definitions: API_KEY auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
1password-events:
  auth_mode: API_KEY
  categories:
  - iam
  connection_config:
    domain:
      description: The regional Events API domain for your 1Password account.
      enum:
      - events.1password.com
      - events.1password.ca
      - events.1password.eu
      order: 1
      title: Events API Domain
      type: string
  credentials:
    apiKey:
      description: Your 1Password Events Reporting bearer token
      example: eyJhbGciOiJF*************.*************CJ9.eyJ**************************************************.***********
      pattern: ^eyJ[a-zA-Z0-9_-]+\.ey[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+$
      title: Bearer Token
      type: string
  display_name: 1Password (Events API)
  proxy:
    base_url: https://${connectionConfig.domain}
    headers:
      authorization: Bearer ${apiKey}
    verification:
      endpoints:
      - /api/v2/auth/introspect
      method: GET
1password-scim:
  auth_mode: API_KEY
  categories:
  - iam
  connection_config:
    domain:
      description: The domain for your 1Password SCIM Bridge. Note this URL is a service hosted in your infrastructure so needs to be setup already by your IT team. Please see the instructions for more info.
      example: scim.example.com
      pattern: ^[a-zA-Z0-9.-]+$
      prefix: https://
      title: 1Password SCIM Bridge URL
      type: string
  credentials:
    apiKey:
      description: Your 1Password SCIM API Key
      secret: true
      title: API Key
      type: string
  display_name: 1Password (SCIM)
  proxy:
    base_url: https://${connectionConfig.domain}/scim
    headers:
      authorization: Bearer ${apiKey}
    verification:
      endpoints:
      - /Users
      headers:
        content-type: application/json
      method: GET
