# Connector definitions: auth mode, credential/config fields, api base url and
# verification endpoint for each connector. Machine-generated; do not hand-edit.
1password-events:
  auth_mode: API_KEY
  categories:
  - iam
  connection_config:
    domain:
      description: The regional Events API domain for your 1Password account.
      enum:
      - events.1password.com
      - events.1password.ca
      - events.1password.eu
      order: 1
      title: Events API Domain
      type: string
  credentials:
    apiKey:
      description: Your 1Password Events Reporting bearer token
      example: eyJhbGciOiJF*************.*************CJ9.eyJ**************************************************.***********
      pattern: ^eyJ[a-zA-Z0-9_-]+\.ey[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+$
      title: Bearer Token
      type: string
  display_name: 1Password (Events API)
  proxy:
    base_url: https://${connectionConfig.domain}
    headers:
      authorization: Bearer ${apiKey}
    verification:
      endpoints:
      - /api/v2/auth/introspect
      method: GET
1password-scim:
  auth_mode: API_KEY
  categories:
  - iam
  connection_config:
    domain:
      description: The domain for your 1Password SCIM Bridge. Note this URL is a service hosted in your infrastructure so needs to be setup already by your IT team. Please see the instructions for more info.
      example: scim.example.com
      pattern: ^[a-zA-Z0-9.-]+$
      prefix: https://
      title: 1Password SCIM Bridge URL
      type: string
  credentials:
    apiKey:
      description: Your 1Password SCIM API Key
      secret: true
      title: API Key
      type: string
  display_name: 1Password (SCIM)
  proxy:
    base_url: https://${connectionConfig.domain}/scim
    headers:
      authorization: Bearer ${apiKey}
    verification:
      endpoints:
      - /Users
      headers:
        content-type: application/json
      method: GET
1password-users:
  auth_mode: OAUTH2_CC
  categories:
  - iam
  connection_config:
    accountId:
      description: Your 1Password account ID.
      example: XLQMR47VZPBKJHSGWNCYFDE3T9
      order: 2
      pattern: ^[A-Z0-9]{26}$
      title: Account ID
      type: string
    domain:
      description: The regional API domain for your 1Password account.
      enum:
      - api.1password.com
      - api.1password.ca
      - api.1password.eu
      order: 1
      title: API Domain
      type: string
  credentials:
    client_id:
      description: Your 1Password OAuth application Client ID.
      example: 5ab87915-2deb-429c-a1e2-8b0495900f45
      format: uuid
      title: Client ID
      type: string
    client_secret:
      description: Your 1Password OAuth application Client Secret.
      secret: true
      title: Client Secret
      type: string
  display_name: 1Password (Users API)
  proxy:
    base_url: https://${connectionConfig.domain}/v1beta1/accounts/${connectionConfig.accountId}
  token_params:
    grant_type: client_credentials
  token_request_auth_method: basic
  token_url: https://${connectionConfig.domain}/v1beta1/users/oauth2/token
3cx:
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - communication
  connection_config:
    domain:
      description: Your 3CX instance domain
      example: mycompany.3cx.us
      format: hostname
