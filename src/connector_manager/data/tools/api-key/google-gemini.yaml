  generate_content_dynamic:
    title: Generate content dynamic
    description: Generates a model response given an input GenerateContentRequest. Refer to the text generation
      guide for detailed usage information. Input capabilities differ between models, including tuned
      models. Refer to the model guide and tuning guide for details.
    category: dynamic
    request:
      method: POST
      path: /v1beta/${model}:generateContent
      body:
        toolConfig: ${tool_config}
        contents: ${contents}
        systemInstruction: ${system_instruction}
        serviceTier: ${service_tier}
        model: ${body_model}
        tools: ${tools}
        store: ${store}
        generationConfig: ${generation_config}
        safetySettings: ${safety_settings}
        cachedContent: ${cached_content}
    input:
      model:
        type: string
        description: 'Required. The name of the Model to use for generating the completion. Format: models/{model}.'
      tool_config:
        type: string
        description: Optional. Tool configuration for any Tool specified in the request. Refer to the
          Function calling guide for a usage example.
        optional: true
      contents:
        type: array
        items:
          type: string
        description: Required. The content of the current conversation with the model. For single-turn
          queries, this is a single instance. For multi-turn queries like chat, this is a repeated field
          that contains the conversation history and the latest request.
        optional: true
      system_instruction:
        type: string
        description: Optional. Developer set system instruction(s). Currently, text only.
        optional: true
      service_tier:
        type: string
        description: Optional. The service tier of the request.
        optional: true
        enum:
        - unspecified
        - standard
        - flex
        - priority
      body_model:
        type: string
        description: 'Required. The name of the Model to use for generating the completion. Format: models/{model}.'
        optional: true
      tools:
        type: array
        items:
          type: string
        description: Optional. A list of Tools the Model may use to generate the next response. A Tool
          is a piece of code that enables the system to interact with external systems to perform an action,
          or set of actions, outside of knowledge and scope of the Model. Supported Tools are Function
          and code_execution. Refer
        optional: true
      store:
        type: boolean
        description: Optional. Configures the logging behavior for a given request. If set, it takes precedence
          over the project-level logging config.
        optional: true
      generation_config:
        type: string
        description: Optional. Configuration options for model generation and outputs.
        optional: true
      safety_settings:
        type: array
        items:
          type: string
        description: Optional. A list of unique SafetySetting instances for blocking unsafe content. This
          will be enforced on the GenerateContentRequest.contents and GenerateContentResponse.candidates.
          There should not be more than one setting for each SafetyCategory type. The API will block any
          contents and responses t
        optional: true
      cached_content:
        type: string
        description: 'Optional. The name of the content cached to use as context to serve the prediction.
          Format: cachedContents/{cachedContent}'
        optional: true
    output:
      description: The GenerateContentResponse resource.
      type: object
