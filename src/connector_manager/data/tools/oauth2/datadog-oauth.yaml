  list_hosts:
    title: Get all hosts for your organization
    description: >-
      List reporting hosts with their metadata, apps, muting state and
      last-seen time. The infrastructure inventory as Datadog sees it,
      filterable and sortable.
    category: infrastructure
    read_only: true
    request:
      method: GET
      path: /v1/hosts
      query:
        filter: "${filter}"
        sort_field: "${sort_field}"
        sort_dir: "${sort_dir}"
        start: "${start}"
        count: "${count}"
        from: "${from}"
        include_muted_hosts_data: "${include_muted_hosts_data}"
        include_hosts_metadata: "${include_hosts_metadata}"
    input:
      filter:
        type: string
        description: String to filter search results.
        optional: true
      sort_field:
        type: string
        description: Sort hosts by this field.
        optional: true
      sort_dir:
        type: string
        description: Direction of sort. Options include `asc` and `desc`.
        optional: true
      start:
        type: integer
        description: Specify the starting point for the host search results. For example, if you set `count` to 100 and the first 100 results have already been returned, you can set `start` to `101` to get the next 100 results.
        optional: true
      count:
        type: integer
        description: Number of hosts to return. Max 1000.
        optional: true
      from:
        type: integer
        description: Number of seconds since UNIX epoch from which you want to search your hosts.
        optional: true
      include_muted_hosts_data:
        type: boolean
        description: Include information on the muted status of hosts and when the mute expires.
        optional: true
      include_hosts_metadata:
        type: boolean
        description: Include additional metadata about the hosts (agent_version, machine, platform, processor, etc.).
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_host_totals:
    title: Get the total number of active hosts
    description: >-
      This endpoint returns the total number of active and up hosts in your
      Datadog account. Active means the host has reported in the past hour,
      and up means it has reported in the past two hours.
    category: infrastructure
    read_only: true
    request:
      method: GET
      path: /v1/hosts/totals
      query:
        from: "${from}"
    input:
