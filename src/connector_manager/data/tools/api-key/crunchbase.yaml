    description: >-
      Query the acquisition predictions collection with Crunchbase's predicate
      language -- Crunchbase's modelled likelihood that a company is acquired.
      Filters go in `query` as predicates over field ids; get_field_metadata
      lists the fields and their operators. Page with `after_id` plus a stable
      `order`, never with an offset. Part of Crunchbase's Predictions package
      -- an account without it gets a 403 rather than an empty result.
    category: acquisition_predictions
    read_only: true
    request:
      method: POST
      path: /v4/data/searches/acquisition_predictions
      body:
        field_ids: "${field_ids}"
        query: "${query}"
        order: "${order}"
        limit: "${limit}"
        before_id: "${before_id}"
        after_id: "${after_id}"
    input:
      field_ids:
        type: array
        description: Which fields to return on each result. Omit for the collection's defaults.
        optional: true
        items: {type: string}
      query:
        type: array
        description: 'The filter, as an array of predicates. Each is {"type": "predicate", "field_id": "...", "operator_id": "...", "values": [...]}; several predicates are ANDed together.'
        optional: true
        items: {type: object}
      order:
        type: array
        description: 'Sort order, as [{"field_id": "...", "sort": "asc"|"desc"}]. Needed for stable paging.'
        optional: true
        items: {type: object}
      limit:
        type: integer
        description: How many results per page (up to 1000 on most packages).
        optional: true
        default: '100'
      before_id:
        type: string
        description: Page backwards from this entity id.
        optional: true
      after_id:
        type: string
        description: Page forwards from this entity id.
        optional: true
    output:
      description: A page of matching acquisition predictions, with `count` and `entities`.
