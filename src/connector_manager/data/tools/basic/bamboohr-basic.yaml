# BambooHR tools for the API-key (basic auth) connection.
#
# Same API as the OAuth BambooHR connector, different credential: the API key
# goes in the basic-auth username field and the password is the literal "x".
# The connection's subdomain is baked into the base url, so paths start at
# `/v1`.
#
# Four things decide whether a call works:
#
#   * **BambooHR answers XML unless asked for JSON.** Every tool here sends
#     `Accept: application/json`, and the report tools additionally ask for
#     `format=JSON`;
#   * **`get_employee` returns almost nothing unless you name fields.** There
#     is no "give me everything": pass the field ids you want, and use
#     `list_fields` to learn what exists on this account, custom fields
#     included;
#   * **history lives in tables, not fields.** Job title, compensation and
#     employment status are *tables* with one row per change --
#     `get_employee_table` reads them and `add_employee_table_row` is how a
#     promotion or pay rise is recorded. Writing the field instead would
#     silently lose the history;
#   * **time off has two generations of endpoints.** The classic ones
#     (`/v1/time_off/...`) still work and cover balances and who is out; the
#     newer `/v1/time-off/requests` family handles requests, approvals and
#     denials. Both are here, named for what they do.
#
# Approving or denying a request emails the employee, and
# `adjust_time_off_balance` changes a real leave balance -- neither is a
# rehearsal.
#
# Docs: https://documentation.bamboohr.com/reference

connector_id: bamboohr-basic
display_name: BambooHR (Basic Auth)
docs_url: https://documentation.bamboohr.com/reference

tools:

  # -- employees -----------------------------------------------------------

  list_employees:
    title: List the employee directory
    description: >-
      Read the company's employee directory -- everyone's id, name, job title,
      department and work email in one call. The cheapest call that proves the
      key works, and the usual way to resolve a name to an employee id.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/directory
      headers:
        Accept: application/json
    input: {}
    output:
      description: The employee directory.
      type: object
      properties:
        employees: {type: array, description: "Each with id, displayName, jobTitle and workEmail."}
        fields: {type: array}

  get_employee:
    title: Get an employee
    description: >-
      Read one employee's fields. BambooHR returns almost nothing unless
      `fields` names what you want, so pass the field ids you need --
      list_fields shows every id this account has, custom fields included.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/${employee_id}
      headers:
        Accept: application/json
      query:
        fields: "${fields}"
        onlyCurrent: "${only_current}"
    input:
      employee_id:
        type: string
        description: The employee's id, or "0" for the account the key belongs to.
      fields:
        type: array
        description: Field ids to return, e.g. ["firstName","lastName","jobTitle","department","hireDate"].
        optional: true
        default: "[firstName, lastName, workEmail, jobTitle, department, hireDate, status]"
        items: {type: string}
      only_current:
        type: boolean
        description: Restrict history fields to their currently effective value.
        optional: true
    output:
      description: The employee's requested fields.
      type: object
      properties:
        id: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        jobTitle: {type: string}

  create_employee:
    title: Add an employee
    description: >-
      Create an employee record. firstName and lastName are required; anything
      else BambooHR knows about can go alongside. The new employee's id comes
      back in the Location header rather than the body.
    category: employees
    request:
      method: POST
      path: /v1/employees
      headers:
        Accept: application/json
      body:
        firstName: "${first_name}"
        lastName: "${last_name}"
        workEmail: "${work_email}"
        jobTitle: "${job_title}"
        department: "${department}"
        division: "${division}"
        location: "${location}"
        hireDate: "${hire_date}"
        employeeNumber: "${employee_number}"
    input:
      first_name:
        type: string
        description: First name.
      last_name:
        type: string
        description: Last name.
      work_email:
        type: string
        description: Work email address.
        optional: true
        format: email
      job_title:
        type: string
        description: Job title.
        optional: true
      department:
        type: string
        description: Department name, which must already exist on the account.
        optional: true
      division:
        type: string
        description: Division name, which must already exist.
        optional: true
      location:
        type: string
        description: Work location, which must already exist.
        optional: true
      hire_date:
        type: string
        description: Hire date as YYYY-MM-DD.
        optional: true
      employee_number:
        type: string
        description: Your own employee number.
        optional: true
    output:
      description: Empty on success -- the new employee id is in the Location header.
      type: object

  update_employee:
    title: Update an employee
    description: >-
      Change an employee's fields. `fields` is keyed by BambooHR field id, e.g.
      {"jobTitle": "Staff Engineer", "department": "Engineering"}. For anything
      BambooHR tracks as history -- job title, pay, employment status -- use
      add_employee_table_row instead, or the previous value is lost.
    category: employees
    request:
      method: POST
      path: /v1/employees/${employee_id}
      headers:
        Accept: application/json
      body: "${fields}"
    input:
      employee_id:
        type: string
        description: The employee's id.
      fields:
        type: object
        description: 'Field id to new value, e.g. {"workEmail": "ada@example.com"}.' 
    output:
      description: Empty on success -- BambooHR answers 200 with no body.
      type: object

  list_changed_employees:
    title: List employees changed since a time
    description: >-
      Read the ids of employees inserted, updated or deleted since a timestamp.
      This is the endpoint an incremental sync should poll -- pulling the whole
      directory repeatedly is what rate limits are for.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/changed
      headers:
        Accept: application/json
      query:
        since: "${since}"
        type: "${type}"
    input:
      since:
        type: string
        description: ISO 8601 timestamp to compare against, e.g. "2026-01-01T00:00:00Z".
        example: "2026-01-01T00:00:00Z"
      type:
        type: string
        description: Only this kind of change.
        optional: true
        enum: [inserted, updated, deleted]
    output:
      description: The changed employee ids, each with its change type and timestamp.
      type: object
      properties:
        employees: {type: object}

  get_employee_table:
    title: Read an employee's history table
    description: >-
      Read one of an employee's tables -- "jobInfo", "compensation",
      "employmentStatus", "customTable1" and the rest -- as one row per change,
      newest last. This is where job and pay history actually lives;
      list_tables names the tables this account has.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/${employee_id}/tables/${table}
      headers:
        Accept: application/json
    input:
      employee_id:
        type: string
        description: The employee's id.
      table:
        type: string
        description: The table's alias, e.g. "jobInfo", "compensation" or "employmentStatus".
        example: jobInfo
    output:
      description: The table's rows for that employee, oldest first.
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          date: {type: string}

  add_employee_table_row:
    title: Add a row to an employee's history table
    description: >-
      Record a change in an employee's history -- a promotion in "jobInfo", a
      pay rise in "compensation", a status change in "employmentStatus". `date`
      is when the change takes effect, and `fields` holds the row's values,
      e.g. {"jobTitle": "Staff Engineer", "department": "Engineering"}.
    category: employees
    request:
      method: POST
      path: /v1/employees/${employee_id}/tables/${table}
      headers:
        Accept: application/json
      body: "${fields}"
    input:
      employee_id:
        type: string
        description: The employee's id.
      table:
        type: string
        description: The table's alias, e.g. "jobInfo" or "compensation".
        example: jobInfo
      fields:
        type: object
        description: >-
          The row's values keyed by field id, including `date` for the day the
          change takes effect -- e.g. {"date": "2026-04-01", "jobTitle":
          "Staff Engineer"}.
    output:
      description: Empty on success -- the new row's id is in the Location header.
      type: object

  get_employee_photo:
    title: Get an employee's photo
    description: >-
      Read an employee's profile photo at a given size. Returns image bytes
      rather than JSON, so use it to fetch an avatar, not to read data.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/${employee_id}/photo/${size}
    input:
      employee_id:
        type: string
        description: The employee's id.
      size:
        type: string
        description: Photo size to return.
        enum: [original, large, medium, small, xs, tiny]
    output:
      description: The photo's image bytes.
      type: string

  list_employee_files:
    title: List an employee's files
    description: >-
      Read the file categories on one employee and the documents in each --
      contracts, certificates, signed policies -- with each file's id, name and
      size.
    category: employees
    read_only: true
    request:
      method: GET
      path: /v1/employees/${employee_id}/files/view
      headers:
        Accept: application/json
    input:
      employee_id:
        type: string
        description: The employee's id.
    output:
      description: The employee's file categories and the files in them.
      type: object

  # -- metadata ------------------------------------------------------------

  list_fields:
    title: List the available employee fields
    description: >-
      Read every field BambooHR knows about on this account, with its id, alias
      and type. Read this before naming fields in get_employee,
      update_employee or a custom report -- ids are account-specific.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/fields
      headers:
        Accept: application/json
    input: {}
    output:
      description: The account's employee fields.
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          name: {type: string}
          type: {type: string}
          alias: {type: string}

  list_tables:
    title: List the available employee tables
    description: >-
      Read the tables this account has -- jobInfo, compensation,
      employmentStatus, custom tables -- with their aliases and the fields in
      each. The lookup before get_employee_table.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/tables
      headers:
        Accept: application/json
    input: {}
    output:
      description: The account's employee tables and their fields.
      type: array
      items: {type: object}

  list_field_lists:
    title: List the allowed values for list fields
    description: >-
      Read the option lists behind dropdown fields -- departments, divisions,
      locations, employment statuses -- so a write uses a value BambooHR will
      accept instead of being rejected.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/lists
      headers:
        Accept: application/json
    input: {}
    output:
      description: Each list field with its allowed values.
      type: array
      items: {type: object}

  list_users:
    title: List BambooHR users
    description: >-
      Read the people with BambooHR logins, with their access level and the
      employee record each maps to. Not the same as the employee directory:
      these are accounts, not staff.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/users
      headers:
        Accept: application/json
      query:
        status: "${status}"
    input:
      status:
        type: string
        description: Only users in this state, e.g. "enabled".
        optional: true
    output:
      description: The account's BambooHR users.
      type: object

  list_time_off_types:
    title: List time-off types
    description: >-
      Read the leave types configured on the account -- holiday, sick,
      unpaid -- with the ids that time-off requests and balance adjustments
      take.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/time_off/types
      headers:
        Accept: application/json
      query:
        mode: "${mode}"
    input:
      mode:
        type: string
        description: Restrict to types available in a particular mode, e.g. "request".
        optional: true
    output:
      description: The account's time-off types.
      type: object

  list_time_off_policies:
    title: List time-off policies
    description: >-
      Read the accrual policies behind the leave types -- how much is earned,
      how often, and what carries over. The rules behind the balances.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/meta/time_off/policies
      headers:
        Accept: application/json
    input: {}
    output:
      description: The account's time-off policies.
      type: object

  list_datasets:
    title: List reporting datasets
    description: >-
      Read the datasets available to BambooHR's newer reporting API, each of
      which exposes its own field set through get_dataset_fields.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/datasets
      headers:
        Accept: application/json
    input: {}
    output:
      description: The available datasets.
      type: object

  get_dataset_fields:
    title: List a dataset's fields
    description: >-
      Read the fields one reporting dataset exposes, with their names and
      types -- the vocabulary for querying that dataset.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/datasets/${dataset_name}/fields
      headers:
        Accept: application/json
      query:
        page: "${page}"
        page_size: "${page_size}"
    input:
      dataset_name:
        type: string
        description: The dataset's name, from list_datasets.
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Fields per page.
        optional: true
        minimum: 1
    output:
      description: The dataset's fields.
      type: object

  list_custom_fields:
    title: List HRIS custom fields
    description: >-
      Read the custom fields defined on this account through the HRIS custom
      field API, with their ids, types and whether they are archived.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/hris/custom-fields
      headers:
        Accept: application/json
      query:
        page: "${page}"
        pageSize: "${page_size}"
    input:
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Fields per page.
        optional: true
        minimum: 1
    output:
      description: A page of custom fields.
      type: object

  list_custom_tables:
    title: List HRIS custom tables
    description: >-
      Read the custom tables defined on this account, with the fields in each.
      Their aliases are what get_employee_table takes.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /v1/hris/custom-tables
      headers:
        Accept: application/json
      query:
        page: "${page}"
        pageSize: "${page_size}"
    input:
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Tables per page.
        optional: true
        minimum: 1
    output:
      description: A page of custom tables.
      type: object

  # -- time off ------------------------------------------------------------

  list_time_off_requests:
    title: List time-off requests
    description: >-
      Read holiday and leave requests over a date range. BambooHR requires both
      start and end dates; filter `status` to "requested" to get the approval
      queue.
    category: time_off
    read_only: true
    request:
      method: GET
      path: /v1/time_off/requests
      headers:
        Accept: application/json
      query:
        start: "${start}"
        end: "${end}"
        status: "${status}"
        employeeId: "${employee_id}"
        type: "${type}"
    input:
      start:
        type: string
        description: Start of the range as YYYY-MM-DD.
        example: "2026-01-01"
      end:
        type: string
        description: End of the range as YYYY-MM-DD.
      status:
        type: string
        description: Only requests in this state.
        optional: true
        enum: [approved, denied, superseded, requested, canceled]
      employee_id:
        type: string
        description: Only this employee's requests.
        optional: true
      type:
        type: string
        description: Only this time-off type id.
        optional: true
    output:
      description: The matching time-off requests.
      type: array
      items:
        type: object
        properties:
          id: {type: string}
          employeeId: {type: string}
          start: {type: string}
          end: {type: string}
          status: {type: object}

  get_time_off_request:
    title: Get a time-off request
    description: >-
      Read one leave request by id -- dates, type, amount, status and the notes
      on it.
    category: time_off
    read_only: true
    request:
      method: GET
      path: /v1/time-off/requests/${request_id}
      headers:
        Accept: application/json
      query:
        returnActions: "${return_actions}"
    input:
      request_id:
        type: string
        description: The request's id.
      return_actions:
        type: boolean
        description: Also return which actions the current user may take on the request.
        optional: true
    output:
      description: The time-off request.
      type: object

  create_time_off_request:
    title: Create a time-off request
    description: >-
      File a leave request for an employee. `category_id` is a time-off type id
      from list_time_off_types; `amount` is hours or days depending on that
      type. This enters the approval workflow and notifies the approver.
    category: time_off
    request:
      method: POST
      path: /v1/time-off/requests
      headers:
        Accept: application/json
      query:
        returnActions: "${return_actions}"
      body:
        employeeId: "${employee_id}"
        categoryId: "${category_id}"
        startDate: "${start_date}"
        endDate: "${end_date}"
        employeeNote: "${employee_note}"
        amount: "${amount}"
        dailyAmounts: "${daily_amounts}"
    input:
      employee_id:
        type: integer
        description: The employee taking the leave.
      category_id:
        type: integer
        description: Time-off type id, from list_time_off_types.
      start_date:
        type: string
        description: First day of leave, YYYY-MM-DD.
      end_date:
        type: string
        description: Last day of leave, YYYY-MM-DD.
      employee_note:
        type: string
        description: Note from the employee, shown to the approver.
        optional: true
      amount:
        type: number
        description: Total amount requested, in the type's unit (hours or days).
        optional: true
        minimum: 0
      daily_amounts:
        type: array
        description: >-
          Per-day amounts for a partial-day request, each
          {"date": "YYYY-MM-DD", "amount": <hours>}.
        optional: true
        items: {type: object}
      return_actions:
        type: boolean
        description: Also return the actions available on the new request.
        optional: true
    output:
      description: The created time-off request.
      type: object

  approve_time_off_request:
    title: Approve a time-off request
    description: >-
      Approve a leave request. The employee is emailed and the days come off
      their balance, so this is an outward-facing action with a real effect.
    category: time_off
    request:
      method: POST
      path: /v1/time-off/requests/${request_id}/approvals
      headers:
        Accept: application/json
      query:
        returnActions: "${return_actions}"
      body:
        managerNote: "${manager_note}"
        bypass: "${bypass}"
    input:
      request_id:
        type: string
        description: The request's id, from list_time_off_requests.
      manager_note:
        type: string
        description: Note to the employee explaining the decision.
        optional: true
      bypass:
        type: boolean
        description: Skip the remaining approval steps and approve outright.
        optional: true
      return_actions:
        type: boolean
        description: Also return the actions still available on the request.
        optional: true
    output:
      description: The request after approval.
      type: object

  deny_time_off_request:
    title: Deny a time-off request
    description: >-
      Deny a leave request. The employee is emailed the decision along with
      `manager_note`, so say why.
    category: time_off
    request:
      method: POST
      path: /v1/time-off/requests/${request_id}/denials
      headers:
        Accept: application/json
      query:
        returnActions: "${return_actions}"
      body:
        managerNote: "${manager_note}"
        bypass: "${bypass}"
    input:
      request_id:
        type: string
        description: The request's id.
      manager_note:
        type: string
        description: Note to the employee explaining the denial.
        optional: true
      bypass:
        type: boolean
        description: Skip the remaining approval steps and deny outright.
        optional: true
      return_actions:
        type: boolean
        description: Also return the actions still available on the request.
        optional: true
    output:
      description: The request after denial.
      type: object

  get_time_off_balances:
    title: Get an employee's time-off balances
    description: >-
      Read how much leave an employee has left as of a date, per time-off type.
      The number to check before approving a request.
    category: time_off
    read_only: true
    request:
      method: GET
      path: /v1/employees/${employee_id}/time_off/calculator
      headers:
        Accept: application/json
      query:
        end: "${as_of}"
        precision: "${precision}"
    input:
      employee_id:
        type: string
        description: The employee's id.
      as_of:
        type: string
        description: Date to calculate the balance for, YYYY-MM-DD. Defaults to today.
        optional: true
      precision:
        type: integer
        description: Decimal places to round balances to.
        optional: true
        minimum: 0
    output:
      description: The employee's balance per time-off type.
      type: array
      items:
        type: object
        properties:
          timeOffType: {type: string}
          name: {type: string}
          balance: {type: string}
          units: {type: string}

  adjust_time_off_balance:
    title: Adjust an employee's time-off balance
    description: >-
      Add to or subtract from an employee's leave balance directly -- a
      carry-over, a correction, a one-off grant. `amount` may be negative.
      This changes a real entitlement, so leave a `note` saying why.
    category: time_off
    request:
      method: PUT
      path: /v1/employees/${employee_id}/time_off/balance_adjustment
      headers:
        Accept: application/json
      body:
        date: "${date}"
        timeOffTypeId: "${time_off_type_id}"
        amount: "${amount}"
        note: "${note}"
    input:
      employee_id:
        type: string
        description: The employee's id.
      date:
        type: string
        description: Date the adjustment takes effect, YYYY-MM-DD.
      time_off_type_id:
        type: integer
        description: Which time-off type to adjust, from list_time_off_types.
      amount:
        type: number
        description: Amount to add, in the type's unit. Negative subtracts.
      note:
        type: string
        description: Why the adjustment was made; kept on the record.
        optional: true
    output:
      description: The adjustment as recorded.
      type: object

  list_who_is_out:
    title: See who is out
    description: >-
      List who is away over a date range -- the fastest answer to "is anyone on
      holiday next week", covering both approved leave and company holidays.
    category: time_off
    read_only: true
    request:
      method: GET
      path: /v1/time_off/whos_out
      headers:
        Accept: application/json
      query:
        start: "${start}"
        end: "${end}"
    input:
      start:
        type: string
        description: Start of the range as YYYY-MM-DD. Defaults to today.
        optional: true
      end:
        type: string
        description: End of the range as YYYY-MM-DD. Defaults to 14 days out.
        optional: true
    output:
      description: Who is away in the range.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          type: {type: string}
          employeeId: {type: integer}
          name: {type: string}
          start: {type: string}
          end: {type: string}

  # -- reports and performance ---------------------------------------------

  run_custom_report:
    title: Run a custom report
    description: >-
      Pull a report across employees by naming the fields you want, which is
      how to get more than the directory returns in bulk. Field ids come from
      list_fields; `filters` narrows the rows.
    category: reports
    request:
      method: POST
      path: /v1/reports/custom
      headers:
        Accept: application/json
      query:
        format: JSON
      body:
        title: "${title}"
        fields: "${fields}"
        filters: "${filters}"
    input:
      fields:
        type: array
        description: Field ids to include, e.g. ["firstName","lastName","department","hireDate"].
        items: {type: string}
      title:
        type: string
        description: Name for the report.
        optional: true
      filters:
        type: object
        description: >-
          Row filters, e.g. {"lastChanged": {"includeNull": "no", "value":
          "2026-01-01T00:00:00Z"}}.
        optional: true
    output:
      description: The report rows.
      type: object
      properties:
        title: {type: string}
        fields: {type: array}
        employees: {type: array}

  get_report:
    title: Run a saved report
    description: >-
      Run a report that already exists in BambooHR by its id and read the rows,
      paginated. Use this when someone has built the report in the UI and you
      just want its output.
    category: reports
    read_only: true
    request:
      method: GET
      path: /v1/custom-reports/${report_id}
      headers:
        Accept: application/json
      query:
        page: "${page}"
        page_size: "${page_size}"
    input:
      report_id:
        type: string
        description: The saved report's id.
      page:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Rows per page.
        optional: true
        minimum: 1
    output:
      description: A page of report rows.
      type: object

  list_employee_goals:
    title: List an employee's goals
    description: >-
      Read the performance goals on one employee, with their status, due dates
      and progress. `filter` narrows to open or closed goals.
    category: performance
    read_only: true
    request:
      method: GET
      path: /v1/performance/employees/${employee_id}/goals
      headers:
        Accept: application/json
      query:
        filter: "${filter}"
    input:
      employee_id:
        type: string
        description: The employee's id.
      filter:
        type: string
        description: Which goals to return, e.g. "open" or "closed".
        optional: true
    output:
      description: The employee's goals.
      type: object
