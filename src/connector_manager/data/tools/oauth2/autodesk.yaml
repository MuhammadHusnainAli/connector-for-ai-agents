      updated_at:
        type: string
        description: ISO 8601 date or range the types must have been updated in.
        optional: true
      limit:
        type: integer
        description: Types per page.
        optional: true
      offset:
        type: integer
        description: Offset into the result set.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The project's issue categories and types.
