      type: string
    password:
      description: The password for your Embat service user.
      secret: true
      title: Password
      type: string
  display_name: Embat
  proxy:
    base_url: https://api.embat.io
  token_headers:
    accept: application/json
    content-type: application/json
  token_params:
    email: ${credentials.email}
    password: ${credentials.password}
  token_response:
    token: idToken
