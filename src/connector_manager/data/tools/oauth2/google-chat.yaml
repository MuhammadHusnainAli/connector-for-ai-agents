# Google Chat tools.
#
# Spaces are named "spaces/AAAA…" and messages "spaces/AAAA…/messages/BBBB…";
# those full strings are the ids. An app can only see spaces it has been added
# to.
#
# Docs: https://developers.google.com/chat/api/reference/rest
#
# The tools below the "rest of the API" divider come from Google's own
# discovery document for this API -- the machine readable contract its client
# libraries are generated from -- so their paths, parameters and per-tool OAuth
# scopes are Google's. The hand-authored tools above it are kept because they
# offer a friendlier shape for the common cases.
#
connector_id: google-chat
display_name: Google Chat
docs_url: https://developers.google.com/chat/api/reference/rest

scope_rules:
  strip_prefixes:
    - https://www.googleapis.com/auth/
  implies:
    chat.messages: [chat.messages.readonly, chat.messages.create]
    chat.spaces: [chat.spaces.readonly]
    chat.memberships: [chat.memberships.readonly]

scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope

tools:

  list_spaces:
    title: List spaces
    description: >-
      List the spaces and direct messages the caller can see, with the space
      names every message tool takes.
    category: spaces
    scopes_any: [chat.spaces.readonly, chat.spaces]
    read_only: true
    request:
      method: GET
      path: /v1/spaces
      query:
        pageSize: "${limit}"
        pageToken: "${page_token}"
        filter: "${filter}"
    input:
      limit:
        type: integer
        description: How many spaces per page (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      filter:
        type: string
        description: Filter expression, e.g. "spaceType = \"SPACE\"".
        optional: true
    output:
      description: A page of spaces.
      type: object
      properties:
        spaces: {type: array, description: "Each with name, displayName and spaceType."}
        nextPageToken: {type: string}

  get_space:
    title: Get a space
    description: Read one space's display name, type and membership settings.
    category: spaces
    scopes_any: [chat.spaces.readonly, chat.spaces]
    read_only: true
    request:
      method: GET
      path: /v1/${space}
    input:
      space:
        type: string
        description: The space resource name, e.g. spaces/AAAAAAAAAAA.
        example: spaces/AAAAAAAAAAA
    output:
      description: The space.
      type: object
      properties:
        name: {type: string}
        displayName: {type: string}
        spaceType: {type: string}

  send_message:
    title: Send a message to a space
    description: >-
      Post a message into a space or direct message. Text uses Chat's simple
      formatting (*bold*, _italic_); cards go in cardsV2 for richer layout.
    category: messages
    scopes_any: [chat.messages.create, chat.messages]
    destructive: true
    request:
      method: POST
      path: /v1/${space}/messages
      query:
        messageReplyOption: "${reply_option}"
      body:
        text: "${text}"
        cardsV2: "${cards}"
        thread:
          $when: "${thread_key}"
          threadKey: "${thread_key}"
    input:
      space:
        type: string
        description: Space resource name to post into.
      text:
        type: string
        description: The message text, in Chat's simple formatting.
      cards:
        type: array
        description: "Card objects for rich layout, each {\"cardId\": ..., \"card\": {...}}."
        optional: true
        items: {type: object}
      thread_key:
        type: string
        description: Your own thread key, so related messages group together.
        optional: true
      reply_option:
        type: string
        description: What to do when the thread key names an existing thread.
        optional: true
        enum: [MESSAGE_REPLY_OPTION_UNSPECIFIED, REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD, REPLY_MESSAGE_OR_FAIL]
    output:
      description: The posted message.
      type: object
      properties:
        name: {type: string, description: "Message resource name -- pass to update or delete."}
        createTime: {type: string}
        thread: {type: object}

  list_messages:
    title: List a space's messages
    description: >-
      Read the messages in a space. Requires a user token with chat.messages
      scope; an app token cannot list history it did not create.
    category: messages
    scopes_any: [chat.messages.readonly, chat.messages]
    read_only: true
    request:
      method: GET
      path: /v1/${space}/messages
      query:
        pageSize: "${limit}"
        pageToken: "${page_token}"
        filter: "${filter}"
        orderBy: "${order_by}"
    input:
      space:
        type: string
        description: Space resource name to read.
      limit:
        type: integer
        description: How many messages per page (1-1000).
        optional: true
        default: 50
        minimum: 1
        maximum: 1000
      page_token:
        type: string
        description: Cursor from the previous response.
        optional: true
      filter:
        type: string
        description: Filter expression, e.g. "createTime > \"2026-01-01T00:00:00Z\"".
        optional: true
      order_by:
        type: string
        description: Sort order, e.g. "createTime desc".
        optional: true
    output:
      description: A page of messages.
      type: object
      properties:
        messages: {type: array}
        nextPageToken: {type: string}

  update_message:
    title: Edit a message
    description: >-
      Replace the text or cards of a message the caller posted. update_mask must
      name the fields being written.
    category: messages
    scopes: [chat.messages]
    request:
      method: PATCH
      path: /v1/${message}
      query:
        updateMask: "${update_mask}"
      body:
        text: "${text}"
        cardsV2: "${cards}"
    input:
      message:
        type: string
        description: Message resource name, e.g. spaces/AAA/messages/BBB.
      update_mask:
        type: array
        description: Fields being written, e.g. ["text"] or ["cardsV2"].
        optional: true
        default: "[text]"
        items: {type: string}
      text:
        type: string
        description: Replacement text.
        optional: true
      cards:
        type: array
        description: Replacement cards.
        optional: true
        items: {type: object}
    output:
      description: The edited message.
      type: object
      properties:
        name: {type: string}
        text: {type: string}
        lastUpdateTime: {type: string}

  delete_message:
    title: Delete a message
    description: Permanently remove a message the caller posted. It cannot be recovered.
    category: messages
    scopes: [chat.messages]
    destructive: true
    request:
      method: DELETE
      path: /v1/${message}
    input:
      message:
        type: string
        description: Message resource name.
    output:
      description: An empty object on success.
      type: object

  list_members:
    title: List a space's members
    description: List who belongs to a space, people and apps alike.
    category: members
    scopes_any: [chat.memberships.readonly, chat.memberships]
    read_only: true
    request:
      method: GET
      path: /v1/${space}/members
      query:
        pageSize: "${limit}"
        pageToken: "${page_token}"
    input:
      space:
        type: string
        description: Space resource name.
      limit:
        type: integer
        description: How many members per page (1-1000).
        optional: true
        default: 100
        minimum: 1
        maximum: 1000
      page_token:
        type: string
        description: Cursor from the previous response.
        optional: true
    output:
      description: The space's members.
      type: object
      properties:
        memberships: {type: array}
        nextPageToken: {type: string}

  create_space:
    title: Create a space
    description: >-
      Create a named space. Requires a user token — an app cannot create a space
      on its own behalf.
    category: spaces
    scopes: [chat.spaces]
    request:
      method: POST
      path: /v1/spaces
      body:
        displayName: "${display_name}"
        spaceType: "${space_type}"
        spaceDetails:
          $when: "${description}"
          description: "${description}"
    input:
      display_name:
        type: string
        description: The space's name.
      space_type:
        type: string
        description: What kind of space to create.
        optional: true
        default: SPACE
        enum: [SPACE, GROUP_CHAT, DIRECT_MESSAGE]
      description:
        type: string
        description: What the space is for.
        optional: true
    output:
      description: The created space.
      type: object
      properties:
        name: {type: string}
        displayName: {type: string}

  add_member:
    title: Add someone to a space
    description: >-
      Add a person to a space by their Chat user name, "users/{id}" or
      "users/{email}".
    category: members
    scopes: [chat.memberships]
    request:
      method: POST
      path: /v1/${space}/members
      body:
        member:
          name: "${member}"
          type: HUMAN
    input:
      space:
        type: string
        description: Space resource name.
      member:
        type: string
        description: Member resource name, e.g. users/ada@example.com.
    output:
      description: The new membership.
      type: object
      properties:
        name: {type: string}
        state: {type: string}
        member: {type: object}

  # -- the rest of the API, from Google's own discovery document ------------

  create_custom_emoji:
    title: Create custom emoji
    description: 'Creates a custom emoji. Custom emojis are only available for Google Workspace accounts,
      and the administrator must turn custom emojis on for the organization. For more information, see
      Learn about custom emojis in Google Chat and Manage custom emoji permissions. Requires user authentication
      with the authorization scope: - https://www.googleapis.com/auth/chat.customemojis'
    category: custom_emojis
    request:
      method: POST
      path: /v1/customEmojis
      body:
        emojiName: ${emoji_name}
        payload: ${payload}
        name: ${name}
    input:
      emoji_name:
        type: string
        description: Optional. Immutable. User-provided name for the custom emoji, which is unique within
          the organization. Required when the custom emoji is created, output only otherwise. Emoji names
          must start and end with colons, must be lowercase and can only contain alphanumeric characters,
          hyphens, and underscore
        optional: true
      payload:
        type: string
        description: Optional. Input only. Payload data. Required when the custom emoji is created.
        optional: true
      name:
        type: string
        description: 'Identifier. The resource name of the custom emoji, assigned by the server. Format:
          customEmojis/{customEmoji}'
        optional: true
    output:
      description: The CustomEmoji resource.
      type: object
    scopes:
    - chat.customemojis
  list_custom_emojis:
    title: List custom emojis
    description: 'Lists custom emojis visible to the authenticated user. Custom emojis are only available
      for Google Workspace accounts, and the administrator must turn custom emojis on for the organization.
      For more information, see Learn about custom emojis in Google Chat and Manage custom emoji permissions.
      Requires user authentication with one of the following authorization scopes: - https://www.googleapis.com/auth/chat.customemoj'
    category: custom_emojis
    request:
      method: GET
      path: /v1/customEmojis
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      filter:
        type: string
        description: Optional. A query filter. Supports filtering by creator. To filter by creator, you
          must specify a valid value. Currently only creator("users/me") and NOT creator("users/me") are
          accepted to filter custom emojis by whether they were created by the calling user or not. For
          example, the following query
        optional: true
      page_size:
        type: integer
        description: Optional. The maximum number of custom emojis returned. The service can return fewer
          custom emojis than this value. If unspecified, the default value is 25. The maximum value is
          200; values above 200 are changed to 200.
        optional: true
      page_token:
        type: string
        description: Optional. (If resuming from a previous query.) A page token received from a previous
          list custom emoji call. Provide this to retrieve the subsequent page. When paginating, the filter
          value should match the call that provided the page token. Passing a different value might lead
          to unexpected results.
        optional: true
    output:
      description: The ListCustomEmojisResponse resource.
      type: object
    scopes_any:
    - chat.customemojis
    - chat.customemojis.readonly
    read_only: true
  download_media:
    title: Download media
    description: Downloads media. Download is supported on the URI /v1/media/{+name}?alt=media.
    category: media
    request:
      method: GET
      path: /v1/media/${resource_name}
    input:
      resource_name:
        type: string
        description: Name of the media that is being downloaded. See ReadRequest.resource_name.
    output:
      description: The Media resource.
      type: object
    scopes_any:
    - chat.bot
    - chat.messages
    - chat.messages.readonly
    read_only: true
  upload_media:
    title: Upload media
    description: 'Uploads an attachment. For an example, see Upload media as a file attachment. Requires
      user authentication with one of the following authorization scopes: - https://www.googleapis.com/auth/chat.messages.create
      - https://www.googleapis.com/auth/chat.messages - https://www.googleapis.com/auth/chat.import (import
      mode spaces only) You can upload attachments up to 200 MB. Certain file types aren''t supported.
      For details,'
    category: media
    request:
      method: POST
      path: /v1/${parent}/attachments:upload
      body:
        filename: ${filename}
    input:
      parent:
        type: string
        description: Required. Resource name of the Chat space in which the attachment is uploaded. Format
          "spaces/{space}".
      filename:
        type: string
        description: Required. The filename of the attachment, including the file extension.
        optional: true
    output:
      description: The UploadAttachmentResponse resource.
      type: object
    scopes_any:
    - chat.import
    - chat.messages
    - chat.messages.create
  complete_import_space:
    title: Complete import space
    description: 'Completes the import process for the specified space and makes it visible to users.
      Requires user authentication and domain-wide delegation with the authorization scope: - https://www.googleapis.com/auth/chat.import
      For more information, see Authorize Google Chat apps to import data.'
    category: spaces
    request:
      method: POST
      path: /v1/${name}:completeImport
      body: ${body}
    input:
      name:
        type: string
        description: 'Required. Resource name of the import mode space. Format: spaces/{space}'
      body:
        type: object
        description: The CompleteImportSpaceRequest resource, as the API's own reference defines it.
    output:
      description: The CompleteImportSpaceResponse resource.
      type: object
    scopes:
    - chat.import
  find_direct_message_space:
    title: Find direct message space
    description: Returns the existing direct message with the specified user. If no direct message space
      is found, returns a 404 NOT_FOUND error. For an example, see [Find a direct message](/chat/api/guides/v1/spaces/find-direct-message).
      With app authentication, returns the direct message space between the specified user and the calling
      Chat app. With user authentication, returns the direct message space between the specified user
      a
    category: spaces
    request:
      method: GET
      path: /v1/spaces:findDirectMessage
      query:
        name: ${name}
    input:
      name:
        type: string
        description: 'Required. Resource name of the user to find direct message with. Format: users/{user},
          where {user} is either the id for the person from the People API, or the id for the user in
          the Directory API. For example, if the People API profile ID is 123456789, you can find a direct
          message with that person'
        optional: true
    output:
      description: The Space resource.
      type: object
    scopes_any:
    - chat.bot
    - chat.spaces
    - chat.spaces.readonly
    read_only: true
  find_group_chats_space:
    title: Find group chats space
    description: Returns all spaces with spaceType == GROUP_CHAT, whose human memberships contain exactly
      the calling user, and the users specified in FindGroupChatsRequest.users. Only members that have
      joined the conversation are supported. For an example, see Find group chats. If the calling user
      blocks, or is blocked by, some users, and no spaces with the entire specified set of users are found,
      this method returns spaces that don
    category: spaces
    request:
      method: GET
      path: /v1/spaces:findGroupChats
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
        spaceView: ${space_view}
        users: ${users}
    input:
      page_size:
        type: integer
        description: Optional. The maximum number of spaces to return. The service might return fewer
          than this value. If unspecified, at most 10 spaces are returned. The maximum value is 30. If
          you use a value more than 30, it's automatically changed to 30. Negative values return an INVALID_ARGUMENT
          error.
        optional: true
      page_token:
        type: string
        description: Optional. A page token, received from a previous call to find group chats. Provide
          this parameter to retrieve the subsequent page. When paginating, all other parameters provided
          should match the call that provided the token. Passing different values may lead to unexpected
          results.
        optional: true
      space_view:
        type: string
        description: Requested space view type. If unset, defaults to SPACE_VIEW_RESOURCE_NAME_ONLY. Requests
          that specify SPACE_VIEW_EXPANDED must include scopes that allow reading space data, for example,
          https://www.googleapis.com/auth/chat.spaces or https://www.googleapis.com/auth/chat.spaces.readonly.
        optional: true
        enum:
        - SPACE_VIEW_UNSPECIFIED
        - SPACE_VIEW_RESOURCE_NAME_ONLY
        - SPACE_VIEW_EXPANDED
      users:
        type: string
        description: 'Optional. Resource names of all human users in group chat with the calling user.
          Chat apps can''t be included in the request. The maximum number of users that can be specified
          in a single request is 49. Format: users/{user}, where {user} is either the id for the person
          from the People API, or the id'
        optional: true
    output:
      description: The FindGroupChatsResponse resource.
      type: object
    scopes_any:
    - chat.memberships
    - chat.memberships.readonly
    read_only: true
  create_message_pin:
    title: Create message pin
    description: 'Creates a message pin. Requires user authentication with one of the following authorization
      scopes: - https://www.googleapis.com/auth/chat.spaces.pins - https://www.googleapis.com/auth/chat.spaces'
    category: spaces
    request:
      method: POST
      path: /v1/${parent}/messagePins
      body:
        name: ${name}
        message: ${message}
    input:
      parent:
        type: string
        description: 'Required. The parent space in which to create the message pin. Format: spaces/{space}'
      name:
        type: string
        description: 'Identifier. The resource name of the message pin. Format: spaces/{space}/messagePins/{message_pin}
          The resource ID component matches the resource ID component of the message. For example, a message
          with spaces/AAA/messages/bbb.ccc corresponds to the message pin with the resource name spaces/AAA/mess'
        optional: true
      message:
        type: string
        description: 'Required. Immutable. The resource name of the message that is pinned. Format: spaces/{space}/messages/{message}'
        optional: true
    output:
      description: The MessagePin resource.
      type: object
    scopes_any:
    - chat.spaces
    - chat.spaces.pins
  list_message_pins:
    title: List message pins
    description: 'Lists message pins in a space. Users can pin important messages in spaces for easy access.
      For more information, see Pin or unpin a conversation in Google Chat. Requires user authentication
      with one of the following authorization scopes: - https://www.googleapis.com/auth/chat.spaces.pins.readonly
      - https://www.googleapis.com/auth/chat.spaces.pins - https://www.googleapis.com/auth/chat.spaces.readonly
      - https://www.go'
    category: spaces
    request:
      method: GET
      path: /v1/${parent}/messagePins
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. The parent space which owns the collection of pinned items Format: spaces/{space}'
      page_size:
        type: integer
        description: Optional. The maximum number of message pins returned. The service might return fewer
          messages than this value. The maximum value is 100. If you use a value more than 100, it's automatically
          changed to 100. If unspecified, at most 100 message pins will be returned. Negative values return
          an INVALID_
        optional: true
      page_token:
        type: string
        description: Optional. A page token received from a previous list message pins call. Provide this
          parameter to retrieve the subsequent page. When paginating, all other parameters provided should
          match the call that provided the page token. Passing different values to the other parameters
          might lead to unexpected
        optional: true
    output:
      description: The ListMessagePinsResponse resource.
      type: object
    scopes_any:
    - chat.spaces
    - chat.spaces.pins
    - chat.spaces.pins.readonly
    - chat.spaces.readonly
    read_only: true
  create_reaction:
    title: Create reaction
    description: 'Creates a reaction and adds it to a message. For an example, see Add a reaction to a
      message. Requires user authentication with one of the following authorization scopes: - https://www.googleapis.com/auth/chat.messages.reactions.create
      - https://www.googleapis.com/auth/chat.messages.reactions - https://www.googleapis.com/auth/chat.messages
      - https://www.googleapis.com/auth/chat.import (import mode spaces only)'
    category: spaces
    request:
      method: POST
      path: /v1/${parent}/reactions
      body:
        emoji: ${emoji}
        name: ${name}
    input:
      parent:
        type: string
        description: 'Required. The message where the reaction is created. Format: spaces/{space}/messages/{message}'
      emoji:
        type: string
        description: Required. The emoji used in the reaction.
        optional: true
      name:
        type: string
        description: 'Identifier. The resource name of the reaction. Format: spaces/{space}/messages/{message}/reactions/{reaction}'
        optional: true
    output:
      description: The Reaction resource.
      type: object
    scopes_any:
    - chat.import
    - chat.messages
    - chat.messages.reactions
    - chat.messages.reactions.create
  list_reactions:
    title: List reactions
    description: 'Lists reactions to a message. For an example, see List reactions for a message. Requires
      user authentication with one of the following authorization scopes: - https://www.googleapis.com/auth/chat.messages.reactions.readonly
      - https://www.googleapis.com/auth/chat.messages.reactions - https://www.googleapis.com/auth/chat.messages.readonly
      - https://www.googleapis.com/auth/chat.messages'
    category: spaces
    request:
      method: GET
      path: /v1/${parent}/reactions
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. The message users reacted to. Format: spaces/{space}/messages/{message}'
      filter:
        type: string
        description: Optional. A query filter. You can filter reactions by emoji (either emoji.unicode
          or emoji.custom_emoji.uid) and user (user.name). To filter reactions for multiple emojis or
          users, join similar fields with the OR operator, such as emoji.unicode = "🙂" OR emoji.unicode
          = "👍" and user.name = "users/AAA
        optional: true
      page_size:
        type: integer
        description: Optional. The maximum number of reactions returned. The service can return fewer
          reactions than this value. If unspecified, the default value is 25. The maximum value is 200;
          values above 200 are changed to 200.
        optional: true
      page_token:
        type: string
        description: Optional. (If resuming from a previous query.) A page token received from a previous
          list reactions call. Provide this to retrieve the subsequent page. When paginating, the filter
          value should match the call that provided the page token. Passing a different value might lead
          to unexpected results.
        optional: true
    output:
      description: The ListReactionsResponse resource.
      type: object
    scopes_any:
    - chat.messages
    - chat.messages.reactions
    - chat.messages.reactions.readonly
    - chat.messages.readonly
    read_only: true
  search_message:
    title: Search message
    description: Searches for messages in Google Chat that the calling user has access to. Returns a list
      of messages matching the search criteria. To search across all spaces the user has access to, set
      parent to spaces/-. Using any other value for parent results in an INVALID_ARGUMENT error. The returned
      messages have their name field populated with the full resource name, which includes the specific
      space in which the message resi
    category: spaces
    request:
      method: POST
      path: /v1/${parent}/messages:search
      body:
        markupSyntax: ${markup_syntax}
        pageSize: ${page_size}
        pageToken: ${page_token}
        orderBy: ${order_by}
        filter: ${filter}
        view: ${view}
    input:
      parent:
        type: string
        description: Required. The resource name of the space to search within. To search across all spaces
          the user has access to, set this field to spaces/-. Using any other value for parent results
          in an INVALID_ARGUMENT error. To limit the search to one or more spaces, use space.name or space.display_name
          in the fil
      markup_syntax:
        type: string
        description: Optional. Specifies the desired output syntax for the Chat message formatted_text
          field.
        optional: true
        enum:
        - MARKUP_SYNTAX_UNSPECIFIED
        - MARKUP_SYNTAX_CHAT
        - MARKUP_SYNTAX_MARKDOWN
      page_size:
        type: integer
        description: Optional. The maximum number of results to return. The service may return fewer than
          this value. If unspecified, at most 25 are returned. The maximum value is 100. If you use a
          value more than 100, it's automatically changed to 100.
        optional: true
      page_token:
        type: string
        description: Optional. A token, received from the previous search messages call. Provide this
          parameter to retrieve the subsequent page. When paginating, all other parameters provided should
          match the call that provided the page token. Passing different values to the other parameters
