# Gmail API tools.
#
# Google grants scopes as full URLs; scope_rules strips the shared
# https://www.googleapis.com/auth/ prefix so tools can name them plainly. The
# unrestricted mailbox scope https://mail.google.com/ does not share that prefix
# and is spelled in full.
#
# Gmail's send endpoints take a raw RFC 2822 message, so the composing tools use
# the $mime construct: callers pass to / subject / body / attachments and the
# message is assembled and base64url-encoded here.
#
# Docs: https://developers.google.com/gmail/api/reference/rest
#
# The tools below the "rest of the API" divider come from Google's own
# discovery document for this API -- the machine readable contract its client
# libraries are generated from -- so their paths, parameters and per-tool OAuth
# scopes are Google's. The hand-authored tools above it are kept because they
# offer a friendlier shape for the common cases.
#
connector_id: google-mail
display_name: Gmail
docs_url: https://developers.google.com/gmail/api/reference/rest

scope_rules:
  strip_prefixes:
    - https://www.googleapis.com/auth/
  implies:
    https://mail.google.com/: [gmail.modify, gmail.readonly, gmail.send, gmail.compose, gmail.labels, gmail.settings.basic]
    gmail.modify: [gmail.readonly, gmail.labels, gmail.compose, gmail.send]
    gmail.compose: [gmail.send]

scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope

tools:

  list_messages:
    title: List or search messages
    description: >-
      List message ids in the mailbox, optionally narrowed by Gmail's search
      syntax -- "from:ada@example.com is:unread", "subject:invoice after:2026/01/01".
      Only ids and thread ids come back; fetch each with get_message.
    category: mail.read
    scopes_any: [gmail.readonly, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/messages
      query:
        q: "${query}"
        maxResults: "${limit}"
        pageToken: "${page_token}"
        labelIds: "${label_ids}"
        includeSpamTrash: "${include_spam_trash}"
    input:
      query:
        type: string
        description: Gmail search query, the same syntax as the Gmail search box.
        optional: true
        example: "is:unread from:ada@example.com"
      limit:
        type: integer
        description: How many message ids per page (1-500).
        optional: true
        default: 25
        minimum: 1
        maximum: 500
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      label_ids:
        type: array
        description: Only messages carrying all of these label ids, e.g. ["INBOX","UNREAD"].
        optional: true
        items: {type: string}
      include_spam_trash:
        type: boolean
        description: Include messages in Spam and Trash.
        optional: true
    output:
      description: A page of message ids with the cursor for the next page.
      type: object
      properties:
        messages: {type: array, description: "Each with id and threadId."}
        nextPageToken: {type: string}
        resultSizeEstimate: {type: integer}

  get_message:
    title: Get a message
    description: >-
      Fetch one message. format=full returns the parsed headers and body parts;
      metadata returns headers only; raw returns the original RFC 2822 bytes.
    category: mail.read
    scopes_any: [gmail.readonly, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/messages/${message_id}
      query:
        format: "${format}"
        metadataHeaders: "${metadata_headers}"
    input:
      message_id:
        type: string
        description: The message id, from list_messages.
      format:
        type: string
        description: How much of the message to return.
        optional: true
        default: full
        enum: [full, metadata, minimal, raw]
      metadata_headers:
        type: array
        description: With format=metadata, which headers to include, e.g. ["From","Subject"].
        optional: true
        items: {type: string}
    output:
      description: The message.
      type: object
      properties:
        id: {type: string}
        threadId: {type: string}
        labelIds: {type: array}
        snippet: {type: string}
        payload: {type: object, description: "Headers and body parts."}

  get_thread:
    title: Get a conversation thread
    description: >-
      Fetch every message in one conversation, so a whole exchange can be read
      or summarised in a single call.
    category: mail.read
    scopes_any: [gmail.readonly, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/threads/${thread_id}
      query:
        format: "${format}"
    input:
      thread_id:
        type: string
        description: The thread id, from a message's threadId.
      format:
        type: string
        description: How much of each message to return.
        optional: true
        default: full
        enum: [full, metadata, minimal]
    output:
      description: The thread and its messages.
      type: object
      properties:
        id: {type: string}
        messages: {type: array}

  get_attachment:
    title: Get a message attachment
    description: >-
      Download one attachment's bytes, base64url-encoded. The attachment id
      comes from the message payload's part bodies.
    category: mail.read
    scopes_any: [gmail.readonly, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/messages/${message_id}/attachments/${attachment_id}
    input:
      message_id:
        type: string
        description: The message the attachment belongs to.
      attachment_id:
        type: string
        description: Attachment id from the message payload's part body.
    output:
      description: The attachment's content.
      type: object
      properties:
        size: {type: integer}
        data: {type: string, description: "The file's bytes, base64url-encoded."}

  send_email:
    title: Send an email
    description: >-
      Compose and send a message immediately. The RFC 2822 message is assembled
      from these fields, so no MIME handling is needed by the caller. Use
      send_email_with_attachments to attach files.
    category: mail.send
    scopes_any: [gmail.send, gmail.compose, gmail.modify]
    destructive: true
    request:
      method: POST
      path: /gmail/v1/users/me/messages/send
      body:
        raw:
          $mime:
            to: "${to}"
            cc: "${cc}"
            bcc: "${bcc}"
            subject: "${subject}"
            body: "${body}"
            body_type: "${body_type}"
            reply_to: "${reply_to}"
    input:
      to:
        type: array
        description: Recipient email addresses.
        items: {type: string, format: email}
      subject:
        type: string
        description: Subject line.
      body:
        type: string
        description: Message body. HTML markup is allowed when body_type is html.
      body_type:
        type: string
        description: Whether body is HTML markup or plain text.
        optional: true
        default: html
        enum: [html, text]
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
      bcc:
        type: array
        description: Addresses to blind-copy.
        optional: true
        items: {type: string, format: email}
      reply_to:
        type: string
        description: Address replies should go to.
        optional: true
        format: email
    output:
      description: The sent message.
      type: object
      properties:
        id: {type: string}
        threadId: {type: string}
        labelIds: {type: array}

  send_email_with_attachments:
    title: Send an email with file attachments
    description: >-
      Send a message with files attached. Each attachment carries its bytes
      base64-encoded; Gmail accepts up to 35 MB per message this way.
    category: mail.send
    scopes_any: [gmail.send, gmail.compose, gmail.modify]
    destructive: true
    request:
      method: POST
      path: /gmail/v1/users/me/messages/send
      body:
        raw:
          $mime:
            to: "${to}"
            cc: "${cc}"
            bcc: "${bcc}"
            subject: "${subject}"
            body: "${body}"
            body_type: "${body_type}"
            attachments: "${attachments}"
    input:
      to:
        type: array
        description: Recipient email addresses.
        items: {type: string, format: email}
      subject:
        type: string
        description: Subject line.
      body:
        type: string
        description: Message body.
      attachments:
        type: array
        description: >-
          Files to attach, each {"name": "report.pdf", "content_bytes":
          "<base64 of the file>", "content_type": "application/pdf"}.
        items:
          type: object
          properties:
            name: {type: string}
            content_bytes: {type: string}
            content_type: {type: string}
      body_type:
        type: string
        description: Whether body is HTML markup or plain text.
        optional: true
        default: html
        enum: [html, text]
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
      bcc:
        type: array
        description: Addresses to blind-copy.
        optional: true
        items: {type: string, format: email}
    output:
      description: The sent message.
      type: object
      properties:
        id: {type: string}
        threadId: {type: string}

  reply_to_message:
    title: Reply to a message
    description: >-
      Send a reply that threads correctly under an existing conversation. Pass
      the thread id and the original message's Message-ID header so Gmail and
      the recipient's client group it with the original.
    category: mail.send
    scopes_any: [gmail.send, gmail.compose, gmail.modify]
    destructive: true
    request:
      method: POST
      path: /gmail/v1/users/me/messages/send
      body:
        threadId: "${thread_id}"
        raw:
          $mime:
            to: "${to}"
            cc: "${cc}"
            subject: "${subject}"
            body: "${body}"
            body_type: "${body_type}"
            in_reply_to: "${in_reply_to}"
    input:
      thread_id:
        type: string
        description: Thread id of the conversation being replied to.
      to:
        type: array
        description: Who to reply to, usually the original sender.
        items: {type: string, format: email}
      subject:
        type: string
        description: "Subject line, conventionally the original prefixed with \"Re: \"."
      body:
        type: string
        description: The reply text.
      in_reply_to:
        type: string
        description: The original message's Message-ID header, so clients thread the reply.
        optional: true
      body_type:
        type: string
        description: Whether body is HTML markup or plain text.
        optional: true
        default: html
        enum: [html, text]
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
    output:
      description: The sent reply.
      type: object
      properties:
        id: {type: string}
        threadId: {type: string}

  create_draft:
    title: Create a draft email
    description: >-
      Save an unsent draft in the mailbox. Nothing is sent until send_draft is
      called, which makes this the safe way to compose something a human should
      approve first.
    category: mail.draft
    scopes_any: [gmail.compose, gmail.modify]
    request:
      method: POST
      path: /gmail/v1/users/me/drafts
      body:
        message:
          raw:
            $mime:
              to: "${to}"
              cc: "${cc}"
              bcc: "${bcc}"
              subject: "${subject}"
              body: "${body}"
              body_type: "${body_type}"
              attachments: "${attachments}"
    input:
      subject:
        type: string
        description: Subject line.
      body:
        type: string
        description: Message body.
      to:
        type: array
        description: Recipient email addresses. May be filled in later with update_draft.
        optional: true
        items: {type: string, format: email}
      body_type:
        type: string
        description: Whether body is HTML markup or plain text.
        optional: true
        default: html
        enum: [html, text]
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
      bcc:
        type: array
        description: Addresses to blind-copy.
        optional: true
        items: {type: string, format: email}
      attachments:
        type: array
        description: Files to attach, each with name, content_bytes and content_type.
        optional: true
        items: {type: object}
    output:
      description: The created draft.
      type: object
      properties:
        id: {type: string, description: "Draft id -- pass to update_draft or send_draft."}
        message: {type: object}

  update_draft:
    title: Update a draft email
    description: >-
      Replace a draft's content wholesale. Gmail drafts are immutable messages,
      so every field must be supplied again, not just what changed.
    category: mail.draft
    scopes_any: [gmail.compose, gmail.modify]
    request:
      method: PUT
      path: /gmail/v1/users/me/drafts/${draft_id}
      body:
        message:
          raw:
            $mime:
              to: "${to}"
              cc: "${cc}"
              bcc: "${bcc}"
              subject: "${subject}"
              body: "${body}"
              body_type: "${body_type}"
              attachments: "${attachments}"
    input:
      draft_id:
        type: string
        description: The draft's id.
      to:
        type: array
        description: Recipient email addresses. Replaces the previous list.
        items: {type: string, format: email}
      subject:
        type: string
        description: Subject line.
      body:
        type: string
        description: Message body.
      body_type:
        type: string
        description: Whether body is HTML markup or plain text.
        optional: true
        default: html
        enum: [html, text]
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
      bcc:
        type: array
        description: Addresses to blind-copy.
        optional: true
        items: {type: string, format: email}
      attachments:
        type: array
        description: Files to attach. Attachments not repeated here are lost.
        optional: true
        items: {type: object}
    output:
      description: The updated draft.
      type: object
      properties:
        id: {type: string}
        message: {type: object}

  list_drafts:
    title: List drafts
    description: List the unsent drafts in the mailbox, with their ids.
    category: mail.draft
    scopes_any: [gmail.readonly, gmail.compose, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/drafts
      query:
        maxResults: "${limit}"
        pageToken: "${page_token}"
        q: "${query}"
    input:
      limit:
        type: integer
        description: How many drafts per page (1-500).
        optional: true
        default: 25
        minimum: 1
        maximum: 500
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      query:
        type: string
        description: Gmail search query to narrow the drafts.
        optional: true
    output:
      description: A page of drafts.
      type: object
      properties:
        drafts: {type: array}
        nextPageToken: {type: string}

  send_draft:
    title: Send a draft
    description: Send a saved draft. Once sent it becomes an ordinary message and cannot be edited.
    category: mail.send
    scopes_any: [gmail.send, gmail.compose, gmail.modify]
    destructive: true
    request:
      method: POST
      path: /gmail/v1/users/me/drafts/send
      body:
        id: "${draft_id}"
    input:
      draft_id:
        type: string
        description: The draft's id.
    output:
      description: The sent message.
      type: object
      properties:
        id: {type: string}
        threadId: {type: string}

  delete_draft:
    title: Delete a draft
    description: Permanently remove an unsent draft. It cannot be recovered.
    category: mail.draft
    scopes_any: [gmail.compose, gmail.modify]
    destructive: true
    request:
      method: DELETE
      path: /gmail/v1/users/me/drafts/${draft_id}
    input:
      draft_id:
        type: string
        description: The draft's id.
    output:
      description: Empty on success -- Gmail answers 204 No Content.
      type: object

  modify_message_labels:
    title: Add or remove a message's labels
    description: >-
      Change which labels a message carries. This is how a message is marked
      read (remove UNREAD), archived (remove INBOX) or starred (add STARRED).
    category: mail.organise
    scopes: [gmail.modify]
    request:
      method: POST
      path: /gmail/v1/users/me/messages/${message_id}/modify
      body:
        addLabelIds: "${add_label_ids}"
        removeLabelIds: "${remove_label_ids}"
    input:
      message_id:
        type: string
        description: The message id.
      add_label_ids:
        type: array
        description: Label ids to add, e.g. ["STARRED"] or a custom label id.
        optional: true
        items: {type: string}
      remove_label_ids:
        type: array
        description: Label ids to remove, e.g. ["UNREAD"] to mark read or ["INBOX"] to archive.
        optional: true
        items: {type: string}
    output:
      description: The message with its new label set.
      type: object
      properties:
        id: {type: string}
        labelIds: {type: array}

  trash_message:
    title: Move a message to the trash
    description: >-
      Move a message to Trash, where Gmail keeps it for 30 days. Reversible from
      the Gmail UI, but not by this tool.
    category: mail.organise
    scopes: [gmail.modify]
    destructive: true
    request:
      method: POST
      path: /gmail/v1/users/me/messages/${message_id}/trash
      body:
        id: "${message_id}"
    input:
      message_id:
        type: string
        description: The message to trash.
    output:
      description: The trashed message.
      type: object
      properties:
        id: {type: string}
        labelIds: {type: array}

  list_labels:
    title: List labels
    description: >-
      List the mailbox's labels -- Gmail's system labels (INBOX, UNREAD,
      STARRED, SPAM) and the user's own -- with the ids the label tools take.
    category: mail.organise
    scopes_any: [gmail.readonly, gmail.labels, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/labels
    input: {}
    output:
      description: Every label in the mailbox.
      type: object
      properties:
        labels: {type: array, description: "Each with id, name and type."}

  create_label:
    title: Create a label
    description: Create a user label the message tools can then apply.
    category: mail.organise
    scopes: [gmail.labels]
    request:
      method: POST
      path: /gmail/v1/users/me/labels
      body:
        name: "${name}"
        labelListVisibility: "${label_list_visibility}"
        messageListVisibility: "${message_list_visibility}"
    input:
      name:
        type: string
        description: Label name. Use a slash for nesting, e.g. "Clients/Acme".
      label_list_visibility:
        type: string
        description: Whether the label shows in the sidebar.
        optional: true
        enum: [labelShow, labelShowIfUnread, labelHide]
      message_list_visibility:
        type: string
        description: Whether the label shows on messages.
        optional: true
        enum: [show, hide]
    output:
      description: The created label.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  get_profile:
    title: Get the mailbox profile
    description: >-
      Read which mailbox the token belongs to, its total message and thread
      counts. The cheapest health check for a Gmail connection.
    category: mail.read
    scopes_any: [gmail.readonly, gmail.metadata, gmail.modify]
    read_only: true
    request:
      method: GET
      path: /gmail/v1/users/me/profile
    input: {}
    output:
      description: The mailbox profile.
      type: object
      properties:
        emailAddress: {type: string}
        messagesTotal: {type: integer}
        threadsTotal: {type: integer}
        historyId: {type: string}

  # -- the rest of the API, from Google's own discovery document ------------

  get_draft:
    title: Get draft
    description: Gets the specified draft. For more information, see Create and send draft emails.
    category: users
    request:
      method: GET
      path: /gmail/v1/users/${user_id}/drafts/${id}
      query:
        format: ${format}
    input:
      id:
        type: string
        description: The ID of the draft to retrieve.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      format:
        type: string
        description: The format to return the draft in.
        optional: true
        default: full
        enum:
        - minimal
        - full
        - raw
        - metadata
    output:
      description: The Draft resource.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.compose
    - gmail.modify
    - gmail.readonly
    read_only: true
  list_history:
    title: List history
    description: Lists the history of all changes to the given mailbox. History results are returned in
      chronological order (increasing historyId). For more information, see Synchronize clients with Gmail.
    category: users
    request:
      method: GET
      path: /gmail/v1/users/${user_id}/history
      query:
        historyTypes: ${history_types}
        labelId: ${label_id}
        maxResults: ${max_results}
        pageToken: ${page_token}
        startHistoryId: ${start_history_id}
    input:
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      history_types:
        type: string
        description: History types to be returned by the function
        optional: true
        enum:
        - messageAdded
        - messageDeleted
        - labelAdded
        - labelRemoved
      label_id:
        type: string
        description: Only return messages with a label matching the ID.
        optional: true
      max_results:
        type: integer
        description: Maximum number of history records to return. This field defaults to 100. The maximum
          allowed value for this field is 500.
        optional: true
        default: 100
      page_token:
        type: string
        description: Page token to retrieve a specific page of results in the list.
        optional: true
      start_history_id:
        type: string
        description: Required. Returns history records after the specified startHistoryId. The supplied
          startHistoryId should be obtained from the historyId of a message, thread, or previous list
          response. History IDs increase chronologically but are not contiguous with random gaps in between
          valid IDs. Supplying an inv
        optional: true
    output:
      description: The ListHistoryResponse resource.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.metadata
    - gmail.modify
    - gmail.readonly
    read_only: true
  delete_label:
    title: Delete label
    description: Immediately and permanently deletes the specified label and removes it from any messages
      and threads that it's applied to. For more information, see Manage labels.
    category: users
    request:
      method: DELETE
      path: /gmail/v1/users/${user_id}/labels/${id}
    input:
      id:
        type: string
        description: The ID of the label to delete.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.labels
    - gmail.modify
    destructive: true
  get_label:
    title: Get label
    description: Gets the specified label. For more information, see Manage labels.
    category: users
    request:
      method: GET
      path: /gmail/v1/users/${user_id}/labels/${id}
    input:
      id:
        type: string
        description: The ID of the label to retrieve.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
    output:
      description: The Label resource.
      type: object
    scopes_any:
    - https://mail.google.com/
    - gmail.labels
    - gmail.metadata
    - gmail.modify
    - gmail.readonly
    read_only: true
  update_label:
    title: Update label
    description: Patch the specified label. For more information, see Manage labels.
    category: users
    request:
      method: PATCH
      path: /gmail/v1/users/${user_id}/labels/${id}
      body:
        messagesTotal: ${messages_total}
        messagesUnread: ${messages_unread}
        messageListVisibility: ${message_list_visibility}
        name: ${name}
        type: ${type}
        threadsTotal: ${threads_total}
        color: ${color}
        labelListVisibility: ${label_list_visibility}
        threadsUnread: ${threads_unread}
    input:
      id:
        type: string
        description: The ID of the label to update.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      messages_total:
        type: integer
        description: The total number of messages with the label.
        optional: true
      messages_unread:
        type: integer
