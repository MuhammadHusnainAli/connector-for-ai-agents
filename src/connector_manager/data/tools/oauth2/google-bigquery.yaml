  insert_all_tabledata:
    title: Insert all tabledata
    description: 'Streams data into BigQuery one record at a time without needing to run a load job. #
      IAM Permissions Requires the following IAM permission(s) to use this method: - bigquery.tables.updateData
      on the table. - bigquery.tables.get on the table. - bigquery.datasets.get on the dataset.'
    category: tabledata
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}/tables/${table_id}/insertAll
      body:
        ignoreUnknownValues: ${ignore_unknown_values}
        rows: ${rows}
        traceId: ${trace_id}
        skipInvalidRows: ${skip_invalid_rows}
        templateSuffix: ${template_suffix}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of the destination.
      project_id:
        type: string
        description: Required. Project ID of the destination.
      table_id:
        type: string
        description: Required. Table ID of the destination.
      ignore_unknown_values:
        type: boolean
        description: Optional. Accept rows that contain values that do not match the schema. The unknown
          values are ignored. Default is false, which treats unknown values as errors.
        optional: true
      rows:
        type: array
        items:
          type: object
        description: The rows.
        optional: true
      trace_id:
        type: string
        description: Optional. Unique request trace id. Used for debugging purposes only. It is case-sensitive,
          limited to up to 36 ASCII characters. A UUID is recommended.
        optional: true
      skip_invalid_rows:
        type: boolean
        description: Optional. Insert all valid rows of a request, even if invalid rows exist. The default
          value is false, which causes the entire request to fail if any invalid rows exist.
        optional: true
      template_suffix:
        type: string
        description: Optional. If specified, treats the destination table as a base template, and inserts
          the rows into an instance table named "{destination}{templateSuffix}". BigQuery will manage
          creation of the instance table, using the schema of the base template table. See https://cloud.google.com/bigquery/streamin
        optional: true
    output:
      description: The TableDataInsertAllResponse resource.
      type: object
    scopes_any:
    - bigquery
    - bigquery.insertdata
    - cloud-platform
