      type: object
    read_only: true
  create_v2_onboarding_attempts:
    title: Start attested onboarding
    description: 'Start attested onboarding Create an onboarding attempt for a phone number you already
      hold and text the returned walleturl to the user. No Agentcard account exists yet: the user sees
      the wallet instantly, and our one-time code fires exactly once, inside our page, at their first
      money action. You never see or relay the code. Calls POST /api/v2/onboarding_attempts on Agentcard''s
      API.'
    category: api
    request:
      method: POST
      path: /api/v2/onboarding_attempts
      body:
        phone: ${phone}
        external_user_id: ${external_user_id}
    input:
      phone:
        type: string
        description: The user's phone. E.164 preferred; US local formats are normalized.
      external_user_id:
        type: string
        description: Your own id for this person, echoed on connection.created and the exchange.
        optional: true
    output:
      description: The attempt. Text walleturl to the user; listen for connection.created, then exchange.
      type: object
  platform_connect_create:
    title: Create a connect session
    description: Create a connect session Starts a hosted "Connect with Agentcard" flow for a company
      you're onboarding. Redirect the company to the returned url; when they finish, we redirect them
      to your returnurl with a one-time code (plus your state) that you exchange for the connected organization's
      API credentials. Requires client-cre Calls POST /api/v2/platform_connect_sessions on Agentcard's
      API.
    category: api
    request:
      method: POST
      path: /api/v2/platform_connect_sessions
      body:
        return_url: ${return_url}
        state: ${state}
    input:
      return_url:
        type: string
        description: Where we send the company when the flow completes. Must exactly match (origin + path)
          a redirect URI registered on your OAuth client. https required; http://localhost is allowed
          in test mode.
      state:
        type: string
        description: Opaque value echoed back on the redirect — bind it to the company's session on your
          side to prevent CSRF.
        optional: true
    output:
      description: The session, including the hosted url to send the company to.
      type: object
