# Agify tools -- predict a person's age, gender and nationality from a first name.
#
# Agify, Genderize and Nationalize are Demografix's three name APIs, and one API
# key works on all three: https://api.agify.io (age), https://api.genderize.io
# (gender) and https://api.nationalize.io (nationality). Each is a single GET on
# the host root; the genderize and nationalize tools set base_url_override. The
# parameters and responses below are from Demografix's API reference at
# https://agify.io/documentation/api/reference and were checked against the live
# hosts.
#
# The key goes in the apikey query parameter, which the connection adds to every
# call. (The catalogue entry used to send it as api_key, which the API silently
# ignores -- calls then ran anonymously on the 100-names-a-day free allowance
# instead of failing. It now sends apikey.)
#
# Batches. One request scores up to 100 names. Demografix reads a batch as
# name[0]=a&name[1]=b, so the *_batch tools take a plain names list and build
# those indexed keys. A batch answers with one result per name, in order, and
# takes no country_id -- localize single names with the single-name tools.
#
# Localization: agify and genderize take country_id (ISO 3166-1 alpha-2) to
# predict for one country's naming patterns; nationalize is the country
# prediction itself. Quota is counted in names, not requests, and every
# response carries X-Rate-Limit-Limit, -Remaining and -Reset. 402 means the
# subscription is inactive, 422 a missing or invalid name, 429 an exhausted
# quota.
#
# Docs: https://agify.io/documentation/api/reference

connector_id: agify
display_name: Agify
docs_url: https://agify.io/documentation/api/reference
tools:

  predict_age:
    title: Predict age from a name
    description: >-
      Estimate the age of a person with a given first name, from Agify's data on people with
      that name, optionally for one country. age is null when there is no data; count says
      how many records the estimate rests on.
    category: age
    read_only: true
    request:
      method: GET
      path: /
      query:
        name: ${name}
        country_id: ${country_id}
    input:
      name:
        type: string
        description: A first name, e.g. michael. Full names work but the first name is what
          is scored.
        min_length: 1
      country_id:
        type: string
        optional: true
        description: ISO 3166-1 alpha-2 country code, e.g. US, to predict for that country's
          population.
    output:
      description: name, age (years, or null), count and country_id when localized.
      type: object

  predict_age_batch:
    title: Predict ages for several names
    description: >-
      Estimate ages for up to 100 first names in one request. Each name counts against the
      quota.
    category: age
    read_only: true
    request:
      method: GET
      path: /
      query:
        $keyed:
          source: ${names}
          key: name[${index}]
          value: ${item}
    input:
      names:
        type: array
        items:
          type: string
        min_length: 1
        max_length: 100
        description: Names to score, up to 100; each counts against the quota.
    output:
      description: One {name, age, count} per name, in order.
      type: array
      items:
        type: object

  predict_gender:
    title: Predict gender from a name
    description: >-
      Estimate whether a first name belongs to a man or a woman, with the probability and
      the number of records behind it, optionally for one country. gender is null when there
      is no data.
    category: gender
    read_only: true
    request:
      method: GET
      path: /
      query:
        name: ${name}
        country_id: ${country_id}
      base_url_override: https://api.genderize.io
    input:
      name:
        type: string
        description: A first name, e.g. michael. Full names work but the first name is what
          is scored.
        min_length: 1
      country_id:
        type: string
        optional: true
        description: ISO 3166-1 alpha-2 country code, e.g. US, to predict for that country's
          population.
    output:
      description: name, gender (male, female or null), probability (0-1) and count.
      type: object

  predict_gender_batch:
    title: Predict genders for several names
    description: >-
      Estimate the gender of up to 100 first names in one request. Each name counts against
      the quota.
    category: gender
    read_only: true
    request:
      method: GET
      path: /
      query:
        $keyed:
          source: ${names}
          key: name[${index}]
          value: ${item}
      base_url_override: https://api.genderize.io
    input:
      names:
        type: array
        items:
          type: string
        min_length: 1
        max_length: 100
        description: Names to score, up to 100; each counts against the quota.
    output:
      description: One {name, gender, probability, count} per name, in order.
      type: array
      items:
        type: object

  predict_nationality:
    title: Predict nationality from a name
    description: >-
      Estimate which countries a person with a given name most likely comes from, as up to
      five ISO country codes with probabilities.
    category: nationality
    read_only: true
    request:
      method: GET
      path: /
      query:
        name: ${name}
      base_url_override: https://api.nationalize.io
    input:
      name:
        type: string
        description: A name; surnames are often more telling than first names here.
        min_length: 1
    output:
      description: 'name, count and country: [{country_id, probability}].'
      type: object

  predict_nationality_batch:
    title: Predict nationalities for several names
    description: >-
      Estimate the likely countries of origin for up to 100 names in one request. Each name
      counts against the quota.
    category: nationality
    read_only: true
    request:
      method: GET
      path: /
      query:
        $keyed:
          source: ${names}
          key: name[${index}]
          value: ${item}
      base_url_override: https://api.nationalize.io
    input:
      names:
        type: array
        items:
          type: string
        min_length: 1
        max_length: 100
        description: Names to score, up to 100; each counts against the quota.
    output:
      description: One {name, count, country} per name, in order.
      type: array
      items:
        type: object
