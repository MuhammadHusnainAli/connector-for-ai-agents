        filter[interfaceType]: "${interface_type}"
        filter[parentDevice]: "${parent_device}"
        filter[adminStatus]: "${admin_status}"
        filter[operationalStatus]: "${operational_status}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenant:
        type: string
        description: Tenant id to read from; child tenants are included.
        optional: true
      interface_type:
        type: string
        description: Restrict to one interface type.
        optional: true
      parent_device:
        type: string
        description: Device id whose interfaces to return.
        optional: true
      admin_status:
        type: boolean
        description: True for administratively enabled interfaces.
        optional: true
      operational_status:
        type: string
        description: Restrict by operational status.
        optional: true
        enum: [online, offline, unreachable, testing, unknown, dormant, notPresent, lowerLayerDown]
      page_first:
        type: integer
        description: Return the first N interfaces.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of interfaces in the v2 shape.
