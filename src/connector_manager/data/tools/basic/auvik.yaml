# Auvik network monitoring tools.
#
# Every path, parameter and enum below comes from Auvik's own OpenAPI 3.0
# descriptions, which each region publishes unauthenticated:
#
#   https://auvikapi.us1.my.auvik.com/spec          (v1, 50 operations)
#   https://auvikapi.us1.my.auvik.com/v2/api/spec   (v2 beta, 9 operations)
#
# The connection's base url already carries the regional host
# (auvikapi.{region}.my.auvik.com), so paths here start at /v1 or /v2.
#
# Three conventions run through the whole API:
#
#   * Multi-tenancy. Most reads take a "tenants" parameter -- a comma-separated
#     list of tenant (client) ids -- and default to every tenant the credential
#     can see. list_tenants is where those ids come from. The v2 endpoints take
#     a single "tenant" instead, and include its children.
#   * Cursor paging. page[first] with page[after], or page[last] with
#     page[before]; the cursors come back in the response's links block.
#   * Bracketed filters. Filter names really are spelled filter[deviceType] and
#     so on, which is how they appear here.
#
# The v2 endpoints are beta and cover device info, device lifecycle, device
# discovery status, interface info and service statistics. They are faster on
# large inventories and return flatter payloads; v1 stays supported, so both are
# here and the tool names carry a _v2 suffix where they differ.
#
# Auvik is almost entirely read-only through the API. The single write is
# dismiss_alert. Notes, credentials and poller settings can be read but not
# changed, which is the API's own limit rather than an omission here.
#
# Docs: https://support.auvik.com/hc/en-us/articles/360031007111-Auvik-API-Integration-Guide

connector_id: auvik
display_name: Auvik
docs_url: https://support.auvik.com/hc/en-us/articles/360031007111-Auvik-API-Integration-Guide

tools:
  verify_credentials:
    title: Verify the API credentials
    description: >-
      Check that the user name and API key are accepted. Returns 204 with no
      body on success, which makes it the cheapest connectivity test.
    category: meta
    read_only: true
    request:
      method: GET
      path: /v1/authentication/verify
    output:
      description: Empty on success; an error status when the credentials are rejected.
      type: object

  list_tenants:
    title: List tenants
    description: >-
      List the tenants (clients) this credential can read, with their domain
      prefixes and ids. Every other read takes those ids in its tenants
      parameter, so start here.
    category: tenants
    read_only: true
    request:
      method: GET
      path: /v1/tenants
    output:
      description: The tenants available to the credential.
      type: object

  list_tenant_details:
    title: List tenant details
    description: >-
      Read the detail behind each tenant -- domain prefix, creation date and
      whether its data is available to the API. tenantDomainPrefix is your own
      account's prefix, the one in the Auvik web address.
    category: tenants
    read_only: true
    request:
      method: GET
      path: /v1/tenants/detail
      query:
        tenantDomainPrefix: "${tenant_domain_prefix}"
        filter[availableTenants]: "${available_tenants}"
    input:
      tenant_domain_prefix:
        type: string
        description: Domain prefix of your main Auvik account.
      available_tenants:
        type: boolean
        description: True for tenants whose data the API can read, false for the rest.
        optional: true
    output:
      description: The tenants with their details.
      type: object

  get_tenant_detail:
    title: Get a tenant's details
    description: >-
      Read one tenant by id, with its domain prefix and availability. Needs
      your own account's domain prefix alongside the id.
    category: tenants
    read_only: true
    request:
      method: GET
      path: /v1/tenants/detail/${id}
      query:
        tenantDomainPrefix: "${tenant_domain_prefix}"
    input:
      id:
        type: string
        description: Tenant id.
      tenant_domain_prefix:
        type: string
        description: Domain prefix of your main Auvik account.
    output:
      description: The tenant's details.
      type: object

  list_devices:
    title: List devices
    description: >-
      Page through the devices Auvik has discovered, with make, model, vendor,
      IP addresses and online status. Narrow with the device type, online
      status or networks filters, and set include to deviceDetail to fold the
      detail record in.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/info
      query:
        tenants: "${tenants}"
        filter[networks]: "${networks}"
        filter[deviceType]: "${device_type}"
        filter[makeModel]: "${make_model}"
        filter[vendorName]: "${vendor_name}"
        filter[onlineStatus]: "${online_status}"
        filter[modifiedAfter]: "${modified_after}"
        filter[notSeenSince]: "${not_seen_since}"
        filter[stateKnown]: "${state_known}"
        include: "${include}"
        fields[deviceDetail]: "${device_detail_fields}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from; omit for all of them.
        optional: true
      networks:
        type: string
        description: Comma-separated network ids the device must be on.
        optional: true
      device_type:
        type: string
        description: Restrict to one device type.
        optional: true
        enum: [unknown, switch, l3Switch, router, accessPoint, firewall, workstation, server, storage, printer, copier, hypervisor, multimedia, phone, tablet, handheld, virtualAppliance, bridge, controller, hub, modem, ups, module, loadBalancer, camera, telecommunications, packetProcessor, chassis, airConditioner, virtualMachine, pdu, ipPhone, backhaul, internetOfThings, voipSwitch, stack, backupDevice, timeClock, lightingDevice, audioVisual, securityAppliance, utm, alarm, buildingManagement, ipmi, thinAccessPoint, thinClient, subnet]
      make_model:
        type: string
        description: Restrict to devices of this make and model.
        optional: true
      vendor_name:
        type: string
        description: Restrict to devices from this vendor.
        optional: true
      online_status:
        type: string
        description: Restrict to devices in this online state.
        optional: true
        enum: [online, offline, unreachable, testing, unknown, dormant, notPresent, lowerLayerDown]
      modified_after:
        type: string
        description: Only devices modified after this ISO 8601 timestamp.
        optional: true
      not_seen_since:
        type: string
        description: Only devices not seen online since this ISO 8601 timestamp.
        optional: true
      state_known:
        type: boolean
        description: True to return only devices with recently updated data.
        optional: true
      include:
        type: string
        description: Set to deviceDetail to include each device's detail record.
        optional: true
        enum: [deviceDetail]
      device_detail_fields:
        type: string
        description: Which detail attributes to include when include is deviceDetail.
        optional: true
        enum: [discoveryStatus, components, connectedDevices, configurations, manageStatus, interfaces]
      page_first:
        type: integer
        description: Return the first N devices.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response's links block.
        optional: true
      page_last:
        type: integer
        description: Return the last N devices.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response's links block.
        optional: true
    output:
      description: A page of devices with their attributes, links and cursors.
      type: object

  get_device:
    title: Get a device
    description: >-
      Read one device by id, with its make, model, vendor, addresses and
      status. Set include to deviceDetail for the extra detail record.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/info/${id}
      query:
        include: "${include}"
        fields[deviceDetail]: "${device_detail_fields}"
    input:
      id:
        type: string
        description: Device id.
      include:
        type: string
        description: Set to deviceDetail to include the device's detail record.
        optional: true
        enum: [deviceDetail]
      device_detail_fields:
        type: string
        description: Which detail attributes to include when include is deviceDetail.
        optional: true
        enum: [discoveryStatus, components, connectedDevices, configurations, manageStatus, interfaces]
    output:
      description: The device record.
      type: object

  list_device_details:
    title: List device details
    description: >-
      Page through the detail records behind devices -- discovery status per
      protocol, managed state, TrafficInsights state, components and
      configurations.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/detail
      query:
        tenants: "${tenants}"
        filter[manageStatus]: "${manage_status}"
        filter[discoverySNMP]: "${discovery_snmp}"
        filter[discoveryWMI]: "${discovery_wmi}"
        filter[discoveryLogin]: "${discovery_login}"
        filter[discoveryVMware]: "${discovery_vmware}"
        filter[trafficInsightsStatus]: "${traffic_insights_status}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      manage_status:
        type: boolean
        description: True for managed devices, false for unmanaged.
        optional: true
      discovery_snmp:
        type: string
        description: Restrict by SNMP discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_wmi:
        type: string
        description: Restrict by WMI discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_login:
        type: string
        description: Restrict by login discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_vmware:
        type: string
        description: Restrict by VMware discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      traffic_insights_status:
        type: string
        description: Restrict by TrafficInsights state.
        optional: true
        enum: [notDetected, detected, notApproved, approved, linking, linkingFailed, forwarding]
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N records.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of device detail records.
      type: object

  get_device_detail:
    title: Get a device's details
    description: >-
      Read one device's detail record -- per-protocol discovery status, managed
      state and the components, interfaces and configurations attached to it.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/detail/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's detail record.
      type: object

  list_device_extended_details:
    title: List device extended details
    description: >-
      Page through the type-specific detail Auvik keeps for one class of
      device -- what a firewall records is not what a printer records -- so
      filter[deviceType] is required here.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/detail/extended
      query:
        tenants: "${tenants}"
        filter[deviceType]: "${device_type}"
        filter[modifiedAfter]: "${modified_after}"
        filter[notSeenSince]: "${not_seen_since}"
        filter[stateKnown]: "${state_known}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      device_type:
        type: string
        description: Device type whose extended detail to read.
        enum: [unknown, switch, l3Switch, router, accessPoint, firewall, workstation, server, storage, printer, copier, hypervisor, multimedia, phone, tablet, handheld, virtualAppliance, bridge, controller, hub, modem, ups, module, loadBalancer, camera, telecommunications, packetProcessor, chassis, airConditioner, virtualMachine, pdu, ipPhone, backhaul, internetOfThings, voipSwitch, stack, backupDevice, timeClock, lightingDevice, audioVisual, securityAppliance, utm, alarm, buildingManagement, ipmi, thinAccessPoint, thinClient, subnet]
      modified_after:
        type: string
        description: Only records modified after this ISO 8601 timestamp.
        optional: true
      not_seen_since:
        type: string
        description: Only devices not seen online since this ISO 8601 timestamp.
        optional: true
      state_known:
        type: boolean
        description: True to return only devices with recently updated data.
        optional: true
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N records.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of type-specific device detail records.
      type: object

  get_device_extended_detail:
    title: Get a device's extended details
    description: >-
      Read the type-specific extended detail for one device, the fields Auvik
      only tracks for that kind of hardware.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/detail/extended/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's extended detail record.
      type: object

  list_device_warranties:
    title: List device warranty info
    description: >-
      Page through the warranty and service coverage Auvik has matched to
      devices, with start and end dates and the provider.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/warranty
      query:
        tenants: "${tenants}"
        filter[coveredUnderWarranty]: "${covered_under_warranty}"
        filter[coveredUnderService]: "${covered_under_service}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      covered_under_warranty:
        type: boolean
        description: True for devices still under warranty.
        optional: true
      covered_under_service:
        type: boolean
        description: True for devices under a service contract.
        optional: true
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N records.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of device warranty records.
      type: object

  get_device_warranty:
    title: Get a device's warranty info
    description: >-
      Read the warranty and service coverage matched to one device, with the
      dates and provider behind it.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/warranty/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's warranty record.
      type: object

  list_device_lifecycles:
    title: List device lifecycle info
    description: >-
      Page through end-of-life data for devices -- sales availability, software
      maintenance, security maintenance and last support dates -- which is what
      hardware refresh planning runs on.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/lifecycle
      query:
        tenants: "${tenants}"
        filter[salesAvailability]: "${sales_availability}"
        filter[softwareMaintenanceStatus]: "${software_maintenance_status}"
        filter[securitySoftwareMaintenanceStatus]: "${security_software_maintenance_status}"
        filter[lastSupportStatus]: "${last_support_status}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      sales_availability:
        type: string
        description: Restrict by whether the device is still sold.
        optional: true
        enum: [covered, available, expired, securityOnly, unpublished, empty]
      software_maintenance_status:
        type: string
        description: Restrict by software maintenance status.
        optional: true
        enum: [covered, available, expired, securityOnly, unpublished, empty]
      security_software_maintenance_status:
        type: string
        description: Restrict by security software maintenance status.
        optional: true
        enum: [covered, available, expired, securityOnly, unpublished, empty]
      last_support_status:
        type: string
        description: Restrict by last support status.
        optional: true
        enum: [covered, available, expired, securityOnly, unpublished, empty]
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N records.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of device lifecycle records.
      type: object

  get_device_lifecycle:
    title: Get a device's lifecycle info
    description: >-
      Read the end-of-life dates and support status for one device, with the
      provider the data came from.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/device/lifecycle/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's lifecycle record.
      type: object

  list_interfaces:
    title: List interfaces
    description: >-
      Page through device interfaces, with their type, admin and operational
      status, addresses and speeds. Filter by parent device to inventory one
      switch's ports.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/interface/info
      query:
        tenants: "${tenants}"
        filter[interfaceType]: "${interface_type}"
        filter[parentDevice]: "${parent_device}"
        filter[adminStatus]: "${admin_status}"
        filter[operationalStatus]: "${operational_status}"
        filter[modifiedAfter]: "${modified_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      interface_type:
        type: string
        description: Restrict to one interface type.
        optional: true
        enum: [ethernet, wifi, bluetooth, cdma, coax, cpu, distributedVirtualSwitch, firewire, gsm, ieee8023AdLag, inferredWired, inferredWireless, interface, linkAggregation, loopback, modem, wimax, optical, other, parallel, ppp, radiomac, rs232, tunnel, unknown, usb, virtualBridge, virtualNic, virtualSwitch, vlan]
      parent_device:
        type: string
        description: Device id whose interfaces to return.
        optional: true
      admin_status:
        type: boolean
        description: True for administratively enabled interfaces.
        optional: true
      operational_status:
        type: string
        description: Restrict by operational status.
        optional: true
        enum: [online, offline, unreachable, testing, unknown, dormant, notPresent, lowerLayerDown]
      modified_after:
        type: string
        description: Only interfaces modified after this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N interfaces.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N interfaces.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of interfaces with their status and addresses.
      type: object

  get_interface:
    title: Get an interface
    description: >-
      Read one interface by id, with its type, status, addresses, speed and
      parent device.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/interface/info/${id}
    input:
      id:
        type: string
        description: Interface id.
    output:
      description: The interface record.
      type: object

  list_networks:
    title: List networks
    description: >-
      Page through the networks Auvik has discovered -- routed networks, VLANs,
      WiFi networks, layer 2 segments -- with their scan status and the devices
      on them.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/network/info
      query:
        tenants: "${tenants}"
        filter[networkType]: "${network_type}"
        filter[scanStatus]: "${scan_status}"
        filter[devices]: "${devices}"
        filter[modifiedAfter]: "${modified_after}"
        include: "${include}"
        fields[networkDetail]: "${network_detail_fields}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      network_type:
        type: string
        description: Restrict to one network type.
        optional: true
        enum: [routed, vlan, wifi, loopback, network, layer2, internet]
      scan_status:
        type: string
        description: Restrict by whether Auvik scans the network.
        optional: true
        enum: ["true", "false", notAllowed, unknown]
      devices:
        type: string
        description: Comma-separated device ids that must be on the network.
        optional: true
      modified_after:
        type: string
        description: Only networks modified after this ISO 8601 timestamp.
        optional: true
      include:
        type: string
        description: Set to networkDetail to include each network's detail record.
        optional: true
        enum: [networkDetail]
      network_detail_fields:
        type: string
        description: Which detail attributes to include when include is networkDetail.
        optional: true
        enum: [scope, primaryCollector, secondaryCollectors, collectorSelection, excludedIpAddresses]
      page_first:
        type: integer
        description: Return the first N networks.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N networks.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of networks with their types and scan status.
      type: object

  get_network:
    title: Get a network
    description: >-
      Read one network by id, with its type, addresses and scan status. Set
      include to networkDetail for collector assignment and exclusions.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/network/info/${id}
      query:
        include: "${include}"
        fields[networkDetail]: "${network_detail_fields}"
    input:
      id:
        type: string
        description: Network id.
      include:
        type: string
        description: Set to networkDetail to include the network's detail record.
        optional: true
        enum: [networkDetail]
      network_detail_fields:
        type: string
        description: Which detail attributes to include when include is networkDetail.
        optional: true
        enum: [scope, primaryCollector, secondaryCollectors, collectorSelection, excludedIpAddresses]
    output:
      description: The network record.
      type: object

  list_network_details:
    title: List network details
    description: >-
      Page through network detail records -- scope, which collector scans the
      network, and which addresses are excluded from scanning.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/network/detail
      query:
        tenants: "${tenants}"
        filter[networkType]: "${network_type}"
        filter[scanStatus]: "${scan_status}"
        filter[devices]: "${devices}"
        filter[scope]: "${scope}"
        filter[modifiedAfter]: "${modified_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      network_type:
        type: string
        description: Restrict to one network type.
        optional: true
        enum: [routed, vlan, wifi, loopback, network, layer2, internet]
      scan_status:
        type: string
        description: Restrict by whether Auvik scans the network.
        optional: true
        enum: ["true", "false", notAllowed, unknown]
      devices:
        type: string
        description: Comma-separated device ids that must be on the network.
        optional: true
      scope:
        type: string
        description: Restrict to private or public address space.
        optional: true
        enum: [private, public]
      modified_after:
        type: string
        description: Only networks modified after this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N records.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of network detail records.
      type: object

  get_network_detail:
    title: Get a network's details
    description: >-
      Read one network's detail record, including its collector assignment and
      any excluded IP addresses.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/network/detail/${id}
    input:
      id:
        type: string
        description: Network id.
    output:
      description: The network's detail record.
      type: object

  list_components:
    title: List device components
    description: >-
      Page through the components inside devices -- CPUs, fans, disks, memory,
      power supplies -- with the current status of each.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/component/info
      query:
        tenants: "${tenants}"
        filter[deviceId]: "${device_id}"
        filter[deviceName]: "${device_name}"
        filter[currentStatus]: "${current_status}"
        filter[modifiedAfter]: "${modified_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      device_id:
        type: string
        description: Parent device id whose components to list.
        optional: true
      device_name:
        type: string
        description: Parent device name whose components to list.
        optional: true
      current_status:
        type: string
        description: Restrict by component health.
        optional: true
        enum: [ok, degraded, failed]
      modified_after:
        type: string
        description: Only components modified after this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N components.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N components.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of components with their statuses.
      type: object

  get_component:
    title: Get a device component
    description: >-
      Read one component by id, with its type, parent device and current
      status.
    category: inventory
    read_only: true
    request:
      method: GET
      path: /v1/inventory/component/info/${id}
    input:
      id:
        type: string
        description: Component id.
    output:
      description: The component record.
      type: object

  list_device_configurations:
    title: List device configuration backups
    description: >-
      Page through the configuration backups Auvik has taken, with their backup
      time and whether each is the running configuration. The configuration
      text itself comes back with the record.
    category: configurations
    read_only: true
    request:
      method: GET
      path: /v1/inventory/configuration
      query:
        tenants: "${tenants}"
        filter[deviceId]: "${device_id}"
        filter[backupTimeAfter]: "${backup_time_after}"
        filter[backupTimeBefore]: "${backup_time_before}"
        filter[isRunning]: "${is_running}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      device_id:
        type: string
        description: Device id whose configurations to list.
        optional: true
      backup_time_after:
        type: string
        description: Only backups taken after this ISO 8601 timestamp.
        optional: true
      backup_time_before:
        type: string
        description: Only backups taken before this ISO 8601 timestamp.
        optional: true
      is_running:
        type: boolean
        description: True for the running configuration, false for saved ones.
        optional: true
      page_first:
        type: integer
        description: Return the first N configurations.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N configurations.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of configuration backups with their contents.
      type: object

  get_device_configuration:
    title: Get a device configuration backup
    description: >-
      Read one configuration backup by id, including the configuration text and
      when it was captured.
    category: configurations
    read_only: true
    request:
      method: GET
      path: /v1/inventory/configuration/${id}
    input:
      id:
        type: string
        description: Configuration id.
    output:
      description: The configuration backup record.
      type: object

  list_entity_notes:
    title: List entity notes
    description: >-
      Page through the notes people have written on devices, networks and
      interfaces, with who last changed each one.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/inventory/entity/note
      query:
        tenants: "${tenants}"
        filter[entityId]: "${entity_id}"
        filter[entityType]: "${entity_type}"
        filter[entityName]: "${entity_name}"
        filter[lastModifiedBy]: "${last_modified_by}"
        filter[modifiedAfter]: "${modified_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      entity_id:
        type: string
        description: Entity id whose notes to list.
        optional: true
      entity_type:
        type: string
        description: Restrict to notes on one kind of entity.
        optional: true
        enum: [root, device, network, interface]
      entity_name:
        type: string
        description: Restrict to notes on entities with this name.
        optional: true
      last_modified_by:
        type: string
        description: Restrict to notes last changed by this user.
        optional: true
      modified_after:
        type: string
        description: Only notes modified after this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N notes.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N notes.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of entity notes.
      type: object

  get_entity_note:
    title: Get an entity note
    description: >-
      Read one note by id, with its text, the entity it is attached to and who
      last changed it.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/inventory/entity/note/${id}
    input:
      id:
        type: string
        description: Entity note id.
    output:
      description: The note record.
      type: object

  list_entity_audits:
    title: List entity audits
    description: >-
      Page through the audit trail of remote access sessions -- tunnels,
      terminal sessions and remote browser sessions -- with the user and
      outcome of each.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/inventory/entity/audit
      query:
        tenants: "${tenants}"
        filter[user]: "${user}"
        filter[category]: "${category}"
        filter[status]: "${status}"
        filter[modifiedAfter]: "${modified_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      user:
        type: string
        description: Restrict to audits for this user name.
        optional: true
      category:
        type: string
        description: Restrict to one kind of session.
        optional: true
        enum: [unknown, tunnel, terminal, remoteBrowser]
      status:
        type: string
        description: Restrict by session outcome.
        optional: true
        enum: [unknown, initiated, created, closed, failed]
      modified_after:
        type: string
        description: Only audits modified after this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N audits.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N audits.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of entity audit records.
      type: object

  get_entity_audit:
    title: Get an entity audit
    description: >-
      Read one remote access audit record by id, with its user, category,
      status and timestamps.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/inventory/entity/audit/${id}
    input:
      id:
        type: string
        description: Entity audit id.
    output:
      description: The audit record.
      type: object

  list_alerts:
    title: List alerts
    description: >-
      Page through triggered alerts, filtered by severity, status, entity or
      detection time. filter[dismissed] is how you separate what someone has
      already acknowledged from what is still outstanding.
    category: alerts
    read_only: true
    request:
      method: GET
      path: /v1/alert/history/info
      query:
        tenants: "${tenants}"
        filter[alertDefinitionId]: "${alert_definition_id}"
        filter[alertSpecificationId]: "${alert_specification_id}"
        filter[severity]: "${severity}"
        filter[status]: "${status}"
        filter[entityId]: "${entity_id}"
        filter[dismissed]: "${dismissed}"
        filter[dispatched]: "${dispatched}"
        filter[detectedTimeAfter]: "${detected_time_after}"
        filter[detectedTimeBefore]: "${detected_time_before}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      alert_definition_id:
        type: string
        description: Restrict to alerts from this alert definition.
        optional: true
      alert_specification_id:
        type: string
        description: Restrict to alerts from this alert specification.
        optional: true
      severity:
        type: string
        description: Restrict by alert severity.
        optional: true
        enum: [unknown, emergency, critical, warning, info]
      status:
        type: string
        description: Restrict by alert status.
        optional: true
        enum: [created, resolved, paused, unpaused]
      entity_id:
        type: string
        description: Restrict to alerts about this entity.
        optional: true
      dismissed:
        type: boolean
        description: True for dismissed alerts, false for outstanding ones.
        optional: true
      dispatched:
        type: boolean
        description: True for alerts that have been dispatched to a notification channel.
        optional: true
      detected_time_after:
        type: string
        description: Only alerts detected after this ISO 8601 timestamp.
        optional: true
      detected_time_before:
        type: string
        description: Only alerts detected at or before this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N alerts.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N alerts.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of alerts with their severity, status and entity.
      type: object

  get_alert:
    title: Get an alert
    description: >-
      Read one alert by id, with its definition, severity, status, entity and
      detection and resolution times.
    category: alerts
    read_only: true
    request:
      method: GET
      path: /v1/alert/history/info/${id}
    input:
      id:
        type: string
        description: Alert id.
    output:
      description: The alert record.
      type: object

  dismiss_alert:
    title: Dismiss an alert
    description: >-
      Mark an alert as dismissed, which is how you acknowledge it without
      waiting for the underlying condition to clear. This is the API's only
      write operation.
    category: alerts
    request:
      method: POST
      path: /v1/alert/dismiss/${id}
    input:
      id:
        type: string
        description: Alert id to dismiss.
    output:
      description: Empty on success.
      type: object

  get_device_statistics:
    title: Get device statistics
    description: >-
      Read a device performance series -- bandwidth, CPU, memory or storage
      utilisation, or packet counts -- between two times at minute, hour or day
      granularity.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/device/${stat_id}
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[deviceId]: "${device_id}"
        filter[deviceType]: "${device_type}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      stat_id:
        type: string
        description: Which statistic to read.
        enum: [bandwidth, cpuUtilization, memoryUtilization, storageUtilization, packetUnicast, packetMulticast, packetBroadcast]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      device_id:
        type: string
        description: Restrict to one device id.
        optional: true
      device_type:
        type: string
        description: Restrict to devices of this type.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N series.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The requested statistic as a time series per device.
      type: object

  get_device_availability_statistics:
    title: Get device availability statistics
    description: >-
      Read device uptime or outage series over a period, with the option to
      omit the time before a device was discovered.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/deviceAvailability/${stat_id}
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[deviceId]: "${device_id}"
        filter[deviceType]: "${device_type}"
        filter[omitUndiscovered]: "${omit_undiscovered}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      stat_id:
        type: string
        description: Which availability statistic to read.
        enum: [uptime, outage]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      device_id:
        type: string
        description: Restrict to one device id.
        optional: true
      device_type:
        type: string
        description: Restrict to devices of this type.
        optional: true
      omit_undiscovered:
        type: boolean
        description: True to leave out periods before the device was discovered.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The uptime or outage series per device.
      type: object

  get_interface_statistics:
    title: Get interface statistics
    description: >-
      Read an interface performance series -- bandwidth, utilisation, packet
      loss, discards or packet counts -- for one interface or every interface
      on a device.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/interface/${stat_id}
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[interfaceId]: "${interface_id}"
        filter[interfaceType]: "${interface_type}"
        filter[parentDevice]: "${parent_device}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      stat_id:
        type: string
        description: Which statistic to read.
        enum: [bandwidth, utilization, packetLoss, packetDiscard, packetMulticast, packetUnicast, packetBroadcast]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      interface_id:
        type: string
        description: Restrict to one interface id.
        optional: true
      interface_type:
        type: string
        description: Restrict to interfaces of this type.
        optional: true
      parent_device:
        type: string
        description: Restrict to interfaces on this device.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The requested statistic as a time series per interface.
      type: object

  get_component_statistics:
    title: Get component statistics
    description: >-
      Read a component performance series -- CPU utilisation, fan speed, disk
      capacity, memory swap, power supply temperature and so on. The component
      type and statistic have to match; not every pairing exists.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/component/${component_type}/${stat_id}
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[componentId]: "${component_id}"
        filter[parentDevice]: "${parent_device}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      component_type:
        type: string
        description: Which kind of component to read statistics for.
        enum: [cpu, cpuCore, disk, fan, memory, powerSupply, systemBoard]
      stat_id:
        type: string
        description: Which statistic to read for that component type.
        enum: [capacity, counters, idle, latency, power, queueLatency, rate, readiness, ready, speed, swap, swapRate, temperature, totalLatency, utilization]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      component_id:
        type: string
        description: Restrict to one component id.
        optional: true
      parent_device:
        type: string
        description: Restrict to components in this device.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The requested statistic as a time series per component.
      type: object

  get_service_statistics:
    title: Get service statistics
    description: >-
      Read ping check history for monitored services -- round trip time or
      packet loss -- over a period.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/service/${stat_id}
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[serviceId]: "${service_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      stat_id:
        type: string
        description: Which ping statistic to read.
        enum: [pingTime, pingPacket]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      service_id:
        type: string
        description: Restrict to one monitored service id.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The ping series per monitored service.
      type: object

  get_oid_statistics:
    title: Get OID statistics
    description: >-
      Read the most recent values Auvik's device monitors have collected for
      SNMP OIDs, optionally narrowed to one device or OID.
    category: statistics
    read_only: true
    request:
      method: GET
      path: /v1/stat/oid/${stat_id}
      query:
        tenants: "${tenants}"
        filter[deviceId]: "${device_id}"
        filter[deviceType]: "${device_type}"
        filter[oid]: "${oid}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      stat_id:
        type: string
        description: Which OID statistic to read.
        enum: [deviceMonitor]
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      device_id:
        type: string
        description: Restrict to one device id.
        optional: true
      device_type:
        type: string
        description: Restrict to devices of this type.
        optional: true
      oid:
        type: string
        description: Restrict to one SNMP OID.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The collected OID values.
      type: object

  list_snmp_poller_settings:
    title: List SNMP poller settings
    description: >-
      List the custom SNMP pollers configured for a tenant, with the OID each
      watches, whether it is numeric or string, and whether it is used as a
      serial number. tenants is required here.
    category: pollers
    read_only: true
    request:
      method: GET
      path: /v1/settings/snmppoller
      query:
        tenants: "${tenants}"
        filter[deviceId]: "${device_id}"
        filter[useAs]: "${use_as}"
        filter[type]: "${type}"
        filter[deviceType]: "${device_type}"
        filter[makeModel]: "${make_model}"
        filter[vendorName]: "${vendor_name}"
        filter[oid]: "${oid}"
        filter[name]: "${name}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
      device_id:
        type: string
        description: Restrict to pollers on this device.
        optional: true
      use_as:
        type: string
        description: Restrict by what the value is used as.
        optional: true
        enum: [serialNo, poller]
      type:
        type: string
        description: Restrict by the value's data type.
        optional: true
        enum: [string, numeric]
      device_type:
        type: string
        description: Restrict to pollers on devices of this type.
        optional: true
      make_model:
        type: string
        description: Restrict to devices of this make and model.
        optional: true
      vendor_name:
        type: string
        description: Restrict to devices from this vendor.
        optional: true
      oid:
        type: string
        description: Restrict to pollers watching this OID.
        optional: true
      name:
        type: string
        description: Restrict to pollers with this name.
        optional: true
      page_first:
        type: integer
        description: Return the first N settings.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SNMP poller settings.
      type: object

  get_snmp_poller_setting:
    title: Get an SNMP poller setting
    description: >-
      Read one SNMP poller setting by id, with its OID, data type and how the
      value is used.
    category: pollers
    read_only: true
    request:
      method: GET
      path: /v1/settings/snmppoller/${snmp_poller_setting_id}
    input:
      snmp_poller_setting_id:
        type: string
        description: SNMP poller setting id.
    output:
      description: The poller setting record.
      type: object

  list_snmp_poller_devices:
    title: List devices on an SNMP poller setting
    description: >-
      List the devices one SNMP poller setting applies to, with their online
      status and make and model.
    category: pollers
    read_only: true
    request:
      method: GET
      path: /v1/settings/snmppoller/${snmp_poller_setting_id}/devices
      query:
        tenants: "${tenants}"
        filter[onlineStatus]: "${online_status}"
        filter[modifiedAfter]: "${modified_after}"
        filter[notSeenSince]: "${not_seen_since}"
        filter[deviceType]: "${device_type}"
        filter[makeModel]: "${make_model}"
        filter[vendorName]: "${vendor_name}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      snmp_poller_setting_id:
        type: string
        description: SNMP poller setting id.
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
      online_status:
        type: string
        description: Restrict by the device's online status.
        optional: true
        enum: [online, offline, unreachable, testing, unknown, dormant, notPresent, lowerLayerDown]
      modified_after:
        type: string
        description: Only devices modified after this ISO 8601 timestamp.
        optional: true
      not_seen_since:
        type: string
        description: Only devices not seen online since this ISO 8601 timestamp.
        optional: true
      device_type:
        type: string
        description: Restrict to devices of this type.
        optional: true
      make_model:
        type: string
        description: Restrict to devices of this make and model.
        optional: true
      vendor_name:
        type: string
        description: Restrict to devices from this vendor.
        optional: true
      page_first:
        type: integer
        description: Return the first N devices.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of devices the poller applies to.
      type: object

  get_numeric_snmp_poller_history:
    title: Get numeric SNMP poller history
    description: >-
      Read the history of numeric custom SNMP pollers over a period, at minute,
      hour or day granularity.
    category: pollers
    read_only: true
    request:
      method: GET
      path: /v1/stat/snmppoller/int
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[deviceId]: "${device_id}"
        filter[snmpPollerSettingId]: "${snmp_poller_setting_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      device_id:
        type: string
        description: Restrict to one device id.
        optional: true
      snmp_poller_setting_id:
        type: string
        description: Comma-separated poller setting ids to read.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The numeric poller history as a time series.
      type: object

  get_string_snmp_poller_history:
    title: Get string SNMP poller history
    description: >-
      Read the history of string-valued custom SNMP pollers. Set
      filter[compact] to collapse repeated values into one row each.
    category: pollers
    read_only: true
    request:
      method: GET
      path: /v1/stat/snmppoller/string
      query:
        tenants: "${tenants}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[compact]: "${compact}"
        filter[deviceId]: "${device_id}"
        filter[snmpPollerSettingId]: "${snmp_poller_setting_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      compact:
        type: boolean
        description: True to collapse repeated values instead of listing every sample.
        optional: true
      device_id:
        type: string
        description: Restrict to one device id.
        optional: true
      snmp_poller_setting_id:
        type: string
        description: Comma-separated poller setting ids to read.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The string poller history.
      type: object

  get_client_usage:
    title: Get client billing usage
    description: >-
      Read billable device counts per client over a date range, which is what
      Auvik invoices on.
    category: billing
    read_only: true
    request:
      method: GET
      path: /v1/billing/usage/client
      query:
        tenants: "${tenants}"
        filter[fromDate]: "${from_date}"
        filter[thruDate]: "${thru_date}"
    input:
      tenants:
        type: string
        description: Comma-separated tenant ids to read from.
        optional: true
      from_date:
        type: string
        description: First date of the range, as YYYY-MM-DD.
      thru_date:
        type: string
        description: Last date of the range, as YYYY-MM-DD.
    output:
      description: Billable usage per client over the range.
      type: object

  get_device_usage:
    title: Get device billing usage
    description: >-
      Read one device's billable status over a date range, for checking why a
      client's count is what it is.
    category: billing
    read_only: true
    request:
      method: GET
      path: /v1/billing/usage/device/${id}
      query:
        filter[fromDate]: "${from_date}"
        filter[thruDate]: "${thru_date}"
    input:
      id:
        type: string
        description: Device id.
      from_date:
        type: string
        description: First date of the range, as YYYY-MM-DD.
      thru_date:
        type: string
        description: Last date of the range, as YYYY-MM-DD.
    output:
      description: The device's billable usage over the range.
      type: object

  list_asm_clients:
    title: List SaaS Management clients
    description: >-
      List the clients tracked in Auvik SaaS Management, optionally with
      totals for applications, users and breaches.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/client/info
      query:
        include: "${include}"
        filter[queryDate]: "${query_date}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      include:
        type: string
        description: Set to totals to include per-client counts.
        optional: true
        enum: [totals]
      query_date:
        type: string
        description: Only count breaches added after this date; useful with include totals.
        optional: true
      page_first:
        type: integer
        description: Return the first N clients.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SaaS Management clients.
      type: object

  list_asm_applications:
    title: List SaaS applications
    description: >-
      List the SaaS applications discovered for one client, with when each was
      added. filter[clientId] is required.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/app/info
      query:
        filter[clientId]: "${client_id}"
        filter[dateAddedBefore]: "${date_added_before}"
        filter[dateAddedAfter]: "${date_added_after}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      client_id:
        type: string
        description: SaaS Management client id.
      date_added_before:
        type: string
        description: Only applications added before this date.
        optional: true
      date_added_after:
        type: string
        description: Only applications added after this date.
        optional: true
      page_first:
        type: integer
        description: Return the first N applications.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of discovered SaaS applications.
      type: object

  list_asm_users:
    title: List SaaS users
    description: >-
      List the users SaaS Management has discovered for one client across their
      SaaS estate.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/user/info
      query:
        filter[clientId]: "${client_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      client_id:
        type: string
        description: SaaS Management client id.
      page_first:
        type: integer
        description: Return the first N users.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SaaS users.
      type: object

  list_asm_licenses:
    title: List SaaS licenses
    description: >-
      List the licences held on one SaaS application, with the holder's email,
      licence type, last login and whether Auvik flags it as underutilised --
      the report that finds seats worth reclaiming.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/license/info
      query:
        filter[clientId]: "${client_id}"
        filter[applicationId]: "${application_id}"
        filter[email]: "${email}"
        filter[licenseType]: "${license_type}"
        filter[lastLoginBefore]: "${last_login_before}"
        filter[underutilizedOnly]: "${underutilized_only}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      client_id:
        type: string
        description: SaaS Management client id.
      application_id:
        type: string
        description: Application whose licences to list.
      email:
        type: string
        description: Restrict to one licence holder's email address.
        optional: true
      license_type:
        type: string
        description: Restrict to one licence type.
        optional: true
      last_login_before:
        type: string
        description: Only licences whose holder last logged in before this date.
        optional: true
      underutilized_only:
        type: boolean
        description: True to return only licences flagged as underutilised.
        optional: true
      page_first:
        type: integer
        description: Return the first N licences.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SaaS licences with utilisation flags.
      type: object

  list_asm_security_logs:
    title: List SaaS security logs
    description: >-
      List SaaS Management security findings for one client -- credential
      breaches and the like -- optionally expanding the users and applications
      each concerns.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/securityLog/info
      query:
        filter[clientId]: "${client_id}"
        include: "${include}"
        filter[queryDate]: "${query_date}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      client_id:
        type: string
        description: SaaS Management client id.
      include:
        type: string
        description: Expand related users or applications on each log entry.
        optional: true
        enum: [users, applications]
      query_date:
        type: string
        description: Only security logs added after this date.
        optional: true
      page_first:
        type: integer
        description: Return the first N entries.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SaaS security log entries.
      type: object

  list_asm_tags:
    title: List SaaS tags
    description: >-
      List the tags applied to a client's SaaS applications, optionally for one
      application.
    category: saas
    read_only: true
    request:
      method: GET
      path: /v1/asm/tag/info
      query:
        filter[clientId]: "${client_id}"
        filter[applicationId]: "${application_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      client_id:
        type: string
        description: SaaS Management client id.
      application_id:
        type: string
        description: Restrict to tags on this application.
        optional: true
      page_first:
        type: integer
        description: Return the first N tags.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of SaaS application tags.
      type: object

  list_devices_v2:
    title: List devices (v2)
    description: >-
      The v2 device inventory read -- faster on large estates, with a flatter
      payload and make and model as separate filters. Takes a single tenant id
      rather than a list, and includes its child tenants.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/info
      query:
        tenant: "${tenant}"
        filter[networks]: "${networks}"
        filter[deviceType]: "${device_type}"
        filter[make]: "${make}"
        filter[model]: "${model}"
        filter[makeModel]: "${make_model}"
        filter[onlineStatus]: "${online_status}"
        filter[manageStatus]: "${manage_status}"
        filter[notSeenSince]: "${not_seen_since}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
        page[last]: "${page_last}"
        page[before]: "${page_before}"
    input:
      tenant:
        type: string
        description: Tenant id to read from; child tenants are included.
        optional: true
      networks:
        type: string
        description: Comma-separated network ids the device must be on.
        optional: true
      device_type:
        type: string
        description: Restrict to one device type.
        optional: true
      make:
        type: string
        description: Restrict to devices of this make.
        optional: true
      model:
        type: string
        description: Restrict to devices of this model.
        optional: true
      make_model:
        type: string
        description: Restrict to devices of this make and model.
        optional: true
      online_status:
        type: string
        description: Restrict by online status.
        optional: true
        enum: [online, offline, unreachable, testing, unknown, dormant, notPresent, lowerLayerDown]
      manage_status:
        type: boolean
        description: True for managed devices, false for unmanaged.
        optional: true
      not_seen_since:
        type: string
        description: Only devices not seen online since this ISO 8601 timestamp.
        optional: true
      page_first:
        type: integer
        description: Return the first N devices.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
      page_last:
        type: integer
        description: Return the last N devices.
        optional: true
      page_before:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of devices in the v2 shape.
      type: object

  get_device_v2:
    title: Get a device (v2)
    description: >-
      Read one device by id in the v2 shape, which flattens the attributes the
      v1 endpoint splits across info and detail.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/info/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device record in the v2 shape.
      type: object

  list_device_lifecycles_v2:
    title: List device lifecycle info (v2)
    description: >-
      The v2 lifecycle read, filtered by data provider and by sales
      availability or last support dates rather than status buckets. tenant is
      required here.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/lifecycle
      query:
        tenant: "${tenant}"
        filter[provider]: "${provider}"
        filter[salesAvailabilityDateAfter]: "${sales_availability_date_after}"
        filter[salesAvailabilityDateBefore]: "${sales_availability_date_before}"
        filter[lastSupportDateAfter]: "${last_support_date_after}"
        filter[lastSupportDateBefore]: "${last_support_date_before}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenant:
        type: string
        description: Tenant id to read from; child tenants are included.
      provider:
        type: string
        description: Restrict to lifecycle data from one provider.
        optional: true
        enum: [AI, Cisco]
      sales_availability_date_after:
        type: string
        description: Only records with a sales availability date on or after this date.
        optional: true
      sales_availability_date_before:
        type: string
        description: Only records with a sales availability date on or before this date.
        optional: true
      last_support_date_after:
        type: string
        description: Only records with a last support date on or after this date.
        optional: true
      last_support_date_before:
        type: string
        description: Only records with a last support date on or before this date.
        optional: true
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of lifecycle records in the v2 shape.
      type: object

  get_device_lifecycle_v2:
    title: Get a device's lifecycle info (v2)
    description: >-
      Read one device's end-of-life dates in the v2 shape, with the provider
      the data came from.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/lifecycle/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's lifecycle record in the v2 shape.
      type: object

  list_device_discovery_statuses_v2:
    title: List device discovery statuses (v2)
    description: >-
      Read per-protocol discovery status across devices -- SNMP, login, WMI and
      VMware -- which is the quickest way to find devices whose credentials
      are not working.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/discoveryStatus
      query:
        tenant: "${tenant}"
        filter[discoverySNMP]: "${discovery_snmp}"
        filter[discoveryLogin]: "${discovery_login}"
        filter[discoveryWMI]: "${discovery_wmi}"
        filter[discoveryVMware]: "${discovery_vmware}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      tenant:
        type: string
        description: Tenant id to read from; child tenants are included.
        optional: true
      discovery_snmp:
        type: string
        description: Restrict by SNMP discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_login:
        type: string
        description: Restrict by login discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_wmi:
        type: string
        description: Restrict by WMI discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      discovery_vmware:
        type: string
        description: Restrict by VMware discovery status.
        optional: true
        enum: [disabled, determining, notSupported, notAuthorized, authorizing, authorized, privileged]
      page_first:
        type: integer
        description: Return the first N records.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: A page of per-protocol discovery statuses.
      type: object

  get_device_discovery_status_v2:
    title: Get a device's discovery status (v2)
    description: >-
      Read one device's per-protocol discovery status, for diagnosing why Auvik
      cannot poll it.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/device/discoveryStatus/${id}
    input:
      id:
        type: string
        description: Device id.
    output:
      description: The device's discovery status record.
      type: object

  list_interfaces_v2:
