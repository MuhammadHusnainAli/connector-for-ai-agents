# Google Drive API tools.
#
# Docs: https://developers.google.com/drive/api/reference/rest/v3
#
# The tools below the "rest of the API" divider come from Google's own
# discovery document for this API -- the machine readable contract its client
# libraries are generated from -- so their paths, parameters and per-tool OAuth
# scopes are Google's. The hand-authored tools above it are kept because they
# offer a friendlier shape for the common cases.
#
connector_id: google-drive
display_name: Google Drive
docs_url: https://developers.google.com/drive/api/reference/rest/v3

scope_rules:
  strip_prefixes:
    - https://www.googleapis.com/auth/
  implies:
    drive: [drive.readonly, drive.file, drive.metadata, drive.metadata.readonly]
    drive.readonly: [drive.metadata.readonly]
    drive.metadata: [drive.metadata.readonly]

scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope

tools:

  list_files:
    title: List or search files
    description: >-
      List files in Drive, narrowed by Drive's query language -- "name contains
      'budget'", "mimeType='application/vnd.google-apps.spreadsheet'",
      "'FOLDER_ID' in parents", "trashed=false".
    category: files
    scopes_any: [drive.readonly, drive, drive.metadata.readonly, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/files
      query:
        q: "${query}"
        pageSize: "${limit}"
        pageToken: "${page_token}"
        orderBy: "${order_by}"
        fields: "${fields}"
        includeItemsFromAllDrives: "${include_shared_drives}"
        supportsAllDrives: "${include_shared_drives}"
    input:
      query:
        type: string
        description: Drive query string. Omit to list everything the token can see.
        optional: true
        example: "name contains 'budget' and trashed=false"
      limit:
        type: integer
        description: How many files per page (1-1000).
        optional: true
        default: 50
        minimum: 1
        maximum: 1000
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      order_by:
        type: string
        description: Sort order, e.g. "modifiedTime desc" or "name".
        optional: true
      fields:
        type: string
        description: Fields to return, e.g. "files(id,name,mimeType,webViewLink),nextPageToken".
        optional: true
      include_shared_drives:
        type: boolean
        description: Also search shared drives, not just My Drive.
        optional: true
    output:
      description: A page of files.
      type: object
      properties:
        files: {type: array, description: "Each with id, name and mimeType."}
        nextPageToken: {type: string}

  get_file:
    title: Get a file's metadata
    description: >-
      Read one file's name, type, size, owners, parents and links. Use
      download_file for the contents.
    category: files
    scopes_any: [drive.readonly, drive, drive.metadata.readonly, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/files/${file_id}
      query:
        fields: "${fields}"
        supportsAllDrives: "${supports_all_drives}"
    input:
      file_id:
        type: string
        description: The file id.
      fields:
        type: string
        description: Fields to return. Use "*" for everything.
        optional: true
        default: "id,name,mimeType,size,modifiedTime,webViewLink,parents,owners"
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The file's metadata.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        mimeType: {type: string}
        webViewLink: {type: string}
        parents: {type: array}

  download_file:
    title: Download a file's contents
    description: >-
      Fetch a binary or text file's bytes. Google-native documents (Docs,
      Sheets, Slides) cannot be downloaded this way -- use export_file for those.
    category: files
    scopes_any: [drive.readonly, drive, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/files/${file_id}
      query:
        alt: media
        supportsAllDrives: "${supports_all_drives}"
    input:
      file_id:
        type: string
        description: The file id.
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The file's raw contents.
      type: string

  export_file:
    title: Export a Google document
    description: >-
      Convert a Google Doc, Sheet or Slide deck to another format and return it
      -- text/plain or application/pdf for a Doc, text/csv for a Sheet.
    category: files
    scopes_any: [drive.readonly, drive, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/files/${file_id}/export
      query:
        mimeType: "${mime_type}"
    input:
      file_id:
        type: string
        description: The Google-native file id.
      mime_type:
        type: string
        description: Format to export as.
        example: text/plain
        enum:
          - text/plain
          - text/csv
          - text/html
          - application/pdf
          - application/rtf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/vnd.openxmlformats-officedocument.presentationml.presentation
    output:
      description: The converted file's contents.
      type: string

  upload_file:
    title: Upload a text file
    description: >-
      Create a file from inline text content. Set parent_id to put it in a
      folder. Binary uploads need Drive's resumable upload flow, which this tool
      does not cover.
    category: files
    scopes_any: [drive, drive.file]
    request:
      method: POST
      base_url_override: https://www.googleapis.com
      path: /upload/drive/v3/files
      query:
        uploadType: media
        supportsAllDrives: "${supports_all_drives}"
      content: "${content}"
      headers:
        content-type: "${mime_type}"
    input:
      content:
        type: string
        description: The file's text content.
      mime_type:
        type: string
        description: MIME type of the content.
        optional: true
        default: text/plain
      supports_all_drives:
        type: boolean
        description: Allow uploading into a shared drive.
        optional: true
    output:
      description: The created file. Rename it or move it with update_file.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        mimeType: {type: string}

  create_folder:
    title: Create a folder
    description: Create a folder, optionally inside another folder or a shared drive.
    category: files
    scopes_any: [drive, drive.file]
    request:
      method: POST
      path: /drive/v3/files
      query:
        supportsAllDrives: "${supports_all_drives}"
      body:
        name: "${name}"
        mimeType: application/vnd.google-apps.folder
        parents: "${parents}"
    input:
      name:
        type: string
        description: Folder name.
      parents:
        type: array
        description: Parent folder ids. Omit for the drive root.
        optional: true
        items: {type: string}
      supports_all_drives:
        type: boolean
        description: Allow creating inside a shared drive.
        optional: true
    output:
      description: The created folder.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  update_file:
    title: Rename, move or trash a file
    description: >-
      Change a file's metadata. Renaming and trashing go in the body; moving
      between folders uses add_parents and remove_parents.
    category: files
    scopes_any: [drive, drive.file]
    request:
      method: PATCH
      path: /drive/v3/files/${file_id}
      query:
        addParents: "${add_parents}"
        removeParents: "${remove_parents}"
        supportsAllDrives: "${supports_all_drives}"
      body:
        name: "${name}"
        description: "${description}"
        trashed: "${trashed}"
        starred: "${starred}"
    input:
      file_id:
        type: string
        description: The file id.
      name:
        type: string
        description: New file name.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      add_parents:
        type: array
        description: Folder ids to move the file into.
        optional: true
        items: {type: string}
      remove_parents:
        type: array
        description: Folder ids to remove the file from.
        optional: true
        items: {type: string}
      trashed:
        type: boolean
        description: Move the file to the trash, or restore it from there.
        optional: true
      starred:
        type: boolean
        description: Star or unstar the file.
        optional: true
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The updated file.
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        parents: {type: array}

  copy_file:
    title: Copy a file
    description: Duplicate a file, optionally under a new name and in a different folder.
    category: files
    scopes_any: [drive, drive.file]
    request:
      method: POST
      path: /drive/v3/files/${file_id}/copy
      query:
        supportsAllDrives: "${supports_all_drives}"
      body:
        name: "${name}"
        parents: "${parents}"
    input:
      file_id:
        type: string
        description: The file to copy.
      name:
        type: string
        description: Name for the copy. Defaults to "Copy of ...".
        optional: true
      parents:
        type: array
        description: Folder ids to put the copy in.
        optional: true
        items: {type: string}
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The new copy.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  delete_file:
    title: Permanently delete a file
    description: >-
      Delete a file outright, skipping the trash. This cannot be undone -- to
      keep it recoverable, use update_file with trashed set instead.
    category: files
    scopes_any: [drive, drive.file]
    destructive: true
    request:
      method: DELETE
      path: /drive/v3/files/${file_id}
      query:
        supportsAllDrives: "${supports_all_drives}"
    input:
      file_id:
        type: string
        description: The file to delete.
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: Empty on success -- Google answers 204 No Content.
      type: object

  share_file:
    title: Share a file with someone
    description: >-
      Grant access to a file. Give a type of user or group with an email
      address, or anyone for a link that works without sign-in.
    category: permissions
    scopes_any: [drive, drive.file]
    request:
      method: POST
      path: /drive/v3/files/${file_id}/permissions
      query:
        sendNotificationEmail: "${send_notification}"
        supportsAllDrives: "${supports_all_drives}"
      body:
        type: "${type}"
        role: "${role}"
        emailAddress: "${email}"
        domain: "${domain}"
    input:
      file_id:
        type: string
        description: The file to share.
      type:
        type: string
        description: Who the permission is for.
        enum: [user, group, domain, anyone]
      role:
        type: string
        description: What they may do.
        enum: [reader, commenter, writer, fileOrganizer, organizer, owner]
      email:
        type: string
        description: Email address, required when type is user or group.
        optional: true
        format: email
      domain:
        type: string
        description: Domain name, required when type is domain.
        optional: true
      send_notification:
        type: boolean
        description: Email the person that the file was shared.
        optional: true
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The permission that was created.
      type: object
      properties:
        id: {type: string}
        type: {type: string}
        role: {type: string}

  list_permissions:
    title: List who a file is shared with
    description: List a file's permissions -- who has access and at what role.
    category: permissions
    scopes_any: [drive.readonly, drive, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/files/${file_id}/permissions
      query:
        fields: "${fields}"
        supportsAllDrives: "${supports_all_drives}"
    input:
      file_id:
        type: string
        description: The file id.
      fields:
        type: string
        description: Fields to return.
        optional: true
        default: "permissions(id,type,role,emailAddress,displayName)"
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: The file's permissions.
      type: object
      properties:
        permissions: {type: array}

  remove_permission:
    title: Revoke someone's access
    description: Remove a permission, taking away that person's access to the file.
    category: permissions
    scopes_any: [drive, drive.file]
    destructive: true
    request:
      method: DELETE
      path: /drive/v3/files/${file_id}/permissions/${permission_id}
      query:
        supportsAllDrives: "${supports_all_drives}"
    input:
      file_id:
        type: string
        description: The file id.
      permission_id:
        type: string
        description: The permission id, from list_permissions.
      supports_all_drives:
        type: boolean
        description: Allow ids that live on a shared drive.
        optional: true
    output:
      description: Empty on success -- Google answers 204 No Content.
      type: object

  get_storage_quota:
    title: Get Drive storage usage
    description: >-
      Read how much Drive storage the account has and how much is used. Also the
      cheapest health check for a Drive connection.
    category: about
    scopes_any: [drive.readonly, drive, drive.metadata.readonly, drive.file]
    read_only: true
    request:
      method: GET
      path: /drive/v3/about
      query:
        fields: "${fields}"
    input:
      fields:
        type: string
        description: Fields to return.
        optional: true
        default: "storageQuota,user"
    output:
      description: Storage quota and the signed-in user.
      type: object
      properties:
        storageQuota: {type: object}
        user: {type: object}

  # -- the rest of the API, from Google's own discovery document ------------

  get_accessproposal:
    title: Get accessproposal
    description: Retrieves an access proposal by ID. For more information, see Manage pending access proposals.
    category: accessproposals
    request:
      method: GET
      path: /drive/v3/files/${file_id}/accessproposals/${proposal_id}
    input:
      file_id:
        type: string
        description: Required. The ID of the item the request is on.
      proposal_id:
        type: string
        description: Required. The ID of the access proposal to resolve.
    output:
      description: The AccessProposal resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
    - drive.metadata.readonly
    - drive.readonly
    read_only: true
  list_accessproposals:
    title: List accessproposals
    description: 'List the access proposals on a file. For more information, see Manage pending access
      proposals. Note: Only approvers are able to list access proposals on a file. If the user isn''t
      an approver, a 403 error is returned.'
    category: accessproposals
    request:
      method: GET
      path: /drive/v3/files/${file_id}/accessproposals
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      file_id:
        type: string
        description: Required. The ID of the item the request is on.
      page_size:
        type: integer
        description: Optional. The number of results per page.
        optional: true
      page_token:
        type: string
        description: Optional. The continuation token on the list of access requests.
        optional: true
    output:
      description: The ListAccessProposalsResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
    - drive.metadata.readonly
    - drive.readonly
    read_only: true
  resolve_accessproposal:
    title: Resolve accessproposal
    description: Approves or denies an access proposal. For more information, see Manage pending access
      proposals.
    category: accessproposals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/accessproposals/${proposal_id}:resolve
      body:
        sendNotification: ${send_notification}
        view: ${view}
        action: ${action}
        role: ${role}
    input:
      file_id:
        type: string
        description: Required. The ID of the item the request is on.
      proposal_id:
        type: string
        description: Required. The ID of the access proposal to resolve.
      send_notification:
        type: boolean
        description: Optional. Whether to send an email to the requester when the access proposal is denied
          or accepted.
        optional: true
      view:
        type: string
        description: Optional. Indicates the view for this access proposal. This should only be set when
          the proposal belongs to a view. Only published is supported.
        optional: true
      action:
        type: string
        description: Required. The action to take on the access proposal.
        optional: true
        enum:
        - ACTION_UNSPECIFIED
        - ACCEPT
        - DENY
      role:
        type: array
        items:
          type: string
        description: 'Optional. The roles that the approver has allowed, if any. For more information,
          see Roles and permissions. Note: This field is required for the ACCEPT action.'
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - drive
    - drive.file
  approve_approval:
    title: Approve approval
    description: Approves an approval. For more information, see Manage approvals. This is used to update
      the ReviewerResponse of the requesting user with a Response of APPROVED. If this is the last required
      reviewer response, this also completes the approval and sets the approval Status to APPROVED.
    category: approvals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/approvals/${approval_id}:approve
      body:
        message: ${message}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval to approve.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      message:
        type: string
        description: Optional. A message to accompany the reviewer response on the approval. This message
          is included in notifications for the action and in the approval activity log.
        optional: true
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
  cancel_approval:
    title: Cancel approval
    description: Cancels an approval. For more information, see Manage approvals. Updates the approval
      Status to CANCELLED. This can be called by any user with the writer permission on the file while
      the approval Status is IN_PROGRESS.
    category: approvals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/approvals/${approval_id}:cancel
      body:
        message: ${message}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval to cancel.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      message:
        type: string
        description: Optional. A message to accompany the cancellation of the approval. This message is
          included in notifications for the action and in the approval activity log.
        optional: true
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
  comment_approval:
    title: Comment approval
    description: Comments on an approval. For more information, see Manage approvals. This sends a notification
      to both the initiator and the reviewers. Additionally, a message is also added to the approval activity
      log.
    category: approvals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/approvals/${approval_id}:comment
      body:
        message: ${message}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval to comment on.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      message:
        type: string
        description: Required. A message to comment on the approval. This message is included in notifications
          for the action and in the approval activity log.
        optional: true
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
  decline_approval:
    title: Decline approval
    description: Declines an approval. For more information, see Manage approvals. This is used to update
      the ReviewerResponse of the requesting user with a Response of DECLINED. This also completes the
      approval and sets the approval Status to DECLINED.
    category: approvals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/approvals/${approval_id}:decline
      body:
        message: ${message}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval to decline.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      message:
        type: string
        description: Optional. A message to accompany the reviewer response on the approval. This message
          is included in notifications for the action and in the approval activity log.
        optional: true
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
  get_approval:
    title: Get approval
    description: Gets an approval by ID. For more information, see Manage approvals.
    category: approvals
    request:
      method: GET
      path: /drive/v3/files/${file_id}/approvals/${approval_id}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.appdata
    - drive.file
    - drive.metadata
    - drive.metadata.readonly
    - drive.readonly
    read_only: true
  list_approvals:
    title: List approvals
    description: Lists the approvals on a file. For more information, see Manage approvals. By default,
      this method returns a minimal response that may not include the items array. To retrieve approval
      details, you must explicitly specify the fields you want using the fields query parameter. To return
      the exact fields you need, see Return specific fields.
    category: approvals
    request:
      method: GET
      path: /drive/v3/files/${file_id}/approvals
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      page_size:
        type: integer
        description: The maximum number of approvals to return. When not set, at most 100 approvals are
          returned.
        optional: true
      page_token:
        type: string
        description: The token for continuing a previous list request on the next page. This should be
          set to the value of nextPageToken from a previous response.
        optional: true
    output:
      description: The ApprovalList resource.
      type: object
    scopes_any:
    - drive
    - drive.appdata
    - drive.file
    - drive.metadata
    - drive.metadata.readonly
    - drive.readonly
    read_only: true
  reassign_approval:
    title: Reassign approval
    description: Reassigns the reviewers on an approval. For more information, see Manage approvals. Adds
      or replaces reviewers in the ReviewerResponse of the approval. This can be called by any user with
      the writer permission on the file while the approval Status is IN_PROGRESS and the Response for
      the reviewer being reassigned is NO_RESPONSE. A user with the reader permission can only reassign
      an approval that's assigned to themsel
    category: approvals
    request:
      method: POST
      path: /drive/v3/files/${file_id}/approvals/${approval_id}:reassign
      body:
        replaceReviewers: ${replace_reviewers}
        message: ${message}
        addReviewers: ${add_reviewers}
    input:
      approval_id:
        type: string
        description: Required. The ID of the approval to reassign.
      file_id:
        type: string
        description: Required. The ID of the file that the approval is on.
      replace_reviewers:
        type: array
        items:
          type: string
        description: Optional. The list of reviewer replacements.
        optional: true
      message:
        type: string
        description: Optional. A message to send to the new reviewers. This message is included in notifications
          for the action and in the approval activity log.
        optional: true
      add_reviewers:
        type: array
        items:
          type: string
        description: Optional. The list of reviewers to add.
        optional: true
    output:
      description: The Approval resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.metadata
  start_approval:
    title: Start approval
    description: Starts an approval on a file. For more information, see Manage approvals.
    category: approvals
    request:
      method: POST
