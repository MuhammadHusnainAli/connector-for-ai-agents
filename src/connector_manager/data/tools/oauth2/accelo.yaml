  get_timer:
    title: Get a timer
    description: >-
      Read one record from running and stopped work timers, the raw material of billable time,
      by its id. Use _fields to pull in the linked objects you need alongside
      it.
    category: timers
    read_only: true
    scopes: ["read(timers)"]
    request:
      method: GET
      path: /api/v0/timers/${timer_id}
      query:
        _fields: "${fields}"
    input:
      timer_id:
        type: string
        description: The record's Accelo id, from list_timers.
      fields:
        type: string
        description: >-
          Extra fields to return beyond the defaults, comma separated. Pass
          _ALL for everything Accelo holds.
        optional: true
    output:
      description: The timer.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  create_timer:
    title: Create a timer
    description: >-
      Add a record to running and stopped work timers, the raw material of billable time.
      `fields` takes the object being worked on and the staff member doing it; read an existing one first to see what else
      your deployment requires.
    category: timers
    scopes: ["write(timers)"]
    request:
      method: POST
      path: /api/v0/timers
      body: "${fields}"
    input:
      fields:
        type: object
        description: >-
          The record to create -- the object being worked on and the staff member doing it.
    output:
      description: The created timer.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  update_timer:
    title: Update a timer
    description: >-
      Change fields on one record in running and stopped work timers, the raw material of billable time.
      Only the fields you send are written; the rest are left as they are.
    category: timers
    scopes: ["write(timers)"]
    request:
      method: PUT
      path: /api/v0/timers/${timer_id}
      body: "${fields}"
    input:
      timer_id:
        type: string
        description: The record's Accelo id.
      fields:
        type: object
        description: >-
          The fields to change -- any of the object being worked on and the staff member doing it.
    output:
      description: The updated timer.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  delete_timer:
    title: Delete a timer
    description: >-
      Permanently remove one record from running and stopped work timers, the raw material of billable time.
      Anything hanging off it in Accelo goes with it, and this cannot be undone
      through the API.
    category: timers
    destructive: true
    scopes: ["write(timers)"]
    request:
      method: DELETE
      path: /api/v0/timers/${timer_id}
    input:
      timer_id:
        type: string
        description: The record's Accelo id.
    output:
      description: Accelo's confirmation, under the meta object.
      type: object
      properties:
        meta: {type: object}

  get_current_staff:
    title: Get the authenticated staff member
    description: >-
      Read the staff record the credentials act as, without having to know its
      id first. The cheapest check that a connection to Accelo is working.
    category: staff
    read_only: true
    scopes: ["read(staff)"]
    request:
      method: GET
      path: /api/v0/staff/current
      query:
        _fields: "${fields}"
    input:
      fields:
        type: string
        description: >-
          Extra fields to return beyond the defaults, comma separated. Pass
          _ALL for everything Accelo holds.
        optional: true
    output:
      description: The authenticated staff member.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}
