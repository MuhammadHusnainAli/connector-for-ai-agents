# HubSpot CRM tools.
#
# Scopes are the granular CRM scopes a private app or OAuth app requests. The
# engagement objects (notes, tasks, calls) are gated on the scope of the record
# they attach to, which each tool's `notes` field states.
#
# Docs: https://developers.hubspot.com/docs/api/crm/understanding-the-crm

connector_id: hubspot
display_name: HubSpot
docs_url: https://developers.hubspot.com/docs/api/crm/understanding-the-crm

scope_rules:
  implies:
    crm.objects.contacts.write: [crm.objects.contacts.read]
    crm.objects.companies.write: [crm.objects.companies.read]
    crm.objects.deals.write: [crm.objects.deals.read]
    crm.objects.line_items.write: [crm.objects.line_items.read]
    crm.objects.custom.write: [crm.objects.custom.read]
    crm.lists.write: [crm.lists.read]

scope_discovery:
  # HubSpot's token-info endpoint returns the exact scope list the token holds.
  method: GET
  endpoint: /oauth/v1/access-tokens/${credentials.access_token}
  scopes_path: scopes

tools:

  # -- contacts --------------------------------------------------------------

  list_contacts:
    title: List contacts
    description: >-
      Page through contact records. Pass the `after` cursor from a previous
      response's paging block to get the next page. Only the default properties
      come back unless `properties` names more.
    category: crm.contacts
    scopes: [crm.objects.contacts.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/contacts
      query:
        limit: "${limit}"
        after: "${after}"
        properties: "${properties}"
        associations: "${associations}"
        archived: "${archived}"
    input:
      limit:
        type: integer
        description: How many contacts per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response's paging.next.after.
        optional: true
      properties:
        type: array
        description: Contact properties to return, e.g. ["email","firstname","lifecyclestage"].
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for, e.g. ["companies","deals"].
        optional: true
        items: {type: string}
      archived:
        type: boolean
        description: Return archived contacts instead of live ones.
        optional: true
    output:
      description: A page of contacts, with the cursor for the next page.
      type: object
      properties:
        results: {type: array, description: "The contact records, each with id and properties."}
        paging: {type: object, description: "Holds next.after -- the cursor for the following page."}

  get_contact:
    title: Get a contact
    description: >-
      Fetch one contact by its record id, optionally with extra properties and
      the ids of records associated with it.
    category: crm.contacts
    scopes: [crm.objects.contacts.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/contacts/${contact_id}
      query:
        properties: "${properties}"
        associations: "${associations}"
    input:
      contact_id:
        type: string
        description: The contact's record id.
      properties:
        type: array
        description: Properties to return beyond the defaults.
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for.
        optional: true
        items: {type: string}
    output:
      description: The contact record.
      type: object
      properties:
        id: {type: string}
        properties: {type: object, description: "Property name to value."}
        associations: {type: object}

  search_contacts:
    title: Search contacts
    description: >-
      Find contacts by property values or free text. Use `query` for a keyword
      search across searchable properties, or `filters` for precise conditions
      such as {"propertyName":"email","operator":"EQ","value":"a@b.com"}.
    category: crm.contacts
    scopes: [crm.objects.contacts.read]
    read_only: true
    request:
      method: POST
      path: /crm/v3/objects/contacts/search
      body:
        query: "${query}"
        filterGroups:
          - $when: "${filters}"
            filters: "${filters}"
        properties: "${properties}"
        limit: "${limit}"
        after: "${after}"
        sorts: "${sorts}"
    input:
      query:
        type: string
        description: Free-text search across searchable contact properties.
        optional: true
      filters:
        type: array
        description: >-
          Conditions ANDed together. Each is {"propertyName": ..., "operator":
          one of EQ NEQ LT LTE GT GTE BETWEEN IN NOT_IN HAS_PROPERTY
          NOT_HAS_PROPERTY CONTAINS_TOKEN, "value": ...}.
        optional: true
        items:
          type: object
          properties:
            propertyName: {type: string}
            operator: {type: string}
            value: {type: string}
      properties:
        type: array
        description: Properties to return on each match.
        optional: true
        items: {type: string}
      sorts:
        type: array
        description: Sort order, e.g. [{"propertyName":"createdate","direction":"DESCENDING"}].
        optional: true
        items: {type: object}
      limit:
        type: integer
        description: How many matches per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: Matching contacts with the total count.
      type: object
      properties:
        total: {type: integer}
        results: {type: array}
        paging: {type: object}

  create_contact:
    title: Create a contact
    description: >-
      Create a contact record. `properties` is a map of HubSpot internal
      property names to values -- email, firstname, lastname, phone, company,
      lifecyclestage and any custom property. Email is the deduplication key.
    category: crm.contacts
    scopes: [crm.objects.contacts.write]
    request:
      method: POST
      path: /crm/v3/objects/contacts
      body:
        properties: "${properties}"
        associations: "${associations}"
    input:
      properties:
        type: object
        description: Internal property name to value, e.g. {"email":"ada@example.com","firstname":"Ada"}.
        properties:
          email: {type: string}
          firstname: {type: string}
          lastname: {type: string}
          phone: {type: string}
      associations:
        type: array
        description: Records to associate on creation, each {"to":{"id":...},"types":[...]}.
        optional: true
        items: {type: object}
    output:
      description: The created contact.
      type: object
      properties:
        id: {type: string, description: "The new record id."}
        properties: {type: object}
        createdAt: {type: string}

  update_contact:
    title: Update a contact
    description: >-
      Change properties on an existing contact. Only the properties supplied are
      written; everything else keeps its current value. Setting a property to an
      empty string clears it.
    category: crm.contacts
    scopes: [crm.objects.contacts.write]
    request:
      method: PATCH
      path: /crm/v3/objects/contacts/${contact_id}
      body:
        properties: "${properties}"
    input:
      contact_id:
        type: string
        description: The contact's record id.
      properties:
        type: object
        description: Internal property name to new value.
    output:
      description: The updated contact.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}
        updatedAt: {type: string}

  delete_contact:
    title: Delete a contact
    description: >-
      Archive a contact. HubSpot keeps archived records for 90 days before
      permanent deletion, but this tool cannot restore one.
    category: crm.contacts
    scopes: [crm.objects.contacts.write]
    destructive: true
    request:
      method: DELETE
      path: /crm/v3/objects/contacts/${contact_id}
    input:
      contact_id:
        type: string
        description: The contact's record id.
    output:
      description: Empty on success -- HubSpot answers 204 No Content.
      type: object

  batch_create_contacts:
    title: Create many contacts at once
    description: >-
      Create up to 100 contacts in one call, which is far cheaper against the
      rate limit than a loop of create_contact.
    category: crm.contacts
    scopes: [crm.objects.contacts.write]
    request:
      method: POST
      path: /crm/v3/objects/contacts/batch/create
      body:
        inputs: "${contacts}"
    input:
      contacts:
        type: array
        description: "Up to 100 items, each {\"properties\": {\"email\": ..., \"firstname\": ...}}."
        max_length: 100
        items:
          type: object
          properties:
            properties: {type: object}
    output:
      description: The created contacts, and any per-record errors.
      type: object
      properties:
        status: {type: string}
        results: {type: array}
        errors: {type: array}

  # -- companies -------------------------------------------------------------

  list_companies:
    title: List companies
    description: Page through company records, with the cursor for the next page.
    category: crm.companies
    scopes: [crm.objects.companies.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/companies
      query:
        limit: "${limit}"
        after: "${after}"
        properties: "${properties}"
        associations: "${associations}"
    input:
      limit:
        type: integer
        description: How many companies per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
      properties:
        type: array
        description: Company properties to return, e.g. ["name","domain","industry"].
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for.
        optional: true
        items: {type: string}
    output:
      description: A page of companies.
      type: object
      properties:
        results: {type: array}
        paging: {type: object}

  get_company:
    title: Get a company
    description: Fetch one company record by its id, with any properties named.
    category: crm.companies
    scopes: [crm.objects.companies.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/companies/${company_id}
      query:
        properties: "${properties}"
        associations: "${associations}"
    input:
      company_id:
        type: string
        description: The company's record id.
      properties:
        type: array
        description: Properties to return beyond the defaults.
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for.
        optional: true
        items: {type: string}
    output:
      description: The company record.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  search_companies:
    title: Search companies
    description: >-
      Find companies by keyword or by precise property conditions, the same
      filter shape as search_contacts.
    category: crm.companies
    scopes: [crm.objects.companies.read]
    read_only: true
    request:
      method: POST
      path: /crm/v3/objects/companies/search
      body:
        query: "${query}"
        filterGroups:
          - $when: "${filters}"
            filters: "${filters}"
        properties: "${properties}"
        limit: "${limit}"
        after: "${after}"
    input:
      query:
        type: string
        description: Free-text search across searchable company properties.
        optional: true
      filters:
        type: array
        description: Conditions ANDed together, each {"propertyName","operator","value"}.
        optional: true
        items: {type: object}
      properties:
        type: array
        description: Properties to return on each match.
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: How many matches per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: Matching companies with the total count.
      type: object
      properties:
        total: {type: integer}
        results: {type: array}

  create_company:
    title: Create a company
    description: >-
      Create a company record. HubSpot deduplicates on the `domain` property, so
      supply it whenever it is known.
    category: crm.companies
    scopes: [crm.objects.companies.write]
    request:
      method: POST
      path: /crm/v3/objects/companies
      body:
        properties: "${properties}"
    input:
      properties:
        type: object
        description: Internal property name to value, e.g. {"name":"Acme","domain":"acme.com"}.
        properties:
          name: {type: string}
          domain: {type: string}
          industry: {type: string}
    output:
      description: The created company.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  update_company:
    title: Update a company
    description: Change properties on an existing company; unsupplied properties are untouched.
    category: crm.companies
    scopes: [crm.objects.companies.write]
    request:
      method: PATCH
      path: /crm/v3/objects/companies/${company_id}
      body:
        properties: "${properties}"
    input:
      company_id:
        type: string
        description: The company's record id.
      properties:
        type: object
        description: Internal property name to new value.
    output:
      description: The updated company.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  delete_company:
    title: Delete a company
    description: Archive a company record, removing it from the live CRM.
    category: crm.companies
    scopes: [crm.objects.companies.write]
    destructive: true
    request:
      method: DELETE
      path: /crm/v3/objects/companies/${company_id}
    input:
      company_id:
        type: string
        description: The company's record id.
    output:
      description: Empty on success -- HubSpot answers 204 No Content.
      type: object

  # -- deals -----------------------------------------------------------------

  list_deals:
    title: List deals
    description: Page through deal records with their stage, amount and close date.
    category: crm.deals
    scopes: [crm.objects.deals.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/deals
      query:
        limit: "${limit}"
        after: "${after}"
        properties: "${properties}"
        associations: "${associations}"
    input:
      limit:
        type: integer
        description: How many deals per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
      properties:
        type: array
        description: Deal properties to return, e.g. ["dealname","amount","dealstage","closedate"].
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for, e.g. ["contacts","companies"].
        optional: true
        items: {type: string}
    output:
      description: A page of deals.
      type: object
      properties:
        results: {type: array}
        paging: {type: object}

  get_deal:
    title: Get a deal
    description: Fetch one deal by its record id, with any properties and associations named.
    category: crm.deals
    scopes: [crm.objects.deals.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/deals/${deal_id}
      query:
        properties: "${properties}"
        associations: "${associations}"
    input:
      deal_id:
        type: string
        description: The deal's record id.
      properties:
        type: array
        description: Properties to return beyond the defaults.
        optional: true
        items: {type: string}
      associations:
        type: array
        description: Object types to return associated ids for.
        optional: true
        items: {type: string}
    output:
      description: The deal record.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  search_deals:
    title: Search deals
    description: >-
      Find deals by keyword or property conditions -- open deals over a value,
      deals closing this quarter, deals in a named stage.
    category: crm.deals
    scopes: [crm.objects.deals.read]
    read_only: true
    request:
      method: POST
      path: /crm/v3/objects/deals/search
      body:
        query: "${query}"
        filterGroups:
          - $when: "${filters}"
            filters: "${filters}"
        properties: "${properties}"
        sorts: "${sorts}"
        limit: "${limit}"
        after: "${after}"
    input:
      query:
        type: string
        description: Free-text search across searchable deal properties.
        optional: true
      filters:
        type: array
        description: Conditions ANDed together, each {"propertyName","operator","value"}.
        optional: true
        items: {type: object}
      properties:
        type: array
        description: Properties to return on each match.
        optional: true
        items: {type: string}
      sorts:
        type: array
        description: Sort order, e.g. [{"propertyName":"amount","direction":"DESCENDING"}].
        optional: true
        items: {type: object}
      limit:
        type: integer
        description: How many matches per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: Matching deals with the total count.
      type: object
      properties:
        total: {type: integer}
        results: {type: array}

  create_deal:
    title: Create a deal
    description: >-
      Create a deal. `dealname`, `pipeline` and `dealstage` are the properties
      HubSpot expects; pipeline and stage take internal ids, which
      list_pipelines returns.
    category: crm.deals
    scopes: [crm.objects.deals.write]
    request:
      method: POST
      path: /crm/v3/objects/deals
      body:
        properties: "${properties}"
        associations: "${associations}"
    input:
      properties:
        type: object
        description: Internal property name to value, e.g. {"dealname":"Acme renewal","amount":"5000","dealstage":"appointmentscheduled"}.
        properties:
          dealname: {type: string}
          amount: {type: string}
          dealstage: {type: string}
          pipeline: {type: string}
          closedate: {type: string}
      associations:
        type: array
        description: Contacts or companies to link on creation.
        optional: true
        items: {type: object}
    output:
      description: The created deal.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  update_deal:
    title: Update a deal
    description: >-
      Change properties on a deal -- most often `dealstage` to move it along the
      pipeline, or `amount` and `closedate`.
    category: crm.deals
    scopes: [crm.objects.deals.write]
    request:
      method: PATCH
      path: /crm/v3/objects/deals/${deal_id}
      body:
        properties: "${properties}"
    input:
      deal_id:
        type: string
        description: The deal's record id.
      properties:
        type: object
        description: Internal property name to new value.
    output:
      description: The updated deal.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  delete_deal:
    title: Delete a deal
    description: Archive a deal record, removing it from the live pipeline.
    category: crm.deals
    scopes: [crm.objects.deals.write]
    destructive: true
    request:
      method: DELETE
      path: /crm/v3/objects/deals/${deal_id}
    input:
      deal_id:
        type: string
        description: The deal's record id.
    output:
      description: Empty on success -- HubSpot answers 204 No Content.
      type: object

  list_pipelines:
    title: List deal pipelines and stages
    description: >-
      List the pipelines defined for an object type and the stages inside each,
      with the internal ids create_deal and update_deal need.
    category: crm.deals
    scopes: [crm.objects.deals.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/pipelines/${object_type}
    input:
      object_type:
        type: string
        description: Which object's pipelines to list.
        optional: true
        default: deals
        enum: [deals, tickets]
    output:
      description: The pipelines and their stages.
      type: object
      properties:
        results: {type: array, description: "Each pipeline, with a stages array of {id,label}."}

  # -- tickets ---------------------------------------------------------------

  list_tickets:
    title: List support tickets
    description: Page through service tickets with their pipeline stage and priority.
    category: crm.tickets
    scopes: [tickets]
    read_only: true
    request:
      method: GET
      path: /crm/v3/objects/tickets
      query:
        limit: "${limit}"
        after: "${after}"
        properties: "${properties}"
    input:
      limit:
        type: integer
        description: How many tickets per page (1-100).
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
      properties:
        type: array
        description: Ticket properties to return, e.g. ["subject","hs_pipeline_stage","hs_ticket_priority"].
        optional: true
        items: {type: string}
    output:
      description: A page of tickets.
      type: object
      properties:
        results: {type: array}
        paging: {type: object}

  create_ticket:
    title: Create a support ticket
    description: >-
      Open a service ticket. `subject`, `hs_pipeline` and `hs_pipeline_stage`
      are the properties HubSpot requires; priority goes in `hs_ticket_priority`.
    category: crm.tickets
    scopes: [tickets]
    request:
      method: POST
      path: /crm/v3/objects/tickets
      body:
        properties: "${properties}"
        associations: "${associations}"
    input:
      properties:
        type: object
        description: Internal property name to value, e.g. {"subject":"Login broken","hs_pipeline_stage":"1"}.
        properties:
          subject: {type: string}
          content: {type: string}
          hs_pipeline: {type: string}
          hs_pipeline_stage: {type: string}
          hs_ticket_priority: {type: string}
      associations:
        type: array
        description: Contacts or companies to link the ticket to.
        optional: true
        items: {type: object}
    output:
      description: The created ticket.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  update_ticket:
    title: Update a support ticket
    description: Change ticket properties, most often to move its pipeline stage or close it.
    category: crm.tickets
    scopes: [tickets]
    request:
      method: PATCH
      path: /crm/v3/objects/tickets/${ticket_id}
      body:
        properties: "${properties}"
    input:
      ticket_id:
        type: string
        description: The ticket's record id.
      properties:
        type: object
        description: Internal property name to new value.
    output:
      description: The updated ticket.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  # -- engagements -----------------------------------------------------------

  create_note:
    title: Log a note on a record
    description: >-
      Attach a timeline note to a contact, company or deal. `hs_timestamp` is
      required and is a millisecond epoch or ISO 8601 instant.
    category: crm.engagements
    scopes: [crm.objects.contacts.write]
    notes: >-
      HubSpot gates engagements on the scope of the record they attach to, so a
      note on a deal also needs crm.objects.deals.write.
    request:
      method: POST
      path: /crm/v3/objects/notes
      body:
        properties:
          hs_note_body: "${body}"
          hs_timestamp: "${timestamp}"
        associations: "${associations}"
    input:
      body:
        type: string
        description: The note text. HTML is allowed.
      timestamp:
        type: string
        description: When the note happened, ISO 8601 or a millisecond epoch.
        example: "2026-08-27T10:00:00Z"
      associations:
        type: array
        description: Records to attach the note to, each {"to":{"id":...},"types":[{"associationCategory":"HUBSPOT_DEFINED","associationTypeId":202}]}.
        optional: true
        items: {type: object}
    output:
      description: The created note engagement.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  create_task:
    title: Create a CRM task
    description: >-
      Create a task on the CRM timeline with a subject, due date and owner. Set
      hs_task_status to NOT_STARTED for a fresh task.
    category: crm.engagements
    scopes: [crm.objects.contacts.write]
    notes: Also needs the write scope of any object the task is associated with.
    request:
      method: POST
      path: /crm/v3/objects/tasks
      body:
        properties:
          hs_task_subject: "${subject}"
          hs_task_body: "${body}"
          hs_timestamp: "${due}"
          hs_task_status: "${status}"
          hs_task_priority: "${priority}"
          hubspot_owner_id: "${owner_id}"
        associations: "${associations}"
    input:
      subject:
        type: string
        description: What the task is.
      due:
        type: string
        description: Due date and time, ISO 8601 or a millisecond epoch.
      body:
        type: string
        description: Longer description of the task.
        optional: true
      status:
        type: string
        description: Task status.
        optional: true
        default: NOT_STARTED
        enum: [NOT_STARTED, IN_PROGRESS, WAITING, COMPLETED, DEFERRED]
      priority:
        type: string
        description: Task priority.
        optional: true
        enum: [LOW, MEDIUM, HIGH]
      owner_id:
        type: string
        description: HubSpot owner id to assign it to, from list_owners.
        optional: true
      associations:
        type: array
        description: Records to attach the task to.
        optional: true
        items: {type: object}
    output:
      description: The created task.
      type: object
      properties:
        id: {type: string}
        properties: {type: object}

  # -- associations, owners and properties -----------------------------------

  associate_records:
    title: Associate two records
    description: >-
      Link two CRM records -- a contact to a company, a deal to a contact -- using
      HubSpot's default association type for the pair.
    category: crm.associations
    scopes: [crm.objects.contacts.write]
    notes: Needs the write scope of both object types involved.
    request:
      method: PUT
      path: /crm/v4/objects/${from_object_type}/${from_id}/associations/default/${to_object_type}/${to_id}
    input:
      from_object_type:
        type: string
        description: Object type of the first record, e.g. contacts.
        enum: [contacts, companies, deals, tickets, line_items, quotes, notes, tasks]
      from_id:
        type: string
        description: Record id of the first record.
      to_object_type:
        type: string
        description: Object type of the second record.
        enum: [contacts, companies, deals, tickets, line_items, quotes, notes, tasks]
      to_id:
        type: string
        description: Record id of the second record.
    output:
      description: The association that now exists.
      type: object
      properties:
        fromObjectTypeId: {type: string}
        labels: {type: array}

  list_associations:
    title: List a record's associations
    description: >-
      List the ids of records of one type associated with a given record -- every
      contact on a company, every deal on a contact.
    category: crm.associations
    scopes: [crm.objects.contacts.read]
    read_only: true
    notes: Needs the read scope of both object types involved.
    request:
      method: GET
      path: /crm/v4/objects/${from_object_type}/${from_id}/associations/${to_object_type}
      query:
        limit: "${limit}"
        after: "${after}"
    input:
      from_object_type:
        type: string
        description: Object type of the record you have.
        enum: [contacts, companies, deals, tickets, line_items, quotes, notes, tasks]
      from_id:
        type: string
        description: Record id of the record you have.
      to_object_type:
        type: string
        description: Object type of the records you want.
        enum: [contacts, companies, deals, tickets, line_items, quotes, notes, tasks]
      limit:
        type: integer
        description: How many associations per page.
        optional: true
        default: 100
        minimum: 1
        maximum: 500
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: The associated record ids.
      type: object
      properties:
        results: {type: array, description: "Each holds toObjectId and the association types."}

  list_owners:
    title: List CRM owners
    description: >-
      List the users records can be assigned to, with the numeric owner ids that
      hubspot_owner_id properties take.
    category: crm.owners
    scopes: [crm.objects.owners.read]
    read_only: true
    request:
      method: GET
      path: /crm/v3/owners
      query:
        email: "${email}"
        limit: "${limit}"
        after: "${after}"
    input:
      email:
        type: string
        description: Return only the owner with this email address.
        optional: true
        format: email
      limit:
        type: integer
        description: How many owners per page.
        optional: true
        default: 100
        minimum: 1
        maximum: 500
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: The portal's CRM owners.
      type: object
      properties:
        results: {type: array, description: "Each with id, email, firstName and lastName."}

  list_properties:
    title: List an object's properties
    description: >-
      List every property defined on an object type, standard and custom, with
      its internal name, label, type and any options. Read this before writing
      properties you did not choose the names of.
    category: crm.schema
    scopes: [crm.schemas.contacts.read]
    read_only: true
    notes: Each object type has its own crm.schemas.* read scope.
    request:
      method: GET
      path: /crm/v3/properties/${object_type}
      query:
        archived: "${archived}"
    input:
      object_type:
        type: string
        description: Which object's properties to list.
        enum: [contacts, companies, deals, tickets, line_items, quotes, products]
      archived:
        type: boolean
        description: Return archived properties instead of live ones.
        optional: true
    output:
      description: The object type's property definitions.
      type: object
      properties:
        results: {type: array, description: "Each with name, label, type, fieldType and options."}

  # -- marketing -------------------------------------------------------------

  list_forms:
    title: List marketing forms
    description: List the portal's marketing forms with their ids and field definitions.
    category: marketing.forms
    scopes: [forms]
    read_only: true
    request:
      method: GET
      path: /marketing/v3/forms
      query:
        limit: "${limit}"
        after: "${after}"
    input:
      limit:
        type: integer
        description: How many forms per page.
        optional: true
        default: 50
        minimum: 1
        maximum: 100
      after:
        type: string
        description: Paging cursor from the previous response.
        optional: true
    output:
      description: A page of forms.
      type: object
      properties:
        results: {type: array}
        paging: {type: object}

  send_marketing_email:
    title: Send a single transactional marketing email
    description: >-
      Send one instance of a published single-send marketing email to one
      recipient, merging in custom properties. The email must already exist in
      HubSpot and be set up for single send.
    category: marketing.email
    scopes: [transactional-email]
    destructive: true
    request:
      method: POST
      path: /marketing/v3/transactional/single-email/send
      body:
        emailId: "${email_id}"
        message:
          to: "${to}"
          cc: "${cc}"
          sendId: "${send_id}"
        customProperties: "${custom_properties}"
    input:
      email_id:
        type: integer
        description: Numeric id of the single-send email in HubSpot.
      to:
        type: string
        description: Recipient email address.
        format: email
      cc:
        type: array
        description: Addresses to copy.
        optional: true
        items: {type: string, format: email}
      send_id:
        type: string
        description: Your own id for this send, used to deduplicate retries.
        optional: true
      custom_properties:
        type: object
        description: Merge values the email template refers to.
        optional: true
    output:
      description: The queued send, with its status id.
      type: object
      properties:
        requestedAt: {type: string}
        statusId: {type: string}
        status: {type: string}

  # -- account ---------------------------------------------------------------

  get_account_info:
    title: Get the connected portal
    description: >-
      Read which HubSpot portal the token belongs to, its time zone, currency
      and UI domain -- the cheapest way to confirm the connection's account.
    category: account
    scopes: [oauth]
    read_only: true
    request:
      method: GET
      path: /account-info/v3/details
    input: {}
    output:
      description: The portal's details.
      type: object
      properties:
        portalId: {type: integer}
        accountType: {type: string}
        timeZone: {type: string}
        companyCurrency: {type: string}
        uiDomain: {type: string}
