# Axesso Data Service (Amazon API) tools.
#
# Every path, method and parameter below comes from Axesso's own API Management
# portal, read through its developer data API:
#
#   https://axesso.developer.azure-api.net/developer/apis?api-version=2022-04-01-preview
#   .../developer/apis/axesso-amazon-data-service/operations/{id}?api-version=...
#
# The connection's base url is https://api.axesso.de/amz, which is exactly the
# route prefix Axesso registers the Amazon API under, so the paths here start at
# /amazon-... . (The generated pack this replaces repeated the /amz prefix in
# every path and so double-prefixed every request.)
#
# Two tools reach neighbouring Axesso APIs on the same host. The Amazon Advanced
# API sits under /amz/v3, so get_stock_quantity is simply a /v3/... path; the
# Account Details API sits under /v1/account, outside the connection's prefix,
# so get_quota_limits carries an explicit base url.
#
# Every request is a live scrape of the Amazon website, so responses are
# real-time and each call counts against the plan's quota -- get_quota_limits is
# how you check what is left. domainCode picks the marketplace (com, de, co.uk,
# fr, it, es, ca and so on); endpoints that take a url instead expect a full
# Amazon product URL, and Axesso recommends appending ?psc=1 to it so the
# correct variant is returned.
#
# Not covered: Axesso's other marketplaces (Walmart, Otto, Zalando, Kaufland,
# Lidl, Asos, Home Depot, Naver, Yahoo Finance, YouTube, Zillow) and the Amazon
# Deals dataset, each of which is registered under its own route prefix and so
# belongs to a different connection. The older /amz/amazon-lookup-buy-
# recommendations and /amz/sort-options operations from Axesso's published
# Swagger are no longer listed in the portal and are left out.
#
# Docs: https://axesso.developer.azure-api.net/api-details#api=axesso-amazon-data-service

connector_id: axesso-data-service
display_name: Axesso Data Service
docs_url: https://axesso.developer.azure-api.net/api-details#api=axesso-amazon-data-service

tools:
  lookup_product:
    title: Look up an Amazon product
    description: >-
      Fetch full detail for one Amazon product from its URL -- title,
      manufacturer, price, availability, variations, images, rating and review
      count. Append ?psc=1 to the URL so Amazon resolves the exact variant.
    category: products
    read_only: true
    request:
      method: GET
      path: /amazon-lookup-product
      query:
        url: "${url}"
    input:
      url:
        type: string
        description: Full Amazon product URL, ideally with ?psc=1 appended.
    output:
      description: The product's details, including price, rating and variations.
      type: object

  search_products:
    title: Search Amazon by keyword
    description: >-
      Search a marketplace by keyword and get back the ASINs and summary data
      for one page of results. Narrow with a category or browse node, and sort
      by price, review rank or recency.
    category: products
    read_only: true
    request:
      method: GET
      path: /amazon-search-by-keyword-asin
      query:
        keyword: "${keyword}"
        domainCode: "${domain_code}"
        page: "${page}"
        sortBy: "${sort_by}"
        category: "${category}"
        browseNode: "${browse_node}"
        nodeHierarchy: "${node_hierarchy}"
    input:
      keyword:
        type: string
        description: Search term to look for.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de, co.uk, fr, it or es.
      page:
        type: integer
        description: Result page to fetch, starting at 1.
        minimum: 1
      sort_by:
        type: string
        description: Sort order for the results.
        optional: true
        enum: [relevanceblender, price-asc-rank, price-desc-rank, review-rank, date-desc-rank]
      category:
        type: string
        description: Category to search within, as named in Amazon's search selector.
        optional: true
      browse_node:
        type: string
        description: Browse node id of the category or sub-category to search in.
        optional: true
      node_hierarchy:
        type: string
        description: Further category node ids, comma separated.
        optional: true
    output:
      description: A page of search results with ASINs, titles and prices.
      type: object

  lookup_prices:
    title: Look up all offers for a product
    description: >-
      List the competing offers on one ASIN -- each seller's price, condition,
      shipping and whether they hold the Buy Box. Pages through long offer
      lists.
    category: products
    read_only: true
    request:
      method: GET
      path: /amazon-lookup-prices
      query:
        asin: "${asin}"
        domainCode: "${domain_code}"
        page: "${page}"
    input:
      asin:
        type: string
        description: ASIN of the product to price.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
      page:
        type: integer
        description: Offer page to fetch, starting at 1.
        minimum: 1
    output:
      description: The offers on the product, with seller, price and condition.
      type: object

  get_stock_quantity:
    title: Get an offer's stock quantity
    description: >-
      Read the real-time available quantity behind a product offer. With just an
      asin it reports the featured Buy Box offer; add a sellerId to check one
      merchant. exactQuantity says whether the number is exact or a lower bound.
    category: products
    read_only: true
    request:
      method: GET
      path: /v3/amazon-stock-quantity
      query:
        asin: "${asin}"
        domainCode: "${domain_code}"
        sellerId: "${seller_id}"
    input:
      asin:
        type: string
        description: ASIN of the product to check.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
      seller_id:
        type: string
        description: Merchant id to check instead of the Buy Box offer, e.g. A2WU6JHR5PVKH1.
        optional: true
    output:
      description: Available quantity, whether it is exact, and the offer's details.
      type: object

  lookup_seller:
    title: Look up a seller
    description: >-
      Fetch a marketplace seller's storefront details -- business name, address,
      rating, feedback counts and the policies shown on their profile.
    category: sellers
    read_only: true
    request:
      method: GET
      path: /amazon-lookup-seller
      query:
        sellerId: "${seller_id}"
        domainCode: "${domain_code}"
    input:
      seller_id:
        type: string
        description: Amazon seller (merchant) id.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
    output:
      description: The seller's profile, ratings and feedback summary.
      type: object

  list_seller_products:
    title: List a seller's products
    description: >-
      Page through the products one seller offers in a marketplace, which is how
      you inventory a competitor's catalogue.
    category: sellers
    read_only: true
    request:
      method: GET
      path: /amazon-seller-products
      query:
        sellerId: "${seller_id}"
        domainCode: "${domain_code}"
        page: "${page}"
    input:
      seller_id:
        type: string
        description: Amazon seller (merchant) id.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
      page:
        type: integer
        description: Product page to fetch, starting at 1.
        minimum: 1
    output:
      description: A page of the seller's products with prices.
      type: object

  lookup_profile:
    title: Look up a reviewer profile
    description: >-
      Fetch a shopper's public Amazon profile, including the reviews they have
      written. The path comes from a review payload, e.g. /gp/profile/amzn1... .
    category: reviews
    read_only: true
    request:
      method: GET
      path: /amazon-lookup-profile
      query:
        path: "${path}"
        domainCode: "${domain_code}"
    input:
      path:
        type: string
        description: Profile path from a review, e.g. /gp/profile/amzn1.account.ABC.
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
    output:
      description: The profile with its reviews and activity.
      type: object

  list_best_sellers:
    title: List an Amazon best sellers page
    description: >-
      Read one page of an Amazon best sellers, new releases or movers-and-shakers
      chart from its URL, with the ranked products on it.
    category: rankings
    read_only: true
    request:
      method: GET
      path: /amazon-best-sellers-list
      query:
        url: "${url}"
        page: "${page}"
    input:
      url:
        type: string
        description: Full URL of the Amazon best sellers list.
      page:
        type: integer
        description: Chart page to fetch, starting at 1.
        minimum: 1
    output:
      description: The ranked products on that page of the chart.
      type: object

  search_deals:
    title: Search Amazon deals
    description: >-
      Page through a marketplace's Today's Deals -- top, best and lightning
      deals -- filtered by department, discount band, price band or star
      rating. Each page holds up to 30 deals.
    category: deals
    read_only: true
    request:
      method: GET
      path: /amazon-search-deals-v2
      query:
        domainCode: "${domain_code}"
        page: "${page}"
        departments: "${departments}"
        discountRange: "${discount_range}"
        priceRange: "${price_range}"
        minProductStarRating: "${min_product_star_rating}"
        primeEarly: "${prime_early}"
        primeExclusive: "${prime_exclusive}"
    input:
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
      page:
        type: integer
        description: Deals page to fetch, starting at 1.
        minimum: 1
      departments:
        type: string
        description: Department id to restrict to; get valid ids from get_deal_filters.
        optional: true
      discount_range:
        type: string
        description: Discount band to restrict to, as listed by get_deal_filters.
        optional: true
      price_range:
        type: string
        description: Price band to restrict to, as listed by get_deal_filters.
        optional: true
      min_product_star_rating:
        type: string
        description: Minimum star rating band, as listed by get_deal_filters.
        optional: true
      prime_early:
        type: boolean
        description: True to return Prime early access deals only.
        optional: true
      prime_exclusive:
        type: boolean
        description: True to return Prime exclusive deals only.
        optional: true
    output:
      description: A page of deals with their prices, discounts and deal type.
      type: object

  get_deal_filters:
    title: Get the valid deal filters
    description: >-
      Read the filter values a marketplace's deals page accepts -- department
      ids, discount bands, price bands and rating bands. Call this before
      search_deals rather than guessing values.
    category: deals
    read_only: true
    request:
      method: GET
      path: /amazon-deal-filter-v2
      query:
        domainCode: "${domain_code}"
    input:
      domain_code:
        type: string
        description: Marketplace suffix, e.g. com, de or co.uk.
    output:
      description: The valid filter values for that marketplace's deals page.
      type: object

  get_quota_limits:
    title: Get the subscription quota limits
    description: >-
      Read the request quota and remaining allowance for every subscription on
      the account, which is the way to see how much of the plan is left before
      calls start failing.
    category: account
    read_only: true
    request:
      method: GET
      path: /quotas
      base_url_override: https://api.axesso.de/v1/account
    output:
      description: Each subscription with its quota limit and usage.
      type: object
