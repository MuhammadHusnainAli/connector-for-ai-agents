# Connector definitions: OAUTH2 auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
absorb-lms:
  auth_mode: OAUTH2
  authorization_params:
    response_type: code
  authorization_url: https://${connectionConfig.portalRoute}/oauth/authorize
  categories:
  - other
  connection_config:
    apiVersion:
      default_value: v1
      description: ''
      hidden: true
      title: ''
      type: string
    portalRoute:
      description: The hostname of your Absorb LMS portal.
      example: mycompany.myabsorb.com
      format: hostname
      order: 1
      prefix: https://
      title: Hostname
      type: string
    restApiKey:
      description: Your Absorb LMS REST API Private Key.
      order: 2
      secret: true
      title: REST API Key
      type: string
  disable_pkce: true
  display_name: Absorb LMS
  proxy:
    base_url: https://${connectionConfig.portalRoute}
    headers:
      x-api-key: ${connectionConfig.restApiKey}
      x-api-version: ${connectionConfig.apiVersion}
  refresh_params:
    grant_type: refresh_token
  token_params:
    grant_type: authorization_code
  token_url: https://${connectionConfig.portalRoute}/oauth/token
