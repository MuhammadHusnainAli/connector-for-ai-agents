  create_template:
    title: Create a template
    description: >-
      Create a reusable mailing template on the account.
    category: templates
    request:
      method: POST
      path: /templates
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The template to create -- its name and content.
    output:
      description: The provider's response to the call.
      type: object

  get_template:
    title: Get a template
    description: >-
      One template's name and content, for reading or copying before editing
      it.
    category: templates
    read_only: true
    request:
      method: GET
      path: /templates/${id}
    input:
      id:
        type: integer
        description: The record id.
    output:
      description: The requested record.
      type: object

  replace_template:
    title: Replace a template
    description: >-
      Replace a template's content wholesale. Mailings already sent from it
      are unaffected; future ones pick up the change.
    category: templates
    request:
      method: PUT
      path: /templates/${id}
      body: "${attributes}"
    input:
      id:
        type: integer
        description: The record id.
      attributes:
        type: object
        description: The full replacement template definition.
    output:
      description: The record after the update.
      type: object

  delete_template:
    title: Delete a template
    description: >-
      Delete a template. Mailings already created from it keep their content;
      only the reusable template goes.
    category: templates
    destructive: true
    request:
      method: DELETE
      path: /templates/${id}
    input:
      id:
        type: integer
        description: The record id.
    output:
      description: Confirmation that the record was deleted.
      type: object

  create_batch:
    title: Create a batch import
    description: >-
      Import many members in one asynchronous job, rather than one call per
      person. Returns a batch id to poll -- the import is not finished when
      this returns.
    category: batches
    request:
      method: POST
      path: /batches
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The batch to run -- the members to import and the groups to place them in.
    output:
      description: The provider's response to the call.
      type: object

  get_batch:
    title: Get a batch
    description: >-
      A batch import's progress and outcome. Poll this after create_batch;
      `showErrorDetails` is what turns a bare failure count into the per-row
      reasons.
    category: batches
    read_only: true
    request:
      method: GET
      path: /batches/${id}
      query:
        showErrorDetails: "${show_error_details}"
    input:
      id:
        type: integer
        description: The record id.
      show_error_details:
        type: boolean
        description: Include the per-row error details rather than only the counts.
        optional: true
    output:
      description: The requested record.
      type: object

  generate_token:
    title: Generate an API token
    description: >-
      Mint a new API token for the account. The token value is returned once
      and cannot be retrieved afterwards, so capture it from this response.
    category: tokens
    request:
      method: POST
      path: /tokens
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The token to create, e.g. its name or description.
    output:
      description: The provider's response to the call.
      type: object

  revoke_token:
    title: Revoke an API token
    description: >-
      Revoke an API token immediately. Anything authenticating with it starts
      failing at once -- including, if you revoke the wrong one, this
      connection.
    category: tokens
    destructive: true
    request:
      method: DELETE
      path: /tokens/${token_unique_id}
    input:
      token_unique_id:
        type: string
        description: The token's unique id.
    output:
      description: Confirmation that the record was deleted.
      type: object
