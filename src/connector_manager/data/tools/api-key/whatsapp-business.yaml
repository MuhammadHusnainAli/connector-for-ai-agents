# WhatsApp Business tools -- the Cloud API on the Meta Graph API.
#
# The base url is the whole of graph.facebook.com, so every path here starts
# with the Graph version. That version is an argument on each tool rather than
# something the connection fixes, because Meta ships a new one roughly
# quarterly and old ones age out: `api_version` defaults to v21.0, matching the
# version the connector's own verification endpoint uses.
#
# Three ids do all the work, and mixing them up is the single most common
# failure here:
#
#   * **phone number id** -- a specific sending number. Messages, media,
#     registration and the business profile all hang off this;
#   * **WhatsApp Business Account (WABA) id** -- the account that owns those
#     numbers. Templates, the phone-number list, webhook subscriptions and
#     analytics hang off this instead;
#   * **media id** -- returned by an upload, addressed at the root of the graph
#     with no parent id in the path.
#
# Two more things shape what an agent can actually do:
#
#   * **you cannot open a conversation with free text.** Outside the 24-hour
#     customer service window, only an approved template message is delivered.
#     `send_message` will happily post a text body and have it dropped, so
#     `send_template_message` is the tool for anything the customer did not
#     just reply to;
#   * **media upload is multipart.** `POST /{phone-number-id}/media` takes a
#     file part, which this JSON proxy cannot construct, so there is no upload
#     tool below -- send media by public `link` on the message instead, or
#     upload out of band and pass the returned id.
#
# Docs: https://developers.facebook.com/docs/whatsapp/cloud-api/reference

connector_id: whatsapp-business
display_name: WhatsApp Business
docs_url: https://developers.facebook.com/docs/whatsapp/cloud-api/reference

tools:

  # -- connection -----------------------------------------------------------

  check_connection:
    title: Check the connection
    description: >-
      Read the identity behind the access token. The cheapest call that proves
      the credential still works, and the first thing to try when every other
      tool is returning 190-series auth errors.
    category: connection
    read_only: true
    request:
      method: GET
      path: /${api_version}/me
    input:
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The identity the access token belongs to.
      type: object
      properties:
        id: {type: string}
        name: {type: string}

  # -- messaging ------------------------------------------------------------

  send_message:
    title: Send a message
    description: >-
      Send a WhatsApp message of any type from one of your numbers. Pass the
      type-specific object alongside `type` -- {"body": "..."} for text,
      {"link": "https://..."} for image, document, audio or video. Note the
      24-hour rule: free-form messages are only delivered inside the window
      opened by the customer's last message. Outside it, use
      send_template_message.
    category: messages
    destructive: true
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/messages
      body:
        messaging_product: whatsapp
        recipient_type: "${recipient_type}"
        to: "${to}"
        type: "${type}"
        text: "${text}"
        image: "${image}"
        document: "${document}"
        audio: "${audio}"
        video: "${video}"
        sticker: "${sticker}"
        location: "${location}"
        contacts: "${contacts}"
        interactive: "${interactive}"
        reaction: "${reaction}"
        context: "${context}"
    input:
      phone_number_id:
        type: string
        description: The id of the business phone number sending the message.
      to:
        type: string
        description: The recipient's phone number in international format without a leading + or 00.
        example: "16505551234"
      type:
        type: string
        description: Which message object is being sent.
        enum: [text, image, document, audio, video, sticker, location, contacts, interactive, reaction, template]
        optional: true
        default: text
      text:
        type: object
        description: 'For type "text": {"body": "...", "preview_url": true}.'
        optional: true
      image:
        type: object
        description: 'For type "image": {"link": "https://..."} or {"id": "<media-id>"}, plus an optional caption.'
        optional: true
      document:
        type: object
        description: 'For type "document": {"link"|"id", "caption", "filename"}.'
        optional: true
      audio:
        type: object
        description: 'For type "audio": {"link"} or {"id"}.'
        optional: true
      video:
        type: object
        description: 'For type "video": {"link"|"id", "caption"}.'
        optional: true
      sticker:
        type: object
        description: 'For type "sticker": {"link"} or {"id"}.'
        optional: true
      location:
        type: object
        description: 'For type "location": {"latitude", "longitude", "name", "address"}.'
        optional: true
      contacts:
        type: array
        description: For type "contacts", the contact cards to send.
        optional: true
        items: {type: object}
      interactive:
        type: object
        description: For type "interactive", a button, list, flow or CTA-url payload.
        optional: true
      reaction:
        type: object
        description: 'For type "reaction": {"message_id": "...", "emoji": "👍"}. An empty emoji removes the reaction.'
        optional: true
      recipient_type:
        type: string
        description: Almost always "individual"; the default when omitted.
        optional: true
        enum: [individual]
      context:
        type: object
        description: '{"message_id": "wamid..."} to send this as a reply to an earlier inbound message.'
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The accepted message with the wamid to track it by.
      type: object
      properties:
        messaging_product: {type: string}
        contacts: {type: array}
        messages: {type: array, description: "Each with an `id` (wamid) and message_status."}

  send_template_message:
    title: Send a template message
    description: >-
      Send an approved message template -- the only kind of message delivered
      outside the 24-hour customer service window, and therefore how a business
      starts a conversation. The template must already be approved on the WABA
      and the `language.code` must match the approved locale exactly;
      `components` supplies the variables the template declares.
    category: messages
    destructive: true
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/messages
      body:
        messaging_product: whatsapp
        recipient_type: individual
        to: "${to}"
        type: template
        template:
          name: "${template_name}"
          language:
            code: "${language_code}"
          components: "${components}"
    input:
      phone_number_id:
        type: string
        description: The id of the business phone number sending the message.
      to:
        type: string
        description: The recipient's phone number in international format without a leading + or 00.
      template_name:
        type: string
        description: The approved template's name, from list_message_templates.
      language_code:
        type: string
        description: The template's language code, e.g. "en_US". Must match the approved locale.
        example: en_US
      components:
        type: array
        description: Header, body and button parameter blocks filling the template's variables.
        optional: true
        items: {type: object}
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The accepted message with the wamid to track it by.
      type: object
      properties:
        messages: {type: array}

  mark_message_as_read:
    title: Mark a message as read
    description: >-
      Set an inbound message to read, which shows the customer the blue ticks.
      Optionally send a typing indicator at the same time. Costs nothing and
      does not open or extend the 24-hour window -- only the customer's own
      message does that.
    category: messages
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/messages
      body:
        messaging_product: whatsapp
        status: read
        message_id: "${message_id}"
        typing_indicator: "${typing_indicator}"
    input:
      phone_number_id:
        type: string
        description: The id of the business phone number that received the message.
      message_id:
        type: string
        description: The inbound message's wamid, from the webhook payload.
      typing_indicator:
        type: object
        description: '{"type": "text"} to also show a typing indicator for up to 25 seconds.'
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the read receipt was accepted.
      type: object
      properties:
        success: {type: boolean}

  # -- media ----------------------------------------------------------------

  get_media_url:
    title: Get a media file's download URL
    description: >-
      Resolve a media id to a temporary download url, plus its mime type, size
      and sha256. The url expires after five minutes and still needs the
      access token on the request, so fetch it immediately rather than storing
      it.
    category: media
    read_only: true
    request:
      method: GET
      path: /${api_version}/${media_id}
      query:
        phone_number_id: "${phone_number_id}"
    input:
      media_id:
        type: string
        description: The media id, from an inbound message or an upload.
      phone_number_id:
        type: string
        description: The business phone number id that owns the media, for accounts with several.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The media's short-lived url and metadata.
      type: object
      properties:
        url: {type: string}
        mime_type: {type: string}
        file_size: {type: integer}
        sha256: {type: string}
        id: {type: string}

  delete_media:
    title: Delete a media file
    description: >-
      Permanently remove an uploaded media file from Meta's servers. Any
      message that already referenced it keeps working, but the id can no
      longer be reused for new sends and the download url stops resolving.
    category: media
    destructive: true
    request:
      method: DELETE
      path: /${api_version}/${media_id}
      query:
        phone_number_id: "${phone_number_id}"
    input:
      media_id:
        type: string
        description: The media id to delete.
      phone_number_id:
        type: string
        description: The business phone number id that owns the media, for accounts with several.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation of the deletion.
      type: object
      properties:
        success: {type: boolean}

  # -- phone numbers --------------------------------------------------------

  list_phone_numbers:
    title: List a business account's phone numbers
    description: >-
      Every phone number registered on a WhatsApp Business Account, with each
      number's id, display name, verification status and quality rating. This
      is where the `phone_number_id` every messaging tool needs comes from.
    category: phone-numbers
    read_only: true
    request:
      method: GET
      path: /${api_version}/${waba_id}/phone_numbers
      query:
        fields: "${fields}"
        limit: "${limit}"
        after: "${after}"
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      fields:
        type: string
        description: Comma-separated fields to return, e.g. "id,display_phone_number,verified_name,quality_rating".
        optional: true
      limit:
        type: integer
        description: How many numbers per page.
        optional: true
        minimum: 1
      after:
        type: string
        description: Cursor from the previous response's paging.cursors.after.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The account's phone numbers.
      type: object
      properties:
        data: {type: array}
        paging: {type: object}

  get_phone_number:
    title: Get a phone number
    description: >-
      Details for one business phone number -- display name, quality rating,
      messaging limit tier and verification status. Read this when sends start
      failing to see whether the number has been throttled or flagged.
    category: phone-numbers
    read_only: true
    request:
      method: GET
      path: /${api_version}/${phone_number_id}
      query:
        fields: "${fields}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id.
      fields:
        type: string
        description: Comma-separated fields to return.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The phone number's settings and status.
      type: object
      properties:
        id: {type: string}
        display_phone_number: {type: string}
        verified_name: {type: string}
        quality_rating: {type: string}

  request_verification_code:
    title: Request a verification code for a number
    description: >-
      Ask Meta to send a verification code to the phone number, by SMS or
      voice, as the first half of verifying ownership. Follow with
      verify_code, then register_phone_number before the number can send
      anything.
    category: phone-numbers
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/request_code
      body:
        code_method: "${code_method}"
        language: "${language}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id being verified.
      code_method:
        type: string
        description: How to deliver the code.
        enum: [SMS, VOICE]
        optional: true
        default: SMS
      language:
        type: string
        description: Language for the message, e.g. "en_US".
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the code was sent.
      type: object
      properties:
        success: {type: boolean}

  verify_code:
    title: Verify a phone number's code
    description: >-
      Submit the code delivered by request_verification_code to prove ownership
      of the number. Verification alone does not make the number usable --
      register_phone_number is the step that enables Cloud API sending.
    category: phone-numbers
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/verify_code
      body:
        code: "${code}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id being verified.
      code:
        type: string
        description: The code received by SMS or voice.
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the number is verified.
      type: object
      properties:
        success: {type: boolean}

  register_phone_number:
    title: Register a phone number for the Cloud API
    description: >-
      Enable a verified number for Cloud API sending, setting its six-digit
      two-step verification PIN at the same time. Nothing can be sent from a
      number until this succeeds. Keep the PIN -- re-registering later needs
      it.
    category: phone-numbers
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/register
      body:
        messaging_product: whatsapp
        pin: "${pin}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id to register.
      pin:
        type: string
        description: The number's six-digit two-step verification PIN.
        pattern: "^[0-9]{6}$"
        example: "123456"
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the number is registered.
      type: object
      properties:
        success: {type: boolean}

  deregister_phone_number:
    title: Deregister a phone number
    description: >-
      Take a number off the Cloud API. It immediately stops sending and
      receiving, and re-enabling it means registering again with its PIN. Do
      this deliberately -- an active number goes dark the moment the call
      returns.
    category: phone-numbers
    destructive: true
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/deregister
    input:
      phone_number_id:
        type: string
        description: The business phone number id to deregister.
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the number is deregistered.
      type: object
      properties:
        success: {type: boolean}

  # -- business profile -----------------------------------------------------

  get_business_profile:
    title: Get a number's business profile
    description: >-
      The public profile customers see for a business number -- about text,
      address, description, email, websites, vertical and profile picture.
      `fields` must be supplied to get anything back beyond the id.
    category: profile
    read_only: true
    request:
      method: GET
      path: /${api_version}/${phone_number_id}/whatsapp_business_profile
      query:
        fields: "${fields}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id.
      fields:
        type: string
        description: Comma-separated fields to return.
        optional: true
        default: about,address,description,email,profile_picture_url,websites,vertical
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The number's public business profile.
      type: object
      properties:
        data: {type: array}

  update_business_profile:
    title: Update a number's business profile
    description: >-
      Change the public profile for a business number. Only the fields you send
      are changed. `websites` accepts at most two urls and `vertical` must be
      one of Meta's fixed industry values -- an unrecognised one is rejected
      rather than ignored.
    category: profile
    request:
      method: POST
      path: /${api_version}/${phone_number_id}/whatsapp_business_profile
      body:
        messaging_product: whatsapp
        about: "${about}"
        address: "${address}"
        description: "${description}"
        email: "${email}"
        vertical: "${vertical}"
        websites: "${websites}"
        profile_picture_handle: "${profile_picture_handle}"
    input:
      phone_number_id:
        type: string
        description: The business phone number id.
      about:
        type: string
        description: The short status line shown on the profile.
        optional: true
      address:
        type: string
        description: The business address.
        optional: true
      description:
        type: string
        description: A longer description of the business.
        optional: true
      email:
        type: string
        description: A contact email address.
        optional: true
        format: email
      vertical:
        type: string
        description: The business industry, from Meta's fixed list, e.g. "RETAIL" or "PROF_SERVICES".
        optional: true
      websites:
        type: array
        description: Up to two website urls.
        optional: true
        items: {type: string}
      profile_picture_handle:
        type: string
        description: A resumable-upload handle for the new profile picture.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the profile was updated.
      type: object
      properties:
        success: {type: boolean}

  # -- message templates ----------------------------------------------------

  list_message_templates:
    title: List message templates
    description: >-
      The message templates on a WhatsApp Business Account with their status,
      category, language and components. Check `status` is APPROVED before
      sending -- a PENDING or REJECTED template is accepted by the send call
      and then dropped.
    category: templates
    read_only: true
    request:
      method: GET
      path: /${api_version}/${waba_id}/message_templates
      query:
        fields: "${fields}"
        name: "${name}"
        status: "${status}"
        language: "${language}"
        limit: "${limit}"
        after: "${after}"
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      fields:
        type: string
        description: Comma-separated fields to return, e.g. "name,status,category,language,components".
        optional: true
      name:
        type: string
        description: Filter to templates with this exact name.
        optional: true
      status:
        type: string
        description: Filter by review status.
        optional: true
        enum: [APPROVED, PENDING, REJECTED, PAUSED, DISABLED, IN_APPEAL]
      language:
        type: string
        description: Filter to one language code, e.g. "en_US".
        optional: true
      limit:
        type: integer
        description: How many templates per page.
        optional: true
        minimum: 1
      after:
        type: string
        description: Cursor from the previous response's paging.cursors.after.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: A page of message templates.
      type: object
      properties:
        data: {type: array}
        paging: {type: object}

  create_message_template:
    title: Create a message template
    description: >-
      Submit a new template for Meta's review. Names must be lowercase
      alphanumerics and underscores, and the category must be one of
      AUTHENTICATION, MARKETING or UTILITY -- miscategorising a marketing
      template as utility is a common rejection reason. Approval is not
      immediate; poll list_message_templates for the status.
    category: templates
    request:
      method: POST
      path: /${api_version}/${waba_id}/message_templates
      body:
        name: "${name}"
        category: "${category}"
        language: "${language}"
        components: "${components}"
        parameter_format: "${parameter_format}"
        allow_category_change: "${allow_category_change}"
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      name:
        type: string
        description: Template name -- lowercase letters, digits and underscores, up to 512 characters.
        max_length: 512
      category:
        type: string
        description: The template's category.
        enum: [AUTHENTICATION, MARKETING, UTILITY]
      language:
        type: string
        description: The template's language code, e.g. "en_US".
        example: en_US
      components:
        type: array
        description: The header, body, footer and button blocks that make up the template.
        items: {type: object}
      parameter_format:
        type: string
        description: Whether variables are named or positional. Positional when omitted.
        optional: true
        enum: [NAMED, POSITIONAL]
      allow_category_change:
        type: boolean
        description: Let Meta recategorise the template during review instead of rejecting it.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The created template, with its id and initial review status.
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        category: {type: string}

  edit_message_template:
    title: Edit a message template
    description: >-
      Change an existing template's components or category by its template id.
      Editing sends the template back through review, so it stops being
      sendable until it is approved again -- an important difference from
      editing a draft.
    category: templates
    request:
      method: POST
      path: /${api_version}/${template_id}
      body:
        components: "${components}"
        category: "${category}"
    input:
      template_id:
        type: string
        description: The template's id, from list_message_templates.
      components:
        type: array
        description: The replacement component blocks.
        optional: true
        items: {type: object}
      category:
        type: string
        description: A new category for the template.
        optional: true
        enum: [AUTHENTICATION, MARKETING, UTILITY]
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the edit was accepted for review.
      type: object
      properties:
        success: {type: boolean}

  delete_message_template:
    title: Delete a message template
    description: >-
      Delete a template from the business account by name, or one specific
      language of it by also passing its id. Messages already queued against it
      may fail, and the name cannot be reused for 30 days.
    category: templates
    destructive: true
    request:
      method: DELETE
      path: /${api_version}/${waba_id}/message_templates
      query:
        name: "${name}"
        hsm_id: "${hsm_id}"
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      name:
        type: string
        description: The template name to delete. Without hsm_id this deletes every language of it.
      hsm_id:
        type: string
        description: The specific template id, to delete just that one language.
        optional: true
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation of the deletion.
      type: object
      properties:
        success: {type: boolean}

  # -- webhook subscriptions and analytics ---------------------------------

  list_subscribed_apps:
    title: List apps subscribed to the account's webhooks
    description: >-
      Which apps currently receive this WhatsApp Business Account's webhooks.
      The first thing to check when inbound messages are not arriving -- no
      subscription means no delivery, however correct the callback url is.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /${api_version}/${waba_id}/subscribed_apps
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: The apps subscribed to the account's webhooks.
      type: object
      properties:
        data: {type: array}

  subscribe_app_to_webhooks:
    title: Subscribe this app to the account's webhooks
    description: >-
      Subscribe the app behind this access token to the business account's
      webhooks, so inbound messages and status updates start arriving at the
      app's configured callback url. The callback itself is configured in the
      Meta app dashboard, not here.
    category: webhooks
    request:
      method: POST
      path: /${api_version}/${waba_id}/subscribed_apps
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the app is subscribed.
      type: object
      properties:
        success: {type: boolean}

  unsubscribe_app_from_webhooks:
    title: Unsubscribe this app from the account's webhooks
    description: >-
      Stop this app receiving the business account's webhooks. Inbound messages
      are not queued while unsubscribed -- they are simply not delivered, so
      anything a customer sends in the meantime is lost to the integration.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /${api_version}/${waba_id}/subscribed_apps
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Confirmation that the app is unsubscribed.
      type: object
      properties:
        success: {type: boolean}

  get_conversation_analytics:
    title: Get conversation analytics
    description: >-
      Billed conversation counts and costs for a business account over a time
      range, optionally broken down by phone number, country or conversation
      category. Timestamps are Unix seconds. This is the billing-side view --
      for delivery outcomes read the message status webhooks instead.
    category: analytics
    read_only: true
    request:
      method: GET
      path: /${api_version}/${waba_id}
      query:
        fields: "${fields}"
    input:
      waba_id:
        type: string
        description: The WhatsApp Business Account id.
      fields:
        type: string
        description: 'The analytics field expression, e.g. conversation_analytics.start(1685602800).end(1688194800).granularity(DAILY).dimensions(["CONVERSATION_CATEGORY"]).'
        example: conversation_analytics.start(1685602800).end(1688194800).granularity(DAILY)
      api_version:
        type: string
        description: Graph API version, e.g. "v21.0".
        optional: true
        default: v21.0
    output:
      description: Conversation counts and costs for the requested range.
      type: object
      properties:
        conversation_analytics: {type: object}
        id: {type: string}
