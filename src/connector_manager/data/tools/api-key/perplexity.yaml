    category: sonar
    request:
      method: POST
      path: /v1/sonar
      body:
        max_tokens: ${max_tokens}
        model: ${model}
        stream: ${stream}
        stop: ${stop}
        temperature: ${temperature}
        top_p: ${top_p}
        response_format: ${response_format}
        messages: ${messages}
        web_search_options: ${web_search_options}
        search_mode: ${search_mode}
        return_images: ${return_images}
        return_related_questions: ${return_related_questions}
    input:
      max_tokens:
        type: string
        description: Maximum number of completion tokens to generate
        optional: true
      model:
        type: string
        description: Model to use, for example, sonar-pro
        enum:
        - sonar
        - sonar-pro
        - sonar-deep-research
        - sonar-reasoning-pro
      stream:
        type: string
        description: If true, returns streaming SSE response
        optional: true
      stop:
        type: string
        description: Stop sequences. Generation stops when one of these strings is produced
