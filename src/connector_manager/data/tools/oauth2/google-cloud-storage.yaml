  list_folders:
    title: List folders
    description: Retrieves a list of folders matching the criteria. Only applicable to buckets with hierarchical
      namespace enabled.
    category: folders
    request:
      method: GET
      path: /storage/v1/b/${bucket}/folders
      query:
        delimiter: ${delimiter}
        endOffset: ${end_offset}
        pageSize: ${page_size}
        pageToken: ${page_token}
        prefix: ${prefix}
        startOffset: ${start_offset}
    input:
      bucket:
        type: string
        description: Name of the bucket in which to look for folders.
      delimiter:
        type: string
        description: Returns results in a directory-like mode. The only supported value is '/'. If set,
          items will only contain folders that either exactly match the prefix, or are one level below
          the prefix.
        optional: true
      end_offset:
        type: string
        description: Filter results to folders whose names are lexicographically before endOffset. If
          startOffset is also set, the folders listed will have names between startOffset (inclusive)
          and endOffset (exclusive).
        optional: true
      page_size:
        type: integer
        description: Maximum number of items to return in a single page of responses.
        optional: true
      page_token:
        type: string
        description: A previously-returned page token representing part of the larger set of results to
          view.
        optional: true
      prefix:
        type: string
        description: Filter results to folders whose paths begin with this prefix. If set, the value must
          either be an empty string or end with a '/'.
        optional: true
      start_offset:
        type: string
        description: Filter results to folders whose names are lexicographically equal to or after startOffset.
          If endOffset is also set, the folders listed will have names between startOffset (inclusive)
          and endOffset (exclusive).
        optional: true
    output:
      description: The Folders resource.
      type: object
    scopes_any:
    - cloud-platform
    - cloud-platform.read-only
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
    read_only: true
