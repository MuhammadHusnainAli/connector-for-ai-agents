  search:
    title: Full-text search
    description: Full-text search Full-text search on episodes, podcasts, or curated lists of podcasts.
      Use the offset parameter to paginate through search results. The FREE plan allows to see up to 30
      search results (or offset < 30) per query. The PRO plan allows to see up to 300 search results (or
      offset < 300) per query. The ENTE Calls GET /search on the provider's API.
    category: search
    request:
      method: GET
      path: /search
      query:
        q: ${q}
        sort_by_date: ${sort_by_date}
        type: ${type}
        offset: ${offset}
        len_min: ${len_min}
        len_max: ${len_max}
        episode_count_min: ${episode_count_min}
        episode_count_max: ${episode_count_max}
        update_freq_min: ${update_freq_min}
        update_freq_max: ${update_freq_max}
        genre_ids: ${genre_ids}
        published_before: ${published_before}
        published_after: ${published_after}
        only_in: ${only_in}
        language: ${language}
        region: ${region}
        ocid: ${ocid}
        ncid: ${ncid}
        safe_mode: ${safe_mode}
        unique_podcasts: ${unique_podcasts}
    input:
      q:
        type: string
        description: Search term, e.g., person, place, topic... You can use double quotes to do verbatim
          match, e.g., "game of thrones". Otherwise, it's fuzzy search.
      sort_by_date:
        type: integer
        description: Sort by date or not? If 0, then sort by relevance. If 1, then sort by date.
        optional: true
        enum:
        - 0
        - 1
        default: 0
      type:
        type: string
        description: What type of contents do you want to search for?
        optional: true
        enum:
        - episode
        - podcast
        - curated
        default: episode
      offset:
        type: integer
        description: Offset for search results, for pagination. You'll use nextoffset from response for
          this parameter.
        optional: true
        default: 0
      len_min:
        type: integer
        description: Minimum audio length in minutes. Applicable only when type parameter is episode or
          podcast. If type parameter is episode, it's for audio length of an episode. If type parameter
          is podcast, it's for average audio length of all episodes in a podcast.
        optional: true
        default: 0
      len_max:
        type: integer
        description: Maximum audio length in minutes. Applicable only when type parameter is episode or
          podcast. If type parameter is episode, it's for audio length of an episode. If type parameter
          is podcast, it's for average audio length of all episodes in a podcast.
        optional: true
      episode_count_min:
        type: integer
        description: Minimum number of episodes. Applicable only when type parameter is podcast.
        optional: true
      episode_count_max:
        type: integer
        description: Maximum number of episodes. Applicable only when type parameter is podcast.
        optional: true
      update_freq_min:
        type: integer
        description: Minimum update frequency in hours (how frequently does a podcast release a new episode).
          For example, if you want to find "weekly" podcasts, then you can set updatefreqmin=144 hours
          (or 6 days) and updatefreqmax=192 hours (or 8 days). Applicable only when type parameter is
          podcast.
        optional: true
      update_freq_max:
        type: integer
        description: Maximum update frequency in hours (how frequently does a podcast release a new episode).
          For example, if you want to find "weekly" podcasts, then you can set updatefreqmin=144 hours
          (or 6 days) and updatefreqmax=192 hours (or 8 days). Applicable only when type parameter is
          podcast.
        optional: true
      genre_ids:
        type: string
        description: A comma-delimited string of a list of genre ids. If not specified, then all genres
          are included. You can find the id and the name of all genres from GET /genres. It works only
          when type is episode or podcast.
        optional: true
      published_before:
        type: integer
        description: Only show episodes/podcasts/curated lists published before this timestamp (in milliseconds).
          If publishedbefore & publishedafter are used at the same time, publishedbefore should be bigger
          than publishedafter.
        optional: true
      published_after:
        type: integer
        description: Only show episodes/podcasts/curated lists published after this timestamp (in milliseconds).
          If publishedbefore & publishedafter are used at the same time, publishedbefore should be bigger
          than publishedafter.
        optional: true
        default: 0
      only_in:
        type: string
        description: A comma-delimited string to search only in specific fields. Allowed values are title,
          description, author, and audio. If not specified, then search every fields.
        optional: true
        default: title,description,author,audio
      language:
        type: string
        description: Limit search results to a specific language. If not specified, it'll be any language.
          You can get a list of supported languages from GET /languages. It works only when type is episode
          or podcast.
        optional: true
      region:
        type: string
        description: Limit search results to a specific region (e.g., us, gb, in...). If not specified,
          it'll be any region. You can get the supported country codes from GET /regions. It works only
          when type is episode or podcast.
        optional: true
      ocid:
        type: string
        description: A comma-delimited string of podcast ids (up to 5 podcasts) - you can get a podcast
          id from the podcastid field in response. This parameter is to limit search results from only
          a few specific podcasts. It works only when type is episode.
        optional: true
      ncid:
        type: string
        description: A comma-delimited string of podcast ids (up to 5 podcasts) - you can get a podcast
          id from the podcastid field in response. This parameter is to exclude search results of a few
          specific podcasts. It works only when type is episode.
        optional: true
      safe_mode:
        type: integer
        description: Whether or not to exclude podcasts/episodes with explicit language. 1 is yes and
          0 is no. It works only when type is episode or podcast.
        optional: true
        enum:
        - 0
        - 1
        default: 0
      unique_podcasts:
        type: integer
        description: Whether or not to keep only one episode per podcast in search results. 1 is yes and
          0 is no. It works only when type is episode.
        optional: true
        enum:
        - 0
        - 1
        default: 0
    output:
      description: OK
      type: object
    read_only: true
