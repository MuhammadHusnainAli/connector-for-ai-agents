          is supported.
        optional: true
      include_removed:
        type: boolean
        description: Whether to include changes indicating that items have been removed from the list
          of changes, for example by deletion or loss of access.
        optional: true
        default: true
      include_team_drive_items:
        type: boolean
        description: 'Deprecated: Use includeItemsFromAllDrives instead.'
