# Bika.ai tools -- spaces, databases, records and automations.
#
# Bika.ai is a database-and-automation platform, shaped much like Airtable. The
# hierarchy is **space → node → resource**: a node is anything in a space's
# tree (a folder, a database, an automation), and a database node's records are
# what you usually want. So the path to any data is:
#
#   1. `list_spaces` -> space id (`spc...`)
#   2. `list_space_nodes` -> node id (`dat...` for a database)
#   3. `list_records` on that database
#
# Two things to get right:
#
#   * **records come in two API versions and they differ.** The v2 record
#     endpoints (used by the record tools here) key cells under `fields`, page
#     with an opaque `offset`, and take `fieldKey` to choose whether cells are
#     keyed by field **name** or **id**. Keep `fieldKey` consistent between
#     what you write and what you read back, or you will address the wrong
#     columns;
#   * **`filter` is a formula string, not an object** -- Bika evaluates it the
#     way a spreadsheet would, over the field names.
#
# Deletes are hard deletes and take ids in the query string rather than the
# body. Uploading attachments needs a multipart request, which this package
# does not send, so there is no attachment tool here.
#
# Docs: https://bika.ai/help/guide/developer/openapi

connector_id: bika
display_name: Bika.ai
docs_url: https://bika.ai/help/guide/developer/openapi

tools:

  # -- account -------------------------------------------------------------

  get_system_meta:
    title: Get system metadata
    description: >-
      Read the Bika.ai instance's own metadata -- version and capabilities. The
      cheapest call that proves the API key is accepted.
    category: account
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/system/meta
    input: {}
    output:
      description: The system metadata.
      type: object

  get_user_profile:
    title: Get the API key's user profile
    description: >-
      Read the user the API key belongs to -- id, name and email. Useful for
      confirming which account an automation is acting as.
    category: account
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/user/profile
    input: {}
    output:
      description: The user profile.
      type: object

  list_spaces:
    title: List spaces
    description: >-
      Read the spaces the key can reach, with their ids (`spc...`). Every
      other call needs a space id, so this is the first call.
    category: spaces
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces
    input: {}
    output:
      description: The accessible spaces.
      type: object

  get_space:
    title: Get a space
    description: Read one space -- its name, plan and settings.
    category: spaces
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}
    input:
      space_id:
        type: string
        description: The space's id, from list_spaces.
        example: spcpPuRJJC4CZOwzB9Vlwmja
    output:
      description: The space.
      type: object

  list_space_nodes:
    title: List a space's nodes
    description: >-
      Read the space's tree -- folders, databases, automations, dashboards --
      with each node's id and type. A database node's id is what the record
      tools take.
    category: spaces
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/nodes
    input:
      space_id:
        type: string
        description: The space's id.
    output:
      description: The space's nodes.
      type: object

  get_space_node:
    title: Get a node
    description: Read one node in a space -- its name, type and parent.
    category: spaces
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/nodes/${node_id}
    input:
      space_id:
        type: string
        description: The space's id.
      node_id:
        type: string
        description: The node's id, from list_space_nodes.
    output:
      description: The node.
      type: object

  # -- database schema -----------------------------------------------------

  get_database:
    title: Get a database
    description: >-
      Read a database node's own record -- its name and configuration. Use
      list_database_fields for the columns.
    category: databases
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/resources/databases/${database_id}
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id, from list_space_nodes.
        example: datkW11Rxx6hFJO924ECNxLk
    output:
      description: The database.
      type: object

  list_database_fields:
    title: List a database's fields
    description: >-
      Read a database's columns -- each field's id, name and type. Read this
      before writing records: it tells you the exact field names (or ids, if
      you use `fieldKey: id`) that a record's `fields` object must use.
    category: databases
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/resources/databases/${database_id}/fields
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
    output:
      description: The database's fields.
      type: object

  list_database_views:
    title: List a database's views
    description: >-
      Read a database's views with their ids. A view carries its own filters
      and sorts, which list_view_records applies for you.
    category: databases
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/resources/databases/${database_id}/views
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
    output:
      description: The database's views.
      type: object

  # -- records -------------------------------------------------------------

  list_records:
    title: List records
    description: >-
      Read a page of records from a database. `filter` is a spreadsheet-style
      formula over the field names, `sort` a list of
      {"field": ..., "order": "asc"} objects, and `field_key` decides whether
      cells come back keyed by field name or field id. Page with the `offset`
      the previous response returned.
    category: records
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records
      query:
        offset: "${offset}"
        pageSize: "${page_size}"
        maxRecords: "${max_records}"
        fields: "${fields}"
        filter: "${filter}"
        sort: "${sort}"
        cellFormat: "${cell_format}"
        fieldKey: "${field_key}"
        timeZone: "${time_zone}"
        userLocale: "${user_locale}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      offset:
        type: string
        description: Opaque offset from the previous response, to fetch the next page.
        optional: true
      page_size:
        type: integer
        description: Records per page.
        optional: true
        minimum: 1
      max_records:
        type: integer
        description: Cap on the total number of records returned across pages.
        optional: true
        minimum: 1
      fields:
        type: array
        description: Only return these fields, by name (or id when `field_key` is "id").
        optional: true
        items: {type: string}
      filter:
        type: string
        description: >-
          A formula deciding which records match, written over the field names
          the way a spreadsheet formula would be.
        optional: true
      sort:
        type: array
        description: 'Sort order, each {"field": <name>, "order": "asc" or "desc"}.'
        optional: true
        items: {type: object}
      cell_format:
        type: string
        description: How cell values are rendered -- "json" for raw values, "string" for display text.
        optional: true
      field_key:
        type: string
        description: Whether cells are keyed by field "name" or field "id". Be consistent with writes.
        optional: true
        enum: [name, id]
      time_zone:
        type: string
        description: Timezone used to format date values, e.g. "Europe/London".
        optional: true
      user_locale:
        type: string
        description: Locale used to format values.
        optional: true
        enum: [en, zh-CN, zh-TW, ja, pt, de]
    output:
      description: A page of records, with the `offset` for the next page.
      type: object
      properties:
        records: {type: array, description: "Each with an id and a `fields` object."}
        offset: {type: string}

  get_record:
    title: Get a record
    description: Read one record by id, with its cells keyed per `field_key`.
    category: records
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records/${record_id}
      query:
        cellFormat: "${cell_format}"
        fieldKey: "${field_key}"
        timeZone: "${time_zone}"
        userLocale: "${user_locale}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      record_id:
        type: string
        description: The record's id.
      cell_format:
        type: string
        description: How cell values are rendered -- "json" or "string".
        optional: true
      field_key:
        type: string
        description: Whether cells are keyed by field name or id.
        optional: true
        enum: [name, id]
      time_zone:
        type: string
        description: Timezone used to format date values.
        optional: true
      user_locale:
        type: string
        description: Locale used to format values.
        optional: true
        enum: [en, zh-CN, zh-TW, ja, pt, de]
    output:
      description: The record.
      type: object

  create_records:
    title: Create records
    description: >-
      Add records to a database. `records` is a list of {"fields": {...}}
      objects whose keys are field names -- or ids, when `field_key` is "id".
      Omitted fields take their default; unknown field names are rejected
      rather than created.
    category: records
    request:
      method: POST
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records
      body:
        records: "${records}"
        fieldKey: "${field_key}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      records:
        type: array
        description: >-
          The records to create, each {"fields": {"Name": "Ada", "Notes":
          "hello"}}.
        items: {type: object}
      field_key:
        type: string
        description: Whether the `fields` keys are field names or field ids.
        optional: true
        enum: [name, id]
    output:
      description: The created records, with their new ids.
      type: object

  update_records:
    title: Update records
    description: >-
      Change several records at once. Each entry needs its `id` plus a
      `fields` object of the cells to change; only the fields you send are
      touched.
    category: records
    request:
      method: PUT
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records
      body:
        records: "${records}"
        fieldKey: "${field_key}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      records:
        type: array
        description: >-
          The records to update, each {"id": <record id>, "fields": {...}}.
        items: {type: object}
      field_key:
        type: string
        description: Whether the `fields` keys are field names or field ids.
        optional: true
        enum: [name, id]
    output:
      description: The updated records.
      type: object

  update_record:
    title: Update one record
    description: >-
      Change one record's cells. `fields` holds only what should change; the
      rest of the record is left alone.
    category: records
    request:
      method: PUT
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records/${record_id}
      body:
        fields: "${fields}"
        fieldKey: "${field_key}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      record_id:
        type: string
        description: The record's id.
      fields:
        type: object
        description: The cells to change, keyed by field name (or id, per `field_key`).
      field_key:
        type: string
        description: Whether the `fields` keys are field names or field ids.
        optional: true
        enum: [name, id]
    output:
      description: The updated record.
      type: object

  delete_records:
    title: Delete records
    description: >-
      Delete up to 10 records by id in one call. Bika takes the ids in the
      query string, and the deletion is permanent.
    category: records
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records
      query:
        records: "${record_ids}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      record_ids:
        type: array
        description: Ids of the records to delete, at most 10.
        items: {type: string}
        max_length: 10
    output:
      description: Confirmation that the records were deleted.
      type: object

  delete_record:
    title: Delete one record
    description: Delete a single record by id. Permanent -- there is no trash to restore from.
    category: records
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v2/spaces/${space_id}/resources/databases/${database_id}/records/${record_id}
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      record_id:
        type: string
        description: The record's id.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_view_records:
    title: List records through a view
    description: >-
      Read records as one of the database's views presents them, with that
      view's own filters and sort applied -- the way to get "what the team sees
      on that tab" rather than the raw table.
    category: records
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/resources/databases/${database_id}/views/${view_id}/records
      query:
        pageNum: "${page_num}"
        pageSize: "${page_size}"
        maxRecords: "${max_records}"
        fields: "${fields}"
        filter: "${filter}"
        recordIds: "${record_ids}"
        cellFormat: "${cell_format}"
        fieldKey: "${field_key}"
    input:
      space_id:
        type: string
        description: The space's id.
      database_id:
        type: string
        description: The database node's id.
      view_id:
        type: string
        description: The view's id, from list_database_views.
      page_num:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Records per page.
        optional: true
        minimum: 1
      max_records:
        type: integer
        description: Cap on the total records returned.
        optional: true
        minimum: 1
      fields:
        type: array
        description: Only return these fields.
        optional: true
        items: {type: string}
      filter:
        type: string
        description: An extra formula filter, applied on top of the view's own.
        optional: true
      record_ids:
        type: array
        description: Only these record ids.
        optional: true
        items: {type: string}
      cell_format:
        type: string
        description: How cell values are rendered.
        optional: true
      field_key:
        type: string
        description: Whether cells are keyed by field name or id.
        optional: true
        enum: [name, id]
    output:
      description: A page of records as the view presents them.
      type: object

  # -- automations ---------------------------------------------------------

  list_automation_triggers:
    title: List an automation's triggers
    description: >-
      Read what starts one automation -- schedule, webhook or record change --
      with each trigger's configuration.
    category: automations
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/resources/automations/${automation_id}/triggers
    input:
      space_id:
        type: string
        description: The space's id.
      automation_id:
        type: string
        description: The automation node's id, from list_space_nodes.
    output:
      description: The automation's triggers.
      type: object

  cancel_automation_run:
    title: Cancel an automation run
    description: >-
      Stop an automation run that is in progress. Steps already executed are
      not undone -- this only prevents the remaining ones.
    category: automations
    request:
      method: POST
      path: /api/openapi/bika/v1/automations/runs/${run_id}/cancel
    input:
      run_id:
        type: string
        description: The run's id.
    output:
      description: Confirmation that the run was cancelled.
      type: object

  # -- members, teams and roles --------------------------------------------

  list_teams:
    title: List teams
    description: >-
      Read a space's teams. Leaving `parent_team_id` off returns the root
      team's children, which is how the hierarchy is walked one level at a
      time.
    category: members
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/teams
      query:
        parentTeamId: "${parent_team_id}"
        pageNo: "${page_no}"
        pageSize: "${page_size}"
    input:
      space_id:
        type: string
        description: The space's id.
      parent_team_id:
        type: string
        description: Read the children of this team. Omit for the root's children.
        optional: true
      page_no:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Teams per page.
        optional: true
        minimum: 1
    output:
      description: A page of teams.
      type: object

  create_team:
    title: Create a team
    description: >-
      Create a team inside a space. `parent_team_id` nests it under another
      team; an empty string puts it at the root.
    category: members
    request:
      method: POST
      path: /api/openapi/bika/v1/spaces/${space_id}/teams
      body:
        name: "${name}"
        parentTeamId: "${parent_team_id}"
    input:
      space_id:
        type: string
        description: The space's id.
      name:
        type: string
        description: The team's name.
      parent_team_id:
        type: string
        description: Parent team id. Pass an empty string to create it at the root.
    output:
      description: The created team.
      type: object

  update_team:
    title: Rename a team
    description: Change a team's name. Its members and position in the tree are untouched.
    category: members
    request:
      method: PUT
      path: /api/openapi/bika/v1/spaces/${space_id}/teams/${team_id}
      body:
        name: "${name}"
    input:
      space_id:
        type: string
        description: The space's id.
      team_id:
        type: string
        description: The team's id.
      name:
        type: string
        description: The team's new name.
    output:
      description: The updated team.
      type: object

  delete_team:
    title: Delete a team
    description: >-
      Delete a team. Its members keep their space access but lose whatever
      permissions the team granted.
    category: members
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v1/spaces/${space_id}/teams/${team_id}
    input:
      space_id:
        type: string
        description: The space's id.
      team_id:
        type: string
        description: The team's id.
    output:
      description: Confirmation that the team was deleted.
      type: object

  list_team_members:
    title: List a team's members
    description: Read who belongs to one team, paginated.
    category: members
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/teams/${team_id}/members
      query:
        pageNo: "${page_no}"
        pageSize: "${page_size}"
    input:
      space_id:
        type: string
        description: The space's id.
      team_id:
        type: string
        description: The team's id.
      page_no:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Members per page.
        optional: true
        minimum: 1
    output:
      description: A page of team members.
      type: object

  get_member:
    title: Get a space member
    description: Read one member of a space -- their name, teams and roles.
    category: members
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/members/${member_id}
    input:
      space_id:
        type: string
        description: The space's id.
      member_id:
        type: string
        description: The member's id.
    output:
      description: The member.
      type: object

  update_member:
    title: Update a space member
    description: >-
      Change a member's display name, teams or roles. `team_ids` and
      `role_ids` replace what they had, so send the complete lists.
    category: members
    request:
      method: PUT
      path: /api/openapi/bika/v1/spaces/${space_id}/members/${member_id}
      body:
        name: "${name}"
        teamIds: "${team_ids}"
        roleIds: "${role_ids}"
    input:
      space_id:
        type: string
        description: The space's id.
      member_id:
        type: string
        description: The member's id.
      name:
        type: string
        description: New display name for the member.
        optional: true
      team_ids:
        type: array
        description: The complete set of team ids the member should belong to.
        optional: true
        items: {type: string}
      role_ids:
        type: array
        description: The complete set of role ids the member should hold.
        optional: true
        items: {type: string}
    output:
      description: The updated member.
      type: object

  remove_member:
    title: Remove a member from a space
    description: >-
      Take someone out of a space. Their user account survives; only their
      access to this space goes.
    category: members
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v1/spaces/${space_id}/members/${member_id}
    input:
      space_id:
        type: string
        description: The space's id.
      member_id:
        type: string
        description: The member's id.
    output:
      description: Confirmation that the member was removed.
      type: object

  list_roles:
    title: List roles
    description: >-
      Read a space's roles with their permission sets. Role ids are what a
      member's `role_ids` holds.
    category: members
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/roles
      query:
        name: "${name}"
        sort: "${sort}"
        direction: "${direction}"
        pageNo: "${page_no}"
        pageSize: "${page_size}"
    input:
      space_id:
        type: string
        description: The space's id.
      name:
        type: string
        description: Only roles whose name matches.
        optional: true
      sort:
        type: string
        description: Field to sort by.
        optional: true
      direction:
        type: string
        description: Sort direction.
        optional: true
      page_no:
        type: integer
        description: Page number.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Roles per page.
        optional: true
        minimum: 1
    output:
      description: A page of roles.
      type: object

  create_role:
    title: Create a role
    description: >-
      Create a role in a space. `manage_space` grants space administration;
      `permissions` lists the finer-grained permissions the role carries.
    category: members
    request:
      method: POST
      path: /api/openapi/bika/v1/spaces/${space_id}/roles
      body:
        name: "${name}"
        manageSpace: "${manage_space}"
        permissions: "${permissions}"
    input:
      space_id:
        type: string
        description: The space's id.
      name:
        type: string
        description: The role's name.
      manage_space:
        type: boolean
        description: Whether the role may administer the space.
        optional: true
      permissions:
        type: array
        description: Permission entries the role grants, as Bika defines them.
        optional: true
        items: {type: object}
    output:
      description: The created role.
      type: object

  update_role:
    title: Update a role
    description: >-
      Change a role's name or permissions. `permissions` replaces the existing
      set, so send it in full.
    category: members
    request:
      method: PUT
      path: /api/openapi/bika/v1/spaces/${space_id}/roles/${role_id}
      body:
        name: "${name}"
        manageSpace: "${manage_space}"
        permissions: "${permissions}"
    input:
      space_id:
        type: string
        description: The space's id.
      role_id:
        type: string
        description: The role's id.
      name:
        type: string
        description: New role name.
        optional: true
      manage_space:
        type: boolean
        description: Whether the role may administer the space.
        optional: true
      permissions:
        type: array
        description: The complete permission set after the update.
        optional: true
        items: {type: object}
    output:
      description: The updated role.
      type: object

  delete_role:
    title: Delete a role
    description: >-
      Delete a role. Members holding it lose the permissions it granted, so
      check who has it first.
    category: members
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v1/spaces/${space_id}/roles/${role_id}
    input:
      space_id:
        type: string
        description: The space's id.
      role_id:
        type: string
        description: The role's id.
    output:
      description: Confirmation that the role was deleted.
      type: object

  # -- sharing and webhooks ------------------------------------------------

  list_embed_links:
    title: List embed links
    description: >-
      Read the space's embed links -- the shareable urls that expose a node
      outside Bika. Worth auditing, since each one is public to whoever has it.
    category: sharing
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/embed-links
    input:
      space_id:
        type: string
        description: The space's id.
    output:
      description: The space's embed links.
      type: object

  create_embed_link:
    title: Create an embed link
    description: >-
      Create a shareable embed link for a node. Anyone with the url can see
      the node's contents, so treat the result as public.
    category: sharing
    request:
      method: POST
      path: /api/openapi/bika/v1/spaces/${space_id}/embed-links
      body:
        objectType: "${object_type}"
        objectId: "${object_id}"
    input:
      space_id:
        type: string
        description: The space's id.
      object_id:
        type: string
        description: The node to expose, by its id.
      object_type:
        type: string
        description: What kind of object is being embedded.
        enum: [NODE_RESOURCE]
    output:
      description: The created embed link, including its url.
      type: object

  delete_embed_link:
    title: Delete an embed link
    description: Revoke an embed link. The url stops working immediately.
    category: sharing
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v1/spaces/${space_id}/embed-links/${embed_link_id}
    input:
      space_id:
        type: string
        description: The space's id.
      embed_link_id:
        type: string
        description: The embed link's id, from list_embed_links.
    output:
      description: Confirmation that the link was revoked.
      type: object

  list_outgoing_webhooks:
    title: List outgoing webhooks
    description: >-
      Read the space's outgoing webhooks -- where Bika pushes events when
      records or automations change.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /api/openapi/bika/v1/spaces/${space_id}/outgoing-webhooks
    input:
      space_id:
        type: string
        description: The space's id.
    output:
      description: The space's outgoing webhooks.
      type: object

  register_outgoing_webhook:
    title: Register an outgoing webhook
    description: >-
      Register an endpoint for Bika's outgoing events. `configuration` holds
      the url and event selection in the shape list_outgoing_webhooks returns,
      so read that first for the exact keys.
    category: webhooks
    request:
      method: POST
      path: /api/openapi/bika/v1/spaces/${space_id}/outgoing-webhooks
      body: "${configuration}"
    input:
      space_id:
        type: string
        description: The space's id.
      configuration:
        type: object
        description: >-
          The webhook definition -- endpoint url and events -- shaped as
          list_outgoing_webhooks returns them.
    output:
      description: The registered webhook.
      type: object

  delete_outgoing_webhook:
    title: Delete an outgoing webhook
    description: >-
      Remove an outgoing webhook. Deliveries stop at once and missed events are
      not replayed.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /api/openapi/bika/v1/spaces/${space_id}/outgoing-webhooks/${webhook_id}
    input:
      space_id:
        type: string
        description: The space's id.
      webhook_id:
        type: string
        description: The webhook's id, from list_outgoing_webhooks.
    output:
      description: Confirmation that the webhook was deleted.
      type: object
