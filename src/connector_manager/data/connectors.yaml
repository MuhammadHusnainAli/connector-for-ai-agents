    headers:
      authorization: Signature keyid="${credentials.username}"
      content-digest: 'sha-256=:${sha256Base64(${bodyCanonicalParams})}:'
      content-type: application/json
      signature: 'sig=:${ed25519Sign("@method": ${method}

        "@target-uri": https://${host}${path}

        "content-digest": sha-256=:${sha256Base64(${bodyCanonicalParams})}:

        "content-type": application/json

        "@signature-params": ("@method" "@target-uri" "content-digest" "content-type");alg="ed25519";created=${now:X};expires=${now+1:minutes:X};keyid="${credentials.username}", ${credentials.password})}:'
      signature-input: sig=("@method" "@target-uri" "content-digest" "content-type");alg="ed25519";created=${now:X};expires=${now+1:minutes:X};keyid="${credentials.username}"
    retry:
      after:
      - retry-after
    verification:
      endpoints:
      - /v0/request-forms
      method: GET
