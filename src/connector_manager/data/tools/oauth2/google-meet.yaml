# Google Meet API tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# Meet's API is about what happened in a meeting, not about running one. There
# is no "start a call" endpoint: `create_space` makes a meeting space with a
# joinable URI, and everything else reads the record afterwards -- the
# conference that took place, who took part, when each of them joined and left,
# and the recordings, transcripts and transcript entries produced.
#
# Two shapes to know: a **space** is the durable meeting room, while a
# **conference record** is one occurrence inside it; and participants,
# recordings and transcripts all hang off the conference record, not the space.
#
# Docs: https://developers.google.com/meet/api/guides/overview

connector_id: google-meet
display_name: Google Meet
docs_url: https://developers.google.com/workspace/meet/api
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  get_conference_record:
    title: Get conference record
    description: Gets a conference record by conference ID.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the conference.
    output:
      description: The ConferenceRecord resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_conference_records:
    title: List conference records
    description: Lists the conference records. By default, ordered by start time and in descending order.
    category: conference_records
    request:
      method: GET
      path: /v2/conferenceRecords
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      filter:
        type: string
        description: 'Optional. User specified filtering condition in EBNF format. The following are the
          filterable fields: * space.meeting_code * space.name * start_time * end_time For example, consider
          the following filters: * space.name = "spaces/NAME" * space.meeting_code = "abc-mnop-xyz" *
          start_time>="2024-01-01T00'
        optional: true
      page_size:
        type: integer
        description: Optional. Maximum number of conference records to return. The service might return
          fewer than this value. If unspecified, at most 25 conference records are returned. The maximum
          value is 100; values above 100 are coerced to 100. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Optional. Page token returned from previous List Call.
        optional: true
    output:
      description: The ListConferenceRecordsResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_participant:
    title: Get participant
    description: Gets a participant by participant ID. Calls conferenceRecords.participants.get on the
      Google Meet API.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the participant.
    output:
      description: The Participant resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_participants:
    title: List participants
    description: Lists the participants in a conference record. By default, ordered by join time and in
      descending order. This API supports fields as standard parameters like every other API. However,
      when the fields request parameter is omitted, this API defaults to 'participants/*, next_page_token'.
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/participants
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}'
      filter:
        type: string
        description: 'Optional. User specified filtering condition in EBNF format. The following are the
          filterable fields: * earliest_start_time * latest_end_time For example, latest_end_time IS NULL
          returns active participants in the conference.'
        optional: true
      page_size:
        type: integer
        description: Maximum number of participants to return. The service might return fewer than this
          value. If unspecified, at most 100 participants are returned. The maximum value is 250; values
          above 250 are coerced to 250. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Page token returned from previous List Call.
        optional: true
    output:
      description: The ListParticipantsResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_participant_session:
    title: Get participant session
    description: Gets a participant session by participant session ID.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the participant.
    output:
      description: The ParticipantSession resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_participant_sessions:
    title: List participant sessions
    description: Lists the participant sessions of a participant in a conference record. By default, ordered
      by join time and in descending order. This API supports fields as standard parameters like every
      other API. However, when the fields request parameter is omitted this API defaults to 'participantsessions/*,
      next_page_token'.
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/participantSessions
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}/participants/{participant}'
      filter:
        type: string
        description: 'Optional. User specified filtering condition in EBNF format. The following are the
          filterable fields: * start_time * end_time For example, end_time IS NULL returns active participant
          sessions in the conference record.'
        optional: true
      page_size:
        type: integer
        description: Optional. Maximum number of participant sessions to return. The service might return
          fewer than this value. If unspecified, at most 100 participants are returned. The maximum value
          is 250; values above 250 are coerced to 250. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Optional. Page token returned from previous List Call.
        optional: true
    output:
      description: The ListParticipantSessionsResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_recording:
    title: Get recording
    description: Gets a recording by recording ID. Calls conferenceRecords.recordings.get on the Google
      Meet API.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the recording.
    output:
      description: The Recording resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_recordings:
    title: List recordings
    description: Lists the recording resources from the conference record. By default, ordered by start
      time and in ascending order.
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/recordings
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}'
      page_size:
        type: integer
        description: Maximum number of recordings to return. The service might return fewer than this
          value. If unspecified, at most 10 recordings are returned. The maximum value is 100; values
          above 100 are coerced to 100. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Page token returned from previous List Call.
        optional: true
    output:
      description: The ListRecordingsResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_smart_note:
    title: Get smart note
    description: Gets smart notes by smart note ID. Calls conferenceRecords.smartNotes.get on the Google
      Meet API.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: 'Required. Resource name of the smart note. Format: conferenceRecords/{conference_record}/smartNotes/{smart_note}'
    output:
      description: The SmartNote resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_smart_notes:
    title: List smart notes
    description: Lists the set of smart notes from the conference record. By default, ordered by start
      time and in ascending order.
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/smartNotes
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}'
      page_size:
        type: integer
        description: Optional. Maximum number of smart notes to return. The service might return fewer
          than this value. If unspecified, at most 10 smart notes are returned. The maximum value is 100;
          values above 100 are coerced to 100. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Optional. Page token returned from previous List Call.
        optional: true
    output:
      description: The ListSmartNotesResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_entry:
    title: Get entry
    description: 'Gets a TranscriptEntry resource by entry ID. Note: The transcript entries returned by
      the Google Meet API might not match the transcription found in the Google Docs transcript file.
      This can occur when 1) we have interleaved speakers within milliseconds, or 2) the Google Docs transcript
      file is modified after generation.'
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the TranscriptEntry.
    output:
      description: The TranscriptEntry resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_entries:
    title: List entries
    description: 'Lists the structured transcript entries per transcript. By default, ordered by start
      time and in ascending order. Note: The transcript entries returned by the Google Meet API might
      not match the transcription found in the Google Docs transcript file. This can occur when 1) we
      have interleaved speakers within milliseconds, or 2) the Google Docs transcript file is modified
      after generation.'
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/entries
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}/transcripts/{transcript}'
      page_size:
        type: integer
        description: Maximum number of entries to return. The service might return fewer than this value.
          If unspecified, at most 10 entries are returned. The maximum value is 100; values above 100
          are coerced to 100. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Page token returned from previous List Call.
        optional: true
    output:
      description: The ListTranscriptEntriesResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  get_transcript:
    title: Get transcript
    description: Gets a transcript by transcript ID. Calls conferenceRecords.transcripts.get on the Google
      Meet API.
    category: conference_records
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: Required. Resource name of the transcript.
    output:
      description: The Transcript resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  list_transcripts:
    title: List transcripts
    description: Lists the set of transcripts from the conference record. By default, ordered by start
      time and in ascending order.
    category: conference_records
    request:
      method: GET
      path: /v2/${parent}/transcripts
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Format: conferenceRecords/{conference_record}'
      page_size:
        type: integer
        description: Maximum number of transcripts to return. The service might return fewer than this
          value. If unspecified, at most 10 transcripts are returned. The maximum value is 100; values
          above 100 are coerced to 100. Maximum might change in the future.
        optional: true
      page_token:
        type: string
        description: Page token returned from previous List Call.
        optional: true
    output:
      description: The ListTranscriptsResponse resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    read_only: true
  create_space:
    title: Create space
    description: Creates a space. Calls spaces.create on the Google Meet API.
    category: spaces
    request:
      method: POST
      path: /v2/spaces
      body:
        activeConference: ${active_conference}
        name: ${name}
        config: ${config}
    input:
      active_conference:
        type: string
        description: Active conference, if it exists.
        optional: true
      name:
        type: string
        description: 'Immutable. Resource name of the space. Format: spaces/{space}. {space} is the resource
          identifier for the space. It''s a unique, server-generated ID and is case sensitive. For example,
          jQCFfuBOdN5z. For more information, see How Meet identifies a meeting space.'
        optional: true
      config:
        type: string
        description: Configuration pertaining to the meeting space.
        optional: true
    output:
      description: The Space resource.
      type: object
    scopes:
    - meetings.space.created
  end_active_conference_space:
    title: End active conference space
    description: Ends an active conference (if there's one). For an example, see End active conference.
    category: spaces
    request:
      method: POST
      path: /v2/${name}:endActiveConference
      body: ${body}
    input:
      name:
        type: string
        description: 'Required. Resource name of the space. Format: spaces/{space}. {space} is the resource
          identifier for the space. It''s a unique, server-generated ID and is case sensitive. For example,
          jQCFfuBOdN5z. For more information, see How Meet identifies a meeting space.'
      body:
        type: object
        description: The EndActiveConferenceRequest resource, as the API's own reference defines it.
    output:
      description: The Empty resource.
      type: object
    scopes:
    - meetings.space.created
  get_space:
    title: Get space
    description: Gets details about a meeting space. For an example, see Get a meeting space.
    category: spaces
    request:
      method: GET
      path: /v2/${name}
    input:
      name:
        type: string
        description: 'Required. Resource name of the space. Format: spaces/{space} or spaces/{meetingCode}.
          {space} is the resource identifier for the space. It''s a unique, server-generated ID and is
          case sensitive. For example, jQCFfuBOdN5z. {meetingCode} is an alias for the space. It''s a
          typeable, unique character stri'
    output:
      description: The Space resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.readonly
    - meetings.space.settings
    read_only: true
  update_space:
    title: Update space
    description: Updates details about a meeting space. For an example, see Update a meeting space.
    category: spaces
    request:
      method: PATCH
      path: /v2/${name}
      query:
        updateMask: ${update_mask}
      body:
        activeConference: ${active_conference}
        name: ${body_name}
        config: ${config}
    input:
      name:
        type: string
        description: 'Immutable. Resource name of the space. Format: spaces/{space}. {space} is the resource
          identifier for the space. It''s a unique, server-generated ID and is case sensitive. For example,
          jQCFfuBOdN5z. For more information, see How Meet identifies a meeting space.'
      update_mask:
        type: string
        description: Optional. Field mask used to specify the fields to be updated in the space. If update_mask
          isn't provided(not set, set with empty paths, or only has "" as paths), it defaults to update
          all fields provided with values in the request. Using "*" as update_mask will update all fields,
          including deleting
        optional: true
      active_conference:
        type: string
        description: Active conference, if it exists.
        optional: true
      body_name:
        type: string
        description: 'Immutable. Resource name of the space. Format: spaces/{space}. {space} is the resource
          identifier for the space. It''s a unique, server-generated ID and is case sensitive. For example,
          jQCFfuBOdN5z. For more information, see How Meet identifies a meeting space.'
        optional: true
      config:
        type: string
        description: Configuration pertaining to the meeting space.
        optional: true
    output:
      description: The Space resource.
      type: object
    scopes_any:
    - meetings.space.created
    - meetings.space.settings
