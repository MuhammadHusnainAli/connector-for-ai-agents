# ActiveCampaign v3 tools.
#
# The connector's base url ends at /api, so every path here starts at /3 --
# ActiveCampaign's own version segment. The API key goes in the Api-Token
# header, which the connector already sets, and there are no scopes: a key can
# do whatever its user can.
#
# Conventions that run through the whole API and therefore through these tools:
#
#   * a write wraps its payload in the resource name -- `{"contact": {...}}`,
#     `{"deal": {...}}` -- which each tool does for you;
#   * lists page with `limit` and `offset`, cap at 100 per page, and return
#     `meta.total`. For contacts, paging deep with `offset` gets slow: sort by
#     `orders[id]=ASC` and walk forward with `id_greater` instead;
#   * filtering is `filters[field]=value` and sorting `orders[field]=ASC|DESC`;
#   * money is in cents (a $456.78 deal is `value: 45678`), and a deal's
#     currency is a lowercased three-letter code;
#   * ids are strings in responses even where they are numbers.
#
# `sync_contact` is usually the right way to write a contact from another
# system: it upserts on email, so it neither duplicates nor 404s. `create_contact`
# fails on an email that already exists.
#
# Covered here: contacts and everything hanging off them, custom fields and
# field groups, deals with their pipelines, stages, tasks, outcomes and custom
# fields, accounts, lists, tags, segments, campaigns and messages, templates,
# automations, notes, forms, webhooks, users and groups, account settings, site
# and event tracking, the e-commerce objects, SMS broadcasts, custom objects,
# scores, addresses, calendar feeds, brandings, personalisation variables and
# saved responses.
#
# Not covered, and reachable through the connector's raw request tools: the
# WhatsApp channel endpoints, the segment match runners, the AI-customisation
# and reseller/child-account endpoints, and anything on a host other than the
# account's own (the event-tracking collector at trackcmp.net, the /api/2
# template share link).
#
# Docs: https://developers.activecampaign.com/reference/overview

connector_id: active-campaign
display_name: ActiveCampaign
docs_url: https://developers.activecampaign.com/reference/overview

tools:

  # -- contacts --------------------------------------------------------------

  list_contacts:
    title: List, search and filter contacts
    description: >-
      Page through contacts, or narrow them by email, list, tag, segment,
      automation, form or creation date. For a full export, sort by
      `orders[id]=ASC` and page with `id_greater` rather than `offset`, which
      the provider warns gets slow on large accounts.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts
      query:
        ids: "${ids}"
        email: "${email}"
        email_like: "${email_like}"
        search: "${search}"
        listid: "${list_id}"
        tagid: "${tag_id}"
        segmentid: "${segment_id}"
        seriesid: "${automation_id}"
        formid: "${form_id}"
        status: "${status}"
        id_greater: "${id_greater}"
        id_less: "${id_less}"
        exclude: "${exclude}"
        "filters[created_after]": "${created_after}"
        "filters[created_before]": "${created_before}"
        "filters[updated_after]": "${updated_after}"
        "filters[updated_before]": "${updated_before}"
        "filters[tagName]": "${tag_name}"
        "orders[id]": "${order_by_id}"
        "orders[cdate]": "${order_by_created}"
        "orders[email]": "${order_by_email}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      ids:
        type: string
        description: Comma-separated contact ids to fetch, e.g. "1,2,3".
        optional: true
      email:
        type: string
        description: Exact email address to look up.
        optional: true
      email_like:
        type: string
        description: Partial email match, e.g. "@example.com".
        optional: true
      search:
        type: string
        description: Free-text search across the contact's name and email.
        optional: true
      list_id:
        type: integer
        description: Only contacts on this list.
        optional: true
      tag_id:
        type: integer
        description: Only contacts carrying this tag id.
        optional: true
      segment_id:
        type: integer
        description: >-
          Only contacts in this segment. When used, page with `offset` and no
          `orders` for best performance.
        optional: true
      automation_id:
        type: integer
        description: Only contacts in this automation (its series id).
        optional: true
      form_id:
        type: integer
        description: Only contacts who submitted this form.
        optional: true
      status:
        type: integer
        description: >-
          Subscription status on `list_id`: 1 active, 2 unsubscribed,
          0 unconfirmed, 3 bounced, 4 held.
        optional: true
      id_greater:
        type: integer
        description: Only contacts with an id above this -- the fast way to page a full export.
        optional: true
      id_less:
        type: integer
        description: Only contacts with an id below this.
        optional: true
      exclude:
        type: integer
        description: Contact id to leave out of the results.
        optional: true
      created_after:
        type: string
        description: Only contacts created after this timestamp.
        optional: true
      created_before:
        type: string
        description: Only contacts created before this timestamp.
        optional: true
      updated_after:
        type: string
        description: Only contacts updated after this timestamp.
        optional: true
      updated_before:
        type: string
        description: Only contacts updated before this timestamp.
        optional: true
      tag_name:
        type: string
        description: Only contacts carrying a tag with this name.
        optional: true
      order_by_id:
        type: string
        description: Sort by id. ASC with `id_greater` is the recommended export order.
        optional: true
        enum: [ASC, DESC]
      order_by_created:
        type: string
        description: Sort by creation date.
        optional: true
        enum: [ASC, DESC]
      order_by_email:
        type: string
        description: Sort by email address.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many contacts to return, up to 100.
        optional: true
        default: 20
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many contacts to skip. Slow on large accounts -- prefer `id_greater`.
        optional: true
        minimum: 0
    output:
      description: The matching contacts, with the total count in meta.
      type: object
      properties:
        contacts: {type: array, description: "Each with id, email, firstName, lastName, phone and timestamps."}
        meta: {type: object, description: "Holds total, and the page's currency and sortable fields."}

  get_contact:
    title: Get a contact
    description: >-
      One contact by id, with the linked collections' URLs. Ask for
      `include_automations` to get the automations they are in alongside,
      instead of a second call.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}
      query:
        automations: "${include_automations}"
    input:
      contact_id:
        type: integer
        description: The contact's id.
      include_automations:
        type: boolean
        description: Include the contact's automations in the response.
        optional: true
    output:
      description: The contact.
      type: object
      properties:
        contact: {type: object, description: "id, email, firstName, lastName, phone, timestamps and links."}
        contactAutomations: {type: array}

  create_contact:
    title: Create a contact
    description: >-
      Create a contact. An email that already exists is rejected, so
      `sync_contact` is the safer choice when writing from another system.
      Tags are given by name and created if new; lists subscribe the contact
      as part of the same call.
    category: contacts
    request:
      method: POST
      path: /3/contacts
      body:
        contact:
          email: "${email}"
          firstName: "${first_name}"
          lastName: "${last_name}"
          phone: "${phone}"
          fieldValues: "${field_values}"
          tags: "${tags}"
          lists: "${lists}"
          allowNullEmail: "${allow_null_email}"
    input:
      email:
        type: string
        description: >-
          The contact's email address. Required unless the account has
          phone-only contacts enabled and `allow_null_email` is set.
        format: email
        example: ada@example.com
      first_name:
        type: string
        description: The contact's first name.
        optional: true
      last_name:
        type: string
        description: The contact's last name.
        optional: true
      phone:
        type: string
        description: The contact's phone number.
        optional: true
      field_values:
        type: array
        description: >-
          Custom field values, each with the field id and the value. Multi-select
          values go in as ||one||two||.
        optional: true
        items:
          type: object
          properties:
            field: {type: string}
            value: {type: string}
      tags:
        type: array
        description: Tag names to attach. A name that does not exist yet is created.
        optional: true
        items: {type: string}
      lists:
        type: array
        description: Lists to subscribe the contact to, each with the list id.
        optional: true
        items:
          type: object
          properties:
            list: {type: integer}
      allow_null_email:
        type: boolean
        description: Permit a contact with no email, for phone-only accounts.
        optional: true
    output:
      description: The contact that was created.
      type: object
      properties:
        contact: {type: object, description: "The new contact, including its id."}
        fieldValues: {type: array}

  update_contact:
    title: Update a contact
    description: >-
      Change a contact by id. Omitted fields are left alone; `field_values`,
      `tags` and `lists` behave as they do on create, so tags named here are
      added rather than replacing the contact's existing ones.
    category: contacts
    request:
      method: PUT
      path: /3/contacts/${contact_id}
      body:
        contact:
          email: "${email}"
          firstName: "${first_name}"
          lastName: "${last_name}"
          phone: "${phone}"
          fieldValues: "${field_values}"
          tags: "${tags}"
          lists: "${lists}"
    input:
      contact_id:
        type: integer
        description: The contact's id.
      email:
        type: string
        description: New email address.
        optional: true
        format: email
      first_name:
        type: string
        description: New first name.
        optional: true
      last_name:
        type: string
        description: New last name.
        optional: true
      phone:
        type: string
        description: New phone number.
        optional: true
      field_values:
        type: array
        description: Custom field values to set, each with the field id and value.
        optional: true
        items:
          type: object
          properties:
            field: {type: string}
            value: {type: string}
      tags:
        type: array
        description: Tag names to attach to the contact.
        optional: true
        items: {type: string}
      lists:
        type: array
        description: Lists to subscribe the contact to, each with the list id.
        optional: true
        items:
          type: object
          properties:
            list: {type: integer}
    output:
      description: The updated contact.
      type: object
      properties:
        contact: {type: object}
        fieldValues: {type: array}

  delete_contact:
    title: Delete a contact
    description: >-
      Delete a contact and their history in the account. Not reversible, and
      not the same as unsubscribing -- to stop mailing someone while keeping
      the record, set their list status with `update_list_status_for_contact`.
    category: contacts
    destructive: true
    request:
      method: DELETE
      path: /3/contacts/${contact_id}
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: Empty on success.
      type: object

  sync_contact:
    title: Create or update a contact by email
    description: >-
      Upsert one contact: ActiveCampaign looks for an existing contact and
      updates it, or creates it when nothing matches. The lookup is by email
      unless `lookup_by_ac_id` is set, in which case the contact id is tried
      first. This is the endpoint to use for a recurring sync from another
      system -- it neither duplicates nor fails on an unknown contact.
    category: contacts
    request:
      method: POST
      path: /3/contact/sync
      query:
        lookupByAcId: "${lookup_by_ac_id}"
      body:
        contact:
          id: "${contact_id}"
          email: "${email}"
          firstName: "${first_name}"
          lastName: "${last_name}"
          phone: "${phone}"
          fieldValues: "${field_values}"
          tags: "${tags}"
          lists: "${lists}"
        source: "${source}"
    input:
      email:
        type: string
        description: Email address the contact is matched on, and created with when new.
        format: email
        example: ada@example.com
      first_name:
        type: string
        description: The contact's first name.
        optional: true
      last_name:
        type: string
        description: The contact's last name.
        optional: true
      phone:
        type: string
        description: The contact's phone number.
        optional: true
      field_values:
        type: array
        description: Custom field values, each with the field id and value.
        optional: true
        items:
          type: object
          properties:
            field: {type: string}
            value: {type: string}
      tags:
        type: array
        description: Tag names to attach. Unknown names are created.
        optional: true
        items: {type: string}
      lists:
        type: array
        description: Lists to subscribe the contact to, each with the list id.
        optional: true
        items:
          type: object
          properties:
            list: {type: integer}
      contact_id:
        type: integer
        description: Contact id to match on. Only used when `lookup_by_ac_id` is true.
        optional: true
      lookup_by_ac_id:
        type: boolean
        description: Try the contact id before the email when matching.
        optional: true
      source:
        type: string
        description: A label for the system this write came from, carried into the contact's history.
        optional: true
    output:
      description: The contact that was created or updated.
      type: object
      properties:
        contact: {type: object}
        fieldValues: {type: array}

  bulk_sync_contacts:
    title: Bulk create or update contacts
    description: >-
      Upsert up to 250 contacts in one call, matched on email. A row without an
      email is skipped rather than failing the batch. For a large one-off load
      with tags, lists and a completion callback, `bulk_import_contacts` is the
      richer endpoint.
    category: contacts
    request:
      method: POST
      path: /3/contact/bulkSync
      body:
        contacts: "${contacts}"
    input:
      contacts:
        type: array
        description: >-
          The contacts to upsert, at most 250. Each needs an email, and may
          carry first_name, last_name, phone and a `fields` list of
          {field, value} pairs.
        items:
          type: object
          properties:
            email: {type: string}
            first_name: {type: string}
            last_name: {type: string}
            phone: {type: string}
            fields: {type: array}
    output:
      description: The result of the batch.
      type: object
      properties:
        success: {type: integer}
        failure_indices: {type: array}

  merge_contacts:
    title: Merge two contacts
    description: >-
      Merge one contact into another. The source contact is deleted when the
      merge completes, so it is not reversible. Where both hold a value, the
      resolution ids decide which contact's field values and automation
      memberships win -- each must be the source or the destination.
    category: contacts
    destructive: true
    request:
      method: POST
      path: /3/contact/merge
      body:
        source: "${source_contact_id}"
        destination: "${destination_contact_id}"
        resolutionFieldId: "${resolution_field_contact_id}"
        resolutionAutomationId: "${resolution_automation_contact_id}"
    input:
      source_contact_id:
        type: integer
        description: Contact to merge in. This one is deleted afterwards.
      destination_contact_id:
        type: integer
        description: Contact that survives the merge.
      resolution_field_contact_id:
        type: integer
        description: >-
          Which contact's field values win on conflict. Must be the source or
          the destination.
        optional: true
      resolution_automation_contact_id:
        type: integer
        description: >-
          Which contact's automation memberships win on conflict. Must be the
          source or the destination.
        optional: true
    output:
      description: The merged contact.
      type: object
      properties:
        contact: {type: object}

  bulk_import_contacts:
    title: Bulk import contacts
    description: >-
      Import up to 250 contacts with their tags, custom fields and list
      subscriptions, optionally calling a URL of yours when the import
      finishes. Contacts who previously unsubscribed from a list are not
      re-subscribed. The response carries a batch id -- `get_bulk_import_status`
      reports on it.
    category: contacts
    request:
      method: POST
      path: /3/import/bulk_import
      body:
        contacts: "${contacts}"
        callback: "${callback}"
    input:
      contacts:
        type: array
        description: >-
          The contacts to import, at most 250. Each needs an email and may
          carry first_name, last_name, phone, customer_acct_name, a `tags`
          array of names, a `fields` array of {id, value}, and `subscribe` /
          `unsubscribe` arrays of {listid}.
        items:
          type: object
          properties:
            email: {type: string}
            first_name: {type: string}
            last_name: {type: string}
            phone: {type: string}
            customer_acct_name: {type: string}
            tags: {type: array}
            fields: {type: array}
            subscribe: {type: array}
            unsubscribe: {type: array}
      callback:
        type: object
        description: >-
          Where to notify when the import completes: url, requestType (GET or
          POST), detailed_results, and any params or headers to include.
        optional: true
    output:
      description: The import that was queued.
      type: object
      properties:
        Success: {type: integer}
        queued_contacts: {type: integer}
        batchId: {type: string, description: "Pass this to get_bulk_import_status."}

  list_bulk_imports:
    title: List bulk imports
    description: >-
      The account's recent bulk imports and their status -- how to find the
      batch id of an import when it was not recorded at the time.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/import/bulk_import
    input: {}
    output:
      description: The recent bulk imports.
      type: object
      properties:
        imports: {type: array}

  get_bulk_import_status:
    title: Get a bulk import's status
    description: >-
      Progress and outcome of one bulk import, including how many contacts
      succeeded and failed. Poll this rather than assuming an accepted import
      finished cleanly.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/import/info
      query:
        batchId: "${batch_id}"
    input:
      batch_id:
        type: string
        description: The batch id returned when the import was queued.
    output:
      description: The import's status.
      type: object
      properties:
        success: {type: integer}
        failure: {type: integer}
        status: {type: string}

  list_contact_activities:
    title: List a contact's activities
    description: >-
      What a contact has done -- opens, clicks, page visits and other tracked
      events, newest first. `after` and the `include` expansions keep the
      response to what you actually need.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/activities
      query:
        contact: "${contact_id}"
        after: "${after}"
        include: "${include}"
        emails: "${emails}"
        "orders[tstamp]": "${order_by_timestamp}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      contact_id:
        type: integer
        description: The contact whose activity to read.
      after:
        type: string
        description: Only activity after this timestamp.
        optional: true
      include:
        type: string
        description: Related records to expand, e.g. "campaign,message".
        optional: true
      emails:
        type: string
        description: Restrict to activity on these email ids.
        optional: true
      order_by_timestamp:
        type: string
        description: Sort by when the activity happened.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many activities to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many activities to skip.
        optional: true
        minimum: 0
    output:
      description: The contact's activities.
      type: object
      properties:
        activities: {type: array}
        meta: {type: object}

  get_contact_field_values:
    title: Get a contact's field values
    description: >-
      The custom field values stored on one contact, each with the field id it
      belongs to -- what you need before updating one, since values are written
      by field id.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/fieldValues
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's custom field values.
      type: object
      properties:
        fieldValues: {type: array}

  get_contact_lists:
    title: Get a contact's list memberships
    description: >-
      Which lists a contact is on and with what status -- active, unsubscribed,
      bounced or held -- plus when each subscription changed.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/contactLists
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's list memberships.
      type: object
      properties:
        contactLists: {type: array}

  get_contact_automations:
    title: Get the automations a contact is in
    description: >-
      Which automations a contact is currently in or has run through, with the
      block they are sitting at and when they entered.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/contactAutomations
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      contact_id:
        type: integer
        description: The contact's id.
      limit:
        type: integer
        description: How many to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: The contact's automation memberships.
      type: object
      properties:
        contactAutomations: {type: array}

  get_contact_deals:
    title: Get a contact's deals
    description: >-
      The deals where this contact is the primary contact, with their stage,
      value and owner.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/deals
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's deals.
      type: object
      properties:
        deals: {type: array}

  get_contact_notes:
    title: Get a contact's notes
    description: The notes recorded against one contact, newest first, with their authors.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/notes
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's notes.
      type: object
      properties:
        notes: {type: array}

  get_contact_logs:
    title: Get a contact's message logs
    description: >-
      The campaign and automation messages sent to one contact, with what
      happened to each -- the record to check when someone asks what they were
      sent.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/contactLogs
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's message logs.
      type: object
      properties:
        contactLogs: {type: array}

  get_contact_bounce_logs:
    title: Get a contact's bounce logs
    description: >-
      Why mail to this contact bounced and when, including the provider's own
      message -- the first thing to read before deciding whether an address is
      dead.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/bounceLogs
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's bounce logs.
      type: object
      properties:
        bounceLogs: {type: array}

  get_contact_goals:
    title: Get a contact's goal completions
    description: Which automation goals this contact has reached, and when.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/contactGoals
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's goal completions.
      type: object
      properties:
        contactGoals: {type: array}

  get_contact_data:
    title: Get a contact's engagement data
    description: >-
      Aggregate engagement figures for one contact -- how much has been sent,
      opened and clicked, and their geographic and social data where known.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/contactData
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's engagement data.
      type: object
      properties:
        contactData: {type: object}

  get_contact_geo_ips:
    title: Get a contact's geo-IPs
    description: >-
      The IP addresses seen for one contact and the locations inferred from
      them, which is where a contact's geography in reports comes from.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/geoIps
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's geo-IP records.
      type: object
      properties:
        geoIps: {type: array}

  get_geo_address:
    title: Get a geo-IP's address
    description: >-
      The location behind one geo-IP record -- city, region and country --
      resolved from the id returned by `get_contact_geo_ips`.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/geoIps/${geo_address_id}/geoAddress
    input:
      geo_address_id:
        type: integer
        description: The geo-IP record's id.
    output:
      description: The geographic address.
      type: object
      properties:
        geoAddress: {type: object}

  get_contact_score_values:
    title: Get a contact's scores
    description: >-
      The contact's value for each lead or engagement score the account
      defines. `list_scores` explains what the scores mean.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/scoreValues
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's score values.
      type: object
      properties:
        scoreValues: {type: array}

  get_contact_account_associations:
    title: Get a contact's account links
    description: >-
      Which CRM accounts a contact belongs to and with what job title -- the
      replacement for the deprecated contact-organisation link.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/accountContacts
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's account associations.
      type: object
      properties:
        accountContacts: {type: array}

  get_contact_automation_entry_counts:
    title: Get a contact's automation entry counts
    description: >-
      How many times this contact has entered each automation -- how you tell a
      one-off entry from a contact looping through a re-entrant automation.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/automationEntryCounts
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's automation entry counts.
      type: object
      properties:
        automationEntryCounts: {type: array}

  get_contact_tracking_logs:
    title: Get a contact's site tracking events
    description: >-
      The site and event tracking hits recorded for one contact, which is what
      automations triggered by behaviour react to.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/contacts/${contact_id}/trackingLogs
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact's tracking events.
      type: object
      properties:
        trackingLogs: {type: array}

  get_contact_by_tracking_event:
    title: Get the contact behind a tracking event
    description: >-
      Resolve one tracking event id back to the contact it belongs to -- the
      reverse lookup when all you have is an event from a webhook.
    category: contacts
    read_only: true
    request:
      method: GET
      path: /3/trackingLogs/${event_id}/contact
    input:
      event_id:
        type: integer
        description: The tracking event's id.
    output:
      description: The contact the event belongs to.
      type: object
      properties:
        contact: {type: object}

  add_tag_to_contact:
    title: Add a tag to a contact
    description: >-
      Attach an existing tag to a contact by id. The association that comes
      back has its own id, which is what `remove_tag_from_contact` takes --
      removing a tag is done by association id, not by tag id.
    category: tags
    request:
      method: POST
      path: /3/contactTags
      body:
        contactTag:
          contact: "${contact_id}"
          tag: "${tag_id}"
    input:
      contact_id:
        type: integer
        description: The contact to tag.
      tag_id:
        type: integer
        description: The tag to attach. `list_tags` gives the ids.
    output:
      description: The contact-tag association that was created.
      type: object
      properties:
        contactTag: {type: object, description: "Its id is what removing the tag takes."}

  remove_tag_from_contact:
    title: Remove a tag from a contact
    description: >-
      Detach a tag from a contact. Takes the contact-tag association's id --
      the one returned when the tag was added -- rather than the tag id.
    category: tags
    destructive: true
    request:
      method: DELETE
      path: /3/contactTags/${contact_tag_id}
    input:
      contact_tag_id:
        type: integer
        description: Id of the contact-tag association to remove.
    output:
      description: Empty on success.
      type: object

  update_list_status_for_contact:
    title: Subscribe or unsubscribe a contact
    description: >-
      Set a contact's status on one list: "1" subscribes, "2" unsubscribes.
      Re-subscribing someone who unsubscribed themselves needs `source_id` 4,
      and doing so against their wishes is what gets an account into trouble --
      the provider flags it for that reason.
    category: lists
    request:
      method: POST
      path: /3/contactLists
      body:
        contactList:
          list: "${list_id}"
          contact: "${contact_id}"
          status: "${status}"
          sourceid: "${source_id}"
    input:
      list_id:
        type: string
        description: The list to change membership on.
      contact_id:
        type: string
        description: The contact whose membership changes.
      status:
        type: string
        description: '"1" to subscribe, "2" to unsubscribe.'
        enum: ["1", "2"]
      source_id:
        type: integer
        description: Set to 4 when re-subscribing a contact who had unsubscribed.
        optional: true
    output:
      description: The membership after the change.
      type: object
      properties:
        contactList: {type: object}
        contacts: {type: array}

  # -- tags ------------------------------------------------------------------

  list_tags:
    title: List tags
    description: >-
      The account's tags with their types and descriptions. `search` matches
      the tag name; the ids are what tagging a contact takes.
    category: tags
    read_only: true
    request:
      method: GET
      path: /3/tags
      query:
        search: "${search}"
        "orders[search]": "${order_by_name}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      search:
        type: string
        description: Match tags whose name contains this text.
        optional: true
      order_by_name:
        type: string
        description: Sort by tag name.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many tags to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many tags to skip.
        optional: true
        minimum: 0
    output:
      description: The account's tags.
      type: object
      properties:
        tags: {type: array}
        meta: {type: object}

  get_tag:
    title: Get a tag
    description: One tag by id, with its name, type and description.
    category: tags
    read_only: true
    request:
      method: GET
      path: /3/tags/${tag_id}
    input:
      tag_id:
        type: integer
        description: The tag's id.
    output:
      description: The tag.
      type: object
      properties:
        tag: {type: object}

  create_tag:
    title: Create a tag
    description: >-
      Create a tag. `tag_type` decides what it can be attached to -- "contact"
      for contacts, "template" for templates.
    category: tags
    request:
      method: POST
      path: /3/tags
      body:
        tag:
          tag: "${name}"
          tagType: "${tag_type}"
          description: "${description}"
    input:
      name:
        type: string
        description: Name of the tag.
        example: newsletter
      tag_type:
        type: string
        description: What the tag applies to.
        optional: true
        default: contact
        enum: [contact, template]
      description:
        type: string
        description: What the tag is for, shown in the UI.
        optional: true
    output:
      description: The tag that was created.
      type: object
      properties:
        tag: {type: object}

  update_tag:
    title: Update a tag
    description: >-
      Rename a tag or change its description. Renaming affects every contact
      carrying it, since contacts reference the tag rather than a copy of its
      name.
    category: tags
    request:
      method: PUT
      path: /3/tags/${tag_id}
      body:
        tag:
          tag: "${name}"
          tagType: "${tag_type}"
          description: "${description}"
    input:
      tag_id:
        type: integer
        description: The tag's id.
      name:
        type: string
        description: New name for the tag.
        optional: true
      tag_type:
        type: string
        description: What the tag applies to.
        optional: true
        enum: [contact, template]
      description:
        type: string
        description: New description.
        optional: true
    output:
      description: The updated tag.
      type: object
      properties:
        tag: {type: object}

  delete_tag:
    title: Delete a tag
    description: >-
      Delete a tag and remove it from every contact that carries it.
      Automations and segments that key on the tag stop matching, so check what
      uses it first.
    category: tags
    destructive: true
    request:
      method: DELETE
      path: /3/tags/${tag_id}
    input:
      tag_id:
        type: integer
        description: The tag's id.
    output:
      description: Empty on success.
      type: object

  # -- lists -----------------------------------------------------------------

  list_lists:
    title: List mailing lists
    description: >-
      The account's lists, with their names, sender details and subscriber
      counts. The ids are what subscribing a contact and sending a campaign
      both take.
    category: lists
    read_only: true
    request:
      method: GET
      path: /3/lists
      query:
        "filters[name]": "${name}"
        "orders[name]": "${order_by_name}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only lists whose name matches this.
        optional: true
      order_by_name:
        type: string
        description: Sort by list name.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many lists to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many lists to skip.
        optional: true
        minimum: 0
    output:
      description: The account's lists.
      type: object
      properties:
        lists: {type: array}
        meta: {type: object}

  get_list:
    title: Get a mailing list
    description: >-
      One list by id, with its sender address block, opt-in settings and
      subscriber counts.
    category: lists
    read_only: true
    request:
      method: GET
      path: /3/lists/${list_id}
    input:
      list_id:
        type: integer
        description: The list's id.
    output:
      description: The list.
      type: object
      properties:
        list: {type: object}

  create_list:
    title: Create a mailing list
    description: >-
      Create a list. ActiveCampaign requires the compliance fields: a URL-safe
      `string_id`, the website the list is for, and a reminder telling contacts
      why they are hearing from you, which appears in the footer of campaigns.
    category: lists
    request:
      method: POST
      path: /3/lists
      body:
        list:
          name: "${name}"
          stringid: "${string_id}"
          sender_url: "${sender_url}"
          sender_reminder: "${sender_reminder}"
          send_last_broadcast: "${send_last_broadcast}"
          carboncopy: "${carbon_copy}"
          subscription_notify: "${subscription_notify}"
          unsubscription_notify: "${unsubscription_notify}"
          user: "${owner_user_id}"
          channel: "${channel}"
          sender_name: "${sender_name}"
          sender_addr1: "${sender_address_1}"
          sender_addr2: "${sender_address_2}"
          sender_city: "${sender_city}"
          sender_state: "${sender_state}"
          sender_zip: "${sender_zip}"
          sender_country: "${sender_country}"
          sender_phone: "${sender_phone}"
    input:
      name:
        type: string
        description: Name of the list.
        example: Product newsletter
      string_id:
        type: string
        description: URL-safe version of the name, e.g. product-newsletter.
        example: product-newsletter
      sender_url:
        type: string
        description: The website this list is for.
        example: https://example.com
      sender_reminder:
        type: string
        description: >-
          Reminder to contacts of why they are on this list. Shown in campaign
          footers.
        example: You signed up for product updates at example.com.
      send_last_broadcast:
        type: boolean
        description: Send the most recent campaign to each new subscriber on joining.
        optional: true
      carbon_copy:
        type: string
        description: Comma-separated addresses to copy on every mailing to this list.
        optional: true
      subscription_notify:
        type: string
        description: Comma-separated addresses to notify when someone subscribes.
        optional: true
      unsubscription_notify:
        type: string
        description: Comma-separated addresses to notify when someone unsubscribes.
        optional: true
      owner_user_id:
        type: integer
        description: User id of the list owner, who controls its campaign branding.
        optional: true
      channel:
        type: string
        description: Whether this is an email or SMS list.
        optional: true
        default: email
        enum: [email, sms]
      sender_name:
        type: string
        description: Sender name in the postal address block of campaigns.
        optional: true
      sender_address_1:
        type: string
        description: First line of the sender's postal address.
        optional: true
      sender_address_2:
        type: string
        description: Second line of the sender's postal address.
        optional: true
      sender_city:
        type: string
        description: City of the sender's postal address.
        optional: true
      sender_state:
        type: string
        description: State or province of the sender's postal address.
        optional: true
      sender_zip:
        type: string
        description: Postal code of the sender's postal address.
        optional: true
      sender_country:
        type: string
        description: >-
          Country of the sender's postal address, as a two-letter code or a
          name. Determines how the address block is formatted.
        optional: true
      sender_phone:
        type: string
        description: Phone number shown with the sender's postal address.
        optional: true
    output:
      description: The list that was created.
      type: object
      properties:
        list: {type: object}

  update_list:
    title: Update a mailing list
    description: >-
      Change a list's name, sender details or notification addresses. Only the
      fields you send change.
    category: lists
    request:
      method: PUT
      path: /3/lists/${list_id}
      body:
        list:
          name: "${name}"
          stringid: "${string_id}"
          sender_url: "${sender_url}"
          sender_reminder: "${sender_reminder}"
          send_last_broadcast: "${send_last_broadcast}"
          carboncopy: "${carbon_copy}"
          subscription_notify: "${subscription_notify}"
          unsubscription_notify: "${unsubscription_notify}"
          user: "${owner_user_id}"
          sender_name: "${sender_name}"
          sender_addr1: "${sender_address_1}"
          sender_city: "${sender_city}"
          sender_state: "${sender_state}"
          sender_zip: "${sender_zip}"
          sender_country: "${sender_country}"
          sender_phone: "${sender_phone}"
    input:
      list_id:
        type: integer
        description: The list's id.
      name:
        type: string
        description: New name for the list.
        optional: true
      string_id:
        type: string
        description: New URL-safe name.
        optional: true
      sender_url:
        type: string
        description: New website URL for the list.
        optional: true
      sender_reminder:
        type: string
        description: New reminder text shown in campaign footers.
        optional: true
      send_last_broadcast:
        type: boolean
        description: Send the most recent campaign to new subscribers.
        optional: true
      carbon_copy:
        type: string
        description: Comma-separated addresses to copy on mailings.
        optional: true
      subscription_notify:
        type: string
        description: Comma-separated addresses to notify on subscribe.
        optional: true
      unsubscription_notify:
        type: string
        description: Comma-separated addresses to notify on unsubscribe.
        optional: true
      owner_user_id:
        type: integer
        description: User id of the list owner.
        optional: true
      sender_name:
        type: string
        description: Sender name in the postal address block.
        optional: true
      sender_address_1:
        type: string
        description: First line of the sender's postal address.
        optional: true
      sender_city:
        type: string
        description: City of the sender's postal address.
        optional: true
      sender_state:
        type: string
        description: State or province of the sender's postal address.
        optional: true
      sender_zip:
        type: string
        description: Postal code of the sender's postal address.
        optional: true
      sender_country:
        type: string
        description: Country of the sender's postal address.
        optional: true
      sender_phone:
        type: string
        description: Phone number shown with the postal address.
        optional: true
    output:
      description: The updated list.
      type: object
      properties:
        list: {type: object}

  delete_list:
    title: Delete a mailing list
    description: >-
      Delete a list. The contacts themselves stay in the account; what goes is
      the list and its subscriptions, and campaigns targeting it lose their
      audience.
    category: lists
    destructive: true
    request:
      method: DELETE
      path: /3/lists/${list_id}
    input:
      list_id:
        type: integer
        description: The list's id.
    output:
      description: Empty on success.
      type: object

  bulk_delete_list_contacts:
    title: Delete a list's contacts in batches
    description: >-
      Delete contacts belonging to one list, `limit` at a time -- the batched
      way to clear a list without walking it contact by contact. This deletes
      the contacts, not just their subscription.
    category: lists
    destructive: true
    request:
      method: DELETE
      path: /3/lists/${list_id}/bulk_delete
      query:
        limit: "${limit}"
    input:
      list_id:
        type: integer
        description: The list whose contacts to delete.
      limit:
        type: integer
        description: How many contacts to delete in this batch.
        minimum: 1
    output:
      description: How many contacts were deleted.
      type: object
      properties:
        deleted: {type: integer}

  # -- contact custom fields -------------------------------------------------

  list_fields:
    title: List contact custom fields
    description: >-
      The custom fields defined for contacts, with their types, personalisation
      tags and options. The ids here are what every field value write uses.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/fields
      query:
        limit: "${limit}"
        offset: "${offset}"
        "filters[perstag]": "${perstag}"
    input:
      limit:
        type: integer
        description: How many fields to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many fields to skip.
        optional: true
        minimum: 0
      perstag:
        type: string
        description: Only the field with this personalisation tag, e.g. %JOB_TITLE%.
        optional: true
    output:
      description: The contact custom fields.
      type: object
      properties:
        fields: {type: array}
        fieldOptions: {type: array}
        meta: {type: object}

  get_field:
    title: Get a contact custom field
    description: >-
      One custom field by id, with its type, default value, personalisation tag
      and any options it offers.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/fields/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: The custom field.
      type: object
      properties:
        field: {type: object}

  create_field:
    title: Create a contact custom field
    description: >-
      Define a custom field for contacts. The type decides what values it
      accepts -- and for dropdown, listbox, radio and checkbox you then add the
      choices with `create_field_options`. A new field is not on any list until
      `create_field_relationship` puts it there.
    category: fields
    request:
      method: POST
      path: /3/fields
      body:
        field:
          title: "${title}"
          type: "${type}"
          descript: "${description}"
          perstag: "${perstag}"
          defval: "${default_value}"
          visible: "${visible}"
          ordernum: "${order}"
    input:
      title:
        type: string
        description: Label for the field, shown in the UI.
        example: Job title
      type:
        type: string
        description: What kind of field this is.
        enum: [text, textarea, date, datetime, dropdown, listbox, radio, checkbox, hidden]
      description:
        type: string
        description: Help text for the field.
        optional: true
      perstag:
        type: string
        description: >-
          Personalisation tag used in messages, e.g. JOB_TITLE. Generated from
          the title when omitted.
        optional: true
      default_value:
        type: string
        description: Value the field starts with.
        optional: true
      visible:
        type: boolean
        description: Whether the field is offered in the form builder.
        optional: true
      order:
        type: integer
        description: Where the field appears in the My Fields tab.
        optional: true
    output:
      description: The field that was created.
      type: object
      properties:
        field: {type: object}

  update_field:
    title: Update a contact custom field
    description: >-
      Change a custom field's label, help text, default or visibility. Changing
      the type of a field that already holds data is not something to do
      casually -- existing values are interpreted by the new type.
    category: fields
    request:
      method: PUT
      path: /3/fields/${field_id}
      body:
        field:
          title: "${title}"
          type: "${type}"
          descript: "${description}"
          perstag: "${perstag}"
          defval: "${default_value}"
          visible: "${visible}"
          ordernum: "${order}"
    input:
      field_id:
        type: integer
        description: The field's id.
      title:
        type: string
        description: New label for the field.
        optional: true
      type:
        type: string
        description: New field type.
        optional: true
        enum: [text, textarea, date, datetime, dropdown, listbox, radio, checkbox, hidden]
      description:
        type: string
        description: New help text.
        optional: true
      perstag:
        type: string
        description: New personalisation tag.
        optional: true
      default_value:
        type: string
        description: New default value.
        optional: true
      visible:
        type: boolean
        description: Whether the field is offered in the form builder.
        optional: true
      order:
        type: integer
        description: Where the field appears in the My Fields tab.
        optional: true
    output:
      description: The updated field.
      type: object
      properties:
        field: {type: object}

  delete_field:
    title: Delete a contact custom field
    description: >-
      Delete a custom field and every value contacts hold for it. Messages and
      segments referring to its personalisation tag stop resolving.
    category: fields
    destructive: true
    request:
      method: DELETE
      path: /3/fields/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: Empty on success.
      type: object

  create_field_options:
    title: Add options to a custom field
    description: >-
      Add the selectable choices to a dropdown, listbox, radio or checkbox
      field. Several can be created in one call, which is how a field is made
      usable straight after `create_field`.
    category: fields
    request:
      method: POST
      path: /3/fieldOption/bulk
      body:
        fieldOptions: "${field_options}"
    input:
      field_options:
        type: array
        description: >-
          The options to create, each with the field id, the stored `value` and
          the displayed `label`.
        items:
          type: object
          properties:
            field: {type: integer}
            label: {type: string}
            value: {type: string}
            orderid: {type: integer}
    output:
      description: The options that were created.
      type: object
      properties:
        fieldOptions: {type: array}

  create_field_relationship:
    title: Attach a custom field to lists
    description: >-
      Make a custom field available on one or more lists -- or on all of them
      with list id 0. A field with no relationship exists but appears nowhere,
      which is the usual reason a newly created field seems missing.
    category: fields
    request:
      method: POST
      path: /3/fieldRels
      body:
        fieldRel:
          field: "${field_id}"
          relid: "${list_id}"
    input:
      field_id:
        type: integer
        description: The custom field to attach.
      list_id:
        type: integer
        description: The list to attach it to. 0 means every list.
    output:
      description: The relationship that was created.
      type: object
      properties:
        fieldRel: {type: object}

  delete_field_relationship:
    title: Detach a custom field from a list
    description: >-
      Remove a field's relationship to a list, hiding it there. The field and
      its values survive.
    category: fields
    destructive: true
    request:
      method: DELETE
      path: /3/fieldRels/${field_rel_id}
    input:
      field_rel_id:
        type: integer
        description: The field-list relationship's id.
    output:
      description: Empty on success.
      type: object

  list_field_values:
    title: List contact field values
    description: >-
      Custom field values across contacts, filtered by field id or by value --
      how you find every contact holding a particular value without walking
      contacts.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/fieldValues
      query:
        "filters[fieldid]": "${field_id}"
        "filters[val]": "${value}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      field_id:
        type: integer
        description: Only values of this custom field.
        optional: true
      value:
        type: string
        description: Only values matching this text.
        optional: true
      limit:
        type: integer
        description: How many values to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many values to skip.
        optional: true
        minimum: 0
    output:
      description: The matching field values.
      type: object
      properties:
        fieldValues: {type: array}
        meta: {type: object}

  get_field_value:
    title: Get a contact field value
    description: One stored custom field value by id, with the contact and field it belongs to.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/fieldValues/${field_value_id}
    input:
      field_value_id:
        type: integer
        description: The field value's id.
    output:
      description: The field value.
      type: object
      properties:
        fieldValue: {type: object}

  create_field_value:
    title: Set a contact's field value
    description: >-
      Store a custom field value for a contact. Multi-select values go in as
      ||one||two||. `use_defaults` fills the contact's other required fields
      with their defaults, which is what stops a write failing on an unrelated
      required field.
    category: fields
    request:
      method: POST
      path: /3/fieldValues
      body:
        fieldValue:
          contact: "${contact_id}"
          field: "${field_id}"
          value: "${value}"
        useDefaults: "${use_defaults}"
    input:
      contact_id:
        type: string
        description: The contact whose value to set.
      field_id:
        type: string
        description: The custom field being set.
      value:
        type: string
        description: The value. Multi-select fields take ||one||two||.
      use_defaults:
        type: boolean
        description: Fill the contact's other required fields with their defaults.
        optional: true
    output:
      description: The field value that was stored.
      type: object
      properties:
        fieldValue: {type: object}

  update_field_value:
    title: Update a contact's field value
    description: >-
      Change a stored field value by its own id. Use `create_field_value` when
      the contact has no value for the field yet.
    category: fields
    request:
      method: PUT
      path: /3/fieldValues/${field_value_id}
      body:
        fieldValue:
          contact: "${contact_id}"
          field: "${field_id}"
          value: "${value}"
        useDefaults: "${use_defaults}"
    input:
      field_value_id:
        type: integer
        description: The field value's id.
      contact_id:
        type: string
        description: The contact the value belongs to.
      field_id:
        type: string
        description: The custom field being set.
      value:
        type: string
        description: The new value. Multi-select fields take ||one||two||.
      use_defaults:
        type: boolean
        description: Fill the contact's other required fields with their defaults.
        optional: true
    output:
      description: The updated field value.
      type: object
      properties:
        fieldValue: {type: object}

  delete_field_value:
    title: Delete a contact's field value
    description: >-
      Clear one stored custom field value. The field definition stays; only
      this contact's value goes.
    category: fields
    destructive: true
    request:
      method: DELETE
      path: /3/fieldValues/${field_value_id}
    input:
      field_value_id:
        type: integer
        description: The field value's id.
    output:
      description: Empty on success.
      type: object

  list_field_groups:
    title: List custom field groups
    description: >-
      The groups custom fields are organised into, which is how the contact
      record is laid out in the UI.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/groupMembers
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many groups to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many groups to skip.
        optional: true
        minimum: 0
    output:
      description: The custom field groups.
      type: object
      properties:
        groupMembers: {type: array}
        meta: {type: object}

  get_field_group:
    title: Get a custom field group
    description: One custom field group by id, with the fields assigned to it.
    category: fields
    read_only: true
    request:
      method: GET
      path: /3/groupMembers/${group_id}
    input:
      group_id:
        type: integer
        description: The field group's id.
    output:
      description: The field group.
      type: object
      properties:
        groupMember: {type: object}

  add_field_to_group:
    title: Add a custom field to a group
    description: >-
      Put a custom field into a field group, which is what decides where it
      shows on the contact record.
    category: fields
    request:
      method: POST
      path: /3/groupMembers
      body:
        groupMember: "${group_member}"
    input:
      group_member:
        type: object
        description: >-
          The assignment: the field group id and the custom field id, as the
          groupMembers resource declares them.
    output:
      description: The assignment that was created.
      type: object
      properties:
        groupMember: {type: object}

  update_field_group:
    title: Update a custom field group
    description: Change a field group's fields or its position on the contact record.
    category: fields
    request:
      method: PUT
      path: /3/groupMembers/${group_id}
      body:
        groupMember: "${group_member}"
    input:
      group_id:
        type: integer
        description: The field group's id.
      group_member:
        type: object
        description: The group's new contents, as the groupMembers resource declares them.
    output:
      description: The updated field group.
      type: object
      properties:
        groupMember: {type: object}

  delete_field_group:
    title: Delete a custom field group
    description: >-
      Remove a field group. The custom fields themselves survive; they simply
      stop being grouped.
    category: fields
    destructive: true
    request:
      method: DELETE
      path: /3/groupMembers/${group_id}
    input:
      group_id:
        type: integer
        description: The field group's id.
    output:
      description: Empty on success.
      type: object

  # -- deals -----------------------------------------------------------------

  list_deals:
    title: List deals
    description: >-
      Deals from the CRM, filtered by pipeline, stage, status, owner, value
      range, tag or dates. Values come back in cents. `filters[search]` with
      `filters[search_field]` is how the UI's search box is reproduced.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/deals
      query:
        "filters[search]": "${search}"
        "filters[search_field]": "${search_field}"
        "filters[title]": "${title}"
        "filters[stage]": "${stage_id}"
        "filters[group]": "${pipeline_id}"
        "filters[status]": "${status}"
        "filters[owner]": "${owner_id}"
        "filters[tag]": "${tag_id}"
        "filters[organization]": "${account_id}"
        "filters[minimum_value]": "${minimum_value}"
        "filters[maximum_value]": "${maximum_value}"
        "filters[created_after]": "${created_after}"
        "filters[created_before]": "${created_before}"
        "filters[updated_after]": "${updated_after}"
        "filters[updated_before]": "${updated_before}"
        "orders[title]": "${order_by_title}"
        "orders[value]": "${order_by_value}"
        "orders[cdate]": "${order_by_created}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      search:
        type: string
        description: Free-text search across deals.
        optional: true
      search_field:
        type: string
        description: Which field `search` applies to, e.g. title or contact.
        optional: true
      title:
        type: string
        description: Only deals whose title matches this.
        optional: true
      stage_id:
        type: integer
        description: Only deals in this stage.
        optional: true
      pipeline_id:
        type: integer
        description: Only deals in this pipeline (deal group).
        optional: true
      status:
        type: integer
        description: Deal status -- 0 open, 1 won, 2 lost.
        optional: true
      owner_id:
        type: integer
        description: Only deals owned by this user.
        optional: true
      tag_id:
        type: integer
        description: Only deals carrying this tag.
        optional: true
      account_id:
        type: integer
        description: Only deals belonging to this account.
        optional: true
      minimum_value:
        type: integer
        description: Only deals worth at least this many cents.
        optional: true
      maximum_value:
        type: integer
        description: Only deals worth at most this many cents.
        optional: true
      created_after:
        type: string
        description: Only deals created after this timestamp.
        optional: true
      created_before:
        type: string
        description: Only deals created before this timestamp.
        optional: true
      updated_after:
        type: string
        description: Only deals updated after this timestamp.
        optional: true
      updated_before:
        type: string
        description: Only deals updated before this timestamp.
        optional: true
      order_by_title:
        type: string
        description: Sort by deal title.
        optional: true
        enum: [ASC, DESC]
      order_by_value:
        type: string
        description: Sort by deal value.
        optional: true
        enum: [ASC, DESC]
      order_by_created:
        type: string
        description: Sort by creation date.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many deals to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many deals to skip.
        optional: true
        minimum: 0
    output:
      description: The matching deals.
      type: object
      properties:
        deals: {type: array, description: "Each with id, title, value in cents, currency, stage, owner and status."}
        meta: {type: object}

  get_deal:
    title: Get a deal
    description: >-
      One deal by id, with its stage, pipeline, owner, value in cents, custom
      field values and -- by default -- its primary contact and stage expanded.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/deals/${deal_id}
    input:
      deal_id:
        type: integer
        description: The deal's id.
    output:
      description: The deal.
      type: object
      properties:
        deal: {type: object}
        dealCustomFieldData: {type: array}

  create_deal:
    title: Create a deal
    description: >-
      Create a deal. It needs either a contact or an account, and either a
      pipeline or a stage -- give a stage alone and its pipeline is inferred,
      give a pipeline alone and the deal lands in its first stage. `value` is in
      cents and `currency` a lowercased three-letter code. An owner is required
      unless the pipeline auto-assigns.
    category: deals
    request:
      method: POST
      path: /3/deals
      body:
        deal:
          title: "${title}"
          description: "${description}"
          contact: "${contact_id}"
          account: "${account_id}"
          value: "${value}"
          currency: "${currency}"
          group: "${pipeline_id}"
          stage: "${stage_id}"
          owner: "${owner_id}"
          percent: "${percent}"
          status: "${status}"
          fields: "${fields}"
    input:
      title:
        type: string
        description: The deal's title.
        example: Acme renewal
      value:
        type: integer
        description: The deal's value in cents -- $456.78 is 45678. Zero or more.
        minimum: 0
      currency:
        type: string
        description: Three-letter ISO currency code, lowercased, e.g. usd.
        example: usd
      contact_id:
        type: string
        description: Primary contact's id. Required unless `account_id` is given.
        optional: true
      account_id:
        type: string
        description: Account's id. Required unless `contact_id` is given.
        optional: true
      description:
        type: string
        description: Free-text description of the deal.
        optional: true
      pipeline_id:
        type: string
        description: Pipeline id. Required unless `stage_id` is given.
        optional: true
      stage_id:
        type: string
        description: Stage id. Required unless `pipeline_id` is given.
        optional: true
      owner_id:
        type: string
        description: Owning user's id. Required when the pipeline does not auto-assign.
        optional: true
      percent:
        type: integer
        description: Probability of the deal closing, as a percentage.
        optional: true
        minimum: 0
        maximum: 100
      status:
        type: integer
        description: Deal status -- 0 open, 1 won, 2 lost.
        optional: true
        enum: [0, 1, 2]
      fields:
        type: array
        description: >-
          Custom field values, each with customFieldId and fieldValue -- plus
          fieldCurrency for a currency field, whose value is also in cents.
        optional: true
        items:
          type: object
          properties:
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The deal that was created.
      type: object
      properties:
        deal: {type: object}

  update_deal:
    title: Update a deal
    description: >-
      Change a deal. Only the fields you send change. Moving a deal is a matter
      of setting `stage_id`; marking it won or lost is `status` 1 or 2.
    category: deals
    request:
      method: PUT
      path: /3/deals/${deal_id}
      body:
        deal:
          title: "${title}"
          description: "${description}"
          contact: "${contact_id}"
          account: "${account_id}"
          value: "${value}"
          currency: "${currency}"
          group: "${pipeline_id}"
          stage: "${stage_id}"
          owner: "${owner_id}"
          percent: "${percent}"
          status: "${status}"
          fields: "${fields}"
    input:
      deal_id:
        type: integer
        description: The deal's id.
      title:
        type: string
        description: New title.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      contact_id:
        type: string
        description: New primary contact id.
        optional: true
      account_id:
        type: string
        description: New account id.
        optional: true
      value:
        type: integer
        description: New value in cents.
        optional: true
        minimum: 0
      currency:
        type: string
        description: New currency, as a lowercased three-letter code.
        optional: true
      pipeline_id:
        type: string
        description: New pipeline id.
        optional: true
      stage_id:
        type: string
        description: New stage id -- this is how a deal is moved along the pipeline.
        optional: true
      owner_id:
        type: string
        description: New owner's user id.
        optional: true
      percent:
        type: integer
        description: New probability of closing.
        optional: true
        minimum: 0
        maximum: 100
      status:
        type: integer
        description: Deal status -- 0 open, 1 won, 2 lost.
        optional: true
        enum: [0, 1, 2]
      fields:
        type: array
        description: Custom field values to set, each with customFieldId and fieldValue.
        optional: true
        items:
          type: object
          properties:
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The updated deal.
      type: object
      properties:
        deal: {type: object}

  delete_deal:
    title: Delete a deal
    description: >-
      Delete a deal along with its notes, tasks and activity. Marking it lost
      with `status` 2 is usually what is wanted instead, since that keeps the
      history for reporting.
    category: deals
    destructive: true
    request:
      method: DELETE
      path: /3/deals/${deal_id}
    input:
      deal_id:
        type: integer
        description: The deal's id.
    output:
      description: Empty on success.
      type: object

  bulk_update_deal_owners:
    title: Bulk update deal owners
    description: >-
      Reassign many deals at once -- what a territory change or someone leaving
      calls for, rather than a loop of single updates.
    category: deals
    request:
      method: PATCH
      path: /3/deals/bulkUpdate
      body:
        deals: "${deals}"
    input:
      deals:
        type: array
        description: >-
          The reassignments, each naming the deals and the owner to move them
          to, as the bulk update endpoint declares them.
        items: {type: object}
    output:
      description: The result of the bulk update.
      type: object

  create_deal_note:
    title: Add a note to a deal
    description: >-
      Attach a note to a deal. Returns the note with its id, which
      `update_deal_note` takes -- notes on deals are addressed by deal and note
      together.
    category: deals
    request:
      method: POST
      path: /3/deals/${deal_id}/notes
      body:
        note:
          note: "${note}"
    input:
      deal_id:
        type: integer
        description: The deal to annotate.
      note:
        type: string
        description: The note's text.
        example: Left a voicemail, following up Thursday.
    output:
      description: The note that was created.
      type: object
      properties:
        note: {type: object}

  update_deal_note:
    title: Update a deal's note
    description: Rewrite a note on a deal, addressed by the deal id and the note id together.
    category: deals
    request:
      method: PUT
      path: /3/deals/${deal_id}/notes/${note_id}
      body:
        note:
          note: "${note}"
    input:
      deal_id:
        type: integer
        description: The deal the note belongs to.
      note_id:
        type: integer
        description: The note's id.
      note:
        type: string
        description: The note's new text.
    output:
      description: The updated note.
      type: object
      properties:
        note: {type: object}

  list_deal_activities:
    title: List deal activities
    description: >-
      The activity trail on deals -- stage moves, edits, notes and tasks --
      filtered to one deal or one kind of change. How a deal's history is
      reconstructed.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/dealActivities
      query:
        deal: "${deal_id}"
        exclude: "${exclude}"
        "filters[data_type]": "${data_type}"
        "filters[data_id]": "${data_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      deal_id:
        type: integer
        description: Only activity on this deal.
        optional: true
      exclude:
        type: string
        description: Activity types to leave out.
        optional: true
      data_type:
        type: string
        description: Only activity of this data type.
        optional: true
      data_id:
        type: integer
        description: Only activity about this related record id.
        optional: true
      limit:
        type: integer
        description: How many activities to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many activities to skip.
        optional: true
        minimum: 0
    output:
      description: The deal activities.
      type: object
      properties:
        dealActivities: {type: array}
        meta: {type: object}

  list_pipelines:
    title: List pipelines
    description: >-
      The CRM's pipelines (deal groups), with their default currency,
      auto-assign setting and which user groups may manage them.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /3/dealGroups
      query:
        "filters[title]": "${title}"
        "filters[have_stages]": "${have_stages}"
        "orders[title]": "${order_by_title}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      title:
        type: string
        description: Only pipelines whose title matches this.
        optional: true
      have_stages:
        type: boolean
        description: Only pipelines that have stages defined.
        optional: true
      order_by_title:
        type: string
        description: Sort by pipeline title.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many pipelines to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many pipelines to skip.
        optional: true
        minimum: 0
    output:
      description: The account's pipelines.
      type: object
      properties:
        dealGroups: {type: array}
        meta: {type: object}

  get_pipeline:
    title: Get a pipeline
    description: >-
      One pipeline by id, with its currency, auto-assign configuration and the
      users and groups attached to it.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /3/dealGroups/${pipeline_id}
    input:
      pipeline_id:
        type: integer
        description: The pipeline's id.
    output:
      description: The pipeline.
      type: object
      properties:
        dealGroup: {type: object}

  create_pipeline:
    title: Create a pipeline
    description: >-
      Create a pipeline and set how deals in it are assigned: `autoassign` 0
      disables it, 1 is round robin, 2 spreads by workload. With auto-assign off
      every deal needs an explicit owner.
    category: pipelines
    request:
      method: POST
      path: /3/dealGroups
      body:
        dealGroup:
          title: "${title}"
          currency: "${currency}"
          allgroups: "${all_groups}"
          allusers: "${all_users}"
          autoassign: "${auto_assign}"
          users: "${users}"
          groups: "${groups}"
    input:
      title:
        type: string
        description: The pipeline's title.
        example: New business
      currency:
        type: string
        description: Default currency for deals in this pipeline, as a lowercased ISO code.
        example: usd
      all_groups:
        type: integer
        description: 1 to let every user group manage this pipeline, 0 to restrict it to `groups`.
        optional: true
        enum: [0, 1]
      all_users:
        type: integer
        description: 1 to auto-assign new deals across all users, 0 to use `users`.
        optional: true
        enum: [0, 1]
      auto_assign:
        type: integer
        description: Auto-assign mode -- 0 off, 1 round robin, 2 by workload.
        optional: true
        enum: [0, 1, 2]
      users:
        type: array
        description: Ids of the users new deals are auto-assigned to.
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Ids of the user groups allowed to manage this pipeline.
        optional: true
        items: {type: string}
    output:
      description: The pipeline that was created.
      type: object
      properties:
        dealGroup: {type: object}

  update_pipeline:
    title: Update a pipeline
    description: >-
      Change a pipeline's title, currency, permissions or auto-assign
      behaviour. Only the fields you send change.
    category: pipelines
    request:
      method: PUT
      path: /3/dealGroups/${pipeline_id}
      body:
        dealGroup:
          title: "${title}"
          currency: "${currency}"
          allgroups: "${all_groups}"
          allusers: "${all_users}"
          autoassign: "${auto_assign}"
          users: "${users}"
          groups: "${groups}"
    input:
      pipeline_id:
        type: integer
        description: The pipeline's id.
      title:
        type: string
        description: New title.
        optional: true
      currency:
        type: string
        description: New default currency, as a lowercased ISO code.
        optional: true
      all_groups:
        type: integer
        description: Whether every user group may manage this pipeline.
        optional: true
        enum: [0, 1]
      all_users:
        type: integer
        description: Whether new deals auto-assign across all users.
        optional: true
        enum: [0, 1]
      auto_assign:
        type: integer
        description: Auto-assign mode -- 0 off, 1 round robin, 2 by workload.
        optional: true
        enum: [0, 1, 2]
      users:
        type: array
        description: Ids of the users new deals are auto-assigned to.
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Ids of the user groups allowed to manage this pipeline.
        optional: true
        items: {type: string}
    output:
      description: The updated pipeline.
      type: object
      properties:
        dealGroup: {type: object}

  delete_pipeline:
    title: Delete a pipeline
    description: >-
      Delete a pipeline. Its stages go with it, so make sure the deals inside
      have been moved elsewhere first.
    category: pipelines
    destructive: true
    request:
      method: DELETE
      path: /3/dealGroups/${pipeline_id}
    input:
      pipeline_id:
        type: integer
        description: The pipeline's id.
    output:
      description: Empty on success.
      type: object

  list_deal_stages:
    title: List deal stages
    description: >-
      The stages defined across pipelines, with their order, colour and card
      layout. Filter by pipeline to get one pipeline's stages in order.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /3/dealStages
      query:
        "filters[title]": "${title}"
        "filters[d_groupid]": "${pipeline_id}"
        "orders[title]": "${order_by_title}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      title:
        type: string
        description: Only stages whose title matches this.
        optional: true
      pipeline_id:
        type: integer
        description: Only stages in this pipeline.
        optional: true
      order_by_title:
        type: string
        description: Sort by stage title.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many stages to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many stages to skip.
        optional: true
        minimum: 0
    output:
      description: The deal stages.
      type: object
      properties:
        dealStages: {type: array}
        meta: {type: object}

  get_deal_stage:
    title: Get a deal stage
    description: One stage by id, with its pipeline, order, colour and deal card layout.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /3/dealStages/${stage_id}
    input:
      stage_id:
        type: integer
        description: The stage's id.
    output:
      description: The deal stage.
      type: object
      properties:
        dealStage: {type: object}

  create_deal_stage:
    title: Create a deal stage
    description: >-
      Add a stage to a pipeline. `order` places it; `reorder` true renumbers the
      stages around it rather than leaving two stages sharing a position, which
      is what makes the board order predictable.
    category: pipelines
    request:
      method: POST
      path: /3/dealStages
      query:
        reorder: "${reorder}"
      body:
        dealStage:
          title: "${title}"
          group: "${pipeline_id}"
          order: "${order}"
          dealOrder: "${deal_order}"
          color: "${color}"
          width: "${width}"
    input:
      title:
        type: string
        description: The stage's title.
        example: Proposal sent
      pipeline_id:
        type: string
        description: Pipeline the stage belongs to.
      order:
        type: integer
        description: Position of the stage in the pipeline.
        optional: true
        minimum: 0
      deal_order:
        type: string
        description: >-
          How deals inside the stage are sorted, e.g. "next-action DESC" or
          "value ASC".
        optional: true
      color:
        type: string
        description: Six-character hex colour without the hash, e.g. 434343.
        optional: true
      width:
        type: integer
        description: Column width in pixels.
        optional: true
        minimum: 1
      reorder:
        type: boolean
        description: Renumber surrounding stages so the order stays unambiguous.
        optional: true
    output:
      description: The stage that was created.
      type: object
      properties:
        dealStage: {type: object}

  update_deal_stage:
    title: Update a deal stage
    description: >-
      Change a stage's title, position, colour or card layout. As on create,
      `reorder` true keeps the pipeline's ordering unambiguous.
    category: pipelines
    request:
      method: PUT
      path: /3/dealStages/${stage_id}
      query:
        reorder: "${reorder}"
      body:
        dealStage:
          title: "${title}"
          group: "${pipeline_id}"
          order: "${order}"
          dealOrder: "${deal_order}"
          color: "${color}"
          width: "${width}"
    input:
      stage_id:
        type: integer
        description: The stage's id.
      title:
        type: string
        description: New title.
        optional: true
      pipeline_id:
        type: string
        description: Pipeline the stage belongs to.
        optional: true
      order:
        type: integer
        description: New position in the pipeline.
        optional: true
        minimum: 0
      deal_order:
        type: string
        description: How deals inside the stage are sorted.
        optional: true
      color:
        type: string
        description: Six-character hex colour without the hash.
        optional: true
      width:
        type: integer
        description: Column width in pixels.
        optional: true
        minimum: 1
      reorder:
        type: boolean
        description: Renumber surrounding stages.
        optional: true
    output:
      description: The updated stage.
      type: object
      properties:
        dealStage: {type: object}

  delete_deal_stage:
    title: Delete a deal stage
    description: >-
      Delete a stage. Move its deals out first with `move_deals_to_stage` --
      deals left in a deleted stage are the usual cause of a pipeline that
      looks short of revenue.
    category: pipelines
    destructive: true
    request:
      method: DELETE
      path: /3/dealStages/${stage_id}
    input:
      stage_id:
        type: integer
        description: The stage's id.
    output:
      description: Empty on success.
      type: object

  move_deals_to_stage:
    title: Move a stage's deals to another stage
    description: >-
      Move every deal out of one stage into another in a single call -- what to
      run before deleting a stage or when reshaping a pipeline.
    category: pipelines
    request:
      method: PUT
      path: /3/dealStages/${stage_id}/deals
      body:
        dealStage:
          id: "${target_stage_id}"
    input:
      stage_id:
        type: integer
        description: The stage whose deals are being moved.
      target_stage_id:
        type: integer
        description: The stage the deals move into.
    output:
      description: The result of the move.
      type: object
      properties:
        dealStage: {type: object}

  # -- deal tasks, outcomes and task types -----------------------------------

  list_deal_tasks:
    title: List CRM tasks
    description: >-
      Tasks attached to deals and contacts, filtered by status, due date,
      assignee, type or outcome. `filters[status]` 0 is incomplete and 1
      complete, which is how an open-task list is built.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/dealTasks
      query:
        "filters[title]": "${title}"
        "filters[reltype]": "${related_type}"
        "filters[relid]": "${related_id}"
        "filters[status]": "${status}"
        "filters[duedate]": "${due_date}"
        "filters[due_after]": "${due_after}"
        "filters[d_tasktypeid]": "${task_type_id}"
        "filters[assignee_userid]": "${assignee_id}"
        "filters[outcome_id]": "${outcome_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      title:
        type: string
        description: Only tasks whose title matches this.
        optional: true
      related_type:
        type: string
        description: What the task hangs off -- Deal or Subscriber (a contact).
        optional: true
      related_id:
        type: integer
        description: Id of the deal or contact the task belongs to.
        optional: true
      status:
        type: integer
        description: Task status -- 0 incomplete, 1 complete.
        optional: true
        enum: [0, 1]
      due_date:
        type: string
        description: Only tasks due on this date.
        optional: true
      due_after:
        type: string
        description: Only tasks due after this date.
        optional: true
      task_type_id:
        type: integer
        description: Only tasks of this task type.
        optional: true
      assignee_id:
        type: integer
        description: Only tasks assigned to this user.
        optional: true
      outcome_id:
        type: integer
        description: Only tasks completed with this outcome.
        optional: true
      limit:
        type: integer
        description: How many tasks to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many tasks to skip.
        optional: true
        minimum: 0
    output:
      description: The matching tasks.
      type: object
      properties:
        dealTasks: {type: array}
        meta: {type: object}

  get_deal_task:
    title: Get a CRM task
    description: >-
      One task by id, with its due date, type, assignee, status and the deal or
      contact it belongs to.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/dealTasks/${task_id}
    input:
      task_id:
        type: integer
        description: The task's id.
    output:
      description: The task.
      type: object
      properties:
        dealTask: {type: object}

  create_deal_task:
    title: Create a CRM task
    description: >-
      Create a task against a deal or a contact. `owner_type` says which --
      "deal" or "contact" -- and `related_id` is that record's id. The task type
      must be one the account defines; `list_deal_task_types` lists them.
    category: tasks
    request:
      method: POST
      path: /3/dealTasks
      body:
        dealTask:
          title: "${title}"
          ownerType: "${owner_type}"
          relid: "${related_id}"
          duedate: "${due_date}"
          dealTasktype: "${task_type_id}"
          note: "${note}"
          status: "${status}"
          assignee: "${assignee_id}"
          triggerAutomationOnCreate: "${trigger_automation_on_create}"
          doneAutomation: "${done_automation}"
    input:
      related_id:
        type: integer
        description: Id of the deal or contact the task is about.
      due_date:
        type: string
        description: When the task is due.
        example: "2026-09-20T12:00:00-06:00"
      task_type_id:
        type: integer
        description: Task type id, from `list_deal_task_types`.
      title:
        type: string
        description: Title for the task.
        optional: true
      owner_type:
        type: string
        description: Whether `related_id` is a deal or a contact.
        optional: true
        default: deal
        enum: [deal, contact]
      note:
        type: string
        description: What the task involves.
        optional: true
      status:
        type: integer
        description: Task status -- 0 incomplete, 1 complete.
        optional: true
        enum: [0, 1]
      assignee_id:
        type: integer
        description: User the task is assigned to.
        optional: true
      trigger_automation_on_create:
        type: integer
        description: Id of an automation to start when the task is created.
        optional: true
      done_automation:
        type: integer
        description: Id of an automation to start when the task is completed.
        optional: true
    output:
      description: The task that was created.
      type: object
      properties:
        dealTask: {type: object}

  update_deal_task:
    title: Update a CRM task
    description: >-
      Change a task, or complete one. Completing a task means setting `status`
      to 1, and ActiveCampaign requires an `outcome_id` at that point --
      `list_task_outcomes` gives the allowed outcomes.
    category: tasks
    request:
      method: PUT
      path: /3/dealTasks/${task_id}
      body:
        dealTask:
          title: "${title}"
          ownerType: "${owner_type}"
          relid: "${related_id}"
          duedate: "${due_date}"
          dealTasktype: "${task_type_id}"
          note: "${note}"
          status: "${status}"
          assignee: "${assignee_id}"
          outcomeId: "${outcome_id}"
          outcomeInfo: "${outcome_info}"
    input:
      task_id:
        type: integer
        description: The task's id.
      title:
        type: string
        description: New title.
        optional: true
      owner_type:
        type: string
        description: Whether `related_id` is a deal or a contact.
        optional: true
        enum: [deal, contact]
      related_id:
        type: integer
        description: Id of the deal or contact the task is about.
        optional: true
      due_date:
        type: string
        description: New due date.
        optional: true
      task_type_id:
        type: integer
        description: New task type id.
        optional: true
      note:
        type: string
        description: New description of the task.
        optional: true
      status:
        type: integer
        description: Task status -- 0 incomplete, 1 complete. Completing needs `outcome_id`.
        optional: true
        enum: [0, 1]
      assignee_id:
        type: integer
        description: User the task is assigned to.
        optional: true
      outcome_id:
        type: integer
        description: Outcome recorded on completion. Required when setting status to 1.
        optional: true
      outcome_info:
        type: string
        description: Free text about how the task turned out.
        optional: true
    output:
      description: The updated task.
      type: object
      properties:
        dealTask: {type: object}

  delete_deal_task:
    title: Delete a CRM task
    description: >-
      Delete a task outright. Completing it with an outcome is usually better,
      since that leaves the activity trail intact.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /3/dealTasks/${task_id}
    input:
      task_id:
        type: integer
        description: The task's id.
    output:
      description: Empty on success.
      type: object

  list_deal_task_types:
    title: List task types
    description: >-
      The task types the account defines -- call, email, meeting and whatever
      else has been added -- with their active or disabled status.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/dealTasktypes
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many task types to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many task types to skip.
        optional: true
        minimum: 0
    output:
      description: The account's task types.
      type: object
      properties:
        dealTasktypes: {type: array}
        meta: {type: object}

  get_deal_task_type:
    title: Get a task type
    description: One task type by id, with its title and whether it is still active.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/dealTasktypes/${task_type_id}
    input:
      task_type_id:
        type: integer
        description: The task type's id.
    output:
      description: The task type.
      type: object
      properties:
        dealTasktype: {type: object}

  create_deal_task_type:
    title: Create a task type
    description: >-
      Add a task type. Titles must be unique among task types, and status "1"
      creates it disabled -- useful when preparing a set before rollout.
    category: tasks
    request:
      method: POST
      path: /3/dealTasktypes
      body:
        dealTasktype:
          title: "${title}"
          status: "${status}"
    input:
      title:
        type: string
        description: Title of the task type. Must be unique.
        example: Discovery call
      status:
        type: string
        description: '"0" active, "1" disabled.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The task type that was created.
      type: object
      properties:
        dealTasktype: {type: object}

  update_deal_task_type:
    title: Update a task type
    description: >-
      Rename a task type or disable it. Disabling keeps existing tasks intact
      but stops new ones being created with it.
    category: tasks
    request:
      method: PUT
      path: /3/dealTasktypes/${task_type_id}
      body:
        dealTasktype:
          title: "${title}"
          status: "${status}"
    input:
      task_type_id:
        type: integer
        description: The task type's id.
      title:
        type: string
        description: New title.
        optional: true
      status:
        type: string
        description: '"0" active, "1" disabled.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The updated task type.
      type: object
      properties:
        dealTasktype: {type: object}

  delete_deal_task_type:
    title: Delete a task type
    description: >-
      Delete a task type. Move its tasks first with `move_tasks_to_task_type`,
      or they lose their type.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /3/dealTasktypes/${task_type_id}
    input:
      task_type_id:
        type: integer
        description: The task type's id.
    output:
      description: Empty on success.
      type: object

  move_tasks_to_task_type:
    title: Move tasks to another task type
    description: >-
      Retype every task of one task type in a single call -- what to run before
      deleting a task type or when consolidating duplicates.
    category: tasks
    request:
      method: PUT
      path: /3/dealTasktypes/${task_type_id}/dealTasks
      body:
        dealTasktype:
          id: "${target_task_type_id}"
    input:
      task_type_id:
        type: integer
        description: The task type whose tasks are being moved.
      target_task_type_id:
        type: integer
        description: The task type they move to.
    output:
      description: The result of the move.
      type: object
      properties:
        dealTasktype: {type: object}

  list_task_outcomes:
    title: List task outcomes
    description: >-
      The outcomes a completed task can be given, with the sentiment of each.
      Completing a task requires one of these ids.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/taskOutcomes
      query:
        "filters[sentiment]": "${sentiment}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      sentiment:
        type: string
        description: Only outcomes with this sentiment.
        optional: true
        enum: [Positive, Neutral, Negative]
      limit:
        type: integer
        description: How many outcomes to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many outcomes to skip.
        optional: true
        minimum: 0
    output:
      description: The account's task outcomes.
      type: object
      properties:
        taskOutcomes: {type: array}
        meta: {type: object}

  get_task_outcome:
    title: Get a task outcome
    description: One task outcome by id, with its title, sentiment and whether it is disabled.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/taskOutcomes/${outcome_id}
    input:
      outcome_id:
        type: integer
        description: The outcome's id.
    output:
      description: The task outcome.
      type: object
      properties:
        taskOutcome: {type: object}

  create_task_outcome:
    title: Create a task outcome
    description: >-
      Add an outcome that tasks can be completed with. Sentiment is one of
      Positive, Neutral or Negative -- that is what reporting groups outcomes by.
    category: tasks
    request:
      method: POST
      path: /3/taskOutcomes
      body:
        title: "${title}"
        sentiment: "${sentiment}"
        disabled: "${disabled}"
    input:
      title:
        type: string
        description: Title of the outcome.
        example: Left voicemail
      sentiment:
        type: string
        description: How this outcome counts in reporting.
        enum: [Positive, Neutral, Negative]
      disabled:
        type: string
        description: '"0" active, "1" disabled.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The outcome that was created.
      type: object
      properties:
        taskOutcome: {type: object}

  update_task_outcome:
    title: Update a task outcome
    description: >-
      Rename a task outcome, change its sentiment or disable it. Note the
      provider's own path spelling -- taskOutccomes -- which this tool uses as
      documented.
    category: tasks
    request:
      method: PUT
      path: /3/taskOutccomes/${outcome_id}
      body:
        title: "${title}"
        sentiment: "${sentiment}"
        disabled: "${disabled}"
    input:
      outcome_id:
        type: integer
        description: The outcome's id.
      title:
        type: string
        description: New title.
        optional: true
      sentiment:
        type: string
        description: How this outcome counts in reporting.
        optional: true
        enum: [Positive, Neutral, Negative]
      disabled:
        type: string
        description: '"0" active, "1" disabled.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The updated outcome.
      type: object
      properties:
        taskOutcome: {type: object}

  delete_task_outcome:
    title: Delete a task outcome
    description: >-
      Delete a task outcome. Tasks already completed with it keep the record,
      but it can no longer be chosen. The path is the provider's own
      taskOutccomes spelling.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /3/taskOutccomes/${outcome_id}
    input:
      outcome_id:
        type: integer
        description: The outcome's id.
    output:
      description: Empty on success.
      type: object

  list_task_type_outcome_links:
    title: List task type to outcome links
    description: >-
      Which outcomes are offered for which task types -- how a call task gets
      call-shaped outcomes and an email task does not.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/tasktypeOutcomeRels
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many links to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many links to skip.
        optional: true
        minimum: 0
    output:
      description: The task type to outcome links.
      type: object
      properties:
        tasktypeOutcomeRels: {type: array}
        meta: {type: object}

  get_task_type_outcome_link:
    title: Get a task type to outcome link
    description: One task-type-to-outcome link by id, naming the task type and the outcome.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /3/tasktypeOutcomeRels/${link_id}
    input:
      link_id:
        type: integer
        description: The link's id.
    output:
      description: The link.
      type: object
      properties:
        tasktypeOutcomeRel: {type: object}

  delete_task_type_outcome_link:
    title: Delete a task type to outcome link
    description: >-
      Stop offering one outcome for one task type. Neither the task type nor the
      outcome is deleted.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /3/tasktypeOutcomeRels/${link_id}
    input:
      link_id:
        type: integer
        description: The link's id.
    output:
      description: Empty on success.
      type: object

  create_task_reminder:
    title: Create a task reminder
    description: >-
      Remind a task's assignee a set number of minutes before it is due. The
      interval is in minutes, so a day ahead is 1440.
    category: tasks
    request:
      method: POST
      path: /3/taskNotifications
      body:
        dealTask: "${task_id}"
        interval: "${interval_minutes}"
    input:
      task_id:
        type: string
        description: The task to remind about.
      interval_minutes:
        type: integer
        description: How many minutes before the due date to send the reminder.
        minimum: 1
    output:
      description: The reminder that was created.
      type: object
      properties:
        taskNotification: {type: object}

  # -- deal custom fields ----------------------------------------------------

  list_deal_custom_fields:
    title: List deal custom fields
    description: >-
      The custom fields defined for deals, with their types, options and
      defaults. Their ids are what deal field values are written against.
    category: deal-fields
    read_only: true
    request:
      method: GET
      path: /3/dealCustomFieldMeta
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many fields to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many fields to skip.
        optional: true
        minimum: 0
    output:
      description: The deal custom fields.
      type: object
      properties:
        dealCustomFieldMeta: {type: array}
        meta: {type: object}

  get_deal_custom_field:
    title: Get a deal custom field
    description: One deal custom field by id, with its type, options and default value.
    category: deal-fields
    read_only: true
    request:
      method: GET
      path: /3/dealCustomFieldMeta/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: The deal custom field.
      type: object
      properties:
        dealCustomFieldMetum: {type: object}

  create_deal_custom_field:
    title: Create a deal custom field
    description: >-
      Define a custom field for deals. Dropdown, multiselect, radio and
      checkbox types need `field_options`; a currency field takes its default
      currency code, and its values are stored in cents.
    category: deal-fields
    request:
      method: POST
      path: /3/dealCustomFieldMeta
      body:
        dealCustomFieldMetum:
          fieldLabel: "${label}"
          fieldType: "${type}"
          fieldOptions: "${field_options}"
          fieldDefault: "${default_value}"
          fieldDefaultCurrency: "${default_currency}"
          isFormVisible: "${form_visible}"
          displayOrder: "${display_order}"
    input:
      label:
        type: string
        description: Name of the field.
        example: Contract length
      type:
        type: string
        description: What kind of field this is.
        enum: [text, textarea, date, datetime, dropdown, multiselect, radio, checkbox, currency, number]
      field_options:
        type: array
        description: Choices for a dropdown, multiselect, radio or checkbox field.
        optional: true
        items: {type: string}
      default_value:
        type: string
        description: Value the field starts with. A currency field's default is in cents.
        optional: true
      default_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
      form_visible:
        type: boolean
        description: Whether the field appears on forms.
        optional: true
      display_order:
        type: integer
        description: Where the field appears on the deal profile.
        optional: true
    output:
      description: The field that was created.
      type: object
      properties:
        dealCustomFieldMetum: {type: object}

  update_deal_custom_field:
    title: Update a deal custom field
    description: >-
      Change a deal custom field's label, options, default or visibility. Only
      the fields you send change.
    category: deal-fields
    request:
      method: PUT
      path: /3/dealCustomFieldMeta/${field_id}
      body:
        dealCustomFieldMetum:
          fieldLabel: "${label}"
          fieldType: "${type}"
          fieldOptions: "${field_options}"
          fieldDefault: "${default_value}"
          fieldDefaultCurrency: "${default_currency}"
          isFormVisible: "${form_visible}"
          displayOrder: "${display_order}"
    input:
      field_id:
        type: integer
        description: The field's id.
      label:
        type: string
        description: New name for the field.
        optional: true
      type:
        type: string
        description: New field type.
        optional: true
        enum: [text, textarea, date, datetime, dropdown, multiselect, radio, checkbox, currency, number]
      field_options:
        type: array
        description: Replacement choices for a dropdown, multiselect, radio or checkbox field.
        optional: true
        items: {type: string}
      default_value:
        type: string
        description: New default value.
        optional: true
      default_currency:
        type: string
        description: New default currency code, for a currency field.
        optional: true
      form_visible:
        type: boolean
        description: Whether the field appears on forms.
        optional: true
      display_order:
        type: integer
        description: Where the field appears on the deal profile.
        optional: true
    output:
      description: The updated field.
      type: object
      properties:
        dealCustomFieldMetum: {type: object}

  delete_deal_custom_field:
    title: Delete a deal custom field
    description: >-
      Delete a deal custom field and every value deals hold for it. Reports and
      automations keyed on it stop working.
    category: deal-fields
    destructive: true
    request:
      method: DELETE
      path: /3/dealCustomFieldMeta/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: Empty on success.
      type: object

  list_deal_field_values:
    title: List deal custom field values
    description: >-
      Stored custom field values for deals, filterable to one deal -- the way
      to read a deal's custom data without expanding the deal itself.
    category: deal-fields
    read_only: true
    request:
      method: GET
      path: /3/dealCustomFieldData
      query:
        "filters[dealId]": "${deal_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      deal_id:
        type: integer
        description: Only values belonging to this deal.
        optional: true
      limit:
        type: integer
        description: How many values to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many values to skip.
        optional: true
        minimum: 0
    output:
      description: The deal field values.
      type: object
      properties:
        dealCustomFieldData: {type: array}
        meta: {type: object}

  get_deal_field_value:
    title: Get a deal custom field value
    description: One stored deal field value by id, with the deal and field it belongs to.
    category: deal-fields
    read_only: true
    request:
      method: GET
      path: /3/dealCustomFieldData/${value_id}
    input:
      value_id:
        type: integer
        description: The field value's id.
    output:
      description: The deal field value.
      type: object
      properties:
        dealCustomFieldDatum: {type: object}

  create_deal_field_value:
    title: Set a deal's custom field value
    description: >-
      Store a custom field value on a deal. A currency field's value goes in as
      cents -- 10050 for 100.50 -- with its code in `field_currency`.
    category: deal-fields
    request:
      method: POST
      path: /3/dealCustomFieldData
      body:
        dealCustomFieldDatum:
          dealId: "${deal_id}"
          customFieldId: "${field_id}"
          fieldValue: "${value}"
          fieldCurrency: "${field_currency}"
    input:
      deal_id:
        type: integer
        description: The deal the value belongs to.
      field_id:
        type: integer
        description: The deal custom field being set.
      value:
        type: string
        description: The value. For a currency field, in cents.
      field_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
    output:
      description: The value that was stored.
      type: object
      properties:
        dealCustomFieldDatum: {type: object}

  update_deal_field_value:
    title: Update a deal's custom field value
    description: >-
      Change a stored deal field value by its own id. Currency values remain in
      cents.
    category: deal-fields
    request:
      method: PUT
      path: /3/dealCustomFieldData/${value_id}
      body:
        dealCustomFieldDatum:
          dealId: "${deal_id}"
          customFieldId: "${field_id}"
          fieldValue: "${value}"
          fieldCurrency: "${field_currency}"
    input:
      value_id:
        type: integer
        description: The field value's id.
      value:
        type: string
        description: The new value. For a currency field, in cents.
      deal_id:
        type: integer
        description: The deal the value belongs to.
        optional: true
      field_id:
        type: integer
        description: The deal custom field being set.
        optional: true
      field_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
    output:
      description: The updated value.
      type: object
      properties:
        dealCustomFieldDatum: {type: object}

  delete_deal_field_value:
    title: Delete a deal's custom field value
    description: Clear one stored deal custom field value. The field definition is untouched.
    category: deal-fields
    destructive: true
    request:
      method: DELETE
      path: /3/dealCustomFieldData/${value_id}
    input:
      value_id:
        type: integer
        description: The field value's id.
    output:
      description: Empty on success.
      type: object

  bulk_create_deal_field_values:
    title: Bulk set deal custom field values
    description: >-
      Store many deal field values in one call -- what a backfill after adding
      a field needs, instead of a request per deal.
    category: deal-fields
    request:
      method: POST
      path: /3/dealCustomFieldData/bulkCreate
      body: "${values}"
    input:
      values:
        type: array
        description: >-
          The values to store, each with dealId, customFieldId, fieldValue and
          optionally fieldCurrency.
        items:
          type: object
          properties:
            dealId: {type: integer}
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The values that were stored.
      type: object
      properties:
        dealCustomFieldData: {type: array}

  bulk_update_deal_field_values:
    title: Bulk update deal custom field values
    description: >-
      Update many stored deal field values in one call, each addressed by its
      own id.
    category: deal-fields
    request:
      method: PATCH
      path: /3/dealCustomFieldData/bulkUpdate
      body: "${values}"
    input:
      values:
        type: array
        description: >-
          The updates, each with the field value's id and the new fieldValue,
          plus fieldCurrency where the field is a currency.
        items:
          type: object
          properties:
            id: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The values that were updated.
      type: object
      properties:
        dealCustomFieldData: {type: array}

  list_deal_roles:
    title: List deal roles
    description: >-
      The roles secondary contacts can hold on a deal -- decision maker,
      champion and so on, as the account defines them.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/dealRoles
      query:
        search: "${search}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      search:
        type: string
        description: Only roles whose title matches this.
        optional: true
      limit:
        type: integer
        description: How many roles to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many roles to skip.
        optional: true
        minimum: 0
    output:
      description: The account's deal roles.
      type: object
      properties:
        dealRoles: {type: array}
        meta: {type: object}

  create_deal_role:
    title: Create a deal role
    description: >-
      Add a role that secondary contacts on a deal can be given, so a buying
      committee can be described rather than just listed.
    category: deals
    request:
      method: POST
      path: /3/dealRoles
      body:
        title: "${title}"
    input:
      title:
        type: string
        description: Title of the new deal role.
        example: Decision maker
    output:
      description: The deal role that was created.
      type: object
      properties:
        dealRole: {type: object}

  delete_deal_role:
    title: Delete a deal role
    description: >-
      Delete a deal role. Secondary contacts who held it keep their place on
      the deal but lose the role.
    category: deals
    destructive: true
    request:
      method: DELETE
      path: /3/dealRoles/${role_id}
    input:
      role_id:
        type: integer
        description: The deal role's id.
    output:
      description: Empty on success.
      type: object

  list_secondary_contacts:
    title: List secondary deal contacts
    description: >-
      The extra contacts attached to deals beyond the primary one -- everyone
      else involved in the sale.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/contactDeals
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many links to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many links to skip.
        optional: true
        minimum: 0
    output:
      description: The secondary contact links.
      type: object
      properties:
        contactDeals: {type: array}
        meta: {type: object}

  get_secondary_contact:
    title: Get a secondary deal contact
    description: One secondary contact link by id, naming the deal and the contact.
    category: deals
    read_only: true
    request:
      method: GET
      path: /3/contactDeals/${contact_deal_id}
    input:
      contact_deal_id:
        type: integer
        description: The link's id.
    output:
      description: The secondary contact link.
      type: object
      properties:
        contactDeal: {type: object}

  create_secondary_contact:
    title: Add a secondary contact to a deal
    description: >-
      Attach another contact to a deal alongside its primary contact -- how the
      rest of a buying committee is recorded.
    category: deals
    request:
      method: POST
      path: /3/contactDeals
      body:
        contactDeal:
          deal: "${deal_id}"
          contact: "${contact_id}"
    input:
      deal_id:
        type: string
        description: The deal to attach the contact to.
      contact_id:
        type: string
        description: The contact being attached.
    output:
      description: The link that was created.
      type: object
      properties:
        contactDeal: {type: object}

  update_secondary_contact:
    title: Update a secondary deal contact
    description: Change which deal or contact a secondary contact link points at.
    category: deals
    request:
      method: PUT
      path: /3/contactDeals/${contact_deal_id}
      body:
        contactDeal:
          deal: "${deal_id}"
          contact: "${contact_id}"
    input:
      contact_deal_id:
        type: integer
        description: The link's id.
      deal_id:
        type: string
        description: The deal the link points at.
        optional: true
      contact_id:
        type: string
        description: The contact the link points at.
        optional: true
    output:
      description: The updated link.
      type: object
      properties:
        contactDeal: {type: object}

  delete_secondary_contact:
    title: Remove a secondary contact from a deal
    description: >-
      Detach a secondary contact from a deal. Neither the deal nor the contact
      is deleted.
    category: deals
    destructive: true
    request:
      method: DELETE
      path: /3/contactDeals/${contact_deal_id}
    input:
      contact_deal_id:
        type: integer
        description: The link's id.
    output:
      description: Empty on success.
      type: object

  # -- accounts (CRM organisations) -----------------------------------------

  list_accounts:
    title: List accounts
    description: >-
      The CRM's accounts (companies), with their owner and website. `search`
      matches the name, and `count_deals` adds each account's deal count, which
      is otherwise a separate call.
    category: accounts
    read_only: true
    request:
      method: GET
      path: /3/accounts
      query:
        search: "${search}"
        count_deals: "${count_deals}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      search:
        type: string
        description: Only accounts whose name matches this.
        optional: true
      count_deals:
        type: boolean
        description: Include each account's number of deals.
        optional: true
      limit:
        type: integer
        description: How many accounts to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many accounts to skip.
        optional: true
        minimum: 0
    output:
      description: The matching accounts.
      type: object
      properties:
        accounts: {type: array}
        meta: {type: object}

  get_account:
    title: Get an account
    description: >-
      One account by id, with its name, website, owner and custom field
      values.
    category: accounts
    read_only: true
    request:
      method: GET
      path: /3/accounts/${account_id}
    input:
      account_id:
        type: integer
        description: The account's id.
    output:
      description: The account.
      type: object
      properties:
        account: {type: object}
        accountCustomFieldData: {type: array}

  create_account:
    title: Create an account
    description: >-
      Create a CRM account. Account names are unique, so a name already in use
      is rejected -- search first when syncing from another system. Custom
      field values can be set in the same call.
    category: accounts
    request:
      method: POST
      path: /3/accounts
      body:
        account:
          name: "${name}"
          accountUrl: "${account_url}"
          owner: "${owner_user_id}"
          fields: "${fields}"
    input:
      name:
        type: string
        description: The account's name. Must be unique in the account.
        example: Acme Corporation
      account_url:
        type: string
        description: The company's website.
        optional: true
      owner_user_id:
        type: integer
        description: User id of the account owner.
        optional: true
      fields:
        type: array
        description: >-
          Custom field values, each with customFieldId and fieldValue, plus
          fieldCurrency for a currency field.
        optional: true
        items:
          type: object
          properties:
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The account that was created.
      type: object
      properties:
        account: {type: object}

  update_account:
    title: Update an account
    description: >-
      Change an account's name, website, owner or custom field values. Only what
      you send changes.
    category: accounts
    request:
      method: PUT
      path: /3/accounts/${account_id}
      body:
        account:
          name: "${name}"
          accountUrl: "${account_url}"
          owner: "${owner_user_id}"
          fields: "${fields}"
    input:
      account_id:
        type: integer
        description: The account's id.
      name:
        type: string
        description: New name for the account.
        optional: true
      account_url:
        type: string
        description: New website.
        optional: true
      owner_user_id:
        type: integer
        description: New owner's user id.
        optional: true
      fields:
        type: array
        description: Custom field values to set.
        optional: true
        items:
          type: object
          properties:
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The updated account.
      type: object
      properties:
        account: {type: object}

  delete_account:
    title: Delete an account
    description: >-
      Delete a CRM account. Its contacts survive but lose the association, and
      deals attached to it are affected -- check what points at it first.
    category: accounts
    destructive: true
    request:
      method: DELETE
      path: /3/accounts/${account_id}
    input:
      account_id:
        type: integer
        description: The account's id.
    output:
      description: Empty on success.
      type: object

  bulk_delete_accounts:
    title: Bulk delete accounts
    description: >-
      Delete several accounts in one call. Not reversible, and it detaches the
      contacts and deals attached to each.
    category: accounts
    destructive: true
    request:
      method: DELETE
      path: /3/accounts/bulk_delete
      query:
        "[]ids": "${account_ids}"
    input:
      account_ids:
        type: array
        description: Ids of the accounts to delete.
        items: {type: integer}
    output:
      description: The result of the bulk delete.
      type: object

  create_account_note:
    title: Add a note to an account
    description: >-
      Attach a note to a CRM account. The note's id comes back, and
      `update_account_note` takes it together with the account id.
    category: accounts
    request:
      method: POST
      path: /3/accounts/${account_id}/notes
      body:
        note:
          note: "${note}"
    input:
      account_id:
        type: integer
        description: The account to annotate.
      note:
        type: string
        description: The note's text.
        example: Renewal conversation scheduled for October.
    output:
      description: The note that was created.
      type: object
      properties:
        note: {type: object}

  update_account_note:
    title: Update an account's note
    description: Rewrite a note on an account, addressed by account id and note id together.
    category: accounts
    request:
      method: PUT
      path: /3/accounts/${account_id}/notes/${note_id}
      body:
        note:
          note: "${note}"
    input:
      account_id:
        type: integer
        description: The account the note belongs to.
      note_id:
        type: integer
        description: The note's id.
      note:
        type: string
        description: The note's new text.
    output:
      description: The updated note.
      type: object
      properties:
        note: {type: object}

  list_account_contacts:
    title: List account-contact links
    description: >-
      Which contacts belong to which accounts, with their job titles. Filter by
      account or by contact to answer either direction.
    category: accounts
    read_only: true
    request:
      method: GET
      path: /3/accountContacts
      query:
        "filters[account]": "${account_id}"
        "filters[contact]": "${contact_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      account_id:
        type: integer
        description: Only links for this account.
        optional: true
      contact_id:
        type: integer
        description: Only links for this contact.
        optional: true
      limit:
        type: integer
        description: How many links to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many links to skip.
        optional: true
        minimum: 0
    output:
      description: The account-contact links.
      type: object
      properties:
        accountContacts: {type: array}
        meta: {type: object}

  get_account_contact:
    title: Get an account-contact link
    description: One account-contact association by id, with the contact's job title.
    category: accounts
    read_only: true
    request:
      method: GET
      path: /3/accountContacts/${account_contact_id}
    input:
      account_contact_id:
        type: integer
        description: The association's id.
    output:
      description: The association.
      type: object
      properties:
        accountContact: {type: object}

  create_account_contact:
    title: Link a contact to an account
    description: >-
      Attach a contact to a CRM account, optionally with their job title. This
      replaces the deprecated contact-organisation relationship.
    category: accounts
    request:
      method: POST
      path: /3/accountContacts
      body:
        accountContact:
          account: "${account_id}"
          contact: "${contact_id}"
          jobTitle: "${job_title}"
    input:
      account_id:
        type: integer
        description: The account to attach the contact to.
      contact_id:
        type: integer
        description: The contact being attached.
      job_title:
        type: string
        description: The contact's job title at this account.
        optional: true
    output:
      description: The association that was created.
      type: object
      properties:
        accountContact: {type: object}

  update_account_contact:
    title: Update an account-contact link
    description: Change a contact's job title at an account, or repoint the association.
    category: accounts
    request:
      method: PUT
      path: /3/accountContacts/${account_contact_id}
      body:
        accountContact:
          account: "${account_id}"
          contact: "${contact_id}"
          jobTitle: "${job_title}"
    input:
      account_contact_id:
        type: integer
        description: The association's id.
      job_title:
        type: string
        description: New job title.
        optional: true
      account_id:
        type: integer
        description: The account the association points at.
        optional: true
      contact_id:
        type: integer
        description: The contact the association points at.
        optional: true
    output:
      description: The updated association.
      type: object
      properties:
        accountContact: {type: object}

  delete_account_contact:
    title: Unlink a contact from an account
    description: >-
      Remove an account-contact association. Neither the account nor the contact
      is deleted.
    category: accounts
    destructive: true
    request:
      method: DELETE
      path: /3/accountContacts/${account_contact_id}
    input:
      account_contact_id:
        type: integer
        description: The association's id.
    output:
      description: Empty on success.
      type: object

  list_account_custom_fields:
    title: List account custom fields
    description: >-
      The custom fields defined for CRM accounts, with their types, options and
      defaults.
    category: account-fields
    read_only: true
    request:
      method: GET
      path: /3/accountCustomFieldMeta
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many fields to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many fields to skip.
        optional: true
        minimum: 0
    output:
      description: The account custom fields.
      type: object
      properties:
        accountCustomFieldMeta: {type: array}
        meta: {type: object}

  get_account_custom_field:
    title: Get an account custom field
    description: One account custom field by id, with its type, options and default.
    category: account-fields
    read_only: true
    request:
      method: GET
      path: /3/accountCustomFieldMeta/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: The account custom field.
      type: object
      properties:
        accountCustomFieldMetum: {type: object}

  create_account_custom_field:
    title: Create an account custom field
    description: >-
      Define a custom field for CRM accounts. Dropdown, multiselect, radio and
      checkbox types need `field_options`; a currency field takes a default
      currency code and stores values in cents.
    category: account-fields
    request:
      method: POST
      path: /3/accountCustomFieldMeta
      body:
        accountCustomFieldMetum:
          fieldLabel: "${label}"
          fieldType: "${type}"
          fieldOptions: "${field_options}"
          fieldDefault: "${default_value}"
          fieldDefaultCurrency: "${default_currency}"
          isFormVisible: "${form_visible}"
          displayOrder: "${display_order}"
    input:
      label:
        type: string
        description: Name of the field.
        example: Industry
      type:
        type: string
        description: What kind of field this is.
        enum: [text, textarea, date, datetime, dropdown, multiselect, radio, checkbox, currency, number]
      field_options:
        type: array
        description: Choices for a dropdown, multiselect, radio or checkbox field.
        optional: true
        items: {type: string}
      default_value:
        type: string
        description: Value the field starts with.
        optional: true
      default_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
      form_visible:
        type: boolean
        description: Whether the field appears on forms.
        optional: true
      display_order:
        type: integer
        description: Where the field appears on the account profile.
        optional: true
    output:
      description: The field that was created.
      type: object
      properties:
        accountCustomFieldMetum: {type: object}

  update_account_custom_field:
    title: Update an account custom field
    description: >-
      Change an account custom field's label, options, default or visibility.
    category: account-fields
    request:
      method: PUT
      path: /3/accountCustomFieldMeta/${field_id}
      body:
        accountCustomFieldMetum:
          fieldLabel: "${label}"
          fieldOptions: "${field_options}"
          fieldDefault: "${default_value}"
          fieldDefaultCurrency: "${default_currency}"
          isFormVisible: "${form_visible}"
          displayOrder: "${display_order}"
    input:
      field_id:
        type: integer
        description: The field's id.
      label:
        type: string
        description: New name for the field.
        optional: true
      field_options:
        type: array
        description: Replacement choices for a multi-choice field.
        optional: true
        items: {type: string}
      default_value:
        type: string
        description: New default value.
        optional: true
      default_currency:
        type: string
        description: New default currency code.
        optional: true
      form_visible:
        type: boolean
        description: Whether the field appears on forms.
        optional: true
      display_order:
        type: integer
        description: Where the field appears on the account profile.
        optional: true
    output:
      description: The updated field.
      type: object
      properties:
        accountCustomFieldMetum: {type: object}

  delete_account_custom_field:
    title: Delete an account custom field
    description: >-
      Delete an account custom field and every value accounts hold for it.
    category: account-fields
    destructive: true
    request:
      method: DELETE
      path: /3/accountCustomFieldMeta/${field_id}
    input:
      field_id:
        type: integer
        description: The field's id.
    output:
      description: Empty on success.
      type: object

  list_account_field_values:
    title: List account custom field values
    description: >-
      Stored custom field values for accounts, filterable to one account.
    category: account-fields
    read_only: true
    request:
      method: GET
      path: /3/accountCustomFieldData
      query:
        "filters[customerAccountId]": "${account_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      account_id:
        type: integer
        description: Only values belonging to this account.
        optional: true
      limit:
        type: integer
        description: How many values to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many values to skip.
        optional: true
        minimum: 0
    output:
      description: The account field values.
      type: object
      properties:
        accountCustomFieldData: {type: array}
        meta: {type: object}

  get_account_field_value:
    title: Get an account custom field value
    description: One stored account field value by id, with its account and field.
    category: account-fields
    read_only: true
    request:
      method: GET
      path: /3/accountCustomFieldData/${value_id}
    input:
      value_id:
        type: integer
        description: The field value's id.
    output:
      description: The account field value.
      type: object
      properties:
        accountCustomFieldDatum: {type: object}

  create_account_field_value:
    title: Set an account's custom field value
    description: >-
      Store a custom field value on a CRM account. A currency field's value goes
      in as cents, with its code in `field_currency`.
    category: account-fields
    request:
      method: POST
      path: /3/accountCustomFieldData
      body:
        accountCustomFieldDatum:
          customerAccountId: "${account_id}"
          customFieldId: "${field_id}"
          fieldValue: "${value}"
          fieldCurrency: "${field_currency}"
    input:
      account_id:
        type: integer
        description: The account the value belongs to.
      field_id:
        type: integer
        description: The account custom field being set.
      value:
        type: string
        description: The value. For a currency field, in cents.
      field_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
    output:
      description: The value that was stored.
      type: object
      properties:
        accountCustomFieldDatum: {type: object}

  update_account_field_value:
    title: Update an account's custom field value
    description: Change a stored account field value by its own id.
    category: account-fields
    request:
      method: PUT
      path: /3/accountCustomFieldData/${value_id}
      body:
        accountCustomFieldDatum:
          customerAccountId: "${account_id}"
          customFieldId: "${field_id}"
          fieldValue: "${value}"
          fieldCurrency: "${field_currency}"
    input:
      value_id:
        type: integer
        description: The field value's id.
      value:
        type: string
        description: The new value. For a currency field, in cents.
      account_id:
        type: integer
        description: The account the value belongs to.
        optional: true
      field_id:
        type: integer
        description: The account custom field being set.
        optional: true
      field_currency:
        type: string
        description: Three-letter currency code, for a currency field.
        optional: true
    output:
      description: The updated value.
      type: object
      properties:
        accountCustomFieldDatum: {type: object}

  delete_account_field_value:
    title: Delete an account's custom field value
    description: Clear one stored account custom field value. The field definition stays.
    category: account-fields
    destructive: true
    request:
      method: DELETE
      path: /3/accountCustomFieldData/${value_id}
    input:
      value_id:
        type: integer
        description: The field value's id.
    output:
      description: Empty on success.
      type: object

  bulk_create_account_field_values:
    title: Bulk set account custom field values
    description: >-
      Store many account field values in one call -- the way to backfill a
      newly added field across the account list.
    category: account-fields
    request:
      method: POST
      path: /3/accountCustomFieldData/bulkCreate
      body: "${values}"
    input:
      values:
        type: array
        description: >-
          The values to store, each with customerAccountId, customFieldId,
          fieldValue and optionally fieldCurrency.
        items:
          type: object
          properties:
            customerAccountId: {type: integer}
            customFieldId: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The values that were stored.
      type: object
      properties:
        accountCustomFieldData: {type: array}

  bulk_update_account_field_values:
    title: Bulk update account custom field values
    description: Update many stored account field values in one call, each by its own id.
    category: account-fields
    request:
      method: PATCH
      path: /3/accountCustomFieldData/bulkUpdate
      body: "${values}"
    input:
      values:
        type: array
        description: The updates, each with the value's id and the new fieldValue.
        items:
          type: object
          properties:
            id: {type: integer}
            fieldValue: {type: string}
            fieldCurrency: {type: string}
    output:
      description: The values that were updated.
      type: object
      properties:
        accountCustomFieldData: {type: array}

  # -- campaigns and messages ------------------------------------------------

  list_campaigns:
    title: List campaigns
    description: >-
      Campaigns with their status, type and send dates. Filter by status, type,
      name or the dates they were created or sent -- `filters[status]` is how
      sent campaigns are separated from drafts and scheduled ones.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/campaigns
      query:
        "filters[name]": "${name}"
        "filters[type]": "${type}"
        "filters[status]": "${status}"
        "filters[seriesid]": "${automation_id}"
        "filters[willrecur]": "${will_recur}"
        "filters[created_after]": "${created_after}"
        "filters[created_before]": "${created_before}"
        "filters[sent_after]": "${sent_after}"
        "filters[sent_before]": "${sent_before}"
        "orders[sdate]": "${order_by_send_date}"
        "orders[ldate]": "${order_by_last_send}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only campaigns whose name matches this.
        optional: true
      type:
        type: string
        description: Campaign type, e.g. single, recurring, split, responder.
        optional: true
      status:
        type: integer
        description: >-
          Campaign status -- 0 draft, 1 scheduled, 2 sending, 3 paused,
          4 stopped, 5 complete.
        optional: true
      automation_id:
        type: integer
        description: Only campaigns belonging to this automation (series id).
        optional: true
      will_recur:
        type: boolean
        description: Only recurring campaigns.
        optional: true
      created_after:
        type: string
        description: Only campaigns created after this timestamp.
        optional: true
      created_before:
        type: string
        description: Only campaigns created before this timestamp.
        optional: true
      sent_after:
        type: string
        description: Only campaigns sent after this timestamp.
        optional: true
      sent_before:
        type: string
        description: Only campaigns sent before this timestamp.
        optional: true
      order_by_send_date:
        type: string
        description: Sort by scheduled send date.
        optional: true
        enum: [ASC, DESC]
      order_by_last_send:
        type: string
        description: Sort by the last date the campaign sent.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many campaigns to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many campaigns to skip.
        optional: true
        minimum: 0
    output:
      description: The matching campaigns.
      type: object
      properties:
        campaigns: {type: array}
        meta: {type: object}

  get_campaign:
    title: Get a campaign
    description: >-
      One campaign by id, with its status, type, schedule and lifetime totals
      for sends, opens, clicks and unsubscribes.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/campaigns/${campaign_id}
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
    output:
      description: The campaign.
      type: object
      properties:
        campaign: {type: object}

  create_campaign:
    title: Create a campaign
    description: >-
      Create a campaign shell -- its name and type. Content, audience and
      schedule are then set with `edit_campaign`, `create_campaign_message` and
      `schedule_campaign`, which is how ActiveCampaign splits campaign creation.
    category: campaigns
    request:
      method: POST
      path: /3/campaign
      body:
        name: "${name}"
        type: "${type}"
        canSplitContent: "${can_split_content}"
    input:
      name:
        type: string
        description: Name of the campaign, shown internally.
        example: September product update
      type:
        type: string
        description: >-
          What kind of campaign this is, e.g. single, recurring, split,
          responder, reminder.
        example: single
      can_split_content:
        type: boolean
        description: Allow the campaign to hold several content variants, for a split test.
        optional: true
    output:
      description: The campaign that was created.
      type: object
      properties:
        campaign: {type: object}

  edit_campaign:
    title: Edit a campaign
    description: >-
      Change a campaign's setup -- its name, lists, segment, message and
      settings. This is the endpoint the UI's campaign editor drives, so the
      payload mirrors the campaign resource.
    category: campaigns
    request:
      method: PUT
      path: /3/campaigns/${campaign_id}/edit
      body:
        campaign: "${campaign}"
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
      campaign:
        type: object
        description: >-
          The campaign fields to change -- name, list ids, segment id, message
          ids and sending options, as the campaign resource declares them.
    output:
      description: The updated campaign.
      type: object
      properties:
        campaign: {type: object}

  duplicate_campaign:
    title: Duplicate a campaign
    description: >-
      Copy a campaign, including its content and settings, as a new draft. The
      usual way to reuse a proven newsletter without rebuilding it.
    category: campaigns
    request:
      method: POST
      path: /3/campaigns/${campaign_id}/copy
      body:
        campaign:
          id: "${campaign_id}"
          name: "${name}"
    input:
      campaign_id:
        type: integer
        description: The campaign to copy.
      name:
        type: string
        description: Name for the copy. Defaults to the original's name with a suffix.
        optional: true
    output:
      description: The new campaign.
      type: object
      properties:
        campaign: {type: object}

  delete_campaign:
    title: Delete a campaign
    description: >-
      Archive a campaign and remove its folder links, pending approvals and
      queued automation sends. This endpoint reports failure in the body: a
      missing campaign or a permission problem still answers 200 with
      `succeeded` 0, so check that field rather than the status code.
    category: campaigns
    destructive: true
    request:
      method: DELETE
      path: /3/campaigns/${campaign_id}/delete
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
    output:
      description: Whether the delete succeeded.
      type: object
      properties:
        succeeded: {type: integer, description: "0 means it did not, despite the 200."}

  bulk_delete_campaigns:
    title: Delete several campaigns
    description: >-
      Archive several campaigns in one call, with the same caveat as the single
      delete -- read the result rather than trusting the status code.
    category: campaigns
    destructive: true
    request:
      method: DELETE
      path: /3/campaigns/bulk_delete
      query:
        ids: "${campaign_ids}"
    input:
      campaign_ids:
        type: array
        description: Ids of the campaigns to delete.
        items: {type: integer}
    output:
      description: The result of the bulk delete.
      type: object
      properties:
        succeeded: {type: integer}

  schedule_campaign:
    title: Schedule or send a campaign
    description: >-
      Enable a campaign so it sends -- immediately or at its scheduled date.
      This is the call that puts real mail in front of real people, so confirm
      the audience and content first, and use `send_campaign_test` to check the
      message.
    category: campaigns
    request:
      method: PUT
      path: /3/campaigns/${campaign_id}/enable
      headers:
        Content-Type: application/json
    input:
      campaign_id:
        type: integer
        description: The campaign to enable.
    output:
      description: The campaign's new state.
      type: object
      properties:
        campaign: {type: object}

  pause_campaign:
    title: Pause a sending campaign
    description: >-
      Pause a campaign mid-send. Contacts already sent to keep their copy;
      the rest of the queue waits until it is resumed.
    category: campaigns
    request:
      method: PUT
      path: /3/campaigns/${campaign_id}/pause
      headers:
        Content-Type: application/json
    input:
      campaign_id:
        type: integer
        description: The campaign to pause.
    output:
      description: The campaign's new state.
      type: object
      properties:
        campaign: {type: object}

  resume_campaign:
    title: Resume a paused campaign
    description: Restart a paused campaign, continuing from where its queue stopped.
    category: campaigns
    request:
      method: PUT
      path: /3/campaigns/${campaign_id}/resume
      headers:
        Content-Type: application/json
    input:
      campaign_id:
        type: integer
        description: The campaign to resume.
    output:
      description: The campaign's new state.
      type: object
      properties:
        campaign: {type: object}

  stop_campaign:
    title: Stop a campaign
    description: >-
      Stop a campaign for good. Unlike pausing, the remaining queue is
      abandoned rather than held, so the contacts not yet sent to never receive
      it.
    category: campaigns
    destructive: true
    request:
      method: PUT
      path: /3/campaigns/${campaign_id}/stop
      headers:
        Content-Type: application/json
    input:
      campaign_id:
        type: integer
        description: The campaign to stop.
    output:
      description: The campaign's new state.
      type: object
      properties:
        campaign: {type: object}

  get_campaign_report_totals:
    title: Get a campaign's report totals
    description: >-
      Sends, opens, clicks, bounces, unsubscribes and forwards for a campaign,
      optionally for one message variant and one date range. `include_bots`
      decides whether machine opens are counted.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/campaigns/${campaign_id}/reportTotals
      query:
        messageId: "${message_id}"
        startDate: "${start_date}"
        endDate: "${end_date}"
        includeBots: "${include_bots}"
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
      message_id:
        type: integer
        description: Only this message variant, for a split campaign.
        optional: true
      start_date:
        type: string
        description: Start of the reporting window.
        optional: true
      end_date:
        type: string
        description: End of the reporting window.
        optional: true
      include_bots:
        type: boolean
        description: Count opens attributed to bots and scanners.
        optional: true
    output:
      description: The campaign's totals.
      type: object
      properties:
        reportTotals: {type: object}

  get_campaign_links:
    title: Get a campaign's links
    description: >-
      The links inside a campaign with their click counts -- which is how you
      tell what people actually clicked rather than just that they clicked.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/campaigns/${campaign_id}/links
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
    output:
      description: The campaign's links.
      type: object
      properties:
        links: {type: array}

  get_campaign_messages:
    title: Get a campaign's per-message totals
    description: >-
      Reporting totals per message: one entry for a regular campaign, one per
      variant for a split test -- the only way to break a split campaign's
      results down by variant. These are lifetime totals and cannot be date
      limited.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/campaigns/${campaign_id}/campaignMessages
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
    output:
      description: The campaign's per-message totals.
      type: object
      properties:
        campaignMessages: {type: array}

  send_campaign_test:
    title: Send a test of a campaign
    description: >-
      Send one campaign message to a single address, with a subject of your
      choosing. Prefix the address with "+" to route it through the regular mail
      server rather than the test one -- worth doing when checking deliverability
      rather than just content.
    category: campaigns
    request:
      method: POST
      path: /3/campaigns/test-send
      body:
        campaignId: "${campaign_id}"
        messageId: "${message_id}"
        subject: "${subject}"
        toEmail: "${to_email}"
    input:
      campaign_id:
        type: integer
        description: The campaign to test.
      message_id:
        type: integer
        description: Which message to send. For a split campaign this picks the variant.
      subject:
        type: string
        description: Subject line for the test send.
      to_email:
        type: string
        description: Where to send the test. Prefix with + to use the regular mail server.
        example: qa@example.com
    output:
      description: The result of the test send.
      type: object
      properties:
        success: {type: integer}

  preview_campaign_message:
    title: Preview a campaign message
    description: >-
      Render a campaign message as one contact would see it, personalisation
      included, without sending anything -- the safe way to check merge tags.
    category: campaigns
    read_only: true
    request:
      method: POST
      path: /3/campaigns/test-preview
      body:
        campaignId: "${campaign_id}"
        messageId: "${message_id}"
        toEmail: "${to_email}"
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
      message_id:
        type: integer
        description: The message to preview.
      to_email:
        type: string
        description: Address whose contact record the preview is personalised for.
        example: ada@example.com
    output:
      description: The rendered message.
      type: object
      properties:
        preview: {type: object}

  get_campaign_message_source:
    title: Get a campaign message's source
    description: >-
      The rendered source of one campaign message, optionally personalised for
      an address and in a chosen format -- for archiving what was actually
      sent.
    category: campaigns
    read_only: true
    request:
      method: GET
      path: /3/message/source
      query:
        campaignId: "${campaign_id}"
        messageId: "${message_id}"
        email: "${email}"
        type: "${type}"
        structured: "${structured}"
    input:
      campaign_id:
        type: integer
        description: The campaign's id.
      message_id:
        type: integer
        description: The message's id.
      email:
        type: string
        description: Address to personalise the source for.
        optional: true
      type:
        type: string
        description: Which part to return, e.g. html or text.
        optional: true
      structured:
        type: boolean
        description: Return the source broken into parts rather than as one blob.
        optional: true
    output:
      description: The message source.
      type: object
      properties:
        source: {type: string}

  create_campaign_message:
    title: Attach a message to a campaign
    description: >-
      Link a message to a campaign, with an optional percentage share of the
      audience -- which is how a split (A/B) campaign divides its recipients
      between variants.
    category: campaigns
    request:
      method: POST
      path: /3/campaignMessages
      body:
        campaignMessage:
          campaignid: "${campaign_id}"
          messageid: "${message_id}"
          percentage: "${percentage}"
    input:
      campaign_id:
        type: integer
        description: The campaign to attach the message to.
      message_id:
        type: integer
        description: The message being attached.
        optional: true
      percentage:
        type: integer
        description: Share of recipients this variant is sent to, for a split campaign.
        optional: true
        minimum: 0
        maximum: 100
    output:
      description: The link that was created.
      type: object
      properties:
        campaignMessage: {type: object}

  update_campaign_message:
    title: Update a campaign's message link
    description: >-
      Change which message a campaign sends, or a variant's share of the
      audience in a split test.
    category: campaigns
    request:
      method: PUT
      path: /3/campaignMessages/${campaign_message_id}
      body:
        campaignMessage:
          campaignid: "${campaign_id}"
          messageid: "${message_id}"
          percentage: "${percentage}"
    input:
      campaign_message_id:
        type: integer
        description: The campaign-message link's id.
      campaign_id:
        type: integer
        description: The campaign the link belongs to.
        optional: true
      message_id:
        type: integer
        description: The message the campaign should send.
        optional: true
      percentage:
        type: integer
        description: Share of recipients for this variant.
        optional: true
        minimum: 0
        maximum: 100
    output:
      description: The updated link.
      type: object
      properties:
        campaignMessage: {type: object}

  delete_campaign_message:
    title: Detach a message from a campaign
    description: >-
      Remove a message from a campaign. The message itself survives; the
      campaign stops sending it, which for a split test drops that variant.
    category: campaigns
    destructive: true
    request:
      method: DELETE
      path: /3/campaignMessages/${campaign_message_id}
    input:
      campaign_message_id:
        type: integer
        description: The campaign-message link's id.
    output:
      description: Empty on success.
      type: object

  list_messages:
    title: List messages
    description: >-
      The account's email messages -- the reusable content blocks campaigns and
      automations send -- with their subjects and senders.
    category: messages
    read_only: true
    request:
      method: GET
      path: /3/messages
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many messages to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many messages to skip.
        optional: true
        minimum: 0
    output:
      description: The account's messages.
      type: object
      properties:
        messages: {type: array}
        meta: {type: object}

  get_message:
    title: Get a message
    description: One message by id, with its sender details, subject and HTML and text bodies.
    category: messages
    read_only: true
    request:
      method: GET
      path: /3/messages/${message_id}
    input:
      message_id:
        type: integer
        description: The message's id.
    output:
      description: The message.
      type: object
      properties:
        message: {type: object}

  create_message:
    title: Create a message
    description: >-
      Create an email message for campaigns or automations to send. Sender
      name, sender address and reply-to are all required; supply html, text or
      both.
    category: messages
    request:
      method: POST
      path: /3/messages
      body:
        message:
          fromname: "${from_name}"
          fromemail: "${from_email}"
          reply2: "${reply_to}"
          subject: "${subject}"
          preheader_text: "${preheader_text}"
          name: "${name}"
          text: "${text}"
          html: "${html}"
    input:
      from_name:
        type: string
        description: Sender name recipients see.
        example: Acme Product Team
      from_email:
        type: string
        description: Sender address the message comes from.
        format: email
        example: product@example.com
      reply_to:
        type: string
        description: Address replies go to.
        format: email
        example: support@example.com
      subject:
        type: string
        description: Subject line.
        optional: true
      preheader_text:
        type: string
        description: Preview text shown after the subject in most inboxes.
        optional: true
      name:
        type: string
        description: Internal name for the message.
        optional: true
      text:
        type: string
        description: Plain-text body.
        optional: true
      html:
        type: string
        description: HTML body.
        optional: true
    output:
      description: The message that was created.
      type: object
      properties:
        message: {type: object}

  update_message:
    title: Update a message
    description: >-
      Change a message's sender, subject or content. A message already sent by a
      campaign is not rewritten retrospectively -- only future sends change.
    category: messages
    request:
      method: PUT
      path: /3/messages/${message_id}
      body:
        message:
          fromname: "${from_name}"
          fromemail: "${from_email}"
          reply2: "${reply_to}"
          subject: "${subject}"
          preheader_text: "${preheader_text}"
          name: "${name}"
          text: "${text}"
          html: "${html}"
    input:
      message_id:
        type: integer
        description: The message's id.
      from_name:
        type: string
        description: New sender name.
        optional: true
      from_email:
        type: string
        description: New sender address.
        optional: true
        format: email
      reply_to:
        type: string
        description: New reply-to address.
        optional: true
        format: email
      subject:
        type: string
        description: New subject line.
        optional: true
      preheader_text:
        type: string
        description: New preview text.
        optional: true
      name:
        type: string
        description: New internal name.
        optional: true
      text:
        type: string
        description: New plain-text body.
        optional: true
      html:
        type: string
        description: New HTML body.
        optional: true
    output:
      description: The updated message.
      type: object
      properties:
        message: {type: object}

  delete_message:
    title: Delete a message
    description: >-
      Delete a message. Campaigns and automations that send it lose their
      content, so check what references it first.
    category: messages
    destructive: true
    request:
      method: DELETE
      path: /3/messages/${message_id}
    input:
      message_id:
        type: integer
        description: The message's id.
    output:
      description: Empty on success.
      type: object

  list_templates:
    title: List email templates
    description: >-
      The account's email templates, filterable by name, category, designer
      version or tag. Templates are the starting points campaigns are built
      from.
    category: templates
    read_only: true
    request:
      method: GET
      path: /3/templates
      query:
        "filters[name]": "${name}"
        "filters[categoryid]": "${category_id}"
        "filters[tagid]": "${tag_id}"
        "filters[ed_version]": "${designer_version}"
        "filters[hidden]": "${hidden}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only templates whose name matches this.
        optional: true
      category_id:
        type: integer
        description: Only templates in this category.
        optional: true
      tag_id:
        type: integer
        description: Only templates carrying this tag.
        optional: true
      designer_version:
        type: integer
        description: Designer version -- 1 legacy, 2 current, 3 new.
        optional: true
        enum: [1, 2, 3]
      hidden:
        type: integer
        description: 1 for templates hidden from the gallery.
        optional: true
        enum: [0, 1]
      limit:
        type: integer
        description: How many templates to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many templates to skip.
        optional: true
        minimum: 0
    output:
      description: The account's templates.
      type: object
      properties:
        templates: {type: array}
        meta: {type: object}

  get_template:
    title: Get an email template
    description: One template by id, with its HTML content, default subject and category.
    category: templates
    read_only: true
    request:
      method: GET
      path: /3/templates/${template_id}
    input:
      template_id:
        type: integer
        description: The template's id.
    output:
      description: The template.
      type: object
      properties:
        template: {type: object}

  create_template:
    title: Create an email template
    description: >-
      Create a template from HTML. `designer_version` decides which editor can
      open it afterwards -- 2 is the current designer, 3 the new one -- so pick
      it deliberately if people will edit the template by hand.
    category: templates
    request:
      method: POST
      path: /3/templates
      body:
        template:
          name: "${name}"
          subject: "${subject}"
          content: "${content}"
          categoryid: "${category_id}"
          userid: "${owner_user_id}"
          ed_version: "${designer_version}"
          hidden: "${hidden}"
          additional_data: "${additional_data}"
    input:
      name:
        type: string
        description: Name of the template.
        example: Monthly newsletter shell
      subject:
        type: string
        description: Default subject applied to campaigns built from this template.
        optional: true
      content:
        type: string
        description: The template's HTML.
        optional: true
      category_id:
        type: integer
        description: Template category to file it under.
        optional: true
      owner_user_id:
        type: integer
        description: >-
          Owning user. Defaults to the authenticated user; assigning another
          needs sharing permission.
        optional: true
      designer_version:
        type: integer
        description: Designer version -- 1 legacy, 2 current, 3 new.
        optional: true
        enum: [1, 2, 3]
      hidden:
        type: integer
        description: 1 to hide the template from the gallery.
        optional: true
        enum: [0, 1]
      additional_data:
        type: object
        description: Free-form metadata stored with the template.
        optional: true
    output:
      description: The template that was created.
      type: object
      properties:
        template: {type: object}

  update_template:
    title: Update an email template
    description: >-
      Change a template's name, subject, content or category. Campaigns already
      built from it are not retrofitted.
    category: templates
    request:
      method: PUT
      path: /3/templates/${template_id}
      body:
        template:
          name: "${name}"
          subject: "${subject}"
          content: "${content}"
          categoryid: "${category_id}"
          userid: "${owner_user_id}"
          ed_version: "${designer_version}"
          hidden: "${hidden}"
          additional_data: "${additional_data}"
    input:
      template_id:
        type: integer
        description: The template's id.
      name:
        type: string
        description: New name.
        optional: true
      subject:
        type: string
        description: New default subject.
        optional: true
      content:
        type: string
        description: New HTML content.
        optional: true
      category_id:
        type: integer
        description: New template category.
        optional: true
      owner_user_id:
        type: integer
        description: New owning user.
        optional: true
      designer_version:
        type: integer
        description: Designer version -- 1 legacy, 2 current, 3 new.
        optional: true
        enum: [1, 2, 3]
      hidden:
        type: integer
        description: 1 to hide the template from the gallery.
        optional: true
        enum: [0, 1]
      additional_data:
        type: object
        description: Free-form metadata stored with the template.
        optional: true
    output:
      description: The updated template.
      type: object
      properties:
        template: {type: object}

  delete_template:
    title: Delete an email template
    description: >-
      Delete a template. Campaigns already built from it keep their content --
      only the reusable starting point goes.
    category: templates
    destructive: true
    request:
      method: DELETE
      path: /3/templates/${template_id}
    input:
      template_id:
        type: integer
        description: The template's id.
    output:
      description: Empty on success.
      type: object

  # -- automations -----------------------------------------------------------

  list_automations:
    title: List automations
    description: >-
      The account's automations with their status and entry counts. The ids
      here are what adding a contact to an automation takes.
    category: automations
    read_only: true
    request:
      method: GET
      path: /3/automations
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many automations to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many automations to skip.
        optional: true
        minimum: 0
    output:
      description: The account's automations.
      type: object
      properties:
        automations: {type: array}
        meta: {type: object}

  get_automation:
    title: Get an automation
    description: >-
      One automation by id, with its status, entry and exit counts and when it
      was last changed.
    category: automations
    read_only: true
    request:
      method: GET
      path: /3/automations/${automation_id}
    input:
      automation_id:
        type: integer
        description: The automation's id.
    output:
      description: The automation.
      type: object
      properties:
        automation: {type: object}

  list_automation_contacts:
    title: List an automation's contacts
    description: >-
      The contacts currently in, or that have run through, one automation --
      the paginated equivalent of filtering contact-automations by series id.
      Filter by status to separate active from completed.
    category: automations
    read_only: true
    request:
      method: GET
      path: /3/automations/${automation_id}/contactAutomations
      query:
        "filters[status]": "${status}"
        "filters[subscriberid]": "${contact_id}"
        "orders[adddate]": "${order_by_added}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      automation_id:
        type: integer
        description: The automation's series id.
      status:
        type: integer
        description: Membership status -- 1 active, 2 completed.
        optional: true
      contact_id:
        type: integer
        description: Only this contact's membership.
        optional: true
      order_by_added:
        type: string
        description: Sort by when the contact entered.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many memberships to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many memberships to skip.
        optional: true
        minimum: 0
    output:
      description: The automation's contact memberships.
      type: object
      properties:
        contactAutomations: {type: array}
        meta: {type: object}

  list_contact_automation_memberships:
    title: List contact-automation memberships
    description: >-
      Every contact-automation membership in the account, filterable by
      automation, contact, status or the block a contact is waiting at.
    category: automations
    read_only: true
    request:
      method: GET
      path: /3/contactAutomations
      query:
        "filters[seriesid]": "${automation_id}"
        "filters[subscriberid]": "${contact_id}"
        "filters[status]": "${status}"
        "filters[lastblock]": "${last_block}"
        "orders[adddate]": "${order_by_added}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      automation_id:
        type: integer
        description: Only memberships of this automation.
        optional: true
      contact_id:
        type: integer
        description: Only memberships of this contact.
        optional: true
      status:
        type: integer
        description: Membership status -- 1 active, 2 completed.
        optional: true
      last_block:
        type: integer
        description: Only contacts sitting at this automation block.
        optional: true
      order_by_added:
        type: string
        description: Sort by when the contact entered.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many memberships to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many memberships to skip.
        optional: true
        minimum: 0
    output:
      description: The matching memberships.
      type: object
      properties:
        contactAutomations: {type: array}
        meta: {type: object}

  get_contact_automation_membership:
    title: Get a contact-automation membership
    description: >-
      One membership by id, showing which automation the contact is in, where
      they have reached and when they entered.
    category: automations
    read_only: true
    request:
      method: GET
      path: /3/contactAutomations/${contact_automation_id}
    input:
      contact_automation_id:
        type: integer
        description: The membership's id.
    output:
      description: The membership.
      type: object
      properties:
        contactAutomation: {type: object}

  add_contact_to_automation:
    title: Add a contact to an automation
    description: >-
      Start a contact through an automation. Whatever the automation does --
      emails, tags, deals, webhooks -- begins from this call, so it has real
      side effects beyond the record it creates.
    category: automations
    request:
      method: POST
      path: /3/contactAutomations
      body:
        contactAutomation:
          contact: "${contact_id}"
          automation: "${automation_id}"
    input:
      contact_id:
        type: integer
        description: The contact to add.
      automation_id:
        type: integer
        description: The automation to add them to.
    output:
      description: The membership that was created.
      type: object
      properties:
        contactAutomation: {type: object}

  remove_contact_from_automation:
    title: Remove a contact from an automation
    description: >-
      Take a contact out of an automation, addressed by the membership id. Any
      steps they had not reached will not run.
    category: automations
    destructive: true
    request:
      method: DELETE
      path: /3/contactAutomations/${contact_automation_id}
    input:
      contact_automation_id:
        type: integer
        description: The membership's id.
    output:
      description: Empty on success.
      type: object

  # -- segments --------------------------------------------------------------

  list_segments:
    title: List segments
    description: >-
      The account's segments -- saved audience definitions campaigns and
      automations target. Their ids are what `list_contacts`'s `segment_id`
      takes.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/segments
      query:
        ids: "${ids}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      ids:
        type: string
        description: Comma-separated segment ids to fetch.
        optional: true
      limit:
        type: integer
        description: How many segments to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many segments to skip.
        optional: true
        minimum: 0
    output:
      description: The account's segments.
      type: object
      properties:
        segments: {type: array}
        meta: {type: object}

  get_segment:
    title: Get a segment
    description: One segment by id, with its name and the conditions behind it.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/segments/${segment_id}
    input:
      segment_id:
        type: integer
        description: The segment's id.
    output:
      description: The segment.
      type: object
      properties:
        segment: {type: object}

  list_saved_segment_summaries:
    title: List saved segment summaries
    description: >-
      Summaries of the account's saved segments (audiences), with their most
      recent counts -- how to see a segment's size without running it again.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/audiences
      query:
        page: "${page}"
        page_size: "${page_size}"
        sort: "${sort}"
        search: "${search}"
    input:
      page:
        type: integer
        description: Which page of summaries to return.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: How many summaries per page.
        optional: true
        minimum: 1
      sort:
        type: string
        description: Sort order for the summaries, as the endpoint documents it.
        optional: true
      search:
        type: string
        description: Only segments whose name matches this.
        optional: true
    output:
      description: The saved segment summaries.
      type: object
      properties:
        data: {type: array}
        meta: {type: object}

  get_saved_segment_summary:
    title: Get a saved segment's summary
    description: >-
      One saved segment's summary, including its latest count and when that
      count was produced.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/audiences/${segment_id}
    input:
      segment_id:
        type: string
        description: The segment's id.
    output:
      description: The segment summary.
      type: object
      properties:
        data: {type: object}

  create_segment_v2:
    title: Create a segment
    description: >-
      Create a segment from condition groups. The payload is the v2 segment
      definition: condition groups combined by an and/or operator, each holding
      conditions over contact fields, activity and membership. Fetch an existing
      segment with `get_segment_v2` first if you want a shape to copy.
    category: segments
    request:
      method: POST
      path: /3/segmentsV2
      body:
        data: "${data}"
    input:
      data:
        type: array
        description: >-
          The segment definition, as the v2 endpoint declares it -- each entry
          carrying `attributes` with segment_condition_group_operator,
          segment_condition_groups and segment_conditions.
        items: {type: object}
    output:
      description: The segment that was created.
      type: object
      properties:
        data: {type: object}

  get_segment_v2:
    title: Get a segment definition
    description: >-
      One segment's full v2 definition -- its condition groups and conditions --
      which is both how you inspect it and the shape an update must send back.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/segmentsV2/${segment_id}
    input:
      segment_id:
        type: string
        description: The segment's id.
    output:
      description: The segment definition.
      type: object
      properties:
        data: {type: object}

  update_segment_v2:
    title: Update a segment definition
    description: >-
      Replace a segment's conditions. Segments feed campaigns and automations,
      so widening one changes who gets mailed on the next send.
    category: segments
    request:
      method: PUT
      path: /3/segmentsV2/${segment_id}
      body:
        data: "${data}"
    input:
      segment_id:
        type: string
        description: The segment's id.
      data:
        type: object
        description: The new segment definition, in the same shape `get_segment_v2` returns.
    output:
      description: The updated segment.
      type: object
      properties:
        data: {type: object}

  delete_segment_v2:
    title: Delete a segment
    description: >-
      Delete a segment and its historic versions. Campaigns and automations
      that target it lose their audience.
    category: segments
    destructive: true
    request:
      method: DELETE
      path: /3/segmentsV2/${segment_id}
    input:
      segment_id:
        type: string
        description: The segment's id.
    output:
      description: Empty on success.
      type: object

  get_segment_historic_definition:
    title: Get a segment's historic definition
    description: >-
      What a segment's conditions were at a point in time -- the record to read
      when a campaign's audience looks different from today's segment.
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/segmentsV2/${segment_id}/createdDate/${timestamp}
    input:
      segment_id:
        type: string
        description: The segment's id.
      timestamp:
        type: string
        description: The version's created timestamp, as returned in the segment's history.
    output:
      description: The historic definition.
      type: object
      properties:
        data: {type: object}

  revert_segment_to_version:
    title: Revert a segment to an earlier version
    description: >-
      Restore a segment to one of its historic definitions, undoing later
      edits. Anything targeting the segment picks up the reverted conditions.
    category: segments
    request:
      method: PUT
      path: /3/segmentsV2/${segment_id}/createdDate/${timestamp}
      headers:
        Content-Type: application/json
    input:
      segment_id:
        type: string
        description: The segment's id.
      timestamp:
        type: string
        description: Created timestamp of the version to revert to.
    output:
      description: The reverted segment.
      type: object
      properties:
        data: {type: object}

  check_contact_matches_segment:
    title: Check whether a contact matches a segment
    description: >-
      Test one contact against one segment without running the whole segment --
      the cheap way to answer "would this person be included".
    category: segments
    read_only: true
    request:
      method: GET
      path: /3/segmentMatch/${segment_id}/${contact_id}
    input:
      segment_id:
        type: string
        description: The segment to test against.
      contact_id:
        type: string
        description: The contact to test.
    output:
      description: Whether the contact matches.
      type: object
      properties:
        data: {type: object}

  # -- notes -----------------------------------------------------------------

  list_notes:
    title: List notes
    description: >-
      Every note in the account, across contacts, deals, tasks and accounts,
      with what each is attached to.
    category: notes
    read_only: true
    request:
      method: GET
      path: /3/notes
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many notes to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many notes to skip.
        optional: true
        minimum: 0
    output:
      description: The account's notes.
      type: object
      properties:
        notes: {type: array}
        meta: {type: object}

  get_note:
    title: Get a note
    description: One note by id, with its text, author and what it is attached to.
    category: notes
    read_only: true
    request:
      method: GET
      path: /3/notes/${note_id}
    input:
      note_id:
        type: integer
        description: The note's id.
    output:
      description: The note.
      type: object
      properties:
        note: {type: object}

  create_note:
    title: Create a note
    description: >-
      Attach a note to any record: `related_type` says what kind -- Subscriber
      for a contact, Deal, DealTask, CustomerAccount or Activity -- and
      `related_id` is that record's id. A `list_id` scopes the note's webhook to
      that list's subscriptions.
    category: notes
    request:
      method: POST
      path: /3/notes
      body:
        note:
          note: "${note}"
          reltype: "${related_type}"
          relid: "${related_id}"
          listId: "${list_id}"
    input:
      note:
        type: string
        description: The note's text.
        example: Spoke to their ops lead; sending pricing on Monday.
      related_type:
        type: string
        description: What kind of record the note is attached to.
        enum: [Subscriber, Deal, DealTask, CustomerAccount, Activity]
      related_id:
        type: integer
        description: Id of the record the note is attached to.
      list_id:
        type: integer
        description: >-
          List the note is about, which scopes the subscriber_note webhook to
          that list's subscriptions.
        optional: true
    output:
      description: The note that was created.
      type: object
      properties:
        note: {type: object}

  update_note:
    title: Update a note
    description: Rewrite a note's text, addressed by the note's own id.
    category: notes
    request:
      method: PUT
      path: /3/notes/${note_id}
      body:
        note:
          note: "${note}"
    input:
      note_id:
        type: integer
        description: The note's id.
      note:
        type: string
        description: The note's new text.
    output:
      description: The updated note.
      type: object
      properties:
        note: {type: object}

  delete_note:
    title: Delete a note
    description: Delete a note. The record it was attached to is untouched.
    category: notes
    destructive: true
    request:
      method: DELETE
      path: /3/notes/${note_id}
    input:
      note_id:
        type: integer
        description: The note's id.
    output:
      description: Empty on success.
      type: object

  # -- forms and webhooks ----------------------------------------------------

  list_forms:
    title: List forms
    description: >-
      The account's subscription forms, with the lists they feed and their
      submission counts.
    category: forms
    read_only: true
    request:
      method: GET
      path: /3/forms
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many forms to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many forms to skip.
        optional: true
        minimum: 0
    output:
      description: The account's forms.
      type: object
      properties:
        forms: {type: array}
        meta: {type: object}

  get_form:
    title: Get a form
    description: One form by id, with its fields, actions and the lists it subscribes to.
    category: forms
    read_only: true
    request:
      method: GET
      path: /3/forms/${form_id}
    input:
      form_id:
        type: integer
        description: The form's id.
    output:
      description: The form.
      type: object
      properties:
        form: {type: object}

  delete_form:
    title: Delete a form
    description: >-
      Delete a form. Any page still embedding it stops collecting
      subscriptions, so check where it is published first.
    category: forms
    destructive: true
    request:
      method: DELETE
      path: /3/forms/${form_id}
    input:
      form_id:
        type: integer
        description: The form's id.
    output:
      description: Empty on success.
      type: object

  list_webhooks:
    title: List webhooks
    description: >-
      The account's webhooks, with the events each listens for and where it
      posts. Filter by name, URL or list.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /3/webhooks
      query:
        "filters[name]": "${name}"
        "filters[url]": "${url}"
        "filters[listid]": "${list_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only webhooks whose name matches this.
        optional: true
      url:
        type: string
        description: Only webhooks posting to this URL.
        optional: true
      list_id:
        type: integer
        description: Only webhooks scoped to this list.
        optional: true
      limit:
        type: integer
        description: How many webhooks to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many webhooks to skip.
        optional: true
        minimum: 0
    output:
      description: The account's webhooks.
      type: object
      properties:
        webhooks: {type: array}
        meta: {type: object}

  get_webhook:
    title: Get a webhook
    description: One webhook by id, with its events, sources, target URL and headers.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /3/webhooks/${webhook_id}
    input:
      webhook_id:
        type: integer
        description: The webhook's id.
    output:
      description: The webhook.
      type: object
      properties:
        webhook: {type: object}

  create_webhook:
    title: Create a webhook
    description: >-
      Register a webhook. `events` names what fires it and `sources` where the
      change came from -- public (a contact's own action), admin, api, system --
      and leaving a source out means those changes will not notify you, which is
      the usual reason a webhook seems silent.
    category: webhooks
    request:
      method: POST
      path: /3/webhooks
      body:
        webhook:
          name: "${name}"
          url: "${url}"
          events: "${events}"
          sources: "${sources}"
          listid: "${list_id}"
          headers: "${headers}"
    input:
      name:
        type: string
        description: A label for the webhook.
        example: Contact updates to CRM
      url:
        type: string
        description: Where ActiveCampaign posts the event.
        example: https://hooks.example.com/activecampaign
      events:
        type: array
        description: >-
          Events that fire the webhook, e.g. subscribe, unsubscribe,
          contact_update, deal_add. `list_webhook_events` lists them all.
        items: {type: string}
      sources:
        type: array
        description: >-
          Which origins of a change fire the webhook -- typically public, admin,
          api and system.
        items: {type: string}
      list_id:
        type: integer
        description: Only fire for events on this list.
        optional: true
      headers:
        type: array
        description: >-
          Extra headers to send, each with name, value and whether it is a
          signature.
        optional: true
        items:
          type: object
          properties:
            name: {type: string}
            value: {type: string}
            is_signature: {type: boolean}
    output:
      description: The webhook that was created.
      type: object
      properties:
        webhook: {type: object}

  update_webhook:
    title: Update a webhook
    description: >-
      Change a webhook's target, events, sources or headers. Only what you send
      changes.
    category: webhooks
    request:
      method: PUT
      path: /3/webhooks/${webhook_id}
      body:
        webhook:
          name: "${name}"
          url: "${url}"
          events: "${events}"
          sources: "${sources}"
          listid: "${list_id}"
          headers: "${headers}"
    input:
      webhook_id:
        type: integer
        description: The webhook's id.
      name:
        type: string
        description: New label.
        optional: true
      url:
        type: string
        description: New target URL.
        optional: true
      events:
        type: array
        description: Replacement list of events.
        optional: true
        items: {type: string}
      sources:
        type: array
        description: Replacement list of sources.
        optional: true
        items: {type: string}
      list_id:
        type: integer
        description: Only fire for events on this list.
        optional: true
      headers:
        type: array
        description: Replacement extra headers.
        optional: true
        items:
          type: object
          properties:
            name: {type: string}
            value: {type: string}
            is_signature: {type: boolean}
    output:
      description: The updated webhook.
      type: object
      properties:
        webhook: {type: object}

  delete_webhook:
    title: Delete a webhook
    description: >-
      Delete a webhook. Events stop being delivered immediately, so anything
      downstream depending on it goes quiet.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /3/webhooks/${webhook_id}
    input:
      webhook_id:
        type: integer
        description: The webhook's id.
    output:
      description: Empty on success.
      type: object

  list_webhook_events:
    title: List webhook event types
    description: >-
      Every event a webhook can subscribe to. Read this rather than guessing
      event names -- an unknown name is silently unhelpful.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /3/webhook/events
    input: {}
    output:
      description: The available webhook events.
      type: object
      properties:
        webhookEvents: {type: array}

  # -- users, groups and settings -------------------------------------------

  get_current_user:
    title: Get the logged-in user
    description: >-
      Who the API key belongs to, with their id, email and group. Also the
      cheapest call to check that a key works, which is why the connector's own
      verification uses it.
    category: users
    read_only: true
    request:
      method: GET
      path: /3/users/me
    input: {}
    output:
      description: The authenticated user.
      type: object
      properties:
        user: {type: object}

  list_users:
    title: List users
    description: The account's users, with their names, emails and group membership.
    category: users
    read_only: true
    request:
      method: GET
      path: /3/users
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many users to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many users to skip.
        optional: true
        minimum: 0
    output:
      description: The account's users.
      type: object
      properties:
        users: {type: array}
        meta: {type: object}

  get_user:
    title: Get a user
    description: One user by id, with their name, email, username and group.
    category: users
    read_only: true
    request:
      method: GET
      path: /3/users/${user_id}
    input:
      user_id:
        type: integer
        description: The user's id.
    output:
      description: The user.
      type: object
      properties:
        user: {type: object}

  get_user_by_email:
    title: Get a user by email
    description: >-
      Look a user up by their email address -- the lookup to use when an
      integration knows the address but not the id.
    category: users
    read_only: true
    request:
      method: GET
      path: /3/users/email/${email}
    input:
      email:
        type: string
        description: The user's email address.
        format: email
        example: rep@example.com
    output:
      description: The user.
      type: object
      properties:
        user: {type: object}

  get_user_by_username:
    title: Get a user by username
    description: Look a user up by their ActiveCampaign username rather than their id.
    category: users
    read_only: true
    request:
      method: GET
      path: /3/users/username/${username}
    input:
      username:
        type: string
        description: The user's username.
        example: arep
    output:
      description: The user.
      type: object
      properties:
        user: {type: object}

  create_user:
    title: Create a user
    description: >-
      Add a user to the account. The group decides what they can do, so pick it
      deliberately -- `list_groups` shows the permissions each group carries.
    category: users
    request:
      method: POST
      path: /3/users
      body:
        user:
          username: "${username}"
          email: "${email}"
          firstName: "${first_name}"
          lastName: "${last_name}"
          group: "${group_id}"
          password: "${password}"
    input:
      email:
        type: string
        description: The user's email address, which they sign in with.
        format: email
        example: rep@example.com
      username:
        type: string
        description: Username for the new user.
        optional: true
      first_name:
        type: string
        description: The user's first name.
        optional: true
      last_name:
        type: string
        description: The user's last name.
        optional: true
      group_id:
        type: integer
        description: Group the user belongs to, which sets their permissions.
        optional: true
      password:
        type: string
        description: Initial password, in plain text.
        optional: true
        secret: true
    output:
      description: The user that was created.
      type: object
      properties:
        user: {type: object}

  update_user:
    title: Update a user
    description: >-
      Change a user's name, email, group or password. Changing the group changes
      what they can see and do immediately.
    category: users
    request:
      method: PUT
      path: /3/users/${user_id}
      body:
        user:
          username: "${username}"
          email: "${email}"
          firstName: "${first_name}"
          lastName: "${last_name}"
          group: "${group_id}"
          password: "${password}"
    input:
      user_id:
        type: integer
        description: The user's id.
      username:
        type: string
        description: New username.
        optional: true
      email:
        type: string
        description: New email address.
        optional: true
        format: email
      first_name:
        type: string
        description: New first name.
        optional: true
      last_name:
        type: string
        description: New last name.
        optional: true
      group_id:
        type: integer
        description: New group, which changes the user's permissions.
        optional: true
      password:
        type: string
        description: New password, in plain text.
        optional: true
        secret: true
    output:
      description: The updated user.
      type: object
      properties:
        user: {type: object}

  delete_user:
    title: Delete a user
    description: >-
      Remove a user from the account. Their access ends at once; records they
      own stay but are left unassigned.
    category: users
    destructive: true
    request:
      method: DELETE
      path: /3/users/${user_id}
    input:
      user_id:
        type: integer
        description: The user's id.
    output:
      description: Empty on success.
      type: object

  create_single_sign_on_token:
    title: Create a single sign-on token for a user
    description: >-
      Mint a short-lived token that signs a user straight into ActiveCampaign
      from your own app. Bind it to the browser's IP address -- or "__self" to
      bind it to the caller's -- and keep the duration short; it is a
      credential, not a link.
    category: users
    request:
      method: POST
      path: /3/users/${user_id}/singleSignOn
      body:
        singleSignOn:
          ipAddress: "${ip_address}"
          duration: "${duration_minutes}"
    input:
      user_id:
        type: integer
        description: The user the token signs in.
      ip_address:
        type: string
        description: >-
          IP address the token may be spent from -- the browser's address, or
          "__self" to bind it to the caller's.
        example: __self
      duration_minutes:
        type: integer
        description: How long the token stays valid, 1 to 1440 minutes. Defaults to 15.
        optional: true
        minimum: 1
        maximum: 1440
    output:
      description: The single sign-on token.
      type: object
      properties:
        singleSignOn: {type: object}

  list_groups:
    title: List user groups
    description: >-
      The account's user groups with the permissions each carries -- which is
      what a user's `group_id` actually decides.
    category: groups
    read_only: true
    request:
      method: GET
      path: /3/groups
      query:
        "filters[title]": "${title}"
        search: "${search}"
        "orders[title]": "${order_by_title}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      title:
        type: string
        description: Only groups whose title matches this.
        optional: true
      search:
        type: string
        description: Free-text search across group titles.
        optional: true
      order_by_title:
        type: string
        description: Sort by group title.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many groups to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many groups to skip.
        optional: true
        minimum: 0
    output:
      description: The account's user groups.
      type: object
      properties:
        groups: {type: array}
        meta: {type: object}

  get_group:
    title: Get a user group
    description: One user group by id, with every permission flag it sets.
    category: groups
    read_only: true
    request:
      method: GET
      path: /3/groups/${group_id}
    input:
      group_id:
        type: integer
        description: The group's id.
    output:
      description: The user group.
      type: object
      properties:
        group: {type: object}

  create_group:
    title: Create a user group
    description: >-
      Create a user group. Beyond the title, the group is a set of permission
      flags -- pass them in `permissions` using the provider's own pg* names,
      which `get_group` shows for an existing group.
    category: groups
    request:
      method: POST
      path: /3/groups
      body:
        group:
          title: "${title}"
          descript: "${description}"
          unsubscribelink: "${force_unsubscribe_link}"
          optinconfirm: "${force_optin_confirm}"
    input:
      title:
        type: string
        description: Title of the group.
        example: Sales reps
      description:
        type: string
        description: What the group is for.
        optional: true
      force_unsubscribe_link:
        type: boolean
        description: Force unsubscribe links in this group's campaigns.
        optional: true
      force_optin_confirm:
        type: boolean
        description: Force opt-in confirmation for this group's lists.
        optional: true
    output:
      description: The group that was created.
      type: object
      properties:
        group: {type: object}

  update_group:
    title: Update a user group
    description: >-
      Change a group's title, description or compliance settings. Members feel
      permission changes immediately.
    category: groups
    request:
      method: PUT
      path: /3/groups/${group_id}
      body:
        group:
          title: "${title}"
          descript: "${description}"
          unsubscribelink: "${force_unsubscribe_link}"
          optinconfirm: "${force_optin_confirm}"
    input:
      group_id:
        type: integer
        description: The group's id.
      title:
        type: string
        description: New title.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      force_unsubscribe_link:
        type: boolean
        description: Force unsubscribe links in this group's campaigns.
        optional: true
      force_optin_confirm:
        type: boolean
        description: Force opt-in confirmation for this group's lists.
        optional: true
    output:
      description: The updated group.
      type: object
      properties:
        group: {type: object}

  delete_group:
    title: Delete a user group
    description: >-
      Delete a user group. Users in it lose their permission set, so move them
      first.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /3/groups/${group_id}
    input:
      group_id:
        type: integer
        description: The group's id.
    output:
      description: Empty on success.
      type: object

  bulk_delete_groups:
    title: Delete a range of user groups
    description: >-
      Delete the groups whose ids fall in a range. Both bounds are required, and
      the users in those groups lose their permissions.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /3/group/bulk_delete
      query:
        from: "${from_id}"
        to: "${to_id}"
    input:
      from_id:
        type: integer
        description: First group id in the range.
      to_id:
        type: integer
        description: Last group id in the range.
    output:
      description: The result of the bulk delete.
      type: object

  list_group_limits:
    title: List group sending limits
    description: >-
      The sending limits configured per user group -- how many contacts or
      campaigns each may send, which is what a group hitting a cap runs into.
    category: groups
    read_only: true
    request:
      method: GET
      path: /3/groupLimits
    input: {}
    output:
      description: The group sending limits.
      type: object
      properties:
        groupLimits: {type: array}

  grant_group_list_permission:
    title: Give a group access to a list
    description: >-
      Let one user group work with one list. Without this a group's users cannot
      see the list at all, which is the usual cause of a list that seems to have
      vanished for some staff.
    category: groups
    request:
      method: POST
      path: /3/listGroups
      body:
        listGroup:
          listid: "${list_id}"
          groupid: "${group_id}"
    input:
      list_id:
        type: integer
        description: The list to grant access to.
      group_id:
        type: integer
        description: The user group being granted access.
    output:
      description: The permission that was created.
      type: object
      properties:
        listGroup: {type: object}

  get_account_settings:
    title: Get account settings
    description: >-
      The calling user's profile and the account-wide settings -- name, email,
      timezone, language and the date and time formats.
    category: settings
    read_only: true
    request:
      method: GET
      path: /3/settings/account
    input: {}
    output:
      description: The account settings.
      type: object
      properties:
        settings: {type: object}

  update_account_settings:
    title: Update account settings
    description: >-
      Change the calling user's profile and, as an administrator, the
      account-wide date and time formats. Name, login email, timezone and
      language are all required on every call, so read the current settings
      first and send them back with your changes. Setting `new_password` also
      requires `current_password`.
    category: settings
    request:
      method: POST
      path: /3/settings/account
      body:
        firstName: "${first_name}"
        lastName: "${last_name}"
        loginEmail: "${login_email}"
        timezone: "${timezone}"
        language: "${language}"
        notificationEmail: "${notification_email}"
        phoneNumber: "${phone_number}"
        signature: "${signature}"
        currentPassword: "${current_password}"
        newPassword: "${new_password}"
        dateFormat: "${date_format}"
        timeFormat: "${time_format}"
        dateTimeFormat: "${date_time_format}"
    input:
      first_name:
        type: string
        description: The calling user's first name. Required; no quotes.
      last_name:
        type: string
        description: The calling user's last name. Required; no double quotes.
      login_email:
        type: string
        description: The address the calling user signs in with.
        format: email
      timezone:
        type: string
        description: The calling user's timezone. Must be one ActiveCampaign supports.
        example: America/Chicago
      language:
        type: string
        description: Language the interface is shown in.
        example: en
      notification_email:
        type: string
        description: Where the calling user's notifications are sent.
        optional: true
        format: email
      phone_number:
        type: string
        description: The calling user's phone number, in international format.
        optional: true
      signature:
        type: string
        description: The calling user's email signature. May contain HTML.
        optional: true
      current_password:
        type: string
        description: The current password. Required when setting `new_password`.
        optional: true
        secret: true
      new_password:
        type: string
        description: A new password. Must differ from the current one and meet the account's policy.
        optional: true
        secret: true
      date_format:
        type: string
        description: Account-wide date format, as a PHP date format string. Administrators only.
        optional: true
      time_format:
        type: string
        description: Account-wide time format. Administrators only.
        optional: true
      date_time_format:
        type: string
        description: Account-wide combined date and time format. Administrators only.
        optional: true
    output:
      description: The updated settings.
      type: object
      properties:
        settings: {type: object}

  get_api_credentials:
    title: Get API credentials
    description: >-
      The account's API URL and the calling user's key. Read-only, and the
      response is a credential -- treat it as one.
    category: settings
    read_only: true
    request:
      method: GET
      path: /3/settings/developer
    input: {}
    output:
      description: The API credentials.
      type: object
      properties:
        developer: {type: object, description: "The API url and key."}

  reset_api_key:
    title: Reset an API key
    description: >-
      Issue a new API key for the authenticated user, invalidating the old one.
      Every integration using the old key stops working the moment this
      succeeds, this connection included, so have somewhere to put the new key
      before calling it. Only the authenticated user's own id is accepted.
    category: settings
    destructive: true
    request:
      method: POST
      path: /3/settings/developer
      body:
        user: "${user_id}"
    input:
      user_id:
        type: integer
        description: >-
          Id of the user whose key is reset. Must be the authenticated user's
          own id.
    output:
      description: The new credentials.
      type: object
      properties:
        developer: {type: object}

  # -- site and event tracking ----------------------------------------------

  get_site_tracking_status:
    title: Get site tracking status
    description: Whether site tracking is switched on for the account.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/siteTracking
    input: {}
    output:
      description: The site tracking status.
      type: object
      properties:
        siteTracking: {type: object}

  set_site_tracking:
    title: Enable or disable site tracking
    description: >-
      Turn site tracking on or off for the whole account. Turning it off stops
      every behaviour-triggered automation from firing.
    category: tracking
    request:
      method: PUT
      path: /3/siteTracking
      body:
        siteTracking:
          enabled: "${enabled}"
    input:
      enabled:
        type: boolean
        description: True to enable site tracking, false to disable it.
    output:
      description: The new status.
      type: object
      properties:
        siteTracking: {type: object}

  get_site_tracking_code:
    title: Get the site tracking code
    description: >-
      The JavaScript snippet to embed on your site so visits are attributed to
      contacts.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/siteTracking/code
    input: {}
    output:
      description: The tracking snippet.
      type: object
      properties:
        code: {type: string}

  list_site_tracking_domains:
    title: List site tracking domains
    description: >-
      The domains allowed to send site tracking data. A domain missing from
      here is why tracking on it appears to do nothing.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/siteTrackingDomains
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many domains to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many domains to skip.
        optional: true
        minimum: 0
    output:
      description: The whitelisted tracking domains.
      type: object
      properties:
        siteTrackingDomains: {type: array}
        meta: {type: object}

  add_site_tracking_domain:
    title: Add a site tracking domain
    description: >-
      Whitelist a domain for site tracking. Prefix it with * to include
      subdomains.
    category: tracking
    request:
      method: POST
      path: /3/siteTrackingDomains
      body:
        siteTrackingDomain:
          name: "${domain}"
    input:
      domain:
        type: string
        description: Domain to whitelist, optionally prefixed with * for subdomains.
        example: "*example.com"
    output:
      description: The domain that was added.
      type: object
      properties:
        siteTrackingDomain: {type: object}

  remove_site_tracking_domain:
    title: Remove a site tracking domain
    description: >-
      Stop accepting site tracking from a domain. Visits from it stop being
      attributed at once.
    category: tracking
    destructive: true
    request:
      method: DELETE
      path: /3/siteTrackingDomains/${domain}
    input:
      domain:
        type: string
        description: The domain to remove.
    output:
      description: Empty on success.
      type: object

  get_event_tracking_status:
    title: Get event tracking status
    description: Whether event tracking is switched on for the account.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/eventTracking
    input: {}
    output:
      description: The event tracking status.
      type: object
      properties:
        eventTracking: {type: object}

  set_event_tracking:
    title: Enable or disable event tracking
    description: >-
      Turn event tracking on or off. With it off, events posted to the tracking
      collector are ignored and automations waiting on them never fire.
    category: tracking
    request:
      method: PUT
      path: /3/eventTracking
      body:
        eventTracking:
          enabled: "${enabled}"
    input:
      enabled:
        type: boolean
        description: True to enable event tracking, false to disable it.
    output:
      description: The new status.
      type: object
      properties:
        eventTracking: {type: object}

  list_event_types:
    title: List tracked event names
    description: >-
      The event names registered for event tracking. An event has to exist here
      before automations can be triggered by it.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/eventTrackingEvents
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many event names to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many event names to skip.
        optional: true
        minimum: 0
    output:
      description: The registered event names.
      type: object
      properties:
        eventTrackingEvents: {type: array}
        meta: {type: object}

  create_event_type:
    title: Register a tracked event name
    description: >-
      Register an event name so automations can trigger on it. This declares
      the name only -- the events themselves are posted to ActiveCampaign's
      tracking collector, which is a different host and not part of this
      connector.
    category: tracking
    request:
      method: POST
      path: /3/eventTrackingEvents
      body:
        eventTrackingEvent:
          name: "${name}"
    input:
      name:
        type: string
        description: Name of the event to register.
        example: trial_started
    output:
      description: The event name that was registered.
      type: object
      properties:
        eventTrackingEvent: {type: object}

  delete_event_type:
    title: Delete a tracked event name
    description: >-
      Remove a registered event name. Automations triggered by it stop firing,
      and events posted under it are ignored.
    category: tracking
    destructive: true
    request:
      method: DELETE
      path: /3/eventTrackingEvents/${event_name}
    input:
      event_name:
        type: string
        description: The event name to delete.
    output:
      description: Empty on success.
      type: object

  list_email_activities:
    title: List email activities
    description: >-
      Email-level activity -- opens, clicks and replies -- filterable by
      contact or deal, for reconstructing what happened around a conversation.
    category: reporting
    read_only: true
    request:
      method: GET
      path: /3/emailActivities
      query:
        "filters[subscriberid]": "${contact_id}"
        "filters[dealId]": "${deal_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      contact_id:
        type: integer
        description: Only activity for this contact.
        optional: true
      deal_id:
        type: integer
        description: Only activity for this deal.
        optional: true
      limit:
        type: integer
        description: How many records to return, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many records to skip.
        optional: true
        minimum: 0
    output:
      description: The matching email activities.
      type: object
      properties:
        emailActivities: {type: array}
        meta: {type: object}

  list_scores:
    title: List scores
    description: >-
      The lead and engagement scores the account defines, with what each one
      measures -- the key to the numbers `get_contact_score_values` returns.
    category: reporting
    read_only: true
    request:
      method: GET
      path: /3/scores
      query:
        "filters[name]": "${name}"
        "orders[name]": "${order_by_name}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only scores whose name matches this.
        optional: true
      order_by_name:
        type: string
        description: Sort by score name.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many scores to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many scores to skip.
        optional: true
        minimum: 0
    output:
      description: The account's scores.
      type: object
      properties:
        scores: {type: array}
        meta: {type: object}

  get_score:
    title: Get a score
    description: One score by id, with its name and the rules that move it.
    category: reporting
    read_only: true
    request:
      method: GET
      path: /3/scores/${score_id}
    input:
      score_id:
        type: integer
        description: The score's id.
    output:
      description: The score.
      type: object
      properties:
        score: {type: object}

  # -- e-commerce ------------------------------------------------------------

  list_connections:
    title: List e-commerce connections
    description: >-
      The external store connections feeding e-commerce data in, each naming
      the service and the store's id there. Every customer and order belongs to
      one of these.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/connections
      query:
        "filters[service]": "${service}"
        "filters[externalid]": "${external_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      service:
        type: string
        description: Only connections for this service, e.g. shopify.
        optional: true
      external_id:
        type: string
        description: Only the connection whose external store id is this.
        optional: true
      limit:
        type: integer
        description: How many connections to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many connections to skip.
        optional: true
        minimum: 0
    output:
      description: The e-commerce connections.
      type: object
      properties:
        connections: {type: array}
        meta: {type: object}

  get_connection:
    title: Get an e-commerce connection
    description: One connection by id, with its service, external store id and links.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/connections/${connection_id}
    input:
      connection_id:
        type: integer
        description: The connection's id.
    output:
      description: The connection.
      type: object
      properties:
        connection: {type: object}

  create_connection:
    title: Create an e-commerce connection
    description: >-
      Register an external store so orders and customers can be attributed to
      it. Service, the store's external id, its name, a logo URL and a
      management link are all required -- ActiveCampaign shows them in the
      e-commerce UI.
    category: ecommerce
    request:
      method: POST
      path: /3/connections
      body:
        connection:
          service: "${service}"
          externalid: "${external_id}"
          name: "${name}"
          logoUrl: "${logo_url}"
          linkUrl: "${link_url}"
          listId: "${list_id}"
    input:
      service:
        type: string
        description: Name of the external service.
        example: shopify
      external_id:
        type: string
        description: The store's id in that service.
      name:
        type: string
        description: The store's name, usually the company name.
        example: My Toystore, Inc.
      logo_url:
        type: string
        description: URL of a logo for the service.
      link_url:
        type: string
        description: URL where the integration is managed on the third party's site.
      list_id:
        type: string
        description: List that new contacts from this connection are subscribed to.
        optional: true
    output:
      description: The connection that was created.
      type: object
      properties:
        connection: {type: object}

  update_connection:
    title: Update an e-commerce connection
    description: >-
      Change a connection's name, logo, management link or default list. Only
      what you send changes.
    category: ecommerce
    request:
      method: PUT
      path: /3/connections/${connection_id}
      body:
        connection:
          service: "${service}"
          externalid: "${external_id}"
          name: "${name}"
          logoUrl: "${logo_url}"
          linkUrl: "${link_url}"
          listId: "${list_id}"
    input:
      connection_id:
        type: integer
        description: The connection's id.
      service:
        type: string
        description: Name of the external service.
        optional: true
      external_id:
        type: string
        description: The store's id in that service.
        optional: true
      name:
        type: string
        description: New store name.
        optional: true
      logo_url:
        type: string
        description: New logo URL.
        optional: true
      link_url:
        type: string
        description: New management URL.
        optional: true
      list_id:
        type: string
        description: List new contacts from this connection are subscribed to.
        optional: true
    output:
      description: The updated connection.
      type: object
      properties:
        connection: {type: object}

  delete_connection:
    title: Delete an e-commerce connection
    description: >-
      Delete a store connection. The customers and orders attributed to it are
      affected, so this is not a routine cleanup.
    category: ecommerce
    destructive: true
    request:
      method: DELETE
      path: /3/connections/${connection_id}
    input:
      connection_id:
        type: integer
        description: The connection's id.
    output:
      description: Empty on success.
      type: object

  list_ecommerce_customers:
    title: List e-commerce customers
    description: >-
      Store customers, filterable by email, external id or connection. Each ties
      an ActiveCampaign contact to a customer record in one store.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomCustomers
      query:
        "filters[email]": "${email}"
        "filters[externalid]": "${external_id}"
        "filters[connectionid]": "${connection_id}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      email:
        type: string
        description: Only the customer with this email address.
        optional: true
      external_id:
        type: string
        description: Only the customer with this id in the external store.
        optional: true
      connection_id:
        type: integer
        description: Only customers of this connection.
        optional: true
      limit:
        type: integer
        description: How many customers to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many customers to skip.
        optional: true
        minimum: 0
    output:
      description: The matching e-commerce customers.
      type: object
      properties:
        ecomCustomers: {type: array}
        meta: {type: object}

  get_ecommerce_customer:
    title: Get an e-commerce customer
    description: One store customer by id, with their email, connection and order totals.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomCustomers/${customer_id}
    input:
      customer_id:
        type: integer
        description: The customer's id.
    output:
      description: The e-commerce customer.
      type: object
      properties:
        ecomCustomer: {type: object}

  create_ecommerce_customer:
    title: Create an e-commerce customer
    description: >-
      Register a store customer, tying an email address to a customer id in one
      connection. Orders reference this record, so create it before importing a
      customer's orders.
    category: ecommerce
    request:
      method: POST
      path: /3/ecomCustomers
      body:
        ecomCustomer:
          connectionid: "${connection_id}"
          externalid: "${external_id}"
          email: "${email}"
          acceptsMarketing: "${accepts_marketing}"
    input:
      connection_id:
        type: string
        description: Connection the customer belongs to.
      external_id:
        type: string
        description: The customer's id in the external store.
      email:
        type: string
        description: The customer's email address.
        format: email
      accepts_marketing:
        type: string
        description: '"1" if they opted in to marketing, "0" if not.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The customer that was created.
      type: object
      properties:
        ecomCustomer: {type: object}

  update_ecommerce_customer:
    title: Update an e-commerce customer
    description: >-
      Change a store customer's email, connection or marketing consent. Consent
      matters: it is what decides whether marketing may be sent to them.
    category: ecommerce
    request:
      method: PUT
      path: /3/ecomCustomers/${customer_id}
      body:
        ecomCustomer:
          connectionid: "${connection_id}"
          externalid: "${external_id}"
          email: "${email}"
          acceptsMarketing: "${accepts_marketing}"
    input:
      customer_id:
        type: integer
        description: The customer's id.
      connection_id:
        type: string
        description: Connection the customer belongs to.
        optional: true
      external_id:
        type: string
        description: The customer's id in the external store.
        optional: true
      email:
        type: string
        description: New email address.
        optional: true
        format: email
      accepts_marketing:
        type: string
        description: '"1" if they opted in to marketing, "0" if not.'
        optional: true
        enum: ["0", "1"]
    output:
      description: The updated customer.
      type: object
      properties:
        ecomCustomer: {type: object}

  delete_ecommerce_customer:
    title: Delete an e-commerce customer
    description: >-
      Delete a store customer record. The ActiveCampaign contact survives; the
      link to the store's customer does not.
    category: ecommerce
    destructive: true
    request:
      method: DELETE
      path: /3/ecomCustomers/${customer_id}
    input:
      customer_id:
        type: integer
        description: The customer's id.
    output:
      description: Empty on success.
      type: object

  list_ecommerce_orders:
    title: List e-commerce orders
    description: >-
      Store orders, filterable by connection, customer, email, state or
      external id. Note the `state` filter: abandoned carts and completed
      orders live in the same collection.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomOrders
      query:
        "filters[connectionid]": "${connection_id}"
        "filters[customerid]": "${customer_id}"
        "filters[email]": "${email}"
        "filters[externalid]": "${external_id}"
        "filters[externalcheckoutid]": "${external_checkout_id}"
        "filters[state]": "${state}"
        "filters[external_created_date]": "${external_created_date}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      connection_id:
        type: integer
        description: Only orders from this connection.
        optional: true
      customer_id:
        type: integer
        description: Only orders from this store customer.
        optional: true
      email:
        type: string
        description: Only orders placed with this email address.
        optional: true
      external_id:
        type: string
        description: Only the order with this id in the external store.
        optional: true
      external_checkout_id:
        type: string
        description: Only the cart with this checkout id in the external store.
        optional: true
      state:
        type: integer
        description: Order state, which is how abandoned carts are separated from orders.
        optional: true
      external_created_date:
        type: string
        description: Only orders created in the store on this date.
        optional: true
      limit:
        type: integer
        description: How many orders to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many orders to skip.
        optional: true
        minimum: 0
    output:
      description: The matching orders.
      type: object
      properties:
        ecomOrders: {type: array}
        meta: {type: object}

  get_ecommerce_order:
    title: Get an e-commerce order
    description: One store order by id, with its products, totals, customer and state.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomOrders/${order_id}
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The order.
      type: object
      properties:
        ecomOrder: {type: object}

  create_ecommerce_order:
    title: Create an e-commerce order
    description: >-
      Record a store order or an abandoned cart. Send `external_id` for a
      completed order and `external_checkout_id` for a cart -- one of the two is
      required. `source` 1 marks it real-time, which is what puts it on the
      e-commerce dashboard; 0 is a historical import. Prices are in cents.
    category: ecommerce
    request:
      method: POST
      path: /3/ecomOrders
      body:
        ecomOrder:
          externalid: "${external_id}"
          externalcheckoutid: "${external_checkout_id}"
          source: "${source}"
          email: "${email}"
          connectionid: "${connection_id}"
          customerid: "${customer_id}"
          currency: "${currency}"
          totalPrice: "${total_price}"
          externalCreatedDate: "${external_created_date}"
          orderUrl: "${order_url}"
          orderProducts: "${order_products}"
    input:
      email:
        type: string
        description: Email address of the customer who placed the order.
        format: email
      source:
        type: integer
        description: 0 for a historical import, 1 for a real-time order.
        enum: [0, 1]
      external_id:
        type: string
        description: >-
          The order's id in the external store. Required unless
          `external_checkout_id` is given.
        optional: true
      external_checkout_id:
        type: string
        description: >-
          The cart's checkout id in the external store, for an abandoned cart.
          Required unless `external_id` is given.
        optional: true
      connection_id:
        type: string
        description: Connection the order came from.
        optional: true
      customer_id:
        type: string
        description: Store customer who placed the order.
        optional: true
      currency:
        type: string
        description: Three-letter currency code for the order's amounts.
        optional: true
      total_price:
        type: integer
        description: Order total in cents.
        optional: true
        minimum: 0
      external_created_date:
        type: string
        description: When the order was created in the store.
        optional: true
      order_url:
        type: string
        description: URL where the order can be viewed in the store.
        optional: true
      order_products:
        type: array
        description: >-
          The order's line items, each with name, price in cents, quantity and
          the product's external id, plus optional category, sku, description
          and image URL.
        optional: true
        items:
          type: object
          properties:
            name: {type: string}
            price: {type: integer}
            quantity: {type: integer}
            externalid: {type: string}
            category: {type: string}
            sku: {type: string}
            description: {type: string}
            imageUrl: {type: string}
    output:
      description: The order that was created.
      type: object
      properties:
        ecomOrder: {type: object}

  update_ecommerce_order:
    title: Update an e-commerce order
    description: >-
      Change a store order -- its state, totals or line items. Moving a cart to
      a completed order is done here, which is what closes an abandoned-cart
      automation.
    category: ecommerce
    request:
      method: PUT
      path: /3/ecomOrders/${order_id}
      body:
        ecomOrder:
          externalid: "${external_id}"
          email: "${email}"
          currency: "${currency}"
          totalPrice: "${total_price}"
          orderUrl: "${order_url}"
          orderProducts: "${order_products}"
    input:
      order_id:
        type: integer
        description: The order's id.
      external_id:
        type: string
        description: The order's id in the external store.
        optional: true
      email:
        type: string
        description: Email address of the customer.
        optional: true
        format: email
      currency:
        type: string
        description: Three-letter currency code.
        optional: true
      total_price:
        type: integer
        description: Order total in cents.
        optional: true
        minimum: 0
      order_url:
        type: string
        description: URL where the order can be viewed.
        optional: true
      order_products:
        type: array
        description: Replacement line items, each with name, price in cents and quantity.
        optional: true
        items:
          type: object
          properties:
            name: {type: string}
            price: {type: integer}
            quantity: {type: integer}
            externalid: {type: string}
    output:
      description: The updated order.
      type: object
      properties:
        ecomOrder: {type: object}

  delete_ecommerce_order:
    title: Delete an e-commerce order
    description: >-
      Delete a store order. Revenue attribution and any automation that keyed
      on it change accordingly.
    category: ecommerce
    destructive: true
    request:
      method: DELETE
      path: /3/ecomOrders/${order_id}
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: Empty on success.
      type: object

  list_ecommerce_order_products:
    title: List e-commerce order products
    description: >-
      Line items across orders, with their names, prices in cents and
      quantities -- the raw material for product-level reporting.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomOrderProducts
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many line items to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many line items to skip.
        optional: true
        minimum: 0
    output:
      description: The order line items.
      type: object
      properties:
        ecomOrderProducts: {type: array}
        meta: {type: object}

  get_ecommerce_order_product:
    title: Get an e-commerce order product
    description: One order line item by id, with its product details and price in cents.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomOrderProducts/${order_product_id}
    input:
      order_product_id:
        type: integer
        description: The line item's id.
    output:
      description: The line item.
      type: object
      properties:
        ecomOrderProduct: {type: object}

  list_order_products_for_order:
    title: List one order's products
    description: The line items of a single order, without paging the whole collection.
    category: ecommerce
    read_only: true
    request:
      method: GET
      path: /3/ecomOrders/${order_id}/orderProducts
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: That order's line items.
      type: object
      properties:
        ecomOrderProducts: {type: array}

  # -- SMS -------------------------------------------------------------------

  list_sms_broadcasts:
    title: List SMS broadcasts
    description: >-
      SMS broadcasts with their status, type and schedule. Filter by name or
      status, and narrow to a window with `start_date` and `end_date`.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/broadcasts
      query:
        "filters[name]": "${name}"
        "filters[status]": "${status}"
        "filters[type]": "${type}"
        start_date: "${start_date}"
        end_date: "${end_date}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only broadcasts whose name matches this.
        optional: true
      status:
        type: string
        description: Only broadcasts in this status, e.g. draft or sent.
        optional: true
      type:
        type: string
        description: Only broadcasts of this type.
        optional: true
      start_date:
        type: string
        description: Only broadcasts from this date onwards.
        optional: true
      end_date:
        type: string
        description: Only broadcasts up to this date.
        optional: true
      limit:
        type: integer
        description: How many broadcasts to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many broadcasts to skip.
        optional: true
        minimum: 0
    output:
      description: The matching SMS broadcasts.
      type: object
      properties:
        broadcasts: {type: array}
        meta: {type: object}

  get_sms_broadcast:
    title: Get an SMS broadcast
    description: >-
      One SMS broadcast by id, with its message body, audience, schedule and
      status.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/broadcasts/${broadcast_id}
    input:
      broadcast_id:
        type: integer
        description: The broadcast's id.
    output:
      description: The SMS broadcast.
      type: object
      properties:
        broadcast: {type: object}

  create_sms_broadcast:
    title: Create an SMS broadcast
    description: >-
      Create an SMS broadcast to a list or segment. Creating it with status
      "draft" is the safe default -- SMS costs credits per recipient and cannot
      be recalled once it sends. Media URLs turn it into an MMS.
    category: sms
    request:
      method: POST
      path: /3/sms/broadcasts
      body:
        name: "${name}"
        body: "${body}"
        address_id: "${address_id}"
        media_urls: "${media_urls}"
        preview_url: "${preview_url}"
        shorten_track_links_enabled: "${shorten_track_links}"
        status: "${status}"
        scheduled_date: "${scheduled_date}"
        list_ids: "${list_ids}"
        segment_id: "${segment_id}"
        custom_segment_id: "${custom_segment_id}"
    input:
      name:
        type: string
        description: Name of the broadcast, shown internally.
        example: Flash sale reminder
      body:
        type: string
        description: The SMS message text.
        example: "Our sale ends tonight: example.com/sale"
      address_id:
        type: integer
        description: Id of the sender name to send from.
        optional: true
      media_urls:
        type: array
        description: URLs of media to attach, which makes the message an MMS.
        optional: true
        items: {type: string}
      preview_url:
        type: string
        description: URL used for the link preview.
        optional: true
      shorten_track_links:
        type: boolean
        description: Shorten and track the links in the message.
        optional: true
      status:
        type: string
        description: Create the broadcast as a draft rather than queuing it.
        optional: true
        enum: [draft]
      scheduled_date:
        type: string
        description: When the broadcast should send.
        optional: true
      list_ids:
        type: array
        description: Lists to send to.
        optional: true
        items: {type: integer}
      segment_id:
        type: string
        description: Segment to send to.
        optional: true
      custom_segment_id:
        type: string
        description: Custom segment id from the segments v2 endpoints.
        optional: true
    output:
      description: The broadcast that was created.
      type: object
      properties:
        broadcast: {type: object}

  update_sms_broadcast:
    title: Update an SMS broadcast
    description: >-
      Change a broadcast's message, audience or schedule. A broadcast that has
      already sent cannot be recalled by editing it.
    category: sms
    request:
      method: PUT
      path: /3/sms/broadcasts/${broadcast_id}
      body:
        name: "${name}"
        body: "${body}"
        address_id: "${address_id}"
        media_urls: "${media_urls}"
        shorten_track_links_enabled: "${shorten_track_links}"
        scheduled_date: "${scheduled_date}"
        list_ids: "${list_ids}"
        segment_id: "${segment_id}"
    input:
      broadcast_id:
        type: integer
        description: The broadcast's id.
      name:
        type: string
        description: New name.
        optional: true
      body:
        type: string
        description: New message text.
        optional: true
      address_id:
        type: integer
        description: Sender name to send from.
        optional: true
      media_urls:
        type: array
        description: URLs of media to attach.
        optional: true
        items: {type: string}
      shorten_track_links:
        type: boolean
        description: Shorten and track links in the message.
        optional: true
      scheduled_date:
        type: string
        description: New send time.
        optional: true
      list_ids:
        type: array
        description: Lists to send to.
        optional: true
        items: {type: integer}
      segment_id:
        type: string
        description: Segment to send to.
        optional: true
    output:
      description: The updated broadcast.
      type: object
      properties:
        broadcast: {type: object}

  delete_sms_broadcast:
    title: Delete an SMS broadcast
    description: >-
      Delete an SMS broadcast. Messages already sent are not recalled, and the
      credits they consumed are not returned.
    category: sms
    destructive: true
    request:
      method: DELETE
      path: /3/sms/broadcasts/${broadcast_id}
    input:
      broadcast_id:
        type: integer
        description: The broadcast's id.
    output:
      description: Empty on success.
      type: object

  get_sms_credits:
    title: Get SMS credit usage
    description: >-
      How many SMS credits the account has used and has left -- worth checking
      before queueing a large broadcast, since a shortfall stops the send.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/credits
    input: {}
    output:
      description: The account's SMS credit position.
      type: object
      properties:
        credits: {type: object}

  list_sms_lists:
    title: List SMS lists
    description: >-
      The lists available as SMS broadcast audiences, with their subscriber
      counts.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/lists
      query:
        "filters[name]": "${name}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only lists whose name matches this.
        optional: true
      limit:
        type: integer
        description: How many lists to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many lists to skip.
        optional: true
        minimum: 0
    output:
      description: The SMS-capable lists.
      type: object
      properties:
        lists: {type: array}
        meta: {type: object}

  get_sms_broadcast_recipients:
    title: Get an SMS broadcast's recipients
    description: >-
      Who a broadcast went to and what happened to each message, filterable by
      deliverability and engagement -- how failures are traced to specific
      numbers.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/broadcasts/${broadcast_id}/recipients
      query:
        start_date: "${start_date}"
        end_date: "${end_date}"
        search: "${search}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      broadcast_id:
        type: integer
        description: The broadcast's id.
      start_date:
        type: string
        description: Only recipients from this date onwards.
        optional: true
      end_date:
        type: string
        description: Only recipients up to this date.
        optional: true
      search:
        type: string
        description: Match a recipient by number or contact details.
        optional: true
      limit:
        type: integer
        description: How many recipients to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many recipients to skip.
        optional: true
        minimum: 0
    output:
      description: The broadcast's recipients and their delivery state.
      type: object
      properties:
        recipients: {type: array}
        meta: {type: object}

  get_sms_broadcast_failures:
    title: Get an SMS broadcast's failures
    description: >-
      The failed sends for one broadcast with the reason for each -- invalid
      numbers, carrier rejections and opt-outs.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/broadcasts/metrics/${broadcast_id}/failures
      query:
        start_date: "${start_date}"
        end_date: "${end_date}"
    input:
      broadcast_id:
        type: integer
        description: The broadcast's id.
      start_date:
        type: string
        description: Only failures from this date onwards.
        optional: true
      end_date:
        type: string
        description: Only failures up to this date.
        optional: true
    output:
      description: The broadcast's failures.
      type: object
      properties:
        failures: {type: array}

  get_sms_broadcast_snapshot:
    title: Get an SMS metrics snapshot
    description: >-
      Aggregate SMS metrics for a date range -- sends, deliveries, clicks and
      opt-outs across broadcasts.
    category: sms
    read_only: true
    request:
      method: GET
      path: /3/sms/broadcasts/metrics/snapshot
      query:
        start_date: "${start_date}"
        end_date: "${end_date}"
    input:
      start_date:
        type: string
        description: Start of the window.
        optional: true
      end_date:
        type: string
        description: End of the window.
        optional: true
    output:
      description: The metrics snapshot.
      type: object
      properties:
        snapshot: {type: object}

  get_sms_broadcast_metrics:
    title: Get metrics for several SMS broadcasts
    description: >-
      Metrics for a set of broadcasts in one call, over an optional date range
      -- the way to build an SMS performance report without a request per
      broadcast.
    category: sms
    read_only: true
    request:
      method: POST
      path: /3/sms/broadcasts/metrics
      query:
        start_date: "${start_date}"
        end_date: "${end_date}"
      body:
        broadcast_ids: "${broadcast_ids}"
    input:
      broadcast_ids:
        type: array
        description: Ids of the broadcasts to report on.
        items: {type: integer}
      start_date:
        type: string
        description: Start of the window.
        optional: true
      end_date:
        type: string
        description: End of the window.
        optional: true
    output:
      description: Metrics for those broadcasts.
      type: object
      properties:
        metrics: {type: array}

  # -- custom objects --------------------------------------------------------

  list_custom_object_schemas:
    title: List custom object schemas
    description: >-
      The custom object types defined in the account, with their slugs and
      labels. Add `show_fields` to get each schema's fields, which is what
      writing a record needs.
    category: custom-objects
    read_only: true
    request:
      method: GET
      path: /3/customObjects/schemas
      query:
        showFields: "${show_fields}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      show_fields:
        type: boolean
        description: Include each schema's field definitions.
        optional: true
      limit:
        type: integer
        description: How many schemas to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many schemas to skip.
        optional: true
        minimum: 0
    output:
      description: The custom object schemas.
      type: object
      properties:
        schemas: {type: array}
        meta: {type: object}

  get_custom_object_schema:
    title: Get a custom object schema
    description: >-
      One schema by id, optionally with its fields -- their slugs, types and
      labels, which record writes must match.
    category: custom-objects
    read_only: true
    request:
      method: GET
      path: /3/customObjects/schemas/${schema_id}
      query:
        showFields: "${show_fields}"
    input:
      schema_id:
        type: string
        description: The schema's id.
      show_fields:
        type: boolean
        description: Include the schema's field definitions.
        optional: true
    output:
      description: The schema.
      type: object
      properties:
        schema: {type: object}

  create_custom_object_schema:
    title: Create a custom object schema
    description: >-
      Define a new custom object type -- its slug, singular and plural labels,
      and its fields. This is the schema behind records, so getting the field
      slugs right here saves rework later.
    category: custom-objects
    request:
      method: POST
      path: /3/customObjects/schemas
      body:
        schema: "${schema}"
    input:
      schema:
        type: object
        description: >-
          The schema: slug, labels (singular and plural), description and a
          `fields` list, each field with its slug, labels and type.
    output:
      description: The schema that was created.
      type: object
      properties:
        schema: {type: object}

  create_public_custom_object_schema:
    title: Create a public custom object schema
    description: >-
      Create a custom object schema that is public rather than private to the
      creating app -- what an integration meant to be usable from the UI needs.
    category: custom-objects
    request:
      method: POST
      path: /3/customObjects/schemas/public
      body:
        schema: "${schema}"
    input:
      schema:
        type: object
        description: The schema definition, as `create_custom_object_schema` takes it.
    output:
      description: The schema that was created.
      type: object
      properties:
        schema: {type: object}

  create_child_custom_object_schema:
    title: Create a child custom object schema
    description: >-
      Create a schema nested under an existing one, for objects that only make
      sense as children of another -- line items under an invoice, say.
    category: custom-objects
    request:
      method: POST
      path: /3/customObjects/schemas/${schema_id}/child
      body:
        schema: "${schema}"
    input:
      schema_id:
        type: string
        description: The parent schema's id.
      schema:
        type: object
        description: The child schema definition.
    output:
      description: The child schema that was created.
      type: object
      properties:
        schema: {type: object}

  update_custom_object_schema:
    title: Update a custom object schema
    description: >-
      Change a schema's labels, description or fields. Removing or retyping a
      field affects the records already stored under it.
    category: custom-objects
    request:
      method: PUT
      path: /3/customObjects/schemas/${schema_id}
      query:
        showFields: "${show_fields}"
      body:
        schema: "${schema}"
    input:
      schema_id:
        type: string
        description: The schema's id.
      schema:
        type: object
        description: The schema changes, in the same shape as on create.
      show_fields:
        type: boolean
        description: Return the schema's fields in the response.
        optional: true
    output:
      description: The updated schema.
      type: object
      properties:
        schema: {type: object}

  delete_custom_object_schema:
    title: Delete a custom object schema
    description: >-
      Delete a custom object schema. Its records go with it, and anything
      keyed on them stops working.
    category: custom-objects
    destructive: true
    request:
      method: DELETE
      path: /3/customObjects/schemas/${schema_id}
    input:
      schema_id:
        type: string
        description: The schema's id.
    output:
      description: Empty on success.
      type: object

  delete_custom_object_field:
    title: Delete a field from a custom object schema
    description: >-
      Remove one field from a schema, along with the values records hold for it.
    category: custom-objects
    destructive: true
    request:
      method: DELETE
      path: /3/customObjects/schemas/${schema_id}/fields/${field_id}
      query:
        showFields: "${show_fields}"
    input:
      schema_id:
        type: string
        description: The schema's id.
      field_id:
        type: string
        description: The field's id.
      show_fields:
        type: boolean
        description: Return the schema's remaining fields in the response.
        optional: true
    output:
      description: The schema after the field was removed.
      type: object
      properties:
        schema: {type: object}

  list_custom_object_records:
    title: List custom object records
    description: >-
      Records of one custom object type, with optional filters over their
      fields -- how a custom object's data is read back.
    category: custom-objects
    read_only: true
    request:
      method: GET
      path: /3/customObjects/records/${schema_id}
      query:
        filters: "${filters}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      schema_id:
        type: string
        description: The schema whose records to list.
      filters:
        type: string
        description: Field filters, in the form the custom objects endpoint documents.
        optional: true
      limit:
        type: integer
        description: How many records to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many records to skip.
        optional: true
        minimum: 0
    output:
      description: The matching records.
      type: object
      properties:
        records: {type: array}
        meta: {type: object}

  get_custom_object_record:
    title: Get a custom object record
    description: One record by its id, with its field values and relationships.
    category: custom-objects
    read_only: true
    request:
      method: GET
      path: /3/customObjects/records/${schema_id}/${record_id}
    input:
      schema_id:
        type: string
        description: The record's schema id.
      record_id:
        type: string
        description: The record's id.
    output:
      description: The record.
      type: object
      properties:
        record: {type: object}

  get_custom_object_record_by_external_id:
    title: Get a custom object record by external id
    description: >-
      Fetch a record by the id your own system knows it as, rather than
      ActiveCampaign's -- the lookup a sync uses to decide create or update.
    category: custom-objects
    read_only: true
    request:
      method: GET
      path: /3/records/${schema_id}/external/${external_id}
    input:
      schema_id:
        type: string
        description: The record's schema id.
      external_id:
        type: string
        description: The record's external id.
    output:
      description: The record.
      type: object
      properties:
        record: {type: object}

  create_or_update_custom_object_record:
    title: Create or update a custom object record
    description: >-
      Upsert a record of a custom object type. Field values are given by field
      id, and `relationships` is where a record is linked to a contact -- which
      is what makes it usable in segments and automations.
    category: custom-objects
    request:
      method: POST
      path: /3/customObjects/records/${schema_id}
      body:
        record: "${record}"
    input:
      schema_id:
        type: string
        description: The schema the record belongs to.
      record:
        type: object
        description: >-
          The record: optionally its id or externalId, a `fields` list of
          {id, value} pairs, and `relationships` such as primary-contact.
    output:
      description: The record that was stored.
      type: object
      properties:
        record: {type: object}

  delete_custom_object_record:
    title: Delete a custom object record
    description: Delete one record of a custom object type. Not reversible.
    category: custom-objects
    destructive: true
    request:
      method: DELETE
      path: /3/customObjects/records/${schema_id}/${record_id}
    input:
      schema_id:
        type: string
        description: The record's schema id.
      record_id:
        type: string
        description: The record's id.
    output:
      description: Empty on success.
      type: object

  delete_custom_object_record_by_external_id:
    title: Delete a custom object record by external id
    description: >-
      Delete a record addressed by your own system's id -- for a sync that
      tracks deletions on its side.
    category: custom-objects
    destructive: true
    request:
      method: DELETE
      path: /3/customObjects/records/${schema_id}/external/${external_id}
    input:
      schema_id:
        type: string
        description: The record's schema id.
      external_id:
        type: string
        description: The record's external id.
    output:
      description: Empty on success.
      type: object

  # -- addresses, calendars, branding and content -----------------------------

  list_addresses:
    title: List sender addresses
    description: >-
      The postal addresses available for the footer of campaigns -- what
      anti-spam rules require to be present and accurate.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addresses
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many addresses to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many addresses to skip.
        optional: true
        minimum: 0
    output:
      description: The account's sender addresses.
      type: object
      properties:
        addresses: {type: array}
        meta: {type: object}

  get_address:
    title: Get a sender address
    description: One sender address by id, with its company name, street, city and country.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addresses/${address_id}
    input:
      address_id:
        type: integer
        description: The address's id.
    output:
      description: The address.
      type: object
      properties:
        address: {type: object}

  create_address:
    title: Create a sender address
    description: >-
      Add a postal address for campaign footers. Company name, first line and a
      two-letter country code are required, and the country decides how the
      block is formatted.
    category: addresses
    request:
      method: POST
      path: /3/addresses
      body:
        address:
          company_name: "${company_name}"
          address_1: "${address_1}"
          address_2: "${address_2}"
          city: "${city}"
          state: "${state}"
          zip: "${zip}"
          district: "${district}"
          country: "${country}"
          groupid: "${group_id}"
          allgroup: "${all_groups}"
          is_default: "${is_default}"
    input:
      company_name:
        type: string
        description: Company name shown in the address block.
        example: Acme Corporation
      address_1:
        type: string
        description: First line of the street address.
      country:
        type: string
        description: Two-letter country code, e.g. US, CA, MX.
        example: US
      address_2:
        type: string
        description: Second line of the street address.
        optional: true
      city:
        type: string
        description: City.
        optional: true
      state:
        type: string
        description: State or province.
        optional: true
      zip:
        type: string
        description: Postal code.
        optional: true
      district:
        type: string
        description: District, for countries that use one.
        optional: true
      group_id:
        type: integer
        description: User group the address belongs to.
        optional: true
      all_groups:
        type: integer
        description: 1 to make the address available to every user group.
        optional: true
        enum: [0, 1]
      is_default:
        type: boolean
        description: Make this the account's default sender address.
        optional: true
    output:
      description: The address that was created.
      type: object
      properties:
        address: {type: object}

  update_address:
    title: Update a sender address
    description: >-
      Change a sender address. Campaigns sent afterwards pick up the new
      details; ones already sent keep what they carried.
    category: addresses
    request:
      method: PUT
      path: /3/addresses/${address_id}
      body:
        address:
          company_name: "${company_name}"
          address_1: "${address_1}"
          address_2: "${address_2}"
          city: "${city}"
          state: "${state}"
          zip: "${zip}"
          district: "${district}"
          country: "${country}"
          is_default: "${is_default}"
    input:
      address_id:
        type: integer
        description: The address's id.
      company_name:
        type: string
        description: New company name.
        optional: true
      address_1:
        type: string
        description: New first line of the street address.
        optional: true
      address_2:
        type: string
        description: New second line.
        optional: true
      city:
        type: string
        description: New city.
        optional: true
      state:
        type: string
        description: New state or province.
        optional: true
      zip:
        type: string
        description: New postal code.
        optional: true
      district:
        type: string
        description: New district.
        optional: true
      country:
        type: string
        description: New two-letter country code.
        optional: true
      is_default:
        type: boolean
        description: Make this the default sender address.
        optional: true
    output:
      description: The updated address.
      type: object
      properties:
        address: {type: object}

  delete_address:
    title: Delete a sender address
    description: >-
      Delete a sender address. Lists and campaigns using it need another one
      before they can send, since the postal block is mandatory.
    category: addresses
    destructive: true
    request:
      method: DELETE
      path: /3/addresses/${address_id}
    input:
      address_id:
        type: integer
        description: The address's id.
    output:
      description: Empty on success.
      type: object

  list_address_lists:
    title: List address-to-list links
    description: >-
      Which sender addresses are tied to which lists. Not filterable -- to read
      one address's links, use `get_address_list_link` with the ids from here.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addressLists
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many links to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many links to skip.
        optional: true
        minimum: 0
    output:
      description: The address-to-list links.
      type: object
      properties:
        addressLists: {type: array}
        meta: {type: object}

  get_address_list_link:
    title: Get an address-to-list link
    description: One address-to-list link by id, naming the address and the list.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addressLists/${address_list_id}
    input:
      address_list_id:
        type: integer
        description: The link's id.
    output:
      description: The link.
      type: object
      properties:
        addressList: {type: object}

  delete_address_list_link:
    title: Delete an address-to-list link
    description: >-
      Stop using one sender address for one list. Neither the address nor the
      list is deleted.
    category: addresses
    destructive: true
    request:
      method: DELETE
      path: /3/addressLists/${address_list_id}
    input:
      address_list_id:
        type: integer
        description: The link's id.
    output:
      description: Empty on success.
      type: object

  list_address_groups:
    title: List address-to-group links
    description: >-
      Which sender addresses are available to which user groups. An address
      available to every group carries `allgroup` on the address itself instead
      of a link here.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addressGroups
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many links to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many links to skip.
        optional: true
        minimum: 0
    output:
      description: The address-to-group links.
      type: object
      properties:
        addressGroups: {type: array}
        meta: {type: object}

  get_address_group_link:
    title: Get an address-to-group link
    description: One address-to-group link by id, naming the address and the user group.
    category: addresses
    read_only: true
    request:
      method: GET
      path: /3/addressGroups/${address_group_id}
    input:
      address_group_id:
        type: integer
        description: The link's id.
    output:
      description: The link.
      type: object
      properties:
        addressGroup: {type: object}

  delete_address_group_link:
    title: Delete an address-to-group link
    description: >-
      Stop offering one sender address to one user group. The address itself
      stays.
    category: addresses
    destructive: true
    request:
      method: DELETE
      path: /3/addressGroups/${address_group_id}
    input:
      address_group_id:
        type: integer
        description: The link's id.
    output:
      description: Empty on success.
      type: object

  list_calendar_feeds:
    title: List calendar feeds
    description: >-
      The calendar feeds the account publishes, which push deals and tasks into
      an external calendar app.
    category: calendars
    read_only: true
    request:
      method: GET
      path: /3/calendars
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many feeds to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many feeds to skip.
        optional: true
        minimum: 0
    output:
      description: The account's calendar feeds.
      type: object
      properties:
        calendars: {type: array}
        meta: {type: object}

  get_calendar_feed:
    title: Get a calendar feed
    description: One calendar feed by id, with its title, type and notification setting.
    category: calendars
    read_only: true
    request:
      method: GET
      path: /3/calendars/${calendar_id}
    input:
      calendar_id:
        type: integer
        description: The feed's id.
    output:
      description: The calendar feed.
      type: object
      properties:
        calendar: {type: object}

  create_calendar_feed:
    title: Create a calendar feed
    description: >-
      Publish a calendar feed of deals, contacts or both, so CRM dates appear
      in an external calendar app.
    category: calendars
    request:
      method: POST
      path: /3/calendars
      body:
        calendar:
          title: "${title}"
          type: "${type}"
          notification: "${notification}"
    input:
      title:
        type: string
        description: Title of the feed.
        example: Sales team deals
      type:
        type: string
        description: What the feed carries.
        enum: [All, Deals, Contacts]
      notification:
        type: boolean
        description: Whether the feed raises notifications.
        optional: true
    output:
      description: The feed that was created.
      type: object
      properties:
        calendar: {type: object}

  update_calendar_feed:
    title: Update a calendar feed
    description: Change a calendar feed's title, contents or notification setting.
    category: calendars
    request:
      method: PUT
      path: /3/calendars/${calendar_id}
      body:
        calendar:
          title: "${title}"
          type: "${type}"
          notification: "${notification}"
    input:
      calendar_id:
        type: integer
        description: The feed's id.
      title:
        type: string
        description: New title.
        optional: true
      type:
        type: string
        description: What the feed carries.
        optional: true
        enum: [All, Deals, Contacts]
      notification:
        type: boolean
        description: Whether the feed raises notifications.
        optional: true
    output:
      description: The updated feed.
      type: object
      properties:
        calendar: {type: object}

  delete_calendar_feed:
    title: Delete a calendar feed
    description: >-
      Delete a calendar feed. Anyone subscribed to its URL stops receiving
      updates.
    category: calendars
    destructive: true
    request:
      method: DELETE
      path: /3/calendars/${calendar_id}
    input:
      calendar_id:
        type: integer
        description: The feed's id.
    output:
      description: Empty on success.
      type: object

  list_brandings:
    title: List brandings
    description: >-
      The account's branding profiles -- the logos and colours applied to
      campaigns and forms per user group.
    category: branding
    read_only: true
    request:
      method: GET
      path: /3/brandings
    input: {}
    output:
      description: The account's brandings.
      type: object
      properties:
        brandings: {type: array}

  get_branding:
    title: Get a branding
    description: One branding profile by id, with its logo, colours and group.
    category: branding
    read_only: true
    request:
      method: GET
      path: /3/brandings/${branding_id}
    input:
      branding_id:
        type: integer
        description: The branding's id.
    output:
      description: The branding.
      type: object
      properties:
        branding: {type: object}

  update_branding:
    title: Update a branding
    description: >-
      Change a branding profile. Campaigns and forms built afterwards pick up
      the new look.
    category: branding
    request:
      method: PUT
      path: /3/brandings/${branding_id}
      body:
        branding: "${branding}"
    input:
      branding_id:
        type: integer
        description: The branding's id.
      branding:
        type: object
        description: >-
          The branding fields to change -- group id, logo and colour settings as
          the branding resource declares them.
    output:
      description: The updated branding.
      type: object
      properties:
        branding: {type: object}

  list_personalization_variables:
    title: List personalisation variables
    description: >-
      The reusable content variables messages can drop in by tag, with their
      formats and the lists they apply to.
    category: content
    read_only: true
    request:
      method: GET
      path: /3/personalizations
      query:
        "filter[name]": "${name}"
        "filter[tag]": "${tag}"
        "filter[format]": "${format}"
        "orders[name]": "${order_by_name}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      name:
        type: string
        description: Only variables whose name matches this.
        optional: true
      tag:
        type: string
        description: Only the variable with this tag.
        optional: true
      format:
        type: string
        description: Only variables of this format.
        optional: true
        enum: [html, text]
      order_by_name:
        type: string
        description: Sort by variable name.
        optional: true
        enum: [ASC, DESC]
      limit:
        type: integer
        description: How many variables to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many variables to skip.
        optional: true
        minimum: 0
    output:
      description: The personalisation variables.
      type: object
      properties:
        personalizations: {type: array}
        meta: {type: object}

  get_personalization_variable:
    title: Get a personalisation variable
    description: One variable by id, with its tag, format, content and lists.
    category: content
    read_only: true
    request:
      method: GET
      path: /3/personalizations/${variable_id}
    input:
      variable_id:
        type: integer
        description: The variable's id.
    output:
      description: The variable.
      type: object
      properties:
        personalization: {type: object}

  create_personalization_variable:
    title: Create a personalisation variable
    description: >-
      Create a reusable content variable messages can insert by tag -- the way
      a block of copy is maintained in one place rather than in every campaign.
    category: content
    request:
      method: POST
      path: /3/personalizations
      body:
        personalization:
          tag: "${tag}"
          name: "${name}"
          format: "${format}"
          content: "${content}"
          listids: "${list_ids}"
    input:
      tag:
        type: string
        description: Tag used to insert the variable in a message.
        example: FOOTER_PROMO
      name:
        type: string
        description: Name of the variable, shown in the UI.
        optional: true
      format:
        type: string
        description: Whether the content is HTML or plain text.
        optional: true
        enum: [html, text]
      content:
        type: string
        description: The variable's content.
        optional: true
      list_ids:
        type: string
        description: Comma-separated list ids the variable applies to, e.g. "2,3,4".
        optional: true
    output:
      description: The variable that was created.
      type: object
      properties:
        personalization: {type: object}

  update_personalization_variable:
    title: Update a personalisation variable
    description: >-
      Change a variable's content, tag or lists. Every message using the tag
      picks up the new content on its next send.
    category: content
    request:
      method: PUT
      path: /3/personalizations/${variable_id}
      body:
        personalization:
          tag: "${tag}"
          name: "${name}"
          format: "${format}"
          content: "${content}"
          listids: "${list_ids}"
    input:
      variable_id:
        type: integer
        description: The variable's id.
      tag:
        type: string
        description: New tag.
        optional: true
      name:
        type: string
        description: New name.
        optional: true
      format:
        type: string
        description: Whether the content is HTML or plain text.
        optional: true
        enum: [html, text]
      content:
        type: string
        description: New content.
        optional: true
      list_ids:
        type: string
        description: Comma-separated list ids the variable applies to.
        optional: true
    output:
      description: The updated variable.
      type: object
      properties:
        personalization: {type: object}

  delete_personalization_variable:
    title: Delete a personalisation variable
    description: >-
      Delete a variable. Messages still referencing its tag render nothing in
      its place.
    category: content
    destructive: true
    request:
      method: DELETE
      path: /3/personalizations/${variable_id}
    input:
      variable_id:
        type: integer
        description: The variable's id.
    output:
      description: Empty on success.
      type: object

  bulk_delete_personalization_variables:
    title: Delete several personalisation variables
    description: Delete several content variables in one call, by id.
    category: content
    destructive: true
    request:
      method: DELETE
      path: /3/personalizations/bulkdelete
      query:
        ids: "${variable_ids}"
    input:
      variable_ids:
        type: array
        description: Ids of the variables to delete.
        items: {type: integer}
    output:
      description: The result of the bulk delete.
      type: object

  lock_personalization_variable:
    title: Lock a personalisation variable
    description: >-
      Lock a variable so it cannot be edited -- how a legally reviewed block of
      copy is protected from casual changes.
    category: content
    request:
      method: PATCH
      path: /3/personalizations/${variable_id}/lock
      headers:
        Content-Type: application/json
    input:
      variable_id:
        type: integer
        description: The variable's id.
    output:
      description: The variable's new state.
      type: object
      properties:
        personalization: {type: object}

  unlock_personalization_variable:
    title: Unlock a personalisation variable
    description: Unlock a locked variable so it can be edited again.
    category: content
    request:
      method: PATCH
      path: /3/personalizations/${variable_id}/unlock
      headers:
        Content-Type: application/json
    input:
      variable_id:
        type: integer
        description: The variable's id.
    output:
      description: The variable's new state.
      type: object
      properties:
        personalization: {type: object}

  list_saved_responses:
    title: List saved responses
    description: >-
      The canned replies available to users, with their subjects and bodies --
      what a support or sales reply is assembled from.
    category: content
    read_only: true
    request:
      method: GET
      path: /3/savedResponses
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many saved responses to return.
        optional: true
        minimum: 1
        maximum: 100
      offset:
        type: integer
        description: How many saved responses to skip.
        optional: true
        minimum: 0
    output:
      description: The account's saved responses.
      type: object
      properties:
        savedResponses: {type: array}
        meta: {type: object}

  get_saved_response:
    title: Get a saved response
    description: One saved response by id, with its title, subject and body.
    category: content
    read_only: true
    request:
      method: GET
      path: /3/savedResponses/${saved_response_id}
    input:
      saved_response_id:
        type: integer
        description: The saved response's id.
    output:
      description: The saved response.
      type: object
      properties:
        savedResponse: {type: object}

  create_saved_response:
    title: Create a saved response
    description: >-
      Create a canned reply users can insert. Title, subject and body are all
      required.
    category: content
    request:
      method: POST
      path: /3/savedResponses
      body:
        savedResponse:
          title: "${title}"
          subject: "${subject}"
          body: "${body}"
    input:
      title:
        type: string
        description: Internal title for the response.
        example: Pricing follow-up
      subject:
        type: string
        description: Subject line the response uses.
      body:
        type: string
        description: The response's body.
    output:
      description: The saved response that was created.
      type: object
      properties:
        savedResponse: {type: object}

  update_saved_response:
    title: Update a saved response
    description: Change a saved response's title, subject or body.
    category: content
    request:
      method: PUT
      path: /3/savedResponses/${saved_response_id}
      body:
        savedResponse:
          title: "${title}"
          subject: "${subject}"
          body: "${body}"
    input:
      saved_response_id:
        type: integer
        description: The saved response's id.
      title:
        type: string
        description: New title.
        optional: true
      subject:
        type: string
        description: New subject line.
        optional: true
      body:
        type: string
        description: New body.
        optional: true
    output:
      description: The updated saved response.
      type: object
      properties:
        savedResponse: {type: object}

  delete_saved_response:
    title: Delete a saved response
    description: Delete a canned reply. Replies already sent are unaffected.
    category: content
    destructive: true
    request:
      method: DELETE
      path: /3/savedResponses/${saved_response_id}
    input:
      saved_response_id:
        type: integer
        description: The saved response's id.
    output:
      description: Empty on success.
      type: object

  list_whitelisted_domains:
    title: List whitelisted web personalisation domains
    description: >-
      The domains and pages cleared for conversations, web personalisation and
      site tracking, with which of the three each allows.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /3/prism/urlWhitelistings
    input: {}
    output:
      description: The whitelisted domains.
      type: object
      properties:
        data: {type: array}

  add_whitelisted_domain:
    title: Whitelist a domain for web personalisation
    description: >-
      Clear a domain -- and a page pattern within it, "*" for all -- for
      conversations, web personalisation and site tracking. Each of the three is
      switched on or off separately, which is how a domain can track without
      showing a chat widget.
    category: tracking
    request:
      method: POST
      path: /3/prism/urlWhitelistings
      body:
        data:
          type: urlWhitelistings
          attributes:
            whitelisted_domain: "${domain}"
            whitelisted_page: "${page}"
            conversations_enabled: "${conversations_enabled}"
            wp_enabled: "${web_personalization_enabled}"
            tracking_enabled: "${tracking_enabled}"
    input:
      domain:
        type: string
        description: Domain to whitelist.
        example: example.com
      page:
        type: string
        description: Page pattern within the domain. "*" means every page.
        optional: true
        default: "*"
      conversations_enabled:
        type: boolean
        description: Allow conversations (chat) on this domain.
        optional: true
      web_personalization_enabled:
        type: boolean
        description: Allow web personalisation on this domain.
        optional: true
      tracking_enabled:
        type: boolean
        description: Allow site tracking on this domain.
        optional: true
    output:
      description: The whitelisting that was created.
      type: object
      properties:
        data: {type: object}

  remove_whitelisted_domain:
    title: Remove a whitelisted domain
    description: >-
      Remove a domain from the web personalisation whitelist. Conversations,
      personalisation and tracking all stop on it.
    category: tracking
    destructive: true
    request:
      method: DELETE
      path: /3/prism/urlWhitelistings/${domain_id}
    input:
      domain_id:
        type: integer
        description: The whitelisting's id.
    output:
      description: Empty on success.
      type: object
