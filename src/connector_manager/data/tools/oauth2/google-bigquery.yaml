    description: 'Requests that a job be cancelled. This call will return immediately, and the client
      will need to poll for the job status to see if the cancel completed successfully. Cancelled jobs
      may still incur costs. # IAM Permissions Requires the bigquery.jobs.update permission on the job
      resource. If the user matches the creator of the job, the bigquery.jobs.create permission on the
      project is required instead.'
    category: jobs
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/jobs/${job_id}/cancel
      query:
        location: ${location}
    input:
      job_id:
        type: string
        description: Required. Job ID of the job to cancel
      project_id:
        type: string
        description: Required. Project ID of the job to cancel
      location:
        type: string
        description: 'The geographic location of the job. You must specify the location to run the job
          for the following scenarios: * If the location to run a job is not in the us or the eu multi-regional
          location * If the job''s location is in a single region (for example, us-central1)'
        optional: true
    output:
      description: The JobCancelResponse resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
  delete_job:
    title: Delete job
    description: 'Requests the deletion of the metadata of a job. This call returns when the job''s metadata
      is deleted. # IAM Permissions Requires the bigquery.jobs.delete permission on the job resource.'
    category: jobs
    request:
      method: DELETE
      path: /bigquery/v2/projects/${project_id}/jobs/${job_id}/delete
      query:
        location: ${location}
    input:
      job_id:
        type: string
        description: Required. Job ID of the job for which metadata is to be deleted. If this is a parent
          job which has child jobs, the metadata from all child jobs will be deleted as well. Direct deletion
          of the metadata of child jobs is not allowed.
      project_id:
        type: string
        description: Required. Project ID of the job for which metadata is to be deleted.
      location:
        type: string
        description: The geographic location of the job. Required. For more information, see how to specify
          locations.
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    destructive: true
  get_job:
    title: Get job
    description: 'Returns information about a specific job. Job information is available for a six month
      period after creation. Requires that you''re the person who ran the job, or have the Is Owner project
      role. # IAM Permissions Requires the bigquery.jobs.get permission on the job resource. If the user
      matches the creator of the job, the bigquery.jobs.create permission on the project is required instead.'
    category: jobs
    request:
      method: GET
      path: /bigquery/v2/projects/${project_id}/jobs/${job_id}
      query:
        location: ${location}
    input:
      job_id:
        type: string
        description: Required. Job ID of the requested job.
      project_id:
        type: string
        description: Required. Project ID of the requested job.
      location:
        type: string
        description: 'The geographic location of the job. You must specify the location to run the job
          for the following scenarios: * If the location to run a job is not in the us or the eu multi-regional
          location * If the job''s location is in a single region (for example, us-central1) For more
          information, see how to sp'
        optional: true
    output:
      description: The Job resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
    read_only: true
  get_query_results_job:
    title: Get query results job
    description: 'RPC to get the results of a query job. # IAM Permissions Requires the following IAM
      permission(s) to use this method: - bigquery.jobs.get on the job. - bigquery.tables.getData on the
      destination table. If the user matches the creator of the job, the following IAM permission(s) are
      required instead: - bigquery.jobs.create on the project. - bigquery.tables.getData on the destination
      table.'
    category: jobs
    request:
      method: GET
      path: /bigquery/v2/projects/${project_id}/queries/${job_id}
      query:
        formatOptions.timestampOutputFormat: ${format_options_timestamp_output_format}
        formatOptions.useInt64Timestamp: ${format_options_use_int64_timestamp}
        location: ${location}
        maxResults: ${max_results}
        pageToken: ${page_token}
        startIndex: ${start_index}
        timeoutMs: ${timeout_ms}
    input:
      job_id:
        type: string
        description: Required. Job ID of the query job.
      project_id:
        type: string
        description: Required. Project ID of the query job.
      format_options_timestamp_output_format:
        type: string
        description: Optional. The API output format for a timestamp. This offers more explicit control
          over the timestamp output format as compared to the existing use_int64_timestamp option.
        optional: true
        enum:
        - TIMESTAMP_OUTPUT_FORMAT_UNSPECIFIED
        - FLOAT64
        - INT64
        - ISO8601_STRING
      format_options_use_int64_timestamp:
        type: boolean
        description: Optional. Output timestamp as usec int64. Default is false.
        optional: true
      location:
        type: string
        description: 'The geographic location of the job. You must specify the location to run the job
          for the following scenarios: * If the location to run a job is not in the us or the eu multi-regional
          location * If the job''s location is in a single region (for example, us-central1) For more
          information, see how to sp'
        optional: true
      max_results:
        type: integer
        description: Maximum number of results to read.
        optional: true
      page_token:
        type: string
        description: Page token, returned by a previous call, to request the next page of results.
        optional: true
      start_index:
        type: string
        description: Zero-based index of the starting row.
        optional: true
      timeout_ms:
        type: integer
        description: 'Optional: Specifies the maximum amount of time, in milliseconds, that the client
          is willing to wait for the query to complete. By default, this limit is 10 seconds (10,000 milliseconds).
          If the query is complete, the jobComplete field in the response is true. If the query has not
          yet completed, jobC'
        optional: true
    output:
      description: The GetQueryResultsResponse resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
    read_only: true
  create_job:
    title: Create job
    description: Starts a new asynchronous job. This API has two different kinds of endpoint URIs, as
      this method supports a variety of use cases. * The *Metadata* URI is used for most interactions,
      as it accepts the job configuration directly. * The *Upload* URI is ONLY for the case when you're
      sending both a load job configuration and a data stream together. In this case, the Upload URI accepts
      the job configuration and the data as
    category: jobs
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/jobs
      body:
        configuration: ${configuration}
        jobReference: ${job_reference}
    input:
      project_id:
        type: string
        description: Project ID of project that will be billed for the job.
      configuration:
        type: string
        description: Required. Describes the job configuration.
        optional: true
      job_reference:
        type: string
        description: Optional. Reference describing the unique-per-user name of the job.
        optional: true
    output:
      description: The Job resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - devstorage.full_control
    - devstorage.read_only
    - devstorage.read_write
  list_jobs:
    title: List jobs
    description: 'Lists all jobs that you started in the specified project. Job information is available
      for a six month period after creation. The job list is sorted in reverse chronological order, by
      job creation time. Requires the Can View project role, or the Is Owner project role if you set the
      allUsers property. # IAM Permissions Requires no specific IAM permission(s) to use this method.
      Users are able to list the jobs they crea'
    category: jobs
    request:
      method: GET
      path: /bigquery/v2/projects/${project_id}/jobs
      query:
        allUsers: ${all_users}
        maxCreationTime: ${max_creation_time}
        maxResults: ${max_results}
        minCreationTime: ${min_creation_time}
        pageToken: ${page_token}
        parentJobId: ${parent_job_id}
        projection: ${projection}
        stateFilter: ${state_filter}
    input:
      project_id:
        type: string
        description: Project ID of the jobs to list.
      all_users:
        type: boolean
        description: Whether to display jobs owned by all users in the project. Default False.
        optional: true
      max_creation_time:
        type: string
        description: Max value for job creation time, in milliseconds since the POSIX epoch. If set, only
          jobs created before or at this timestamp are returned.
        optional: true
      max_results:
        type: integer
        description: The maximum number of results to return in a single response page. Leverage the page
          tokens to iterate through the entire collection.
        optional: true
      min_creation_time:
        type: string
        description: Min value for job creation time, in milliseconds since the POSIX epoch. If set, only
          jobs created after or at this timestamp are returned.
        optional: true
      page_token:
        type: string
        description: Page token, returned by a previous call, to request the next page of results.
        optional: true
      parent_job_id:
        type: string
        description: If set, show only child jobs of the specified parent. Otherwise, show all top-level
          jobs.
        optional: true
      projection:
        type: string
        description: Restrict information returned to a set of selected fields
        optional: true
        enum:
        - full
        - minimal
      state_filter:
        type: string
        description: Filter for job state
        optional: true
        enum:
        - done
        - pending
        - running
    output:
      description: The JobList resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
    read_only: true
  query_job:
    title: Query job
    description: 'Runs a BigQuery SQL query synchronously and returns query results if the query completes
      within a specified timeout. # IAM Permissions Requires the bigquery.jobs.create permission on the
      project resource. Data-level permissions are highly dependent on the SQL statement being executed.
      While standard queries require data access (such as bigquery.tables.getData), complex operations
      like DDL or DCL may require permissio'
    category: jobs
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/queries
      body: ${body}
    input:
      project_id:
        type: string
        description: Required. Project ID of the query request.
      body:
        type: object
        description: The QueryRequest resource, as the API's own reference defines it.
    output:
      description: The QueryResponse resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
