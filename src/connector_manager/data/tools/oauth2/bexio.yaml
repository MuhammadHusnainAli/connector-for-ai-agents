# bexio tools -- contacts and the sales document chain.
#
# bexio's API is versioned per resource inside one host, so paths carry their
# own version: `/2.0/contact`, `/3.0/taxes`. The connection's base url is the
# host, so every path below starts with its version segment.
#
# Two conventions run through the whole API and are worth learning once:
#
#   * **POST is used for create, update *and* search.** `POST /2.0/contact`
#     creates; `POST /2.0/contact/{id}` updates that contact;
#     `POST /2.0/contact/search` runs a query. The search body is a list of
#     criteria, each {"field": ..., "value": ..., "criteria": "like"}, which
#     is how you find a contact by name or email rather than scanning pages;
#   * **sales documents form a chain, and each link is its own endpoint.** A
#     quote (`kb_offer`) can be turned into an order (`kb_order`) with
#     `create_order_from_quote`, an order into a delivery or an invoice, and an
#     invoice into payments and dunning reminders. Converting is not the same
#     as copying: the new document keeps the link back.
#
# The lifecycle verbs matter more than the fields. A document is a **draft
# until it is issued**: `issue_invoice` gives it its number and makes it real,
# `mark_invoice_as_sent` records that you sent it yourself, and `send_invoice`
# actually emails the customer. `cancel_invoice` and `revert_issue_invoice`
# are the two ways back, and they are not equivalent -- reverting un-issues a
# document, cancelling records a cancellation against a real invoice.
#
# Positions (line items) are managed per document with their own endpoints:
# article positions, custom positions, text, subtotal and discount rows, each
# addressed as `/2.0/{kb_document_type}/{document_id}/kb_position_*` where the
# document type is "kb_invoice", "kb_offer" or "kb_order".
#
# Docs: https://docs.bexio.com

connector_id: bexio
display_name: Bexio
docs_url: https://docs.bexio.com

tools:

  # -- contacts ------------------------------------------------------------

  list_contacts:
    title: List contacts
    description: >-
      Read a page of contacts -- people and companies alike, distinguished by
      `contact_type_id` (1 company, 2 person). Use search_contacts to find a
      specific one rather than paging through everything.
    category: contacts
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/contact
      query:
        order_by: "${order_by}"
        limit: "${limit}"
        offset: "${offset}"
        show_archived: "${show_archived}"
    input:
      order_by:
        type: string
        description: Field to sort by, e.g. "name_1" or "id_desc".
        optional: true
      limit:
        type: integer
        description: Contacts per page (max 2000).
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many contacts to skip.
        optional: true
        minimum: 0
      show_archived:
        type: boolean
        description: Include archived contacts.
        optional: true
    output:
      description: A page of contacts.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          name_1: {type: string}
          mail: {type: string}
          contact_type_id: {type: integer}

  search_contacts:
    title: Search contacts
    description: >-
      Find contacts by field. `criteria` is a list of conditions, each
      {"field": "mail", "value": "ada@example.com", "criteria": "="} -- the
      `criteria` operator may be "=", "equal", "!=", "like", "not_like",
      "is_null", "not_null", ">" or "<". This is how you resolve an email or
      name to a contact id.
    category: contacts
    scopes: [contact_show]
    read_only: true
    request:
      method: POST
      path: /2.0/contact/search
      query:
        order_by: "${order_by}"
        limit: "${limit}"
        offset: "${offset}"
      body: "${criteria}"
    input:
      criteria:
        type: array
        description: >-
          Search conditions, each {"field": ..., "value": ..., "criteria":
          <operator>}. Several conditions are combined with AND.
        items: {type: object}
      order_by:
        type: string
        description: Field to sort the matches by.
        optional: true
      limit:
        type: integer
        description: Matches per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many matches to skip.
        optional: true
        minimum: 0
    output:
      description: The matching contacts.
      type: array
      items: {type: object}

  get_contact:
    title: Get a contact
    description: Read one contact in full -- names, address, communication details and owner.
    category: contacts
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/contact/${contact_id}
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The contact.
      type: object

  create_contact:
    title: Create a contact
    description: >-
      Create a contact. `contact_type_id` is 1 for a company and 2 for a
      person; `name_1` is the company name or the surname, `name_2` the first
      name. `user_id` and `owner_id` must be real bexio users.
    category: contacts
    scopes: [contact_edit]
    request:
      method: POST
      path: /2.0/contact
      body:
        contact_type_id: "${contact_type_id}"
        name_1: "${name_1}"
        name_2: "${name_2}"
        salutation_id: "${salutation_id}"
        title_id: "${title_id}"
        mail: "${mail}"
        mail_second: "${mail_second}"
        phone_fixed: "${phone_fixed}"
        phone_mobile: "${phone_mobile}"
        address: "${address}"
        postcode: "${postcode}"
        city: "${city}"
        country_id: "${country_id}"
        url: "${url}"
        contact_group_ids: "${contact_group_ids}"
        contact_branch_id: "${contact_branch_id}"
        user_id: "${user_id}"
        owner_id: "${owner_id}"
        language_id: "${language_id}"
        remarks: "${remarks}"
        nr: "${nr}"
    input:
      contact_type_id:
        type: integer
        description: 1 for a company, 2 for a person.
        enum: [1, 2]
      name_1:
        type: string
        description: Company name, or the person's surname.
      name_2:
        type: string
        description: The person's first name; leave out for a company.
        optional: true
      salutation_id:
        type: integer
        description: Salutation id, from list_salutations.
        optional: true
      title_id:
        type: integer
        description: Title id, from list_titles.
        optional: true
      mail:
        type: string
        description: Primary email address.
        optional: true
        format: email
      mail_second:
        type: string
        description: Secondary email address.
        optional: true
      phone_fixed:
        type: string
        description: Landline number.
        optional: true
      phone_mobile:
        type: string
        description: Mobile number.
        optional: true
      address:
        type: string
        description: Street address.
        optional: true
      postcode:
        type: string
        description: Postcode.
        optional: true
      city:
        type: string
        description: City.
        optional: true
      country_id:
        type: integer
        description: Country id, as bexio numbers them.
        optional: true
      url:
        type: string
        description: Website.
        optional: true
      contact_group_ids:
        type: string
        description: Comma-separated contact group ids, from list_contact_groups.
        optional: true
      contact_branch_id:
        type: integer
        description: Industry branch id, from list_contact_branches.
        optional: true
      user_id:
        type: integer
        description: bexio user who created the contact.
        optional: true
      owner_id:
        type: integer
        description: bexio user responsible for the contact.
        optional: true
      language_id:
        type: integer
        description: Correspondence language id.
        optional: true
      remarks:
        type: string
        description: Free-text notes on the contact.
        optional: true
      nr:
        type: string
        description: Your own contact number. bexio assigns one when omitted.
        optional: true
    output:
      description: The created contact.
      type: object

  update_contact:
    title: Update a contact
    description: >-
      Change a contact's fields. bexio uses POST to the contact's own url for
      updates, and only the fields you send are touched.
    category: contacts
    scopes: [contact_edit]
    request:
      method: POST
      path: /2.0/contact/${contact_id}
      body:
        name_1: "${name_1}"
        name_2: "${name_2}"
        mail: "${mail}"
        phone_fixed: "${phone_fixed}"
        phone_mobile: "${phone_mobile}"
        address: "${address}"
        postcode: "${postcode}"
        city: "${city}"
        country_id: "${country_id}"
        url: "${url}"
        contact_group_ids: "${contact_group_ids}"
        owner_id: "${owner_id}"
        remarks: "${remarks}"
    input:
      contact_id:
        type: integer
        description: The contact's id.
      name_1:
        type: string
        description: New company name or surname.
        optional: true
      name_2:
        type: string
        description: New first name.
        optional: true
      mail:
        type: string
        description: New primary email address.
        optional: true
      phone_fixed:
        type: string
        description: New landline number.
        optional: true
      phone_mobile:
        type: string
        description: New mobile number.
        optional: true
      address:
        type: string
        description: New street address.
        optional: true
      postcode:
        type: string
        description: New postcode.
        optional: true
      city:
        type: string
        description: New city.
        optional: true
      country_id:
        type: integer
        description: New country id.
        optional: true
      url:
        type: string
        description: New website.
        optional: true
      contact_group_ids:
        type: string
        description: New comma-separated contact group ids.
        optional: true
      owner_id:
        type: integer
        description: New responsible bexio user.
        optional: true
      remarks:
        type: string
        description: New notes.
        optional: true
    output:
      description: The updated contact.
      type: object

  create_contacts_bulk:
    title: Create many contacts at once
    description: >-
      Create a batch of contacts in one call. Each entry takes the same fields
      as create_contact, so this is the import path rather than a call per row.
    category: contacts
    scopes: [contact_edit]
    request:
      method: POST
      path: /2.0/contact/_bulk_create
      body: "${contacts}"
    input:
      contacts:
        type: array
        description: The contacts to create, each shaped like create_contact's body.
        items: {type: object}
    output:
      description: The created contacts.
      type: array
      items: {type: object}

  delete_contact:
    title: Delete a contact
    description: >-
      Delete a contact. bexio keeps it recoverable for a while --
      restore_contact brings it back -- but documents referencing it are
      affected immediately.
    category: contacts
    scopes: [contact_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/contact/${contact_id}
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: Confirmation that the contact was deleted.
      type: object

  restore_contact:
    title: Restore a deleted contact
    description: Undo a contact deletion, bringing the record and its links back.
    category: contacts
    scopes: [contact_edit]
    request:
      method: PATCH
      path: /2.0/contact/${contact_id}/restore
    input:
      contact_id:
        type: integer
        description: The contact's id.
    output:
      description: The restored contact.
      type: object

  list_contact_relations:
    title: List contact relations
    description: >-
      Read the links between contacts -- which people belong to which company.
      A relation joins a person contact to a company contact.
    category: contacts
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/contact_relation
      query:
        limit: "${limit}"
        offset: "${offset}"
        order_by: "${order_by}"
    input:
      limit:
        type: integer
        description: Relations per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
      order_by:
        type: string
        description: Field to sort by.
        optional: true
    output:
      description: A page of contact relations.
      type: array
      items: {type: object}

  create_contact_relation:
    title: Link a person to a company
    description: >-
      Create a contact relation, attaching a person contact to a company
      contact with an optional description of their role.
    category: contacts
    scopes: [contact_edit]
    request:
      method: POST
      path: /2.0/contact_relation
      body:
        contact_id: "${contact_id}"
        contact_sub_id: "${contact_sub_id}"
        description: "${description}"
    input:
      contact_id:
        type: integer
        description: The company contact's id.
      contact_sub_id:
        type: integer
        description: The person contact's id.
      description:
        type: string
        description: What the person does at the company.
        optional: true
    output:
      description: The created relation.
      type: object

  delete_contact_relation:
    title: Delete a contact relation
    description: >-
      Unlink a person from a company. Both contacts survive; only the
      relationship goes.
    category: contacts
    scopes: [contact_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/contact_relation/${contact_relation_id}
    input:
      contact_relation_id:
        type: integer
        description: The relation's id, from list_contact_relations.
    output:
      description: Confirmation that the relation was deleted.
      type: object

  list_contact_groups:
    title: List contact groups
    description: >-
      Read the contact groups on the account -- bexio's contact tagging. Group
      ids are what a contact's `contact_group_ids` holds.
    category: contacts
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/contact_group
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: Groups per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: A page of contact groups.
      type: array
      items: {type: object}

  create_contact_group:
    title: Create a contact group
    description: Create a contact group, which contacts can then be tagged with.
    category: contacts
    scopes: [contact_edit]
    request:
      method: POST
      path: /2.0/contact_group
      body:
        name: "${name}"
    input:
      name:
        type: string
        description: The group's name.
    output:
      description: The created contact group.
      type: object

  list_contact_branches:
    title: List industry branches
    description: >-
      Read the industry branches bexio knows, whose ids a contact's
      `contact_branch_id` takes.
    category: metadata
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/contact_branch
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: Branches per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: A page of industry branches.
      type: array
      items: {type: object}

  list_salutations:
    title: List salutations
    description: >-
      Read the salutations configured on the account, whose ids a contact's
      `salutation_id` takes.
    category: metadata
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/salutation
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: Salutations per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: A page of salutations.
      type: array
      items: {type: object}

  list_titles:
    title: List titles
    description: >-
      Read the personal titles configured on the account, whose ids a contact's
      `title_id` takes.
    category: metadata
    scopes: [contact_show]
    read_only: true
    request:
      method: GET
      path: /2.0/title
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: Titles per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: A page of titles.
      type: array
      items: {type: object}

  list_taxes:
    title: List taxes
    description: >-
      Read the VAT rates configured on the account. A position's `tax_id` must
      be one of these, so this is the lookup before building a document.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /3.0/taxes
      query:
        limit: "${limit}"
        offset: "${offset}"
        scope: "${scope}"
    input:
      limit:
        type: integer
        description: Taxes per page.
        optional: true
        minimum: 1
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
      scope:
        type: string
        description: Restrict to taxes valid for a scope, e.g. "active".
        optional: true
    output:
      description: A page of tax rates.
      type: object

  get_document_item_settings:
    title: Get document item settings
    description: >-
      Read the account's defaults for document line items -- how positions are
      numbered and which fields are shown. Useful context before composing a
      document.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /2.0/kb_item_setting
    input: {}
    output:
      description: The document item settings.
      type: object

  # -- quotes --------------------------------------------------------------

  list_quotes:
    title: List quotes
    description: >-
      Read a page of quotes (bexio calls them offers), with their number,
      contact, total and state.
    category: quotes
    scopes: [kb_offer_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_offer
      query:
        limit: "${limit}"
        offset: "${offset}"
        order_by: "${order_by}"
    input:
      limit:
        type: integer
        description: Quotes per page (max 2000).
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
      order_by:
        type: string
        description: Field to sort by, e.g. "id_desc".
        optional: true
    output:
      description: A page of quotes.
      type: array
      items: {type: object}

  search_quotes:
    title: Search quotes
    description: >-
      Find quotes by field, using the same criteria list as search_contacts --
      e.g. [{"field": "contact_id", "value": 12, "criteria": "="}].
    category: quotes
    scopes: [kb_offer_show]
    read_only: true
    request:
      method: POST
      path: /2.0/kb_offer/search
      query:
        limit: "${limit}"
        offset: "${offset}"
      body: "${criteria}"
    input:
      criteria:
        type: array
        description: 'Search conditions, each {"field": ..., "value": ..., "criteria": <operator>}.'
        items: {type: object}
      limit:
        type: integer
        description: Matches per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many matches to skip.
        optional: true
        minimum: 0
    output:
      description: The matching quotes.
      type: array
      items: {type: object}

  get_quote:
    title: Get a quote
    description: Read one quote in full, including its positions and totals.
    category: quotes
    scopes: [kb_offer_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_offer/${quote_id}
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The quote.
      type: object

  create_quote:
    title: Create a quote
    description: >-
      Create a quote for a contact. It starts as a draft with no number --
      issue_quote makes it real. `positions` holds the line items, each with a
      type such as "KbPositionArticle" or "KbPositionCustom" plus amount,
      unit price and `tax_id`.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        contact_sub_id: "${contact_sub_id}"
        user_id: "${user_id}"
        pr_project_id: "${project_id}"
        language_id: "${language_id}"
        bank_account_id: "${bank_account_id}"
        currency_id: "${currency_id}"
        payment_type_id: "${payment_type_id}"
        header: "${header}"
        footer: "${footer}"
        is_valid_from: "${valid_from}"
        is_valid_until: "${valid_until}"
        delivery_address_type: "${delivery_address_type}"
        mwst_type: "${vat_type}"
        mwst_is_net: "${prices_are_net}"
        positions: "${positions}"
    input:
      contact_id:
        type: integer
        description: The contact the quote is for.
      user_id:
        type: integer
        description: The bexio user issuing the quote.
      title:
        type: string
        description: Title shown on the document.
        optional: true
      contact_sub_id:
        type: integer
        description: A person contact at the company, for the attention line.
        optional: true
      project_id:
        type: integer
        description: Project to attribute the quote to.
        optional: true
      language_id:
        type: integer
        description: Document language id.
        optional: true
      bank_account_id:
        type: integer
        description: Bank account shown on the document.
        optional: true
      currency_id:
        type: integer
        description: Currency id for the amounts.
        optional: true
      payment_type_id:
        type: integer
        description: Payment terms id.
        optional: true
      header:
        type: string
        description: Text above the line items.
        optional: true
      footer:
        type: string
        description: Text below the line items.
        optional: true
      valid_from:
        type: string
        description: Date the quote is valid from, YYYY-MM-DD.
        optional: true
      valid_until:
        type: string
        description: Date the quote expires, YYYY-MM-DD.
        optional: true
      delivery_address_type:
        type: integer
        description: Which address to print as the delivery address.
        optional: true
      vat_type:
        type: integer
        description: VAT handling for the document, as bexio's `mwst_type` codes.
        optional: true
      prices_are_net:
        type: boolean
        description: Whether the position prices are net of VAT.
        optional: true
      positions:
        type: array
        description: >-
          Line items, each with a `type` ("KbPositionArticle",
          "KbPositionCustom", "KbPositionText", "KbPositionSubtotal",
          "KbPositionDiscount") plus its own fields -- amount, unit_price,
          tax_id, text.
        optional: true
        items: {type: object}
    output:
      description: The created quote.
      type: object

  update_quote:
    title: Update a quote
    description: >-
      Change a draft quote's fields. Once a quote has been issued, bexio
      restricts what may still be edited.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        header: "${header}"
        footer: "${footer}"
        is_valid_until: "${valid_until}"
        positions: "${positions}"
    input:
      quote_id:
        type: integer
        description: The quote's id.
      title:
        type: string
        description: New document title.
        optional: true
      contact_id:
        type: integer
        description: Move the quote to another contact.
        optional: true
      header:
        type: string
        description: New header text.
        optional: true
      footer:
        type: string
        description: New footer text.
        optional: true
      valid_until:
        type: string
        description: New expiry date, YYYY-MM-DD.
        optional: true
      positions:
        type: array
        description: Replacement line items.
        optional: true
        items: {type: object}
    output:
      description: The updated quote.
      type: object

  issue_quote:
    title: Issue a quote
    description: >-
      Issue a draft quote, which gives it its document number and makes it
      real. Nothing is sent to the customer -- send_quote does that.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/issue
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The issued quote.
      type: object

  revert_issue_quote:
    title: Un-issue a quote
    description: >-
      Take an issued quote back to draft, releasing its number. Do this only
      if it has not gone to the customer.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/revertIssue
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The quote, back in draft.
      type: object

  send_quote:
    title: Email a quote to the customer
    description: >-
      Send the quote by email through bexio. This reaches the recipient
      immediately and cannot be recalled; mark_quote_as_sent is the
      record-keeping alternative when you sent it yourself.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/send
      body:
        recipient_email: "${recipient_email}"
        subject: "${subject}"
        message: "${message}"
        mark_as_open: "${mark_as_open}"
    input:
      quote_id:
        type: integer
        description: The quote's id.
      recipient_email:
        type: string
        description: Where to send it. Defaults to the contact's own address.
        optional: true
        format: email
      subject:
        type: string
        description: Subject line for the email.
        optional: true
      message:
        type: string
        description: Body of the email.
        optional: true
      mark_as_open:
        type: boolean
        description: Also mark the quote as open once sent.
        optional: true
    output:
      description: Confirmation that the quote was sent.
      type: object

  mark_quote_as_sent:
    title: Mark a quote as sent
    description: >-
      Record that a quote has gone to the customer without bexio sending it.
      Use when you posted or emailed it yourself.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/mark_as_sent
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The quote, marked as sent.
      type: object

  accept_quote:
    title: Accept a quote
    description: >-
      Mark a quote accepted by the customer, which is the state change that
      justifies turning it into an order.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/accept
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The accepted quote.
      type: object

  reject_quote:
    title: Reject a quote
    description: Mark a quote declined by the customer, closing it off without deleting it.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/reject
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The rejected quote.
      type: object

  reissue_quote:
    title: Reissue a quote
    description: >-
      Issue a fresh version of a quote, which is how you revise one that has
      already gone out rather than editing history.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/reissue
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The reissued quote.
      type: object

  copy_quote:
    title: Copy a quote
    description: >-
      Duplicate a quote as a new draft, positions and all -- the quick way to
      quote something similar again.
    category: quotes
    scopes: [kb_offer_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/copy
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The new quote.
      type: object

  create_order_from_quote:
    title: Turn a quote into an order
    description: >-
      Create an order from an accepted quote, carrying its positions over and
      keeping the link back to the quote. The next step in the sales chain.
    category: quotes
    scopes: [kb_offer_edit, kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/order
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The created order.
      type: object

  create_invoice_from_quote:
    title: Turn a quote into an invoice
    description: >-
      Create an invoice straight from a quote, skipping the order stage. The
      invoice starts as a draft and still needs issuing.
    category: quotes
    scopes: [kb_offer_edit, kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_offer/${quote_id}/invoice
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The created invoice.
      type: object

  get_quote_pdf:
    title: Get a quote's PDF
    description: >-
      Read the rendered PDF of a quote -- what the customer would receive --
      as base64 content with its file name.
    category: quotes
    scopes: [kb_offer_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_offer/${quote_id}/pdf
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: The PDF's name, size, mime type and base64 content.
      type: object

  delete_quote:
    title: Delete a quote
    description: >-
      Delete a quote. bexio refuses once a document has been converted into an
      order or invoice, since that would break the chain.
    category: quotes
    scopes: [kb_offer_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_offer/${quote_id}
    input:
      quote_id:
        type: integer
        description: The quote's id.
    output:
      description: Confirmation that the quote was deleted.
      type: object

  # -- orders --------------------------------------------------------------

  list_orders:
    title: List orders
    description: Read a page of orders, with their number, contact, total and state.
    category: orders
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_order
      query:
        limit: "${limit}"
        offset: "${offset}"
        order_by: "${order_by}"
    input:
      limit:
        type: integer
        description: Orders per page (max 2000).
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
      order_by:
        type: string
        description: Field to sort by.
        optional: true
    output:
      description: A page of orders.
      type: array
      items: {type: object}

  search_orders:
    title: Search orders
    description: >-
      Find orders by field, with the same criteria list as search_contacts --
      e.g. by contact id or document number.
    category: orders
    scopes: [kb_order_show]
    read_only: true
    request:
      method: POST
      path: /2.0/kb_order/search
      query:
        limit: "${limit}"
        offset: "${offset}"
      body: "${criteria}"
    input:
      criteria:
        type: array
        description: 'Search conditions, each {"field": ..., "value": ..., "criteria": <operator>}.'
        items: {type: object}
      limit:
        type: integer
        description: Matches per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many matches to skip.
        optional: true
        minimum: 0
    output:
      description: The matching orders.
      type: array
      items: {type: object}

  get_order:
    title: Get an order
    description: Read one order in full, including its positions and totals.
    category: orders
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_order/${order_id}
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The order.
      type: object

  create_order:
    title: Create an order
    description: >-
      Create an order for a contact directly, rather than from a quote.
      `positions` takes the same line-item shapes as create_quote.
    category: orders
    scopes: [kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_order
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        contact_sub_id: "${contact_sub_id}"
        user_id: "${user_id}"
        pr_project_id: "${project_id}"
        language_id: "${language_id}"
        bank_account_id: "${bank_account_id}"
        currency_id: "${currency_id}"
        payment_type_id: "${payment_type_id}"
        header: "${header}"
        footer: "${footer}"
        is_valid_from: "${valid_from}"
        delivery_address_type: "${delivery_address_type}"
        mwst_type: "${vat_type}"
        mwst_is_net: "${prices_are_net}"
        positions: "${positions}"
    input:
      contact_id:
        type: integer
        description: The contact the order is for.
      user_id:
        type: integer
        description: The bexio user placing the order.
      title:
        type: string
        description: Title shown on the document.
        optional: true
      contact_sub_id:
        type: integer
        description: A person contact at the company, for the attention line.
        optional: true
      project_id:
        type: integer
        description: Project to attribute the order to.
        optional: true
      language_id:
        type: integer
        description: Document language id.
        optional: true
      bank_account_id:
        type: integer
        description: Bank account shown on the document.
        optional: true
      currency_id:
        type: integer
        description: Currency id.
        optional: true
      payment_type_id:
        type: integer
        description: Payment terms id.
        optional: true
      header:
        type: string
        description: Text above the line items.
        optional: true
      footer:
        type: string
        description: Text below the line items.
        optional: true
      valid_from:
        type: string
        description: Order date, YYYY-MM-DD.
        optional: true
      delivery_address_type:
        type: integer
        description: Which address to print as the delivery address.
        optional: true
      vat_type:
        type: integer
        description: VAT handling code for the document.
        optional: true
      prices_are_net:
        type: boolean
        description: Whether position prices are net of VAT.
        optional: true
      positions:
        type: array
        description: Line items, in the same shapes create_quote accepts.
        optional: true
        items: {type: object}
    output:
      description: The created order.
      type: object

  update_order:
    title: Update an order
    description: Change an order's title, contact, header, footer or line items.
    category: orders
    scopes: [kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_order/${order_id}
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        header: "${header}"
        footer: "${footer}"
        positions: "${positions}"
    input:
      order_id:
        type: integer
        description: The order's id.
      title:
        type: string
        description: New document title.
        optional: true
      contact_id:
        type: integer
        description: Move the order to another contact.
        optional: true
      header:
        type: string
        description: New header text.
        optional: true
      footer:
        type: string
        description: New footer text.
        optional: true
      positions:
        type: array
        description: Replacement line items.
        optional: true
        items: {type: object}
    output:
      description: The updated order.
      type: object

  create_delivery_from_order:
    title: Turn an order into a delivery note
    description: >-
      Create a delivery note from an order, carrying its positions over. The
      shipping half of the sales chain.
    category: orders
    scopes: [kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_order/${order_id}/delivery
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The created delivery note.
      type: object

  create_invoice_from_order:
    title: Turn an order into an invoice
    description: >-
      Create an invoice from an order, keeping the link between them. The
      invoice starts as a draft and still needs issuing.
    category: orders
    scopes: [kb_order_edit, kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_order/${order_id}/invoice
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The created invoice.
      type: object

  get_order_pdf:
    title: Get an order's PDF
    description: Read the rendered PDF of an order as base64 content with its file name.
    category: orders
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_order/${order_id}/pdf
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The PDF's name, size, mime type and base64 content.
      type: object

  get_order_repetition:
    title: Get an order's recurrence
    description: >-
      Read the repetition settings on an order -- how often bexio regenerates
      it, if it is a recurring order.
    category: orders
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_order/${order_id}/repetition
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: The order's repetition settings.
      type: object

  set_order_repetition:
    title: Make an order recurring
    description: >-
      Set an order to repeat on a schedule, which is how bexio generates
      subscription-style billing. `repetition` holds the interval settings.
    category: orders
    scopes: [kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_order/${order_id}/repetition
      body: "${repetition}"
    input:
      order_id:
        type: integer
        description: The order's id.
      repetition:
        type: object
        description: >-
          The recurrence settings, in the shape get_order_repetition returns --
          interval, start and end.
    output:
      description: The order's repetition settings after the change.
      type: object

  delete_order_repetition:
    title: Stop an order recurring
    description: Remove an order's recurrence so no further documents are generated from it.
    category: orders
    scopes: [kb_order_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_order/${order_id}/repetition
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: Confirmation that the recurrence was removed.
      type: object

  delete_order:
    title: Delete an order
    description: >-
      Delete an order. Refused once it has been turned into a delivery note or
      invoice.
    category: orders
    scopes: [kb_order_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_order/${order_id}
    input:
      order_id:
        type: integer
        description: The order's id.
    output:
      description: Confirmation that the order was deleted.
      type: object

  # -- deliveries ----------------------------------------------------------

  list_deliveries:
    title: List delivery notes
    description: Read a page of delivery notes, with the order and contact each belongs to.
    category: deliveries
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_delivery
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: Delivery notes per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
    output:
      description: A page of delivery notes.
      type: array
      items: {type: object}

  get_delivery:
    title: Get a delivery note
    description: Read one delivery note in full, including its positions.
    category: deliveries
    scopes: [kb_order_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_delivery/${delivery_id}
    input:
      delivery_id:
        type: integer
        description: The delivery note's id.
    output:
      description: The delivery note.
      type: object

  issue_delivery:
    title: Issue a delivery note
    description: >-
      Issue a draft delivery note, giving it its number and confirming the
      goods as dispatched.
    category: deliveries
    scopes: [kb_order_edit]
    request:
      method: POST
      path: /2.0/kb_delivery/${delivery_id}/issue
    input:
      delivery_id:
        type: integer
        description: The delivery note's id.
    output:
      description: The issued delivery note.
      type: object

  # -- invoices ------------------------------------------------------------

  list_invoices:
    title: List invoices
    description: >-
      Read a page of invoices with their number, contact, total and payment
      state. Use search_invoices to find unpaid ones or one customer's.
    category: invoices
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice
      query:
        limit: "${limit}"
        offset: "${offset}"
        order_by: "${order_by}"
    input:
      limit:
        type: integer
        description: Invoices per page (max 2000).
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many to skip.
        optional: true
        minimum: 0
      order_by:
        type: string
        description: Field to sort by, e.g. "id_desc".
        optional: true
    output:
      description: A page of invoices.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          document_nr: {type: string}
          total: {type: string}
          kb_item_status_id: {type: integer}

  search_invoices:
    title: Search invoices
    description: >-
      Find invoices by field with the usual criteria list -- by contact,
      document number or status, which is how you get "everything unpaid for
      this customer" in one call.
    category: invoices
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: POST
      path: /2.0/kb_invoice/search
      query:
        limit: "${limit}"
        offset: "${offset}"
      body: "${criteria}"
    input:
      criteria:
        type: array
        description: 'Search conditions, each {"field": ..., "value": ..., "criteria": <operator>}.'
        items: {type: object}
      limit:
        type: integer
        description: Matches per page.
        optional: true
        minimum: 1
        maximum: 2000
      offset:
        type: integer
        description: How many matches to skip.
        optional: true
        minimum: 0
    output:
      description: The matching invoices.
      type: array
      items: {type: object}

  get_invoice:
    title: Get an invoice
    description: Read one invoice in full -- positions, totals and payment state.
    category: invoices
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice/${invoice_id}
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The invoice.
      type: object

  create_invoice:
    title: Create an invoice
    description: >-
      Create an invoice for a contact. It starts as a draft with no number:
      issue_invoice makes it real, and only then does it count as receivable.
      `positions` takes the same line-item shapes as create_quote.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        contact_sub_id: "${contact_sub_id}"
        user_id: "${user_id}"
        pr_project_id: "${project_id}"
        language_id: "${language_id}"
        bank_account_id: "${bank_account_id}"
        currency_id: "${currency_id}"
        payment_type_id: "${payment_type_id}"
        header: "${header}"
        footer: "${footer}"
        is_valid_from: "${valid_from}"
        is_valid_to: "${valid_to}"
        reference: "${reference}"
        mwst_type: "${vat_type}"
        mwst_is_net: "${prices_are_net}"
        positions: "${positions}"
    input:
      contact_id:
        type: integer
        description: The contact to invoice.
      user_id:
        type: integer
        description: The bexio user issuing the invoice.
      title:
        type: string
        description: Title shown on the document.
        optional: true
      contact_sub_id:
        type: integer
        description: A person contact at the company, for the attention line.
        optional: true
      project_id:
        type: integer
        description: Project to attribute the invoice to.
        optional: true
      language_id:
        type: integer
        description: Document language id.
        optional: true
      bank_account_id:
        type: integer
        description: Bank account shown for payment.
        optional: true
      currency_id:
        type: integer
        description: Currency id.
        optional: true
      payment_type_id:
        type: integer
        description: Payment terms id, which sets the due date.
        optional: true
      header:
        type: string
        description: Text above the line items.
        optional: true
      footer:
        type: string
        description: Text below the line items.
        optional: true
      valid_from:
        type: string
        description: Invoice date, YYYY-MM-DD.
        optional: true
      valid_to:
        type: string
        description: Due date, YYYY-MM-DD.
        optional: true
      reference:
        type: string
        description: Your reference for the invoice.
        optional: true
      vat_type:
        type: integer
        description: VAT handling code for the document.
        optional: true
      prices_are_net:
        type: boolean
        description: Whether position prices are net of VAT.
        optional: true
      positions:
        type: array
        description: Line items, in the same shapes create_quote accepts.
        optional: true
        items: {type: object}
    output:
      description: The created invoice.
      type: object

  update_invoice:
    title: Update an invoice
    description: >-
      Change an invoice's fields. An issued invoice is largely locked -- for
      anything substantive, cancel it and issue a new one rather than editing.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}
      body:
        title: "${title}"
        contact_id: "${contact_id}"
        header: "${header}"
        footer: "${footer}"
        is_valid_to: "${valid_to}"
        reference: "${reference}"
        positions: "${positions}"
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      title:
        type: string
        description: New document title.
        optional: true
      contact_id:
        type: integer
        description: Move the invoice to another contact.
        optional: true
      header:
        type: string
        description: New header text.
        optional: true
      footer:
        type: string
        description: New footer text.
        optional: true
      valid_to:
        type: string
        description: New due date, YYYY-MM-DD.
        optional: true
      reference:
        type: string
        description: New reference.
        optional: true
      positions:
        type: array
        description: Replacement line items.
        optional: true
        items: {type: object}
    output:
      description: The updated invoice.
      type: object

  issue_invoice:
    title: Issue an invoice
    description: >-
      Issue a draft invoice: it gets its document number, becomes part of your
      accounting, and stops being freely editable. Nothing is sent to the
      customer yet.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/issue
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The issued invoice.
      type: object

  revert_issue_invoice:
    title: Un-issue an invoice
    description: >-
      Return an issued invoice to draft, releasing its number. Only sensible
      before it reached the customer -- otherwise cancel it instead.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/revert_issue
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The invoice, back in draft.
      type: object

  cancel_invoice:
    title: Cancel an invoice
    description: >-
      Cancel an issued invoice, recording the cancellation in your accounting
      rather than erasing the document. This is the correct way to void an
      invoice the customer has seen.
    category: invoices
    scopes: [kb_invoice_edit]
    destructive: true
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/cancel
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The cancelled invoice.
      type: object

  send_invoice:
    title: Email an invoice to the customer
    description: >-
      Send the invoice by email through bexio. It reaches the customer at once
      and cannot be recalled; mark_invoice_as_sent is the record-only
      alternative.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/send
      body:
        recipient_email: "${recipient_email}"
        subject: "${subject}"
        message: "${message}"
        mark_as_open: "${mark_as_open}"
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      recipient_email:
        type: string
        description: Where to send it. Defaults to the contact's own address.
        optional: true
        format: email
      subject:
        type: string
        description: Subject line for the email.
        optional: true
      message:
        type: string
        description: Body of the email.
        optional: true
      mark_as_open:
        type: boolean
        description: Also mark the invoice as open once sent.
        optional: true
    output:
      description: Confirmation that the invoice was sent.
      type: object

  mark_invoice_as_sent:
    title: Mark an invoice as sent
    description: >-
      Record that an invoice has gone to the customer without bexio sending
      it -- for when you posted or emailed it yourself.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/mark_as_sent
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The invoice, marked as sent.
      type: object

  copy_invoice:
    title: Copy an invoice
    description: Duplicate an invoice as a new draft, positions and all.
    category: invoices
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/copy
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The new invoice.
      type: object

  get_invoice_pdf:
    title: Get an invoice's PDF
    description: >-
      Read the rendered PDF of an invoice as base64 content with its file
      name -- what the customer would receive.
    category: invoices
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice/${invoice_id}/pdf
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The PDF's name, size, mime type and base64 content.
      type: object

  delete_invoice:
    title: Delete an invoice
    description: >-
      Delete an invoice. Only a draft can go this way -- an issued invoice must
      be cancelled instead, which is what your accounting requires.
    category: invoices
    scopes: [kb_invoice_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_invoice/${invoice_id}
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: Confirmation that the invoice was deleted.
      type: object

  # -- payments and reminders ----------------------------------------------

  list_invoice_payments:
    title: List an invoice's payments
    description: >-
      Read the payments recorded against an invoice, which is what decides
      whether it still counts as open.
    category: payments
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice/${invoice_id}/payment
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The payments on that invoice.
      type: array
      items: {type: object}

  create_invoice_payment:
    title: Record a payment on an invoice
    description: >-
      Record money received against an invoice. `value` may be less than the
      total for a part payment, and the invoice's state follows automatically.
    category: payments
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/payment
      body:
        value: "${value}"
        date: "${date}"
        bank_account_id: "${bank_account_id}"
        currency_id: "${currency_id}"
        is_cash_discount: "${is_cash_discount}"
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      value:
        type: string
        description: Amount received, as a decimal string such as "1200.00".
      date:
        type: string
        description: Date the payment was received, YYYY-MM-DD.
      bank_account_id:
        type: integer
        description: Bank account the money landed in.
        optional: true
      currency_id:
        type: integer
        description: Currency of the payment.
        optional: true
      is_cash_discount:
        type: boolean
        description: Treat the shortfall as a cash discount rather than an underpayment.
        optional: true
    output:
      description: The recorded payment.
      type: object

  delete_invoice_payment:
    title: Delete a payment
    description: >-
      Remove a recorded payment from an invoice, which reopens the balance.
      Fix a mis-keyed amount this way rather than adding a negative payment.
    category: payments
    scopes: [kb_invoice_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_invoice/${invoice_id}/payment/${payment_id}
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      payment_id:
        type: integer
        description: The payment's id, from list_invoice_payments.
    output:
      description: Confirmation that the payment was deleted.
      type: object

  list_invoice_reminders:
    title: List an invoice's dunning reminders
    description: >-
      Read the reminders (dunning letters) raised against an unpaid invoice,
      with their level and whether each has been sent.
    category: payments
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
    output:
      description: The reminders on that invoice.
      type: array
      items: {type: object}

  create_invoice_reminder:
    title: Create a dunning reminder
    description: >-
      Raise a reminder on an overdue invoice. Creating it does not contact the
      customer -- send_invoice_reminder does that.
    category: payments
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder
      body:
        title: "${title}"
        is_valid_from: "${valid_from}"
        is_valid_to: "${valid_to}"
        language_id: "${language_id}"
        header: "${header}"
        footer: "${footer}"
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      title:
        type: string
        description: Title for the reminder document.
        optional: true
      valid_from:
        type: string
        description: Reminder date, YYYY-MM-DD.
        optional: true
      valid_to:
        type: string
        description: New payment deadline, YYYY-MM-DD.
        optional: true
      language_id:
        type: integer
        description: Document language id.
        optional: true
      header:
        type: string
        description: Text above the reminder body.
        optional: true
      footer:
        type: string
        description: Text below the reminder body.
        optional: true
    output:
      description: The created reminder.
      type: object

  send_invoice_reminder:
    title: Email a dunning reminder
    description: >-
      Send a reminder to the customer by email. This is a real chase letter
      landing in their inbox -- check the invoice really is unpaid first.
    category: payments
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder/${reminder_id}/send
      body:
        recipient_email: "${recipient_email}"
        subject: "${subject}"
        message: "${message}"
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      reminder_id:
        type: integer
        description: The reminder's id, from list_invoice_reminders.
      recipient_email:
        type: string
        description: Where to send it. Defaults to the contact's own address.
        optional: true
        format: email
      subject:
        type: string
        description: Subject line for the email.
        optional: true
      message:
        type: string
        description: Body of the email.
        optional: true
    output:
      description: Confirmation that the reminder was sent.
      type: object

  mark_invoice_reminder_as_sent:
    title: Mark a reminder as sent
    description: Record that a dunning reminder went out without bexio sending it.
    category: payments
    scopes: [kb_invoice_edit]
    request:
      method: POST
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder/${reminder_id}/mark_as_sent
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      reminder_id:
        type: integer
        description: The reminder's id.
    output:
      description: The reminder, marked as sent.
      type: object

  get_invoice_reminder_pdf:
    title: Get a reminder's PDF
    description: Read the rendered PDF of a dunning reminder as base64 content.
    category: payments
    scopes: [kb_invoice_show]
    read_only: true
    request:
      method: GET
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder/${reminder_id}/pdf
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      reminder_id:
        type: integer
        description: The reminder's id.
    output:
      description: The PDF's name, size, mime type and base64 content.
      type: object

  delete_invoice_reminder:
    title: Delete a dunning reminder
    description: >-
      Remove a reminder from an invoice -- for one raised in error, before it
      was sent.
    category: payments
    scopes: [kb_invoice_edit]
    destructive: true
    request:
      method: DELETE
      path: /2.0/kb_invoice/${invoice_id}/kb_reminder/${reminder_id}
    input:
      invoice_id:
        type: integer
        description: The invoice's id.
      reminder_id:
        type: integer
        description: The reminder's id.
    output:
      description: Confirmation that the reminder was deleted.
      type: object

  # -- document positions and comments -------------------------------------

  list_document_comments:
    title: List a document's comments
    description: >-
      Read the internal comments on a sales document. `document_type` is
      "kb_invoice", "kb_offer" or "kb_order" -- the same endpoint serves all
      three.
    category: documents
    read_only: true
    request:
      method: GET
      path: /2.0/${document_type}/${document_id}/comment
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
    output:
      description: The document's comments.
      type: array
      items: {type: object}

  create_document_comment:
    title: Comment on a document
    description: >-
      Add an internal comment to an invoice, quote or order -- notes for
      colleagues rather than anything the customer sees.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/comment
      body:
        text: "${text}"
        user_id: "${user_id}"
        is_public: "${is_public}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      text:
        type: string
        description: The comment text.
      user_id:
        type: integer
        description: bexio user the comment is attributed to.
        optional: true
      is_public:
        type: boolean
        description: Whether the comment is visible outside your team.
        optional: true
    output:
      description: The created comment.
      type: object

  list_document_article_positions:
    title: List a document's article line items
    description: >-
      Read the article positions on an invoice, quote or order -- the line
      items that reference a catalogue article, with quantity, price and tax.
    category: documents
    read_only: true
    request:
      method: GET
      path: /2.0/${document_type}/${document_id}/kb_position_article
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
    output:
      description: The document's article positions.
      type: array
      items: {type: object}

  create_document_article_position:
    title: Add an article line item
    description: >-
      Add a catalogue article as a line item on a document. `article_id` picks
      the article; `amount` is the quantity and `tax_id` must be a rate from
      list_taxes.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/kb_position_article
      body:
        article_id: "${article_id}"
        amount: "${amount}"
        unit_price: "${unit_price}"
        discount_in_percent: "${discount_in_percent}"
        tax_id: "${tax_id}"
        text: "${text}"
        unit_id: "${unit_id}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      article_id:
        type: integer
        description: The catalogue article to add.
      amount:
        type: string
        description: Quantity, as a decimal string such as "2.00".
      unit_price:
        type: string
        description: Unit price, as a decimal string. Defaults to the article's own price.
        optional: true
      discount_in_percent:
        type: string
        description: Line discount as a percentage, e.g. "10".
        optional: true
      tax_id:
        type: integer
        description: VAT rate id from list_taxes.
        optional: true
      text:
        type: string
        description: Line text, overriding the article's description.
        optional: true
      unit_id:
        type: integer
        description: Unit of measure id.
        optional: true
    output:
      description: The created position.
      type: object

  create_document_custom_position:
    title: Add a free-text line item
    description: >-
      Add a line item that is not a catalogue article -- a one-off charge with
      its own text, quantity and price.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/kb_position_custom
      body:
        amount: "${amount}"
        unit_price: "${unit_price}"
        text: "${text}"
        discount_in_percent: "${discount_in_percent}"
        tax_id: "${tax_id}"
        unit_id: "${unit_id}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      amount:
        type: string
        description: Quantity, as a decimal string.
      unit_price:
        type: string
        description: Unit price, as a decimal string.
      text:
        type: string
        description: What the line is for.
        optional: true
      discount_in_percent:
        type: string
        description: Line discount as a percentage.
        optional: true
      tax_id:
        type: integer
        description: VAT rate id from list_taxes.
        optional: true
      unit_id:
        type: integer
        description: Unit of measure id.
        optional: true
    output:
      description: The created position.
      type: object

  create_document_text_position:
    title: Add a text line to a document
    description: >-
      Insert a text-only row into a document -- a heading or a note between
      priced lines. It carries no amount.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/kb_position_text
      body:
        text: "${text}"
        show_pos_nr: "${show_position_number}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      text:
        type: string
        description: The text to show.
      show_position_number:
        type: boolean
        description: Whether the row takes a position number.
        optional: true
    output:
      description: The created position.
      type: object

  create_document_subtotal_position:
    title: Add a subtotal row
    description: >-
      Insert a subtotal row into a document, which sums the priced lines above
      it -- how long documents are broken into sections.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/kb_position_subtotal
      body:
        text: "${text}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      text:
        type: string
        description: Label for the subtotal row.
        optional: true
    output:
      description: The created position.
      type: object

  create_document_discount_position:
    title: Add a discount row
    description: >-
      Add a discount to a document, either as a percentage or an absolute
      amount, applied to the document total rather than one line.
    category: documents
    request:
      method: POST
      path: /2.0/${document_type}/${document_id}/kb_position_discount
      body:
        text: "${text}"
        value: "${value}"
        discount_total: "${is_absolute}"
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      value:
        type: string
        description: The discount, as a decimal string -- a percentage unless `is_absolute` is set.
      text:
        type: string
        description: Label for the discount row.
        optional: true
      is_absolute:
        type: boolean
        description: Treat `value` as an absolute amount rather than a percentage.
        optional: true
    output:
      description: The created position.
      type: object

  delete_document_position:
    title: Delete a line item
    description: >-
      Remove a line item from a document. `position_kind` names which family it
      belongs to, since bexio addresses each kind on its own path -- the
      document total changes immediately.
    category: documents
    destructive: true
    request:
      method: DELETE
      path: /2.0/${document_type}/${document_id}/${position_kind}/${position_id}
    input:
      document_type:
        type: string
        description: Which kind of document the id refers to.
        enum: [kb_invoice, kb_offer, kb_order]
      document_id:
        type: integer
        description: The document's id.
      position_kind:
        type: string
        description: Which family of position the line is.
        enum: [kb_position_article, kb_position_custom, kb_position_text,
               kb_position_subtotal, kb_position_discount]
      position_id:
        type: integer
        description: The position's id.
    output:
      description: Confirmation that the position was deleted.
      type: object
