  humanize_text:
    title: Humanize AI-generated text
    description: Humanize AI-generated text Rewrites AI-generated text into natural, human-sounding prose
      while preserving meaning and formatting. Texts shorter than 4 words are returned unchanged at no
      cost. Calls POST /api/v1/humanize on the provider's API.
    category: api
    request:
      method: POST
      path: /api/v1/humanize
      body:
        text: ${text}
        style: ${style}
        language: ${language}
        strength: ${strength}
    input:
      text:
        type: string
        description: The text to humanize (minimum 4 words).
      style:
        type: string
        description: Writing style for the humanized output.
        optional: true
        enum:
        - standard
        - academic
        - reddit
        - formal
      language:
        type: string
        description: Output language, as a language name (e.g. "French") or locale code (en, es, pt, it,
          fr, de, ca, va). Unrecognized values fall back to English.
        optional: true
      strength:
        type: number
        description: Humanization strength.
        optional: true
    output:
      description: Humanization succeeded.
      type: object
