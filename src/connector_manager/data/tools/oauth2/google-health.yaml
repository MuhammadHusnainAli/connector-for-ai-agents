    category: users
    request:
      method: PATCH
      path: /v4/${name}
      body: ${body}
    input:
      name:
        type: string
        description: 'Identifier. Data point name, only supported for the subset of identifiable data
          types. For the majority of the data types, individual data points do not need to be identified
          and this field would be empty. Format: users/{user}/dataTypes/{data_type}/dataPoints/{data_point}
          Example: users/abcd1234/dat'
      body:
        type: object
        description: The DataPoint resource, as the API's own reference defines it.
    output:
      description: The Operation resource.
      type: object
    scopes_any:
    - googlehealth.activity_and_fitness.writeonly
    - googlehealth.health_metrics_and_measurements.writeonly
    - googlehealth.logged_symptoms.writeonly
    - googlehealth.mindfulness.writeonly
    - googlehealth.nutrition.writeonly
    - googlehealth.reproductive_health.writeonly
    - googlehealth.sleep.writeonly
  reconcile_data_point:
    title: Reconcile data point
    description: Reconcile data points from multiple data sources into a single data stream.
    category: users
    request:
      method: GET
      path: /v4/${parent}/dataPoints:reconcile
