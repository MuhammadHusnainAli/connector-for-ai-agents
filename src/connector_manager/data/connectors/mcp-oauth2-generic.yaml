# Connector definitions: MCP_OAUTH2_GENERIC auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
cloudflare-mcp:
  auth_mode: MCP_OAUTH2_GENERIC
  categories:
  - dev-tools
  - mcp
  connection_config:
    mcp_server_url:
      description: The full URL of your Cloudflare Worker MCP server.
      example: https://my-mcp.myusername.workers.dev
      pattern: ^https://[a-zA-Z0-9.-]+(?:\:[0-9]+)?(?:/.*)?$
      title: Worker URL
      type: string
  display_name: Cloudflare (MCP)
  proxy:
    base_url: ${connectionConfig.mcp_server_url}
    headers:
      accept: application/json,text/event-stream
mcp-generic:
  auth_mode: MCP_OAUTH2_GENERIC
  categories:
  - mcp
  connection_config:
    mcp_server_url:
      description: The base URL of your MCP server
      example: https://mcp.notion.com/mcp
      pattern: ^https://[a-zA-Z0-9.-]+(?:\:[0-9]+)?(?:/.*)?$
      title: MCP Server URL
      type: string
  display_name: MCP Server OAuth2 (Generic)
