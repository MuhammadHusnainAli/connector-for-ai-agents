  list_issue_attachments:
    title: List an issue's attachments
    description: >-
      List the files attached to one issue, with their names and storage
      references.
    category: acc-issues
    read_only: true
    request:
      method: GET
      path: /construction/issues/v1/projects/${project_id}/attachments/${issue_id}/items
    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id whose attachments to list.
    output:
      description: The issue's attachments.
      type: object

  add_issue_attachments:
    title: Attach files to an issue
    description: >-
      Attach already-uploaded files to an issue. Each attachment entry names
      the stored document, so upload the bytes through Data Management first.
    category: acc-issues
    request:
      method: POST
      path: /construction/issues/v1/projects/${project_id}/attachments
      body:
        domainEntityId: "${domain_entity_id}"
        attachments: "${attachments}"
    input:
      project_id:
        type: string
        description: ACC project id.
      domain_entity_id:
        type: string
        description: Issue id the attachments belong to.
        optional: true
      attachments:
        type: array
        description: Attachment entries naming the uploaded files.
        optional: true
        items: {type: object}
    output:
      description: The attachments now on the issue.
      type: object

  delete_issue_attachment:
    title: Delete an issue attachment
    description: >-
      Remove one attachment from an issue. The underlying document in the
      project's files is untouched.
    category: acc-issues
    destructive: true
    request:
      method: DELETE
      path: /construction/issues/v1/projects/${project_id}/attachments/${issue_id}/items/${attachment_id}
    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id the attachment is on.
      attachment_id:
        type: string
        description: Attachment id to remove.
    output:
      description: Empty on success.
      type: object
