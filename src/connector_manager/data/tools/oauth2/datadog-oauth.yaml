        type: boolean
        description: Get the IDs of SLO monitors that reference this SLO.
        optional: true
    output:
      description: The requested record.
      type: object

  create_slo:
    title: Create an SLO object
    description: >-
      Create a service level objective over monitors or a metric query. The
      target and timeframe here define what "reliable enough" means for the
      service, and the error budget every later report is measured against.
    category: slos
    request:
      method: POST
      path: /v1/slo
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
