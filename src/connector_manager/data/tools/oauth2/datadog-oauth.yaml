  list_processes:
    title: Get all processes
    description: >-
      Get all processes. Datadog's reference documents the exact parameters
      and payload this call takes.
    category: infrastructure
    read_only: true
    request:
      method: GET
      path: /v2/processes
      query:
        search: "${search}"
        tags: "${tags}"
        from: "${from}"
        to: "${to}"
        page[limit]: "${page_limit_}"
        page[cursor]: "${page_cursor_}"
    input:
      search:
        type: string
        description: String to search processes by.
        optional: true
      tags:
        type: string
        description: Comma-separated list of tags to filter processes by.
        optional: true
      from:
        type: integer
        description: Unix timestamp (number of seconds since epoch) of the start of the query window. If not provided, the start of the query window will be 15 minutes before the `to` timestamp. If neither `from` nor `to` are provided, the query window will be `[now - 15m, now]`.
        optional: true
      to:
        type: integer
        description: Unix timestamp (number of seconds since epoch) of the end of the query window. If not provided, the end of the query window will be 15 minutes after the `from` timestamp. If neither `from` nor `to` are provided, the query window will be `[now - 15m, now]`.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of results returned.
        optional: true
        default: '1000'
      page_cursor_:
        type: string
        description: String to query the next page of results. This key is provided with each valid response from the API in `meta.page.after`.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

