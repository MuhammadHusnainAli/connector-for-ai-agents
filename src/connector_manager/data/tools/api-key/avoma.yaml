  get_revenue_timeline:
    title: Get a CRM entity's engagement timeline
    description: >-
      Read aggregated engagement against a CRM object -- an opportunity,
      account, contact or lead -- bucketed by day, week or month, which is the
      deal-activity view revenue teams ask for.
    category: revenue
    read_only: true
    request:
      method: GET
      path: /v1/revenue_intel/timeline/
      query:
        object_type: "${object_type}"
        crm_entity_id: "${crm_entity_id}"
        start_at: "${start_at}"
        end_at: "${end_at}"
        date_interval: "${date_interval}"
    input:
      object_type:
        type: string
        description: Kind of CRM object to report on.
        enum: [opportunity, account, contact, lead]
      crm_entity_id:
        type: string
        description: External id of the CRM object, e.g. a Salesforce id.
        optional: true
      start_at:
        type: string
        description: Start of the window, as an ISO 8601 timestamp.
      end_at:
        type: string
        description: End of the window; defaults to now.
        optional: true
      date_interval:
        type: string
        description: Bucket size for the aggregation.
        optional: true
        enum: [day, week, month]
    output:
      description: The aggregated engagement timeline for the CRM object.
      type: object

  get_revenue_timeline_details:
    title: List a CRM entity's engagement records
    description: >-
      Read the individual engagement records behind the timeline -- meetings,
      calls or emails against a CRM object -- optionally narrowed to one
      participant or to whether the rep or the customer started it.
    category: revenue
    read_only: true
    request:
      method: GET
      path: /v1/revenue_intel/timeline_details/
      query:
        object_type: "${object_type}"
        crm_entity_id: "${crm_entity_id}"
        type: "${type}"
        start_at: "${start_at}"
        end_at: "${end_at}"
        email: "${email}"
        host: "${host}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      object_type:
        type: string
        description: Kind of CRM object to report on.
        enum: [opportunity, account, contact, lead]
      crm_entity_id:
        type: string
        description: External id of the CRM object.
        optional: true
      type:
        type: string
        description: Kind of engagement record to return.
        enum: [meeting, call, email]
      start_at:
        type: string
        description: Start of the window, as an ISO 8601 timestamp.
      end_at:
        type: string
        description: End of the window; defaults to now.
        optional: true
      email:
        type: string
        description: Restrict to one participant's email address.
        optional: true
      host:
        type: string
        description: Whether the rep or the customer initiated the engagement.
        optional: true
        enum: [rep, customer]
      page:
        type: integer
        description: Page number.
        optional: true
      page_size:
        type: integer
        description: Records per page.
        optional: true
    output:
      description: A page of individual engagement records.
      type: object

  list_webhooks:
    title: List webhook subscriptions
    description: >-
      List the organization's webhook subscriptions, with the event each
      watches and the URL Avoma posts to.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /v1/webhooks/
    output:
      description: The organization's webhook subscriptions.
      type: object

  create_webhook:
    title: Create a webhook subscription
    description: >-
      Subscribe an HTTPS endpoint to an Avoma event -- AI notes finishing, or a
      scheduler booking being made, cancelled or moved. target_type 2 is a
      direct organization webhook; 1 is a Zapier-managed one.
    category: webhooks
    request:
      method: POST
      path: /v1/webhooks/
      body:
        event_type: "${event_type}"
        target_url: "${target_url}"
        target_type: "${target_type}"
        teams: "${teams}"
    input:
      event_type:
        type: string
        description: Event to subscribe to.
        enum: [AINOTE, MEETING_BOOKED_VIA_SCHEDULER, MEETING_BOOKED_VIA_SCHEDULER_CANCELED, MEETING_BOOKED_VIA_SCHEDULER_RESCHEDULED, new_conversation]
      target_url:
        type: string
        description: HTTPS URL Avoma posts the event payload to.
      target_type:
        type: integer
        description: 2 for a direct organization webhook, 1 for a Zapier-managed one.
        optional: true
        enum: [1, 2]
      teams:
        type: array
        description: Team uuids to restrict the webhook to; omit for the whole organization.
        optional: true
        items: {type: string}
    output:
      description: The created webhook subscription.
      type: object

  delete_webhook:
    title: Delete a webhook subscription
    description: >-
      Deactivate a webhook subscription, so Avoma stops delivering that event to
      the URL.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /v1/webhooks/${uuid}/
    input:
      uuid:
        type: string
        description: Webhook subscription uuid to deactivate.
    output:
      description: Empty on success.
      type: object

  get_webhook_signing_secret:
    title: Get the webhook signing secret
    description: >-
      Read the HMAC secret Avoma signs outbound webhook payloads with, so you
      can verify deliveries.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /v1/webhooks/signing-secret/
    output:
      description: The current webhook signing secret.
      type: object

  set_webhook_signing_secret:
    title: Set the webhook signing secret
    description: >-
      Set the HMAC secret Avoma uses to sign webhook payloads. Deliveries
      signed with the old secret stop verifying immediately.
    category: webhooks
    request:
      method: PATCH
      path: /v1/webhooks/signing-secret/
      body:
        signing_secret: "${signing_secret}"
    input:
      signing_secret:
        type: string
        description: The HMAC secret to sign outbound payloads with.
    output:
      description: Confirmation that the secret was set.
      type: object

  rotate_webhook_signing_secret:
    title: Rotate the webhook signing secret
    description: >-
      Have Avoma generate a fresh webhook signing secret and return it. Update
      your receiver before the next delivery arrives.
    category: webhooks
    request:
      method: POST
      path: /v1/webhooks/signing-secret/rotate/
    output:
      description: The newly generated signing secret.
      type: object

  clear_webhook_signing_secret:
    title: Clear the webhook signing secret
    description: >-
      Remove the webhook signing secret, which leaves deliveries unsigned and
      unverifiable.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /v1/webhooks/signing-secret/
    output:
      description: Empty on success.
      type: object
