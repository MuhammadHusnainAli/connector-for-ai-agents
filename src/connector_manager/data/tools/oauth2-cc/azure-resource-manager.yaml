# Azure Resource Manager tools -- the control plane every other Azure
# connector is a slice of.
#
# ARM is uniform in a way that is worth internalising before reading further,
# because it explains the shape of every tool here:
#
#   * **every resource has one id**, and it is a path:
#     `/subscriptions/{sub}/resourceGroups/{rg}/providers/{namespace}/{type}/{name}`.
#     That id *is* the URL. get_resource_by_id, update_resource_by_id and
#     delete_resource_by_id take one and act on it, whatever kind of thing it
#     is, which is what makes them the general escape hatch when no
#     provider-specific connector exists;
#   * **`api-version` is mandatory on every call**, and each resource provider
#     versions independently. The tools default to a working version for the
#     resource they address; when a provider rejects it, list_provider_types
#     names the versions that provider actually accepts;
#   * **writes are frequently asynchronous.** A 201 or 202 means accepted, not
#     done. Poll the resource with get_resource_by_id until
#     `properties.provisioningState` reads `Succeeded`.
#
# The connection carries the tenant and the subscription, so the subscription
# is filled in from the connection rather than passed per call -- except on the
# few tools that deliberately take one, which is how you reach a *different*
# subscription the same service principal can see.
#
# Two tools are worth calling out because nothing else in the catalogue
# replaces them:
#
#   * **list_resources** with a `$filter` is the fastest way to find anything
#     across a whole subscription -- `resourceType eq
#     'Microsoft.Web/sites'`, `tagName eq 'env' and tagValue eq 'prod'`;
#   * **create_deployment** applies an ARM template or Bicep-compiled JSON.
#     It is the only tool here that can create a resource whose provider this
#     catalogue has no connector for. Run validate_deployment first: it does
#     the same work and changes nothing.
#
# Deletion in ARM cascades. Deleting a resource group deletes everything in
# it, and there is no recycle bin -- delete_resource_group is the single most
# dangerous call in this pack.
#
# The credential is a service principal (client credentials against Microsoft
# Entra ID, scope https://management.azure.com/.default) and ARM authorises on
# its Azure RBAC role assignments rather than on token scopes, so no tool here
# declares scopes. Reader is enough for every read; Contributor for the writes;
# Owner or User Access Administrator for the role assignment tools.
#
# Docs: https://learn.microsoft.com/rest/api/resources/

connector_id: azure-resource-manager
display_name: Azure Resource Manager
docs_url: https://learn.microsoft.com/rest/api/resources/

tools:

  # -- subscriptions and tenants ---------------------------------------------

  list_subscriptions:
    title: List subscriptions the credential can see
    description: >-
      Every Azure subscription this service principal has any role on, with its
      id, display name and state. The connection is pinned to one subscription,
      but the principal may well reach others -- this is how to find them, and
      their ids feed the tools that take an explicit subscription_id.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions
      query:
        api-version: "${api_version}"
    input:
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2022-12-01"
    output:
      description: Every visible subscription.
      type: array
      response_path: value
      items: {type: object, description: "subscriptionId, displayName, state, tenantId and subscriptionPolicies."}

  get_subscription:
    title: Get a subscription
    description: >-
      One subscription's display name, state (Enabled, Warned, PastDue,
      Disabled, Deleted) and quota policies. Reach for it to confirm a
      subscription is actually usable before trying to create anything in it.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions/${subscription_id}
      query:
        api-version: "${api_version}"
    input:
      subscription_id:
        type: string
        description: The subscription id, from list_subscriptions.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2022-12-01"
    output:
      description: The subscription.
      type: object
      properties:
        subscriptionId: {type: string, description: "The subscription's GUID."}
        displayName: {type: string, description: "Its name in the portal."}
        state: {type: string, description: "Enabled, Warned, PastDue, Disabled or Deleted."}
        tenantId: {type: string, description: "The Entra ID tenant that owns it."}

  list_locations:
    title: List the regions a subscription may deploy to
    description: >-
      Every Azure region available to a subscription, with its display name,
      geography and paired region. Read it before creating a resource: region
      names on the wire are lowercase and unspaced (`westeurope`,
      `australiaeast`), not the display names the portal shows.
    category: subscriptions
    read_only: true
    request:
      method: GET
      path: /subscriptions/${subscription_id}/locations
      query:
        api-version: "${api_version}"
    input:
      subscription_id:
        type: string
        description: The subscription to list regions for.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2022-12-01"
    output:
      description: The regions available to the subscription.
      type: array
      response_path: value
      items: {type: object, description: "name (the wire form), displayName, regionalDisplayName, metadata.geography and metadata.pairedRegion."}

  # -- resource groups -------------------------------------------------------

  list_resource_groups:
    title: List resource groups
    description: >-
      Every resource group in the connection's subscription, with its location,
      tags and provisioning state. Narrow with a `$filter` such as
      `tagName eq 'env' and tagValue eq 'prod'`. The starting point for almost
      everything else, since most ARM URLs are group-scoped.
    category: resource-groups
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
        $top: "${top}"
    input:
      filter:
        type: string
        description: OData filter, e.g. "tagName eq 'env' and tagValue eq 'prod'".
        optional: true
      top:
        type: integer
        description: Maximum number of groups to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The subscription's resource groups.
      type: array
      response_path: value
      items: {type: object, description: "id, name, location, tags and properties.provisioningState."}

  get_resource_group:
    title: Get a resource group
    description: >-
      One resource group's location, tags, managed-by owner and provisioning
      state. A 404 here is the cheapest way to tell "the group does not exist"
      apart from "the group is empty".
    category: resource-groups
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: The resource group name.
        example: prod-rg
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The resource group.
      type: object
      properties:
        id: {type: string, description: "The group's ARM id."}
        name: {type: string, description: "The group name."}
        location: {type: string, description: "The region the group's metadata lives in."}
        tags: {type: object, description: "The group's tags."}
        properties: {type: object, description: "Holds provisioningState."}

  create_or_update_resource_group:
    title: Create or update a resource group
    description: >-
      Create a resource group in a region, or replace an existing one's tags.
      Idempotent on the name: calling it for a group that already exists
      updates it rather than failing, and because this is a PUT the tags you
      send REPLACE the tags it had -- read get_resource_group first and merge
      if you mean to add one.

      A group's `location` decides only where its metadata is stored; the
      resources inside it can live anywhere.
    category: resource-groups
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}
      query:
        api-version: "${api_version}"
      body:
        location: "${location}"
        tags: "${tags}"
        managedBy: "${managed_by}"
    input:
      resource_group:
        type: string
        description: The resource group name to create or update.
        example: prod-rg
      location:
        type: string
        description: The region, in wire form, from list_locations.
        example: westeurope
      tags:
        type: object
        description: Tags for the group, as a flat map. Replaces the existing tags entirely.
        optional: true
      managed_by:
        type: string
        description: ARM id of the resource that manages this group, if any.
        optional: true
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The resource group as created or updated.
      type: object
      properties:
        id: {type: string, description: "The group's ARM id."}
        name: {type: string, description: "The group name."}
        properties: {type: object, description: "Holds provisioningState."}

  delete_resource_group:
    title: Delete a resource group and everything in it
    description: >-
      Destroy a resource group along with every resource it contains -- virtual
      machines, databases, storage accounts and their data, all of it. There is
      no recycle bin and no confirmation step on the wire. This is the most
      destructive call in this pack.

      Asynchronous: the 202 means the deletion started. list_resources on the
      group, or get_resource_group returning 404, is how you know it finished.
      Resources with a delete lock (see list_management_locks) will make the
      whole deletion fail.
    category: resource-groups
    destructive: true
    notes: Irreversible. Check list_management_locks and list_resources first.
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}
      query:
        api-version: "${api_version}"
        forceDeletionTypes: "${force_deletion_types}"
    input:
      resource_group:
        type: string
        description: The resource group to destroy, with all of its contents.
        example: scratch-rg
      force_deletion_types:
        type: string
        description: >-
          Resource types to force-delete first, e.g.
          "Microsoft.Compute/virtualMachines". Rarely needed.
        optional: true
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: Empty. The 202 means deletion started, not that it finished.
      type: object

  # -- resources -------------------------------------------------------------

  list_resources:
    title: Find resources across the subscription
    description: >-
      Every resource in the subscription, with a `$filter` to narrow it. This is
      the search tool of the whole pack -- the fastest way to answer "where is
      that thing" without knowing its resource group.

      Useful filters: `resourceType eq 'Microsoft.Web/sites'`,
      `substringof('prod', name)`, `location eq 'westeurope'`,
      `tagName eq 'env' and tagValue eq 'prod'`. Pass `createdTime` or
      `changedTime` in `$expand` to get those timestamps, which are omitted by
      default.
    category: resources
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resources
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
        $expand: "${expand}"
        $top: "${top}"
    input:
      filter:
        type: string
        description: >-
          OData filter over name, resourceType, location, resourceGroup,
          tagName/tagValue, identity or plan.
        optional: true
        example: resourceType eq 'Microsoft.Storage/storageAccounts'
      expand:
        type: string
        description: Extra properties to include, e.g. "createdTime,changedTime".
        optional: true
      top:
        type: integer
        description: Maximum number of resources to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The matching resources.
      type: array
      response_path: value
      items: {type: object, description: "id, name, type, location, tags, sku, kind and identity. Not the full resource body -- fetch that with get_resource_by_id."}

  list_resources_in_group:
    title: List the resources in one resource group
    description: >-
      Everything inside one resource group, with the same `$filter` and
      `$expand` as list_resources. Cheaper and more predictable than filtering
      the whole subscription when the group is already known -- and the call to
      make before delete_resource_group, so you can see what would go.
    category: resources
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/resources
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
        $expand: "${expand}"
        $top: "${top}"
    input:
      resource_group:
        type: string
        description: The resource group to look inside.
        example: prod-rg
      filter:
        type: string
        description: OData filter, e.g. "resourceType eq 'Microsoft.Compute/virtualMachines'".
        optional: true
      expand:
        type: string
        description: Extra properties to include, e.g. "createdTime,changedTime".
        optional: true
      top:
        type: integer
        description: Maximum number of resources to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The resources in the group.
      type: array
      response_path: value
      items: {type: object, description: "id, name, type, location, tags, sku and kind."}

  get_resource_by_id:
    title: Get any resource by its ARM id
    description: >-
      Fetch the full body of any resource, whatever its type, given the ARM id
      that list_resources returned. This is the general reader: it works for a
      VM, a storage account, a Key Vault, a Front Door profile -- anything.

      The catch is `api_version`: each provider versions independently and this
      call has no default that fits them all. The tool ships with a generic one;
      when the service answers "the api-version is invalid", call
      list_provider_types for that namespace and use a version it lists.
    category: resources
    read_only: true
    notes: resource_id is the whole ARM path, so its slashes are kept rather than encoded.
    request:
      method: GET
      path: "${resource_id}"
      query:
        api-version: "${api_version}"
    input:
      resource_id:
        type: string
        description: >-
          The resource's full ARM id, starting with /subscriptions/... exactly
          as list_resources returns it.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg/providers/Microsoft.Storage/storageAccounts/prodsa
      api_version:
        type: string
        description: >-
          The API version of the resource's own provider. Get the valid values
          from list_provider_types when the default is rejected.
        example: "2025-04-01"
    output:
      description: The resource, in whatever shape its provider defines.
      type: object
      properties:
        id: {type: string, description: "The resource's ARM id."}
        name: {type: string, description: "Its name."}
        type: {type: string, description: "Its fully qualified type."}
        location: {type: string, description: "Its region."}
        properties: {type: object, description: "Provider-specific body, including provisioningState."}

  create_or_update_resource_by_id:
    title: Create or replace any resource by its ARM id
    description: >-
      PUT an arbitrary resource body to an ARM id. Universal, and blunt: this is
      a full replace, so anything not in `body` is reset to its default rather
      than left alone. Read the resource with get_resource_by_id, amend the
      object, and send it back.

      Prefer a provider-specific connector where one exists, and
      create_deployment when several resources have to be created together --
      a template is declarative and re-runnable in a way that a hand-built PUT
      is not.

      Often asynchronous: poll get_resource_by_id for
      `properties.provisioningState`.
    category: resources
    notes: PUT is a full replace. api_version must match the resource's own provider.
    request:
      method: PUT
      path: "${resource_id}"
      query:
        api-version: "${api_version}"
      body: "${body}"
    input:
      resource_id:
        type: string
        description: The full ARM id of the resource to create or replace.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg/providers/Microsoft.Storage/storageAccounts/prodsa
      body:
        type: object
        description: >-
          The complete resource body, as its provider defines it -- normally
          location, sku, kind, tags and properties.
      api_version:
        type: string
        description: The API version of the resource's provider.
        example: "2025-04-01"
    output:
      description: The resource as created or replaced.
      type: object
      properties:
        id: {type: string, description: "The resource's ARM id."}
        properties: {type: object, description: "Holds provisioningState; poll it if the write was asynchronous."}

  update_resource_by_id:
    title: Patch any resource by its ARM id
    description: >-
      PATCH a partial body onto an existing resource, leaving everything not
      mentioned alone. Safer than create_or_update_resource_by_id for a small
      change -- adding a tag, flipping one property -- because it cannot reset
      fields you forgot to send.

      Not every provider supports PATCH on every type; those that do not answer
      405, and then a read-modify-PUT is the only route.
    category: resources
    request:
      method: PATCH
      path: "${resource_id}"
      query:
        api-version: "${api_version}"
      body: "${body}"
    input:
      resource_id:
        type: string
        description: The full ARM id of the resource to patch.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg/providers/Microsoft.Storage/storageAccounts/prodsa
      body:
        type: object
        description: "Only the fields to change, e.g. {\"tags\": {\"env\": \"prod\"}}."
      api_version:
        type: string
        description: The API version of the resource's provider.
        example: "2025-04-01"
    output:
      description: The resource after the patch.
      type: object
      properties:
        id: {type: string, description: "The resource's ARM id."}
        properties: {type: object, description: "The updated provider body."}

  delete_resource_by_id:
    title: Delete any resource by its ARM id
    description: >-
      Destroy one resource, whatever its type. Irreversible, and for stateful
      resources the data goes with it -- a storage account takes its blobs, a
      SQL server its databases.

      Frequently asynchronous: a 202 means the deletion started. Some providers
      refuse while other resources still depend on the target, and a management
      lock (list_management_locks) blocks it outright.
    category: resources
    destructive: true
    request:
      method: DELETE
      path: "${resource_id}"
      query:
        api-version: "${api_version}"
    input:
      resource_id:
        type: string
        description: The full ARM id of the resource to destroy.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg/providers/Microsoft.Storage/storageAccounts/prodsa
      api_version:
        type: string
        description: The API version of the resource's provider.
        example: "2025-04-01"
    output:
      description: Empty. A 202 means deletion started, not that it finished.
      type: object

  move_resources:
    title: Move resources to another resource group or subscription
    description: >-
      Move a list of resources into a different resource group, optionally in a
      different subscription. Not every resource type can move, and a move takes
      the whole dependency set with it or fails -- run validate_move_resources
      first, which performs the same checks and changes nothing.

      Everything moving must currently live in `source_resource_group`.
      Asynchronous, and the resources are locked for the duration.
    category: resources
    notes: Resource ids change when a resource moves, so anything referencing them by id must be updated.
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${source_resource_group}/moveResources
      query:
        api-version: "${api_version}"
      body:
        targetResourceGroup: "${target_resource_group_id}"
        resources: "${resource_ids}"
    input:
      source_resource_group:
        type: string
        description: The group the resources are in now.
        example: staging-rg
      target_resource_group_id:
        type: string
        description: >-
          The full ARM id of the destination group, not just its name --
          /subscriptions/{sub}/resourceGroups/{name}.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg
      resource_ids:
        type: array
        description: Full ARM ids of the resources to move.
        items: {type: string}
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: Empty on acceptance; the move runs asynchronously.
      type: object

  validate_move_resources:
    title: Check whether resources can be moved
    description: >-
      The dry run for move_resources: same arguments, same validation, no
      change. A 204 means the move would succeed; a 409 body names exactly which
      resource type or dependency blocks it. Always call this first -- a failed
      move can leave resources locked while ARM unwinds it.
    category: resources
    read_only: true
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${source_resource_group}/validateMoveResources
      query:
        api-version: "${api_version}"
      body:
        targetResourceGroup: "${target_resource_group_id}"
        resources: "${resource_ids}"
    input:
      source_resource_group:
        type: string
        description: The group the resources are in now.
        example: staging-rg
      target_resource_group_id:
        type: string
        description: Full ARM id of the destination resource group.
        example: /subscriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6/resourceGroups/prod-rg
      resource_ids:
        type: array
        description: Full ARM ids of the resources you intend to move.
        items: {type: string}
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: Empty on success (204); a 409 body explains what blocks the move.
      type: object

  # -- deployments -----------------------------------------------------------

  list_deployments:
    title: List deployments in a resource group
    description: >-
      The deployment history of a resource group, newest first, each with its
      provisioning state, timestamp, template hash and outputs. This is the
      audit trail for infrastructure-as-code changes, and where to look when a
      resource has properties nobody remembers setting.
    category: deployments
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
        $top: "${top}"
    input:
      resource_group:
        type: string
        description: The resource group whose deployments to list.
        example: prod-rg
      filter:
        type: string
        description: OData filter, e.g. "provisioningState eq 'Failed'".
        optional: true
      top:
        type: integer
        description: Maximum number of deployments to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The group's deployments, newest first.
      type: array
      response_path: value
      items: {type: object, description: "id, name and properties (provisioningState, timestamp, duration, outputs, error)."}

  get_deployment:
    title: Get a deployment
    description: >-
      One deployment in full: its provisioning state, its `outputs` (the values
      the template exported), the parameters it ran with, and on failure the
      `error` object explaining why. Poll this after create_deployment; when it
      fails, get_deployment_operations says which individual resource broke.
    category: deployments
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments/${deployment_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: The resource group the deployment ran in.
        example: prod-rg
      deployment_name:
        type: string
        description: The deployment name.
        example: main-2026-01-15
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The deployment, its outputs and any error.
      type: object
      properties:
        name: {type: string, description: "The deployment name."}
        properties: {type: object, description: "provisioningState, timestamp, duration, outputs, parameters, dependencies and error."}

  get_deployment_operations:
    title: List the individual operations in a deployment
    description: >-
      Every resource operation a deployment performed, each with its target,
      status and -- when it failed -- the provider's own error message. When
      get_deployment reports Failed with an unhelpful summary, this is where the
      real cause is: the one resource whose `statusMessage` explains the quota,
      the name conflict or the invalid SKU.
    category: deployments
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments/${deployment_name}/operations
      query:
        api-version: "${api_version}"
        $top: "${top}"
    input:
      resource_group:
        type: string
        description: The resource group the deployment ran in.
        example: prod-rg
      deployment_name:
        type: string
        description: The deployment name.
        example: main-2026-01-15
      top:
        type: integer
        description: Maximum number of operations to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The deployment's per-resource operations.
      type: array
      response_path: value
      items: {type: object, description: "operationId and properties (provisioningState, targetResource, statusCode, statusMessage)."}

  create_deployment:
    title: Deploy an ARM template
    description: >-
      Run an ARM template against a resource group, creating or updating every
      resource it declares. The one tool here that can stand up resources whose
      provider has no dedicated connector.

      `mode` matters more than anything else: `Incremental` (the default) leaves
      resources not in the template alone, while `Complete` DELETES every
      resource in the group that the template does not declare. Complete mode
      has destroyed production more than once -- use Incremental unless you
      specifically want the group to converge on the template.

      Pass the template inline as `template`, or point `template_link` at a
      publicly reachable URL. Parameters take ARM's wrapped form,
      `{"name": {"value": "..."}}`. Asynchronous: poll get_deployment.
      validate_deployment does the same checks and changes nothing.
    category: deployments
    notes: mode "Complete" deletes resources in the group that the template does not declare.
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments/${deployment_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          mode: "${mode}"
          template: "${template}"
          templateLink:
            $when: "${template_link}"
            uri: "${template_link}"
          parameters: "${parameters}"
        tags: "${tags}"
    input:
      resource_group:
        type: string
        description: The resource group to deploy into.
        example: prod-rg
      deployment_name:
        type: string
        description: A name for this deployment; it appears in the group's history.
        example: main-2026-01-15
      mode:
        type: string
        description: >-
          Incremental leaves undeclared resources alone. Complete deletes every
          resource in the group the template does not declare.
        optional: true
        default: Incremental
        enum: [Incremental, Complete]
      template:
        type: object
        description: The ARM template as a JSON object. Use this or template_link, not both.
        optional: true
      template_link:
        type: string
        description: A publicly reachable URL to the template JSON. Use this or template, not both.
        optional: true
      parameters:
        type: object
        description: >-
          Template parameters in ARM's wrapped form:
          {"location": {"value": "westeurope"}}.
        optional: true
      tags:
        type: object
        description: Tags to record on the deployment itself.
        optional: true
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The deployment as accepted; poll get_deployment for the result.
      type: object
      properties:
        name: {type: string, description: "The deployment name."}
        properties: {type: object, description: "provisioningState -- Accepted or Running at this point."}

  validate_deployment:
    title: Validate an ARM template without deploying it
    description: >-
      Run every check create_deployment would run -- template syntax, parameter
      types, SKU availability, name conflicts -- and change nothing. The error
      body names the exact template path that is wrong, which is far more useful
      than a failed deployment half way through.

      Takes the same arguments as create_deployment. Always worth calling first,
      especially with `mode: Complete`.
    category: deployments
    read_only: true
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments/${deployment_name}/validate
      query:
        api-version: "${api_version}"
      body:
        properties:
          mode: "${mode}"
          template: "${template}"
          templateLink:
            $when: "${template_link}"
            uri: "${template_link}"
          parameters: "${parameters}"
    input:
      resource_group:
        type: string
        description: The resource group the deployment would target.
        example: prod-rg
      deployment_name:
        type: string
        description: The deployment name to validate under.
        example: main-2026-01-15
      mode:
        type: string
        description: The deployment mode to validate.
        optional: true
        default: Incremental
        enum: [Incremental, Complete]
      template:
        type: object
        description: The ARM template as a JSON object.
        optional: true
      template_link:
        type: string
        description: A publicly reachable URL to the template JSON.
        optional: true
      parameters:
        type: object
        description: Template parameters in ARM's wrapped form.
        optional: true
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The validation result, with an error object when the template is invalid.
      type: object
      properties:
        error: {type: object, description: "Absent when valid; otherwise code, message and the offending template path."}
        properties: {type: object, description: "The validated deployment, including the resolved parameters."}

  cancel_deployment:
    title: Cancel a running deployment
    description: >-
      Stop a deployment that is still Running or Accepted. Resources it already
      created stay created -- cancelling does not roll back, it only stops ARM
      going further, leaving the group half-deployed. A deployment that has
      already reached Succeeded or Failed cannot be cancelled and answers 409.
    category: deployments
    destructive: true
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Resources/deployments/${deployment_name}/cancel
      query:
        api-version: "${api_version}"
      body: {}
    input:
      resource_group:
        type: string
        description: The resource group the deployment is running in.
        example: prod-rg
      deployment_name:
        type: string
        description: The deployment to cancel.
        example: main-2026-01-15
      api_version:
        type: string
        description: Microsoft.Resources deployments API version.
        optional: true
        default: "2025-04-01"
    output:
      description: Empty on success; 409 if the deployment already finished.
      type: object

  # -- providers -------------------------------------------------------------

  list_providers:
    title: List resource providers and their registration state
    description: >-
      Every resource provider namespace ARM knows, with whether this
      subscription has it Registered. An unregistered provider is the usual
      reason a perfectly correct create call answers "subscription not
      registered for resource type" -- register_provider fixes it.
    category: providers
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers
      query:
        api-version: "${api_version}"
        $top: "${top}"
    input:
      top:
        type: integer
        description: Maximum number of providers to return.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: Every provider namespace and its registration state.
      type: array
      response_path: value
      items: {type: object, description: "namespace, registrationState and resourceTypes."}

  list_provider_types:
    title: Get a provider's resource types and API versions
    description: >-
      One provider namespace in full: every resource type it offers, the regions
      each is available in, and -- the reason to call this -- the exact list of
      `apiVersions` each type accepts. When get_resource_by_id or
      create_or_update_resource_by_id is rejected for an invalid api-version,
      the answer is here.
    category: providers
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/${provider_namespace}
      query:
        api-version: "${api_version}"
    input:
      provider_namespace:
        type: string
        description: The provider namespace.
        example: Microsoft.Storage
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The provider, its types, their regions and their API versions.
      type: object
      properties:
        namespace: {type: string, description: "The provider namespace."}
        registrationState: {type: string, description: "Registered or NotRegistered for this subscription."}
        resourceTypes: {type: array, description: "Each with resourceType, locations and apiVersions."}

  register_provider:
    title: Register a resource provider on the subscription
    description: >-
      Enable a provider namespace for this subscription so its resource types
      can be created. Registration is asynchronous but usually quick; poll
      list_provider_types until `registrationState` is `Registered`. Harmless to
      call on an already-registered provider.
    category: providers
    request:
      method: POST
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/${provider_namespace}/register
      query:
        api-version: "${api_version}"
      body: {}
    input:
      provider_namespace:
        type: string
        description: The provider namespace to register.
        example: Microsoft.DocumentDB
      api_version:
        type: string
        description: Resource Manager API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The provider, now registering.
      type: object
      properties:
        namespace: {type: string, description: "The provider namespace."}
        registrationState: {type: string, description: "Registering, then Registered."}

  # -- tags, locks and access ------------------------------------------------

  get_resource_group_tags:
    title: Get the tags on a resource group
    description: >-
      The tag map currently on a resource group, read through ARM's dedicated
      tags endpoint so no guessing at another provider's api-version is needed.
      Read this before update_resource_group_tags if you mean to add a tag
      rather than replace the whole set.

      For a tag on an individual resource rather than a group, read the resource
      with get_resource_by_id and look at its `tags`.
    category: tags
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.Resources/tags/default
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: The resource group whose tags to read.
        example: prod-rg
      api_version:
        type: string
        description: Microsoft.Resources tags API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The resource group's tags.
      type: object
      properties:
        properties: {type: object, description: "Holds tags, a flat name-to-value map."}

  update_resource_group_tags:
    title: Add, replace or remove tags on a resource group
    description: >-
      Change a resource group's tags without touching anything else about it.
      `operation` decides the semantics: `Merge` adds and overwrites the tags
      you send and leaves the rest alone, `Replace` makes the tag set exactly
      what you send, and `Delete` removes the named tags.

      Merge is almost always what you want. Replace silently drops tags that
      other teams' cost-reporting and policy rules depend on, which is exactly
      the trap create_or_update_resource_group falls into by being a PUT.
    category: tags
    request:
      method: PATCH
      path: /subscriptions/${connectionConfig.subscriptionId}/resourceGroups/${resource_group}/providers/Microsoft.Resources/tags/default
      query:
        api-version: "${api_version}"
      body:
        operation: "${operation}"
        properties:
          tags: "${tags}"
    input:
      resource_group:
        type: string
        description: The resource group to tag.
        example: prod-rg
      tags:
        type: object
        description: The tags to merge, replace with, or (for Delete) remove by name.
        example: '{"env": "prod", "owner": "platform"}'
      operation:
        type: string
        description: Merge adds and overwrites; Replace makes the tag set exactly this; Delete removes the named tags.
        optional: true
        default: Merge
        enum: [Merge, Replace, Delete]
      api_version:
        type: string
        description: Microsoft.Resources tags API version.
        optional: true
        default: "2025-04-01"
    output:
      description: The resource group's tags after the change.
      type: object
      properties:
        properties: {type: object, description: "Holds the resulting tags map."}

  list_management_locks:
    title: List management locks in the subscription
    description: >-
      Every CanNotDelete and ReadOnly lock in the subscription, with the scope
      each applies to. A lock is the usual reason a delete that should work
      answers 409 -- check here before concluding that a resource is stuck for
      some other reason.
    category: governance
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/Microsoft.Authorization/locks
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
    input:
      filter:
        type: string
        description: OData filter over the locks, e.g. "atScope()".
        optional: true
      api_version:
        type: string
        description: Microsoft.Authorization locks API version.
        optional: true
        default: "2020-05-01"
    output:
      description: Every management lock in the subscription.
      type: array
      response_path: value
      items: {type: object, description: "id, name and properties.level (CanNotDelete or ReadOnly) with notes."}

  create_management_lock:
    title: Lock a resource group against deletion
    description: >-
      Put a CanNotDelete or ReadOnly lock on a resource group, so nothing in it
      can be deleted (or, with ReadOnly, changed at all) until the lock is
      removed -- including by a Complete-mode deployment. The cheapest guard
      there is against an accidental delete_resource_group.

      ReadOnly is stronger than it sounds: it blocks operations that look like
      reads but write internally, such as listing a storage account's keys.
    category: governance
    request:
      method: PUT
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Authorization/locks/${lock_name}
      query:
        api-version: "${api_version}"
      body:
        properties:
          level: "${level}"
          notes: "${notes}"
    input:
      resource_group:
        type: string
        description: The resource group to lock.
        example: prod-rg
      lock_name:
        type: string
        description: A name for the lock.
        example: do-not-delete
      level:
        type: string
        description: CanNotDelete blocks deletion; ReadOnly blocks any modification as well.
        optional: true
        default: CanNotDelete
        enum: [CanNotDelete, ReadOnly]
      notes:
        type: string
        description: Why the lock exists, shown to whoever hits it.
        optional: true
      api_version:
        type: string
        description: Microsoft.Authorization locks API version.
        optional: true
        default: "2020-05-01"
    output:
      description: The lock as created.
      type: object
      properties:
        id: {type: string, description: "The lock's ARM id."}
        name: {type: string, description: "The lock name."}
        properties: {type: object, description: "level and notes."}

  delete_management_lock:
    title: Remove a lock from a resource group
    description: >-
      Take a lock off a resource group, which makes everything in it deletable
      again. Removing a CanNotDelete lock is normally the step immediately
      before an intentional deletion, so treat it as part of that decision
      rather than as housekeeping.
    category: governance
    destructive: true
    request:
      method: DELETE
      path: /subscriptions/${connectionConfig.subscriptionId}/resourcegroups/${resource_group}/providers/Microsoft.Authorization/locks/${lock_name}
      query:
        api-version: "${api_version}"
    input:
      resource_group:
        type: string
        description: The locked resource group.
        example: prod-rg
      lock_name:
        type: string
        description: The lock to remove.
        example: do-not-delete
      api_version:
        type: string
        description: Microsoft.Authorization locks API version.
        optional: true
        default: "2020-05-01"
    output:
      description: Empty on success.
      type: object

  list_role_assignments:
    title: List Azure RBAC role assignments
    description: >-
      Who has what role over the subscription, and at which scope. Each entry
      pairs a `principalId` (a user, group or service principal object id) with
      a `roleDefinitionId`. This is the answer to "why can this identity do
      that" -- and, when a call unexpectedly returns 403, to "why can it not".

      Filter with `atScope()` for assignments made at the subscription itself
      rather than inherited, or `principalId eq '<object-id>'` for one identity.
    category: governance
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/Microsoft.Authorization/roleAssignments
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
    input:
      filter:
        type: string
        description: >-
          OData filter, e.g. "atScope()" or
          "principalId eq '11111111-2222-3333-4444-555555555555'".
        optional: true
      api_version:
        type: string
        description: Microsoft.Authorization roleAssignments API version.
        optional: true
        default: "2022-04-01"
    output:
      description: The role assignments in scope.
      type: array
      response_path: value
      items: {type: object, description: "id, name and properties (roleDefinitionId, principalId, principalType, scope)."}

  list_role_definitions:
    title: List Azure RBAC role definitions
    description: >-
      The roles available at the subscription scope -- built-in ones like
      Reader, Contributor and Storage Blob Data Contributor, plus any custom
      roles -- each with the actions it permits. Use it to turn the opaque
      `roleDefinitionId` from list_role_assignments into a name, or to find the
      right role id before granting access.
    category: governance
    read_only: true
    request:
      method: GET
      path: /subscriptions/${connectionConfig.subscriptionId}/providers/Microsoft.Authorization/roleDefinitions
      query:
        api-version: "${api_version}"
        $filter: "${filter}"
    input:
      filter:
        type: string
        description: OData filter, e.g. "roleName eq 'Reader'" or "type eq 'CustomRole'".
        optional: true
      api_version:
        type: string
        description: Microsoft.Authorization roleDefinitions API version.
        optional: true
        default: "2022-05-01-preview"
    output:
      description: The role definitions available at this scope.
      type: array
      response_path: value
      items: {type: object, description: "id, name and properties (roleName, description, type, permissions, assignableScopes)."}
