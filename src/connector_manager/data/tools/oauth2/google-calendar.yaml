# Google Calendar API tools.
#
# Docs: https://developers.google.com/calendar/api/v3/reference
#
# The tools below the "rest of the API" divider come from Google's own
# discovery document for this API -- the machine readable contract its client
# libraries are generated from -- so their paths, parameters and per-tool OAuth
# scopes are Google's. The hand-authored tools above it are kept because they
# offer a friendlier shape for the common cases.
#
connector_id: google-calendar
display_name: Google Calendar
docs_url: https://developers.google.com/calendar/api/v3/reference

scope_rules:
  strip_prefixes:
    - https://www.googleapis.com/auth/
  implies:
    calendar: [calendar.readonly, calendar.events, calendar.events.readonly, calendar.calendarlist]
    calendar.events: [calendar.events.readonly]
    calendar.readonly: [calendar.events.readonly]

scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope

tools:

  list_calendars:
    title: List calendars
    description: >-
      List the calendars on the user's calendar list, with the ids every event
      tool takes. The user's own calendar is always addressable as "primary".
    category: calendars
    scopes_any: [calendar.readonly, calendar]
    read_only: true
    request:
      method: GET
      path: /calendar/v3/users/me/calendarList
      query:
        maxResults: "${limit}"
        pageToken: "${page_token}"
        minAccessRole: "${min_access_role}"
    input:
      limit:
        type: integer
        description: How many calendars per page (1-250).
        optional: true
        default: 100
        minimum: 1
        maximum: 250
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      min_access_role:
        type: string
        description: Only calendars the user has at least this role on.
        optional: true
        enum: [freeBusyReader, reader, writer, owner]
    output:
      description: The user's calendar list.
      type: object
      properties:
        items: {type: array, description: "Each with id, summary, timeZone and accessRole."}
        nextPageToken: {type: string}

  list_events:
    title: List events in a date range
    description: >-
      List events on a calendar between two instants, with recurring series
      expanded into individual occurrences. This is the tool for "what is on my
      calendar this week".
    category: events
    scopes_any: [calendar.events.readonly, calendar.readonly, calendar.events, calendar]
    read_only: true
    request:
      method: GET
      path: /calendar/v3/calendars/${calendar_id}/events
      query:
        timeMin: "${time_min}"
        timeMax: "${time_max}"
        q: "${query}"
        maxResults: "${limit}"
        pageToken: "${page_token}"
        singleEvents: "${single_events}"
        orderBy: "${order_by}"
        showDeleted: "${show_deleted}"
    input:
      calendar_id:
        type: string
        description: Calendar id, or "primary" for the user's own calendar.
        optional: true
        default: primary
      time_min:
        type: string
        description: Earliest event end time, RFC 3339, e.g. 2026-09-01T00:00:00Z.
        optional: true
        example: "2026-09-01T00:00:00Z"
      time_max:
        type: string
        description: Latest event start time, RFC 3339.
        optional: true
      query:
        type: string
        description: Free-text search across event fields.
        optional: true
      limit:
        type: integer
        description: How many events per page (1-2500).
        optional: true
        default: 50
        minimum: 1
        maximum: 2500
      page_token:
        type: string
        description: Cursor from the previous response's nextPageToken.
        optional: true
      single_events:
        type: boolean
        description: Expand recurring series into individual occurrences. Required for orderBy=startTime.
        optional: true
        default: true
      order_by:
        type: string
        description: Order of the results.
        optional: true
        default: startTime
        enum: [startTime, updated]
      show_deleted:
        type: boolean
        description: Include cancelled events.
        optional: true
    output:
      description: A page of events.
      type: object
      properties:
        items: {type: array}
        nextPageToken: {type: string}
        timeZone: {type: string}

  get_event:
    title: Get a calendar event
    description: Read one event in full, including attendees, conference details and reminders.
    category: events
    scopes_any: [calendar.events.readonly, calendar.readonly, calendar.events, calendar]
    read_only: true
    request:
      method: GET
      path: /calendar/v3/calendars/${calendar_id}/events/${event_id}
    input:
      calendar_id:
        type: string
        description: Calendar id, or "primary".
        optional: true
        default: primary
      event_id:
        type: string
        description: The event id.
    output:
      description: The event.
      type: object
      properties:
        id: {type: string}
        summary: {type: string}
        start: {type: object}
        end: {type: object}
        attendees: {type: array}
        hangoutLink: {type: string}

  create_event:
    title: Create a calendar event
    description: >-
      Create an event. Times are RFC 3339 with an offset, e.g.
      2026-09-01T14:00:00-07:00. Invited attendees get an email unless
      send_updates is none.
    category: events
    scopes_any: [calendar.events, calendar]
    request:
      method: POST
      path: /calendar/v3/calendars/${calendar_id}/events
      query:
        sendUpdates: "${send_updates}"
        conferenceDataVersion: "${conference_data_version}"
      body:
        summary: "${summary}"
        description: "${description}"
        location: "${location}"
        start:
          dateTime: "${start}"
          timeZone: "${timezone}"
        end:
          dateTime: "${end}"
          timeZone: "${timezone}"
        attendees:
          $map:
            source: "${attendees}"
            template: {email: "${item}"}
        recurrence: "${recurrence}"
    input:
      summary:
        type: string
        description: Event title.
      start:
        type: string
        description: Start time, RFC 3339, e.g. 2026-09-01T14:00:00-07:00.
        example: "2026-09-01T14:00:00-07:00"
      end:
        type: string
        description: End time, RFC 3339.
      calendar_id:
        type: string
        description: Calendar to create it on, or "primary".
        optional: true
        default: primary
      description:
        type: string
        description: Longer description shown in the invitation.
        optional: true
      location:
        type: string
        description: Where the event happens.
        optional: true
      timezone:
        type: string
        description: IANA time zone the times are in, e.g. America/Los_Angeles.
        optional: true
      attendees:
        type: array
        description: Email addresses to invite.
        optional: true
        items: {type: string, format: email}
      recurrence:
        type: array
        description: RRULE strings, e.g. ["RRULE:FREQ=WEEKLY;COUNT=10"].
        optional: true
        items: {type: string}
      send_updates:
        type: string
        description: Who gets an email about the new event.
        optional: true
        enum: [all, externalOnly, none]
      conference_data_version:
        type: integer
        description: Set to 1 to allow conference (Meet) data on the event.
        optional: true
        minimum: 0
        maximum: 1
    output:
      description: The created event.
      type: object
      properties:
        id: {type: string}
        htmlLink: {type: string}
        hangoutLink: {type: string}
        status: {type: string}

  update_event:
    title: Update a calendar event
    description: >-
      Change an event's fields. This is a patch, so only what is supplied is
      written; attendee lists, however, replace the previous one wholesale.
    category: events
    scopes_any: [calendar.events, calendar]
    request:
      method: PATCH
      path: /calendar/v3/calendars/${calendar_id}/events/${event_id}
      query:
        sendUpdates: "${send_updates}"
      body:
        summary: "${summary}"
        description: "${description}"
        location: "${location}"
        start:
          dateTime: "${start}"
          timeZone: "${timezone}"
        end:
          dateTime: "${end}"
          timeZone: "${timezone}"
        attendees:
          $map:
            source: "${attendees}"
            template: {email: "${item}"}
    input:
      event_id:
        type: string
        description: The event to change.
      calendar_id:
        type: string
        description: Calendar the event is on, or "primary".
        optional: true
        default: primary
      summary:
        type: string
        description: New title.
        optional: true
      description:
        type: string
        description: New description.
        optional: true
      location:
        type: string
        description: New location.
        optional: true
      start:
        type: string
        description: New start time, RFC 3339.
        optional: true
      end:
        type: string
        description: New end time, RFC 3339.
        optional: true
      timezone:
        type: string
        description: IANA time zone for the new times.
        optional: true
      attendees:
        type: array
        description: Replaces the attendee list entirely.
        optional: true
        items: {type: string, format: email}
      send_updates:
        type: string
        description: Who gets an email about the change.
        optional: true
        enum: [all, externalOnly, none]
    output:
      description: The updated event.
      type: object
      properties:
        id: {type: string}
        updated: {type: string}

  delete_event:
    title: Delete a calendar event
    description: >-
      Delete an event. Attendees are notified unless send_updates is none. This
      cannot be undone.
    category: events
    scopes_any: [calendar.events, calendar]
    destructive: true
    request:
      method: DELETE
      path: /calendar/v3/calendars/${calendar_id}/events/${event_id}
      query:
        sendUpdates: "${send_updates}"
    input:
      event_id:
        type: string
        description: The event to delete.
      calendar_id:
        type: string
        description: Calendar the event is on, or "primary".
        optional: true
        default: primary
      send_updates:
        type: string
        description: Who gets a cancellation email.
        optional: true
        enum: [all, externalOnly, none]
    output:
      description: Empty on success -- Google answers 204 No Content.
      type: object

  quick_add_event:
    title: Create an event from a sentence
    description: >-
      Create an event by parsing plain English, e.g. "Lunch with Ada Friday
      1pm". Google interprets the text; the result is worth checking.
    category: events
    scopes_any: [calendar.events, calendar]
    request:
      method: POST
      path: /calendar/v3/calendars/${calendar_id}/events/quickAdd
      query:
        text: "${text}"
        sendUpdates: "${send_updates}"
    input:
      text:
        type: string
        description: The event described in plain language.
        example: Lunch with Ada Friday 1pm
      calendar_id:
        type: string
        description: Calendar to create it on, or "primary".
        optional: true
        default: primary
      send_updates:
        type: string
        description: Who gets an email about the new event.
        optional: true
        enum: [all, externalOnly, none]
    output:
      description: The created event as Google parsed it.
      type: object
      properties:
        id: {type: string}
        summary: {type: string}
        start: {type: object}

  get_free_busy:
    title: Check when calendars are busy
    description: >-
      Read the busy blocks on a set of calendars over a window, without seeing
      what the events are. Use it to find a free slot before creating an event.
    category: events
    scopes_any: [calendar.readonly, calendar, calendar.freebusy]
    read_only: true
    request:
      method: POST
      path: /calendar/v3/freeBusy
      body:
        timeMin: "${time_min}"
        timeMax: "${time_max}"
        timeZone: "${timezone}"
        items:
          $map:
            source: "${calendar_ids}"
            template: {id: "${item}"}
    input:
      time_min:
        type: string
        description: Start of the window, RFC 3339.
      time_max:
        type: string
        description: End of the window, RFC 3339.
      calendar_ids:
        type: array
        description: Calendar ids or email addresses to check.
        items: {type: string}
      timezone:
        type: string
        description: IANA time zone the answer is expressed in.
        optional: true
    output:
      description: Busy blocks per calendar.
      type: object
      properties:
        calendars: {type: object, description: "Calendar id to its busy array."}

  add_event_attendees:
    title: Invite people to an existing event
    description: >-
      Replace an event's attendee list, which is how Google's API adds guests.
      Include the people already invited or they are removed.
    category: events
    scopes_any: [calendar.events, calendar]
    request:
      method: PATCH
      path: /calendar/v3/calendars/${calendar_id}/events/${event_id}
      query:
        sendUpdates: "${send_updates}"
      body:
        attendees:
          $map:
            source: "${attendees}"
            template: {email: "${item}"}
    input:
      event_id:
        type: string
        description: The event to invite to.
      attendees:
        type: array
        description: The full attendee list after the change, existing guests included.
        items: {type: string, format: email}
      calendar_id:
        type: string
        description: Calendar the event is on, or "primary".
        optional: true
        default: primary
      send_updates:
        type: string
        description: Who gets an invitation email.
        optional: true
        default: all
        enum: [all, externalOnly, none]
    output:
      description: The event with its new attendee list.
      type: object
      properties:
        id: {type: string}
        attendees: {type: array}

  create_calendar:
    title: Create a calendar
    description: Create a secondary calendar the user owns, for a project or a team.
    category: calendars
    scopes: [calendar]
    request:
      method: POST
      path: /calendar/v3/calendars
      body:
        summary: "${summary}"
        description: "${description}"
        timeZone: "${timezone}"
    input:
      summary:
        type: string
        description: The calendar's name.
      description:
        type: string
        description: What the calendar is for.
        optional: true
      timezone:
        type: string
        description: IANA time zone, e.g. Europe/London.
        optional: true
    output:
      description: The created calendar.
      type: object
      properties:
        id: {type: string}
        summary: {type: string}
        timeZone: {type: string}

  # -- the rest of the API, from Google's own discovery document ------------

  delete_acl:
    title: Delete acl
    description: Deletes an access control rule. Calls acl.delete on the Calendar API.
    category: acl
    request:
      method: DELETE
      path: /calendar/v3/calendars/${calendar_id}/acl/${rule_id}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      rule_id:
        type: string
        description: ACL rule identifier.
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
    destructive: true
  get_acl:
    title: Get acl
    description: Returns an access control rule. Calls acl.get on the Calendar API.
    category: acl
    request:
      method: GET
      path: /calendar/v3/calendars/${calendar_id}/acl/${rule_id}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      rule_id:
        type: string
        description: ACL rule identifier.
    output:
      description: The AclRule resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
    - calendar.acls.readonly
    - calendar.readonly
    read_only: true
  create_acl:
    title: Create acl
    description: Creates an access control rule. Calls acl.insert on the Calendar API.
    category: acl
    request:
      method: POST
      path: /calendar/v3/calendars/${calendar_id}/acl
      query:
        sendNotifications: ${send_notifications}
      body:
        role: ${role}
        scope: ${scope}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      send_notifications:
        type: boolean
        description: Whether to send notifications about the calendar sharing change. Optional. The default
          is True.
        optional: true
      role:
        type: string
        description: 'The role assigned to the scope. Possible values are: - "none" - Provides no access.
          - "freeBusyReader" - Provides read access to free/busy information. - "reader" - Provides read
          access to the calendar. Private events will appear to users with reader access, but event details
          will be hidden. - "writ'
        optional: true
      scope:
        type: object
        description: The extent to which calendar access is granted by this ACL rule.
        optional: true
    output:
      description: The AclRule resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
  list_acl:
    title: List acl
    description: Returns the rules in the access control list for the calendar.
    category: acl
    request:
      method: GET
      path: /calendar/v3/calendars/${calendar_id}/acl
      query:
        maxResults: ${max_results}
        pageToken: ${page_token}
        showDeleted: ${show_deleted}
        syncToken: ${sync_token}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      max_results:
        type: integer
        description: Maximum number of entries returned on one result page. By default the value is 100
          entries. The page size can never be larger than 250 entries. Optional.
        optional: true
      page_token:
        type: string
        description: Token specifying which result page to return. Optional.
        optional: true
      show_deleted:
        type: boolean
        description: Whether to include deleted ACLs in the result. Deleted ACLs are represented by role
          equal to "none". Deleted ACLs will always be included if syncToken is provided. Optional. The
          default is False.
        optional: true
      sync_token:
        type: string
        description: Token obtained from the nextSyncToken field returned on the last page of results
          from the previous list request. It makes the result of this list request contain only entries
          that have changed since then. All entries deleted since the previous list request will always
          be in the result set and it is
        optional: true
    output:
      description: The Acl resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
    - calendar.acls.readonly
    read_only: true
  update_acl:
    title: Update acl
    description: Updates an access control rule. This method supports patch semantics.
    category: acl
    request:
      method: PATCH
      path: /calendar/v3/calendars/${calendar_id}/acl/${rule_id}
      query:
        sendNotifications: ${send_notifications}
      body:
        role: ${role}
        scope: ${scope}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      rule_id:
        type: string
        description: ACL rule identifier.
      send_notifications:
        type: boolean
        description: Whether to send notifications about the calendar sharing change. Note that there
          are no notifications on access removal. Optional. The default is True.
        optional: true
      role:
        type: string
        description: 'The role assigned to the scope. Possible values are: - "none" - Provides no access.
          - "freeBusyReader" - Provides read access to free/busy information. - "reader" - Provides read
          access to the calendar. Private events will appear to users with reader access, but event details
          will be hidden. - "writ'
        optional: true
      scope:
        type: object
        description: The extent to which calendar access is granted by this ACL rule.
        optional: true
    output:
      description: The AclRule resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
  replace_acl:
    title: Replace acl
    description: Updates an access control rule. Calls acl.update on the Calendar API.
    category: acl
    request:
      method: PUT
      path: /calendar/v3/calendars/${calendar_id}/acl/${rule_id}
      query:
        sendNotifications: ${send_notifications}
      body:
        role: ${role}
        scope: ${scope}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      rule_id:
        type: string
        description: ACL rule identifier.
      send_notifications:
        type: boolean
        description: Whether to send notifications about the calendar sharing change. Note that there
          are no notifications on access removal. Optional. The default is True.
        optional: true
      role:
        type: string
        description: 'The role assigned to the scope. Possible values are: - "none" - Provides no access.
          - "freeBusyReader" - Provides read access to free/busy information. - "reader" - Provides read
          access to the calendar. Private events will appear to users with reader access, but event details
          will be hidden. - "writ'
        optional: true
      scope:
        type: object
        description: The extent to which calendar access is granted by this ACL rule.
        optional: true
    output:
      description: The AclRule resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
  watch_acl:
    title: Watch acl
    description: Watch for changes to ACL resources. Calls acl.watch on the Calendar API.
    category: acl
    request:
      method: POST
      path: /calendar/v3/calendars/${calendar_id}/acl/watch
      query:
        maxResults: ${max_results}
        pageToken: ${page_token}
        showDeleted: ${show_deleted}
        syncToken: ${sync_token}
      body:
        expiration: ${expiration}
        token: ${token}
        resourceId: ${resource_id}
        address: ${address}
        payload: ${payload}
        type: ${type}
        resourceUri: ${resource_uri}
        params: ${params}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
      max_results:
        type: integer
        description: Maximum number of entries returned on one result page. By default the value is 100
          entries. The page size can never be larger than 250 entries. Optional.
        optional: true
      page_token:
        type: string
        description: Token specifying which result page to return. Optional.
        optional: true
      show_deleted:
        type: boolean
        description: Whether to include deleted ACLs in the result. Deleted ACLs are represented by role
          equal to "none". Deleted ACLs will always be included if syncToken is provided. Optional. The
          default is False.
        optional: true
      sync_token:
        type: string
        description: Token obtained from the nextSyncToken field returned on the last page of results
          from the previous list request. It makes the result of this list request contain only entries
          that have changed since then. All entries deleted since the previous list request will always
          be in the result set and it is
        optional: true
      expiration:
        type: string
        description: Date and time of notification channel expiration, expressed as a Unix timestamp,
          in milliseconds. Optional.
        optional: true
      token:
        type: string
        description: An arbitrary string delivered to the target address with each notification delivered
          over this channel. Optional.
        optional: true
      resource_id:
        type: string
        description: An opaque ID that identifies the resource being watched on this channel. Stable across
          different API versions.
        optional: true
      address:
        type: string
        description: The address where notifications are delivered for this channel.
        optional: true
      payload:
        type: boolean
        description: A Boolean value to indicate whether payload is wanted. Optional.
        optional: true
      type:
        type: string
        description: The type of delivery mechanism used for this channel. Valid values are "web_hook"
          (or "webhook"). Both values refer to a channel where Http requests are used to deliver messages.
        optional: true
      resource_uri:
        type: string
        description: A version-specific identifier for the watched resource.
        optional: true
      params:
        type: object
        description: Additional parameters controlling delivery channel behavior. Optional.
        optional: true
    output:
      description: The Channel resource.
      type: object
    scopes_any:
    - calendar
    - calendar.acls
    - calendar.acls.readonly
  delete_calendar_list:
    title: Delete calendar list
    description: Removes a calendar from the user's calendar list.
    category: calendar_list
    request:
      method: DELETE
      path: /calendar/v3/users/me/calendarList/${calendar_id}
    input:
      calendar_id:
        type: string
        description: Calendar identifier. To retrieve calendar IDs call the calendarList.list method.
          If you want to access the primary calendar of the currently logged in user, use the "primary"
          keyword.
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - calendar
    - calendar.app.created
    - calendar.calendarlist
    destructive: true
  get_calendar_list:
    title: Get calendar list
    description: Returns a calendar from the user's calendar list.
    category: calendar_list
    request:
      method: GET
      path: /calendar/v3/users/me/calendarList/${calendar_id}
