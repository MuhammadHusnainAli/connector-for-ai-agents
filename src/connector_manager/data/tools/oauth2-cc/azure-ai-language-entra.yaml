  train_conversation_project:
    title: Train a conversational language understanding model
    description: >-
      Train a CLU or orchestration project's labelled utterances into a named
      model. training_mode picks Standard (fast, cheaper) or Advanced (slower,
      usually more accurate). Returns 202 with an operation-location header to
      poll.
