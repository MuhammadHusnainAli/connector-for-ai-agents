# Hubstaff tools -- time tracking, workforce and payroll.
#
# The whole API is v2 and the connection's base url stops at the host, so every
# path here starts with /v2. Four things shape how these tools fit together:
#
#   * **almost everything is scoped to an organization.** `list_organizations`
#     is the first call after `get_current_user`; the organization id it
#     returns is what most other tools take. A few resources -- tasks, teams,
#     clients, notes -- are also addressable directly by their own id once you
#     have it;
#   * **paging is id-based, not offset-based.** Pass the previous response's
#     `pagination.next_page_start_id` as `page_start_id`. There is no page
#     number, and re-requesting with the same id is how you resume rather than
#     skip;
#   * **an activity is a ten-minute slot, a daily activity is a rollup.** The
#     `/activities` endpoints return raw slots with keyboard, mouse and overall
#     activity percentages and require a `time_slot` window; `/activities/daily`
#     returns per-user, per-project totals by day. Use the rollups for
#     reporting -- summing raw slots over a long range is far more expensive
#     and gives the same answer;
#   * **the `/updates` variants are what an incremental sync should poll.**
#     They filter on when Hubstaff last *changed* a record rather than when the
#     work happened, so back-dated entries and manager edits show up. A sync
#     built on `time_slot` alone will silently miss both.
#
# Two limits worth knowing before writing:
#
#   * **`create_time_entry` cannot create time that needs approval.** Where an
#     organization requires approval for manual time, the API refuses and the
#     entry has to go through the manual time request flow -- list, then
#     `update_manual_time_request_status` to approve;
#   * **`update_*_members` and `update_team_projects` are bulk writes.** One
#     call re-states the whole membership, so a payload that omits someone
#     removes them. They are not incremental adds.
#
# Screenshots, locations and app/url usage are personal monitoring data about
# named individuals. The tools are here because the API has them; how the
# results are handled is a matter for whoever runs the integration.
#
# Docs: https://developer.hubstaff.com/

connector_id: hubstaff
display_name: Hubstaff
docs_url: https://developer.hubstaff.com/

tools:

  get_current_user:
    title: Get the authenticated user
    description: >-
      The user the access token belongs to, with their id and email. Start
      here: the user id it returns is what the time-entry tools take, and it
      confirms the token is live.
    category: users
    read_only: true
    request:
      method: GET
      path: /v2/users/me
    output:
      description: 'The requested record.'
      type: object

  get_user:
    title: Get a user
    description: >-
      One user by id -- name, email and account details. Use it to resolve the
      user ids that come back on activities, timesheets and notes into people.
    category: users
    read_only: true
    request:
      method: GET
      path: /v2/users/${user_id}
    input:
      user_id:
        type: integer
        description: 'The member''s user id, from list_organization_members or get_current_user.'
    output:
      description: 'The requested record.'
      type: object

  list_organizations:
    title: List organizations
    description: >-
      The organizations this token can reach. Almost everything else in
      Hubstaff hangs off an organization id, so this is usually the first call
      after get_current_user.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /v2/organizations
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
    input:
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  create_organization:
    title: Create an organization
    description: >-
      Create a new organization. Rarely what an integration wants -- most work
      happens inside an organization that already exists.
    category: organizations
    request:
      method: POST
      path: /v2/organizations
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record as Hubstaff stores it after the call.'
      type: object

  get_organization:
    title: Get an organization
    description: >-
      One organization by id, with its name, status and settings. Useful for
      confirming which account an integration is pointed at before it writes
      anything.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
    output:
      description: 'The requested record.'
      type: object

  update_organization_metadata:
    title: Update an organization's metadata
    description: >-
      Attach your own key/value metadata to an organization. Metadata is a
      free-form side channel for your system's ids; it does not change any
      Hubstaff behaviour.
    category: organizations
    request:
      method: PUT
      path: /v2/organizations/${organization_id}/update_metadata
      body: "${attributes}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_organization_seats:
    title: Get an organization's seat counts
    description: >-
      How many seats the organization has and how many are in use. Check this
      before adding members -- Hubstaff rejects an invite that would exceed
      the plan.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}/seats
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  list_work_break_projects:
    title: List work break projects
    description: >-
      The projects an organization uses to record paid breaks. Time logged
      against these is break time rather than project work, which matters when
      totalling productive hours.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}/work_break_projects
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        'project_ids[]': "${project_ids}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      project_ids:
        type: array
        description: 'Only these project ids.'
        optional: true
        items: {type: integer}
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  list_organization_members:
    title: List an organization's members
    description: >-
      Page through an organization's members with their roles and, optionally,
      their profiles, projects and limits. This is where the user ids for
      every per-user query come from.
    category: members
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}/members
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        include_removed: "${include_removed}"
        'user_ids[]': "${user_ids}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      include_removed:
        type: boolean
        description: 'Include records for removed members.'
        optional: true
      user_ids:
        type: array
        description: 'Only these user ids.'
        optional: true
        items: {type: integer}
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  add_organization_members:
    title: Add members to an organization
    description: >-
      Add one or more people to an organization at a given membership role.
      Consumes seats, so check list_organization_seats first if the plan is
      close to full.
    category: members
    request:
      method: POST
      path: /v2/organizations/${organization_id}/members
      body: "${attributes}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record as Hubstaff stores it after the call.'
      type: object

  update_organization_members:
    title: Update an organization's members
    description: >-
      Change membership roles or remove members in bulk. A bulk write -- one
      call can affect many people, so build the payload deliberately rather
      than looping.
    category: members
    request:
      method: PUT
      path: /v2/organizations/${organization_id}/update_members
      body: "${attributes}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_project_members:
    title: List a project's members
    description: >-
      Who is assigned to one project and in what role. `direct_only`
      distinguishes people assigned to the project itself from those who reach
      it through a team.
    category: members
    read_only: true
    request:
      method: GET
      path: /v2/projects/${project_id}/members
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        include_removed: "${include_removed}"
        'user_ids[]': "${user_ids}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      include_removed:
        type: boolean
        description: 'Include records for removed members.'
        optional: true
      user_ids:
        type: array
        description: 'Only these user ids.'
        optional: true
        items: {type: integer}
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  update_project_members:
    title: Update a project's members
    description: >-
      Add, remove or re-role people on one project in bulk. Removing someone
      stops them tracking further time to the project but leaves their past
      time intact.
    category: members
    request:
      method: PUT
      path: /v2/projects/${project_id}/update_members
      body: "${attributes}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_team_members:
    title: List a team's members
    description: >-
      The members of one team. Teams are how Hubstaff grants project access to
      groups rather than individuals, so this explains project access that no
      direct assignment accounts for.
    category: members
    read_only: true
    request:
      method: GET
      path: /v2/teams/${team_id}/members
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
    input:
      team_id:
        type: integer
        description: 'The team id.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  update_team_members:
    title: Update a team's members
    description: >-
      Change one team's membership in bulk. Because teams carry project
      access, adding someone here can grant them several projects at once.
    category: members
    request:
      method: PUT
      path: /v2/teams/${team_id}/update_members
      body: "${attributes}"
    input:
      team_id:
        type: integer
        description: 'The team id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_organization_projects:
    title: List an organization's projects
    description: >-
      Page through an organization's projects with their status and billing
      settings. Archived projects are excluded unless the status filter asks
      for them.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}/projects
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        'project_ids[]': "${project_ids}"
        status: "${organization_status}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      project_ids:
        type: array
        description: 'Only these project ids.'
        optional: true
        items: {type: integer}
      organization_status:
        type: string
        description: 'Filter by record status, e.g. active or archived.'
        optional: true
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  create_project:
    title: Create a project
    description: >-
      Create a project in an organization. Members still need assigning
      afterwards with update_project_members before anyone can track time to
      it.
    category: projects
    request:
      method: POST
      path: /v2/organizations/${organization_id}/projects
      body: "${attributes}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record as Hubstaff stores it after the call.'
      type: object

  get_project:
    title: Get a project
    description: >-
      One project by id, with its name, status, client and billing
      configuration. The quickest check of whether a project is still active
      before logging time against it.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v2/projects/${project_id}
    input:
      project_id:
        type: integer
        description: 'The project id.'
    output:
      description: 'The requested record.'
      type: object

  update_project:
    title: Update a project
    description: >-
      Change a project's name, status, client or billing settings. Setting the
      status to archived stops new time being tracked but preserves everything
      already recorded.
    category: projects
    request:
      method: PUT
      path: /v2/projects/${project_id}
      body: "${attributes}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  update_project_metadata:
    title: Update a project's metadata
    description: >-
      Attach your own key/value metadata to a project -- typically the id this
      project has in your own system, so later syncs can match without a name
      lookup.
    category: projects
    request:
      method: PUT
      path: /v2/projects/${project_id}/update_metadata
      body: "${attributes}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_organization_tasks:
    title: List an organization's tasks
    description: >-
      Every task across an organization's projects, filterable by status,
      assignee and project. `only_global_todos` narrows to the
      organization-wide to-do list rather than project tasks.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /v2/organizations/${organization_id}/tasks
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        status: "${status}"
        'user_ids[]': "${user_ids}"
        'project_ids[]': "${project_ids}"
        'global_todo_ids[]': "${global_todo_ids}"
    input:
      organization_id:
        type: integer
        description: 'The organization id, from list_organizations.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      status:
        type: string
        description: 'Filter by status.'
        optional: true
      user_ids:
        type: array
        description: 'Only these user ids.'
        optional: true
        items: {type: integer}
      project_ids:
        type: array
        description: 'Only these project ids.'
        optional: true
        items: {type: integer}
      global_todo_ids:
        type: array
        description: 'Only these global to-do ids.'
        optional: true
        items: {type: integer}
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  list_project_tasks:
    title: List a project's tasks
    description: >-
      The tasks on one project, filterable by status and assignee. Task ids
      from here are what time entries and activities reference.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /v2/projects/${project_id}/tasks
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        status: "${status}"
        'user_ids[]': "${user_ids}"
        'global_todo_ids[]': "${global_todo_ids}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      status:
        type: string
        description: 'Filter by status.'
        optional: true
      user_ids:
        type: array
        description: 'Only these user ids.'
        optional: true
        items: {type: integer}
      global_todo_ids:
        type: array
        description: 'Only these global to-do ids.'
        optional: true
        items: {type: integer}
    output:
      description: 'A page of matching records, with a `pagination` object carrying `next_page_start_id` when more remain.'
      type: object

  create_task:
    title: Create a task
    description: >-
      Create a task on a project so time can be tracked against something more
      specific than the project itself.
    category: tasks
    request:
      method: POST
      path: /v2/projects/${project_id}/tasks
      body: "${attributes}"
    input:
      project_id:
        type: integer
        description: 'The project id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record as Hubstaff stores it after the call.'
      type: object

  get_task:
    title: Get a task
    description: >-
      One task by id, with its summary, status, assignee and project. Use it
      to resolve the task ids that appear on activities and time entries.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /v2/tasks/${task_id}
    input:
      task_id:
        type: integer
        description: 'The task id.'
    output:
      description: 'The requested record.'
      type: object

  update_task:
    title: Update a task
    description: >-
      Change a task's summary, status or assignee. Completing a task does not
      stop time already tracked to it from counting.
    category: tasks
    request:
      method: PUT
      path: /v2/tasks/${task_id}
      body: "${attributes}"
    input:
      task_id:
        type: integer
        description: 'The task id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  delete_task:
    title: Delete a task
    description: >-
      Delete a task. Time already tracked against it does not disappear but
      loses its task association, which quietly changes how per-task reports
      add up.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /v2/tasks/${task_id}
    input:
      task_id:
        type: integer
        description: 'The task id.'
    output:
      description: 'Confirmation that the record was deleted.'
      type: object

  update_task_metadata:
    title: Update a task's metadata
    description: >-
      Attach your own key/value metadata to a task, typically the id it
      carries in the issue tracker it came from.
    category: tasks
    request:
      method: PUT
      path: /v2/tasks/${task_id}/update_metadata
      body: "${attributes}"
    input:
      task_id:
        type: integer
        description: 'The task id.'
      attributes:
        type: object
        description: 'The request payload, as flat top-level fields matching the resource''s documented attributes. See the endpoint''s reference page under https://developer.hubstaff.com/ for the exact fields.'
    output:
      description: 'The record after the update.'
      type: object

  list_integration_tasks:
    title: List an integration's tasks
    description: >-
      Tasks synced in from one connected integration, filterable by the remote
      ids they carry. This is how to line Hubstaff tasks up with the Jira or
      Asana issues they mirror.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /v2/integrations/${integration_id}/tasks
      query:
        page_start_id: "${page_start_id}"
        page_limit: "${page_limit}"
        include: "${include}"
        status: "${status}"
        'user_ids[]': "${user_ids}"
        'project_ids[]': "${project_ids}"
    input:
      integration_id:
        type: integer
        description: 'The integration id, from list_organization_integrations.'
      page_start_id:
        type: integer
        description: 'Id to start the page from, taken from the previous response''s pagination.next_page_start_id.'
        optional: true
      page_limit:
        type: integer
        description: 'How many records per page.'
        optional: true
      include:
        type: string
        description: 'Comma-separated related records to embed, e.g. "users,projects".'
        optional: true
      status:
        type: string
        description: 'Filter by status.'
        optional: true
      user_ids:
        type: array
        description: 'Only these user ids.'
        optional: true
        items: {type: integer}
      project_ids:
        type: array
