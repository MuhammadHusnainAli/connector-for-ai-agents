        type: object
        description: 'A filter expression for your brand''s visibility, mirroring the "Your
          brand" filter. brand_name matches whether a response mentions your brand: "mentioned"
          or "not_mentioned". page_status matches how the AI used your pages: "cited" (the
          AI retrieved pages from your site and referenced them in the answer), "found_but_not_cited"
          (the AI retrieved pages from your site as potential sources but did not reference
          them in the final answer), or "not_found" (the AI did not retrieve any pages from
          your sit...'
        optional: true
      volume_range:
        type: object
        description: The volume range to filter by.
        optional: true
      select:
        type: array
        description: 'Columns to return; request only what you need, since columns set the
          unit cost. Valid: country, data_source, last_updated, links (10 units), question,
          response (10 units), search_queries, status, tags, volume (10 units).'
        items:
          type: string
      where:
        type: object
        description: 'Filter as an Ahrefs boolean expression object, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}. Filterable columns: cited_domain, cited_domain_subdomains,
          cited_url_exact, cited_url_prefix, question, response, search_queries, topic.'
        optional: true
      tags_filter:
        type: object
        description: 'A filter expression for prompt tags. Requires report_id. Uses filter
          syntax with the following restrictions: the only valid field name is "tag"; the
          only valid operator are: "eq", "neq", "substring", "isubstring", "phrase_match",
          "iphrase_match", "prefix", "suffix", "empty"; maximum nesting depth of and, or is
          2.'
        optional: true
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      date:
        type: string
        description: The date to search for in YYYY-MM-DD format.
        optional: true
      search_volume_type:
        type: string
        description: AI visibility reports are switching to AI adjusted volume. It better
