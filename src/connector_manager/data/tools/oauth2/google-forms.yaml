# Google Forms API tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# Forms works the way Docs and Slides do: `create_form` makes an empty form,
# and every structural change afterwards -- adding questions, reordering items,
# setting the quiz grading -- goes through `batch_update_form` as a list of
# requests applied in order.
#
# The other half is responses. `list_response` pages through submissions and
# `get_response` reads one, both read-only; the API cannot submit a response on
# a respondent's behalf. `create_watch` registers a notification for new
# responses or schema changes, and a watch expires after seven days unless
# `renew_watch` extends it -- which is the part integrations most often miss.
#
# Docs: https://developers.google.com/forms/api/reference/rest

connector_id: google-forms
display_name: Google Forms
docs_url: https://developers.google.com/workspace/forms/api
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
  implies:
    drive:
    - drive.readonly
    forms.body:
    - forms.body.readonly
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  batch_update_form:
    title: Batch update form
    description: Change the form with a batch of updates.
    category: forms
    request:
      method: POST
      path: /v1/forms/${form_id}:batchUpdate
      body:
        includeFormInResponse: ${include_form_in_response}
        requests: ${requests}
        writeControl: ${write_control}
    input:
      form_id:
        type: string
        description: Required. The form ID.
      include_form_in_response:
        type: boolean
        description: Whether to return an updated version of the model in the response.
        optional: true
      requests:
        type: array
        items:
          type: string
        description: Required. The update requests of this batch.
        optional: true
      write_control:
        type: string
        description: Provides control over how write requests are executed.
        optional: true
    output:
      description: The BatchUpdateFormResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - forms.body
  create_form:
    title: Create form
    description: Create a new form using the title given in the provided form message in the request.
      *Important:* Only the form.info.title and form.info.document_title fields are copied to the new
      form. All other fields including the form description, items and settings are disallowed. To create
      a new form and add items, you must first call forms.create to create an empty form with a title
      and (optional) document title, and then cal
    category: forms
    request:
      method: POST
      path: /v1/forms
      query:
        unpublished: ${unpublished}
      body:
        info: ${info}
        settings: ${settings}
        items: ${items}
    input:
      unpublished:
        type: boolean
        description: Optional. Whether the form is unpublished. If set to true, the form doesn't accept
          responses. If set to false or unset, the form is published and accepts responses.
        optional: true
      info:
        type: string
        description: Required. The title and description of the form.
        optional: true
      settings:
        type: string
        description: The form's settings. This must be updated with UpdateSettingsRequest; it is ignored
          during CreateForm and UpdateFormInfoRequest.
        optional: true
      items:
        type: array
        items:
          type: string
        description: Required. A list of the form's items, which can include section headers, questions,
          embedded media, etc.
        optional: true
    output:
      description: The Form resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - forms.body
  get_form:
    title: Get form
    description: Get a form. Calls forms.get on the Google Forms API.
    category: forms
    request:
      method: GET
      path: /v1/forms/${form_id}
    input:
      form_id:
        type: string
        description: Required. The form ID.
    output:
      description: The Form resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.readonly
    - forms.body
    - forms.body.readonly
    read_only: true
  get_response:
    title: Get response
    description: Get one response from the form. Calls forms.responses.get on the Google Forms API.
    category: forms
    request:
      method: GET
      path: /v1/forms/${form_id}/responses/${response_id}
    input:
      form_id:
        type: string
        description: Required. The form ID.
      response_id:
        type: string
        description: Required. The response ID within the form.
    output:
      description: The FormResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - forms.responses.readonly
    read_only: true
  list_responses:
    title: List responses
    description: List a form's responses. Calls forms.responses.list on the Google Forms API.
    category: forms
    request:
      method: GET
      path: /v1/forms/${form_id}/responses
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      form_id:
        type: string
        description: Required. ID of the Form whose responses to list.
      filter:
        type: string
        description: 'Which form responses to return. Currently, the only supported filters are: * timestamp
          > *N* which means to get all form responses submitted after (but not at) timestamp *N*. * timestamp
          >= *N* which means to get all form responses submitted at and after timestamp *N*. For both
          supported filters, ti'
        optional: true
      page_size:
        type: integer
        description: The maximum number of responses to return. The service may return fewer than this
          value. If unspecified or zero, at most 5000 responses are returned.
        optional: true
      page_token:
        type: string
        description: A page token returned by a previous list response. If this field is set, the form
          and the values of the filter must be the same as for the original request.
        optional: true
    output:
      description: The ListFormResponsesResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - forms.responses.readonly
    read_only: true
  set_publish_settings_form:
    title: Set publish settings form
    description: Updates the publish settings of a form. Legacy forms aren't supported because they don't
      have the publish_settings field.
    category: forms
    request:
      method: POST
      path: /v1/forms/${form_id}:setPublishSettings
      body:
        publishSettings: ${publish_settings}
        updateMask: ${update_mask}
    input:
      form_id:
        type: string
        description: Required. The ID of the form. You can get the id from Form.form_id field.
      publish_settings:
        type: string
        description: Required. The desired publish settings to apply to the form.
        optional: true
      update_mask:
        type: string
        description: 'Optional. The publish_settings fields to update. This field mask accepts the following
          values: * publish_state: Updates or replaces all publish_state settings. * "*": Updates or replaces
          all publish_settings fields.'
        optional: true
    output:
      description: The SetPublishSettingsResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - forms.body
  create_watch:
    title: Create watch
    description: Create a new watch. If a watch ID is provided, it must be unused. For each invoking project,
      the per form limit is one watch per Watch.EventType. A watch expires seven days after it is created
      (see Watch.expire_time).
    category: forms
    request:
      method: POST
      path: /v1/forms/${form_id}/watches
      body:
        watchId: ${watch_id}
        watch: ${watch}
    input:
      form_id:
        type: string
        description: Required. ID of the Form to watch.
      watch_id:
        type: string
        description: The ID to use for the watch. If specified, the ID must not already be in use. If
          not specified, an ID is generated. This value should be 4-63 characters, and valid characters
          are /a-z-/.
        optional: true
      watch:
        type: string
        description: Required. The watch object. No ID should be set on this object; use watch_id instead.
        optional: true
    output:
      description: The Watch resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.readonly
    - forms.body
    - forms.body.readonly
    - forms.responses.readonly
  delete_watch:
    title: Delete watch
    description: Delete a watch. Calls forms.watches.delete on the Google Forms API.
    category: forms
    request:
      method: DELETE
      path: /v1/forms/${form_id}/watches/${watch_id}
    input:
      form_id:
        type: string
        description: Required. The ID of the Form.
      watch_id:
        type: string
        description: Required. The ID of the Watch to delete.
    output:
      description: The Empty resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.readonly
    - forms.body
    - forms.body.readonly
    - forms.responses.readonly
    destructive: true
  list_watches:
    title: List watches
    description: 'Return a list of the watches owned by the invoking project. The maximum number of watches
      is two: For each invoker, the limit is one for each event type per form.'
    category: forms
    request:
      method: GET
      path: /v1/forms/${form_id}/watches
    input:
      form_id:
        type: string
        description: Required. ID of the Form whose watches to list.
    output:
      description: The ListWatchesResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.readonly
    - forms.body
    - forms.body.readonly
    - forms.responses.readonly
    read_only: true
  renew_watch:
    title: Renew watch
    description: Renew an existing watch for seven days. The state of the watch after renewal is ACTIVE,
      and the expire_time is seven days from the renewal. Renewing a watch in an error state (e.g. SUSPENDED)
      succeeds if the error is no longer present, but fail otherwise. After a watch has expired, RenewWatch
      returns NOT_FOUND.
    category: forms
    request:
      method: POST
      path: /v1/forms/${form_id}/watches/${watch_id}:renew
      body: ${body}
    input:
      form_id:
        type: string
        description: Required. The ID of the Form.
      watch_id:
        type: string
        description: Required. The ID of the Watch to renew.
      body:
        type: object
        description: The RenewWatchRequest resource, as the API's own reference defines it.
    output:
      description: The Watch resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - drive.readonly
    - forms.body
    - forms.body.readonly
    - forms.responses.readonly
