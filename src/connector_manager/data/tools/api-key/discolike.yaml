      redirect:
        type: boolean
        description: Include domains that redirect to another domain.
        optional: true
        default: false
      social:
        type: string
        description: 'Filter by social platform presence. Valid values: facebook, instagram, linkedin,
          pinterest, threads, tiktok, twitter, x, yelp, youtube, googleplay, applestore, amazon, vk, bluesky,
          xing. Note: ''twitter'' is an alias for ''x''.'
        optional: true
      negate_social:
        type: string
        description: 'Exclude companies with specified social profiles. Filter by social platform presence.
          Valid values: facebook, instagram, linkedin, pinterest, threads, tiktok, twitter, x, yelp, youtube,
          googleplay, applestore, amazon, vk, bluesky, xing. Note: ''twitter'' is an alias for ''x''.'
        optional: true
      language:
        type: string
        description: 'Filter by site language. Valid values: ar (Arabic), az (Azerbaijani), bg (Bulgarian),
          bn (Bengali), bs (Bosnian), ca (Catalan), cs (Czech), da (Danish), de (German), el (Greek),
          en (English), eo (Esperanto), es (Spanish), et (Estonian), eu (Basque), fa (Persian), fi (Finnish),
          fr (French), ga (Irish), gl (Galician), he (Hebrew), hi (Hindi), hr (Croatian), hu (Hungarian),
          id (Indonesian), it (Itali'
        optional: true
      negate_language:
        type: string
        description: 'Exclude specified languages from results. Filter by site language. Valid values:
          ar (Arabic), az (Azerbaijani), bg (Bulgarian), bn (Bengali), bs (Bosnian), ca (Catalan), cs
          (Czech), da (Danish), de (German), el (Greek), en (English), eo (Esperanto), es (Spanish), et
          (Estonian), eu (Basque), fa (Persian), fi (Finnish), fr (French), ga (Irish), gl (Galician),
          he (Hebrew), hi (Hindi), hr (Croatian),'
        optional: true
      employee_range:
        type: string
        description: 'Filter by employee count range. Format: ''min,max'' (e.g., ''1,5000''). Maps to
          buckets: 1-10, 11-50, 51-200, 201-500, 501-1000, 1001-5000, 5001-10000, 10001+.'
        optional: true
      revenue_range:
        type: string
        description: 'Filter by company revenue. Format: ''min,max'' in raw numbers (e.g., ''1000000,10000000''
          for 1M-10M). Maps to buckets: 1B. Unknown-revenue domains (N/A) are included when the range
          covers the <1M bucket.'
        optional: true
      business_model:
        type: string
        description: 'Filter by business model label. Multi-select with OR semantics. Valid values: B2B,
          B2C, B2G, G2B, G2C, D2C, C2C, C2B.'
        optional: true
      negate_business_model:
        type: string
        description: 'Exclude domains with these business model labels. Filter by business model label.
          Multi-select with OR semantics. Valid values: B2B, B2C, B2G, G2B, G2C, D2C, C2C, C2B.'
        optional: true
      exclude_leadgen:
        type: boolean
        description: Exclude suspected lead generation sites. Filters out profiles with score <= 25 that
          also lack phone, email, and social media presence.
        optional: true
        default: true
      exact_match:
        type: string
        description: The exact_match parameter.
        optional: true
      negate_exact_match:
        type: string
        description: The negate_exact_match parameter.
        optional: true
      vendor:
        type: string
        description: The vendor parameter.
        optional: true
      negate_vendor:
        type: string
        description: The negate_vendor parameter.
        optional: true
      min_score:
        type: string
        description: The min_score parameter.
        optional: true
      max_score:
        type: string
        description: The max_score parameter.
        optional: true
      domain:
        type: string
        description: Domain(s) for lookalike matching. Up to 10 domains allowed.
        optional: true
      negate_domain:
        type: string
        description: Exclude results matching these domain contexts. Up to 10 domains.
        optional: true
      exclude_domain:
        type: string
        description: Hard-exclude these exact domains from results without affecting lookalike matching.
          Accepts comma-separated or repeated params. Up to 100 domains.
        optional: true
      icp_text:
        type: string
        description: Natural language description of ideal customer profile for semantic matching.
        optional: true
      negate_icp_text:
        type: string
        description: Description of business concepts to exclude from results.
        optional: true
      retrieval:
        type: boolean
        description: Enable page data retrieval using Extract API.
        optional: true
        default: false
      enhanced:
        type: boolean
        description: Enable AI-powered result enhancement for improved relevance.
        optional: true
        default: false
      include_search_domains:
        type: boolean
        description: Include input domains in results (excluded by default).
        optional: true
        default: false
      max_records:
        type: integer
        description: Maximum records to return (5-10000). Default 100.
        optional: true
        default: 100
      consensus:
        type: integer
        description: Number of top results for consensus search vector (1-20). Higher values reduce specificity.
        optional: true
        default: 1
      min_similarity:
        type: integer
        description: Minimum similarity score to include (0-99).
        optional: true
        default: 0
      variance:
        type: string
        description: 'Result diversity control: LOW, MIDLOW, MEDIUM, MIDHIGH, HIGH, UNRESTRICTED.'
        optional: true
        enum:
        - LOW
        - MID_LOW
        - MEDIUM
        - MID_HIGH
        - HIGH
        - UNRESTRICTED
        default: UNRESTRICTED
      offset:
        type: integer
        description: Records to skip for pagination.
        optional: true
        default: 0
      exclusion_query_id:
        type: string
        description: Exclude domains from saved queries.
        optional: true
      inclusion_query_id:
        type: string
        description: Include domains from saved queries. Requires STARTER plan.
        optional: true
      auto_icp_text:
        type: boolean
        description: Auto-generate ICP text from provided domain(s).
        optional: true
        default: false
      auto_phrase_match:
        type: boolean
        description: Auto-generate phrase matches from ICP text.
        optional: true
        default: false
      icp_prompt:
        type: string
        description: Natural language ICP description. Automatically extracts structured filters, generates
          ICP text, suggests domains, and applies them before running discovery. Overrides autoicptext
          and autophrasematch when set.
        optional: true
      nl_match:
        type: string
        description: The nl_match parameter.
        optional: true
      negate_nl_match:
        type: string
        description: The negate_nl_match parameter.
        optional: true
    output:
      description: Successful Response
      type: object
    read_only: true
  extract_extract_get:
    title: Extract web page content
    description: Extract web page content Extracts text content from a web page URL. Returns page text
      and detected language. Calls GET /extract on the provider's API.
    category: extract
    request:
      method: GET
      path: /extract
      query:
        url: ${url}
        domain: ${domain}
    input:
      url:
        type: string
        description: URL of the web page to extract content from.
        optional: true
      domain:
        type: string
        description: Bare domain to extract — alias for url=https://{domain}; hits the cached page when
          available.
        optional: true
    output:
      description: Successful Response
      type: object
    read_only: true
  growth_growth_get:
    title: Get company growth metrics
    description: Get company growth metrics Returns quarterly growth metrics including subdomain counts
      and digital footprint scores for the past 5 quarters. Calls GET /growth on the provider's API.
    category: growth
    request:
      method: GET
      path: /growth
      query:
        domain: ${domain}
    input:
      domain:
        type: string
        description: The domain parameter.
    output:
      description: Successful Response
      type: object
    read_only: true
  match_api_match_get:
    title: Match company by name
    description: Match company by name Pairs a company name with business domain profiles. Returns potential
      matches ranked by relevance, with the most likely match listed first. Location and contact info
      improve matching accuracy. Calls GET /match on the provider's API.
    category: match
    request:
      method: GET
      path: /match
      query:
        name: ${name}
        phone: ${phone}
        city: ${city}
        state: ${state}
        country: ${country}
        zip_code: ${zip_code}
        strict: ${strict}
        local_mode: ${local_mode}
        min_match_confidence: ${min_match_confidence}
    input:
      name:
        type: string
        description: The company name to match
      phone:
        type: string
        description: Phone number to augment the search (E.164 or local format)
        optional: true
      city:
        type: string
        description: City to augment the search
        optional: true
      state:
        type: string
        description: State code to augment the search
        optional: true
      country:
        type: string
        description: ISO-3166-1 alpha-2 country code to augment the search
        optional: true
      zip_code:
        type: string
        description: Zip code to augment the search
        optional: true
      strict:
        type: boolean
        description: Enable strict matching (no filter relaxation)
        optional: true
        default: false
      local_mode:
        type: boolean
        description: Preserve location filters during relaxation.
        optional: true
        default: false
      min_match_confidence:
        type: integer
        description: Minimum matchconfidence (inclusive, 50-100) a match must have to be returned. Defaults
          to 50, the standard quality floor.
        optional: true
        default: 50
    output:
      description: Successful Response
      type: object
    read_only: true
  publiclink_api_publiclink_get:
    title: Get public link data
    description: Get public link data Find related domains that share the same public contact info (email,
      social, phone). Calls GET /publiclink on the provider's API.
    category: publiclink
    request:
      method: GET
      path: /publiclink
      query:
        domain: ${domain}
        source: ${source}
    input:
      domain:
        type: string
        description: The domain parameter.
      source:
        type: string
        description: The source parameter.
        enum:
        - email
        - social
        - phone
    output:
      description: Successful Response
      type: object
    read_only: true
  redirects_redirects_get:
    title: Get domain redirect relationships
    description: Get domain redirect relationships Returns domains that redirect to or from the specified
      domain. Calls GET /redirects on the provider's API.
    category: redirects
    request:
      method: GET
      path: /redirects
      query:
        domain: ${domain}
        match: ${match}
    input:
      domain:
        type: string
        description: The domain parameter.
      match:
        type: string
        description: The match parameter.
        optional: true
        enum:
        - source
        - linked
        default: source
    output:
      description: Successful Response
      type: object
    read_only: true
  score_score_get:
    title: Get digital footprint score breakdown
    description: Get digital footprint score breakdown Returns the digital footprint score with parameter
      breakdown showing how the score was calculated. Calls GET /score on the provider's API.
    category: score
    request:
      method: GET
      path: /score
      query:
        domain: ${domain}
    input:
      domain:
        type: string
        description: The domain parameter.
    output:
      description: Successful Response
      type: object
    read_only: true
