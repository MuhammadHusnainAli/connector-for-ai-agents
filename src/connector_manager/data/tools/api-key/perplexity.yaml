          returns HTTP 400 with: validation failed: maxoutputtokens is required when using Anthropic models.'
        optional: true
      max_steps:
        type: integer
        description: Maximum number of research loop steps. If provided, overrides the preset's maxsteps
          value. For requests that specify model or models without a preset, the default is 1. Set maxsteps
          to at least 3 when using financesearch with a direct model so the agent has enough steps to
          initialize and run the tool. Must be = 1 if specified. Maximum allowed is 100.
        optional: true
      model:
        type: string
        description: Model ID in provider/model format (e.g., "openai/gpt-5", "anthropic/claude-sonnet-4-6").
          If models is also provided, models takes precedence. Required if neither models nor preset is
          provided.
        optional: true
      models:
        type: array
        description: Model fallback chain. Each model is in provider/model format. Models are tried in
          order until one succeeds. Max 5 models allowed. If set, takes precedence over single model field.
          The response.model will reflect the model that actually succeeded.
        optional: true
        items:
          type: string
      preset:
        type: string
        description: Preset configuration name (e.g., "fast", "low", "medium", "high", "xhigh"). Pre-configured
          model with system prompt and search parameters. Required if model is not provided.
        optional: true
      previous_response_id:
        type: string
        description: OpenAI-compatible previous response id for multi-turn response chains. When set,
          the new response continues from the completed prior response's saved state. The prior response
          must belong to the same account and have completed.
        optional: true
      reasoning:
        type: object
        description: The reasoning field of the request body.
        optional: true
      response_format:
        type: object
        description: Specifies the desired output format for the model response
        optional: true
    output:
      description: 'Successful response. Content type depends on stream parameter: - stream: false (default):
