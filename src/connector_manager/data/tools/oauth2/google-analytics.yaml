          The API returns a maximum of 250,000 rows per request, no matter how many you ask for. limit
          must be positive. The API can also return fewer rows than the requested limit, if there aren't
          as many dimension values as th
        optional: true
      offset:
        type: string
        description: Optional. The row count of the start row. The first row is counted as row 0. When
          paging, the first request does not specify offset; or equivalently, sets offset to 0; the first
          request returns the first limit of rows. The second request sets offset to the limit of the
          first request; the second requ
        optional: true
    output:
