  list_slos:
    title: Get all SLOs
    description: >-
      Get a list of service level objective objects for your organization.
    category: slos
    read_only: true
    request:
      method: GET
      path: /v1/slo
      query:
        ids: "${ids}"
        query: "${query}"
        tags_query: "${tags_query}"
        metrics_query: "${metrics_query}"
        limit: "${limit}"
        offset: "${offset}"
        is_deleted: "${is_deleted}"
    input:
      ids:
        type: string
        description: A comma separated list of the IDs of the service level objectives objects.
        optional: true
      query:
        type: string
        description: The query string to filter results based on SLO names.
        optional: true
      tags_query:
        type: string
        description: The query string to filter results based on a single SLO tag.
        optional: true
      metrics_query:
        type: string
        description: The query string to filter results based on SLO numerator and denominator.
        optional: true
      limit:
        type: integer
        description: The number of SLOs to return in the response.
        optional: true
        default: '1000'
      offset:
        type: integer
        description: The specific offset to use as the beginning of the returned response.
        optional: true
      is_deleted:
        type: boolean
        description: Whether to return only deleted service level objective objects.
        optional: true
        default: 'False'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_slos:
    title: Search for SLOs
    description: >-
      Get a list of service level objective objects for your organization.
    category: slos
    read_only: true
    request:
      method: GET
      path: /v1/slo/search
      query:
        query: "${query}"
        page[size]: "${page_size_}"
        page[number]: "${page_number_}"
        include_facets: "${include_facets}"
    input:
      query:
        type: string
        description: The query string to filter results based on SLO names. Some examples of queries include `service:<service-name>` and `<slo-name>`.
        optional: true
      page_size_:
        type: integer
        description: The number of files to return in the response `[default=10]`.
        optional: true
      page_number_:
        type: integer
        description: The identifier of the first page to return. This parameter is used for the pagination feature `[default=0]`.
        optional: true
      include_facets:
        type: boolean
        description: Whether or not to return facet information in the response `[default=false]`.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

