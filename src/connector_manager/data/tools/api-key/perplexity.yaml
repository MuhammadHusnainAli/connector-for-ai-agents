      instructions:
        type: string
        description: System instructions for the model
        optional: true
      language_preference:
        type: string
        description: ISO 639-1 language code for response language
        optional: true
      max_output_tokens:
        type: integer
        description: 'Maximum tokens to generate. This is a shared optional Agent API request parameter,
