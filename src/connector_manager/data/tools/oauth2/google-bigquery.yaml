# Google BigQuery tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# The whole v2 REST surface: projects, datasets, tables, table data, jobs,
# models, routines, row access policies and their IAM policies.
#
# How work actually gets done here:
#
#   * `query_job` runs SQL and, for a short query, returns rows directly. A
#     longer one comes back with `jobComplete` false and a job id, which
#     `get_query_result` then polls -- so treat every query as potentially
#     asynchronous;
#   * `insert_job` is the general form: query, load, extract and copy are all
#     job configurations rather than separate endpoints;
#   * `insert_all_table_data` streams rows in without a load job, which is what
#     near-real-time ingestion uses.
#
# Cost is a real consideration on this API. A query is billed on the bytes it
# scans, so `dryRun` in a job configuration -- which returns the estimate
# without running anything -- is worth using before an expensive one.
#
# Docs: https://cloud.google.com/bigquery/docs/reference/rest

connector_id: google-bigquery
display_name: Google BigQuery
docs_url: https://cloud.google.com/bigquery/
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  delete_dataset:
    title: Delete dataset
    description: 'Deletes the dataset specified by the datasetId value. Before you can delete a dataset,
      you must delete all its tables, either manually or by specifying deleteContents. Immediately after
      deletion, you can create another dataset with the same name. # IAM Permissions Requires the bigquery.datasets.delete
      permission on the dataset.'
    category: datasets
    request:
      method: DELETE
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}
      query:
        deleteContents: ${delete_contents}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of dataset being deleted
      project_id:
        type: string
        description: Required. Project ID of the dataset being deleted
      delete_contents:
        type: boolean
        description: If True, delete all the tables in the dataset. If False and the dataset contains
          tables, the request will fail. Default is False
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    destructive: true
  get_dataset:
    title: Get dataset
    description: 'Returns the dataset specified by datasetID. # IAM Permissions Requires the bigquery.datasets.get
      permission on the dataset.'
    category: datasets
    request:
      method: GET
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}
      query:
        accessPolicyVersion: ${access_policy_version}
        datasetView: ${dataset_view}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of the requested dataset
      project_id:
        type: string
        description: Required. Project ID of the requested dataset
      access_policy_version:
        type: integer
        description: Optional. The version of the access policy schema to fetch. Valid values are 0, 1,
          and 3. Requests specifying an invalid value will be rejected. Requests for conditional access
          policy binding in datasets must specify version 3. Dataset with no conditional role bindings
          in access policy may specify a
        optional: true
      dataset_view:
        type: string
        description: Optional. Specifies the view that determines which dataset information is returned.
          By default, metadata and ACL information are returned.
        optional: true
        enum:
        - DATASET_VIEW_UNSPECIFIED
        - METADATA
        - ACL
        - FULL
    output:
      description: The Dataset resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
    read_only: true
  create_dataset:
    title: Create dataset
    description: 'Creates a new empty dataset. # IAM Permissions Requires the bigquery.datasets.create
      permission on the project.'
    category: datasets
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/datasets
      query:
        accessPolicyVersion: ${access_policy_version}
      body:
        defaultEncryptionConfiguration: ${default_encryption_configuration}
        defaultTableExpirationMs: ${default_table_expiration_ms}
        description: ${description}
        isCaseInsensitive: ${is_case_insensitive}
        defaultCollation: ${default_collation}
        labels: ${labels}
        resourceTags: ${resource_tags}
        friendlyName: ${friendly_name}
        externalDatasetReference: ${external_dataset_reference}
        storageBillingModel: ${storage_billing_model}
        externalCatalogDatasetOptions: ${external_catalog_dataset_options}
        access: ${access}
        linkedDatasetSource: ${linked_dataset_source}
        datasetReference: ${dataset_reference}
        defaultRoundingMode: ${default_rounding_mode}
        defaultPartitionExpirationMs: ${default_partition_expiration_ms}
        maxTimeTravelHours: ${max_time_travel_hours}
        location: ${location}
    input:
      project_id:
        type: string
        description: Required. Project ID of the new dataset
      access_policy_version:
        type: integer
        description: Optional. The version of the provided access policy schema. Valid values are 0, 1,
          and 3. Requests specifying an invalid value will be rejected. This version refers to the schema
          version of the access policy and not the version of access policy. This field's value can be
          equal or more than the acces
        optional: true
      default_encryption_configuration:
        type: string
        description: The default encryption key for all tables in the dataset. After this property is
          set, the encryption key of all newly-created tables in the dataset is set to this value unless
          the table creation request or query explicitly overrides the key.
        optional: true
      default_table_expiration_ms:
        type: string
        description: Optional. The default lifetime of all tables in the dataset, in milliseconds. The
          minimum lifetime value is 3600000 milliseconds (one hour). To clear an existing default expiration
          with a PATCH request, set to 0. Once this property is set, all newly-created tables in the dataset
          will have an expirat
        optional: true
      description:
        type: string
        description: Optional. A user-friendly description of the dataset.
        optional: true
      is_case_insensitive:
        type: boolean
        description: Optional. TRUE if the dataset and its table names are case-insensitive, otherwise
          FALSE. By default, this is FALSE, which means the dataset and its table names are case-sensitive.
          This field does not affect routine references.
        optional: true
      default_collation:
        type: string
        description: Optional. Defines the default collation specification of future tables created in
          the dataset. If a table is created in this dataset without table-level default collation, then
          the table inherits the dataset default collation, which is applied to the string fields that
          do not have explicit collation
        optional: true
      labels:
        type: object
        description: The labels associated with this dataset. You can use these to organize and group
          your datasets. You can set this property when inserting or updating a dataset. See Creating
          and Updating Dataset Labels for more information.
        optional: true
      resource_tags:
        type: object
        description: Optional. The tags attached to this dataset. Tag keys are globally unique. Tag key
          is expected to be in the namespaced format, for example "123456789012/environment" where 123456789012
          is the ID of the parent organization or project resource for this tag key. Tag value is expected
          to be the short na
        optional: true
      friendly_name:
        type: string
        description: Optional. A descriptive name for the dataset.
        optional: true
      external_dataset_reference:
        type: string
        description: Optional. Reference to a read-only external dataset defined in data catalogs outside
          of BigQuery. Filled out when the dataset type is EXTERNAL.
        optional: true
      storage_billing_model:
        type: string
        description: Optional. Updates storage_billing_model for the dataset.
        optional: true
        enum:
        - STORAGE_BILLING_MODEL_UNSPECIFIED
        - LOGICAL
        - PHYSICAL
      external_catalog_dataset_options:
        type: string
        description: Optional. Options defining open source compatible datasets living in the BigQuery
          catalog. Contains metadata of open source database, schema or namespace represented by the current
          dataset.
        optional: true
      access:
        type: array
        items:
          type: object
        description: Optional. An array of objects that define dataset access for one or more entities.
          You can set this property when inserting or updating a dataset in order to control who is allowed
          to access the data. If unspecified at dataset creation time, BigQuery adds default dataset access
          for the following ent
        optional: true
      linked_dataset_source:
        type: string
        description: Optional. The source dataset reference when the dataset is of type LINKED. For all
          other dataset types it is not set. This field cannot be updated once it is set. Any attempt
          to update this field using Update and Patch API Operations will be ignored.
        optional: true
      dataset_reference:
        type: string
        description: Required. A reference that identifies the dataset.
        optional: true
      default_rounding_mode:
        type: string
        description: Optional. Defines the default rounding mode specification of new tables created within
          this dataset. During table creation, if this field is specified, the table within this dataset
          will inherit the default rounding mode of the dataset. Setting the default rounding mode on
          a table overrides this opt
        optional: true
        enum:
        - ROUNDING_MODE_UNSPECIFIED
        - ROUND_HALF_AWAY_FROM_ZERO
        - ROUND_HALF_EVEN
      default_partition_expiration_ms:
        type: string
        description: This default partition expiration, expressed in milliseconds. When new time-partitioned
          tables are created in a dataset where this property is set, the table will inherit this value,
          propagated as the TimePartitioning.expirationMs property on the new table. If you set TimePartitioning.expirationMs
          e
        optional: true
      max_time_travel_hours:
        type: string
        description: Optional. Defines the time travel window in hours. The value can be from 48 to 168
          hours (2 to 7 days). The default value is 168 hours if this is not set.
        optional: true
      location:
        type: string
        description: The geographic location where the dataset should reside. See https://cloud.google.com/bigquery/docs/locations
          for supported locations.
        optional: true
    output:
      description: The Dataset resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
  list_datasets:
    title: List datasets
    description: 'Lists all datasets in the specified project to which the user has been granted the READER
      dataset role. # IAM Permissions Requires no specific IAM permission(s) to use this method. Results
      are filtered to only include datasets on which the caller has the bigquery.datasets.get permission.'
    category: datasets
    request:
      method: GET
      path: /bigquery/v2/projects/${project_id}/datasets
      query:
        all: ${all}
        filter: ${filter}
        maxResults: ${max_results}
        pageToken: ${page_token}
    input:
      project_id:
        type: string
        description: Required. Project ID of the datasets to be listed
      all:
        type: boolean
        description: Whether to list all datasets, including hidden ones
        optional: true
      filter:
        type: string
        description: 'An expression for filtering the results of the request by label. The syntax is labels.[:].
          Multiple filters can be AND-ed together by connecting with a space. Example: labels.department:receiving
          labels.active. See Filtering datasets using labels for details.'
        optional: true
      max_results:
        type: integer
        description: The maximum number of results to return in a single response page. Leverage the page
          tokens to iterate through the entire collection.
        optional: true
      page_token:
        type: string
        description: Page token, returned by a previous call, to request the next page of results
        optional: true
    output:
      description: The DatasetList resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
    - cloud-platform.read-only
    read_only: true
