      headers:
        Accept: application/vnd.api+json
    input:
      benchmark_id:
        type: string
        description: The benchmark's id.
    output:
      description: The benchmark.
      type: object
      properties:
        data: {type: object}

  list_benchmark_compositions:
    title: List benchmark compositions
    description: >-
      The compositions behind the firm's benchmarks -- which constituents make
      up a blended benchmark, and in what proportion.
    category: benchmarks
    scopes: [BENCHMARKS_READ]
    read_only: true
    request:
      method: GET
      path: /v1/benchmark_compositions
      query:
        page[limit]: "${limit}"
        page[cursor]: "${cursor}"
      headers:
        Accept: application/vnd.api+json
    input:
      limit:
        type: integer
        description: How many compositions per page.
        optional: true
        default: 25
        minimum: 1
      cursor:
        type: string
        description: Cursor from the previous response's links.
        optional: true
    output:
      description: A page of benchmark compositions.
      type: object
      properties:
        data: {type: array}
        links: {type: object}

  list_billable_portfolios:
    title: List billable portfolios
    description: >-
      The portfolios the firm bills, each with the fee schedule assigned to it
      -- the input to a billing run.
    category: billing
    scopes: [BILLING_READ]
    read_only: true
    request:
      method: GET
      path: /v1/billable_portfolios
      query:
        page[limit]: "${limit}"
        page[cursor]: "${cursor}"
      headers:
        Accept: application/vnd.api+json
    input:
      limit:
        type: integer
        description: How many billable portfolios per page.
        optional: true
        default: 25
        minimum: 1
      cursor:
        type: string
        description: Cursor from the previous response's links.
        optional: true
    output:
      description: A page of billable portfolios.
      type: object
      properties:
        data: {type: array}
        links: {type: object}

  list_fee_schedules:
    title: List fee schedules
    description: >-
      The fee schedules defined in the firm, with the fees each contains --
      what a billable portfolio is charged under.
    category: billing
    scopes: [BILLING_READ]
    read_only: true
    request:
      method: GET
      path: /v1/fee_schedules
      query:
        page[limit]: "${limit}"
        page[cursor]: "${cursor}"
      headers:
        Accept: application/vnd.api+json
    input:
      limit:
        type: integer
        description: How many fee schedules per page.
        optional: true
        default: 25
        minimum: 1
      cursor:
        type: string
        description: Cursor from the previous response's links.
        optional: true
    output:
      description: A page of fee schedules.
      type: object
      properties:
        data: {type: array}
        links: {type: object}

  list_fees:
    title: List fees
    description: >-
      The individual fees defined in the firm, each with its rate structure --
      the building blocks fee schedules assemble.
    category: billing
    scopes: [BILLING_READ]
    read_only: true
    request:
      method: GET
      path: /v1/fees
      query:
        page[limit]: "${limit}"
        page[cursor]: "${cursor}"
      headers:
        Accept: application/vnd.api+json
    input:
      limit:
        type: integer
        description: How many fees per page.
        optional: true
        default: 25
        minimum: 1
      cursor:
        type: string
        description: Cursor from the previous response's links.
        optional: true
    output:
      description: A page of fees.
      type: object
      properties:
        data: {type: array}
        links: {type: object}

  query_audit_trail:
    title: Query the audit trail
    description: >-
      What happened in the firm's Addepar instance and who did it, filtered by
      date range, action, object type and user. The record to reach for when a
      figure changed and nobody remembers why.
    category: audit
    scopes: [AUDIT_TRAIL]
    read_only: true
    request:
      method: POST
      path: /v1/audit_trail
      headers:
        Content-Type: application/vnd.api+json
        Accept: application/vnd.api+json
      body:
        data:
          type: audit_trail_query
          attributes:
            startDate: "${start_date}"
            endDate: "${end_date}"
            actions: "${actions}"
            objectType: "${object_type}"
            users: "${users}"
            userType: "${user_type}"
    input:
      start_date:
        type: string
        description: Earliest date to include, as YYYY-MM-DD.
        example: "2026-08-01"
      end_date:
        type: string
        description: Latest date to include, as YYYY-MM-DD.
        example: "2026-08-31"
      actions:
        type: array
        description: Only these actions, e.g. create, update, delete.
        optional: true
        items: {type: string}
      object_type:
        type: string
        description: Only entries about this kind of object.
        optional: true
      users:
        type: array
        description: Only entries by these users.
        optional: true
        items: {type: string}
      user_type:
        type: string
        description: Only entries by users of this kind, e.g. firm users or portal contacts.
        optional: true
    output:
      description: The matching audit entries.
      type: object
      properties:
        data: {type: array}
        links: {type: object}

  get_audit_trail_entry:
    title: Get an audit trail entry
    description: >-
      One audit entry by id, with the full before-and-after detail of the
      change it records.
    category: audit
    scopes: [AUDIT_TRAIL]
    read_only: true
    request:
      method: GET
      path: /v1/audit_trail/${audit_trail_id}
      headers:
        Accept: application/vnd.api+json
    input:
      audit_trail_id:
        type: string
        description: The audit entry's id.
    output:
      description: The audit entry.
      type: object
      properties:
        data: {type: object}
