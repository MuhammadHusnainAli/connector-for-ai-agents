  # -- characters ----------------------------------------------------------

  get_character_profile:
    title: Get a character profile
    description: >-
      Read a character's summary -- level, race, class, specialisation, item
      level, guild and achievement points. `realm_slug` is the hyphenated
      lower-case realm and `character_name` must be lower case, or Blizzard
      404s.
    category: characters
    read_only: true
    request:
      method: GET
      path: /profile/wow/character/${realm_slug}/${character_name}
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug -- lower case and hyphenated, e.g. "tarren-mill".
        example: tarren-mill
      character_name:
        type: string
        description: The character's name in lower case.
        example: thrall
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names, e.g. "en_US".
        optional: true
    output:
      description: The character's profile summary.
      type: object
      properties:
        name: {type: string}
        level: {type: integer}
        equipped_item_level: {type: integer}
        character_class: {type: object}

