        type: integer
        description: 'The project to log the time against.'
      start_time:
        type: string
        description: 'When the work started, ISO 8601.'
      tracked:
        type: integer
        description: 'How many seconds to log.'
      task_id:
        type: integer
        description: 'The task within the project, if the time belongs to one.'
        optional: true
