  get_gsc_performance_history:
    title: Get GSC performance history
    description: >-
      Chart Google Search Console clicks, impressions, CTR and average position over a period
      for a project or portfolio. Free: consumes no API units.
    category: search_console
    read_only: true
    request:
      method: GET
      path: /v3/gsc/performance-history
      query:
        project_id: ${project_id}
        portfolio_id: ${portfolio_id}
        date_from: ${date_from}
        date_to: ${date_to}
        history_grouping: ${history_grouping}
        search_type: ${search_type}
        country: ${country}
        device: ${device}
        where: ${where}
    input:
      project_id:
        type: integer
        description: Ahrefs project id with Google Search Console connected. Required unless
          portfolio_id is given.
        optional: true
      portfolio_id:
        type: integer
        description: Portfolio id, to aggregate every GSC-connected project in it instead
          of one project.
        optional: true
      date_from:
        type: string
        description: The start date of the historical period in YYYY-MM-DD format.
      date_to:
        type: string
        description: The end date of the historical period in YYYY-MM-DD format.
        optional: true
      history_grouping:
        type: string
        description: 'Interval to group history points by: daily, weekly or monthly.'
        optional: true
        enum:
        - daily
        - weekly
        - monthly
      search_type:
        type: string
        description: The type of search results to return (web, image, video, news).
        optional: true
        enum:
        - web
        - image
        - video
        - news
      country:
        type: string
        description: Two-letter ISO 3166-1 alpha-2 country code, lowercase, e.g. us.
        optional: true
      device:
        type: string
        description: Filter by device type (DESKTOP, MOBILE, TABLET). If not specified, all
          devices are included.
        optional: true
        enum:
        - desktop
        - mobile
        - tablet
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: url.'
        optional: true
    output:
      description: Performance over time.
      type: array
      items:
        type: object
      response_path: metrics

