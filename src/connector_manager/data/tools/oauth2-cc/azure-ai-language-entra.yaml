        trainingMode: "${training_mode}"
        trainingConfigVersion: "${training_config_version}"
        evaluationOptions: "${evaluation_options}"
    input:
      project_name:
        type: string
        description: Project whose utterances to train on.
        example: TravelBot
      model_label:
        type: string
        description: Name to give the trained model.
        example: v2
      training_mode:
        type: string
        description: Standard trains quickly; advanced takes longer and usually scores better.
        optional: true
        enum: [standard, advanced]
      training_config_version:
        type: string
        description: Pin a training configuration version instead of the current default.
        optional: true
      evaluation_options:
        type: object
        description: 'Train/test split, e.g. {"kind": "percentage", "trainingSplitPercentage": 80, "testingSplitPercentage": 20}.'
