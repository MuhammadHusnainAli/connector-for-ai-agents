    title: Get SERP overview
    description: >-
      Read the current or historical search results page for a keyword in a country, with
      each result's URL, type, Domain Rating, backlinks, traffic and keywords. Metered: API
      units per row and per column selected, 50 minimum.
    category: serp
    read_only: true
    request:
      method: GET
      path: /v3/serp-overview/serp-overview
      query:
        select: ${select}
        type: ${type}
        top_positions: ${top_positions}
        date: ${date}
        country: ${country}
        keyword: ${keyword}
    input:
      select:
        type: string
        description: 'Comma-separated columns to return; request only what you need, since
          columns set the unit cost. Valid: ahrefs_rank, backlinks, domain_rating, keywords,
          page_type, position, refdomains (5 units), title, top_keyword, top_keyword_volume
          (10 units), traffic (10 units), type, update_date, url, url_rating, value (10 units).'
      type:
        type: string
        description: A comma-separated list of SERP feature types to filter by. Only positions
          whose type includes at least one of the given values are returned. If not specified,
          positions of all types are returned.
        optional: true
      top_positions:
        type: integer
        description: The number of top organic SERP positions to return. If not specified,
          all available positions will be returned.
        optional: true
      date:
        type: string
        description: A timestamp on which the last available SERP Overview is returned in
          YYYY-MM-DDThh:mm:ss format. If it is not specified, the most recent SERP Overview
          is returned.
        optional: true
      country:
        type: string
        description: Two-letter ISO 3166-1 alpha-2 country code, lowercase, e.g. us.
      keyword:
        type: string
        description: The keyword to return SERP Overview for.
    output:
      description: SERP positions with metrics.
      type: array
      items:
        type: object
      response_path: positions

  batch_analysis:
    title: Analyse many targets
    description: >-
      Read headline metrics -- Domain Rating, backlinks, referring domains, organic keywords
      and traffic -- for up to hundreds of domains or URLs in one request. Metered: API units
      per row and per column selected, 50 minimum.
    category: batch_analysis
    read_only: true
    request:
      method: POST
      path: /v3/batch-analysis/batch-analysis
      body:
        select: ${select}
        order_by: ${order_by}
        top_countries: ${top_countries}
        country: ${country}
        volume_mode: ${volume_mode}
        targets: ${targets}
    input:
      select:
        type: array
        description: 'Columns to return; request only what you need, since columns set the
          unit cost. Valid: ahrefs_rank, backlinks, backlinks_dofollow, backlinks_internal,
          backlinks_nofollow, backlinks_redirect, domain_rating, index, ip, linked_domains,
          linked_domains_dofollow, mode, org_cost (10 units), org_keywords, org_keywords_11_20,
          org_keywords_1_3, org_keywords_21_50, org_keywords_4_10, org_keywords_51_plus, org_traffic
          (10 units), org_traffic_top_by_country, outgoing_links, outgoing_links_dofollow,
          paid_ads, paid_cost (10 units), paid_keywords, paid_traffic (10 units), protocol,
          refdomains (5 units), refdomains_dofollow (5 units), refdomains_nofollow (5 units),
          refips, refips_subnets, url, url_rating.'
        items:
          type: string
      order_by:
        type: array
        description: 'A list of fields to order the results by, with optional direction. Format:
          field_name:asc or field_name:desc (default desc). - ahrefs_rank - backlinks - backlinks_dofollow
          - backlinks_internal - backlinks_nofollow - backlinks_redirect - domain_rating -
          index - ip - linked_domains - linked_domains_dofollow - mode - org_cost (10 units)
          - org_keywords - org_keywords_11_20 - org_keywords_1_3 - org_keywords_21_50 - org_keywords_4_10
          - org_keywords_51_plus - org_traffic (10 units) - org_traffic_top_by...'
        optional: true
        items:
          type: string
      top_countries:
        type: integer
        description: How many top countries by traffic to include per target.
        optional: true
      country:
        type: string
        description: A two-letter country code (ISO 3166-1 alpha-2).
        optional: true
      volume_mode:
        type: string
        description: 'The search volume calculation mode: monthly or average. It affects volume,
          traffic, and traffic value.'
        optional: true
        enum:
        - monthly
        - average
      targets:
        type: array
        description: Targets to analyse, each {url, mode, protocol}.
        items:
          type: object
    output:
      description: Metrics per target.
      type: array
      items:
        type: object
      response_path: targets

  get_limits_and_usage:
