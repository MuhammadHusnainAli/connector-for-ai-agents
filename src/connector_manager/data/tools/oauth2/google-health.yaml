      data_source_family:
        type: string
        description: 'Optional. The data source family name to reconcile. If empty, data points from all
          data sources will be reconciled. Format: users/me/dataSourceFamilies/{data_source_family} -
          users/me/dataSourceFamilies/all-sources - Default value. Includes data from all available data
          sources. - users/me/dataSource'
        optional: true
      filter:
        type: string
        description: Optional. Filter expression based on https://aip.dev/160. A time range, either physical
          or civil, can be specified. See the ListDataPointsRequest.filter for the supported fields and
          syntax.
        optional: true
      page_size:
        type: integer
        description: Optional. The maximum number of data points to return. If unspecified, at most 1440
          data points will be returned. The maximum page size is 10000; values above that will be truncated
          accordingly. For exercise and sleep the default page size is 25. The maximum page size for exercise
          and sleep is 25.
        optional: true
      page_token:
        type: string
        description: Optional. The next_page_token from a previous request, if any.
        optional: true
    output:
      description: The ReconcileDataPointsResponse resource.
      type: object
    scopes_any:
    - googlehealth.activity_and_fitness.readonly
    - googlehealth.activity_and_fitness.writeonly
    - googlehealth.health_metrics_and_measurements.readonly
    - googlehealth.health_metrics_and_measurements.writeonly
    - googlehealth.location.readonly
    - googlehealth.logged_symptoms.writeonly
    - googlehealth.mindfulness.writeonly
    - googlehealth.nutrition.writeonly
    - googlehealth.reproductive_health.writeonly
    - googlehealth.sleep.readonly
    - googlehealth.sleep.writeonly
    read_only: true
  roll_up_data_point:
    title: Roll up data point
    description: Roll up data points over physical time intervals for supported data types.
    category: users
    request:
      method: POST
      path: /v4/${parent}/dataPoints:rollUp
      body:
        windowSize: ${window_size}
        pageSize: ${page_size}
        dataSourceFamily: ${data_source_family}
        range: ${range}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. Parent data type of the Data Point collection. Format: users/{user}/dataTypes/{data_type},
          e.g.: - users/me/dataTypes/steps - users/me/dataTypes/distance For a list of the supported data
          types see the RollupDataPoint value union field.'
      window_size:
        type: string
        description: Required. The size of the time window to group data points into before applying the
          aggregation functions. Must be at least 1 second.
        optional: true
      page_size:
        type: integer
        description: Optional. The maximum number of data points to return. If unspecified, at most 1440
          data points will be returned. The maximum page size is 10000; values above that will be truncated
          accordingly.
        optional: true
      data_source_family:
        type: string
        description: 'Optional. The data source family name to roll up. If empty, data points from all
          available data sources will be rolled up. Format: users/me/dataSourceFamilies/{data_source_family}
          The supported values are: - users/me/dataSourceFamilies/all-sources - Default value. Includes
          data from all available da'
        optional: true
      range:
        type: string
        description: Required. Closed-open range of data points that will be rolled up. The maximum range
          for calories-in-heart-rate-zone, heart-rate, active-minutes and total-calories is 14 days. The
          maximum range for all other data types is 90 days.
        optional: true
      page_token:
        type: string
        description: Optional. The next_page_token from a previous request, if any. All other request
          fields need to be the same as in the initial request when the page token is specified.
        optional: true
    output:
      description: The RollUpDataPointsResponse resource.
      type: object
    scopes_any:
    - googlehealth.activity_and_fitness.readonly
    - googlehealth.activity_and_fitness.writeonly
    - googlehealth.health_metrics_and_measurements.readonly
    - googlehealth.health_metrics_and_measurements.writeonly
    - googlehealth.location.readonly
    - googlehealth.logged_symptoms.writeonly
    - googlehealth.mindfulness.writeonly
    - googlehealth.nutrition.writeonly
    - googlehealth.reproductive_health.writeonly
    - googlehealth.sleep.readonly
    - googlehealth.sleep.writeonly
  get_identity_user:
