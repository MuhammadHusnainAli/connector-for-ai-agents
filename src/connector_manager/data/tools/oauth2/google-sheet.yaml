# Google Sheets API tools.
#
# Ranges use A1 notation -- "Sheet1!A1:D20", "Sheet1!A:A", or a bare sheet name
# for everything on it.
#
# Docs: https://developers.google.com/sheets/api/reference/rest
#
# The tools below the "rest of the API" divider come from Google's own
# discovery document for this API -- the machine readable contract its client
# libraries are generated from -- so their paths, parameters and per-tool OAuth
# scopes are Google's. The hand-authored tools above it are kept because they
# offer a friendlier shape for the common cases.
#
connector_id: google-sheet
display_name: Google Sheets
docs_url: https://developers.google.com/sheets/api/reference/rest

scope_rules:
  strip_prefixes:
    - https://www.googleapis.com/auth/
  implies:
    spreadsheets: [spreadsheets.readonly]
    drive: [drive.file, spreadsheets, spreadsheets.readonly]

scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope

tools:

  get_spreadsheet:
    title: Get a spreadsheet's structure
    description: >-
      Read a spreadsheet's title and the sheets inside it, with each sheet's id,
      name and size. Read this first to learn the tab names ranges refer to.
    category: sheets
    scopes_any: [spreadsheets.readonly, spreadsheets]
    read_only: true
    request:
      method: GET
      path: /v4/spreadsheets/${spreadsheet_id}
      query:
        includeGridData: "${include_grid_data}"
        fields: "${fields}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id, the long token in its URL.
      include_grid_data:
        type: boolean
        description: Also return every cell's data. Heavy on large sheets.
        optional: true
      fields:
        type: string
        description: Fields to return, e.g. "properties.title,sheets.properties".
        optional: true
    output:
      description: The spreadsheet and its sheets.
      type: object
      properties:
        spreadsheetId: {type: string}
        properties: {type: object}
        sheets: {type: array, description: "Each with properties.sheetId and properties.title."}

  read_range:
    title: Read cells from a range
    description: >-
      Read the values in an A1 range, e.g. "Sheet1!A1:D20". Trailing empty rows
      and columns are omitted, so rows can be shorter than expected.
    category: values
    scopes_any: [spreadsheets.readonly, spreadsheets]
    read_only: true
    request:
      method: GET
      path: /v4/spreadsheets/${spreadsheet_id}/values/${range}
      query:
        majorDimension: "${major_dimension}"
        valueRenderOption: "${value_render_option}"
        dateTimeRenderOption: "${date_time_render_option}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      range:
        type: string
        description: A1 range, e.g. "Sheet1!A1:D20", or a bare sheet name for all of it.
        example: Sheet1!A1:D20
      major_dimension:
        type: string
        description: Whether the outer array is rows or columns.
        optional: true
        default: ROWS
        enum: [ROWS, COLUMNS]
      value_render_option:
        type: string
        description: Formatted values, raw values, or the formulas themselves.
        optional: true
        enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
      date_time_render_option:
        type: string
        description: How dates come back when values are unformatted.
        optional: true
        enum: [SERIAL_NUMBER, FORMATTED_STRING]
    output:
      description: The cell values.
      type: object
      properties:
        range: {type: string}
        majorDimension: {type: string}
        values: {type: array, description: "Array of rows, each an array of cell values."}

  read_multiple_ranges:
    title: Read several ranges at once
    description: >-
      Read several A1 ranges in one call, which costs one request against the
      quota instead of several.
    category: values
    scopes_any: [spreadsheets.readonly, spreadsheets]
    read_only: true
    request:
      method: GET
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchGet
      query:
        ranges: "${ranges}"
        majorDimension: "${major_dimension}"
        valueRenderOption: "${value_render_option}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      ranges:
        type: array
        description: A1 ranges to read.
        items: {type: string}
      major_dimension:
        type: string
        description: Whether the outer array is rows or columns.
        optional: true
        default: ROWS
        enum: [ROWS, COLUMNS]
      value_render_option:
        type: string
        description: Formatted values, raw values, or the formulas themselves.
        optional: true
        enum: [FORMATTED_VALUE, UNFORMATTED_VALUE, FORMULA]
    output:
      description: One value range per requested range.
      type: object
      properties:
        valueRanges: {type: array}

  write_range:
    title: Write cells to a range
    description: >-
      Overwrite the cells in an A1 range with the values given. Values are an
      array of rows, e.g. [["Name","Email"],["Ada","ada@example.com"]]. Existing
      cells in the range that the new values do not cover are left alone.
    category: values
    scopes_any: [spreadsheets, drive.file]
    request:
      method: PUT
      path: /v4/spreadsheets/${spreadsheet_id}/values/${range}
      query:
        valueInputOption: "${value_input_option}"
        includeValuesInResponse: "${include_values_in_response}"
      body:
        range: "${range}"
        majorDimension: "${major_dimension}"
        values: "${values}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      range:
        type: string
        description: A1 range to write into.
        example: Sheet1!A1
      values:
        type: array
        description: Rows of cell values, e.g. [["Name","Email"],["Ada","ada@example.com"]].
        items: {type: array}
      value_input_option:
        type: string
        description: >-
          USER_ENTERED parses the input as if typed, so "=SUM(A1:A5)" becomes a
          formula and "1/2/26" becomes a date. RAW stores strings verbatim.
        optional: true
        default: USER_ENTERED
        enum: [RAW, USER_ENTERED]
      major_dimension:
        type: string
        description: Whether the outer array is rows or columns.
        optional: true
        default: ROWS
        enum: [ROWS, COLUMNS]
      include_values_in_response:
        type: boolean
        description: Return the cells as they ended up after parsing.
        optional: true
    output:
      description: What was written.
      type: object
      properties:
        spreadsheetId: {type: string}
        updatedRange: {type: string}
        updatedRows: {type: integer}
        updatedCells: {type: integer}

  append_rows:
    title: Append rows to a sheet
    description: >-
      Add rows after the last row that holds data in a range, rather than
      overwriting. This is the tool for logging or accumulating records.
    category: values
    scopes_any: [spreadsheets, drive.file]
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values/${range}:append
      query:
        valueInputOption: "${value_input_option}"
        insertDataOption: "${insert_data_option}"
      body:
        range: "${range}"
        majorDimension: ROWS
        values: "${values}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      range:
        type: string
        description: Range whose table to append to, usually just the sheet name.
        example: Sheet1
      values:
        type: array
        description: Rows to append, each an array of cell values.
        items: {type: array}
      value_input_option:
        type: string
        description: Whether to parse the input as if typed, or store it verbatim.
        optional: true
        default: USER_ENTERED
        enum: [RAW, USER_ENTERED]
      insert_data_option:
        type: string
        description: Overwrite the rows below, or insert new ones and push the rest down.
        optional: true
        enum: [OVERWRITE, INSERT_ROWS]
    output:
      description: Where the rows landed.
      type: object
      properties:
        spreadsheetId: {type: string}
        updates: {type: object, description: "Holds updatedRange and updatedRows."}

  clear_range:
    title: Clear cells in a range
    description: >-
      Empty the values in a range, keeping formatting, data validation and the
      rows themselves. This cannot be undone through the API.
    category: values
    scopes_any: [spreadsheets, drive.file]
    destructive: true
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values/${range}:clear
      body: {}
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      range:
        type: string
        description: A1 range to clear.
    output:
      description: The range that was cleared.
      type: object
      properties:
        spreadsheetId: {type: string}
        clearedRange: {type: string}

  create_spreadsheet:
    title: Create a spreadsheet
    description: >-
      Create a new spreadsheet, optionally naming its sheets up front. The
      returned spreadsheetId is what every other tool takes.
    category: sheets
    scopes_any: [spreadsheets, drive.file]
    request:
      method: POST
      path: /v4/spreadsheets
      body:
        properties:
          title: "${title}"
          locale: "${locale}"
          timeZone: "${timezone}"
        sheets:
          $map:
            source: "${sheet_names}"
            template:
              properties: {title: "${item}"}
    input:
      title:
        type: string
        description: The spreadsheet's title.
      sheet_names:
        type: array
        description: Names for the sheets to create. Defaults to one called Sheet1.
        optional: true
        items: {type: string}
      locale:
        type: string
        description: Locale, e.g. en_US, which decides number and date parsing.
        optional: true
      timezone:
        type: string
        description: IANA time zone for date functions.
        optional: true
    output:
      description: The created spreadsheet.
      type: object
      properties:
        spreadsheetId: {type: string}
        spreadsheetUrl: {type: string}
        sheets: {type: array}

  add_sheet:
    title: Add a sheet to a spreadsheet
    description: Add a tab to an existing spreadsheet, with an optional size and position.
    category: sheets
    scopes_any: [spreadsheets, drive.file]
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}:batchUpdate
      body:
        requests:
          - addSheet:
              properties:
                title: "${title}"
                index: "${index}"
                gridProperties:
                  rowCount: "${row_count}"
                  columnCount: "${column_count}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      title:
        type: string
        description: Name for the new sheet.
      index:
        type: integer
        description: Zero-based position among the tabs.
        optional: true
        minimum: 0
      row_count:
        type: integer
        description: How many rows to create.
        optional: true
        minimum: 1
      column_count:
        type: integer
        description: How many columns to create.
        optional: true
        minimum: 1
    output:
      description: The batch reply, holding the new sheet's properties.
      type: object
      properties:
        spreadsheetId: {type: string}
        replies: {type: array}

  delete_sheet:
    title: Delete a sheet
    description: >-
      Remove a tab and everything on it. Permanent -- take a copy first if the
      data matters.
    category: sheets
    scopes_any: [spreadsheets, drive.file]
    destructive: true
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}:batchUpdate
      body:
        requests:
          - deleteSheet:
              sheetId: "${sheet_id}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      sheet_id:
        type: integer
        description: Numeric sheet id from get_spreadsheet, not the tab name.
    output:
      description: The batch reply.
      type: object
      properties:
        spreadsheetId: {type: string}
        replies: {type: array}

  batch_update:
    title: Run raw spreadsheet operations
    description: >-
      Send one or more Sheets batchUpdate requests -- formatting, conditional
      rules, sorting, filters, merges, frozen rows. The escape hatch for
      anything the other tools do not cover.
    category: sheets
    scopes_any: [spreadsheets, drive.file]
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}:batchUpdate
      body:
        requests: "${requests}"
        includeSpreadsheetInResponse: "${include_spreadsheet_in_response}"
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet id.
      requests:
        type: array
        description: Sheets API Request objects, applied in order and atomically.
        items: {type: object}
      include_spreadsheet_in_response:
        type: boolean
        description: Return the whole spreadsheet after the update.
        optional: true
    output:
      description: One reply per request.
      type: object
      properties:
        spreadsheetId: {type: string}
        replies: {type: array}

  # -- the rest of the API, from Google's own discovery document ------------

  get_developer_metadata:
    title: Get developer metadata
    description: Returns the developer metadata with the specified ID. The caller must specify the spreadsheet
      ID and the developer metadata's unique metadataId. For more information, see Read, write, and search
      metadata.
    category: spreadsheets
    request:
      method: GET
      path: /v4/spreadsheets/${spreadsheet_id}/developerMetadata/${metadata_id}
    input:
      metadata_id:
        type: integer
        description: The ID of the developer metadata to retrieve.
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to retrieve metadata from.
    output:
      description: The DeveloperMetadata resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
    read_only: true
  search_developer_metadata:
    title: Search developer metadata
    description: Returns all developer metadata matching the specified DataFilter. For more information,
      see Read, write, and search metadata. If the provided DataFilter represents a DeveloperMetadataLookup
      object, this will return all DeveloperMetadata entries selected by it. If the DataFilter represents
      a location in a spreadsheet, this will return all developer metadata associated with locations intersecting
      that region.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/developerMetadata:search
      body:
        dataFilters: ${data_filters}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to retrieve metadata from.
      data_filters:
        type: array
        items:
          type: string
        description: The data filters describing the criteria used to determine which DeveloperMetadata
          entries to return. DeveloperMetadata matching any of the specified filters are included in the
          response.
        optional: true
    output:
      description: The SearchDeveloperMetadataResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  get_by_data_filter_spreadsheet:
    title: Get by data filter spreadsheet
    description: Returns the spreadsheet at the given ID. The caller must specify the spreadsheet ID.
      For more information, see Read, write, and search metadata. This method differs from GetSpreadsheet
      in that it allows selecting which subsets of spreadsheet data to return by specifying a dataFilters
      parameter. Multiple DataFilters can be specified. Specifying one or more data filters returns the
      portions of the spreadsheet that inte
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}:getByDataFilter
      body:
        excludeTablesInBandedRanges: ${exclude_tables_in_banded_ranges}
        includeGridData: ${include_grid_data}
        dataFilters: ${data_filters}
    input:
      spreadsheet_id:
        type: string
        description: The spreadsheet to request.
      exclude_tables_in_banded_ranges:
        type: boolean
        description: True if tables should be excluded in the banded ranges. False if not set.
        optional: true
      include_grid_data:
        type: boolean
        description: True if grid data should be returned. This parameter is ignored if a field mask was
          set in the request.
        optional: true
      data_filters:
        type: array
        items:
          type: string
        description: The DataFilters used to select which ranges to retrieve from the spreadsheet.
        optional: true
    output:
      description: The Spreadsheet resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  copy_to_sheet:
    title: Copy to sheet
    description: Copies a single sheet from a spreadsheet to another spreadsheet. Returns the properties
      of the newly created sheet.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/sheets/${sheet_id}:copyTo
      body:
        destinationSpreadsheetId: ${destination_spreadsheet_id}
    input:
      sheet_id:
        type: integer
        description: The ID of the sheet to copy.
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet containing the sheet to copy.
      destination_spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to copy the sheet to.
        optional: true
    output:
      description: The SheetProperties resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  batch_clear_value:
    title: Batch clear value
    description: Clears one or more ranges of values from a spreadsheet. The caller must specify the spreadsheet
      ID and one or more ranges. Only values are cleared -- all other properties of the cell (such as
      formatting and data validation) are kept.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchClear
      body:
        ranges: ${ranges}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to update.
      ranges:
        type: array
        items:
          type: string
        description: The ranges to clear, in A1 notation or R1C1 notation.
        optional: true
    output:
      description: The BatchClearValuesResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  batch_clear_by_data_filter_value:
    title: Batch clear by data filter value
    description: Clears one or more ranges of values from a spreadsheet. For more information, see Read,
      write, and search metadata. The caller must specify the spreadsheet ID and one or more DataFilters.
      Ranges matching any of the specified data filters will be cleared. Only values are cleared -- all
      other properties of the cell (such as formatting, data validation, etc.) are kept.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchClearByDataFilter
      body:
        dataFilters: ${data_filters}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to update.
      data_filters:
        type: array
        items:
          type: string
        description: The DataFilters used to determine which ranges to clear.
        optional: true
    output:
      description: The BatchClearValuesByDataFilterResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  batch_get_by_data_filter_value:
    title: Batch get by data filter value
    description: Returns one or more ranges of values that match the specified data filters. For more
      information, see Read, write, and search metadata. The caller must specify the spreadsheet ID and
      one or more DataFilters. Ranges that match any of the data filters in the request will be returned.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchGetByDataFilter
      body:
        dataFilters: ${data_filters}
        valueRenderOption: ${value_render_option}
        dateTimeRenderOption: ${date_time_render_option}
        majorDimension: ${major_dimension}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to retrieve data from.
      data_filters:
        type: array
        items:
          type: string
        description: The data filters used to match the ranges of values to retrieve. Ranges that match
          any of the specified data filters are included in the response.
        optional: true
      value_render_option:
        type: string
        description: How values should be represented in the output. The default render option is FORMATTED_VALUE.
        optional: true
        enum:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      date_time_render_option:
        type: string
        description: How dates, times, and durations should be represented in the output. This is ignored
          if value_render_option is FORMATTED_VALUE. The default dateTime render option is SERIAL_NUMBER.
        optional: true
        enum:
        - SERIAL_NUMBER
        - FORMATTED_STRING
      major_dimension:
        type: string
        description: 'The major dimension that results should use. For example, if the spreadsheet data
          is: A1=1,B1=2,A2=3,B2=4, then a request that selects that range and sets majorDimension=ROWS
          returns [[1,2],[3,4]], whereas a request that sets majorDimension=COLUMNS returns [[1,3],[2,4]].'
        optional: true
        enum:
        - DIMENSION_UNSPECIFIED
        - ROWS
        - COLUMNS
    output:
      description: The BatchGetValuesByDataFilterResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  batch_update_value:
    title: Batch update value
    description: Sets values in one or more ranges of a spreadsheet. The caller must specify the spreadsheet
      ID, a valueInputOption, and one or more ValueRanges.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchUpdate
      body:
        responseValueRenderOption: ${response_value_render_option}
        data: ${data}
        valueInputOption: ${value_input_option}
        includeValuesInResponse: ${include_values_in_response}
        responseDateTimeRenderOption: ${response_date_time_render_option}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to update.
      response_value_render_option:
        type: string
        description: Determines how values in the response should be rendered. The default render option
          is FORMATTED_VALUE.
        optional: true
        enum:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      data:
        type: array
        items:
          type: string
        description: The new values to apply to the spreadsheet.
        optional: true
      value_input_option:
        type: string
        description: How the input data should be interpreted.
        optional: true
        enum:
        - INPUT_VALUE_OPTION_UNSPECIFIED
        - RAW
        - USER_ENTERED
      include_values_in_response:
        type: boolean
        description: Determines if the update response should include the values of the cells that were
          updated. By default, responses do not include the updated values. The updatedData field within
          each of the BatchUpdateValuesResponse.responses contains the updated values. If the range to
          write was larger than the ran
        optional: true
      response_date_time_render_option:
        type: string
        description: Determines how dates, times, and durations in the response should be rendered. This
          is ignored if response_value_render_option is FORMATTED_VALUE. The default dateTime render option
          is SERIAL_NUMBER.
        optional: true
        enum:
        - SERIAL_NUMBER
        - FORMATTED_STRING
    output:
      description: The BatchUpdateValuesResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
  batch_update_by_data_filter_value:
    title: Batch update by data filter value
    description: Sets values in one or more ranges of a spreadsheet. For more information, see Read, write,
      and search metadata. The caller must specify the spreadsheet ID, a valueInputOption, and one or
      more DataFilterValueRanges.
    category: spreadsheets
    request:
      method: POST
      path: /v4/spreadsheets/${spreadsheet_id}/values:batchUpdateByDataFilter
      body:
        valueInputOption: ${value_input_option}
        responseDateTimeRenderOption: ${response_date_time_render_option}
        data: ${data}
        responseValueRenderOption: ${response_value_render_option}
        includeValuesInResponse: ${include_values_in_response}
    input:
      spreadsheet_id:
        type: string
        description: The ID of the spreadsheet to update.
      value_input_option:
        type: string
        description: How the input data should be interpreted.
        optional: true
        enum:
        - INPUT_VALUE_OPTION_UNSPECIFIED
        - RAW
        - USER_ENTERED
      response_date_time_render_option:
        type: string
        description: Determines how dates, times, and durations in the response should be rendered. This
          is ignored if response_value_render_option is FORMATTED_VALUE. The default dateTime render option
          is SERIAL_NUMBER.
        optional: true
        enum:
        - SERIAL_NUMBER
        - FORMATTED_STRING
      data:
        type: array
        items:
          type: string
        description: The new values to apply to the spreadsheet. If more than one range is matched by
          the specified DataFilter the specified values are applied to all of those ranges.
        optional: true
      response_value_render_option:
        type: string
        description: Determines how values in the response should be rendered. The default render option
          is FORMATTED_VALUE.
        optional: true
        enum:
        - FORMATTED_VALUE
        - UNFORMATTED_VALUE
        - FORMULA
      include_values_in_response:
        type: boolean
        description: Determines if the update response should include the values of the cells that were
          updated. By default, responses do not include the updated values. The updatedData field within
          each of the BatchUpdateValuesResponse.responses contains the updated values. If the range to
          write was larger than the ran
        optional: true
    output:
      description: The BatchUpdateValuesByDataFilterResponse resource.
      type: object
    scopes_any:
    - drive
    - drive.file
    - spreadsheets
