name: CI

# One workflow for everything: test on every supported Python and the Rust
# crate, check the two libraries agree, build the distributions, scan the code
# (CodeQL and Bandit), and publish to PyPI and crates.io when a GitHub Release
# is published. Publishing only ever runs after every test, the parity check and
# the build have passed in the same run, and only for the version the tag names.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publishing to PyPI and crates.io happens when you publish a GitHub Release.
  release:
    types: [published]
  # Weekly security scan, so new CodeQL queries reach code that has not changed.
  schedule:
    - cron: "42 10 * * 5"
  # Manual runs test and scan; pick an index to also smoke-test publishing.
  workflow_dispatch:
    inputs:
      target:
        description: "Also publish to"
        type: choice
        options: [none, testpypi, pypi, crates, pypi-and-crates]
        default: none

# A newer push to a pull request supersedes the run in progress; anything else
# -- main, a release, a manual publish -- is left to finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs that need more (security-events, id-token) ask for it themselves.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the Python and Rust versions agree
        run: python scripts/sync_version.py --check

      - name: Check the tool index is current
        # Lookups resolve through data/tools/index.json; a pack added without
        # rebuilding it is invisible to the registry.
        run: python scripts/build_index.py --check

      - name: Check the catalogue is grouped by auth mode
        run: python scripts/split_connectors.py --check

      - name: Lint the connector tool packs
        run: python scripts/scaffold_tools.py --check

      - name: Run tests
        run: python -m pytest -q

  rust:
    name: Test (Rust crate)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/connector_manager_rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rustup is preinstalled on GitHub's runners, so no third-party action is needed.
      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests, the whole-catalogue integration tests, and every example in RUST.md.
      - name: Run tests
        run: cargo test

      # Build the crate exactly as crates.io would receive it: the shared data
      # copied in, packaged, then compiled from the package alone. Catches a
      # crate that only builds inside the repository, or one over the 10 MiB limit.
      - name: Package the crate
        run: |
          python3 ../../scripts/stage_crate.py
          cargo package --allow-dirty
          size=$(stat -c %s target/package/*.crate)
          echo "packaged crate: $size bytes"
          test "$size" -lt 10485760 || { echo "::error::crate is over the crates.io 10 MiB limit"; exit 1; }

  parity:
    name: Rust and Python agree
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python package and the Rust toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          rustup toolchain install stable --profile minimal && rustup default stable

      # Builds every connector's schema, a request through every connector and
      # every hand-authored tool in both libraries, and fails on any difference.
      - name: Compare the two libraries
        run: python scripts/check_rust_parity.py

  build:
    name: Build distributions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags are needed to prove a manual pypi run is publishing a tagged commit.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          # verify_wheel.py fails the build if the catalogue or its index did
          # not make it into the wheel, rather than let that reach PyPI.
          python scripts/build_index.py --check
          python -m build
          python -m twine check --strict dist/*
          python scripts/verify_wheel.py

      # Anything reaching real PyPI must be traceable to a tag: a version can
      # never be re-uploaded once taken, so an untagged publish is permanent and
      # unattributable. This used to run on release events only, which is how
      # 0.1.3 shipped from a manual run with no tag at all -- the tag was added
      # afterwards by hand. Manual pypi runs are held to the same rule.
      - name: Check the published version is tagged
        if: github.event_name == 'release' || inputs.target == 'pypi' || inputs.target == 'pypi-and-crates'
        run: |
          project_version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          if [ "${{ github.event_name }}" = "release" ]; then
            # The tag is the ref being built, so compare the two directly.
            tag_version="${GITHUB_REF_NAME#v}"
            echo "pyproject: $project_version / tag: $tag_version"
            if [ "$project_version" != "$tag_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version"
              exit 1
            fi
          else
            # A manual run builds a branch, so require the matching tag to exist
            # and to name this exact commit.
            tag="v$project_version"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::No $tag tag. Tag the release commit before publishing $project_version to PyPI."
              exit 1
            fi
            tagged_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag points at $tagged_sha, but this run builds $GITHUB_SHA."
              exit 1
            fi
            echo "pyproject: $project_version / $tag matches $GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  codeql:
    name: CodeQL (${{ matrix.language }})
    # A release re-runs the tagged commit main already scanned.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # read workflow run status on a private repository
    strategy:
      fail-fast: false
      matrix:
        # Python is interpreted and the workflows are YAML: neither needs a build.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # The category default setup used, so existing alerts carry over
          # instead of being closed and reopened as new ones.
          category: /language:${{ matrix.language }}

  bandit:
    name: Bandit
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # read workflow run status on a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The test suite is excluded: pytest's whole assertion model is the bare
      # `assert`, so B101 fires on every one of the 450-odd of them and buries
      # the findings that matter under notes that describe pytest working as
      # designed. Nothing under tests/ ships in the wheel.
      #
      # B105 (hardcoded password string) matches on dictionary keys, and this
      # package's whole subject is credential schemas: every `{"secret": True}`
      # field descriptor and every `{"client_secret": "required"}` validation
      # detail trips it. All of them are field metadata, none of them a password.
      #
      # Findings are reported to code scanning rather than failing the run.
      - name: Scan with Bandit
        run: |
          python -m pip install --upgrade pip "bandit[sarif]"
          bandit -r . -x ./tests,./.venv -s B105 -f sarif -o bandit.sarif --exit-zero

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit.sarif
          category: bandit

  testpypi:
    name: Publish to TestPyPI
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/connector-for-ai-agents
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    # Gated on the Rust tests and the parity check as well, so PyPI and
    # crates.io either both get this version or neither does.
    needs: [test, rust, parity, build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'pypi' || inputs.target == 'pypi-and-crates'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/connector-for-ai-agents
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Backfilled releases (e.g. tagging 0.1.0 after the fact) would otherwise
          # fail: PyPI never allows re-uploading a version that already exists.
          skip-existing: true

  crates:
    name: Publish to crates.io
    # The same gate as PyPI, plus the Rust tests and the parity check: the crate
    # only ships when both libraries pass and agree.
    needs: [test, rust, parity, build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'crates' || inputs.target == 'pypi-and-crates'))
    runs-on: ubuntu-latest
    environment:
      name: rust
      url: https://crates.io/crates/connector-for-ai-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Same rule as PyPI: what ships must be the version a tag names, and the
      # crate and the Python package must carry that same version.
      - name: Check the version matches the tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 scripts/sync_version.py | awk 'NR==1{print $1}')"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::No $tag tag."; exit 1; }
            [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::$tag does not point at this commit."; exit 1; }
          fi
          python3 scripts/sync_version.py --check --tag "$tag"

      - name: Stage the shared data into the crate
        run: python3 scripts/stage_crate.py

      # crates.io never accepts a version twice, so a re-run of an already
      # published release is skipped rather than failed.
      - name: Publish
        working-directory: src/connector_manager_rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(python3 ../../scripts/sync_version.py | awk 'NR==1{print $1}')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "connector-for-ai-agents-ci" \
            "https://crates.io/api/v1/crates/connector-for-ai-agents/$version")
          if [ "$status" = "200" ]; then
            echo "connector-for-ai-agents $version is already on crates.io; nothing to publish."
            exit 0
          fi
          cargo publish --allow-dirty
