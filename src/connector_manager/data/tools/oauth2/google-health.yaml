        timeZone: ${time_zone}
        strideLengthWalkingType: ${stride_length_walking_type}
        languageLocale: ${language_locale}
        weightUnit: ${weight_unit}
        name: ${body_name}
        swimUnit: ${swim_unit}
        temperatureUnit: ${temperature_unit}
        waterUnit: ${water_unit}
        distanceUnit: ${distance_unit}
        autoStrideEnabled: ${auto_stride_enabled}
        glucoseUnit: ${glucose_unit}
        heightUnit: ${height_unit}
    input:
      name:
        type: string
        description: 'Identifier. The resource name of this Settings resource. Format: users/{user}/settings
          Example: users/1234567890/settings or users/me/settings The {user} ID is a system-generated
          Google Health API user ID, a string of 1-63 characters consisting of lowercase and uppercase
          letters, numbers, and hyphen'
      update_mask:
        type: string
        description: Optional. The list of fields to be updated.
        optional: true
      utc_offset:
        type: string
        description: Optional. The user's timezone offset relative to UTC. Updates to this field are currently
          not supported.
        optional: true
      stride_length_running_type:
        type: string
