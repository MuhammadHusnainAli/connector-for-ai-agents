# Connector definitions: BASIC auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
addepar-basic:
  auth_mode: BASIC
  categories:
  - analytics
  connection_config:
    firmId:
      description: Your Addepar Firm ID
      order: 2
      pattern: ^[0-9]+$
      title: Firm ID
      type: string
    subdomain:
      description: Your Addepar Firm domain
      example: myfirm
      order: 1
      pattern: ^[a-z0-9_-]+$
      title: Firm Domain
      type: string
  credentials:
    password:
      description: Your Addepar API Secret
      example: zidcISqfSGh05JsWwuY9ZdSCkXrhANHvCX0U0gkE
      pattern: ^[A-Za-z0-9]{40}$
      title: API Secret
      type: string
    username:
      description: Your Addepar API Key
      example: 5ab87915-2deb-429c-a1e2-8b0495900f45
      format: uuid
      title: API Key
      type: string
  display_name: Addepar (Basic Auth)
  proxy:
    base_url: https://${connectionConfig.subdomain}.addepar.com/api
    headers:
      addepar-firm: ${connectionConfig.firmId}
    retry:
      after:
      - x-ratelimit-retry-after
affinity:
  auth_mode: BASIC
  categories:
  - crm
  credentials:
    password:
      description: Your Affinity API Key
      example: nrlW2KR5m-qUCA-rTqKb_EUK1swERlenqn70KNMMrTM
      pattern: ^[A-Za-z0-9_-]+$
      title: API Key
      type: string
    username:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
  display_name: Affinity (v1)
  proxy:
    base_url: https://api.affinity.co
    retry:
      at:
      - x-ratelimit-limit-user
      - x-ratelimit-limit-org-reset
    verification:
      endpoints:
      - /auth/whoami
      method: GET
  webhook_routing_script: affinityWebhookRouting
aircall-basic:
  alias: aircall
  auth_mode: BASIC
  categories:
  - support
  credentials:
    password:
      description: The Admin API Key (API Token) for your Aircall account
      pattern: ^[a-zA-Z0-9_-]+$
      secret: true
      title: API Token
      type: string
    username:
      description: The Application ID (API ID) for your Aircall account
      pattern: ^[a-zA-Z0-9_-]+$
      title: API ID
      type: string
  display_name: Aircall (Basic Auth)
  proxy:
    base_url: https://api.aircall.io
    paginate:
      link_path_in_response_body: meta.next_page_link
      response_path: results
      type: link
    retry:
      at:
      - x-aircallapi-reset
    verification:
      endpoints:
      - /v1/ping
      headers:
        content-type: application/json
      method: GET
amplitude:
  auth_mode: BASIC
  categories:
  - analytics
  connection_config:
    hostname:
      description: The hostname associated with your server residency.
      enum:
      - amplitude.com
      - analytics.eu.amplitude.com
      optional: true
      title: Hostname
      type: string
  credentials:
    password:
      description: Your Amplitude secret key
      example: 6GhPfVz47PKJGSLcDDc9jL5E4Mn
      title: Secret Key
      type: string
    username:
      description: Your Amplitude API Key
      example: 64371a39e74ad915af75674c0696e356
      pattern: ^[a-f0-9]{32}$
      title: API Key
      type: string
  display_name: Amplitude (Event Streaming API)
  proxy:
    base_url: https://${connectionConfig.hostname} || https://amplitude.com
    verification:
      endpoints:
      - /api/2/events/list
      headers:
        content-type: application/json
      method: GET
anvil:
  auth_mode: BASIC
  categories:
  - legal
  - productivity
  credentials:
    password:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
    username:
      description: Your Anvil API key
      example: rj8T3fa*************************
      pattern: ^[A-Za-z0-9]+$
      title: API Key
      type: string
  display_name: Anvil
  proxy:
    base_url: https://app.useanvil.com
    retry:
      after:
      - retry-after
ashby:
  auth_mode: BASIC
  categories:
  - ats
  - popular
  credentials:
    password:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
    username:
      description: The API Key of your Ashby account
      title: API Key
      type: string
  display_name: Ashby
  proxy:
    base_url: https://api.ashbyhq.com
    verification:
      endpoints:
      - apiKey.info
      headers:
        content-type: application/json
      method: POST
atlassian-service-account-api-token:
  auth_mode: BASIC
  categories:
  - dev-tools
  connection_config:
    cloudId:
      description: Your Atlassian Cloud ID
      example: 12345678-1234-1234-1234-123456789012
      format: uuid
      order: 1
      title: Cloud ID
      type: string
  credentials:
    password:
      description: Your Atlassian service account API token
      example: ATSTT3xFfGF07SUw*******************************RvxLUHWs8ZV58TfHI=610694C8
      pattern: ^[A-Za-z0-9_-]{40,}=[A-Fa-f0-9]{8}$
      secret: true
      title: API Token
      type: string
    username:
      description: The email address of your Atlassian service account
      example: bot@serviceaccount.atlassian.com
      format: email
      title: Service Account Email
      type: string
  display_name: Atlassian Service Account (API Token)
  post_connection_script: atlassianServicAccountPostConnection
  proxy:
    base_url: https://api.atlassian.com
    connection_config:
      cloudId: ${connectionConfig.cloudId}
    retry:
      at:
      - x-ratelimit-reset
auvik:
  auth_mode: BASIC
  categories:
  - support
  connection_config:
    region:
      description: The region of your Auvik account (visible in your browser address bar when logging into the Auvik web UI).
      enum:
      - us1
      - us2
      - us6
      - eu1
      title: Region
      type: string
  credentials:
    password:
      description: Auvik API Key (separate from the user's password)
      example: aJ7EjSEDD+7+JqlQ1NtUXyY/3/05GGWwfF7vBbPd0Iy8HG1s
      pattern: ^(?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{4}|[A-Za-z0-9+\/]{3}=|[A-Za-z0-9+\/]{2}={2})$
      secret: true
      title: API Key
      type: string
    username:
      description: Auvik User Name (usually an individual user's email address)
      title: User Name / Account Email
      type: string
  display_name: Auvik
  proxy:
    base_url: https://auvikapi.${connectionConfig.region}.my.auvik.com
    verification:
      endpoints:
      - /v1/authentication/verify
      method: GET
avalara:
  auth_mode: BASIC
  categories:
  - legal
  connection_config:
    avalaraClient:
      description: The Avalara client for your Avalara account
      title: Avalara Client
      type: string
  credentials:
    password:
      description: Your Password / License Key
      title: Avalara Password / License Key
      type: string
    username:
      description: Avalara User Name / Account ID
      title: User Name / Account ID
      type: string
  display_name: Avalara
  proxy:
    base_url: https://rest.avatax.com/api/v2
    headers:
      content-type: application/json
      x-avalara-client: ${connectionConfig.avalaraClient}
    verification:
      endpoints:
      - /utilities/subscriptions
      headers:
        content-type: application/json
      method: GET
avalara-sandbox:
  auth_mode: BASIC
  categories:
  - legal
  connection_config:
    avalaraClient:
      description: The Avalara client for your Avalara account
      title: Avalara Client
      type: string
  credentials:
    password:
      description: Avalara Password / License Key
      title: Password / License Key
      type: string
    username:
      description: Avalara User Name / Account ID
      title: User Name / Account ID
      type: string
  display_name: Avalara (Sandbox)
  proxy:
    base_url: https://sandbox-rest.avatax.com/api/v2
    headers:
      content-type: application/json
      x-avalara-client: ${connectionConfig.avalaraClient}
    verification:
      endpoints:
      - /utilities/subscriptions
      headers:
        content-type: application/json
      method: GET
aws-iam:
  auth_mode: BASIC
  categories:
  - dev-tools
  - iam
  connection_config:
    region:
      description: The region to where your AWS account is hosted
      example: us-east-1
      pattern: ^[a-z0-9-]+$
      title: Region
      type: string
  credentials:
    password:
      description: Your Secret Access Key
      title: AWS Secret Access Key
      type: string
    username:
      description: Your Access Key ID
      title: AWS Access Key ID
      type: string
  credentials_verification_script: awsIamCredentialsVerification
  display_name: AWS IAM
  proxy:
    base_url: https://iam.amazonaws.com
    connection_config:
      region: ${connectionConfig.region}
    headers:
      authorization: ${awsSigV4(${credentials.username}, ${credentials.password}, us-east-1, iam)}
      x-amz-date: ${now:YYYYMMDDTHHmmss[Z]}
    retry:
      at:
      - x-ratelimit-reset
aws-inspector2:
  auth_mode: BASIC
  categories:
  - dev-tools
  connection_config:
    region:
      description: The AWS region where Inspector2 is enabled.
      example: us-east-1
      pattern: ^[a-z0-9-]+$
      prefix: https://inspector2.
      suffix: .amazonaws.com
      title: Region
      type: string
  credentials:
    password:
      description: Your Secret Access Key.
      title: AWS Secret Access Key
      type: string
    username:
      description: Your Access Key ID.
      title: AWS Access Key ID
      type: string
  credentials_verification_script: awsIamCredentialsVerification
  display_name: AWS Inspector2
  proxy:
    base_url: https://inspector2.${connectionConfig.region}.amazonaws.com
    headers:
      authorization: ${awsSigV4(${credentials.username}, ${credentials.password}, ${connectionConfig.region}, inspector2, inspector2.${connectionConfig.region}.amazonaws.com)}
      x-amz-date: ${now:YYYYMMDDTHHmmss[Z]}
    retry:
      at:
      - x-ratelimit-reset
aws-multi-service:
  auth_mode: BASIC
  categories:
  - dev-tools
  connection_config:
    region:
      description: The AWS region where the service is available.
      example: us-east-1
      order: 1
      pattern: ^[a-z0-9-]+$
      title: Region
      type: string
    service:
      description: The AWS service you want to connect to.
      example: athena
      order: 2
      pattern: ^[a-z0-9-]+$
      title: AWS Service
      type: string
  credentials:
    password:
      description: Your Secret Access Key.
      example: wJalr***EKEY
      pattern: ^[A-Za-z0-9+/]+$
      title: AWS Secret Access Key
      type: string
    username:
      description: Your Access Key ID.
      example: AKIAI***MPLE
      pattern: ^[A-Za-z0-9]+$
      title: AWS Access Key ID
      type: string
  display_name: AWS Multi-Service
  proxy:
    base_url: https://${connectionConfig.service}.${connectionConfig.region}.amazonaws.com
    headers:
      authorization: ${awsSigV4(${credentials.username}, ${credentials.password}, ${connectionConfig.region}, ${connectionConfig.service}, ${connectionConfig.service}.${connectionConfig.region}.amazonaws.com)}
      x-amz-date: ${now:YYYYMMDDTHHmmss[Z]}
    retry:
      at:
      - x-ratelimit-reset
azure-devops:
  auth_mode: BASIC
  categories:
  - dev-tools
  connection_config:
    organizationUrl:
      description: The URL of your Azure DevOps organization
      example: dev.azure.com/myorg or myorg.visualstudio.com
      prefix: https://
      title: Organization URL
      type: string
  credentials:
    password:
      description: The Personal Access Token of your Azure DevOps account
      title: Personal Access Token
      type: string
    username:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
  credentials_verification_script: azureDevopsCredentialsVerification
  display_name: Azure DevOps
  proxy:
    base_url: https://${connectionConfig.organizationUrl}
bamboohr-basic:
  auth_mode: BASIC
  categories:
  - hr
  connection_config:
    subdomain:
      description: The subdomain of your BambooHR account
      example: domain
      order: 1
      pattern: ^[a-z0-9_-]+$
      prefix: https://
      suffix: .bamboohr.com
      title: BambooHR Domain
      type: string
  credentials:
    password:
      default_value: x
      description: Password
      hidden: true
      title: Password
      type: string
    username:
      description: The API Key of your BambooHR account
      example: 59d783083fb25565aba21744e6bba90de8634de0
      pattern: ^[a-f0-9]{40}$
      secret: true
      title: API key
      type: string
  display_name: BambooHR (Basic Auth)
  proxy:
    base_url: https://api.bamboohr.com/api/gateway.php/${connectionConfig.subdomain}
    verification:
      endpoints:
      - /v1/meta/fields
      headers:
        content-type: application/json
      method: GET
beebole:
  auth_mode: BASIC
  categories:
  - hr
  - productivity
  display_name: Beebole
  proxy:
    base_url: https://beebole-apps.com
bitdefender:
  auth_mode: BASIC
  categories:
  - other
  connection_config:
    ACCESS_URL:
      description: The access URL of your Bitdefender account
      example: https://api.bitdefender.com
      format: uri
      pattern: ^https://.*
      title: Access URL
      type: string
  credentials:
    password:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
    username:
      description: The API Key of your Bitdefender account
      title: API Key
      type: string
  credentials_verification_script: bitdefenderCredentialsVerification
  display_name: Bitdefender
  proxy:
    base_url: ${connectionConfig.ACCESS_URL}
    retry:
      after:
      - retry-after
blackbaud-basic:
  auth_mode: BASIC
  categories:
  - crm
  connection_config:
    hostName:
      description: Your Blackbaud host name
      example: https://altrurig01bo3.blackbaudhosting.com
      order: 1
      pattern: ^https?:\/\/[a-z0-9.-]+(:\d+)?(\/.*)?$
      title: Host Name
      type: string
  credentials:
    password:
      description: Your Password
      title: Password
      type: string
    username:
      description: Your Username
      title: Username
      type: string
  display_name: Blackbaud (Basic Auth)
  proxy:
    base_url: https://${connectionConfig.hostName}
    headers:
      content-type: application/soap+xml; charset=utf-8
booking-com:
  auth_mode: BASIC
  categories:
  - e-commerce
  connection_config:
    environmentType:
      description: The environment type for your various requests.
      enum:
      - secure-supply
      - supply
      title: Environment Type
      type: string
  credentials:
    password:
      description: The password for your Booking.com machine account
      title: Machine Account Password
      type: string
    username:
      description: The username for your Booking.com machine account
      title: Machine Account Username
      type: string
  display_name: Booking.com
  proxy:
    base_url: https://${connectionConfig.environmentType}-xml.booking.com
chargebee:
  auth_mode: BASIC
  categories:
  - payment
  connection_config:
    subdomain:
      description: The subdomain of your Chargebee account
      example: domain
      pattern: ^[a-z0-9_-]+$
      prefix: https://
      suffix: .chargebee.com
      title: Chargebee Domain
      type: string
  credentials:
    password:
      default_value: ''
      description: Password
      hidden: true
      title: Password
      type: string
    username:
      description: The API key for your Chargebee account
      pattern: ^[a-zA-Z0-9_-]+$
      secret: true
      title: API Key
      type: string
  display_name: Chargebee
  proxy:
    base_url: https://${connectionConfig.subdomain}.chargebee.com
    retry:
      after:
      - retry-after
    verification:
      endpoints:
      - /api/v2/business_entities
      headers:
        content-type: application/json
      method: GET
cisco-duo-admin:
  auth_mode: BASIC
  categories:
  - iam
  connection_config:
    hostname:
      description: Your Duo API hostname.
      example: api-xxxxxxxx.duosecurity.com
      order: 1
      pattern: api-[a-z0-9]+\.duosecurity\.com
      title: API Hostname
      type: string
  credentials:
    password:
      description: Your Duo application's secret key.
      example: Zh5eGm**************************zLJ4Ep
      pattern: '[A-Za-z0-9]{40}'
      title: Secret Key
      type: string
    username:
      description: Your Duo application's integration key.
      example: DIWJ8X6**********TQ1
      pattern: DI[A-Z0-9]{18}
      title: Integration Key
      type: string
  display_name: Cisco Duo Admin API
  proxy:
    base_url: https://${connectionConfig.hostname}
    headers:
      authorization: 'Basic ${base64(${credentials.username}:${hmacSha1Hex(${now:ddd, DD MMM YYYY HH:mm:ss ZZ}

        ${method}

        ${host}

        ${path}

        ${params}, ${credentials.password})})}'
      date: ${now:ddd, DD MMM YYYY HH:mm:ss ZZ}
    retry:
      after:
      - retry-after
clickhouse:
  auth_mode: BASIC
  categories:
  - dev-tools
  credentials:
    password:
      description: Your ClickHouse Cloud API Key Secret.
      example: 4b1d2i7O**********************************
      pattern: ^[a-zA-Z0-9]+$
      secret: true
      title: Key Secret
      type: string
    username:
      description: Your ClickHouse Cloud API Key ID.
      example: Mlx1****************
      pattern: ^[a-zA-Z0-9]+$
      title: Key ID
      type: string
  display_name: ClickHouse
  proxy:
    base_url: https://api.clickhouse.cloud
    verification:
      endpoints:
      - /v1/organizations
      headers:
        content-type: application/json
      method: GET
clicksend:
  auth_mode: BASIC
  categories:
  - communication
  credentials:
    password:
      description: Your ClickSend API Key
      secret: true
      title: API Key
      type: string
    username:
      description: Your ClickSend account username
      title: Username
      type: string
  display_name: ClickSend
  proxy:
    base_url: https://rest.clicksend.com
    verification:
      endpoints:
      - /v3/account
      headers:
        content-type: application/json
      method: GET
cloudtalk:
  auth_mode: BASIC
  categories:
  - communication
  credentials:
    password:
      description: Your CloudTalk API Access Key.
      example: bQI*******************************eZ
      pattern: ^[A-Za-z0-9.%@?_-]+$
      secret: true
      title: Key
      type: string
    username:
      description: Your CloudTalk API Access ID.
      example: E1ZH****************RRM
      pattern: ^[A-Za-z0-9.%@?_-]+$
      title: ID
      type: string
  display_name: CloudTalk
  proxy:
    base_url: https://my.cloudtalk.io/api
    retry:
      at:
      - x-cloudtalkapi-resettime
    verification:
      endpoints:
      - /contacts/index.json?limit=1
      headers:
        content-type: application/json
      method: GET
confluence-basic:
  auth_mode: BASIC
  categories:
  - knowledge-base
  connection_config:
    subdomain:
      description: The subdomain of your Confluence account
      example: subdomain
      order: 1
      pattern: ^[a-z0-9_-]+$
      prefix: https://
      suffix: .atlassian.net
      title: Confluence Subdomain
      type: string
  credentials:
    password:
      description: The API token for your Confluence account
      secret: true
      title: API token
      type: string
    username:
      description: The email address for your Confluence account
      format: email
      title: Email Address
      type: string
  display_name: Confluence (Basic Auth)
  proxy:
    base_url: https://${connectionConfig.subdomain}.atlassian.net
    headers:
      content-type: application/json
    verification:
      endpoints:
      - /wiki/api/v2/spaces
      headers:
        content-type: application/json
      method: GET
connectsecure:
  auth_mode: BASIC
  categories:
  - other
  connection_config:
    base_url:
      description: The hostname of your ConnectSecure pod
      example: pod123.myconnectsecure.com
      order: 1
      pattern: ^[A-Za-z0-9-]+\.myconnectsecure\.com$
      title: Pod Host
      type: string
    tenant:
      description: Your ConnectSecure tenant identifier
      example: example-tenant
      order: 2
      pattern: ^[A-Za-z0-9_-]+$
      title: Tenant
      type: string
  credentials:
    password:
      description: Your ConnectSecure API client secret
      secret: true
      title: Client Secret
      type: string
    username:
      description: Your ConnectSecure API client ID
      title: Client ID
      type: string
  display_name: ConnectSecure
  proxy:
    base_url: https://${connectionConfig.base_url}
    headers:
      accept: application/json
      client-auth-token: ${base64(${connectionConfig.tenant}+${credentials.username}:${credentials.password})}
    verification:
      endpoints:
      - /w/authorize
      method: POST
connectwise-psa:
  auth_mode: BASIC
  categories:
  - support
  - ticketing
  connection_config:
    apiVersion:
      description: The API version to connect to ConnectWise PSA
      title: Api version
      type: string
    clientId:
      description: The Client ID assigned to your integration
      title: Client ID
      type: string
    hostname:
      description: The full ConnectWise PSA hostname.
      example: api-na.myconnectwise.net
      format: hostname
      prefix: https://
      suffix: /v4_6_release/apis/3.0
      title: Hostname
      type: string
    subdomain:
      default_value: ''
      description: ''
      hidden: true
      title: ''
      type: string
  credentials:
    password:
      description: Your ConnectWise PSA private key, integrator password, or member hash
      title: Password
      type: string
    username:
      description: The ConnectWise PSA CompanyId followed by either the Public Key, Integrator Username, or MemberId
      title: Username
      type: string
  display_name: ConnectWise PSA
  proxy:
    base_url: https://${connectionConfig.hostname}/v4_6_release/apis/3.0 || https://${connectionConfig.subdomain}.myconnectwise.net/v4_6_release/apis/3.0
    headers:
      accept: application/vnd.connectwise.com+json; version=${connectionConfig.apiVersion}
      clientid: ${connectionConfig.clientId}
  webhook_routing_script: connectwisePsaWebhookRouting
connectwise-psa-staging:
  auth_mode: BASIC
  categories:
  - support
  - ticketing
  connection_config:
    apiVersion:
      description: The API version to connect to ConnectWise PSA
      title: Api version
      type: string
    clientId:
      description: The Client ID assigned to your integration
      title: Client ID
      type: string
  display_name: ConnectWise PSA (Staging)
  proxy:
    base_url: https://api-staging.connectwisedev.com/v4_6_release/apis/3.0
    headers:
      accept: application/vnd.connectwise.com+json; version=${connectionConfig.apiVersion}
      clientid: ${connectionConfig.clientId}
  webhook_routing_script: connectwisePsaWebhookRouting
crisp:
  auth_mode: BASIC
  categories:
  - communication
  - support
  credentials:
    password:
      description: The key part of your Crisp token keypair
      example: a3f5c8d2b9e4713f2c0a7b4d5e6f8c9b1a2d3e4f5b6c7d8e9f0a1b2c3d4e5f6a7
      pattern: ^[a-f0-9]{64}$
      title: Token Key
      type: string
