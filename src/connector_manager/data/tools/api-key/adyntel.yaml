# Adyntel tools.
#
# Adyntel is an ad-intelligence API: give it a company and it returns the ads
# that company is running on Facebook/Meta, Google, LinkedIn and TikTok, plus
# the tracking pixels, paid keywords and traffic estimates for its domain.
#
# Two things shape every call here:
#
#   * **credentials travel in the body, not a header.** Adyntel authenticates
#     from `email` and `api_key` fields inside the JSON payload, and this
#     connector declares them as `proxy.body`, so the request builder adds them
#     to every call. No tool below asks for them -- except the two `GET`
#     tracking reads, where Adyntel wants them in the query string instead and
#     there is nowhere else to put them;
#   * **most scrapes are jobs, not answers.** A scrape can take from seconds to
#     minutes. Pass `webhook_url` and Adyntel posts the result there when it
#     finishes; pass nothing and you get whatever it has, with a
#     `continuation_token` to send back for the next slice. `job_id` resumes a
#     job you already started.
#
# Which company to ask about is usually `company_domain` -- Adyntel resolves the
# domain to the advertiser's pages itself. Where a platform id is known, giving
# it directly (`facebook_url`, `linkedin_page_id`) skips that resolution step
# and is both faster and more precise.
#
# The account's balance is consumed per scrape, so `check_credits` before a bulk
# run is worth the call, and `get_usage_history` shows where the last of it
# went.
#
# Three notes on coverage:
#
#   * the `advanced` variants of the LinkedIn and Google endpoints are the same
#     calls against a different upstream data provider (`apify` rather than
#     `rapidapi`), which is why they take the same arguments;
#   * the **user-administration** tools (`create_user` and friends) authenticate
#     with a `master_key`, not the account's own API key. They exist for
#     resellers running Adyntel under their own product; an ordinary account has
#     no master key and will get a 401 from them;
#   * Adyntel's own spec carries internal queue-routing and test switches
#     (`celeryq`, `railwayq`, `skip_aws`, `batching_jobs`, `internal_scrape`,
#     `test`, `performance_testing`). They are not part of the product's
#     contract, so no tool exposes them. `/import_domains_to_redis` and
#     `/cron-run` are internal for the same reason.
#
# The API key is not scoped -- Adyntel gates on the key existing and on the
# account's credit balance, not on per-call permissions -- so no tool here
# declares scopes.
#
# Spec: https://api.adyntel.com/openapi.json

connector_id: adyntel
display_name: Adyntel
docs_url: https://api.adyntel.com/openapi.json

tools:

  # -- account ---------------------------------------------------------------

  check_credentials:
    title: Check the credentials
    description: >-
      Validate the account's email and API key against Adyntel: 200 when they
      are good, 401 when they are not. The cheapest possible call, and the right
      one to make before a batch of scrapes rather than discovering a bad key
      halfway through.
    category: account
    read_only: true
    request:
      method: POST
      path: /auth
      headers:
        Content-Type: application/json
      body: {}
    input: {}
    output:
      description: Confirmation that the credentials are valid.
      type: object

  check_credits:
    title: Check the credit balance
    description: >-
      How much scraping credit the account has left. Every scrape consumes
      credit, so read this before a bulk run -- Adyntel answers a request it
      cannot pay for with an error rather than a partial result. Authenticates
      against the database directly, so it works even when the scraping tier is
      busy.
    category: account
    read_only: true
    request:
      method: POST
      path: /credits_check
      headers:
        Content-Type: application/json
      body: {}
    input: {}
    output:
      description: The account's current credit balance.
      type: object

  get_usage_history:
    title: Get the account's usage history
    description: >-
      What this account has scraped, in order -- which endpoints it called, for
      which companies, and what each cost. Pair it with `check_credits` when the
      balance has dropped faster than expected.
    category: account
    read_only: true
    request:
      method: POST
      path: /user_history
      headers:
        Content-Type: application/json
      body: {}
    input: {}
    output:
      description: The account's past requests and what they consumed.
      type: object

  get_health:
    title: Check the API's health
    description: >-
      Whether the Adyntel service itself is up. Unauthenticated in effect, so a
      failure here means Adyntel rather than the credentials -- which is exactly
      what you want to know before blaming a key.
    category: system
    read_only: true
    request:
      method: GET
      path: /healthcheck
    input: {}
    output:
      description: The service's health status.
      type: object

  get_queue_metrics:
    title: Get scrape queue metrics
    description: >-
      Adyntel's own producer metrics for the queue that runs scrapes. Useful
      when jobs are taking longer than usual and you want to tell a slow queue
      from a stuck one.
    category: system
    read_only: true
    request:
      method: GET
      path: /celery-producer-metrics
    input: {}
    output:
      description: Queue throughput and backlog metrics.
      type: object

  # -- facebook / meta ads ---------------------------------------------------

  get_facebook_ads:
    title: Get a company's Facebook ads
    description: >-
      The ads a company is running in Meta's Ad Library -- creative, copy, run
      dates and placements -- found either from its `company_domain` or straight
      from its `facebook_url` when you already know the page. Give a
      `webhook_url` for anything larger than a spot check: the scrape is
      asynchronous and a big advertiser takes minutes. Without one, page through
      the results with `continuation_token`. Use `get_facebook_ads_with_retry`
      instead when a first attempt came back short.
    category: ads.facebook
    request:
      method: POST
      path: /facebook
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        facebook_url: "${facebook_url}"
        country_code: "${country_code}"
        media_type: "${media_type}"
        active_status: "${active_status}"
        language: "${language}"
        all_ads: "${all_ads}"
        check_ugc: "${check_ugc}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
    input:
      company_domain:
        type: string
        description: >-
          The advertiser's website, which Adyntel resolves to their Meta pages.
          Give this or `facebook_url`.
        optional: true
        example: nike.com
      facebook_url:
        type: string
        description: >-
          The advertiser's Facebook page url, when you already know it. Skips
          the domain-to-page resolution and is the more precise of the two.
        optional: true
        example: https://www.facebook.com/nike
      country_code:
        type: string
        description: >-
          Restrict to ads served in one country, or a list of countries, as
          ISO 3166 codes.
        optional: true
        example: US
      media_type:
        type: string
        description: Restrict to one creative format, such as image or video.
        optional: true
      active_status:
        type: string
        description: Restrict to ads that are currently running, or to inactive ones.
        optional: true
      language:
        type: string
        description: Restrict to ads served in this language.
        optional: true
      all_ads:
        type: boolean
        description: >-
          Fetch the advertiser's whole library rather than the most recent
          slice. Much slower, and much more expensive in credit.
        optional: true
      check_ugc:
        type: boolean
        description: Also detect user-generated-content creative among the ads.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: >-
          Where Adyntel should post the finished result. Strongly preferred for
          large advertisers, since the scrape outlives a single request.
        optional: true
    output:
      description: The advertiser's Meta ads, or the job that will deliver them.
      type: object
      properties:
        ads: {type: array, description: "The ads found, with creative and run dates."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}
        job_id: {type: string, description: "The job's id when the scrape runs asynchronously."}

  get_facebook_ads_with_reuse:
    title: Get a company's Facebook ads, reusing a cached scrape
    description: >-
      The same Meta Ad Library scrape as `get_facebook_ads`, but served from a
      recent scrape of the same advertiser when Adyntel has one. Cheaper and far
      faster; reach for it when a slightly stale answer is acceptable, and for
      `get_facebook_ads` when it is not.
    category: ads.facebook
    request:
      method: POST
      path: /facebook_with_reuse
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        facebook_url: "${facebook_url}"
        country_code: "${country_code}"
        media_type: "${media_type}"
        active_status: "${active_status}"
        language: "${language}"
        all_ads: "${all_ads}"
        check_ugc: "${check_ugc}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
    input:
      company_domain:
        type: string
        description: The advertiser's website. Give this or `facebook_url`.
        optional: true
        example: nike.com
      facebook_url:
        type: string
        description: The advertiser's Facebook page url, when you already know it.
        optional: true
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
      media_type:
        type: string
        description: Restrict to one creative format, such as image or video.
        optional: true
      active_status:
        type: string
        description: Restrict to ads that are currently running, or to inactive ones.
        optional: true
      language:
        type: string
        description: Restrict to ads served in this language.
        optional: true
      all_ads:
        type: boolean
        description: Fetch the whole library rather than the most recent slice.
        optional: true
      check_ugc:
        type: boolean
        description: Also detect user-generated-content creative among the ads.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
    output:
      description: The advertiser's Meta ads, possibly from a recent cached scrape.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}

  get_facebook_ads_with_retry:
    title: Get a company's Facebook ads, retrying on a thin result
    description: >-
      The Meta Ad Library scrape with Adyntel's own retry loop around it, for
      advertisers whose page resists a first pass. Slower than
      `get_facebook_ads` and worth the wait only when that came back empty or
      obviously short for a company you know advertises.
    category: ads.facebook
    request:
      method: POST
      path: /facebook_with_retry
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        facebook_url: "${facebook_url}"
        country_code: "${country_code}"
        media_type: "${media_type}"
        extract: "${extract}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
    input:
      company_domain:
        type: string
        description: The advertiser's website. Give this or `facebook_url`.
        optional: true
        example: nike.com
      facebook_url:
        type: string
        description: The advertiser's Facebook page url, when you already know it.
        optional: true
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
      media_type:
        type: string
        description: Restrict to one creative format, such as image or video.
        optional: true
      extract:
        type: string
        description: Which fields to pull out of each ad, rather than the whole record.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
    output:
      description: The advertiser's Meta ads after Adyntel's retries.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}

  search_facebook_ads:
    title: Search Meta ads by keyword
    description: >-
      Search the Meta Ad Library by keyword rather than by advertiser -- who is
      bidding on a phrase, across companies. The complement to
      `get_facebook_ads`, which answers the question the other way round. Page
      with `continuation_token`.
    category: ads.facebook
    read_only: true
    request:
      method: POST
      path: /facebook_ad_search
      headers:
        Content-Type: application/json
      body:
        keyword: "${keyword}"
        country_code: "${country_code}"
        continuation_token: "${continuation_token}"
        all_ads: "${all_ads}"
        pagination: "${pagination}"
    input:
      keyword:
        type: string
        description: The phrase to search the ad library for.
        example: running shoes
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
        example: US
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next page.
        optional: true
      all_ads:
        type: boolean
        description: Fetch every matching ad rather than the first slice.
        optional: true
      pagination:
        type: boolean
        description: Ask Adyntel to return a paged response with a continuation token.
        optional: true
    output:
      description: Ads matching the keyword, across advertisers.
      type: object
      properties:
        ads: {type: array, description: "The matching ads."}
        continuation_token: {type: string, description: "Send back to fetch the next page."}

  compare_facebook_ad_counts:
    title: Compare an advertiser's total ad counts
    description: >-
      How many ads Meta reports for an advertiser, checked against what a scrape
      actually returns. This is the sanity check for a result that looks thin:
      a large gap means the scrape under-collected and
      `get_facebook_ads_with_retry` is worth running, while a small one means
      the advertiser really is quiet.
    category: ads.facebook
    read_only: true
    request:
      method: POST
      path: /facebook_total_ad_count_comparison
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        facebook_url: "${facebook_url}"
        country_code: "${country_code}"
        media_type: "${media_type}"
        extract: "${extract}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
    input:
      company_domain:
        type: string
        description: The advertiser's website. Give this or `facebook_url`.
        optional: true
        example: nike.com
      facebook_url:
        type: string
        description: The advertiser's Facebook page url, when you already know it.
        optional: true
      country_code:
        type: string
        description: Restrict the count to one country, as an ISO 3166 code.
        optional: true
      media_type:
        type: string
        description: Restrict the count to one creative format.
        optional: true
      extract:
        type: string
        description: Which fields to pull out of each ad, rather than the whole record.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to continue.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished comparison.
        optional: true
    output:
      description: Meta's reported total against what the scrape collected.
      type: object

  # -- google ads ------------------------------------------------------------

  get_google_ads:
    title: Get a company's Google ads
    description: >-
      The ads a company is running in Google's Ads Transparency Center, resolved
      from its domain. `media_type` narrows to text, image or video creative and
      `country_code` to one market. Asynchronous like the Meta scrapes: give a
      `webhook_url`, or page with `continuation_token`. `get_google_ads_advanced`
      runs the same query against a different upstream provider.
    category: ads.google
    request:
      method: POST
      path: /google
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        media_type: "${media_type}"
        country_code: "${country_code}"
        all_ads: "${all_ads}"
        resolve_images: "${resolve_images}"
        extract-text: "${extract_text}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
        job_id: "${job_id}"
    input:
      company_domain:
        type: string
        description: The advertiser's website, which Adyntel resolves to their advertiser id.
        example: nike.com
      media_type:
        type: string
        description: Restrict to one creative format, such as text, image or video.
        optional: true
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
        example: US
      all_ads:
        type: boolean
        description: >-
          Fetch every ad the advertiser has run rather than the recent slice.
          Slower and more expensive.
        optional: true
      resolve_images:
        type: boolean
        description: Resolve image creative to durable urls rather than leaving references.
        optional: true
      extract_text:
        type: boolean
        description: Pull the ad copy out of image and video creative as text.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
      job_id:
        type: string
        description: Resume a scrape you already started, rather than beginning a new one.
        optional: true
    output:
      description: The advertiser's Google ads, or the job that will deliver them.
      type: object
      properties:
        ads: {type: array, description: "The ads found, with creative and run dates."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}
        job_id: {type: string, description: "The job's id when the scrape runs asynchronously."}

  get_google_ads_advanced:
    title: Get a company's Google ads through the advanced provider
    description: >-
      The same Google Ads Transparency scrape as `get_google_ads`, run against
      Adyntel's `apify` upstream instead of its default one. Worth trying when
      the standard call returns nothing for a company you know advertises; the
      arguments are identical because the query is.
    category: ads.google
    request:
      method: POST
      path: /google-advanced
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        media_type: "${media_type}"
        country_code: "${country_code}"
        all_ads: "${all_ads}"
        resolve_images: "${resolve_images}"
        extract-text: "${extract_text}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
        job_id: "${job_id}"
    input:
      company_domain:
        type: string
        description: The advertiser's website.
        example: nike.com
      media_type:
        type: string
        description: Restrict to one creative format, such as text, image or video.
        optional: true
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
      all_ads:
        type: boolean
        description: Fetch every ad rather than the recent slice.
        optional: true
      resolve_images:
        type: boolean
        description: Resolve image creative to durable urls.
        optional: true
      extract_text:
        type: boolean
        description: Pull the ad copy out of image and video creative as text.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
      job_id:
        type: string
        description: Resume a scrape you already started.
        optional: true
    output:
      description: The advertiser's Google ads from the advanced provider.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}

  start_google_shopping_scrape:
    title: Start a Google Shopping scrape
    description: >-
      Begin collecting a company's Google Shopping listings. Unlike the other
      scrapes this one is explicitly two-part: it returns an id, and
      `get_google_shopping_status` turns that id into the results once they are
      ready. Set `shopping` true for the Shopping surface specifically.
    category: ads.google
    request:
      method: POST
      path: /google_shopping
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        shopping: "${shopping}"
    input:
      company_domain:
        type: string
        description: The merchant's website.
        example: nike.com
      shopping:
        type: boolean
        description: Collect Google Shopping listings rather than the default surface.
        optional: true
    output:
      description: The scrape job, whose id `get_google_shopping_status` polls.
      type: object
      properties:
        id: {type: string, description: "The job id to poll with."}

  get_google_shopping_status:
    title: Get a Google Shopping scrape's status and results
    description: >-
      Poll the job `start_google_shopping_scrape` returned. Answers with the
      job's state, and with the collected shopping listings once it has
      finished.
    category: ads.google
    read_only: true
    request:
      method: POST
      path: /google_shopping_status
      headers:
        Content-Type: application/json
      body:
        id: "${job_id}"
    input:
      job_id:
        type: string
        description: The id `start_google_shopping_scrape` returned.
    output:
      description: The job's state, and its listings once complete.
      type: object

  # -- linkedin ads ----------------------------------------------------------

  get_linkedin_ads:
    title: Get a company's LinkedIn ads
    description: >-
      The ads a company is running in LinkedIn's Ad Library. Address the company
      by `linkedin_page_id` when you know it, or by `company_domain` and let
      Adyntel resolve it; the plural forms take a batch in one call.
      `date_filter` narrows to a period and `live_ads` to what is running now.
      `get_linkedin_ads_advanced` runs the same query against a different
      upstream provider.
    category: ads.linkedin
    request:
      method: POST
      path: /linkedin
      headers:
        Content-Type: application/json
      body:
        linkedin_page_id: "${linkedin_page_id}"
        linkedin_page_ids: "${linkedin_page_ids}"
        company_domain: "${company_domain}"
        company_domains: "${company_domains}"
        date_filter: "${date_filter}"
        extract: "${extract}"
        all_ads: "${all_ads}"
        live_ads: "${live_ads}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
        job_id: "${job_id}"
    input:
      linkedin_page_id:
        type: string
        description: >-
          The advertiser's LinkedIn page id. The most precise way to address
          one; use `company_domain` when you do not have it.
        optional: true
      linkedin_page_ids:
        type: array
        description: Several LinkedIn page ids, to collect a batch in one call.
        optional: true
        items: {type: string}
      company_domain:
        type: string
        description: The advertiser's website, which Adyntel resolves to their page.
        optional: true
        example: nike.com
      company_domains:
        type: array
        description: Several websites, to collect a batch in one call.
        optional: true
        items: {type: string}
      date_filter:
        type: string
        description: Restrict to ads running in a period, as Adyntel's date filter expression.
        optional: true
      extract:
        type: string
        description: Which fields to pull out of each ad, rather than the whole record.
        optional: true
      all_ads:
        type: boolean
        description: Fetch the advertiser's whole library rather than the recent slice.
        optional: true
      live_ads:
        type: boolean
        description: Restrict to ads currently being served.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
      job_id:
        type: string
        description: Resume a scrape you already started.
        optional: true
    output:
      description: The advertiser's LinkedIn ads, or the job that will deliver them.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}
        job_id: {type: string, description: "The job's id when the scrape runs asynchronously."}

  get_linkedin_ads_advanced:
    title: Get a company's LinkedIn ads through the advanced provider
    description: >-
      The same LinkedIn Ad Library scrape as `get_linkedin_ads`, run against
      Adyntel's `apify` upstream instead of its default one. Same arguments,
      different source -- worth trying when the standard call comes back empty
      for a company you know advertises.
    category: ads.linkedin
    request:
      method: POST
      path: /linkedin-advanced
      headers:
        Content-Type: application/json
      body:
        linkedin_page_id: "${linkedin_page_id}"
        linkedin_page_ids: "${linkedin_page_ids}"
        company_domain: "${company_domain}"
        company_domains: "${company_domains}"
        date_filter: "${date_filter}"
        extract: "${extract}"
        all_ads: "${all_ads}"
        live_ads: "${live_ads}"
        continuation_token: "${continuation_token}"
        webhook_url: "${webhook_url}"
        job_id: "${job_id}"
    input:
      linkedin_page_id:
        type: string
        description: The advertiser's LinkedIn page id.
        optional: true
      linkedin_page_ids:
        type: array
        description: Several LinkedIn page ids, to collect a batch in one call.
        optional: true
        items: {type: string}
      company_domain:
        type: string
        description: The advertiser's website.
        optional: true
        example: nike.com
      company_domains:
        type: array
        description: Several websites, to collect a batch in one call.
        optional: true
        items: {type: string}
      date_filter:
        type: string
        description: Restrict to ads running in a period.
        optional: true
      extract:
        type: string
        description: Which fields to pull out of each ad.
        optional: true
      all_ads:
        type: boolean
        description: Fetch the whole library rather than the recent slice.
        optional: true
      live_ads:
        type: boolean
        description: Restrict to ads currently being served.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next slice.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
      job_id:
        type: string
        description: Resume a scrape you already started.
        optional: true
    output:
      description: The advertiser's LinkedIn ads from the advanced provider.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_token: {type: string, description: "Send back to fetch the next slice."}

  search_linkedin_ads:
    title: Search LinkedIn ads by keyword
    description: >-
      Search LinkedIn's Ad Library by phrase rather than by advertiser -- who is
      running ads about a topic. `dateOption` picks a preset window, or give
      `startDate` and `endDate` for an explicit one. Page with
      `continuation_token`.
    category: ads.linkedin
    read_only: true
    request:
      method: POST
      path: /linkedin-keyword-search
      headers:
        Content-Type: application/json
      body:
        keyword: "${keyword}"
        country: "${country}"
        dateOption: "${date_option}"
        startDate: "${start_date}"
        endDate: "${end_date}"
        continuation_token: "${continuation_token}"
    input:
      keyword:
        type: string
        description: The phrase to search the ad library for.
        example: developer tools
      country:
        type: string
        description: Restrict to ads served in one country.
        optional: true
      date_option:
        type: string
        description: >-
          A preset date window, as LinkedIn's ad library spells them. Use
          `start_date` and `end_date` instead for an explicit range.
        optional: true
      start_date:
        type: string
        description: Start of an explicit date range.
        optional: true
      end_date:
        type: string
        description: End of an explicit date range.
        optional: true
      continuation_token:
        type: string
        description: The token from the previous response, to fetch the next page.
        optional: true
    output:
      description: LinkedIn ads matching the keyword, across advertisers.
      type: object
      properties:
        ads: {type: array, description: "The matching ads."}
        continuation_token: {type: string, description: "Send back to fetch the next page."}

  # -- tiktok ads ------------------------------------------------------------

  get_tiktok_ads:
    title: Get a company's TikTok ads
    description: >-
      The ads a company is running in TikTok's Commercial Content Library,
      resolved from its domain. `influencer_ads` widens the search to
      creator-published branded content, which is where much of TikTok's paid
      activity actually lives. Note that this endpoint pages with
      `continuation_tokens` -- an object, one token per surface -- rather than
      the single token the other platforms use.
    category: ads.tiktok
    request:
      method: POST
      path: /tiktok
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        influencer_ads: "${influencer_ads}"
        continuation_tokens: "${continuation_tokens}"
        webhook_url: "${webhook_url}"
    input:
      company_domain:
        type: string
        description: The advertiser's website.
        example: nike.com
      influencer_ads:
        type: boolean
        description: >-
          Also collect creator-published branded content, not just the brand's
          own ads.
        optional: true
      continuation_tokens:
        type: object
        description: >-
          The `continuation_tokens` object from the previous response -- one
          token per surface, not a single string.
        optional: true
      webhook_url:
        type: string
        description: Where Adyntel should post the finished result.
        optional: true
    output:
      description: The advertiser's TikTok ads, or the job that will deliver them.
      type: object
      properties:
        ads: {type: array, description: "The ads found."}
        continuation_tokens: {type: object, description: "Send back to fetch the next slice."}

  search_tiktok_ads:
    title: Search TikTok ads by keyword
    description: >-
      Search TikTok's Commercial Content Library by phrase rather than by
      advertiser. Returns matching ads with their ids; `get_tiktok_ad` turns one
      of those ids into the full record.
    category: ads.tiktok
    read_only: true
    request:
      method: POST
      path: /tiktok_search
      headers:
        Content-Type: application/json
      body:
        keyword: "${keyword}"
        country_code: "${country_code}"
    input:
      keyword:
        type: string
        description: The phrase to search for.
        example: skincare
      country_code:
        type: string
        description: Restrict to ads served in one country, as an ISO 3166 code.
        optional: true
    output:
      description: TikTok ads matching the keyword.
      type: object
      properties:
        ads: {type: array, description: "The matching ads, each with the id `get_tiktok_ad` takes."}

  get_tiktok_ad:
    title: Get one TikTok ad
    description: >-
      The full record for a single TikTok ad -- creative, advertiser, run dates
      and reach -- by the id `search_tiktok_ads` or `get_tiktok_ads` returned.
      Use it to fill in an ad the listing showed only in summary.
    category: ads.tiktok
    read_only: true
    request:
      method: POST
      path: /tiktok_ad_details
      headers:
        Content-Type: application/json
      body:
        id: "${ad_id}"
    input:
      ad_id:
        type: string
        description: The ad's id, from a TikTok search or scrape.
    output:
      description: The ad's full record.
      type: object

  # -- domain intelligence ---------------------------------------------------

  get_domain_keywords:
    title: Get a domain's paid keywords
    description: >-
      The search keywords a domain ranks or bids on, with the volumes behind
      them. This is the demand-side view that pairs with the creative the ad
      scrapes return: what a competitor is buying, rather than what they are
      showing.
    category: intelligence
    read_only: true
    request:
      method: POST
      path: /domain-keywords
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        language: "${language}"
        limit: "${limit}"
    input:
      company_domain:
        type: string
        description: The website to pull keywords for.
        example: nike.com
      language:
        type: string
        description: The language to report keywords in.
        optional: true
        default: English
      limit:
        type: integer
        description: How many keywords to return.
        optional: true
        default: 1
        minimum: 1
    output:
      description: The domain's keywords and their volumes.
      type: object

  get_traffic_estimate:
    title: Estimate a domain's traffic
    description: >-
      Estimated visits to a domain, by location. `location_code` is a numeric
      market code -- 2840 is the United States -- rather than an ISO country
      code, which is the one argument here that is easy to get wrong. Use it to
      size an advertiser before deciding how deeply to scrape them.
    category: intelligence
    read_only: true
    request:
      method: POST
      path: /traffic-estimate
      headers:
        Content-Type: application/json
      body:
        domain: "${domain}"
        language: "${language}"
        location_code: "${location_code}"
        limit: "${limit}"
    input:
      domain:
        type: string
        description: The website to estimate traffic for.
        example: nike.com
      language:
        type: string
        description: The language to report in.
        optional: true
        default: English
      location_code:
        type: integer
        description: >-
          The numeric market code to estimate for -- 2840 is the United States.
          Not an ISO country code.
        optional: true
        default: 2840
      limit:
        type: integer
        description: How many rows of estimate to return.
        optional: true
        default: 1
        minimum: 1
    output:
      description: The domain's estimated traffic for that market.
      type: object

  get_tracking_pixels:
    title: Get a domain's tracking pixels
    description: >-
      Which advertising and analytics pixels a website is running -- Meta,
      Google, TikTok, LinkedIn and the rest. The quickest read on which channels
      a company actually invests in, and a good filter before spending credit on
      per-platform ad scrapes.
    category: intelligence
    read_only: true
    request:
      method: POST
      path: /pixel-scraper
      headers:
        Content-Type: application/json
      body:
        domain: "${domain}"
    input:
      domain:
        type: string
        description: The website to scan for pixels.
        example: nike.com
    output:
      description: The tracking pixels found on the site.
      type: object

  get_youtube_transcript:
    title: Get a YouTube video's transcript
    description: >-
      The spoken transcript of a YouTube video, from its url. Useful for reading
      the message out of video creative that an ad scrape returns only as a
      link.
    category: intelligence
    read_only: true
    request:
      method: POST
      path: /youtube_transcript
      headers:
        Content-Type: application/json
      body:
        url: "${url}"
    input:
      url:
        type: string
        description: The YouTube video's url.
        example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
    output:
      description: The video's transcript.
      type: object

  # -- tracking jobs ---------------------------------------------------------

  track_domain:
    title: Start, pause or delete domain tracking
    description: >-
      Put a company on a recurring watch: Adyntel re-runs the `endpoints` you
      name against `company_domain` on the `frequency` you set, so new ads turn
      up without polling. `track_action` chooses what to do -- start a new
      watch, or pause or delete an existing one, in which case pass its
      `job_id`. Read what a watch has collected with `get_tracking_results`.
    category: tracking
    request:
      method: POST
      path: /track
      headers:
        Content-Type: application/json
      body:
        company_domain: "${company_domain}"
        endpoints: "${endpoints}"
        frequency: "${frequency}"
        track_action: "${track_action}"
        job_id: "${job_id}"
    input:
      company_domain:
        type: string
        description: The company to watch.
        example: nike.com
      endpoints:
        type: array
        description: >-
          Which scrapes to run on each pass, by endpoint name -- for example
          facebook, google, linkedin or tiktok.
        items: {type: string}
      frequency:
        type: string
        description: How often to re-run them, as Adyntel's frequency string.
        example: daily
      track_action:
        type: string
        description: >-
          What to do -- start a new watch, or pause or delete an existing one.
          Pausing and deleting need the watch's `job_id`.
        example: start
      job_id:
        type: string
        description: >-
          The existing watch to act on. Required when pausing or deleting, and
          left out when starting a new one.
        optional: true
    output:
      description: The tracking job, with the id its results are read by.
      type: object
      properties:
        job_id: {type: string, description: "The watch's id."}

  get_tracking_results:
    title: Get tracking results
    description: >-
      What the recurring watches have collected -- everything for the account,
      or one watch's results when you pass its `job_id`. This is where a
      tracked company's new ads arrive between runs. Adyntel wants the
      credentials in the query string on this endpoint rather than the body, so
      unlike every other tool here it asks for them.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /track/results
      query:
        email: "${email}"
        api_key: "${api_key}"
        job_id: "${job_id}"
    input:
      email:
        type: string
        description: >-
          The account's login email -- the same one the connection holds. This
          endpoint reads it from the query string, not the body.
        format: email
        example: you@company.com
      api_key:
        type: string
        description: >-
          The account's API key -- the same one the connection holds. This
          endpoint reads it from the query string, not the body.
        secret: true
      job_id:
        type: string
        description: One watch's results. Omit for every watch on the account.
        optional: true
    output:
      description: The results the watches have collected.
      type: object

  get_tracking_jobs:
    title: List tracking jobs
    description: >-
      Every recurring watch on the account, with the company, endpoints and
      frequency of each and whether it is running. Read it before starting
      another watch, and to find the `job_id` that `track_domain` needs in order
      to pause or delete one. Takes the credentials in the query string, as
      `get_tracking_results` does.
    category: tracking
    read_only: true
    request:
      method: GET
      path: /track/jobs
      query:
        email: "${email}"
        api_key: "${api_key}"
    input:
      email:
        type: string
        description: >-
          The account's login email -- the same one the connection holds. This
          endpoint reads it from the query string, not the body.
        format: email
        example: you@company.com
      api_key:
        type: string
        description: >-
          The account's API key -- the same one the connection holds. This
          endpoint reads it from the query string, not the body.
        secret: true
    output:
      description: The account's tracking jobs.
      type: object

  # -- reseller user administration ------------------------------------------

  create_user:
    title: Create an Adyntel user
    description: >-
      Provision an account under a reseller's Adyntel tenancy, with a starting
      token balance. Needs the reseller's `master_key`, not this connection's
      own API key -- an ordinary account has no master key and gets a 401 here.
    category: admin.users
    request:
      method: POST
      path: /create_user
      headers:
        Content-Type: application/json
      body:
        master_key: "${master_key}"
        email: "${user_email}"
        name: "${name}"
        tokens: "${tokens}"
        stripe_id: "${stripe_id}"
        card_id: "${card_id}"
    input:
      master_key:
        type: string
        description: The reseller's master key. Not the account's own API key.
        secret: true
      user_email:
        type: string
        description: The new user's login email, which is also their API identity.
        format: email
        example: new.user@company.com
      name:
        type: string
        description: The user's display name.
        optional: true
      tokens:
        type: integer
        description: How much scraping credit to start them with.
        optional: true
        default: 50
        minimum: 0
      stripe_id:
        type: string
        description: The Stripe customer to bill for this user.
        optional: true
      card_id:
        type: string
        description: The Stripe card to charge for this user.
        optional: true
    output:
      description: The user that was created, with their API key.
      type: object

  get_user:
    title: Get an Adyntel user
    description: >-
      One user under a reseller's tenancy, by email -- their balance, billing
      links and API identity. Needs the reseller's `master_key`.
    category: admin.users
    read_only: true
    request:
      method: POST
      path: /get_user
      headers:
        Content-Type: application/json
      body:
        master_key: "${master_key}"
        email: "${user_email}"
    input:
      master_key:
        type: string
        description: The reseller's master key. Not the account's own API key.
        secret: true
      user_email:
        type: string
        description: The user to look up.
        format: email
        example: new.user@company.com
    output:
      description: The user's record.
      type: object

  list_users:
    title: List Adyntel users
    description: >-
      Every user under a reseller's tenancy, with their balances. Needs the
      reseller's `master_key`; use `get_user` for one account rather than
      filtering this.
    category: admin.users
    read_only: true
    request:
      method: POST
      path: /get_users
      headers:
        Content-Type: application/json
      body:
        master_key: "${master_key}"
    input:
      master_key:
        type: string
        description: The reseller's master key. Not the account's own API key.
        secret: true
    output:
      description: The tenancy's users.
      type: object

  update_user:
    title: Update an Adyntel user
    description: >-
      Change a user's name or billing links, and credit or debit their balance
      in the same call -- `credit_tokens` adds, `debit_tokens` subtracts. To set
      a balance outright rather than adjust it, use `set_user_tokens`. Needs the
      reseller's `master_key`.
    category: admin.users
    request:
      method: POST
      path: /update_user
      headers:
        Content-Type: application/json
      body:
        master_key: "${master_key}"
        email: "${user_email}"
        name: "${name}"
        stripe_id: "${stripe_id}"
        card_id: "${card_id}"
        credit_tokens: "${credit_tokens}"
        debit_tokens: "${debit_tokens}"
    input:
      master_key:
        type: string
        description: The reseller's master key. Not the account's own API key.
        secret: true
      user_email:
        type: string
        description: The user to update.
        format: email
        example: new.user@company.com
      name:
        type: string
        description: A new display name.
        optional: true
      stripe_id:
        type: string
        description: A new Stripe customer to bill.
        optional: true
      card_id:
        type: string
        description: A new Stripe card to charge.
        optional: true
      credit_tokens:
        type: integer
        description: Credit to add to the user's balance.
        optional: true
        minimum: 0
      debit_tokens:
        type: integer
        description: Credit to take off the user's balance.
        optional: true
        minimum: 0
    output:
      description: The user as they now stand.
      type: object

  set_user_tokens:
    title: Set a user's token balance
    description: >-
      Set a user's scraping balance to an exact amount, rather than adjusting it
      the way `update_user`'s credit and debit fields do. Needs the reseller's
      `master_key`.
    category: admin.users
    request:
      method: POST
      path: /update_user/tokens
      headers:
        Content-Type: application/json
      body:
        master_key: "${master_key}"
        email: "${user_email}"
        amount: "${amount}"
    input:
      master_key:
        type: string
        description: The reseller's master key. Not the account's own API key.
        secret: true
      user_email:
        type: string
        description: The user whose balance to set.
        format: email
        example: new.user@company.com
      amount:
        type: integer
        description: The balance to set, in tokens.
        minimum: 0
    output:
      description: The user's balance after the change.
      type: object
