# Affinity (v1) tools.
#
# Affinity is a relationship CRM, and its v1 API is a spreadsheet made
# addressable. Four ideas carry the whole surface:
#
#   * a **list** is a sheet of one entity type -- people (`type` 0),
#     organizations (`1`) or opportunities (`8`). Nothing else may share a list;
#   * a **list entry** is a row: it ties one entity to one list. Adding a person
#     or an organization to a list means `create_list_entry`; adding an
#     opportunity means `create_opportunity`, because an opportunity is created
#     *by* its list entry and dies with it;
#   * a **field** is a column. Global fields live on every list; list-specific
#     fields only on theirs. `list_fields` is where the `field_id` and, for
#     ranked-dropdown fields, the dropdown option ids come from;
#   * a **field value** is a cell. It hangs off an entity, and off a
#     `list_entry_id` too when its field is list-specific.
#
# Three things that trip up an integration here:
#
#   * **write a dropdown by option id, not by text.** For a ranked-dropdown
#     field -- Status, Priority, the ones with colours -- `value` must be the
#     `dropdown_options[].id` that `list_fields` returns, not the label;
#   * **updates replace collections, they do not append.** `update_person`,
#     `update_organization` and `update_opportunity` overwrite `emails`,
#     `person_ids` and `organization_ids` wholesale, so read the record first and
#     send the existing members alongside the new one;
#   * **interactions are keyed by (id, type), not by id.** The same numeric id
#     means a different interaction for a meeting than for an email, so every
#     interaction call carries `type`.
#
# Deleting is cascading and worth respecting: removing a list entry takes its
# list-specific field values with it, and if the list holds opportunities it
# deletes the opportunity itself. Deleting a person or organization takes every
# field value attached to it.
#
# Authentication is HTTP Basic with the API key as the password and an empty
# username, and the key is not scoped -- Affinity gates on the key's owner and
# their list-level permissions, not on per-call scopes -- so no tool here
# declares scopes. `get_rate_limit` reports the account's monthly allowance and
# the key's per-minute one; the connector already retries on Affinity's
# `x-ratelimit-*` headers.
#
# Not covered: uploading entity files. `POST /entity-files` takes
# `multipart/form-data` with the file bytes, which this pack's request format
# cannot express -- reading, listing and downloading files are all here.
#
# Affinity also ships a v2 API at https://developer.affinity.co; it is not at
# feature parity with v1, and this connector is the v1 one.
#
# Docs: https://api-docs.affinity.co/

connector_id: affinity
display_name: Affinity (v1)
docs_url: https://api-docs.affinity.co/

tools:

  # -- account ---------------------------------------------------------------

  get_current_user:
    title: Get the authenticated user and tenant
    description: >-
      Who the API key belongs to, which Affinity instance it acts on and how it
      was granted. The tenant's `subdomain` comes back here, which is what you
      need to build links back into the Affinity web app. Start here to confirm
      a key works before doing anything else.
    category: account
    read_only: true
    request:
      method: GET
      path: /auth/whoami
    input: {}
    output:
      description: The tenant, the user and the grant behind this key.
      type: object
      properties:
        tenant: {type: object, description: "The Affinity instance, including its subdomain."}
        user: {type: object, description: "The internal person the key acts as."}
        grant: {type: object, description: "How the key was granted and what type it is."}

  get_rate_limit:
    title: Get rate limit usage
    description: >-
      How much of the account's monthly call allowance and this key's per-minute
      allowance is left, with the seconds until each resets. Worth reading before
      a bulk sync rather than after the 429.
    category: account
    read_only: true
    request:
      method: GET
      path: /rate-limit
    input: {}
    output:
      description: Account-level and key-level limits, usage and reset windows.
      type: object
      properties:
        rate: {type: object, description: "Holds org_monthly and api_key_per_minute, each with limit, remaining, reset and used."}

  # -- lists -----------------------------------------------------------------

  list_lists:
    title: List lists
    description: >-
      Every list visible to this key, with its `id`, `name`, entity `type` and
      `list_size`. This is the entry point to almost everything else: list
      entries, list-specific fields and opportunities are all addressed by list
      id. Takes no parameters.
    category: lists
    read_only: true
    request:
      method: GET
      path: /lists
    input: {}
    output:
      description: Every visible list.
      type: array
      items: {type: object}

  get_list:
    title: Get a list
    description: >-
      One list with the `fields` array holding the columns specific to it --
      including each ranked-dropdown field's `dropdown_options`, whose ids are
      what `create_field_value` and `update_field_value` must be given. Prefer
      this over `list_fields` when you only care about one list.
    category: lists
    read_only: true
    request:
      method: GET
      path: /lists/${list_id}
    input:
      list_id:
        type: integer
        description: The list's id, from `list_lists`.
        example: 450
    output:
      description: The list and the fields specific to it.
      type: object
      properties:
        id: {type: integer, description: "The list id."}
        name: {type: string, description: "The list's title in Affinity."}
        type: {type: integer, description: "0 person, 1 organization, 8 opportunity."}
        list_size: {type: integer, description: "How many entries the list holds."}
        fields: {type: array, description: "The list-specific columns, with their dropdown options."}

  create_list:
    title: Create a list
    description: >-
      Create a list of people, organizations or opportunities. `type` fixes the
      entity kind for the list's whole life and cannot be changed afterwards.
      `is_public` false keeps it to the owner plus whoever
      `additional_permissions` names.
    category: lists
    request:
      method: POST
      path: /lists
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        type: "${type}"
        is_public: "${is_public}"
        owner_id: "${owner_id}"
        additional_permissions: "${additional_permissions}"
    input:
      name:
        type: string
        description: The list's title, as shown in Affinity.
        example: My List of Organizations
      type:
        type: integer
        description: >-
          What the list holds -- 0 for people, 1 for organizations, 8 for
          opportunities. A list only ever holds one kind.
        enum: [0, 1, 8]
      is_public:
        type: boolean
        description: >-
          True to let everyone in the Affinity account see the list; false to
          keep it to its owner and the people in `additional_permissions`.
      owner_id:
        type: integer
        description: >-
          The internal person who should own the list. Defaults to the owner of
          the API key.
        optional: true
      additional_permissions:
        type: array
        description: >-
          Extra people to grant access, as `{"internal_person_id": …,
          "role_id": …}` objects, where role_id is 0 admin, 1 basic or 2 standard.
        optional: true
        items: {type: object}
    output:
      description: The list that was created.
      type: object
      properties:
        id: {type: integer, description: "The new list's id."}
        additional_permissions: {type: array, description: "The grants that were applied."}

  # -- list entries ----------------------------------------------------------

  list_list_entries:
    title: List entries in a list
    description: >-
      The rows of a list -- each tying an `entity_id` to the list, with the
      entity inlined. Pass `page_size` to page (and then the `next_page_token`
      back as `page_token`); omit it and Affinity returns the whole list in one
      response, which is fine for small lists and painful for large ones.
    category: lists.entries
    read_only: true
    request:
      method: GET
      path: /lists/${list_id}/list-entries
      query:
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      list_id:
        type: integer
        description: The list whose rows to read.
        example: 450
      page_size:
        type: integer
        description: >-
          How many entries per page. Omit to have Affinity return every entry in
          one response rather than a paged object.
        optional: true
        minimum: 1
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of list entries, or every entry when page_size was omitted.
      type: object
      properties:
        list_entries: {type: array, description: "Each with id, list_id, entity_id, entity_type and the inlined entity."}
        next_page_token: {type: string, description: "Pass back as page_token; null when there is no more."}

  get_list_entry:
    title: Get a list entry
    description: >-
      One row of a list by its own id, with the entity it points at. Use it to
      resolve the `entity_id` behind a `list_entry_id` you were handed by a
      webhook or a field value.
    category: lists.entries
    read_only: true
    request:
      method: GET
      path: /lists/${list_id}/list-entries/${list_entry_id}
    input:
      list_id:
        type: integer
        description: The list the entry belongs to.
        example: 450
      list_entry_id:
        type: integer
        description: The list entry's id.
        example: 16367
    output:
      description: The list entry and its entity.
      type: object
      properties:
        id: {type: integer, description: "The list entry id."}
        entity_id: {type: integer, description: "The person, organization or opportunity on this row."}
        entity: {type: object, description: "The entity itself, inlined."}

  create_list_entry:
    title: Add an entity to a list
    description: >-
      Put an existing person or organization on a list. Opportunities cannot be
      added this way -- `create_opportunity` creates the opportunity and its row
      together. Person and organization lists tolerate duplicates, so check
      `list_list_entries` first if a second row would be wrong.
    category: lists.entries
    request:
      method: POST
      path: /lists/${list_id}/list-entries
      headers:
        Content-Type: application/json
      body:
        entity_id: "${entity_id}"
        creator_id: "${creator_id}"
    input:
      list_id:
        type: integer
        description: The list to add to. Its type must match the entity's kind.
        example: 450
      entity_id:
        type: integer
        description: The person or organization to add.
        example: 38706
      creator_id:
        type: integer
        description: >-
          Who to record as having added the row. Must be someone with Affinity
          access; defaults to the API key's owner.
        optional: true
    output:
      description: The list entry that was created.
      type: object
      properties:
        id: {type: integer, description: "The new list entry's id."}
        entity_id: {type: integer, description: "The entity now on the list."}

  delete_list_entry:
    title: Remove an entity from a list
    description: >-
      Delete a row. This also deletes every field value that lived in that row's
      list-specific columns, and on an opportunity list it deletes the
      opportunity itself, since an opportunity exists only through its one list
      entry. Global field values on a person or organization survive.
    category: lists.entries
    destructive: true
    request:
      method: DELETE
      path: /lists/${list_id}/list-entries/${list_entry_id}
    input:
      list_id:
        type: integer
        description: The list the entry belongs to.
        example: 450
      list_entry_id:
        type: integer
        description: The list entry to delete.
        example: 56517
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the row was deleted."}

  # -- fields ----------------------------------------------------------------

  list_fields:
    title: List fields
    description: >-
      The columns available -- global ones (`list_id: null`) and list-specific
      ones alike -- each with its `value_type` and, for ranked dropdowns, the
      `dropdown_options` whose ids a field value must be written with. Narrow to
      one list with `list_id`. Set `with_modified_names` to get names as
      `[List Name] Field Name`, which disambiguates two columns that share a
      label. Crunchbase fields are not returned.
    category: fields
    read_only: true
    request:
      method: GET
      path: /fields
      query:
        list_id: "${list_id}"
        value_type: "${value_type}"
        entity_type: "${entity_type}"
        with_modified_names: "${with_modified_names}"
        exclude_dropdown_options: "${exclude_dropdown_options}"
    input:
      list_id:
        type: integer
        description: Only fields specific to this list.
        optional: true
      value_type:
        type: integer
        description: >-
          Only fields of this value type -- 0 person, 1 organization, 2 text or
          dropdown, 3 number, 4 date, 5 location, 6 long text, 7 ranked dropdown.
        optional: true
        enum: [0, 1, 2, 3, 4, 5, 6, 7]
      entity_type:
        type: integer
        description: Only fields for this entity kind -- 0 person, 1 organization, 8 opportunity.
        optional: true
        enum: [0, 1, 8]
      with_modified_names:
        type: boolean
        description: Return names as `[List Name] Field Name` rather than bare.
        optional: true
      exclude_dropdown_options:
        type: boolean
        description: >-
          Leave the dropdown options out of the response, which keeps the payload
          manageable on accounts with very large pick lists.
        optional: true
    output:
      description: The matching fields.
      type: array
      items: {type: object}

  create_field:
    title: Create a field
    description: >-
      Add a column. `entity_type` says what it hangs off (0 person, 1
      organization, 8 opportunity) and `value_type` what it holds. A
      list-specific field needs `is_list_specific` true *and* the `list_id`;
      leave both off for a global field. Note the API cannot rename or retype a
      field afterwards -- that is web-app only.
    category: fields
    request:
      method: POST
      path: /fields
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        entity_type: "${entity_type}"
        value_type: "${value_type}"
        list_id: "${list_id}"
        allows_multiple: "${allows_multiple}"
        is_list_specific: "${is_list_specific}"
        is_required: "${is_required}"
    input:
      name:
        type: string
        description: The column's name.
        example: Deal Size
      entity_type:
        type: integer
        description: What the field hangs off -- 0 person, 1 organization, 8 opportunity.
        enum: [0, 1, 8]
      value_type:
        type: integer
        description: >-
          What the column holds -- 0 person, 1 organization, 2 text or dropdown,
          3 number, 4 date, 5 location, 6 long text, 7 ranked dropdown.
        enum: [0, 1, 2, 3, 4, 5, 6, 7]
      list_id:
        type: integer
        description: The list the field belongs to, when it is list-specific.
        optional: true
      allows_multiple:
        type: boolean
        description: Whether a cell may hold more than one value.
        optional: true
      is_list_specific:
        type: boolean
        description: True to scope the field to one list; pass `list_id` alongside it.
        optional: true
      is_required:
        type: boolean
        description: Whether the field must be filled in.
        optional: true
    output:
      description: The field that was created.
      type: object
      properties:
        id: {type: integer, description: "The new field's id."}

  delete_field:
    title: Delete a field
    description: >-
      Remove a column, and with it every value in that column across every row
      it appeared on. There is no undo, and no soft delete.
    category: fields
    destructive: true
    request:
      method: DELETE
      path: /fields/${field_id}
    input:
      field_id:
        type: integer
        description: The field to delete.
        example: 1234
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the field was deleted."}

  # -- field values ----------------------------------------------------------

  list_field_values:
    title: List field values for an entity
    description: >-
      The cells filled in for one person, organization, opportunity or list
      entry. Exactly one of the four ids must be given. Passing an entity id
      returns its values across every list it appears on; passing
      `list_entry_id` narrows to that one row. Smart fields are not returned
      here -- read those with `with_interaction_dates` on `get_person` or
      `get_organization`.
    category: fields.values
    read_only: true
    request:
      method: GET
      path: /field-values
      query:
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        list_entry_id: "${list_entry_id}"
    input:
      person_id:
        type: integer
        description: Read the values on this person. Give exactly one of the four ids.
        optional: true
      organization_id:
        type: integer
        description: Read the values on this organization. Give exactly one of the four ids.
        optional: true
      opportunity_id:
        type: integer
        description: Read the values on this opportunity. Give exactly one of the four ids.
        optional: true
      list_entry_id:
        type: integer
        description: Read the values on this one row. Give exactly one of the four ids.
        optional: true
    output:
      description: The field values on that entity or row.
      type: array
      items: {type: object}

  create_field_value:
    title: Set a field value
    description: >-
      Fill in a cell. `value` has to match the field's `value_type`: a number
      for a number field, an ISO date for a date field, and -- for a ranked
      dropdown such as Status -- the `dropdown_options[].id` from `list_fields`,
      never the option's text. Pass `list_entry_id` when the field is
      list-specific, since the same field can hold different values on different
      lists. To change a value that already exists, use `update_field_value`.
      One limit worth knowing: `value` is a scalar here and goes out as a
      string, which Affinity coerces for number, date and dropdown-id fields --
      but a location field, whose value is an object, cannot be written through
      this tool.
    category: fields.values
    request:
      method: POST
      path: /field-values
      headers:
        Content-Type: application/json
      body:
        field_id: "${field_id}"
        entity_id: "${entity_id}"
        value: "${value}"
        list_entry_id: "${list_entry_id}"
    input:
      field_id:
        type: integer
        description: The column to write, from `list_fields`.
        example: 1284
      entity_id:
        type: integer
        description: The person, organization or opportunity the value belongs to.
        example: 38706
      value:
        type: string
        description: >-
          The cell's value, matching the field's value type -- text, a number as
          a string, an ISO 8601 date, or a dropdown option id for a ranked
          dropdown field.
        example: "3"
      list_entry_id:
        type: integer
        description: >-
          The row to write it on. Required when the field is list-specific,
          omitted when it is global.
        optional: true
    output:
      description: The field value that was created.
      type: object
      properties:
        id: {type: integer, description: "The field value id, which `update_field_value` needs."}

  update_field_value:
    title: Update a field value
    description: >-
      Change an existing cell. Addressed by `field_value_id` -- the id of the
      value itself, which `list_field_values` returns -- and not by `field_id`,
      which is a common and silent mistake. As with `create_field_value`, a
      ranked-dropdown field takes the option's id, not its label, and `value` is
      a scalar -- so a location field, whose value is an object, is out of reach
      here.
    category: fields.values
    request:
      method: PUT
      path: /field-values/${field_value_id}
      headers:
        Content-Type: application/json
      body:
        value: "${value}"
    input:
      field_value_id:
        type: integer
        description: The field value's own id, from `list_field_values`.
        example: 20406836
      value:
        type: string
        description: >-
          The new value, matching the field's value type. For a ranked dropdown,
          the dropdown option's id.
        example: "5"
    output:
      description: The field value as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The field value id."}
        value: {type: string, description: "The stored value."}

  delete_field_value:
    title: Delete a field value
    description: >-
      Clear a cell entirely, leaving the field and the row in place. Addressed
      by the field value's own id, not the field's.
    category: fields.values
    destructive: true
    request:
      method: DELETE
      path: /field-values/${field_value_id}
    input:
      field_value_id:
        type: integer
        description: The field value to delete.
        example: 20406836
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the value was cleared."}

  list_field_value_changes:
    title: List a field's change history
    description: >-
      Every create, update and delete recorded against one field, newest first,
      with who changed it and when. This is how you reconstruct a pipeline's
      progress -- when each deal entered each Status. Only unenriched fields of
      certain types track changes (person, organization, number, date, location
      and ranked dropdown); ask about one that does not and Affinity errors.
      For forward paging pass `changed_after`, `order_by: asc` and then
      `after_id`; all three are required together.
    category: fields.values
    read_only: true
    request:
      method: GET
      path: /field-value-changes
      query:
        field_id: "${field_id}"
        action_type: "${action_type}"
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        list_entry_id: "${list_entry_id}"
        changed_after: "${changed_after}"
        order_by: "${order_by}"
        after_id: "${after_id}"
        limit: "${limit}"
    input:
      field_id:
        type: integer
        description: The field whose history to read.
        example: 236333
      action_type:
        type: integer
        description: Only changes of this kind -- 0 create, 1 delete, 2 update.
        optional: true
        enum: [0, 1, 2]
      person_id:
        type: integer
        description: Narrow to one person. Give at most one of the four entity filters.
        optional: true
      organization_id:
        type: integer
        description: Narrow to one organization. Give at most one of the four entity filters.
        optional: true
      opportunity_id:
        type: integer
        description: Narrow to one opportunity. Give at most one of the four entity filters.
        optional: true
      list_entry_id:
        type: integer
        description: Narrow to one list entry. Give at most one of the four entity filters.
        optional: true
      changed_after:
        type: string
        description: >-
          Only changes at or after this UTC timestamp. Required when paging
          forward with `after_id`.
        optional: true
        example: "2024-01-03T08:00:00.000000Z"
      order_by:
        type: string
        description: Oldest first (`asc`) or newest first (`desc`, the default).
        optional: true
        enum: [asc, desc]
      after_id:
        type: integer
        description: >-
          Keyset cursor -- return only records after this one. Needs
          `changed_after` and `order_by: asc` alongside it, or Affinity returns 422.
        optional: true
      limit:
        type: integer
        description: How many changes to return.
        optional: true
        minimum: 1
    output:
      description: The field's change history, most recent first by default.
      type: array
      items: {type: object}

  # -- persons ---------------------------------------------------------------

  search_persons:
    title: Search people
    description: >-
      Find people by a fragment of an email address, first name or last name.
      Paged: pass the response's `next_page_token` back as `page_token`, keeping
      every other parameter identical or Affinity rejects the token. Set
      `with_interaction_dates` for first/last email, meeting and chat dates --
      which also drops anyone with no interactions from the results -- and
      `with_interaction_persons` alongside it for the colleagues involved.
    category: persons
    read_only: true
    request:
      method: GET
      path: /persons
      query:
        term: "${term}"
        with_interaction_dates: "${with_interaction_dates}"
        with_interaction_persons: "${with_interaction_persons}"
        with_opportunities: "${with_opportunities}"
        with_current_organizations: "${with_current_organizations}"
        min_last_email_date: "${min_last_email_date}"
        max_last_email_date: "${max_last_email_date}"
        min_last_event_date: "${min_last_event_date}"
        max_last_event_date: "${max_last_event_date}"
        min_next_event_date: "${min_next_event_date}"
        max_next_event_date: "${max_next_event_date}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      term:
        type: string
        description: >-
          Part of an email address, first name or last name. Omit to walk
          everyone.
        optional: true
        example: doe
      with_interaction_dates:
        type: boolean
        description: >-
          Include the most recent and upcoming interaction dates. People with no
          interactions drop out of the results when this is set.
        optional: true
      with_interaction_persons:
        type: boolean
        description: >-
          Include the internal people on each interaction. Only meaningful
          alongside `with_interaction_dates`.
        optional: true
      with_opportunities:
        type: boolean
        description: Include the ids of opportunities this person is on.
        optional: true
      with_current_organizations:
        type: boolean
        description: Include the ids of the person's current organizations.
        optional: true
      min_last_email_date:
        type: string
        description: Only people whose last email is at or after this ISO 8601 date.
        optional: true
      max_last_email_date:
        type: string
        description: Only people whose last email is at or before this ISO 8601 date.
        optional: true
      min_last_event_date:
        type: string
        description: Only people whose last meeting is at or after this ISO 8601 date.
        optional: true
      max_last_event_date:
        type: string
        description: Only people whose last meeting is at or before this ISO 8601 date.
        optional: true
      min_next_event_date:
        type: string
        description: Only people whose next meeting is at or after this ISO 8601 date.
        optional: true
      max_next_event_date:
        type: string
        description: Only people whose next meeting is at or before this ISO 8601 date.
        optional: true
      page_size:
        type: integer
        description: How many people per page.
        optional: true
        minimum: 1
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of people and the cursor for the next.
      type: object
      properties:
        persons: {type: array, description: "The matching people."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_person:
    title: Get a person
    description: >-
      One person with their emails, organizations and list entries. The
      `with_*` flags add the smart-field data that `list_field_values` cannot
      reach: interaction dates, the colleagues on those interactions, the
      person's opportunities and their current organizations.
    category: persons
    read_only: true
    request:
      method: GET
      path: /persons/${person_id}
      query:
        with_interaction_dates: "${with_interaction_dates}"
        with_interaction_persons: "${with_interaction_persons}"
        with_opportunities: "${with_opportunities}"
        with_current_organizations: "${with_current_organizations}"
    input:
      person_id:
        type: integer
        description: The person's id.
        example: 38706
      with_interaction_dates:
        type: boolean
        description: Include first/last email, meeting and chat dates.
        optional: true
      with_interaction_persons:
        type: boolean
        description: Include the internal people on each interaction, alongside `with_interaction_dates`.
        optional: true
      with_opportunities:
        type: boolean
        description: Include the ids of opportunities this person is on.
        optional: true
      with_current_organizations:
        type: boolean
        description: Include the ids of the person's current organizations.
        optional: true
    output:
      description: The person.
      type: object
      properties:
        id: {type: integer, description: "The person id."}
        emails: {type: array, description: "Every email address on the record."}
        organization_ids: {type: array, description: "Organizations the person is associated with."}
        list_entries: {type: array, description: "The rows this person appears on."}

  create_person:
    title: Create a person
    description: >-
      Add a person. `emails` is the deduplication key -- if any address already
      belongs to another person the whole request fails, so search first. Pass an
      empty array when you have no address. This creates the record only; putting
      them on a list is `create_list_entry`.
    category: persons
    request:
      method: POST
      path: /persons
      headers:
        Content-Type: application/json
      body:
        first_name: "${first_name}"
        last_name: "${last_name}"
        emails: "${emails}"
        organization_ids: "${organization_ids}"
    input:
      first_name:
        type: string
        description: The person's first name.
        example: Alice
      last_name:
        type: string
        description: The person's last name.
        example: Yen
      emails:
        type: array
        description: >-
          Their email addresses. Pass an empty array when there are none; an
          address already held by someone else fails the request.
        items: {type: string}
      organization_ids:
        type: array
        description: Organizations to associate them with.
        optional: true
        items: {type: integer}
    output:
      description: The person that was created.
      type: object
      properties:
        id: {type: integer, description: "The new person's id."}

  update_person:
    title: Update a person
    description: >-
      Change a person's name, emails or organizations. `emails` and
      `organization_ids` are replaced wholesale, not merged -- to add one
      address, read the person first and send the existing addresses alongside
      the new one, or you will silently drop the rest.
    category: persons
    request:
      method: PUT
      path: /persons/${person_id}
      headers:
        Content-Type: application/json
      body:
        first_name: "${first_name}"
        last_name: "${last_name}"
        emails: "${emails}"
        organization_ids: "${organization_ids}"
    input:
      person_id:
        type: integer
        description: The person to update.
        example: 860197
      first_name:
        type: string
        description: A new first name.
        optional: true
      last_name:
        type: string
        description: A new last name.
        optional: true
      emails:
        type: array
        description: The complete list of email addresses, replacing what is stored.
        optional: true
        items: {type: string}
      organization_ids:
        type: array
        description: The complete list of organizations, replacing what is stored.
        optional: true
        items: {type: integer}
    output:
      description: The person as they now stand.
      type: object
      properties:
        id: {type: integer, description: "The person id."}

  delete_person:
    title: Delete a person
    description: >-
      Remove a person and every field value attached to them, global and
      list-specific alike. Their list entries go with them. Not recoverable.
    category: persons
    destructive: true
    request:
      method: DELETE
      path: /persons/${person_id}
    input:
      person_id:
        type: integer
        description: The person to delete.
        example: 860197
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the person was deleted."}

  list_person_fields:
    title: List global person fields
    description: >-
      The fields that exist on every person regardless of list -- Location, Job
      Titles, Industries and any global custom ones. Use `list_fields` with a
      `list_id` for the list-specific columns instead.
    category: persons
    read_only: true
    request:
      method: GET
      path: /persons/fields
    input: {}
    output:
      description: The global person fields.
      type: array
      items: {type: object}

  # -- organizations ---------------------------------------------------------

  search_organizations:
    title: Search organizations
    description: >-
      Find organizations by part of a name or domain, paged the same way as
      `search_persons` -- `next_page_token` back as `page_token`, every other
      parameter unchanged. `with_interaction_dates` adds the interaction summary
      and drops organizations with no interactions from the results.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /organizations
      query:
        term: "${term}"
        with_interaction_dates: "${with_interaction_dates}"
        with_interaction_persons: "${with_interaction_persons}"
        with_opportunities: "${with_opportunities}"
        min_last_email_date: "${min_last_email_date}"
        max_last_email_date: "${max_last_email_date}"
        min_last_event_date: "${min_last_event_date}"
        max_last_event_date: "${max_last_event_date}"
        min_next_event_date: "${min_next_event_date}"
        max_next_event_date: "${max_next_event_date}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      term:
        type: string
        description: Part of an organization's name or domain. Omit to walk everything.
        optional: true
        example: affinity
      with_interaction_dates:
        type: boolean
        description: >-
          Include the most recent and upcoming interaction dates. Organizations
          with no interactions drop out of the results when this is set.
        optional: true
      with_interaction_persons:
        type: boolean
        description: Include the internal people on each interaction, alongside `with_interaction_dates`.
        optional: true
      with_opportunities:
        type: boolean
        description: Include the ids of opportunities on this organization.
        optional: true
      min_last_email_date:
        type: string
        description: Only organizations whose last email is at or after this ISO 8601 date.
        optional: true
      max_last_email_date:
        type: string
        description: Only organizations whose last email is at or before this ISO 8601 date.
        optional: true
      min_last_event_date:
        type: string
        description: Only organizations whose last meeting is at or after this ISO 8601 date.
        optional: true
      max_last_event_date:
        type: string
        description: Only organizations whose last meeting is at or before this ISO 8601 date.
        optional: true
      min_next_event_date:
        type: string
        description: Only organizations whose next meeting is at or after this ISO 8601 date.
        optional: true
      max_next_event_date:
        type: string
        description: Only organizations whose next meeting is at or before this ISO 8601 date.
        optional: true
      page_size:
        type: integer
        description: How many organizations per page.
        optional: true
        minimum: 1
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of organizations and the cursor for the next.
      type: object
      properties:
        organizations: {type: array, description: "The matching organizations."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_organization:
    title: Get an organization
    description: >-
      One organization with its domains, associated people, opportunities and
      list entries. `with_interaction_dates` adds the smart-field interaction
      summary that `list_field_values` cannot return.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /organizations/${organization_id}
      query:
        with_interaction_dates: "${with_interaction_dates}"
        with_interaction_persons: "${with_interaction_persons}"
        with_opportunities: "${with_opportunities}"
    input:
      organization_id:
        type: integer
        description: The organization's id.
        example: 64779194
      with_interaction_dates:
        type: boolean
        description: Include first/last email, meeting and chat dates.
        optional: true
      with_interaction_persons:
        type: boolean
        description: Include the internal people on each interaction, alongside `with_interaction_dates`.
        optional: true
      with_opportunities:
        type: boolean
        description: Include the ids of opportunities on this organization.
        optional: true
    output:
      description: The organization.
      type: object
      properties:
        id: {type: integer, description: "The organization id."}
        domains: {type: array, description: "Every website associated with it."}
        person_ids: {type: array, description: "People associated with it."}
        global: {type: boolean, description: "True when it comes from Affinity's global dataset rather than your team."}

  create_organization:
    title: Create an organization
    description: >-
      Add an organization. `domain` matters more than it looks: Affinity uses it
      to associate people with the organization automatically, so setting it is
      usually worth doing. Putting the organization on a list is a separate
      `create_list_entry` call.
    category: organizations
    request:
      method: POST
      path: /organizations
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        domain: "${domain}"
        person_ids: "${person_ids}"
    input:
      name:
        type: string
        description: The organization's name.
        example: Acme Corp
      domain:
        type: string
        description: >-
          The organization's website. Affinity matches people to the
          organization by their email domain, so this is worth setting.
        optional: true
        example: acme.co
      person_ids:
        type: array
        description: People to associate with it.
        optional: true
        items: {type: integer}
    output:
      description: The organization that was created.
      type: object
      properties:
        id: {type: integer, description: "The new organization's id."}

  update_organization:
    title: Update an organization
    description: >-
      Change an organization's name, domain or people. `person_ids` is replaced
      wholesale, so to add one contact you must send the existing ones too --
      otherwise the rest are dropped. A global organization from Affinity's own
      dataset cannot be edited this way.
    category: organizations
    request:
      method: PUT
      path: /organizations/${organization_id}
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        domain: "${domain}"
        person_ids: "${person_ids}"
    input:
      organization_id:
        type: integer
        description: The organization to update.
        example: 120611418
      name:
        type: string
        description: A new name.
        optional: true
      domain:
        type: string
        description: A new website domain.
        optional: true
      person_ids:
        type: array
        description: The complete list of associated people, replacing what is stored.
        optional: true
        items: {type: integer}
    output:
      description: The organization as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The organization id."}

  delete_organization:
    title: Delete an organization
    description: >-
      Remove an organization and every field value attached to it. Affinity
      refuses to delete a global organization -- one from its own dataset rather
      than your team's -- and says so.
    category: organizations
    destructive: true
    request:
      method: DELETE
      path: /organizations/${organization_id}
    input:
      organization_id:
        type: integer
        description: The organization to delete.
        example: 120611418
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the organization was deleted."}

  list_organization_fields:
    title: List global organization fields
    description: >-
      The fields that exist on every organization regardless of list -- Stage,
      Industry, Location and any global custom ones. For list-specific columns
      use `list_fields` with a `list_id` instead.
    category: organizations
    read_only: true
    request:
      method: GET
      path: /organizations/fields
    input: {}
    output:
      description: The global organization fields.
      type: array
      items: {type: object}

  # -- opportunities ---------------------------------------------------------

  search_opportunities:
    title: Search opportunities
    description: >-
      Find opportunities by part of their name, paged with `next_page_token`
      exactly as people and organizations are. An opportunity belongs to exactly
      one list, so its list membership is fixed at creation.
    category: opportunities
    read_only: true
    request:
      method: GET
      path: /opportunities
      query:
        term: "${term}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      term:
        type: string
        description: Part of an opportunity's name. Omit to walk everything.
        optional: true
        example: affinity
      page_size:
        type: integer
        description: How many opportunities per page.
        optional: true
        minimum: 1
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of opportunities and the cursor for the next.
      type: object
      properties:
        opportunities: {type: array, description: "The matching opportunities."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_opportunity:
    title: Get an opportunity
    description: >-
      One opportunity with the list it lives on and the people and organizations
      attached to it. Its pipeline data -- amount, stage, status -- lives in
      field values, so pair this with `list_field_values`.
    category: opportunities
    read_only: true
    request:
      method: GET
      path: /opportunities/${opportunity_id}
    input:
      opportunity_id:
        type: integer
        description: The opportunity's id.
        example: 117
    output:
      description: The opportunity.
      type: object
      properties:
        id: {type: integer, description: "The opportunity id."}
        list_id: {type: integer, description: "The one list it belongs to."}
        person_ids: {type: array, description: "People attached to it."}
        organization_ids: {type: array, description: "Organizations attached to it."}

  create_opportunity:
    title: Create an opportunity
    description: >-
      Create a deal and its row on an opportunity list in one call --
      `create_list_entry` cannot do this. `list_id` must name a list of type 8,
      and it is permanent: an opportunity cannot be moved between lists, and
      deleting its list entry deletes the opportunity. The response omits
      `person_ids` and `organization_ids` even when you supplied them.
    category: opportunities
    request:
      method: POST
      path: /opportunities
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        list_id: "${list_id}"
        person_ids: "${person_ids}"
        organization_ids: "${organization_ids}"
    input:
      name:
        type: string
        description: The opportunity's name.
        example: Acme Series A
      list_id:
        type: integer
        description: The opportunity list to create it on. Must be a list of type 8.
        example: 118
      person_ids:
        type: array
        description: People to attach -- your points of contact on the deal.
        optional: true
        items: {type: integer}
      organization_ids:
        type: array
        description: Organizations to attach.
        optional: true
        items: {type: integer}
    output:
      description: The opportunity that was created.
      type: object
      properties:
        id: {type: integer, description: "The new opportunity's id."}
        list_id: {type: integer, description: "The list it now lives on."}

  update_opportunity:
    title: Update an opportunity
    description: >-
      Rename an opportunity or change who is attached to it. `person_ids` and
      `organization_ids` replace what is stored rather than adding to it, so
      send the existing members alongside any new one. The list cannot be
      changed.
    category: opportunities
    request:
      method: PUT
      path: /opportunities/${opportunity_id}
      headers:
        Content-Type: application/json
      body:
        name: "${name}"
        person_ids: "${person_ids}"
        organization_ids: "${organization_ids}"
    input:
      opportunity_id:
        type: integer
        description: The opportunity to update.
        example: 120611418
      name:
        type: string
        description: A new name.
        optional: true
      person_ids:
        type: array
        description: The complete list of attached people, replacing what is stored.
        optional: true
        items: {type: integer}
      organization_ids:
        type: array
        description: The complete list of attached organizations, replacing what is stored.
        optional: true
        items: {type: integer}
    output:
      description: The opportunity as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The opportunity id."}

  delete_opportunity:
    title: Delete an opportunity
    description: >-
      Remove a deal and every field value on it. Because an opportunity exists
      only through its single list entry, this is also how you take one off a
      list -- there is no "remove from list" that keeps the opportunity alive.
    category: opportunities
    destructive: true
    request:
      method: DELETE
      path: /opportunities/${opportunity_id}
    input:
      opportunity_id:
        type: integer
        description: The opportunity to delete.
        example: 120611418
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the opportunity was deleted."}

  # -- interactions ----------------------------------------------------------

  list_interactions:
    title: List interactions
    description: >-
      Meetings, calls, chat messages and emails involving one person,
      organization or opportunity. Every call needs a `type` (one kind per
      request), a `start_time` and an `end_time` no more than a year apart, and
      exactly one of `person_id`, `organization_id` or `opportunity_id` -- and
      that person must be external, not a colleague. The response is keyed by
      the type's plural name (`emails`, `meetings`, …) plus `next_page_token`.
    category: interactions
    read_only: true
    request:
      method: GET
      path: /interactions
      query:
        type: "${type}"
        logging_type: "${logging_type}"
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        internal_person_id: "${internal_person_id}"
        direction: "${direction}"
        start_time: "${start_time}"
        end_time: "${end_time}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      type:
        type: integer
        description: >-
          Which kind of interaction -- 0 meeting, 1 call, 2 chat message, 3
          email. Only one kind per request.
        enum: [0, 1, 2, 3]
      start_time:
        type: string
        description: >-
          ISO 8601 start of the window. Must be before `end_time`, and the two
          must be within a year of each other.
        example: "2021-01-01T07:00:00Z"
      end_time:
        type: string
        description: ISO 8601 end of the window, after `start_time` and within a year of it.
        example: "2021-02-25T21:00:00Z"
      person_id:
        type: integer
        description: >-
          The external person involved. Give exactly one of person, organization
          or opportunity; an internal person here is an error.
        optional: true
      organization_id:
        type: integer
        description: The organization involved. Give exactly one of the three entity filters.
        optional: true
      opportunity_id:
        type: integer
        description: The opportunity involved. Give exactly one of the three entity filters.
        optional: true
      internal_person_id:
        type: integer
        description: >-
          Narrow the entity's interactions to those a particular colleague was
          part of. It cannot be used on its own to find all of their interactions.
        optional: true
      logging_type:
        type: integer
        description: 0 for both automatic and manual logging, 1 for manually logged only.
        optional: true
        enum: [0, 1]
      direction:
        type: integer
        description: >-
          0 sent by a colleague, 1 received from outside. Only meaningful for
          chat messages and emails.
        optional: true
        enum: [0, 1]
      page_size:
        type: integer
        description: How many interactions per page, up to 100.
        optional: true
        minimum: 1
        maximum: 100
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of interactions of the requested type.
      type: object
      properties:
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_interaction:
    title: Get an interaction
    description: >-
      One interaction. `type` is required alongside the id, because interaction
      ids are only unique within a type -- id 15326 is a different record for a
      meeting than for an email.
    category: interactions
    read_only: true
    request:
      method: GET
      path: /interactions/${interaction_id}
      query:
        type: "${type}"
    input:
      interaction_id:
        type: integer
        description: The interaction's id, unique only within its type.
        example: 15326
      type:
        type: integer
        description: Which kind it is -- 0 meeting, 1 call, 2 chat message, 3 email.
        enum: [0, 1, 2, 3]
    output:
      description: The interaction.
      type: object
      properties:
        id: {type: integer, description: "The interaction id."}
        persons: {type: array, description: "Everyone involved."}
        date: {type: string, description: "When it happened."}

  create_interaction:
    title: Log an interaction
    description: >-
      Record a meeting (`type` 0), a call (1) or a chat message (2) that
      happened outside Affinity. Emails cannot be created this way. At least one
      of `person_ids` must be an internal person -- a colleague -- or Affinity
      rejects it. The API key's owner is recorded as the creator.
    category: interactions
    request:
      method: POST
      path: /interactions
      headers:
        Content-Type: application/json
      body:
        type: "${type}"
        person_ids: "${person_ids}"
        content: "${content}"
        date: "${date}"
        direction: "${direction}"
    input:
      type:
        type: integer
        description: >-
          What happened -- 0 meeting, 1 call, 2 chat message. Emails cannot be
          created through the API.
        enum: [0, 1, 2]
      person_ids:
        type: array
        description: >-
          Everyone involved. At least one must be an internal person, or the
          request is rejected.
        items: {type: integer}
      content:
        type: string
        description: What the interaction was about.
        example: Intro call about the Series A.
      date:
        type: string
        description: ISO 8601 timestamp of when it happened.
        example: "2021-02-07T10:56:29.546-08:00"
      direction:
        type: integer
        description: >-
          0 sent by a colleague, 1 received from outside. Only applies to chat
          messages.
        optional: true
        enum: [0, 1]
    output:
      description: The interaction that was logged.
      type: object
      properties:
        id: {type: integer, description: "The new interaction's id, unique only within its type."}

  update_interaction:
    title: Update an interaction
    description: >-
      Change a logged interaction's content, attendees or date. `type` and
      `person_ids` must be sent every time, even when unchanged. Affinity
      refuses to rewrite content that contains @-mentions.
    category: interactions
    request:
      method: PUT
      path: /interactions/${interaction_id}
      headers:
        Content-Type: application/json
      body:
        type: "${type}"
        person_ids: "${person_ids}"
        content: "${content}"
        date: "${date}"
    input:
      interaction_id:
        type: integer
        description: The interaction to update.
        example: 3007
      type:
        type: integer
        description: Which kind it is -- 0 meeting, 1 call, 2 chat message, 3 email. Always required.
        enum: [0, 1, 2, 3]
      person_ids:
        type: array
        description: The people on the interaction. Required even when unchanged.
        items: {type: integer}
      content:
        type: string
        description: New content. Cannot be changed on an interaction containing mentions.
        optional: true
      date:
        type: string
        description: A new ISO 8601 timestamp for when it happened.
        optional: true
    output:
      description: The interaction as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The interaction id."}

  delete_interaction:
    title: Delete an interaction
    description: >-
      Remove a logged interaction. `type` is required alongside the id, since
      the id alone does not identify the record.
    category: interactions
    destructive: true
    request:
      method: DELETE
      path: /interactions/${interaction_id}
      query:
        type: "${type}"
    input:
      interaction_id:
        type: integer
        description: The interaction to delete.
        example: 22984
      type:
        type: integer
        description: Which kind it is -- 0 meeting, 1 call, 2 chat message, 3 email.
        enum: [0, 1, 2, 3]
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the interaction was deleted."}

  list_relationship_strengths:
    title: List relationship strengths
    description: >-
      How strongly each colleague knows one external person, as a number roughly
      between 0 and 1 derived from past emails, calls and meetings. Pass
      `external_id` alone to rank the whole team against that contact -- the
      usual "who should make the intro?" question -- or both ids for one pair.
      Recalculated about daily, and absent entirely for pairs with no history.
    category: interactions
    read_only: true
    request:
      method: GET
      path: /relationships-strengths
      query:
        external_id: "${external_id}"
        internal_id: "${internal_id}"
    input:
      external_id:
        type: integer
        description: The external person to measure the team against.
        example: 1234
      internal_id:
        type: integer
        description: Narrow to one colleague. Omit to get every colleague, ranked.
        optional: true
    output:
      description: One entry per (internal, external) pair that has any history.
      type: array
      items: {type: object}

  # -- notes -----------------------------------------------------------------

  list_notes:
    title: List notes
    description: >-
      Notes attached to a person, organization or opportunity, or authored by
      one user. A note reached a person either directly or by being taken on an
      interaction they attended, and both count here. Paged with
      `next_page_token`; page size defaults to its maximum of 500.
    category: notes
    read_only: true
    request:
      method: GET
      path: /notes
      query:
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        creator_id: "${creator_id}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      person_id:
        type: integer
        description: >-
          Notes on this person, including those taken on interactions they
          attended.
        optional: true
      organization_id:
        type: integer
        description: Notes attached directly to this organization.
        optional: true
      opportunity_id:
        type: integer
        description: Notes attached directly to this opportunity.
        optional: true
      creator_id:
        type: integer
        description: Notes written by this Affinity user.
        optional: true
      page_size:
        type: integer
        description: How many notes per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of notes and the cursor for the next.
      type: object
      properties:
        notes: {type: array, description: "The matching notes."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_note:
    title: Get a note
    description: >-
      One note with its content, author, the entities it is attached to and, when
      it was taken on an interaction, the interaction's id and type.
    category: notes
    read_only: true
    request:
      method: GET
      path: /notes/${note_id}
    input:
      note_id:
        type: integer
        description: The note's id.
        example: 22984
    output:
      description: The note.
      type: object
      properties:
        id: {type: integer, description: "The note id."}
        content: {type: string, description: "The note's body."}
        person_ids: {type: array, description: "People the note is tied to."}
        parent_id: {type: integer, description: "The note this one replies to, when it is a reply."}

  create_note:
    title: Create a note
    description: >-
      Write a note against one or more people, organizations or opportunities.
      At least one entity id, or a `parent_id` to reply to another note, is
      required. `type` 2 makes it HTML rather than plain text. When `parent_id`
      is given the entity ids are ignored -- a reply inherits its parent's
      attachments -- and a reply's parent must not itself be a reply.
    category: notes
    request:
      method: POST
      path: /notes
      headers:
        Content-Type: application/json
      body:
        content: "${content}"
        person_ids: "${person_ids}"
        organization_ids: "${organization_ids}"
        opportunity_ids: "${opportunity_ids}"
        type: "${type}"
        parent_id: "${parent_id}"
        creator_id: "${creator_id}"
        created_at: "${created_at}"
    input:
      content:
        type: string
        description: The note's body -- plain text, or HTML when `type` is 2.
        example: Had a lunch meeting with Jane today.
      person_ids:
        type: array
        description: >-
          People to attach the note to. At least one entity id or a `parent_id`
          is required; ignored when replying.
        optional: true
        items: {type: integer}
      organization_ids:
        type: array
        description: Organizations to attach the note to. Ignored when replying.
        optional: true
        items: {type: integer}
      opportunity_ids:
        type: array
        description: Opportunities to attach the note to. Ignored when replying.
        optional: true
        items: {type: integer}
      type:
        type: integer
        description: 0 for plain text (the default), 2 for HTML.
        optional: true
        enum: [0, 2]
      parent_id:
        type: integer
        description: >-
          The note this one replies to. The parent must be a top-level note, and
          supplying this makes the entity ids irrelevant.
        optional: true
      creator_id:
        type: integer
        description: >-
          Who to record as the author. Must be someone with Affinity access;
          defaults to the API key's owner.
        optional: true
      created_at:
        type: string
        description: >-
          ISO 8601 creation time to backdate the note to. Times in the future are
          rejected.
        optional: true
    output:
      description: The note that was created.
      type: object
      properties:
        id: {type: integer, description: "The new note's id."}

  update_note:
    title: Update a note
    description: >-
      Rewrite a note's content. Only the body can change -- not its type, not
      what it is attached to. Affinity refuses notes that contain @-mentions and
      notes that came from an email.
    category: notes
    request:
      method: PUT
      path: /notes/${note_id}
      headers:
        Content-Type: application/json
      body:
        content: "${content}"
    input:
      note_id:
        type: integer
        description: The note to rewrite.
        example: 22984
      content:
        type: string
        description: The new body.
        example: Updated after the follow-up call.
    output:
      description: The note as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The note id."}
        content: {type: string, description: "The stored body."}

  delete_note:
    title: Delete a note
    description: >-
      Remove a note. Only its creator may delete it; anyone else gets an error
      rather than a silent no-op.
    category: notes
    destructive: true
    request:
      method: DELETE
      path: /notes/${note_id}
    input:
      note_id:
        type: integer
        description: The note to delete.
        example: 22984
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the note was deleted."}

  # -- entity files ----------------------------------------------------------

  list_entity_files:
    title: List entity files
    description: >-
      Files attached to entities across the account -- a pitch deck on an
      opportunity, correspondence on a person. Narrow to one entity with
      `person_id`, `organization_id` or `opportunity_id`. Paged with
      `next_page_token`; page size defaults to its maximum of 500.
    category: files
    read_only: true
    request:
      method: GET
      path: /entity-files
      query:
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      person_id:
        type: integer
        description: Only files attached to this person.
        optional: true
      organization_id:
        type: integer
        description: Only files attached to this organization.
        optional: true
      opportunity_id:
        type: integer
        description: Only files attached to this opportunity.
        optional: true
      page_size:
        type: integer
        description: How many files per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of entity files and the cursor for the next.
      type: object
      properties:
        entity_files: {type: array, description: "The matching files, each with id, name, size and the entity it hangs off."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_entity_file:
    title: Get an entity file
    description: >-
      One file's metadata -- its name, size, uploader and the entity it is
      attached to. This does not return the bytes; `download_entity_file` does.
    category: files
    read_only: true
    request:
      method: GET
      path: /entity-files/${entity_file_id}
    input:
      entity_file_id:
        type: integer
        description: The file's id.
        example: 43212
    output:
      description: The file's metadata.
      type: object
      properties:
        id: {type: integer, description: "The file id."}
        name: {type: string, description: "The file's name."}
        size: {type: integer, description: "Its size in bytes."}

  download_entity_file:
    title: Download an entity file
    description: >-
      Fetch a file's actual contents. Affinity answers with a redirect to
      short-lived storage rather than the bytes themselves, so the caller has to
      follow it; `get_entity_file` is the tool to reach for when you only want
      the metadata.
    category: files
    read_only: true
    request:
      method: GET
      path: /entity-files/download/${entity_file_id}
    input:
      entity_file_id:
        type: integer
        description: The file to download.
        example: 12345
    output:
      description: The file's contents, reached through a redirect to storage.
      type: string

  # -- reminders -------------------------------------------------------------

  list_reminders:
    title: List reminders
    description: >-
      Reminders across the account, filtered by the entity they are tagged to,
      by who created, owns or completed them, by `status` (0 completed, 1 active,
      2 overdue) or by due date. Overdue reminders for one owner is the common
      query. Paged with `next_page_token`; page size defaults to its maximum of 500.
    category: reminders
    read_only: true
    request:
      method: GET
      path: /reminders
      query:
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        creator_id: "${creator_id}"
        owner_id: "${owner_id}"
        completer_id: "${completer_id}"
        type: "${type}"
        reset_type: "${reset_type}"
        status: "${status}"
        due_before: "${due_before}"
        due_after: "${due_after}"
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      person_id:
        type: integer
        description: Only reminders tagged to this person.
        optional: true
      organization_id:
        type: integer
        description: Only reminders tagged to this organization.
        optional: true
      opportunity_id:
        type: integer
        description: Only reminders tagged to this opportunity.
        optional: true
      creator_id:
        type: integer
        description: Only reminders created by this colleague.
        optional: true
      owner_id:
        type: integer
        description: Only reminders assigned to this colleague.
        optional: true
      completer_id:
        type: integer
        description: Only reminders completed by this colleague.
        optional: true
      type:
        type: integer
        description: 0 one-time, 1 recurring.
        optional: true
        enum: [0, 1]
      reset_type:
        type: integer
        description: >-
          For recurring reminders, what resets them -- 0 any interaction, 1 an
          email, 2 a meeting.
        optional: true
        enum: [0, 1, 2]
      status:
        type: integer
        description: 0 completed, 1 active, 2 overdue.
        optional: true
        enum: [0, 1, 2]
      due_before:
        type: string
        description: Only reminders due at or before this ISO 8601 date.
        optional: true
      due_after:
        type: string
        description: Only reminders due at or after this ISO 8601 date.
        optional: true
      page_size:
        type: integer
        description: How many reminders per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
      page_token:
        type: string
        description: The `next_page_token` from the previous page.
        optional: true
    output:
      description: A page of reminders and the cursor for the next.
      type: object
      properties:
        reminders: {type: array, description: "The matching reminders, with creator, owner and status."}
        next_page_token: {type: string, description: "Pass back as page_token; null when exhausted."}

  get_reminder:
    title: Get a reminder
    description: >-
      One reminder with its content, owner, creator, due date and status, plus
      the entity it is tagged to.
    category: reminders
    read_only: true
    request:
      method: GET
      path: /reminders/${reminder_id}
    input:
      reminder_id:
        type: integer
        description: The reminder's id.
        example: 15326
    output:
      description: The reminder.
      type: object
      properties:
        id: {type: integer, description: "The reminder id."}
        status: {type: integer, description: "0 completed, 1 active, 2 overdue."}
        due_date: {type: string, description: "When it falls due."}

  create_reminder:
    title: Create a reminder
    description: >-
      Assign a follow-up to a colleague. A one-time reminder (`type` 0) needs a
      `due_date`; a recurring one (`type` 1) needs `reset_type` and
      `reminder_days` instead, and comes back round that many days after each
      completion. At most one of the three entity ids may be tagged. The API
      key's owner is recorded as the creator.
    category: reminders
    request:
      method: POST
      path: /reminders
      headers:
        Content-Type: application/json
      body:
        owner_id: "${owner_id}"
        type: "${type}"
        content: "${content}"
        due_date: "${due_date}"
        reset_type: "${reset_type}"
        reminder_days: "${reminder_days}"
        person_id: "${person_id}"
        organization_id: "${organization_id}"
        opportunity_id: "${opportunity_id}"
        is_completed: "${is_completed}"
    input:
      owner_id:
        type: integer
        description: The colleague the reminder is assigned to.
        example: 443
      type:
        type: integer
        description: 0 one-time, which needs `due_date`; 1 recurring, which needs `reset_type` and `reminder_days`.
        enum: [0, 1]
      content:
        type: string
        description: What the reminder says.
        optional: true
        example: Follow up on the term sheet.
      due_date:
        type: string
        description: ISO 8601 due date. Required for a one-time reminder.
        optional: true
        example: "2021-11-30"
      reset_type:
        type: integer
        description: >-
          What resets a recurring reminder -- 0 any interaction, 1 an email, 2 a
          meeting. Required when `type` is 1.
        optional: true
        enum: [0, 1, 2]
      reminder_days:
        type: integer
        description: >-
          How many days after completion a recurring reminder falls due again.
          Required when `type` is 1.
        optional: true
        minimum: 1
      person_id:
        type: integer
        description: Tag the reminder to this person. At most one entity may be tagged.
        optional: true
      organization_id:
        type: integer
        description: Tag the reminder to this organization. At most one entity may be tagged.
        optional: true
      opportunity_id:
        type: integer
        description: Tag the reminder to this opportunity. At most one entity may be tagged.
        optional: true
      is_completed:
        type: boolean
        description: Create it already marked complete.
        optional: true
    output:
      description: The reminder that was created.
      type: object
      properties:
        id: {type: integer, description: "The new reminder's id."}

  update_reminder:
    title: Update a reminder
    description: >-
      Change a reminder's content, owner, schedule, or mark it complete --
      `is_completed` true is how a reminder gets closed, and on a recurring one
      that starts the next cycle. The entity it is tagged to cannot be changed.
    category: reminders
    request:
      method: PUT
      path: /reminders/${reminder_id}
      headers:
        Content-Type: application/json
      body:
        owner_id: "${owner_id}"
        content: "${content}"
        type: "${type}"
        reset_type: "${reset_type}"
        due_date: "${due_date}"
        reminder_days: "${reminder_days}"
        is_completed: "${is_completed}"
    input:
      reminder_id:
        type: integer
        description: The reminder to update.
        example: 15385
      owner_id:
        type: integer
        description: Reassign the reminder to this colleague.
        optional: true
      content:
        type: string
        description: New content.
        optional: true
      type:
        type: integer
        description: 0 one-time, 1 recurring.
        optional: true
        enum: [0, 1]
      reset_type:
        type: integer
        description: What resets a recurring reminder -- 0 any interaction, 1 an email, 2 a meeting.
        optional: true
        enum: [0, 1, 2]
      due_date:
        type: string
        description: A new ISO 8601 due date. Required when `type` is 0.
        optional: true
      reminder_days:
        type: integer
        description: Days after completion before a recurring reminder is due again.
        optional: true
        minimum: 1
      is_completed:
        type: boolean
        description: Mark the reminder complete, or reopen it.
        optional: true
    output:
      description: The reminder as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The reminder id."}
        status: {type: integer, description: "0 completed, 1 active, 2 overdue."}

  delete_reminder:
    title: Delete a reminder
    description: >-
      Remove a reminder outright. To close one without losing it, set
      `is_completed` through `update_reminder` instead.
    category: reminders
    destructive: true
    request:
      method: DELETE
      path: /reminders/${reminder_id}
    input:
      reminder_id:
        type: integer
        description: The reminder to delete.
        example: 22984
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the reminder was deleted."}

  # -- webhooks --------------------------------------------------------------

  list_webhook_subscriptions:
    title: List webhook subscriptions
    description: >-
      Every webhook subscription on the Affinity instance, with the url each
      posts to, the events each is subscribed to and whether it is disabled.
      There is a hard limit of three per instance, so read this before creating
      another.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /webhook
    input: {}
    output:
      description: The instance's webhook subscriptions.
      type: array
      items: {type: object}

  get_webhook_subscription:
    title: Get a webhook subscription
    description: >-
      One subscription -- its target url, the events it listens for, its
      creator and whether it is currently disabled.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /webhook/${webhook_subscription_id}
    input:
      webhook_subscription_id:
        type: integer
        description: The subscription's id.
        example: 1234
    output:
      description: The webhook subscription.
      type: object
      properties:
        id: {type: integer, description: "The subscription id."}
        webhook_url: {type: string, description: "Where events are posted."}
        subscriptions: {type: array, description: "The event names it listens for."}
        disabled: {type: boolean, description: "Whether delivery is paused."}

  create_webhook_subscription:
    title: Create a webhook subscription
    description: >-
      Point Affinity at a url and start receiving events -- list created, field
      value updated, person deleted and so on. Leave `subscriptions` out, or pass
      an empty array, to receive every event. Affinity calls the url as it
      creates the subscription and fails the request if it does not answer
      properly, and an instance may hold at most three subscriptions.
    category: webhooks
    request:
      method: POST
      path: /webhook/subscribe
      headers:
        Content-Type: application/json
      body:
        webhook_url: "${webhook_url}"
        subscriptions: "${subscriptions}"
    input:
      webhook_url:
        type: string
        description: >-
          Where to post events. It must answer Affinity's verifying call, or the
          subscription is not created.
        example: https://example.com/affinity/webhook
      subscriptions:
        type: array
        description: >-
          Which events to receive, by name. Omit for all of them.
        optional: true
        items: {type: string}
    output:
      description: The subscription that was created.
      type: object
      properties:
        id: {type: integer, description: "The new subscription's id."}

  update_webhook_subscription:
    title: Update a webhook subscription
    description: >-
      Change where events go, which events they are, or pause delivery with
      `disabled`. Only the subscription's creator may update it, and the new url
      must answer Affinity's verifying call.
    category: webhooks
    request:
      method: PUT
      path: /webhook/${webhook_subscription_id}
      headers:
        Content-Type: application/json
      body:
        webhook_url: "${webhook_url}"
        subscriptions: "${subscriptions}"
        disabled: "${disabled}"
    input:
      webhook_subscription_id:
        type: integer
        description: The subscription to update.
        example: 1234
      webhook_url:
        type: string
        description: A new target url, which must answer Affinity's verifying call.
        optional: true
      subscriptions:
        type: array
        description: The events to receive, by name. An empty array means all of them.
        optional: true
        items: {type: string}
      disabled:
        type: boolean
        description: True to pause delivery, false to resume it.
        optional: true
    output:
      description: The subscription as it now stands.
      type: object
      properties:
        id: {type: integer, description: "The subscription id."}
        disabled: {type: boolean, description: "Whether delivery is paused."}

  delete_webhook_subscription:
    title: Delete a webhook subscription
    description: >-
      Stop delivering events to an endpoint and remove the subscription. Only
      its creator or an admin may do this; to keep it but pause it, set
      `disabled` through `update_webhook_subscription`.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /webhook/${webhook_subscription_id}
    input:
      webhook_subscription_id:
        type: integer
        description: The subscription to delete.
        example: 1234
    output:
      description: Affinity's confirmation.
      type: object
      properties:
        success: {type: boolean, description: "True when the subscription was removed."}
