# Google Play Developer API tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# The whole Android Publisher v3 surface: edits and everything inside them
# (APKs, bundles, tracks, listings, images, testers, expansion files, country
# availability), plus in-app products, subscriptions and base plans, orders,
# purchases and voided purchases, reviews, app recovery, device tier configs,
# external transactions, generated apks and the Play Grouping API.
#
# The part that surprises people is **edits**. You cannot change a listing or
# roll out a release directly. You open an edit with `insert_edit`, make your
# changes against its id, then `commit_edit` -- and nothing takes effect until
# that commit. An edit left uncommitted simply expires, which makes
# `validate_edit` a safe rehearsal.
#
# The connector's own base url (play.googleapis.com) does not serve these
# routes, so each tool addresses androidpublisher.googleapis.com.
#
# Docs: https://developers.google.com/android-publisher/api-ref/rest

connector_id: google-play
display_name: Google Play
docs_url: https://developers.google.com/android-publisher
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  data_safety_application:
    title: Data safety application
    description: Writes the Safety Labels declaration of an app.
    category: applications
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/dataSafety
      base_url_override: https://androidpublisher.googleapis.com
      body:
        safetyLabels: ${safety_labels}
    input:
      package_name:
        type: string
        description: Required. Package name of the app.
      safety_labels:
        type: string
        description: Required. Contents of the CSV file containing Data Safety responses. For the format
          of this file, see the Help Center documentation at https://support.google.com/googleplay/android-developer/answer/10787469?#zippy=%2Cunderstand-the-csv-format
          To download an up to date template, follow the steps at h
        optional: true
    output:
      description: The SafetyLabelsUpdateResponse resource.
      type: object
    scopes:
    - androidpublisher
  create_device_tier_config:
    title: Create device tier config
    description: Creates a new device tier config for an app.
    category: applications
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/deviceTierConfigs
      base_url_override: https://androidpublisher.googleapis.com
      query:
        allowUnknownDevices: ${allow_unknown_devices}
      body:
        deviceGroups: ${device_groups}
        userCountrySets: ${user_country_sets}
        deviceTierSet: ${device_tier_set}
    input:
      package_name:
        type: string
        description: Package name of the app.
      allow_unknown_devices:
        type: boolean
        description: Whether the service should accept device IDs that are unknown to Play's device catalog.
        optional: true
      device_groups:
        type: array
        items:
          type: string
        description: Definition of device groups for the app.
        optional: true
      user_country_sets:
        type: array
        items:
          type: string
        description: Definition of user country sets for the app.
        optional: true
      device_tier_set:
        type: string
        description: Definition of the set of device tiers for the app.
        optional: true
    output:
      description: The DeviceTierConfig resource.
      type: object
    scopes:
    - androidpublisher
  get_device_tier_config:
    title: Get device tier config
    description: Returns a particular device tier config.
    category: applications
    request:
      method: GET
      path: /androidpublisher/v3/applications/${package_name}/deviceTierConfigs/${device_tier_config_id}
      base_url_override: https://androidpublisher.googleapis.com
    input:
      device_tier_config_id:
        type: string
        description: Required. Id of an existing device tier config.
      package_name:
        type: string
        description: Package name of the app.
    output:
      description: The DeviceTierConfig resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  list_device_tier_configs:
    title: List device tier configs
    description: Returns created device tier configs, ordered by descending creation time.
    category: applications
    request:
      method: GET
      path: /androidpublisher/v3/applications/${package_name}/deviceTierConfigs
      base_url_override: https://androidpublisher.googleapis.com
      query:
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      package_name:
        type: string
        description: Package name of the app.
      page_size:
        type: integer
        description: The maximum number of device tier configs to return. The service may return fewer
          than this value. If unspecified, at most 10 device tier configs will be returned. The maximum
          value for this field is 100; values above 100 will be coerced to 100. Device tier configs will
          be ordered by descending crea
        optional: true
      page_token:
        type: string
        description: A page token, received from a previous ListDeviceTierConfigs call. Provide this to
          retrieve the subsequent page.
        optional: true
    output:
      description: The ListDeviceTierConfigsResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  list_releases:
    title: List releases
    description: Returns the list of all releases for a given track. This excludes any releases that are
      obsolete.
    category: applications
    request:
      method: GET
      path: /androidpublisher/v3/${parent}/releases
      base_url_override: https://androidpublisher.googleapis.com
    input:
      parent:
        type: string
        description: 'Required. The parent track, which owns this collection of releases. Format: applications/{package_name}/tracks/{track}'
    output:
      description: The ListReleaseSummariesResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  add_targeting_apprecovery:
    title: Add targeting apprecovery
    description: Incrementally update targeting for a recovery action. Note that only the criteria selected
      during the creation of recovery action can be expanded.
    category: apprecovery
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/appRecoveries/${app_recovery_id}:addTargeting
      base_url_override: https://androidpublisher.googleapis.com
      body:
        targetingUpdate: ${targeting_update}
    input:
      app_recovery_id:
        type: string
        description: Required. ID corresponding to the app recovery action.
      package_name:
        type: string
        description: Required. Package name of the app for which recovery action is to be updated.
      targeting_update:
        type: string
        description: Specifies targeting updates such as regions, android sdk versions etc.
        optional: true
    output:
      description: The AddTargetingResponse resource.
      type: object
    scopes:
    - androidpublisher
  cancel_apprecovery:
    title: Cancel apprecovery
    description: Cancel an already executing app recovery action. Note that this action changes status
      of the recovery action to CANCELED.
    category: apprecovery
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/appRecoveries/${app_recovery_id}:cancel
      base_url_override: https://androidpublisher.googleapis.com
      body: ${body}
    input:
      app_recovery_id:
        type: string
        description: Required. ID corresponding to the app recovery action.
      package_name:
        type: string
        description: Required. Package name of the app for which recovery action cancellation is requested.
      body:
        type: object
        description: The CancelAppRecoveryRequest resource, as the API's own reference defines it.
    output:
      description: The CancelAppRecoveryResponse resource.
      type: object
    scopes:
    - androidpublisher
  create_apprecovery:
    title: Create apprecovery
    description: Create an app recovery action with recovery status as DRAFT. Note that this action does
      not execute the recovery action.
    category: apprecovery
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/appRecoveries
      base_url_override: https://androidpublisher.googleapis.com
      body:
        targeting: ${targeting}
        remoteInAppUpdate: ${remote_in_app_update}
    input:
      package_name:
        type: string
        description: Required. Package name of the app on which recovery action is performed.
      targeting:
        type: string
        description: Specifies targeting criteria for the recovery action such as regions, android sdk
          versions, app versions etc.
        optional: true
      remote_in_app_update:
        type: string
        description: Action type is remote in-app update. As a consequence of this action, a downloadable
          recovery module is also created for testing purposes.
        optional: true
    output:
      description: The AppRecoveryAction resource.
      type: object
    scopes:
    - androidpublisher
  deploy_apprecovery:
    title: Deploy apprecovery
    description: Deploy an already created app recovery action with recovery status DRAFT. Note that this
      action activates the recovery action for all targeted users and changes its status to ACTIVE.
    category: apprecovery
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/appRecoveries/${app_recovery_id}:deploy
      base_url_override: https://androidpublisher.googleapis.com
      body: ${body}
    input:
      app_recovery_id:
        type: string
        description: Required. ID corresponding to the app recovery action to deploy.
      package_name:
        type: string
        description: Required. Package name of the app for which recovery action is deployed.
      body:
        type: object
        description: The DeployAppRecoveryRequest resource, as the API's own reference defines it.
    output:
      description: The DeployAppRecoveryResponse resource.
      type: object
    scopes:
    - androidpublisher
  list_apprecovery:
    title: List apprecovery
    description: List all app recovery action resources associated with a particular package name and
      app version.
    category: apprecovery
    request:
      method: GET
      path: /androidpublisher/v3/applications/${package_name}/appRecoveries
      base_url_override: https://androidpublisher.googleapis.com
      query:
        versionCode: ${version_code}
    input:
      package_name:
        type: string
        description: Required. Package name of the app for which list of recovery actions is requested.
      version_code:
        type: string
        description: Required. Version code targeted by the list of recovery actions.
        optional: true
    output:
      description: The ListAppRecoveriesResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  enroll_app_appsigning:
    title: Enroll app appsigning
    description: 'Enrolls an app in Play App Signing using a self-hosted Google Cloud KMS key. Warning:
      Do not use this method for standard Play App Signing enrollment. * Standard enrollment with Google-generated
      or Google-managed keys cannot be done via API. * This advanced API is strictly for enterprise organizations
      with mandatory compliance, regulatory, or policy requirements to retain key custody in an external
      Google Cloud KMS i'
    category: appsigning
    request:
      method: POST
      path: /androidpublisher/v3/applications/${name}/appSigning:enrollApp
      base_url_override: https://androidpublisher.googleapis.com
      body:
        enrollNewApp: ${enroll_new_app}
        enrollExistingApp: ${enroll_existing_app}
        pemUploadCertificate: ${pem_upload_certificate}
    input:
      name:
        type: string
        description: Required. Either package name or app ID of the app enrolling in Play Signing.
      enroll_new_app:
        type: string
        description: Changes the signing key of a new app to an external Cloud KMS key. The app must not
          have published to Open testing or Production tracks.
        optional: true
      enroll_existing_app:
        type: string
        description: Enrolls an existing app into Play signing using an external Cloud KMS key.
        optional: true
      pem_upload_certificate:
        type: string
        description: The certificate associated with the upload key, in PEM format.
        optional: true
    output:
      description: The EnrollAppResponse resource.
      type: object
    scopes:
    - androidpublisher
  rotate_app_signing_key_appsigning:
    title: Rotate app signing key appsigning
    description: 'Rotates an app''s signing key to a new self-hosted Google Cloud KMS key. Warning: This
      method only applies to apps enrolled with self-hosted Cloud KMS keys. For apps using standard Google-managed
      Play App Signing, key rotation requests must be initiated through the Google Play Console UI. See
      Help Center: https://support.google.com/googleplay/android-developer/answer/9842756'
    category: appsigning
    request:
      method: POST
      path: /androidpublisher/v3/applications/${name}/appSigning:rotateAppSigningKey
      base_url_override: https://androidpublisher.googleapis.com
      body:
        keyRotationReason: ${key_rotation_reason}
        rotatedCloudKmsKey: ${rotated_cloud_kms_key}
    input:
      name:
        type: string
        description: Required. Either package name or app ID of the app rotating the signing key.
      key_rotation_reason:
        type: string
        description: Required. Reason for rotating the app key.
        optional: true
        enum:
        - KEY_ROTATION_REASON_UNSPECIFIED
        - COMPROMISED_KEY
        - USE_STRONGER_KEY
        - USE_SAME_KEY_FOR_MULTIPLE_APPS
        - ROUTINE_KEY_UPGRADE
        - OTHER
      rotated_cloud_kms_key:
        type: string
        description: Required. Self-hosted Cloud KMS key.
        optional: true
    output:
      description: The RotateAppSigningKeyResponse resource.
      type: object
    scopes:
    - androidpublisher
  createappstorehostedapp_appstoreappsreview:
    title: Createappstorehostedapp appstoreappsreview
    description: Creates an app store hosted app. This must be called before any other RPCs for this hosted
      app.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps:create
      base_url_override: https://androidpublisher.googleapis.com
      body:
        packageName: ${package_name}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      package_name:
        type: string
        description: Required. Package name of the app.
        optional: true
    output:
      description: The CreateAppStoreHostedAppResponse resource.
      type: object
    scopes:
    - androidpublisher
  updateappstorehostedapp_appstoreappsreview:
    title: Updateappstorehostedapp appstoreappsreview
    description: Updates details for an app hosted on an app store. Use this to provide details for a
      new app, or to update details for an existing app. The update will be sent for review immediately
      after creation.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps:update
      base_url_override: https://androidpublisher.googleapis.com
      body:
        activeApks: ${active_apks}
        appDetails: ${app_details}
        packageName: ${package_name}
        activeLocalizedStoreListings: ${active_localized_store_listings}
        policyDeclarations: ${policy_declarations}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      active_apks:
        type: string
        description: Required. Actively distributed APKs of the app.
        optional: true
      app_details:
        type: string
        description: Required. General developer details for the app.
        optional: true
      package_name:
        type: string
        description: Required. Package name of the app.
        optional: true
      active_localized_store_listings:
        type: array
        items:
          type: string
        description: Required. Localized store listings details of the update.
        optional: true
      policy_declarations:
        type: array
        items:
          type: string
        description: Required. Policy declarations provided for the app.
        optional: true
    output:
      description: The UpdateAppStoreHostedAppResponse resource.
      type: object
    scopes:
    - androidpublisher
  updateappstorehostedapppublishstatus_appstoreappsreview:
    title: Updateappstorehostedapppublishstatus appstoreappsreview
    description: Updates the publish status of an app store hosted app. The default state after calling
      UpdateAppStoreHostedApp is PUBLISHED. It is not necessary to call this RPC explicitly to set an
      app to PUBLISHED.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps/${package_name}:updateAppStoreHostedAppPublishStatus
      base_url_override: https://androidpublisher.googleapis.com
      body:
        publishState: ${publish_state}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      package_name:
        type: string
        description: Required. Package name of the app.
      publish_state:
        type: string
        description: Required. The new publish state for the hosted app.
        optional: true
        enum:
        - APP_STORE_APP_PUBLISH_STATE_UNSPECIFIED
        - APP_STORE_APP_PUBLISH_STATE_PUBLISHED
        - APP_STORE_APP_PUBLISH_STATE_UNPUBLISHED
    output:
      description: The UpdateAppStoreHostedAppPublishStatusResponse resource.
      type: object
    scopes:
    - androidpublisher
  uploadapk_appstoreappsreview:
    title: Uploadapk appstoreappsreview
    description: Upload an APK file for the hosted app. Returns an ID to track this APK.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps/${package_name}/apks:upload
      base_url_override: https://androidpublisher.googleapis.com
      body: ${body}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      package_name:
        type: string
        description: Required. Package name of the app.
      body:
        type: object
        description: The UploadApkRequest resource, as the API's own reference defines it.
    output:
      description: The UploadApkResponse resource.
      type: object
    scopes:
    - androidpublisher
  uploadappstoreapppolicydeclarationfile_appstoreappsreview:
    title: Uploadappstoreapppolicydeclarationfile appstoreappsreview
    description: Upload a policy declaration file for the hosted app. Returns an ID to track the file.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps/${package_name}/policyDeclarationFiles:upload
      base_url_override: https://androidpublisher.googleapis.com
      body:
        fileType: ${file_type}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      package_name:
        type: string
        description: Required. Package name of the app.
      file_type:
        type: string
        description: Required. Type of the policy declaration file.
        optional: true
        enum:
        - DECLARATION_FILE_TYPE_UNSPECIFIED
        - DECLARATION_FILE_TYPE_DOCUMENT
    output:
      description: The UploadAppStoreAppPolicyDeclarationFileResponse resource.
      type: object
    scopes:
    - androidpublisher
  uploadimage_appstoreappsreview:
    title: Uploadimage appstoreappsreview
    description: Upload a screenshot or app icon for the hosted app. Returns an ID to track the image.
    category: appstoreappsreview
    request:
      method: POST
      path: /androidpublisher/v3/appstore/${app_store_package_name}/apps/${package_name}/images:upload
      base_url_override: https://androidpublisher.googleapis.com
      body: ${body}
    input:
      app_store_package_name:
        type: string
        description: Required. Package name of the third-party app store.
      package_name:
        type: string
        description: Required. Package name of the app.
      body:
        type: object
        description: The UploadImageRequest resource, as the API's own reference defines it.
    output:
      description: The UploadImageResponse resource.
      type: object
    scopes:
    - androidpublisher
  get_recentappview:
    title: Get recentappview
    description: Returns metadata about a recently updated app.
    category: appstorecatalog
    request:
      method: GET
      path: /androidpublisher/v3/appstorecatalog/${app_store_package_name}/recentAppViews/${play_app_package_name}
      base_url_override: https://androidpublisher.googleapis.com
    input:
      app_store_package_name:
        type: string
        description: Required. The package name of the app store on behalf of which the request is made.
      play_app_package_name:
        type: string
        description: Required. The package name of the requested Play app.
    output:
      description: The RecentAppView resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  list_recentupdateevents:
    title: List recentupdateevents
    description: Lists update events for eligible apps in the given time range.
    category: appstorecatalog
    request:
      method: GET
      path: /androidpublisher/v3/appstorecatalog/${app_store_package_name}/recentUpdateEvents
      base_url_override: https://androidpublisher.googleapis.com
      query:
        endTime: ${end_time}
        pageSize: ${page_size}
        pageToken: ${page_token}
        startTime: ${start_time}
    input:
      app_store_package_name:
        type: string
        description: Required. The package name of the app store on behalf of which the request is made.
      end_time:
        type: string
        description: Required. The end time of the range (exclusive).
        optional: true
      page_size:
        type: integer
        description: Optional. The maximum number of update events to return. The service may return fewer
          than this value. If unspecified, at most 100 update events will be returned. The maximum value
          is 1000; values above 1000 will be coerced to 1000.
        optional: true
      page_token:
        type: string
        description: Optional. A page token, received from a previous ListRecentUpdateEvents call. Provide
          this to retrieve the subsequent page. When paginating, all other parameters provided to ListRecentUpdateEvents
          must match the call that provided the page token.
        optional: true
      start_time:
        type: string
        description: Required. The start time of the range (inclusive).
        optional: true
    output:
      description: The ListRecentUpdateEventsResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  addexternallyhosted_apk:
    title: Addexternallyhosted apk
    description: Creates a new APK without uploading the APK itself to Google Play, instead hosting the
      APK at a specified URL. This function is only available to organizations using Managed Play whose
      application is configured to restrict distribution to the organizations.
    category: edits
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/edits/${edit_id}/apks/externallyHosted
      base_url_override: https://androidpublisher.googleapis.com
      body:
        externallyHostedApk: ${externally_hosted_apk}
    input:
      edit_id:
        type: string
        description: Identifier of the edit.
      package_name:
        type: string
        description: Package name of the app.
      externally_hosted_apk:
        type: string
        description: The definition of the externally-hosted APK and where it is located.
        optional: true
    output:
      description: The ApksAddExternallyHostedResponse resource.
      type: object
    scopes:
    - androidpublisher
  list_apks:
    title: List apks
    description: Lists all current APKs of the app and edit.
    category: edits
    request:
      method: GET
      path: /androidpublisher/v3/applications/${package_name}/edits/${edit_id}/apks
      base_url_override: https://androidpublisher.googleapis.com
    input:
      edit_id:
        type: string
        description: Identifier of the edit.
      package_name:
        type: string
        description: Package name of the app.
    output:
      description: The ApksListResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  upload_apk:
    title: Upload apk
    description: Uploads an APK and adds to the current edit.
    category: edits
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/edits/${edit_id}/apks
      base_url_override: https://androidpublisher.googleapis.com
    input:
      edit_id:
        type: string
        description: Identifier of the edit.
      package_name:
        type: string
        description: Package name of the app.
    output:
      description: The Apk resource.
      type: object
    scopes:
    - androidpublisher
  list_bundles:
    title: List bundles
    description: Lists all current Android App Bundles of the app and edit.
    category: edits
    request:
      method: GET
      path: /androidpublisher/v3/applications/${package_name}/edits/${edit_id}/bundles
      base_url_override: https://androidpublisher.googleapis.com
    input:
      edit_id:
        type: string
        description: Identifier of the edit.
      package_name:
        type: string
        description: Package name of the app.
    output:
      description: The BundlesListResponse resource.
      type: object
    scopes:
    - androidpublisher
    read_only: true
  upload_bundle:
    title: Upload bundle
    description: Uploads a new Android App Bundle to this edit. If you are using the Google API client
      libraries, please increase the timeout of the http request before calling this endpoint (a timeout
      of 2 minutes is recommended). See Timeouts and Errors for an example in java.
    category: edits
    request:
      method: POST
      path: /androidpublisher/v3/applications/${package_name}/edits/${edit_id}/bundles
      base_url_override: https://androidpublisher.googleapis.com
      query:
        ackBundleInstallationWarning: ${ack_bundle_installation_warning}
        deviceTierConfigId: ${device_tier_config_id}
    input:
      edit_id:
        type: string
        description: Identifier of the edit.
      package_name:
        type: string
        description: Package name of the app.
      ack_bundle_installation_warning:
        type: boolean
        description: Deprecated. The installation warning has been removed, it's not necessary to set
          this field anymore.
        optional: true
      device_tier_config_id:
        type: string
