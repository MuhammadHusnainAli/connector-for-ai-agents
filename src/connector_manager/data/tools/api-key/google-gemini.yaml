# Google Gemini API tools.
#
# An API key carries no scope grant, so no tool here declares one.
#
# The Generative Language API: models, content generation, embeddings, token
# counting, files, tuned models, cached content, batch jobs, corpora and the
# semantic retrieval stack, plus the Live and Interactive endpoints.
#
# The ones most callers want:
#
#   * `generate_content_model` is the main call -- a prompt in, a completion
#     out. `stream_generate_content_model` is the same thing token by token;
#   * `count_tokens_model` measures a prompt before sending it, which is how
#     you stay inside a model's context window and predict cost;
#   * `embed_content_model` and `batch_embed_content_model` produce vectors;
#   * `list_models` is worth calling rather than hard-coding a model name --
#     Gemini model ids change, and each carries its own token limits and
#     supported methods.
#
# Files uploaded here are held for a limited period and then deleted by Google,
# so `create_file` is for material a request needs shortly, not for storage.
#
# Docs: https://ai.google.dev/api/rest

connector_id: google-gemini
display_name: Google Gemini
docs_url: https://developers.generativeai.google/api
tools:
  create_auth_token:
    title: Create auth token
    description: Creates a token that can be used to constrain the behavior of a BidiGenerateContent session.
    category: auth_tokens
    request:
      method: POST
      path: /v1beta/auth_tokens
      body:
        expireTime: ${expire_time}
        fieldMask: ${field_mask}
        bidiGenerateContentSetup: ${bidi_generate_content_setup}
        newSessionExpireTime: ${new_session_expire_time}
        uses: ${uses}
    input:
      expire_time:
        type: string
        description: Optional. Input only. Immutable. An optional time after which, when using the resulting
          token, messages in BidiGenerateContent sessions will be rejected. (Gemini may preemptively close
          the session after this time.) If not set then this defaults to 30 minutes in the future. If
          set, this value must be
        optional: true
      field_mask:
        type: string
        description: Optional. Input only. Immutable. If field_mask is empty, and bidi_generate_content_setup
          is not present, then the effective BidiGenerateContentSetup message is taken from the Live API
          connection. If field_mask is empty, and bidi_generate_content_setup _is_ present, then the effective
          BidiGenerateCon
        optional: true
      bidi_generate_content_setup:
        type: string
        description: Optional. Input only. Immutable. Configuration specific to BidiGenerateContent.
        optional: true
      new_session_expire_time:
        type: string
        description: Optional. Input only. Immutable. The time after which new Live API sessions using
          the token resulting from this request will be rejected. If not set this defaults to 60 seconds
          in the future. If set, this value must be less than 20 hours in the future.
        optional: true
      uses:
        type: integer
        description: Optional. Input only. Immutable. The number of times the token can be used. If this
          value is zero then no limit is applied. Resuming a Live API session does not count as a use.
          If unspecified, the default is 1.
        optional: true
    output:
      description: The AuthToken resource.
      type: object
  cancel_batch:
    title: Cancel batch
    description: Starts asynchronous cancellation on a long-running operation. The server makes a best
      effort to cancel the operation, but success is not guaranteed. If the server doesn't support this
      method, it returns google.rpc.Code.UNIMPLEMENTED. Clients can use Operations.GetOperation or other
      methods to check whether the cancellation succeeded or whether the operation completed despite cancellation.
      On successful cancellation,
    category: batches
    request:
      method: POST
      path: /v1beta/${name}:cancel
    input:
      name:
        type: string
        description: The name of the operation resource to be cancelled.
    output:
      description: The Empty resource.
      type: object
  delete_batch:
    title: Delete batch
    description: Deletes a long-running operation. This method indicates that the client is no longer
      interested in the operation result. It does not cancel the operation. If the server doesn't support
      this method, it returns google.rpc.Code.UNIMPLEMENTED.
    category: batches
    request:
      method: DELETE
      path: /v1beta/${name}
    input:
      name:
        type: string
        description: The name of the operation resource to be deleted.
    output:
      description: The Empty resource.
      type: object
    destructive: true
  get_batch:
    title: Get batch
    description: Gets the latest state of a long-running operation. Clients can use this method to poll
      the operation result at intervals as recommended by the API service.
    category: batches
    request:
      method: GET
      path: /v1beta/${name}
    input:
      name:
        type: string
        description: The name of the operation resource.
    output:
      description: The Operation resource.
      type: object
    read_only: true
  list_batches:
    title: List batches
    description: Lists operations that match the specified filter in the request. If the server doesn't
      support this method, it returns UNIMPLEMENTED.
    category: batches
    request:
      method: GET
      path: /v1beta/${name}
      query:
        filter: ${filter}
        pageSize: ${page_size}
        pageToken: ${page_token}
        returnPartialSuccess: ${return_partial_success}
    input:
      name:
        type: string
        description: The name of the operation's parent resource.
      filter:
        type: string
        description: The standard list filter.
        optional: true
      page_size:
        type: integer
        description: The standard list page size.
        optional: true
      page_token:
        type: string
        description: The standard list page token.
        optional: true
      return_partial_success:
        type: boolean
        description: When set to true, operations that are reachable are returned as normal, and those
          that are unreachable are returned in the ListOperationsResponse.unreachable field. This can
          only be true when reading across collections. For example, when parent is set to "projects/example/locations/-".
          This field is
        optional: true
    output:
      description: The ListOperationsResponse resource.
      type: object
    read_only: true
  update_embed_content_batch_batch:
    title: Update embed content batch batch
    description: Updates a batch of EmbedContent requests for batch processing.
    category: batches
    request:
      method: PATCH
      path: /v1beta/${name}:updateEmbedContentBatch
      query:
        updateMask: ${update_mask}
      body:
        displayName: ${display_name}
        inputConfig: ${input_config}
        model: ${model}
        priority: ${priority}
    input:
      name:
        type: string
        description: 'Output only. Identifier. Resource name of the batch. Format: batches/{batch_id}.'
      update_mask:
        type: string
        description: Optional. The list of fields to update.
        optional: true
      display_name:
        type: string
        description: Required. The user-defined name of this batch.
        optional: true
      input_config:
        type: string
        description: Required. Input configuration of the instances on which batch processing are performed.
        optional: true
      model:
        type: string
        description: 'Required. The name of the Model to use for generating the completion. Format: models/{model}.'
        optional: true
      priority:
        type: string
        description: Optional. The priority of the batch. Batches with a higher priority value will be
          processed before batches with a lower priority value. Negative values are allowed. Default is
          0.
        optional: true
    output:
      description: The EmbedContentBatch resource.
      type: object
  update_generate_content_batch_batch:
    title: Update generate content batch batch
    description: Updates a batch of GenerateContent requests for batch processing.
    category: batches
    request:
      method: PATCH
