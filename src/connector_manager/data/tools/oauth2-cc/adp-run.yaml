# RUN Powered by ADP tools -- the APIs ADP publishes for this product.
#
# RUN is ADP's small-business payroll product, and the API reflects that:
# payroll is the centre of gravity -- pay data input, pay statements,
# payroll outputs, pay distributions, deduction configurations and US tax
# profiles -- with worker records, organisation identities, enterprise
# reports and applicant onboarding around it. RUN's code lists are its own
# (`list_*_codelists`), and they are what a write's code fields must come
# from.
#
# ADP's HCM APIs split cleanly in two, and the tools follow that split:
#
#   * **reads** are ordinary REST collections under a domain prefix --
#     `/hr/v2/workers`, `/payroll/v1/pay-statements`, `/time/v2/...` -- and take
#     OData-style `$filter`, `$select`, `$top` and `$skip` where ADP documents
#     them;
#   * **writes are events**, not PUTs. Changing anything about a worker means
#     posting to `/events/{domain}/{version}/{event-name}` with an event
#     payload; there is no `PATCH /workers/{aoid}`. Each event also has a
#     `/meta` sibling describing the payload it accepts and the code values it
#     will take on this client's configuration.
#
# Three things worth planning for:
#
#   * **read `/meta` before writing.** ADP code lists -- job codes, reason codes,
#     department ids -- are per-client, and an event carrying a code the client
#     does not define is rejected. `get_event_metadata` is that check, and every
#     resource with a `/meta` endpoint has a `get_*_metadata` tool here;
#   * **a worker is addressed by `aoid`**, the Associate OID, not by employee
#     number or SSN. `list_workers` is how you resolve one;
#   * **entitlement is per client.** Every path below is one ADP publishes for
#     this product, but whether a given client's certificate can call it depends
#     on what that client bought and consented to, so a 401 or 403 on one tool
#     does not mean the credential is broken.
#
# `post_event` and `get_event_metadata` are the general form of the write side:
# they reach any ADP event name, including ones ADP adds after this pack was
# written. The typed event tools below cover every event ADP documents for this
# product today.
#
# Not covered, deliberately:
#
#   * **event `/meta` endpoints** have no typed tool of their own --
#     `get_event_metadata` reaches every one of them, and a typed tool per event
#     would double this file for no new capability;
#   * **`/event-notifications/...` paths.** Those describe what ADP *posts to
#     you* when something happens; they are not endpoints a client calls;
#   * **multipart operations** such as the worker photo upload, whose
#     `multipart/mixed` body this pack's request format cannot express.
#
# This connector authenticates with client credentials over mutual TLS -- the
# certificate is part of the connection, so a 401 here usually means the
# certificate rather than the token. ADP scopes access through the client's
# consent and product entitlements rather than through named OAuth scopes, so no
# tool here declares any.
#
# Source: ADP's own API Explorer for this product,
# https://developers.adp.com/apis/api-explorer/pr-offrg-run
# and the OpenAPI document each API there links to.

connector_id: adp-run
display_name: RUN Powered by ADP
docs_url: https://developers.adp.com/apis/api-explorer/pr-offrg-run

tools:

  # -- events: the general form -----------------------------------------------

  post_event:
    title: Post an ADP event
    description: >-
      ADP's universal write. Every change -- hiring, terminating, changing a
      name, an address, a deduction -- is an event posted to
      `/events/{domain}/{version}/{event-name}`, and this tool reaches any of
      them, including events this pack has no typed tool for. Domains are `hr`,
      `payroll`, `time`, `staffing` and `core`; event names look like
      `worker.hire` or `worker.business-communication.email.change`. Call
      `get_event_metadata` for the same event first: it returns the payload
      shape and the code values this client accepts.
    category: events
    request:
      method: POST
      path: /events/${domain}/${event_version}/${event_name}
      headers:
        Content-Type: application/json
      body: "${event}"
    input:
      domain:
        type: string
        description: The event domain, e.g. hr, payroll, time, staffing or core.
        example: hr
      event_name:
        type: string
        description: The event name, e.g. worker.hire or worker.legal-name.change.
        example: worker.hire
      event:
        type: object
        description: >-
          The event payload -- typically {"events": [{"data": {...}}]} as the
          event's own metadata describes.
      event_version:
        type: string
        description: Version segment of the event, usually v1 or v2.
        optional: true
        default: v1
    output:
      description: ADP's confirmation, including any events it generated.
      type: object
      properties:
        confirmMessage: {type: object, description: "ADP's acknowledgement of the event."}
        events: {type: array, description: "The events ADP recorded, with their ids."}

  get_event_metadata:
    title: Get an event's payload schema
    description: >-
      What one event accepts on this client's configuration: its fields, which
      are required, and the code values each code field permits. ADP's code
      lists are per-client, so this is the check that stops an event being
      rejected for an unknown reason code. Works for every event, including the
      ones with typed tools below.
    category: events
    read_only: true
    request:
      method: GET
      path: /events/${domain}/${event_version}/${event_name}/meta
    input:
      domain:
        type: string
        description: The event domain, e.g. hr, payroll, time, staffing or core.
        example: hr
      event_name:
        type: string
        description: The event name, e.g. worker.hire.
        example: worker.hire
      event_version:
        type: string
        description: Version segment of the event, usually v1 or v2.
        optional: true
        default: v1
    output:
      description: The event's metadata.
      type: object
      properties:
        meta: {type: object, description: "The event's fields and the code values this client accepts."}

