  token_url: https://${connectionConfig.hostname}/api/4.0/login
microsoft-oauth2-cc-cert:
  assertion:
    header:
      alg: PS256
      x5t#S256: ${credentials.certificateThumbprint}
    key: ${credentials.privateKey}
    lifetimeInSeconds: 3600
    payload:
      aud: https://login.microsoftonline.com/${connectionConfig.tenantId}/oauth2/v2.0/token
      iss: ${credentials.clientId}
      jti: ${random}
      sub: ${credentials.clientId}
    type: jwt
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - communication
  - dev-tools
  - productivity
  connection_config:
    oauth_scopes:
      description: The resource scope to request access for.
      example: https://graph.microsoft.com/.default
      order: 2
      title: Scope
      type: string
    tenantId:
      description: The unique identifier for your organization that uses Microsoft services.
      example: a1b2c3d4-e5f6-47a8-9b0c-d1234567890f
      format: uuid
      order: 1
      title: Tenant ID
      type: string
  credentials:
    assertion:
      automated: true
      description: ''
      title: ''
      type: string
