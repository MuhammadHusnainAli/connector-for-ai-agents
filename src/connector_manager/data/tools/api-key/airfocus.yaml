      Set a custom field with path /fields/{fieldId}.
    category: items
    scopes:
    - workspace
    request:
      method: PATCH
      path: /${workspace_id}/items/${item_id}
      query:
        actAsAdmin: ${act_as_admin}
      body: ${operations}
