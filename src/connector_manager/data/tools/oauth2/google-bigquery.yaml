  update_model:
    title: Update model
    description: 'Patch specific fields in the specified model. # IAM Permissions Requires the bigquery.models.updateMetadata
      permission on the model.'
    category: models
    request:
      method: PATCH
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}/models/${model_id}
      body:
        expirationTime: ${expiration_time}
        encryptionConfiguration: ${encryption_configuration}
        trainingRuns: ${training_runs}
        friendlyName: ${friendly_name}
        modelReference: ${model_reference}
        labels: ${labels}
        bestTrialId: ${best_trial_id}
        description: ${description}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of the model to patch.
      model_id:
        type: string
        description: Required. Model ID of the model to patch.
      project_id:
        type: string
        description: Required. Project ID of the model to patch.
      expiration_time:
        type: string
        description: Optional. The time when this model expires, in milliseconds since the epoch. If not
          present, the model will persist indefinitely. Expired models will be deleted and their storage
          reclaimed. The defaultTableExpirationMs property of the encapsulating dataset can be used to
          set a default expirationTime
        optional: true
      encryption_configuration:
        type: string
        description: Custom encryption configuration (e.g., Cloud KMS keys). This shows the encryption
          configuration of the model data while stored in BigQuery storage. This field can be used with
          PatchModel to update encryption key for an already encrypted model.
        optional: true
      training_runs:
        type: array
        items:
          type: string
        description: Information for all training runs in increasing order of start_time.
        optional: true
      friendly_name:
        type: string
        description: Optional. A descriptive name for this model.
        optional: true
      model_reference:
        type: string
        description: Required. Unique identifier for this model.
        optional: true
      labels:
        type: object
        description: The labels associated with this model. You can use these to organize and group your
          models. Label keys and values can be no longer than 63 characters, can only contain lowercase
          letters, numeric characters, underscores and dashes. International characters are allowed. Label
          values are optional. Labe
        optional: true
      best_trial_id:
        type: string
        description: The best trial_id across all training runs.
        optional: true
      description:
        type: string
        description: Optional. A user-friendly description of this model.
        optional: true
    output:
      description: The Model resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
