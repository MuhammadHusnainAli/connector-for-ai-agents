# Connector definitions: BILL auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
bill:
  auth_mode: BILL
  categories:
  - payment
  display_name: Bill (Connect API)
  proxy:
    base_url: https://gateway.prod.bill.com/connect
  token_url: https://gateway.prod.bill.com/connect/v3/login
bill-sandbox:
  auth_mode: BILL
  categories:
  - payment
  display_name: Bill (Connect API Sandbox)
  proxy:
    base_url: https://gateway.stage.bill.com/connect
  token_url: https://gateway.stage.bill.com/connect/v3/login
