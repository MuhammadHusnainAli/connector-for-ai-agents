        description: A fully qualified Google Cloud Pub/Sub API topic name to publish the events to. This
          topic name **must** already exist in Cloud Pub/Sub and you **must** have already granted gmail
          "publish" permission on it. For example, "projects/my-project-identifier/topics/my-topic-name"
          (using the Cloud Pub/Sub
        optional: true
    output:
