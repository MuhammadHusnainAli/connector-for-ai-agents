# Avoma meeting intelligence tools.
#
# Every path, parameter and body field below comes from Avoma's own OpenAPI 3.0
# description, published at https://dev.avoma.com/openapi.yml (with the shared
# schemas at https://dev.avoma.com/openapi/components/external.yml).
#
# The connection's base url is https://api.avoma.com, so paths start at /v1.
# Avoma's routes keep their trailing slash -- /v1/meetings/ rather than
# /v1/meetings -- and that is what the paths here use.
#
# Most listings require an explicit from_date / to_date window in UTC, so a
# "list everything" call is not on offer; pick a range. Pagination is Django
# style: page and page_size, with next and previous URLs in the response.
#
# One wrinkle worth knowing: the spec writes the revenue intelligence timeline
# path without its leading slash ("v1/revenue_intel/timeline/"). Its sibling
# endpoint and every other route in the spec carry one, so get_revenue_timeline
# uses /v1/revenue_intel/timeline/.
#
# Not covered: the five POST /v1/webhooks/... routes, which are not callable
# endpoints at all -- they document the payloads Avoma sends *to* your webhook
# URL, and calling them would post an event to Avoma rather than receive one.
#
# Docs: https://dev.avoma.com/

connector_id: avoma
display_name: Avoma
docs_url: https://dev.avoma.com/

tools:
  list_meetings:
    title: List meetings
    description: >-
      Search meetings in a date window, with their subject, attendees, type,
      outcome and recording. Narrow to voice calls or video, to external
      meetings only, or to the meetings tied to a CRM account or opportunity.
    category: meetings
    read_only: true
    request:
      method: GET
      path: /v1/meetings/
      query:
        from_date: "${from_date}"
        to_date: "${to_date}"
        is_call: "${is_call}"
        is_internal: "${is_internal}"
        attendee_emails: "${attendee_emails}"
        recording_duration__gte: "${min_recording_duration}"
        crm_account_ids: "${crm_account_ids}"
        crm_opportunity_ids: "${crm_opportunity_ids}"
        crm_contact_ids: "${crm_contact_ids}"
        crm_lead_ids: "${crm_lead_ids}"
        include_crm_associations: "${include_crm_associations}"
        o: "${order}"
        page_size: "${page_size}"
    input:
      from_date:
        type: string
        description: Earliest meeting start, as a UTC ISO 8601 timestamp.
      to_date:
        type: string
        description: Latest meeting start, as a UTC ISO 8601 timestamp.
      is_call:
        type: boolean
        description: True for voice calls only, false for video meetings only.
        optional: true
      is_internal:
        type: boolean
        description: True for meetings with no outside attendee, false for external ones.
        optional: true
      attendee_emails:
        type: string
        description: Comma-separated attendee emails a meeting must include.
        optional: true
      min_recording_duration:
        type: number
        description: Only meetings whose recording is at least this many seconds long.
        optional: true
      crm_account_ids:
        type: string
        description: Comma-separated CRM account external ids to filter by.
        optional: true
      crm_opportunity_ids:
        type: string
        description: Comma-separated CRM opportunity external ids to filter by.
        optional: true
      crm_contact_ids:
        type: string
        description: Comma-separated CRM contact external ids to filter by.
        optional: true
      crm_lead_ids:
        type: string
        description: Comma-separated CRM lead external ids to filter by.
        optional: true
      include_crm_associations:
        type: boolean
        description: True to include each meeting's CRM associations in the response.
        optional: true
      order:
        type: string
        description: Sort by start time, ascending or descending.
        optional: true
        enum: [start_at, -start_at]
      page_size:
        type: integer
        description: Meetings per page.
        optional: true
    output:
      description: A page of meetings, with count and next and previous page URLs.
      type: object

  get_meeting:
    title: Get a meeting
    description: >-
      Read one meeting by uuid -- its subject, times, attendees, organizer,
      meeting type and outcome, and the transcript and recording references.
    category: meetings
    read_only: true
    request:
      method: GET
      path: /v1/meetings/${uuid}/
      query:
        include_crm_associations: "${include_crm_associations}"
    input:
      uuid:
        type: string
        description: Meeting uuid.
      include_crm_associations:
        type: boolean
        description: True to include the meeting's CRM associations.
        optional: true
    output:
      description: The meeting record.
      type: object

  get_meeting_insights:
    title: Get a meeting's insights
    description: >-
      Read the AI insights Avoma derived from one meeting -- topics, action
      items, questions and the other signals it surfaces from the transcript.
    category: meetings
    read_only: true
    request:
      method: GET
      path: /v1/meetings/${meeting_uuid}/insights/
    input:
      meeting_uuid:
        type: string
        description: Meeting uuid whose insights to read.
    output:
      description: The meeting's insights.
      type: object

  get_meeting_segments:
    title: Get a meeting's segments
    description: >-
      Read how a meeting's conversation divides into segments, which is what
      drives topic timelines and talk-track analysis.
    category: meetings
    read_only: true
    request:
      method: GET
      path: /v1/meeting_segments/
      query:
        uuid: "${uuid}"
    input:
      uuid:
        type: string
        description: Meeting uuid whose segments to read.
    output:
      description: The meeting's conversation segments.
      type: object

  get_meeting_sentiments:
    title: Get a meeting's sentiments
    description: >-
      Read the sentiment Avoma scored across a meeting, for spotting where a
      conversation turned.
    category: meetings
    read_only: true
    request:
      method: GET
      path: /v1/meeting_sentiments/
      query:
        meeting_uuid: "${meeting_uuid}"
    input:
      meeting_uuid:
        type: string
        description: Meeting uuid whose sentiments to read.
    output:
      description: The meeting's sentiment scores.
      type: object

  drop_meeting:
    title: Drop the assistant from a meeting
    description: >-
      Pull the Avoma notetaker out of a meeting that is in progress, which
      stops it recording from that point.
    category: meetings
    request:
      method: POST
      path: /v1/meetings/${uuid}/drop/
    input:
      uuid:
        type: string
        description: Meeting uuid to drop the assistant from.
    output:
      description: Confirmation that the assistant was dropped.
      type: object

  list_transcriptions:
    title: List transcriptions
    description: >-
      Search meeting transcripts in a date window, or fetch the transcript for
      one meeting by uuid. Each entry carries the speaker-labelled utterances
      with their timings.
    category: transcripts
    read_only: true
    request:
      method: GET
      path: /v1/transcriptions/
      query:
        from_date: "${from_date}"
        to_date: "${to_date}"
        meeting_uuid: "${meeting_uuid}"
        attendee_emails: "${attendee_emails}"
        crm_account_ids: "${crm_account_ids}"
        crm_opportunity_ids: "${crm_opportunity_ids}"
        crm_contact_ids: "${crm_contact_ids}"
        crm_lead_ids: "${crm_lead_ids}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      from_date:
        type: string
        description: Earliest meeting start, as a UTC ISO 8601 timestamp.
      to_date:
        type: string
        description: Latest meeting start, as a UTC ISO 8601 timestamp.
      meeting_uuid:
        type: string
        description: Fetch the transcript for one meeting instead of paging a range.
        optional: true
      attendee_emails:
        type: string
        description: Comma-separated attendee emails a meeting must include.
        optional: true
      crm_account_ids:
        type: string
        description: Comma-separated CRM account external ids to filter by.
        optional: true
      crm_opportunity_ids:
        type: string
        description: Comma-separated CRM opportunity external ids to filter by.
        optional: true
      crm_contact_ids:
        type: string
        description: Comma-separated CRM contact external ids to filter by.
        optional: true
      crm_lead_ids:
        type: string
        description: Comma-separated CRM lead external ids to filter by.
        optional: true
      page:
        type: integer
        description: Page number; only used when meeting_uuid is not given.
        optional: true
      page_size:
        type: integer
        description: Transcripts per page, up to 100.
        optional: true
        maximum: 100
    output:
      description: A page of transcriptions with their speaker-labelled utterances.
      type: object

  get_transcription:
    title: Get a transcription
    description: >-
      Read one transcript by its own uuid, with the full speaker-labelled
      utterance list and timings.
    category: transcripts
    read_only: true
    request:
      method: GET
      path: /v1/transcriptions/${uuid}/
    input:
      uuid:
        type: string
        description: Transcription uuid.
    output:
      description: The transcription record.
      type: object

  get_recording:
    title: Get a meeting's recording
    description: >-
      Fetch the audio and video recording URLs for one meeting. The URLs are
      time-limited, so use them promptly rather than storing them.
    category: recordings
    read_only: true
    request:
      method: GET
      path: /v1/recordings/
      query:
        meeting_uuid: "${meeting_uuid}"
    input:
      meeting_uuid:
        type: string
        description: Meeting uuid whose recording to fetch.
    output:
      description: The recording's audio and video URLs.
      type: object

  get_recording_by_id:
    title: Get a recording by id
    description: >-
      Fetch one recording by its own uuid rather than by the meeting it belongs
      to.
    category: recordings
    read_only: true
    request:
      method: GET
      path: /v1/recordings/${uuid}/
    input:
      uuid:
        type: string
        description: Recording uuid.
    output:
      description: The recording record with its media URLs.
      type: object

  list_notes:
    title: List meeting notes
    description: >-
      Search AI meeting notes in a date window, optionally for one meeting or
      one custom category. output_format picks whether the note comes back as
      JSON, HTML or markdown.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/notes/
      query:
        from_date: "${from_date}"
        to_date: "${to_date}"
        meeting_uuid: "${meeting_uuid}"
        custom_category: "${custom_category}"
        output_format: "${output_format}"
        o: "${order}"
        page_size: "${page_size}"
    input:
      from_date:
        type: string
        description: Earliest meeting start, as a UTC ISO 8601 timestamp.
      to_date:
        type: string
        description: Latest meeting start, as a UTC ISO 8601 timestamp.
      meeting_uuid:
        type: string
        description: Restrict to the notes on one meeting.
        optional: true
      custom_category:
        type: string
        description: Restrict to notes in one custom category.
        optional: true
      output_format:
        type: string
        description: How the note body is rendered.
        optional: true
        enum: [json, html, markdown]
      order:
        type: string
        description: Sort by meeting start or last modified time.
        optional: true
        enum: [start_at, -start_at, modified, -modified]
      page_size:
        type: integer
        description: Notes per page.
        optional: true
    output:
      description: A page of AI meeting notes.
      type: object

  list_snippets:
    title: List meeting snippets
    description: >-
      List the clipped highlights from meetings, either for one meeting or
      across a date window, separating AI-generated snippets from ones people
      cut by hand.
    category: notes
    read_only: true
    request:
      method: GET
      path: /v1/snippets/
      query:
        meeting_uuid: "${meeting_uuid}"
        from_date: "${from_date}"
        to_date: "${to_date}"
        is_ai_generated: "${is_ai_generated}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      meeting_uuid:
        type: string
        description: Meeting uuid whose snippets to list; otherwise give a date range.
        optional: true
      from_date:
        type: string
        description: Earliest meeting start, as a UTC ISO 8601 timestamp.
        optional: true
      to_date:
        type: string
        description: Latest meeting start, as a UTC ISO 8601 timestamp.
        optional: true
      is_ai_generated:
        type: boolean
        description: True for AI-generated snippets, false for hand-cut ones.
        optional: true
      page:
        type: integer
        description: Page number.
        optional: true
      page_size:
        type: integer
        description: Snippets per page.
        optional: true
    output:
      description: A page of meeting snippets.
      type: object

  list_calls:
    title: List calls
    description: >-
      List dialer calls pushed into Avoma over a date window, optionally
      narrowed to inbound or outbound.
    category: calls
    read_only: true
    request:
      method: GET
      path: /v1/calls/
      query:
        from_date: "${from_date}"
        to_date: "${to_date}"
        direction: "${direction}"
    input:
      from_date:
        type: string
        description: Earliest call start, as a UTC ISO 8601 timestamp.
      to_date:
        type: string
        description: Latest call start, as a UTC ISO 8601 timestamp.
      direction:
        type: string
        description: Restrict to inbound or outbound calls.
        optional: true
    output:
      description: The matching calls.
      type: object

  get_call:
    title: Get a call
    description: >-
      Read one call by the external id your dialer gave it, with its
      participants, recording and processing state.
    category: calls
    read_only: true
    request:
      method: GET
      path: /v1/calls/${external_id}/
    input:
      external_id:
        type: string
        description: The call's id in the dialer system that pushed it.
    output:
      description: The call record.
      type: object

  create_call:
    title: Push a call into Avoma
    description: >-
      Hand Avoma a completed dialer call to transcribe and analyse.
      recording_url is downloaded server-side, participants lists the people on
      the call with the caller first, and external_id is your dialer's own id
      for it.
    category: calls
    request:
      method: POST
      path: /v1/calls/
      body:
        external_id: "${external_id}"
        source: "${source}"
        direction: "${direction}"
        frm: "${frm}"
        frm_name: "${frm_name}"
        to: "${to}"
        to_name: "${to_name}"
        user_email: "${user_email}"
        start_at: "${start_at}"
        end_at: "${end_at}"
        recording_url: "${recording_url}"
        participants: "${participants}"
        answered: "${answered}"
        is_voicemail: "${is_voicemail}"
        state: "${state}"
        additional_details: "${additional_details}"
        crm_association: "${crm_association}"
        meeting: "${meeting}"
        organization: "${organization}"
    input:
      external_id:
        type: string
        description: The call's unique id in the dialer system.
      source:
        type: string
        description: Lowercase name of the dialer the call came from, e.g. hubspot.
      direction:
        type: string
        description: Whether the call was inbound or outbound.
      frm:
        type: string
        description: Phone number the call was made from.
      frm_name:
        type: string
        description: Name of the caller.
        optional: true
      to:
        type: string
        description: Phone number the call was made to.
      to_name:
        type: string
        description: Name of the person called.
        optional: true
      user_email:
        type: string
        description: Email of the Avoma user who made or took the call.
      start_at:
        type: string
        description: When the call started, as a UTC ISO 8601 timestamp.
      end_at:
        type: string
        description: When the call ended, as a UTC ISO 8601 timestamp.
        optional: true
      recording_url:
        type: string
        description: URL Avoma should download the call recording from.
      participants:
        type: array
        description: People on the call, the caller first.
        items: {type: object}
      answered:
        type: boolean
        description: True if the call was answered.
        optional: true
      is_voicemail:
        type: boolean
        description: True if the recording is a voicemail.
        optional: true
      state:
        type: string
        description: Processing state to record the call in.
        optional: true
        enum: [created, queued, inprogress, done, error]
      additional_details:
        type: string
        description: Extra call metadata, as a JSON string.
        optional: true
      crm_association:
        type: array
        description: CRM objects to associate, each with crm_obj_id and crm_obj_type.
        optional: true
        items: {type: object}
      meeting:
        type: object
        description: Meeting attributes to attach to the call.
        optional: true
      organization:
        type: object
        description: Organization the call belongs to.
        optional: true
    output:
      description: The created call record.
      type: object

  update_call:
    title: Update a call
    description: >-
      Amend a call already pushed into Avoma -- correct the participant names,
      mark it a voicemail, set its subject, or attach a meeting purpose,
      outcome or CRM object.
    category: calls
    request:
      method: PATCH
      path: /v1/calls/${external_id}/
      body:
        subject: "${subject}"
        frm_name: "${frm_name}"
        to_name: "${to_name}"
        answered: "${answered}"
        is_voicemail: "${is_voicemail}"
        meeting_purpose_uuid: "${meeting_purpose_uuid}"
        meeting_outcome_uuid: "${meeting_outcome_uuid}"
        crm_association: "${crm_association}"
        additional_details: "${additional_details}"
    input:
      external_id:
        type: string
        description: The call's id in the dialer system that pushed it.
      subject:
        type: string
        description: New subject or topic for the call.
        optional: true
      frm_name:
        type: string
        description: Corrected name of the caller.
        optional: true
      to_name:
        type: string
        description: Corrected name of the person called.
        optional: true
      answered:
        type: boolean
        description: Whether the call was answered.
        optional: true
      is_voicemail:
        type: boolean
        description: Whether the recording is a voicemail.
        optional: true
      meeting_purpose_uuid:
        type: string
        description: Meeting type to record against the call.
        optional: true
      meeting_outcome_uuid:
        type: string
        description: Meeting outcome to record against the call.
        optional: true
      crm_association:
        type: array
        description: CRM objects to associate, each with crm_obj_id and crm_obj_type.
        optional: true
        items: {type: object}
      additional_details:
        type: string
        description: Extra call metadata, as a JSON string.
        optional: true
    output:
      description: The updated call record.
      type: object

  list_smart_categories:
    title: List smart categories
    description: >-
      List the smart categories in the organization -- the keyword and prompt
      driven trackers Avoma runs over every conversation.
    category: categories
    read_only: true
    request:
      method: GET
      path: /v1/smart_categories/
      query:
        o: "${order}"
    input:
      order:
        type: string
        description: Sort order for the categories.
        optional: true
        enum: [start_at, -start_at, modified, -modified, name, -name, background_color, -background_color]
    output:
      description: The organization's smart categories.
      type: object

  get_smart_category:
    title: Get a smart category
    description: >-
      Read one smart category by uuid, with its keywords, prompts and
      settings.
    category: categories
    read_only: true
    request:
      method: GET
      path: /v1/smart_categories/${uuid}/
    input:
      uuid:
        type: string
        description: Smart category uuid.
    output:
      description: The smart category record.
      type: object

  create_smart_category:
    title: Create a smart category
    description: >-
      Create a smart category from keywords and prompts, so Avoma starts
      tracking that theme across conversations.
    category: categories
    request:
      method: POST
      path: /v1/smart_categories/
      body:
        name: "${name}"
        keywords: "${keywords}"
        prompts: "${prompts}"
        settings: "${settings}"
    input:
      name:
        type: string
        description: Name of the smart category.
      keywords:
        type: array
        description: Keywords that mark a mention of this category.
        items: {type: string}
      prompts:
        type: array
        description: Prompts Avoma uses to extract this category from a conversation.
        items: {type: string}
      settings:
        type: object
        description: Settings for the category, such as its colour and visibility.
    output:
      description: The created smart category.
      type: object

  update_smart_category:
    title: Update a smart category
    description: >-
      Change a smart category's keywords, prompts or settings. Send the full
      lists you want kept, since they replace what is stored.
    category: categories
    request:
      method: PATCH
      path: /v1/smart_categories/${uuid}/
      body:
        keywords: "${keywords}"
        prompts: "${prompts}"
        settings: "${settings}"
    input:
      uuid:
        type: string
        description: Smart category uuid to update.
      keywords:
        type: array
        description: Replacement keyword list.
        optional: true
        items: {type: string}
      prompts:
        type: array
        description: Replacement prompt list.
        optional: true
        items: {type: string}
      settings:
        type: object
        description: Replacement settings for the category.
        optional: true
    output:
      description: The updated smart category.
      type: object

  list_custom_categories:
    title: List custom categories
    description: >-
      List the custom note categories in the organization, which is what note
      templates are assembled from.
    category: categories
    read_only: true
    request:
      method: GET
      path: /v1/custom_categories/
      query:
        o: "${order}"
    input:
      order:
        type: string
        description: Sort order for the categories.
        optional: true
        enum: [start_at, -start_at, modified, -modified, name, -name, background_color, -background_color]
    output:
      description: The organization's custom note categories.
      type: object

  get_custom_category:
    title: Get a custom category
    description: >-
      Read one custom note category by uuid, with its name and display
      settings.
    category: categories
    read_only: true
    request:
      method: GET
      path: /v1/custom_categories/${uuid}/
    input:
      uuid:
        type: string
        description: Custom category uuid.
    output:
      description: The custom category record.
      type: object

  list_templates:
    title: List note templates
    description: >-
      List the note templates in the organization, each tying a set of custom
      categories to the meeting types it applies to.
    category: templates
    read_only: true
    request:
      method: GET
      path: /v1/template/
    output:
      description: The organization's note templates.
      type: object

  get_template:
    title: Get a note template
    description: >-
      Read one note template by uuid, with its categories, meeting types,
      privacy and default flag.
    category: templates
    read_only: true
    request:
      method: GET
      path: /v1/template/${uuid}/
    input:
      uuid:
        type: string
        description: Template uuid.
    output:
      description: The note template record.
      type: object

  create_template:
    title: Create a note template
    description: >-
      Create a note template from custom categories and the meeting types it
      should apply to. privacy decides whether it is yours alone or the whole
      organization's.
    category: templates
    request:
      method: POST
      path: /v1/template/
      body:
        name: "${name}"
        categories: "${categories}"
        meeting_type_uuids: "${meeting_type_uuids}"
        email: "${email}"
        privacy: "${privacy}"
        is_default: "${is_default}"
    input:
      name:
        type: string
        description: Name of the template.
      categories:
        type: array
        description: Custom category uuids the template is built from.
        items: {type: string}
      meeting_type_uuids:
        type: array
        description: Meeting type uuids the template applies to.
        items: {type: string}
      email:
        type: string
        description: Email of the user the template belongs to.
        optional: true
      privacy:
        type: string
        description: Whether the template is private or shared with the organization.
        optional: true
        enum: [private, organization]
      is_default:
        type: boolean
        description: True to make this the default template.
        optional: true
    output:
      description: The created note template.
      type: object

  update_template:
    title: Update a note template
    description: >-
      Replace a note template. This is a PUT, so send every field you want kept
      -- name, categories and meeting types are all required.
    category: templates
    request:
      method: PUT
      path: /v1/template/${uuid}/
      body:
        name: "${name}"
        categories: "${categories}"
        meeting_type_uuids: "${meeting_type_uuids}"
        email: "${email}"
        privacy: "${privacy}"
        is_default: "${is_default}"
    input:
      uuid:
        type: string
        description: Template uuid to replace.
      name:
        type: string
        description: Name of the template.
      categories:
        type: array
        description: Custom category uuids the template is built from.
        items: {type: string}
      meeting_type_uuids:
        type: array
        description: Meeting type uuids the template applies to.
