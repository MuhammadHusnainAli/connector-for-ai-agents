# Connector definitions: NONE auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
unauthenticated:
  auth_mode: NONE
  categories:
  - other
  display_name: Unauthenticated
  webhook_routing_script: unauthenticatedWebhookRouting
youcanbook-me-public:
  auth_mode: NONE
  categories:
  - productivity
  connection_config:
    subdomain:
      description: The subdomain of your YouCanBookMe booking page.
      example: mycompany
      title: Subdomain
      type: string
  display_name: YouCanBookMe (Public)
  proxy:
    base_url: https://api.youcanbook.me
    connection_config:
      subdomain: ${connectionConfig.subdomain}
