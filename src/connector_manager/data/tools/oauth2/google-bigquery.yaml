  undelete_dataset:
    title: Undelete dataset
    description: 'Undeletes a dataset which is within time travel window based on datasetId. If a time
      is specified, the dataset version deleted at that time is undeleted, else the last live version
      is undeleted. # IAM Permissions Requires the following IAM permission(s) to use this method: - bigquery.datasets.create
      on the project. - bigquery.datasets.get on the dataset.'
    category: datasets
    request:
      method: POST
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}:undelete
      body:
        deletionTime: ${deletion_time}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of dataset being deleted
      project_id:
        type: string
        description: Required. Project ID of the dataset to be undeleted
      deletion_time:
        type: string
        description: Optional. The exact time when the dataset was deleted. If not specified, the most
          recently deleted version is undeleted. Undeleting a dataset using deletion time is not supported.
        optional: true
    output:
      description: The Dataset resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
