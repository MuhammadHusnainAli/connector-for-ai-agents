    category: inappproducts
    request:
      method: PATCH
      path: /androidpublisher/v3/applications/${package_name}/inappproducts/${sku}
      base_url_override: https://androidpublisher.googleapis.com
      query:
        autoConvertMissingPrices: ${auto_convert_missing_prices}
        latencyTolerance: ${latency_tolerance}
      body:
        gracePeriod: ${grace_period}
        purchaseType: ${purchase_type}
        listings: ${listings}
        managedProductTaxesAndComplianceSettings: ${managed_product_taxes_and_compliance_settings}
        subscriptionPeriod: ${subscription_period}
        subscriptionTaxesAndComplianceSettings: ${subscription_taxes_and_compliance_settings}
        prices: ${prices}
        sku: ${body_sku}
        defaultPrice: ${default_price}
        status: ${status}
        defaultLanguage: ${default_language}
        trialPeriod: ${trial_period}
        packageName: ${body_package_name}
    input:
      package_name:
        type: string
        description: Package name of the app.
      sku:
        type: string
        description: Unique identifier for the in-app product.
      auto_convert_missing_prices:
        type: boolean
        description: If true the prices for all regions targeted by the parent app that don't have a price
          specified for this in-app product will be auto converted to the target currency based on the
          default price. Defaults to false.
        optional: true
      latency_tolerance:
        type: string
        description: Optional. The latency tolerance for the propagation of this product update. Defaults
          to latency-sensitive.
        optional: true
        enum:
        - PRODUCT_UPDATE_LATENCY_TOLERANCE_UNSPECIFIED
        - PRODUCT_UPDATE_LATENCY_TOLERANCE_LATENCY_SENSITIVE
        - PRODUCT_UPDATE_LATENCY_TOLERANCE_LATENCY_TOLERANT
      grace_period:
        type: string
        description: Grace period of the subscription, specified in ISO 8601 format. Allows developers
          to give their subscribers a grace period when the payment for the new recurrence period is declined.
          Acceptable values are P0D (zero days), P3D (three days), P7D (seven days), P14D (14 days), and
          P30D (30 days).
        optional: true
      purchase_type:
        type: string
        description: The type of the product, e.g. a recurring subscription.
        optional: true
        enum:
        - purchaseTypeUnspecified
        - managedUser
        - subscription
      listings:
        type: object
        description: List of localized title and description data. Map key is the language of the localized
          data, as defined by BCP-47, e.g. "en-US".
        optional: true
      managed_product_taxes_and_compliance_settings:
        type: string
        description: Details about taxes and legal compliance. Only applicable to managed products.
        optional: true
      subscription_period:
        type: string
        description: Subscription period, specified in ISO 8601 format. Acceptable values are P1W (one
          week), P1M (one month), P3M (three months), P6M (six months), and P1Y (one year).
        optional: true
      subscription_taxes_and_compliance_settings:
        type: string
        description: Details about taxes and legal compliance. Only applicable to subscription products.
        optional: true
      prices:
        type: object
        description: Prices per buyer region. None of these can be zero, as in-app products are never
          free. Map key is region code, as defined by ISO 3166-2.
        optional: true
      body_sku:
        type: string
        description: Stock-keeping-unit (SKU) of the product, unique within an app.
        optional: true
      default_price:
        type: string
        description: Default price. Cannot be zero, as in-app products are never free. Always in the developer's
          Checkout merchant currency.
        optional: true
      status:
        type: string
        description: The status of the product, e.g. whether it's active.
        optional: true
        enum:
        - statusUnspecified
        - active
        - inactive
      default_language:
        type: string
        description: Default language of the localized data, as defined by BCP-47. e.g. "en-US".
        optional: true
      trial_period:
        type: string
        description: Trial period, specified in ISO 8601 format. Acceptable values are anything between
          P7D (seven days) and P999D (999 days).
        optional: true
      body_package_name:
        type: string
        description: Package name of the parent app.
        optional: true
    output:
      description: The InAppProduct resource.
      type: object
    scopes:
    - androidpublisher
