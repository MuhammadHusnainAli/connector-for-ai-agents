name: Publish to PyPI

on:
  # Publishing to real PyPI happens when you publish a GitHub Release.
  release:
    types: [published]
  # Manual runs let you smoke-test the whole pipeline against TestPyPI first.
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags are needed to prove a manual pypi run is publishing a tagged commit.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      # Anything reaching real PyPI must be traceable to a tag: a version can
      # never be re-uploaded once taken, so an untagged publish is permanent and
      # unattributable. This used to run on release events only, which is how
      # 0.1.3 shipped from a manual run with no tag at all -- the tag was added
      # afterwards by hand. Manual pypi runs are now held to the same rule.
      - name: Check the published version is tagged
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          project_version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          if [ "${{ github.event_name }}" = "release" ]; then
            # The tag is the ref being built, so compare the two directly.
            tag_version="${GITHUB_REF_NAME#v}"
            echo "pyproject: $project_version / tag: $tag_version"
            if [ "$project_version" != "$tag_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version"
              exit 1
            fi
          else
            # A manual run builds a branch, so require the matching tag to exist
            # and to name this exact commit.
            tag="v$project_version"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::No $tag tag. Tag the release commit before publishing $project_version to PyPI."
              exit 1
            fi
            tagged_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "::error::$tag points at $tagged_sha, but this run builds $GITHUB_SHA."
              exit 1
            fi
            echo "pyproject: $project_version / $tag matches $GITHUB_SHA"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/connector-for-ai-agents
    permissions:
      id-token: write        # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/connector-for-ai-agents
    permissions:
      id-token: write        # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Backfilled releases (e.g. tagging 0.1.0 after the fact) would otherwise
          # fail: PyPI never allows re-uploading a version that already exists.
          skip-existing: true
