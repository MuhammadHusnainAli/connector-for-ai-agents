# Airfocus tools -- product management workspaces, items, fields, statuses,
# links, comments and team administration.
#
# Every path, parameter and body field below comes from the OpenAPI description
# Airfocus publishes at https://developer.airfocus.com/openapi.json (144
# operations). Everything that is not deprecated is here except
# POST /api/profile/change-password and POST /api/team/tos (accepting the terms
# of service), which are not things to hand an agent. The ten deprecated
# milestone and legacy template routes are left out; milestones are custom
# fields of type milestone now.
#
# Base url. The connection's base url is https://api.airfocus.com/api/workspaces,
# so workspace routes here start at /{workspace_id}/items and the like. Routes
# outside /api/workspaces (fields, link types, status presets, profile, team,
# templates, AI actors) set base_url_override to https://api.airfocus.com and
# carry their full /api/... path.
#
# How the API is shaped:
#
#   * **reads are mostly POSTs.** Every resource has search_* (POST .../search
#     with a filter and sort body, paged with offset and limit), list_*_by_ids
#     (POST .../list with an array of ids, answering null for any it cannot
#     see) and get_* by id. All three only read, and are flagged read_only;
#   * **patch_* takes a JSON Patch array**, e.g.
#     [{"op": "replace", "path": "/name", "value": "New name"}]. update_*
#     (PUT) replaces the whole resource and needs every required field, so
#     prefer patch;
#   * **rich text is markdown here.** create_item, update_item,
#     create_workspace, update_workspace, create_comment and update_comment send
#     application/vnd.airfocus.markdown+json, so description and content are
#     plain markdown strings rather than Airfocus's block JSON;
#   * **item fields are keyed by field id.** An item's fields object maps a
#     custom-field id to that field type's value; search_fields and
#     get_workspace show which fields a workspace has;
#   * **bulk_* takes a list of {type: create|update|patch|delete, ...}
#     operations** and returns one result per operation, errors included;
#   * **act_as_admin** turns on sudo mode for one request, giving a team admin
#     full permission on every workspace.
#
# API keys are scoped. Each tool carries the scope Airfocus's spec gives it:
# workspace, workspace:read, workspace:comment, team, team:read, profile or
# profile:read.
#
# Docs: https://developer.airfocus.com/

connector_id: airfocus
display_name: Airfocus
docs_url: https://developer.airfocus.com/
scope_rules:
  implies:
    workspace:
    - workspace:read
    - workspace:comment
    workspace:comment:
    - workspace:read
    team:
    - team:read
    profile:
    - profile:read
tools:

  search_workspaces:
    title: Search workspaces
    description: >-
      List the workspaces the caller can see, optionally archived ones or those matching a
      filter, sorted and paged. Start here to find workspace ids.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /search
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      body:
        archived: ${archived}
        filter: ${filter}
        sort: ${sort}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
      archived:
        type: boolean
        description: True for archived workspaces only, false (default) for active ones.
        optional: true
      filter:
        type: object
        description: 'Workspace filter tree, e.g. {type: name:contain, text: roadmap}, combinable
          with and/or/not.'
        optional: true
      sort:
        type: object
        description: 'Sort as {type, direction: asc|desc}, e.g. by name or order.'
        optional: true
    output:
      description: A page of workspaces.
      type: object

  list_workspaces_by_ids:
    title: Get workspaces by ids
    description: >-
      Fetch several workspaces by id in one call, in the order requested, with null for any
      missing or not visible.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /list
      query:
        actAsAdmin: ${act_as_admin}
      body: ${ids}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      ids:
        type: array
        items:
          type: string
        min_length: 1
        description: Ids (UUIDs) to fetch, in the order results should come back.
    output:
      description: The workspaces, in request order.
      type: object

  list_partial_workspaces:
    title: Get partial workspaces by ids
    description: >-
      Fetch workspaces by id with only the embedded properties you name, which is much cheaper
      than full workspaces when you need, say, just statuses or fields.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /list/partial
      query:
        actAsAdmin: ${act_as_admin}
      body:
        ids: ${ids}
        properties: ${properties}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      ids:
        type: array
        description: Workspace ids.
        items:
          type: string
      properties:
        type: array
        description: Embedded properties to include, e.g. statuses, fields, permissions.
        items:
          type: string
    output:
      description: The workspaces with the requested properties.
      type: object

  get_workspace:
    title: Get a workspace
    description: >-
      Read a workspace: name, alias, item type, statuses, fields, default permission and settings.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /${workspace_id}
      query:
        actAsAdmin: ${act_as_admin}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
    output:
      description: The workspace.
      type: object

  get_workspace_by_alias:
    title: Get a workspace by alias
    description: >-
      Read a workspace by its alias code, such as DEV.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /alias/${alias_value}
      query:
        actAsAdmin: ${act_as_admin}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      alias_value:
        type: string
        description: Workspace alias, e.g. DEV.
    output:
      description: The workspace.
      type: object

  count_workspaces:
    title: Count workspaces
    description: >-
      Count the workspaces in the team, e.g. before paging through search_workspaces.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /count
      query:
        actAsAdmin: ${act_as_admin}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
    output:
      description: The total count.
      type: object

  create_workspace:
    title: Create a workspace
    description: >-
      Create a workspace with a name, markdown description, item type, alias (the prefix of
      item aliases such as DEV-123), item colour, progress mode and default permission.
    category: workspaces
    scopes:
    - workspace
    request:
      method: POST
      path: /
      query:
        actAsAdmin: ${act_as_admin}
      headers:
        content-type: application/vnd.airfocus.markdown+json
      body:
        alias: ${alias}
        assigneeSettings: ${assignee_settings}
        defaultPermission: ${default_permission}
        description:
          markdown: ${description}
          richText: true
        itemColor: ${item_color}
        itemType: ${item_type}
        lastActivity: ${last_activity}
        name: ${name}
        order: ${order}
        progressMode: ${progress_mode}
        statusPresetId: ${status_preset_id}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      alias:
        type: string
        description: A custom code of this workspace (e.g. PROD, DEV, etc), which is used
          to create aliases for items (e.g. DEV-123). Alias should consist of 1-10 uppercase
          letters, and should be unique within the team.
        optional: true
      assignee_settings:
        type: object
        description: Assignee settings object.
        optional: true
      default_permission:
        type: string
        description: 'Permission everyone in the team gets: read, comment, write or full.'
        optional: true
        enum:
        - comment
        - full
        - read
        - write
      description:
        type: string
        description: Rich text as markdown; sent in Airfocus's {markdown, richText} envelope.
      item_color:
        type: string
        description: Default item colour.
        optional: true
      item_type:
        type: string
        description: 'What items in this workspace are: feature, bug, epic, task, idea, okr
          objective and so on.'
        optional: true
        enum:
        - bug
        - epic
        - experiment
        - feature
        - feedback
        - idea
        - initiative
        - app:okr:objective
        - opportunity
        - product
        - project
        - story
        - task
      last_activity:
        type: string
        description: Timestamp of the last activity, ISO 8601; use the current time.
      name:
        type: string
        description: Name of this workspace.
      order:
        type: integer
        description: Sort position among workspaces.
      progress_mode:
        type: string
        description: 'How progress is shown: count, percentage or none.'
        optional: true
        enum:
        - count
        - none
        - percentage
      status_preset_id:
        type: string
        description: Optional reference to a shared status preset. When set, statuses are
          read from the preset instead of workspace-specific statuses.
        optional: true
    output:
      description: The created workspace.
      type: object

  patch_workspace:
    title: Patch a workspace
    description: >-
      Change specific workspace properties with a JSON Patch; the description may be patched
      as a markdown string.
    category: workspaces
    scopes:
    - workspace
    request:
      method: PATCH
      path: /${workspace_id}
      query:
        actAsAdmin: ${act_as_admin}
      body: ${operations}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      operations:
        type: array
        items:
          type: object
        min_length: 1
        description: 'JSON Patch operations, e.g. [{"op": "replace", "path": "/name", "value":
          "New name"}]. op is add, remove, replace, move, copy or test.'
    output:
      description: The whole updated workspace.
      type: object

  update_workspace:
    title: Replace a workspace
    description: >-
      Replace a workspace's settings wholesale; every required field must be sent. Prefer
      patch_workspace for partial changes.
    category: workspaces
    scopes:
    - workspace
    request:
      method: PUT
      path: /${workspace_id}
      query:
        actAsAdmin: ${act_as_admin}
      headers:
        content-type: application/vnd.airfocus.markdown+json
      body:
        alias: ${alias}
        assigneeSettings: ${assignee_settings}
        defaultPermission: ${default_permission}
        description:
          markdown: ${description}
          richText: true
        itemColor: ${item_color}
        itemType: ${item_type}
        lastActivity: ${last_activity}
        name: ${name}
        order: ${order}
        progressMode: ${progress_mode}
        statusPresetId: ${status_preset_id}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      alias:
        type: string
        description: A custom code of this workspace (e.g. PROD, DEV, etc), which is used
          to create aliases for items (e.g. DEV-123). Alias should consist of 1-10 uppercase
          letters, and should be unique within the team.
        optional: true
      assignee_settings:
        type: object
        description: Assignee settings object.
        optional: true
      default_permission:
        type: string
        description: 'Permission everyone in the team gets: read, comment, write or full.'
        optional: true
        enum:
        - comment
        - full
        - read
        - write
      description:
        type: string
        description: Rich text as markdown; sent in Airfocus's {markdown, richText} envelope.
      item_color:
        type: string
        description: Default item colour.
        optional: true
      item_type:
        type: string
        description: What items in this workspace are.
        optional: true
        enum:
        - bug
        - epic
        - experiment
        - feature
        - feedback
        - idea
        - initiative
        - app:okr:objective
        - opportunity
        - product
        - project
        - story
        - task
      last_activity:
        type: string
        description: Timestamp of the last activity, ISO 8601.
      name:
        type: string
        description: Name of this workspace.
      order:
        type: integer
        description: Sort position among workspaces.
      progress_mode:
        type: string
        description: 'How progress is shown: count, percentage or none.'
        optional: true
        enum:
        - count
        - none
        - percentage
      status_preset_id:
        type: string
        description: Optional reference to a shared status preset. When set, statuses are
          read from the preset instead of workspace-specific statuses.
        optional: true
    output:
      description: The updated workspace.
      type: object

  delete_workspace:
    title: Delete a workspace
    description: >-
      Delete a workspace with all of its items, comments and views.
    category: workspaces
    scopes:
    - workspace
    destructive: true
    request:
      method: DELETE
      path: /${workspace_id}
      query:
        actAsAdmin: ${act_as_admin}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
    output:
      description: An empty result on success.
      type: object

  bulk_workspaces:
    title: Bulk-change workspaces
    description: >-
      Run many workspace create, update, patch and delete operations in one request, with
      one result per operation, errors inline.
    category: workspaces
    scopes:
    - workspace
    destructive: true
    request:
      method: POST
      path: /bulk
      query:
        actAsAdmin: ${act_as_admin}
      headers:
        content-type: application/vnd.airfocus.markdown+json
      body: ${operations}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      operations:
        type: array
        items:
          type: object
        min_length: 1
        description: 'Operations: {type: create, resource}, {type: update, id, resource},
          {type: patch, id, patch} or {type: delete, id}.'
    output:
      description: One result per operation.
      type: object

  duplicate_workspace:
    title: Duplicate a workspace
    description: >-
      Copy a workspace with all its items and apps into a new workspace, optionally with its
      user permissions.
    category: workspaces
    scopes:
    - workspace
    request:
      method: POST
      path: /${workspace_id}/duplicate
      query:
        actAsAdmin: ${act_as_admin}
      body:
        duplicatePermissions: ${duplicate_permissions}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      duplicate_permissions:
        type: boolean
        description: True to copy user permissions to the new workspace too.
    output:
      description: The new workspace.
      type: object

  update_workspace_permissions:
    title: Set workspace permissions
    description: >-
      Set who can do what in a workspace: the team-wide default plus explicit permissions
      per user and per user group, each read, comment, write or full.
    category: workspaces
    scopes:
    - workspace
    request:
      method: POST
      path: /${workspace_id}/permissions
      query:
        actAsAdmin: ${act_as_admin}
      body:
        defaultPermission: ${default_permission}
        permissions: ${permissions}
        userGroupPermissions: ${user_group_permissions}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      default_permission:
        type: string
        description: Permission for everyone else in the team.
        optional: true
        enum:
        - comment
        - full
        - read
        - write
      permissions:
        type: object
        description: Map of user id to read, comment, write or full.
      user_group_permissions:
        type: object
        description: Map of user group id to read, comment, write or full.
    output:
      description: The caller's effective permission afterwards.
      type: object

  set_workspace_statuses:
    title: Configure workspace statuses
    description: >-
      Set a workspace's statuses all at once: new ones are added, missing ones removed, the
      rest updated. Every removed status that has items needs a replacement, and each status
      category must keep at least one status.
    category: workspaces
    scopes:
    - workspace
    destructive: true
    request:
      method: POST
      path: /${workspace_id}/statuses
      query:
        actAsAdmin: ${act_as_admin}
      body:
        replacements: ${replacements}
        statuses: ${statuses}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID).
      replacements:
        type: object
        description: Map of removed status id to the status id its items move to.
      statuses:
        type: array
        description: The complete status list, each {id?, name, color, category, order}.
        items:
          type: object
    output:
      description: The workspace's statuses.
      type: object

  get_inbox_view_counters:
    title: Count items in an inbox view
    description: >-
      Count the items in each tab of an inbox view, optionally including archived items and
      a count of assigned items.
    category: workspaces
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /extensions/views/inbox/${view_id}/counters
      query:
        actAsAdmin: ${act_as_admin}
      body:
        archived: ${archived}
        countAssigned: ${count_assigned}
        filter: ${filter}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      view_id:
        type: string
        description: Inbox view id.
      archived:
        type: boolean
        description: True to include archived items in the counts.
      count_assigned:
        type: boolean
        description: True to also count items with assignees.
      filter:
        type: object
        description: Extra item filter tree applied to every tab.
        optional: true
    output:
      description: Counters per tab.
      type: object

  search_items_globally:
    title: Search items across workspaces
    description: >-
      Full-text search item contents across every workspace, optionally narrowed by workspace,
      assignee, user group or status category. contextQuery ranks by AI similarity to a passage
      rather than matching words.
    category: items
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /global-search
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      body:
        archived: ${archived}
        assigneeUserGroupIds: ${assignee_user_group_ids}
        assigneeUserIds: ${assignee_user_ids}
        contextQuery: ${context_query}
        searchQuery: ${search_query}
        searchTargets: ${search_targets}
        statusCategories: ${status_categories}
        workspaceIds: ${workspace_ids}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
      archived:
        type: boolean
        description: Search only archived or only non-archived items (only non-archived by
          default)
        optional: true
      assignee_user_group_ids:
        type: array
        description: Narrow down the search to items which are assigned to the specified user
          groups
        optional: true
        items:
          type: string
      assignee_user_ids:
        type: array
        description: Narrow down the search to items which are assigned to the specified users
        optional: true
        items:
          type: string
      context_query:
        type: string
        description: Context-string for AI to match items by similarity
        optional: true
      search_query:
        type: string
        description: Text to search in contents of items
        optional: true
      search_targets:
        type: array
        description: Fields to search in exclusively, such as name or description.
        optional: true
        items:
          type: string
      status_categories:
        type: array
        description: Only items whose status is in these categories.
        optional: true
        items:
          type: string
      workspace_ids:
        type: array
        description: Narrow down the search to specific workspaces
        optional: true
        items:
          type: string
    output:
      description: A page of matching items.
      type: object

  search_partial_items_globally:
    title: Search items across workspaces, partially
    description: >-
      The global item search returning only the properties you name, which keeps large result
      sets small.
    category: items
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /global-search/partial
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      body:
        properties: ${properties}
        query: ${query}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
      properties:
        type: array
        description: Item properties to return; empty returns only ids.
        items:
          type: string
      query:
        type: object
        description: 'The search: {searchQuery, contextQuery, workspaceIds, assigneeUserIds,
          statusCategories, archived}.'
    output:
      description: A page of partial items.
      type: object

  get_notification_settings:
    title: Get notification settings
    description: >-
      Read the caller's notification settings.
    category: profile
    scopes:
    - profile:read
    read_only: true
    request:
      method: GET
      path: /notifications/settings
    input: {}
    output:
      description: The notification settings.
      type: object

  update_notification_settings:
    title: Update notification settings
    description: >-
      Change the caller's notification settings.
    category: profile
    scopes:
    - profile
    request:
      method: POST
      path: /notifications/settings
      body:
        settings: ${settings}
    input:
      settings:
        type: object
        description: Notification settings object, as returned by get_notification_settings.
    output:
      description: The updated settings.
      type: object

  search_items:
    title: Search items
    description: >-
      Find items in a workspace by name, status, assignee, custom field value, parent, dates
      and more, sorted and paged. Returns full items.
    category: items
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /${workspace_id}/items/search
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      body:
        archived: ${archived}
        filter: ${filter}
        sort: ${sort}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
      archived:
        type: boolean
        description: True for archived items only; active items by default.
        optional: true
      filter:
        type: object
        description: 'Filter tree, discriminated by type. Combine with {type: and|or, inner:
          [...]} or {type: not, inner: {...}}. Leaf types include name:contain {text, caseSensitive},
          name:equal, alias:contain, description:contain, assignees:contain / containsAny
          / containsAll {ids}, assignees:defined, status:containsAny {ids}, statusCategory:containsAny,
          archived:value, parent:value, parent:defined, field:value {fieldId, filter}, createdAt
          / lastUpdatedAt :relative / :range / :absolute, updated:since, id:any and item:watchSelf.'
        optional: true
      sort:
        type: object
        description: 'Sort as {type, direction: asc|desc}, where type is order (the default),
          name, createdAt, lastUpdatedAt, status, parent, field {fieldId} or fieldType.'
        optional: true
    output:
      description: A page of items.
      type: object

  search_partial_items:
    title: Search items, partially
    description: >-
      Search a workspace's items returning only the properties you name -- the efficient way
      to scan many items.
    category: items
    scopes:
    - workspace:read
    read_only: true
    request:
      method: POST
      path: /${workspace_id}/items/search/partial
      query:
        actAsAdmin: ${act_as_admin}
        offset: ${offset}
        limit: ${limit}
      body:
        properties: ${properties}
        query: ${query}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      offset:
        type: integer
        description: How many results to skip.
        optional: true
      limit:
        type: integer
        description: How many results to return.
        optional: true
      properties:
        type: array
        description: Item properties to return, e.g. name, statusId, fields.
        items:
          type: string
      query:
        type: object
        description: 'The search: {filter, sort, archived}, as for search_items.'
        optional: true
    output:
      description: A page of partial items.
      type: object

  create_item:
    title: Create an item
    description: >-
      Create an item in a workspace with a name, markdown description, status, assignees,
      colour and custom field values.
    category: items
    scopes:
    - workspace
    request:
      method: POST
      path: /${workspace_id}/items
      query:
        actAsAdmin: ${act_as_admin}
      headers:
        content-type: application/vnd.airfocus.markdown+json
      body:
        archived: ${archived}
        assigneeUserGroupIds: ${assignee_user_group_ids}
        assigneeUserIds: ${assignee_user_ids}
        color: ${color}
        description:
          $when: ${description}
          markdown: ${description}
          richText: true
        fields: ${fields}
        name: ${name}
        order: ${order}
        statusId: ${status_id}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      archived:
        type: boolean
        description: True to archive the item.
        optional: true
      assignee_user_group_ids:
        type: array
        description: Ids of user groups to assign.
        optional: true
        items:
          type: string
      assignee_user_ids:
        type: array
        description: Ids of users to assign.
        optional: true
        items:
          type: string
      color:
        type: string
        description: Item colour.
        optional: true
      description:
        type: string
        description: Rich text as markdown; sent in Airfocus's {markdown, richText} envelope.
        optional: true
      fields:
        type: object
        description: Custom field values keyed by field id, each in that field type's value
          format.
        optional: true
      name:
        type: string
        description: Name (title) of this item.
      order:
        type: integer
        description: Sort position; appended at the end when omitted.
        optional: true
      status_id:
        type: string
        description: Status id; defaults to the workspace's first status.
        optional: true
    output:
      description: The created item.
      type: object

  get_item:
    title: Get an item
    description: >-
      Read one item with its description, status, assignees, field values and alias.
    category: items
    scopes:
    - workspace:read
    read_only: true
    request:
      method: GET
      path: /${workspace_id}/items/${item_id}
      query:
        actAsAdmin: ${act_as_admin}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
