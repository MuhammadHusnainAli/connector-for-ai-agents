    description: 'Start multipart upload session Start a multipart upload session. Use this endpoint when
      you need to upload a file larger than 10 MB to a batch. The multipart upload process consists of
      three steps: 1. Create a multipart upload session (this endpoint) 2. Upload file parts to the session
      3. Commit the session to finalize the upload Calls POST /v2/batches/multipart-upload on the provider''s
      API.'
    category: batches
    request:
      method: POST
      path: /v2/batches/multipart-upload
      body:
