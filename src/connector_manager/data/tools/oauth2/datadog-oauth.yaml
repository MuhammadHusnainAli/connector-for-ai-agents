  delete_dashboards:
    title: Delete dashboards
    description: >-
      Delete several dashboards at once. Datadog keeps them recoverable for a
      short window -- restore_dashboards is the undo -- but this still removes
      them from everyone's view immediately.
    category: dashboards
    destructive: true
    request:
      method: DELETE
