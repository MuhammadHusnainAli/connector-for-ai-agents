# Agentset tools -- agentic retrieval-augmented generation as a service.
#
# Every path, parameter and body field below comes from the OpenAPI 3.1
# description Agentset publishes at https://api.agentset.ai/openapi.json, which
# covers 23 operations; all 23 are here.
#
# The connection's base url is https://api.agentset.ai/v1, so paths start at
# /namespace rather than /v1/namespace.
#
# The model is: a namespace is a knowledge base with its own embedding model and
# vector store (both fixed at creation); an ingest job feeds it content; each job
# yields one or more documents, which are chunked and embedded; search queries a
# namespace. Ingestion is asynchronous -- create the job, then poll get_ingest_job
# until it completes before expecting search hits.
#
# create_ingest_job takes any of the six payload shapes. The ingest_* tools
# beside it are the same endpoint with the payload spelled out for the common
# cases (text, a file URL, an uploaded file, a website crawl, YouTube), so a
# model does not have to assemble the discriminated union itself.
#
# Local files go in two steps: create_upload returns a presigned URL and a key,
# the file is PUT to that URL outside this API, and ingest_uploaded_file then
# ingests it by key.
#
# Multi-tenant namespaces take an x-tenant-id header on the ingest, document and
# search routes; every tool that accepts it exposes it as tenant_id.
#
# Docs: https://docs.agentset.ai/api-reference

connector_id: agentset
display_name: Agentset
docs_url: https://docs.agentset.ai/api-reference
tools:

  list_namespaces:
    title: List namespaces
    description: >-
      List every namespace (knowledge base) in the organization, with its id, slug, embedding
      model and vector store. Start here to find the namespace id every other tool needs.
    category: namespaces
    read_only: true
    request:
      method: GET
      path: /namespace
    input: {}
    output:
      description: The organization's namespaces.
      type: array
      items:
        type: object
      response_path: data

  create_namespace:
    title: Create a namespace
    description: >-
      Create a namespace to hold documents. The embedding model and vector store default to
      Agentset's managed ones and cannot be changed after creation, so choose deliberately
      if you pass either.
    category: namespaces
    request:
      method: POST
      path: /namespace
      body:
        name: ${name}
        slug: ${slug}
        embeddingConfig: ${embedding_config}
        vectorStoreConfig: ${vector_store_config}
    input:
      name:
        type: string
        description: Display name.
      slug:
        type: string
        description: URL-safe slug, unique within the organization.
      embedding_config:
        type: object
        description: 'Embedding model: {provider, model, apiKey...} for OPENAI, AZURE_OPENAI,
          VOYAGE or GOOGLE, or {provider: MANAGED_OPENAI, model: text-embedding-3-large}.
          Omit for the managed default. Fixed once created.'
        optional: true
      vector_store_config:
        type: object
        description: 'Vector store: a provider (such as PINECONE or TURBOPUFFER) with its
          credentials. Omit for the managed Pinecone store. Fixed once created.'
        optional: true
    output:
      description: The created namespace.
      type: object
      response_path: data

  get_namespace:
    title: Get a namespace
    description: >-
      Read one namespace -- name, slug, embedding and vector store config, and its document
      and page counts.
    category: namespaces
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
    output:
      description: The namespace.
      type: object
      response_path: data

  update_namespace:
    title: Rename a namespace
    description: >-
      Change a namespace's name or slug. Nothing else about a namespace is editable; an unchanged
      request returns it as is.
    category: namespaces
    request:
      method: PATCH
      path: /namespace/${namespace_id}
      body:
        name: ${name}
        slug: ${slug}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      name:
        type: string
        description: Display name.
        optional: true
      slug:
        type: string
        description: URL-safe slug, unique within the organization.
        optional: true
    output:
      description: The updated namespace.
      type: object
      response_path: data

  delete_namespace:
    title: Delete a namespace
    description: >-
      Delete a namespace and every ingest job, document and vector in it. This cannot be undone.
    category: namespaces
    destructive: true
    request:
      method: DELETE
      path: /namespace/${namespace_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
    output:
      description: Confirmation of the deletion.
      type: object

  warm_up_namespace:
    title: Warm a namespace's cache
    description: >-
      Pre-load a namespace into the vector store's cache so the first searches are fast. Only
      Turbopuffer-backed namespaces support it; others return an error.
    category: namespaces
    request:
      method: POST
      path: /namespace/${namespace_id}/warm-up
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: Confirmation that the warm-up started.
      type: object

  list_ingest_jobs:
    title: List ingest jobs
    description: >-
      Page through a namespace's ingest jobs, newest or oldest first, optionally only those
      in given statuses (QUEUED, PROCESSING, COMPLETED, FAILED and so on). Cursor-paginated.
    category: ingestion
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}/ingest-jobs
      query:
        statuses: ${statuses}
        orderBy: ${order_by}
        order: ${order}
        cursor: ${cursor}
        cursorDirection: ${cursor_direction}
        perPage: ${per_page}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      statuses:
        type: array
        description: Only items in these statuses.
        optional: true
        items:
          type: string
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum:
        - createdAt
      order:
        type: string
        description: Sort direction.
        optional: true
        enum:
        - asc
        - desc
      cursor:
        type: string
        description: Cursor from the previous page's pagination block.
        optional: true
      cursor_direction:
        type: string
        description: Whether the cursor pages forward or backward.
        optional: true
        enum:
        - forward
        - backward
      per_page:
        type: number
        description: Items per page.
        optional: true
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: A page of ingest jobs with a pagination cursor.
      type: object

  create_ingest_job:
    title: Create an ingest job
    description: >-
      Ingest content into a namespace from any supported source. payload.type picks the shape:
      TEXT {text, fileName}, FILE {fileUrl, fileName}, MANAGED_FILE {key, fileName}, CRAWL
      {url, maxDepth, limit, includePaths, excludePaths, headers}, YOUTUBE {urls, transcriptLanguages,
      includeMetadata} or BATCH {items: [...]}. Prefer the ingest_* tools for a single source.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        payload: ${payload}
        config: ${config}
        externalId: ${external_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      payload:
        type: object
        description: 'The source, discriminated by type: TEXT, FILE, MANAGED_FILE, CRAWL,
          YOUTUBE or BATCH, with that type''s fields.'
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
      name:
        type: string
        description: Display name.
        optional: true
      config:
        type: object
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
        optional: true
      external_id:
        type: string
        description: A unique external ID of the ingest job. You can use this to identify
          the ingest job in your system.
        optional: true
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  ingest_text:
    title: Ingest text
    description: >-
      Ingest a block of plain text or markdown into a namespace as one document. Ingestion
      is asynchronous; poll get_ingest_job for completion.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        externalId: ${external_id}
        config: ${config}
        payload:
          type: TEXT
          text: ${text}
          fileName: ${file_name}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      text:
        type: string
        description: The text to ingest.
        min_length: 1
      tenant_id:
        type: string
        optional: true
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
      file_name:
        type: string
        optional: true
        description: File name to record on the resulting document.
      name:
        type: string
        optional: true
        description: Name for the ingest job.
      external_id:
        type: string
        optional: true
        description: Your own unique id for the job, for matching it back to your system.
      config:
        type: object
        optional: true
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  ingest_file_url:
    title: Ingest a file from a URL
    description: >-
      Ingest a document Agentset can download from a public URL -- PDF, Word, PowerPoint,
      HTML, images and the other formats its parser reads.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        externalId: ${external_id}
        config: ${config}
        payload:
          type: FILE
          fileUrl: ${file_url}
          fileName: ${file_name}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      file_url:
        type: string
        format: uri
        description: Publicly reachable URL of the file.
      tenant_id:
        type: string
        optional: true
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
      file_name:
        type: string
        optional: true
        description: File name to record on the resulting document.
      name:
        type: string
        optional: true
        description: Name for the ingest job.
      external_id:
        type: string
        optional: true
        description: Your own unique id for the job, for matching it back to your system.
      config:
        type: object
        optional: true
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  ingest_uploaded_file:
    title: Ingest an uploaded file
    description: >-
      Ingest a file already uploaded through create_upload or create_batch_upload, by the
      key those returned.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        externalId: ${external_id}
        config: ${config}
        payload:
          type: MANAGED_FILE
          key: ${key}
          fileName: ${file_name}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      key:
        type: string
        description: The key create_upload returned for the file.
      tenant_id:
        type: string
        optional: true
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
      file_name:
        type: string
        optional: true
        description: File name to record on the resulting document.
      name:
        type: string
        optional: true
        description: Name for the ingest job.
      external_id:
        type: string
        optional: true
        description: Your own unique id for the job, for matching it back to your system.
      config:
        type: object
        optional: true
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  crawl_website:
    title: Crawl and ingest a website
    description: >-
      Crawl a site from a starting URL and ingest every page reached, bounded by link depth
      (default 5) and page count (default 50), optionally only under or never under given
      path prefixes.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        externalId: ${external_id}
        config: ${config}
        payload:
          type: CRAWL
          url: ${url}
          maxDepth: ${max_depth}
          limit: ${limit}
          includePaths: ${include_paths}
          excludePaths: ${exclude_paths}
          headers: ${headers}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      url:
        type: string
        format: uri
        description: Starting URL.
      tenant_id:
        type: string
        optional: true
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
      max_depth:
        type: integer
        optional: true
        minimum: 1
        description: Link depth to follow; 1 is the starting page only.
      limit:
        type: integer
        optional: true
        minimum: 1
        description: Most pages to crawl.
      include_paths:
        type: array
        optional: true
        items:
          type: string
        description: Only crawl paths starting with one of these prefixes.
      exclude_paths:
        type: array
        optional: true
        items:
          type: string
        description: Never crawl paths starting with these prefixes.
      headers:
        type: object
        optional: true
        description: Extra HTTP headers to send with each crawl request, such as a cookie.
      name:
        type: string
        optional: true
        description: Name for the ingest job.
      external_id:
        type: string
        optional: true
        description: Your own unique id for the job, for matching it back to your system.
      config:
        type: object
        optional: true
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  ingest_youtube:
    title: Ingest YouTube transcripts
    description: >-
      Ingest the transcripts of YouTube videos, or of every video in a channel or playlist.
      Hosts must be www.youtube.com or youtu.be.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs
      headers:
        x-tenant-id: ${tenant_id}
      body:
        name: ${name}
        externalId: ${external_id}
        config: ${config}
        payload:
          type: YOUTUBE
          urls: ${urls}
          transcriptLanguages: ${transcript_languages}
          includeMetadata: ${include_metadata}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      urls:
        type: array
        items:
          type: string
        min_length: 1
        description: Video, channel or playlist URLs.
      tenant_id:
        type: string
        optional: true
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
      transcript_languages:
        type: array
        optional: true
        items:
          type: string
        description: Language codes to try in order for the transcript; defaults to en.
      include_metadata:
        type: boolean
        optional: true
        description: Also ingest the description, tags, category and duration.
      name:
        type: string
        optional: true
        description: Name for the ingest job.
      external_id:
        type: string
        optional: true
        description: Your own unique id for the job, for matching it back to your system.
      config:
        type: object
        optional: true
        description: 'Parsing and chunking config: chunkSize (characters, default 2048), delimiter,
          metadata (flat map of strings, numbers, booleans or string arrays added to every
          document), languageCode, mode (fast, balanced or accurate) and the image, chart
          and header/footer extraction switches.'
    output:
      description: The created ingest job, with its id and QUEUED status.
      type: object
      response_path: data

  get_ingest_job:
    title: Get an ingest job
    description: >-
      Read one ingest job's status, payload, config and timestamps. Poll this after creating
      a job; content is searchable once it is COMPLETED.
    category: ingestion
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}/ingest-jobs/${job_id}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      job_id:
        type: string
        description: Ingest job id, prefixed job_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: The ingest job.
      type: object
      response_path: data

  delete_ingest_job:
    title: Delete an ingest job
    description: >-
      Delete an ingest job together with the documents and vectors it produced.
    category: ingestion
    destructive: true
    request:
      method: DELETE
      path: /namespace/${namespace_id}/ingest-jobs/${job_id}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      job_id:
        type: string
        description: Ingest job id, prefixed job_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: Confirmation of the deletion.
      type: object

  reingest_job:
    title: Re-ingest a job
    description: >-
      Run an existing ingest job again from its original source -- the way to refresh a crawled
      site or a file that changed at its URL.
    category: ingestion
    request:
      method: POST
      path: /namespace/${namespace_id}/ingest-jobs/${job_id}/re-ingest
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      job_id:
        type: string
        description: Ingest job id, prefixed job_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: The re-queued ingest job.
      type: object

  create_upload:
    title: Get an upload URL
    description: >-
      Get a presigned URL for uploading one local file. PUT the bytes to the returned url
      with the same content type, then pass the returned key to ingest_uploaded_file. Files
      are capped at 200 MB (5 MB on Free).
    category: uploads
    request:
      method: POST
      path: /namespace/${namespace_id}/uploads
      body:
        fileName: ${file_name}
        contentType: ${content_type}
        fileSize: ${file_size}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      file_name:
        type: string
        description: File name
      content_type:
        type: string
        description: Content type
      file_size:
        type: number
        description: File size in bytes. The maximum is 200 MB (5 MB on the Free plan).
    output:
      description: The presigned url and the key to ingest the file by.
      type: object
      response_path: data

  create_batch_upload:
    title: Get upload URLs for several files
    description: >-
      Get presigned upload URLs for up to 100 files at once. Each files entry is {fileName,
      contentType, fileSize}; each result carries the url to PUT to and the key to ingest
      by.
    category: uploads
    request:
      method: POST
      path: /namespace/${namespace_id}/uploads/batch
      body:
        files: ${files}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      files:
        type: array
        description: Files to upload, each {fileName, contentType, fileSize in bytes}; 1 to
          100 entries.
        items:
          type: object
    output:
      description: One presigned url and key per file, in order.
      type: object
      response_path: data

  list_documents:
    title: List documents
    description: >-
      Page through the documents in a namespace, optionally only those from one ingest job
      or in given statuses. Cursor-paginated.
    category: documents
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}/documents
      query:
        statuses: ${statuses}
        orderBy: ${order_by}
        order: ${order}
        ingestJobId: ${ingest_job_id}
        cursor: ${cursor}
        cursorDirection: ${cursor_direction}
        perPage: ${per_page}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      statuses:
        type: array
        description: Only items in these statuses.
        optional: true
        items:
          type: string
      order_by:
        type: string
        description: Field to sort by.
        optional: true
        enum:
        - createdAt
      order:
        type: string
        description: Sort direction.
        optional: true
        enum:
        - asc
        - desc
      ingest_job_id:
        type: string
        description: Only documents produced by this ingest job.
        optional: true
      cursor:
        type: string
        description: Cursor from the previous page's pagination block.
        optional: true
      cursor_direction:
        type: string
        description: Whether the cursor pages forward or backward.
        optional: true
        enum:
        - forward
        - backward
      per_page:
        type: number
        description: Items per page.
        optional: true
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: A page of documents with a pagination cursor.
      type: object

  get_document:
    title: Get a document
    description: >-
      Read one document -- its source, status, character and chunk counts, and any error from
      processing.
    category: documents
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}/documents/${document_id}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      document_id:
        type: string
        description: Document id, prefixed doc_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: The document.
      type: object
      response_path: data

  delete_document:
    title: Delete a document
    description: >-
      Delete one document and remove its chunks from the vector store, leaving the rest of
      its ingest job in place.
    category: documents
    destructive: true
    request:
      method: DELETE
      path: /namespace/${namespace_id}/documents/${document_id}
      headers:
        x-tenant-id: ${tenant_id}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      document_id:
        type: string
        description: Document id, prefixed doc_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
    output:
      description: Confirmation of the deletion.
      type: object

  get_document_chunks_url:
    title: Get a document's chunks download URL
    description: >-
      Get a short-lived URL to download the chunks a completed document was split into, for
      inspecting exactly what search sees.
    category: documents
    read_only: true
    request:
      method: POST
      path: /namespace/${namespace_id}/documents/${document_id}/chunks-download-url
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      document_id:
        type: string
        description: Document id, prefixed doc_.
    output:
      description: A presigned download url.
      type: object
      response_path: data

  get_document_file_url:
    title: Get a document's source file URL
    description: >-
      Get a short-lived URL to download the original file behind a document. Only documents
      ingested from an uploaded (MANAGED_FILE) source have one.
    category: documents
    read_only: true
    request:
      method: POST
      path: /namespace/${namespace_id}/documents/${document_id}/file-download-url
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      document_id:
        type: string
        description: Document id, prefixed doc_.
    output:
      description: A presigned download url.
      type: object
      response_path: data

  search_namespace:
    title: Search a namespace
    description: >-
      Retrieve the chunks most relevant to a query, semantically or by keyword, reranked by
      default. Narrow with a metadata filter and a minimum score. This is retrieval only --
      it returns passages, not a generated answer.
    category: search
    read_only: true
    request:
      method: POST
      path: /namespace/${namespace_id}/search
      headers:
        x-tenant-id: ${tenant_id}
      body:
        query: ${query}
        topK: ${top_k}
        rerank: ${rerank}
        rerankLimit: ${rerank_limit}
        rerankModel: ${rerank_model}
        filter: ${filter}
        minScore: ${min_score}
        includeRelationships: ${include_relationships}
        includeMetadata: ${include_metadata}
        keywordFilter: ${keyword_filter}
        mode: ${mode}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      tenant_id:
        type: string
        description: Tenant id to scope the call to, for multi-tenant namespaces. Alphanumeric;
          omit to use the namespace directly.
        optional: true
      query:
        type: string
        description: The query to search for.
      top_k:
        type: number
        description: The number of results to fetch from the vector store. Defaults to 10.
        optional: true
      rerank:
        type: boolean
        description: Whether to rerank the results. Defaults to true.
        optional: true
      rerank_limit:
        type: number
        description: The number of results to return after reranking. Defaults to topK.
        optional: true
      rerank_model:
        type: string
        description: The reranking model to use.
        optional: true
        enum:
        - cohere:rerank-v4.0-pro
        - cohere:rerank-v4.0-fast
        - cohere:rerank-v3.5
        - cohere:rerank-english-v3.0
        - cohere:rerank-multilingual-v3.0
        - zeroentropy:zerank-2
        - zeroentropy:zerank-1
        - zeroentropy:zerank-1-small
      filter:
        type: object
        description: 'Metadata filter in the vector store''s syntax, e.g. {"category": {"$eq":
          "faq"}}.'
        optional: true
      min_score:
        type: number
        description: The minimum score to return.
        optional: true
      include_relationships:
        type: boolean
        description: Whether to include relationships in the results. Defaults to false.
        optional: true
      include_metadata:
        type: boolean
        description: Whether to include metadata in the results. Defaults to true.
        optional: true
      keyword_filter:
        type: string
        description: Keyword the chunks must contain.
        optional: true
      mode:
        type: string
        description: semantic (vector search, the default) or keyword.
        optional: true
        enum:
        - semantic
        - keyword
    output:
      description: The matching chunks with scores, text and metadata.
      type: array
      items:
        type: object
      response_path: data

  get_hosting:
    title: Get hosting configuration
    description: >-
      Read the hosted chat and search page configuration for a namespace -- title, slug, access
      control, system prompt, models and example questions.
    category: hosting
    read_only: true
    request:
      method: GET
      path: /namespace/${namespace_id}/hosting
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
    output:
      description: The hosting configuration.
      type: object
      response_path: data

  enable_hosting:
    title: Enable hosting
    description: >-
      Turn on Agentset's hosted chat page for a namespace, with default settings. Configure
      it afterwards with update_hosting.
    category: hosting
    request:
      method: POST
      path: /namespace/${namespace_id}/hosting
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
    output:
      description: The new hosting configuration.
      type: object
      response_path: data

  update_hosting:
    title: Update hosting configuration
    description: >-
      Configure a namespace's hosted chat page: branding and Open Graph tags, password-free
      access limited to emails or domains, the system prompt, example questions, the LLM and
      rerank models, and retrieval depth.
    category: hosting
    request:
      method: PATCH
      path: /namespace/${namespace_id}/hosting
      body:
        title: ${title}
        slug: ${slug}
        logo: ${logo}
        ogTitle: ${og_title}
        ogDescription: ${og_description}
        ogImage: ${og_image}
        protected: ${protected}
        allowedEmails: ${allowed_emails}
        allowedEmailDomains: ${allowed_email_domains}
        systemPrompt: ${system_prompt}
        exampleQuestions: ${example_questions}
        exampleSearchQueries: ${example_search_queries}
        welcomeMessage: ${welcome_message}
        citationMetadataPath: ${citation_metadata_path}
        searchEnabled: ${search_enabled}
        rerankModel: ${rerank_model}
        llmModel: ${llm_model}
        topK: ${top_k}
        rerankLimit: ${rerank_limit}
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
      title:
        type: string
        description: Page title.
        optional: true
      slug:
        type: string
        description: Public slug of the hosted page.
        optional: true
      logo:
        type: string
        description: Logo image URL.
        optional: true
      og_title:
        type: string
        description: Open Graph title.
        optional: true
      og_description:
        type: string
        description: Open Graph description.
        optional: true
      og_image:
        type: string
        description: Open Graph image URL.
        optional: true
      protected:
        type: boolean
        description: True to require sign-in, limited to allowed_emails and allowed_email_domains.
        optional: true
      allowed_emails:
        type: array
        description: Email addresses allowed in when protected.
        optional: true
        items:
          type: string
      allowed_email_domains:
        type: array
        description: Email domains allowed in when protected.
        optional: true
        items:
          type: string
      system_prompt:
        type: string
        description: Custom instructions for the chat. Agentset always appends its retrieval
          and citation rules, so inline citations keep working. Send null or an empty string
          to reset to Agentset's default prompt.
        optional: true
      example_questions:
        type: array
        description: Suggested questions shown in chat.
        optional: true
        items:
          type: string
      example_search_queries:
        type: array
        description: Suggested queries shown in search.
        optional: true
        items:
          type: string
      welcome_message:
        type: string
        description: Message shown when a chat opens.
        optional: true
      citation_metadata_path:
        type: string
        description: Metadata key whose value is shown as a citation's source.
        optional: true
      search_enabled:
        type: boolean
        description: True to show the search tab alongside chat.
        optional: true
      rerank_model:
        type: string
        description: Reranking model.
        optional: true
        enum:
        - cohere:rerank-v4.0-pro
        - cohere:rerank-v4.0-fast
        - cohere:rerank-v3.5
        - cohere:rerank-english-v3.0
        - cohere:rerank-multilingual-v3.0
        - zeroentropy:zerank-2
        - zeroentropy:zerank-1
        - zeroentropy:zerank-1-small
      llm_model:
        type: string
        description: Model that writes chat answers.
        optional: true
        enum:
        - openai:gpt-4.1
        - openai:gpt-5.5
        - openai:gpt-5.2
        - openai:gpt-5.1
        - openai:gpt-5
        - openai:gpt-5-mini
        - openai:gpt-5-nano
      top_k:
        type: integer
        description: Chunks to retrieve per question.
        optional: true
      rerank_limit:
        type: integer
        description: Chunks kept after reranking.
        optional: true
    output:
      description: The updated hosting configuration.
      type: object
      response_path: data

  disable_hosting:
    title: Disable hosting
    description: >-
      Turn off and delete a namespace's hosted chat page and its configuration. The namespace's
      data is untouched.
    category: hosting
    destructive: true
    request:
      method: DELETE
      path: /namespace/${namespace_id}/hosting
    input:
      namespace_id:
        type: string
        description: Namespace id, prefixed ns_.
    output:
      description: Confirmation of the deletion.
      type: object
