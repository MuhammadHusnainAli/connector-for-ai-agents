      to_date:
        type: string
        description: Latest evaluation date, as a UTC ISO 8601 timestamp.
        optional: true
      scorecard_uuids:
        type: array
        description: Scorecard template uuids to restrict to.
        optional: true
        items: {type: string}
      meeting_uuid:
        type: string
        description: Restrict to evaluations on one meeting.
        optional: true
      user_emails:
        type: array
        description: Emails of the users the evaluations are about.
        optional: true
        items: {type: string}
      page_size:
        type: integer
        description: Evaluations per page.
        optional: true
    output:
      description: A page of scorecard evaluations with their scores.
      type: object

  list_engagement_metrics:
    title: List engagement metrics for all users
    description: >-
      Read per-user engagement over a date window -- conversations listened to,
      snippets played, meetings shared and commented on -- which is how you see
      who actually uses the recordings.
    category: engagement
    read_only: true
    request:
      method: GET
      path: /v1/engagement/
      query:
        from_date: "${from_date}"
        to_date: "${to_date}"
        user_email: "${user_email}"
        is_call: "${is_call}"
        is_internal: "${is_internal}"
        meeting_type_uuid: "${meeting_type_uuid}"
        meeting_outcome_uuid: "${meeting_outcome_uuid}"
        recording_duration__gte: "${min_recording_duration}"
        recording_duration__lte: "${max_recording_duration}"
        shared_meetings_only: "${shared_meetings_only}"
        is_impromptu: "${is_impromptu}"
        o: "${order}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      from_date:
        type: string
        description: Earliest meeting start, as a UTC ISO 8601 timestamp.
      to_date:
        type: string
        description: Latest meeting start, as a UTC ISO 8601 timestamp.
      user_email:
        type: array
        description: Restrict to these user emails.
        optional: true
        items: {type: string}
      is_call:
        type: boolean
        description: True for voice calls only, false for video meetings only.
        optional: true
      is_internal:
        type: boolean
        description: True for internal meetings only, false for external ones.
        optional: true
      meeting_type_uuid:
        type: array
        description: Restrict to these meeting type uuids.
        optional: true
        items: {type: string}
      meeting_outcome_uuid:
        type: array
        description: Restrict to these meeting outcome uuids.
        optional: true
        items: {type: string}
      min_recording_duration:
        type: number
        description: Only meetings at least this many seconds long.
        optional: true
      max_recording_duration:
        type: number
        description: Only meetings at most this many seconds long.
        optional: true
      shared_meetings_only:
        type: boolean
        description: True to count only meetings that were shared.
        optional: true
      is_impromptu:
        type: boolean
        description: True for unscheduled, ad-hoc meetings only.
        optional: true
      order:
        type: string
        description: Field to sort by; prefix with - for descending.
        optional: true
      page:
        type: integer
        description: Page number.
        optional: true
      page_size:
        type: integer
        description: Users per page, up to 100.
        optional: true
        maximum: 100
    output:
      description: A page of per-user engagement metrics.
      type: object

  get_user_engagement_metrics:
