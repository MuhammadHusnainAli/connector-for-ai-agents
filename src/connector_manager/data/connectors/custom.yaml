# Connector definitions: CUSTOM auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
github-app-oauth:
  alias: github
  auth_mode: CUSTOM
  authorization_url: ${connectionConfig.appPublicLink}/installations/new
  authorization_url_skip_encode:
  - base_url
  categories:
  - dev-tools
  - ticketing
  connection_config:
    appPublicLink:
      automated: true
      description: The public link of your GitHub App
      format: uri
      pattern: ^https?://.*$
      title: App Public Link
      type: string
    installation_id:
      automated: true
      description: The installation ID of your GitHub App
      example: '38631545'
      title: Installation ID
      type: string
  display_name: GitHub (App OAuth)
  post_connection_script: githubAppOauthPostConnection
  token_url:
    APP: https://api.github.com/app/installations/${connectionConfig.installation_id}/access_tokens
    OAUTH2: https://github.com/login/oauth/access_token
  webhook_routing_script: githubAppOauthWebhookRouting
