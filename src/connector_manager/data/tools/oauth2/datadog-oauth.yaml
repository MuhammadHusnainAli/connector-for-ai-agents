        default: 'False'
    output:
      description: The requested record.
      type: object

  get_cost_by_org:
    title: Get cost across multi-org account
    description: >-
      Get cost across multi-org account. Cost by org data for a given month
      becomes available no later than the 16th of the following month. Please
      use the new endpoint
      [`/historical_cost`](https://docs.datadoghq.com/api/latest/usage-metering/#get-historical-cost-across-your-account)
      instead. This endpoint is only accessible for [parent-level
      organizations](https://docs.datadoghq.com/account_management/multi_organization/).
    category: usage
    read_only: true
    request:
      method: GET
      path: /v2/usage/cost_by_org
      query:
        start_month: "${start_month}"
        end_month: "${end_month}"
    input:
      start_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost beginning this month.'
      end_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost ending this month.'
        optional: true
    output:
      description: The requested record.
      type: object

  get_monthly_cost_attribution:
    title: Get Monthly Cost Attribution
    description: >-
      Get monthly cost attribution by tag across multi-org and single root-org
      accounts. Cost Attribution data for a given month becomes available no
      later than the 19th of the following month. This API endpoint is
      paginated. To make sure you receive all records, check if the value of
      `next_record_id` is set in the response. If it is, make another request
      and pass `next_record_id` as a parameter. Pseudo code example:....
    category: usage
    read_only: true
    request:
      method: GET
      path: /v2/cost_by_tag/monthly_cost_attribution
      query:
        start_month: "${start_month}"
        end_month: "${end_month}"
        fields: "${fields}"
        sort_direction: "${sort_direction}"
        sort_name: "${sort_name}"
        tag_breakdown_keys: "${tag_breakdown_keys}"
        next_record_id: "${next_record_id}"
        include_descendants: "${include_descendants}"
    input:
      start_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost beginning in this month.'
      end_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost ending this month.'
        optional: true
      fields:
        type: string
        description: Comma-separated list specifying cost types (e.g., `<billing_dimension>_on_demand_cost`, `<billing_dimension>_committed_cost`, `<billing_dimension>_total_cost`) and the proportions (`<billing_dimension>_percentage_in_org`,...
      sort_direction:
        type: string
        description: 'The direction to sort by: `[desc, asc]`.'
        optional: true
      sort_name:
        type: string
        description: 'The billing dimension to sort by. Always sorted by total cost. Example: `infra_host`.'
        optional: true
      tag_breakdown_keys:
        type: string
        description: Comma separated list of tag keys used to group cost. If no value is provided the cost will not be broken down by tags. To see which tags are available, look for the value of `tag_config_source` in the API response.
        optional: true
      next_record_id:
        type: string
        description: List following results with a next_record_id provided in the previous query.
        optional: true
      include_descendants:
        type: boolean
        description: Include child org cost in the response. Defaults to `true`.
        optional: true
        default: 'True'
    output:
      description: The requested record.
      type: object

  get_top_custom_metrics:
    title: Get all custom metrics by hourly average
    description: >-
      The custom metrics with the highest average cardinality. The single most
      useful call for finding out why the custom-metrics bill is what it is.
    category: usage
    read_only: true
    request:
      method: GET
      path: /v1/usage/top_avg_metrics
      query:
        month: "${month}"
        day: "${day}"
        names: "${names}"
        limit: "${limit}"
        next_record_id: "${next_record_id}"
    input:
      month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: [YYYY-MM] for usage beginning at this hour. (Either month or day should be specified, but not both)'
        optional: true
      day:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to day: [YYYY-MM-DD] for usage beginning at this hour. (Either month or day should be specified, but not both)'
        optional: true
      names:
        type: array
        description: Comma-separated list of metric names.
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Maximum number of results to return (between 1 and 5000) - defaults to 500 results if limit not specified.
        optional: true
        default: '500'
      next_record_id:
        type: string
        description: List following results with a next_record_id provided in the previous query.
        optional: true
    output:
      description: The requested record.
      type: object

  get_log_usage_by_index:
