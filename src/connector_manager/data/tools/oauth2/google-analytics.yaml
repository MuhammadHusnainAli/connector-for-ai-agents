    - analytics
    - analytics.readonly
    read_only: true
  run_pivot_report_property:
    title: Run pivot report property
    description: Returns a customized pivot report of your Google Analytics event data. Pivot reports
      are more advanced and expressive formats than regular reports. In a pivot report, dimensions are
      only visible if they are included in a pivot. Multiple pivots can be specified to further dissect
      your data.
    category: properties
    request:
      method: POST
      path: /v1beta/${property}:runPivotReport
      base_url_override: https://analyticsdata.googleapis.com
      body:
        dimensionFilter: ${dimension_filter}
        pivots: ${pivots}
        property: ${body_property}
        dimensions: ${dimensions}
        keepEmptyRows: ${keep_empty_rows}
        metricFilter: ${metric_filter}
        returnPropertyQuota: ${return_property_quota}
        comparisons: ${comparisons}
        dateRanges: ${date_ranges}
        currencyCode: ${currency_code}
        cohortSpec: ${cohort_spec}
        metrics: ${metrics}
    input:
      property:
        type: string
        description: 'A Google Analytics property identifier whose events are tracked. Specified in the
          URL path and not the body. To learn more, see where to find your Property ID. Within a batch
          request, this property should either be unspecified or consistent with the batch-level property.
          Example: properties/1234'
      dimension_filter:
        type: string
        description: The filter clause of dimensions. Dimensions must be requested to be used in this
          filter. Metrics cannot be used in this filter.
        optional: true
      pivots:
        type: array
        items:
          type: string
        description: Describes the visual format of the report's dimensions in columns or rows. The union
          of the fieldNames (dimension names) in all pivots must be a subset of dimension names defined
          in Dimensions. No two pivots can share a dimension. A dimension is only visible if it appears
          in a pivot.
        optional: true
      body_property:
        type: string
        description: 'A Google Analytics property identifier whose events are tracked. Specified in the
          URL path and not the body. To learn more, see where to find your Property ID. Within a batch
          request, this property should either be unspecified or consistent with the batch-level property.
          Example: properties/1234'
        optional: true
      dimensions:
        type: array
        items:
          type: string
        description: 'The dimensions requested. All defined dimensions must be used by one of the following:
          dimension_expression, dimension_filter, pivots, order_bys.'
        optional: true
      keep_empty_rows:
        type: boolean
        description: If false or unspecified, each row with all metrics equal to 0 will not be returned.
          If true, these rows will be returned if they are not separately removed by a filter. Regardless
          of this keep_empty_rows setting, only data recorded by the Google Analytics property can be
          displayed in a report. For e
        optional: true
      metric_filter:
        type: string
        description: The filter clause of metrics. Applied at post aggregation phase, similar to SQL having-clause.
          Metrics must be requested to be used in this filter. Dimensions cannot be used in this filter.
        optional: true
      return_property_quota:
        type: boolean
        description: Toggles whether to return the current state of this Google Analytics property's quota.
          Quota is returned in [PropertyQuota](#PropertyQuota).
        optional: true
      comparisons:
        type: array
        items:
          type: string
        description: Optional. The configuration of comparisons requested and displayed. The request requires
          both a comparisons field and a comparisons dimension to receive a comparison column in the response.
        optional: true
      date_ranges:
        type: array
        items:
          type: string
        description: The date range to retrieve event data for the report. If multiple date ranges are
          specified, event data from each date range is used in the report. A special dimension with field
          name "dateRange" can be included in a Pivot's field names; if included, the report compares
          between date ranges. In a coh
        optional: true
      currency_code:
        type: string
        description: A currency code in ISO4217 format, such as "AED", "USD", "JPY". If the field is empty,
          the report uses the property's default currency.
        optional: true
      cohort_spec:
        type: string
        description: Cohort group associated with this request. If there is a cohort group in the request
          the 'cohort' dimension must be present.
        optional: true
      metrics:
        type: array
        items:
          type: string
        description: 'The metrics requested, at least one metric needs to be specified. All defined metrics
          must be used by one of the following: metric_expression, metric_filter, order_bys.'
        optional: true
    output:
      description: The RunPivotReportResponse resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
  run_realtime_report_property:
    title: Run realtime report property
    description: Returns a customized report of realtime event data for your property. Events appear in
