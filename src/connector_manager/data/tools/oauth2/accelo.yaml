# Accelo API v0 tools.
#
# Accelo is one API shape repeated over a dozen objects: every collection lists
# with the same five underscore-prefixed parameters, and every record is read
# by appending its id.
#
#   _fields   extra fields, comma separated, with linked objects nested --
#             "website,company(name)" -- or _ALL for everything
#   _filters  "status(1),date_created_after(1704067200)", ordered with
#             order_by_asc(field), combined with _AND / _OR / _not
#   _search   free text over the endpoint's own searchable fields
#   _limit    per page, default 10, maximum 100
#   _page     counted from 0
#
# Every response is wrapped: `meta` carries the status, `response` carries the
# data.
#
# Scopes are Accelo's own read(object) / write(object) form. Two rules follow
# from the documentation and are declared below: write access to an object
# includes read access to it, and read(all) / write(all) cover every object.
# Accelo also lets one granted scope name several objects at once --
# "read(companies,contacts)" -- so the pack sets expand_groups, without which a
# real grant would read as missing.
#
# Docs: https://api.accelo.com/docs/

connector_id: accelo
display_name: Accelo
docs_url: https://api.accelo.com/docs/

scope_rules:
  expand_groups: true
  implies:
    "read(all)":
      - read(companies)
      - read(contacts)
      - read(jobs)
      - read(issues)
      - read(activities)
      - read(invoices)
      - read(prospects)
      - read(tasks)
      - read(staff)
      - read(expenses)
      - read(contracts)
      - read(timers)
    "write(all)":
      - read(all)
      - write(companies)
      - write(contacts)
      - write(jobs)
      - write(issues)
      - write(activities)
      - write(invoices)
      - write(prospects)
      - write(tasks)
      - write(staff)
      - write(expenses)
      - write(contracts)
      - write(timers)
    "write(companies)":
      - read(companies)
    "write(contacts)":
      - read(contacts)
    "write(jobs)":
      - read(jobs)
    "write(issues)":
      - read(issues)
    "write(activities)":
      - read(activities)
    "write(invoices)":
      - read(invoices)
    "write(prospects)":
      - read(prospects)
    "write(tasks)":
      - read(tasks)
    "write(staff)":
      - read(staff)
    "write(expenses)":
      - read(expenses)
    "write(contracts)":
      - read(contracts)
    "write(timers)":
      - read(timers)

tools:

  list_companies:
    title: List companies
    description: >-
      Page through the organisations you do business with -- clients, prospects and suppliers. Narrow with _filters,
      search with _search, and pull linked objects in with _fields rather than
      making a second call.
    category: companies
    read_only: true
    scopes: ["read(companies)"]
    request:
      method: GET
      path: /api/v0/companies
      query:
        _fields: "${fields}"
        _filters: "${filters}"
        _search: "${search}"
        _limit: "${limit}"
        _page: "${page}"
    input:
      fields:
        type: string
        description: >-
          Extra fields to return beyond the defaults, comma separated. Linked
          objects nest, e.g. "website,company(name)". Pass _ALL for everything.
        optional: true
      filters:
        type: string
        description: >-
          Accelo filter expression, e.g. "status(1),date_created_after(1704067200)".
          Combine with commas, and order with order_by_asc(field).
        optional: true
      search:
        type: string
        description: Free-text search across this endpoint's searchable fields.
        optional: true
      limit:
        type: integer
        description: How many to return per page. Accelo's maximum is 100 and its default is 10.
        optional: true
        minimum: 1
        maximum: 100
      page:
        type: integer
        description: Which page to return, counted from 0.
        optional: true
        minimum: 0
    output:
      description: A page of companies, under the response object.
      type: object
      properties:
        meta: {type: object}
        response: {type: array}

  get_company:
    title: Get a company
    description: >-
      Read one record from the organisations you do business with -- clients, prospects and suppliers,
      by its id. Use _fields to pull in the linked objects you need alongside
      it.
    category: companies
    read_only: true
    scopes: ["read(companies)"]
    request:
      method: GET
      path: /api/v0/companies/${company_id}
      query:
        _fields: "${fields}"
    input:
      company_id:
        type: string
        description: The record's Accelo id, from list_companies.
      fields:
        type: string
        description: >-
          Extra fields to return beyond the defaults, comma separated. Pass
          _ALL for everything Accelo holds.
        optional: true
    output:
      description: The company.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  create_company:
    title: Create a company
    description: >-
      Add a record to the organisations you do business with -- clients, prospects and suppliers.
      `fields` takes name, status, website, phone and postal address; read an existing one first to see what else
      your deployment requires.
    category: companies
    scopes: ["write(companies)"]
    request:
      method: POST
      path: /api/v0/companies
      body: "${fields}"
    input:
      fields:
        type: object
        description: >-
          The record to create -- name, status, website, phone and postal address.
    output:
      description: The created company.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  update_company:
    title: Update a company
    description: >-
      Change fields on one record in the organisations you do business with -- clients, prospects and suppliers.
      Only the fields you send are written; the rest are left as they are.
    category: companies
    scopes: ["write(companies)"]
    request:
      method: PUT
      path: /api/v0/companies/${company_id}
      body: "${fields}"
    input:
      company_id:
        type: string
        description: The record's Accelo id.
      fields:
        type: object
        description: >-
          The fields to change -- any of name, status, website, phone and postal address.
    output:
      description: The updated company.
      type: object
      properties:
        meta: {type: object}
        response: {type: object}

  delete_company:
    title: Delete a company
    description: >-
      Permanently remove one record from the organisations you do business with -- clients, prospects and suppliers.
      Anything hanging off it in Accelo goes with it, and this cannot be undone
      through the API.
    category: companies
    destructive: true
    scopes: ["write(companies)"]
    request:
