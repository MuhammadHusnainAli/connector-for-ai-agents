  create_webhook:
    title: Create a webhooks integration
    description: >-
      Create a webhook integration, giving Datadog a url to POST to. Monitors
      then notify it with `@webhook-name`, which is how an alert reaches a
      system Datadog has no native integration with.
    category: integrations
    request:
      method: POST
      path: /v1/integration/webhooks/configuration/webhooks
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
