# Google Workspace Admin SDK tools.
#
# Built from Google's own discovery document for the API, which is the machine
# readable contract its client libraries are generated from -- so every path,
# parameter, enum, default and description here is Google's, and so are the
# per-tool OAuth scopes. That last part is what makes `check_tools()` useful on
# this connector: it can say which of these a given grant actually permits.
#
# This is the whole Directory API -- users, groups, group members, org units,
# roles and role assignments, domains, mobile and Chrome OS devices, buildings,
# rooms and other calendar resources, ASPs, tokens and verification codes --
# together with the Reports API's activity and usage reports.
#
# What to know before writing anything:
#
#   * these calls administer a real organisation. Suspending a user, deleting a
#     group or moving an org unit takes effect immediately for everyone in it;
#   * `customer` is usually the literal `my_customer`, which means "the domain
#     this token administers";
#   * most list calls page with `pageToken` and cap at a few hundred per page,
#     and the user list supports a `query` for filtering rather than a filter
#     parameter;
#   * the Reports API is the audit trail -- `list_activity` answers "who did
#     this and when", which is what an investigation actually needs.
#
# Docs: https://developers.google.com/admin-sdk/directory/reference/rest

connector_id: google-workspace-admin
display_name: Google Workspace Admin
docs_url: https://developers.google.com/workspace/admin/
scope_rules:
  strip_prefixes:
  - https://www.googleapis.com/auth/
  implies:
    admin.chrome.printers:
    - admin.chrome.printers.readonly
    admin.directory.customer:
    - admin.directory.customer.readonly
    admin.directory.device.chromeos:
    - admin.directory.device.chromeos.readonly
    admin.directory.device.mobile:
    - admin.directory.device.mobile.readonly
    admin.directory.domain:
    - admin.directory.domain.readonly
    admin.directory.group:
    - admin.directory.group.readonly
    admin.directory.group.member:
    - admin.directory.group.member.readonly
    admin.directory.orgunit:
    - admin.directory.orgunit.readonly
    admin.directory.resource.calendar:
    - admin.directory.resource.calendar.readonly
    admin.directory.rolemanagement:
    - admin.directory.rolemanagement.readonly
    admin.directory.user:
    - admin.directory.user.readonly
    admin.directory.user.alias:
    - admin.directory.user.alias.readonly
    admin.directory.userschema:
    - admin.directory.userschema.readonly
scope_discovery:
  method: GET
  base_url_override: https://oauth2.googleapis.com
  endpoint: /tokeninfo
  query:
    access_token: ${credentials.access_token}
  scopes_path: scope
tools:
  delete_asp:
    title: Delete asp
    description: Deletes an ASP issued by a user. Calls asps.delete on the Admin SDK API.
    category: asps
    request:
      method: DELETE
      path: /admin/directory/v1/users/${user_key}/asps/${code_id}
    input:
      code_id:
        type: integer
        description: The unique ID of the ASP to be deleted.
      user_key:
        type: string
        description: Identifies the user in the API request. The value can be the user's primary email
          address, alias email address, or unique user ID.
    output:
      description: What the API returned.
      type: object
    scopes:
    - admin.directory.user.security
    destructive: true
  get_asp:
    title: Get asp
    description: Gets information about an ASP issued by a user.
    category: asps
    request:
      method: GET
      path: /admin/directory/v1/users/${user_key}/asps/${code_id}
    input:
      code_id:
        type: integer
        description: The unique ID of the ASP.
      user_key:
        type: string
        description: Identifies the user in the API request. The value can be the user's primary email
          address, alias email address, or unique user ID.
    output:
      description: The Asp resource.
      type: object
    scopes:
    - admin.directory.user.security
    read_only: true
  list_asps:
    title: List asps
    description: Lists the ASPs issued by a user. Calls asps.list on the Admin SDK API.
    category: asps
    request:
      method: GET
      path: /admin/directory/v1/users/${user_key}/asps
    input:
      user_key:
        type: string
        description: Identifies the user in the API request. The value can be the user's primary email
          address, alias email address, or unique user ID.
    output:
      description: The Asps resource.
      type: object
    scopes:
    - admin.directory.user.security
    read_only: true
  stop_channel:
    title: Stop channel
    description: Stops watching resources through this channel.
    category: channels
    request:
      method: POST
      path: /admin/directory_v1/channels/stop
      body:
        resourceId: ${resource_id}
        expiration: ${expiration}
        payload: ${payload}
        params: ${params}
        address: ${address}
        type: ${type}
        resourceUri: ${resource_uri}
        token: ${token}
    input:
      resource_id:
        type: string
        description: An opaque ID that identifies the resource being watched on this channel. Stable across
          different API versions.
        optional: true
      expiration:
        type: string
        description: Date and time of notification channel expiration, expressed as a Unix timestamp,
          in milliseconds. Optional.
        optional: true
      payload:
        type: boolean
        description: A Boolean value to indicate whether payload is wanted. Optional.
        optional: true
      params:
        type: object
        description: Additional parameters controlling delivery channel behavior. Optional. For example,
          params.ttl specifies the time-to-live in seconds for the notification channel, where the default
          is 2 hours and the maximum TTL is 2 days.
        optional: true
      address:
        type: string
        description: The address where notifications are delivered for this channel.
        optional: true
      type:
        type: string
        description: The type of delivery mechanism used for this channel.
        optional: true
      resource_uri:
        type: string
        description: A version-specific identifier for the watched resource.
        optional: true
      token:
        type: string
        description: An arbitrary string delivered to the target address with each notification delivered
          over this channel. Optional.
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes_any:
    - admin.directory.user
    - admin.directory.user.alias
    - admin.directory.user.alias.readonly
    - admin.directory.user.readonly
    - cloud-platform
  action_chromeosdevice:
    title: Action chromeosdevice
    description: Use BatchChangeChromeOsDeviceStatus instead. Takes an action that affects a Chrome OS
      Device. This includes deprovisioning, disabling, and re-enabling devices. *Warning:* * Deprovisioning
      a device will stop device policy syncing and remove device-level printers. After a device is deprovisioned,
      it must be wiped before it can be re-enrolled. * Lost or stolen devices should use the disable action.
      * Re-enabling a disab
    category: chromeosdevices
    request:
      method: POST
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${resource_id}/action
      body:
        deprovisionReason: ${deprovision_reason}
        action: ${action}
    input:
      customer_id:
        type: string
        description: The unique ID for the customer's Google Workspace account. As an account administrator,
          you can also use the my_customer alias to represent your account's customerId. The customerId
          is also returned as part of the Users resource.
      resource_id:
        type: string
        description: The unique ID of the device. The resourceIds are returned in the response from the
          chromeosdevices.list method.
      deprovision_reason:
        type: string
        description: 'Only used when the action is deprovision. With the deprovision action, this field
          is required. *Note*: The deprovision reason is audited because it might have implications on
          licenses for perpetual subscription customers.'
        optional: true
      action:
        type: string
        description: Action to be taken on the Chrome OS device.
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes:
    - admin.directory.device.chromeos
  get_chromeosdevice:
    title: Get chromeosdevice
    description: Retrieves a Chrome OS device's properties.
    category: chromeosdevices
    request:
      method: GET
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${device_id}
      query:
        projection: ${projection}
    input:
      customer_id:
        type: string
        description: The unique ID for the customer's Google Workspace account. As an account administrator,
          you can also use the my_customer alias to represent your account's customerId. The customerId
          is also returned as part of the Users resource.
      device_id:
        type: string
        description: The unique ID of the device. The deviceIds are returned in the response from the
          chromeosdevices.list method.
      projection:
        type: string
        description: Determines whether the response contains the full list of properties or only a subset.
        optional: true
        enum:
        - BASIC
        - FULL
    output:
      description: The ChromeOsDevice resource.
      type: object
    scopes_any:
    - admin.directory.device.chromeos
    - admin.directory.device.chromeos.readonly
    read_only: true
  list_chromeosdevices:
    title: List chromeosdevices
    description: Retrieves a paginated list of Chrome OS devices within an account.
    category: chromeosdevices
    request:
      method: GET
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos
      query:
        includeChildOrgunits: ${include_child_orgunits}
        maxResults: ${max_results}
        orderBy: ${order_by}
        orgUnitPath: ${org_unit_path}
        pageToken: ${page_token}
        projection: ${projection}
        query: ${query}
        sortOrder: ${sort_order}
    input:
      customer_id:
        type: string
        description: The unique ID for the customer's Google Workspace account. As an account administrator,
          you can also use the my_customer alias to represent your account's customerId. The customerId
          is also returned as part of the Users resource.
      include_child_orgunits:
        type: boolean
        description: Return devices from all child orgunits, as well as the specified org unit. If this
          is set to true, 'orgUnitPath' must be provided.
        optional: true
      max_results:
        type: integer
        description: Maximum number of results to return. Value should not exceed 300.
        optional: true
        default: 100
      order_by:
        type: string
        description: Device property to use for sorting results.
        optional: true
        enum:
        - annotatedLocation
        - annotatedUser
        - lastSync
        - notes
        - serialNumber
        - status
      org_unit_path:
        type: string
        description: The full path of the organizational unit (minus the leading /) or its unique ID.
        optional: true
      page_token:
        type: string
        description: The pageToken query parameter is used to request the next page of query results.
          The follow-on request's pageToken query parameter is the nextPageToken from your previous response.
        optional: true
      projection:
        type: string
        description: Determines whether the response contains the full list of properties or only a subset.
        optional: true
        enum:
        - BASIC
        - FULL
      query:
        type: string
        description: Search string in the format given at List query operators.
        optional: true
      sort_order:
        type: string
        description: Whether to return results in ascending or descending order. Must be used with the
          orderBy parameter.
        optional: true
        enum:
        - ASCENDING
        - DESCENDING
    output:
      description: The ChromeOsDevices resource.
      type: object
    scopes_any:
    - admin.directory.device.chromeos
    - admin.directory.device.chromeos.readonly
    read_only: true
  move_devices_to_ou_chromeosdevice:
    title: Move devices to ou chromeosdevice
    description: Moves or inserts multiple Chrome OS devices to an organizational unit. You can move up
      to 50 devices at once.
    category: chromeosdevices
    request:
      method: POST
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/moveDevicesToOu
      query:
        orgUnitPath: ${org_unit_path}
      body:
        deviceIds: ${device_ids}
    input:
      customer_id:
        type: string
        description: Immutable. ID of the Google Workspace account
      org_unit_path:
        type: string
        description: Full path of the target organizational unit or its ID
      device_ids:
        type: array
        items:
          type: string
        description: Chrome OS devices to be moved to OU
        optional: true
    output:
      description: What the API returned.
      type: object
    scopes:
    - admin.directory.device.chromeos
  update_chromeosdevice:
    title: Update chromeosdevice
    description: Updates a device's updatable properties, such as annotatedUser, annotatedLocation, notes,
      orgUnitPath, or annotatedAssetId. This method supports patch semantics.
    category: chromeosdevices
    request:
      method: PATCH
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${device_id}
      query:
        projection: ${projection}
      body: ${body}
    input:
      customer_id:
        type: string
        description: The unique ID for the customer's Google Workspace account. As an account administrator,
          you can also use the my_customer alias to represent your account's customerId. The customerId
          is also returned as part of the Users resource.
      device_id:
        type: string
        description: The unique ID of the device. The deviceIds are returned in the response from the
          chromeosdevices.list method.
      projection:
        type: string
        description: Determines whether the response contains the full list of properties or only a subset.
        optional: true
        enum:
        - BASIC
        - FULL
      body:
        type: object
        description: The ChromeOsDevice resource, as the API's own reference defines it.
    output:
      description: The ChromeOsDevice resource.
      type: object
    scopes:
    - admin.directory.device.chromeos
  replace_chromeosdevice:
    title: Replace chromeosdevice
    description: Updates a device's updatable properties, such as annotatedUser, annotatedLocation, notes,
      orgUnitPath, or annotatedAssetId.
    category: chromeosdevices
    request:
      method: PUT
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${device_id}
      query:
        projection: ${projection}
      body: ${body}
    input:
      customer_id:
        type: string
        description: The unique ID for the customer's Google Workspace account. As an account administrator,
          you can also use the my_customer alias to represent your account's customerId. The customerId
          is also returned as part of the Users resource.
      device_id:
        type: string
        description: The unique ID of the device. The deviceIds are returned in the response from the
          chromeosdevices.list method.
      projection:
        type: string
        description: Determines whether the response contains the full list of properties or only a subset.
        optional: true
        enum:
        - BASIC
        - FULL
      body:
        type: object
        description: The ChromeOsDevice resource, as the API's own reference defines it.
    output:
      description: The ChromeOsDevice resource.
      type: object
    scopes:
    - admin.directory.device.chromeos
  batch_change_status_chromeo:
    title: Batch change status chromeo
    description: Changes the status of a batch of ChromeOS devices. For more information about changing
      a ChromeOS device state Repair, repurpose, or retire ChromeOS devices.
    category: customer
    request:
      method: POST
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos:batchChangeStatus
      body:
        deprovisionReason: ${deprovision_reason}
        changeChromeOsDeviceStatusAction: ${change_chrome_os_device_status_action}
        deviceIds: ${device_ids}
    input:
      customer_id:
        type: string
        description: Required. Immutable ID of the Google Workspace account.
      deprovision_reason:
        type: string
        description: Optional. The reason behind a device deprovision. Must be provided if 'changeChromeOsDeviceStatusAction'
          is set to 'CHANGE_CHROME_OS_DEVICE_STATUS_ACTION_DEPROVISION'. Otherwise, omit this field.
        optional: true
        enum:
        - DEPROVISION_REASON_UNSPECIFIED
        - DEPROVISION_REASON_SAME_MODEL_REPLACEMENT
        - DEPROVISION_REASON_UPGRADE
        - DEPROVISION_REASON_DOMAIN_MOVE
        - DEPROVISION_REASON_SERVICE_EXPIRATION
        - DEPROVISION_REASON_OTHER
        - DEPROVISION_REASON_DIFFERENT_MODEL_REPLACEMENT
        - DEPROVISION_REASON_RETIRING_DEVICE
        - DEPROVISION_REASON_UPGRADE_TRANSFER
        - DEPROVISION_REASON_NOT_REQUIRED
        - DEPROVISION_REASON_REPAIR_CENTER
      change_chrome_os_device_status_action:
        type: string
        description: Required. The action to take on the ChromeOS device in order to change its status.
        optional: true
        enum:
        - CHANGE_CHROME_OS_DEVICE_STATUS_ACTION_UNSPECIFIED
        - CHANGE_CHROME_OS_DEVICE_STATUS_ACTION_DEPROVISION
        - CHANGE_CHROME_OS_DEVICE_STATUS_ACTION_DISABLE
        - CHANGE_CHROME_OS_DEVICE_STATUS_ACTION_REENABLE
      device_ids:
        type: array
        items:
          type: string
        description: Required. List of the IDs of the ChromeOS devices to change. Maximum 50.
        optional: true
    output:
      description: The BatchChangeChromeOsDeviceStatusResponse resource.
      type: object
    scopes:
    - admin.directory.device.chromeos
  get_command:
    title: Get command
    description: Gets command data a specific command issued to the device.
    category: customer
    request:
      method: GET
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${device_id}/commands/${command_id}
    input:
      command_id:
        type: string
        description: Immutable. ID of Chrome OS Device Command.
      customer_id:
        type: string
        description: Immutable. ID of the Google Workspace account.
      device_id:
        type: string
        description: Immutable. ID of Chrome OS Device.
    output:
      description: The DirectoryChromeosdevicesCommand resource.
      type: object
    scopes_any:
    - admin.directory.device.chromeos
    - admin.directory.device.chromeos.readonly
    read_only: true
  count_chrome_os_devices_chromeo:
    title: Count chrome os devices chromeo
    description: Counts ChromeOS devices matching the request.
    category: customer
    request:
      method: GET
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos:countChromeOsDevices
      query:
        filter: ${filter}
        includeChildOrgunits: ${include_child_orgunits}
        orgUnitPath: ${org_unit_path}
    input:
      customer_id:
        type: string
        description: Required. Immutable ID of the Google Workspace account.
      filter:
        type: string
        description: Optional. Search string in the format given at List query operators.
        optional: true
      include_child_orgunits:
        type: boolean
        description: Optional. Return devices from all child orgunits, as well as the specified org unit.
          If this is set to true, 'orgUnitPath' must be provided.
        optional: true
      org_unit_path:
        type: string
        description: Optional. The full path of the organizational unit (minus the leading /) or its unique
          ID.
        optional: true
    output:
      description: The CountChromeOsDevicesResponse resource.
      type: object
    scopes_any:
    - admin.directory.device.chromeos
    - admin.directory.device.chromeos.readonly
    read_only: true
  issue_command_chromeo:
    title: Issue command chromeo
    description: Issues a command for the device to execute.
    category: customer
    request:
      method: POST
      path: /admin/directory/v1/customer/${customer_id}/devices/chromeos/${device_id}:issueCommand
      body:
        payload: ${payload}
        commandType: ${command_type}
    input:
      customer_id:
        type: string
        description: Immutable. ID of the Google Workspace account.
      device_id:
        type: string
        description: Immutable. ID of Chrome OS Device.
      payload:
        type: string
        description: 'The payload for the command, provide it only if command supports it. The following
          commands support adding payload: * SET_VOLUME: Payload is a stringified JSON object in the form:
          { "volume": 50 }. The volume has to be an integer in the range [0,100]. * DEVICE_START_CRD_SESSION:
          Payload is optionall'
        optional: true
      command_type:
        type: string
        description: The type of command.
        optional: true
        enum:
        - COMMAND_TYPE_UNSPECIFIED
        - REBOOT
        - TAKE_A_SCREENSHOT
        - SET_VOLUME
        - WIPE_USERS
        - REMOTE_POWERWASH
        - DEVICE_START_CRD_SESSION
        - CAPTURE_LOGS
        - FETCH_CRD_AVAILABILITY_INFO
        - FETCH_SUPPORT_PACKET
    output:
      description: The DirectoryChromeosdevicesIssueCommandResponse resource.
      type: object
    scopes:
    - admin.directory.device.chromeos
  batch_create_print_servers_print_server:
    title: Batch create print servers print server
    description: Creates multiple print servers. Calls customers.chrome.printServers.batchCreatePrintServers
      on the Admin SDK API.
    category: customers
    request:
      method: POST
      path: /admin/directory/v1/${parent}/chrome/printServers:batchCreatePrintServers
      body:
        requests: ${requests}
    input:
      parent:
        type: string
        description: 'Required. The unique ID of the customer''s Google Workspace account. Format: customers/{id}'
      requests:
        type: array
        items:
          type: string
        description: Required. A list of PrintServer resources to be created (max 50 per batch).
        optional: true
    output:
      description: The BatchCreatePrintServersResponse resource.
      type: object
    scopes:
    - admin.chrome.printers
  batch_delete_print_servers_print_server:
    title: Batch delete print servers print server
    description: Deletes multiple print servers. Calls customers.chrome.printServers.batchDeletePrintServers
      on the Admin SDK API.
    category: customers
    request:
      method: POST
      path: /admin/directory/v1/${parent}/chrome/printServers:batchDeletePrintServers
      body:
        printServerIds: ${print_server_ids}
    input:
      parent:
        type: string
        description: 'Required. The unique ID of the customer''s Google Workspace account. Format: customers/{customer.id}'
      print_server_ids:
        type: array
        items:
          type: string
        description: A list of print server IDs that should be deleted (max 100 per batch).
        optional: true
    output:
      description: The BatchDeletePrintServersResponse resource.
      type: object
    scopes:
    - admin.chrome.printers
  create_print_server:
    title: Create print server
    description: Creates a print server. Calls customers.chrome.printServers.create on the Admin SDK API.
    category: customers
    request:
      method: POST
      path: /admin/directory/v1/${parent}/chrome/printServers
      body:
        name: ${name}
        orgUnitId: ${org_unit_id}
        uri: ${uri}
        description: ${description}
        displayName: ${display_name}
    input:
      parent:
        type: string
        description: 'Required. The unique ID of the customer''s Google Workspace account. Format: customers/{id}'
      name:
        type: string
        description: 'Identifier. Resource name of the print server. Leave empty when creating. Format:
          customers/{customer.id}/printServers/{print_server.id}'
        optional: true
      org_unit_id:
        type: string
        description: ID of the organization unit (OU) that owns this print server. This value can only
          be set when the print server is initially created. If it's not populated, the print server is
          placed under the root OU. The org_unit_id can be retrieved using the Directory API.
        optional: true
      uri:
        type: string
        description: Editable. Print server URI.
        optional: true
      description:
        type: string
        description: Editable. Description of the print server (as shown in the Admin console).
        optional: true
      display_name:
        type: string
        description: Editable. Display name of the print server (as shown in the Admin console).
        optional: true
    output:
      description: The PrintServer resource.
      type: object
    scopes:
    - admin.chrome.printers
  delete_print_server:
    title: Delete print server
    description: Deletes a print server. Calls customers.chrome.printServers.delete on the Admin SDK API.
    category: customers
    request:
      method: DELETE
      path: /admin/directory/v1/${name}
    input:
      name:
        type: string
        description: 'Required. The name of the print server to be deleted. Format: customers/{customer.id}/chrome/printServers/{print_server.id}'
    output:
      description: The Empty resource.
      type: object
    scopes:
    - admin.chrome.printers
    destructive: true
  get_print_server:
    title: Get print server
    description: Returns a print server's configuration. Calls customers.chrome.printServers.get on the
      Admin SDK API.
    category: customers
    request:
      method: GET
      path: /admin/directory/v1/${name}
    input:
      name:
        type: string
        description: 'Required. The unique ID of the customer''s Google Workspace account. Format: customers/{id}'
    output:
      description: The PrintServer resource.
      type: object
    scopes_any:
    - admin.chrome.printers
    - admin.chrome.printers.readonly
    read_only: true
  list_print_servers:
    title: List print servers
    description: Lists print server configurations. Calls customers.chrome.printServers.list on the Admin
      SDK API.
    category: customers
    request:
      method: GET
      path: /admin/directory/v1/${parent}/chrome/printServers
      query:
        filter: ${filter}
        orderBy: ${order_by}
        orgUnitId: ${org_unit_id}
        pageSize: ${page_size}
        pageToken: ${page_token}
    input:
      parent:
        type: string
        description: 'Required. The unique ID of the customer''s Google Workspace account. Format: customers/{id}'
      filter:
        type: string
        description: 'Search query in Common Expression Language syntax. Supported filters are display_name,
          description, and uri. Example: printServer.displayName==''marketing-queue''.'
        optional: true
      order_by:
        type: string
        description: Sort order for results. Supported values are display_name, description, or create_time.
          Default order is ascending, but descending order can be returned by appending "desc" to the
          order_by field. For instance, orderBy=='description desc' returns the print servers sorted by
          description in descending
        optional: true
      org_unit_id:
        type: string
        description: If org_unit_id is present in the request, only print servers owned or inherited by
