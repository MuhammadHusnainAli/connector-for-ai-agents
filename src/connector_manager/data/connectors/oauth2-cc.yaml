# Connector definitions: OAUTH2_CC auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
1password-users:
  auth_mode: OAUTH2_CC
  categories:
  - iam
  connection_config:
    accountId:
      description: Your 1Password account ID.
      example: XLQMR47VZPBKJHSGWNCYFDE3T9
      order: 2
      pattern: ^[A-Z0-9]{26}$
      title: Account ID
      type: string
    domain:
      description: The regional API domain for your 1Password account.
      enum:
      - api.1password.com
      - api.1password.ca
      - api.1password.eu
      order: 1
      title: API Domain
      type: string
  credentials:
    client_id:
      description: Your 1Password OAuth application Client ID.
      example: 5ab87915-2deb-429c-a1e2-8b0495900f45
      format: uuid
      title: Client ID
      type: string
    client_secret:
      description: Your 1Password OAuth application Client Secret.
      secret: true
      title: Client Secret
      type: string
  display_name: 1Password (Users API)
  proxy:
    base_url: https://${connectionConfig.domain}/v1beta1/accounts/${connectionConfig.accountId}
  token_params:
    grant_type: client_credentials
  token_request_auth_method: basic
  token_url: https://${connectionConfig.domain}/v1beta1/users/oauth2/token
8x8:
  auth_mode: OAUTH2_CC
  categories:
  - communication
  credentials:
    client_id:
      description: Your 8x8 API Client ID from the Admin Console
      title: Client ID
      type: string
    client_secret:
      description: Your 8x8 API Client Secret from the Admin Console
      secret: true
      title: Client Secret
      type: string
  display_name: 8x8
  proxy:
    base_url: https://api.8x8.com
  token_params:
    grant_type: client_credentials
  token_request_auth_method: basic
  token_url: https://api.8x8.com/oauth/v2/token
acumatica:
  auth_mode: OAUTH2_CC
  categories:
  - erp
  - accounting
  connection_config:
    instanceUrl:
      description: The hostname of your Acumatica ERP instance.
      example: mycompany.acumatica.com
      order: 1
      pattern: ^[A-Za-z0-9.-]+(?::\d+)?(?:/[A-Za-z0-9._-]+)*$
      prefix: https://
      title: Instance URL
      type: string
    password:
      description: The password for the specified Acumatica ERP username.
      order: 3
      secret: true
      title: Password
      type: string
    username:
      description: The username of an Acumatica ERP user.
      order: 2
      title: Username
      type: string
  credentials:
    client_id:
      description: The client ID assigned to your application, including the tenant suffix.
      example: 88358B02-A48D-A50E-F710-39C1636C30F6@MyTenant
      title: Client ID
      type: string
    client_secret:
      description: The client secret created for your application in Acumatica ERP.
      secret: true
      title: Client Secret
      type: string
  display_name: Acumatica
  proxy:
    base_url: https://${connectionConfig.instanceUrl}
  token_params:
    grant_type: password
    password: ${connectionConfig.password}
    username: ${connectionConfig.username}
  token_url: https://${connectionConfig.instanceUrl}/identity/connect/token
adobe-umapi:
  auth_mode: OAUTH2_CC
