      type: object
  create_v1_contextualizedembeddings:
    title: Create Contextualized Embeddings
    description: Create Contextualized Embeddings Generate contextualized embeddings for document chunks.
      Chunks from the same document share context awareness, improving retrieval quality for document-based
      applications. Calls POST /v1/contextualizedembeddings on the provider's API.
    category: contextualizedembeddings
    request:
      method: POST
      path: /v1/contextualizedembeddings
      body:
        input: ${input}
        model: ${model}
        dimensions: ${dimensions}
        encoding_format: ${encoding_format}
    input:
      input:
        type: array
        description: Nested array structure where each inner array contains chunks from a single document.
          Chunks within the same document are encoded with document-level context awareness. Maximum 512
          documents. Total chunks across all documents must not exceed 16,000. Total tokens per document
          must not exceed 32K. All chunks in a single request must not exceed 120,000 tokens combined.
          Empty strings are not allowed.
        items:
          type: array
      model:
        type: string
        description: The contextualized embedding model to use
        enum:
        - pplx-embed-context-v1-0.6b
        - pplx-embed-context-v1-4b
      dimensions:
        type: integer
        description: 'Number of dimensions for output embeddings (Matryoshka). Range: 128-1024 for pplx-embed-context-v1-0.6b,
          128-2560 for pplx-embed-context-v1-4b. Defaults to full dimensions (1024 or 2560).'
        optional: true
      encoding_format:
        type: string
        description: Output encoding format for embeddings. base64int8 returns base64-encoded signed int8
          values. base64binary returns base64-encoded packed binary (1 bit per dimension).
        optional: true
        enum:
        - base64_int8
        - base64_binary
    output:
      description: Successful Response
      type: object
