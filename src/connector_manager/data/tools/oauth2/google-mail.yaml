  replace_send_a:
    title: Replace send a
    description: Updates a send-as alias. If a signature is provided, Gmail will sanitize the HTML before
      saving it with the alias. For more information, see Manage aliases and signatures with the Gmail
      API. Addresses other than the primary address for the account can only be updated by service account
      clients that have been delegated domain-wide authority.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/sendAs/${send_as_email}
      body:
        isPrimary: ${is_primary}
        treatAsAlias: ${treat_as_alias}
        smtpMsa: ${smtp_msa}
        displayName: ${display_name}
        signature: ${signature}
        replyToAddress: ${reply_to_address}
        sendAsEmail: ${body_send_as_email}
        verificationStatus: ${verification_status}
        isDefault: ${is_default}
    input:
      send_as_email:
        type: string
        description: The send-as alias to be updated.
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      is_primary:
        type: boolean
        description: Whether this address is the primary address used to login to the account. Every Gmail
          account has exactly one primary address, and it cannot be deleted from the collection of send-as
          aliases. This field is read-only.
        optional: true
      treat_as_alias:
        type: boolean
        description: Whether Gmail should treat this address as an alias for the user's primary email
          address. This setting only applies to custom "from" aliases.
        optional: true
      smtp_msa:
        type: string
        description: An optional SMTP service that will be used as an outbound relay for mail sent using
          this alias. If this is empty, outbound mail will be sent directly from Gmail's servers to the
          destination SMTP service. This setting only applies to custom "from" aliases.
        optional: true
      display_name:
        type: string
        description: A name that appears in the "From:" header for mail sent using this alias. For custom
          "from" addresses, when this is empty, Gmail will populate the "From:" header with the name that
          is used for the primary address associated with the account. If the admin has disabled the ability
          for users to update
        optional: true
      signature:
        type: string
        description: An optional HTML signature that is included in messages composed with this alias
          in the Gmail web UI. This signature is added to new emails only.
        optional: true
      reply_to_address:
        type: string
        description: An optional email address that is included in a "Reply-To:" header for mail sent
          using this alias. If this is empty, Gmail will not generate a "Reply-To:" header.
        optional: true
      body_send_as_email:
        type: string
        description: The email address that appears in the "From:" header for mail sent using this alias.
          This is read-only for all operations except create.
        optional: true
      verification_status:
        type: string
        description: Indicates whether this address has been verified for use as a send-as alias. Read-only.
          This setting only applies to custom "from" aliases.
        optional: true
        enum:
        - verificationStatusUnspecified
        - accepted
        - pending
      is_default:
        type: boolean
        description: Whether this address is selected as the default "From:" address in situations such
          as composing a new message or sending a vacation auto-reply. Every Gmail account has exactly
          one default send-as address, so the only legal value that clients may write to this field is
          true. Changing this from false
        optional: true
    output:
      description: The SendAs resource.
      type: object
    scopes_any:
    - gmail.settings.basic
    - gmail.settings.sharing
  verify_send_a:
    title: Verify send a
    description: Sends a verification email to the specified send-as alias address. The verification status
      must be pending. For more information, see Manage aliases and signatures with the Gmail API. This
      method is only available to service account clients that have been delegated domain-wide authority.
    category: users
    request:
      method: POST
      path: /gmail/v1/users/${user_id}/settings/sendAs/${send_as_email}/verify
    input:
      send_as_email:
        type: string
        description: The send-as alias to be verified.
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
    output:
      description: What the API returned.
      type: object
    scopes:
    - gmail.settings.sharing
  update_auto_forwarding_setting:
    title: Update auto forwarding setting
    description: Updates the auto-forwarding setting for the specified account. A verified forwarding
      address must be specified when auto-forwarding is enabled. For more information, see Manage email
      forwarding. This method is only available to service account clients that have been delegated domain-wide
      authority.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/autoForwarding
      body:
        enabled: ${enabled}
        emailAddress: ${email_address}
        disposition: ${disposition}
    input:
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      enabled:
        type: boolean
        description: Whether all incoming mail is automatically forwarded to another address.
        optional: true
      email_address:
        type: string
        description: Email address to which all incoming messages are forwarded. This email address must
          be a verified member of the forwarding addresses.
        optional: true
      disposition:
        type: string
        description: The state that a message should be left in after it has been forwarded.
        optional: true
        enum:
        - dispositionUnspecified
        - leaveInInbox
        - archive
        - trash
        - markRead
    output:
      description: The AutoForwarding resource.
      type: object
    scopes:
    - gmail.settings.sharing
  update_imap_setting:
    title: Update imap setting
    description: Updates IMAP settings. For more information, see Configure POP and IMAP settings with
      the Gmail API.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/imap
      body:
        enabled: ${enabled}
        autoExpunge: ${auto_expunge}
        maxFolderSize: ${max_folder_size}
        expungeBehavior: ${expunge_behavior}
    input:
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      enabled:
        type: boolean
        description: Whether IMAP is enabled for the account.
        optional: true
      auto_expunge:
        type: boolean
        description: If this value is true, Gmail will immediately expunge a message when it is marked
          as deleted in IMAP. Otherwise, Gmail will wait for an update from the client before expunging
          messages marked as deleted.
        optional: true
      max_folder_size:
        type: integer
        description: An optional limit on the number of messages that an IMAP folder may contain. Legal
          values are 0, 1000, 2000, 5000 or 10000. A value of zero is interpreted to mean that there is
          no limit.
        optional: true
      expunge_behavior:
        type: string
        description: The action that will be executed on a message when it is marked as deleted and expunged
          from the last visible IMAP folder.
        optional: true
        enum:
        - expungeBehaviorUnspecified
        - archive
        - trash
        - deleteForever
    output:
      description: The ImapSettings resource.
      type: object
    scopes:
    - gmail.settings.basic
  update_language_setting:
    title: Update language setting
    description: Updates language settings. For more information, see Manage language settings. If successful,
      the return object contains the displayLanguage that was saved for the user, which may differ from
      the value passed into the request. This is because the requested displayLanguage may not be directly
      supported by Gmail but have a close variant that is, and so the variant may be chosen and saved
      instead.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/language
      body:
        displayLanguage: ${display_language}
    input:
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      display_language:
        type: string
        description: The language to display Gmail in, formatted as an RFC 3066 Language Tag (for example
          en-GB, fr or ja for British English, French, or Japanese respectively). The set of languages
          supported by Gmail evolves over time, so please refer to the "Language" dropdown in the Gmail
          settings for all available o
        optional: true
    output:
      description: The LanguageSettings resource.
      type: object
    scopes:
    - gmail.settings.basic
  update_pop_setting:
    title: Update pop setting
    description: Updates POP settings. For more information, see Configure POP and IMAP settings with
      the Gmail API.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/pop
      body:
        accessWindow: ${access_window}
        disposition: ${disposition}
    input:
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      access_window:
        type: string
        description: The range of messages which are accessible via POP.
        optional: true
        enum:
        - accessWindowUnspecified
        - disabled
        - fromNowOn
        - allMail
      disposition:
        type: string
        description: The action that will be executed on a message after it has been fetched via POP.
        optional: true
        enum:
        - dispositionUnspecified
        - leaveInInbox
        - archive
        - trash
        - markRead
    output:
      description: The PopSettings resource.
      type: object
    scopes:
    - gmail.settings.basic
  update_vacation_setting:
    title: Update vacation setting
    description: Updates vacation responder settings. For more information, see Manage vacation settings
      with the Gmail API.
    category: users
    request:
      method: PUT
      path: /gmail/v1/users/${user_id}/settings/vacation
      body:
        enableAutoReply: ${enable_auto_reply}
        endTime: ${end_time}
        responseBodyPlainText: ${response_body_plain_text}
        responseBodyHtml: ${response_body_html}
        restrictToDomain: ${restrict_to_domain}
        restrictToContacts: ${restrict_to_contacts}
        responseSubject: ${response_subject}
        startTime: ${start_time}
    input:
      user_id:
        type: string
        description: User's email address. The special value "me" can be used to indicate the authenticated
          user.
      enable_auto_reply:
        type: boolean
        description: Flag that controls whether Gmail automatically replies to messages.
        optional: true
      end_time:
        type: string
        description: An optional end time for sending auto-replies (epoch ms). When this is specified,
          Gmail will automatically reply only to messages that it receives before the end time. If both
          startTime and endTime are specified, startTime must precede endTime.
        optional: true
      response_body_plain_text:
        type: string
        description: Response body in plain text format. If both response_body_plain_text and response_body_html
          are specified, response_body_html will be used.
        optional: true
      response_body_html:
        type: string
        description: Response body in HTML format. Gmail will sanitize the HTML before storing it. If
          both response_body_plain_text and response_body_html are specified, response_body_html will
          be used.
        optional: true
      restrict_to_domain:
        type: boolean
        description: Flag that determines whether responses are sent to recipients who are outside of
          the user's domain. This feature is only available for Google Workspace users.
        optional: true
      restrict_to_contacts:
        type: boolean
        description: Flag that determines whether responses are sent to recipients who are not in the
          user's list of contacts.
        optional: true
      response_subject:
        type: string
        description: Optional text to prepend to the subject line in vacation responses. In order to enable
          auto-replies, either the response subject or the response body must be nonempty.
        optional: true
      start_time:
        type: string
        description: An optional start time for sending auto-replies (epoch ms). When this is specified,
          Gmail will automatically reply only to messages that it receives after the start time. If both
          startTime and endTime are specified, startTime must precede endTime.
        optional: true
    output:
      description: The VacationSettings resource.
      type: object
    scopes:
    - gmail.settings.basic
  stop_user:
