        description: Classification Label values on the message. Available Classification Label schemas
          can be queried using the Google Drive Labels API. Each classification label ID must be unique.
          If duplicate IDs are provided, only one will be retained, and the selection is arbitrary. Only
          used for Google Workspace a
        optional: true
