      query:
        project_id: ${project_id}
      body:
        keywords: ${keywords}
    input:
      project_id:
        type: integer
        description: 'The unique identifier of the project. You can find it in the URL of
          your Rank Tracker project in Ahrefs: https://app.ahrefs.com/rank-tracker/overview/#project_id#'
      keywords:
        type: array
        description: Keywords to remove, each {keyword, country_code, language_code, location_id}.
