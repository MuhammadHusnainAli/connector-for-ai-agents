        filename: ${filename}
        file_size: ${file_size}
    input:
      batch_id:
        type: integer
        description: The batch ID to upload the file to.
      filename:
        type: string
        description: A file name for the uploaded file on the AI Hub filesystem, including the file extension.
          Maximum of 255 characters.
      file_size:
        type: integer
        description: The file size, in bytes. Can be an integer or a string.
    output:
      description: The multipart upload session was initiated.
      type: object
