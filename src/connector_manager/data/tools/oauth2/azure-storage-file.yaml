# Azure Files tools -- the File Service REST API.
#
# The connection's base url is the storage account's file endpoint
# (`https://<account>.file.core.windows.net`) and authenticates with a
# Microsoft Entra ID token. Azure Files is stricter about this than the other
# storage services: OAuth on the file endpoint requires the
# `x-ms-file-request-intent: backup` header on every request, which these tools
# send, and the caller needs a role such as Storage File Data Privileged Reader
# or Storage File Data Privileged Contributor. The non-privileged SMB roles do
# not work over REST.
#
# ## The shape of the API
#
# Everything is `restype` and `comp` query parameters on a path:
#
#   * a **share** is `/{share}?restype=share` -- the mountable unit, with a
#     quota;
#   * a **directory** is `/{share}/{path}?restype=directory`;
#   * a **file** is `/{share}/{path}` with no restype at all.
#
# Listings and share metadata come back as XML documents. File content comes
# back as whatever the file contains.
#
# ## Writing a file takes two calls, not one
#
# This is the thing that surprises everyone. `create_file` does NOT write
# content: it allocates a file of a declared size, full of zero bytes. The
# bytes go in a second call, `put_range`, which writes into a byte range of
# that allocation.
#
# So writing "hello" is: create_file with `content_length: 5`, then put_range
# with `range: "bytes=0-4"` and the text. Getting the range or the declared
# length wrong leaves a file padded with NUL bytes, which is the usual
# explanation for a file that looks right but is subtly wrong.
#
# Content goes on the wire as text, which suits JSON, CSV, Markdown and logs.
# Binary needs a client that can send raw bytes.
#
# ## Header-only operations are absent
#
# Get File Properties, Get Directory Properties and Get Share Properties answer
# entirely in response headers with an empty body, and this package surfaces
# bodies. They are left out rather than shipped as tools that return nothing --
# list_directories_and_files carries the same sizes and timestamps for every
# entry at once, which is more useful anyway.
#
# ## Deleting is not recoverable unless soft delete is on
#
# Share soft delete is configured on the storage account, not here.
# `azure-storage-accounts`' list_file_shares reports it. Without it,
# delete_share is final and takes every file in the share with it.
#
# Docs: https://learn.microsoft.com/rest/api/storageservices/file-service-rest-api

connector_id: azure-storage-file
display_name: Azure Files
docs_url: https://learn.microsoft.com/rest/api/storageservices/file-service-rest-api

tools:

  # -- shares ----------------------------------------------------------------

  list_shares:
    title: List the account's file shares
    description: >-
      Every file share in the storage account as an XML EnumerationResults
      document, each with its quota, last-modified time and, when asked for, its
      metadata and snapshots. Page with the `NextMarker` element the response
      ends with.
    category: shares
    read_only: true
    notes: Returns XML, not JSON.
    request:
      method: GET
      path: /
      headers:
        x-ms-file-request-intent: backup
      query:
        comp: list
        prefix: "${prefix}"
        marker: "${marker}"
        maxresults: "${max_results}"
        include: "${include}"
    input:
      prefix:
        type: string
        description: Only return shares whose name starts with this.
        optional: true
      marker:
        type: string
        description: Continuation token from a previous response's NextMarker element.
        optional: true
      max_results:
        type: integer
        description: How many shares per page, up to 5000.
        optional: true
        minimum: 1
        maximum: 5000
      include:
        type: string
        description: Extra detail to include -- metadata, snapshots, deleted, or a comma-separated combination.
        optional: true
        example: metadata,snapshots
    output:
      description: An XML EnumerationResults document listing the shares.
      type: string

  create_share:
    title: Create a file share
    description: >-
      Create a share in the account. `quota_gb` is a hard limit, not a billing
      hint: writes fail once the share reaches it, and on a standard account you
      still only pay for what is used, so there is little reason to size it
      tightly.

      Fails with 409 if a share of that name already exists.
    category: shares
    request:
      method: PUT
      path: /${share_name}
      headers:
        x-ms-file-request-intent: backup
        x-ms-share-quota: "${quota_gb}"
      query:
        restype: share
      body: {}
    input:
      share_name:
        type: string
        description: The share name -- 3 to 63 lowercase letters, digits and hyphens.
        example: reports
        pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
      quota_gb:
        type: integer
        description: Maximum share size in GiB. Writes fail once it is reached.
        optional: true
        minimum: 1
    output:
      description: Empty on success (201).
      type: object

  delete_share:
    title: Delete a file share
    description: >-
      Destroy a share and every directory and file in it. Recoverable only if
      share soft delete is enabled on the storage account -- check
      `azure-storage-accounts`' list_file_shares first, because it is off by
      default.

      Anything currently mounting the share loses it immediately.
    category: shares
    destructive: true
    notes: Recoverable only when share soft delete is enabled on the account.
    request:
      method: DELETE
      path: /${share_name}
      headers:
        x-ms-file-request-intent: backup
        x-ms-delete-snapshots: "${delete_snapshots}"
      query:
        restype: share
    input:
      share_name:
        type: string
        description: The share to destroy, with everything in it.
        example: scratch
      delete_snapshots:
        type: string
        description: >-
          Set to include to delete the share's snapshots too. Without it, a
          share that has snapshots cannot be deleted.
        optional: true
        enum: [include]
    output:
      description: Empty on success.
      type: object

  get_share_stats:
    title: Get how much of a share is used
    description: >-
      The share's used capacity in bytes, as XML. Compare it to the quota from
      list_shares to answer "is the share about to stop accepting writes" --
      which is the failure this API reports in a way that does not obviously
      point at the quota.
    category: shares
    read_only: true
    notes: Returns XML, not JSON.
    request:
      method: GET
      path: /${share_name}
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: share
        comp: stats
    input:
      share_name:
        type: string
        description: The share.
        example: reports
    output:
      description: An XML ShareStats document with ShareUsageBytes.
      type: string

  get_share_acl:
    title: Get a share's stored access policies
    description: >-
      The stored access policies on a share, as XML. A shared access signature
      bound to one can be revoked by deleting the policy; a free-standing SAS
      cannot be revoked short of rotating the account key. An empty document
      means any SAS on this share is of the second kind.
    category: shares
    read_only: true
    notes: Returns XML, not JSON.
    request:
      method: GET
      path: /${share_name}
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: share
        comp: acl
    input:
      share_name:
        type: string
        description: The share.
        example: reports
    output:
      description: An XML SignedIdentifiers document, empty when no policies are set.
      type: string

  set_share_quota:
    title: Change a file share's quota
    description: >-
      Raise or lower the share's size limit. Lowering it below the data already
      stored does not delete anything, but the share immediately stops accepting
      writes -- which is a quiet way to break an application.

      Raising it is the fix for writes failing on a full share.
    category: shares
    notes: Lowering the quota below current usage stops writes without deleting data.
    request:
      method: PUT
      path: /${share_name}
      headers:
        x-ms-file-request-intent: backup
        x-ms-share-quota: "${quota_gb}"
      query:
        restype: share
        comp: properties
      body: {}
    input:
      share_name:
        type: string
        description: The share to resize.
        example: reports
      quota_gb:
        type: integer
        description: The new maximum size in GiB.
        minimum: 1
        example: "5120"
    output:
      description: Empty on success.
      type: object

  # -- directories -----------------------------------------------------------

  list_directories_and_files:
    title: List a directory's contents
    description: >-
      The directories and files directly inside a path, as an XML
      EnumerationResults document with each entry's name and, for files, size.
      Not recursive -- call it again per subdirectory to walk a tree.

      Pass an empty `directory_path` to list the root of the share. Page with
      the `NextMarker` element.
    category: directories
    read_only: true
    notes: Returns XML, not JSON. Lists one level only.
    request:
      method: GET
      path: /${share_name}/${directory_path}
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: directory
        comp: list
        prefix: "${prefix}"
        marker: "${marker}"
        maxresults: "${max_results}"
        include: "${include}"
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      directory_path:
        type: string
        description: >-
          The directory to list, relative to the share root, e.g.
          "2026/january". Leave empty to list the share's root.
        optional: true
        default: ""
      prefix:
        type: string
        description: Only return entries whose name starts with this.
        optional: true
      marker:
        type: string
        description: Continuation token from a previous response's NextMarker.
        optional: true
      max_results:
        type: integer
        description: How many entries per page, up to 5000.
        optional: true
        minimum: 1
        maximum: 5000
      include:
        type: string
        description: Extra detail -- timestamps, ETag, Attributes, PermissionKey, or a comma-separated combination.
        optional: true
    output:
      description: An XML EnumerationResults document listing the directory's immediate contents.
      type: string

  create_directory:
    title: Create a directory
    description: >-
      Create a directory in a share. NOT recursive: the parent must already
      exist, and creating `2026/january` when `2026` does not exist fails with
      404. Build the path a level at a time.

      Fails with 409 if the directory already exists.
    category: directories
    notes: The parent directory must already exist. This does not create intermediate directories.
    request:
      method: PUT
      path: /${share_name}/${directory_path}
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: directory
      body: {}
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      directory_path:
        type: string
        description: The directory path relative to the share root. Its parent must exist.
        example: 2026/january
    output:
      description: Empty on success (201).
      type: object

  delete_directory:
    title: Delete an empty directory
    description: >-
      Remove a directory. It must be EMPTY -- a directory with anything in it
      fails with 409, which is a useful safety net, and means clearing a tree
      means deleting the files first and then working upward.
    category: directories
    destructive: true
    notes: Fails with 409 unless the directory is empty.
    request:
      method: DELETE
      path: /${share_name}/${directory_path}
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: directory
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      directory_path:
        type: string
        description: The empty directory to remove.
        example: 2026/january
    output:
      description: Empty on success.
      type: object

  # -- files -----------------------------------------------------------------

  get_file:
    title: Read a file's contents
    description: >-
      Download a file from a share. The response is the file's content.

      `range` reads only part of it -- `bytes=0-1023` for the first kilobyte --
      which is how you look at the head of a large log without pulling the whole
      thing. Without it the entire file comes back.

      Content is returned as text, so this suits JSON, CSV, Markdown and logs;
      binary files need a client that can handle raw bytes.
    category: files
    read_only: true
    request:
      method: GET
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        Range: "${range}"
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file path relative to the share root.
        example: 2026/january/summary.csv
      range:
        type: string
        description: Byte range to read, e.g. "bytes=0-1023". Omit for the whole file.
        optional: true
    output:
      description: The file's contents.
      type: string

  create_file:
    title: Allocate a file of a given size
    description: >-
      Create an empty file of a declared length. This does NOT write content --
      it reserves `content_length` bytes, all zero. Writing the bytes is a
      separate put_range call, and forgetting it leaves a file full of NULs.

      The parent directory must already exist. Calling this on an existing file
      REPLACES it with a new empty one of the given size, so it doubles as a
      truncate.

      `content_length` must be the exact byte length of what you are about to
      write -- for ASCII text that is the character count, but for anything with
      accented or non-Latin characters it is the UTF-8 byte length, not the
      number of characters.
    category: files
    notes: Allocates zero bytes; the content goes in a separate put_range call. Overwrites an existing file.
    request:
      method: PUT
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        x-ms-type: file
        x-ms-content-length: "${content_length}"
        x-ms-content-type: "${content_type}"
      body: {}
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file path relative to the share root. Its directory must exist.
        example: 2026/january/summary.csv
      content_length:
        type: integer
        description: >-
          The file's size in BYTES -- the UTF-8 byte length of the content you
          are about to write, not its character count.
        minimum: 0
        example: "1024"
      content_type:
        type: string
        description: MIME type to record on the file.
        optional: true
        example: text/csv
    output:
      description: Empty on success (201). The file exists but holds only zero bytes.
      type: object

  put_range:
    title: Write bytes into a file
    description: >-
      Write content into a byte range of a file that create_file has already
      allocated. This is the call that actually puts data in Azure Files.

      `range` must exactly match the content's length: writing 5 bytes at the
      start is `bytes=0-4` -- inclusive on both ends, so the end index is
      length minus one. A mismatch is rejected, and a range shorter than the
      allocated file leaves the remainder as NUL bytes.

      Ranges may be written in any order and out of sequence, which is how a
      large file is uploaded in chunks. Maximum 4 MiB per call.
    category: files
    notes: The range is inclusive on both ends and must match the content length exactly. Maximum 4 MiB per call.
    request:
      method: PUT
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        x-ms-write: update
        Range: "${range}"
      query:
        comp: range
      content: "${content}"
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file to write into. It must already exist, from create_file.
        example: 2026/january/summary.csv
      range:
        type: string
        description: >-
          The byte range being written, inclusive at both ends, e.g.
          "bytes=0-4" for the first five bytes.
        example: bytes=0-1023
      content:
        type: string
        description: The bytes to write, as text. Its UTF-8 length must match the range exactly.
    output:
      description: Empty on success (201).
      type: object

  clear_range:
    title: Zero out a range of a file
    description: >-
      Clear a byte range, setting it to zeros and releasing the storage behind
      it. The file keeps its declared length -- this punches a hole rather than
      truncating.

      Useful for reclaiming space in a sparse file; not a way to shorten one,
      which needs create_file at the new size.
    category: files
    destructive: true
    request:
      method: PUT
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        x-ms-write: clear
        Range: "${range}"
      query:
        comp: range
      body: {}
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file.
        example: 2026/january/summary.csv
      range:
        type: string
        description: The byte range to zero, inclusive at both ends.
        example: bytes=0-1023
    output:
      description: Empty on success (201).
      type: object

  list_ranges:
    title: List which parts of a file hold data
    description: >-
      The byte ranges of a file that actually contain data, as XML. On a sparse
      file -- one allocated large and written in patches -- this is the only way
      to find out which parts are real and which are unwritten zeros, and to
      size what is actually stored rather than what was declared.
    category: files
    read_only: true
    notes: Returns XML, not JSON.
    request:
      method: GET
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        Range: "${range}"
      query:
        comp: rangelist
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file.
        example: 2026/january/summary.csv
      range:
        type: string
        description: Restrict the answer to this byte range.
        optional: true
    output:
      description: An XML Ranges document, each entry a Start and End byte offset holding data.
      type: string

  delete_file:
    title: Delete a file
    description: >-
      Remove a file from a share. Irreversible unless the account has file soft
      delete enabled, which is off by default. The directory holding it is
      unaffected.
    category: files
    destructive: true
    request:
      method: DELETE
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
    input:
      share_name:
        type: string
        description: The share.
        example: reports
      file_path:
        type: string
        description: The file to delete.
        example: 2026/january/summary.csv
    output:
      description: Empty on success.
      type: object

  copy_file:
    title: Copy a file from a URL
    description: >-
      Copy a file into this share from another Azure Files or Blob Storage URL.
      The source must be publicly readable or carry a SAS token in its query
      string -- the connection's own credential does not authenticate the
      source, which is the usual reason a copy fails with 404 on a URL that
      obviously exists.

      The copy runs server-side and asynchronously, so no bytes pass through the
      caller. A 202 means it started; the copy status is reported in headers
      this package does not surface, so confirm completion with
      list_directories_and_files.
    category: files
    notes: The source URL must be publicly readable or carry its own SAS. Progress is reported in headers this package does not surface.
    request:
      method: PUT
      path: /${share_name}/${file_path}
      headers:
        x-ms-file-request-intent: backup
        x-ms-copy-source: "${source_url}"
      body: {}
    input:
      share_name:
        type: string
        description: The destination share.
        example: reports
      file_path:
        type: string
        description: The destination file path. Its directory must exist.
        example: 2026/january/copy.csv
      source_url:
        type: string
        description: >-
          The source file or blob URL, with a SAS token if it is not publicly
          readable.
    output:
      description: Empty on acceptance (202); the copy continues server-side.
      type: object

  # -- service ---------------------------------------------------------------

  get_service_properties:
    title: Get the file service's settings
    description: >-
      The account-wide Azure Files configuration as XML: hour and minute
      metrics, CORS rules, the SMB protocol settings and the share soft-delete
      retention policy. That last one is what decides whether delete_share is
      recoverable.
    category: service
    read_only: true
    notes: Returns XML, not JSON.
    request:
      method: GET
      path: /
      headers:
        x-ms-file-request-intent: backup
      query:
        restype: service
        comp: properties
    input: {}
    output:
      description: An XML StorageServiceProperties document, including the share soft-delete policy.
      type: string
