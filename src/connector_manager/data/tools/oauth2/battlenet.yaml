        type: string
        description: The realm's slug.
      character_name:
        type: string
        description: The character's name in lower case.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The character's Mythic+ profile.
      type: object

  get_character_mythic_keystone_season:
    title: Get a character's Mythic+ season
    description: >-
      Read one season's Mythic+ runs for a character -- dungeon, level,
