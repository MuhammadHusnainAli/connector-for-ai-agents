# Currents tools -- CI test results, orchestration and flakiness.
#
# The connection's base url stops at the host, so every path here starts with
# /v1. Currents records what a CI test suite did; the model behind the API is
# worth holding in mind:
#
#   * a **run** is one CI build's execution of a suite;
#   * an **instance** is one spec file within that run;
#   * a **test signature** is the stable hash Currents keys a single test's
#     history on. It is not the test's title -- `get_test_signature` is what
#     turns a spec path plus a title into one, and the per-test tools take the
#     signature, never the name.
#
# Three things that shape how these tools are used:
#
#   * **the API key carries one scope for the whole API.** A `read` key reaches
#     every GET; a `write` key reaches all of them. There is no per-resource
#     permission, so a 403 means the key is read-only, not that the resource is
#     special;
#   * **paging is mixed.** The cursor endpoints take `starting_after` /
#     `ending_before`; the explorer and analytics endpoints take a zero-indexed
#     `page`. Both appear below, matching what each endpoint actually accepts;
#   * **actions change outcomes, not just display.** Quarantining a flaky test
#     stops it failing the build. `list_affected_tests` is the audit trail for
#     how much of a green build is quarantine rather than genuine passes.
#
# `get_failure_context` is the one built for agents specifically: it returns a
# run's, an instance's or a single test's failure detail with a `detail` knob
# and a markdown `format`, so the output stays small enough to reason over.
#
# Docs: https://docs.currents.dev/api

connector_id: currents
display_name: Currents
docs_url: https://docs.currents.dev/api

tools:

  list_projects:
    title: List projects
    description: >-
      Every project in the organization, cursor-paginated. The project id this
      returns is what nearly every other tool here takes, so this is usually
      the first call.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/projects
      query:
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
    input:
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '10'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_project:
    title: Get a project
    description: >-
      One project's settings and metadata, including its recording and
      orchestration configuration.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/projects/${project_id}
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
    output:
      description: The requested record.
      type: object

  list_project_runs:
    title: List a project's runs
    description: >-
      Test runs for one project, newest first, with rich filtering by branch,
      tag, author, environment, status and completion state. The main entry
      point into a project's CI history.
    category: runs
    read_only: true
    request:
      method: GET
      path: /v1/projects/${project_id}/runs
      query:
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        authors[]: "${authors}"
        environments[]: "${environments}"
        tag_operator: "${tag_operator}"
        search: "${search}"
        pr_id: "${pr_id}"
        status: "${status}"
        completion_state: "${completion_state}"
        date_start: "${date_start}"
        date_end: "${date_end}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '10'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      environments:
        type: array
        description: Filter by environment.
        optional: true
        items: {type: string}
      tag_operator:
        type: string
        description: Whether all tags must match or any of them.
        optional: true
        enum: [AND, OR]
        default: AND
      search:
        type: string
        description: Case-insensitive search filter.
        optional: true
      pr_id:
        type: string
        description: Filter to runs on one normalised pull request id.
        optional: true
      status:
        type: array
        description: Filter by run status, e.g. PASSED or FAILED.
        optional: true
        items: {type: string}
      completion_state:
        type: array
        description: Filter by completion state, e.g. COMPLETE or CANCELLED.
        optional: true
        items: {type: string}
      date_start:
        type: string
        description: Only runs created on or after this instant, ISO 8601.
        optional: true
      date_end:
        type: string
        description: Only runs created before this instant, ISO 8601.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_project_pull_requests:
    title: List a project's pull requests
    description: >-
      Pull requests with their associated runs, so test health can be read per
      PR rather than per run. `runs_per_pr` controls how many recent runs each
      card previews.
    category: runs
    read_only: true
    request:
      method: GET
      path: /v1/projects/${project_id}/pull-requests
      query:
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        runs_per_pr: "${runs_per_pr}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        authors[]: "${authors}"
        tag_operator: "${tag_operator}"
        search: "${search}"
        status: "${status}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '10'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      runs_per_pr:
        type: integer
        description: How many recent runs to preview on each pull request.
        optional: true
        default: '1'
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      tag_operator:
        type: string
        description: Whether all tags must match or any of them.
        optional: true
        enum: [AND, OR]
        default: AND
      search:
        type: string
        description: Case-insensitive search filter.
        optional: true
      status:
        type: array
        description: Filter runs by status.
        optional: true
        items: {type: string}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_project_insights:
    title: Get project insights
    description: >-
      Aggregate health for one project over a date range -- pass rate,
      duration and flakiness as a histogram. The reporting view, as opposed to
      the per-run detail.
    category: insights
    read_only: true
    request:
      method: GET
      path: /v1/projects/${project_id}/insights
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        resolution: "${resolution}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        groups[]: "${groups}"
        authors[]: "${authors}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      resolution:
        type: string
        description: Bucket size for the histogram, e.g. "1d".
        optional: true
        default: 1d
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Filter by group.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
    output:
      description: The requested record.
      type: object

  list_project_terms:
    title: List a project's terms
    description: >-
      The values one term type has taken on a project -- the tags, branches or
      authors seen in its runs. This is how to populate a filter's options
      without scanning every run.
    category: projects
    read_only: true
    request:
      method: GET
      path: /v1/projects/${project_id}/terms/${term_type}
      query:
        limit: "${limit}"
        dir: "${dir}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        search: "${search}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      term_type:
        type: string
        description: Which kind of term to act on, e.g. "tag".
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '100'
      dir:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
        default: desc
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      search:
        type: string
        description: Case-insensitive prefix filter on the term values.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  delete_project_term:
    title: Delete a project term
    description: >-
      Remove a term from a project's vocabulary. Only terms of type `tag` can
      be deleted; the runs that carried the tag keep it, but it stops
      appearing as a filter option.
    category: projects
    destructive: true
    request:
      method: DELETE
      path: /v1/projects/${project_id}/terms/${term_type}/${term_id}
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      term_type:
        type: string
        description: Which kind of term to act on, e.g. "tag".
      term_id:
        type: string
        description: The term's id. Only terms of type `tag` can be deleted.
    output:
      description: Confirmation that the record was deleted.
      type: object

  get_run:
    title: Get a run
    description: >-
      One run in full -- its status, timings, groups and the instances (spec
      files) it was split across. The instance ids here are what get_instance
      takes.
    category: runs
    read_only: true
    request:
      method: GET
      path: /v1/runs/${run_id}
    input:
      run_id:
        type: string
        description: The run id.
    output:
      description: The requested record.
      type: object

  find_run:
    title: Find a run
    description: >-
      Locate a run by CI build id, or the most recent one on a branch when no
      build id is given. The way to resolve "the run for this commit" without
      paging the project's history.
    category: runs
    read_only: true
    request:
      method: GET
      path: /v1/runs/find
      query:
        projectId: "${project_id}"
        ciBuildId: "${ci_build_id}"
        branch: "${branch}"
        tags[]: "${tags}"
        pwLastRun: "${pw_last_run}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      ci_build_id:
        type: string
        description: The exact CI build id to find.
        optional: true
      branch:
        type: string
        description: Git branch to search. A trailing `*` matches a prefix.
        optional: true
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      pw_last_run:
        type: boolean
        description: Include the failed tests from the last run, for Playwright reruns.
        optional: true
    output:
      description: The requested record.
      type: object

  delete_run:
    title: Delete a run
    description: >-
      Delete a run and its recorded results. Irreversible, and the run's
      contribution to the project's insights and flakiness history goes with
      it.
    category: runs
    destructive: true
    request:
      method: DELETE
      path: /v1/runs/${run_id}
    input:
      run_id:
        type: string
        description: The run id.
    output:
      description: Confirmation that the record was deleted.
      type: object

  cancel_run:
    title: Cancel a run
    description: >-
      Stop a run that is still in progress. Orchestrated workers stop being
      handed new specs, so the run ends with whatever it has completed rather
      than failing.
    category: runs
    request:
      method: PUT
      path: /v1/runs/${run_id}/cancel
    input:
      run_id:
        type: string
        description: The run id.
    output:
      description: The record after the update.
      type: object

  cancel_run_by_github_ci:
    title: Cancel a run by GitHub CI reference
    description: >-
      Cancel a run identified by its GitHub Actions workflow rather than by
      run id. What a workflow-cancellation hook calls, since it knows the
      workflow but not the Currents run id.
    category: runs
    request:
      method: PUT
      path: /v1/runs/cancel-ci/github
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The GitHub CI reference identifying the run to cancel.
    output:
      description: The record after the update.
      type: object

  reset_run:
    title: Reset a run
    description: >-
      Clear a run's recorded results so the same CI build id can record again.
      For a run that recorded a bad state and needs re-running under its
      original identity.
    category: runs
    request:
      method: PUT
      path: /v1/runs/${run_id}/reset
      body: "${attributes}"
    input:
      run_id:
        type: string
        description: The run id.
      attributes:
        type: object
        description: Reset options, where the endpoint accepts any.
    output:
      description: The record after the update.
      type: object

  get_instance:
    title: Get an instance
    description: >-
      One instance of a run -- a single spec file's execution, with its tests,
      timings and any recorded errors or screenshots.
    category: runs
    read_only: true
    request:
      method: GET
      path: /v1/instances/${instance_id}
    input:
      instance_id:
        type: string
        description: The instance id, from a run's `specs` array.
    output:
      description: The requested record.
      type: object

  get_test_results:
    title: Get a test's results over time
    description: >-
      Every execution of one test, identified by its signature, across the
      window. This is how to see whether a test is genuinely broken or has
      been flaky for weeks.
    category: tests
    read_only: true
    request:
      method: GET
      path: /v1/test-results/${signature}
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        authors[]: "${authors}"
        groups[]: "${groups}"
        environments[]: "${environments}"
        status[]: "${status}"
        flaky: "${flaky}"
        annotations: "${annotations}"
    input:
      signature:
        type: string
        description: The test signature hash, from get_test_signature or the tests explorer.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '10'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Filter by group.
        optional: true
        items: {type: string}
      environments:
        type: array
        description: Filter by environment.
        optional: true
        items: {type: string}
      status:
        type: array
        description: Filter by recorded outcome.
        optional: true
        items: {type: string}
      flaky:
        type: boolean
        description: True for only flaky executions, false for only non-flaky.
        optional: true
      annotations:
        type: string
        description: Filter by test annotations, as a JSON-stringified array of objects.
        optional: true
    output:
      description: The requested record.
      type: object

  get_test_signature:
    title: Compute a test's signature
    description: >-
      Turn a spec file path and test title into the signature Currents keys
      results on. Needed because the per-test endpoints take a signature, not
      a human-readable name.
    category: tests
    read_only: true
    request:
      method: POST
      path: /v1/signature/test
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The test to identify, as the project id, spec file path and test title the reference documents.
    output:
      description: The provider's response to the call.
      type: object

  get_tests_explorer:
    title: Get the tests explorer
    description: >-
      Every test in a project over a window, with executions, average duration
      and flakiness rate. The project-wide view test health is triaged from,
      as opposed to one test's history.
    category: tests
    read_only: true
    request:
      method: GET
      path: /v1/tests/${project_id}
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        page: "${page}"
        limit: "${limit}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        groups[]: "${groups}"
        authors[]: "${authors}"
        environments[]: "${environments}"
        order: "${order}"
        dir: "${dir}"
        spec: "${spec}"
        title: "${title}"
        min_executions: "${min_executions}"
        test_state[]: "${test_state}"
        metric_settings: "${metric_settings}"
        annotations: "${annotations}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '50'
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Filter by group.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      environments:
        type: array
        description: Filter by environment.
        optional: true
        items: {type: string}
      order:
        type: string
        description: Field to order by.
        optional: true
        default: title
      dir:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
        default: desc
      spec:
        type: string
        description: Filter by spec file name, partial match.
        optional: true
      title:
        type: string
        description: Filter by test title, partial match.
        optional: true
      min_executions:
        type: integer
        description: Only tests with at least this many executions.
        optional: true
      test_state:
        type: array
        description: Restrict the executions and duration metrics to these outcomes.
        optional: true
        items: {type: string}
      metric_settings:
        type: string
        description: Override which outcomes feed each metric, as JSON.
        optional: true
      annotations:
        type: string
        description: Filter by test annotations, as a JSON-stringified array of objects.
        optional: true
    output:
      description: The requested record.
      type: object

  get_errors_explorer:
    title: Get the errors explorer
    description: >-
      Failures across a project grouped by error, with counts and a timeline.
      The view that answers "one broken selector is failing forty tests"
      rather than listing forty separate failures.
    category: tests
    read_only: true
    request:
      method: GET
      path: /v1/errors/${project_id}
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        page: "${page}"
        limit: "${limit}"
        tags[]: "${tags}"
        tags_logical_operator: "${tags_logical_operator}"
        branches[]: "${branches}"
        groups[]: "${groups}"
        authors[]: "${authors}"
        error_target: "${error_target}"
        error_message: "${error_message}"
        error_category: "${error_category}"
        error_action: "${error_action}"
        test_title: "${test_title}"
        order_by: "${order_by}"
        dir: "${dir}"
        group_by[]: "${group_by}"
        metric: "${metric}"
        top_n: "${top_n}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '50'
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      tags_logical_operator:
        type: string
        description: Whether all tags must match or any of them.
        optional: true
        enum: [OR, AND]
        default: OR
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Filter by group.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      error_target:
        type: string
        description: Filter by error target, e.g. a CSS selector or url.
        optional: true
      error_message:
        type: string
        description: Filter by error message, case-insensitive partial match.
        optional: true
      error_category:
        type: string
        description: Filter by error category.
        optional: true
      error_action:
        type: string
        description: Filter by error action.
        optional: true
      test_title:
        type: string
        description: Filter by test title, case-insensitive partial match.
        optional: true
      order_by:
        type: string
        description: Field to order results by.
        optional: true
        default: count
      dir:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
        default: desc
      group_by:
        type: array
        description: Group results by these dimensions.
        optional: true
        items: {type: string}
      metric:
        type: string
        description: Which metric ranks the timeline.
        optional: true
        enum: [occurrence, test, branch]
        default: occurrence
      top_n:
        type: integer
        description: How many top errors per timeline bucket (1-50).
        optional: true
        default: '5'
    output:
      description: The requested record.
      type: object

  get_spec_files:
    title: Get spec file statistics
    description: >-
      Per-spec-file timings and outcomes over a window. What orchestration
      tuning is done from -- the slowest files are where sharding pays off.
    category: tests
    read_only: true
    request:
      method: GET
      path: /v1/spec-files/${project_id}
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        page: "${page}"
        limit: "${limit}"
        tags[]: "${tags}"
        branches[]: "${branches}"
        groups[]: "${groups}"
        authors[]: "${authors}"
        environments[]: "${environments}"
        order: "${order}"
        dir: "${dir}"
        specNameFilter: "${spec_name_filter}"
        includeFailedInDuration: "${include_failed_in_duration}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '50'
      tags:
        type: array
        description: Filter by run tags.
        optional: true
        items: {type: string}
      branches:
        type: array
        description: Filter by git branch. A trailing `*` matches a prefix, e.g. "release/*".
        optional: true
        items: {type: string}
      groups:
        type: array
        description: Filter by group.
        optional: true
        items: {type: string}
      authors:
        type: array
        description: Filter by git author.
        optional: true
        items: {type: string}
      environments:
        type: array
        description: Filter by environment.
        optional: true
        items: {type: string}
      order:
        type: string
        description: Field to order results by.
        optional: true
        default: avgDuration
      dir:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
        default: desc
      spec_name_filter:
        type: string
        description: Filter spec files by name, partial match.
        optional: true
      include_failed_in_duration:
        type: boolean
        description: Count failed executions in the duration averages.
        optional: true
        default: 'False'
    output:
      description: The requested record.
      type: object

  get_failure_context:
    title: Get test failure context
    description: >-
      The failure detail for a run, an instance or a single test, shaped for
      an agent to read -- error messages, stack traces and surrounding output,
      with a `detail` knob to keep the response short enough to reason over.
    category: tests
    read_only: true
    request:
      method: GET
      path: /v1/context
      query:
        run_id: "${run_id}"
        instance_id: "${instance_id}"
        test_id: "${test_id}"
        attempt: "${attempt}"
        format: "${format}"
        detail: "${detail}"
        limit: "${limit}"
        page: "${page}"
        max_length: "${max_length}"
        include_flaky: "${include_flaky}"
    input:
      run_id:
        type: string
        description: The run to describe. Required for run-level and instance-level context.
        optional: true
      instance_id:
        type: string
        description: The instance to describe. Required for instance-level and test-level context.
        optional: true
      test_id:
        type: string
        description: The test to describe. Selects test-level detail and needs instance_id alongside it.
        optional: true
      attempt:
        type: integer
        description: Which attempt to describe, zero-indexed. Defaults to the last attempt that errored.
        optional: true
      format:
        type: string
        description: Response format.
        optional: true
        enum: [json, md]
        default: json
      detail:
        type: string
        description: How verbose the output is, to control token count.
        optional: true
        default: default
      limit:
        type: integer
        description: How many failed tests per page, for run and instance level.
        optional: true
        default: '10'
      page:
        type: integer
        description: Page number for the failed tests, zero-indexed.
        optional: true
        default: '0'
      max_length:
        type: integer
        description: Truncate a markdown response to this many characters.
        optional: true
      include_flaky:
        type: boolean
        description: Run level only -- list flaky tests after the failed ones.
        optional: true
        default: 'False'
    output:
      description: The requested record.
      type: object

  list_actions:
    title: List actions
    description: >-
      The actions configured on a project -- quarantines, mutes and similar
      rules that change how a test's result is treated.
    category: actions
    read_only: true
    request:
      method: GET
      path: /v1/actions
      query:
        projectId: "${project_id}"
        status: "${status}"
        search: "${search}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      status:
        type: array
        description: Filter actions by status.
        optional: true
        items: {type: string}
      search:
        type: string
        description: Search actions by name.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_action:
    title: Create an action
    description: >-
      Create an action, such as quarantining a flaky test so it stops failing
      the build. This changes how future runs are judged, not just how they
      are displayed.
    category: actions
    request:
      method: POST
      path: /v1/actions
      query:
        projectId: "${project_id}"
      body: "${attributes}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      attributes:
        type: object
        description: The action definition, as the reference documents for CreateActionRequest.
    output:
      description: The provider's response to the call.
      type: object

  get_action:
    title: Get an action
    description: >-
      One action's definition and current status, including whether it is
      enabled.
    category: actions
    read_only: true
    request:
      method: GET
      path: /v1/actions/${action_id}
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
    output:
      description: The requested record.
      type: object

  update_action:
    title: Update an action
    description: >-
      Change an action's definition. To only pause it, prefer disable_action
      -- that is reversible without editing the rule.
    category: actions
    request:
      method: PUT
      path: /v1/actions/${action_id}
      body: "${attributes}"
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
      attributes:
        type: object
        description: The full replacement action definition.
    output:
      description: The record after the update.
      type: object

  delete_action:
    title: Delete an action
    description: >-
      Delete an action permanently. Tests it was quarantining start failing
      the build again on the next run.
    category: actions
    destructive: true
    request:
      method: DELETE
      path: /v1/actions/${action_id}
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
    output:
      description: Confirmation that the record was deleted.
      type: object

  enable_action:
    title: Enable an action
    description: >-
      Turn an action back on without changing its definition, so it starts
      applying to runs again.
    category: actions
    request:
      method: PUT
      path: /v1/actions/${action_id}/enable
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
    output:
      description: The record after the update.
      type: object

  disable_action:
    title: Disable an action
    description: >-
      Pause an action without deleting it. The reversible way to stop a
      quarantine and see whether a test has actually been fixed.
    category: actions
    request:
      method: PUT
      path: /v1/actions/${action_id}/disable
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
    output:
      description: The record after the update.
      type: object

  list_affected_tests:
    title: List tests affected by actions
    description: >-
      Which tests the project's actions are currently changing the outcome of.
      The audit view -- it answers how much of a green build is quarantine
      rather than genuine passes.
    category: actions
    read_only: true
    request:
      method: GET
      path: /v1/actions/tests
      query:
        projectId: "${project_id}"
        date_start: "${date_start}"
        date_end: "${date_end}"
        page: "${page}"
        limit: "${limit}"
        search: "${search}"
        action_type: "${action_type}"
        action_id: "${action_id}"
        dir: "${dir}"
        status: "${status}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '25'
      search:
        type: string
        description: Search by spec path, test title or action name.
        optional: true
      action_type:
        type: array
        description: Filter by action type.
        optional: true
        items: {type: string}
      action_id:
        type: string
        description: Filter to one action.
        optional: true
      dir:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
        default: desc
      status:
        type: array
        description: Filter by action status.
        optional: true
        items: {type: string}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_affected_test_executions:
    title: Get one test's affected executions
    description: >-
      The executions of one test that an action changed the outcome of, over a
      window. Use it to check whether a quarantined test would now pass on its
      own.
    category: actions
    read_only: true
    request:
      method: GET
      path: /v1/actions/tests/${signature}
      query:
        projectId: "${project_id}"
        date_start: "${date_start}"
        date_end: "${date_end}"
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        search: "${search}"
    input:
      signature:
        type: string
        description: The test signature hash, from get_test_signature or the tests explorer.
      project_id:
        type: string
        description: The project id, from list_projects.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '25'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      search:
        type: string
        description: Search by action name.
        optional: true
    output:
      description: The requested record.
      type: object

  get_action_affected_executions:
    title: Get an action's affected executions
    description: >-
      Every test execution one action changed, over a window. The per-action
      counterpart of the per-test view.
    category: actions
    read_only: true
    request:
      method: GET
      path: /v1/actions/${action_id}/tests
      query:
        date_start: "${date_start}"
        date_end: "${date_end}"
        limit: "${limit}"
        starting_after: "${starting_after}"
        ending_before: "${ending_before}"
        search: "${search}"
    input:
      action_id:
        type: string
        description: The action id, from list_actions.
      date_start:
        type: string
        description: Start of the window, ISO 8601.
      date_end:
        type: string
        description: End of the window, ISO 8601.
      limit:
        type: integer
        description: How many records to return. Max 50.
        optional: true
        default: '25'
      starting_after:
        type: string
        description: Cursor from a previous page; returns items after it.
        optional: true
      ending_before:
        type: string
        description: Cursor from a previous page; returns items before it.
        optional: true
      search:
        type: string
        description: Search by action name.
        optional: true
    output:
      description: The requested record.
      type: object

  list_webhooks:
    title: List webhooks
    description: >-
      The webhooks configured on a project, with the events each subscribes
      to.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /v1/webhooks
      query:
        projectId: "${project_id}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_webhook:
    title: Create a webhook
    description: >-
      Subscribe a url to a project's run events, so a downstream system learns
      about a failed run without polling.
    category: webhooks
    request:
      method: POST
      path: /v1/webhooks
      query:
        projectId: "${project_id}"
      body: "${attributes}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      attributes:
        type: object
        description: The webhook definition, as the reference documents for CreateWebhookRequest.
    output:
      description: The provider's response to the call.
      type: object

  get_webhook:
    title: Get a webhook
    description: >-
      One webhook's target url, event subscriptions and current state.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /v1/webhooks/${hook_id}
    input:
      hook_id:
        type: string
        description: The webhook id (a UUID).
    output:
      description: The requested record.
      type: object

  update_webhook:
    title: Update a webhook
    description: >-
      Change a webhook's url or event subscriptions. A PUT, so send the
      complete definition rather than only the changed field.
    category: webhooks
    request:
      method: PUT
      path: /v1/webhooks/${hook_id}
      body: "${attributes}"
    input:
      hook_id:
        type: string
        description: The webhook id (a UUID).
      attributes:
        type: object
        description: The full replacement webhook definition.
    output:
      description: The record after the update.
      type: object

  delete_webhook:
    title: Delete a webhook
    description: >-
      Delete a webhook subscription. Events that would have gone to it are not
      queued or replayed afterwards.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /v1/webhooks/${hook_id}
    input:
      hook_id:
        type: string
        description: The webhook id (a UUID).
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_jira_projects:
    title: List Jira projects
    description: >-
      The Jira projects reachable through the organization's Jira integration.
      Needed to pick a target before filing an issue from a failing test.
    category: integrations
    read_only: true
    request:
      method: GET
      path: /v1/integrations/jira/projects
      query:
        jira_installation_id: "${jira_installation_id}"
        search: "${search}"
        page: "${page}"
        limit: "${limit}"
    input:
      jira_installation_id:
        type: string
        description: The Atlassian installation id, as shown in the Currents dashboard.
      search:
        type: string
        description: Case-insensitive search filter.
        optional: true
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '50'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_jira_issue_types:
    title: List Jira issue types
    description: >-
      The issue types available in one Jira project -- Bug, Task and whatever
      else that project defines. The type must be valid for the project or the
      create call fails.
    category: integrations
    read_only: true
    request:
      method: GET
      path: /v1/integrations/jira/projects/${jira_project_id}/issue-types
      query:
        jira_installation_id: "${jira_installation_id}"
        search: "${search}"
        page: "${page}"
        limit: "${limit}"
    input:
      jira_project_id:
        type: string
        description: The Jira project id, from list_jira_projects.
      jira_installation_id:
        type: string
        description: The Atlassian installation id, as shown in the Currents dashboard.
      search:
        type: string
        description: Case-insensitive search filter.
        optional: true
      page:
        type: integer
        description: Page number, zero-indexed.
        optional: true
        default: '0'
      limit:
        type: integer
        description: How many records to return. Max 100.
        optional: true
        default: '50'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_jira_issue:
    title: Create a Jira issue from a failing test
    description: >-
      File a Jira issue straight from a run's failing test, with the failure
      context attached. Creates a real issue in Jira that someone will be
      notified about.
    category: integrations
    request:
      method: POST
      path: /v1/projects/${project_id}/jira/issues
      body: "${attributes}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      attributes:
        type: object
        description: The issue to create, as the reference documents for CreateJiraIssueFromRunTestRequest -- the run and test to attach, plus the Jira project and issue type.
    output:
      description: The provider's response to the call.
      type: object

  link_jira_issue:
    title: Link an existing Jira issue to a test
    description: >-
      Attach an existing Jira issue to a run's failing test, instead of
      creating a new one. The right move when the failure is already tracked.
    category: integrations
    request:
      method: POST
      path: /v1/projects/${project_id}/jira/issues/${jira_issue_key}/link
      body: "${attributes}"
    input:
      project_id:
        type: string
        description: The project id, from list_projects.
      jira_issue_key:
        type: string
        description: The Jira issue key as shown in Jira, e.g. "PROJ-123".
      attributes:
        type: object
        description: The run and test to link the issue to, as the reference documents for LinkJiraIssueFromRunTestRequest.
    output:
      description: The provider's response to the call.
      type: object
