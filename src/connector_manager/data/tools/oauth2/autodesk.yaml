    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id whose comments to list.
      sort_by:
        type: array
        description: Fields to sort by; prefix with - for descending.
        optional: true
        items: {type: string}
      limit:
        type: string
        description: Comments per page.
        optional: true
      offset:
        type: string
        description: Offset into the result set.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
