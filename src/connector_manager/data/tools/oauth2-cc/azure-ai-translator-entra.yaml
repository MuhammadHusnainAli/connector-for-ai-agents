# Azure AI Translator tools -- the Translator Text API v3.0.
#
# The connection points at the global endpoint
# (https://api.cognitive.microsofttranslator.com) and carries both the key and
# the resource's region, so paths here start at /translate, /detect and so on.
#
# Three things shape every tool below, and all three come from the API rather
# than from this pack:
#
#   * The body is always a JSON array of {"Text": "..."} objects, even for one
#     string. Each tool takes a plain `texts` array and builds that shape, so
#     the caller never writes it out. Up to 100 elements and 50,000 characters
#     in total per request.
#   * `api-version=3.0` is fixed. It is not a knob -- v3.0 is the only version
#     of this API -- so it is a literal in each request rather than an argument.
#   * `to` takes one target language per call. The API expresses several
#     targets by repeating the query parameter (to=de&to=it), which a single
#     key/value cannot represent, so translate into several languages with one
#     call each.
#
# Document Translation (whole PDFs and Office files, asynchronously) lives on
# the resource's own *.cognitiveservices.azure.com endpoint rather than this
# global one, so it is not reachable from this connector.
#
# Authentication is Microsoft Entra ID rather than a key: the connection
# signs in as a service principal (client credentials, scope
# https://cognitiveservices.azure.com/.default) and every call carries a bearer token.
# Tool for tool this is the same surface as the key-based `azure-ai-translator`
# connector -- what differs is who the request is made as, and therefore
# what Azure RBAC allows.
#
# Access needs the Cognitive Services User role on the Translator
# resource. Entra ID auth also requires the resource's full ARM id, which
# the connection carries and sends as Ocp-Apim-ResourceId -- Translator
# cannot infer which resource to bill from the token alone.
#
# Docs: https://learn.microsoft.com/azure/ai-services/translator/text-translation/reference/v3/reference

connector_id: azure-ai-translator-entra
display_name: Azure AI Translator (Entra ID)
docs_url: https://learn.microsoft.com/azure/ai-services/translator/text-translation/reference/v3/reference

tools:

  translate:
    title: Translate text
    description: >-
      Translate one or more strings into a target language. Omit from_language
      and the service detects the source and reports it, with a confidence
      score, alongside the translation. Set text_type to html to translate the
      readable text while leaving the markup intact. category names a Custom
      Translator model when you have trained one. One target language per call.
    category: translation
    read_only: true
    request:
      method: POST
      path: /translate
      query:
        api-version: "3.0"
        to: "${to}"
        from: "${from_language}"
        textType: "${text_type}"
        category: "${category}"
        profanityAction: "${profanity_action}"
        profanityMarker: "${profanity_marker}"
        includeAlignment: "${include_alignment}"
        includeSentenceLength: "${include_sentence_length}"
        suggestedFrom: "${suggested_from}"
        fromScript: "${from_script}"
        toScript: "${to_script}"
        allowFallback: "${allow_fallback}"
      body:
        $map:
          source: "${texts}"
          template:
            Text: "${item}"
    input:
      texts:
        type: array
        description: The strings to translate. Up to 100 per call, 50,000 characters in total.
        items: {type: string}
        example: [Where is the nearest station]
      to:
        type: string
        description: Target language code, e.g. fr, de, zh-Hans. One per call.
        example: fr
      from_language:
        type: string
        description: Source language code. Omit to have the service detect it.
        optional: true
        example: en
      text_type:
        type: string
        description: plain for ordinary text, html to translate around markup and leave tags alone.
        optional: true
        enum: [plain, html]
      category:
        type: string
        description: Custom Translator category id, when translating with your own trained model.
        optional: true
      profanity_action:
        type: string
        description: Translate profanity as-is, mark it, or delete it from the output.
        optional: true
        enum: [NoAction, Marked, Deleted]
      profanity_marker:
        type: string
        description: With profanity_action Marked, replace with asterisks or wrap in profanity tags.
        optional: true
        enum: [Asterisk, Tag]
      include_alignment:
        type: boolean
        description: Return character-level alignment between the source and the translation.
        optional: true
      include_sentence_length:
        type: boolean
        description: Return the sentence boundaries of both the source and the translation.
        optional: true
      suggested_from:
        type: string
        description: Fallback source language to assume when detection is not confident.
        optional: true
      from_script:
        type: string
        description: Script of the input text, e.g. Latn for romanised input.
        optional: true
      to_script:
        type: string
        description: Script to render the translation in, e.g. Latn to romanise the output.
        optional: true
      allow_fallback:
        type: boolean
        description: With category set, allow a general model when the custom one has no coverage.
        optional: true
    output:
      description: One entry per input string, each with its translation and any detected source language.
      type: array
      items: {type: object, description: "detectedLanguage (language, score) and translations, each with text, to and optional alignment and sentLen."}

  detect_language:
    title: Detect the language of text
    description: >-
      Identify which language each string is written in, with a confidence
      score and whether the language is supported for translation and
      transliteration. Cheaper than a translation round trip when all you need
      is routing, and it also reports plausible alternatives.
    category: translation
    read_only: true
    request:
      method: POST
      path: /detect
      query:
        api-version: "3.0"
      body:
        $map:
          source: "${texts}"
          template:
            Text: "${item}"
    input:
      texts:
        type: array
        description: The strings whose language to detect. Up to 100 per call.
        items: {type: string}
        example: [Wo ist der nächste Bahnhof]
    output:
      description: The detected language for each string, with alternatives.
      type: array
      items: {type: object, description: "language, score, isTranslationSupported, isTransliterationSupported and alternatives."}

  transliterate:
    title: Convert text between scripts
    description: >-
      Rewrite text from one script into another within the same language --
      Japanese kanji into Latin characters, Cyrillic Serbian into Latin
      Serbian. This does not translate: the words stay the same, only the
      writing system changes. Use list_languages with scope transliteration to
      see which script pairs a language supports.
    category: translation
    read_only: true
    request:
      method: POST
      path: /transliterate
      query:
        api-version: "3.0"
        language: "${language}"
        fromScript: "${from_script}"
        toScript: "${to_script}"
      body:
        $map:
          source: "${texts}"
          template:
            Text: "${item}"
    input:
      texts:
        type: array
        description: The strings to convert. Up to 10 per call, 1,000 characters in total.
        items: {type: string}
        example: [こんにちは]
      language:
        type: string
        description: Language code of the text, e.g. ja. The language does not change.
        example: ja
      from_script:
        type: string
        description: Script the text is currently in, e.g. Jpan.
        example: Jpan
      to_script:
        type: string
        description: Script to convert to, e.g. Latn.
        example: Latn
    output:
      description: Each string rewritten in the target script.
      type: array
      items: {type: object, description: "text and script."}

  break_sentence:
    title: Find sentence boundaries in text
    description: >-
      Report the length of each sentence in a string, which is how to split
      long input into sentences before translating it. Give language when you
      already know it; omit it and the service detects the language and returns
      it with the boundaries.
    category: translation
    read_only: true
    request:
      method: POST
      path: /breaksentence
      query:
        api-version: "3.0"
        language: "${language}"
        script: "${script}"
      body:
        $map:
          source: "${texts}"
          template:
            Text: "${item}"
    input:
      texts:
        type: array
        description: The strings to split. Up to 100 per call, 50,000 characters in total.
        items: {type: string}
        example: ["How are you? I am fine. Thank you."]
      language:
        type: string
        description: Language code of the text. Omit to have the service detect it.
        optional: true
        example: en
      script:
        type: string
        description: Script of the input text, e.g. Latn.
        optional: true
    output:
      description: For each string, the character length of each sentence in it.
      type: array
      items: {type: object, description: "sentLen, plus detectedLanguage when language was omitted."}

  dictionary_lookup:
    title: Look up alternative translations for a word
    description: >-
      Get the dictionary entry for a word or short phrase: every alternative
      translation, its part of speech, a confidence weight and the source words
      that back-translate to it. Use this to offer a user a choice of
      renderings rather than the single one translate returns.
    category: dictionary
    read_only: true
    request:
      method: POST
      path: /dictionary/lookup
      query:
        api-version: "3.0"
        from: "${from_language}"
        to: "${to}"
      body:
        $map:
          source: "${texts}"
          template:
            Text: "${item}"
    input:
      texts:
        type: array
        description: The words or short phrases to look up. Up to 10 per call, 100 characters each.
        items: {type: string}
        example: [fly]
      from_language:
        type: string
        description: Language code of the input word, e.g. en.
        example: en
      to:
        type: string
        description: Language code to look translations up in, e.g. es.
        example: es
    output:
      description: For each word, its alternative translations with parts of speech and confidence.
      type: array
      items: {type: object, description: "normalizedSource, displaySource and translations, each with normalizedTarget, posTag, confidence and backTranslations."}

  dictionary_examples:
    title: Show a translation used in context
    description: >-
      Return real sentence pairs showing a source word translated a particular
      way. Feed it a word plus one of the normalizedTarget values that
      dictionary_lookup returned -- the pair must come from that lookup, or
      there will be no examples to show.
    category: dictionary
    read_only: true
    request:
      method: POST
      path: /dictionary/examples
      query:
        api-version: "3.0"
        from: "${from_language}"
        to: "${to}"
      body:
        $map:
          source: "${pairs}"
          template: "${item}"
    input:
      pairs:
        type: array
        description: >-
          The word/translation pairs to illustrate, each an object with Text
          (the source word) and Translation (a normalizedTarget from
          dictionary_lookup). Up to 10 per call.
        items: {type: object}
        example: [{Text: fly, Translation: volar}]
      from_language:
        type: string
        description: Language code of the source word, e.g. en.
        example: en
      to:
        type: string
        description: Language code of the translation, e.g. es.
        example: es
    output:
      description: For each pair, sentence examples with the term marked in both languages.
      type: array
      items: {type: object, description: "normalizedSource, normalizedTarget and examples, each with sourcePrefix/Term/Suffix and targetPrefix/Term/Suffix."}

  list_languages:
    title: List supported languages
    description: >-
      List every language the service supports, grouped by what it supports the
      language for -- translation, transliteration (with the script pairs) and
      dictionary. Each entry gives the language's name in English and in its own
      script, plus its writing direction. This is the call that validates a
      language code before you use it. It needs no key, so a 200 here confirms
      reachability rather than credentials.
    category: reference
    read_only: true
    request:
      method: GET
      path: /languages
      query:
        api-version: "3.0"
        scope: "${scope}"
      headers:
        Accept-Language: "${accept_language}"
    input:
      scope:
        type: string
        description: 'Comma-separated groups to return: translation, transliteration, dictionary.'
        optional: true
        default: translation
      accept_language:
        type: string
        description: Language to return the language names in. Defaults to English.
        optional: true
        example: fr
    output:
      description: The supported languages, grouped by the scopes requested.
      type: object
      properties:
        translation: {type: object, description: "Keyed by language code; each with name, nativeName and dir."}
        transliteration: {type: object, description: "Keyed by language code; each with the scripts it converts between."}
        dictionary: {type: object, description: "Keyed by language code; each with the translations available."}
