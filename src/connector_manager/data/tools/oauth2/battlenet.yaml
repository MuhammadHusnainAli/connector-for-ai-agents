  get_character_pvp_bracket:
    title: Get a character's PvP bracket statistics
    description: >-
      Read a character's record in one PvP bracket -- 2v2, 3v3 or rated
      battlegrounds -- with its rating and win/loss counts.
    category: characters
    read_only: true
    request:
      method: GET
      path: /profile/wow/character/${realm_slug}/${character_name}/pvp-bracket/${bracket}
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug.
      character_name:
        type: string
        description: The character's name in lower case.
      bracket:
        type: string
        description: The bracket to read, e.g. "2v2", "3v3" or "rbg".
        example: 3v3
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The character's record in that bracket.
      type: object

  # -- guilds --------------------------------------------------------------

  get_guild:
    title: Get a guild
    description: >-
      Read a guild's summary -- faction, member count, achievement points and
      creation date. Both `realm_slug` and `guild_slug` are lower-case and
      hyphenated.
    category: guilds
    read_only: true
    request:
      method: GET
      path: /data/wow/guild/${realm_slug}/${guild_slug}
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug, lower case and hyphenated.
      guild_slug:
        type: string
        description: The guild's name as a slug -- lower case, hyphenated.
        example: the-horde-council
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The guild's summary.
      type: object

  get_guild_roster:
    title: Get a guild's roster
    description: >-
      Read a guild's members with their character, level, class and rank. The
      basis of any roster audit.
    category: guilds
    read_only: true
    request:
      method: GET
      path: /data/wow/guild/${realm_slug}/${guild_slug}/roster
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug.
      guild_slug:
        type: string
        description: The guild's slug.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The guild's members.
      type: object
      properties:
        members: {type: array}

  get_guild_achievements:
    title: Get a guild's achievements
    description: Read the achievements a guild has earned, with categories and totals.
    category: guilds
    read_only: true
    request:
      method: GET
      path: /data/wow/guild/${realm_slug}/${guild_slug}/achievements
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug.
      guild_slug:
        type: string
        description: The guild's slug.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The guild's achievements.
      type: object

  get_guild_activity:
    title: Get a guild's recent activity
    description: >-
      Read a guild's activity feed -- who joined, who earned what -- which is
      the closest thing to a change log for the roster.
    category: guilds
    read_only: true
    request:
      method: GET
      path: /data/wow/guild/${realm_slug}/${guild_slug}/activity
      query:
        namespace: "profile-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug.
      guild_slug:
        type: string
        description: The guild's slug.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The guild's recent activity.
      type: object

  # -- realms and the economy ----------------------------------------------

  list_realms:
    title: List realms
    description: >-
      Read every realm in the region with its slug -- the lookup that turns
      "Tarren Mill" into the "tarren-mill" every character call needs. Uses
      the dynamic namespace.
    category: realms
    read_only: true
    request:
      method: GET
      path: /data/wow/realm/index
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The region's realms.
      type: object
      properties:
        realms: {type: array}

  get_realm:
    title: Get a realm
    description: >-
      Read one realm -- its name, timezone, type and the connected realm it
      belongs to, which is what the auction house is keyed by.
    category: realms
    read_only: true
    request:
      method: GET
      path: /data/wow/realm/${realm_slug}
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      realm_slug:
        type: string
        description: The realm's slug.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The realm.
      type: object

  search_realms:
    title: Search realms
    description: >-
      Search realms by field, which is how you find a realm when you have a
      timezone or partial name rather than a slug. Pass Blizzard's search
      parameters -- e.g. {"timezone": "Europe/Paris", "orderby": "id",
      "_page": 1} -- in `query`.
    category: realms
    read_only: true
    request:
      method: GET
      path: /data/wow/search/realm
      query: "${query}"
    input:
      query:
        type: object
        description: >-
          Search parameters as a flat object. Must include
          `namespace` (e.g. "dynamic-us"), plus any of `timezone`, `orderby`,
          `_page` and Blizzard's field filters such as `name.en_US`.
        properties:
          namespace: {type: string, description: 'Required, e.g. "dynamic-us".'}
          orderby: {type: string}
          _page: {type: integer}
    output:
      description: The matching realms.
      type: object

  list_connected_realms:
    title: List connected realms
    description: >-
      Read the connected-realm groups in the region. Auctions and Mythic+
      leaderboards are keyed by connected realm, not by individual realm, so
      this is the id those calls need.
    category: realms
    read_only: true
    request:
      method: GET
      path: /data/wow/connected-realm/index
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The region's connected realms.
      type: object

  get_connected_realm:
    title: Get a connected realm
    description: >-
      Read one connected-realm group -- which realms share it, its population
      and status.
    category: realms
    read_only: true
    request:
      method: GET
      path: /data/wow/connected-realm/${connected_realm_id}
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      connected_realm_id:
        type: integer
        description: The connected realm's id, from list_connected_realms.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The connected realm.
      type: object

  get_auctions:
    title: Get a connected realm's auctions
    description: >-
      Read every live auction on a connected realm. This is a very large
      response -- the whole auction house -- and Blizzard refreshes it roughly
      hourly, so cache it rather than polling.
    category: economy
    read_only: true
    request:
      method: GET
      path: /data/wow/connected-realm/${connected_realm_id}/auctions
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      connected_realm_id:
        type: integer
        description: The connected realm's id, from list_connected_realms.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The connected realm's live auctions.
      type: object
      properties:
        auctions: {type: array}

  get_commodity_auctions:
    title: Get commodity auctions
    description: >-
      Read the region-wide commodity auctions -- crafting materials and other
      stackable goods, which are pooled across realms rather than per
      connected realm. Also large, and refreshed roughly hourly.
    category: economy
    read_only: true
    request:
      method: GET
      path: /data/wow/auctions/commodities
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The region's commodity auctions.
      type: object

  get_wow_token_price:
    title: Get the WoW token price
    description: >-
      Read the current WoW token price for the region, with the timestamp it
      was set. The cheapest interesting call in the game-data API.
    category: economy
    read_only: true
    request:
      method: GET
      path: /data/wow/token/index
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The token's current price and last update.
      type: object

  # -- leaderboards --------------------------------------------------------

  list_mythic_leaderboards:
    title: List a connected realm's Mythic+ leaderboards
    description: >-
      Read which dungeon leaderboards exist for a connected realm, with the
      dungeon and period ids get_mythic_leaderboard needs.
    category: leaderboards
    read_only: true
    request:
      method: GET
      path: /data/wow/connected-realm/${connected_realm_id}/mythic-leaderboard/index
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      connected_realm_id:
        type: integer
        description: The connected realm's id.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The available Mythic+ leaderboards.
      type: object

  get_mythic_leaderboard:
    title: Get a Mythic+ leaderboard
    description: >-
      Read one dungeon's Mythic+ leaderboard for a connected realm and weekly
      period -- the ranked runs, with their groups and timings.
    category: leaderboards
    read_only: true
    request:
      method: GET
      path: /data/wow/connected-realm/${connected_realm_id}/mythic-leaderboard/${dungeon_id}/period/${period}
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      connected_realm_id:
        type: integer
        description: The connected realm's id.
      dungeon_id:
        type: integer
        description: The dungeon's id, from list_mythic_leaderboards.
      period:
        type: integer
        description: The weekly period id, from list_mythic_leaderboards.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The leaderboard's ranked runs.
      type: object

  list_pvp_seasons:
    title: List PvP seasons
    description: Read the PvP seasons, whose ids the leaderboard calls take.
    category: leaderboards
    read_only: true
    request:
      method: GET
      path: /data/wow/pvp-season/index
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The PvP seasons.
      type: object

  get_pvp_leaderboard:
    title: Get a PvP leaderboard
    description: >-
      Read the ranked ladder for one PvP bracket in a season -- 2v2, 3v3 or
      rated battlegrounds -- with each character's rating and record.
    category: leaderboards
    read_only: true
    request:
      method: GET
      path: /data/wow/pvp-season/${pvp_season_id}/pvp-leaderboard/${bracket}
      query:
        namespace: "dynamic-${region}"
        locale: "${locale}"
    input:
      pvp_season_id:
        type: integer
        description: The PvP season's id, from list_pvp_seasons.
      bracket:
        type: string
        description: The bracket, e.g. "2v2", "3v3" or "rbg".
        example: 3v3
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The bracket's ranked ladder.
      type: object

  # -- reference data ------------------------------------------------------

  get_item:
    title: Get an item
    description: >-
      Read one item's definition -- name, quality, level, stats and item
      class. Uses the static namespace, since this is game reference data
      rather than a player's copy of the item.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/item/${item_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      item_id:
        type: integer
        description: The item's id.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The item's definition.
      type: object

  search_items:
    title: Search items
    description: >-
      Search the item database by field -- the way to turn a name into an item
      id. Pass Blizzard's search parameters in `query`, e.g.
      {"namespace": "static-us", "name.en_US": "Thunderfury", "orderby": "id"}.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/search/item
      query: "${query}"
    input:
      query:
        type: object
        description: >-
          Search parameters as a flat object. Must include `namespace` (e.g.
          "static-us"); then any of `name.en_US`, `item_class.id`,
          `item_subclass.id`, `orderby` and `_page`.
        properties:
          namespace: {type: string, description: 'Required, e.g. "static-us".'}
          orderby: {type: string}
          _page: {type: integer}
    output:
      description: The matching items.
      type: object

  get_item_media:
    title: Get an item's icon
    description: Read the icon and image assets for one item, as urls.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/media/item/${item_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      item_id:
        type: integer
        description: The item's id.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The item's media urls.
      type: object

  list_item_classes:
    title: List item classes
    description: >-
      Read the item class taxonomy -- weapons, armour, consumables -- whose
      ids narrow an item search.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/item-class/index
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The item classes.
      type: object

  list_playable_classes:
    title: List playable classes
    description: Read the game's playable classes with their ids and specialisations.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/playable-class/index
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The playable classes.
      type: object

  get_playable_class:
    title: Get a playable class
    description: >-
      Read one class -- its specialisations, power type and media -- which is
      the reference behind a character's class field.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/playable-class/${playable_class_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      playable_class_id:
        type: integer
        description: The class's id, from list_playable_classes.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The class's definition.
      type: object

  list_achievements:
    title: List achievements
    description: >-
      Read the achievement index -- every achievement in the game with its id,
      which a character's achievement list refers to.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/achievement/index
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The achievement index.
      type: object

  get_achievement:
    title: Get an achievement
    description: >-
      Read one achievement's definition -- its criteria, points, category and
      reward.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/achievement/${achievement_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      achievement_id:
        type: integer
        description: The achievement's id.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The achievement's definition.
      type: object

  list_professions:
    title: List professions
    description: >-
      Read the game's professions with their ids, which a character's
      profession list refers to.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/profession/index
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The professions.
      type: object

  get_profession_skill_tier:
    title: Get a profession's skill tier
    description: >-
      Read one skill tier of a profession -- its recipe categories and the
      recipes in each, which is how a crafting list is built.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/profession/${profession_id}/skill-tier/${skill_tier_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      profession_id:
        type: integer
        description: The profession's id, from list_professions.
      skill_tier_id:
        type: integer
        description: The skill tier's id, from the profession's own record.
      region:
        type: string
        description: Region of the connection's api domain.
        enum: [us, eu, kr, tw, cn]
      locale:
        type: string
        description: Language for names.
        optional: true
    output:
      description: The skill tier's recipe categories.
      type: object

  get_recipe:
    title: Get a recipe
    description: Read one crafting recipe -- what it makes and what it needs.
    category: game_data
    read_only: true
    request:
      method: GET
      path: /data/wow/recipe/${recipe_id}
      query:
        namespace: "static-${region}"
        locale: "${locale}"
    input:
      recipe_id:
        type: integer
        description: The recipe's id, from a profession's skill tier.
      region:
        type: string
