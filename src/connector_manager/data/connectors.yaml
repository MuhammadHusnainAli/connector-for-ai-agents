      order: 4
      secret: true
      title: AWS Access Key ID
      type: string
      visible_when:
        equals: builtin
        field: stsMode
    awsSecretAccessKey:
      description: Secret access key paired with the access key ID above.
      optional: true
      order: 5
      secret: true
      title: AWS Secret Access Key
      type: string
      visible_when:
        equals: builtin
        field: stsMode
    defaultRegion:
      description: Region used to sign requests when a connection does not specify one.
      example: us-east-1
      optional: true
      order: 2
      title: Default AWS Region
      type: string
    service:
      description: The AWS service requests are signed for (e.g. s3, execute-api).
      example: s3
      order: 1
      pattern: ^[a-z0-9-]+$
      title: AWS Service
      type: string
    stsApiKey:
      description: API key value sent to the custom STS endpoint.
      order: 9
      secret: true
      title: STS API Key
      type: string
      visible_when:
        equals: api_key
        field: stsAuthType
    stsAuthHeader:
      default_value: x-api-key
      description: Header name used to send the API key to the custom STS endpoint.
      optional: true
      order: 8
      title: STS Auth Header
      type: string
      visible_when:
        equals: api_key
        field: stsAuthType
    stsAuthPassword:
      description: Password for basic auth to the custom STS endpoint.
      order: 11
      secret: true
      title: STS Password
      type: string
      visible_when:
        equals: basic
        field: stsAuthType
    stsAuthType:
      default_value: none
      description: How to authenticate to the custom STS endpoint.
      enum:
      - none
      - api_key
      - basic
      optional: true
      order: 7
      title: STS Auth Type
      type: string
      visible_when:
        equals: custom
        field: stsMode
    stsAuthUsername:
      description: Username for basic auth to the custom STS endpoint.
