# Azure AI Language tools.
#
# The connection's base url already ends in /language, so paths start at
# /:analyze-text, /analyze-text/jobs, /:query-knowledgebases and /authoring.
# The leading colon on some paths is the service's own convention for an action
# rather than a resource -- it is not a typo.
#
# The service splits into four families, and they do not share an api-version,
# which is why each tool carries its own `api_version` default:
#
#   * Synchronous text analysis (POST /:analyze-text) -- sentiment, key
#     phrases, entities, PII, linked entities, language detection. One call,
#     one answer, up to 5 documents (10 for language detection) and 125k
#     characters. api-version 2023-04-01.
#   * Asynchronous text analysis (POST /analyze-text/jobs) -- everything the
#     synchronous endpoint cannot do in one round trip: summarisation, the
#     healthcare model, custom models, and several tasks over one batch.
#     Submit, then poll get_text_analysis_job until status is succeeded.
#   * Conversational language understanding and conversation analysis
#     (/:analyze-conversations and /analyze-conversations/jobs) -- intent and
#     entity prediction against a project you trained, and conversation
#     summarisation and PII redaction.
#   * Custom question answering (/:query-knowledgebases, /:query-text) --
#     api-version 2021-10-01, a different family again.
#
# Authoring tools sit under /authoring and manage projects, training and
# deployments for the custom models the runtime tools call.
#
# Every task tool below is the same POST /:analyze-text with a different
# `kind`; they are split out because an agent picking "analyze_sentiment" is
# far more reliable than one picking the right kind string.
#
# Authentication is Microsoft Entra ID rather than a key: the connection
# signs in as a service principal (client credentials, scope
# https://cognitiveservices.azure.com/.default) and every call carries a bearer token.
# Tool for tool this is the same surface as the key-based `azure-ai-language`
# connector -- what differs is who the request is made as, and therefore
# what Azure RBAC allows.
#
# Access needs the Cognitive Services User role (or a narrower built-in
# role) on the Language resource. A resource with local authentication
# disabled accepts nothing else, so on those this is the only way in.
#
# Docs: https://learn.microsoft.com/rest/api/language/

connector_id: azure-ai-language-entra
display_name: Azure AI Language (Entra ID)
docs_url: https://learn.microsoft.com/rest/api/language/

tools:

  analyze_sentiment:
    title: Analyse sentiment
    description: >-
      Classify each text as positive, negative, neutral or mixed, with
      confidence scores for the document and for every sentence. Turn on
      opinion_mining to also get aspect/opinion pairs -- "the room was clean but
      the wifi was slow" yields room:clean and wifi:slow separately. Up to five
      texts per call.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: SentimentAnalysis
        parameters:
          opinionMining: "${opinion_mining}"
          modelVersion: "${model_version}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                language: "${language}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts to analyse, one string per document. Up to five per call.
        items: {type: string}
        example: [The room was spotless but the wifi never worked.]
      language:
        type: string
        description: BCP-47 language code for every text, e.g. en, fr, de. Defaults to English.
        optional: true
        example: en
      opinion_mining:
        type: boolean
        description: Also return the aspects mentioned and the opinion expressed about each.
        optional: true
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
        example: latest
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Per-document sentiment with confidence scores and sentence breakdown.
      type: object
      properties:
        results: {type: object, description: "documents (each with id, sentiment, confidenceScores, sentences) and errors."}

  extract_key_phrases:
    title: Extract key phrases
    description: >-
      Pull the main talking points out of each text as a list of phrases, with
      no scores or ordering guarantees. Good for tagging, clustering and quick
      summarisation of short documents; use the summarisation job for anything
      that needs real sentences back.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: KeyPhraseExtraction
        parameters:
          modelVersion: "${model_version}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                language: "${language}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts to extract phrases from, one string per document.
        items: {type: string}
        example: [The food was delicious and the staff were wonderful.]
      language:
        type: string
        description: BCP-47 language code for every text. Defaults to English.
        optional: true
        example: en
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The key phrases found in each document.
      type: object
      properties:
        results: {type: object, description: "documents (each with id and keyPhrases) and errors."}

  detect_language:
    title: Detect the language of text
    description: >-
      Identify which language each text is written in, returning the name, the
      ISO 639-1 code and a confidence score. Use it to route text to the right
      language-specific model, or to pick the from-language for a translation.
      Accepts up to 1000 texts per call.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: LanguageDetection
        parameters:
          modelVersion: "${model_version}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                countryHint: "${country_hint}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts whose language to detect, one string per document.
        items: {type: string}
        example: ["Bonjour, comment allez-vous ?"]
      country_hint:
        type: string
        description: 'ISO 3166-1 alpha-2 country hint that disambiguates similar languages, e.g. "us". Pass "" to disable.'
        optional: true
        example: fr
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The detected language for each document, with a confidence score.
      type: object
      properties:
        results: {type: object, description: "documents (each with id and detectedLanguage) and errors."}

  recognize_entities:
    title: Recognise named entities
    description: >-
      Find people, organisations, locations, dates, quantities and the other
      general entity categories in each text, with the character offsets and a
      confidence score for each. This is the general model -- use
      recognize_pii_entities for personal data you intend to redact, and
      recognize_linked_entities to resolve names to Wikipedia articles.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: EntityRecognition
        parameters:
          modelVersion: "${model_version}"
          stringIndexType: "${string_index_type}"
          inclusionList: "${inclusion_list}"
          exclusionList: "${exclusion_list}"
          overlapPolicy: "${overlap_policy}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                language: "${language}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts to scan for entities, one string per document.
        items: {type: string}
        example: [Ada Lovelace met Charles Babbage in London in 1833.]
      language:
        type: string
        description: BCP-47 language code for every text. Defaults to English.
        optional: true
      string_index_type:
        type: string
        description: >-
          How the returned offsets are counted. Utf16CodeUnit suits JavaScript,
          TextElements_v8 suits .NET, UnicodeCodePoint suits Python.
        optional: true
        enum: [TextElements_v8, UnicodeCodePoint, Utf16CodeUnit]
      inclusion_list:
        type: array
        description: Only return entities in these categories, e.g. ["Person","Location"].
        optional: true
        items: {type: string}
      exclusion_list:
        type: array
        description: Suppress these entity categories from the results.
        optional: true
        items: {type: string}
      overlap_policy:
        type: object
        description: 'How to handle overlapping entities, e.g. {"policyKind": "allowOverlap"}.'
        optional: true
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The entities found in each document, with category, offsets and confidence.
      type: object
      properties:
        results: {type: object, description: "documents (each with id and entities) and errors."}

  recognize_pii_entities:
    title: Recognise and redact personal information
    description: >-
      Find personally identifiable information -- names, addresses, phone
      numbers, emails, national IDs, bank and credit card numbers -- and return
      both the entities and a redacted copy of the text with them masked. Set
      domain to "phi" to use the protected-health-information model instead of
      the general one, and pii_categories to restrict what counts.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: PiiEntityRecognition
        parameters:
          domain: "${domain}"
          piiCategories: "${pii_categories}"
          redactionCharacter: "${redaction_character}"
          stringIndexType: "${string_index_type}"
          modelVersion: "${model_version}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                language: "${language}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts to scan for personal information, one string per document.
        items: {type: string}
        example: ["Call Ada on 020 7946 0958 or email ada@example.com."]
      language:
        type: string
        description: BCP-47 language code for every text. Defaults to English.
        optional: true
      domain:
        type: string
        description: none for the general PII model, phi for protected health information.
        optional: true
        enum: [none, phi]
      pii_categories:
        type: array
        description: Only detect these categories, e.g. ["Email","PhoneNumber","CreditCardNumber"].
        optional: true
        items: {type: string}
      redaction_character:
        type: string
        description: Character used to mask detected entities in redactedText.
        optional: true
        example: "*"
      string_index_type:
        type: string
        description: How the returned offsets are counted.
        optional: true
        enum: [TextElements_v8, UnicodeCodePoint, Utf16CodeUnit]
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The personal information found, plus a redacted copy of each document.
      type: object
      properties:
        results: {type: object, description: "documents (each with id, redactedText and entities) and errors."}

  recognize_linked_entities:
    title: Recognise and link entities to Wikipedia
    description: >-
      Find entities and resolve each to a well-known knowledge base entry,
      which disambiguates names -- "Mars" the planet from "Mars" the
      confectioner. Each match comes back with its Wikipedia name, url and the
      places in the text it was mentioned.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: EntityLinking
        parameters:
          modelVersion: "${model_version}"
          stringIndexType: "${string_index_type}"
          loggingOptOut: "${logging_opt_out}"
        analysisInput:
          documents:
            $map:
              source: "${texts}"
              template:
                id: "doc${index}"
                language: "${language}"
                text: "${item}"
    input:
      texts:
        type: array
        description: The texts to scan and link, one string per document.
        items: {type: string}
        example: [Microsoft was founded by Bill Gates and Paul Allen.]
      language:
        type: string
        description: BCP-47 language code for every text. Defaults to English.
        optional: true
      string_index_type:
        type: string
        description: How the returned offsets are counted.
        optional: true
        enum: [TextElements_v8, UnicodeCodePoint, Utf16CodeUnit]
      model_version:
        type: string
        description: Pin a specific model version instead of the current default.
        optional: true
      logging_opt_out:
        type: boolean
        description: Ask the service not to log this input for troubleshooting.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The linked entities per document, each with its knowledge base url.
      type: object
      properties:
        results: {type: object, description: "documents (each with id and entities carrying name, url, dataSource, matches) and errors."}

  analyze_text:
    title: Run any synchronous text analysis task
    description: >-
      The general form of the synchronous endpoint, for a task the named tools
      above do not cover or when you need to set a parameter they do not expose.
      Give kind (SentimentAnalysis, EntityRecognition, KeyPhraseExtraction,
      LanguageDetection, PiiEntityRecognition, EntityLinking,
      CustomEntityRecognition, CustomSingleLabelClassification, ...) and the
      matching parameters object.
    category: text-analysis
    read_only: true
    request:
      method: POST
      path: /:analyze-text
      query:
        api-version: "${api_version}"
      body:
        kind: "${kind}"
        parameters: "${parameters}"
        analysisInput:
          documents: "${documents}"
    input:
      kind:
        type: string
        description: >-
          The analysis task to run, e.g. SentimentAnalysis, EntityRecognition,
          KeyPhraseExtraction, LanguageDetection, PiiEntityRecognition,
          EntityLinking.
        example: SentimentAnalysis
      documents:
        type: array
        description: >-
          The documents, each an object with id and text plus language (or
          countryHint for language detection). Ids must be unique in the batch.
        items: {type: object}
        example: [{id: "1", language: en, text: The room was spotless.}]
      parameters:
        type: object
        description: 'Task parameters -- the keys depend on kind, e.g. {"opinionMining": true}.'
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The task's results, shaped by the kind requested.
      type: object
      properties:
        kind: {type: string}
        results: {type: object}

  submit_text_analysis_job:
    title: Submit a long-running text analysis job
    description: >-
      Queue one or more analysis tasks over a batch of documents. This is the
      only route to summarisation (ExtractiveSummarization,
      AbstractiveSummarization), the healthcare model (Healthcare), custom
      trained models, and to running several tasks over one batch in a single
      pass. Returns 202 with an operation-location header; poll
      get_text_analysis_job with the job id from it.
    category: jobs
    request:
      method: POST
      path: /analyze-text/jobs
      query:
        api-version: "${api_version}"
      body:
        displayName: "${display_name}"
        analysisInput:
          documents: "${documents}"
        tasks: "${tasks}"
    input:
      documents:
        type: array
        description: The documents to analyse, each an object with id, language and text.
        items: {type: object}
        example: [{id: "1", language: en, text: The patient was prescribed 100mg of ibuprofen.}]
      tasks:
        type: array
        description: >-
          The tasks to run over the batch. Each is an object with kind
          (ExtractiveSummarization, AbstractiveSummarization, Healthcare,
          PiiEntityRecognition, CustomEntityRecognition, ...), an optional
          taskName, and its own parameters.
        items: {type: object}
        example: [{kind: ExtractiveSummarization, taskName: summary, parameters: {sentenceCount: 3}}]
      display_name:
        type: string
        description: A label for the job, so it is recognisable when polling.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: >-
        Empty body; the job id is in the operation-location response header,
        which ends in /analyze-text/jobs/{jobId}.
      type: object

  get_text_analysis_job:
    title: Get a text analysis job's status and results
    description: >-
      Poll a job submitted with submit_text_analysis_job. status moves through
      notStarted, running and then succeeded, failed, cancelled or
      partiallyCompleted; the results for each task appear under tasks.items
      once it is done. Page long result sets with top and skip.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /analyze-text/jobs/${job_id}
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
        showStats: "${show_stats}"
    input:
      job_id:
        type: string
        description: Job id from the operation-location header of the submit call.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      top:
        type: integer
        description: How many results to return per page.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many results to skip, for paging.
        optional: true
        minimum: 0
      show_stats:
        type: boolean
        description: Include per-document and per-batch statistics in the response.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The job's status and, once complete, each task's results.
      type: object
      properties:
        jobId: {type: string}
        status: {type: string, description: "notStarted, running, succeeded, partiallyCompleted, failed or cancelled."}
        tasks: {type: object, description: "completed, failed, inProgress, total and items carrying each task's results."}
        errors: {type: array}

  cancel_text_analysis_job:
    title: Cancel a text analysis job
    description: >-
      Ask the service to stop a running job. Cancellation is best effort --
      tasks already finished keep their results, and the job ends as cancelled
      or partiallyCompleted rather than disappearing.
    category: jobs
    request:
      method: POST
      path: /analyze-text/jobs/${job_id}:cancel
      query:
        api-version: "${api_version}"
    input:
      job_id:
        type: string
        description: Job id to cancel.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; the service answers 202 with an operation-location header.
      type: object

  analyze_conversation:
    title: Predict intent and entities from an utterance
    description: >-
      Run one utterance against a deployed conversational language
      understanding (CLU) or orchestration project and get back the top intent,
      the ranked alternatives and any entities extracted. The project must
      already be trained and deployed -- see train_conversation_project and
      list_conversation_deployments.
    category: conversations
    read_only: true
    request:
      method: POST
      path: /:analyze-conversations
      query:
        api-version: "${api_version}"
      body:
        kind: Conversation
        analysisInput:
          conversationItem:
            id: "1"
            participantId: "1"
            text: "${text}"
            language: "${language}"
        parameters:
          projectName: "${project_name}"
          deploymentName: "${deployment_name}"
          verbose: "${verbose}"
          isLoggingEnabled: "${is_logging_enabled}"
          stringIndexType: "${string_index_type}"
    input:
      text:
        type: string
        description: The utterance to classify.
        example: Book me a flight to Cairo on Friday
      project_name:
        type: string
        description: Name of the CLU or orchestration project to predict against.
        example: TravelBot
      deployment_name:
        type: string
        description: Name of the project's deployment to use.
        example: production
      language:
        type: string
        description: BCP-47 language code of the utterance.
        optional: true
        example: en
      verbose:
        type: boolean
        description: Return every intent with its score, not just the top one.
        optional: true
      is_logging_enabled:
        type: boolean
        description: Let the service log this utterance for model improvement.
        optional: true
      string_index_type:
        type: string
        description: How entity offsets in the response are counted.
        optional: true
        enum: [TextElements_v8, UnicodeCodePoint, Utf16CodeUnit]
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The predicted intent, ranked alternatives and extracted entities.
      type: object
      properties:
        kind: {type: string}
        result: {type: object, description: "query and prediction, carrying topIntent, intents and entities."}

  submit_conversation_job:
    title: Submit a conversation analysis job
    description: >-
      Queue summarisation or PII redaction over a whole conversation --
      a call transcript or chat log with speaker turns. Returns 202 with an
      operation-location header; poll get_conversation_job for the results.
      Use analyze_conversation instead for single-utterance intent prediction.
    category: conversations
    request:
      method: POST
      path: /analyze-conversations/jobs
      query:
        api-version: "${api_version}"
      body:
        displayName: "${display_name}"
        analysisInput:
          conversations: "${conversations}"
        tasks: "${tasks}"
    input:
      conversations:
        type: array
        description: >-
          The conversations, each with id, language, modality (text or
          transcript) and conversationItems carrying participantId, id and text.
        items: {type: object}
        example: [{id: "1", language: en, modality: text, conversationItems: [{participantId: Agent, id: "1", text: "How can I help?"}]}]
      tasks:
        type: array
        description: >-
          The tasks to run, each with a kind such as ConversationalSummarizationTask
          or ConversationalPIITask, a taskName and its parameters.
        items: {type: object}
        example: [{taskName: summary, kind: ConversationalSummarizationTask, parameters: {summaryAspects: [issue, resolution]}}]
      display_name:
        type: string
        description: A label for the job, so it is recognisable when polling.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: >-
        Empty body; the job id is in the operation-location response header,
        which ends in /analyze-conversations/jobs/{jobId}.
      type: object

  get_conversation_job:
    title: Get a conversation job's status and results
    description: >-
      Poll a job submitted with submit_conversation_job. Once status is
      succeeded, the summaries or redacted transcripts are under
      tasks.items[].results.conversations.
    category: conversations
    read_only: true
    request:
      method: GET
      path: /analyze-conversations/jobs/${job_id}
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
        showStats: "${show_stats}"
    input:
      job_id:
        type: string
        description: Job id from the operation-location header of the submit call.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      top:
        type: integer
        description: How many results to return per page.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many results to skip, for paging.
        optional: true
        minimum: 0
      show_stats:
        type: boolean
        description: Include per-conversation statistics in the response.
        optional: true
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The job's status and, once complete, each task's results.
      type: object
      properties:
        jobId: {type: string}
        status: {type: string}
        tasks: {type: object}

  cancel_conversation_job:
    title: Cancel a conversation analysis job
    description: >-
      Ask the service to stop a running conversation job. Cancellation is best
      effort; tasks that already finished keep their results.
    category: conversations
    request:
      method: POST
      path: /analyze-conversations/jobs/${job_id}:cancel
      query:
        api-version: "${api_version}"
    input:
      job_id:
        type: string
        description: Job id to cancel.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      api_version:
        type: string
        description: Language REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; the service answers 202 with an operation-location header.
      type: object

  query_knowledge_base:
    title: Ask a custom question answering project
    description: >-
      Put a question to a deployed custom question answering project and get
      the ranked answers, each with a confidence score and the source it came
      from. Pass a previous answer's id as context_previous_qna_id to follow a
      multi-turn prompt chain. Note this family uses api-version 2021-10-01.
    category: question-answering
    read_only: true
    request:
      method: POST
      path: /:query-knowledgebases
      query:
        api-version: "${api_version}"
        projectName: "${project_name}"
        deploymentName: "${deployment_name}"
      body:
        question: "${question}"
        qnaId: "${qna_id}"
        top: "${top}"
        confidenceScoreThreshold: "${confidence_score_threshold}"
        includeUnstructuredSources: "${include_unstructured_sources}"
        userId: "${user_id}"
        rankerType: "${ranker_type}"
        answerSpanRequest:
          $when: "${answer_span}"
          enable: "${answer_span}"
        context:
          $when: "${context_previous_qna_id}"
          previousQnaId: "${context_previous_qna_id}"
          previousUserQuery: "${context_previous_user_query}"
    input:
      project_name:
        type: string
        description: Name of the custom question answering project.
        example: FaqBot
      deployment_name:
        type: string
        description: Deployment to query -- usually "production" or "test".
        example: production
      question:
        type: string
        description: The user's question. Give this or qna_id.
        optional: true
        example: How do I reset my password?
      qna_id:
        type: integer
        description: Fetch one specific QnA pair by id instead of searching by question.
        optional: true
      top:
        type: integer
        description: How many ranked answers to return.
        optional: true
        minimum: 1
      confidence_score_threshold:
        type: number
        description: Discard answers scoring below this, between 0 and 1.
        optional: true
        minimum: 0
        maximum: 1
      include_unstructured_sources:
        type: boolean
        description: Also answer from unstructured documents attached to the project.
        optional: true
      answer_span:
        type: boolean
        description: Return the precise sentence within the answer that addresses the question.
        optional: true
      context_previous_qna_id:
        type: integer
        description: Id of the answer the user was shown, to resolve a follow-up prompt.
        optional: true
      context_previous_user_query:
        type: string
        description: The question asked in the previous turn, for multi-turn context.
        optional: true
      user_id:
        type: string
        description: Opaque identifier for the end user, used for personalised ranking.
        optional: true
      ranker_type:
        type: string
        description: Use the default ranker or restrict to a plain question-only ranker.
        optional: true
        enum: [Default, QuestionOnly]
      api_version:
        type: string
        description: Question answering REST API version to call.
        optional: true
        default: "2021-10-01"
    output:
      description: Ranked answers with confidence scores and their sources.
      type: array
      items: {type: object, description: "answer, confidenceScore, id, source, questions, dialog and answerSpan."}
      response_path: answers

  query_text:
    title: Answer a question from supplied passages
    description: >-
      Answer a question against text records you pass in the call, with no
      project or deployment involved. Use it to put a question to documents you
      already have -- a page of docs, a set of search results -- without first
      building a knowledge base.
    category: question-answering
    read_only: true
    request:
      method: POST
      path: /:query-text
      query:
        api-version: "${api_version}"
      body:
        question: "${question}"
        records: "${records}"
        language: "${language}"
        stringIndexType: "${string_index_type}"
    input:
      question:
        type: string
        description: The question to answer.
        example: How long is the warranty?
      records:
        type: array
        description: The passages to answer from, each an object with id and text.
        items: {type: object}
        example: [{id: doc1, text: All hardware carries a two year warranty.}]
      language:
        type: string
        description: BCP-47 language code of the question and passages.
        optional: true
        example: en
      string_index_type:
        type: string
        description: How answer span offsets in the response are counted.
        optional: true
        enum: [TextElements_v8, UnicodeCodePoint, Utf16CodeUnit]
      api_version:
        type: string
        description: Question answering REST API version to call.
        optional: true
        default: "2021-10-01"
    output:
      description: Ranked answers drawn from the supplied passages.
      type: array
      items: {type: object, description: "answer, confidenceScore, id, answerSpan and offset."}
      response_path: answers

  list_text_projects:
    title: List custom text projects
    description: >-
      List the custom text projects on this resource -- custom NER, custom text
      classification and custom summarisation -- with their language, kind and
      the dates they were created, modified and last trained.
    category: authoring
    read_only: true
    request:
      method: GET
      path: /authoring/analyze-text/projects
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
        maxpagesize: "${max_page_size}"
    input:
      top:
        type: integer
        description: How many projects to return.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many projects to skip, for paging.
        optional: true
        minimum: 0
      max_page_size:
        type: integer
        description: Maximum items the service should put in one page.
        optional: true
        minimum: 1
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: A page of custom text projects.
      type: object
      properties:
        value: {type: array, description: "Each with projectName, projectKind, language, createdDateTime, lastTrainedDateTime."}
        nextLink: {type: string, description: "Absolute url of the next page; absent on the last."}

  get_text_project:
    title: Get a custom text project
    description: >-
      Read one custom text project's metadata: its kind, primary language,
      multilingual flag, description, storage container and the timestamps for
      creation, modification, training and deployment.
    category: authoring
    read_only: true
    request:
      method: GET
      path: /authoring/analyze-text/projects/${project_name}
      query:
        api-version: "${api_version}"
    input:
      project_name:
        type: string
        description: Name of the project.
        example: ContractNER
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: The project's metadata.
      type: object
      properties:
        projectName: {type: string}
        projectKind: {type: string}
        language: {type: string}
        lastTrainedDateTime: {type: string}

  delete_text_project:
    title: Delete a custom text project
    description: >-
      Delete a custom text project along with its labelled data, trained models
      and deployments. This is not recoverable, and any application calling a
      deployment of the project stops working immediately.
    category: authoring
    destructive: true
    request:
      method: DELETE
      path: /authoring/analyze-text/projects/${project_name}
      query:
        api-version: "${api_version}"
    input:
      project_name:
        type: string
        description: Name of the project to delete.
        example: ContractNER
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; the service answers 202 with an operation-location header to poll.
      type: object

  train_text_project:
    title: Train a custom text model
    description: >-
      Kick off a training run over a project's labelled data, producing a named
      model. evaluation_options controls the train/test split; pass a manual
      split only if the project's data is already tagged with it. Returns 202
      with an operation-location header -- training takes minutes to hours.
    category: authoring
    request:
      method: POST
      path: /authoring/analyze-text/projects/${project_name}/:train
      query:
        api-version: "${api_version}"
      body:
        modelLabel: "${model_label}"
        trainingConfigVersion: "${training_config_version}"
        evaluationOptions: "${evaluation_options}"
    input:
      project_name:
        type: string
        description: Project whose labelled data to train on.
        example: ContractNER
      model_label:
        type: string
        description: Name to give the trained model.
        example: v3
      training_config_version:
        type: string
        description: Pin a training configuration version instead of the current default.
        optional: true
      evaluation_options:
        type: object
        description: 'Train/test split, e.g. {"kind": "percentage", "trainingSplitPercentage": 80, "testingSplitPercentage": 20}.'
        optional: true
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; poll the operation-location header for training progress.
      type: object

  list_text_trained_models:
    title: List a project's trained models
    description: >-
      List the models trained for a custom text project, with the training
      configuration each used and when it expires. A model must exist before it
      can be deployed.
    category: authoring
    read_only: true
    request:
      method: GET
      path: /authoring/analyze-text/projects/${project_name}/models
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
    input:
      project_name:
        type: string
        description: Name of the project.
        example: ContractNER
      top:
        type: integer
        description: How many models to return.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many models to skip, for paging.
        optional: true
        minimum: 0
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: A page of trained models for the project.
      type: object
      properties:
        value: {type: array, description: "Each with label, modelExpirationDate, trainingConfigVersion and lastTrainedDateTime."}
        nextLink: {type: string}

  list_text_deployments:
    title: List a custom text project's deployments
    description: >-
      List the deployments of a custom text project and which trained model
      each serves. The deployment name is what runtime prediction calls address.
    category: authoring
    read_only: true
    request:
      method: GET
      path: /authoring/analyze-text/projects/${project_name}/deployments
      query:
        api-version: "${api_version}"
        top: "${top}"
        skip: "${skip}"
    input:
      project_name:
        type: string
        description: Name of the project.
        example: ContractNER
      top:
        type: integer
        description: How many deployments to return.
        optional: true
        minimum: 1
      skip:
        type: integer
        description: How many deployments to skip, for paging.
        optional: true
        minimum: 0
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: A page of deployments for the project.
      type: object
      properties:
        value: {type: array, description: "Each with deploymentName, modelId, lastDeployedDateTime and deploymentExpirationDate."}
        nextLink: {type: string}

  deploy_text_project:
    title: Deploy a trained custom text model
    description: >-
      Put a trained model behind a named deployment, creating the deployment or
      swapping the model behind an existing one. Runtime prediction calls
      address the deployment name, so swapping the model here is how a new
      model version goes live without clients changing anything.
    category: authoring
    request:
      method: PUT
      path: /authoring/analyze-text/projects/${project_name}/deployments/${deployment_name}
      query:
        api-version: "${api_version}"
      body:
        trainedModelLabel: "${trained_model_label}"
    input:
      project_name:
        type: string
        description: Name of the project.
        example: ContractNER
      deployment_name:
        type: string
        description: Name of the deployment to create or update.
        example: production
      trained_model_label:
        type: string
        description: Label of the trained model to put behind the deployment.
        example: v3
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; poll the operation-location header until the deployment completes.
      type: object

  delete_text_deployment:
    title: Delete a custom text deployment
    description: >-
      Take a deployment offline. The trained model and the project's labelled
      data survive, but every runtime prediction call naming this deployment
      starts failing at once.
    category: authoring
    destructive: true
    request:
      method: DELETE
      path: /authoring/analyze-text/projects/${project_name}/deployments/${deployment_name}
      query:
        api-version: "${api_version}"
    input:
      project_name:
        type: string
        description: Name of the project.
        example: ContractNER
      deployment_name:
        type: string
        description: Name of the deployment to delete.
        example: staging
      api_version:
        type: string
        description: Language authoring REST API version to call.
        optional: true
        default: "2023-04-01"
    output:
      description: Empty body; poll the operation-location header until the deletion completes.
      type: object

