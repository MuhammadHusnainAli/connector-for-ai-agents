          (e.g., 1.2345 for 1 EUR = 1.2345 USD if USD is the home currency).
        optional: true
      external_id:
        type: string
        description: 'A globally unique identifier (GUID) you, the developer, can provide for tracking
          this object in your external system. This field is immutable and can only be set during object
          creation. IMPORTANT: This field must be formatted as a valid GUID; otherwise, QuickBooks will
          return an error.'
        optional: true
      apply_to_transactions:
        type: array
        description: 'The bills to be paid by this bill credit card payment. This will create a link between
          this bill credit card payment and the specified bills. IMPORTANT: In each applyToTransactions
          object, you must specify either paymentAmount, applyCredits, discountAmount, or any combination
          of these; if none of these are specified, you will receive an error for an empty transaction.
          IMPORTANT: The target bill mu'
        items:
          type: object
    output:
      description: Returns the newly created bill credit card payment.
      type: object
