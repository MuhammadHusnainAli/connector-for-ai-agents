tools:
  create_agent:
    title: Create Agent Response
    description: Create Agent Response Generate a response for the provided input with optional web search
      and reasoning. Calls POST /v1/agent on the provider's API.
    category: agent
    request:
      method: POST
      path: /v1/agent
      body:
        input: ${input}
        background: ${background}
        instructions: ${instructions}
        language_preference: ${language_preference}
        max_output_tokens: ${max_output_tokens}
        max_steps: ${max_steps}
        model: ${model}
