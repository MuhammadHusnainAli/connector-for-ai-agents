          markdown: ${description}
          richText: true
        fields: ${fields}
        name: ${name}
        order: ${order}
        statusId: ${status_id}
    input:
      act_as_admin:
        type: boolean
        description: True to act in admin sudo mode for this request, with full permission
          on every workspace in the team.
        optional: true
      workspace_id:
        type: string
        description: Workspace id (UUID) holding the items.
      item_id:
        type: string
        description: Item id (UUID).
      archived:
        type: boolean
        description: True to archive the item.
        optional: true
      assignee_user_group_ids:
        type: array
        description: Ids of user groups to assign.
        optional: true
        items:
          type: string
      assignee_user_ids:
        type: array
        description: Ids of users to assign.
        optional: true
        items:
          type: string
      color:
        type: string
        description: Item colour.
        optional: true
      description:
        type: string
        description: Rich text as markdown; sent in Airfocus's {markdown, richText} envelope.
        optional: true
      fields:
        type: object
        description: Custom field values keyed by field id, each in that field type's value
          format.
        optional: true
      name:
        type: string
        description: Name (title) of this item.
        optional: true
      order:
        type: integer
        description: Sort position; appended at the end when omitted.
        optional: true
      status_id:
        type: string
        description: Status id; defaults to the workspace's first status.
        optional: true
    output:
      description: The updated item.
      type: object

  delete_item:
    title: Delete an item
    description: >-
      Delete an item permanently, with its comments and links. Archive it with patch_item
