connector_id: fiber-ai
display_name: Fiber AI
docs_url: https://api.fiber.ai/openapi.json
generated: true
generated_from: https://api.fiber.ai/openapi.json
tools:
  health_check:
    title: Health check
    description: Health check Health check endpoint to check if the server is running Calls GET /health
      on the provider's API.
    category: health
    request:
      method: GET
      path: /health
    input: {}
    output:
      description: Default Response
      type: object
