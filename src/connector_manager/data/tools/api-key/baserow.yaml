# Baserow tools, scoped to what a **database token** can actually do.
#
# Baserow has two credentials and they are not interchangeable. A JWT from a
# user login reaches the whole application -- workspaces, databases, views,
# field editing. A **database token**, which is what this connector holds,
# reaches the row endpoints of the tables it was granted, plus the field list
# and the token's own table list. Every tool here is one the token can call;
# creating tables, editing or deleting fields, and reading views need a JWT
# and are deliberately absent.
#
# Two things to get right before writing anything:
#
#   * **`user_field_names` decides the shape of every row.** Left off, Baserow
#     keys cells by internal id (`field_3418`); set to true, it keys them by
#     the field's actual name ("Notes"). Pass it consistently -- the same flag
#     governs both what you send and what comes back;
#   * **a token carries per-table permissions.** `list_tables` returns exactly
#     the tables it may touch, and create/update/delete are granted
#     separately, so a token that can read a table may still be refused a
#     write on it.
#
# Filtering is either the simple `filter__{field}__{filter}` form (via
# `filters` on the tool, e.g. {"filter__field_3418__contains": "urgent"}) or a
# JSON filter tree in `filter_tree`. `link_row_join` lets one call pull values
# from a linked table instead of a second round trip.
#
# The connection's base url already ends in `/api`, so paths start at
# `/database/...`. Baserow requires the trailing slash on every path.
#
# Docs: https://baserow.io/api-docs

connector_id: baserow
display_name: Baserow
docs_url: https://baserow.io/api-docs

tools:

  list_tables:
    title: List the tables this token can reach
    description: >-
      Read every table the database token has been granted, with its id, name
      and the database and workspace it belongs to. Start here: a token only
      works on the tables it was given, and this is the only way to learn which
      those are.
    category: schema
    read_only: true
    request:
      method: GET
      path: /database/tables/all-tables/
    input: {}
    output:
      description: The tables the token may use.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          name: {type: string}
          database_id: {type: integer}

  list_fields:
    title: List a table's fields
    description: >-
      Read a table's columns -- each field's id, name, type and settings. Read
      this before writing rows: it tells you the `field_<id>` keys, which
      single-select options exist, and which fields are read-only formulas.
    category: schema
    read_only: true
    request:
      method: GET
      path: /database/fields/table/${table_id}/
    input:
      table_id:
        type: integer
        description: The table's id, from list_tables.
    output:
      description: The table's fields.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          name: {type: string}
          type: {type: string}
          primary: {type: boolean}

  create_field:
    title: Add a field to a table
    description: >-
      Create a new column. `type` picks the field kind -- "text", "long_text",
      "number", "boolean", "date", "single_select", "link_row" and the rest --
      and each kind takes its own extra settings in `options`, e.g.
      {"number_decimal_places": 2} or {"select_options": [{"value": "High",
      "color": "red"}]}.
    category: schema
    request:
      method: POST
      path: /database/fields/table/${table_id}/
      body:
        name: "${name}"
        type: "${type}"
    input:
      table_id:
        type: integer
        description: The table's id.
      name:
        type: string
        description: The column's name.
        max_length: 255
      type:
        type: string
        description: The field type to create.
        enum: [text, long_text, url, email, number, rating, boolean, date, duration,
               link_row, file, single_select, multiple_select, phone_number, formula,
               count, rollup, lookup, multiple_collaborators, uuid, autonumber,
               last_modified, created_on, password]
    output:
      description: The created field, with the `field_<id>` key rows will use for it.
      type: object

  list_rows:
    title: List rows in a table
    description: >-
      Read a page of rows. `search` does a full-text match across the table,
      `filters` takes Baserow's `filter__{field}__{type}` parameters, and
      `view_id` applies a saved view's own filters and sorts. Set
      `user_field_names` to true to get cells keyed by field name rather than
      `field_<id>`.
    category: rows
    read_only: true
    request:
      method: GET
      path: /database/rows/table/${table_id}/
      query: "${query}"
    input:
      table_id:
        type: integer
        description: The table's id, from list_tables.
      query:
        type: object
        description: >-
          Query parameters as a flat object. Supported keys: `page`, `size`
          (rows per page, max 200), `search`, `order_by` (comma-separated field
          names or ids, prefix with `-` to descend), `include` and `exclude`
          (comma-separated fields), `view_id`, `user_field_names` (true to key
          cells by name), `filter_type` (AND or OR), `filters` (a JSON filter
          tree), and any `filter__{field}__{type}` pair such as
          {"filter__field_3418__contains": "urgent"}.
        properties:
          page: {type: integer, description: "Page number, starting at 1."}
          size: {type: integer, description: "Rows per page, up to 200."}
          search: {type: string}
          order_by: {type: string}
          user_field_names: {type: boolean}
    output:
      description: A page of rows, with the total count and next/previous links.
      type: object
      properties:
        count: {type: integer}
        next: {type: string}
        previous: {type: string}
        results: {type: array, description: "The rows, each with an id and its cells."}

  get_row:
    title: Get a row
    description: >-
      Read one row by id. `user_field_names` keys the cells by field name
      instead of `field_<id>`; `include=metadata` adds row comment counts and
      similar extras.
    category: rows
    read_only: true
    request:
      method: GET
      path: /database/rows/table/${table_id}/${row_id}/
      query:
        user_field_names: "${user_field_names}"
        include: "${include}"
    input:
      table_id:
        type: integer
        description: The table's id.
      row_id:
        type: integer
        description: The row's id.
      user_field_names:
        type: boolean
        description: Key cells by field name rather than internal `field_<id>`.
        optional: true
      include:
        type: string
        description: Extra data to include, e.g. "metadata".
        optional: true
    output:
      description: The row and its cells.
      type: object

  create_row:
    title: Create a row
    description: >-
      Add one row. `fields` holds the cell values -- keyed by field name when
      `user_field_names` is true, otherwise by `field_<id>` from list_fields.
      Omitted fields take their default. `before_id` inserts the row above an
      existing one instead of at the end.
    category: rows
    request:
      method: POST
      path: /database/rows/table/${table_id}/
      query:
        user_field_names: "${user_field_names}"
        before: "${before_id}"
        send_webhook_events: "${send_webhook_events}"
      body: "${fields}"
    input:
      table_id:
        type: integer
        description: The table's id.
      fields:
        type: object
        description: >-
          The row's cell values, e.g. {"Name": "Ada", "Notes": "hello"} with
          `user_field_names` true, or {"field_3418": "Ada"} without it.
      user_field_names:
        type: boolean
        description: Whether `fields` is keyed by field name rather than `field_<id>`.
        optional: true
      before_id:
        type: integer
        description: Insert the new row before this row id rather than at the end.
        optional: true
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this write. Defaults to true.
        optional: true
    output:
      description: The created row, including its new id.
      type: object

  update_row:
    title: Update a row
    description: >-
      Change cells on one row. This is a merge, not a replace: only the fields
      you send are touched, and sending null clears a cell. Keys follow
      `user_field_names` exactly as in create_row.
    category: rows
    request:
      method: PATCH
      path: /database/rows/table/${table_id}/${row_id}/
      query:
        user_field_names: "${user_field_names}"
        send_webhook_events: "${send_webhook_events}"
      body: "${fields}"
    input:
      table_id:
        type: integer
        description: The table's id.
      row_id:
        type: integer
        description: The row's id.
      fields:
        type: object
        description: The cells to change, keyed the same way as create_row's `fields`.
      user_field_names:
        type: boolean
        description: Whether `fields` is keyed by field name rather than `field_<id>`.
        optional: true
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this write.
        optional: true
    output:
      description: The updated row.
      type: object

  delete_row:
    title: Delete a row
    description: >-
      Delete one row. Baserow moves it to the trash, where it can be restored
      from the UI for a limited period -- but not through this API.
    category: rows
    destructive: true
    request:
      method: DELETE
      path: /database/rows/table/${table_id}/${row_id}/
      query:
        send_webhook_events: "${send_webhook_events}"
    input:
      table_id:
        type: integer
        description: The table's id.
      row_id:
        type: integer
        description: The row's id.
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this delete.
        optional: true
    output:
      description: Empty on success -- Baserow answers 204.
      type: object

  create_rows:
    title: Create many rows at once
    description: >-
      Insert up to 200 rows in one request. `rows` is a list of cell objects,
      each shaped exactly like create_row's `fields`. Far cheaper than a call
      per row, and atomic: a validation error on one row rejects the batch.
    category: rows
    request:
      method: POST
      path: /database/rows/table/${table_id}/batch/
      query:
        user_field_names: "${user_field_names}"
        before: "${before_id}"
        send_webhook_events: "${send_webhook_events}"
      body:
        items: "${rows}"
    input:
      table_id:
        type: integer
        description: The table's id.
      rows:
        type: array
        description: The rows to create, each an object of cell values (max 200).
        items: {type: object}
        max_length: 200
      user_field_names:
        type: boolean
        description: Whether the row objects are keyed by field name.
        optional: true
      before_id:
        type: integer
        description: Insert the rows before this row id.
        optional: true
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this write.
        optional: true
    output:
      description: The created rows, under `items`.
      type: object
      properties:
        items: {type: array}

  update_rows:
    title: Update many rows at once
    description: >-
      Change up to 200 rows in one request. Each entry must carry an `id`
      alongside the cells to change -- {"id": 42, "Notes": "done"} -- and, as
      with update_row, only the fields present are touched.
    category: rows
    request:
      method: PATCH
      path: /database/rows/table/${table_id}/batch/
      query:
        user_field_names: "${user_field_names}"
        send_webhook_events: "${send_webhook_events}"
      body:
        items: "${rows}"
    input:
      table_id:
        type: integer
        description: The table's id.
      rows:
        type: array
        description: The rows to update, each with an `id` plus the cells to change (max 200).
        items: {type: object}
        max_length: 200
      user_field_names:
        type: boolean
        description: Whether the cell keys are field names rather than `field_<id>`.
        optional: true
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this write.
        optional: true
    output:
      description: The updated rows, under `items`.
      type: object
      properties:
        items: {type: array}

  delete_rows:
    title: Delete many rows at once
    description: >-
      Delete up to 200 rows by id in one request. They go to the trash, from
      which only the Baserow UI can restore them.
    category: rows
    destructive: true
    request:
      method: POST
      path: /database/rows/table/${table_id}/batch-delete/
      query:
        send_webhook_events: "${send_webhook_events}"
      body:
        items: "${row_ids}"
    input:
      table_id:
        type: integer
        description: The table's id.
      row_ids:
        type: array
        description: Ids of the rows to delete (1-200).
        items: {type: integer}
        min_length: 1
        max_length: 200
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this delete.
        optional: true
    output:
      description: Empty on success.
      type: object

  move_row:
    title: Move a row
    description: >-
      Reorder a row within its table. `before_id` puts it immediately above
      that row; leaving it out moves the row to the very end.
    category: rows
    request:
      method: PATCH
      path: /database/rows/table/${table_id}/${row_id}/move/
      query:
        before_id: "${before_id}"
        user_field_names: "${user_field_names}"
        send_webhook_events: "${send_webhook_events}"
    input:
      table_id:
        type: integer
        description: The table's id.
      row_id:
        type: integer
        description: The row to move.
      before_id:
        type: integer
        description: Move the row above this row id. Omit to move it to the end.
        optional: true
      user_field_names:
        type: boolean
        description: Key the returned cells by field name.
        optional: true
      send_webhook_events:
        type: boolean
        description: Whether the table's webhooks fire for this change.
        optional: true
    output:
      description: The moved row.
      type: object

  get_row_names:
    title: Get the display names of specific rows
    description: >-
      Resolve row ids to their primary-field values in one call, e.g.
      {"table__42": "1,2,3"}. This is how you turn the ids inside a link-row
      cell into something a person can read without fetching each row.
    category: rows
    read_only: true
    request:
      method: GET
      path: /database/rows/names/
      query: "${tables}"
    input:
      tables:
        type: object
        description: >-
          One key per table, as `table__<table id>`, whose value is a
          comma-separated list of row ids -- e.g. {"table__42": "1,2,3"}.
    output:
      description: Row ids mapped to their primary-field values, grouped by table.
      type: object
