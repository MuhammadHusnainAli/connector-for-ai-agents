    input:
      page:
        type: integer
        description: The page to start paginating from. If `page` is not specified, the argument defaults to the first page.
        optional: true
      per_page:
        type: integer
        description: The number of rules to return per page. If `per_page` is not specified, the argument defaults to 100.
        optional: true
      sort:
        type: string
        description: 'String for sort order, composed of field and sort order separated by a colon, for example `name:asc`. Supported sort directions: `asc`, `desc`. Supported fields: `name`, `created_at`.'
        optional: true
      filters:
        type: string
        description: 'JSON-encoded filter object. Supported keys: * `text`: Free-text query matched against rule name, tags, and recipients. * `tags`: Array of strings. Return rules that have any of these tags. * `recipients`: Array of strings. Return rules that have any of...'
        optional: true
      include:
        type: string
        description: Comma-separated list of resource paths for related resources to include in the response. Supported resource path is `created_by`.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_monitor_notification_rule:
    title: Create a monitor notification rule
    description: >-
