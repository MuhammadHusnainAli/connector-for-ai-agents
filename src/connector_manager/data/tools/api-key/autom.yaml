# Autom search API tools.
#
# Every path, parameter and credit cost below comes from Autom's own published
# documentation, read from https://docs.autom.dev/llms-full.txt -- which carries
# the full API reference, including the endpoint table that lists all sixteen
# routes and what each costs.
#
# One thing to know about the host: Autom's current docs write the base as
# https://api.autom.dev/v1, while this connection is configured with
# https://autom.dev/api/v1. The route suffixes are identical either way, so the
# paths here start at /bing/search, /google/search and so on and follow whatever
# base the connection carries.
#
# Costs are worth watching, because every scrape is billed: the search
# endpoints cost one credit per call, while the three Finder lookups (countries,
# languages, locations) and the usage and stats endpoints are free. Call
# get_usage before a bulk run rather than after.
#
# Two parameter rules recur and are easy to trip over:
#   * location and uule are alternatives -- pass one or the other, never both.
#   * on Bing, mkt and cc are likewise mutually exclusive.
#
# Docs: https://docs.autom.dev/

connector_id: autom
display_name: Autom
docs_url: https://docs.autom.dev/

tools:
  google_search:
    title: Search Google
    description: >-
      Run a Google search and get structured SERP data back -- organic results,
      the knowledge panel, related questions and pagination. The query supports
      Google's own operators, so site: and inurl: work as they do in a browser.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/search
      query:
        query: "${query}"
        tbs: "${tbs}"
        location: "${location}"
        uule: "${uule}"
        gl: "${gl}"
        hl: "${hl}"
        page: "${page}"
        num: "${num}"
    input:
      query:
        type: string
        description: The search query, including any Google operators.
      tbs:
        type: string
        description: Advanced filter string, e.g. qdr:d for the last day.
        optional: true
      location:
        type: string
        description: Human-readable origin for the search, e.g. "Paris, France". Not with uule.
        optional: true
      uule:
        type: string
        description: Google-encoded location parameter. Not with location.
        optional: true
      gl:
        type: string
        description: Two-letter country code to search from, e.g. us or fr.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results, e.g. en or fr.
        optional: true
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      num:
        type: integer
        description: Results per page. Deprecated by Google and treated as a hint.
        optional: true
    output:
      description: Organic results with titles, links and snippets, plus pagination.
      type: object

  google_search_light:
    title: Search Google (light)
    description: >-
      The cheap, fast variant of the Google search endpoint -- organic results
      only, no knowledge panel or ads. Use it when all you need is links.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/search/light
      query:
        query: "${query}"
        gl: "${gl}"
        hl: "${hl}"
    input:
      query:
        type: string
        description: The search query, including any Google operators.
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
    output:
      description: Organic results only, with titles, links and snippets.
      type: object

  google_autocomplete:
    title: Get Google autocomplete suggestions
    description: >-
      Fetch the suggestions Google would offer as someone types a query, which
      is how keyword research tools harvest long-tail phrases.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/search/autocomplete
      query:
        query: "${query}"
        cp: "${cp}"
        gl: "${gl}"
        hl: "${hl}"
    input:
      query:
        type: string
        description: The partial query to complete.
      cp:
        type: integer
        description: Cursor position within the query to complete from.
        optional: true
      gl:
        type: string
        description: Two-letter country code for the suggestions.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the suggestions.
        optional: true
    output:
      description: The suggested completions for the query.
      type: object

  google_news_search:
    title: Search Google News
    description: >-
      Search Google News and get structured articles back, with source,
      publication time and link. Good for tracking coverage of a company or
      topic.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/news
      query:
        query: "${query}"
        page: "${page}"
        num: "${num}"
        gl: "${gl}"
        hl: "${hl}"
    input:
      query:
        type: string
        description: Keywords, company or topic to search for.
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      num:
        type: integer
        description: Results per page.
        optional: true
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
    output:
      description: News articles with titles, sources, dates and links.
      type: object

  google_images_search:
    title: Search Google Images
    description: >-
      Search Google Images and get image URLs, titles, source pages and
      dimensions. Set async to have Autom run the job in the background.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/images
      query:
        query: "${query}"
        page: "${page}"
        gl: "${gl}"
        hl: "${hl}"
        google_domains: "${google_domains}"
        async: "${async}"
    input:
      query:
        type: string
        description: What to search for, e.g. "modern house exterior".
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
      google_domains:
        type: string
        description: Google domain to query, e.g. google.com or google.fr.
        optional: true
      async:
        type: boolean
        description: True to queue the search as a job and fetch results later.
        optional: true
    output:
      description: Image results with URLs, titles, sources and dimensions.
      type: object

  google_videos_search:
    title: Search Google Videos
    description: >-
      Search Google Videos and get structured results with titles, channels,
      durations and links.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/videos
      query:
        query: "${query}"
        page: "${page}"
        num: "${num}"
        location: "${location}"
        uule: "${uule}"
        gl: "${gl}"
        hl: "${hl}"
    input:
      query:
        type: string
        description: What to search for on Google Videos.
      page:
        type: integer
        description: Page number, starting at 1.
        minimum: 1
      num:
        type: integer
        description: Results per page.
        optional: true
      location:
        type: string
        description: Human-readable origin for the search. Not with uule.
        optional: true
      uule:
        type: string
        description: Google-encoded location parameter. Not with location.
        optional: true
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
    output:
      description: Video results with titles, durations and links.
      type: object

  google_shopping_search:
    title: Search Google Shopping
    description: >-
      Search Google Shopping and get product listings with prices, ratings and
      merchants -- the endpoint price-monitoring jobs run on.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/shopping
      query:
        query: "${query}"
        page: "${page}"
        gl: "${gl}"
        hl: "${hl}"
        location: "${location}"
        uule: "${uule}"
    input:
      query:
        type: string
        description: Product name, brand or category to search for.
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
      location:
        type: string
        description: Location to localise prices, e.g. "New York, United States".
        optional: true
      uule:
        type: string
        description: Pre-encoded location parameter. Use location instead if you have none.
        optional: true
    output:
      description: Product listings with prices, ratings and merchant names.
      type: object

  google_maps_search:
    title: Search Google Maps
    description: >-
      Search Google Maps for places and get addresses, phone numbers, websites
      and ratings. ll centres the search on a point, which matters for local
      results.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/maps
      query:
        query: "${query}"
        page: "${page}"
        ll: "${ll}"
        gl: "${gl}"
        hl: "${hl}"
    input:
      query:
        type: string
        description: Business type, brand or place name to search for.
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      ll:
        type: string
        description: Map centre in Google's format, e.g. @43.5131985,1.4600501,60m.
        optional: true
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
    output:
      description: Place results with addresses, phones, websites and ratings.
      type: object

  google_jobs_search:
    title: Search Google Jobs
    description: >-
      Search Google Jobs and get structured listings with title, company and
      location. ltype=1 narrows to remote roles, and next_page_token pages
      through the rest.
    category: google
    read_only: true
    request:
      method: GET
      path: /google/jobs
      query:
        query: "${query}"
        uds: "${uds}"
        lrad: "${lrad}"
        ltype: "${ltype}"
        location: "${location}"
        uule: "${uule}"
        gl: "${gl}"
        hl: "${hl}"
        next_page_token: "${next_page_token}"
    input:
      query:
        type: string
        description: Job search query, e.g. "barista new york".
      uds:
        type: string
        description: Encoded filter chips string for advanced Google Jobs filters.
        optional: true
      lrad:
        type: number
        description: Search radius in kilometres, as a hint rather than a hard limit.
        optional: true
      ltype:
        type: number
        description: Set to 1 to return work-from-home roles only.
        optional: true
      location:
        type: string
        description: Human-readable origin for the search. Not with uule.
        optional: true
      uule:
        type: string
        description: Google-encoded location parameter. Not with location.
        optional: true
      gl:
        type: string
        description: Two-letter country code to search from.
        optional: true
      hl:
        type: string
        description: Two-letter language code for the results.
        optional: true
      next_page_token:
        type: string
        description: Token from the previous response's pagination block.
        optional: true
    output:
      description: Job listings with titles, companies, locations and links.
      type: object

  bing_search:
    title: Search Bing
    description: >-
      Run a Bing search and get organic results with title, link, snippet and
      position. mkt and cc both set the market, so pass one or the other.
    category: search
    read_only: true
    request:
      method: GET
      path: /bing/search
      query:
        query: "${query}"
        page: "${page}"
        num: "${num}"
        location: "${location}"
        lat: "${lat}"
        lon: "${lon}"
        mkt: "${mkt}"
        cc: "${cc}"
    input:
      query:
        type: string
        description: The search query to run on Bing.
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      num:
        type: integer
        description: Results per page; Bing treats this as a suggestion.
        optional: true
      location:
        type: string
        description: City or place the search should originate from.
        optional: true
      lat:
        type: number
        description: Latitude of the search origin.
        optional: true
      lon:
        type: number
        description: Longitude of the search origin.
        optional: true
      mkt:
        type: string
        description: Market code, e.g. en-US. Cannot be combined with cc.
        optional: true
      cc:
        type: string
        description: Two-letter country code. Cannot be combined with mkt.
        optional: true
    output:
      description: Organic Bing results with titles, links, snippets and positions.
      type: object

  brave_search:
    title: Search Brave
    description: >-
      Run a Brave Search query and get structured organic results with
      pagination -- a useful second opinion when Google and Bing disagree.
    category: search
    read_only: true
    request:
      method: GET
      path: /brave/search
      query:
        query: "${query}"
        page: "${page}"
    input:
      query:
        type: string
        description: The search query to run on Brave Search.
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
    output:
      description: Organic Brave results with titles, links and snippets.
      type: object

  find_google_locations:
    title: Find Google location ids
    description: >-
      Look up the locations Autom supports for geo-targeted searches, returning
      their ids and country codes. Free -- it costs no credits.
    category: finder
    read_only: true
    request:
      method: GET
      path: /finder/google-locations
      query:
        query: "${query}"
    input:
      query:
        type: string
        description: Text to match against supported city and country names.
    output:
      description: Matching locations with their ids and country codes.
      type: object

  find_google_countries:
    title: Find Google country codes
    description: >-
      Look up the country codes the gl parameter accepts, filtered by a search
      string. Free -- it costs no credits.
    category: finder
    read_only: true
    request:
      method: GET
      path: /finder/google-countries
      query:
        query: "${query}"
    input:
      query:
        type: string
        description: Text to match against country names or codes, case-insensitive.
    output:
      description: Matching countries with their two-letter codes.
      type: object

  find_google_languages:
    title: Find Google language codes
    description: >-
      Look up the language codes the hl parameter accepts, filtered by a search
      string. Free -- it costs no credits.
    category: finder
    read_only: true
    request:
      method: GET
      path: /finder/google-languages
      query:
        query: "${query}"
    input:
      query:
        type: string
        description: Text to match against language names or codes, case-insensitive.
    output:
      description: Matching languages with their codes.
      type: object

  get_usage:
    title: Get account usage and credits
    description: >-
      Read the remaining API quota, extra credits, rate limits and key details
      for the account. The subscription figure combines the plan allowance with
      any top-ups left. Free -- it costs no credits.
    category: account
    read_only: true
    request:
      method: GET
      path: /usage
    output:
      description: Remaining quota, credits, rate limits and API key details.
      type: object

  get_platform_stats:
    title: Get platform health stats
    description: >-
      Read Autom's own infrastructure health for one engine or path over the
      last hour -- the same snapshot for every caller, not your account's usage.
      Pass at least one of engine or path. Free, and enabled per account, so a
      403 means it is switched off for yours.
    category: account
    read_only: true
    request:
      method: GET
      path: /stats
      query:
        engine: "${engine}"
        path: "${path}"
    input:
      engine:
        type: string
        description: API family to check, e.g. google or linkedin.
        optional: true
      path:
        type: string
        description: Specific endpoint to check, e.g. /v1/google/search.
        optional: true
    output:
      description: The platform health snapshot for that engine or path.
      type: object
