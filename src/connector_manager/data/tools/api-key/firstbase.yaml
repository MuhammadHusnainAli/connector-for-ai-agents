    description: List people in the organization via SCIM Returns a paginated SCIM ListResponse of people
      in the caller's organization. Filter by email address or name using SCIM filter expressions. Maximum
      of 50 users per page. Calls GET /scim/v2/Users on Firstbase's API.
    category: scim
    request:
      method: GET
      path: /scim/v2/Users
      query:
        filter: ${filter}
        startIndex: ${start_index}
        count: ${count}
        attributes: ${attributes}
        excludedAttributes: ${excluded_attributes}
    input:
      filter:
        type: string
        description: 'Fetch user with a given name or email address using SCIM operators Examples: emails.value
          eq "test@email.com" name.givenName eq "James" and name.familyName eq "Bond"'
        optional: true
      start_index:
        type: integer
        description: The 1-based start index of the first user to be returned
        optional: true
      count:
        type: integer
        description: The number of users to be returned. A maximum of 50 users will be returned in a page.
        optional: true
      attributes:
        type: string
        description: Comma-separated SCIM defined attributes to be returned. Required attributes are always
          returned
        optional: true
      excluded_attributes:
        type: string
        description: Comma-separated SCIM defined attributes to be excluded. Required attributes cannot
          be excluded
        optional: true
    output:
      description: List of users
      type: object
    read_only: true
