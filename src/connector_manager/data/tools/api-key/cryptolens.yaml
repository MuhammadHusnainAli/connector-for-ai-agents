# Cryptolens tools -- software licensing, activation and usage analytics.
#
# Web API 3 is shaped unlike most REST APIs, and three of its habits explain
# nearly every surprise:
#
#   * **everything is a POST to /api/{area}/{Method}**, and parameters go
#     form-encoded, not as JSON. There are no path ids, no GETs and no verbs in
#     the HTTP sense -- the method name in the path is the verb. The read-only
#     tools below are POSTs that happen not to change anything;
#   * **`activate_key` is a write, and an expensive one.** It consumes a seat
#     against the key's machine limit and can start a trial. Using it to check
#     whether a key is valid is the classic way to exhaust a customer's
#     activations -- `get_key` is the read-only inspection;
#   * **the wire names are PascalCase.** Cryptolens documents `ProductId`,
#     `MachineCode`, `FieldsToReturn`; the tools below take the same fields as
#     `product_id`, `machine_code`, `fields_to_return` and put Cryptolens's
#     spelling on the wire, so a reader can follow the provider's reference
#     while the arguments stay consistent with every other pack here.
#
# The account's access token arrives as a header on this connection, so no tool
# takes a `token` argument. Note that Cryptolens tokens are scoped per method:
# a token minted for `GetKey` is refused by `CreateKey`, so a 401 from one tool
# does not mean the credential is dead.
#
# Data objects are the general-purpose storage attached to a key, a product or
# the account -- usually usage counters. Use the increment and decrement tools
# rather than the setters when several clients update the same counter: those
# are atomic, and a read-modify-write through the setter loses updates.
#
# Where a method's parameter list is long and version-dependent, the tool takes
# a flat `parameters` object instead of enumerating fields that Cryptolens
# documents per method. Those are sent form-encoded, so nested objects are not
# accepted.
#
# Docs: https://app.cryptolens.io/docs/api/v3

connector_id: cryptolens
display_name: Cryptolens
docs_url: https://app.cryptolens.io/docs/api/v3

tools:

  activate_key:
    title: Activate a license key
    description: >-
      Activate a license key for a device. Unlike a plain validation this is a
      write: it consumes a seat against the key's machine limit and can start
      a trial, so calling it to "just check" a key is the classic way to
      exhaust a customer's activations.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/Activate
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        MachineCode: "${machine_code}"
        FriendlyName: "${friendly_name}"
        Sign: "${sign}"
        SignMethod: "${sign_method}"
        FieldsToReturn: "${fields_to_return}"
        Metadata: "${metadata}"
        FloatingTimeInterval: "${floating_time_interval}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      machine_code:
        type: string
        description: A string identifying the device being activated. Omit for a key that is not device-locked.
        optional: true
      friendly_name:
        type: string
        description: A label for the activated device, e.g. the user's email. Does not count against the seat limit.
        optional: true
      sign:
        type: boolean
        description: Sign the returned license object so the client can verify it offline.
        optional: true
      sign_method:
        type: integer
        description: Which signature format to return.
        optional: true
      fields_to_return:
        type: integer
        description: Bitmask restricting which fields come back. 0 returns everything.
        optional: true
      metadata:
        type: boolean
        description: Include extra information such as the number of activated devices.
        optional: true
      floating_time_interval:
        type: integer
        description: Seconds. Greater than zero switches the key to floating licensing over that window.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  deactivate_key:
    title: Deactivate a license key
    description: >-
      Release a device's activation, freeing the seat it held. The counterpart
      to activate_key, and what an uninstall flow should call so the customer
      does not run out of activations.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/Deactivate
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        MachineCode: "${machine_code}"
        Floating: "${floating}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      machine_code:
        type: string
        description: The device to deactivate. Omit to deactivate the calling device.
        optional: true
      floating:
        type: boolean
        description: Deactivate a floating activation rather than a permanent one.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_key:
    title: Get a license key
    description: >-
      Read one license key's data -- its features, expiry, activated devices
      and customer. Read-only, unlike activate_key, so this is the right call
      for simply inspecting a key.
    category: keys
    read_only: true
    request:
      method: POST
      path: /api/key/GetKey
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        Sign: "${sign}"
        SignMethod: "${sign_method}"
        FieldsToReturn: "${fields_to_return}"
        Metadata: "${metadata}"
        FloatingTimeInterval: "${floating_time_interval}"
        ModelVersion: "${model_version}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      sign:
        type: boolean
        description: Sign the returned license object so a client can verify it offline.
        optional: true
      sign_method:
        type: integer
        description: Which signature format to return.
        optional: true
      fields_to_return:
        type: integer
        description: Bitmask restricting which fields come back. 0 returns everything.
        optional: true
      metadata:
        type: boolean
        description: Include extra information such as the number of activated devices.
        optional: true
      floating_time_interval:
        type: integer
        description: With Metadata set, return the number of active floating licenses over this window in seconds.
        optional: true
      model_version:
        type: integer
        description: Which response model version to return.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_keys:
    title: List a product's license keys
    description: >-
      Page through the license keys issued for one product. Only 99 come back
      per page, so `Page` has to be incremented; `SearchQuery` and `OrderBy`
      narrow and sort the result server-side.
    category: keys
    read_only: true
    request:
      method: POST
      path: /api/product/GetKeys
      body:
        ProductId: "${product_id}"
        Page: "${page}"
        OrderBy: "${order_by}"
        SearchQuery: "${search_query}"
        GlobalId: "${global_id}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      page:
        type: integer
        description: Which page to return. Only 99 keys come back per page.
        optional: true
        default: '1'
      order_by:
        type: string
        description: How to order the result, e.g. "ID ascending".
        optional: true
      search_query:
        type: string
        description: A filter expression restricting which keys are returned.
        optional: true
      global_id:
        type: integer
        description: Fetch one specific key by its global id, which is faster than searching.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  create_key:
    title: Create a license key
    description: >-
      Issue a new license key for a product, with its validity period, feature
      flags and limits. This is a real, billable license coming into existence
      -- and `NewCustomer` will create a customer record as a side effect.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/CreateKey
      body:
        ProductId: "${product_id}"
        Period: "${period}"
        F1: "${f1}"
        F2: "${f2}"
        F3: "${f3}"
        F4: "${f4}"
        F5: "${f5}"
        F6: "${f6}"
        F7: "${f7}"
        F8: "${f8}"
        Notes: "${notes}"
        Block: "${block}"
        CustomerId: "${customer_id}"
        NewCustomer: "${new_customer}"
        AddOrUseExistingCustomer: "${add_or_use_existing_customer}"
        TrialActivation: "${trial_activation}"
        MaxNoOfMachines: "${max_no_of_machines}"
        AllowedMachines: "${allowed_machines}"
        ResellerId: "${reseller_id}"
        NoOfKeys: "${no_of_keys}"
        Name: "${name}"
        Email: "${email}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      period:
        type: integer
        description: How many days from today the key is valid for. 0 means it does not expire.
        optional: true
      f1:
        type: boolean
        description: Feature flag 1.
        optional: true
      f2:
        type: boolean
        description: Feature flag 2.
        optional: true
      f3:
        type: boolean
        description: Feature flag 3.
        optional: true
      f4:
        type: boolean
        description: Feature flag 4.
        optional: true
      f5:
        type: boolean
        description: Feature flag 5.
        optional: true
      f6:
        type: boolean
        description: Feature flag 6.
        optional: true
      f7:
        type: boolean
        description: Feature flag 7.
        optional: true
      f8:
        type: boolean
        description: Feature flag 8.
        optional: true
      notes:
        type: string
        description: Internal notes on the key, up to 500 characters.
        optional: true
      block:
        type: boolean
        description: Create the key already blocked, so it cannot be activated yet.
        optional: true
      customer_id:
        type: integer
        description: An existing customer to attach the key to.
        optional: true
      new_customer:
        type: boolean
        description: Create a customer record for this key as a side effect.
        optional: true
      add_or_use_existing_customer:
        type: boolean
        description: Reuse a matching customer rather than creating a duplicate.
        optional: true
      trial_activation:
        type: boolean
        description: Mark the key as a trial activation.
        optional: true
      max_no_of_machines:
        type: integer
        description: How many devices may activate this key at once.
        optional: true
      allowed_machines:
        type: string
        description: A newline-separated allow-list of machine codes.
        optional: true
      reseller_id:
        type: integer
        description: The reseller the key is sold through.
        optional: true
      no_of_keys:
        type: integer
        description: How many keys to create. Above 1 the response is a list.
        optional: true
      name:
        type: string
        description: A name for the customer, when creating one alongside the key.
        optional: true
      email:
        type: string
        description: An email for the customer, when creating one alongside the key.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  create_trial_key:
    title: Create a trial key
    description: >-
      Issue a time-limited trial key bound to a machine code. The intended way
      to hand out trials from an application, since it enforces one trial per
      device rather than trusting the client.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/CreateTrialKey
      body:
        ProductId: "${product_id}"
        MachineCode: "${machine_code}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      machine_code:
        type: string
        description: The device the trial is bound to.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  create_key_from_template:
    title: Create a key from a license template
    description: >-
      Issue a key using a saved license template, so its period, features and
      limits come from the template rather than from this call. Keeps issuing
      consistent when several systems create keys.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/CreateKeyFromTemplate
      body:
        ProductId: "${product_id}"
        LicenseTemplateId: "${license_template_id}"
        CustomerId: "${customer_id}"
        NewCustomer: "${new_customer}"
        NoOfKeys: "${no_of_keys}"
        Name: "${name}"
        Email: "${email}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      license_template_id:
        type: integer
        description: The template to issue from, from list_license_templates.
      customer_id:
        type: integer
        description: An existing customer to attach the key to.
        optional: true
      new_customer:
        type: boolean
        description: Create a customer record for this key as a side effect.
        optional: true
      no_of_keys:
        type: integer
        description: How many keys to create.
        optional: true
      name:
        type: string
        description: A name for the customer, when creating one alongside the key.
        optional: true
      email:
        type: string
        description: An email for the customer, when creating one alongside the key.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  extend_license:
    title: Extend a license
    description: >-
      Push a key's expiry date out by a number of days. What a renewal calls;
      the extension is relative to the current expiry, not to today.
    category: keys
    request:
      method: POST
      path: /api/key/ExtendLicense
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        NoOfDays: "${no_of_days}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      no_of_days:
        type: integer
        description: How many days to add to the key's expiry.
    output:
      description: The provider's response to the call.
      type: object

  add_feature:
    title: Turn on a feature flag
    description: >-
      Set one of a key's eight feature flags. This changes what the customer's
      software will unlock at its next activation.
    category: keys
    request:
      method: POST
      path: /api/key/AddFeature
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        Feature: "${feature}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      feature:
        type: integer
        description: Which feature flag to set, 1 through 8.
    output:
      description: The provider's response to the call.
      type: object

  remove_feature:
    title: Turn off a feature flag
    description: >-
      Clear one of a key's eight feature flags, removing whatever the
      customer's software gates behind it.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/RemoveFeature
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        Feature: "${feature}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      feature:
        type: integer
        description: Which feature flag to clear, 1 through 8.
    output:
      description: The provider's response to the call.
      type: object

  block_key:
    title: Block a license key
    description: >-
      Block a key so it can no longer be activated. The standard response to a
      refund or a leaked key -- reversible with unblock_key, unlike deleting
      it.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/BlockKey
      body:
        ProductId: "${product_id}"
        Key: "${key}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
    output:
      description: The provider's response to the call.
      type: object

  unblock_key:
    title: Unblock a license key
    description: >-
      Lift a block so the key can be activated again, undoing block_key.
    category: keys
    request:
      method: POST
      path: /api/key/UnblockKey
      body:
        ProductId: "${product_id}"
        Key: "${key}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
    output:
      description: The provider's response to the call.
      type: object

  change_key_customer:
    title: Reassign a key to a customer
    description: >-
      Attach a key to a different customer record, or detach it entirely. The
      fix for a licence issued against the wrong account.
    category: keys
    request:
      method: POST
      path: /api/key/ChangeCustomer
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        CustomerId: "${customer_id}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      customer_id:
        type: integer
        description: The customer to attach the key to. 0 detaches it from any customer.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  change_key_notes:
    title: Change a key's notes
    description: >-
      Replace the internal notes stored against a key. Notes are for your own
      record-keeping and are not visible to the licensed software.
    category: keys
    request:
      method: POST
      path: /api/key/ChangeNotes
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        Notes: "${notes}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      notes:
        type: string
        description: The replacement notes, up to 500 characters.
    output:
      description: The provider's response to the call.
      type: object

  change_key_reseller:
    title: Reassign a key to a reseller
    description: >-
      Move a key to a different reseller, or detach it from one. Changes who
      the sale is attributed to in reseller reporting.
    category: keys
    request:
      method: POST
      path: /api/key/ChangeReseller
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        ResellerId: "${reseller_id}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      reseller_id:
        type: integer
        description: The reseller to attach the key to. 0 detaches it.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  set_machine_lock_limit:
    title: Set a key's machine limit
    description: >-
      Change how many devices may hold an activation of one key at once.
      Lowering it below the current count does not deactivate anyone; it stops
      the next device activating.
    category: keys
    request:
      method: POST
      path: /api/key/MachineLockLimit
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        NumberOfMachines: "${number_of_machines}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      number_of_machines:
        type: integer
        description: How many devices may hold an activation at once.
    output:
      description: The provider's response to the call.
      type: object

  record_trial_activation:
    title: Record a trial activation
    description: >-
      Mark a key as trial-activated for a device, which is how trial abuse
      across reinstalls is detected.
    category: keys
    destructive: true
    request:
      method: POST
      path: /api/key/TrialActivation
      body:
        ProductId: "${product_id}"
        Key: "${key}"
        MachineCode: "${machine_code}"
      encoding: form
    input:
      product_id:
        type: integer
        description: The product id the key belongs to.
      key:
        type: string
        description: The serial key string.
      machine_code:
        type: string
        description: The device the trial is being activated on.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_products:
    title: List products
    description: >-
      Every product on the account, with its id and settings. The product id
      is required by nearly every key method, so this is usually the first
      call.
    category: products
    read_only: true
    request:
      method: POST
      path: /api/product/GetProducts
      encoding: form
    output:
      description: The provider's response to the call.
      type: object

  get_license_templates:
    title: List license templates
    description: >-
      The saved license templates on the account. Their ids are what
      create_key_from_template takes, and they are how issuing stays
      consistent across systems.
    category: products
    read_only: true
    request:
      method: POST
      path: /api/licensetemplate/GetLicenseTemplates
      encoding: form
    output:
      description: The provider's response to the call.
      type: object

  add_customer:
    title: Add a customer
    description: >-
      Create a customer record that keys can be attached to.
      `EnableCustomerAssociation` turns on the customer portal, which sends
      the person a login -- so this can reach a real inbox.
    category: customers
    request:
      method: POST
      path: /api/customer/AddCustomer
      body:
        Name: "${name}"
        Email: "${email}"
        CompanyName: "${company_name}"
        EnableCustomerAssociation: "${enable_customer_association}"
        AllowActivationManagement: "${allow_activation_management}"
        AllowMultipleUserAssociation: "${allow_multiple_user_association}"
      encoding: form
    input:
      name:
        type: string
        description: The customer's name.
        optional: true
      email:
        type: string
        description: The customer's email address.
        optional: true
      company_name:
        type: string
        description: The customer's company.
        optional: true
      enable_customer_association:
        type: boolean
        description: Enable the customer portal for this person, which emails them a login.
        optional: true
      allow_activation_management:
        type: boolean
        description: Let the customer manage their own device activations in the portal.
        optional: true
      allow_multiple_user_association:
        type: boolean
        description: Allow more than one user account against this customer.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  edit_customer:
    title: Edit a customer
    description: >-
      Change a customer's name, email or company, and their portal
      permissions. Their keys stay attached throughout.
    category: customers
    request:
      method: POST
      path: /api/customer/EditCustomer
      body:
        CustomerId: "${customer_id}"
        Name: "${name}"
        Email: "${email}"
        CompanyName: "${company_name}"
        EnableCustomerAssociation: "${enable_customer_association}"
        AllowActivationManagement: "${allow_activation_management}"
      encoding: form
    input:
      customer_id:
        type: integer
        description: The customer to edit.
      name:
        type: string
        description: The customer's name.
        optional: true
      email:
        type: string
        description: The customer's email address.
        optional: true
      company_name:
        type: string
        description: The customer's company.
        optional: true
      enable_customer_association:
        type: boolean
        description: Enable the customer portal for this person.
        optional: true
      allow_activation_management:
        type: boolean
        description: Let the customer manage their own device activations.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  remove_customer:
    title: Remove a customer
    description: >-
      Delete a customer record. Their license keys survive but are left
      without a customer, so the link between a licence and the person who
      bought it is lost.
    category: customers
    destructive: true
    request:
      method: POST
      path: /api/customer/RemoveCustomer
      body:
        CustomerId: "${customer_id}"
      encoding: form
    input:
      customer_id:
        type: integer
        description: The customer to remove.
    output:
      description: The provider's response to the call.
      type: object

  get_customers:
    title: List customers
    description: >-
      Every customer on the account, with their contact details and portal
      settings.
    category: customers
    read_only: true
    request:
      method: POST
      path: /api/customer/GetCustomers
      encoding: form
    output:
      description: The provider's response to the call.
      type: object

  get_customer_licenses:
    title: List a customer's licenses
    description: >-
      Every key attached to one customer. The direct answer to "what has this
      person bought", without paging the whole product's keys.
    category: customers
    read_only: true
    request:
      method: POST
      path: /api/customer/GetCustomerLicenses
      body:
        CustomerId: "${customer_id}"
        Detailed: "${detailed}"
      encoding: form
    input:
      customer_id:
        type: integer
        description: The customer whose keys to list.
      detailed:
        type: boolean
        description: Return the full license objects rather than a summary.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  add_data_object:
    title: Add a data object
    description: >-
      Attach a named string or integer value to a key, a product or the whole
      account. Data objects are Cryptolens's general-purpose storage --
      typically usage counters or per-customer settings the licensed software
      reads.
    category: data-objects
    request:
      method: POST
      path: /api/data/AddDataObject
      body:
        Name: "${name}"
        StringValue: "${string_value}"
        IntValue: "${int_value}"
        ReferencerType: "${referencer_type}"
        ReferencerId: "${referencer_id}"
        CheckForDuplicates: "${check_for_duplicates}"
      encoding: form
    input:
      name:
        type: string
        description: A name for the data object, up to 10 characters.
      string_value:
        type: string
        description: The string value to store, up to 100 characters.
        optional: true
      int_value:
        type: integer
        description: The integer value to store.
        optional: true
      referencer_type:
        type: integer
        description: What the object hangs off -- 0 for the account, 1 for a product, 2 for a key.
        optional: true
      referencer_id:
        type: integer
        description: The id of the product or key it hangs off.
        optional: true
      check_for_duplicates:
        type: boolean
        description: Refuse to create a second object with the same name.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  list_data_objects:
    title: List data objects
    description: >-
      The data objects attached to a key, a product or the account, optionally
      filtered by name or value. How the licensed software reads back a
      counter it has been incrementing.
    category: data-objects
    read_only: true
    request:
      method: POST
      path: /api/data/ListDataObjects
      body:
        ReferencerType: "${referencer_type}"
        ReferencerId: "${referencer_id}"
        Contains: "${contains}"
        ShowAll: "${show_all}"
      encoding: form
    input:
      referencer_type:
        type: integer
        description: What to read from -- 0 for the account, 1 for a product, 2 for a key.
        optional: true
      referencer_id:
        type: integer
        description: The id of the product or key.
        optional: true
      contains:
        type: string
        description: Only objects whose name contains this text.
        optional: true
      show_all:
        type: boolean
        description: Include objects from every referencer rather than one.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  remove_data_object:
    title: Remove a data object
    description: >-
      Delete a data object permanently. Whatever the licensed software was
      reading from it disappears, so a counter reset this way starts from
      nothing.
    category: data-objects
    destructive: true
    request:
      method: POST
      path: /api/data/RemoveDataObject
      body:
        Id: "${id}"
      encoding: form
    input:
      id:
        type: integer
        description: The data object's id, from list_data_objects.
    output:
      description: The provider's response to the call.
      type: object

  set_data_object_int_value:
    title: Set a data object's integer value
    description: >-
      Overwrite a data object's integer value. Use the increment or decrement
      tools instead when several clients may be updating the same counter --
      this one races.
    category: data-objects
    request:
      method: POST
      path: /api/data/SetIntValue
      body:
        Id: "${id}"
        IntValue: "${int_value}"
      encoding: form
    input:
      id:
        type: integer
        description: The data object's id.
      int_value:
        type: integer
        description: The value to set.
    output:
      description: The provider's response to the call.
      type: object

  set_data_object_string_value:
    title: Set a data object's string value
    description: >-
      Overwrite a data object's string value, up to 100 characters.
    category: data-objects
    request:
      method: POST
      path: /api/data/SetStringValue
      body:
        Id: "${id}"
        StringValue: "${string_value}"
      encoding: form
    input:
      id:
        type: integer
        description: The data object's id.
      string_value:
        type: string
        description: The value to set.
    output:
      description: The provider's response to the call.
      type: object

  increment_data_object_value:
    title: Increment a data object
    description: >-
      Add to a data object's integer value atomically, with an optional
      ceiling. This is the safe way to count usage from many clients --
      read-modify-write through the setter loses updates.
    category: data-objects
    request:
      method: POST
      path: /api/data/IncrementIntValue
      body:
        Id: "${id}"
        IntValue: "${int_value}"
        EnableBound: "${enable_bound}"
        Bound: "${bound}"
      encoding: form
    input:
      id:
        type: integer
        description: The data object's id.
      int_value:
        type: integer
        description: How much to add.
      enable_bound:
        type: boolean
        description: Refuse the increment if it would pass the bound.
        optional: true
      bound:
        type: integer
        description: The ceiling the value may not pass.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  decrement_data_object_value:
    title: Decrement a data object
    description: >-
      Subtract from a data object's integer value atomically, with an optional
      floor. The counterpart to the increment tool, for consuming a quota.
    category: data-objects
    request:
      method: POST
      path: /api/data/DecrementIntValue
      body:
        Id: "${id}"
        IntValue: "${int_value}"
        EnableBound: "${enable_bound}"
        Bound: "${bound}"
      encoding: form
    input:
      id:
        type: integer
        description: The data object's id.
      int_value:
        type: integer
        description: How much to subtract.
      enable_bound:
        type: boolean
        description: Refuse the decrement if it would pass the bound.
        optional: true
      bound:
        type: integer
        description: The floor the value may not pass.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  upload_data_object_values:
    title: Upload data object values in bulk
    description: >-
      Set many data object values in one call rather than one request each.
      What a client that has been buffering usage offline should flush
      through.
    category: data-objects
    request:
      method: POST
      path: /api/data/UploadValues
      body:
        parameters: "${parameters}"
      encoding: form
    input:
      parameters:
        type: object
        description: The method's parameters as a flat object of name/value pairs, exactly as Cryptolens's reference for this method documents them. They are sent form-encoded, so nested objects are not accepted.
    output:
      description: The provider's response to the call.
