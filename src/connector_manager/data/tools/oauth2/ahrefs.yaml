        where: ${where}
        tags_filter: ${tags_filter}
        limit: ${limit}
        date: ${date}
        search_volume_type: ${search_volume_type}
        country: ${country}
        order_by: ${order_by}
        report_id: ${report_id}
        prompts: ${prompts}
        data_source: ${data_source}
        market: ${market}
        competitors: ${competitors}
        brands: ${brands}
    input:
      changes:
        type: object
        description: Requires date_compared. Keeps only the prompts that changed in one of
          the ways selected here. The three columns are OR'd with each other, as are the values
          within each column, so an omitted or empty column adds nothing to the filter and
          an entirely empty object keeps every prompt.
        optional: true
      date_compared:
        type: string
        description: A date to compare date with, in YYYY-MM-DD format. Must be strictly earlier
          than date. When set, the report covers every prompt answered on either date and
