      method: GET
      path: /v1/dashboard/${dashboard_id}
    input:
      dashboard_id:
        type: string
        description: The dashboard id, from list_dashboards.
    output:
      description: The requested record.
      type: object

  create_dashboard:
    title: Create a new dashboard
    description: >-
      Create a dashboard from a full widget definition. The widget JSON is
      large and version-specific -- copying an existing dashboard with
      get_dashboard and editing it is far more reliable than writing one from
      scratch.
    category: dashboards
    request:
      method: POST
      path: /v1/dashboard
