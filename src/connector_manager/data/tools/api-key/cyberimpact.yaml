# Cyberimpact tools -- Canadian-compliant email marketing.
#
# The connection's base url is the whole host, so paths here start at /members,
# /groups, /mailings and friends. Two things shape this API more than anything
# else:
#
#   * **consent is a first-class record, not a flag.** Cyberimpact is built
#     around Canada's anti-spam law, so `opt_in_member` (which runs the
#     confirmation flow and records the consent) is a different operation from
#     `create_member` (which just stores a row). Likewise `unsubscribe_member`
#     is a standing instruction and `delete_member` is not -- a deleted member
#     could be re-added and mailed again, an unsubscribed one should not be.
#     The `get_member_consent` / `set_member_consent` pair is the audit trail;
#   * **a member is keyed by email.** Per-member paths take `{key}`, which is
#     the address or the id Cyberimpact assigned. There is no separate lookup
#     step for the common case.
#
# Three smaller things worth knowing:
#
#   * **PUT replaces, PATCH merges**, and the difference bites hardest on
#     `replace_member_groups` -- a partial list silently unsubscribes the member
#     from every group it omits;
#   * **`updatedOnFrom` is the incremental-sync filter.** The joined-on filters
#     miss edits, so a mirror built on those alone goes stale;
#   * **batch imports are asynchronous.** `create_batch` returns a batch id;
#     poll `get_batch` with `showErrorDetails` to turn a failure count into the
#     per-row reasons.
#
# Docs: https://api.cyberimpact.com/docs

connector_id: cyberimpact
display_name: Cyberimpact
docs_url: https://api.cyberimpact.com/docs

tools:

  ping:
    title: Ping the API
    description: >-
      Confirm the API token works. The cheapest possible call, and the first
      thing to try when everything else returns 401.
    category: connection
    read_only: true
    request:
      method: GET
      path: /ping
    output:
      description: The requested record.
      type: object

  list_members:
    title: List members
    description: >-
      Page through the account's members, optionally filtered by subscription
      status and by when they joined or were last changed. The updated-on
      filters are what an incremental sync should use.
    category: members
    read_only: true
    request:
      method: GET
      path: /members
      query:
        page: "${page}"
        limit: "${limit}"
        status: "${status}"
        sort: "${sort}"
        joinedOnFrom: "${joined_on_from}"
        joinedOnTo: "${joined_on_to}"
        updatedOnFrom: "${updated_on_from}"
        updatedOnTo: "${updated_on_to}"
    input:
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      status:
        type: string
        description: Filter by subscription status.
        optional: true
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
      joined_on_from:
        type: string
        description: Only members who joined on or after this date.
        optional: true
      joined_on_to:
        type: string
        description: Only members who joined on or before this date.
        optional: true
      updated_on_from:
        type: string
        description: Only members changed on or after this date -- use this for incremental sync.
        optional: true
      updated_on_to:
        type: string
        description: Only members changed on or before this date.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_member:
    title: Add a member
    description: >-
      Add a member to the account. Note what this does not do: it records the
      person, it does not obtain consent. Under Canadian anti-spam law that
      distinction matters -- opt_in_member is the tool that runs the
      confirmation flow.
    category: members
    request:
      method: POST
      path: /members
      body:
        email: "${email}"
        gender: "${gender}"
        firstname: "${firstname}"
        lastname: "${lastname}"
        company: "${company}"
        language: "${language}"
        birthdate: "${birthdate}"
        postalCode: "${postal_code}"
        country: "${country}"
        note: "${note}"
        customFields: "${custom_fields}"
    input:
      email:
        type: string
        description: The member's email address. The natural key -- Cyberimpact matches on it.
        example: person@example.com
      gender:
        type: string
        description: The member's gender, where the account records one.
        optional: true
      firstname:
        type: string
        description: The member's first name.
        optional: true
      lastname:
        type: string
        description: The member's last name.
        optional: true
      company:
        type: string
        description: The member's company.
        optional: true
      language:
        type: string
        description: The member's language, which decides which localised mailing they receive.
        optional: true
      birthdate:
        type: string
        description: The member's birth date, YYYY-MM-DD.
        optional: true
      postal_code:
        type: string
        description: The member's postal code.
        optional: true
      country:
        type: string
        description: The member's country.
        optional: true
      note:
        type: string
        description: An internal note on the member.
        optional: true
      custom_fields:
        type: object
        description: Values for the account's custom fields, keyed by field name. list_custom_fields is the authoritative list of names.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  get_member:
    title: Get a member
    description: >-
      One member's record, with their custom field values and current
      subscription status.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/${key}
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
    output:
      description: The requested record.
      type: object

  replace_member:
    title: Replace a member
    description: >-
      Replace a member's record wholesale. Any field omitted from the payload
      is cleared, which is the difference from edit_member -- use that one for
      a partial change.
    category: members
    request:
      method: PUT
      path: /members/${key}
      body:
        email: "${email}"
        gender: "${gender}"
        firstname: "${firstname}"
        lastname: "${lastname}"
        company: "${company}"
        language: "${language}"
        birthdate: "${birthdate}"
        postalCode: "${postal_code}"
        country: "${country}"
        note: "${note}"
        customFields: "${custom_fields}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      email:
        type: string
        description: The member's email address. The natural key -- Cyberimpact matches on it.
        example: person@example.com
      gender:
        type: string
        description: The member's gender, where the account records one.
        optional: true
      firstname:
        type: string
        description: The member's first name.
        optional: true
      lastname:
        type: string
        description: The member's last name.
        optional: true
      company:
        type: string
        description: The member's company.
        optional: true
      language:
        type: string
        description: The member's language, which decides which localised mailing they receive.
        optional: true
      birthdate:
        type: string
        description: The member's birth date, YYYY-MM-DD.
        optional: true
      postal_code:
        type: string
        description: The member's postal code.
        optional: true
      country:
        type: string
        description: The member's country.
        optional: true
      note:
        type: string
        description: An internal note on the member.
        optional: true
      custom_fields:
        type: object
        description: Values for the account's custom fields, keyed by field name. list_custom_fields is the authoritative list of names.
        optional: true
    output:
      description: The record after the update.
      type: object

  edit_member:
    title: Edit a member
    description: >-
      Change some of a member's fields, leaving the rest as they are. The safe
      counterpart to replace_member for a partial update.
    category: members
    request:
      method: PATCH
      path: /members/${key}
      body: "${attributes}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      attributes:
        type: object
        description: The member fields to change -- any subset of email, names, company, language, birthdate, postalCode, country, note and customFields.
    output:
      description: The record after the update.
      type: object

  delete_member:
    title: Delete a member
    description: >-
      Delete a member outright. This is not the same as unsubscribing: a
      deleted member could be re-added and mailed again, whereas an
      unsubscribe is a standing instruction. Prefer unsubscribe_member for
      someone who asked to stop.
    category: members
    destructive: true
    request:
      method: DELETE
      path: /members/${key}
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
    output:
      description: Confirmation that the record was deleted.
      type: object

  opt_in_member:
    title: Opt a member in
    description: >-
      Add a member and run Cyberimpact's consent flow, sending the
      confirmation the account is configured for and recording the consent
      that anti-spam law requires. This, not create_member, is how a new
      subscriber should normally arrive.
    category: members
    request:
      method: POST
      path: /members/optins
      body:
        email: "${email}"
        groups: "${groups}"
        gender: "${gender}"
        firstname: "${firstname}"
        lastname: "${lastname}"
        company: "${company}"
        language: "${language}"
        birthdate: "${birthdate}"
        postalCode: "${postal_code}"
        country: "${country}"
        note: "${note}"
        optinConfirmUrl: "${optin_confirm_url}"
        customFields: "${custom_fields}"
    input:
      email:
        type: string
        description: The member's email address.
        example: person@example.com
      groups:
        type: array
        description: The groups to subscribe them to. Required -- an opt-in is always to something.
        items: {type: integer}
      gender:
        type: string
        description: The member's gender, where the account records one.
        optional: true
      firstname:
        type: string
        description: The member's first name.
        optional: true
      lastname:
        type: string
        description: The member's last name.
        optional: true
      company:
        type: string
        description: The member's company.
        optional: true
      language:
        type: string
        description: The member's language.
        optional: true
      birthdate:
        type: string
        description: The member's birth date, YYYY-MM-DD.
        optional: true
      postal_code:
        type: string
        description: The member's postal code.
        optional: true
      country:
        type: string
        description: The member's country.
        optional: true
      note:
        type: string
        description: An internal note on the member.
        optional: true
      optin_confirm_url:
        type: string
        description: Where to send the member after they confirm.
        optional: true
      custom_fields:
        type: object
        description: Values for the account's custom fields, keyed by field name.
        optional: true
    output:
      description: The provider's response to the call.
      type: object

  list_bounced_members:
    title: List bounced members
    description: >-
      Members whose address has bounced, with when it happened. Worth polling
      -- a bouncing address quietly degrades the account's sending reputation
      until it is dealt with.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/bounced
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
        bouncedOnFrom: "${bounced_on_from}"
        bouncedOnTo: "${bounced_on_to}"
        updatedOnFrom: "${updated_on_from}"
        updatedOnTo: "${updated_on_to}"
    input:
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
      bounced_on_from:
        type: string
        description: Only bounces on or after this date.
        optional: true
      bounced_on_to:
        type: string
        description: Only bounces on or before this date.
        optional: true
      updated_on_from:
        type: string
        description: Only records changed on or after this date.
        optional: true
      updated_on_to:
        type: string
        description: Only records changed on or before this date.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_unsubscribed_members:
    title: List unsubscribed members
    description: >-
      Members who have unsubscribed, with when they did. The suppression list
      -- anything syncing addresses into Cyberimpact should check it before
      re-adding someone.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/unsubscribed
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
        unsubscribedOnFrom: "${unsubscribed_on_from}"
        unsubscribedOnTo: "${unsubscribed_on_to}"
        updatedOnFrom: "${updated_on_from}"
        updatedOnTo: "${updated_on_to}"
    input:
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
      unsubscribed_on_from:
        type: string
        description: Only unsubscribes on or after this date.
        optional: true
      unsubscribed_on_to:
        type: string
        description: Only unsubscribes on or before this date.
        optional: true
      updated_on_from:
        type: string
        description: Only records changed on or after this date.
        optional: true
      updated_on_to:
        type: string
        description: Only records changed on or before this date.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_unsubscribed_member:
    title: Get an unsubscribed member
    description: >-
      Check whether one specific address is on the unsubscribe list, and when
      it was added. The direct answer to "may we mail this person".
    category: members
    read_only: true
    request:
      method: GET
      path: /members/unsubscribed/${email}
    input:
      email:
        type: string
        description: The member's email address.
    output:
      description: The requested record.
      type: object

  unsubscribe_member:
    title: Unsubscribe a member
    description: >-
      Record that an address has unsubscribed, so Cyberimpact stops mailing
      it. This is a standing instruction and the right response to an opt-out
      request -- deleting the member is not.
    category: members
    request:
      method: POST
      path: /members/unsubscribed/${email}
    input:
      email:
        type: string
        description: The member's email address.
    output:
      description: The provider's response to the call.
      type: object

  list_member_groups:
    title: List a member's groups
    description: >-
      Which groups one member belongs to. Groups are what mailings are
      addressed to, so this is what says which mailings a person will receive.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/${key}/groups
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  add_member_groups:
    title: Add a member to groups
    description: >-
      Add a member to one or more groups, leaving their existing memberships
      in place.
    category: members
    request:
      method: POST
      path: /members/${key}/groups
      body:
        groups: "${groups}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      groups:
        type: array
        description: The group ids to add the member to.
        items: {type: integer}
    output:
      description: The provider's response to the call.
      type: object

  replace_member_groups:
    title: Replace a member's groups
    description: >-
      Set a member's group memberships wholesale. Any group not in the payload
      is removed, so a partial list quietly unsubscribes them from everything
      else.
    category: members
    request:
      method: PUT
      path: /members/${key}/groups
      body:
        groups: "${groups}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      groups:
        type: array
        description: The complete list of group ids the member should belong to.
        items: {type: integer}
    output:
      description: The record after the update.
      type: object

  remove_member_from_group:
    title: Remove a member from a group
    description: >-
      Take one member out of one group. They keep their other memberships and
      stay on the account.
    category: members
    destructive: true
    request:
      method: DELETE
      path: /members/${key}/groups/${group_id}
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      group_id:
        type: integer
        description: The group id, from list_groups.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_member_mailings:
    title: List a member's received mailings
    description: >-
      The mailings one member has been sent, newest first. The per-person view
      of send history, for answering a support question about what someone
      received.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/${key}/mailings
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_member_consent:
    title: Get a member's consent
    description: >-
      The consent recorded for one member -- its type, its source and when it
      was obtained. The record that has to stand up if the account's
      compliance is ever questioned.
    category: members
    read_only: true
    request:
      method: GET
      path: /members/${key}/consent
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
    output:
      description: The requested record.
      type: object

  set_member_consent:
    title: Set a member's consent
    description: >-
      Record consent for a member, for example after collecting it on a paper
      form or in another system. What is written here is what the account will
      rely on later, so it should reflect something that actually happened.
    category: members
    request:
      method: PUT
      path: /members/${key}/consent
      body: "${attributes}"
    input:
      key:
        type: string
        description: The member's key -- their email address, or the id Cyberimpact assigned them.
      attributes:
        type: object
        description: The consent to record, as the reference documents -- its type, source and date.
    output:
      description: The record after the update.
      type: object

  list_custom_fields:
    title: List the account's custom fields
    description: >-
      The custom fields defined on the account. The authoritative list of the
      names `customFields` accepts -- an unknown key is rejected rather than
      stored.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /customfields
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_groups:
    title: List groups
    description: >-
      The account's groups. A group is what a mailing is addressed to, and the
      group id is what the member and mailing tools take.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
    input:
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_group:
    title: Create a group
    description: >-
      Create a group members can be subscribed to and mailings addressed to.
    category: groups
    request:
      method: POST
      path: /groups
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The group to create, e.g. its name and description.
    output:
      description: The provider's response to the call.
      type: object

  get_group:
    title: Get a group
    description: >-
      One group's name, description and member count.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups/${id}
    input:
      id:
        type: integer
        description: The record id.
    output:
      description: The requested record.
      type: object

  replace_group:
    title: Replace a group
    description: >-
      Replace a group's definition wholesale. Fields omitted from the payload
      are cleared; edit_group is the partial-update counterpart.
    category: groups
    request:
      method: PUT
      path: /groups/${id}
      body: "${attributes}"
    input:
      id:
        type: integer
        description: The record id.
      attributes:
        type: object
        description: The full replacement group definition.
    output:
      description: The record after the update.
      type: object

  edit_group:
    title: Edit a group
    description: >-
      Change some of a group's fields, leaving the rest alone. Membership is
      unaffected either way.
    category: groups
    request:
      method: PATCH
      path: /groups/${id}
      body: "${attributes}"
    input:
      id:
        type: integer
        description: The record id.
      attributes:
        type: object
        description: The group fields to change.
    output:
      description: The record after the update.
      type: object

  delete_group:
    title: Delete a group
    description: >-
      Delete a group. Its members stay on the account but lose that
      subscription, so any mailing addressed to the group has nowhere to go.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /groups/${id}
    input:
      id:
        type: integer
        description: The record id.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_group_members:
    title: List a group's members
    description: >-
      The members of one group, with the same joined-on and updated-on filters
      the account-wide member listing takes.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups/${id}/members
      query:
        page: "${page}"
        limit: "${limit}"
        sort: "${sort}"
        joinedOnFrom: "${joined_on_from}"
        joinedOnTo: "${joined_on_to}"
        updatedOnFrom: "${updated_on_from}"
        updatedOnTo: "${updated_on_to}"
    input:
      id:
        type: integer
        description: The record id.
      page:
        type: integer
        description: Which page of results to return.
        optional: true
        default: '1'
      limit:
        type: integer
        description: How many records per page.
        optional: true
        default: '50'
      sort:
        type: string
        description: Field to sort by, prefixed with `-` for descending.
        optional: true
      joined_on_from:
        type: string
        description: Only members who joined the group on or after this date.
        optional: true
      joined_on_to:
        type: string
        description: Only members who joined the group on or before this date.
        optional: true
      updated_on_from:
        type: string
        description: Only records changed on or after this date.
        optional: true
      updated_on_to:
        type: string
        description: Only records changed on or before this date.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  remove_all_group_members:
    title: Remove every member from a group
    description: >-
      Empty a group in one call. The members remain on the account, but every
      one of them loses this subscription at once -- there is no undo and no
      per-member confirmation.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /groups/${id}/members
    input:
      id:
        type: integer
        description: The record id.
    output:
      description: Confirmation that the record was deleted.
