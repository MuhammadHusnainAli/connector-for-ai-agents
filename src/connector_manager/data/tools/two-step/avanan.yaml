          created_by_email: "${created_by_email}"
          is_exclusive: "${is_exclusive}"
          comment: "${comment}"
    input:
      exception_type:
        type: string
        description: Kind of exception being created.
      exception_str:
        type: string
        description: The URL to allow.
      exception_payload:
        type: object
        description: Extra conditions on the rule.
        optional: true
      entity_type:
        type: string
        description: Entity the rule is scoped to, e.g. user.
        optional: true
      entity_id:
        type: string
        description: Id of that entity.
        optional: true
      created_by_email:
        type: string
        description: Who to record as the rule's author.
        optional: true
      is_exclusive:
        type: boolean
        description: True to apply the rule only to the named entity.
