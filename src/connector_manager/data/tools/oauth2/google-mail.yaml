        addLabelIds: ${add_label_ids}
        removeLabelIds: ${remove_label_ids}
    input:
      id:
        type: string
        description: The ID of the thread to modify.
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      add_label_ids:
        type: array
        items:
          type: string
        description: A list of IDs of labels to add to this thread. You can add up to 100 labels with
          each update.
