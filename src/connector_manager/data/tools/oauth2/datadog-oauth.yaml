  list_events:
    title: Get a list of events
    description: >-
      List endpoint returns events that match an events search query. [Results
      are paginated similarly to
      logs](https://docs.datadoghq.com/logs/guide/collect-multiple-logs-with-pagination).
      Use this endpoint to see your latest events.
    category: events
    read_only: true
    request:
      method: GET
      path: /v2/events
      query:
        filter[query]: "${filter_query_}"
        filter[from]: "${filter_from_}"
        filter[to]: "${filter_to_}"
        sort: "${sort}"
        page[cursor]: "${page_cursor_}"
        page[limit]: "${page_limit_}"
    input:
      filter_query_:
        type: string
        description: Search query following events syntax.
        optional: true
      filter_from_:
        type: string
        description: Minimum timestamp for requested events, in milliseconds.
        optional: true
      filter_to_:
        type: string
        description: Maximum timestamp for requested events, in milliseconds.
        optional: true
      sort:
        type: string
        description: Order of events in results.
        optional: true
      page_cursor_:
        type: string
        description: List following results with a cursor provided in the previous query.
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of events in the response.
        optional: true
        default: '10'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  search_events:
    title: Search events
    description: >-
      Search the event stream with a POST body, supporting the full filter and
      paging options. Use this to correlate a metric anomaly with what changed
      around it.
    category: events
    request:
      method: POST
      path: /v2/events/search
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  get_event:
    title: Get an event
    description: >-
      Get the details of an event by `event_id`. Datadog's reference documents
      the exact parameters and payload this call takes.
    category: events
    read_only: true
    request:
      method: GET
      path: /v2/events/${event_id}
    input:
      event_id:
        type: string
        description: The event id.
    output:
      description: The requested record.
      type: object

  create_event:
    title: Post an event
    description: >-
      Post an event to the event stream -- a deploy, a config change, an
      incident note. Events are what a dashboard overlays on a graph to
      explain a step change, and they can trigger monitors.
    category: events
    request:
      method: POST
      path: /v2/events
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  submit_service_check:
    title: Submit a Service Check
    description: >-
      Submit a service check result -- OK, warning, critical or unknown.
      Monitors of type `service check` alert on these, so this is how a custom
      health signal reaches Datadog's alerting.
    category: events
    request:
      method: POST
      path: /v1/check_run
      body: "${attributes}"
    input:
      attributes:
