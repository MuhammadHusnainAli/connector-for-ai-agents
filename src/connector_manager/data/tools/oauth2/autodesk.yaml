    request:
      method: POST
      path: /construction/issues/v1/projects/${project_id}/issues/${issue_id}/comments
      headers:
        x-ads-region: "${region}"
      body:
        body: "${body}"
    input:
      project_id:
        type: string
        description: ACC project id.
      issue_id:
        type: string
        description: Issue id to comment on.
      body:
        type: string
        description: Text of the comment.
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The created comment.
      type: object

  list_issue_types:
    title: List issue types
    description: >-
      List a project's issue categories, and with include=subtypes the types
