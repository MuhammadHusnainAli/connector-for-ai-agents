  check_compatibility_property:
    title: Check compatibility property
    description: This compatibility method lists dimensions and metrics that can be added to a report
      request and maintain compatibility. This method fails if the request's dimensions and metrics are
      incompatible. In Google Analytics, reports fail if they request incompatible dimensions and/or metrics;
      in that case, you will need to remove dimensions and/or metrics from the incompatible report until
      the report is compatible. The Real
    category: properties
    request:
      method: POST
      path: /v1beta/${property}:checkCompatibility
      base_url_override: https://analyticsdata.googleapis.com
      body:
        dimensions: ${dimensions}
        dimensionFilter: ${dimension_filter}
        metricFilter: ${metric_filter}
        compatibilityFilter: ${compatibility_filter}
        metrics: ${metrics}
    input:
      property:
        type: string
        description: 'A Google Analytics property identifier whose events are tracked. To learn more,
          see where to find your Property ID. property should be the same value as in your runReport request.
          Example: properties/1234'
      dimensions:
        type: array
        items:
          type: string
        description: The dimensions in this report. dimensions should be the same value as in your runReport
          request.
        optional: true
      dimension_filter:
        type: string
        description: The filter clause of dimensions. dimensionFilter should be the same value as in your
          runReport request.
        optional: true
      metric_filter:
        type: string
        description: The filter clause of metrics. metricFilter should be the same value as in your runReport
          request
        optional: true
      compatibility_filter:
        type: string
        description: 'Filters the dimensions and metrics in the response to just this compatibility. Commonly
          used as ”compatibilityFilter”: “COMPATIBLE” to only return compatible dimensions & metrics.'
        optional: true
        enum:
        - COMPATIBILITY_UNSPECIFIED
        - COMPATIBLE
        - INCOMPATIBLE
      metrics:
        type: array
        items:
          type: string
        description: The metrics in this report. metrics should be the same value as in your runReport
          request.
        optional: true
    output:
      description: The CheckCompatibilityResponse resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
