        - STRIDE_LENGTH_TYPE_DEFAULT
        - STRIDE_LENGTH_TYPE_MANUAL
        - STRIDE_LENGTH_TYPE_AUTO
      language_locale:
        type: string
        description: Optional. The locale defined in the user's account settings. Updates to this field
