  get_usage_summary:
    title: Get usage across your account
    description: >-
      Usage summarised across the organisation by product and month. Where a
      bill investigation starts, before drilling into a specific product's
      usage.
    category: usage
    read_only: true
    request:
      method: GET
      path: /v1/usage/summary
      query:
        start_month: "${start_month}"
        end_month: "${end_month}"
        include_org_details: "${include_org_details}"
        include_connected_accounts: "${include_connected_accounts}"
    input:
      start_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for usage beginning in this month. Maximum of 15 months ago.'
      end_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for usage ending this month.'
        optional: true
      include_org_details:
        type: boolean
        description: Include usage summaries for each sub-org.
        optional: true
      include_connected_accounts:
        type: boolean
        description: Boolean to specify whether to include accounts connected to the current account as partner customers in the Datadog partner network program. Defaults to `false`.
        optional: true
        default: 'False'
    output:
      description: The requested record.
      type: object

  get_billable_usage_summary:
    title: Get billable usage across your account
    description: >-
      Get billable usage across your account. This endpoint is only accessible
