# Avanan (Check Point Harmony Email & Collaboration) Smart API tools.
#
# Every path, method and body field below comes from Check Point's own Avanan
# API Reference Guide, published as a PDF at
# https://sc1.checkpoint.com/documents/Avanan_API_Reference/CP_Avanan_API_Reference_Guide.pdf
# (28 August 2026 revision).
#
# The connection supplies all five signed headers -- x-av-token, x-av-app-id,
# x-av-date, x-av-req-id and the x-av-sig signature computed over the request
# path -- so no tool here declares them. Its base url is the regional
# smart-api-production host, and paths start at /v1.0.
#
# Two things shape how the API is used:
#
#   * Scoping. Most calls take a scope (or scopes) naming the region and
#     customer, e.g. "us:customername". list_scopes returns what this
#     credential may address; omit the scope on a single-tenant portal.
#   * Asynchronous actions. Quarantining an email or dismissing an event
#     returns a task id rather than a result -- poll get_task_status until it
#     reports the action finished.
#
# Searches page with scrollId rather than offsets: send the scrollId from the
# previous response to continue, and stop when fewer records come back than the
# total the envelope reports.
#
# Deliberately left out: the anti-malware, URL-reputation and DLP exception
# *deletions*. The guide documents them as POST requests to exactly the same
# paths as the corresponding create calls, with nothing in the request that
# distinguishes the two, so a "delete" tool built from it could just as easily
# create an exception. The reads and creates for those security tools are here;
# do the deletions in the portal. Anti-phishing, spam and click-time protection
# exceptions have unambiguous delete routes and are covered in full.
#
# Docs: https://sc1.checkpoint.com/documents/Avanan_API_Reference/CP_Avanan_API_Reference_Guide.pdf

connector_id: avanan
display_name: Avanan
docs_url: https://sc1.checkpoint.com/documents/Avanan_API_Reference/CP_Avanan_API_Reference_Guide.pdf

tools:
  list_scopes:
    title: List the credential's scopes
    description: >-
      List the scopes this application may address -- the region and customer
      combinations, e.g. "us:customername". Every scoped call takes one of
      these, so start here on a multi-tenant portal.
    category: meta
    read_only: true
    request:
      method: GET
      path: /v1.0/scopes
    output:
      description: The scopes available to the credential.
      type: object

  get_entity:
    title: Get a secured entity
    description: >-
      Read one secured entity by its Avanan id -- an email, a file, a chat
      message -- with the SaaS metadata and security verdicts attached to it.
    category: entities
    read_only: true
    request:
      method: GET
      path: /v1.0/search/entity/${entity_id}
    input:
      entity_id:
        type: string
        description: Avanan entity id, e.g. f05b74da3ee859eea41aeac40aaad3c2.
    output:
      description: The entity with its SaaS attributes and verdicts.
      type: object

  search_entities:
    title: Search secured entities
    description: >-
      Query the entities Avanan protects. entityFilter picks the SaaS and
      entity type with a date window -- office365_emails and
      office365_emails_email, say -- and entityExtendedFilter adds attribute
      conditions such as senderAddress or subject. Page with scrollId.
    category: entities
    request:
      method: POST
      path: /v1.0/search/query
      body:
        requestData:
          scopes: "${scopes}"
          entityFilter: "${entity_filter}"
          entityExtendedFilter: "${entity_extended_filter}"
          scrollId: "${scroll_id}"
    input:
      entity_filter:
        type: object
        description: SaaS, saasEntity, startDate and endDate bounding the search.
      scopes:
        type: array
        description: Scopes to search within, e.g. ["us:customername"].
        optional: true
        items: {type: string}
      entity_extended_filter:
        type: array
        description: Attribute conditions, each saasAttrName, saasAttrOp and saasAttrValue.
        optional: true
        items: {type: object}
      scroll_id:
        type: string
        description: scrollId from the previous response, to fetch the next page.
        optional: true
    output:
      description: Matching entities with a responseEnvelope carrying counts and scrollId.
      type: object

  act_on_entities:
    title: Act on secured entities
    description: >-
      Run one action across a set of entities -- quarantine or restore an email
      and the like. One action per call; the response carries a task id to poll
      with get_task_status.
    category: entities
    request:
      method: POST
      path: /v1.0/action/entity
      body:
        requestData:
          scope: "${scope}"
          entityIds: "${entity_ids}"
          entityActionName: "${entity_action_name}"
          entityActionParam: "${entity_action_param}"
    input:
      entity_ids:
        type: array
        description: Avanan entity ids to act on.
        items: {type: string}
      entity_action_name:
        type: array
        description: The single action to run, e.g. ["quarantine"] or ["restore"].
        items: {type: string}
      scope:
        type: string
        description: Scope the entities live in, e.g. "us:customername".
        optional: true
      entity_action_param:
        type: array
        description: Parameters for the action; send [""] when it takes none.
        optional: true
        items: {type: string}
    output:
      description: The queued task, with the id to poll.
      type: object

  get_event:
    title: Get a security event
    description: >-
      Read one security event by id, with its type, severity, state,
      confidence indicator and the entity it concerns.
    category: events
    read_only: true
    request:
      method: GET
      path: /v1.0/event/${event_id}
    input:
      event_id:
        type: string
        description: Avanan event id, e.g. ebb3e4bc8a9b14d7a529bb54ea6991b6.
    output:
      description: The security event record.
      type: object

  search_events:
    title: Search security events
    description: >-
      Query security events by type, state, severity, SaaS, confidence or date
      window -- the endpoint a SIEM pull runs on. Page with scrollId.
    category: events
    request:
      method: POST
      path: /v1.0/event/query
      body:
        requestData:
          scopes: "${scopes}"
          eventTypes: "${event_types}"
          eventStates: "${event_states}"
          severities: "${severities}"
          saas: "${saas}"
          eventIds: "${event_ids}"
          confidenceIndicator: "${confidence_indicator}"
          startDate: "${start_date}"
          endDate: "${end_date}"
          description: "${description}"
          scrollId: "${scroll_id}"
    input:
      start_date:
        type: string
        description: Start of the window, as an ISO 8601 timestamp.
        optional: true
      end_date:
        type: string
        description: End of the window, as an ISO 8601 timestamp.
        optional: true
      scopes:
        type: array
        description: Scopes to search within, e.g. ["us:customername"].
        optional: true
        items: {type: string}
      event_types:
        type: array
        description: Event types to include.
        optional: true
        items: {type: string}
      event_states:
        type: array
        description: Event states to include, e.g. new, remediated or dismissed.
        optional: true
        items: {type: string}
      severities:
        type: array
        description: Severities to include.
        optional: true
        items: {type: string}
      saas:
        type: array
        description: SaaS applications to include, e.g. ["office365_emails"].
        optional: true
        items: {type: string}
      event_ids:
        type: array
        description: Specific event ids to fetch.
        optional: true
        items: {type: string}
      confidence_indicator:
        type: string
        description: Confidence level to filter on.
        optional: true
      description:
        type: string
        description: Text to match against the event description.
        optional: true
      scroll_id:
        type: string
        description: scrollId from the previous response, to fetch the next page.
        optional: true
    output:
      description: Matching events with a responseEnvelope carrying counts and scrollId.
      type: object

  act_on_events:
    title: Act on security events
    description: >-
      Run one action across a set of security events -- dismiss them, say. One
      action per call, and the response carries a task id to poll.
    category: events
    request:
      method: POST
      path: /v1.0/action/event
      body:
        requestData:
          scope: "${scope}"
          eventIds: "${event_ids}"
          eventActionName: "${event_action_name}"
          eventActionParam: "${event_action_param}"
    input:
      event_ids:
        type: array
        description: Event ids to act on.
        items: {type: string}
      event_action_name:
        type: array
        description: The single action to run, e.g. ["dismiss"].
        items: {type: string}
      scope:
        type: string
        description: Scope the events live in, e.g. "us:customername".
        optional: true
      event_action_param:
        type: array
        description: Parameters for the action; send [""] when it takes none.
        optional: true
        items: {type: string}
    output:
      description: The queued task, with the id to poll.
      type: object

  get_task_status:
    title: Get an action's status
    description: >-
      Poll the task an entity or event action returned, to see whether the
      quarantine or dismissal actually completed.
    category: meta
    read_only: true
    request:
      method: GET
      path: /v1.0/task/${task_id}
    input:
      task_id:
        type: string
        description: Task id from an action response.
    output:
      description: The task's state and per-entity results.
      type: object

  download_entity:
    title: Download an entity
    description: >-
      Fetch a secured entity's own content -- the raw message or file. Set
      original to true for the untouched original rather than Avanan's
      processed copy.
    category: entities
    read_only: true
    request:
      method: GET
      path: /v1.0/download/entity/${entity_id}
      query:
        original: "${original}"
    input:
      entity_id:
        type: string
        description: Avanan entity id to download.
      original:
        type: boolean
        description: True for the original file, false for the processed copy.
        optional: true
    output:
      description: The entity's content, as message/rfc822 or the file's own type.
      type: object

  list_exceptions:
    title: List exceptions of a type
    description: >-
      List the anti-phishing allow or block rules of one type. exc_type is
      Whitelist, Blacklist or Spam_Whitelist, and the rules come back with
      their matching conditions and comments.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/exceptions/${exc_type}
    input:
      exc_type:
        type: string
        description: Which exception list to read.
        enum: [Whitelist, Blacklist, Spam_Whitelist]
    output:
      description: The exception rules in that list.
      type: object

  get_exception:
    title: Get an exception
    description: >-
      Read one exception rule by id from a given list, with its sender,
      recipient and subject matching rules.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/exceptions/${exc_type}/${exception_id}
    input:
      exc_type:
        type: string
        description: Which exception list the rule is in.
        enum: [Whitelist, Blacklist, Spam_Whitelist]
      exception_id:
        type: string
        description: Exception rule id.
    output:
      description: The exception rule.
      type: object

  create_exception:
    title: Create an exception
    description: >-
      Add an allow or block rule. The matching fields pair with their own
      *Matching mode -- senderEmail with senderEmailMatching set to "contains"
      or "equals" -- and actionNeeded says which verdict the rule overrides.
    category: exceptions
    request:
      method: POST
      path: /v1.0/exceptions/${exc_type}
      body:
        requestData:
          entityId: "${entity_id}"
          subject: "${subject}"
          subjectMatching: "${subject_matching}"
          senderEmail: "${sender_email}"
          senderEmailMatching: "${sender_email_matching}"
          senderName: "${sender_name}"
          senderDomain: "${sender_domain}"
          senderDomainMatching: "${sender_domain_matching}"
          senderIp: "${sender_ip}"
          senderClientIp: "${sender_client_ip}"
          recipient: "${recipient}"
          linkDomains: "${link_domains}"
          linkDomainMatching: "${link_domain_matching}"
          attachmentMd5: "${attachment_md5}"
          actionNeeded: "${action_needed}"
          comment: "${comment}"
    input:
      exc_type:
        type: string
        description: Which exception list to add the rule to.
        enum: [Whitelist, Blacklist, Spam_Whitelist]
      entity_id:
        type: string
        description: Entity the rule is derived from, when creating it from an email.
        optional: true
      subject:
        type: string
        description: Subject text the rule matches on.
        optional: true
      subject_matching:
        type: string
        description: How subject is matched, e.g. contains or equals.
        optional: true
      sender_email:
        type: string
        description: Sender address the rule matches on.
        optional: true
      sender_email_matching:
        type: string
        description: How senderEmail is matched.
        optional: true
      sender_name:
        type: string
        description: Sender display name the rule matches on.
        optional: true
      sender_domain:
        type: string
        description: Sender domain the rule matches on.
        optional: true
      sender_domain_matching:
        type: string
        description: How senderDomain is matched.
        optional: true
      sender_ip:
        type: string
        description: Sending IP address the rule matches on.
        optional: true
      sender_client_ip:
        type: string
        description: Originating client IP the rule matches on.
        optional: true
      recipient:
        type: string
        description: Recipient address the rule applies to.
        optional: true
      link_domains:
        type: string
        description: Link domain in the body the rule matches on.
        optional: true
      link_domain_matching:
        type: string
        description: How linkDomains is matched.
        optional: true
      attachment_md5:
        type: string
        description: MD5 of an attachment the rule matches on.
        optional: true
      action_needed:
        type: string
        description: Verdict the rule overrides, e.g. phishing or spam.
        optional: true
      comment:
        type: string
        description: Note recorded with the rule.
        optional: true
    output:
      description: A response envelope reporting whether the rule was created.
      type: object

  update_exception:
    title: Update an exception
    description: >-
      Replace an existing rule's matching conditions. The body takes the same
      fields as create_exception.
    category: exceptions
    request:
      method: PUT
      path: /v1.0/exceptions/${exc_type}/${exception_id}
      body:
        requestData:
          subject: "${subject}"
          subjectMatching: "${subject_matching}"
          senderEmail: "${sender_email}"
          senderEmailMatching: "${sender_email_matching}"
          senderName: "${sender_name}"
          senderDomain: "${sender_domain}"
          senderDomainMatching: "${sender_domain_matching}"
          senderIp: "${sender_ip}"
          recipient: "${recipient}"
          linkDomains: "${link_domains}"
          linkDomainMatching: "${link_domain_matching}"
          attachmentMd5: "${attachment_md5}"
          actionNeeded: "${action_needed}"
          comment: "${comment}"
    input:
      exc_type:
        type: string
        description: Which exception list the rule is in.
        enum: [Whitelist, Blacklist, Spam_Whitelist]
      exception_id:
        type: string
        description: Exception rule id to update.
      subject:
        type: string
        description: Subject text the rule matches on.
        optional: true
      subject_matching:
        type: string
        description: How subject is matched.
        optional: true
      sender_email:
        type: string
        description: Sender address the rule matches on.
        optional: true
      sender_email_matching:
        type: string
        description: How senderEmail is matched.
        optional: true
      sender_name:
        type: string
        description: Sender display name the rule matches on.
        optional: true
      sender_domain:
        type: string
        description: Sender domain the rule matches on.
        optional: true
      sender_domain_matching:
        type: string
        description: How senderDomain is matched.
        optional: true
      sender_ip:
        type: string
        description: Sending IP address the rule matches on.
        optional: true
      recipient:
        type: string
        description: Recipient address the rule applies to.
        optional: true
      link_domains:
        type: string
        description: Link domain in the body the rule matches on.
        optional: true
      link_domain_matching:
        type: string
        description: How linkDomains is matched.
        optional: true
      attachment_md5:
        type: string
        description: MD5 of an attachment the rule matches on.
        optional: true
      action_needed:
        type: string
        description: Verdict the rule overrides.
        optional: true
      comment:
        type: string
        description: Note recorded with the rule.
        optional: true
    output:
      description: A response envelope reporting whether the rule was updated.
      type: object

  delete_exception:
    title: Delete an exception
    description: >-
      Remove one allow or block rule. Avanan spells this as a POST to the
      list's delete route rather than an HTTP DELETE.
    category: exceptions
    destructive: true
    request:
      method: POST
      path: /v1.0/exceptions/${exc_type}/delete/${exception_id}
    input:
      exc_type:
        type: string
        description: Which exception list the rule is in.
        enum: [Whitelist, Blacklist, Spam_Whitelist]
      exception_id:
        type: string
        description: Exception rule id to delete.
    output:
      description: A response envelope reporting whether the rule was deleted.
      type: object

  list_anomaly_exceptions:
    title: List anomaly exceptions
    description: >-
      List the exceptions configured on the anomaly detection engine, the rules
      that stop a known-good pattern being flagged.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectools/anomaly/exceptions
    output:
      description: The anomaly engine's exception rules.
      type: object

  create_anomaly_exception:
    title: Create an anomaly exception
    description: >-
      Add an exception to the anomaly detection engine so a pattern stops being
      reported. requestData carries the rule's conditions.
    category: exceptions
    request:
      method: POST
      path: /v1.0/sectools/anomaly/exceptions
      body:
        requestData: "${request_data}"
    input:
      request_data:
        type: object
        description: The exception rule's fields, as documented for the anomaly engine.
    output:
      description: A response envelope reporting whether the rule was created.
      type: object

  list_click_time_exceptions:
    title: List click-time protection exceptions
    description: >-
      List the URL exceptions on click-time protection -- the links Avanan
      leaves unrewritten.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectools/click_time_protection/exceptions
    output:
      description: The click-time protection exception rules.
      type: object

  get_click_time_exception:
    title: Get a click-time protection exception
    description: >-
      Read one click-time protection exception rule by id.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectools/click_time_protection/exceptions/${exception_id}
    input:
      exception_id:
        type: string
        description: Exception rule id.
    output:
      description: The exception rule.
      type: object

  list_click_time_exception_items:
    title: List click-time protection exception items
    description: >-
      List the individual URL entries inside the click-time protection
      exceptions, which is the level most edits happen at.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectools/click_time_protection/exceptions/items
    output:
      description: The exception items with their URLs and conditions.
      type: object

  get_click_time_exception_item:
    title: Get a click-time protection exception item
    description: >-
      Read one click-time protection exception item by id, with the URL it
      exempts.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectools/click_time_protection/exceptions/items/${item_id}
    input:
      item_id:
        type: string
        description: Exception item id.
    output:
      description: The exception item.
      type: object

  create_click_time_exception_item:
    title: Add a click-time protection exception item
    description: >-
      Exempt a URL from click-time rewriting. requestData carries the URL and
      the conditions it applies under.
    category: exceptions
    request:
      method: POST
      path: /v1.0/sectools/click_time_protection/exceptions/items
      body:
        requestData: "${request_data}"
    input:
      request_data:
        type: object
        description: The item's URL, condition and comment.
    output:
      description: A response envelope reporting whether the item was added.
      type: object

  update_click_time_exception_items:
    title: Replace the click-time protection exception items
    description: >-
      Replace the whole set of click-time exception items in one call, so send
      every entry you want kept.
    category: exceptions
    request:
      method: PUT
      path: /v1.0/sectools/click_time_protection/exceptions/items
      body:
        requestData: "${request_data}"
    input:
      request_data:
        type: object
        description: The complete replacement set of exception items.
    output:
      description: A response envelope reporting whether the items were replaced.
      type: object

  update_click_time_exception_item:
    title: Update a click-time protection exception item
    description: >-
      Change one click-time exception item -- its URL, condition or comment --
      leaving the rest of the set alone.
    category: exceptions
    request:
      method: PUT
      path: /v1.0/sectools/click_time_protection/exceptions/items/${item_id}
      body:
        requestData: "${request_data}"
    input:
      item_id:
        type: string
        description: Exception item id to update.
      request_data:
        type: object
        description: The item's new URL, condition or comment.
    output:
      description: A response envelope reporting whether the item was updated.
      type: object

  delete_click_time_exception_item:
    title: Delete a click-time protection exception item
    description: >-
      Remove one URL exemption, so click-time protection rewrites that link
      again. Avanan spells this as a POST to the item's own route.
    category: exceptions
    destructive: true
    request:
      method: POST
      path: /v1.0/sectools/click_time_protection/exceptions/items/${item_id}
    input:
      item_id:
        type: string
        description: Exception item id to delete.
    output:
      description: A response envelope reporting whether the item was deleted.
      type: object

  list_malware_exceptions:
    title: List anti-malware hash exceptions
    description: >-
      List the file hashes exempted from anti-malware scanning.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectool-exceptions/checkpoint2/exceptions/hash
    output:
      description: The anti-malware hash exceptions.
      type: object

  get_malware_exception:
    title: Get an anti-malware hash exception
    description: >-
      Read the anti-malware exception for one file hash, with the comment and
      scope recorded on it.
    category: exceptions
    read_only: true
    request:
      method: GET
      path: /v1.0/sectool-exceptions/checkpoint2/exceptions/hash/${hash}
    input:
      hash:
        type: string
        description: File hash the exception is keyed on.
    output:
      description: The exception record for that hash.
      type: object

  create_malware_exception:
    title: Create an anti-malware exception
    description: >-
      Exempt a file from anti-malware scanning. exception_str carries the hash,
      and is_exclusive decides whether the rule applies only to the named
      entity.
    category: exceptions
    request:
      method: POST
      path: /v1.0/sectool-exceptions/checkpoint2/exceptions
      body:
        requestData:
          exception_type: "${exception_type}"
          exception_str: "${exception_str}"
          exception_payload: "${exception_payload}"
          entity_type: "${entity_type}"
          entity_id: "${entity_id}"
          file_name: "${file_name}"
          created_by_email: "${created_by_email}"
          is_exclusive: "${is_exclusive}"
          comment: "${comment}"
    input:
      exception_type:
        type: string
        description: Kind of exception being created, e.g. a hash exception.
      exception_str:
        type: string
        description: The value exempted -- the file hash.
      exception_payload:
        type: object
        description: Extra conditions on the rule, such as {"condition" - "with_link"}.
        optional: true
      entity_type:
        type: string
        description: Entity the rule is scoped to, e.g. user.
        optional: true
      entity_id:
        type: string
        description: Id of that entity.
        optional: true
      file_name:
        type: string
        description: Name of the file the hash belongs to.
        optional: true
      created_by_email:
        type: string
        description: Who to record as the rule's author.
        optional: true
      is_exclusive:
        type: boolean
        description: True to apply the rule only to the named entity.
        optional: true
      comment:
        type: string
        description: Note recorded with the rule.
        optional: true
    output:
      description: A response envelope reporting whether the rule was created.
      type: object

  update_malware_exception:
    title: Update the anti-malware exceptions
    description: >-
      Replace the anti-malware exception configuration with the fields you
      send. Takes the same body shape as create_malware_exception.
    category: exceptions
    request:
      method: PUT
      path: /v1.0/sectool-exceptions/checkpoint2
      body:
        requestData: "${request_data}"
    input:
