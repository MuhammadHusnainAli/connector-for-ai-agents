# Dart tools -- AI-native project management.
#
# The connection's base url already ends in /api/v0, so every path here starts
# at /public -- Dart's public API sits under that prefix and the private app
# API does not.
#
# The single most important thing about this API is that **it takes titles, not
# ids**. A task's dartboard, status, assignees, tags, priority and size are all
# given by the name a human sees, and Dart rejects a value it does not
# recognise rather than creating it. `get_config` returns every valid value for
# every one of those fields, so it is the call to make before the first write
# -- guessing a status name is the most common reason a create fails.
#
# Two smaller things:
#
#   * **rich text has its own endpoints.** `update_task` will not change a
#     description and `update_doc` will not change a body; the
#     `update-description` and `update-text` tools do that;
#   * **deletes are soft.** Tasks and docs go to the trash rather than being
#     destroyed, and the list tools take `in_trash` to see them.
#
# Docs: https://app.dartai.com/api/v0/docs/

connector_id: dart
display_name: Dart
docs_url: https://app.dartai.com/api/v0/docs/

tools:

  get_me:
    title: Get the authenticated user
    description: >-
      The user this API token belongs to, with their id and email. The
      cheapest call that proves the token works and says which workspace it
      reaches.
    category: account
    read_only: true
    request:
      method: GET
      path: /public/me
    output:
      description: The requested record.
      type: object

  get_config:
    title: Get the workspace configuration
    description: >-
      The workspace's dartboards, folders, statuses, priorities, tags,
      assignees and sizes. Read this first: create_task and update_task take
      these values by name, and an unknown status or dartboard is rejected
      rather than created.
    category: account
    read_only: true
    request:
      method: GET
      path: /public/config
    output:
      description: The requested record.
      type: object

  list_tasks:
    title: List tasks
    description: >-
      Search and filter the workspace's tasks. Filters are query parameters
      named after the fields -- status, assignee, dartboard, tag and so on --
      and the values must be ones get_config lists.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /public/tasks/list
      query:
        limit: "${limit}"
        offset: "${offset}"
        dartboard: "${dartboard}"
        status: "${status}"
        assignee: "${assignee}"
        tag: "${tag}"
        priority: "${priority}"
        title: "${title}"
        in_trash: "${in_trash}"
        is_completed: "${is_completed}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
      dartboard:
        type: string
        description: Filter to one dartboard by title.
        optional: true
      status:
        type: string
        description: Filter by status title.
        optional: true
      assignee:
        type: string
        description: Filter by assignee name or email.
        optional: true
      tag:
        type: string
        description: Filter by tag title.
        optional: true
      priority:
        type: string
        description: Filter by priority.
        optional: true
      title:
        type: string
        description: Filter by task title, partial match.
        optional: true
      in_trash:
        type: boolean
        description: Include tasks that are in the trash.
        optional: true
      is_completed:
        type: boolean
        description: Filter by whether the task is completed.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_task:
    title: Create a task
    description: >-
      Create a task. `dartboard`, `status`, `assignees`, `tags`, `priority`
      and `size` are all given by title rather than id, and every value must
      be one get_config lists -- Dart rejects an unknown value rather than
      creating it.
    category: tasks
    request:
      method: POST
      path: /public/tasks
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The task to create -- `title`, plus optional dartboard, status, assignees, tags, priority, size, dates and description.
    output:
      description: The provider's response to the call.
      type: object

  get_task:
    title: Get a task
    description: >-
      One task in full, including its description, assignees, dates and the
      dartboard it sits on.
    category: tasks
    read_only: true
    request:
      method: GET
      path: /public/tasks/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  update_task:
    title: Update a task
    description: >-
      Change a task's fields. Only the fields you send are changed. As with
      create, values like status and assignee are given by title and must
      match what get_config lists.
    category: tasks
    request:
      method: PUT
      path: /public/tasks/${id}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The task fields to change.
    output:
      description: The record after the update.
      type: object

  delete_task:
    title: Delete a task
    description: >-
      Move a task to the trash. Dart treats this as a soft delete, so the task
      leaves the board but its comments and history are not immediately
      destroyed.
    category: tasks
    destructive: true
    request:
      method: DELETE
      path: /public/tasks/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: Confirmation that the record was deleted.
      type: object

  move_task:
    title: Move a task
    description: >-
      Move a task to a different dartboard, or reposition it relative to its
      siblings. Separate from update_task because ordering is positional
      rather than a field value.
    category: tasks
    request:
      method: POST
      path: /public/tasks/${id}/move
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: Where to move the task -- the target dartboard and/or position.
    output:
      description: The provider's response to the call.
      type: object

  update_task_description:
    title: Update a task's description
    description: >-
      Replace a task's description body. A separate endpoint from update_task
      because the description is rich text handled on its own.
    category: tasks
    request:
      method: POST
      path: /public/tasks/${id}/update-description
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The new description text for the task.
    output:
      description: The provider's response to the call.
      type: object

  add_task_time_tracking:
    title: Log time against a task
    description: >-
      Record time worked on a task. Adds an entry rather than replacing the
      total, so repeated calls accumulate.
    category: tasks
    request:
      method: POST
      path: /public/tasks/${id}/time-tracking
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The time entry to add -- its duration and, where supported, its start.
    output:
      description: The provider's response to the call.
      type: object

  add_task_attachment_from_url:
    title: Attach a file to a task from a URL
    description: >-
      Attach a file to a task by giving Dart a url to fetch. The url has to be
      reachable from Dart's side, which is why this works where a local file
      upload would not.
    category: tasks
    request:
      method: POST
      path: /public/tasks/${id}/attachments/from-url
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The attachment -- the `url` to fetch and, optionally, a name.
    output:
      description: The provider's response to the call.
      type: object

  list_comments:
    title: List comments
    description: >-
      Comments across the workspace, filterable to one task. The discussion
      attached to work, as opposed to the task fields themselves.
    category: comments
    read_only: true
    request:
      method: GET
      path: /public/comments/list
      query:
        limit: "${limit}"
        offset: "${offset}"
        task_id: "${task_id}"
        author: "${author}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
      task_id:
        type: string
        description: Restrict to comments on one task.
        optional: true
      author:
        type: string
        description: Filter by comment author.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  add_task_comment:
    title: Comment on a task
    description: >-
      Add a comment to a task. Comments notify the task's assignees and
      watchers, so this reaches real people rather than only writing a record.
    category: comments
    request:
      method: POST
      path: /public/comments
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The comment -- the `task_id` it belongs to and its `text`.
    output:
      description: The provider's response to the call.
      type: object

  list_docs:
    title: List docs
    description: >-
      Search and filter the workspace's docs. Docs are Dart's long-form pages,
      kept in folders rather than on dartboards.
    category: docs
    read_only: true
    request:
      method: GET
      path: /public/docs/list
      query:
        limit: "${limit}"
        offset: "${offset}"
        folder: "${folder}"
        title: "${title}"
        in_trash: "${in_trash}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
      folder:
        type: string
        description: Filter to one folder by title.
        optional: true
      title:
        type: string
        description: Filter by doc title, partial match.
        optional: true
      in_trash:
        type: boolean
        description: Include docs that are in the trash.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_doc:
    title: Create a doc
    description: >-
      Create a doc in a folder. As with tasks, the folder is given by title
      and must be one get_config lists.
    category: docs
    request:
      method: POST
      path: /public/docs
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The doc to create -- `title`, plus an optional folder and text.
    output:
      description: The provider's response to the call.
      type: object

  get_doc:
    title: Get a doc
    description: >-
      One doc, with its title, folder and body text.
    category: docs
    read_only: true
    request:
      method: GET
      path: /public/docs/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  update_doc:
    title: Update a doc
    description: >-
      Change a doc's title or folder. To replace its body, use update_doc_text
      -- this endpoint does not carry the rich text.
    category: docs
    request:
      method: PUT
      path: /public/docs/${id}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The doc fields to change.
    output:
      description: The record after the update.
      type: object

  update_doc_text:
    title: Update a doc's text
    description: >-
      Replace a doc's body text. Separate from update_doc because the body is
      rich text handled on its own endpoint.
    category: docs
    request:
      method: POST
      path: /public/docs/${id}/update-text
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The new text for the doc.
    output:
      description: The provider's response to the call.
      type: object

  delete_doc:
    title: Delete a doc
    description: >-
      Move a doc to the trash. A soft delete, like task deletion -- the doc
      leaves its folder rather than being destroyed outright.
    category: docs
    destructive: true
    request:
      method: DELETE
      path: /public/docs/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: Confirmation that the record was deleted.
      type: object

  get_dartboard:
    title: Get a dartboard
    description: >-
      One dartboard -- a Dart board that holds tasks -- with its
      configuration. Dartboards are created in the app, not through this API.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /public/dartboards/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  get_folder:
    title: Get a folder
    description: >-
      One folder, the container docs live in. Folders are created in the app,
      not through this API.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /public/folders/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  get_view:
    title: Get a view
    description: >-
      One saved view and its filter definition, so a caller can reproduce the
      same filtering that a person set up in the app.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /public/views/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  list_help_center_articles:
    title: List help centre articles
    description: >-
      The workspace's published help centre articles. Useful for answering a
      question from the team's own documentation rather than guessing.
    category: workspace
    read_only: true
    request:
      method: GET
      path: /public/help-center-articles/list
      query:
        limit: "${limit}"
        offset: "${offset}"
        title: "${title}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
      title:
        type: string
        description: Filter by article title, partial match.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_agents:
    title: List agents
    description: >-
      The AI agents configured in the workspace, each with the instructions
      and model it runs on.
    category: agents
    read_only: true
    request:
      method: GET
      path: /public/agents/list
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_agent:
    title: Create an agent
    description: >-
      Create an AI agent with its instructions, model and execution mode. The
      agent can then be assigned tasks like a person.
    category: agents
    request:
      method: POST
      path: /public/agents
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The agent to create -- its name, instructions, model and execution mode.
    output:
      description: The provider's response to the call.
      type: object

  get_agent:
    title: Get an agent
    description: >-
      One agent's configuration, including its instructions and the model it
      runs on.
    category: agents
    read_only: true
    request:
      method: GET
      path: /public/agents/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  update_agent:
    title: Update an agent
    description: >-
      Change an agent's instructions, model or execution mode. Takes effect on
      the next task the agent picks up.
    category: agents
    request:
      method: PUT
      path: /public/agents/${id}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The agent fields to change.
    output:
      description: The record after the update.
      type: object

  delete_agent:
    title: Delete an agent
    description: >-
      Delete an agent. Tasks assigned to it are left unassigned rather than
      deleted, so work does not disappear with the agent.
    category: agents
    destructive: true
    request:
      method: DELETE
      path: /public/agents/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_skills:
    title: List skills
    description: >-
      The skills available to the workspace's agents -- reusable instruction
      sets an agent can invoke.
    category: agents
    read_only: true
    request:
      method: GET
      path: /public/skills/list
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_skill:
    title: Create a skill
    description: >-
      Define a skill an agent can use, as a named, reusable set of
      instructions.
    category: agents
    request:
      method: POST
      path: /public/skills
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The skill to create -- its title and instructions.
    output:
      description: The provider's response to the call.
      type: object

  get_skill:
    title: Get a skill
    description: >-
      One skill's title and instructions, for reading before editing or
      reusing it.
    category: agents
    read_only: true
    request:
      method: GET
      path: /public/skills/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  get_skill_by_title:
    title: Get a skill by title
    description: >-
      Look a skill up by its title rather than its id. Convenient when a
      workflow refers to skills by the name a human gave them.
    category: agents
    read_only: true
    request:
      method: GET
      path: /public/skills/by-title
      query:
        title: "${title}"
    input:
      title:
        type: string
        description: The skill's exact title.
    output:
      description: The requested record.
      type: object

  update_skill:
    title: Update a skill
    description: >-
      Change a skill's title or instructions. Every agent using the skill
      picks up the change on its next run.
    category: agents
    request:
      method: PUT
      path: /public/skills/${id}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The skill fields to change.
    output:
      description: The record after the update.
      type: object

  delete_skill:
    title: Delete a skill
    description: >-
      Delete a skill. Agents that referenced it lose that capability on their
      next run.
    category: agents
    destructive: true
    request:
      method: DELETE
      path: /public/skills/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_webhooks:
    title: List webhooks
    description: >-
      The webhooks configured on the workspace, with the events each
      subscribes to.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /public/webhooks/list
      query:
        limit: "${limit}"
        offset: "${offset}"
    input:
      limit:
        type: integer
        description: How many records to return.
        optional: true
        default: '50'
      offset:
        type: integer
        description: How many records to skip, for paging.
        optional: true
        default: '0'
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  create_webhook:
    title: Create a webhook
    description: >-
      Subscribe a url to workspace events, so a downstream system learns about
      task changes without polling.
    category: webhooks
    request:
      method: POST
      path: /public/webhooks
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The webhook -- its target url and the events it should receive.
    output:
      description: The provider's response to the call.
      type: object

  get_webhook:
    title: Get a webhook
    description: >-
      One webhook's target url, event subscriptions and current state.
    category: webhooks
    read_only: true
    request:
      method: GET
      path: /public/webhooks/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: The requested record.
      type: object

  update_webhook:
    title: Update a webhook
    description: >-
      Change a webhook's url or event subscriptions.
    category: webhooks
    request:
      method: PUT
      path: /public/webhooks/${id}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
      attributes:
        type: object
        description: The webhook fields to change.
    output:
      description: The record after the update.
      type: object

  delete_webhook:
    title: Delete a webhook
    description: >-
      Delete a webhook subscription. Deliveries stop at once and nothing is
      queued for later replay.
    category: webhooks
    destructive: true
    request:
      method: DELETE
      path: /public/webhooks/${id}
    input:
      id:
        type: string
        description: The record's id, as returned when it was created or listed.
    output:
      description: Confirmation that the record was deleted.
      type: object
