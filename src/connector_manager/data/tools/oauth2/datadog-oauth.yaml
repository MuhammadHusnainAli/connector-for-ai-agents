      query:
        metric_query: "${metric_query}"
        start: "${start}"
        end: "${end}"
        event_query: "${event_query}"
        graph_def: "${graph_def}"
        title: "${title}"
        height: "${height}"
        width: "${width}"
    input:
      metric_query:
        type: string
        description: The metric query.
        optional: true
      start:
        type: integer
        description: The POSIX timestamp of the start of the query in seconds.
      end:
        type: integer
        description: The POSIX timestamp of the end of the query in seconds.
      event_query:
        type: string
        description: A query that adds event bands to the graph.
        optional: true
      graph_def:
        type: string
        description: A JSON document defining the graph. `graph_def` can be used instead of `metric_query`. The JSON document uses the [grammar defined here](https://docs.datadoghq.com/graphing/graphing_json/#grammar) and should be formatted to a single line then URL encoded.
