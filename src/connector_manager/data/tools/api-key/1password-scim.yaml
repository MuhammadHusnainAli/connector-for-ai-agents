# 1Password SCIM Bridge tools.
#
# The bridge speaks SCIM 2.0 (RFC 7644), so these are the protocol's own
# operations rather than a 1Password-specific API. The connection's `domain`
# points at your self-hosted bridge and the base url already ends in /scim, so
# paths start at /Users and /Groups.
#
# Two things follow from SCIM rather than from 1Password:
#   * paging is startIndex (1-based) and count, not page numbers;
#   * PATCH takes a PatchOp body whose Operations are add / remove / replace,
#     which is how group membership changes are made.
#
# get_bridge_health sits outside /scim, on the bridge root, so it overrides the
# base url.
#
# Docs: https://support.1password.com/scim-endpoints/

connector_id: 1password-scim
display_name: 1Password (SCIM)
docs_url: https://support.1password.com/scim-endpoints/

tools:

  list_users:
    title: List users
    description: >-
      Page through the users the bridge provisions. Narrow with a SCIM filter
      such as userName eq "ada@example.com" or active eq true. Results are
      sorted by email address when startIndex and count are given.
    category: users
    read_only: true
    request:
      method: GET
      path: /Users
      query:
        filter: "${filter}"
        startIndex: "${start_index}"
        count: "${count}"
        attributes: "${attributes}"
    input:
      filter:
        type: string
        description: SCIM filter expression, e.g. userName eq "ada@example.com".
        optional: true
        example: active eq true
      start_index:
        type: integer
        description: 1-based index of the first result, for paging.
        optional: true
        minimum: 1
      count:
        type: integer
        description: How many users to return per page.
        optional: true
        default: 100
        minimum: 1
      attributes:
        type: array
        description: Only return these attributes, e.g. ["userName","active"].
        optional: true
        items: {type: string}
    output:
      description: A SCIM ListResponse of users.
      type: object
      properties:
        totalResults: {type: integer}
        itemsPerPage: {type: integer}
        startIndex: {type: integer}
        Resources: {type: array, description: "Each a SCIM user with id, userName, name, emails and active."}

  get_user:
    title: Get a user
    description: >-
      Read one provisioned user by their SCIM id, with their name, emails,
      active state and group memberships.
    category: users
    read_only: true
    request:
      method: GET
      path: /Users/${user_id}
    input:
      user_id:
        type: string
        description: The user's SCIM id.
    output:
      description: The SCIM user.
      type: object
      properties:
        id: {type: string}
        userName: {type: string}
        name: {type: object}
        emails: {type: array}
        active: {type: boolean}
        groups: {type: array}

  create_user:
    title: Provision a user
    description: >-
      Create a user, which invites them to the 1Password account. userName is
      their email address; name takes givenName and familyName.
    category: users
    request:
      method: POST
      path: /Users
      headers:
        content-type: application/scim+json
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        userName: "${user_name}"
        name: "${name}"
        emails: "${emails}"
        displayName: "${display_name}"
        active: "${active}"
    input:
      user_name:
        type: string
        description: The user's email address, which is their SCIM userName.
        format: email
      name:
        type: object
        description: "Their name, e.g. {\"givenName\": \"Ada\", \"familyName\": \"Lovelace\"}."
        optional: true
      emails:
        type: array
        description: "Email entries, each {\"value\": \"ada@example.com\", \"primary\": true}."
        optional: true
        items: {type: object}
      display_name:
        type: string
        description: Name shown in 1Password.
        optional: true
      active:
        type: boolean
        description: Whether the account is active on creation.
        optional: true
    output:
      description: The created SCIM user.
      type: object
      properties:
        id: {type: string}
        userName: {type: string}
        active: {type: boolean}

  replace_user:
    title: Replace a user
    description: >-
      Overwrite a user's attributes wholesale, per SCIM PUT. Anything omitted is
      cleared, so send the complete resource — patch_user is usually what you
      want instead.
    category: users
    request:
      method: PUT
      path: /Users/${user_id}
      headers:
        content-type: application/scim+json
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        userName: "${user_name}"
        name: "${name}"
        emails: "${emails}"
        displayName: "${display_name}"
        active: "${active}"
    input:
      user_id:
        type: string
        description: The user's SCIM id.
      user_name:
        type: string
        description: The user's email address.
        format: email
      name:
        type: object
        description: Their name object.
        optional: true
      emails:
        type: array
        description: The complete email list.
        optional: true
        items: {type: object}
      display_name:
        type: string
        description: Name shown in 1Password.
        optional: true
      active:
        type: boolean
        description: Whether the account is active.
        optional: true
    output:
      description: The replaced SCIM user.
      type: object
      properties:
        id: {type: string}
        userName: {type: string}
        active: {type: boolean}

  patch_user:
    title: Suspend, reactivate or edit a user
    description: >-
      Apply SCIM PatchOp operations to a user without resending the whole
      resource. Setting active to false suspends them in 1Password; setting it
      true reactivates. Operations look like
      [{"op": "replace", "path": "active", "value": false}].
    category: users
    request:
      method: PATCH
      path: /Users/${user_id}
      headers:
        content-type: application/scim+json
      body:
        schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations: "${operations}"
    input:
      user_id:
        type: string
        description: The user's SCIM id.
      operations:
        type: array
        description: >-
          PatchOp operations, each {"op": "add" | "remove" | "replace",
          "path": "...", "value": ...}.
        items: {type: object}
    output:
      description: The patched SCIM user.
      type: object
      properties:
        id: {type: string}
        active: {type: boolean}

  delete_user:
    title: Deprovision a user
    description: >-
      Remove a user from the 1Password account. This revokes their access; it
      cannot be undone through the bridge, and suspending with patch_user is
      usually the reversible alternative.
    category: users
    destructive: true
    request:
      method: DELETE
      path: /Users/${user_id}
    input:
      user_id:
        type: string
        description: The user's SCIM id.
    output:
      description: Empty on success -- the bridge answers 204 No Content.
      type: object

  list_groups:
    title: List groups
    description: >-
      Page through the groups the bridge provisions, with their display names
      and members. Narrow with a SCIM filter such as displayName eq "Engineering".
    category: groups
    read_only: true
    request:
      method: GET
      path: /Groups
      query:
        filter: "${filter}"
        startIndex: "${start_index}"
        count: "${count}"
    input:
      filter:
        type: string
        description: SCIM filter expression, e.g. displayName eq "Engineering".
        optional: true
      start_index:
        type: integer
        description: 1-based index of the first result.
        optional: true
        minimum: 1
      count:
        type: integer
        description: How many groups to return per page.
        optional: true
        default: 100
        minimum: 1
    output:
      description: A SCIM ListResponse of groups.
      type: object
      properties:
        totalResults: {type: integer}
        Resources: {type: array, description: "Each with id, displayName and members."}

  get_group:
    title: Get a group
    description: Read one group by its SCIM id, including its member list.
    category: groups
    read_only: true
    request:
      method: GET
      path: /Groups/${group_id}
    input:
      group_id:
        type: string
        description: The group's SCIM id.
    output:
      description: The SCIM group.
      type: object
      properties:
        id: {type: string}
        displayName: {type: string}
        members: {type: array}

  create_group:
    title: Create a group
    description: >-
      Create a group in 1Password, optionally with its initial members. Members
      are [{"value": "<user scim id>"}].
    category: groups
    request:
      method: POST
      path: /Groups
      headers:
        content-type: application/scim+json
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        displayName: "${display_name}"
        members: "${members}"
    input:
      display_name:
        type: string
        description: The group's name.
      members:
        type: array
        description: "Initial members, each {\"value\": \"<user scim id>\"}."
        optional: true
        items: {type: object}
    output:
      description: The created SCIM group.
      type: object
      properties:
        id: {type: string}
        displayName: {type: string}

  patch_group:
    title: Add or remove group members
    description: >-
      Apply SCIM PatchOp operations to a group. Adding a member is
      [{"op": "add", "path": "members", "value": [{"value": "<user id>"}]}];
      removing one uses op "remove" with a filtered path such as
      members[value eq "<user id>"].
    category: groups
    request:
      method: PATCH
      path: /Groups/${group_id}
      headers:
        content-type: application/scim+json
      body:
        schemas: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations: "${operations}"
    input:
      group_id:
        type: string
        description: The group's SCIM id.
      operations:
        type: array
        description: PatchOp operations, each with op, path and value.
        items: {type: object}
    output:
      description: The patched SCIM group.
      type: object
      properties:
        id: {type: string}
        displayName: {type: string}
        members: {type: array}

  delete_group:
    title: Delete a group
    description: >-
      Remove a group from the 1Password account. Members lose whatever access
      the group granted them; this cannot be undone through the bridge.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /Groups/${group_id}
    input:
      group_id:
        type: string
        description: The group's SCIM id.
    output:
      description: Empty on success -- the bridge answers 204 No Content.
      type: object

  get_service_provider_config:
    title: Get the bridge's SCIM capabilities
    description: >-
      Read which parts of SCIM this bridge implements — whether PATCH, filtering,
      sorting and bulk operations are supported, and the maximum page size.
      Worth checking before relying on a filter or a patch.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /ServiceProviderConfig
    input: {}
    output:
      description: The SCIM service provider configuration.
      type: object
      properties:
        patch: {type: object}
        filter: {type: object}
        bulk: {type: object}
        sort: {type: object}

  list_resource_types:
    title: List SCIM resource types
    description: >-
      List the resource types the bridge exposes — User and Group — with the
      endpoint and schema URN of each.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /ResourceTypes
    input: {}
    output:
      description: The bridge's SCIM resource types.
      type: object
      properties:
        Resources: {type: array}
        totalResults: {type: integer}

  list_schemas:
    title: List SCIM schemas
    description: >-
      Read the attribute definitions for the User and Group schemas the bridge
      supports, which is what says whether an attribute is writable.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /Schemas
    input: {}
    output:
      description: The bridge's SCIM schemas.
      type: object
      properties:
        Resources: {type: array}
        totalResults: {type: integer}

  get_bridge_health:
    title: Check the SCIM bridge's health
    description: >-
      Read the bridge's own health report — the state of its components and its
      connection to 1Password's servers. This endpoint sits on the bridge root
      rather than under /scim, so it overrides the base url.
    category: metadata
    read_only: true
    request:
      method: GET
      base_url_override: https://${connectionConfig.domain}
      path: /health
    input: {}
    output:
      description: Component-by-component health of the bridge.
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        dependencies: {type: array}
