# Autobound sales intelligence tools.
#
# Autobound publishes two APIs on two hosts, and every path, parameter and
# credit cost below comes from its own documentation:
#
#   * the Personalized Content API (OpenAPI "Autobound Personalized Content
#     API v3.6") at https://api.autobound.ai/api/external -- which is exactly
#     the base url this connection carries, so its paths start at
#     /generate-content/v3.6;
#   * the Signal API (OpenAPI "Autobound Signal API 2.4.0") at
#     https://signals.autobound.ai, read from the embedded specifications on
#     https://autobound-api.readme.io/reference/*.md. Those tools carry an
#     explicit base url for that host; the same X-API-KEY authenticates both.
#
# Credits are charged per result, not per call, and the free endpoints are worth
# knowing: the registry reads (signal types, filters, topics, stats), the
# account and credit reads, request logs, health and export polling cost
# nothing. Enrichment is 2 credits per returned signal, entity search 2 per
# entity returned, buyer-intent search 1 per row, and a bulk export is charged
# at submit time as a 50-credit base plus 5 per distinct topic.
#
# Two search behaviours are worth passing on. detected_after defaults to a
# trailing window rather than all time, so a query that finds nothing is often
# just looking too far back. And the content_filters clauses match exact
# canonical names -- "Salesforce", not "Sales" -- with free-text keywords the
# one clause that can time out on a broad window; a 408 comes back with the
# broad terms named and is not charged.
#
# Not covered: the Signal Database's bulk GCS delivery, which is a storage
# handover rather than an API, and the AI Studio campaign execute route, whose
# URL embeds a campaign UUID that only exists in your own workspace.
#
# Docs: https://autobound-api.readme.io/

connector_id: autobound
display_name: Autobound
docs_url: https://autobound-api.readme.io/

tools:
  generate_content:
    title: Generate personalized content
    description: >-
      Write outreach for one prospect -- an email, a multi-step sequence, a call
      script, a LinkedIn connection request, an SMS or an opener. Autobound
      resolves the contact, ranks its insights and writes from them. Identify
      the prospect with contactEmail or contactLinkedinUrl; the seller defaults
      to whoever created the API key.
    category: content
    request:
      method: POST
      path: /generate-content/v3.6
      body:
        contactEmail: "${contact_email}"
        contactLinkedinUrl: "${contact_linkedin_url}"
        contactName: "${contact_name}"
        contactCompanyName: "${contact_company_name}"
        contactCompanyUrl: "${contact_company_url}"
        userEmail: "${user_email}"
        userLinkedinUrl: "${user_linkedin_url}"
        userName: "${user_name}"
        userCompanyName: "${user_company_name}"
        userCompanyUrl: "${user_company_url}"
        contentType: "${content_type}"
        customContentType: "${custom_content_type}"
        writingStyle: "${writing_style}"
        customWritingStyle: "${custom_writing_style}"
        additionalContext: "${additional_context}"
        valueProposition: "${value_proposition}"
        salesAsset: "${sales_asset}"
        contentToRewrite: "${content_to_rewrite}"
        enabledInsights: "${enabled_insights}"
        disabledInsights: "${disabled_insights}"
        wordCount: "${word_count}"
        language: "${language}"
        model: "${model}"
        n: "${n}"
        sequenceNumberOfEmails: "${sequence_number_of_emails}"
    input:
      content_type:
        type: string
        description: What to write. A sequence costs 2 credits per email in it.
        enum: [email, sequence, callScript, connectionRequest, sms, opener, custom]
      contact_email:
        type: string
        description: Email address of the prospect. Give this or contactLinkedinUrl.
        optional: true
      contact_linkedin_url:
        type: string
        description: LinkedIn URL of the prospect. Give this or contactEmail.
        optional: true
      contact_name:
        type: string
        description: Prospect's name, when Autobound may not resolve it.
        optional: true
      contact_company_name:
        type: string
        description: Prospect's company name, overriding what Autobound resolves.
        optional: true
      contact_company_url:
        type: string
        description: Prospect's company domain, which also steers the insights used.
        optional: true
      user_email:
        type: string
        description: Email of the seller the content is written for.
        optional: true
      user_linkedin_url:
        type: string
        description: LinkedIn URL of the seller the content is written for.
        optional: true
      user_name:
        type: string
        description: Seller's name, overriding what Autobound resolves.
        optional: true
      user_company_name:
        type: string
        description: Seller's company name, overriding what Autobound resolves.
        optional: true
      user_company_url:
        type: string
        description: Seller's company domain, which also steers the insights used.
        optional: true
      custom_content_type:
        type: string
        description: What to write, when contentType is custom.
        optional: true
      writing_style:
        type: string
        description: Voice to write in.
        optional: true
        enum: [challenger_sale, clever_poet, cxo_pitch, data_driven, basho, why_you_why_now, custom]
      custom_writing_style:
        type: string
        description: Style instructions, required when writingStyle is custom. Up to 10,000 characters.
        optional: true
      additional_context:
        type: string
        description: Extra instructions for this piece. Up to 10,000 characters.
        optional: true
      value_proposition:
        type: string
        description: Value proposition to sell on, overriding the workspace default.
        optional: true
      sales_asset:
        type: string
        description: Supporting material to draw on, such as a whitepaper's text.
        optional: true
      content_to_rewrite:
        type: string
        description: Existing copy to rewrite; for an email, include the subject line.
        optional: true
      enabled_insights:
        type: array
        description: Restrict generation to these insight subtypes.
        optional: true
        items: {type: string}
      disabled_insights:
        type: array
        description: Insight subtypes to keep out of the content.
        optional: true
        items: {type: string}
      word_count:
        type: integer
        description: Roughly how long the output should be.
        optional: true
      language:
        type: string
        description: Language to write in. Defaults to English.
        optional: true
      model:
        type: string
        description: Model to generate with; email and sequence only.
        optional: true
        enum: [opus, sonnet_3.5, gpt4o, fine_tuned, gemini_pro_1.5, gemini_flash_1.5, gemini]
      n:
        type: integer
        description: How many variants to generate, 1 to 3. Not valid for sequences.
        optional: true
        maximum: 3
      sequence_number_of_emails:
        type: integer
        description: How many emails a sequence should contain. Defaults to 3.
        optional: true
    output:
      description: The generated content, with the insights it was built from.
      type: object

  generate_insights:
    title: Generate insights for a prospect
    description: >-
      Rank Autobound's 350-plus insight types for one prospect -- news, hiring,
      financials, social activity and the rest -- scored against the seller's
      value proposition. Identify the prospect with contactEmail,
      contactLinkedinUrl or contactCompanyUrl; the seller defaults to the API
      key's owner.
    category: insights
    request:
      method: POST
      path: /generate-insights/v1.4
      body:
        contactEmail: "${contact_email}"
        contactLinkedinUrl: "${contact_linkedin_url}"
        contactCompanyUrl: "${contact_company_url}"
        userEmail: "${user_email}"
        userLinkedinUrl: "${user_linkedin_url}"
        userCompanyUrl: "${user_company_url}"
        insightSubtype: "${insight_subtype}"
    input:
      contact_email:
        type: string
        description: Email address of the prospect.
        optional: true
      contact_linkedin_url:
        type: string
        description: LinkedIn URL of the prospect.
        optional: true
      contact_company_url:
        type: string
        description: Domain of the prospect's company.
        optional: true
      user_email:
        type: string
        description: Email of the seller to score relevance against.
        optional: true
      user_linkedin_url:
        type: string
        description: LinkedIn URL of the seller to score relevance against.
        optional: true
      user_company_url:
        type: string
        description: Domain of the seller's company.
        optional: true
      insight_subtype:
        type: array
        description: Insight subtypes to prioritise in the ranking.
        optional: true
        items: {type: string}
    output:
      description: The ranked insights, each with its type, content and score.
      type: object

  enrich_company:
    title: Enrich a company with signals
    description: >-
      Return every signal Autobound holds for one company, identified by domain
      (best), name or LinkedIn URL. Narrow with signal_types and
      signal_subtypes -- filtered-out signals are neither returned nor billed.
      Costs 2 credits per signal returned.
    category: signals
    request:
      method: POST
      path: /v1/companies/enrich
      base_url_override: https://signals.autobound.ai
      body:
        domain: "${domain}"
        company_name: "${company_name}"
        linkedin_url: "${linkedin_url}"
        signal_types: "${signal_types}"
        signal_subtypes: "${signal_subtypes}"
        detected_after: "${detected_after}"
        limit: "${limit}"
    input:
      domain:
        type: string
        description: Company domain, e.g. stripe.com. The most reliable identifier.
        optional: true
      company_name:
        type: string
        description: Company name, when you have no domain.
        optional: true
      linkedin_url:
        type: string
        description: Company LinkedIn URL.
        optional: true
      signal_types:
        type: array
        description: Signal types to return; see list_signal_types for the vocabulary.
        optional: true
        items: {type: string}
      signal_subtypes:
        type: array
        description: Subtypes to narrow to, up to 25, matched across all requested types.
        optional: true
        items: {type: string}
      detected_after:
        type: string
        description: Only signals detected on or after this ISO 8601 date.
        optional: true
      limit:
        type: integer
        description: Maximum signals to return.
        optional: true
    output:
      description: The company's signals, each with its type, subtype and content.
      type: object

  enrich_contact:
    title: Enrich a contact with signals
    description: >-
      Return the signals Autobound holds for one person, found by email or
      LinkedIn URL. Contact-level coverage is thin today, so an empty result is
      common -- fall back to enrich_company on their employer's domain. Costs 2
      credits per signal returned.
    category: signals
    request:
      method: POST
      path: /v1/contacts/enrich
      base_url_override: https://signals.autobound.ai
      body:
        contact_email: "${contact_email}"
        contact_linkedin_url: "${contact_linkedin_url}"
        signal_types: "${signal_types}"
        signal_subtypes: "${signal_subtypes}"
        detected_after: "${detected_after}"
        limit: "${limit}"
    input:
      contact_email:
        type: string
        description: Contact's email address.
        optional: true
      contact_linkedin_url:
        type: string
        description: Contact's LinkedIn URL.
        optional: true
      signal_types:
        type: array
        description: Signal types to return.
        optional: true
        items: {type: string}
      signal_subtypes:
        type: array
        description: Subtypes to narrow to, up to 25.
        optional: true
        items: {type: string}
      detected_after:
        type: string
        description: Only signals detected on or after this ISO 8601 date.
        optional: true
      limit:
        type: integer
        description: Maximum signals to return.
        optional: true
    output:
      description: The contact's signals, and the company signals behind them.
      type: object

  search_companies:
    title: Search companies by signal
    description: >-
      Find distinct companies with signals matching a filter, newest first, each
      with its most recent signals attached -- the audience-building query.
      signal_types is required; firmographic filters narrow by industry, size
      and revenue. Costs 2 credits per company returned.
    category: signals
    request:
      method: POST
      path: /v1/companies/search
      base_url_override: https://signals.autobound.ai
      body:
        signal_types: "${signal_types}"
        signal_subtypes: "${signal_subtypes}"
        detected_after: "${detected_after}"
        detected_before: "${detected_before}"
        company_domains: "${company_domains}"
        industries: "${industries}"
        employee_count_min: "${employee_count_min}"
        employee_count_max: "${employee_count_max}"
        revenue_min: "${revenue_min}"
        revenue_max: "${revenue_max}"
        content_filters: "${content_filters}"
        signals_per_entity: "${signals_per_entity}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      signal_types:
        type: array
        description: Signal types to search over, e.g. ["hiring-trends", "sec-8k"].
        items: {type: string}
      signal_subtypes:
        type: array
        description: Subtypes to narrow to, up to 25, applied across all requested types.
        optional: true
        items: {type: string}
      detected_after:
        type: string
        description: ISO 8601 lower bound on detection; defaults to a trailing window.
        optional: true
      detected_before:
        type: string
        description: ISO 8601 upper bound on detection.
        optional: true
      company_domains:
        type: array
        description: Restrict to signals about these company domains.
        optional: true
        items: {type: string}
      industries:
        type: array
        description: Industries to restrict to; matched as a case-insensitive substring.
        optional: true
        items: {type: string}
      employee_count_min:
        type: integer
        description: Smallest company headcount to include.
        optional: true
      employee_count_max:
        type: integer
        description: Largest company headcount to include; omit for no upper bound.
        optional: true
      revenue_min:
        type: string
        description: Lowest revenue bucket to include; see list_filters for labels.
        optional: true
      revenue_max:
        type: string
        description: Highest revenue bucket to include.
        optional: true
      content_filters:
        type: object
        description: Clauses searching inside social and podcast content -- keywords, tech_mentioned, competitors_mentioned, pain_points, initiatives.
        optional: true
      signals_per_entity:
        type: integer
        description: How many recent signals to attach per company. Defaults to 25.
        optional: true
      limit:
        type: integer
        description: Companies to return.
        optional: true
      offset:
        type: integer
        description: Offset into the result set.
        optional: true
    output:
      description: Matching companies, each with its most recent signals attached.
      type: object

  search_contacts:
    title: Search contacts by signal
    description: >-
      Find distinct people with signals matching a filter, with their company
      firmographics and the person filters -- seniority, department, job title
      -- layered on top. Costs 2 credits per contact returned.
    category: signals
    request:
      method: POST
      path: /v1/contacts/search
      base_url_override: https://signals.autobound.ai
      body:
        signal_types: "${signal_types}"
        signal_subtypes: "${signal_subtypes}"
        detected_after: "${detected_after}"
        detected_before: "${detected_before}"
        company_domains: "${company_domains}"
        industries: "${industries}"
        employee_count_min: "${employee_count_min}"
        employee_count_max: "${employee_count_max}"
        revenue_min: "${revenue_min}"
        revenue_max: "${revenue_max}"
        seniority: "${seniority}"
        department: "${department}"
        job_title: "${job_title}"
        content_filters: "${content_filters}"
        signals_per_entity: "${signals_per_entity}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      signal_types:
        type: array
        description: Signal types to search over, e.g. ["work-milestones"].
        items: {type: string}
      signal_subtypes:
        type: array
        description: Subtypes to narrow to, up to 25.
        optional: true
        items: {type: string}
      detected_after:
        type: string
        description: ISO 8601 lower bound on detection; defaults to a trailing window.
        optional: true
      detected_before:
        type: string
        description: ISO 8601 upper bound on detection.
        optional: true
      company_domains:
        type: array
        description: Restrict to people at these company domains.
        optional: true
        items: {type: string}
      industries:
        type: array
        description: Industries to restrict to.
        optional: true
        items: {type: string}
      employee_count_min:
        type: integer
        description: Smallest company headcount to include.
        optional: true
      employee_count_max:
        type: integer
        description: Largest company headcount to include.
        optional: true
      revenue_min:
        type: string
        description: Lowest revenue bucket to include.
        optional: true
      revenue_max:
        type: string
        description: Highest revenue bucket to include.
        optional: true
      seniority:
        type: array
        description: Seniority levels to include, e.g. ["Cxo", "Vp"].
        optional: true
        items: {type: string}
      department:
        type: array
        description: Departments to include, e.g. ["Engineering"].
        optional: true
        items: {type: string}
      job_title:
        type: string
        description: Job title keyword, matched partially.
        optional: true
      content_filters:
        type: object
        description: Clauses searching inside social and podcast content.
        optional: true
      signals_per_entity:
        type: integer
        description: How many recent signals to attach per contact.
        optional: true
      limit:
        type: integer
        description: Contacts to return.
        optional: true
      offset:
        type: integer
        description: Offset into the result set.
        optional: true
    output:
      description: Matching contacts, each with their most recent signals attached.
      type: object

  get_signal:
    title: Get a signal by id
    description: >-
      Re-fetch one signal by the canonical signal_id that enrich and search
      responses carry. Free -- it costs no credits.
    category: signals
    read_only: true
    request:
      method: GET
      path: /v1/signals/${signal_id}
      base_url_override: https://signals.autobound.ai
    input:
      signal_id:
        type: string
        description: Canonical signal id from an enrich or search response.
    output:
      description: The signal record.
      type: object

  list_signal_types:
    title: List signal types
    description: >-
      The source of truth for what signal_types accepts, with each type's
      label, whether it attaches to a company or a contact, its known subtypes
      and whether it supports content filters. Free.
    category: signals
    read_only: true
    request:
      method: GET
      path: /v1/signals/types
      base_url_override: https://signals.autobound.ai
      query:
        include_counts: "${include_counts}"
        association: "${association}"
        since: "${since}"
    input:
      include_counts:
        type: string
        description: Set to true to include live row counts per type.
        optional: true
        enum: ["true", "false", "1", "0"]
      association:
        type: string
        description: Restrict to company-level or contact-level types.
        optional: true
        enum: [company, contact]
      since:
        type: string
        description: ISO 8601 date; with counts, only count rows detected on or after it.
        optional: true
    output:
      description: The signal type registry, with subtypes and server-side defaults.
      type: object

  get_signal_type_history:
    title: Get a signal type's history
    description: >-
      Read detection-date histograms for one signal type, which is how you tell
      whether a type is still being ingested. Free.
    category: signals
    read_only: true
    request:
      method: GET
      path: /v1/signals/types/${type}/history
      base_url_override: https://signals.autobound.ai
      query:
        months: "${months}"
        interval: "${interval}"
    input:
      type:
        type: string
        description: Signal type slug or a registered alias, e.g. sec-8k or 8k.
      months:
        type: integer
        description: How many months of history to return.
        optional: true
      interval:
        type: string
        description: Bucket size for the histogram.
        optional: true
        enum: [monthly, weekly]
    output:
      description: Counts per interval for that signal type.
      type: object

  list_filters:
    title: List the canonical filter values
    description: >-
      Every closed-list entity filter in one response -- industries, seniority,
      department, country, revenue and size buckets -- with how each matches and
      which endpoints take it. This is where an invalid_filter_value error
      points you. Free.
    category: reference
    read_only: true
    request:
      method: GET
      path: /v1/filters
      base_url_override: https://signals.autobound.ai
    output:
      description: The accepted values and match semantics for every entity filter.
      type: object

  get_corpus_stats:
    title: Get corpus statistics
    description: >-
      Read aggregate signal counts by type, the total corpus size and when it
      was last ingested. Free.
    category: reference
    read_only: true
    request:
      method: GET
      path: /v1/stats
      base_url_override: https://signals.autobound.ai
    output:
      description: Signal counts by type with the last ingestion timestamp.
      type: object

  add_to_monitoring_pool:
    title: Add records to the monitoring pool
    description: >-
      Hand Autobound a list of companies or contacts to watch, so new signals on
      them are collected going forward.
    category: signals
    request:
      method: POST
      path: /v1/monitoring/add
      base_url_override: https://signals.autobound.ai
      body:
        records: "${records}"
    input:
      records:
        type: array
        description: Company or contact records to monitor, each with its identifier.
        items: {type: object}
    output:
      description: Which records were accepted into the monitoring pool.
      type: object

  list_buyer_intent_topics:
    title: Browse buyer-intent topics
    description: >-
      Search the catalogue of roughly 38,000 intent topics by fuzzy text,
      category or subcategory. The topic ids it returns are what the
      buyer-intent searches take. Free.
    category: buyer-intent
    read_only: true
    request:
      method: GET
      path: /v1/buyer-intent/topics
      base_url_override: https://signals.autobound.ai
      query:
        q: "${q}"
        category: "${category}"
        sub_category: "${sub_category}"
        is_product: "${is_product}"
        page: "${page}"
        page_size: "${page_size}"
    input:
      q:
        type: string
        description: Fuzzy search across topic name, description and category.
        optional: true
      category:
        type: string
        description: Exact category to filter by, case-insensitive.
        optional: true
      sub_category:
        type: string
        description: Exact subcategory to filter by, case-insensitive.
        optional: true
      is_product:
        type: string
        description: Restrict to product topics or non-product topics.
        optional: true
        enum: ["true", "false"]
      page:
        type: integer
        description: Page number, starting at 1.
        optional: true
        minimum: 1
      page_size:
        type: integer
        description: Topics per page.
        optional: true
    output:
      description: A page of intent topics with their ids and categories.
      type: object

  list_buyer_intent_filters:
    title: List buyer-intent filter values
    description: >-
      The valid seniority, department, revenue bucket, size bucket, country and
      industry values the buyer-intent searches accept, plus the topic category
      tree. Free.
    category: buyer-intent
    read_only: true
    request:
      method: GET
      path: /v1/buyer-intent/filters
      base_url_override: https://signals.autobound.ai
    output:
      description: The accepted buyer-intent filter values and category tree.
      type: object

  search_buyer_intent_contacts:
    title: Find contacts showing buyer intent
    description: >-
      Given up to ten topic ids, return enriched contacts at companies surging
      on those topics, with firmographics and contactability flags. Pages by
      cursor. Costs 1 credit per contact returned.
    category: buyer-intent
    request:
      method: POST
      path: /v1/buyer-intent/contacts
      base_url_override: https://signals.autobound.ai
      body:
        topic_ids: "${topic_ids}"
        seniority: "${seniority}"
        department: "${department}"
        job_title: "${job_title}"
        industry: "${industry}"
        country: "${country}"
        company_domain: "${company_domain}"
        company_revenue_min: "${company_revenue_min}"
        company_size_min: "${company_size_min}"
        has_email: "${has_email}"
        has_linkedin: "${has_linkedin}"
        has_mobile: "${has_mobile}"
        email_validated: "${email_validated}"
        page_size: "${page_size}"
        cursor: "${cursor}"
    input:
      topic_ids:
        type: array
        description: One to ten intent topic ids from list_buyer_intent_topics.
        items: {type: string}
      seniority:
        type: array
        description: Seniority levels to include.
        optional: true
        items: {type: string}
      department:
        type: array
        description: Departments to include.
        optional: true
        items: {type: string}
      job_title:
        type: string
        description: Job title substring to match, case-insensitive.
        optional: true
      industry:
        type: string
        description: Industry substring to match, case-insensitive.
        optional: true
      country:
        type: array
        description: Company countries to include, as ISO 3166-1 alpha-2 codes.
        optional: true
        items: {type: string}
      company_domain:
        type: string
        description: Restrict to contacts at this company domain.
        optional: true
      company_revenue_min:
        type: string
        description: Lowest company revenue bucket to include.
        optional: true
      company_size_min:
        type: string
        description: Lowest company headcount bucket to include.
        optional: true
      has_email:
        type: boolean
        description: True to return only contacts with a business email.
        optional: true
      has_linkedin:
        type: boolean
        description: True to return only contacts with a LinkedIn URL.
        optional: true
      has_mobile:
        type: boolean
        description: True to return only contacts with a mobile number.
        optional: true
      email_validated:
        type: boolean
        description: True to return only contacts whose email is validated.
        optional: true
      page_size:
        type: integer
        description: Contacts per page.
        optional: true
      cursor:
        type: string
        description: next_cursor from a previous response.
        optional: true
    output:
      description: A page of intent-scored contacts with the next cursor.
      type: object

  search_buyer_intent_companies:
    title: Find companies showing buyer intent
    description: >-
      Given topic ids, return companies surging on them from the latest intent
      snapshot, ranked by composite score -- 60 and above is the surging
      threshold. Costs 1 credit per company-topic row returned.
    category: buyer-intent
    request:
      method: POST
      path: /v1/buyer-intent/companies
      base_url_override: https://signals.autobound.ai
      body:
        topic_ids: "${topic_ids}"
        composite_min: "${composite_min}"
        industry: "${industry}"
        company_domain: "${company_domain}"
        company_revenue_min: "${company_revenue_min}"
        company_size_min: "${company_size_min}"
        has_linkedin: "${has_linkedin}"
        page_size: "${page_size}"
        cursor: "${cursor}"
    input:
      topic_ids:
        type: array
        description: One to ten intent topic ids.
        items: {type: string}
      composite_min:
        type: integer
        description: Minimum composite intent score; 60 and above counts as surging.
        optional: true
      industry:
        type: string
        description: Industry substring to match, case-insensitive.
        optional: true
      company_domain:
        type: string
        description: Restrict to one company domain.
        optional: true
      company_revenue_min:
        type: string
        description: Lowest revenue bucket to include.
        optional: true
      company_size_min:
        type: string
        description: Lowest headcount bucket to include.
        optional: true
      has_linkedin:
        type: boolean
        description: True to return only companies with a LinkedIn URL.
        optional: true
      page_size:
        type: integer
        description: Companies per page.
        optional: true
      cursor:
        type: string
        description: next_cursor from a previous response.
        optional: true
    output:
      description: A page of surging companies with their intent scores.
      type: object

  get_company_intent_timeline:
    title: Get a company's intent timeline
    description: >-
      Read how one company's intent has moved over time, by domain -- the view
      that says whether interest is building or fading.
    category: buyer-intent
    read_only: true
    request:
      method: GET
      path: /v1/buyer-intent/companies/${domain}/timeline
      base_url_override: https://signals.autobound.ai
    input:
      domain:
        type: string
        description: Bare company domain, e.g. stripe.com.
    output:
      description: The company's intent scores over time, by topic.
      type: object

  export_buyer_intent_contacts:
    title: Submit a bulk contact intent export
    description: >-
      Queue an asynchronous export of intent-scored contacts as JSONL, up to
      ten million rows. Returns an export_id to poll with get_export_status.
      Charged at submit time -- a 50-credit base plus 5 per distinct topic,
      refunded if the job fails.
    category: buyer-intent
    request:
      method: POST
      path: /v1/buyer-intent/contacts/export
      base_url_override: https://signals.autobound.ai
      body:
        topic_ids: "${topic_ids}"
        since: "${since}"
        seniority: "${seniority}"
        department: "${department}"
        job_title: "${job_title}"
        industry: "${industry}"
        country: "${country}"
        company_domain: "${company_domain}"
        company_revenue_min: "${company_revenue_min}"
        company_size_min: "${company_size_min}"
        has_email: "${has_email}"
        has_linkedin: "${has_linkedin}"
        has_mobile: "${has_mobile}"
        email_validated: "${email_validated}"
        limit: "${limit}"
    input:
      topic_ids:
        type: array
        description: One to a thousand topic ids; duplicates are charged once.
        items: {type: string}
      since:
        type: string
        description: Lower bound on signal date as YYYY-MM-DD. Defaults to 14 days ago.
        optional: true
      seniority:
        type: array
        description: Seniority levels to include.
        optional: true
        items: {type: string}
      department:
        type: array
        description: Departments to include.
        optional: true
        items: {type: string}
      job_title:
        type: string
        description: Job title substring to match.
        optional: true
      industry:
        type: string
        description: Industry substring to match.
        optional: true
      country:
        type: array
        description: Contact countries to include.
        optional: true
        items: {type: string}
      company_domain:
        type: string
        description: Restrict to one company domain.
        optional: true
      company_revenue_min:
        type: string
        description: Lowest revenue bucket to include.
        optional: true
      company_size_min:
        type: string
        description: Lowest headcount bucket to include.
        optional: true
      has_email:
        type: boolean
        description: True to export only contacts with a business email.
        optional: true
      has_linkedin:
        type: boolean
        description: True to export only contacts with a LinkedIn URL.
        optional: true
      has_mobile:
        type: boolean
        description: True to export only contacts with a mobile number.
        optional: true
      email_validated:
        type: boolean
        description: True to export only contacts whose email is validated.
        optional: true
      limit:
        type: integer
        description: Maximum rows to export.
        optional: true
    output:
      description: The queued export with its export_id.
      type: object

  export_buyer_intent_companies:
    title: Submit a bulk company intent export
    description: >-
      Queue an asynchronous export of intent-surging companies as JSONL.
      Returns an export_id to poll with get_export_status, and is charged the
      same base-plus-per-topic way as the contact export.
    category: buyer-intent
    request:
      method: POST
      path: /v1/buyer-intent/companies/export
      base_url_override: https://signals.autobound.ai
      body:
        topic_ids: "${topic_ids}"
        composite_min: "${composite_min}"
        industry: "${industry}"
        company_domain: "${company_domain}"
        company_revenue_min: "${company_revenue_min}"
        company_size_min: "${company_size_min}"
        has_linkedin: "${has_linkedin}"
        limit: "${limit}"
    input:
      topic_ids:
        type: array
        description: One to a thousand topic ids; duplicates are charged once.
        items: {type: string}
      composite_min:
        type: integer
        description: Minimum composite intent score to include.
        optional: true
      industry:
        type: string
        description: Industry substring to match.
        optional: true
      company_domain:
        type: string
        description: Restrict to one company domain.
        optional: true
      company_revenue_min:
        type: string
        description: Lowest revenue bucket to include.
        optional: true
      company_size_min:
        type: string
        description: Lowest headcount bucket to include.
        optional: true
      has_linkedin:
        type: boolean
        description: True to export only companies with a LinkedIn URL.
        optional: true
      limit:
        type: integer
        description: Maximum rows to export.
        optional: true
    output:
      description: The queued export with its export_id.
      type: object

  get_export_status:
    title: Poll a bulk export job
    description: >-
      Check an export job until it reports ready -- which carries a signed
      download URL good for 24 hours -- or failed. Handles both contact (exp_)
      and company (cexp_) export ids. Free.
    category: buyer-intent
    read_only: true
    request:
      method: GET
      path: /v1/buyer-intent/exports/${export_id}
      base_url_override: https://signals.autobound.ai
    input:
      export_id:
        type: string
        description: Export job id, exp_-prefixed for contacts or cexp_ for companies.
    output:
      description: The job's status and, once ready, its signed download URL.
      type: object

  get_account:
    title: Get account details
    description: >-
      Read the account's name, rate limit and current credit balance. Free.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/account
      base_url_override: https://signals.autobound.ai
    output:
      description: The account's name, rate limit and credit balance.
      type: object

  get_credits:
    title: Get the credit balance
    description: >-
      Read the running credit balance -- granted, used and remaining -- along
      with the per-action cost table for the workspace. There is no monthly
      reset. Free.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/credits
      base_url_override: https://signals.autobound.ai
    output:
      description: Balance, granted and used credits, with the cost table.
      type: object

  get_credit_costs:
    title: Get the per-endpoint credit costs
    description: >-
      Read what each endpoint costs this workspace, including any negotiated
      overrides and the base-plus-per-topic schedule for exports. Free.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/credits/costs
      base_url_override: https://signals.autobound.ai
    output:
      description: The per-action cost table with charge modes.
      type: object

  get_request_logs:
    title: Get recent request logs
    description: >-
      Read the last 30 days of API calls -- path, method, status and credits
      spent -- for debugging failures or auditing consumption. Free.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/logs
      base_url_override: https://signals.autobound.ai
      query:
        type: "${type}"
        path: "${path}"
        method: "${method}"
        status_min: "${status_min}"
        status_max: "${status_max}"
        since: "${since}"
        before: "${before}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      type:
        type: string
        description: Which log entries to return.
        optional: true
        enum: [request, all]
      path:
        type: string
        description: Restrict to calls against this path.
        optional: true
      method:
        type: string
        description: Restrict to calls with this HTTP method.
        optional: true
        enum: [GET, POST, PATCH, DELETE]
      status_min:
        type: integer
        description: Lowest HTTP status to include.
        optional: true
      status_max:
        type: integer
        description: Highest HTTP status to include.
        optional: true
      since:
        type: string
        description: ISO 8601 lower bound on the timestamp. Defaults to 30 days ago.
        optional: true
      before:
        type: string
        description: ISO 8601 upper bound on the timestamp.
        optional: true
      limit:
        type: integer
        description: Log entries to return.
        optional: true
      offset:
        type: integer
        description: Offset into the result set.
        optional: true
    output:
      description: A page of request log entries.
      type: object

  check_health:
    title: Check the Signal API's health
    description: >-
      Ping the Signal API's health endpoint, which is the quickest way to tell a
      credential problem from an outage. Free.
    category: account
    read_only: true
    request:
      method: GET
      path: /v1/health
      base_url_override: https://signals.autobound.ai
    output:
      description: The service's health status.
      type: object
