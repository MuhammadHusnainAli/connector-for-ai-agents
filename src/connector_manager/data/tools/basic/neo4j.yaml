# Neo4j Query API tools -- Cypher over HTTP.
#
# One endpoint does the real work here. `POST /db/<database>/query/v2` takes a
# Cypher statement and a parameter map and returns rows; everything else in
# this pack is either that endpoint with a statement already written, or the
# transaction lifecycle around it.
#
# The connection supplies both halves of the url: `instanceUrl` is the host
# (Aura serves the Query API on 443, a self-managed server on 7473 for HTTPS)
# and `database` is the database the statements run against, so no tool takes a
# database argument. The six admin tools are the exception -- Neo4j only
# accepts `SHOW USERS`, `SHOW DATABASES` and friends against the `system`
# database, so those hard-code `/db/system/query/v2`.
#
# ## The shape of a result
#
# Every response carries `data.fields` (the column names, in order) and
# `data.values` (a list of rows, each a list positionally matching `fields`).
# It is columnar-ish, not a list of objects, and the tools here set
# `response_path: data` so a caller gets that pair rather than the envelope.
# `bookmarks` comes back on every response too.
#
# ## Three things that decide which tool to reach for
#
#   * **`accessMode: "Read"` is enforcement, not a hint.** A statement that
#     writes inside a Read transaction is rejected by the server. Every
#     read-only tool here sets it, which is what makes `read_only: true`
#     truthful on a POST. `run_cypher` defaults to Write; `run_read_query` is
#     the same endpoint with the guarantee;
#   * **parameters are values, never identifiers.** Cypher will not accept
#     `$label` where a label goes, so the tools that need one -- `create_node`,
#     `find_nodes_by_properties`, `create_relationship`, the index and
#     constraint builders -- interpolate the label, type or property name into
#     the statement, backtick-quoted. Property *values* always travel as
#     parameters and are never interpolated. A label argument is therefore a
#     piece of the query rather than data: pass names your own code chose, not
#     strings a third party handed you;
#   * **`elementId()`, not `id()`.** Every tool that addresses one node or
#     relationship takes the string element id and returns it under
#     `elementId`. Neo4j's numeric `id()` is deprecated and can be reused after
#     a delete.
#
# ## Transactions
#
# `begin_transaction` returns `transaction.id`; feed it to `run_in_transaction`
# as many times as needed and finish with `commit_transaction` or
# `rollback_transaction`. On Aura the begin response carries a
# `neo4j-cluster-affinity` header naming the cluster member holding the
# transaction, and every later call in that transaction must send it back --
# each of those tools takes it as `cluster_affinity`. A transaction left open
# expires at the `transaction.expires` timestamp.
#
# ## What is not here
#
# Anything requiring a payload shape the request format cannot express, and
# anything version-dependent enough to be a guess: `SHOW INDEXES WHERE type =
# 'VECTOR'` is used instead of `SHOW VECTOR INDEXES` for that reason. The
# `SHOW USERS` / `SHOW ROLES` / `CREATE DATABASE` tools need Neo4j Enterprise
# or an Aura plan that exposes them, and say so in their notes. Nothing here
# uses APOC, which is not installed everywhere.
#
# Authentication is HTTP Basic with a database user and password, so the API
# gates on that user's Neo4j privileges rather than on scopes, and no tool
# declares any.
#
# Docs: https://neo4j.com/docs/query-api/current/

connector_id: neo4j
display_name: Neo4j (Query API v2)
docs_url: https://neo4j.com/docs/query-api/current/

tools:

  # -- server ----------------------------------------------------------------

  get_server_info:
    title: Get server version and endpoints
    description: >-
      The discovery document at the root of the server: `neo4j_version`,
      `neo4j_edition` (community or enterprise), the templated `query`,
      `transaction` and cluster endpoint urls, the Bolt addresses, and the
      authentication configuration. Cheapest way to confirm a connection works
      and to learn which edition you are talking to before reaching for an
      Enterprise-only tool.
    category: server
    read_only: true
    request:
      method: GET
      path: /
    input: {}
    output:
      description: Server version, edition and the urls it serves.
      type: object
      properties:
        neo4j_version: {type: string, description: "The server version, e.g. 5.26.0 or 2026.03."}
        neo4j_edition: {type: string, description: "community or enterprise. Enterprise-only tools need the latter."}
        query: {type: string, description: "Templated Query API url, with {databaseName} unfilled."}
        transaction: {type: string, description: "Templated transaction endpoint url."}
        bolt_direct: {type: string, description: "bolt:// address for a driver."}
        bolt_routing: {type: string, description: "neo4j:// routing address for a driver."}
        auth_config: {type: object, description: "How the server expects clients to authenticate."}

  get_cluster_overview:
    title: Get DBMS-level cluster information
    description: >-
      Cluster information for the DBMS as a whole. Only meaningful on a
      clustered Neo4j deployment; a single-instance server has nothing to
      report. Use get_database_cluster_status for one database's view instead.
    category: server
    read_only: true
    request:
      method: GET
      path: /dbms/cluster
    input: {}
    output:
      description: DBMS-level cluster state.
      type: object

  get_database_cluster_status:
    title: Get cluster status for the connected database
    description: >-
      Cluster information for the database this connection points at -- whether
      this member can serve it and in what role. Useful when a write is being
      routed somewhere unexpected, or to confirm a read replica is caught up.
      Single-instance servers have little to say here.
    category: server
    read_only: true
    request:
      method: GET
      path: /db/${database}/cluster
    input: {}
    output:
      description: Cluster state for this database.
      type: object

  # -- running Cypher --------------------------------------------------------

  run_cypher:
    title: Run a Cypher statement
    description: >-
      Execute one Cypher statement against the connected database and return its
      rows. This is the general-purpose tool: reach for it when no more specific
      tool in this pack fits.

      Pass values through `parameters`, never by building them into the
      statement -- `MATCH (p:Person {email: $email})` with
      `parameters: {"email": "..."}` is both faster (the plan caches) and the
      only safe way to handle input. Referencing a parameter the call did not
      supply is an error, so send every one the statement names.

      The result is columnar: `data.fields` holds the column names and
      `data.values` a list of rows, each row a list in the same order. Set
      include_counters to find out how many nodes, relationships and properties
      a write actually touched. The statement runs in its own committed
      transaction; use begin_transaction when several statements must succeed or
      fail together.
    category: query
    notes: Runs in Write mode by default, so this tool can modify the graph. run_read_query is the read-only equivalent.
    request:
      method: POST
      path: /db/${database}/query/v2
      headers:
        accept: "${accept}"
      body:
        statement: "${statement}"
        parameters: "${parameters}"
        accessMode: "${access_mode}"
        includeCounters: "${include_counters}"
        maxExecutionTime: "${max_execution_time}"
        impersonatedUser: "${impersonated_user}"
        bookmarks: "${bookmarks}"
        txMetadata: "${tx_metadata}"
        notificationsFilter:
          $when: "${notifications_min_severity} || ${notifications_disabled_categories}"
          minimumSeverityLevel: "${notifications_min_severity}"
          disabledCategories: "${notifications_disabled_categories}"
    input:
      statement:
        type: string
        description: >-
          The Cypher statement. One statement per call. Use $name placeholders
          for every value and supply them in parameters.
        example: "MATCH (p:Person {name: $name}) RETURN p.name AS name, p.age AS age"
      parameters:
        type: object
        description: >-
          Values for the $name placeholders in the statement, as a map. Every
          placeholder the statement uses must appear here.
        optional: true
      access_mode:
        type: string
        description: >-
          Write (the default) allows the statement to modify the graph and is
          routed to a cluster writer. Read rejects any statement that writes and
          is routed to a reader.
        optional: true
        default: Write
        enum: [Write, Read]
      include_counters:
        type: boolean
        description: >-
          Return the update counters alongside the rows -- nodesCreated,
          nodesDeleted, propertiesSet, relationshipsCreated, labelsAdded and the
          rest. The honest way to check a write did what you meant.
        optional: true
      max_execution_time:
        type: integer
        description: Kill the transaction after this many seconds.
        optional: true
        minimum: 1
      impersonated_user:
        type: string
        description: >-
          Run the statement in another user's full security context -- their
          home database and permissions, not the authenticated user's. Requires
          impersonation privileges.
        optional: true
      bookmarks:
        type: array
        description: >-
          Wait until the server has caught up with these bookmarks before
          running, for causal consistency after an earlier write. Bookmarks come
          back on every response.
        optional: true
        items: {type: string}
      tx_metadata:
        type: object
        description: Arbitrary key/value metadata attached to the transaction, visible in SHOW TRANSACTIONS and the query log.
        optional: true
      notifications_min_severity:
        type: string
        description: Only return notifications at or above this severity. OFF suppresses them entirely.
        optional: true
        enum: [INFORMATION, WARNING, "OFF"]
      notifications_disabled_categories:
        type: array
        description: Notification categories to suppress, e.g. PERFORMANCE or DEPRECATION.
        optional: true
        items: {type: string}
      accept:
        type: string
        description: >-
          application/json (the default) returns plain JSON.
          application/vnd.neo4j.query returns typed JSON, where each value is
          {"$type": ..., "_value": ...} -- worth it when the result contains
          dates, points or durations that plain JSON flattens.
        optional: true
        enum: [application/json, application/vnd.neo4j.query]
    output:
      description: The column names and the rows, plus counters when asked for.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "Column names, in order."}
        values: {type: array, description: "One list per row, positionally matching fields."}

  run_read_query:
    title: Run a read-only Cypher statement
    description: >-
      Execute a Cypher statement with the transaction opened in Read mode. The
      server rejects the statement outright if it tries to write, and routes it
      to a cluster reader, so this is the tool to hand an agent that should be
      able to explore the graph but not change it. Otherwise identical to
      run_cypher: parameters go in `parameters`, results come back as
      `fields` and `values`.
    category: query
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "${statement}"
        parameters: "${parameters}"
        accessMode: Read
        maxExecutionTime: "${max_execution_time}"
        bookmarks: "${bookmarks}"
    input:
      statement:
        type: string
        description: The Cypher statement to read with. Anything that writes is rejected by the server.
        example: MATCH (p:Person) RETURN p.name AS name LIMIT 10
      parameters:
        type: object
        description: Values for the $name placeholders in the statement.
        optional: true
      max_execution_time:
        type: integer
        description: Kill the query after this many seconds.
        optional: true
        minimum: 1
      bookmarks:
        type: array
        description: Wait for the server to catch up with these bookmarks before reading.
        optional: true
        items: {type: string}
    output:
      description: The column names and the rows.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "Column names, in order."}
        values: {type: array, description: "One list per row, positionally matching fields."}

  explain_query:
    title: Explain a query without running it
    description: >-
      Return the execution plan Neo4j would use for a statement, without
      executing it and without touching the data. Shows the operators, the
      estimated rows at each step and which index (if any) the planner picked --
      which is how you find the query that is doing a full label scan because a
      property has no index.

      Pass the statement exactly as you would to run_cypher; the EXPLAIN prefix
      is added here, so do not include one yourself. The statement still has to
      be valid Cypher, and parameters still have to be supplied, because the
      planner reads them.
    category: query
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "EXPLAIN ${statement}"
        parameters: "${parameters}"
        accessMode: Read
    input:
      statement:
        type: string
        description: The statement to plan. Do not prefix it with EXPLAIN or PROFILE yourself.
        example: "MATCH (p:Person {email: $email}) RETURN p"
      parameters:
        type: object
        description: Values for the statement's $name placeholders; the planner uses them.
        optional: true
    output:
      description: The query plan, under queryPlan in the response.
      type: object
      properties:
        queryPlan: {type: object, description: "The operator tree with estimated rows and the indexes chosen."}
        notifications: {type: array, description: "Planner warnings, e.g. a missing index or a Cartesian product."}

  profile_query:
    title: Profile a query by running it
    description: >-
      Run a statement and return the plan annotated with what actually happened:
      rows produced and db hits per operator. Unlike explain_query this
      EXECUTES the statement, so a statement that writes will write. Use it to
      find where a slow read is really spending its time; use explain_query when
      you only want the plan.

      The EXPLAIN/PROFILE prefix is added here -- pass the bare statement.
    category: query
    notes: This executes the statement for real. Profile writes on a copy, not on production data.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "PROFILE ${statement}"
        parameters: "${parameters}"
        accessMode: "${access_mode}"
    input:
      statement:
        type: string
        description: The statement to profile. Do not prefix it with PROFILE yourself.
        example: MATCH (p:Person)-[:KNOWS]->(f) WHERE p.name = $name RETURN f.name
      parameters:
        type: object
        description: Values for the statement's $name placeholders.
        optional: true
      access_mode:
        type: string
        description: Read profiles a read-only statement and rejects writes; Write allows the statement to modify the graph.
        optional: true
        default: Read
        enum: [Read, Write]
    output:
      description: The executed plan with real row counts and db hits.
      type: object
      properties:
        profiledQueryPlan: {type: object, description: "The operator tree annotated with rows and dbHits actually incurred."}
        data: {type: object, description: "The rows the statement produced, as fields and values."}

  # -- explicit transactions -------------------------------------------------

  begin_transaction:
    title: Open an explicit transaction
    description: >-
      Start a transaction that stays open across several calls, so a set of
      statements commits or rolls back together. Returns `transaction.id` and
      `transaction.expires`; pass the id to run_in_transaction,
      commit_transaction or rollback_transaction.

      On Aura the response also carries a `neo4j-cluster-affinity` header naming
      the cluster member holding the transaction -- read it and pass it back as
      `cluster_affinity` on every later call in this transaction, or they will
      land on a member that has never heard of it.

      Nothing is durable until commit_transaction. An abandoned transaction
      rolls back on its own at `expires`, holding locks until then.
    category: transactions
    request:
      method: POST
      path: /db/${database}/query/v2/tx
      body:
        accessMode: "${access_mode}"
        maxExecutionTime: "${max_execution_time}"
        bookmarks: "${bookmarks}"
        txMetadata: "${tx_metadata}"
    input:
      access_mode:
        type: string
        description: Write allows the transaction to modify the graph; Read rejects any statement in it that writes.
        optional: true
        default: Write
        enum: [Write, Read]
      max_execution_time:
        type: integer
        description: Kill the transaction after this many seconds.
        optional: true
        minimum: 1
      bookmarks:
        type: array
        description: Wait for the server to catch up with these bookmarks before opening.
        optional: true
        items: {type: string}
      tx_metadata:
        type: object
        description: Metadata to tag the transaction with, visible in SHOW TRANSACTIONS.
        optional: true
    output:
      description: The open transaction's id and expiry.
      type: object
      properties:
        transaction: {type: object, description: "Holds id -- pass it to the other transaction tools -- and expires."}
        bookmarks: {type: array, description: "Bookmarks as of this point."}

  run_in_transaction:
    title: Run a statement inside an open transaction
    description: >-
      Execute one Cypher statement inside a transaction opened by
      begin_transaction. Nothing it writes is visible to anyone else, or
      durable, until commit_transaction. The response repeats the transaction's
      new expiry, which each call pushes out.

      On Aura pass `cluster_affinity` -- the `neo4j-cluster-affinity` header
      value from begin_transaction -- or the call may reach a different cluster
      member and fail to find the transaction.
    category: transactions
    request:
      method: POST
      path: /db/${database}/query/v2/tx/${transaction_id}
      headers:
        neo4j-cluster-affinity: "${cluster_affinity}"
      body:
        statement: "${statement}"
        parameters: "${parameters}"
        includeCounters: "${include_counters}"
    input:
      transaction_id:
        type: string
        description: The transaction id from begin_transaction.
        example: lyU
      statement:
        type: string
        description: The Cypher statement to run in the transaction.
        example: "CREATE (p:Person {name: $name}) RETURN p"
      parameters:
        type: object
        description: Values for the statement's $name placeholders.
        optional: true
      include_counters:
        type: boolean
        description: Return the update counters for this statement.
        optional: true
      cluster_affinity:
        type: string
        description: >-
          The neo4j-cluster-affinity header value from begin_transaction.
          Required on Aura; self-managed servers ignore it.
        optional: true
    output:
      description: The statement's rows, and the transaction's refreshed expiry.
      type: object
      properties:
        data: {type: object, description: "fields and values for this statement."}
        transaction: {type: object, description: "The transaction id and its new expires timestamp."}

  commit_transaction:
    title: Commit an open transaction
    description: >-
      Make everything the transaction did durable and close it. An optional
      final statement runs as part of the commit, saving a round trip. Returns
      the bookmarks representing the committed state -- pass them to a later
      run_cypher to guarantee it sees these changes.

      Pass `cluster_affinity` on Aura, as with run_in_transaction.
    category: transactions
    request:
      method: POST
      path: /db/${database}/query/v2/tx/${transaction_id}/commit
      headers:
        neo4j-cluster-affinity: "${cluster_affinity}"
      body:
        statement: "${statement}"
        parameters: "${parameters}"
    input:
      transaction_id:
        type: string
        description: The transaction to commit.
        example: lyU
      statement:
        type: string
        description: An optional last statement to run as part of the commit.
        optional: true
      parameters:
        type: object
        description: Values for that final statement's $name placeholders.
        optional: true
      cluster_affinity:
        type: string
        description: The neo4j-cluster-affinity header value from begin_transaction. Required on Aura.
        optional: true
    output:
      description: The bookmarks for the committed state.
      type: object
      properties:
        bookmarks: {type: array, description: "Pass to a later call's bookmarks for read-your-writes consistency."}

  rollback_transaction:
    title: Roll back an open transaction
    description: >-
      Discard everything the transaction did and close it -- the database is
      left exactly as it was before begin_transaction. Safe and expected as the
      cleanup path when a statement in the middle of a batch fails. An
      abandoned transaction rolls back by itself at its expiry, but holds locks
      until then, so calling this is better than waiting.
    category: transactions
    destructive: true
    request:
      method: DELETE
      path: /db/${database}/query/v2/tx/${transaction_id}
      headers:
        neo4j-cluster-affinity: "${cluster_affinity}"
    input:
      transaction_id:
        type: string
        description: The transaction to roll back.
        example: lyU
      cluster_affinity:
        type: string
        description: The neo4j-cluster-affinity header value from begin_transaction. Required on Aura.
        optional: true
    output:
      description: Confirmation that the transaction was rolled back.
      type: object

  # -- reading the schema ----------------------------------------------------

  list_labels:
    title: List every node label
    description: >-
      Every node label in use in the database, sorted. The first call to make
      against an unfamiliar graph: the labels here are what create_node,
      count_nodes, list_nodes_by_label and the index builders all take.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.labels() YIELD label RETURN label ORDER BY label
        accessMode: Read
    input: {}
    output:
      description: One row per label, in the single column `label`.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"label\"]."}
        values: {type: array, description: "One single-element row per label."}

  list_relationship_types:
    title: List every relationship type
    description: >-
      Every relationship type in use in the database, sorted. These are the type
      names create_relationship and count_relationships take, and the second
      half of understanding an unfamiliar graph after list_labels.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.relationshipTypes() YIELD relationshipType RETURN relationshipType ORDER BY relationshipType
        accessMode: Read
    input: {}
    output:
      description: One row per relationship type.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"relationshipType\"]."}
        values: {type: array, description: "One single-element row per type."}

  list_property_keys:
    title: List every property key
    description: >-
      Every property key registered in the database, sorted. Note that this is
      the whole key namespace, not per-label -- a key here may belong to nodes,
      relationships or both. Use get_node_type_properties when you need to know
      which label actually carries which property.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.propertyKeys() YIELD propertyKey RETURN propertyKey ORDER BY propertyKey
        accessMode: Read
    input: {}
    output:
      description: One row per property key.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"propertyKey\"]."}
        values: {type: array, description: "One single-element row per key."}

  get_schema_visualization:
    title: Get the graph schema as nodes and relationships
    description: >-
      The database's schema drawn as a graph: a node per label and a
      relationship per (label)-[type]->(label) combination actually present in
      the data. This is the single best call for orienting an agent in an
      unfamiliar database -- it answers "what connects to what" in one round
      trip, which list_labels and list_relationship_types separately do not.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.schema.visualization()
        accessMode: Read
    input: {}
    output:
      description: One row holding the schema's nodes and relationships.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"nodes\", \"relationships\"]."}
        values: {type: array, description: "A single row: the label nodes, and the typed connections between them."}

  get_node_type_properties:
    title: Get which properties each label carries
    description: >-
      One row per (label, property) pair actually observed, with the property's
      Cypher type and whether it is present on every node of that label. This is
      the closest Neo4j gets to a table schema, and what to read before writing
      a query that filters on a property you have not seen before.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.schema.nodeTypeProperties()
        accessMode: Read
    input: {}
    output:
      description: Per-label property names, types and mandatory flags.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "nodeType, nodeLabels, propertyName, propertyTypes, mandatory."}
        values: {type: array, description: "One row per label/property pair."}

  get_relationship_type_properties:
    title: Get which properties each relationship type carries
    description: >-
      The relationship equivalent of get_node_type_properties: one row per
      (relationship type, property) pair, with its type and whether it is always
      present. Read it before filtering on a relationship property.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: CALL db.schema.relTypeProperties()
        accessMode: Read
    input: {}
    output:
      description: Per-type property names, types and mandatory flags.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "relType, propertyName, propertyTypes, mandatory."}
        values: {type: array, description: "One row per type/property pair."}

  list_indexes:
    title: List every index
    description: >-
      All indexes on the database with their name, type (RANGE, TEXT, POINT,
      FULLTEXT, LOOKUP, VECTOR), the labels or types and properties they cover,
      their state and population percentage. A query that is slow because it
      scans rather than seeks is usually explained here -- cross-reference with
      explain_query.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW INDEXES
        accessMode: Read
    input: {}
    output:
      description: Every index and its state.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "id, name, state, populationPercent, type, entityType, labelsOrTypes, properties, indexProvider and more."}
        values: {type: array, description: "One row per index."}

  list_vector_indexes:
    title: List vector indexes
    description: >-
      Only the vector indexes, with the label and property each covers and its
      state. The `name` values here are exactly what vector_search_nodes takes
      as index_name, and `state` must be ONLINE before a search will use it -- a
      freshly created index is POPULATING and returns nothing yet.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW INDEXES WHERE type = 'VECTOR'
        accessMode: Read
    input: {}
    output:
      description: The vector indexes and their state.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "name, state, type, entityType, labelsOrTypes, properties and more."}
        values: {type: array, description: "One row per vector index."}

  list_constraints:
    title: List every constraint
    description: >-
      All constraints on the database -- uniqueness, property existence, node
      key, property type -- with the label or type and properties each applies
      to. Worth reading before a bulk write: a uniqueness constraint is what
      turns an innocent CREATE into a failed transaction.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW CONSTRAINTS
        accessMode: Read
    input: {}
    output:
      description: Every constraint and what it applies to.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "id, name, type, entityType, labelsOrTypes, properties, ownedIndex."}
        values: {type: array, description: "One row per constraint."}

  list_procedures:
    title: List available procedures
    description: >-
      Every procedure this server can run, with its signature, description and
      mode (READ, WRITE, SCHEMA, DBMS). The honest way to find out whether APOC,
      GDS or the vector procedures are actually installed before writing a
      statement that calls them.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW PROCEDURES
        accessMode: Read
    input: {}
    output:
      description: Every callable procedure and its signature.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "name, description, mode, worksOnSystem, signature and more."}
        values: {type: array, description: "One row per procedure."}

  list_functions:
    title: List available functions
    description: >-
      Every Cypher function this server exposes, with its signature, return type
      and category. Same purpose as list_procedures -- confirm a function exists
      on this deployment before building a statement around it.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW FUNCTIONS
        accessMode: Read
    input: {}
    output:
      description: Every available function and its signature.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "name, category, description, signature, isBuiltIn and more."}
        values: {type: array, description: "One row per function."}

  list_transactions:
    title: List running transactions
    description: >-
      Transactions currently executing on the server, with the statement each is
      running, who started it, how long it has been alive and its status. This
      is what to call when the database has gone quiet and something is holding
      locks -- the `txMetadata` any of this pack's tools attached shows up here.
    category: schema
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: SHOW TRANSACTIONS
        accessMode: Read
    input: {}
    output:
      description: Every transaction currently running.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "database, transactionId, currentQuery, username, startTime, status, elapsedTime and more."}
        values: {type: array, description: "One row per running transaction."}

  # -- managing the schema ---------------------------------------------------

  create_range_index:
    title: Create a range index on a property
    description: >-
      Create the ordinary index Neo4j uses for equality, range and prefix
      lookups on one property of one label. This is the fix for a query that
      explain_query shows doing a NodeByLabelScan. Idempotent -- IF NOT EXISTS
      means calling it twice is harmless.

      The index builds in the background: list_indexes shows it POPULATING
      before ONLINE, and it is not used by queries until then.
    category: schema-management
    notes: index_name, label and property are interpolated into the Cypher, backtick-quoted. Pass names your own code chose.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE INDEX `${index_name}` IF NOT EXISTS FOR (n:`${label}`) ON (n.`${property}`)"
    input:
      index_name:
        type: string
        description: A name for the index, used later by drop_index.
        example: person_email
      label:
        type: string
        description: The node label to index.
        example: Person
      property:
        type: string
        description: The property to index.
        example: email
    output:
      description: Empty on success; the index builds asynchronously.
      type: object

  create_full_text_index:
    title: Create a full-text index on a property
    description: >-
      Create a Lucene-backed full-text index over one property of one label, so
      full_text_search_nodes can do word and fuzzy matching on it. Different
      from a range index: it tokenises text rather than indexing the whole
      value, so it answers "contains these words" rather than "equals this
      string".

      Idempotent, and builds in the background -- wait for ONLINE in
      list_indexes before searching.
    category: schema-management
    notes: index_name, label and property are interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE FULLTEXT INDEX `${index_name}` IF NOT EXISTS FOR (n:`${label}`) ON EACH [n.`${property}`]"
    input:
      index_name:
        type: string
        description: A name for the index; pass it to full_text_search_nodes as index_name.
        example: article_body
      label:
        type: string
        description: The node label to index.
        example: Article
      property:
        type: string
        description: The text property to index.
        example: body
    output:
      description: Empty on success; the index builds asynchronously.
      type: object

  create_vector_index:
    title: Create a vector index for embeddings
    description: >-
      Create an approximate-nearest-neighbour index over an embedding property,
      which is what makes vector_search_nodes possible. `dimensions` must match
      the embedding model exactly -- 1536 for OpenAI text-embedding-3-small,
      3072 for -large, 768 for many sentence-transformers -- and cannot be
      changed afterwards without dropping the index.

      Pick `cosine` for normalised embeddings (almost always the right answer)
      and `euclidean` otherwise. Idempotent, and populates in the background:
      searches return nothing until list_vector_indexes reports ONLINE.
    category: schema-management
    notes: >-
      Requires Neo4j 5.11 or later, and any Aura instance. index_name, label and
      property are interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE VECTOR INDEX `${index_name}` IF NOT EXISTS FOR (n:`${label}`) ON (n.`${property}`) OPTIONS {indexConfig: {`vector.dimensions`: ${dimensions}, `vector.similarity_function`: '${similarity_function}'}}"
    input:
      index_name:
        type: string
        description: A name for the index; pass it to vector_search_nodes as index_name.
        example: chunk_embedding
      label:
        type: string
        description: The node label carrying the embeddings.
        example: Chunk
      property:
        type: string
        description: The property holding the embedding vector.
        example: embedding
      dimensions:
        type: integer
        description: The embedding length. Must match the model that produces the vectors.
        minimum: 1
        maximum: 4096
        example: "1536"
      similarity_function:
        type: string
        description: cosine for normalised embeddings, euclidean for raw distances.
        optional: true
        default: cosine
        enum: [cosine, euclidean]
    output:
      description: Empty on success; the index populates asynchronously.
      type: object

  create_unique_constraint:
    title: Create a uniqueness constraint
    description: >-
      Require that no two nodes with a label share a value for a property, and
      get a backing index for free -- so this both guarantees correctness and
      speeds up lookups on that property. The natural companion to merge_node,
      which relies on the key property being unique to be safe under
      concurrency.

      Fails if the data already violates it; fix the duplicates first. IF NOT
      EXISTS makes repeat calls harmless.
    category: schema-management
    notes: constraint_name, label and property are interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE CONSTRAINT `${constraint_name}` IF NOT EXISTS FOR (n:`${label}`) REQUIRE n.`${property}` IS UNIQUE"
    input:
      constraint_name:
        type: string
        description: A name for the constraint, used later by drop_constraint.
        example: person_email_unique
      label:
        type: string
        description: The node label the constraint applies to.
        example: Person
      property:
        type: string
        description: The property that must be unique across that label.
        example: email
    output:
      description: Empty on success; fails if existing data already violates the constraint.
      type: object

  create_property_existence_constraint:
    title: Require a property to be present
    description: >-
      Require that every node with a label has a non-null value for a property,
      so incomplete records are rejected at write time rather than discovered
      later. Fails if any existing node violates it.

      Neo4j Enterprise and Aura only -- Community rejects this with a syntax
      error, so check get_server_info's `neo4j_edition` first.
    category: schema-management
    notes: Enterprise / Aura only. constraint_name, label and property are interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE CONSTRAINT `${constraint_name}` IF NOT EXISTS FOR (n:`${label}`) REQUIRE n.`${property}` IS NOT NULL"
    input:
      constraint_name:
        type: string
        description: A name for the constraint.
        example: person_email_exists
      label:
        type: string
        description: The node label the constraint applies to.
        example: Person
      property:
        type: string
        description: The property that must always be present.
        example: email
    output:
      description: Empty on success; fails if existing nodes lack the property.
      type: object

  drop_index:
    title: Drop an index
    description: >-
      Remove an index by name. Queries that relied on it start scanning instead,
      which can turn a fast lookup into a full label scan, so check
      explain_query on the affected queries before doing this. IF EXISTS means
      dropping an index that is already gone is not an error.

      An index owned by a constraint cannot be dropped directly -- drop the
      constraint instead.
    category: schema-management
    destructive: true
    notes: index_name is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "DROP INDEX `${index_name}` IF EXISTS"
    input:
      index_name:
        type: string
        description: The index to drop, from list_indexes.
        example: person_email
    output:
      description: Empty on success.
      type: object

  drop_constraint:
    title: Drop a constraint
    description: >-
      Remove a constraint by name, along with the index backing it. The
      guarantee goes with it: duplicate or missing values become possible from
      the next write onward. IF EXISTS makes repeat calls harmless.
    category: schema-management
    destructive: true
    notes: constraint_name is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "DROP CONSTRAINT `${constraint_name}` IF EXISTS"
    input:
      constraint_name:
        type: string
        description: The constraint to drop, from list_constraints.
        example: person_email_unique
    output:
      description: Empty on success.
      type: object

  # -- nodes -----------------------------------------------------------------

  list_nodes_by_label:
    title: List nodes with a label
    description: >-
      A page of nodes carrying one label, each returned as its element id, its
      labels and its full property map. Ordered by element id so paging is
      stable. Use find_nodes_by_properties when you need to filter, and
      count_nodes when you only want the total.
    category: nodes
    read_only: true
    notes: label is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n:`${label}`) RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties ORDER BY elementId(n) LIMIT toInteger($limit)"
        parameters:
          limit: "${limit}"
        accessMode: Read
    input:
      label:
        type: string
        description: The node label to list.
        example: Person
      limit:
        type: integer
        description: How many nodes to return.
        optional: true
        default: 25
        minimum: 1
        maximum: 1000
    output:
      description: One row per node, as elementId, labels and properties.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "One row per node."}

  find_nodes_by_properties:
    title: Find nodes matching an exact set of property values
    description: >-
      Nodes with a label whose properties all equal the values in `filters` --
      an AND of exact matches, which covers most "look this record up" cases.
      Filter values travel as a Cypher parameter, so they are never
      interpolated and may be any JSON value.

      For anything more than equality -- ranges, contains, OR -- write the
      statement yourself and use run_read_query.
    category: nodes
    read_only: true
    notes: label is interpolated into the Cypher, backtick-quoted; the filter values are parameters.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n:`${label}`) WHERE all(key IN keys($filters) WHERE n[key] = $filters[key]) RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties LIMIT toInteger($limit)"
        parameters:
          filters: "${filters}"
          limit: "${limit}"
        accessMode: Read
    input:
      label:
        type: string
        description: The node label to search.
        example: Person
      filters:
        type: object
        description: >-
          Property names to the exact values they must equal. Every entry must
          match. Pass {} to match every node with the label.
        example: '{"email": "ada@example.com"}'
      limit:
        type: integer
        description: How many nodes to return.
        optional: true
        default: 25
        minimum: 1
        maximum: 1000
    output:
      description: One row per matching node.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "One row per matching node."}

  get_node:
    title: Get a node by element id
    description: >-
      One node by its element id -- the string `elementId` every other tool in
      this pack returns. Comes back with its labels and its full property map,
      or no rows at all if the node has been deleted.
    category: nodes
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties"
        parameters:
          element_id: "${element_id}"
        accessMode: Read
    input:
      element_id:
        type: string
        description: The node's element id.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
    output:
      description: The node, or no rows if it no longer exists.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "A single row, or empty."}

  count_nodes:
    title: Count nodes with a label
    description: >-
      How many nodes carry one label. Cheap -- Neo4j answers from its label
      count store rather than by scanning -- so this is the right way to size a
      graph before writing a query that would page through it.
    category: nodes
    read_only: true
    notes: label is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n:`${label}`) RETURN count(n) AS count"
        accessMode: Read
    input:
      label:
        type: string
        description: The node label to count.
        example: Person
    output:
      description: A single row holding the count.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"count\"]."}
        values: {type: array, description: "One row, one number."}

  create_node:
    title: Create a node
    description: >-
      Create a node with one label and a set of properties, and return it with
      its new element id. Property values are sent as a parameter, so any JSON
      value works, including lists and nested-free maps of scalars.

      This always creates. When the node might already exist, use merge_node
      instead -- CREATE will happily make a duplicate.
    category: nodes
    notes: label is interpolated into the Cypher, backtick-quoted; the properties are a parameter.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CREATE (n:`${label}`) SET n = $properties RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties"
        parameters:
          properties: "${properties}"
        includeCounters: true
    input:
      label:
        type: string
        description: The label to give the new node.
        example: Person
      properties:
        type: object
        description: The node's properties. Pass {} for a node with none.
        example: '{"name": "Ada", "email": "ada@example.com"}'
    output:
      description: The created node, and the update counters.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "A single row: the node as created."}

  merge_node:
    title: Create a node, or update it if it already exists
    description: >-
      Find the node with this label whose key property equals key_value, or
      create it if there is none, then merge `properties` into it. Idempotent,
      which is what makes it the right tool for syncing external records into
      the graph -- run it twice and you still have one node.

      Put a uniqueness constraint on the key property first
      (create_unique_constraint). Without one, two concurrent merges can each
      decide to create, and you end up with the duplicate this tool exists to
      prevent.
    category: nodes
    notes: label and key_property are interpolated into the Cypher, backtick-quoted; key_value and properties are parameters.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MERGE (n:`${label}` {`${key_property}`: $key_value}) ON CREATE SET n += $properties ON MATCH SET n += $properties RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties"
        parameters:
          key_value: "${key_value}"
          properties: "${properties}"
        includeCounters: true
    input:
      label:
        type: string
        description: The node label to merge on.
        example: Person
      key_property:
        type: string
        description: The property that identifies the node. Should have a uniqueness constraint.
        example: email
      key_value:
        type: string
        description: The value of that key property identifying this node.
        example: ada@example.com
      properties:
        type: object
        description: >-
          Properties to set on the node whether it was created or found.
          Existing properties not mentioned here are left alone. Pass {} to
          only ensure the node exists.
        example: '{"name": "Ada"}'
    output:
      description: The node as it now stands, plus counters saying whether it was created.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "A single row: the merged node."}

  update_node_properties:
    title: Update some of a node's properties
    description: >-
      Merge properties into a node, leaving every property not mentioned
      untouched. This is the safe update -- the `+=` semantics. To wipe the
      properties not mentioned, use replace_node_properties instead. Setting a
      property to null removes it.
    category: nodes
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id SET n += $properties RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties"
        parameters:
          element_id: "${element_id}"
          properties: "${properties}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The node to update.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      properties:
        type: object
        description: Properties to set. Anything omitted keeps its current value; null removes a property.
        example: '{"age": 43}'
    output:
      description: The node after the update.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "A single row, or empty if the id matched nothing."}

  replace_node_properties:
    title: Replace all of a node's properties
    description: >-
      Overwrite a node's property map entirely: anything not in `properties` is
      deleted from the node. The `=` semantics, as opposed to
      update_node_properties' `+=`. Labels and relationships are not touched.
      Read the node with get_node first unless you genuinely mean to discard
      what is there.
    category: nodes
    destructive: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id SET n = $properties RETURN elementId(n) AS elementId, labels(n) AS labels, properties(n) AS properties"
        parameters:
          element_id: "${element_id}"
          properties: "${properties}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The node whose properties to replace.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      properties:
        type: object
        description: The node's complete new property map. Everything else on the node is removed.
        example: '{"name": "Ada", "email": "ada@example.com"}'
    output:
      description: The node with its new property map.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\"]."}
        values: {type: array, description: "A single row, or empty if the id matched nothing."}

  add_node_label:
    title: Add a label to a node
    description: >-
      Give an existing node an additional label. Nodes may carry several, and
      labels are how Neo4j indexes and constrains them, so adding one can bring
      a node into the scope of an existing index or constraint -- and a
      uniqueness constraint it now violates will make this fail.
    category: nodes
    notes: label is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id SET n:`${label}` RETURN elementId(n) AS elementId, labels(n) AS labels"
        parameters:
          element_id: "${element_id}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The node to label.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      label:
        type: string
        description: The label to add.
        example: Employee
    output:
      description: The node and its labels after the change.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\"]."}
        values: {type: array, description: "A single row."}

  remove_node_label:
    title: Remove a label from a node
    description: >-
      Take one label off a node, leaving the node and its other labels in place.
      The node drops out of any index or constraint scoped to that label, and
      out of the results of list_nodes_by_label for it.
    category: nodes
    destructive: true
    notes: label is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id REMOVE n:`${label}` RETURN elementId(n) AS elementId, labels(n) AS labels"
        parameters:
          element_id: "${element_id}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The node to change.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      label:
        type: string
        description: The label to remove.
        example: Employee
    output:
      description: The node and its remaining labels.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\"]."}
        values: {type: array, description: "A single row."}

  delete_node:
    title: Delete a node and its relationships
    description: >-
      Delete one node, detaching it first so every relationship attached to it
      goes too. That cascade is the point -- Neo4j refuses to delete a connected
      node otherwise -- but it means this can remove far more than one record.
      Call get_node_relationships first if you are not sure what hangs off it.

      Returns the element id of what was deleted, or no rows if the id matched
      nothing.
    category: nodes
    destructive: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n) WHERE elementId(n) = $element_id WITH n, elementId(n) AS deleted DETACH DELETE n RETURN deleted"
        parameters:
          element_id: "${element_id}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The node to delete, along with every relationship on it.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
    output:
      description: The deleted element id, and counters showing how many relationships went with it.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"deleted\"]."}
        values: {type: array, description: "A single row, or empty if nothing matched."}

  # -- relationships ---------------------------------------------------------

  get_node_relationships:
    title: List a node's relationships
    description: >-
      Every relationship attached to one node, in either direction, with the
      node at the other end. Each row says whether the relationship is
      `outgoing` or `incoming` relative to the node you asked about, which is
      what a bare Cypher match in both directions loses.

      The first call to make before delete_node, and the building block for
      walking a graph one hop at a time.
    category: relationships
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (n)-[r]-(m) WHERE elementId(n) = $element_id RETURN elementId(r) AS elementId, type(r) AS type, properties(r) AS properties, CASE WHEN elementId(startNode(r)) = $element_id THEN 'outgoing' ELSE 'incoming' END AS direction, elementId(m) AS otherElementId, labels(m) AS otherLabels, properties(m) AS otherProperties LIMIT toInteger($limit)"
        parameters:
          element_id: "${element_id}"
          limit: "${limit}"
        accessMode: Read
    input:
      element_id:
        type: string
        description: The node whose relationships to list.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      limit:
        type: integer
        description: How many relationships to return.
        optional: true
        default: 50
        minimum: 1
        maximum: 1000
    output:
      description: One row per relationship, with its direction and the node on the other end.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "elementId, type, properties, direction, otherElementId, otherLabels, otherProperties."}
        values: {type: array, description: "One row per attached relationship."}

  get_neighborhood:
    title: Get the subgraph around a node
    description: >-
      Walk out from one node up to `depth` hops and return the paths found, each
      as its list of nodes and its list of relationships. This is the tool for
      "give me the context around this record" -- one call instead of repeated
      get_node_relationships.

      Depth is expensive: every extra hop multiplies the paths explored, so keep
      it at 2 or 3 on a densely connected graph and lean on `limit`. Depth is
      capped at 5 for that reason.
    category: relationships
    read_only: true
    notes: depth is validated as an integer and interpolated into the Cypher's variable-length pattern.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH path = (n)-[*1..${depth}]-(m) WHERE elementId(n) = $element_id RETURN [node IN nodes(path) | {elementId: elementId(node), labels: labels(node), properties: properties(node)}] AS nodes, [rel IN relationships(path) | {elementId: elementId(rel), type: type(rel), startElementId: elementId(startNode(rel)), endElementId: elementId(endNode(rel))}] AS relationships LIMIT toInteger($limit)"
        parameters:
          element_id: "${element_id}"
          limit: "${limit}"
        accessMode: Read
    input:
      element_id:
        type: string
        description: The node to start from.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      depth:
        type: integer
        description: How many hops out to walk. Each extra hop costs a lot on a dense graph.
        optional: true
        default: 2
        minimum: 1
        maximum: 5
      limit:
        type: integer
        description: How many paths to return.
        optional: true
        default: 50
        minimum: 1
        maximum: 500
    output:
      description: One row per path, each holding its nodes and its relationships.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"nodes\", \"relationships\"]."}
        values: {type: array, description: "One row per path found."}

  create_relationship:
    title: Create a relationship between two nodes
    description: >-
      Connect two existing nodes with a directed, typed relationship, from
      from_element_id to to_element_id. Both nodes must already exist -- this
      creates the edge, not the endpoints.

      Always creates, so calling it twice makes two parallel relationships. Use
      merge_relationship when the edge should exist at most once.
    category: relationships
    notes: type is interpolated into the Cypher, backtick-quoted; the properties are a parameter.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (a) WHERE elementId(a) = $from_element_id MATCH (b) WHERE elementId(b) = $to_element_id CREATE (a)-[r:`${type}`]->(b) SET r = $properties RETURN elementId(r) AS elementId, type(r) AS type, properties(r) AS properties"
        parameters:
          from_element_id: "${from_element_id}"
          to_element_id: "${to_element_id}"
          properties: "${properties}"
        includeCounters: true
    input:
      from_element_id:
        type: string
        description: The node the relationship starts at.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      to_element_id:
        type: string
        description: The node the relationship points to.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:1"
      type:
        type: string
        description: The relationship type. Conventionally SCREAMING_SNAKE_CASE.
        example: KNOWS
      properties:
        type: object
        description: Properties for the relationship. Pass {} for none.
        example: '{"since": 2019}'
    output:
      description: The created relationship.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"type\", \"properties\"]."}
        values: {type: array, description: "A single row, or empty if either endpoint did not exist."}

  merge_relationship:
    title: Create a relationship only if it is not already there
    description: >-
      Ensure exactly one relationship of this type runs from one node to the
      other, creating it if absent, then merge `properties` into it. Idempotent,
      so this is what to use when syncing edges from an external source --
      create_relationship would add a parallel copy each run.

      Both endpoints must already exist.
    category: relationships
    notes: type is interpolated into the Cypher, backtick-quoted; the properties are a parameter.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH (a) WHERE elementId(a) = $from_element_id MATCH (b) WHERE elementId(b) = $to_element_id MERGE (a)-[r:`${type}`]->(b) SET r += $properties RETURN elementId(r) AS elementId, type(r) AS type, properties(r) AS properties"
        parameters:
          from_element_id: "${from_element_id}"
          to_element_id: "${to_element_id}"
          properties: "${properties}"
        includeCounters: true
    input:
      from_element_id:
        type: string
        description: The node the relationship starts at.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:0"
      to_element_id:
        type: string
        description: The node the relationship points to.
        example: "4:ff04df25-ff2b-4b55-98f8-6888297b025e:1"
      type:
        type: string
        description: The relationship type to ensure exists between them.
        example: KNOWS
      properties:
        type: object
        description: Properties to set whether the relationship was created or found. Pass {} for none.
        example: '{"since": 2019}'
    output:
      description: The relationship, plus counters saying whether it was created.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"type\", \"properties\"]."}
        values: {type: array, description: "A single row."}

  update_relationship_properties:
    title: Update a relationship's properties
    description: >-
      Merge properties into one relationship, leaving anything not mentioned
      alone. Setting a property to null removes it. The relationship's type and
      endpoints cannot be changed -- delete it and create a new one for that.
    category: relationships
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH ()-[r]->() WHERE elementId(r) = $element_id SET r += $properties RETURN elementId(r) AS elementId, type(r) AS type, properties(r) AS properties"
        parameters:
          element_id: "${element_id}"
          properties: "${properties}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The relationship's element id, from get_node_relationships.
      properties:
        type: object
        description: Properties to set. Anything omitted keeps its value; null removes a property.
        example: '{"since": 2020}'
    output:
      description: The relationship after the update.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"type\", \"properties\"]."}
        values: {type: array, description: "A single row, or empty if the id matched nothing."}

  delete_relationship:
    title: Delete a relationship
    description: >-
      Remove one relationship by element id. Both nodes it connected stay; only
      the edge goes. Unlike delete_node this cascades to nothing.
    category: relationships
    destructive: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH ()-[r]->() WHERE elementId(r) = $element_id WITH r, elementId(r) AS deleted DELETE r RETURN deleted"
        parameters:
          element_id: "${element_id}"
        includeCounters: true
    input:
      element_id:
        type: string
        description: The relationship to delete, from get_node_relationships.
    output:
      description: The deleted element id, or no rows if nothing matched.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"deleted\"]."}
        values: {type: array, description: "A single row, or empty."}

  count_relationships:
    title: Count relationships of a type
    description: >-
      How many relationships of one type exist in the database. Answered from
      the count store rather than by traversing, so it is cheap even on a large
      graph -- the right way to size a type before querying it.
    category: relationships
    read_only: true
    notes: type is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "MATCH ()-[r:`${type}`]->() RETURN count(r) AS count"
        accessMode: Read
    input:
      type:
        type: string
        description: The relationship type to count.
        example: KNOWS
    output:
      description: A single row holding the count.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"count\"]."}
        values: {type: array, description: "One row, one number."}

  # -- search ----------------------------------------------------------------

  full_text_search_nodes:
    title: Full-text search over nodes
    description: >-
      Search a full-text index for nodes matching a Lucene query, ranked by
      relevance score. The query supports the Lucene syntax -- quoted phrases,
      `AND`/`OR`/`NOT`, `title:neo4j` to target one indexed field, `~` for fuzzy
      matching, `*` for prefixes -- which is what makes this different from an
      exact property match.

      The index must already exist and be ONLINE; create it with
      create_full_text_index and check list_indexes.
    category: search
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CALL db.index.fulltext.queryNodes($index_name, $query) YIELD node, score RETURN elementId(node) AS elementId, labels(node) AS labels, properties(node) AS properties, score ORDER BY score DESC LIMIT toInteger($limit)"
        parameters:
          index_name: "${index_name}"
          query: "${query}"
          limit: "${limit}"
        accessMode: Read
    input:
      index_name:
        type: string
        description: The full-text index to search, from list_indexes.
        example: article_body
      query:
        type: string
        description: A Lucene query string. Phrases in quotes, AND/OR/NOT, field:value, ~ for fuzzy, * for prefix.
        example: '"graph database" AND neo4j'
      limit:
        type: integer
        description: How many results to return.
        optional: true
        default: 10
        minimum: 1
        maximum: 500
    output:
      description: Matching nodes with their relevance scores, best first.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\", \"score\"]."}
        values: {type: array, description: "One row per hit, ordered by score descending."}

  full_text_search_relationships:
    title: Full-text search over relationships
    description: >-
      The relationship counterpart of full_text_search_nodes: searches a
      full-text index built over relationship properties and returns the
      matching relationships with their scores. Same Lucene query syntax. The
      index has to have been created for relationships, not nodes.
    category: search
    read_only: true
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CALL db.index.fulltext.queryRelationships($index_name, $query) YIELD relationship, score RETURN elementId(relationship) AS elementId, type(relationship) AS type, properties(relationship) AS properties, score ORDER BY score DESC LIMIT toInteger($limit)"
        parameters:
          index_name: "${index_name}"
          query: "${query}"
          limit: "${limit}"
        accessMode: Read
    input:
      index_name:
        type: string
        description: The relationship full-text index to search, from list_indexes.
        example: review_text
      query:
        type: string
        description: A Lucene query string.
        example: excellent OR outstanding
      limit:
        type: integer
        description: How many results to return.
        optional: true
        default: 10
        minimum: 1
        maximum: 500
    output:
      description: Matching relationships with their scores, best first.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"type\", \"properties\", \"score\"]."}
        values: {type: array, description: "One row per hit."}

  vector_search_nodes:
    title: Find the nearest nodes to an embedding
    description: >-
      Approximate nearest-neighbour search over a vector index: give an
      embedding and get back the top_k most similar nodes with their similarity
      scores. This is the retrieval half of graph RAG -- find the semantically
      closest chunks, then walk out from them with get_neighborhood to pull in
      their context.

      The query vector must have exactly the dimensions the index was created
      with, and must come from the same embedding model as the stored vectors --
      mixing models gives confident nonsense. The index must be ONLINE; a
      POPULATING one returns nothing.
    category: search
    read_only: true
    notes: Requires Neo4j 5.11 or later, and a vector index created by create_vector_index.
    request:
      method: POST
      path: /db/${database}/query/v2
      body:
        statement: "CALL db.index.vector.queryNodes($index_name, toInteger($top_k), $query_vector) YIELD node, score RETURN elementId(node) AS elementId, labels(node) AS labels, properties(node) AS properties, score ORDER BY score DESC"
        parameters:
          index_name: "${index_name}"
          top_k: "${top_k}"
          query_vector: "${query_vector}"
        accessMode: Read
    input:
      index_name:
        type: string
        description: The vector index to search, from list_vector_indexes.
        example: chunk_embedding
      query_vector:
        type: array
        description: >-
          The query embedding. Must be exactly as long as the index's
          dimensions, and produced by the same model as the indexed vectors.
        items: {type: number}
      top_k:
        type: integer
        description: How many neighbours to return.
        optional: true
        default: 5
        minimum: 1
        maximum: 1000
    output:
      description: The nearest nodes and their similarity scores, closest first.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "[\"elementId\", \"labels\", \"properties\", \"score\"]."}
        values: {type: array, description: "One row per neighbour; score is the similarity, higher is closer."}

  # -- administration (the system database) ----------------------------------

  list_databases:
    title: List the databases on this server
    description: >-
      Every database the DBMS hosts, with its current and requested status, its
      role on this member, its home/default flag and any error. Runs against the
      `system` database, which is where Neo4j keeps this.

      The `name` values here are what the connection's `database` setting takes,
      so this is how to find out what else is queryable on the same instance.
    category: admin
    read_only: true
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: SHOW DATABASES
        accessMode: Read
    input: {}
    output:
      description: Every database and its status.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "name, type, aliases, access, address, role, requestedStatus, currentStatus, statusMessage, default, home."}
        values: {type: array, description: "One row per database, per member."}

  show_current_user:
    title: Show the authenticated user
    description: >-
      Who this connection is authenticated as, and whether the account is
      suspended or must change its password. The cheapest confirmation that the
      credentials work and are the ones you think they are, before blaming a
      permissions error on something else.
    category: admin
    read_only: true
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: SHOW CURRENT USER
        accessMode: Read
    input: {}
    output:
      description: The authenticated user's record.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "user, roles, passwordChangeRequired, suspended, home."}
        values: {type: array, description: "A single row."}

  list_users:
    title: List database users
    description: >-
      Every user account on the DBMS, with the roles each holds and whether they
      are suspended. Runs against the `system` database and needs privileges to
      show users -- an ordinary application user will be refused.

      Neo4j Enterprise and Aura only; Community has a single user and no
      role-based access control.
    category: admin
    read_only: true
    notes: Enterprise / Aura only, and requires user-administration privileges.
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: SHOW USERS
        accessMode: Read
    input: {}
    output:
      description: Every user account and its roles.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "user, roles, passwordChangeRequired, suspended, home."}
        values: {type: array, description: "One row per user."}

  list_roles:
    title: List roles
    description: >-
      Every role defined on the DBMS -- the built-in ones (admin, architect,
      publisher, editor, reader, PUBLIC) and any custom roles. Pair with
      list_users to work out who can do what.

      Neo4j Enterprise and Aura only, and requires role-administration
      privileges.
    category: admin
    read_only: true
    notes: Enterprise / Aura only, and requires role-administration privileges.
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: SHOW ROLES
        accessMode: Read
    input: {}
    output:
      description: Every role on the DBMS.
      type: object
      response_path: data
      properties:
        fields: {type: array, description: "role, and on newer versions whether it is built-in."}
        values: {type: array, description: "One row per role."}

  create_database:
    title: Create a database
    description: >-
      Create a new, empty database on the DBMS. Idempotent -- IF NOT EXISTS
      means creating one that is already there is not an error. Creation is
      asynchronous: poll list_databases until `currentStatus` is `online`.

      Neo4j Enterprise and Aura instances with multi-database enabled only.
      Community supports exactly one database plus `system`.
    category: admin
    notes: Enterprise, or an Aura instance with multi-database. database_name is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: "CREATE DATABASE `${database_name}` IF NOT EXISTS"
    input:
      database_name:
        type: string
        description: The name for the new database. Letters, digits, dots and dashes; starts with a letter.
        example: analytics
    output:
      description: Empty on success; the database comes online asynchronously.
      type: object

  drop_database:
    title: Drop a database
    description: >-
      Destroy a database and everything in it. Irreversible, and there is no
      snapshot taken on the way out -- on Aura, take a create_snapshot through
      the `neo4j-aura` connector first if the data matters. IF EXISTS means
      dropping one that is already gone is not an error.

      Neo4j Enterprise and multi-database Aura instances only. The `system`
      database cannot be dropped.
    category: admin
    destructive: true
    notes: Enterprise, or an Aura instance with multi-database. database_name is interpolated into the Cypher, backtick-quoted.
    request:
      method: POST
      path: /db/system/query/v2
      body:
        statement: "DROP DATABASE `${database_name}` IF EXISTS"
    input:
      database_name:
        type: string
        description: The database to destroy, from list_databases.
        example: analytics
    output:
      description: Empty on success.
      type: object
