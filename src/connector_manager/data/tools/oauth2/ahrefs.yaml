  list_backlinks:
    title: List backlinks
    description: >-
      List the backlinks pointing at a target with the referring page, anchor, link attributes
      and the linking domain's rating. Group by similar links or one per domain with aggregation,
      and add lost links with history. Metered: API units per row and per column selected,
      50 minimum.
    category: site_explorer
    read_only: true
    request:
      method: GET
      path: /v3/site-explorer/all-backlinks
      query:
        limit: ${limit}
        order_by: ${order_by}
        where: ${where}
        select: ${select}
        protocol: ${protocol}
        target: ${target}
        mode: ${mode}
        aggregation: ${aggregation}
        history: ${history}
    input:
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      order_by:
        type: string
        description: 'Comma-separated columns to sort by, each with optional :asc or :desc,
          e.g. ahrefs_rank_source:desc. Any selectable column works. Not sortable here: `link_group_count`.'
        optional: true
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: ahrefs_rank_source, ahrefs_rank_target, alt, anchor,
          broken_redirect_new_target, broken_redirect_reason, broken_redirect_source, class_c,
          discovered_status, domain_rating_source, domain_rating_target, drop_reason, encoding,
          first_seen, first_seen_link, http_code, http_crawl, ip_source, is_alternate, is_canonical,
          is_content, is_dofollow, is_form, is_frame, is_homepage_link, is_image, is_lost,
          is_new, is_nofollow, is_non_html, is_redirect, is_redirect_lost, is_root_source,
          is_root_target, is_rss, is_spam, is_sponsored, is_text, is_ugc, js_crawl, languages,
          last_seen, last_visited, len_url_redirect, link_group_count, link_type, linked_domains_source_domain,
