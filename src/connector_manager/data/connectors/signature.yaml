# Connector definitions: SIGNATURE auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
emarsys:
  auth_mode: SIGNATURE
  categories:
  - marketing
  credentials:
    password:
      description: The Client Secret of your Emarsys WSSE API Credentials
      pattern: ^[a-zA-Z0-9-]+$
      title: Client Secret
      type: string
    username:
      description: The ID of your Emarsys WSSE API Credentials
      pattern: ^[a-zA-Z0-9_-]+$
      title: ID
      type: string
  display_name: Emarsys Core API (WSSE)
  proxy:
    base_url: https://api.emarsys.net
    headers:
      content-type: application/json
      x-wsse: ${accessToken}
    retry:
      at:
      - x-ratelimit-reset
    verification:
      endpoints:
      - /api/v2/settings
      headers:
        content-type: application/json
      method: GET
  signature:
    protocol: WSSE
  token:
    expires_in_ms: 300000
