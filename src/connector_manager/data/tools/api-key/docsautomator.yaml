          taskId, Google Sheets rowNumber) is folded in automatically — your own keys are never overwritten.
        optional: true
      existing_pdfs:
        type: array
        description: PDF URLs to merge or prepend to the generated document.
        optional: true
        items:
          type: string
      doc_template_link:
        type: string
        description: Override the automation's Google Doc template URL for this request only.
        optional: true
    output:
      description: Document created successfully (sync mode)
