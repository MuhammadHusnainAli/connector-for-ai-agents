  get_absences:
    title: List absences 🌍
    description: List absences 🌍 Returns the absences in a company. This list is paginated. The output
      can be filtered given some fields like contractId. By default, only approved absences are returned,
      but this can be changed by setting status filter. Calls GET /companies/{companyId}/absences on Payfit's
      API.
    category: companies
    request:
      method: GET
      path: /companies/${company_id}/absences
      query:
        nextPageToken: ${next_page_token}
        maxResults: ${max_results}
        contractId: ${contract_id}
        status: ${status}
        beginDate: ${begin_date}
        endDate: ${end_date}
    input:
      company_id:
        type: string
        description: The id of the company
      next_page_token:
        type: string
        description: The encoded pagination token
        optional: true
      max_results:
        type: string
        description: 'Allows to define the maximum number of items to fetch at once. (Max: 50, Default:
          10)'
        optional: true
        default: '10'
      contract_id:
        type: string
        description: Filter by contractId.
        optional: true
      status:
        type: string
        description: 'Filter by status. Defaults to approved. Multiple statuses can be provided, separated
          by commas, for example status=approved,pendingapproval. If all is provided, all absences will
          be returned, regardless of their status. Possible statuses are: - approved - pendingapproval
          - declined - cancelled - pendingcancellation'
        optional: true
      begin_date:
        type: string
        description: Defines the minimal begin date of absences to fetch. Every absences with params.beginDate
          <= absences.endDate will be included.
        optional: true
      end_date:
        type: string
        description: Defines the maximal end date of absences to fetch. Every absences with params.endDate
          = absences.startDate will be included.
        optional: true
    output:
      description: The absences of the collaborators in the company.
      type: object
    read_only: true
