  replace_routine:
    title: Replace routine
    description: 'Updates information in an existing routine. The update method replaces the entire Routine
      resource. # IAM Permissions Requires the bigquery.routines.update permission on the routine.'
    category: routines
    request:
      method: PUT
      path: /bigquery/v2/projects/${project_id}/datasets/${dataset_id}/routines/${routine_id}
      body:
        determinismLevel: ${determinism_level}
        securityMode: ${security_mode}
        sparkOptions: ${spark_options}
        arguments: ${arguments}
        returnType: ${return_type}
        importedLibraries: ${imported_libraries}
        routineType: ${routine_type}
        description: ${description}
        language: ${language}
        definitionBody: ${definition_body}
        routineReference: ${routine_reference}
        returnTableType: ${return_table_type}
        externalRuntimeOptions: ${external_runtime_options}
        pythonOptions: ${python_options}
        dataGovernanceType: ${data_governance_type}
        remoteFunctionOptions: ${remote_function_options}
        strictMode: ${strict_mode}
    input:
      dataset_id:
        type: string
        description: Required. Dataset ID of the routine to update
      project_id:
        type: string
        description: Required. Project ID of the routine to update
      routine_id:
        type: string
        description: Required. Routine ID of the routine to update
      determinism_level:
        type: string
        description: Optional. The determinism level of the JavaScript UDF, if defined.
        optional: true
        enum:
        - DETERMINISM_LEVEL_UNSPECIFIED
        - DETERMINISTIC
        - NOT_DETERMINISTIC
      security_mode:
        type: string
        description: Optional. The security mode of the routine, if defined. If not defined, the security
          mode is automatically determined from the routine's configuration.
        optional: true
        enum:
        - SECURITY_MODE_UNSPECIFIED
        - DEFINER
        - INVOKER
      spark_options:
        type: string
        description: Optional. Spark specific options.
        optional: true
      arguments:
        type: array
        items:
          type: string
        description: Optional.
        optional: true
      return_type:
        type: string
        description: Optional if language = "SQL"; required otherwise. Cannot be set if routine_type =
          "TABLE_VALUED_FUNCTION". If absent, the return type is inferred from definition_body at query
          time in each query that references this routine. If present, then the evaluated result will
          be cast to the specified returne
        optional: true
      imported_libraries:
        type: array
        items:
          type: string
        description: Optional. If language = "JAVASCRIPT", this field stores the path of the imported
          JAVASCRIPT libraries.
        optional: true
      routine_type:
        type: string
        description: Required. The type of routine.
        optional: true
        enum:
        - ROUTINE_TYPE_UNSPECIFIED
        - SCALAR_FUNCTION
        - PROCEDURE
        - TABLE_VALUED_FUNCTION
        - AGGREGATE_FUNCTION
      description:
        type: string
        description: Optional. The description of the routine, if defined.
        optional: true
      language:
        type: string
        description: Optional. Defaults to "SQL" if remote_function_options field is absent, not set otherwise.
        optional: true
        enum:
        - LANGUAGE_UNSPECIFIED
        - SQL
        - JAVASCRIPT
        - PYTHON
        - JAVA
        - SCALA
      definition_body:
        type: string
        description: 'Required. The body of the routine. For functions, this is the expression in the
          AS clause. If language = "SQL", it is the substring inside (but excluding) the parentheses.
          For example, for the function created with the following statement: CREATE FUNCTION JoinLines(x
          string, y string) as (concat(x,'
        optional: true
      routine_reference:
        type: string
        description: Required. Reference describing the ID of this routine.
        optional: true
      return_table_type:
        type: string
        description: Optional. Can be set only if routine_type = "TABLE_VALUED_FUNCTION". If absent, the
          return table type is inferred from definition_body at query time in each query that references
          this routine. If present, then the columns in the evaluated table result will be cast to match
          the column types specified
        optional: true
      external_runtime_options:
        type: string
        description: Optional. Options for the runtime of the external system executing the routine. This
          field is only applicable for Python UDFs. Preview
        optional: true
      python_options:
        type: string
        description: Optional. Options for the Python UDF. Preview
        optional: true
      data_governance_type:
        type: string
        description: Optional. If set to DATA_MASKING, the function is validated and made available as
          a masking function. For more information, see Create custom masking routines.
        optional: true
        enum:
        - DATA_GOVERNANCE_TYPE_UNSPECIFIED
        - DATA_MASKING
      remote_function_options:
        type: string
        description: Optional. Remote function specific options.
        optional: true
      strict_mode:
        type: boolean
        description: Optional. Use this option to catch many common errors. Error checking is not exhaustive,
          and successfully creating a procedure doesn't guarantee that the procedure will successfully
          execute at runtime. If strictMode is set to TRUE, the procedure body is further checked for
          errors such as non-existen
        optional: true
    output:
      description: The Routine resource.
      type: object
    scopes_any:
    - bigquery
    - cloud-platform
