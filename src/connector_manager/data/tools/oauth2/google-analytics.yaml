          The API can also return fewer rows than the requested limit, if there aren't as many dimension
          values as the limit. F
        optional: true
      order_bys:
        type: array
        items:
          type: string
        description: Specifies how rows are ordered in the response.
        optional: true
      metrics:
        type: array
        items:
          type: string
        description: The metrics requested and displayed.
        optional: true
      minute_ranges:
        type: array
        items:
          type: string
        description: The minute ranges of event data to read. If unspecified, one minute range for the
          last 30 minutes will be used. If multiple minute ranges are requested, each response row will
          contain a zero based minute range index. If two minute ranges overlap, the event data for the
          overlapping minutes is include
        optional: true
      dimension_filter:
        type: string
        description: The filter clause of dimensions. Metrics cannot be used in this filter.
        optional: true
      return_property_quota:
        type: boolean
        description: Toggles whether to return the current state of this Google Analytics property's Realtime
          quota. Quota is returned in [PropertyQuota](#PropertyQuota).
        optional: true
      metric_aggregations:
        type: array
        items:
          type: string
        description: Aggregation of metrics. Aggregated metric values will be shown in rows where the
          dimension_values are set to "RESERVED_(MetricAggregation)".
        optional: true
      dimensions:
        type: array
        items:
          type: string
        description: The dimensions requested and displayed.
        optional: true
      metric_filter:
        type: string
        description: The filter clause of metrics. Applied at post aggregation phase, similar to SQL having-clause.
          Dimensions cannot be used in this filter.
        optional: true
    output:
      description: The RunRealtimeReportResponse resource.
      type: object
    scopes_any:
    - analytics
    - analytics.readonly
