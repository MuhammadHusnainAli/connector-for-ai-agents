# Databricks (Workspace Level) tools -- compute, jobs, SQL, Unity Catalog and serving.
#
# This is the *workspace* data plane: clusters, jobs, pipelines, SQL,
# notebooks, Unity Catalog objects, model serving and dashboards. Creating
# workspaces, managing account identity and reading the bill is the
# `databricks-account` connector, with its own credentials.
#
# **Every tool sets `base_url_override`, and that is deliberate.** The
# connector's base url pins `/api/2.0`, but this API spans five versions at
# once -- clusters are `/api/2.1`, jobs are `/api/2.2`, execution contexts are
# still `/api/1.2`, Unity Catalog is `/api/2.1`, and request-for-access is
# `/api/3.0`. Overriding the base to the workspace host and carrying the full
# path is the only way one pack can reach all of them. The raw request tools at
# the end do the same, so a path passed to them also starts with `/api/...`.
#
# Four things shape how these tools are used:
#
#   * **compute costs money the moment it starts.** `create_cluster`,
#     `start_cluster`, `create_sql_warehouse`, `create_serving_endpoint`,
#     `create_vector_search_endpoint` and `create_instance_pool` all provision
#     real cloud instances that bill until something stops them. Auto-stop and
#     autotermination settings are the difference between a query and a
#     weekend's spend;
#   * **`execute_sql_statement` and `execute_command` run arbitrary code.** The
#     first runs whatever SQL you give it -- including DROP and DELETE --
#     against real tables; the second runs Python, Scala or R on a cluster with
#     that cluster's access to your data and network. Nothing in this package
#     inspects what is being run;
#   * **managed and external are not the same delete.** Deleting a *managed*
#     table, schema, catalog or volume deletes the underlying data; deleting an
#     *external* one removes only the registration. `force` on a catalog or
#     schema delete takes everything beneath it;
#   * **PUT replaces, PATCH merges** -- and the difference bites hardest on
#     `reset_job` (which drops any schedule the payload omits) and
#     `set_permissions` (which revokes anyone the ACL omits).
#
# Grants are the other thing worth care: `update_grants` on a catalog is
# inherited by every schema and table inside it, and `get_effective_grants` --
# not the direct grants -- is what a query is actually checked against.
#
# Docs: https://docs.databricks.com/api/workspace/introduction

connector_id: databricks-workspace
display_name: Databricks (Workspace Level)
docs_url: https://docs.databricks.com/api/workspace/introduction

tools:

  get_current_user:
    title: Get the current user
    description: >-
      The identity this connection authenticates as, with its entitlements.
      The cheapest call that proves the credential works and says whose
      permissions every other call runs under.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Me
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: The requested record.
      type: object

  list_workspace_users:
    title: List workspace users
    description: >-
      The users in this workspace, over SCIM. Account-level identity is
      managed separately -- these are the principals that can act here.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Users
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter: "${filter}"
        count: "${count}"
        startIndex: "${start_index}"
    input:
      filter:
        type: string
        description: SCIM filter expression, e.g. userName eq "a@b.com".
        optional: true
      count:
        type: integer
        description: How many results per page.
        optional: true
      start_index:
        type: integer
        description: One-based index of the first result.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_workspace_user:
    title: Get a workspace user
    description: >-
      One workspace user's SCIM record, with their groups and entitlements.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Users/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The requested record.
      type: object

  list_workspace_groups:
    title: List workspace groups
    description: >-
      The workspace's SCIM groups. Groups are what permissions should normally
      be granted to, rather than individuals.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Groups
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter: "${filter}"
        count: "${count}"
    input:
      filter:
        type: string
        description: SCIM filter expression.
        optional: true
      count:
        type: integer
        description: How many results per page.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_workspace_group:
    title: Get a workspace group
    description: >-
      One group's SCIM record, including its members and entitlements.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/Groups/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The requested record.
      type: object

  patch_workspace_group:
    title: Patch a workspace group
    description: >-
      Apply SCIM patch operations to a workspace group -- how a member is
      normally added or removed, since it does not rewrite the whole
      membership.
    category: identity
    request:
      method: PATCH
      path: /api/2.0/preview/scim/v2/Groups/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  list_workspace_service_principals:
    title: List workspace service principals
    description: >-
      The service principals with access to this workspace -- the machine
      identities jobs and integrations run as.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/preview/scim/v2/ServicePrincipals
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter: "${filter}"
        count: "${count}"
    input:
      filter:
        type: string
        description: SCIM filter expression.
        optional: true
      count:
        type: integer
        description: How many results per page.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_permissions:
    title: Get an object's permissions
    description: >-
      Who can do what with one object -- a cluster, job, notebook, warehouse,
      pipeline or dashboard. One endpoint covers every object type;
      `request_object_type` names which.
    category: identity
    read_only: true
    request:
      method: GET
      path: /api/2.0/permissions/${request_object_type}/${request_object_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      request_object_type:
        type: string
        description: The object type permissions are being read or set on, e.g. "clusters", "jobs", "notebooks".
      request_object_id:
        type: string
        description: The object's id.
    output:
      description: The requested record.
      type: object

  set_permissions:
    title: Replace an object's permissions
    description: >-
      Replace an object's access control list wholesale. Anything omitted is
      revoked, so a partial list silently removes people -- update_permissions
      is the additive counterpart.
    category: identity
    request:
      method: PUT
      path: /api/2.0/permissions/${request_object_type}/${request_object_id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      request_object_type:
        type: string
        description: The object type permissions are being read or set on, e.g. "clusters", "jobs", "notebooks".
      request_object_id:
        type: string
        description: The object's id.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  update_permissions:
    title: Update an object's permissions
    description: >-
      Add or change entries in an object's access control list, leaving the
      rest alone. The safe way to grant one person access without rewriting
      the whole ACL.
    category: identity
    request:
      method: PATCH
      path: /api/2.0/permissions/${request_object_type}/${request_object_id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      request_object_type:
        type: string
        description: The object type permissions are being read or set on, e.g. "clusters", "jobs", "notebooks".
      request_object_id:
        type: string
        description: The object's id.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  list_clusters:
    title: List clusters
    description: >-
      The clusters in the workspace with their state, node types and
      configuration. Terminated clusters are included, which is usually what
      you want -- they can be restarted.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.1/clusters/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        page_token: "${page_token}"
        page_size: "${page_size}"
    input:
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      page_size:
        type: integer
        description: How many clusters per page.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_cluster:
    title: Get a cluster
    description: >-
      One cluster's full configuration and current state. `state` is what to
      poll after start_cluster -- a cluster is not usable until it reaches
      RUNNING.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.1/clusters/get
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        cluster_id: "${cluster_id}"
    input:
      cluster_id:
        type: string
        description: The cluster id.
    output:
      description: The requested record.
      type: object

  create_cluster:
    title: Create a cluster
    description: >-
      Create and start a cluster. This provisions real cloud instances and
      starts billing DBUs immediately; `autotermination_minutes` is what stops
      an idle cluster running up a bill overnight.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  edit_cluster:
    title: Edit a cluster
    description: >-
      Change a cluster's configuration. The cluster is restarted to apply it,
      so anything running on it is interrupted -- this is not a live update.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/edit
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_cluster:
    title: Partially update a cluster
    description: >-
      Change specific fields of a cluster with an update mask, rather than
      resending the whole definition. Still restarts the cluster where the
      changed field requires it.
    category: compute
    request:
      method: POST
      path: /api/2.1/clusters/update
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  start_cluster:
    title: Start a cluster
    description: >-
      Start a terminated cluster. Provisioning takes minutes and bills from
      the moment instances come up; poll get_cluster until the state is
      RUNNING.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/start
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  restart_cluster:
    title: Restart a cluster
    description: >-
      Restart a running cluster. Everything currently executing on it is
      killed, and attached notebooks lose their state.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/restart
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  resize_cluster:
    title: Resize a cluster
    description: >-
      Change a cluster's worker count or autoscale range. Scaling down evicts
      executors, which can fail work in flight.
    category: compute
    request:
      method: POST
      path: /api/2.1/clusters/resize
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  terminate_cluster:
    title: Terminate a cluster
    description: >-
      Terminate a cluster, releasing its instances and stopping the DBU spend.
      The configuration survives and the cluster can be restarted -- this is
      not a permanent delete.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  permanently_delete_cluster:
    title: Permanently delete a cluster
    description: >-
      Permanently remove a cluster and its configuration. Unlike terminate
      this cannot be undone, and jobs pinned to the cluster id start failing.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.1/clusters/permanent-delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  pin_cluster:
    title: Pin a cluster
    description: >-
      Pin a cluster so it survives the automatic cleanup that removes
      long-terminated clusters from the list.
    category: compute
    request:
      method: POST
      path: /api/2.1/clusters/pin
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  unpin_cluster:
    title: Unpin a cluster
    description: >-
      Unpin a cluster, letting Databricks eventually clean it up once it has
      been terminated long enough.
    category: compute
    request:
      method: POST
      path: /api/2.1/clusters/unpin
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  change_cluster_owner:
    title: Change a cluster's owner
    description: >-
      Transfer a cluster to another owner. The new owner's permissions govern
      what the cluster can reach, which can change what jobs on it are able to
      do.
    category: compute
    request:
      method: POST
      path: /api/2.1/clusters/change-owner
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_cluster_events:
    title: List a cluster's events
    description: >-
      The event log for one cluster -- creation, resizes, terminations and the
      reason for each. Where to look when a cluster died unexpectedly.
    category: compute
    read_only: true
    request:
      method: POST
      path: /api/2.1/clusters/events
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_node_types:
    title: List available node types
    description: >-
      The instance types available for clusters in this workspace, with their
      memory, cores and DBU cost.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.1/clusters/list-node-types
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_spark_versions:
    title: List available runtime versions
    description: >-
      The Databricks Runtime versions available, with the `spark_version` key
      a cluster definition takes.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.1/clusters/spark-versions
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_cluster_zones:
    title: List availability zones
    description: >-
      The cloud availability zones clusters can be placed in for this
      workspace.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.1/clusters/list-zones
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_cluster_policies:
    title: List cluster policies
    description: >-
      The cluster policies in the workspace. Policies constrain what a user
      may configure -- node types, autotermination, maximum size -- and are
      the main lever on compute cost.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/policies/clusters/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        sort_column: "${sort_column}"
        sort_order: "${sort_order}"
    input:
      sort_column:
        type: string
        description: Which column to sort by.
        optional: true
      sort_order:
        type: string
        description: Sort direction.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_cluster_policy:
    title: Get a cluster policy
    description: >-
      One cluster policy and its definition -- the rules it imposes on any
      cluster created under it.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/policies/clusters/get
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        policy_id: "${policy_id}"
    input:
      policy_id:
        type: string
        description: The cluster policy id.
    output:
      description: The requested record.
      type: object

  create_cluster_policy:
    title: Create a cluster policy
    description: >-
      Create a cluster policy. A policy that omits an autotermination rule is
      how a workspace ends up with clusters running all weekend.
    category: compute
    request:
      method: POST
      path: /api/2.0/policies/clusters/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  edit_cluster_policy:
    title: Edit a cluster policy
    description: >-
      Change a cluster policy's definition. Existing clusters are not
      reconfigured, but they become non-compliant -- see
      enforce_cluster_compliance.
    category: compute
    request:
      method: POST
      path: /api/2.0/policies/clusters/edit
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_cluster_policy:
    title: Delete a cluster policy
    description: >-
      Delete a cluster policy. Clusters created under it keep running, but the
      constraint on future clusters is gone.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.0/policies/clusters/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_cluster_compliance:
    title: Check a cluster's policy compliance
    description: >-
      Whether one cluster still complies with its policy, and which fields
      drifted. Useful after a policy change.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/policies/clusters/get-compliance
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        cluster_id: "${cluster_id}"
    input:
      cluster_id:
        type: string
        description: The cluster id.
    output:
      description: The requested record.
      type: object

  enforce_cluster_compliance:
    title: Enforce policy compliance on a cluster
    description: >-
      Bring a cluster back into line with its policy. This rewrites the
      cluster's configuration and restarts it, interrupting anything running.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.0/policies/clusters/enforce-compliance
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_instance_pools:
    title: List instance pools
    description: >-
      The instance pools in the workspace. Pools keep idle instances warm so
      clusters start faster, and bill for those idle instances.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/instance-pools/list
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_instance_pool:
    title: Get an instance pool
    description: >-
      One instance pool's configuration and current instance counts.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/instance-pools/get
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        instance_pool_id: "${instance_pool_id}"
    input:
      instance_pool_id:
        type: string
        description: The instance pool id.
    output:
      description: The requested record.
      type: object

  create_instance_pool:
    title: Create an instance pool
    description: >-
      Create an instance pool. `min_idle_instances` above zero keeps cloud
      instances running -- and billing -- whether or not any cluster is using
      them.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.0/instance-pools/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  edit_instance_pool:
    title: Edit an instance pool
    description: >-
      Change an instance pool's configuration, including its idle instance
      count and idle timeout.
    category: compute
    request:
      method: POST
      path: /api/2.0/instance-pools/edit
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_instance_pool:
    title: Delete an instance pool
    description: >-
      Delete an instance pool. Clusters using it must be terminated first, and
      its idle instances are released.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.0/instance-pools/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_library_statuses:
    title: List library statuses across clusters
    description: >-
      Which libraries are installed on every cluster, and whether each
      installed cleanly. Where to look when a job fails on an import.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/libraries/all-cluster-statuses
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_cluster_library_status:
    title: Get one cluster's library statuses
    description: >-
      The libraries on one cluster and the state of each installation.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/2.0/libraries/cluster-status
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        cluster_id: "${cluster_id}"
    input:
      cluster_id:
        type: string
        description: The cluster id.
    output:
      description: The requested record.
      type: object

  install_libraries:
    title: Install libraries on a cluster
    description: >-
      Install libraries on a cluster. Installation happens asynchronously and
      most libraries need a restart to take effect, so poll the status rather
      than assuming success.
    category: compute
    request:
      method: POST
      path: /api/2.0/libraries/install
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  uninstall_libraries:
    title: Uninstall libraries from a cluster
    description: >-
      Mark libraries for removal from a cluster. They are actually removed on
      the next restart, so code importing them keeps working until then.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/2.0/libraries/uninstall
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  execute_command:
    title: Execute a command on a cluster
    description: >-
      Run a command in an execution context on a cluster -- arbitrary Python,
      Scala, SQL or R against your data and network. Asynchronous: poll
      get_command_status for the result.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/1.2/commands/execute
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_command_status:
    title: Get a command's status
    description: >-
      The state and result of a command submitted with execute_command.
    category: compute
    read_only: true
    request:
      method: GET
      path: /api/1.2/commands/status
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        clusterId: "${cluster_id}"
        contextId: "${context_id}"
        commandId: "${command_id}"
    input:
      cluster_id:
        type: string
        description: The cluster id.
      context_id:
        type: string
        description: The execution context id.
      command_id:
        type: string
        description: The command id.
    output:
      description: The requested record.
      type: object

  cancel_command:
    title: Cancel a command
    description: >-
      Cancel a running command on a cluster. Work already committed by the
      command is not rolled back.
    category: compute
    request:
      method: POST
      path: /api/1.2/commands/cancel
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  create_execution_context:
    title: Create an execution context
    description: >-
      Create an execution context on a cluster -- the REPL session commands
      run inside. Contexts hold state between commands and count against the
      cluster's limit.
    category: compute
    request:
      method: POST
      path: /api/1.2/contexts/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  destroy_execution_context:
    title: Destroy an execution context
    description: >-
      Destroy an execution context, freeing its slot on the cluster and
      discarding its state.
    category: compute
    destructive: true
    request:
      method: POST
      path: /api/1.2/contexts/destroy
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_jobs:
    title: List jobs
    description: >-
      The jobs defined in the workspace. Paged with `page_token`;
      `expand_tasks` includes each job's task graph, which makes the response
      much larger.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        limit: "${limit}"
        page_token: "${page_token}"
        expand_tasks: "${expand_tasks}"
        name: "${name}"
    input:
      limit:
        type: integer
        description: How many jobs per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      expand_tasks:
        type: boolean
        description: Include each job's tasks and cluster settings.
        optional: true
      name:
        type: string
        description: Filter to jobs with this exact name.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_job:
    title: Get a job
    description: >-
      One job's full definition -- its tasks, schedule, clusters and
      notification settings.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/get
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        job_id: "${job_id}"
        page_token: "${page_token}"
    input:
      job_id:
        type: integer
        description: The job id.
      page_token:
        type: string
        description: Paging token, for a job with many tasks.
        optional: true
    output:
      description: The requested record.
      type: object

  create_job:
    title: Create a job
    description: >-
      Create a job from a task definition. If it carries a schedule or a
      trigger it starts running on its own from that point, spending compute
      without further prompting.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/create
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_job:
    title: Partially update a job
    description: >-
      Change part of a job's settings, leaving the rest alone. Prefer this
      over reset_job, which replaces the whole definition.
    category: jobs
    request:
      method: POST
      path: /api/2.2/jobs/update
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  reset_job:
    title: Replace a job's definition
    description: >-
      Overwrite a job's entire definition. Anything the payload omits is
      removed -- tasks, schedules and notifications included -- which is the
      usual way a job quietly loses its schedule.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/reset
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_job:
    title: Delete a job
    description: >-
      Delete a job and its run history. Irreversible, and anything triggering
      it by id starts failing.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  run_job_now:
    title: Run a job now
    description: >-
      Trigger a job immediately, optionally with parameter overrides. This
      spends compute and does whatever the job does -- writing tables, sending
      mail, calling other systems.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/run-now
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  submit_job_run:
    title: Submit a one-off run
    description: >-
      Run a task graph once without creating a job. The right shape for an
      ad-hoc workload; the run appears in the history but there is no job to
      schedule or re-run.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/runs/submit
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_job_runs:
    title: List job runs
    description: >-
      Runs across the workspace or for one job, filterable by state and time.
      The history a failure investigation starts from.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/runs/list
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        job_id: "${job_id}"
        active_only: "${active_only}"
        completed_only: "${completed_only}"
        limit: "${limit}"
        page_token: "${page_token}"
        run_type: "${run_type}"
        start_time_from: "${start_time_from}"
        start_time_to: "${start_time_to}"
        expand_tasks: "${expand_tasks}"
    input:
      job_id:
        type: integer
        description: Restrict to one job.
        optional: true
      active_only:
        type: boolean
        description: Only runs that are still active.
        optional: true
      completed_only:
        type: boolean
        description: Only runs that have finished.
        optional: true
      limit:
        type: integer
        description: How many runs per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      run_type:
        type: string
        description: Filter by run type.
        optional: true
      start_time_from:
        type: integer
        description: Only runs started at or after this epoch millisecond.
        optional: true
      start_time_to:
        type: integer
        description: Only runs started at or before this epoch millisecond.
        optional: true
      expand_tasks:
        type: boolean
        description: Include each run's tasks.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_job_run:
    title: Get a job run
    description: >-
      One run's state, timings and per-task results. What to poll after
      run_job_now -- `state.life_cycle_state` and `state.result_state` are the
      two fields that matter.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/runs/get
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        run_id: "${run_id}"
        include_history: "${include_history}"
        include_resolved_values: "${include_resolved_values}"
        page_token: "${page_token}"
    input:
      run_id:
        type: integer
        description: The run id.
      include_history:
        type: boolean
        description: Include the run's repair history.
        optional: true
      include_resolved_values:
        type: boolean
        description: Include resolved parameter values.
        optional: true
      page_token:
        type: string
        description: Paging token, for a run with many tasks.
        optional: true
    output:
      description: The requested record.
      type: object

  get_job_run_output:
    title: Get a run's output
    description: >-
      The output of a single task run -- notebook result, logs and any error.
      This is where a failure's actual message lives, rather than in the run
      record.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/runs/get-output
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        run_id: "${run_id}"
    input:
      run_id:
        type: integer
        description: The task run id, not the parent run id.
    output:
      description: The requested record.
      type: object

  export_job_run:
    title: Export a run
    description: >-
      Export a run's notebook and results as HTML, for sharing or archiving
      outside Databricks.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.2/jobs/runs/export
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        run_id: "${run_id}"
        views_to_export: "${views_to_export}"
    input:
      run_id:
        type: integer
        description: The run id.
      views_to_export:
        type: string
        description: Which views to export.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  cancel_job_run:
    title: Cancel a run
    description: >-
      Cancel a run that is still in progress. Work the run has already
      committed -- rows written, mail sent -- is not undone.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/runs/cancel
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  cancel_all_job_runs:
    title: Cancel all runs of a job
    description: >-
      Cancel every active run of a job at once. A bulk stop, and equally bulk
      in what it half-completes.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/runs/cancel-all
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  repair_job_run:
    title: Repair a run
    description: >-
      Re-run only the failed tasks of a run, reusing what succeeded. Cheaper
      and safer than re-running the whole job when one task failed late.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/runs/repair
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  delete_job_run:
    title: Delete a run
    description: >-
      Delete a non-active run and its output. Irreversible, and it removes the
      evidence a failure investigation would use.
    category: jobs
    destructive: true
    request:
      method: POST
      path: /api/2.2/jobs/runs/delete
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_job_compliance:
    title: Check a job's policy compliance
    description: >-
      Whether one job's clusters still comply with their policy, and which
      fields drifted.
    category: jobs
    read_only: true
    request:
      method: GET
      path: /api/2.0/policies/jobs/get-compliance
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        job_id: "${job_id}"
    input:
      job_id:
        type: integer
        description: The job id.
    output:
      description: The requested record.
      type: object

  enforce_job_compliance:
    title: Enforce policy compliance on a job
    description: >-
      Rewrite a job's cluster settings to satisfy its policy. Changes the job
      definition, so the next run behaves differently from the last.
    category: jobs
    request:
      method: POST
      path: /api/2.0/policies/jobs/enforce-compliance
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  list_pipelines:
    title: List pipelines
    description: >-
      The Delta Live Tables pipelines in the workspace, with their state and
      latest update.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /api/2.0/pipelines
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter: "${filter}"
        max_results: "${max_results}"
        page_token: "${page_token}"
        order_by: "${order_by}"
    input:
      filter:
        type: string
        description: Filter expression over pipeline attributes.
        optional: true
      max_results:
        type: integer
        description: How many pipelines per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      order_by:
        type: string
        description: Sort order.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_pipeline:
    title: Get a pipeline
    description: >-
      One pipeline's definition, current state and most recent update.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /api/2.0/pipelines/${pipeline_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
    output:
      description: The requested record.
      type: object

  create_pipeline:
    title: Create a pipeline
    description: >-
      Create a Delta Live Tables pipeline. A continuous pipeline starts
      running -- and billing -- as soon as it is created; a triggered one
      waits for start_pipeline_update.
    category: pipelines
    destructive: true
    request:
      method: POST
      path: /api/2.0/pipelines
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_pipeline:
    title: Update a pipeline
    description: >-
      Replace a pipeline's definition. A PUT, so omitted settings are cleared
      -- and the change applies from the next update, not to data already
      materialised.
    category: pipelines
    destructive: true
    request:
      method: PUT
      path: /api/2.0/pipelines/${pipeline_id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_pipeline:
    title: Delete a pipeline
    description: >-
      Delete a pipeline. The tables it materialised remain, but nothing keeps
      them up to date any more.
    category: pipelines
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/pipelines/${pipeline_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
    output:
      description: Confirmation that the record was deleted.
      type: object

  clone_pipeline:
    title: Clone a pipeline
    description: >-
      Copy a pipeline into a new one. The safe way to try a change without
      disturbing a pipeline that is feeding production tables.
    category: pipelines
    request:
      method: POST
      path: /api/2.0/pipelines/${pipeline_id}/clone
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  start_pipeline_update:
    title: Start a pipeline update
    description: >-
      Trigger a pipeline update. `full_refresh` reprocesses everything from
      source, which discards and rebuilds the pipeline's tables -- expensive,
      and destructive to anything reading them mid-run.
    category: pipelines
    destructive: true
    request:
      method: POST
      path: /api/2.0/pipelines/${pipeline_id}/updates
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_pipeline_update:
    title: Get a pipeline update
    description: >-
      One update's state and progress. What to poll after
      start_pipeline_update.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /api/2.0/pipelines/${pipeline_id}/updates/${update_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      update_id:
        type: string
        description: The pipeline update id, from list_pipeline_updates.
    output:
      description: The requested record.
      type: object

  list_pipeline_updates:
    title: List a pipeline's updates
    description: >-
      The update history of one pipeline, newest first.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /api/2.0/pipelines/${pipeline_id}/updates
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        max_results: "${max_results}"
        page_token: "${page_token}"
        until_update_id: "${until_update_id}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      max_results:
        type: integer
        description: How many updates per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      until_update_id:
        type: string
        description: Return updates up to this one.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_pipeline_events:
    title: List a pipeline's events
    description: >-
      The event log for a pipeline -- expectations, data quality results and
      failures. Where a pipeline's actual error message lives.
    category: pipelines
    read_only: true
    request:
      method: GET
      path: /api/2.0/pipelines/${pipeline_id}/events
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter: "${filter}"
        max_results: "${max_results}"
        page_token: "${page_token}"
        order_by: "${order_by}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      filter:
        type: string
        description: Filter expression over the events.
        optional: true
      max_results:
        type: integer
        description: How many events per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      order_by:
        type: string
        description: Sort order.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  stop_pipeline:
    title: Stop a pipeline
    description: >-
      Stop a pipeline's active update. A continuous pipeline stays stopped
      until started again, so downstream tables go stale.
    category: pipelines
    destructive: true
    request:
      method: POST
      path: /api/2.0/pipelines/${pipeline_id}/stop
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      pipeline_id:
        type: string
        description: The pipeline id, from list_pipelines.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  execute_sql_statement:
    title: Execute a SQL statement
    description: >-
      Run SQL against a warehouse and get the result inline or by chunk. This
      is the main data-access tool -- and it runs whatever SQL you give it,
      including DELETE, DROP and INSERT, against real tables.
    category: sql
    destructive: true
    request:
      method: POST
      path: /api/2.0/sql/statements
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  get_sql_statement:
    title: Get a statement's status and result
    description: >-
      The state of a statement started with execute_sql_statement, and its
      result once it has finished. Poll this when the statement did not
      complete inline.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/statements/${statement_id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      statement_id:
        type: string
        description: The statement id, from execute_sql_statement.
    output:
      description: The requested record.
      type: object

  get_sql_statement_chunk:
    title: Get one chunk of a statement's result
    description: >-
      Fetch one chunk of a large result set. Results beyond a certain size are
      only available chunk by chunk, which is what makes a big SELECT
      retrievable at all.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/statements/${statement_id}/result/chunks/${chunk_index}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      statement_id:
        type: string
        description: The statement id, from execute_sql_statement.
      chunk_index:
        type: integer
        description: Which result chunk to fetch, zero-indexed.
    output:
      description: The requested record.
      type: object

  cancel_sql_statement:
    title: Cancel a statement
    description: >-
      Cancel a running statement. Anything it has already written is not
      rolled back unless the statement itself was transactional.
    category: sql
    request:
      method: POST
      path: /api/2.0/sql/statements/${statement_id}/cancel
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      statement_id:
        type: string
        description: The statement id, from execute_sql_statement.
    output:
      description: The provider's response to the call.
      type: object

  list_sql_warehouses:
    title: List SQL warehouses
    description: >-
      The SQL warehouses in the workspace, with their size, state and
      auto-stop setting. The warehouse id is what execute_sql_statement takes.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/warehouses
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_sql_warehouse:
    title: Get a SQL warehouse
    description: >-
      One warehouse's configuration and state. A stopped warehouse takes a
      minute or two to start, which is why the first query after idle is slow.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/warehouses/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The requested record.
      type: object

  create_sql_warehouse:
    title: Create a SQL warehouse
    description: >-
      Create a SQL warehouse. Size and `auto_stop_mins` are the two settings
      that decide the bill -- a large warehouse with auto-stop disabled runs
      continuously.
    category: sql
    destructive: true
    request:
      method: POST
      path: /api/2.0/sql/warehouses
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  edit_sql_warehouse:
    title: Edit a SQL warehouse
    description: >-
      Change a warehouse's size, scaling or auto-stop. The warehouse restarts
      to apply it, so queries in flight are interrupted.
    category: sql
    destructive: true
    request:
      method: POST
      path: /api/2.0/sql/warehouses/${id}/edit
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  start_sql_warehouse:
    title: Start a SQL warehouse
    description: >-
      Start a stopped warehouse. Billing begins when it comes up, not when the
      first query arrives.
    category: sql
    request:
      method: POST
      path: /api/2.0/sql/warehouses/${id}/start
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The provider's response to the call.
      type: object

  stop_sql_warehouse:
    title: Stop a SQL warehouse
    description: >-
      Stop a running warehouse, ending its DBU spend. Queries in flight are
      cancelled.
    category: sql
    request:
      method: POST
      path: /api/2.0/sql/warehouses/${id}/stop
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The provider's response to the call.
      type: object

  delete_sql_warehouse:
    title: Delete a SQL warehouse
    description: >-
      Delete a warehouse. Dashboards, alerts and queries pointing at it stop
      working.
    category: sql
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/sql/warehouses/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: Confirmation that the record was deleted.
      type: object

  get_warehouse_workspace_config:
    title: Get the workspace warehouse config
    description: >-
      Workspace-wide SQL warehouse settings -- the data access configuration,
      instance profile and security policy every warehouse inherits.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/config/warehouses
      base_url_override: https://${connectionConfig.databricksInstance}
    output:
      description: The requested record.
      type: object

  set_warehouse_workspace_config:
    title: Set the workspace warehouse config
    description: >-
      Change the workspace-wide warehouse settings. This affects every
      warehouse at once, including the data access identity they all query
      through.
    category: sql
    destructive: true
    request:
      method: PUT
      path: /api/2.0/sql/config/warehouses
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  list_sql_queries:
    title: List saved queries
    description: >-
      The saved SQL queries in the workspace, with their text and owner.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/queries
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      page_size:
        type: integer
        description: How many queries per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_sql_query:
    title: Get a saved query
    description: >-
      One saved query's SQL text, parameters and warehouse.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/queries/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The requested record.
      type: object

  create_sql_query:
    title: Create a saved query
    description: >-
      Save a SQL query in the workspace so it can be scheduled, shared or used
      by an alert.
    category: sql
    request:
      method: POST
      path: /api/2.0/sql/queries
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_sql_query:
    title: Update a saved query
    description: >-
      Change a saved query's SQL, parameters or warehouse. Alerts and
      dashboards using it pick up the change on their next run.
    category: sql
    request:
      method: PATCH
      path: /api/2.0/sql/queries/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_sql_query:
    title: Delete a saved query
    description: >-
      Move a saved query to the trash. Alerts and dashboards built on it stop
      working.
    category: sql
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/sql/queries/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_query_history:
    title: List query history
    description: >-
      Executed queries with their duration, status and the warehouse they ran
      on. Where to look when a dashboard is slow or a warehouse is
      unexpectedly busy.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/history/queries
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        filter_by: "${filter_by}"
        max_results: "${max_results}"
        page_token: "${page_token}"
        include_metrics: "${include_metrics}"
    input:
      filter_by:
        type: string
        description: Filter expression over the history.
        optional: true
      max_results:
        type: integer
        description: How many entries per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      include_metrics:
        type: boolean
        description: Include per-query performance metrics.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  list_sql_alerts:
    title: List SQL alerts
    description: >-
      The alerts built on saved queries, with their condition and current
      state.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/alerts
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        page_size: "${page_size}"
        page_token: "${page_token}"
    input:
      page_size:
        type: integer
        description: How many alerts per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_sql_alert:
    title: Get a SQL alert
    description: >-
      One alert's condition, schedule and notification settings.
    category: sql
    read_only: true
    request:
      method: GET
      path: /api/2.0/sql/alerts/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: The requested record.
      type: object

  create_sql_alert:
    title: Create a SQL alert
    description: >-
      Create an alert on a saved query. It evaluates on a schedule and
      notifies its subscribers when the condition holds, so this reaches real
      inboxes.
    category: sql
    request:
      method: POST
      path: /api/2.0/sql/alerts
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_sql_alert:
    title: Update a SQL alert
    description: >-
      Change an alert's condition, schedule or recipients. A looser condition
      means more notifications to real people.
    category: sql
    request:
      method: PATCH
      path: /api/2.0/sql/alerts/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_sql_alert:
    title: Delete a SQL alert
    description: >-
      Move an alert to the trash. Whatever it was watching stops being
      watched, silently.
    category: sql
    destructive: true
    request:
      method: DELETE
      path: /api/2.0/sql/alerts/${id}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      id:
        type: string
        description: The record id, as returned by the corresponding list tool.
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_catalogs:
    title: List catalogs
    description: >-
      The Unity Catalog catalogs visible in this workspace. A catalog is the
      top level of the three-part `catalog.schema.table` namespace.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/catalogs
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        include_browse: "${include_browse}"
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      include_browse:
        type: boolean
        description: Include catalogs the caller can only browse.
        optional: true
      max_results:
        type: integer
        description: How many catalogs per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_catalog:
    title: Get a catalog
    description: >-
      One catalog's properties, owner, storage root and isolation mode.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/catalogs/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
    output:
      description: The requested record.
      type: object

  create_catalog:
    title: Create a catalog
    description: >-
      Create a catalog, optionally over a managed storage location or a Delta
      Sharing provider.
    category: unity-catalog
    request:
      method: POST
      path: /api/2.1/unity-catalog/catalogs
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_catalog:
    title: Update a catalog
    description: >-
      Change a catalog's name, owner, comment or isolation mode. Changing the
      owner transfers administrative control of everything inside it.
    category: unity-catalog
    request:
      method: PATCH
      path: /api/2.1/unity-catalog/catalogs/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_catalog:
    title: Delete a catalog
    description: >-
      Delete a catalog. With `force` it takes every schema and table in it --
      managed tables mean the underlying data is deleted too, not just the
      metadata.
    category: unity-catalog
    destructive: true
    request:
      method: DELETE
      path: /api/2.1/unity-catalog/catalogs/${name}
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        force: "${force}"
    input:
      name:
        type: string
        description: The resource name -- for Unity Catalog this is the fully-qualified name, e.g. "main.default.my_table".
      force:
        type: boolean
        description: Delete even if the catalog is not empty.
        optional: true
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_schemas:
    title: List schemas
    description: >-
      The schemas in a catalog -- the middle level of the
      `catalog.schema.table` namespace.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/schemas
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        catalog_name: "${catalog_name}"
        include_browse: "${include_browse}"
        max_results: "${max_results}"
        page_token: "${page_token}"
    input:
      catalog_name:
        type: string
        description: The catalog to list schemas in.
      include_browse:
        type: boolean
        description: Include schemas the caller can only browse.
        optional: true
      max_results:
        type: integer
        description: How many schemas per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_schema:
    title: Get a schema
    description: >-
      One schema's properties, owner and storage location, addressed as
      `catalog.schema`.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/schemas/${full_name}
      base_url_override: https://${connectionConfig.databricksInstance}
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
    output:
      description: The requested record.
      type: object

  create_schema:
    title: Create a schema
    description: >-
      Create a schema inside a catalog, optionally with its own managed
      storage location.
    category: unity-catalog
    request:
      method: POST
      path: /api/2.1/unity-catalog/schemas
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The provider's response to the call.
      type: object

  update_schema:
    title: Update a schema
    description: >-
      Change a schema's name, owner or comment. Renaming it breaks every query
      that referenced the old three-part name.
    category: unity-catalog
    request:
      method: PATCH
      path: /api/2.1/unity-catalog/schemas/${full_name}
      base_url_override: https://${connectionConfig.databricksInstance}
      body: "${attributes}"
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      attributes:
        type: object
        description: The request payload, as the fields the provider's reference documents for this endpoint.
    output:
      description: The record after the update.
      type: object

  delete_schema:
    title: Delete a schema
    description: >-
      Delete a schema. With `force` it takes its tables with it, and managed
      tables lose their data.
    category: unity-catalog
    destructive: true
    request:
      method: DELETE
      path: /api/2.1/unity-catalog/schemas/${full_name}
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        force: "${force}"
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      force:
        type: boolean
        description: Delete even if the schema is not empty.
        optional: true
    output:
      description: Confirmation that the record was deleted.
      type: object

  list_tables:
    title: List tables
    description: >-
      The tables in a schema, with their type, format and columns.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/tables
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        catalog_name: "${catalog_name}"
        schema_name: "${schema_name}"
        max_results: "${max_results}"
        page_token: "${page_token}"
        include_delta_metadata: "${include_delta_metadata}"
        omit_columns: "${omit_columns}"
        include_browse: "${include_browse}"
    input:
      catalog_name:
        type: string
        description: The catalog to list from.
      schema_name:
        type: string
        description: The schema to list from.
      max_results:
        type: integer
        description: How many tables per page.
        optional: true
      page_token:
        type: string
        description: Paging token from a previous response.
        optional: true
      include_delta_metadata:
        type: boolean
        description: Include Delta table metadata.
        optional: true
      omit_columns:
        type: boolean
        description: Leave the column list out, for a much smaller response.
        optional: true
      include_browse:
        type: boolean
        description: Include tables the caller can only browse.
        optional: true
    output:
      description: A page of matching records, with whatever cursor or paging fields the provider returns.
      type: object

  get_table:
    title: Get a table
    description: >-
      One table's schema, properties and storage location, addressed as
      `catalog.schema.table`.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/tables/${full_name}
      base_url_override: https://${connectionConfig.databricksInstance}
      query:
        include_delta_metadata: "${include_delta_metadata}"
        include_browse: "${include_browse}"
    input:
      full_name:
        type: string
        description: The fully-qualified Unity Catalog name, e.g. "main.default.my_table".
      include_delta_metadata:
        type: boolean
        description: Include Delta table metadata.
        optional: true
      include_browse:
        type: boolean
        description: Return it even if the caller can only browse.
        optional: true
    output:
      description: The requested record.
      type: object

  table_exists:
    title: Check whether a table exists
    description: >-
      Whether a table exists, without fetching its schema. Cheaper than
      get_table when that is all you need to know.
    category: unity-catalog
    read_only: true
    request:
      method: GET
      path: /api/2.1/unity-catalog/tables/${full_name}/exists
