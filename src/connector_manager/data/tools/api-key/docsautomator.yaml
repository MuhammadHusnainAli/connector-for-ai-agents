      doc_id:
        type: string
        description: The automation ID to execute. Also accepted as automationId.
      data:
        type: object
        description: Key-value pairs for template placeholders. Keys must match placeholder names in your
          template (Google Doc syntax or PDF placeholder names). Line items are also included inside this
          object as lineitems1, lineitems2, etc. — each is an array of objects whose keys match line item
