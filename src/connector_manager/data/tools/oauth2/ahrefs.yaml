# Ahrefs tools -- the Ahrefs API v3: backlinks, organic and paid search,
# keywords, SERPs, rank tracking, site audits, AI-search brand visibility, web
# analytics, Search Console and social publishing.
#
# Every path, parameter and body field below comes from the OpenAPI description
# Ahrefs publishes at https://docs.ahrefs.com/openapi.json, which covers 151
# operations; every one is here. The connection's base url is
# https://api.ahrefs.com, so paths start at /v3.
#
# Four habits of this API decide whether a call works and what it costs:
#
#   * **select is required on most reports and it sets the price.** Pass only
#     the columns you need; the valid ones are listed in each tool's select
#     argument, and columns marked "(N units)" cost extra per row.
#   * **where is a JSON filter string**, not a query language:
#     {"and": [{"field": "volume", "is": ["gte", 100]},
#              {"field": "keyword", "is": ["substring", "shoes"]}]}.
#     The filterable columns are listed in each where argument and are not
#     always the same as the selectable ones.
#   * **units are the budget.** Report endpoints bill by rows times columns,
#     with a 50-unit minimum per request, so set limit. Each tool says whether
#     it is free, fixed-cost or metered; get_limits_and_usage reports what is
#     left.
#   * **target plus mode define the scope**: a target of example.com with mode
#     subdomains covers the whole site, prefix a URL path, exact one URL.
#
# Brand Radar reports come in pairs. The get_brand_radar_* tools take comma-
# separated query parameters; the query_brand_radar_* tools POST the same report
# with list-valued arguments and the filters only the POST form accepts
# (brand_filter, tags_filter, volume_range, changes). Citations are POST-only.
#
# Output format is always JSON here; the output and timeout parameters are left
# out.
#
# Docs: https://docs.ahrefs.com/api/reference

connector_id: ahrefs
display_name: Ahrefs
docs_url: https://docs.ahrefs.com/api/reference
tools:

  get_domain_rating:
    title: Get Domain Rating
    description: >-
      Read a domain's Domain Rating (backlink strength on a 100-point log scale) and Ahrefs
      Rank on a date. Metered: API units per row and per column selected, 50 minimum.
    category: site_explorer
    read_only: true
    request:
      method: GET
      path: /v3/site-explorer/domain-rating
      query:
        date: ${date}
        target: ${target}
    input:
      date:
        type: string
        description: A date to report metrics on in YYYY-MM-DD format.
      target:
        type: string
        description: 'The target of the search: a domain or a URL.'
    output:
      description: Domain Rating and Ahrefs Rank.
      type: object
      response_path: domain_rating

  get_backlinks_stats:
    title: Get backlink stats
    description: >-
      Count a target's live and all-time backlinks and referring domains on a date. Metered:
      API units per row and per column selected, 50 minimum.
    category: site_explorer
    read_only: true
    request:
      method: GET
      path: /v3/site-explorer/backlinks-stats
      query:
        protocol: ${protocol}
        target: ${target}
        mode: ${mode}
        date: ${date}
    input:
      protocol:
        type: string
        description: 'Which protocol of the target to count: both, http or https.'
        optional: true
        enum:
        - both
        - http
        - https
      target:
        type: string
        description: 'The target of the search: a domain or a URL.'
      mode:
        type: string
        description: 'Scope of target: exact (that URL), prefix (URLs under that path), domain
          (the domain without subdomains) or subdomains (the whole site).'
        optional: true
        enum:
        - exact
        - prefix
        - domain
        - subdomains
      date:
        type: string
        description: A date to report metrics on in YYYY-MM-DD format.
    output:
      description: Backlink and referring domain counts.
      type: object
      response_path: metrics

  get_outlinks_stats:
