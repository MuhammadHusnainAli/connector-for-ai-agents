# Google Ads API tools.
#
# Every path here comes from Google's own REST client configuration for
# v25 (googleads/google-ads-php, `*_rest_client_config.php`), so the URI
# templates are the ones Google's libraries themselves send.
#
# Four things shape this API, and therefore these tools:
#
#   * **reads go through GAQL, not REST paths.** There is no
#     `GET /campaigns`. You ask `search` for
#     `SELECT campaign.id, campaign.name, metrics.clicks FROM campaign
#      WHERE segments.date DURING LAST_30_DAYS`, and Google returns rows. The
#     per-resource tools below are all *writes*;
#   * **writes are batched mutations.** Each `mutate_*` tool takes an
#     `operations` list where every entry is a `create`, `update` or `remove`,
#     an update carries an `update_mask` naming the fields it touches, and
#     `partial_failure` decides whether one bad operation fails the batch.
#     `validate_only` runs the whole thing without applying it -- worth using
#     before any large change, since this API spends real advertising budget;
#   * **the customer id is digits only**, no dashes, and a manager (MCC)
#     account reaches its clients through the `login-customer-id` header, which
#     the connection sets;
#   * **a developer token is required** on every call and is also set by the
#     connection. A token still in test status only reaches test accounts.
#
# `list_accessible_customers` is where to start: it returns the accounts this
# token can act on at all.
#
# Version note: the paths pin v25. Google supports each major version for about
# a year, so this pack is expected to be re-pinned as versions retire.
#
# Docs: https://developers.google.com/google-ads/api/rest/overview

connector_id: google-ads
display_name: Google Ads
docs_url: https://developers.google.com/google-ads/api/rest/overview
