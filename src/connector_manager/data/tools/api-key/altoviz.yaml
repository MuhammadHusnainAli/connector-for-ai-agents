    title: List invoices
    description: >-
      List sales invoices a page at a time, filtered by date range, customer, status, cancelled
      or e-invoicing processed state.
    category: invoices
    read_only: true
    request:
      method: GET
      path: /SaleInvoices
      query:
        PageIndex: ${page_index}
        PageSize: ${page_size}
        OrderBy: ${order_by}
        From: ${from}
        To: ${to}
        CustomerId: ${customer_id}
        Status: ${status}
        Cancelled: ${cancelled}
        Processed: ${processed}
    input:
      page_index:
        type: integer
        description: Page number, starting at 1.
        optional: true
      page_size:
        type: integer
        description: Records per page.
        optional: true
      order_by:
        type: string
        description: Field to sort by.
        optional: true
      from:
        type: string
        description: Start date (inclusive), YYYY-MM-DD.
        optional: true
      to:
        type: string
        description: End date (inclusive), YYYY-MM-DD.
        optional: true
      customer_id:
        type: integer
        description: Only this customer's invoices.
        optional: true
      status:
        type: string
        description: Draft, Incoming, Expired, Paid or ToSend.
        optional: true
        enum:
        - Draft
        - Incoming
        - Expired
        - Paid
        - ToSend
      cancelled:
        type: string
        description: 'Cancelled invoices: Excluded (default), Only or All.'
        optional: true
        enum:
        - Only
        - Excluded
        - All
      processed:
        type: string
        description: 'Invoices whose final e-invoicing status was taken into account: Excluded
          (default), Only or All.'
        optional: true
        enum:
        - Only
        - Excluded
        - All
    output:
      description: The page of invoices.
      type: array
      items:
        type: object

  create_invoice:
    title: Create a draft invoice
    description: >-
      Create a draft sales invoice for a customer, with its lines. Finalize it with finalize_invoice.
    category: invoices
    request:
      method: POST
      path: /SaleInvoices
      body:
        billingAddress: ${billing_address}
        billingContact: ${billing_contact}
        customerElectronicAddress: ${customer_electronic_address}
        customerId: ${customer_id}
        customerName: ${customer_name}
        customerNumber: ${customer_number}
        customerOrderReference: ${customer_order_reference}
        customerSiret: ${customer_siret}
        customerType: ${customer_type}
        customerVatNumber: ${customer_vat_number}
        date: ${date}
        footerNotes: ${footer_notes}
        globalDiscount: ${global_discount}
        headerNotes: ${header_notes}
        internalId: ${internal_id}
        internalNotes: ${internal_notes}
        liableToVat: ${liable_to_vat}
        lines: ${lines}
        metadata: ${metadata}
        number: ${number}
        region: ${region}
        shippingAddress: ${shipping_address}
        shippingAmount: ${shipping_amount}
        shippingContact: ${shipping_contact}
        shippingVat: ${shipping_vat}
        subject: ${subject}
        useTaxIncludedPrices: ${use_tax_included_prices}
        vatMode: ${vat_mode}
        vatNote: ${vat_note}
        vatReverseCharge: ${vat_reverse_charge}
        vendorReference: ${vendor_reference}
    input:
      billing_address:
        type: object
        description: 'Address object: {street, zipcode, city, countryIso}.'
        optional: true
      billing_contact:
        type: object
        description: 'Billing contact object: {id} of an existing contact, or {firstName,
          lastName, email}.'
        optional: true
      customer_electronic_address:
        type: string
        description: Customer electronic address
        optional: true
      customer_id:
        type: integer
        description: Altoviz id of the customer to bill.
        optional: true
      customer_name:
        type: string
        description: Customer name
        optional: true
      customer_number:
        type: string
        description: Customer number
        optional: true
      customer_order_reference:
        type: string
        description: Customer order reference
        optional: true
      customer_siret:
        type: string
        description: Customer SIRET
        optional: true
      customer_type:
        type: string
        description: 'Customer type: Business, Consumer or Government.'
        optional: true
        enum:
        - Business
        - Consumer
        - Government
      customer_vat_number:
        type: string
        description: Customer VAT number
        optional: true
      date:
        type: string
        description: Date, YYYY-MM-DD.
        optional: true
      footer_notes:
        type: string
        description: Footer notes to be print
        optional: true
      global_discount:
        type: object
        description: 'Discount on the whole document: {type: Percent or Fixed, value}.'
        optional: true
      header_notes:
        type: string
        description: Header notes to be print
        optional: true
      internal_id:
        type: string
        description: Id of the record in your own system.
        optional: true
      internal_notes:
        type: string
        description: Internal notes
        optional: true
      liable_to_vat:
        type: boolean
        description: Indicates whether the document is liable to VAT
        optional: true
      lines:
        type: array
        description: 'Document lines, each {type: Product, Service, Text, Subtotal, Empty
          or NewPage; productId or productNumber or productInternalId; description; quantity;
          taxExcludedPrice or taxIncludedPrice; vat {id or rate}; unit {id}; discount {type,
          value}; classificationId}.'
        optional: true
        items:
          type: object
      metadata:
        type: object
        description: Free-form key-value data kept with the record.
        optional: true
      number:
        type: string
        description: Number.
        optional: true
