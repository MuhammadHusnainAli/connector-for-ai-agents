  get_interface_v2:
    title: Get an interface (v2)
    description: >-
      Read one interface by id in the v2 shape, with its parent device and
      status.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/inventory/interface/info/${id}
    input:
      id:
        type: string
        description: Interface id.
    output:
      description: The interface record in the v2 shape.
      type: object

  get_service_statistics_v2:
    title: Get service statistics (v2)
    description: >-
      Read internal ping check history in the v2 shape, where the statistic ids
      are internalPingTime and internalPingPacket. tenant is required.
    category: inventory-v2
    read_only: true
    request:
      method: GET
      path: /v2/api/stat/service/${stat_id}
      query:
        tenant: "${tenant}"
        filter[fromTime]: "${from_time}"
        filter[thruTime]: "${thru_time}"
        filter[interval]: "${interval}"
        filter[serviceId]: "${service_id}"
        page[first]: "${page_first}"
        page[after]: "${page_after}"
    input:
      stat_id:
        type: string
        description: Which internal ping statistic to read.
        enum: [internalPingTime, internalPingPacket]
      tenant:
        type: string
        description: Tenant id to read from; child tenants are included.
      from_time:
        type: string
        description: Start of the range, as an ISO 8601 timestamp.
      thru_time:
        type: string
        description: End of the range; defaults to now.
        optional: true
      interval:
        type: string
        description: Granularity of the series.
        enum: [minute, hour, day]
      service_id:
        type: string
        description: Restrict to one monitored service id.
        optional: true
      page_first:
        type: integer
        description: Return the first N series.
        optional: true
      page_after:
        type: string
        description: Cursor from a previous response.
        optional: true
    output:
      description: The internal ping series per monitored service.
      type: object
