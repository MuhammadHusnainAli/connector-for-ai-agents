          prompts require a report_id to be provided.
        optional: true
        enum:
        - ahrefs
        - custom
      data_source:
        type: string
        description: A comma-separated list of chatbot models. All models can be combined
          with each other. claude module supports only custom prompts. The google_ai_overviews_keywords
          and google_ai_mode_keywords models report AI Overviews / AI Mode visibility derived
          from Google search queries (keywords) rather than prompts.
        enum:
        - chatgpt
        - google_ai_overviews
        - google_ai_mode
        - gemini
        - perplexity
        - copilot
        - claude
        - grok
        - google_ai_overviews_keywords
        - google_ai_mode_keywords
      market:
        type: string
        description: A comma-separated list of the niche markets of your brands. Deprecated
          on 2026-05-18, this parameter will have no effect shortly after this date.
        optional: true
      competitors:
        type: string
        description: A comma-separated list of competitors of your brands.
