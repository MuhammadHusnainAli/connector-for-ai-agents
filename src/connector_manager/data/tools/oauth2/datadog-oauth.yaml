        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
    output:
      description: The provider's response to the call.
      type: object

  update_dashboard:
    title: Update a dashboard
    description: >-
      Replace a dashboard's definition. A PUT: whatever the payload omits is
      removed, so fetch the current definition first and edit it rather than
      sending a partial one.
    category: dashboards
    request:
      method: PUT
      path: /v1/dashboard/${dashboard_id}
      body: "${attributes}"
    input:
      dashboard_id:
        type: string
        description: The dashboard id, from list_dashboards.
      attributes:
        type: object
        description: The request payload, in the shape Datadog's reference documents for this operation -- usually a JSON:API `data` object on the v2 endpoints and a flat object on the v1 ones.
