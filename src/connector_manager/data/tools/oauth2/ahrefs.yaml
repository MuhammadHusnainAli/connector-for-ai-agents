  get_content_topics:
    title: Get content topics
    description: >-
      Analyse the pages currently ranking for a keyword and extract the topics they cover,
      to brief or score content; optionally score one of your own pages against them. Costs
      1000 API units, plus 500 when target_url is scored.
    category: content_helper
    read_only: true
    request:
      method: GET
      path: /v3/content-helper/topics
      query:
        keyword: ${keyword}
        country: ${country}
        top_competitors: ${top_competitors}
        target_url: ${target_url}
    input:
      keyword:
        type: string
        description: Keyword whose ranking pages to analyse.
      country:
        type: string
        description: Two-letter ISO 3166-1 alpha-2 country code, lowercase, e.g. us.
      top_competitors:
        type: integer
        description: How many of the top-ranking pages to analyse. Fewer pages make the analysis
          faster at the cost of breadth.
        optional: true
      target_url:
        type: string
        description: (500 units) A page of your own to score against the same topics, for
          example a draft you are writing or a page you want to improve. The page is fetched
          live. Costs additional API units each time (its scoring is not cached).
        optional: true
    output:
      description: Topics with coverage, and your page's score when given.
      type: array
      items:
        type: object
      response_path: topics

  get_web_analytics_stats:
    title: Get web analytics totals
    description: >-
      Read a Web Analytics project's totals for a period: visitors, visits, pageviews, bounce
      rate, session length and exit rate, optionally filtered. Free: consumes no API units.
    category: web_analytics
    read_only: true
    request:
      method: GET
      path: /v3/web-analytics/stats
      query:
        limit: ${limit}
        order_by: ${order_by}
        where: ${where}
        to: ${to}
        from: ${from}
        project_id: ${project_id}
    input:
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      order_by:
        type: string
        description: 'Metric to sort by, as metric:desc or metric:asc. Metrics: pageviews,
          visitors, visits, session_bounce_rate, avg_session_length, avg_session_duration_sec,
          exit_rate, exits, entries, avg_page_visit_duration_sec.'
        optional: true
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: source_channel, source, source_referer, source_referer_domain,
          utm_source, utm_medium, utm_campaign, utm_term, utm_content, page, page_domain,
          page_title, entry_page, exit_page, continent, country, city, browser_language, browser,
          browser_version, os, os_version, device, screensize, event_name, is_external_link_click,
          pageviews, visitors, visits, session_bounce_rate, avg_session_length, avg_session_duration_sec,
          exit_rate, exits, entries, avg_page_visit_duration_sec.'
        optional: true
      to:
        type: string
        description: End of the period, as an ISO 8601 datetime such as 2026-09-01T00:00:00Z.
        optional: true
      from:
        type: string
        description: Start of the period, as an ISO 8601 datetime such as 2026-09-01T00:00:00Z.
        optional: true
      project_id:
        type: integer
        description: Web Analytics project id.
    output:
      description: Totals for the period.
      type: object
      response_path: stats

