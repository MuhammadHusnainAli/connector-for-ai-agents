      example: acme
      order: 1
      pattern: ^[a-z0-9-]+$
      title: Customer Subdomain
      type: string
    domain:
      default_value: streamline.ai
      description: Whether this connection is to your production or demo/sandbox Streamline AI workspace.
      doc_section: '#step-2-find-your-customer-subdomain'
      enum:
      - streamline.ai
      - demo.streamline.ai
      order: 2
      title: Environment
      type: string
  credentials:
    password:
      description: The private key (PEM format) for your Streamline AI Auth Key.
      doc_section: '#step-1-generate-and-register-an-auth-key'
      secret: true
      title: Private Key
      type: string
    username:
      description: The Auth Key ID shown in Streamline AI after registering your public key.
      doc_section: '#step-1-generate-and-register-an-auth-key'
      example: slak_ceWnGIU******vfKI-t3ckVCw***************************
      title: Auth Key ID
      type: string
