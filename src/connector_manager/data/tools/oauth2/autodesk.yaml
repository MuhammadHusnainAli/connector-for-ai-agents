        items: {type: string}
      access_levels:
        type: array
        description: Access levels the users must have, e.g. projectAdmin.
        optional: true
        items: {type: string}
      company_id:
        type: string
        description: Company the users must represent.
        optional: true
      company_name:
        type: string
        description: Company name the users must be associated with.
        optional: true
      filter_products:
        type: array
        description: Products the users must have access to.
        optional: true
        items: {type: string}
      role_id:
        type: string
        description: Role the users must hold.
        optional: true
      role_ids:
        type: array
        description: Roles the users must hold, any of them.
        optional: true
        items: {type: string}
      autodesk_id:
        type: array
        description: Autodesk ids of the users to retrieve.
        optional: true
        items: {type: string}
      filter_id:
        type: array
        description: ACC ids of the users to retrieve.
        optional: true
        items: {type: string}
      filter_text_match:
        type: string
        description: How text filters match.
        optional: true
        enum: [contains, startsWith, endsWith, equals]
      or_filters:
        type: array
        description: Fields to combine with OR rather than AND.
        optional: true
        items: {type: string}
      fields:
        type: array
        description: User fields to include in the response.
        optional: true
        items: {type: string}
      sort:
        type: array
        description: Fields to sort by; suffix with desc for descending.
        optional: true
        items: {type: string}
      limit:
        type: integer
        description: Records per page.
        optional: true
      offset:
        type: integer
        description: Record number to start the page at.
        optional: true
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: A page of project members with their roles and products.
      type: object

  get_project_user:
    title: Get an ACC project member
    description: >-
      Read one member of an ACC project, with the company they represent, their
      roles and their product access.
