  get_brand_radar_ai_responses:
    title: Get Brand Radar AI responses
    description: >-
      List the AI assistant answers to prompts that mention the brands, with the question,
      response text, cited links and search volume, optionally only what changed since an
      earlier date. Scope it with brand, competitors, a where filter or a saved report_id.
      Free when only custom prompts are returned; Ahrefs prompt data costs API units.
    category: brand_radar
    read_only: true
    request:
      method: GET
      path: /v3/brand-radar/ai-responses
      query:
        date_compared: ${date_compared}
        select: ${select}
        where: ${where}
        limit: ${limit}
        date: ${date}
        search_volume_type: ${search_volume_type}
        country: ${country}
        order_by: ${order_by}
        report_id: ${report_id}
        prompts: ${prompts}
        data_source: ${data_source}
        market: ${market}
        competitors: ${competitors}
        brand: ${brand}
    input:
      date_compared:
        type: string
        description: A date to compare date with, in YYYY-MM-DD format. Must be strictly earlier
          than date. When set, the report covers every prompt answered on either date and
          the status field reports how each one changed between them. A prompt answered only
          on date_compared is reported as lost, and the rest of its fields describe its date_compared
          response, since it has none on date.
        optional: true
      select:
        type: string
        description: 'Comma-separated columns to return; request only what you need, since
          columns set the unit cost. Valid: country, data_source, last_updated, links (10
          units), question, response (10 units), search_queries, status, tags, volume (10
          units).'
      where:
        type: string
        description: 'Filter as a JSON boolean expression string, e.g. {"and": [{"field":
          "volume", "is": ["gte", 100]}]}; operators are eq, neq, gt, gte, lt, lte, substring,
          isubstring, phrase_match, iphrase_match, prefix and suffix, combined with and, or
          and not. Filterable columns: cited_domain, cited_domain_subdomains, cited_url_exact,
          cited_url_prefix, question, response, search_queries, topic.'
        optional: true
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      date:
        type: string
        description: The date to search for in YYYY-MM-DD format.
        optional: true
      search_volume_type:
        type: string
        description: AI visibility reports are switching to AI adjusted volume. It better
          estimates demand for AI responses across chatbots and AI search surfaces. It is
          calculated by adjusting Google search volume for each AI platform’s estimated usage
          compared with Google. This param will be deprecated on September 30, 2026; all requests
          will use new AI adjusted volume. ask_volume - New calculation (default). Estimates
          demand for AI responses by adjusting Google search volume for each AI platform.
        optional: true
        enum:
        - ask_volume
        - keyword_volume
      country:
        type: string
        description: Comma-separated two-letter ISO 3166-1 alpha-2 country codes, lowercase,
          e.g. us,gb.
        optional: true
      order_by:
        type: string
        description: A column to order the results by.
        optional: true
        enum:
        - relevance
        - volume
      report_id:
        type: string
        description: 'The ID of the report to use. If one is given, other parameters are taken
          from the report (brand, competitors, market, country, filters). If country or filters
          are provided, they override the ones in the report. You can find it in the URL of
