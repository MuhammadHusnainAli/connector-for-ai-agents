  delete_slo:
    title: Delete an SLO
    description: >-
      Delete an SLO along with its history and error budget. Irreversible;
      check_can_delete_slo says first whether anything depends on it.
    category: slos
    destructive: true
    request:
      method: DELETE
      path: /v1/slo/${slo_id}
      query:
        force: "${force}"
    input:
      slo_id:
        type: string
        description: The SLO id, from list_slos.
      force:
        type: string
        description: Delete the monitor even if it's referenced by other resources (for example SLO, composite monitor).
        optional: true
