        preset: ${preset}
        previous_response_id: ${previous_response_id}
        reasoning: ${reasoning}
        response_format: ${response_format}
    input:
      input:
        type: string
        description: Input content - either a string or array of input items
      background:
        type: boolean
        description: 'Run the response asynchronously. With stream: false, the request returns immediately
          with status: "queued"; poll GET /v1/responses/{id} until the response reaches a terminal status.
          Background runs are durable, so you can also stream them and reconnect after a drop.'
