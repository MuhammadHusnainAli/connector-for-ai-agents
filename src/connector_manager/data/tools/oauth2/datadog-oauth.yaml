      organizations](https://docs.datadoghq.com/account_management/multi_organization/).
    category: usage
    read_only: true
    request:
      method: GET
      path: /v1/usage/billable-summary
      query:
        month: "${month}"
        include_connected_accounts: "${include_connected_accounts}"
    input:
      month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for usage starting this month.'
        optional: true
      include_connected_accounts:
        type: boolean
        description: Boolean to specify whether to include accounts connected to the current account as partner customers in the Datadog partner network program. Defaults to `false`.
        optional: true
        default: 'False'
    output:
      description: The requested record.
      type: object

  get_hourly_usage:
    title: Get hourly usage by product family
    description: >-
      Get hourly usage by product family. Datadog's reference documents the
      exact parameters and payload this call takes.
    category: usage
    read_only: true
    request:
      method: GET
      path: /v2/usage/hourly_usage
      query:
        filter[timestamp][start]: "${filter_timestamp__start_}"
        filter[timestamp][end]: "${filter_timestamp__end_}"
        filter[product_families]: "${filter_product_families_}"
        filter[include_descendants]: "${filter_include_descendants_}"
        filter[include_connected_accounts]: "${filter_include_connected_accounts_}"
        filter[include_breakdown]: "${filter_include_breakdown_}"
        filter[versions]: "${filter_versions_}"
        page[limit]: "${page_limit_}"
        page[next_record_id]: "${page_next_record_id_}"
    input:
      filter_timestamp__start_:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to hour: [YYYY-MM-DDThh] for usage beginning at this hour.'
      filter_timestamp__end_:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to hour: [YYYY-MM-DDThh] for usage ending **before** this hour.'
        optional: true
      filter_product_families_:
        type: string
        description: Comma separated list of product families to retrieve. Available families are `all`, `ai`, `analyzed_logs`, `application_performance_monitoring`, `application_security`, `audit_trail`, `bits_ai`, `serverless`, `ci_app`, `cloud_cost_management`,...
      filter_include_descendants_:
        type: boolean
        description: Include child org usage in the response. Defaults to false.
        optional: true
        default: 'False'
      filter_include_connected_accounts_:
        type: boolean
        description: Boolean to specify whether to include accounts connected to the current account as partner customers in the Datadog partner network program. Defaults to false.
        optional: true
        default: 'False'
      filter_include_breakdown_:
        type: boolean
        description: Include breakdown of usage by subcategories where applicable (for product family logs only). Defaults to false.
        optional: true
        default: 'False'
      filter_versions_:
        type: string
        description: Comma separated list of product family versions to use in the format `product_family:version`. For example, `infra_hosts:1.0.0`. If this parameter is not used, the API will use the latest version of each requested product family. Currently all families...
        optional: true
      page_limit_:
        type: integer
        description: Maximum number of results to return (between 1 and 500) - defaults to 500 if limit not specified.
        optional: true
        default: '500'
      page_next_record_id_:
        type: string
        description: List following results with a next_record_id provided in the previous query.
        optional: true
    output:
      description: The requested record.
      type: object

  get_estimated_cost:
    title: Get estimated cost across your account
    description: >-
      The current month's estimated cost so far. Refreshed through the month,
      so it is a projection in progress rather than a final figure.
    category: usage
    read_only: true
    request:
      method: GET
      path: /v2/usage/estimated_cost
      query:
        view: "${view}"
        start_month: "${start_month}"
        end_month: "${end_month}"
        start_date: "${start_date}"
        end_date: "${end_date}"
        cost_aggregation: "${cost_aggregation}"
        include_connected_accounts: "${include_connected_accounts}"
    input:
      view:
        type: string
        description: String to specify whether cost is broken down at a parent-org level or at the sub-org level. Available views are `summary` and `sub-org`. Defaults to `summary`.
        optional: true
      start_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost beginning this month. **Either start_month or start_date should be specified, but not both.** (start_month cannot go beyond two months in the past). Provide an `end_month` to view...'
        optional: true
      end_month:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to month: `[YYYY-MM]` for cost ending this month.'
        optional: true
      start_date:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to day: `[YYYY-MM-DD]` for cost beginning this day. **Either start_month or start_date should be specified, but not both.** (start_date cannot go beyond two months in the past). Provide an `end_date` to view...'
        optional: true
      end_date:
        type: string
        description: 'Datetime in ISO-8601 format, UTC, precise to day: `[YYYY-MM-DD]` for cost ending this day.'
        optional: true
      cost_aggregation:
        type: string
        description: Controls how costs are aggregated when using `start_date`. The `cumulative` option returns month-to-date running totals.
        optional: true
      include_connected_accounts:
        type: boolean
        description: Boolean to specify whether to include accounts connected to the current account as partner customers in the Datadog partner network program. Defaults to `false`.
        optional: true
        default: 'False'
    output:
      description: The requested record.
      type: object

  get_historical_cost:
