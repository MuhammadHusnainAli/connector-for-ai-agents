  create_quickbooks_desktop_bill_check_payments:
    title: Create a bill check payment
    description: Create a bill check payment Records a check payment against one vendor’s open bills.
      Each bill allocation must include a payment amount, discount, or vendor credit, and the accounts
      payable account has to match the one used on the bills you’re closing. Calls POST /v1/quickbooks-desktop/bill-check-payments
      on the provider's API.
    category: quickbooks_desktop
    request:
      method: POST
      path: /v1/quickbooks-desktop/bill-check-payments
      body:
        vendorId: ${vendor_id}
        payablesAccountId: ${payables_account_id}
        transactionDate: ${transaction_date}
        bankAccountId: ${bank_account_id}
        isQueuedForPrint: ${is_queued_for_print}
        refNumber: ${ref_number}
        memo: ${memo}
        exchangeRate: ${exchange_rate}
        externalId: ${external_id}
        applyToTransactions: ${apply_to_transactions}
    input:
      vendor_id:
        type: string
        description: 'The vendor who sent the bill(s) that this bill check payment is paying and who will
          receive this payment. IMPORTANT: This vendor must match the vendor on the bill(s) specified
          in applyToTransactions; otherwise, QuickBooks will say the transactionId in applyToTransactions
          "does not exist".'
      payables_account_id:
        type: string
        description: 'The Accounts-Payable (A/P) account to which this bill check payment is assigned,
          used to track the amount owed. If not specified, QuickBooks Desktop will use its default A/P
          account. IMPORTANT: If this bill check payment is linked to other transactions, this A/P account
          must match the payablesAccount used in those other transactions.'
        optional: true
      transaction_date:
        type: string
        description: The date of this bill check payment, in ISO 8601 format (YYYY-MM-DD).
      bank_account_id:
        type: string
        description: The bank account from which the funds are being drawn for this bill check payment;
          e.g., Checking or Savings. This bill check payment will decrease the balance of this account.
      is_queued_for_print:
        type: boolean
        description: Indicates whether this bill check payment is included in the queue of documents for
