      subject:
        type: string
        description: Email subject. Required if no template is provided. Cannot contain newline characters.
        optional: true
      body:
        type: string
        description: Email body (HTML). Required if no template is provided.
        optional: true
      template:
        type: string
        description: Template ID to use for this email. When provided, uses the template's subject, body,
          from, and reply-to settings. You can override these by explicitly providing subject, body, from,
          or reply fields in the request. Template variables are populated from the data field.
        optional: true
      from:
        type: string
        description: 'Sender email address (requires verified domain). Required unless using a template
          that has a ''from'' address configured. Can be a string (e.g., ''hello@example.com'') or an
          object with {name, email} (e.g., {name: ''My App'', email: ''hello@example.com''}).'
        optional: true
      name:
        type: string
        description: 'Deprecated. Sender display name. Prefer from: { name, email }. Used only as a fallback
          when from is a string and no name is set there.'
        optional: true
      subscribed:
        type: boolean
        description: Subscription state to apply to the recipient. For new contacts, defaults to false
          on /v1/send. For existing contacts, omitting this preserves their current state — pass true
          or false to explicitly change it. A change emits contact.subscribed or contact.unsubscribed.
        optional: true
      data:
        type: object
        description: 'Variables for template rendering and contact data updates. Each value can be: -
          A primitive (string, number, boolean) — saved on the contact and available as a template variable.
          - null — deletes the field from the contact. - An empty string — skipped (does not overwrite
          existing data). - An object { value, persistent: false } — used for this send only, not stored
          on the contact (good for one-shot'
        optional: true
      headers:
        type: object
        description: Custom email headers. Header names cannot contain \r\n. Header values are limited
          to 998 characters and cannot contain \r\n (header injection is rejected).
        optional: true
      reply:
        type: string
        description: Reply-to address.
        optional: true
      attachments:
        type: array
        description: 'Email attachments. Default cap: 10 attachments and 10 MB total. The full message
          size cannot exceed 40 MB.'
        optional: true
        items:
          type: object
    output:
      description: Email queued successfully
      type: object
