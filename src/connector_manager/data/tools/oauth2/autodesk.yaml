        filter[products]: "${filter_products}"
        filter[roleId]: "${role_id}"
        filter[roleIds]: "${role_ids}"
        filter[autodeskId]: "${autodesk_id}"
        filter[id]: "${filter_id}"
        filterTextMatch: "${filter_text_match}"
