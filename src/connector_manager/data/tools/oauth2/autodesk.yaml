    scopes: [account:read]
    read_only: true
    request:
      method: GET
      path: /construction/admin/v1/projects/${project_id}/users/${user_id}
      headers:
        Region: "${region}"
      query:
        fields: "${fields}"
    input:
      project_id:
        type: string
        description: ACC project id.
      user_id:
        type: string
        description: Project member id.
      fields:
        type: array
        description: User fields to include in the response.
        optional: true
        items: {type: string}
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
    output:
      description: The project member record.
      type: object

  add_project_user:
    title: Add a member to an ACC project
    description: >-
      Invite someone to a project by email and give them product access.
      products is required -- each entry names a product key and the access
      level on it.
    category: acc-admin
    scopes: [account:write]
    request:
      method: POST
      path: /construction/admin/v1/projects/${project_id}/users
      headers:
        Region: "${region}"
      body:
        email: "${email}"
        companyId: "${company_id}"
        roleIds: "${role_ids}"
        products: "${products}"
    input:
      project_id:
        type: string
        description: ACC project id to add the member to.
      email:
        type: string
        description: Email address of the person to invite.
      company_id:
        type: string
        description: Company the member represents on the project.
        optional: true
      role_ids:
        type: array
        description: Role ids to give the member.
        optional: true
        items: {type: string}
      products:
        type: array
        description: Product access entries, each with a key and an access level.
        items: {type: object}
      region:
        type: string
        description: Data centre holding the project.
        optional: true
        enum: [US, EMEA, AUS, CAN, DEU, IND, JPN, GBR]
