# Beekeeper tools -- streams, posts, comments, users and groups.
#
# Beekeeper is a frontline-communication app: content lives in **streams**
# (channels), each post belongs to one, and comments and reactions hang off
# posts. The connection's subdomain and `/api/2` are already in the base url,
# so paths here start at `/posts`, `/streams`, `/users`.
#
# Worth knowing before you post anything:
#
#   * **a post reaches real people the moment it succeeds.** There is no draft
#     state; the nearest thing is `scheduled_at`, which holds it until then.
#     `sticky` pins it to the top of the stream for everyone;
#   * **who can see what depends on stream permissions**, which are granted to
#     groups, org units and individual members -- `list_stream_groups`,
#     `list_stream_org_units` and `list_stream_members` are the three places to
#     look when someone cannot see a post;
#   * **`/users` and `/profiles` are different views of a person.** `/users` is
#     the administrative record (role, suspension, tenant id) and needs admin
#     rights; `/profiles` is what colleagues see. Look up by email or username
#     with the `by_email` and `by_name` tools rather than scanning the list;
#   * **files are uploaded first, then referenced.** A post's `files` and
#     `media` arrays point at already-uploaded objects, so an attachment needs
#     Beekeeper's upload flow before the post is created.
#
# `send_login_instructions` emails or texts a real person their credentials,
# and deleting a user or a stream takes its content with it.
#
# Docs: https://developers.beekeeper.io/docs/beekeeper-api

connector_id: beekeeper
display_name: Beekeeper
docs_url: https://developers.beekeeper.io/docs/beekeeper-api

tools:

  # -- account -------------------------------------------------------------

  get_status:
    title: Get the authenticated user's status
    description: >-
      Read who the token belongs to, along with their unread counts and
      tenant. The cheapest call that proves the API key works.
    category: account
    read_only: true
    request:
      method: GET
      path: /status
    input: {}
    output:
      description: The authenticated user's status.
      type: object

  get_config:
    title: Get the tenant configuration
    description: >-
      Read the tenant's configuration -- which features and modules are turned
      on, and the branding and locale settings. Check here before assuming an
      endpoint's feature exists on this account.
    category: account
    read_only: true
    request:
      method: GET
      path: /config
    input: {}
    output:
      description: The tenant and system configuration.
      type: object

  get_unread_notification_count:
    title: Get the unread notification count
    description: Read how many notifications the authenticated user has not seen yet.
    category: account
    read_only: true
    request:
      method: GET
      path: /status/unread_notifications
    input: {}
    output:
      description: The unread notification count.
      type: object

  # -- streams -------------------------------------------------------------

  list_streams:
    title: List streams
    description: >-
      Read the streams (channels) the token can see, with their names and ids.
      A stream id is what posting and permission calls take, so this is
      usually the first call.
    category: streams
    read_only: true
    request:
      method: GET
      path: /streams
      query:
        org_unit_id: "${org_unit_id}"
    input:
      org_unit_id:
        type: string
        description: Only streams assigned to this org unit or one beneath it.
        optional: true
    output:
      description: The streams available to the caller.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          name: {type: string}

  get_stream:
    title: Get a stream
    description: Read one stream -- its name, description, cover image and default-post settings.
    category: streams
    read_only: true
    request:
      method: GET
      path: /streams/${stream_id}
    input:
      stream_id:
        type: integer
        description: The stream's id, from list_streams.
    output:
      description: The stream.
      type: object

  create_stream:
    title: Create a stream
    description: >-
      Create a stream. It starts with no permissions, so nobody but admins can
      see it until you grant a group, org unit or member access.
    category: streams
    request:
      method: POST
      path: /streams
      body:
        name: "${name}"
        path: "${path}"
        is_default: "${is_default}"
    input:
      name:
        type: string
        description: The stream's name.
      path:
        type: string
        description: Web slug for the stream.
        optional: true
      is_default:
        type: boolean
        description: Make this the default stream everyone sees first.
        optional: true
    output:
      description: The created stream.
      type: object

  update_stream:
    title: Update a stream
    description: >-
      Change a stream's name, slug, description or highlighted labels.
      Beekeeper requires both `name` and `path` on every update, so send them
      even when unchanged.
    category: streams
    request:
      method: PUT
      path: /streams/${stream_id}
      body:
        name: "${name}"
        path: "${path}"
        description: "${description}"
        is_default: "${is_default}"
        default_post_lock: "${default_post_lock}"
        highlighted_labels: "${highlighted_labels}"
        org_unit_id: "${org_unit_id}"
    input:
      stream_id:
        type: integer
        description: The stream's id.
      name:
        type: string
        description: The stream's name, required even if unchanged.
      path:
        type: string
        description: The stream's web slug, required even if unchanged.
      description:
        type: string
        description: What the stream is for.
        optional: true
      is_default:
        type: boolean
        description: Make this the default stream.
        optional: true
      default_post_lock:
        type: boolean
        description: Disable comments on the stream's default post.
        optional: true
      highlighted_labels:
        type: array
        description: Labels to feature at the top of the stream.
        optional: true
        items: {type: string}
      org_unit_id:
        type: string
        description: Org unit the stream belongs to.
        optional: true
    output:
      description: The updated stream.
      type: object

  delete_stream:
    title: Delete a stream
    description: >-
      Delete a stream and every post in it. There is no undo and no archive --
      consider removing its permissions instead if the content matters.
    category: streams
    destructive: true
    request:
      method: DELETE
      path: /streams/${stream_id}
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: Confirmation that the stream was deleted.
      type: object

  subscribe_to_stream:
    title: Subscribe to a stream
    description: Follow a stream as the authenticated user, so its posts reach your feed.
    category: streams
    request:
      method: POST
      path: /streams/${stream_id}/subscribe
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: Confirmation of the subscription.
      type: object

  unsubscribe_from_stream:
    title: Unsubscribe from a stream
    description: Stop following a stream as the authenticated user.
    category: streams
    destructive: true
    request:
      method: DELETE
      path: /streams/${stream_id}/subscribe
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: Confirmation that the subscription was removed.
      type: object

  list_stream_members:
    title: List a stream's explicit members
    description: >-
      Read the people added to a stream individually, as opposed to those who
      reach it through a group or org unit. One of the three places to look
      when someone cannot see a post.
    category: streams
    read_only: true
    request:
      method: GET
      path: /streams/${stream_id}/members
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: The stream's explicit members.
      type: array
      items: {type: object}

  add_stream_member:
    title: Add a member to a stream
    description: >-
      Give one person access to a stream directly. For a whole team, granting
      a group is easier to maintain than adding people one at a time.
    category: streams
    request:
      method: POST
      path: /streams/${stream_id}/members
      body:
        userid: "${user_id}"
        username: "${username}"
    input:
      stream_id:
        type: integer
        description: The stream's id.
      user_id:
        type: string
        description: The user's Beekeeper id. Use this or `username`.
        optional: true
      username:
        type: string
        description: The user's username. Use this or `user_id`.
        optional: true
    output:
      description: The stream membership after the change.
      type: object

  list_stream_groups:
    title: List a stream's group permissions
    description: >-
      Read which groups can reach a stream and at what permission level -- the
      usual way stream access is granted at scale.
    category: streams
    read_only: true
    request:
      method: GET
      path: /streams/${stream_id}/groups
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: The groups with access to the stream.
      type: array
      items: {type: object}

  list_stream_org_units:
    title: List a stream's org unit permissions
    description: >-
      Read which organizational units can reach a stream, which is how
      location- or department-based access is expressed.
    category: streams
    read_only: true
    request:
      method: GET
      path: /streams/${stream_id}/org_units
    input:
      stream_id:
        type: integer
        description: The stream's id.
    output:
      description: The org units with access to the stream.
      type: array
      items: {type: object}

  # -- posts ---------------------------------------------------------------

  list_posts:
    title: List posts across all streams
    description: >-
      Read posts from every stream the caller can see, newest first. Page with
      `before`/`after` timestamps rather than an offset; `filter` takes a JSON
      object for status and other criteria.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts
      query:
        limit: "${limit}"
        orderby: "${order_by}"
        filter: "${filter}"
        after: "${after}"
        before: "${before}"
        ids: "${ids}"
        count: "${count}"
    input:
      limit:
        type: integer
        description: Posts to return, up to 50.
        optional: true
        minimum: 1
        maximum: 50
      order_by:
        type: string
        description: Field to order by.
        optional: true
        enum: [updated, created, scheduled_at]
      filter:
        type: string
        description: JSON filter object, e.g. {"status":"published"}, as a string.
        optional: true
      after:
        type: string
        description: Only posts after this timestamp -- the cursor for paging forwards.
        optional: true
      before:
        type: string
        description: Only posts before this timestamp -- the cursor for paging backwards.
        optional: true
      ids:
        type: string
        description: Comma-separated post ids to fetch specifically.
        optional: true
      count:
        type: boolean
        description: Also return the total count in a response header.
        optional: true
    output:
      description: The matching posts.
      type: array
      items:
        type: object
        properties:
          id: {type: integer}
          text: {type: string}
          stream_id: {type: integer}

  list_stream_posts:
    title: List a stream's posts
    description: >-
      Read one stream's posts, newest first. `q` searches their text and
      `labels` narrows to tagged posts; `include_comments` saves a second call
      per post.
    category: posts
    read_only: true
    request:
      method: GET
      path: /streams/${stream_id}/posts
      query:
        limit: "${limit}"
        orderby: "${order_by}"
        filter: "${filter}"
        labels: "${labels}"
        q: "${query}"
        include_comments: "${include_comments}"
        after: "${after}"
        before: "${before}"
        count: "${count}"
    input:
      stream_id:
        type: integer
        description: The stream's id.
      limit:
        type: integer
        description: Posts to return, up to 50.
        optional: true
        minimum: 1
        maximum: 50
      order_by:
        type: string
        description: Field to order by.
        optional: true
        enum: [updated, created]
      filter:
        type: string
        description: JSON filter object as a string.
        optional: true
      labels:
        type: string
        description: Comma-separated labels to filter by.
        optional: true
      query:
        type: string
        description: Search text matched against the posts.
        optional: true
      include_comments:
        type: boolean
        description: Include each post's comments in the response.
        optional: true
      after:
        type: string
        description: Only posts after this timestamp.
        optional: true
      before:
        type: string
        description: Only posts before this timestamp.
        optional: true
      count:
        type: boolean
        description: Also return the total count in a response header.
        optional: true
    output:
      description: The stream's posts.
      type: array
      items: {type: object}

  get_post:
    title: Get a post
    description: Read one post with its text, author, labels and recent comments.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts/${post_id}
      query:
        limit: "${comment_limit}"
    input:
      post_id:
        type: integer
        description: The post's id.
      comment_limit:
        type: integer
        description: How many comments to include with the post.
        optional: true
        minimum: 0
    output:
      description: The post.
      type: object

  create_post:
    title: Create a post
    description: >-
      Post into a stream. It is visible to everyone with access as soon as this
      succeeds -- there is no draft -- unless `scheduled_at` holds it for
      later. `sticky` pins it to the top of the stream, `locked` disables
      comments, and `options` turns the post into a poll.
    category: posts
    request:
      method: POST
      path: /posts
      body:
        streamid: "${stream_id}"
        title: "${title}"
        text: "${text}"
        labels: "${labels}"
        sticky: "${sticky}"
        locked: "${locked}"
        reactions_disabled: "${reactions_disabled}"
        scheduled_at: "${scheduled_at}"
        media: "${media}"
        files: "${files}"
        options: "${poll_options}"
    input:
      stream_id:
        type: integer
        description: The stream to post into, from list_streams.
      text:
        type: string
        description: The post's body text.
        optional: true
      title:
        type: string
        description: The post's title.
        optional: true
      labels:
        type: array
        description: Labels to tag the post with.
        optional: true
        items: {type: string}
      sticky:
        type: boolean
        description: Pin the post to the top of the stream for everyone.
        optional: true
      locked:
        type: boolean
        description: Disable comments on the post.
        optional: true
      reactions_disabled:
        type: boolean
        description: Disable reactions on the post.
        optional: true
      scheduled_at:
        type: string
        description: ISO 8601 time to publish at. Until then the post is not visible.
        optional: true
      media:
        type: array
        description: Photo or video objects to attach, from Beekeeper's file upload flow.
        optional: true
        items: {type: object}
      files:
        type: array
        description: File objects to attach, from Beekeeper's file upload flow.
        optional: true
        items: {type: object}
      poll_options:
        type: array
        description: 'Poll choices, each {"text": "..."}, which makes the post a poll.'
        optional: true
        items: {type: object}
    output:
      description: The created post.
      type: object

  create_stream_post:
    title: Create a post in a specific stream
    description: >-
      Post into one stream, addressing the stream in the url rather than the
      body. Same effect as create_post; use whichever reads better for the
      caller.
    category: posts
    request:
      method: POST
      path: /streams/${stream_id}/posts
      body:
        title: "${title}"
        text: "${text}"
        labels: "${labels}"
        sticky: "${sticky}"
        locked: "${locked}"
        scheduled_at: "${scheduled_at}"
        media: "${media}"
        options: "${poll_options}"
    input:
      stream_id:
        type: integer
        description: The stream to post into.
      text:
        type: string
        description: The post's body text.
        optional: true
      title:
        type: string
        description: The post's title.
        optional: true
      labels:
        type: array
        description: Labels to tag the post with.
        optional: true
        items: {type: string}
      sticky:
        type: boolean
        description: Pin the post to the top of the stream.
        optional: true
      locked:
        type: boolean
        description: Disable comments on the post.
        optional: true
      scheduled_at:
        type: string
        description: ISO 8601 time to publish at.
        optional: true
      media:
        type: array
        description: Photo or video objects to attach.
        optional: true
        items: {type: object}
      poll_options:
        type: array
        description: 'Poll choices, each {"text": "..."}.'
        optional: true
        items: {type: object}
    output:
      description: The created post.
      type: object

  update_post:
    title: Update a post
    description: >-
      Edit a post that is already published. Readers see the change
      immediately; Beekeeper does not keep an edit history.
    category: posts
    request:
      method: PUT
      path: /posts/${post_id}
      body:
        title: "${title}"
        text: "${text}"
        labels: "${labels}"
        sticky: "${sticky}"
        locked: "${locked}"
        scheduled_at: "${scheduled_at}"
        streamid: "${stream_id}"
    input:
      post_id:
        type: integer
        description: The post's id.
      title:
        type: string
        description: New title.
        optional: true
      text:
        type: string
        description: New body text.
        optional: true
      labels:
        type: array
        description: Replacement labels for the post.
        optional: true
        items: {type: string}
      sticky:
        type: boolean
        description: Pin or unpin the post.
        optional: true
      locked:
        type: boolean
        description: Enable or disable comments.
        optional: true
      scheduled_at:
        type: string
        description: New publish time, for a post that has not gone out yet.
        optional: true
      stream_id:
        type: integer
        description: Move the post to another stream.
        optional: true
    output:
      description: The updated post.
      type: object

  delete_post:
    title: Delete a post
    description: >-
      Delete a post along with its comments and reactions. It disappears for
      every reader and cannot be restored.
    category: posts
    destructive: true
    request:
      method: DELETE
      path: /posts/${post_id}
    input:
      post_id:
        type: integer
        description: The post's id.
    output:
      description: Confirmation that the post was deleted.
      type: object

  mark_posts_read:
    title: Mark posts as read
    description: >-
      Mark up to 30 posts as read for the authenticated user, which is how a
      client clears its unread badge.
    category: posts
    request:
      method: POST
      path: /posts/${post_ids}/read
    input:
      post_ids:
        type: string
        description: Comma-separated post ids, up to 30.
        example: "101,102,103"
    output:
      description: Confirmation that the posts were marked read.
      type: object

  like_post:
    title: Like a post
    description: Add the authenticated user's like to a post.
    category: posts
    request:
      method: POST
      path: /posts/${post_id}/like
    input:
      post_id:
        type: integer
        description: The post's id.
    output:
      description: The post's like state after the change.
      type: object

  unlike_post:
    title: Unlike a post
    description: Remove the authenticated user's like from a post.
    category: posts
    destructive: true
    request:
      method: DELETE
      path: /posts/${post_id}/like
    input:
      post_id:
        type: integer
        description: The post's id.
    output:
      description: The post's like state after the change.
      type: object

  list_post_reactions:
    title: List a post's reactions
    description: >-
      Read who reacted to a post and with which emoji, optionally filtered to
      one emoji.
    category: posts
    read_only: true
    request:
      method: GET
      path: /posts/${post_id}/reactions
      query:
        emoji: "${emoji}"
        before: "${before}"
        limit: "${limit}"
    input:
      post_id:
        type: integer
        description: The post's id.
      emoji:
        type: string
        description: Only reactions using this emoji.
        optional: true
      before:
        type: string
        description: Only reactions created before this timestamp.
        optional: true
      limit:
        type: integer
        description: Reactions per page.
        optional: true
        minimum: 1
    output:
      description: The post's reactions.
      type: array
      items: {type: object}

  set_post_reaction:
    title: React to a post
    description: >-
      Set the authenticated user's reaction on a post to an emoji, replacing
      whatever reaction they had before.
    category: posts
    request:
      method: PUT
      path: /posts/${post_id}/reaction
      body:
        emoji: "${emoji}"
        user_id: "${user_id}"
    input:
      post_id:
        type: integer
        description: The post's id.
      emoji:
        type: string
        description: The emoji to react with.
        example: "👍"
      user_id:
        type: string
        description: React as this user instead of the token's own user; needs admin rights.
        optional: true
    output:
      description: The reaction after the change.
      type: object

  vote_on_poll:
    title: Vote on a poll
    description: >-
      Cast the authenticated user's vote for one option of a poll post. Votes
      cannot be withdrawn through the API.
    category: posts
    request:
      method: POST
      path: /posts/${post_id}/vote/${option_id}
    input:
      post_id:
        type: integer
        description: The poll post's id.
      option_id:
        type: integer
        description: The poll option to vote for, from the post's `options`.
    output:
      description: The poll's state after the vote.
      type: object

  # -- comments ------------------------------------------------------------

  list_post_comments:
    title: List a post's comments
    description: Read the comments on one post, oldest first.
    category: comments
    read_only: true
    request:
      method: GET
      path: /posts/${post_id}/comments
      query:
        limit: "${limit}"
    input:
      post_id:
        type: integer
        description: The post's id.
      limit:
        type: integer
        description: Maximum comments to return.
        optional: true
        minimum: 1
    output:
      description: The post's comments.
      type: array
      items: {type: object}

  create_comment:
    title: Comment on a post
    description: >-
      Add a comment to a post as the authenticated user. Everyone with access
      to the post sees it at once, and the author is notified.
    category: comments
    request:
      method: POST
      path: /posts/${post_id}/comments
      body:
        text: "${text}"
        media: "${media}"
    input:
      post_id:
        type: integer
        description: The post's id.
      text:
        type: string
        description: The comment text.
      media:
        type: array
        description: File objects to attach, from Beekeeper's upload flow.
        optional: true
        items: {type: object}
    output:
      description: The created comment.
      type: object

  update_comment:
    title: Update a comment
    description: Edit an existing comment's text. Readers see the change immediately.
    category: comments
    request:
      method: PUT
      path: /comments/${comment_id}
      body:
        text: "${text}"
        media: "${media}"
    input:
      comment_id:
        type: integer
        description: The comment's id.
      text:
        type: string
        description: The new comment text.
      media:
        type: array
        description: Replacement attachments for the comment.
        optional: true
        items: {type: object}
    output:
      description: The updated comment.
      type: object

  delete_comment:
    title: Delete a comment
    description: Delete a comment. It disappears for every reader, with no undo.
    category: comments
    destructive: true
    request:
      method: DELETE
      path: /comments/${comment_id}
    input:
      comment_id:
        type: integer
        description: The comment's id.
    output:
      description: Confirmation that the comment was deleted.
      type: object

  like_comment:
    title: Like a comment
    description: Add the authenticated user's like to a comment.
    category: comments
    request:
      method: POST
      path: /comments/${comment_id}/like
    input:
      comment_id:
        type: integer
        description: The comment's id.
    output:
      description: The comment's like state after the change.
      type: object

  unlike_comment:
    title: Unlike a comment
    description: Remove the authenticated user's like from a comment.
    category: comments
    destructive: true
    request:
      method: DELETE
      path: /comments/${comment_id}/like
    input:
      comment_id:
        type: integer
        description: The comment's id.
    output:
      description: The comment's like state after the change.
      type: object

  approve_comment:
    title: Approve a moderated comment
    description: >-
      Keep a comment that moderation held back, publishing it to the post.
      Needs moderator rights on the stream.
    category: comments
    request:
      method: POST
      path: /comments/${comment_id}/keep
    input:
      comment_id:
        type: integer
        description: The comment's id.
    output:
      description: Confirmation that the comment was approved.
      type: object

  reject_comment:
    title: Reject a moderated comment
    description: >-
      Disapprove a comment, removing it from the post. Needs moderator rights
      on the stream.
    category: comments
    request:
      method: POST
      path: /comments/${comment_id}/kill
    input:
      comment_id:
        type: integer
        description: The comment's id.
    output:
      description: Confirmation that the comment was removed.
      type: object

  # -- users and profiles --------------------------------------------------

  list_users:
    title: List users
    description: >-
      Read the tenant's users -- the administrative record, with role,
      suspension state and tenant user id. `q` searches names, and
      `group_ids`/`org_unit_ids` narrow to a team or location. Needs admin
      rights.
    category: users
    read_only: true
    request:
      method: GET
      path: /users
      query:
        q: "${query}"
        group_ids: "${group_ids}"
        org_unit_ids: "${org_unit_ids}"
        include_bots: "${include_bots}"
        include_self: "${include_self}"
        exclude_users_which_never_logged_in: "${exclude_never_logged_in}"
        sort: "${sort}"
        offset: "${offset}"
        limit: "${limit}"
    input:
      query:
        type: string
        description: Search text matched against user names.
        optional: true
      group_ids:
        type: string
        description: Comma-separated group ids; returns users in any of them.
        optional: true
      org_unit_ids:
        type: string
        description: Comma-separated org unit ids; returns users under any of them.
        optional: true
      include_bots:
        type: boolean
        description: Include bot accounts. Defaults to true.
        optional: true
      include_self:
        type: boolean
        description: Include the authenticated user in the results.
        optional: true
      exclude_never_logged_in:
        type: boolean
        description: Leave out users who have never signed in -- the un-onboarded.
        optional: true
      sort:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      offset:
        type: integer
        description: Offset to start from, for paging.
        optional: true
        minimum: 0
      limit:
        type: integer
        description: Users per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
    output:
      description: A page of users.
      type: array
      items: {type: object}

  get_user:
    title: Get a user
    description: >-
      Read one user's administrative record -- role, contact details, custom
      fields and suspension state.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/${user_id}
      query:
        context: "${context}"
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
      context:
        type: string
        description: Only return custom fields belonging to this context.
        optional: true
    output:
      description: The user.
      type: object

  get_user_by_email:
    title: Get a user by email
    description: >-
      Look a user up by email address -- the usual way to turn an address from
      another system into a Beekeeper user id.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/by_email/${email}
    input:
      email:
        type: string
        description: The user's email address.
        format: email
    output:
      description: The matching user.
      type: object

  get_user_by_name:
    title: Get a user by username
    description: Look a user up by their Beekeeper username.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/by_name/${name}
    input:
      name:
        type: string
        description: The user's username.
    output:
      description: The matching user.
      type: object

  get_user_by_tenant_user_id:
    title: Get a user by your own user id
    description: >-
      Look a user up by the external id your HR system set on them
      (`tenantuserid`), which is how a sync keeps identities aligned.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/by_tenant_user_id/${tenant_user_id}
    input:
      tenant_user_id:
        type: string
        description: The external user id stored on the Beekeeper user.
    output:
      description: The matching user.
      type: object

  create_user:
    title: Create a user
    description: >-
      Create a Beekeeper user. `role` decides their rights, `custom_fields`
      carries profile data, and `tenantuserid` should hold your own system's
      id so later syncs can find them. Creating the user does not notify them
      -- send_login_instructions does.
    category: users
    request:
      method: POST
      path: /users
      body:
        name: "${name}"
        email: "${email}"
        mobile: "${mobile}"
        language: "${language}"
        role: "${role}"
        tenantuserid: "${tenant_user_id}"
        suspended: "${suspended}"
        custom_fields: "${custom_fields}"
    input:
      name:
        type: string
        description: The user's username.
        optional: true
      email:
        type: string
        description: Email address; must be unique across the tenant.
        optional: true
        format: email
      mobile:
        type: string
        description: Mobile number in E.164 form; must be unique across the tenant.
        optional: true
      language:
        type: string
        description: Preferred language code, e.g. "en".
        optional: true
      role:
        type: string
        description: The user's role, which decides their permissions.
        optional: true
        enum: [member, admin]
      tenant_user_id:
        type: string
        description: Your own id for this person, kept on the Beekeeper record.
        optional: true
      suspended:
        type: boolean
        description: Create the user suspended, unable to sign in.
        optional: true
      custom_fields:
        type: array
        description: 'Profile field values, each {"key": ..., "value": ...}.'
        optional: true
        items: {type: object}
    output:
      description: The created user.
      type: object

  update_user:
    title: Update a user
    description: >-
      Change a user's details, role, org units or custom fields. Setting
      `suspended` to true locks them out immediately without deleting their
      content.
    category: users
    request:
      method: PUT
      path: /users/${user_id}
      body:
        name: "${name}"
        email: "${email}"
        mobile: "${mobile}"
        language: "${language}"
        role: "${role}"
        suspended: "${suspended}"
        timezone: "${timezone}"
        tenantuserid: "${tenant_user_id}"
        org_unit_ids: "${org_unit_ids}"
        custom_fields: "${custom_fields}"
        review_status: "${review_status}"
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
      name:
        type: string
        description: New username.
        optional: true
      email:
        type: string
        description: New email address.
        optional: true
        format: email
      mobile:
        type: string
        description: New mobile number, E.164 form.
        optional: true
      language:
        type: string
        description: Preferred language code.
        optional: true
      role:
        type: string
        description: New role.
        optional: true
        enum: [member, admin]
      suspended:
        type: boolean
        description: True locks the user out; false lets them back in.
        optional: true
      timezone:
        type: string
        description: The user's timezone.
        optional: true
      tenant_user_id:
        type: string
        description: Your own id for this person.
        optional: true
      org_unit_ids:
        type: array
        description: The complete list of org units the user belongs to after the update.
        optional: true
        items: {type: string}
      custom_fields:
        type: array
        description: 'Profile field values to set, each {"key": ..., "value": ...}.'
        optional: true
        items: {type: object}
      review_status:
        type: string
        description: Moderation state of the user's profile.
        optional: true
        enum: [pending, approved, rejected]
    output:
      description: The updated user.
      type: object

  delete_user:
    title: Delete a user
    description: >-
      Delete a user account. Suspending with update_user is almost always the
      better move: deletion is permanent and takes their identity with it.
    category: users
    destructive: true
    request:
      method: DELETE
      path: /users/${user_id}
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
    output:
      description: Confirmation that the user was deleted.
      type: object

  send_login_instructions:
    title: Send a user their login instructions
    description: >-
      Email or text a user how to sign in, optionally with a set password and a
      custom message. This reaches a real person -- do not use it to test.
    category: users
    request:
      method: POST
      path: /users/${user_id}/send_instructions
      body:
        custom_message: "${custom_message}"
        password: "${password}"
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
      custom_message:
        type: string
        description: Extra text included in the message.
        optional: true
      password:
        type: string
        description: Password to set and send. Must meet the tenant's complexity rules.
        optional: true
        secret: true
    output:
      description: Confirmation that the instructions were sent.
      type: object

  list_profiles:
    title: List profiles
    description: >-
      Read the colleague-facing profiles -- what people see of each other,
      rather than the administrative user record. `q` searches names and does
      not need admin rights.
    category: users
    read_only: true
    request:
      method: GET
      path: /profiles
      query:
        q: "${query}"
        user_ids: "${user_ids}"
        include_custom_fields: "${include_custom_fields}"
        include_suspended: "${include_suspended}"
        include_bots: "${include_bots}"
        limit: "${limit}"
        offset: "${offset}"
    input:
      query:
        type: string
        description: Search text matched against profile names.
        optional: true
      user_ids:
        type: string
        description: Comma-separated user ids to fetch specifically.
        optional: true
      include_custom_fields:
        type: boolean
        description: Include custom profile fields in the response.
        optional: true
      include_suspended:
        type: boolean
        description: Include suspended users.
        optional: true
      include_bots:
        type: boolean
        description: Include bot accounts.
        optional: true
      limit:
        type: integer
        description: Profiles per page.
        optional: true
        minimum: 1
      offset:
        type: integer
        description: Offset to start from.
        optional: true
        minimum: 0
    output:
      description: A page of profiles.
      type: array
      items: {type: object}

  get_profile:
    title: Get a profile
    description: >-
      Read one person's profile as colleagues see it, optionally with their
      post, comment and like totals.
    category: users
    read_only: true
    request:
      method: GET
      path: /profiles/${user_id}
      query:
        context: "${context}"
        include_totals: "${include_totals}"
        include_activities: "${include_activities}"
    input:
      user_id:
        type: string
        description: The person's username or Beekeeper id.
      context:
        type: string
        description: Only return custom fields belonging to this context.
        optional: true
      include_totals:
        type: boolean
        description: Include their post, comment and like counts.
        optional: true
      include_activities:
        type: boolean
        description: Include their recent activity. Defaults to true.
        optional: true
    output:
      description: The profile.
      type: object

  suggest_mentions:
    title: Suggest people to mention
    description: >-
      Read the mention suggestions Beekeeper's own composer would offer, so an
      @-mention resolves to someone who actually exists and is visible to the
      caller.
    category: users
    read_only: true
    request:
      method: GET
      path: /profiles/suggest
    input: {}
    output:
      description: Suggested profiles for mentions.
      type: array
      items: {type: object}

  get_reminders:
    title: Get birthday and anniversary reminders
    description: >-
      Read upcoming birthdays and work anniversaries, which is the input to an
      automated congratulations post. The date fields are custom profile
      fields, so name them with `birthday_field` and `hire_date_field`.
    category: users
    read_only: true
    request:
      method: GET
      path: /reminders
      query:
        reminder_days_after: "${days_ahead}"
        birthday_field: "${birthday_field}"
        hire_date_field: "${hire_date_field}"
        group_id: "${group_id}"
    input:
      days_ahead:
        type: integer
        description: How many days ahead to look, up to 30.
        optional: true
        minimum: 1
        maximum: 30
      birthday_field:
        type: string
        description: Custom profile field key holding the birthday, e.g. "birthday".
        optional: true
      hire_date_field:
        type: string
        description: Custom profile field key holding the hire date, e.g. "hire_date".
        optional: true
      group_id:
        type: integer
        description: Only people in this group.
        optional: true
    output:
      description: The upcoming reminders.
      type: object

  # -- groups, org units, custom fields ------------------------------------

  list_groups:
    title: List groups
    description: >-
      Read the tenant's groups and teams, with member counts. Group ids are
      what stream permissions and user memberships take.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups
      query:
        only_my_groups: "${only_my_groups}"
        type: "${type}"
        include_member_count: "${include_member_count}"
        org_unit_id: "${org_unit_id}"
        q: "${query}"
        orderby: "${order_by}"
        sort: "${sort}"
        offset: "${offset}"
        limit: "${limit}"
    input:
      only_my_groups:
        type: boolean
        description: Only groups the authenticated user belongs to.
        optional: true
      type:
        type: string
        description: Only groups of this kind.
        optional: true
        enum: [GROUP, TEAM]
      include_member_count:
        type: boolean
        description: Include each group's member count.
        optional: true
      org_unit_id:
        type: string
        description: Only groups in this org unit.
        optional: true
      query:
        type: string
        description: Search text matched against group names.
        optional: true
      order_by:
        type: string
        description: Field to order by. Defaults to name.
        optional: true
        enum: [name, created]
      sort:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      offset:
        type: integer
        description: Offset to start from.
        optional: true
        minimum: 0
      limit:
        type: integer
        description: Groups per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
    output:
      description: A page of groups.
      type: array
      items: {type: object}

  get_group:
    title: Get a group
    description: Read one group -- its name, type, org unit and member count.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups/${group_id}
    input:
      group_id:
        type: integer
        description: The group's id.
    output:
      description: The group.
      type: object

  create_group:
    title: Create a group
    description: >-
      Create a group or team. Groups are the unit stream permissions are
      granted to, so this is usually the first step in giving a set of people
      access to something.
    category: groups
    request:
      method: POST
      path: /groups
      body:
        name: "${name}"
        type: "${type}"
        org_unit_id: "${org_unit_id}"
    input:
      name:
        type: string
        description: The group's name.
      type:
        type: string
        description: Whether to create a group or a team.
        optional: true
        enum: [GROUP, TEAM]
      org_unit_id:
        type: string
        description: Org unit the group belongs to. Defaults to the global unit.
        optional: true
    output:
      description: The created group.
      type: object

  update_group:
    title: Update a group
    description: Rename a group or move it to another org unit.
    category: groups
    request:
      method: PUT
      path: /groups/${group_id}
      body:
        name: "${name}"
        org_unit_id: "${org_unit_id}"
    input:
      group_id:
        type: integer
        description: The group's id.
      name:
        type: string
        description: New group name.
        optional: true
      org_unit_id:
        type: string
        description: Move the group to this org unit.
        optional: true
    output:
      description: The updated group.
      type: object

  delete_group:
    title: Delete a group
    description: >-
      Delete a group. Its members keep their accounts, but any stream
      permission granted through the group is lost -- check
      list_stream_groups first.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /groups/${group_id}
    input:
      group_id:
        type: integer
        description: The group's id.
    output:
      description: Confirmation that the group was deleted.
      type: object

  list_group_members:
    title: List a group's members
    description: >-
      Read who is in a group, with whether each is a group admin. Paginated up
      to 500 at a time.
    category: groups
    read_only: true
    request:
      method: GET
      path: /groups/${group_id}/members
      query:
        is_group_admin: "${is_group_admin}"
        is_bot: "${is_bot}"
        orderby: "${order_by}"
        sort: "${sort}"
        offset: "${offset}"
        limit: "${limit}"
    input:
      group_id:
        type: integer
        description: The group's id.
      is_group_admin:
        type: boolean
        description: Only group admins, or only non-admins.
        optional: true
      is_bot:
        type: boolean
        description: Only bots, or only real people.
        optional: true
      order_by:
        type: string
        description: Field to order by. Defaults to display name.
        optional: true
      sort:
        type: string
        description: Sort direction.
        optional: true
        enum: [asc, desc]
      offset:
        type: integer
        description: Offset to start from.
        optional: true
        minimum: 0
      limit:
        type: integer
        description: Members per page, up to 500.
        optional: true
        minimum: 1
        maximum: 500
    output:
      description: A page of group members.
      type: array
      items: {type: object}

  add_group_members:
    title: Add users to a group
    description: >-
      Put one or more users in a group, which also gives them whatever stream
      access the group carries.
    category: groups
    request:
      method: POST
      path: /groups/${group_id}/members
      body:
        userid: "${user_id}"
        username: "${username}"
        user_ids: "${user_ids}"
    input:
      group_id:
        type: integer
        description: The group's id.
      user_id:
        type: string
        description: A single user id to add.
        optional: true
      username:
        type: string
        description: A single username to add.
        optional: true
      user_ids:
        type: array
        description: Several user ids to add at once.
        optional: true
        items: {type: string}
    output:
      description: The group membership after the change.
      type: object

  remove_group_member:
    title: Remove a user from a group
    description: >-
      Take one user out of a group. They lose any stream access the group
      granted, so check whether they reach it another way before assuming they
      still can.
    category: groups
    destructive: true
    request:
      method: DELETE
      path: /groups/${group_id}/members/${user_id}
    input:
      group_id:
        type: integer
        description: The group's id.
      user_id:
        type: string
        description: The user's Beekeeper id.
    output:
      description: Confirmation that the member was removed.
      type: object

  list_user_groups:
    title: List a user's groups
    description: Read which groups one user belongs to -- the per-person view of group membership.
    category: groups
    read_only: true
    request:
      method: GET
      path: /users/${user_id}/groups
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
    output:
      description: The groups the user belongs to.
      type: array
      items: {type: object}

  set_user_groups:
    title: Set which groups a user belongs to
    description: >-
      Replace a user's group memberships wholesale with the ids given. Anything
      omitted is removed, so read list_user_groups first.
    category: groups
    request:
      method: PUT
      path: /users/${user_id}/groups
      body:
        groups: "${group_ids}"
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
      group_ids:
        type: array
        description: The complete set of group ids the user should belong to.
        items: {type: integer}
    output:
      description: The user's groups after the change.
      type: object

  list_user_permissions:
    title: List a user's permissions
    description: >-
      Read the group and stream permissions one user actually has -- the
      resolved answer to "can this person see that stream".
    category: users
    read_only: true
    request:
      method: GET
      path: /users/${user_id}/permissions
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
    output:
      description: The user's group and stream permissions.
      type: object

  list_user_streams:
    title: List the streams a user can reach
    description: Read which streams one user has access to, however that access was granted.
    category: users
    read_only: true
    request:
      method: GET
      path: /users/${user_id}/streams
    input:
      user_id:
        type: string
        description: The user's Beekeeper id.
    output:
      description: The streams the user can reach.
      type: array
      items: {type: object}

  list_org_units:
    title: List organizational units
    description: >-
      Read the tenant's org unit tree from the root -- locations and
      departments -- which is how users and stream permissions are scoped
      geographically.
    category: org_units
    read_only: true
    request:
      method: GET
      path: /orgunits
      query:
        expand: "${expand}"
        include_member_count: "${include_member_count}"
    input:
      expand:
        type: boolean
        description: Return the whole subtree rather than just the root unit.
      include_member_count:
        type: boolean
        description: Include each unit's member count.
    output:
      description: The org unit tree.
      type: object

  list_org_unit_members:
    title: List an org unit's members
    description: Read the users assigned to one organizational unit.
    category: org_units
    read_only: true
    request:
      method: GET
      path: /orgunits/${org_unit_id}/members
    input:
      org_unit_id:
        type: string
        description: The org unit's id, from list_org_units.
    output:
      description: The unit's members.
      type: array
      items: {type: object}

  list_custom_fields:
    title: List custom profile fields
    description: >-
      Read the tenant's custom profile fields with their keys, types and
      visibility. The keys are what a user's `custom_fields` entries use.
    category: metadata
    read_only: true
    request:
      method: GET
      path: /customfields
      query:
        types: "${types}"
    input:
      types:
        type: string
        description: Comma-separated field types to include.
        optional: true
    output:
      description: The tenant's custom fields.
      type: array
      items: {type: object}
