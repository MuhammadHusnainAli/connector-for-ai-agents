# Connector definitions: TWO_STEP auth.
#
# Auth mode, credential/config fields, api base url and verification endpoint
# for each connector, sorted by connector id. One file per auth mode; the
# registry loads every *.yaml under this directory and merges them.
#
# Machine-generated grouping -- run `python scripts/split_connectors.py` after
# changing an `auth_mode` so the entry lands in the right file.
3cx:
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - communication
  connection_config:
    domain:
      description: Your 3CX instance domain
      example: mycompany.3cx.us
      format: hostname
      order: 1
      prefix: https://
      title: 3CX Domain
      type: string
  credentials:
    clientId:
      description: The Client ID from your 3CX API integration
      title: Client ID
      type: string
    clientSecret:
      description: The API Key generated when creating your 3CX API integration
      secret: true
      title: API Key
      type: string
  display_name: 3CX
  proxy:
    base_url: https://${connectionConfig.domain}/xapi
  token_expires_in_ms: 3600000
  token_headers:
    accept: application/json
    content-type: application/x-www-form-urlencoded
  token_params:
    client_id: ${credentials.clientId}
    client_secret: ${credentials.clientSecret}
    grant_type: client_credentials
  token_response:
    token: access_token
  token_url: https://${connectionConfig.domain}/connect/token
agencyzoom:
  auth_mode: TWO_STEP
  body_format: json
  categories:
  - crm
  credentials:
    password:
      description: Your AgencyZoom account password.
      doc_section: '#step-1-obtain-your-credentials'
      secret: true
      title: Password
      type: string
    username:
      description: Your AgencyZoom account email address.
      doc_section: '#step-1-obtain-your-credentials'
      title: Username
      type: string
  display_name: AgencyZoom
  docs: https://nango.dev/docs/api-integrations/agencyzoom
  docs_connect: https://nango.dev/docs/api-integrations/agencyzoom/connect
  proxy:
    base_url: https://api.agencyzoom.com
  token_headers:
    accept: application/json
    content-type: application/json
  token_params:
    password: ${credentials.password}
    username: ${credentials.username}
  token_response:
    token: jwt
  token_url: https://api.agencyzoom.com/v1/api/auth/login
altrata:
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - analytics
  connection_config:
    hostname:
      description: The Altrata service hostname to connect to.
      example: events.altrata.com
      format: hostname
      order: 1
      pattern: ^(matching|profile|events|relationships)\.altrata\.com$
      title: Service Hostname
      type: string
  credentials:
    apiKey:
      description: Your Altrata API key.
      example: mN3pQv8wLc2jXs5rKt4bGy6uFd1eAh7Z*******
      pattern: ^[A-Za-z0-9]+$
      secret: true
      title: API Key
      type: string
    password:
      description: Your Altrata account password.
      secret: true
      title: Password
      type: string
    username:
      description: Your Altrata account username.
      example: john_doe
      title: Username
      type: string
  display_name: Altrata
  proxy:
    base_url: https://${connectionConfig.hostname}
    headers:
      x-api-key: ${credentials.apiKey}
  token_headers:
    authorization: Basic ${base64(${credentials.username}:${credentials.password})}
    x-api-key: ${credentials.apiKey}
  token_response:
    token: access_token
    token_expiration: expires_in
    token_expiration_strategy: expireIn
  token_url: https://api-auth.altrata.com/oauth2/token?grant_type=client_credentials
apple-business-manager:
  assertion:
    header:
      alg: ES256
      kid: ${credentials.keyId}
    key: ${assertionOption.privateKey}
    lifetimeInSeconds: 15552000
    payload:
      aud: https://account.apple.com/auth/oauth2/v2/token
      iss: ${credentials.clientId}
      jti: ${random}
      sub: ${credentials.clientId}
    type: jwt
  assertion_option:
    privateKey:
      description: The EC private key (PEM format) used to sign the client assertion JWT.
      title: Private Key
      type: string
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - productivity
  credentials:
    assertion:
      automated: true
      description: ''
      title: ''
      type: string
    clientId:
      description: The Client ID generated when you create an API account.
      title: Client ID
      type: string
    keyId:
      description: The Key ID generated when you create an API account.
      title: Key ID
      type: string
  display_name: Apple Business Manager
  proxy:
    base_url: https://api-business.apple.com
  token_headers:
    content-type: application/x-www-form-urlencoded
  token_params:
    client_assertion: ${credentials.assertion}
    client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    client_id: ${credentials.clientId}
    grant_type: client_credentials
    scope: business.api
  token_response:
    token: access_token
    token_expiration: expires_in
    token_expiration_strategy: expireIn
  token_url: https://account.apple.com/auth/oauth2/v2/token
aspire:
  auth_mode: TWO_STEP
  body_format: json
  categories:
  - erp
  connection_config:
    domain:
      description: The Aspire API environment to connect to.
      enum:
      - cloudsandbox-api.youraspire.com
      - cloud-api.youraspire.com
      format: hostname
      order: 1
      title: Environment
      type: string
  credentials:
    clientId:
      description: The Client ID generated for your Aspire application.
      example: 3f2a91c6-****-****-****-6d5e8a2b7c34
      format: uuid
      title: Client ID
      type: string
    secret:
      description: The Secret generated alongside the Client ID.
      example: 7hLp************************nHa5
      pattern: ^[a-zA-Z0-9]{32}$
      secret: true
      title: Secret
      type: string
  display_name: Aspire
  proxy:
    base_url: https://${connectionConfig.domain}
  refresh_token_params:
    RefreshToken: ${refresh_token}
  refresh_url: https://${connectionConfig.domain}/Authorization/RefreshToken
  token_headers:
    accept: application/json
    content-type: application/json
  token_params:
    ClientId: ${credentials.clientId}
    Secret: ${credentials.secret}
  token_response:
    refresh_token: RefreshToken
    token: Token
  token_url: https://${connectionConfig.domain}/Authorization
avanan:
  auth_mode: TWO_STEP
  categories:
  - other
  connection_config:
    subdomain:
      description: The Avanan API subdomain for your region.
      enum:
      - smart-api-production-1-us
      - smart-api-production-1-eu
      - smart-api-production-1-ca
      - smart-api-production-5-ap
      - smart-api-production-1-euw2
      - smart-api-production-1-mec1
      - smart-api-production-1-aps1
      order: 1
      title: Subdomain
      type: string
  credentials:
    appId:
      description: Your Avanan Client ID from Avanan Support.
      example: 9k8m****************ht3w
      pattern: ^[a-z0-9]+$
      title: Client ID
      type: string
    secretKey:
      description: Your Avanan Secret Key from Avanan Support.
      example: 3k9t****************************0uj5gtrpqlz8x2nvy
      pattern: ^[a-z0-9]+$
      secret: true
      title: Secret Key
      type: string
  display_name: Avanan
  proxy:
    base_url: https://${connectionConfig.subdomain}.avanan.net
    headers:
      x-av-app-id: ${credentials.appId}
      x-av-date: ${now:YYYY-MM-DDTHH:mm:ss}
      x-av-req-id: ${random}
      x-av-sig: ${sha256Hex(${base64(${random}${credentials.appId}${now:YYYY-MM-DDTHH:mm:ss}${endpoint}${credentials.secretKey})})}
      x-av-token: ${accessToken}
  token_expires_in_ms: 3600000
  token_headers:
    x-av-app-id: ${credentials.appId}
    x-av-date: ${now:YYYY-MM-DDTHH:mm:ss}
    x-av-req-id: ${random}
    x-av-sig: ${sha256Hex(${base64(${random}${credentials.appId}${now:YYYY-MM-DDTHH:mm:ss}${credentials.secretKey})})}
  token_request_method: GET
  token_response:
    token: ''
  token_url: https://${connectionConfig.subdomain}.avanan.net/v1.0/auth
breezy-hr:
  auth_mode: TWO_STEP
  body_format: json
  categories:
  - hr
  - ats
  credentials:
    email:
      description: The email address associated with your Breezy HR account
      format: email
      title: Email
      type: string
    password:
      description: The password for your Breezy HR account
      secret: true
      title: Password
      type: string
  display_name: Breezy HR
  proxy:
    base_url: https://api.breezy.hr
    headers:
      authorization: ${accessToken}
    retry:
      at:
      - x-ratelimit-reset
  token_headers:
    content-type: application/json
  token_params:
    email: ${credentials.email}
    password: ${credentials.password}
  token_response:
    token: access_token
  token_url: https://api.breezy.hr/v3/signin
datto-rmm-password-grant:
  auth_mode: TWO_STEP
  body_format: form
  categories:
  - support
  connection_config:
    platform:
      description: The Datto RMM platform (region) for your account.
      enum:
      - pinotage
      - merlot
      - concord
      - vidal
      - zinfandel
      - syrah
      order: 1
      title: Platform
      type: string
  credentials:
    default_password:
      default_value: public
      description: ''
      hidden: true
      title: ''
      type: string
    default_username:
      default_value: public-client
      description: ''
      hidden: true
      title: ''
      type: string
    password:
      description: Your Datto RMM Secret Key
      example: 9XQ7MZB4H1L2WKC0RDFTPY5J8VUNSG3E
      pattern: ^[A-Z0-9]{32}$
      title: API Secret Key
