    request:
      method: GET
      path: /v3/public/domain-rating-top-domains
      query:
        from: ${from}
        to: ${to}
    input:
      from:
        type: integer
        description: Rank position to start from.
        optional: true
      to:
        type: integer
        description: Rank position to end at.
        optional: true
    output:
      description: Domains in rank order.
      type: array
      items:
        type: object
      response_path: domains
