        optional: true
        enum:
        - date
        - views
        - unique_views
        - comments
        - likes
      order_direction:
        type: string
        description: The order in which results are returned, ascending or descending.
        optional: true
        enum:
        - asc
        - desc
      limit:
        type: integer
        description: The number of results to return.
        optional: true
      offset:
        type: integer
        description: The number of results to skip.
