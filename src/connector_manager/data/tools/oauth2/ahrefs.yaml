        description: At least one of brand, competitors or market is required to be non-empty.
        optional: true
        items:
          type: string
      market:
        type: array
        description: A list of the niche markets of your brands. Deprecated on 2026-05-18,
          this parameter will have no effect shortly after this date.
        optional: true
        items:
          type: string
      name:
        type: string
        description: The name of the report.
        optional: true
