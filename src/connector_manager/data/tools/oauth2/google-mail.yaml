      method does not send a message. Note that the maximum size of the message is 150 MB.
    category: users
    request:
      method: POST
      path: /gmail/v1/users/${user_id}/messages/import
      query:
        deleted: ${deleted}
        internalDateSource: ${internal_date_source}
        neverMarkSpam: ${never_mark_spam}
        processForCalendar: ${process_for_calendar}
      body:
        classificationLabelValues: ${classification_label_values}
        threadId: ${thread_id}
        snippet: ${snippet}
        labelIds: ${label_ids}
        internalDate: ${internal_date}
        historyId: ${history_id}
        sizeEstimate: ${size_estimate}
        raw: ${raw}
        payload: ${payload}
    input:
      user_id:
        type: string
        description: The user's email address. The special value me can be used to indicate the authenticated
          user.
      deleted:
        type: boolean
        description: Mark the email as permanently deleted (not TRASH) and only visible in Google Vault
          to a Vault administrator. Only used for Google Workspace accounts.
        optional: true
        default: false
      internal_date_source:
        type: string
        description: Source for Gmail's internal date of the message.
        optional: true
        default: dateHeader
